<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link-preview card in the site's classical-university style. Rendered by scripts/make-icons.ts
       with the fonts in brand/fonts (EB Garamond for headings, Source Serif 4 for text). -->
  <rect width="1200" height="630" fill="#f7f3ea"/>
  <!-- double rule frame -->
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#7b1e2b" stroke-width="4"/>
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#a07f35" stroke-width="1.5"/>

  <!-- seal -->
  <g transform="translate(968 315) scale(0.86)" fill="none">
    <circle r="190" stroke="#1e1b16" stroke-width="5"/>
    <circle r="168" stroke="#1e1b16" stroke-width="2"/>
    <circle r="108" stroke="#7b1e2b" stroke-width="20"/>
    <circle r="67" stroke="#7b1e2b" stroke-width="7" stroke-opacity="0.7"/>
    <circle r="29" fill="#7b1e2b"/>
    <g fill="#a07f35">
      <circle cy="-179" r="7"/><circle cx="179" r="7"/><circle cy="179" r="7"/><circle cx="-179" r="7"/>
    </g>
  </g>

  <g font-family="EB Garamond" font-weight="600">
    <text x="92" y="132" fill="#7a5f1e" font-size="22" letter-spacing="3.5">FREE · OPEN · BASED ON MIT OPENCOURSEWARE</text>
    <text x="88" y="250" fill="#7b1e2b" font-size="90">Open Cosmology</text>
  </g>
  <!-- gold ornament rule -->
  <g transform="translate(92 292)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#a07f35" stroke-width="2"/>
    <rect x="262" y="-7" width="10" height="10" transform="rotate(45 267 -2)" fill="#a07f35"/>
    <line x1="284" y1="0" x2="534" y2="0" stroke="#a07f35" stroke-width="2"/>
  </g>
  <g font-family="Source Serif 4" fill="#4a443b" font-size="34">
    <text x="92" y="360">A free five-year university course,</text>
    <text x="92" y="406">from vectors to the Big Bang.</text>
  </g>
  <text x="92" y="478" font-family="EB Garamond" font-weight="500" font-size="30" fill="#1c3a6e" letter-spacing="1">Year I · Year II · Year III · Year IV · Year V</text>
  <text x="92" y="552" font-family="Source Serif 4" font-size="20" fill="#665d4f">Rewritten from MIT OCW · CC BY-NC-SA 4.0 · Not endorsed by MIT</text>
</svg>
