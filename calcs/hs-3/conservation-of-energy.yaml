# Calculations on content/year-0/hs-3/conservation-of-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 22.5 Conservation of mechanical energy (mit); 22.4 Mechanical energy (reading1);
# MIT 8.01SC Course Notes Ch. 14 (reading2).
# All numbers are the page's own: none of Siyavula's (0.15 kg ball with 20 J at 2 m, 1 kg suitcase from 2 m, 100 kg tree trunk
# down a 5 m waterfall, 2 kg pendulum through 0.5 m, 850 kg roller coaster at 50 m and 20 m, water bottle 100 m / 10 m,
# exercise values) or MIT's are reused. g = 9.81 m/s², written ga in the inputs (g alone would be the gram).

page: content/year-0/hs-3/conservation-of-energy.mdx
calcs:
  # --- Quiz ---
  - id: quiz-ep
    where: 'quiz 1: E_p = 0.50 × 9.81 × 4.0 = 19.6 J'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, h: 4.0 m}
    formula: m * ga * h
    expected: 19.6 J
    shown: ['$E_p = m g h = 0.50 \\times 9.81 \\times 4.0 = 19.6$ J']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN), E_M = mgh + ½mv² (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ek
    where: 'quiz 1: E_k = ½ × 0.50 × 6.0² = 9.0 J'
    inputs: {m: 0.50 kg, v: 6.0 m/s}
    formula: m * v**2 / 2
    expected: 9.0 J
    shown: ['$E_k = \\tfrac{1}{2} \\times 0.50 \\times 6.0^{2} = 9.0$ J']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN), E_M = mgh + ½mv² (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-emech
    where: 'quiz 1: E_mech = 19.6 + 9.0 = 28.6 J'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, h: 4.0 m, v: 6.0 m/s}
    formula: m * ga * h + m * v**2 / 2
    expected: 28.6 J
    shown: ['$E_{\\text{mech}} = 19.6 + 9.0 = 28.6$ J']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN), E_M = E_P + E_K (the numbers are the page''s own)'}
    origin: page-own
    quiz: 0

  - id: quiz-emech-diff
    where: 'quiz 1, wrong choice: 19.6 − 9.0 = 10.6 J (difference, not sum)'
    inputs: {a: 19.6 J, b: 9.0 J}
    formula: a - b
    expected: 10.6 J
    shown: ['10.6 J is their difference']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-buffer-ek
    where: 'quiz 3: ½ × 2.0 × 1.5² = 2.25 J'
    inputs: {m: 2.0 kg, v: 1.5 m/s}
    formula: m * v**2 / 2
    expected: 2.25 J
    shown: ['$\\tfrac{1}{2} \\times 2.0 \\times 1.5^{2} = 2.25$ J']
    source: {cite: reading2, at: 'Sec. 14.5, Eq. (14.18) with Sec. 14.4.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-buffer-x
    where: 'quiz 3: x = √(2 × 2.25 / 800) = 0.075 m'
    inputs: {e: 2.25 J, k: 800 N/m}
    formula: sqrt(2 * e / k)
    expected: 0.075 m
    shown: ['$x = \\sqrt{2 \\times 2.25 / 800} = 0.075$ m']
    source: {cite: reading2, at: 'Sec. 14.4.2, Eq. (14.12), and Sec. 14.5, Eq. (14.18) (the numbers are the page''s own)'}
    origin: page-own
    quiz: 2

  - id: quiz-buffer-noroot
    where: 'quiz 3, wrong choice: 2 × 2.25 / 800 = 0.0056 (square root forgotten)'
    inputs: {e: 2.25 J, k: 800 N/m}
    formula: 2 * e / k
    expected: 0.0056 m**2
    shown: ['Forgetting the square root gives 0.0056 (in m²)']
    source: {cite: reading2, at: 'Sec. 14.4.2, Eq. (14.12) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-buffer-nohalf
    where: 'quiz 3, wrong choice: √(2.25 / 800) = 0.053 m (½ dropped on one side)'
    inputs: {e: 2.25 J, k: 800 N/m}
    formula: sqrt(e / k)
    expected: 0.053 m
    shown: ['dropping the ½ on one side only gives 0.053 m']
    source: {cite: reading2, at: 'Sec. 14.4.2, Eq. (14.12) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bounce-loss
    where: 'quiz 5: m g (2.0 − 1.4) = 0.060 × 9.81 × 0.60 = 0.35 J'
    inputs: {m: 0.060 kg, ga: 9.81 m/s**2, h1: 2.0 m, h2: 1.4 m}
    formula: m * ga * (h1 - h2)
    expected: 0.35 J
    shown: ['0.060 \\times 9.81 \\times 0.60 = 0.35$ J']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔK + ΔU = ΔE_m (the section''s Eqs. (14.6) and (14.7)) (the numbers are the page''s own)'}
    origin: page-own
    quiz: 4

  - id: quiz-bounce-start
    where: 'quiz 5: starting energy 0.060 × 9.81 × 2.0 = 1.2 J'
    inputs: {m: 0.060 kg, ga: 9.81 m/s**2, h: 2.0 m}
    formula: m * ga * h
    expected: 1.2 J
    shown: ['about 30% of the starting 1.2 J', '1.2 J the energy before it']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bounce-percent
    where: 'quiz 5: the loss is about 30% of the starting energy'
    inputs: {h1: 2.0 m, h2: 1.4 m}
    formula: 100 * (h1 - h2) / h1
    expected: '30'
    shown: ['about 30% of the starting']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔK + ΔU = ΔE_m (the section''s Eqs. (14.6) and (14.7)) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bounce-after
    where: 'quiz 5: energy left after the bounce 0.060 × 9.81 × 1.4 = 0.82 J'
    inputs: {m: 0.060 kg, ga: 9.81 m/s**2, h: 1.4 m}
    formula: m * ga * h
    expected: 0.82 J
    shown: ['0.82 J is the energy left after the bounce']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP) (the numbers are the page''s own)'}
    origin: page-own

  # --- Mechanical energy: drone ---
  - id: drone-ek
    where: 'worked example "A delivery drone": E_k = ½ × 1.2 × 8.0² = 38.4 J'
    inputs: {m: 1.2 kg, v: 8.0 m/s}
    formula: m * v**2 / 2
    expected: 38.4 J
    shown: ['$E_k = \tfrac{1}{2} m v^{2} = \tfrac{1}{2} \times 1.2 \times 8.0^{2} = 38.4$ J']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN), E_M = mgh + ½mv² (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-ep
    where: 'same: E_p = 1.2 × 9.81 × 25 = 294.3 J'
    inputs: {m: 1.2 kg, ga: 9.81 m/s**2, h: 25 m}
    formula: m * ga * h
    expected: 294.3 J
    shown: ['$E_p = m g h = 1.2 \times 9.81 \times 25 = 294.3$ J']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN), E_M = mgh + ½mv² (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-emech
    where: 'same: E_mech = 38.4 + 294.3 = 332.7 J, about 330 J'
    inputs: {a: 38.4 J, b: 294.3 J}
    formula: a + b
    expected: 332.7 J
    shown: ['$E_{\text{mech}} = 38.4 + 294.3 = 332.7$ J, about 330 J']
    source: {cite: reading1, at: 'Mechanical energy (ESAHN), E_M = E_P + E_K (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-fall-speed
    where: 'same, check: falling freely from rest through 25 m gives about 22 m/s'
    inputs: {ga: 9.81 m/s**2, h: 25 m}
    formula: sqrt(2 * ga * h)
    expected: 22 m/s
    shown: ['a drone would reach about 22 m/s']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP), mgh = ½mv² (the numbers are the page''s own)'}
    origin: page-own

  # --- Sledge ---
  - id: sledge-vsq
    where: 'worked example "A sledge": v_f² = 3.0² + 2 × 9.81 × 12 = 244.4 m²/s²'
    inputs: {vi: 3.0 m/s, ga: 9.81 m/s**2, h: 12 m}
    formula: vi**2 + 2 * ga * h
    expected: 244.4 m**2/s**2
    shown: ['= 3.0^{2} + 2 \times 9.81 \times 12 = 244.4$ m²/s²']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP), E_M1 = E_M2 (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-v
    where: 'same: v_f = √244.4 = 15.6 m/s'
    inputs: {vi: 3.0 m/s, ga: 9.81 m/s**2, h: 12 m}
    formula: sqrt(vi**2 + 2 * ga * h)
    expected: 15.6 m/s
    shown: ['$v_f = \sqrt{244.4} = 15.6$ m/s']
    source: {cite: reading2, at: 'Sec. 14.5.1, Eq. (14.25) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-from-rest
    where: 'same, check: from rest √(2 × 9.81 × 12) = 15.3 m/s'
    inputs: {ga: 9.81 m/s**2, h: 12 m}
    formula: sqrt(2 * ga * h)
    expected: 15.3 m/s
    shown: ['$\sqrt{2 \times 9.81 \times 12} = 15.3$ m/s']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-wrong-sum
    where: 'same, check: adding speeds, 3.0 + 15.3 = 18.3 m/s, would be far too much'
    inputs: {a: 3.0 m/s, b: 15.3 m/s}
    formula: a + b
    expected: 18.3 m/s
    shown: ['$3.0 + 15.3$ would be far too much']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP) (the numbers are the page''s own)'}
    origin: page-own

  # --- Falling ball and plot ---
  - id: drop-total
    where: 'section "Following the energy": E_p = 0.40 × 9.81 × 6.0 = 23.5 J'
    inputs: {m: 0.40 kg, ga: 9.81 m/s**2, h: 6.0 m}
    formula: m * ga * h
    expected: 23.5 J
    shown: ['$E_p = 0.40 \times 9.81 \times 6.0 = 23.5$ J', 'stays at 0.40 × 9.81 × 6.0 = 23.5 J']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP), maximum E_P at the top, maximum E_K at the bottom (the numbers are the page''s own)'}
    origin: page-own

  - id: drop-half
    where: 'same: halfway down, at 3.0 m, each part is 11.8 J'
    inputs: {m: 0.40 kg, ga: 9.81 m/s**2, h: 3.0 m}
    formula: m * ga * h
    expected: 11.8 J
    shown: ['at 3.0 m, each part is 11.8 J']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP), halfway down half kinetic and half potential (the numbers are the page''s own)'}
    origin: page-own

  # --- Swing ---
  - id: swing-v
    where: 'worked example "How fast is the swing?": v_f = √(2 × 9.81 × 0.80) = 3.96 m/s'
    inputs: {ga: 9.81 m/s**2, h: 0.80 m}
    formula: sqrt(2 * ga * h)
    expected: 3.96 m/s
    shown: ['$v_f = \sqrt{2 g h_i} = \sqrt{2 \times 9.81 \times 0.80} = 3.96$ m/s, about 4.0 m/s']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP), mgh₁ = ½mv₂² (the numbers are the page''s own)'}
    origin: page-own

  - id: swing-half-height
    where: 'same: at half the speed the seat is ¾ × 0.80 = 0.60 m above the lowest point'
    inputs: {h: 0.80 m}
    formula: 3 * h / 4
    expected: 0.60 m
    shown: ['$\tfrac{3}{4} \times 0.80 = 0.60$ m']
    source: {cite: reading2, at: 'Sec. 14.5.1, Eq. (14.25) (the numbers are the page''s own)'}
    origin: page-own

  - id: swing-half-check
    where: 'same, check: after a drop of 0.20 m, v = √(2 × 9.81 × 0.20) = 1.98 m/s, half of 3.96'
    inputs: {ga: 9.81 m/s**2, h: 0.20 m}
    formula: sqrt(2 * ga * h)
    expected: 1.98 m/s
    shown: ['$v = \sqrt{2 \times 9.81 \times 0.20} = 1.98$ m/s']
    source: {cite: reading2, at: 'Sec. 14.5.1, Eq. (14.25) (the numbers are the page''s own)'}
    origin: page-own

  # --- Spring launcher ---
  - id: launcher-energy
    where: 'worked example "A spring launcher": ½ × 400 × 0.050² = 0.50 J'
    inputs: {k: 400 N/m, x: 0.050 m}
    formula: k * x**2 / 2
    expected: 0.50 J
    shown: ['$E_{\text{el}} = \tfrac{1}{2} k x^{2} = \tfrac{1}{2} \times 400 \times 0.050^{2} = 0.50$ J']
    source: {cite: reading2, at: 'Sec. 14.4.2, Eq. (14.12) (the numbers are the page''s own)'}
    origin: page-own

  - id: launcher-speed
    where: 'same (a): v = √(2 × 0.50 / 0.020) = 7.1 m/s'
    inputs: {e: 0.50 J, m: 0.020 kg}
    formula: sqrt(2 * e / m)
    expected: 7.1 m/s
    shown: ['$v = \sqrt{2 \times 0.50 / 0.020} = 7.1$ m/s']
    source: {cite: reading2, at: 'Sec. 14.5, Eq. (14.18); Example 14.3 (starting energy ½kx²) (the numbers are the page''s own)'}
    origin: page-own

  - id: launcher-height
    where: 'same (b): h = 0.50 / (0.020 × 9.81) = 2.5 m'
    inputs: {e: 0.50 J, m: 0.020 kg, ga: 9.81 m/s**2}
    formula: e / (m * ga)
    expected: 2.5 m
    shown: ['$h = 0.50 / (0.020 \times 9.81) = 2.5$ m']
    source: {cite: reading2, at: 'Sec. 14.5, Eq. (14.18) with Sec. 14.4.1 and 14.4.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: launcher-stroke
    kind: fact
    where: 'same (b): the ball also rises by the 0.050 m of the spring''s stroke'
    value: 0.050 m
    shown: ['by the 0.050 m of the spring''s stroke']
    source: {cite: reading2, at: 'Sec. 14.4.2 (the compression is the page''s own example value)'}
    origin: page-own

  # --- Mass let go on a spring ---
  - id: hang-drop
    where: 'worked example "A mass let go on a spring": x = 2mg/k = 2 × 0.50 × 9.81 / 50 = 0.196 m'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, k: 50 N/m}
    formula: 2 * m * ga / k
    expected: 0.196 m
    shown: ['$x = 2 m g / k = 2 \times 0.50 \times 9.81 / 50 = 0.196$ m, about 0.20 m']
    source: {cite: reading2, at: 'Sec. 14.5, Eq. (14.18) with Sec. 14.4.1 and 14.4.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: hang-drop-solve
    where: 'same: solve −mgx + ½kx² = 0 for x > 0'
    inputs: {u: 1 m}
    formula: solve('-0.50*9.81*x + 50*x**2/2', 'x', 0.01, 1) * u
    expected: 0.196 m
    shown: ['$0 + m g\,(-x) + \tfrac{1}{2} k x^{2} = 0$']
    source: {cite: reading2, at: 'Sec. 14.5, Eq. (14.18) (the numbers are the page''s own)'}
    origin: page-own

  - id: hang-gravity
    where: 'same, check: gravity gives up 0.50 × 9.81 × 0.196 = 0.962 J'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, x: 0.1962 m}
    formula: m * ga * x
    expected: 0.962 J
    shown: ['$0.50 \times 9.81 \times 0.196 = 0.962$ J']
    source: {cite: reading2, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: hang-spring
    where: 'same, check: the spring holds ½ × 50 × 0.196² = 0.962 J'
    inputs: {k: 50 N/m, x: 0.1962 m}
    formula: k * x**2 / 2
    expected: 0.962 J
    shown: ['$\tfrac{1}{2} \times 50 \times 0.196^{2} = 0.962$ J']
    source: {cite: reading2, at: 'Sec. 14.4.2, Eq. (14.12) (the numbers are the page''s own)'}
    origin: page-own

  - id: hang-rest
    where: 'same, check: the stretch at rest mg/k = 0.098 m'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, k: 50 N/m}
    formula: m * ga / k
    expected: 0.098 m
    shown: ['$m g / k = 0.098$ m']
    source: {cite: reading2, at: 'Sec. 14.4.2, Hooke''s law F = −kx written just before Eq. (14.8), as in lesson 2.7 (the numbers are the page''s own)'}
    origin: page-own

  # --- Playground slide ---
  - id: slide-ep
    where: 'worked example "Down a playground slide": E_p = 25 × 9.81 × 2.5 = 613 J'
    inputs: {m: 25 kg, ga: 9.81 m/s**2, h: 2.5 m}
    formula: m * ga * h
    expected: 613 J
    shown: ['$E_p = m g h = 25 \times 9.81 \times 2.5 = 613$ J']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔK + ΔU = ΔE_m (the section''s Eqs. (14.6) and (14.7)) (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-ek
    where: 'same: E_k = ½ × 25 × 4.0² = 200 J'
    inputs: {m: 25 kg, v: 4.0 m/s}
    formula: m * v**2 / 2
    expected: 200 J
    shown: ['$E_k = \tfrac{1}{2} \times 25 \times 4.0^{2} = 200$ J']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔK + ΔU = ΔE_m (the section''s Eqs. (14.6) and (14.7)) (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-wnc
    where: 'same: W_nc = 200 − 613 = −413 J'
    inputs: {m: 25 kg, ga: 9.81 m/s**2, h: 2.5 m, v: 4.0 m/s}
    formula: m * v**2 / 2 - m * ga * h
    expected: -413 J
    shown: ['= 200 - 613 = -413$ J']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔK + ΔU = ΔE_m (the section''s Eqs. (14.6) and (14.7)) (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-fraction
    where: 'same: 413 J is roughly two thirds of the starting 613 J'
    inputs: {a: 413 J, b: 613 J}
    formula: a / b
    expected: '0.67'
    tolerance: 2%
    shown: ['roughly two thirds of the starting energy']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔK + ΔU = ΔE_m (the section''s Eqs. (14.6) and (14.7)) (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-friction
    where: 'same: F_f = 413 / 4.0 = 103 N, about 100 N'
    inputs: {w: 413.125 J, d: 4.0 m}
    formula: w / d
    expected: 103 N
    shown: ['$F_f = 413 / 4.0 = 103$ N, about 100 N']
    source: {cite: reading2, at: 'Sec. 14.7, W_nc = ΔE_m (the section''s Eq. (14.7)), with the work of friction −F_f Δx (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-no-friction
    where: 'same, check: without friction √(2 × 9.81 × 2.5) = 7.0 m/s'
    inputs: {ga: 9.81 m/s**2, h: 2.5 m}
    formula: sqrt(2 * ga * h)
    expected: 7.0 m/s
    shown: ['$\sqrt{2 \times 9.81 \times 2.5} = 7.0$ m/s']
    source: {cite: mit, at: 'Using the law of conservation of energy (ESAHP) (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-accounts
    where: 'same, check: 613 J = 200 J + 413 J'
    inputs: {a: 200 J, b: 413 J}
    formula: a + b
    expected: 613 J
    shown: ['613 J at the start = 200 J of motion + 413 J of heat']
    source: {cite: reading2, at: 'Sec. 14.7, Eq. (14.8): ΔE_system = ΔE_m − W_nc = 0 (the numbers are the page''s own)'}
    origin: page-own
