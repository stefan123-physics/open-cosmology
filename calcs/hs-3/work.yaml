# Calculations on content/year-0/hs-3/work.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 12, 5.2 Work (mit), incl. "Net work" (Approaches 1 and 2);
# MIT 8.01SC course notes Ch. 13 (reading1): Sec. 13.4 (constant forces, Eq. 13.4.3 units, Eq. 13.4.5 friction,
# Example 13.5 gravity), Sec. 13.5 (area under the force graph, Example 13.6 spring).
# All example numbers are the page's own (Siyavula's 500 N / 20 m car, 300 N / 25 m braking, 20 N / 5 m / 60° box,
# 300 N + 100 N friction over 20 m, 50 N pram, 2000 N lift, 60 kg student and MIT's 0.2 kg cup, 2.0 N, 0.5 m,
# μ_k = 0.10, 30° are not reused). g = 9.81 m/s², written ga (g alone is the gram).

page: content/year-0/hs-3/work.mdx
calcs:
  # --- Definition and the joule ---
  - id: apple-joule
    where: 'section "Force times displacement": lifting a 100 g apple 1.0 m takes about 1 J'
    inputs: {m: 0.10 kg, ga: 9.81 m/s**2, h: 1.0 m}
    formula: m * ga * h
    expected: 0.98 J
    shown: ['$0.10 \times 9.81 \times 1.0 \approx 1$ J']
    source: {cite: reading1, at: 'Sec. 13.4, Eq. (13.4.3) and Example 13.5 (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-work
    where: 'worked example "Pushing a trolley": W = 45 N × 12 m × cos 0° = 540 J'
    inputs: {f: 45 N, dx: 12 m}
    formula: f * dx * cos(0)
    expected: 540 J
    shown: ['$W = F\Delta x\cos\theta = 45 \times 12 \times 1 = 540$ J']
    source: {cite: mit, at: '5.2 Work, definition box (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-bag
    where: 'same, check: 45 N is the weight of a 4.6 kg bag'
    inputs: {f: 45 N, ga: 9.81 m/s**2}
    formula: f / ga
    expected: 4.6 kg
    shown: ['the weight of a 4.6 kg bag']
    source: {cite: mit, at: '5.2 Work (the numbers are the page''s own)'}
    origin: page-own

  # --- Sledge at an angle ---
  - id: sledge-fx
    where: 'vector diagram and worked example "Pulling a sledge": forward component 80 cos 35° = 65.5 N'
    inputs: {f: 80 N}
    formula: f * cos(35 * pi / 180)
    expected: 65.5 N
    shown: ['$F\cos\theta = 80 \times \cos 35° = 80 \times 0.819 = 65.5$ N', '65.5 N forwards along the motion']
    source: {cite: reading1, at: 'Sec. 13.8.2, Eq. (13.8.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-fy
    where: 'vector diagram and check: upward component 80 sin 35° = 45.9 N'
    inputs: {f: 80 N}
    formula: f * sin(35 * pi / 180)
    expected: 45.9 N
    shown: ['45.9 N upwards, at right angles to the motion', 'The upward component (45.9 N)']
    source: {cite: reading1, at: 'Sec. 13.8.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-work
    where: 'same: W = 80 × 15 × cos 35° ≈ 983 J'
    inputs: {f: 80 N, dx: 15 m}
    formula: f * dx * cos(35 * pi / 180)
    expected: 983 J
    shown: ['$W = F\Delta x\cos\theta = 80 \times 15 \times \cos 35° \approx 983$ J, about $9.8 \times 10^{2}$ J']
    source: {cite: mit, at: '5.2 Work, definition box and worked example 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-flat
    where: 'same, check: pulling along the ground, 80 × 15 = 1200 J'
    inputs: {f: 80 N, dx: 15 m}
    formula: f * dx
    expected: 1200 J
    shown: ['$80 \times 15 = 1200$ J']
    source: {cite: mit, at: '5.2 Work (the numbers are the page''s own)'}
    origin: page-own

  # --- Negative work: ball thrown up ---
  - id: ball-gravity-work
    where: 'section "Positive, negative and zero work": gravity on a 0.15 kg ball rising 4.0 m does −5.9 J'
    inputs: {m: 0.15 kg, ga: 9.81 m/s**2, dx: 4.0 m}
    formula: m * ga * dx * cos(pi)
    expected: -5.9 J
    shown: ['$W = -mg\,\Delta x = -0.15 \times 9.81 \times 4.0 \approx -5.9$ J', 'gravity does $+5.9$ J']
    source: {cite: reading1, at: 'Sec. 13.4, Example 13.5, Eq. (13.4.16) (the numbers are the page''s own)'}
    origin: page-own

  # --- Net work: box against friction ---
  - id: box-normal
    where: 'worked example "Pushing a box against friction": F_N = 20 × 9.81 = 196.2 N'
    inputs: {m: 20 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 196.2 N
    shown: ['$F_N = mg = 20 \times 9.81 = 196.2$ N']
    source: {cite: mit, at: 'Net work, worked examples 4 and 5 (the numbers are the page''s own)'}
    origin: page-own

  - id: box-friction
    where: 'same: F_f = 0.25 × 196.2 = 49.05 N, about 49 N'
    inputs: {mu: 0.25, m: 20 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 49.05 N
    shown: ['$F_f = \mu_k F_N = 0.25 \times 196.2 = 49.05$ N, about 49 N', 'equal to the friction (49.05 N)']
    source: {cite: reading1, at: 'Sec. 13.4, Eq. (13.4.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: box-push-work
    where: 'same: your push does 100 × 4.0 = 400 J'
    inputs: {f: 100 N, dx: 4.0 m}
    formula: f * dx * cos(0)
    expected: 400 J
    shown: ['$100 \times 4.0 \times \cos 0° = 400$ J']
    source: {cite: mit, at: 'Net work, Approach 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: box-friction-work
    where: 'same: friction does 49.05 × 4.0 × cos 180° ≈ −196 J'
    inputs: {f: 49.05 N, dx: 4.0 m}
    formula: f * dx * cos(pi)
    expected: -196 J
    shown: ['$49.05 \times 4.0 \times \cos 180° \approx -196$ J']
    source: {cite: reading1, at: 'Sec. 13.4, Eq. (13.4.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: box-net-1
    where: 'same, first way: 400 − 196 = 204 J'
    inputs: {mu: 0.25, m: 20 kg, ga: 9.81 m/s**2, f: 100 N, dx: 4.0 m}
    formula: f * dx - mu * m * ga * dx
    expected: 204 J
    shown: ['$W_{\text{net}} = 400 - 196 + 0 + 0 \approx 204$ J']
    source: {cite: mit, at: 'Net work, Approach 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: box-fnet
    where: 'same, second way: F_net = 100 − 49.05 = 50.95 N'
    inputs: {f: 100 N, ff: 49.05 N}
    formula: f - ff
    expected: 50.95 N
    shown: ['$F_{\text{net}} = 100 - 49.05 = 50.95$ N']
    source: {cite: mit, at: 'Net work, Approach 2 (the numbers are the page''s own)'}
    origin: page-own

  - id: box-net-2
    where: 'same: W_net = 50.95 × 4.0 ≈ 204 J'
    inputs: {f: 50.95 N, dx: 4.0 m}
    formula: f * dx
    expected: 204 J
    shown: ['$W_{\text{net}} = 50.95 \times 4.0 \approx 204$ J']
    source: {cite: mit, at: 'Net work, Approach 2 (the numbers are the page''s own)'}
    origin: page-own

  # --- Lifting: crate and ramp ---
  - id: crate-lift
    where: 'worked example "Loading a crate onto a truck" (a): mgh = 8.0 × 9.81 × 1.5 ≈ 118 J'
    inputs: {m: 8.0 kg, ga: 9.81 m/s**2, h: 1.5 m}
    formula: m * ga * h
    expected: 118 J
    shown: ['$W = mgh = 8.0 \times 9.81 \times 1.5 \approx 118$ J']
    source: {cite: reading1, at: 'Sec. 13.4, Example 13.5, Eq. (13.4.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-angle
    where: 'same (b): sin θ = 1.5/3.0 = 0.5, so θ = 30° (sin 30° = 0.5)'
    inputs: {h: 1.5 m, len: 3.0 m}
    formula: asin(h / len) * 180 / pi
    expected: '30'
    shown: ['its angle with the ground is 30°']
    source: {cite: mit, at: '5.2 Work (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-force
    where: 'same (b): push along the ramp mg sin 30° = 39.2 N'
    inputs: {m: 8.0 kg, ga: 9.81 m/s**2}
    formula: m * ga * sin(30 * pi / 180)
    expected: 39.2 N
    shown: ['$8.0 \times 9.81 \times 0.5 = 39.2$ N']
    source: {cite: mit, at: '5.2 Work (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-work
    where: 'same (b): W = 39.2 × 3.0 ≈ 118 J, the same as lifting straight up'
    inputs: {m: 8.0 kg, ga: 9.81 m/s**2, len: 3.0 m}
    formula: m * ga * sin(30 * pi / 180) * len
    expected: 118 J
    shown: ['$W = 39.2 \times 3.0 \approx 118$ J']
    source: {cite: mit, at: '5.2 Work, definition box (the numbers are the page''s own)'}
    origin: page-own

  # --- Spring ---
  - id: spring-f1
    where: 'graph: force 30 N at 0.12 m for k = 250 N/m'
    inputs: {k: 250 N/m, x: 0.12 m}
    formula: k * x
    expected: 30 N
    shown: ['30 N at 0.12 m']
    source: {cite: reading1, at: 'Sec. 13.5, Example 13.6, Eq. (13.5.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-f2
    where: 'graph: force 60 N at 0.24 m'
    inputs: {k: 250 N/m, x: 0.24 m}
    formula: k * x
    expected: 60 N
    shown: ['60 N at 0.24 m']
    source: {cite: reading1, at: 'Sec. 13.5, Example 13.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-area-caption
    where: 'graph caption: triangle ½ × 0.12 × 30 = 1.8 J'
    inputs: {x: 0.12 m, f: 30 N}
    formula: 0.5 * x * f
    expected: 1.8 J
    shown: ['½ × 0.12 × 30 = 1.8 J']
    source: {cite: reading1, at: 'Sec. 13.5, Figure 13.7 and Eq. (13.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-w1
    where: 'worked example "Stretching an exercise spring" (a): ½ × 250 × 0.12² = 1.8 J'
    inputs: {k: 250 N/m, x: 0.12 m}
    formula: 0.5 * k * x**2
    expected: 1.8 J
    shown: ['$W = \tfrac12 kx^2 = \tfrac12 \times 250 \times 0.12^2 = 1.8$ J']
    source: {cite: reading1, at: 'Sec. 13.5, Example 13.6, Eq. (13.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-w2
    where: 'same (b): ½ × 250 × 0.24² = 7.2 J'
    inputs: {k: 250 N/m, x: 0.24 m}
    formula: 0.5 * k * x**2
    expected: 7.2 J
    shown: ['$\tfrac12 \times 250 \times 0.24^2 = 7.2$ J']
    source: {cite: reading1, at: 'Sec. 13.5, Example 13.6, Eq. (13.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-second
    where: 'same (b): the second 12 cm take 7.2 − 1.8 = 5.4 J'
    inputs: {k: 250 N/m, x1: 0.12 m, x2: 0.24 m}
    formula: 0.5 * k * x2**2 - 0.5 * k * x1**2
    expected: 5.4 J
    shown: ['$7.2 - 1.8 = 5.4$ J']
    source: {cite: reading1, at: 'Sec. 13.5, Example 13.6, Eq. (13.5.5) with x_i = 0.12 m (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-ratio
    where: 'same: three times as much as the first; the triangle to 0.24 m is four times as large'
    inputs: {x1: 0.12 m, x2: 0.24 m}
    formula: (x2**2 - x1**2) / x1**2
    expected: '3'
    shown: ['three times as much as the first']
    source: {cite: reading1, at: 'Sec. 13.5, Eq. (13.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-four
    where: 'graph caption and check: doubling the extension multiplies the work by four'
    inputs: {x1: 0.12 m, x2: 0.24 m}
    formula: x2**2 / x1**2
    expected: '4'
    shown: ['the triangle is four times as large', 'multiplies the work by four']
    source: {cite: reading1, at: 'Sec. 13.5, Eq. (13.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: spring-average
    where: 'same, check: average force 15 N over 0.12 m gives 1.8 J'
    inputs: {f: 15 N, x: 0.12 m}
    formula: f * x
    expected: 1.8 J
    shown: ['$15 \times 0.12 = 1.8$ J']
    source: {cite: reading1, at: 'Sec. 13.5 (the numbers are the page''s own)'}
    origin: page-own

  # --- Quiz ---
  - id: quiz-rope
    where: 'quiz 1: 60 × 5.0 × cos 40° ≈ 230 J'
    inputs: {f: 60 N, dx: 5.0 m}
    formula: f * dx * cos(40 * pi / 180)
    expected: 230 J
    shown: ['$W = F\\Delta x\\cos\\theta = 60 \\times 5.0 \\times \\cos 40° = 300 \\times 0.766 \\approx 230$ J']
    source: {cite: mit, at: '5.2 Work, definition box (the numbers are the page''s own)'}
    origin: page-own
    quiz: 0

  - id: quiz-rope-sine
    where: 'quiz 1, wrong choice: 300 sin 40° = 193 J'
    inputs: {f: 60 N, dx: 5.0 m}
    formula: f * dx * sin(40 * pi / 180)
    expected: 193 J
    shown: ['using the sine instead gives 193 J']
    source: {cite: mit, at: '5.2 Work (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-rope-divide
    where: 'quiz 1, wrong choice: dividing force by distance, 60/5.0 = 12'
    inputs: {f: 60, dx: 5.0}
    formula: f / dx
    expected: '12'
    shown: ['"12 J"']
    source: {cite: mit, at: '5.2 Work (a wrong choice; the numbers are the page''s own, not in the source)'}
    origin: page-own

  - id: quiz-bag-weight
    where: 'quiz 3: weight 2.5 × 9.81 = 24.5 N'
    inputs: {m: 2.5 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 24.5 N
    shown: ['$mg = 2.5 \\times 9.81 = 24.5$ N']
    source: {cite: reading1, at: 'Sec. 13.4, Example 13.5 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bag-work
    where: 'quiz 3: W = mgh = 24.5 × 0.80 ≈ 19.6 J'
    inputs: {m: 2.5 kg, ga: 9.81 m/s**2, h: 0.80 m}
    formula: m * ga * h
    expected: 19.6 J
    shown: ['$W = mgh = 24.5 \\times 0.80 \\approx 19.6$ J']
    source: {cite: reading1, at: 'Sec. 13.4, Example 13.5, Eq. (13.4.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bag-wrong
    where: 'quiz 3, wrong choice: forgetting g gives 2.5 × 0.80 = 2.0'
    inputs: {m: 2.5, h: 0.80}
    formula: m * h
    expected: '2.0'
    shown: ['2.0 forgets $g$']
    source: {cite: reading1, at: 'Sec. 13.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-spring
    where: 'quiz 5: ½ × 400 × 0.050² = 0.50 J'
    inputs: {k: 400 N/m, x: 0.050 m}
    formula: 0.5 * k * x**2
    expected: 0.50 J
    shown: ['$W = \\tfrac12 kx^2 = \\tfrac12 \\times 400 \\times 0.050^2 = 0.50$ J']
    source: {cite: reading1, at: 'Sec. 13.5, Example 13.6, Eq. (13.5.5) (the numbers are the page''s own)'}
    origin: page-own
    quiz: 4

  - id: quiz-spring-nohalf
    where: 'quiz 5, wrong choice: kx² = 1.0 J'
    inputs: {k: 400 N/m, x: 0.050 m}
    formula: k * x**2
    expected: 1.0 J
    shown: ['Forgetting the half gives 1.0 J']
    source: {cite: reading1, at: 'Sec. 13.5 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-spring-force
    where: 'quiz 5, wrong choices: final force kx = 20 N, and 10 is half of it'
    inputs: {k: 400 N/m, x: 0.050 m}
    formula: k * x
    expected: 20 N
    shown: ['20 N is the final force $kx$']
    source: {cite: reading1, at: 'Sec. 13.5, Eq. (13.5.4) (the numbers are the page''s own)'}
    origin: page-own
