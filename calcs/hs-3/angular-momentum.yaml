# Calculations on content/year-0/hs-3/angular-momentum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 19, Angular Momentum (mit); Ch. 16, Two Dimensional Rotational Kinematics (reading1);
# Ch. 25, Celestial Mechanics (reading2); NASA Imagine the Universe!, Neutron Stars (neutronstars) for the size of a neutron star.
# All worked-example numbers are the page's own: none of MIT's (Example 19.1: 2.0 kg at 3.0 m/s through (2.0 m, 3.0 m),
# −6 kg·m²/s; Examples 19.2 to 19.8 and 16.1 to 16.5 are symbolic; Example 25.1/25.2: 7.38 × 10⁶ and 4.87 × 10⁵ m/s) are reused.
# Angular speeds are written in 1/s (rad/s); turns per second as f in 1/s.

page: content/year-0/hs-3/angular-momentum.mdx
calcs:
  # --- Quiz ---
  - id: quiz-ball-L
    where: 'quiz 2: L = 0.50 × 3.0 × 0.40 = 0.60 kg·m²/s'
    inputs: {m: 0.50 kg, v: 3.0 m/s, r: 0.40 m}
    formula: m * v * r
    expected: 0.60 kg*m^2/s
    shown: ['$L = m v r = 0.50 \\times 3.0 \\times 0.40 = 0.60$ kg·m²/s']
    source: {cite: mit, at: 'Example 19.2, L = Rmv (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ball-p
    where: 'quiz 2, wrong choice: the momentum 0.50 × 3.0 = 1.5 kg·m/s'
    inputs: {m: 0.50 kg, v: 3.0 m/s}
    formula: m * v
    expected: 1.5 kg*m/s
    shown: ['gives the momentum, 1.5 kg·m/s']
    source: {cite: mit, at: 'Sec. 19.2.1, p = mv (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ball-r2
    where: 'quiz 2, wrong choice: m v r² = 0.24'
    inputs: {m: 0.50, v: 3.0, r: 0.40}
    formula: m * v * r**2
    expected: '0.24'
    shown: ['squaring the radius instead gives 0.24']
    source: {cite: mit, at: 'Example 19.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ball-v2
    where: 'quiz 2, wrong choice: m v² r = 1.8'
    inputs: {m: 0.50, v: 3.0, r: 0.40}
    formula: m * v**2 * r
    expected: '1.8'
    shown: ['squaring the speed gives 1.8']
    source: {cite: mit, at: 'Example 19.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-skater-energy
    where: 'quiz 3: a third of I and nine times ω² give three times the kinetic energy'
    inputs: {k: 3}
    formula: (1 / k) * k**2
    expected: '3'
    shown: ['nine times $\\omega^{2}$: three times as much']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4), with L constant from Sec. 19.8 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-hoop-disc
    where: 'quiz 4: hoop MR² against disc ½MR²: twice as much angular momentum'
    inputs: {M: 1.0 kg, R: 1.0 m}
    formula: (M * R**2) / (0.5 * M * R**2)
    expected: '2'
    shown: ['is twice as large for the hoop']
    source: {cite: reading1, at: 'Example 16.2, Eq. (16.2.11), and Ch. 19 Sec. 19.7, Eq. (19.5.31) (the comparison is the page''s own)'}
    origin: page-own

  - id: quiz-comet
    where: 'quiz 5: v_a = 40 / 4 = 10 km/s'
    inputs: {vp: 40 km/s, k: 4}
    formula: vp / k
    expected: 10 km/s
    shown: ['$v_a = 40 / 4 = 10$ km/s']
    source: {cite: reading2, at: 'Example 25.1, Eq. (25.6.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-square
    where: 'quiz 5, wrong choice: 40 / 4² = 2.5'
    inputs: {vp: 40, k: 4}
    formula: vp / k**2
    expected: '2.5'
    shown: ['Dividing by the square of 4 gives 2.5']
    source: {cite: reading2, at: 'Example 25.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-root
    where: 'quiz 5, wrong choices: 40 / √4 = 20 and 40 × 4 = 160'
    inputs: {vp: 40, k: 4}
    formula: vp / sqrt(k)
    expected: '20'
    shown: ['dividing by its square root gives 20']
    source: {cite: reading2, at: 'Example 25.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-times
    where: 'quiz 5, wrong choice: 40 × 4 = 160'
    inputs: {vp: 40, k: 4}
    formula: vp * k
    expected: '160'
    shown: ['and multiplying gives 160']
    source: {cite: reading2, at: 'Example 25.1 (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A stone on a string" ---
  - id: stone-omega
    where: 'ω = 2π × 2.0 ≈ 12.6 rad/s'
    inputs: {f: 2.0 1/s}
    formula: 2 * pi * f
    expected: 12.6 1/s
    shown: ['$\omega = 2\pi \times 2.0 \approx 12.6$ rad/s']
    source: {cite: mit, at: 'Example 19.2, angular velocity ω_z (the numbers are the page''s own)'}
    origin: page-own

  - id: stone-v
    where: 'v = ωr = 12.57 × 0.50 ≈ 6.3 m/s'
    inputs: {f: 2.0 1/s, r: 0.50 m}
    formula: 2 * pi * f * r
    expected: 6.3 m/s
    shown: ['$v = \omega r = 12.57 \times 0.50 \approx 6.3$ m/s']
    source: {cite: mit, at: 'Example 19.2, v = Rω_z (the numbers are the page''s own)'}
    origin: page-own

  - id: stone-L
    where: 'L = m v r = 0.15 × 6.28 × 0.50 ≈ 0.47 kg·m²/s'
    inputs: {m: 0.15 kg, f: 2.0 1/s, r: 0.50 m}
    formula: m * (2 * pi * f * r) * r
    expected: 0.47 kg*m^2/s
    shown: ['$L = m v r = 0.15 \times 6.28 \times 0.50 \approx 0.47$ kg·m²/s']
    source: {cite: mit, at: 'Example 19.2, L = Rmv (the numbers are the page''s own)'}
    origin: page-own

  - id: stone-L-check
    where: 'check: L = m r² ω = 0.15 × 0.50² × 12.57 ≈ 0.47 kg·m²/s'
    inputs: {m: 0.15 kg, f: 2.0 1/s, r: 0.50 m}
    formula: m * r**2 * 2 * pi * f
    expected: 0.47 kg*m^2/s
    shown: ['$L = m r^{2} \omega = 0.15 \times 0.50^{2} \times 12.57 \approx 0.47$ kg·m²/s']
    source: {cite: mit, at: 'Example 19.2, L = mR²ω_z (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Two weights on a rod" ---
  - id: rod-I
    where: 'I = 2 × 2.0 × 0.30² = 0.36 kg·m²'
    inputs: {m: 2.0 kg, r: 0.30 m}
    formula: 2 * m * r**2
    expected: 0.36 kg*m^2
    shown: ['$I = 2 \times 2.0 \times 0.30^{2} = 0.36$ kg·m²']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.24) (the numbers are the page''s own)'}
    origin: page-own

  - id: rod-L
    where: 'L = Iω = 0.36 × 4.0 ≈ 1.4 kg·m²/s'
    inputs: {I: 0.36 kg*m^2, w: 4.0 1/s}
    formula: I * w
    expected: 1.4 kg*m^2/s
    shown: ['$L = I\omega = 0.36 \times 4.0 \approx 1.4$ kg·m²/s']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.27) (the numbers are the page''s own)'}
    origin: page-own

  - id: rod-I-closer
    where: 'weights at 0.15 m: I = 2 × 2.0 × 0.15² = 0.090 kg·m²'
    inputs: {m: 2.0 kg, r: 0.15 m}
    formula: 2 * m * r**2
    expected: 0.090 kg*m^2
    shown: ['$I = 2 \times 2.0 \times 0.15^{2} = 0.090$ kg·m²']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.24) (the numbers are the page''s own)'}
    origin: page-own

  - id: rod-v
    where: 'check: each weight moves at v = ωr = 4.0 × 0.30 = 1.2 m/s'
    inputs: {w: 4.0 1/s, r: 0.30 m}
    formula: w * r
    expected: 1.2 m/s
    shown: ['$v = \omega r = 4.0 \times 0.30 = 1.2$ m/s']
    source: {cite: mit, at: 'Example 19.2, v = Rω_z (the numbers are the page''s own)'}
    origin: page-own

  - id: rod-L-single
    where: 'check: m v r = 2.0 × 1.2 × 0.30 = 0.72 kg·m²/s per weight'
    inputs: {m: 2.0 kg, v: 1.2 m/s, r: 0.30 m}
    formula: m * v * r
    expected: 0.72 kg*m^2/s
    shown: ['$m v r = 2.0 \times 1.2 \times 0.30 = 0.72$ kg·m²/s']
    source: {cite: mit, at: 'Example 19.2, L = Rmv (the numbers are the page''s own)'}
    origin: page-own

  - id: rod-L-sum
    where: 'check: 2 × 0.72 = 1.44 kg·m²/s'
    inputs: {L1: 0.72 kg*m^2/s}
    formula: 2 * L1
    expected: 1.44 kg*m^2/s
    shown: ['$2 \times 0.72 = 1.44$ kg·m²/s']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.24) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A potter's wheel" ---
  - id: potter-I
    where: 'I = ½ × 5.0 × 0.20² = 0.10 kg·m²'
    inputs: {M: 5.0 kg, R: 0.20 m}
    formula: 0.5 * M * R**2
    expected: 0.10 kg*m^2
    shown: ['$I = \tfrac{1}{2} M R^{2} = \tfrac{1}{2} \times 5.0 \times 0.20^{2} = 0.10$ kg·m²']
    source: {cite: reading1, at: 'Example 16.2, Eq. (16.2.11) (the numbers are the page''s own)'}
    origin: page-own

  - id: potter-omega
    where: 'ω = 2π × 1.5 ≈ 9.4 rad/s'
    inputs: {f: 1.5 1/s}
    formula: 2 * pi * f
    expected: 9.4 1/s
    shown: ['$\omega = 2\pi \times 1.5 \approx 9.4$ rad/s']
    source: {cite: reading1, at: 'Sec. 16.2.2, angular velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: potter-L
    where: 'L = 0.10 × 9.42 ≈ 0.94 kg·m²/s'
    inputs: {I: 0.10 kg*m^2, f: 1.5 1/s}
    formula: I * 2 * pi * f
    expected: 0.94 kg*m^2/s
    shown: ['$L = I\omega = 0.10 \times 9.42 \approx 0.94$ kg·m²/s']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.27) (the numbers are the page''s own)'}
    origin: page-own

  - id: potter-E
    where: 'E_k = ½ × 0.10 × 9.42² ≈ 4.4 J'
    inputs: {I: 0.10 kg*m^2, f: 1.5 1/s}
    formula: 0.5 * I * (2 * pi * f)**2
    expected: 4.4 J
    shown: ['$E_k = \tfrac{1}{2} I \omega^{2} = \tfrac{1}{2} \times 0.10 \times 9.42^{2} \approx 4.4$ J']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: potter-E-check
    where: 'check: ½ × 0.942 × 9.42 ≈ 4.4 J'
    inputs: {L: 0.942 kg*m^2/s, w: 9.42 1/s}
    formula: 0.5 * L * w
    expected: 4.4 J
    shown: ['$\tfrac{1}{2} \times 0.942 \times 9.42 \approx 4.4$ J']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4), written as ½(Iω)ω (the step and numbers are the page''s own)'}
    origin: page-own

  - id: potter-ring
    where: 'a ring of the same mass and radius has twice the moment of inertia'
    inputs: {M: 5.0 kg, R: 0.20 m}
    formula: (M * R**2) / (0.5 * M * R**2)
    expected: '2'
    shown: ['would have twice the moment of inertia']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.31), with reading 1, Eq. (16.2.11) (the comparison is the page''s own)'}
    origin: page-own

  # --- Worked example "Pushing a playground roundabout" ---
  - id: roundabout-torque
    where: 'τ = rF = 1.5 × 50 = 75 N·m'
    inputs: {r: 1.5 m, F: 50 N}
    formula: r * F
    expected: 75 N*m
    shown: ['$\tau = r F = 1.5 \times 50 = 75$ N·m']
    source: {cite: mit, at: 'Sec. 19.5, Eq. (19.4.2), with the torque of a force at right angles to the radius (the numbers are the page''s own)'}
    origin: page-own

  - id: roundabout-dL
    where: 'ΔL = τΔt = 75 × 4.0 = 300 kg·m²/s'
    inputs: {tau: 75 N*m, t: 4.0 s}
    formula: tau * t
    expected: 300 kg*m^2/s
    shown: ['$\Delta L = \tau\,\Delta t = 75 \times 4.0 = 300$ kg·m²/s']
    source: {cite: mit, at: 'Sec. 19.5, Eq. (19.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: roundabout-omega
    where: 'ω = L/I = 300/240 ≈ 1.3 rad/s'
    inputs: {L: 300 kg*m^2/s, I: 240 kg*m^2}
    formula: L / I
    expected: 1.25 1/s
    shown: ['$\omega = L / I = 300 / 240 \approx 1.3$ rad/s']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.27) (the numbers are the page''s own)'}
    origin: page-own

  - id: roundabout-period
    where: 'about one turn every 5 s: 2π / 1.25 ≈ 5.0 s'
    inputs: {w: 1.25 1/s}
    formula: 2 * pi / w
    expected: 5 s
    shown: ['about one turn every 5 s']
    source: {cite: mit, at: 'Example 19.2, angular velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: roundabout-edge
    where: 'check: v = ωr = 1.25 × 1.5 ≈ 1.9 m/s'
    inputs: {w: 1.25 1/s, r: 1.5 m}
    formula: w * r
    expected: 1.9 m/s
    shown: ['$v = \omega r = 1.25 \times 1.5 \approx 1.9$ m/s']
    source: {cite: mit, at: 'Example 19.2, v = Rω_z (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A skater pulls in her arms" ---
  - id: skater-omega-i
    where: 'ω_i = 2π × 1.5 ≈ 9.42 rad/s'
    inputs: {f: 1.5 1/s}
    formula: 2 * pi * f
    expected: 9.42 1/s
    shown: ['$\omega_i = 2\pi \times 1.5 \approx 9.42$ rad/s']
    source: {cite: mit, at: 'Sec. 19.8 (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-L
    where: 'L = 3.6 × 9.42 ≈ 34 kg·m²/s'
    inputs: {I: 3.6 kg*m^2, f: 1.5 1/s}
    formula: I * 2 * pi * f
    expected: 34 kg*m^2/s
    shown: ['$L = I_i \omega_i = 3.6 \times 9.42 \approx 34$ kg·m²/s']
    source: {cite: mit, at: 'Sec. 19.7, Eq. (19.5.27) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-omega-f
    where: 'ω_f = L / I_f = 33.9 / 1.2 ≈ 28.3 rad/s'
    inputs: {Ii: 3.6 kg*m^2, If: 1.2 kg*m^2, f: 1.5 1/s}
    formula: Ii * 2 * pi * f / If
    expected: 28.3 1/s
    shown: ['$\omega_f = L / I_f = 33.9 / 1.2 \approx 28.3$ rad/s']
    source: {cite: mit, at: 'Sec. 19.8, Eq. (19.5.36) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-turns
    where: 'three times as fast, 4.5 turns per second'
    inputs: {Ii: 3.6, If: 1.2, f: 1.5}
    formula: f * Ii / If
    expected: '4.5'
    shown: ['That is three times as fast, 4.5 turns per second.']
    source: {cite: mit, at: 'Sec. 19.8, Eq. (19.5.36) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-E-i
    where: 'kinetic energy before: ½ × 3.6 × 9.42² ≈ 160 J'
    inputs: {I: 3.6 kg*m^2, f: 1.5 1/s}
    formula: 0.5 * I * (2 * pi * f)**2
    expected: 160 J
    shown: ['$\tfrac{1}{2} \times 3.6 \times 9.42^{2} \approx 160$ J']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-E-f
    where: 'kinetic energy after: ½ × 1.2 × 28.3² ≈ 480 J'
    inputs: {Ii: 3.6 kg*m^2, If: 1.2 kg*m^2, f: 1.5 1/s}
    formula: 0.5 * If * (Ii * 2 * pi * f / If)**2
    expected: 480 J
    shown: ['$\tfrac{1}{2} \times 1.2 \times 28.3^{2} \approx 480$ J']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-E-gain
    where: 'gain 480 − 160 = 320 J'
    inputs: {Ef: 480 J, Ei: 160 J}
    formula: Ef - Ei
    expected: 320 J
    shown: ['by $480 - 160 = 320$ J', 'that work, 320 J in the example']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-ratio
    where: 'check: I down by 3.6 / 1.2 = 3'
    inputs: {Ii: 3.6, If: 1.2}
    formula: Ii / If
    expected: '3'
    shown: ['$3.6 / 1.2 = 3$']
    source: {cite: mit, at: 'Sec. 19.8, Eq. (19.5.36) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-E-factor
    where: 'check: ½Iω² changes by (1/3) × 3² = 3'
    inputs: {k: 3}
    formula: (1 / k) * k**2
    expected: '3'
    shown: ['$\tfrac{1}{3} \times 3^{2} = 3$']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-E-check
    where: 'check: 3 × 160 = 480 J'
    inputs: {Ei: 160 J}
    formula: 3 * Ei
    expected: 480 J
    shown: ['$3 \times 160 = 480$ J']
    source: {cite: reading1, at: 'Sec. 16.3.1, Eq. (16.2.4) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A comet on a long orbit" ---
  - id: comet-va
    where: 'v_a = v_p r_p / r_a = 54 × 9.0e10 / 4.5e12 ≈ 1.1 km/s'
    inputs: {vp: 54 km/s, rp: 9.0e10 m, ra: 4.5e12 m}
    formula: vp * rp / ra
    expected: 1.1 km/s
    shown: ['\dfrac{54 \times 9.0 \times 10^{10}}{4.5 \times 10^{12}} \approx 1.1$ km/s']
    source: {cite: reading2, at: 'Example 25.1, Eq. (25.6.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: comet-ratio
    where: 'check: the far end is 4.5e12 / 9.0e10 = 50 times as far'
    inputs: {rp: 9.0e10 m, ra: 4.5e12 m}
    formula: ra / rp
    expected: '50'
    shown: ['\dfrac{4.5 \times 10^{12}}{9.0 \times 10^{10}} = 50$ times as far']
    source: {cite: reading2, at: 'Example 25.1, Eq. (25.6.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: comet-va-check
    where: 'check: 54 / 50 = 1.08 km/s'
    inputs: {vp: 54 km/s, k: 50}
    formula: vp / k
    expected: 1.08 km/s
    shown: ['$54 / 50 = 1.08$']
    source: {cite: reading2, at: 'Example 25.1, Eq. (25.6.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: comet-rv
    where: 'check: both products r v are 9.0e10 × 5.4e4 = 4.5e12 × 1.08e3 = 4.86e15 m²/s'
    inputs: {vp: 54 km/s, rp: 9.0e10 m}
    formula: rp * vp
    expected: 4.86e15 m^2/s
    shown: ['$4.86 \times 10^{15}$ m²/s']
    source: {cite: reading2, at: 'Example 25.1, Eq. (25.6.2) (the numbers are the page''s own)'}
    origin: page-own

  # --- Callout "Towards cosmology" ---
  - id: neutron-star-size
    kind: fact
    where: 'callout: a neutron star is only about 20 kilometres across'
    value: 20 km
    shown: ['only about 20 kilometres across']
    source: {cite: neutronstars, at: 'Neutron Stars: these stellar remnants measure about 20 kilometers across'}
    origin: later-data

  - id: collapse-factor
    where: 'callout: radius 1000 times smaller, same shape: I falls 1000² = 10⁶ times'
    inputs: {k: 1000}
    formula: k**2
    expected: 1.0e6
    shown: ['its moment of inertia would fall $10^{6}$ times']
    source: {cite: mit, at: 'Sec. 19.8, Eq. (19.5.36), with I proportional to MR² for one shape (reading 1, Sec. 16.3.1) (the estimate is the page''s own)'}
    origin: page-own
