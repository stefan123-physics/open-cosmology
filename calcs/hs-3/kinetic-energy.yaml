# Calculations on content/year-0/hs-3/kinetic-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 13 (mit); Siyavula Physical Sciences Grade 10, 22.3 Kinetic energy (reading1).
# (Until 2026-11-21 the main source was Siyavula Grade 12, 5.3; it contains OpenStax material, so it is no longer cited.)
# All numbers are the page's own (none of Siyavula's or MIT's example numbers are reused).

page: content/year-0/hs-3/kinetic-energy.mdx
calcs:
  # Section "Kinetic energy"
  - id: ke-car
    where: 'section "Kinetic energy": 1500 kg car at 20 m/s'
    inputs: {mass: 1500 kg, vel: 20 m/s}
    formula: mass * vel**2 / 2
    expected: 3.0e5 J
    shown: ['$E_k = \tfrac{1}{2} \times 1500 \times 20^{2} = 3.0 \times 10^{5}$ J']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: ke-cyclist
    where: 'same: 90 kg cyclist and bicycle at 6.0 m/s'
    inputs: {mass: 90 kg, vel: 6.0 m/s}
    formula: mass * vel**2 / 2
    expected: 1.6e3 J
    shown: ['$\tfrac{1}{2} \times 90 \times 6.0^{2} \approx 1.6 \times 10^{3}$ J']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: ke-ratio
    where: 'same: the car has about 190 times the cyclist''s kinetic energy'
    inputs: {m1: 1500 kg, v1: 20 m/s, m2: 90 kg, v2: 6.0 m/s}
    formula: (m1 * v1**2) / (m2 * v2**2)
    expected: '190'
    shown: ['about 190 times as much']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  # Worked example "Speeding up a car"
  - id: car-eki
    where: 'worked example "Speeding up a car": 1200 kg at 10 m/s'
    inputs: {mass: 1200 kg, vel: 10 m/s}
    formula: mass * vel**2 / 2
    expected: 6.0e4 J
    shown: ['$E_{k} = \tfrac{1}{2} \times 1200 \times 10^{2} = 6.0 \times 10^{4}$ J at the start']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-ekf
    where: 'same: 1200 kg at 25 m/s'
    inputs: {mass: 1200 kg, vel: 25 m/s}
    formula: mass * vel**2 / 2
    expected: 3.8e5 J
    shown: ['$\tfrac{1}{2} \times 1200 \times 25^{2} \approx 3.8 \times 10^{5}$ J at the end']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-dek
    where: 'same: change in kinetic energy 3.15 × 10⁵ J'
    inputs: {mass: 1200 kg, vi: 10 m/s, vf: 25 m/s}
    formula: mass * (vf**2 - vi**2) / 2
    expected: 3.15e5 J
    shown: ['$\tfrac{1}{2} \times 1200 \times (25^{2} - 10^{2}) = 3.15 \times 10^{5}$ J']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-fnet
    where: 'same: F_net = 3.15 × 10⁵ J / 150 m'
    inputs: {work: 3.15e5 J, dist: 150 m}
    formula: work / dist
    expected: 2.1e3 N
    shown: ['$F_{\text{net}} = W_{\text{net}} / \Delta x = 3.15 \times 10^{5} / 150 \approx 2.1 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: car-acc
    where: 'same, check: a = 2100 / 1200'
    inputs: {force: 2100 N, mass: 1200 kg}
    formula: force / mass
    expected: 1.75 m/s**2
    shown: ['$a = 2100 / 1200 = 1.75$ m/s²']
    source: {cite: mit, at: 'Sec. 13.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: car-check-v
    where: 'same, check: v_f² = 10² + 2 × 1.75 × 150 = 625, v_f = 25 m/s'
    inputs: {vi: 10 m/s, acc: 1.75 m/s**2, dist: 150 m}
    formula: sqrt(vi**2 + 2 * acc * dist)
    expected: 25 m/s
    shown: ['$v_f^{2} = 10^{2} + 2 \times 1.75 \times 150 = 625$, and $\sqrt{625} = 25$ m/s']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.5) (the numbers are the page''s own)'}
    origin: page-own

  # Section "Twice the speed, four times the energy"
  - id: double-0-10
    where: 'section "Twice the speed": rest to 10 m/s for 1200 kg'
    inputs: {mass: 1200 kg, vel: 10 m/s}
    formula: mass * vel**2 / 2
    expected: 6.0e4 J
    shown: ['getting from rest to 10 m/s takes $6.0 \times 10^{4}$ J of net work']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: double-10-20
    where: 'same: 10 m/s to 20 m/s takes 1.8 × 10⁵ J'
    inputs: {mass: 1200 kg, vi: 10 m/s, vf: 20 m/s}
    formula: mass * (vf**2 - vi**2) / 2
    expected: 1.8e5 J
    shown: ['$\tfrac{1}{2} \times 1200 \times (20^{2} - 10^{2}) = 1.8 \times 10^{5}$ J: three times as much']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: double-0-20
    where: 'same: rest to 20 m/s takes 2.4 × 10⁵ J'
    inputs: {mass: 1200 kg, vel: 20 m/s}
    formula: mass * vel**2 / 2
    expected: 2.4e5 J
    shown: ['From rest to 20 m/s therefore takes $2.4 \times 10^{5}$ J']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-a
    where: 'graph caption: point A, 1200 kg at 10 m/s has 60 kJ'
    inputs: {mass: 1200 kg, vel: 10 m/s}
    formula: mass * vel**2 / 2
    expected: 60 kJ
    shown: ['at A (10 m/s) the car has 60 kJ']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-b
    where: 'graph caption: point B, 1200 kg at 20 m/s has 240 kJ'
    inputs: {mass: 1200 kg, vel: 20 m/s}
    formula: mass * vel**2 / 2
    expected: 240 kJ
    shown: ['at B (20 m/s) it has 240 kJ']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: double-ratio-3
    where: 'same: 10 m/s to 20 m/s takes three times the work of rest to 10 m/s'
    inputs: {mass: 1200 kg, v1: 10 m/s, v2: 20 m/s}
    formula: (mass * (v2**2 - v1**2) / 2) / (mass * v1**2 / 2)
    expected: '3'
    shown: ['J: three times as much.']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: double-ratio-4
    where: 'same: rest to 20 m/s takes four times the work of rest to 10 m/s'
    inputs: {mass: 1200 kg, v1: 10 m/s, v2: 20 m/s}
    formula: (mass * v2**2 / 2) / (mass * v1**2 / 2)
    expected: '4'
    shown: ['four times as much as to 10 m/s']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: power-law-2
    where: 'same: doubling x in y ∝ x² multiplies y by 4'
    inputs: {ratio: 2}
    formula: ratio**2
    expected: '4'
    shown: ['doubling $x$ multiplies $y$ by $2^{2} = 4$']
    source: {cite: mit, at: 'Sec. 13.2, Eq. (13.2.1) (the square of the speed; the numbers are the page''s own)'}
    origin: page-own

  # Worked example "Braking from 72 km/h and from 108 km/h"
  - id: brake-v1
    where: 'worked example "Braking": 72 km/h = 20 m/s'
    inputs: {vel: 72 km/hour}
    formula: vel
    expected: 20 m/s
    shown: ['$72 / 3.6 = 20$ m/s']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-v2
    where: 'same: 108 km/h = 30 m/s'
    inputs: {vel: 108 km/hour}
    formula: vel
    expected: 30 m/s
    shown: ['$108 / 3.6 = 30$ m/s']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-ek1
    where: 'same: 1600 kg at 20 m/s'
    inputs: {mass: 1600 kg, vel: 20 m/s}
    formula: mass * vel**2 / 2
    expected: 3.2e5 J
    shown: ['$E_k = \tfrac{1}{2} \times 1600 \times 20^{2} = 3.2 \times 10^{5}$ J']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-ek2
    where: 'same: 1600 kg at 30 m/s'
    inputs: {mass: 1600 kg, vel: 30 m/s}
    formula: mass * vel**2 / 2
    expected: 7.2e5 J
    shown: ['$\tfrac{1}{2} \times 1600 \times 30^{2} = 7.2 \times 10^{5}$ J']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-d1
    where: 'same: braking distance from 20 m/s with 1.0 × 10⁴ N'
    inputs: {mass: 1600 kg, vel: 20 m/s, force: 1.0e4 N}
    formula: mass * vel**2 / (2 * force)
    expected: 32 m
    shown: ['$d = 3.2 \times 10^{5} / 1.0 \times 10^{4} = 32$ m from 72 km/h']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-d2
    where: 'same: braking distance from 30 m/s with 1.0 × 10⁴ N'
    inputs: {mass: 1600 kg, vel: 30 m/s, force: 1.0e4 N}
    formula: mass * vel**2 / (2 * force)
    expected: 72 m
    shown: ['$7.2 \times 10^{5} / 1.0 \times 10^{4} = 72$ m from 108 km/h']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-ratio
    where: 'same, check: 1.5² = 2.25'
    inputs: {v1: 20 m/s, v2: 30 m/s}
    formula: (v2 / v1)**2
    expected: '2.25'
    shown: ['$1.5^{2} = 2.25$ times the distance']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-ratio-check
    where: 'same, check: 32 × 2.25 = 72 m'
    inputs: {dist: 32 m}
    formula: dist * 2.25
    expected: 72 m
    shown: ['$32 \times 2.25 = 72$ m']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-acc
    where: 'same, check: a = 1.0 × 10⁴ N / 1600 kg'
    inputs: {force: 1.0e4 N, mass: 1600 kg}
    formula: force / mass
    expected: 6.25 m/s**2
    shown: ['$a = 1.0 \times 10^{4} / 1600 = 6.25$ m/s²']
    source: {cite: mit, at: 'Sec. 13.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-kinematic
    where: 'same, check: d = 400 / 12.5 = 32 m'
    inputs: {vel: 20 m/s, acc: 6.25 m/s**2}
    formula: vel**2 / (2 * acc)
    expected: 32 m
    shown: ['$d = v_i^{2}/(2a) = 400 / 12.5 = 32$ m, the same']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.5) (the numbers are the page''s own)'}
    origin: page-own

  # Worked example "How high does the ball go?"
  - id: ball-ek
    where: 'worked example "How high does the ball go?": 0.15 kg at 12 m/s'
    inputs: {mass: 0.15 kg, vel: 12 m/s}
    formula: mass * vel**2 / 2
    expected: 11 J
    shown: ['$E_k = \tfrac{1}{2} \times 0.15 \times 12^{2} \approx 11$ J.']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-h
    where: 'same: h = 12² / (2 × 9.81)'
    inputs: {vel: 12 m/s, grav: 9.81 m/s**2}
    formula: vel**2 / (2 * grav)
    expected: 7.3 m
    shown: ['$h = \dfrac{12^{2}}{2 \times 9.81} \approx 7.3$ m']
    source: {cite: mit, at: 'Sec. 13.6, Example 13.7, Eq. (13.6.2) (work done by gravity; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-mgh
    where: 'same, check: m g h = 0.15 × 9.81 × 7.3 ≈ 11 J'
    inputs: {mass: 0.15 kg, grav: 9.81 m/s**2, hgt: 7.3 m}
    formula: mass * grav * hgt
    expected: 11 J
    shown: ['$m g h = 0.15 \times 9.81 \times 7.3 \approx 11$ J']
    source: {cite: mit, at: 'Sec. 13.6, Example 13.7, Eq. (13.6.2) (work done by gravity; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-return
    where: 'same: the ball returns with the same kinetic energy, so at 12 m/s again'
    inputs: {mass: 0.15 kg, vel: 12 m/s}
    formula: sqrt(2 * (mass * vel**2 / 2) / mass)
    expected: 12 m/s
    shown: ['so at 12 m/s again']
    source: {cite: mit, at: 'Sec. 13.6, Example 13.7, Eq. (13.6.2) (net work of gravity over the round trip is zero; the numbers are the page''s own)'}
    origin: page-own

  # Section "Kinetic energy depends on the frame"
  - id: bag-ground
    where: 'section "frame": 2.0 kg bag at 25 m/s relative to the ground'
    inputs: {mass: 2.0 kg, vel: 25 m/s}
    formula: mass * vel**2 / 2
    expected: 630 J
    shown: ['$E_k = \tfrac{1}{2} \times 2.0 \times 25^{2} \approx 630$ J']
    source: {cite: mit, at: 'Sec. 13.2, Example 13.1 (the numbers are the page''s own)'}
    origin: page-own

  # Quiz
  - id: quiz-runner
    where: 'quiz 1: 60 kg runner at 5.0 m/s'
    inputs: {mass: 60 kg, vel: 5.0 m/s}
    formula: mass * vel**2 / 2
    expected: 750 J
    shown: ['$E_k = \\tfrac{1}{2} m v^{2} = \\tfrac{1}{2} \\times 60 \\times 5.0^{2} = 750$ J']
    quiz: 0
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-runner-nosquare
    where: 'quiz 1, distractor: ½ × 60 × 5.0 = 150'
    inputs: {mass: 60 kg, vel: 5.0 m/s}
    formula: mass * vel / 2
    expected: 150 kg*m/s
    shown: ['Forgetting to square the speed gives 150 J']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-runner-nohalf
    where: 'quiz 1, distractor: 60 × 5.0² = 1500 J'
    inputs: {mass: 60 kg, vel: 5.0 m/s}
    formula: mass * vel**2
    expected: 1500 J
    shown: ['forgetting the ½ gives 1500 J']
    source: {cite: reading1, at: 'Kinetic energy (ESAHL) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolley
    where: 'quiz 3: 200 J − 120 J = 80 J'
    inputs: {eki: 200 J, work: -120 J}
    formula: eki + work
    expected: 80 J
    shown: ['$E_k = 200 - 120 = 80$ J']
    quiz: 2
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolley-wrong
    where: 'quiz 3, distractor: 200 + 120 = 320 J'
    inputs: {eki: 200 J, work: 120 J}
    formula: eki + work
    expected: 320 J
    shown: ['the impossible 320 J']
    source: {cite: mit, at: 'Sec. 13.6, Eq. (13.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-brake-triple
    where: 'quiz 4: three times the speed, 3² = 9 times the braking distance'
    inputs: {ratio: 3}
    formula: ratio**2
    expected: '9'
    shown: ['$3^{2} = 9$ times the distance']
    source: {cite: mit, at: 'Sec. 13.3.1, Eq. (13.3.7) and Sec. 13.6, Eq. (13.6.1): negative work slows the object (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ball
    where: 'quiz 5: h = 7.0² / (2 × 9.81) ≈ 2.5 m'
    inputs: {vel: 7.0 m/s, grav: 9.81 m/s**2}
    formula: vel**2 / (2 * grav)
    expected: 2.5 m
    shown: ['$h = v^{2}/(2g) = 49/19.62 \\approx 2.5$ m']
    quiz: 4
    source: {cite: mit, at: 'Sec. 13.6, Example 13.7, Eq. (13.6.2) (work done by gravity; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ball-no2
    where: 'quiz 5, distractor: 7.0² / 9.81 ≈ 5.0 m'
    inputs: {vel: 7.0 m/s, grav: 9.81 m/s**2}
    formula: vel**2 / grav
    expected: 5.0 m
    shown: ['Leaving out the 2 gives 5.0 m']
    source: {cite: mit, at: 'Sec. 13.6, Example 13.7, Eq. (13.6.2) (work done by gravity; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ball-nosquare
    where: 'quiz 5, distractor: 7.0 / 19.62 ≈ 0.36 (v/(2g) has the unit of time, which is why the wrong formula gives seconds; the page prints the distractor in m)'
    inputs: {vel: 7.0 m/s, grav: 9.81 m/s**2}
    formula: vel / (2 * grav)
    expected: 0.36 s
    shown: ['leaving out the square gives 0.36 m']
    source: {cite: mit, at: 'Sec. 13.6, Example 13.7, Eq. (13.6.2) (work done by gravity; the numbers are the page''s own)'}
    origin: page-own
