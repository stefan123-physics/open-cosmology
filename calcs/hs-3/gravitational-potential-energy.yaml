# Calculations on content/year-0/hs-3/gravitational-potential-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 22.2 Potential energy (mit); MIT 8.01SC Course Notes Chapter 14 (reading1).
# All example numbers are the page's own: none of Siyavula's (1 kg suitcase on a 2 m cupboard, 1 kg brick on a 4 m roof,
# 0.5 kg netball) or MIT's are reused. g = 9.81 m/s², written ga in the inputs (g alone would be the gram).

page: content/year-0/hs-3/gravitational-potential-energy.mdx
calcs:
  # --- Quiz ---
  - id: quiz-bag
    where: 'quiz 1: E_p = 3.0 × 9.81 × 0.80 = 23.5 J, about 24 J'
    inputs: {m: 3.0 kg, ga: 9.81 m/s**2, h: 0.80 m}
    formula: m * ga * h
    expected: 23.5 J
    shown: ['$E_p = m g h = 3.0 \\times 9.81 \\times 0.80 = 23.5$ J, about 24 J']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bag-no-g
    where: 'quiz 1, distractor: 3.0 × 0.80 = 2.4 (g forgotten)'
    inputs: {m: 3.0 kg, h: 0.80 m}
    formula: m * h
    expected: 2.4 kg*m
    shown: ['Forgetting $g$ gives 2.4 J']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bag-no-h
    where: 'quiz 1, distractor: 3.0 × 9.81 = 29 (height forgotten)'
    inputs: {m: 3.0 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 29 N
    tolerance: 2%
    shown: ['forgetting the height gives $3.0 \\times 9.81 = 29$ J']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bag-x10
    where: 'quiz 1, distractor: 240 J, the answer 23.5 J times 10 (a factor 10 slip)'
    inputs: {m: 3.0 kg, ga: 9.81 m/s**2, h: 0.80 m}
    formula: 10 * m * ga * h
    expected: 240 J
    tolerance: 2%
    shown: ['and 240 J is a slip by a factor of 10']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ramp-sin
    where: 'quiz 3: sin θ = 1.5/6.0 = 0.25'
    inputs: {h: 1.5 m, len: 6.0 m}
    formula: h / len
    expected: '0.25'
    shown: ['$\\sin\\theta = 1.5/6.0 = 0.25$']
    source: {cite: reading1, at: 'Sec. 14.2, Eqs. (14.3)–(14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ramp-ratio
    where: 'quiz 3: the ramp is 6.0/1.5 = 4 times as long as the height'
    inputs: {len: 6.0 m, h: 1.5 m}
    formula: len / h
    expected: '4'
    shown: ['$6.0/1.5 = 4$ times as long']
    source: {cite: reading1, at: 'Sec. 14.2, Eqs. (14.3)–(14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-hiker
    where: 'quiz 4 (cable car): ΔE_p = 60 × 9.81 × (900 − 1200) = −1.8 × 10⁵ J'
    inputs: {m: 60 kg, ga: 9.81 m/s**2, h1: 1200 m, h2: 900 m}
    formula: m * ga * (h2 - h1)
    expected: -1.8e5 J
    tolerance: 2%
    shown: ['\\times (900 - 1200) = -1.8 \\times 10^{5}$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-hiker-wrong
    where: 'quiz 4, distractor: 60 × 9.81 × 900 = 5.3 × 10⁵ J'
    inputs: {m: 60 kg, ga: 9.81 m/s**2, h: 900 m}
    formula: m * ga * h
    expected: 5.3e5 J
    tolerance: 1%
    shown: ['$60 \\times 9.81 \\times 900 = 5.3 \\times 10^{5}$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-hiker-wrong-sign
    where: 'quiz 4, distractor: +1.8 × 10⁵ J (the right size with the wrong sign)'
    inputs: {m: 60 kg, ga: 9.81 m/s**2, h1: 1200 m, h2: 900 m}
    formula: m * ga * (h1 - h2)
    expected: 1.8e5 J
    tolerance: 2%
    shown: ['$+1.8 \\times 10^{5}$ J has the wrong sign']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-hiker-factor-10
    where: 'quiz 4, distractor: −1.8 × 10⁴ J (g written as 0.981, a factor 10 slip)'
    inputs: {m: 60 kg, ga: 0.981 m/s**2, h1: 1200 m, h2: 900 m}
    formula: m * ga * (h2 - h1)
    expected: -1.8e4 J
    tolerance: 2%
    shown: ['gives $-1.8 \\times 10^{4}$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: earth-radius-quiz
    kind: fact
    where: 'quiz 5: the Earth''s radius, 6371 km (as in lesson 2.11)'
    value: 6371 km
    shown: ['the Earth''s radius (6371 km)']
    source: {cite: reading1, at: 'Sec. 14.4.3 (inverse square gravity far from the surface; the mean radius 6371 km is the value of lesson 2.11, NASA Earth Fact Sheet)'}
    origin: later-data

  # --- Lifting against gravity ---
  - id: one-joule
    where: 'section "Lifting against gravity": lifting 1 N through 1 m stores 1 J'
    inputs: {f: 1 N, h: 1 m}
    formula: f * h
    expected: 1 J
    shown: ['Lifting an object of weight 1 N through 1 m stores 1 J']
    source: {cite: mit, at: 'Gravitational potential energy, units of E_P (joule)'}
    origin: page-own

  - id: box-force
    where: 'worked example "A box of books": F = 12 × 9.81 = 117.7 N'
    inputs: {m: 12 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 117.7 N
    shown: ['$F = m g = 12 \times 9.81 = 117.7$ N']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: box-work
    where: 'same: W = 117.7 × 1.8 = 212 J, about 2.1 × 10² J'
    inputs: {f: 117.72 N, h: 1.8 m}
    formula: f * h
    expected: 212 J
    shown: ['$W = F h = 117.7 \times 1.8 = 212$ J, about $2.1 \times 10^{2}$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: box-ep
    where: 'same: E_p = 12 × 9.81 × 1.8 = 212 J, about 210 J'
    inputs: {m: 12 kg, ga: 9.81 m/s**2, h: 1.8 m}
    formula: m * ga * h
    expected: 212 J
    shown: ['$E_p = m g h = 12 \times 9.81 \times 1.8 = 212$ J, about 210 J']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh (the numbers are the page''s own)'}
    origin: page-own

  - id: box-estimate
    where: 'same, check: about 120 N through about 2 m is a little over 200 J'
    inputs: {f: 120 N, h: 1.8 m}
    formula: f * h
    expected: 216 J
    shown: ['lifting 120 N through about 2 m should store a little over 200 J']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh (the numbers are the page''s own)'}
    origin: page-own

  # --- Zero level: plant pot ---
  - id: pot-floor
    where: 'worked example "A plant pot": floor as zero, E_p = 2.0 × 9.81 × 1.5 = 29.43 J'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2, h: 1.5 m}
    formula: m * ga * h
    expected: 29.43 J
    shown: ['$E_p = 2.0 \times 9.81 \times 1.5 = 29.43$ J']
    source: {cite: mit, at: 'Gravitational potential energy, h measured from the reference point (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-floor-change
    where: 'same: change 0 − 29.43 = −29.43 J'
    inputs: {e: 29.43 J}
    formula: 0 - e
    expected: -29.43 J
    shown: ['$0 - 29.43 = -29.43$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-shelf-street-h
    where: 'same: street as zero, h = 6.0 + 1.5 = 7.5 m'
    inputs: {a: 6.0 m, b: 1.5 m}
    formula: a + b
    expected: 7.5 m
    shown: ['$h = 6.0 + 1.5 = 7.5$ m']
    source: {cite: reading1, at: 'Sec. 14.4.1 (choice of zero reference point) (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-street-shelf
    where: 'same: E_p = 2.0 × 9.81 × 7.5 = 147.15 J'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2, h: 7.5 m}
    formula: m * ga * h
    expected: 147.15 J
    shown: ['$E_p = 2.0 \times 9.81 \times 7.5 = 147.15$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-street-floor
    where: 'same: E_p = 2.0 × 9.81 × 6.0 = 117.72 J'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2, h: 6.0 m}
    formula: m * ga * h
    expected: 117.72 J
    shown: ['$E_p = 2.0 \times 9.81 \times 6.0 = 117.72$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-street-change
    where: 'same: change 117.72 − 147.15 = −29.43 J'
    inputs: {e1: 147.15 J, e2: 117.72 J}
    formula: e2 - e1
    expected: -29.43 J
    shown: ['$117.72 - 147.15 = -29.43$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-direct
    where: 'same, step "Compare": ΔE_p = 2.0 × 9.81 × (−1.5) = −29 J'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2, dh: -1.5 m}
    formula: m * ga * dh
    expected: -29 J
    tolerance: 2%
    shown: ['$\Delta E_p = m g\,\Delta h = 2.0 \times 9.81 \times (-1.5) = -29$ J', 'the change is the same: about $-29$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: pot-cellar
    where: 'same, step "Below the zero level": 2.0 × 9.81 × (−2.0) = −39 J'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2, h: -2.0 m}
    formula: m * ga * h
    expected: -39 J
    tolerance: 2%
    shown: ['$2.0 \times 9.81 \times (-2.0) = -39$ J']
    source: {cite: reading1, at: 'Sec. 14.4.1 (zero reference point chosen freely) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-slope
    where: 'graph caption: slope mg = 19.6 N'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 19.6 N
    shown: ['mg = 19.6 N']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-shift
    where: 'graph caption: the second line is shifted up by 2.0 × 9.81 × 6.0 = 118 J'
    inputs: {m: 2.0 kg, ga: 9.81 m/s**2, h: 6.0 m}
    formula: m * ga * h
    expected: 118 J
    shown: ['shifted up by 2.0 × 9.81 × 6.0 = 118 J']
    source: {cite: reading1, at: 'Sec. 14.4.1 (choice of zero reference point) (the numbers are the page''s own)'}
    origin: page-own

  # --- Path: ramp ---
  - id: ramp-sin
    where: 'worked example "Up the ramp": sin θ = 1.2/5.0 = 0.24'
    inputs: {h: 1.2 m, len: 5.0 m}
    formula: h / len
    expected: '0.24'
    shown: ['$\sin\theta = h/L = 1.2/5.0 = 0.24$']
    source: {cite: reading1, at: 'Sec. 14.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-force
    where: 'same: F = 40 × 9.81 × 0.24 = 94.18 N'
    inputs: {m: 40 kg, ga: 9.81 m/s**2, sn: 0.24}
    formula: m * ga * sn
    expected: 94.18 N
    shown: ['$F = m g \sin\theta = 40 \times 9.81 \times 0.24 = 94.18$ N, about 94 N']
    source: {cite: reading1, at: 'Sec. 14.2, Eqs. (14.3)–(14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-work
    where: 'same: W = 94.18 × 5.0 = 470.9 J'
    inputs: {f: 94.176 N, len: 5.0 m}
    formula: f * len
    expected: 470.9 J
    shown: ['$W = F L = 94.18 \times 5.0 = 470.9$ J, about 470 J']
    source: {cite: reading1, at: 'Sec. 14.2, Eqs. (14.3)–(14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-weight
    where: 'same, step "Straight up": weight 40 × 9.81 = 392.4 N'
    inputs: {m: 40 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 392.4 N
    shown: ['$40 \times 9.81 = 392.4$ N']
    source: {cite: reading1, at: 'Sec. 14.4.1, Eq. (14.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-straight
    where: 'same: W = 392.4 × 1.2 = 470.9 J'
    inputs: {f: 392.4 N, h: 1.2 m}
    formula: f * h
    expected: 470.9 J
    shown: ['$W = 392.4 \times 1.2 = 470.9$ J']
    source: {cite: reading1, at: 'Sec. 14.2, Eq. (14.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-ratio
    where: 'same, check: the distance is 5.0/1.2 = 4.2 times the height'
    inputs: {len: 5.0 m, h: 1.2 m}
    formula: len / h
    expected: '4.2'
    tolerance: 1%
    shown: ['$5.0/1.2 = 4.2$ times the height']
    source: {cite: reading1, at: 'Sec. 14.2 (the numbers are the page''s own)'}
    origin: page-own

  # --- Falling ball ---
  - id: ball-ep
    where: 'worked example "A dropped ball": E_p = 0.50 × 9.81 × 3.2 = 15.7 J'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, h: 3.2 m}
    formula: m * ga * h
    expected: 15.7 J
    shown: ['$0.50 \times 9.81 \times 3.2 = 15.7$ J']
    source: {cite: mit, at: 'Gravitational potential energy, objects lose their potential energy as they fall (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-speed
    where: 'same: v = √(2 × 15.7 / 0.50) = 7.92 m/s'
    inputs: {e: 15.7 J, m: 0.50 kg}
    formula: sqrt(2 * e / m)
    expected: 7.92 m/s
    shown: ['$v = \sqrt{2 \times 15.7 / 0.50} = 7.92$ m/s, about 7.9 m/s']
    source: {cite: reading1, at: 'Sec. 14.3 (the kinetic energy lost on the way up is recovered on the way down) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-free-fall
    where: 'same, check: v_f² = 0 − 2 × 9.81 × (−3.2) = 62.8 m²/s², v_f = 7.9 m/s'
    inputs: {ga: 9.81 m/s**2, dx: -3.2 m}
    formula: sqrt(-2 * ga * dx)
    expected: 7.9 m/s
    tolerance: 1%
    shown: ['= 62.8$ m²/s², so $v_f = 7.9$ m/s downwards']
    source: {cite: reading1, at: 'Sec. 14.3 (the numbers are the page''s own; the equation of motion is lesson 1.7''s)'}
    origin: page-own

  - id: ball-vsq
    where: 'same: v_f² = 2 × 9.81 × 3.2 = 62.8 m²/s²'
    inputs: {ga: 9.81 m/s**2, dx: -3.2 m}
    formula: -2 * ga * dx
    expected: 62.8 m**2/s**2
    shown: ['0 - 2 \times 9.81 \times (-3.2)']
    source: {cite: reading1, at: 'Sec. 14.3 (the numbers are the page''s own)'}
    origin: page-own

  # --- Spring ---
  - id: spring-final-force
    where: 'section "Energy in a stretched spring": final force 200 × 0.10 = 20 N, average 10 N'
    inputs: {k: 200 N/m, x: 0.10 m}
    formula: k * x
    expected: 20 N
    shown: ['a final force of 20 N, an average force of 10 N']
    source: {cite: reading1, at: 'Sec. 14.4.2, Eq. (14.8) (the numbers are the page''s own; k = 200 N/m is lesson 2.7''s toy spring)'}
    origin: page-own

  - id: spring-energy
    where: 'same: ½ × 200 × 0.10² = 1.0 J'
    inputs: {k: 200 N/m, x: 0.10 m}
    formula: k * x**2 / 2
    expected: 1.0 J
    shown: ['$\tfrac{1}{2} \times 200 \times 0.10^{2} = 1.0$ J']
    source: {cite: reading1, at: 'Sec. 14.4.2, Eq. (14.12) (the numbers are the page''s own)'}
    origin: page-own

  # --- Far from the Earth ---
  - id: earth-radius
    kind: fact
    where: 'section "Far from the Earth": the Earth''s radius of 6371 km'
    value: 6371 km
    shown: ['the Earth''s radius of 6371 km']
    source: {cite: reading1, at: 'Sec. 14.4.3 (the mean radius 6371 km is the value of lesson 2.11, NASA Earth Fact Sheet)'}
    origin: later-data

  - id: station-height
    kind: fact
    where: 'same: the space station about 400 km up (as in lesson 2.11)'
    value: 400 km
    shown: ['At the height of the space station, about 400 km up']
    source: {cite: reading1, at: 'Sec. 14.4.3 (the height of about 400 km is lesson 2.11''s, from NASA''s page What Is Microgravity?)'}
    origin: later-data

  - id: g-station
    where: 'same: g at 400 km is about 8.7 m/s²'
    inputs: {ga: 9.81 m/s**2, R: 6371 km, h: 400 km}
    formula: ga * R**2 / (R + h)**2
    expected: 8.7 m/s**2
    tolerance: 1%
    shown: ['$g$ is only about 8.7 m/s²']
    source: {cite: reading1, at: 'Sec. 14.4.3, Eq. (14.13) (inverse square force) (the numbers are the page''s own)'}
    origin: page-own

  - id: g-station-percent
    where: 'same: about 11.5% less than on the ground'
    inputs: {R: 6371 km, h: 400 km}
    formula: 100 * (1 - R**2 / (R + h)**2)
    expected: '11.5'
    tolerance: 1%
    shown: ['about 11.5% less than on the ground']
    source: {cite: reading1, at: 'Sec. 14.4.3, Eq. (14.13) (the numbers are the page''s own)'}
    origin: page-own

  - id: mgh-400km
    where: 'same: mgh for 1.0 kg lifted 400 km gives 3.9 × 10⁶ J'
    inputs: {m: 1.0 kg, ga: 9.81 m/s**2, h: 400000 m}
    formula: m * ga * h
    expected: 3.9e6 J
    tolerance: 1%
    shown: ['$1.0 \times 9.81 \times 400\,000 = 3.9 \times 10^{6}$ J']
    source: {cite: mit, at: 'Gravitational potential energy, E_P = mgh with g treated as constant (the numbers are the page''s own)'}
    origin: page-own

  - id: exact-400km
    where: 'same: the correct value, GMm(1/R − 1/(R+h)) = g R h/(R + h) m, about 3.7 × 10⁶ J'
    inputs: {m: 1.0 kg, ga: 9.81 m/s**2, R: 6371 km, h: 400 km}
    formula: m * ga * R * h / (R + h)
    expected: 3.7e6 J
    tolerance: 1%
    shown: ['the correct value, from a formula that allows for the weakening of gravity, is about $3.7 \times 10^{6}$ J']
    source: {cite: reading1, at: 'Sec. 14.4.3, Eq. (14.15), ΔU = −Gm₁m₂/r_f + Gm₁m₂/r_i, with GM = gR² (the numbers are the page''s own)'}
    origin: page-own
