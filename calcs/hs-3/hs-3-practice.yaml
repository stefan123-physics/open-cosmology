# Calculations on content/year-0/hs-3/hs-3-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8). All problems and numbers are our own.
# Constants as in the Block 2 and 3 lessons: g = 9.81 m/s², G = 6.674e-11 N m²/kg², Earth 5.97e24 kg and 6.371e6 m.

