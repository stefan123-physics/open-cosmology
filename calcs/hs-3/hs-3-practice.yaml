    shown: ['take $g = 9.81\ \text{m/s}^2$ near the Earth''s surface']
    source: {cite: reading2, at: 'Gravitational potential energy (g = 9.8 m/s², as in the lessons)'}
    origin: page-own

  - id: hs3p-intro-G
    kind: fact
    where: 'Introduction: G = 6.674 × 10⁻¹¹ N m²/kg² (CODATA 6.674 30 × 10⁻¹¹, rounded as in lessons 2.11 and 3.11)'
