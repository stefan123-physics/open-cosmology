# Calculations on content/year-0/hs-3/collisions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 12, 2.4 Conservation of momentum (mit), its Collisions, Elastic collisions
# and Inelastic collisions parts; MIT 8.01SC Course Notes Ch. 15 Collision Theory (reading1).
# All numbers are the page's own: none of Siyavula's (0.3 kg pool balls at 2 m/s, 50 g and 100 g marbles at 3 m/s,
# 150 g billiard balls at 2 and 1.5 m/s, 500 kg cars at 2 m/s, 4500 kg truck and 1000 kg car at 20 and 15 m/s,
# 900 kg cars at 15 and 20 m/s, 1 kg toy car and 1.5 kg train, 5000 kg jet and 50 kg missile, 50 g bullet and 2 kg block)
# or MIT's (Example 15.1 with m2 = 2 m1, giving −1/3 and 2/3; Example 15.5 at 3.0 m/s and 30°, 2.6 and 1.5 m/s) are reused.

page: content/year-0/hs-3/collisions.mdx
calcs:
  # --- Quiz ---
  - id: quiz-trolleys-lost
    where: 'quiz 1: 5.0 − 3.2 = 1.8 J lost'
    inputs: {a: 5.0 J, b: 3.2 J}
    formula: a - b
    expected: 1.8 J
    shown: ['$5.0 - 3.2 = 1.8$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), total kinetic energy not conserved (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-carts-vf
    where: 'quiz 2: v_f = 2.0 × 3.0 / 3.0 = 2.0 m/s'
    inputs: {m1: 2.0 kg, v1: 3.0 m/s, m2: 1.0 kg}
    formula: m1 * v1 / (m1 + m2)
    expected: 2.0 m/s
    shown: ['$v_f = 6.0 / 3.0 = 2.0$ m/s']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), Worked example 14, objects that stick together (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-carts-ek-before
    where: 'quiz 2: ½ × 2.0 × 3.0² = 9.0 J'
    inputs: {m: 2.0 kg, v: 3.0 m/s}
    formula: m * v**2 / 2
    expected: 9.0 J
    shown: ['$\\tfrac{1}{2} \\times 2.0 \\times 3.0^{2} = 9.0$ J']
    source: {cite: mit, at: 'Elastic collisions (ESCJH), kinetic energy of each object (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-carts-ek-after
    where: 'quiz 2: ½ × 3.0 × 2.0² = 6.0 J'
    inputs: {m: 3.0 kg, v: 2.0 m/s}
    formula: m * v**2 / 2
    expected: 6.0 J
    shown: ['$\\tfrac{1}{2} \\times 3.0 \\times 2.0^{2} = 6.0$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-carts-fraction
    where: 'quiz 2: 3.0 / 9.0 = one third lost'
    inputs: {m1: 2.0 kg, v1: 3.0 m/s, m2: 1.0 kg}
    formula: (m1 * v1**2 / 2 - (m1 + m2) * (m1 * v1 / (m1 + m2))**2 / 2) / (m1 * v1**2 / 2)
    expected: '0.3333'
    tolerance: '0.001'
    shown: ['So $3.0 / 9.0$, one third, is lost']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-carts-rule
    where: 'quiz 2: m2/(m1 + m2) = 1.0/3.0'
    inputs: {m1: 2.0 kg, m2: 1.0 kg}
    formula: m2 / (m1 + m2)
    expected: '0.3333'
    tolerance: '0.001'
    shown: ['$m_2/(m_1 + m_2) = 1.0/3.0$']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-snooker
    where: 'quiz 3: equal masses swap velocities, second ball moves off at 1.8 m/s'
    inputs: {m1: 0.17 kg, m2: 0.17 kg, v1: 1.8 m/s}
    formula: 2 * m1 / (m1 + m2) * v1
    expected: 1.8 m/s
    shown: ['the second takes the first ball''s (1.8 m/s)']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.21) (the numbers are the page''s own; any equal masses)'}
    origin: page-own

  - id: quiz-snooker-stick
    where: 'quiz 3: sticking together gives 0.90 m/s'
    inputs: {v1: 1.8 m/s}
    formula: v1 / 2
    expected: 0.90 m/s
    shown: ['Moving on together at 0.90 m/s']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), objects that stick together (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-explosion-v
    where: 'quiz 5: 1.0 × 6.0 + 2.0 v = 0 gives v = −3.0 m/s'
    inputs: {m1: 1.0 kg, v1: 6.0 m/s, m2: 2.0 kg}
    formula: -m1 * v1 / m2
    expected: -3.0 m/s
    shown: ['$v = -3.0$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), total momentum before and after an explosion (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-explosion-ek
    where: 'quiz 5: ½ × 1.0 × 6.0² + ½ × 2.0 × 3.0² = 18 + 9.0 = 27 J'
    inputs: {m1: 1.0 kg, v1: 6.0 m/s, m2: 2.0 kg, v2: 3.0 m/s}
    formula: m1 * v1**2 / 2 + m2 * v2**2 / 2
    expected: 27 J
    shown: ['$\\tfrac{1}{2} \\times 1.0 \\times 6.0^{2} + \\tfrac{1}{2} \\times 2.0 \\times 3.0^{2} = 18 + 9.0 = 27$ J']
    source: {cite: reading1, at: 'Sec. 15.3, Eq. (15.3.5), kinetic energy increases (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Is this collision elastic?" ---
  - id: check-p-before
    where: 'ball: 0.50 × 4.0 = 2.0 kg·m/s'
    inputs: {m: 0.50 kg, v: 4.0 m/s}
    formula: m * v
    expected: 2.0 kg*m/s
    shown: ['$0.50 \times 4.0 + 0 = 2.0$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), total momentum before (the numbers are the page''s own)'}
    origin: page-own

  - id: check-block-p
    where: '1.5 v = 2.0 + 0.50 = 2.5 kg·m/s'
    inputs: {m1: 0.50 kg, v1: 4.0 m/s, w1: -1.0 m/s}
    formula: m1 * v1 - m1 * w1
    expected: 2.5 kg*m/s
    shown: ['$1.5\,v_{2,f} = 2.5$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: check-block-v
    where: 'block: 2.5 / 1.5 ≈ 1.7 m/s'
    inputs: {m1: 0.50 kg, v1: 4.0 m/s, w1: -1.0 m/s, m2: 1.5 kg}
    formula: (m1 * v1 - m1 * w1) / m2
    expected: 1.7 m/s
    tolerance: 0.05 m/s
    shown: ['$v_{2,f} = 2.5 / 1.5 \approx 1.7$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: check-ek-before
    where: 'kinetic energy before: ½ × 0.50 × 4.0² = 4.0 J'
    inputs: {m: 0.50 kg, v: 4.0 m/s}
    formula: m * v**2 / 2
    expected: 4.0 J
    shown: ['$\tfrac{1}{2} \times 0.50 \times 4.0^{2} = 4.0$ J']
    source: {cite: mit, at: 'Elastic collisions (ESCJH), total kinetic energy before (the numbers are the page''s own)'}
    origin: page-own

  - id: check-ek-ball-after
    where: 'ball after: ½ × 0.50 × 1.0² = 0.25 J'
    inputs: {m: 0.50 kg, v: 1.0 m/s}
    formula: m * v**2 / 2
    expected: 0.25 J
    shown: ['$\tfrac{1}{2} \times 0.50 \times 1.0^{2} + \tfrac{1}{2} \times 1.5 \times 1.67^{2} \approx 0.25 + 2.08 \approx 2.3$ J']
    source: {cite: mit, at: 'Elastic collisions (ESCJH), total kinetic energy after (the numbers are the page''s own)'}
    origin: page-own

  - id: check-ek-block-after
    where: 'block after: ½ × 1.5 × (5/3)² ≈ 2.08 J'
    inputs: {m: 1.5 kg, v: 1.6667 m/s}
    formula: m * v**2 / 2
    expected: 2.08 J
    tolerance: 0.005 J
    shown: ['$\tfrac{1}{2} \times 0.50 \times 1.0^{2} + \tfrac{1}{2} \times 1.5 \times 1.67^{2} \approx 0.25 + 2.08 \approx 2.3$ J']
    source: {cite: mit, at: 'Elastic collisions (ESCJH) (the numbers are the page''s own)'}
    origin: page-own

  - id: check-ek-after
    where: 'total after ≈ 2.3 J'
    inputs: {m1: 0.50 kg, w1: 1.0 m/s, m2: 1.5 kg, w2: 1.6667 m/s}
    formula: m1 * w1**2 / 2 + m2 * w2**2 / 2
    expected: 2.3 J
    tolerance: 0.05 J
    shown: ['$\tfrac{1}{2} \times 0.50 \times 1.0^{2} + \tfrac{1}{2} \times 1.5 \times 1.67^{2} \approx 0.25 + 2.08 \approx 2.3$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), total kinetic energy not conserved (the numbers are the page''s own)'}
    origin: page-own

  - id: check-ek-lost
    where: 'lost about 1.7 J'
    inputs: {a: 4.0 J, b: 2.3333 J}
    formula: a - b
    expected: 1.7 J
    tolerance: 0.05 J
    shown: ['dropped by about 1.7 J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: check-ek-percent
    where: 'some 42% of the starting 4.0 J'
    inputs: {a: 4.0 J, b: 2.3333 J}
    formula: 100 * (a - b) / a
    expected: '42'
    tolerance: '0.5'
    shown: ['some 42% of the starting 4.0 J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: check-p-after
    where: 'check: −0.50 + 1.5 × 1.667 = 2.0 kg·m/s'
    inputs: {m1: 0.50 kg, w1: -1.0 m/s, m2: 1.5 kg, w2: 1.6667 m/s}
    formula: m1 * w1 + m2 * w2
    expected: 2.0 kg*m/s
    tolerance: 0.001 kg*m/s
    shown: ['$-0.50 + 1.5 \times 1.667 = 2.0$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A lump of clay hits a trolley" ---
  - id: clay-p
    where: 'clay: 0.20 × 5.0 = 1.0 kg·m/s'
    inputs: {m: 0.20 kg, v: 5.0 m/s}
    formula: m * v
    expected: 1.0 kg*m/s
    shown: ['$0.20 \times 5.0 = 1.0$ kg·m/s']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), Worked example 14 (the numbers are the page''s own)'}
    origin: page-own

  - id: clay-vf
    where: 'common velocity: 1.0 / 1.00 = 1.0 m/s'
    inputs: {m1: 0.20 kg, v1: 5.0 m/s, m2: 0.80 kg}
    formula: m1 * v1 / (m1 + m2)
    expected: 1.0 m/s
    shown: ['$(0.20 + 0.80)\,v_f = 1.0$, so $v_f = 1.0$ m/s']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), Worked example 14 (the numbers are the page''s own)'}
    origin: page-own

  - id: clay-ek-before
    where: 'before: ½ × 0.20 × 5.0² = 2.5 J'
    inputs: {m: 0.20 kg, v: 5.0 m/s}
    formula: m * v**2 / 2
    expected: 2.5 J
    shown: ['$\tfrac{1}{2} \times 0.20 \times 5.0^{2} = 2.5$ J']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: clay-ek-after
    where: 'after: ½ × 1.00 × 1.0² = 0.50 J'
    inputs: {m: 1.00 kg, v: 1.0 m/s}
    formula: m * v**2 / 2
    expected: 0.50 J
    shown: ['$\tfrac{1}{2} \times 1.00 \times 1.0^{2} = 0.50$ J']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: clay-lost
    where: '2.0 J lost, 80%'
    inputs: {a: 2.5 J, b: 0.50 J}
    formula: a - b
    expected: 2.0 J
    shown: ['So 2.0 J is lost, 80% of the starting kinetic energy']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: clay-percent
    where: '80% of the starting kinetic energy'
    inputs: {a: 2.5 J, b: 0.50 J}
    formula: 100 * (a - b) / a
    expected: '80'
    shown: ['So 2.0 J is lost, 80% of the starting kinetic energy']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: clay-rule
    where: 'check: m2/(m1 + m2) = 0.80 / 1.00 = 0.80'
    inputs: {m1: 0.20 kg, m2: 0.80 kg}
    formula: m2 / (m1 + m2)
    expected: '0.80'
    shown: ['$m_2 / (m_1 + m_2) = 0.80 / 1.00 = 0.80$']
    source: {cite: reading1, at: 'Example 15.2, Eq. (15.5.5) (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "Elastic head-on collisions" ---
  - id: gliders-p
    where: 'gliders: 0.25 × (2.5 − 1.5) = 0.25 kg·m/s'
    inputs: {m: 0.25 kg, v1: 2.5 m/s, v2: -1.5 m/s}
    formula: m * v1 + m * v2
    expected: 0.25 kg*m/s
    shown: ['$0.25 \times (2.5 - 1.5) = 0.25$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eqs. (15.4.1) and (15.4.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: gliders-swap
    where: 'gliders after: v1f = v2i = −1.5 m/s from the general formula'
    inputs: {m1: 0.25 kg, m2: 0.25 kg, v1: 2.5 m/s, v2: -1.5 m/s}
    formula: (m1 - m2) / (m1 + m2) * v1 + 2 * m2 / (m1 + m2) * v2
    expected: -1.5 m/s
    shown: ['bounce apart at −1.5 m/s and +2.5 m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eqs. (15.4.14) and (15.4.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-ratio3-incoming
    where: 'plot caption: target three times as heavy, incoming (1 − 3)/(1 + 3) = −0.50'
    inputs: {x: 3}
    formula: (1 - x) / (1 + x)
    expected: '-0.50'
    shown: ['bounces back at half its speed (−0.50)']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.14) with v₂,ᵢ = 0 (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-ratio3-target
    where: 'plot caption: target 2/(1 + 3) = 0.50'
    inputs: {x: 3}
    formula: 2 / (1 + x)
    expected: '0.50'
    shown: ['the target moves off at half (0.50)']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.17) with v₂,ᵢ = 0 (the numbers are the page''s own)'}
    origin: page-own

  - id: bowling
    where: 'bowling ball 7.0 kg at 2.0 m/s on a 0.0027 kg ball: just under 4.0 m/s'
    inputs: {m1: 7.0 kg, m2: 0.0027 kg, v1: 2.0 m/s}
    formula: 2 * m1 / (m1 + m2) * v1
    expected: 3.998 m/s
    tolerance: 0.001 m/s
    shown: ['$\frac{2 \times 7.0}{7.0027} \times 2.0$, just under 4.0 m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eqs. (15.4.17) and (15.4.19) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Two trolleys with spring bumpers" ---
  - id: bumpers-v1
    where: 'v1f = (0.60 − 0.40)/1.00 × 3.0 = 0.60 m/s'
    inputs: {m1: 0.60 kg, m2: 0.40 kg, v1: 3.0 m/s}
    formula: (m1 - m2) / (m1 + m2) * v1
    expected: 0.60 m/s
    shown: ['$v_{1,f} = \frac{0.60 - 0.40}{1.00} \times 3.0 = 0.60$ m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.14) (the numbers are the page''s own)'}
    origin: page-own

  - id: bumpers-v2
    where: 'v2f = 2 × 0.60/1.00 × 3.0 = 3.6 m/s'
    inputs: {m1: 0.60 kg, m2: 0.40 kg, v1: 3.0 m/s}
    formula: 2 * m1 / (m1 + m2) * v1
    expected: 3.6 m/s
    shown: ['$v_{2,f} = \frac{2 \times 0.60}{1.00} \times 3.0 = 3.6$ m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.17) (the numbers are the page''s own)'}
    origin: page-own

  - id: bumpers-p-before
    where: 'momentum before: 0.60 × 3.0 = 1.8 kg·m/s'
    inputs: {m: 0.60 kg, v: 3.0 m/s}
    formula: m * v
    expected: 1.8 kg*m/s
    shown: ['Before: $0.60 \times 3.0 = 1.8$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: bumpers-p-after
    where: 'momentum after: 0.36 + 1.44 = 1.8 kg·m/s'
    inputs: {m1: 0.60 kg, w1: 0.60 m/s, m2: 0.40 kg, w2: 3.6 m/s}
    formula: m1 * w1 + m2 * w2
    expected: 1.8 kg*m/s
    shown: ['$0.60 \times 0.60 + 0.40 \times 3.6 = 0.36 + 1.44 = 1.8$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: bumpers-ek-before
    where: 'kinetic energy before: ½ × 0.60 × 3.0² = 2.7 J'
    inputs: {m: 0.60 kg, v: 3.0 m/s}
    formula: m * v**2 / 2
    expected: 2.7 J
    shown: ['$\tfrac{1}{2} \times 0.60 \times 3.0^{2} = 2.7$ J']
    source: {cite: mit, at: 'Elastic collisions (ESCJH) (the numbers are the page''s own)'}
    origin: page-own

  - id: bumpers-ek-after
    where: 'kinetic energy after: 0.108 + 2.592 = 2.7 J'
    inputs: {m1: 0.60 kg, w1: 0.60 m/s, m2: 0.40 kg, w2: 3.6 m/s}
    formula: m1 * w1**2 / 2 + m2 * w2**2 / 2
    expected: 2.7 J
    shown: ['$\tfrac{1}{2} \times 0.60 \times 0.60^{2} + \tfrac{1}{2} \times 0.40 \times 3.6^{2} = 0.108 + 2.592 = 2.7$ J']
    source: {cite: mit, at: 'Elastic collisions (ESCJH), total kinetic energy before = after (the numbers are the page''s own)'}
    origin: page-own

  - id: bumpers-rel
    where: 'separation speed 3.6 − 0.60 = 3.0 m/s'
    inputs: {a: 3.6 m/s, b: 0.60 m/s}
    formula: a - b
    expected: 3.0 m/s
    shown: ['$3.6 - 0.60 = 3.0$ m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eqs. (15.4.7) and (15.4.9) (the numbers are the page''s own)'}
    origin: page-own

  - id: ballblock-elastic-v1
    where: 'had it been elastic: ball (0.50 − 1.5)/2.0 × 4.0 = −2.0 m/s'
    inputs: {m1: 0.50 kg, m2: 1.5 kg, v1: 4.0 m/s}
    formula: (m1 - m2) / (m1 + m2) * v1
    expected: -2.0 m/s
    shown: ['$\frac{0.50 - 1.5}{2.0} \times 4.0 = -2.0$ m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.14) (the numbers are the page''s own)'}
    origin: page-own

  - id: ballblock-elastic-v2
    where: 'had it been elastic: block 2 × 0.50/2.0 × 4.0 = 2.0 m/s'
    inputs: {m1: 0.50 kg, m2: 1.5 kg, v1: 4.0 m/s}
    formula: 2 * m1 / (m1 + m2) * v1
    expected: 2.0 m/s
    shown: ['$\frac{2 \times 0.50}{2.0} \times 4.0 = 2.0$ m/s']
    source: {cite: reading1, at: 'Sec. 15.4.1, Eq. (15.4.17) (the numbers are the page''s own)'}
    origin: page-own

  - id: ballblock-rel-after
    where: 'relative speed after 1.67 + 1.0 ≈ 2.7 m/s'
    inputs: {a: 1.6667 m/s, b: 1.0 m/s}
    formula: a + b
    expected: 2.7 m/s
    tolerance: 0.05 m/s
    shown: ['$1.67 + 1.0 \approx 2.7$ m/s']
    source: {cite: reading1, at: 'Sec. 15.3, Eq. (15.3.1), smaller relative speed after an inelastic collision (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A firework shell bursts" ---
  - id: shell-p
    where: 'before: 1.2 × 15 = 18 kg·m/s'
    inputs: {m: 1.2 kg, v: 15 m/s}
    formula: m * v
    expected: 18 kg*m/s
    shown: ['$1.2 \times 15 = 18$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), total momentum before and after an explosion (the numbers are the page''s own)'}
    origin: page-own

  - id: shell-piece-p
    where: '0.70 v = 18 − 15 = 3.0 kg·m/s'
    inputs: {m: 1.2 kg, v: 15 m/s, m1: 0.50 kg, v1: 30 m/s}
    formula: m * v - m1 * v1
    expected: 3.0 kg*m/s
    shown: ['$0.70\,v = 3.0$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: shell-piece-v
    where: 'v = 3.0 / 0.70 ≈ 4.3 m/s'
    inputs: {m: 1.2 kg, v: 15 m/s, m1: 0.50 kg, v1: 30 m/s}
    formula: (m * v - m1 * v1) / (m - m1)
    expected: 4.3 m/s
    tolerance: 0.05 m/s
    shown: ['$v = 3.0 / 0.70 \approx 4.3$ m/s']
