# Calculations on content/year-0/hs-3/what-is-momentum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 12, 2.2 Momentum (mit); 2.3 Newton's Second Law revisited (reading1);
# 2.5 Impulse (reading2); 2.6 Physics in action: Impulse (reading3); MIT 8.01SC Course Notes Ch. 10 (reading4).
# All numbers are the page's own: none of Siyavula's (1000 kg car at 8 m/s, 250 kg motorcycle at 32 m/s, 420 g soccer ball,
# 160 g cricket ball, the Moon, 0.1 kg tennis ball 5 → 3 m/s, 58 g ball 10 → 8 m/s, 0.8 kg ball, 24 g squash ball,
# 300 kg trailer with 150 N, 156 g cricket ball 54/36 km/h in 0.13 s, the force graph of Worked example 17, the car chase)
# or MIT's (Example 10.1, b = 20 N/s over 1.0 s, 5.0 N·s) are reused. g = 9.81 m/s², written ga in the inputs.

page: content/year-0/hs-3/what-is-momentum.mdx
calcs:
  # --- Section "Momentum" ---
  - id: puck
    where: 'section "Momentum": 0.17 kg puck at 30 m/s'
    inputs: {m: 0.17 kg, v: 30 m/s}
    formula: m * v
    expected: 5.1 kg*m/s
    shown: ['$p = 0.17 \times 30 = 5.1$ kg·m/s']
    source: {cite: mit, at: '2.2 Momentum (ESCJ7), definition box (the numbers are the page''s own)'}
    origin: page-own

  - id: lorry
    where: 'same: 12 000 kg lorry at 15 m/s'
    inputs: {m: 12000 kg, v: 15 m/s}
    formula: m * v
    expected: 1.8e5 kg*m/s
    shown: ['$p = 12\,000 \times 15 = 1.8 \times 10^{5}$ kg·m/s']
    source: {cite: mit, at: '2.2 Momentum (ESCJ7), definition box (the numbers are the page''s own)'}
    origin: page-own

  - id: lorry-east
    where: 'section "Momentum is a vector": the lorry''s momentum with its direction'
    inputs: {m: 12000 kg, v: 15 m/s}
    formula: m * v
    expected: 1.8e5 kg*m/s
    shown: ['"$1.8 \times 10^{5}$ kg·m/s east"']
    source: {cite: mit, at: 'Vector nature of momentum (ESCJ8) (the numbers are the page''s own)'}
    origin: page-own

  - id: lorry-puck-ratio
    where: 'same: the lorry has about 35 000 times the puck''s momentum'
    inputs: {m1: 12000 kg, v1: 15 m/s, m2: 0.17 kg, v2: 30 m/s}
    formula: (m1 * v1) / (m2 * v2)
    expected: '35000'
    shown: ['about 35 000 times as much']
    source: {cite: mit, at: '2.2 Momentum (ESCJ7) (the numbers are the page''s own)'}
    origin: page-own

  - id: bus
    where: 'same: 9000 kg bus at 2.0 m/s'
    inputs: {m: 9000 kg, v: 2.0 m/s}
    formula: m * v
    expected: 1.8e4 kg*m/s
    shown: ['$9000 \times 2.0 = 1.8 \times 10^{4}$ kg·m/s']
    source: {cite: mit, at: 'Vector nature of momentum (ESCJ8), different objects with the same momentum (the numbers are the page''s own)'}
    origin: page-own

  - id: car-same-p
    where: 'same: 1200 kg car at 15 m/s has the same momentum'
    inputs: {m: 1200 kg, v: 15 m/s}
    formula: m * v
    expected: 1.8e4 kg*m/s
    shown: ['$1200 \times 15 = 1.8 \times 10^{4}$ kg·m/s']
    source: {cite: mit, at: 'Vector nature of momentum (ESCJ8), different objects with the same momentum (the numbers are the page''s own)'}
    origin: page-own

  - id: bus-ek
    where: 'same: kinetic energy of the bus'
    inputs: {m: 9000 kg, v: 2.0 m/s}
    formula: m * v**2 / 2
    expected: 1.8e4 J
    shown: ['$\tfrac{1}{2} \times 9000 \times 2.0^{2} = 1.8 \times 10^{4}$ J']
    source: {cite: reading4, at: 'Sec. 10.2 (momentum and speed; kinetic energy from lesson 3.2; the numbers are the page''s own)'}
    origin: page-own

  - id: car-ek
    where: 'same: kinetic energy of the car, 1.35 × 10⁵ J'
    inputs: {m: 1200 kg, v: 15 m/s}
    formula: m * v**2 / 2
    expected: 1.4e5 J
    tolerance: 0.06e5 J
    shown: ['$\tfrac{1}{2} \times 1200 \times 15^{2} \approx 1.4 \times 10^{5}$ J']
    source: {cite: reading4, at: 'Sec. 10.2 (momentum and speed; kinetic energy from lesson 3.2; the numbers are the page''s own)'}
    origin: page-own

  - id: ek-ratio
    where: 'same: the car has 7.5 times the bus''s kinetic energy'
    inputs: {m1: 1200 kg, v1: 15 m/s, m2: 9000 kg, v2: 2.0 m/s}
    formula: (m1 * v1**2) / (m2 * v2**2)
    expected: '7.5'
    shown: ['J, 7.5 times as much']
    source: {cite: reading4, at: 'Sec. 10.2 (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "Momentum is a vector" ---
  - id: trolley
    where: 'section "Momentum is a vector": 0.50 kg trolley at 4.0 m/s to the left, right positive'
    inputs: {m: 0.50 kg, v: -4.0 m/s}
    formula: m * v
    expected: -2.0 kg*m/s
    shown: ['$p = 0.50 \times (-4.0) = -2.0$ kg·m/s']
    source: {cite: mit, at: 'Vector nature of momentum (ESCJ8) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A football bouncing off a wall" ---
  - id: ball-pi
    where: 'worked example "football": p_i = 0.45 × 12'
    inputs: {m: 0.45 kg, v: 12 m/s}
    formula: m * v
    expected: 5.4 kg*m/s
    shown: ['$p_i = 0.45 \times 12 = 5.4$ kg·m/s']
    source: {cite: mit, at: 'Change in momentum (ESCJ9), Case 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-pf
    where: 'same: p_f = 0.45 × (−9.0) = −4.05'
    inputs: {m: 0.45 kg, v: -9.0 m/s}
    formula: m * v
    expected: -4.1 kg*m/s
    shown: ['$p_f = 0.45 \times (-9.0) \approx -4.1$ kg·m/s']
    source: {cite: mit, at: 'Change in momentum (ESCJ9), Case 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-dp
    where: 'same: Δp = 0.45 × (−9.0 − 12) = −9.45'
    inputs: {m: 0.45 kg, vi: 12 m/s, vf: -9.0 m/s}
    formula: m * (vf - vi)
    expected: -9.5 kg*m/s
    shown: ['$\Delta p = p_f - p_i = 0.45 \times (-9.0 - 12) \approx -9.5$ kg·m/s']
    source: {cite: mit, at: 'Change in momentum (ESCJ9), Case 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-dp-check
    where: 'same, check: 5.4 + 4.05 = 9.45'
    inputs: {p1: 5.4 kg*m/s, p2: 4.05 kg*m/s}
    formula: p1 + p2
    expected: 9.45 kg*m/s
    shown: ['$5.4 + 4.05 = 9.45$']
    source: {cite: mit, at: 'Change in momentum (ESCJ9), Case 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-stop
    where: 'same: had the ball stopped, Δp = 0 − 5.4'
    inputs: {m: 0.45 kg, vi: 12 m/s}
    formula: 0 - m * vi
    expected: -5.4 kg*m/s
    shown: ['would only have been $-5.4$ kg·m/s']
    source: {cite: mit, at: 'Change in momentum (ESCJ9), Case 2: object stops (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-mistake
    where: 'the common mistake: 12 − 9.0 = 3.0 m/s'
    inputs: {v1: 12 m/s, v2: 9.0 m/s}
    formula: v1 - v2
    expected: 3.0 m/s
    shown: ['$12 - 9.0 = 3.0$ m/s']
    source: {cite: mit, at: 'Change in momentum (ESCJ9) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A car joining the motorway" ---
  - id: car-dp
    where: 'worked example "motorway": Δp = 1100 × (20 − 5.0)'
    inputs: {m: 1100 kg, vi: 5.0 m/s, vf: 20 m/s}
    formula: m * (vf - vi)
    expected: 1.65e4 kg*m/s
    shown: ['$\Delta p = 1100 \times (20 - 5.0) = 1.65 \times 10^{4}$ kg·m/s']
    source: {cite: reading1, at: '2.3 Newton''s Second Law revisited (ESCJB) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-force
    where: 'same: F = 1.65 × 10⁴ / 6.0'
    inputs: {dp: 1.65e4 kg*m/s, dt: 6.0 second}
    formula: dp / dt
    expected: 2.8e3 N
    shown: ['$F_{\text{net}} = \Delta p / \Delta t = 1.65 \times 10^{4} / 6.0 \approx 2.8 \times 10^{3}$ N']
    source: {cite: reading1, at: '2.3 Newton''s Second Law revisited (ESCJB), F_net = Δp/Δt (the numbers are the page''s own)'}
    origin: page-own

  - id: car-acc
    where: 'same, check: a = (20 − 5.0)/6.0'
    inputs: {vi: 5.0 m/s, vf: 20 m/s, dt: 6.0 second}
    formula: (vf - vi) / dt
    expected: 2.5 m/s**2
    shown: ['$a = (20 - 5.0)/6.0 = 2.5$ m/s²']
    source: {cite: reading1, at: '2.3 Newton''s Second Law revisited (ESCJB), F_net = ma (the numbers are the page''s own)'}
    origin: page-own

  - id: car-ma
    where: 'same, check: F = 1100 × 2.5'
    inputs: {m: 1100 kg, acc: 2.5 m/s**2}
    formula: m * acc
    expected: 2750 N
    shown: ['$F_{\text{net}} = m a = 1100 \times 2.5 = 2750$ N']
    source: {cite: reading1, at: '2.3 Newton''s Second Law revisited (ESCJB), F_net = ma (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "Impulse" ---
  - id: impulse-small-force
    where: 'section "Impulse": 2.0 N for 10 s gives 20 N·s'
    inputs: {force: 2.0 N, dt: 10 second}
    formula: force * dt
    expected: 20 N*s
    shown: ['a force of 2.0 N acting for 10 s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), definition box (the numbers are the page''s own)'}
    origin: page-own

  - id: impulse-large-force
    where: 'same: 2000 N for 0.010 s gives 20 N·s'
    inputs: {force: 2000 N, dt: 0.010 second}
    formula: force * dt
    expected: 20 N*s
    shown: ['a force of 2000 N acting for only 0.010 s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), definition box (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Hitting a golf ball" ---
  - id: golf-j
    where: 'worked example "golf": J = 0.046 × 60 = 2.76'
    inputs: {m: 0.046 kg, v: 60 m/s}
    formula: m * v
    expected: 2.8 N*s
    shown: ['$J = \Delta p = 0.046 \times (60 - 0) \approx 2.8$ N·s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), impulse-momentum theorem (the numbers are the page''s own)'}
    origin: page-own

  - id: golf-ms
    where: 'same: 0.50 ms = 5.0 × 10⁻⁴ s'
    inputs: {dt: 0.50 ms}
    formula: dt
    expected: 5.0e-4 second
    shown: ['$\Delta t = 0.50\ \text{ms} = 5.0 \times 10^{-4}$ s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK) (the numbers are the page''s own)'}
    origin: page-own

  - id: golf-f
    where: 'same: F = 2.76 / 5.0 × 10⁻⁴'
    inputs: {imp: 2.76 N*s, dt: 0.50 ms}
    formula: imp / dt
    expected: 5.5e3 N
    shown: ['$F = J / \Delta t = 2.76 / (5.0 \times 10^{-4}) \approx 5.5 \times 10^{3}$ N']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), impulse-momentum theorem (the numbers are the page''s own)'}
    origin: page-own

  - id: golf-acc
    where: 'same, check: a = 60 / 5.0 × 10⁻⁴'
    inputs: {v: 60 m/s, dt: 0.50 ms}
    formula: v / dt
    expected: 1.2e5 m/s**2
    shown: ['$a = 60 / (5.0 \times 10^{-4}) = 1.2 \times 10^{5}$ m/s²']
    source: {cite: reading1, at: '2.3 Newton''s Second Law revisited (ESCJB), F_net = ma (the numbers are the page''s own)'}
    origin: page-own

  - id: golf-ma
    where: 'same, check: 0.046 × 1.2 × 10⁵ = 5520 N'
    inputs: {m: 0.046 kg, acc: 1.2e5 m/s**2}
    formula: m * acc
    expected: 5520 N
    shown: ['$m a = 0.046 \times 1.2 \times 10^{5} = 5520$ N']
    source: {cite: reading1, at: '2.3 Newton''s Second Law revisited (ESCJB), F_net = ma (the numbers are the page''s own)'}
    origin: page-own

  - id: golf-weight
    where: 'same: weight of the ball 0.046 × 9.81'
    inputs: {m: 0.046 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 0.45 N
    shown: ['$0.046 \times 9.81 \approx 0.45$ N']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK) (weight from lesson 2.3; the numbers are the page''s own)'}
    origin: page-own

  - id: golf-ratio
    where: 'same: the club pushes with about 1.2 × 10⁴ times the ball''s weight'
    inputs: {force: 5520 N, m: 0.046 kg, ga: 9.81 m/s**2}
    formula: force / (m * ga)
    expected: '1.2e4'
    shown: ['about $1.2 \times 10^{4}$ times the ball''s weight']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK) (the numbers are the page''s own)'}
    origin: page-own

  # --- Graph and worked example "Reading the impulse of a kick from the graph" ---
  - id: kick-rise-slope
    where: 'graph: the rising line 225 t (N, t in ms) reaches 900 N at 4.0 ms'
    inputs: {peak: 900 N, tp: 4.0 ms}
    formula: peak / tp
    expected: 225 N/ms
    shown: ['it rises to 900 N at 4.0 ms']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), force-time graphs (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-fall-slope
    where: 'graph: the falling line 150 (10 − t) falls from 900 N at 4.0 ms to zero at 10 ms'
    inputs: {peak: 900 N, t1: 4.0 ms, t2: 10 ms}
    formula: peak / (t2 - t1)
    expected: 150 N/ms
    shown: ['falls back to zero at 10 ms']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), force-time graphs (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-j
    where: 'worked example "kick": J = ½ × 0.010 × 900'
    inputs: {dt: 0.010 second, peak: 900 N}
    formula: dt * peak / 2
    expected: 4.5 N*s
    shown: ['$J = \tfrac{1}{2} \times 0.010 \times 900 = 4.5$ N·s']
    source: {cite: reading4, at: 'Sec. 10.2, Example 10.1 (impulse as the area under a force–time graph; the numbers are the page''s own)'}
    origin: page-own

  - id: kick-j-integral
    where: 'same, check: the integral of the plotted force from 0 to 10 ms'
    inputs: {u: 1 ms, fu: 1 N}
    formula: "(integrate('225*x', 'x', 0, 4) + integrate('150*(10 - x)', 'x', 4, 10)) * u * fu"
    expected: 4.5 N*s
    shown: ['base 10 ms = 0.010 s and height 900 N']
    source: {cite: reading4, at: 'Sec. 10.2, Eqs. (10.2.4) and (10.2.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-v
    where: 'same: v_f = 4.5 / 0.45'
    inputs: {imp: 4.5 N*s, m: 0.45 kg}
    formula: imp / m
    expected: 10 m/s
    shown: ['$v_f = 4.5 / 0.45 = 10$ m/s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), impulse-momentum theorem (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-fave
    where: 'same: F_ave = 4.5 / 0.010 = 450 N (also the dashed line on the graph)'
    inputs: {imp: 4.5 N*s, dt: 0.010 second}
    formula: imp / dt
    expected: 450 N
    shown: ['$F_{\text{ave}} = J / \Delta t = 4.5 / 0.010 = 450$ N']
    source: {cite: reading4, at: 'Sec. 10.2, Eqs. (10.2.6) to (10.2.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-part1
    where: 'same, check: rising part ½ × 0.0040 × 900'
    inputs: {dt: 0.0040 second, peak: 900 N}
    formula: dt * peak / 2
    expected: 1.8 N*s
    shown: ['$\tfrac{1}{2} \times 0.0040 \times 900 = 1.8$ N·s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), area under the graph (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-part2
    where: 'same, check: falling part ½ × 0.0060 × 900'
    inputs: {dt: 0.0060 second, peak: 900 N}
    formula: dt * peak / 2
    expected: 2.7 N*s
    shown: ['$\tfrac{1}{2} \times 0.0060 \times 900 = 2.7$ N·s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), area under the graph (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-sum
    where: 'same, check: 1.8 + 2.7 = 4.5'
    inputs: {j1: 1.8 N*s, j2: 2.7 N*s}
    formula: j1 + j2
    expected: 4.5 N*s
    shown: ['$1.8 + 2.7 = 4.5$ N·s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), area under the graph (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "An airbag in a crash" ---
  - id: crash-kmh
    where: 'worked example "airbag": 15 m/s = 54 km/h'
    inputs: {v: 15 m/s}
    formula: v
    expected: 54 km/hour
    shown: ['15 m/s (54 km/h)']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN) (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-dp
    where: 'same: 70 × 15 = 1050 kg·m/s'
    inputs: {m: 70 kg, v: 15 m/s}
    formula: m * v
    expected: 1.05e3 kg*m/s
    shown: ['$70 \times 15 = 1.05 \times 10^{3}$ kg·m/s']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN) (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-wheel
    where: 'same: stopped in 0.010 s'
    inputs: {dp: 1050 kg*m/s, dt: 0.010 second}
    formula: dp / dt
    expected: 1.1e5 N
    shown: ['$F = 1.05 \times 10^{3} / 0.010 \approx 1.1 \times 10^{5}$ N']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN), F = Δp/Δt (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-airbag
    where: 'same: stopped in 0.15 s'
    inputs: {dp: 1050 kg*m/s, dt: 0.15 second}
    formula: dp / dt
    expected: 7.0e3 N
    shown: ['$F = 1.05 \times 10^{3} / 0.15 = 7.0 \times 10^{3}$ N']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN), F = Δp/Δt (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-ratio
    where: 'same: 0.15 / 0.010 = 15'
    inputs: {t1: 0.15 second, t2: 0.010 second}
    formula: t1 / t2
    expected: '15'
    shown: ['$0.15 / 0.010 = 15$']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN) (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-weight
    where: 'same: weight 70 × 9.81 = 687 N'
    inputs: {m: 70 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 690 N
    tolerance: 5 N
    shown: ['$70 \times 9.81 \approx 690$ N']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN) (weight from lesson 2.3; the numbers are the page''s own)'}
    origin: page-own

  - id: crash-airbag-weights
    where: 'same: the airbag pushes with about 10 times her weight'
    inputs: {force: 7000 N, m: 70 kg, ga: 9.81 m/s**2}
    formula: force / (m * ga)
    expected: '10'
    tolerance: '0.5'
    shown: ['about 10 times her weight']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN) (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-wheel-weights
    where: 'same: the steering wheel would push with about 150 times her weight'
    inputs: {force: 1.05e5 N, m: 70 kg, ga: 9.81 m/s**2}
    formula: force / (m * ga)
    expected: '150'
    tolerance: '5'
    shown: ['about 150 times her weight']
    source: {cite: reading3, at: 'Air-bags in motor vehicles (ESCJN) (the numbers are the page''s own)'}
    origin: page-own

  - id: crash-impulse
    where: 'same: the impulse is the change in momentum, 1050 N·s'
    inputs: {m: 70 kg, v: 15 m/s}
    formula: m * v
    expected: 1.05e3 N*s
    shown: ['The impulse, about $1.05 \times 10^{3}$ N·s']
    source: {cite: reading2, at: '2.5 Impulse (ESCJK), impulse-momentum theorem (the numbers are the page''s own)'}
    origin: page-own

  # --- Crumple zones: the bounce ---
  - id: crumple-stop
    where: 'section "Safety": 1500 kg car stops from 14 m/s'
    inputs: {m: 1500 kg, v: 14 m/s}
    formula: m * v
    expected: 2.1e4 kg*m/s
    shown: ['$\Delta p = 1500 \times 14 = 2.1 \times 10^{4}$ kg·m/s']
    source: {cite: reading3, at: 'Crumple zones in cars (ESCJS) (the numbers are the page''s own)'}
    origin: page-own

  - id: crumple-bounce
    where: 'same: bouncing back at 2.0 m/s'
    inputs: {m: 1500 kg, vi: 14 m/s, vb: 2.0 m/s}
    formula: m * (vi + vb)
    expected: 2.4e4 kg*m/s
    shown: ['$1500 \times (14 + 2.0) = 2.4 \times 10^{4}$ kg·m/s']
    source: {cite: reading3, at: 'Crumple zones in cars (ESCJS) (the numbers are the page''s own)'}
    origin: page-own

  - id: crumple-percent
    where: 'same: about 14% more'
    inputs: {vi: 14 m/s, vb: 2.0 m/s}
    formula: ((vi + vb) / vi - 1) * 100
    expected: '14'
    shown: ['about 14% more']
    source: {cite: reading3, at: 'Crumple zones in cars (ESCJS) (the numbers are the page''s own)'}
    origin: page-own

  # --- Quiz ---
  - id: quiz-bounce
    where: 'quiz 2: Δp = 0.20 × (−11 − 14) = −5.0'
    inputs: {m: 0.20 kg, vi: 14 m/s, vf: -11 m/s}
    formula: m * (vf - vi)
    expected: -5.0 kg*m/s
