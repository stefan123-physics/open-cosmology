# Calculations on content/year-0/hs-3/towards-the-universe-expanding-ball.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.286 (Fall 2013, Guth) Lecture 6 transcript (reading1) and slides (reading2), Lecture 7 transcript
# (reading3) and slides (reading4); NIST CODATA G (nist-G) and proton mass (nist-mp).
# H0 = 70 km/s/Mpc is the site's round example value (calcs/values.yaml); Guth's own check uses Planck 2013, h0 = 0.67.
# The probe numbers (8.0 and 12.0 km/s, GM/R = 6.256e7 J/kg, R = 6371 km) are those of lesson 3.11 (escape-speed).
# All other example numbers are the page's own.

page: content/year-0/hs-3/towards-the-universe-expanding-ball.mdx
calcs:
  # --- Summary (frontmatter) ---
  - id: summary-rho-c
    where: 'summary: critical density for H = 70 km/s/Mpc, about 9 × 10⁻²⁷ kg/m³'
    inputs: {H: 70 km/s/Mpc, G: 6.674e-11 m**3/(kg*s**2)}
    formula: 3 * H**2 / (8 * pi * G)
    expected: 9e-27 kg/m**3
    shown: ['about 9 × 10⁻²⁷ kg/m³ (five or six hydrogen atoms per cubic metre) for H = 70 km/s/Mpc']
    source: {cite: reading3, at: 'p. 20 (board), the formula; the numbers are the page''s own'}
    origin: page-own

  # --- Section "A ball of galaxies" ---
  - id: hubble-70-per-mpc
    where: 'section "A ball of galaxies": with H = 70 km/s/Mpc a galaxy 1 Mpc further away recedes 70 km/s faster'
    inputs: {H: 70 km/s/Mpc, d: 1 Mpc}
    formula: H * d
    expected: 70 km/s
    shown: ['recedes about 70 km/s faster']
    source: {cite: reading2, at: 'slide 8, v_i = H_i r (the value of H is the site''s round example value)'}
    origin: page-own

  # --- Section "The escape-speed question again" (lesson 3.11's probes) ---
  - id: probe-escape-speed
    where: 'section "The escape-speed question again": the Earth''s escape speed 11.2 km/s, from GM/R = 6.256e7 J/kg (lesson 3.11)'
    inputs: {GMR: 6.256e7 m**2/s**2}
    formula: sqrt(2 * GMR)
    expected: 11.2 km/s
    shown: ['less than the escape speed of 11.2 km/s']
    source: {cite: reading1, at: 'pp. 28–29 (the energy of a particle on the boundary; the probe numbers are lesson 3.11''s own)'}
    origin: page-own

  - id: probe-height
    where: 'same: a probe fired up at 8.0 km/s climbs about 6700 km (r_max = GM/(GM/R − v²/2), height r_max − R)'
    inputs: {GMR: 6.256e7 m**2/s**2, R: 6.371e6 m, v: 8.0 km/s}
    formula: GMR * R / (GMR - v**2 / 2) - R
    expected: 6.7e3 km
    shown: ['a probe climbs about 6700 km and falls back']
    source: {cite: reading1, at: 'pp. 28–29 (the probe numbers are lesson 3.11''s own)'}
    origin: page-own

  - id: probe-fast-escapes
    where: 'same: at 12.0 km/s the energy per kg, ½v² − GM/R, is positive (7.2e7 − 6.256e7 J/kg), so the probe escapes'
    inputs: {GMR: 6.256e7 m**2/s**2, v: 12.0 km/s}
    formula: v**2 / 2 - GMR
    expected: 9.4e6 J/kg
    tolerance: 0.1e6 J/kg
    shown: ['At 12.0 km/s it escapes and keeps a little speed for ever']
    source: {cite: reading1, at: 'pp. 28–29 (the probe numbers are lesson 3.11''s own)'}
    origin: page-own

  # --- Section "The critical density" ---
  - id: zero-energy-line
    kind: identity
    where: 'formula "Energy zero: the dividing line": with v = Hr and M = (4/3)πr³ρ, ½v² − GM/r = r²(½H² − (4/3)πGρ), so r² cancels'
    formula: 0.5 * (H * r)**2 - g * (4 / 3 * pi * r**3 * rho) / r
    equals: r**2 * (0.5 * H**2 - 4 / 3 * pi * g * rho)
    samples:
      H: [2.268e-18, 1.0, 3.0, 0.5]
      r: [3.0e24, 1.0, 2.5, 7.0]
      g: [6.674e-11, 1.0, 0.3, 2.0]
      rho: [9.2e-27, 0.2, 5.0, 0.01]
    shown: ['tex="\tfrac{1}{2}\,H^{2} r^{2} = \frac{4}{3}\pi G \rho\, r^{2}"']
    source: {cite: reading3, at: 'p. 20 (board), the critical case E = 0 (this form is the page''s own)'}
    origin: page-own

  - id: critical-density-solves
    kind: identity
    where: 'formula "Critical density": ρ_c = 3H²/(8πG) makes the energy per kg of the edge zero for every r'
    formula: 4 / 3 * pi * g * (3 * H**2 / (8 * pi * g)) * r**2
    equals: 0.5 * H**2 * r**2
    samples:
      H: [2.268e-18, 1.0, 3.0, 0.5]
      r: [3.0e24, 1.0, 2.5, 7.0]
      g: [6.674e-11, 1.0, 0.3, 2.0]
    shown: ['tex="\rho_c = \frac{3 H^{2}}{8\pi G}"']
    source: {cite: reading3, at: 'p. 20 (board)'}
    origin: mit

  # --- Worked example "The critical density today" ---
  - id: G-value
    kind: fact
    where: 'worked example "The critical density today", problem: G = 6.674e-11 N m²/kg²'
    value: 6.674e-11 m**3/(kg*s**2)
    shown: ['and $G = 6.674 \times 10^{-11}$ N m²/kg²']
    source: {cite: nist-G, at: '6.674 30 × 10⁻¹¹ m³ kg⁻¹ s⁻², rounded'}
    origin: later-data

  - id: hydrogen-mass
    kind: fact
    where: 'same: a hydrogen atom has a mass of about 1.67e-27 kg (the proton, 1.6726e-27 kg; the electron adds 1/1836)'
    value: 1.67e-27 kg
    shown: ['A hydrogen atom has a mass of about $1.67 \times 10^{-27}$ kg']
    source: {cite: nist-mp, at: 'proton mass 1.672 621 925 95 × 10⁻²⁷ kg'}
    origin: later-data

  - id: mpc-metres
    where: 'same, step "The Hubble constant in SI units": 1 Mpc = 3.086e22 m; quiz 4 question'
    inputs: {d: 1 Mpc}
    formula: d
    expected: 3.086e22 m
    shown: ['a million parsecs (lesson 0.11), $3.086 \times 10^{22}$ m', 'One megaparsec is $3.086 \\times 10^{22}$ m.']
    source: {cite: reading3, at: 'p. 21 (H in km/s per Mpc); the parsec in metres is lesson 8.10''s'}
    origin: page-own

  - id: kms-ms
    where: 'same step; quiz 4 explanation: 70 km/s = 7.0e4 m/s'
    inputs: {v: 70 km/s}
    formula: v
    expected: 7.0e4 m/s
    shown: ['and $70\ \text{km/s} = 7.0 \times 10^{4}$ m/s', '$70\\ \\text{km/s} = 7.0 \\times 10^{4}$ m/s']
    source: {cite: reading3, at: 'p. 21 (the numbers are the page''s own)'}
    origin: page-own

  - id: H0-si
    where: 'same step: H0 = 7.0e4/3.086e22 = 2.268e-18 1/s'
    inputs: {v: 7.0e4 m/s, d: 3.086e22 m}
    formula: v / d
    expected: 2.268e-18 1/s
    shown: ['$H_0 = 7.0 \times 10^{4}/(3.086 \times 10^{22}) = 2.268 \times 10^{-18}\ \text{s}^{-1}$']
    source: {cite: reading3, at: 'p. 21 (the numbers are the page''s own)'}
    origin: page-own

  - id: H0-si-rounded
    where: 'quiz 4 answer and explanation; summary; flashcard 4: H0 = 70 km/s/Mpc = 2.27e-18 1/s'
    inputs: {H: 70 km/s/Mpc}
    formula: H
    expected: 2.27e-18 1/s
    quiz: 3
    shown: ['$H_0 = 7.0 \\times 10^{4}/(3.086 \\times 10^{22}) = 2.27 \\times 10^{-18}\\ \\text{s}^{-1}$', '$H_0 = 70\ \text{km/s/Mpc} = 2.27 \times 10^{-18}\ \text{s}^{-1}$', 'H = 2.27 × 10⁻¹⁸ 1/s', '"$2.27 \\times 10^{-18}\\ \\text{s}^{-1}$"']
    source: {cite: reading3, at: 'p. 21 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz4-km-slip
    where: 'quiz 4, distractor: speed left in km/s, 70/3.086e22 = 2.27e-21'
    inputs: {v: 70, d: 3.086e22}
    formula: v / d
    expected: '2.27e-21'
    shown: ['"$2.27 \\times 10^{-21}\\ \\text{s}^{-1}$"']
    source: {cite: reading3, at: 'p. 21 (the wrong step is the page''s own)'}
    origin: page-own

  - id: quiz4-mpc-km-slip
    where: 'quiz 4, distractor: m/s divided by the megaparsec in km, 7.0e4/3.086e19 = 2.27e-15'
    inputs: {v: 7.0e4, d: 3.086e19}
    formula: v / d
    expected: '2.27e-15'
    shown: ['"$2.27 \\times 10^{-15}\\ \\text{s}^{-1}$"']
    source: {cite: reading3, at: 'p. 21 (the wrong step is the page''s own)'}
    origin: page-own

  - id: quiz4-hubble-time
    where: 'quiz 4, distractor and explanation: 1/H0 = 4.41e17 s'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 4.41e17 s
    shown: ['"$4.41 \\times 10^{17}\\ \\text{s}^{-1}$"', '$4.41 \\times 10^{17}$ is $1/H_0$ in seconds']
    source: {cite: reading3, at: 'p. 21 (the numbers are the page''s own)'}
    origin: page-own

  - id: H0-squared
    where: 'worked example, step "The critical density": H0² = 5.145e-36 1/s²'
    inputs: {v: 7.0e4 m/s, d: 3.086e22 m}
    formula: (v / d)**2
    expected: 5.145e-36 1/s**2
    tolerance: 0.001e-36 1/s**2
    shown: ['$H_0^{2} = 5.145 \times 10^{-36}\ \text{s}^{-2}$']
    source: {cite: reading3, at: 'p. 20 (board) (the numbers are the page''s own)'}
    origin: page-own

  - id: eight-pi-G
    where: 'same: 8πG = 1.677e-9 N m²/kg²'
    inputs: {g: 6.674e-11 m**3/(kg*s**2)}
    formula: 8 * pi * g
    expected: 1.677e-9 m**3/(kg*s**2)
    shown: ['$8\pi G = 1.677 \times 10^{-9}$ N m²/kg²']
    source: {cite: reading3, at: 'p. 20 (board) (the numbers are the page''s own)'}
    origin: page-own

  - id: rho-c-70
    where: 'same: ρ_c = 3 × 5.145e-36/1.677e-9 = 9.20e-27 kg/m³; summary section and flashcard 4 (9.2e-27)'
    inputs: {v: 7.0e4 m/s, d: 3.086e22 m, g: 6.674e-11 m**3/(kg*s**2)}
    formula: 3 * (v / d)**2 / (8 * pi * g)
    expected: 9.20e-27 kg/m**3
    shown: ['$\rho_c = 3 \times 5.145 \times 10^{-36}/(1.677 \times 10^{-9}) = 9.20 \times 10^{-27}\ \text{kg/m}^{3}$', '$\rho_c \approx 9.2 \times 10^{-27}\ \text{kg/m}^{3}$', 'ρ_c ≈ 9.2 × 10⁻²⁷ kg/m³']
    source: {cite: reading3, at: 'p. 20 (board), the formula (the numbers are the page''s own)'}
    origin: page-own

  - id: atoms-per-m3
    where: 'same, step "In hydrogen atoms": 9.20e-27/1.67e-27 = 5.5, five or six atoms per cubic metre'
    inputs: {rho: 9.20e-27 kg/m**3, m: 1.67e-27 kg}
    formula: rho / m
    expected: 5.5 1/m**3
    shown: ['$9.20 \times 10^{-27}/(1.67 \times 10^{-27}) = 5.5$']
    source: {cite: reading3, at: 'p. 22 (Guth: about 5 protons per cubic metre for h₀ = 0.67; the numbers are the page''s own)'}
    origin: page-own

  - id: guth-rho-c-gcm3
    where: 'same, step "Check": Guth''s ρ_c = 1.88 h₀² × 10⁻²⁹ g/cm³ = 8.4e-30 g/cm³ for H ≈ 67 km/s/Mpc'
    inputs: {H: 67 km/s/Mpc}
    formula: 3 * H**2 / (8 * pi * G)
    expected: 8.4e-30 g/cm**3
    shown: ['Guth''s lecture finds $8.4 \times 10^{-30}$ g/cm³']
    source: {cite: reading3, at: 'p. 22'}
    origin: mit

  - id: guth-rho-c-kgm3
    where: 'same: 8.4e-30 g/cm³ = 8.4e-27 kg/m³'
    inputs: {rho: 8.4e-30 g/cm**3}
    formula: rho
    expected: 8.4e-27 kg/m**3
    shown: ['that is $8.4 \times 10^{-27}\ \text{kg/m}^{3}$']
    source: {cite: reading3, at: 'p. 22 (the unit conversion is the page''s own)'}
    origin: page-own

  - id: guth-protons
    where: 'same: "about 5 protons per cubic meter", 8.4e-27/1.6726e-27 = 5.0'
    inputs: {rho: 8.4e-27 kg/m**3, m: 1.67262e-27 kg}
    formula: rho / m
    expected: 5 1/m**3
    shown: ['"about 5 protons per cubic meter" (transcript p. 22)']
    source: {cite: reading3, at: 'p. 22'}
    origin: mit

  - id: scale-67-70
    where: 'same: 9.20 × (67/70)² = 8.4'
    inputs: {}
    formula: 9.20 * (67 / 70)**2
    expected: '8.4'
    shown: ['$9.20 \times (67/70)^{2} = 8.4$']
    source: {cite: reading3, at: 'p. 22 (the comparison is the page''s own)'}
    origin: page-own

  - id: h0-067
    kind: fact
    where: 'same: the Planck satellite''s 2013 Hubble constant of about 67 km/s/Mpc (Guth: h₀ = 0.67)'
    value: 67 km/s/Mpc
    shown: ['2013 Hubble constant of about $67\ \text{km/s/Mpc}$']
    source: {cite: reading3, at: 'p. 22: h₀, according to Planck, is 0.67'}
    origin: mit

  - id: water-ratio
    where: 'section after the worked example: ρ_c is about 10⁻²⁹ times the density of water (1000 kg/m³); Guth says the same for 8.4e-30 g/cm³'
    inputs: {rho: 9.20e-27 kg/m**3, w: 1000 kg/m**3}
    formula: rho / w
    expected: '1e-29'
    tolerance: '20%'
    shown: ['about $10^{-29}$ times the density of water']
    source: {cite: reading3, at: 'p. 22 (Guth compares with water in g/cm³)'}
    origin: mit

  # --- Section "How fast does the edge slow down?" ---
  - id: gm-over-r0
    kind: identity
    where: 'section "How fast does the edge slow down?": with ρ = (ρ/ρ_c)ρ_c and v₀ = Hr₀, GM/r₀ = (ρ/ρ_c) × ½v₀²'
    formula: g * (4 / 3 * pi * r0**3 * q * 3 * H**2 / (8 * pi * g)) / r0
    equals: q * 0.5 * (H * r0)**2
    samples:
      g: [6.674e-11, 1.0, 0.3]
      r0: [3.0e24, 1.0, 2.5]
      q: [2.0, 0.6, 1.25]
      H: [2.268e-18, 1.0, 3.0]
    shown: ['for any other density, $G M/r_0$ is $\rho/\rho_c$ times that']
    source: {cite: reading3, at: 'p. 20 (board) (the step is the page''s own)'}
    origin: page-own

  - id: edge-speed
    kind: identity
    where: 'formula "Speed of the edge as the ball grows": v² = v₀² − 2(GM/r₀)(1 − r₀/r) with GM/r₀ = q½v₀² gives v₀²[1 − q(1 − r₀/r)]'
    formula: v0**2 - 2 * (q * 0.5 * v0**2) * (1 - r0 / r)
    equals: v0**2 * (1 - q * (1 - r0 / r))
    samples:
      v0: [1.0, 7000.0, 2.5]
      q: [2.0, 0.6, 1.25]
      r0: [1.0, 3.0, 2.0]
      r: [1.5, 10.0, 7.0]
    shown: ['tex="v^{2} = v_0^{2}\left[1 - \frac{\rho}{\rho_c}\left(1 - \frac{r_0}{r}\right)\right]"']
    source: {cite: reading3, at: 'p. 17 (board), ȧ² = 2E + (8π/3)Gρ_i/a (this form is the page''s own)'}
    origin: page-own

  - id: edge-speed-energy
    kind: identity
    where: 'same: the formula conserves ½v² − GM/r, with GM/r = (GM/r₀)(r₀/r)'
    formula: 0.5 * v0**2 * (1 - q * (1 - r0 / r)) - q * 0.5 * v0**2 * (r0 / r)
    equals: 0.5 * v0**2 - q * 0.5 * v0**2
    samples:
      v0: [1.0, 7000.0, 2.5]
      q: [2.0, 0.6, 1.25]
      r0: [1.0, 3.0, 2.0]
      r: [1.5, 10.0, 7.0]
    shown: ['Since $G M/r = (G M/r_0)(r_0/r)$']
    source: {cite: reading1, at: 'pp. 28–29 (the conserved energy of the edge; the check is the page''s own)'}
    origin: page-own

  - id: critical-curve
    kind: identity
    where: 'plot: the dashed curve sqrt(1/x) is the slider formula with ρ/ρ_c = 1'
    formula: 1 - 1 * (1 - 1 / x)
    equals: 1 / x
    samples:
      x: [1.0, 2.0, 3.7, 6.0]
    shown: ['{ expr: "sqrt(1/x)", label: "critical", dash: true }']
    source: {cite: reading3, at: 'p. 20 (the critical case; the plot is the page''s own)'}
    origin: page-own

  # --- Worked example "A ball twice as dense as critical" ---
  - id: twice-r0-over-r
    where: 'worked example "A ball twice as dense as critical": 1 − 2(1 − r₀/r) = 0 gives r₀/r = ½'
    inputs: {q: 2}
    formula: 1 - 1 / q
    expected: '0.5'
    shown: ['so $1 - r_0/r = \tfrac12$ and $r_0/r = \tfrac12$']
    source: {cite: reading3, at: 'pp. 18–19 (a closed ball reaches a largest size; the numbers are the page''s own)'}
    origin: page-own

  - id: twice-rmax
    where: 'same: r = 2r₀; plot with the slider at 2 reaches zero at r/r₀ = 2'
    inputs: {q: 2}
    formula: q / (q - 1)
    expected: '2'
    shown: ['$r = 2 r_0$: the ball grows to **twice** its starting radius', 'the curve reaches zero at $r/r_0 = 2$']
    source: {cite: reading3, at: 'pp. 18–19 (the numbers are the page''s own)'}
    origin: page-own

  - id: q125-r0-over-r
    where: 'same, step "Check": ρ/ρ_c = 1.25 gives r₀/r = 0.2'
    inputs: {q: 1.25}
    formula: 1 - 1 / q
    expected: '0.2'
    shown: ['gives $r_0/r = 0.2$']
    source: {cite: reading3, at: 'pp. 18–19 (the numbers are the page''s own)'}
    origin: page-own

  - id: q125-rmax
    where: 'same: r = 5r₀'
    inputs: {q: 1.25}
    formula: q / (q - 1)
    expected: '5'
    shown: ['so $r = 5 r_0$']
    source: {cite: reading3, at: 'pp. 18–19 (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "What Einstein's theory says" ---
  - id: friedmann-form
    kind: identity
    where: 'formula "The expansion rate from the energy": dividing e = ½H²r² − (4/3)πGρr² by ½r² gives H² = (8π/3)Gρ + 2e/r²'
    formula: H**2
    equals: 8 * pi / 3 * g * rho + 2 / r**2 * (0.5 * H**2 * r**2 - 4 / 3 * pi * g * rho * r**2)
    samples:
      H: [2.268e-18, 1.0, 3.0]
      r: [3.0e24, 1.0, 2.5]
      g: [6.674e-11, 1.0, 0.3]
      rho: [9.2e-27, 0.2, 5.0]
    shown: ['tex="H^{2} = \frac{8\pi}{3}\,G\rho + \frac{2}{r^{2}}\cdot\frac{E_{\text{mech}}}{m}"']
    source: {cite: reading3, at: 'p. 9 (board), (ȧ/a)² − (8π/3)Gρ = 2E/a²'}
    origin: mit

  - id: friedmann-1922
    kind: fact
    where: 'same: Friedmann first derived it in 1922'
    value: '1922'
    shown: ['Alexander Friedmann first derived it in 1922']
    source: {cite: reading3, at: 'p. 9'}
    origin: mit

  # --- Section "The real universe" ---
  - id: dark-energy-share-2013
    kind: fact
    where: 'section "The real universe": Guth in 2013, dark energy about 60% or 70% of the total'
    value: '60–70 %'
    shown: ['"about 60% or 70% of the total"']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  # --- Quiz ---
  - id: quiz1-four
    where: 'quiz 1: twice H gives 2² = 4 times the critical density'
    inputs: {H: 70 km/s/Mpc}
    formula: (3 * (2 * H)**2 / (8 * pi * G)) / (3 * H**2 / (8 * pi * G))
    expected: '4'
    shown: ['$2^{2} = 4$ times the density to stop it']
    source: {cite: reading3, at: 'p. 20 (board) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz2-positive-energy
    where: 'quiz 2: density 0.6 ρ_c; energy per kg of the edge, in units of v₀², is ½(1 − 0.6) = 0.2 > 0, so it expands for ever'
    inputs: {q: 0.6}
    formula: 0.5 * (1 - q)
    expected: '0.2'
    shown: ['its density is 0.6 times the critical density']
    source: {cite: reading3, at: 'pp. 17–20 (board): E > 0, less dense than ρ_c, expands for ever (the numbers are the page''s own)'}
    origin: page-own
