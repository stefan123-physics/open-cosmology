# Calculations on content/year-0/hs-3/momentum-is-conserved.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 12, 2.4 Conservation of momentum (mit); MIT 8.01SC Course Notes Ch. 10 (reading1);
# NASA Earth Fact Sheet (earthfact) for the Earth's mass.
# All numbers are the page's own: none of Siyavula's (0.3 kg billiard balls at 1 and 0.8 m/s, 100 g golf balls 2.4/3 m/s,
# 200 and 250 kg motorcycles, 700 kg truck and 500 kg car, 1 kg toy car and 1.5 kg train, 5000 kg jet and 50 kg missile,
# 50 g bullet through a 2 kg block, 0.3 kg and 0.05/0.1 kg elastic examples, 500 kg and 900 kg cars, 4500 kg truck)
# or MIT's (Examples 10.5 and 10.6, symbolic) are reused. g = 9.81 m/s², written ga in the inputs.

page: content/year-0/hs-3/momentum-is-conserved.mdx
calcs:
  # --- Quiz ---
  - id: quiz-skateboards
    where: 'quiz 2: 50 × 1.5 + 75 v = 0 gives v = −1.0 m/s'
    inputs: {m1: 50 kg, v1: 1.5 m/s, m2: 75 kg}
    formula: -m1 * v1 / m2
    expected: -1.0 m/s
    shown: ['$v = -75/75 = -1.0$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), total momentum before = after (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-skateboards-swapped
    where: 'quiz 2, wrong choice: masses swapped, 75 × 1.5 / 50 = 2.25 m/s'
    inputs: {m1: 50 kg, v1: 1.5 m/s, m2: 75 kg}
    formula: m2 * v1 / m1
    expected: 2.25 m/s
    shown: ['The answer 2.25 m/s comes from swapping the masses']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolleys-p
    where: 'quiz 3: total momentum before 0.40 × 3.0 = 1.2 kg·m/s'
    inputs: {m: 0.40 kg, v: 3.0 m/s}
    formula: m * v
    expected: 1.2 kg*m/s
    shown: ['$0.40 \\times 3.0 = 1.2$ kg·m/s']
    source: {cite: mit, at: 'Conservation of momentum (ESCJF), total momentum (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolleys-v
    where: 'quiz 3: the joined trolleys move at 1.2 / 0.60 = 2.0 m/s'
    inputs: {m1: 0.40 kg, v1: 3.0 m/s, m2: 0.20 kg}
    formula: m1 * v1 / (m1 + m2)
    expected: 2.0 m/s
    shown: ['$v = 1.2 / 0.60 = 2.0$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), objects that stick together (the numbers are the page''s own)'}
    origin: page-own
    quiz: 2

  # --- Section "The law of conservation of momentum" ---
  - id: total-two-trolleys
    where: 'two trolleys rolling towards each other: 0.50 × 2.0 + 0.80 × (−1.5) = −0.20 kg·m/s'
    inputs: {m1: 0.50 kg, v1: 2.0 m/s, m2: 0.80 kg, v2: -1.5 m/s}
    formula: m1 * v1 + m2 * v2
    expected: -0.20 kg*m/s
    shown: ['$p_{\text{sys}} = 0.50 \times 2.0 + 0.80 \times (-1.5) = -0.20$ kg·m/s']
    source: {cite: mit, at: 'Conservation of momentum (ESCJF), total momentum as a vector sum along a line (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Two carts pushed apart by a spring" ---
  - id: carts-p2
    where: 'heavy cart: 1.2 × 0.60 = 0.72 kg·m/s'
    inputs: {m: 1.2 kg, v: 0.60 m/s}
    formula: m * v
    expected: 0.72 kg*m/s
    shown: ['$0 = 0.80\,v_{1,f} + 0.72$']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: carts-v1
    where: 'light cart: v = −0.72 / 0.80 = −0.90 m/s'
    inputs: {m1: 0.80 kg, m2: 1.2 kg, v2: 0.60 m/s}
    formula: -m2 * v2 / m1
    expected: -0.90 m/s
    shown: ['$v_{1,f} = -0.72 / 0.80 = -0.90$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: carts-mass-ratio
    where: 'check: mass ratio 1.2 / 0.80 = 1.5'
    inputs: {m1: 0.80 kg, m2: 1.2 kg}
    formula: m2 / m1
    expected: '1.5'
    shown: ['$1.2 / 0.80 = 1.5$']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  - id: carts-speed-ratio
    where: 'check: speed ratio 0.90 / 0.60 = 1.5'
    inputs: {v1: 0.90 m/s, v2: 0.60 m/s}
    formula: v1 / v2
    expected: '1.5'
    shown: ['$0.90 / 0.60 = 1.5$']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  - id: carts-check-p
    where: 'check: both carts have 0.72 kg·m/s'
    inputs: {m1: 0.80 kg, v1: 0.90 m/s}
    formula: m1 * v1
    expected: 0.72 kg*m/s
    shown: ['momenta of 0.72 kg·m/s each']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Stepping off a small boat" ---
  - id: boat-p1
    where: 'the person: 60 × 2.5 = 150 kg·m/s'
    inputs: {m: 60 kg, v: 2.5 m/s}
    formula: m * v
    expected: 150 kg*m/s
    shown: ['$140\,v_{2,f} = -150$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-v
    where: 'boat: v = −150 / 140 ≈ −1.1 m/s'
    inputs: {m1: 60 kg, v1: 2.5 m/s, m2: 140 kg}
    formula: -m1 * v1 / m2
    expected: -1.1 m/s
    tolerance: 0.03 m/s
    shown: ['$v_{2,f} = -150 / 140 \approx -1.1$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-check
    where: 'check: 140 × 1.07 ≈ 150 kg·m/s'
    inputs: {m: 140 kg, v: 1.07 m/s}
    formula: m * v
    expected: 150 kg*m/s
    tolerance: 1 kg*m/s
    shown: ['$140 \times 1.07 \approx 150$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "The recoil of a cannon" ---
  - id: cannon-p
    where: 'ball: 12 × 180 = 2160 kg·m/s'
    inputs: {m: 12 kg, v: 180 m/s}
    formula: m * v
    expected: 2160 kg*m/s
    shown: ['$1500\,v_{2,f} = -2160$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), total momentum before and after an explosion (the numbers are the page''s own)'}
    origin: page-own

  - id: cannon-v
    where: 'cannon: −2160 / 1500 = −1.44 m/s'
    inputs: {m1: 12 kg, v1: 180 m/s, m2: 1500 kg}
    formula: -m1 * v1 / m2
    expected: -1.44 m/s
    shown: ['$v_{2,f} = -2160 / 1500 = -1.44$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: cannon-speed-ratio
    where: 'check: 180 / 1.44 = 125'
    inputs: {v1: 180 m/s, v2: 1.44 m/s}
    formula: v1 / v2
    expected: '125'
    shown: ['$180 / 1.44 = 125$']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  - id: cannon-mass-ratio
    where: 'check: 1500 / 12 = 125'
    inputs: {m1: 12 kg, m2: 1500 kg}
    formula: m2 / m1
    expected: '125'
    shown: ['$1500 / 12 = 125$']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Two railway wagons couple" ---
  - id: wagons-p
    where: 'total momentum before: 2.0e4 × 3.0 = 6.0e4 kg·m/s'
    inputs: {m: 2.0e4 kg, v: 3.0 m/s}
    formula: m * v
    expected: 6.0e4 kg*m/s
    shown: ['$2.0 \times 10^{4} \times 3.0 + 0 = 6.0 \times 10^{4}$ kg·m/s']
    source: {cite: mit, at: 'Collisions (ESCJG) (the numbers are the page''s own)'}
    origin: page-own

  - id: wagons-v
    where: 'common velocity 6.0e4 / 5.0e4 = 1.2 m/s'
    inputs: {m1: 2.0e4 kg, v1: 3.0 m/s, m2: 3.0e4 kg}
    formula: m1 * v1 / (m1 + m2)
    expected: 1.2 m/s
    shown: ['$5.0 \times 10^{4}\,v_f = 6.0 \times 10^{4}$, so $v_f = 1.2$ m/s']
    source: {cite: mit, at: 'Collisions (ESCJG), objects that move on together (the numbers are the page''s own)'}
    origin: page-own

  - id: wagons-fraction
    where: 'check: two-fifths of 3.0 m/s = 1.2 m/s'
    inputs: {v: 3.0 m/s}
    formula: 2 / 5 * v
    expected: 1.2 m/s
    shown: ['$\tfrac{2}{5} \times 3.0 = 1.2$ m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "What conservation of momentum does not say" ---
  - id: ek-cart1
    where: 'light cart: ½ × 0.80 × 0.90² ≈ 0.32 J'
    inputs: {m: 0.80 kg, v: 0.90 m/s}
    formula: m * v**2 / 2
    expected: 0.32 J
    tolerance: 0.005 J
    shown: ['$\tfrac{1}{2} \times 0.80 \times 0.90^{2} \approx 0.32$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ), kinetic energy before and after (kinetic energy from lesson 3.2; the numbers are the page''s own)'}
    origin: page-own

  - id: ek-cart2
    where: 'heavy cart: ½ × 1.2 × 0.60² ≈ 0.22 J'
    inputs: {m: 1.2 kg, v: 0.60 m/s}
    formula: m * v**2 / 2
    expected: 0.22 J
    tolerance: 0.005 J
    shown: ['$\tfrac{1}{2} \times 1.2 \times 0.60^{2} \approx 0.22$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-carts-total
    where: 'together about 0.54 J'
    inputs: {m1: 0.80 kg, v1: 0.90 m/s, m2: 1.2 kg, v2: 0.60 m/s}
    formula: m1 * v1**2 / 2 + m2 * v2**2 / 2
    expected: 0.54 J
    shown: ['together about 0.54 J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-ball
    where: 'cannon ball: ½ × 12 × 180² ≈ 1.9e5 J'
    inputs: {m: 12 kg, v: 180 m/s}
    formula: m * v**2 / 2
    expected: 1.9e5 J
    tolerance: 0.05e5 J
    shown: ['$\tfrac{1}{2} \times 12 \times 180^{2} \approx 1.9 \times 10^{5}$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-cannon
    where: 'cannon: ½ × 1500 × 1.44² ≈ 1.6e3 J'
    inputs: {m: 1500 kg, v: 1.44 m/s}
    formula: m * v**2 / 2
    expected: 1.6e3 J
    tolerance: 0.05e3 J
    shown: ['$\tfrac{1}{2} \times 1500 \times 1.44^{2} \approx 1.6 \times 10^{3}$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-cannon-ratio
    where: 'the ball takes 125 times as much kinetic energy'
    inputs: {m1: 12 kg, v1: 180 m/s, m2: 1500 kg, v2: 1.44 m/s}
    formula: (m1 * v1**2) / (m2 * v2**2)
    expected: '125'
    shown: ['takes 125 times as much kinetic energy']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-wagons-before
    where: 'wagons before: ½ × 2.0e4 × 3.0² = 9.0e4 J'
    inputs: {m: 2.0e4 kg, v: 3.0 m/s}
    formula: m * v**2 / 2
    expected: 9.0e4 J
    shown: ['$\tfrac{1}{2} \times 2.0 \times 10^{4} \times 3.0^{2} = 9.0 \times 10^{4}$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-wagons-after
    where: 'wagons after: ½ × 5.0e4 × 1.2² = 3.6e4 J'
    inputs: {m: 5.0e4 kg, v: 1.2 m/s}
    formula: m * v**2 / 2
    expected: 3.6e4 J
    shown: ['$\tfrac{1}{2} \times 5.0 \times 10^{4} \times 1.2^{2} = 3.6 \times 10^{4}$ J']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-wagons-lost
    where: 'lost: 9.0e4 − 3.6e4 = 5.4e4 J'
    inputs: {a: 9.0e4 J, b: 3.6e4 J}
    formula: a - b
    expected: 5.4e4 J
    shown: ['$5.4 \times 10^{4}$ J, has gone into heat']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: ek-wagons-percent
    where: '60% of the kinetic energy is lost'
    inputs: {a: 9.0e4 J, b: 3.6e4 J}
    formula: 100 * (a - b) / a
    expected: '60'
    shown: ['So 60% of the kinetic energy']
    source: {cite: mit, at: 'Inelastic collisions (ESCJJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: falling-ball-p
    where: 'ball of 0.50 kg after 1.0 s of free fall: 0.50 × 9.81 × 1.0 ≈ 4.9 kg·m/s'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, t: 1.0 second}
    formula: m * ga * t
    expected: 4.9 kg*m/s
    tolerance: 0.01 kg*m/s
    shown: ['$0.50 \times 9.81 \times 1.0 \approx 4.9$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.8 (non-isolated systems; the numbers are the page''s own)'}
    origin: page-own

  - id: earth-mass
    kind: fact
    where: 'the Earth''s mass, 5.97 × 10²⁴ kg (5.9722e24 kg as in lessons 2.11 to 3.3)'
    value: 5.97e24 kg
    shown: ['$5.97 \times 10^{24}$ kg']
    source: {cite: earthfact, at: 'Bulk parameters, mass 5.9722 × 10²⁴ kg, rounded to three figures (the value of lesson 2.11)'}
    origin: later-data

  - id: earth-recoil
    where: 'Earth''s speed: 4.9 / 5.97e24 ≈ 8e-25 m/s'
    inputs: {m: 0.50 kg, ga: 9.81 m/s**2, t: 1.0 second, M: 5.9722e24 kg}
    formula: m * ga * t / M
    expected: 8e-25 m/s
    tolerance: 0.5e-25 m/s
    shown: ['$8 \times 10^{-25}$ m/s']
    source: {cite: reading1, at: 'Sec. 10.8, Eq. (10.8.4) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A collision at an icy crossing" ---
  - id: crossing-px
    where: 'car: p_x = 1200 × 10 = 1.2e4 kg·m/s'
    inputs: {m: 1200 kg, v: 10 m/s}
    formula: m * v
    expected: 1.2e4 kg*m/s
    shown: ['$p_x = 1200 \times 10 = 1.2 \times 10^{4}$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, Eqs. (10.9.4) to (10.9.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-py
    where: 'van: p_y = 1800 × 8.0 = 1.44e4 kg·m/s'
    inputs: {m: 1800 kg, v: 8.0 m/s}
    formula: m * v
    expected: 1.44e4 kg*m/s
    shown: ['$p_y = 1800 \times 8.0 = 1.44 \times 10^{4}$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, Eq. (10.9.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-vx
    where: 'v_x = 1.2e4 / 3000 = 4.0 m/s'
    inputs: {p: 1.2e4 kg*m/s, m: 3000 kg}
    formula: p / m
    expected: 4.0 m/s
    shown: ['$v_x = 1.2 \times 10^{4} / 3000 = 4.0$ m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, Eq. (10.9.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-vy
    where: 'v_y = 1.44e4 / 3000 = 4.8 m/s'
    inputs: {p: 1.44e4 kg*m/s, m: 3000 kg}
    formula: p / m
    expected: 4.8 m/s
    shown: ['$v_y = 1.44 \times 10^{4} / 3000 = 4.8$ m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, Eq. (10.9.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-speed
    where: 'speed sqrt(4.0² + 4.8²) ≈ 6.2 m/s'
    inputs: {vx: 4.0 m/s, vy: 4.8 m/s}
    formula: sqrt(vx**2 + vy**2)
    expected: 6.2 m/s
    tolerance: 0.05 m/s
    shown: ['$\sqrt{4.0^{2} + 4.8^{2}} \approx 6.2$ m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1 (components; size from lesson 0.8; the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-angle
    where: 'direction atan(4.8 / 4.0) ≈ 50° north of east'
    inputs: {vx: 4.0 m/s, vy: 4.8 m/s}
    formula: atan(vy / vx) * 180 / pi
    expected: '50'
    tolerance: '0.5'
    shown: ['$\tan^{-1}(4.8 / 4.0) \approx 50^\circ$']
    source: {cite: reading1, at: 'Sec. 10.9.1 (components; direction from lesson 0.8; the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-ptotal
    where: 'size of the total momentum ≈ 1.9e4 kg·m/s'
    inputs: {px: 1.2e4 kg*m/s, py: 1.44e4 kg*m/s}
    formula: sqrt(px**2 + py**2)
    expected: 1.9e4 kg*m/s
    tolerance: 0.05e4 kg*m/s
    shown: ['$\sqrt{(1.2 \times 10^{4})^{2} + (1.44 \times 10^{4})^{2}} \approx 1.9 \times 10^{4}$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own

  - id: crossing-ptotal-after
    where: 'after: 3000 × 6.25 ≈ 1.9e4 kg·m/s'
    inputs: {m: 3000 kg, v: 6.25 m/s}
    formula: m * v
    expected: 1.9e4 kg*m/s
    tolerance: 0.05e4 kg*m/s
    shown: ['$3000 \times 6.25 \approx 1.9 \times 10^{4}$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.9.1, step 4 "Look back" (the numbers are the page''s own)'}
    origin: page-own
