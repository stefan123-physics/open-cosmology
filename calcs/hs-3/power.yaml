# Calculations on content/year-0/hs-3/power.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 12, 5.5 Power (mit); MIT 8.01SC Course Notes Ch. 13, Sec. 13.7 (reading1);
# OpenLearn, An introduction to energy resources, 2.1 (openlearn); NASA Sun Fact Sheet (sunfact).
# All example numbers are the page's own (Siyavula's 10 N box at 1 m/s, 100 kg crate 8 m in 4 s, 60 kg stair climb,
# borehole 15 m at 20 l/s, 50 kW / 200 kW car, Bill and Bob, Jack and Jill, 40 kg chin-up, 20 × 70 kg escalator;
# MIT's 0.2 kg ball from 15 m to 5 m and 0.2 kg cup; OpenLearn's 90% and 35–40% efficiencies are not reused).
# g = 9.81 m/s², written ga (g alone is the gram).

page: content/year-0/hs-3/power.mdx
calcs:
  # --- The watt ---
  - id: horsepower
    kind: fact
    where: 'section "The watt": one horsepower is about 750 W'
    value: 750 W
    shown: ['the **horsepower**, about 750 W', 'One horsepower is about 750 W.', 'The old horsepower is about 750 W.']
    source: {cite: mit, at: 'Power (ESCMJ): one horsepower is equivalent to approximately 750 W'}
    origin: page-own

  # --- Worked example "Running up the stairs" ---
  - id: stairs-work
    where: 'worked example "Running up the stairs": W = 55 × 9.81 × 4.2'
    inputs: {mass: 55 kg, ga: 9.81 m/s**2, height: 4.2 m}
    formula: mass * ga * height
    expected: 2.3e3 J
    shown: ['$W = m g h = 55 \times 9.81 \times 4.2 \approx 2.3 \times 10^{3}$ J']
    source: {cite: mit, at: 'Power (ESCMJ), Worked example 13: Stair climb (method; the numbers are the page''s own)'}
    origin: page-own

  - id: stairs-power
    where: 'same: P = 2266 J / 6.0 s'
    inputs: {mass: 55 kg, ga: 9.81 m/s**2, height: 4.2 m, dur: 6.0 s}
    formula: mass * ga * height / dur
    expected: 380 W
    shown: ['$P = W/\Delta t = 2266/6.0 \approx 380$ W']
    source: {cite: mit, at: 'Power (ESCMJ), definition P = W/t (the numbers are the page''s own)'}
    origin: page-own

  - id: stairs-work-unrounded
    where: 'same: the unrounded work 2266 J used in the steps'
    inputs: {mass: 55 kg, ga: 9.81 m/s**2, height: 4.2 m}
    formula: mass * ga * height
    expected: 2266 J
    tolerance: 1 J
    shown: ['$2266/15 \approx 150$ W']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: stairs-hp
    where: 'same: about half a horsepower'
    inputs: {power: 377.7 W, hp: 750 W}
    formula: power / hp
    expected: '0.5'
    shown: ['about half a horsepower']
    source: {cite: mit, at: 'Power (ESCMJ), horsepower about 750 W (the numbers are the page''s own)'}
    origin: page-own

  - id: stairs-slow
    where: 'same, check: the same climb in 15 s needs about 150 W'
    inputs: {mass: 55 kg, ga: 9.81 m/s**2, height: 4.2 m, dur: 15 s}
    formula: mass * ga * height / dur
    expected: 150 W
    shown: ['in 15 s, needs the same work but only']
    source: {cite: mit, at: 'Power (ESCMJ), definition P = W/t (the numbers are the page''s own)'}
    origin: page-own

  # --- Plot and worked example "A falling ball" ---
  - id: ball-force
    where: 'worked example "A falling ball": mg = 0.50 × 9.81'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2}
    formula: mass * ga
    expected: 4.9 N
    shown: ['$m g = 0.50 \times 9.81 \approx 4.9$ N']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.8) (method; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-speed
    where: 'same: v = g t = 9.81 × 1.5'
    inputs: {ga: 9.81 m/s**2, dur: 1.5 s}
    formula: ga * dur
    expected: 14.7 m/s
    shown: ['$g t = 9.81 \times 1.5 \approx 14.7$ m/s']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.11) (method; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-power
    where: 'same, and the plot: P = mg × gt at 1.5 s'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2, dur: 1.5 s}
    formula: mass * ga**2 * dur
    expected: 72 W
    shown: ['so $P = F v \approx 72$ W', 'the power is about 72 W']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.12) (method; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-power-point
    where: 'plot point A at y = 72.2, and the check 72.2/2'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2, dur: 1.5 s}
    formula: mass * ga**2 * dur
    expected: 72.2 W
    shown: ['{ x: 1.5, y: 72.2, label: "A" }', '$72.2/2 = 36.1$ W']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.12) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-distance
    where: 'same: ½ g t² = ½ × 9.81 × 1.5²'
    inputs: {ga: 9.81 m/s**2, dur: 1.5 s}
    formula: ga * dur**2 / 2
    expected: 11 m
    shown: ['$\tfrac{1}{2} g t^{2} = \tfrac{1}{2} \times 9.81 \times 1.5^{2} \approx 11$ m']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.4) (method; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-work
    where: 'same: W = mg × 11.04 m'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2, dur: 1.5 s}
    formula: mass * ga * (ga * dur**2 / 2)
    expected: 54 J
    shown: ['$W = m g \times 11.04 \approx 54$ J']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.6) (method; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-distance-unrounded
    where: 'same: the unrounded distance 11.04 m and work 54.1 J'
    inputs: {ga: 9.81 m/s**2, dur: 1.5 s}
    formula: ga * dur**2 / 2
    expected: 11.04 m
    shown: ['$54.1/1.5 \approx 36$ W']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-avg-power
    where: 'same, and the plot: average power over 1.5 s'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2, dur: 1.5 s}
    formula: mass * ga * (ga * dur**2 / 2) / dur
    expected: 36 W
    shown: ['the average power over those 1.5 s is about 36 W']
    source: {cite: reading1, at: 'Sec. 13.7, Eq. (13.7.2) and Example 13.8, Eq. (13.7.7) (method; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-avg-point
    where: 'plot point B at y = 36.1'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2, dur: 1.5 s}
    formula: mass * ga**2 * dur / 2
    expected: 36.1 W
    shown: ['{ x: 1.5, y: 36.1, label: "B" }']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-ke-check
    where: 'same, check: ½ × 0.50 × 14.7² equals the work, about 54 J'
    inputs: {mass: 0.50 kg, vel: 14.7 m/s}
    formula: mass * vel**2 / 2
    expected: 54 J
    shown: ['$\tfrac{1}{2} \times 0.50 \times 14.7^{2}$']
    source: {cite: reading1, at: 'Sec. 13.7, Eqs. (13.7.18)–(13.7.19) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-slope
    where: 'plot: P = 0.5 × 9.81² × t, the slope m g² for m = 0.50 kg'
    inputs: {mass: 0.50 kg, ga: 9.81 m/s**2}
    formula: mass * ga**2
    expected: 48.1 W/s
    shown: ['expr: "0.5*9.81^2*t", label: "P"']
    source: {cite: reading1, at: 'Sec. 13.7, Example 13.8, Eq. (13.7.12), P = mg²t (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Cycling at speed" ---
  - id: cyclist-slow
    where: 'worked example "Cycling at speed": 22 N × 8.0 m/s'
    inputs: {force: 22 N, vel: 8.0 m/s}
    formula: force * vel
    expected: 180 W
    shown: ['$P = F v = 22 \times 8.0 \approx 180$ W']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv and Worked example 11 (method; the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-fast
    where: 'same: 40 N × 12 m/s'
    inputs: {force: 40 N, vel: 12 m/s}
    formula: force * vel
    expected: 480 W
    shown: ['$P = 40 \times 12 = 480$ W']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-ratio
    where: 'same, check: 480/176 ≈ 2.7 times the power for 1.5 times the speed'
    inputs: {p1: 176 W, p2: 480 W}
    formula: p2 / p1
    expected: '2.7'
    shown: ['$480/176 \approx 2.7$ times the power']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-speed-ratio
    where: 'same: 12/8.0 = 1.5 times the speed'
    inputs: {v1: 8.0 m/s, v2: 12 m/s}
    formula: v2 / v1
    expected: '1.5'
    shown: ['Only 1.5 times the speed']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A lift going up" ---
  - id: lift-force
    where: 'worked example "A lift going up": mg = 650 × 9.81'
    inputs: {mass: 650 kg, ga: 9.81 m/s**2}
    formula: mass * ga
    expected: 6.4e3 N
    shown: ['$F = m g = 650 \times 9.81 \approx 6.4 \times 10^{3}$ N']
    source: {cite: mit, at: 'Power (ESCMJ), Worked example 12: the force to raise a load equals its weight (method; the numbers are the page''s own)'}
    origin: page-own

  - id: lift-power
    where: 'same: P = 6376.5 N × 1.5 m/s'
    inputs: {mass: 650 kg, ga: 9.81 m/s**2, vel: 1.5 m/s}
    formula: mass * ga * vel
    expected: 9.6e3 W
    shown: ['$P = F v = 6376.5 \times 1.5 \approx 9.6 \times 10^{3}$ W, or 9.6 kW', 'gives the same 9.6 kW']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-height
    where: 'same, check: in 10 s the lift rises 15 m'
    inputs: {vel: 1.5 m/s, dur: 10 s}
    formula: vel * dur
    expected: 15 m
    shown: ['In 10 s the lift rises 15 m']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-work
    where: 'same, check: W = 6376.5 × 15'
    inputs: {force: 6376.5 N, height: 15 m}
    formula: force * height
    expected: 9.6e4 J
    shown: ['$W = m g h = 6376.5 \times 15 \approx 9.6 \times 10^{4}$ J']
    source: {cite: mit, at: 'Power (ESCMJ), P = W/t (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "How efficient is the hoist?" ---
  - id: hoist-useful
    where: 'worked example "How efficient is the hoist?": P = 90 × 9.81 × 0.95'
    inputs: {mass: 90 kg, ga: 9.81 m/s**2, vel: 0.95 m/s}
    formula: mass * ga * vel
    expected: 840 W
    shown: ['$P = m g v = 90 \times 9.81 \times 0.95 \approx 840$ W']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  - id: hoist-efficiency
    where: 'same: η = 838.8 / 1200 × 100%'
    inputs: {useful: 838.8 W, input: 1200 W}
    formula: useful / input
    expected: '0.70'
    shown: ['$\eta = 838.8/1200 \approx 0.70$, so the efficiency is 70%']
    source: {cite: openlearn, at: '2.1 Some basic concepts, efficiency (the numbers are the page''s own)'}
    origin: page-own

  - id: hoist-useful-unrounded
    where: 'same: the unrounded useful power 838.8 W'
    inputs: {mass: 90 kg, ga: 9.81 m/s**2, vel: 0.95 m/s}
    formula: mass * ga * vel
    expected: 838.8 W
    shown: ['$1200 - 838.8 \approx 360$ W']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  - id: efficiency-example
    where: 'section "Efficiency": 0.25 is 25%'
    inputs: {frac: 0.25}
    formula: frac * 100
    expected: '25'
    shown: ['an efficiency of 0.25 is 25%']
    source: {cite: openlearn, at: '2.1 Some basic concepts, efficiency as a percentage (the numbers are the page''s own)'}
    origin: page-own

  - id: hoist-wasted
    where: 'same: 1200 W − 838.8 W wasted'
    inputs: {input: 1200 W, useful: 838.8 W}
    formula: input - useful
    expected: 360 W
    shown: ['does not go into lifting']
    source: {cite: openlearn, at: '2.1 Some basic concepts, efficiency (the numbers are the page''s own)'}
    origin: page-own

  # --- The kilowatt-hour ---
  - id: kwh-joules
    where: 'section "The kilowatt-hour": 1 kWh = 1000 W × 3600 s'
    inputs: {power: 1000 W, dur: 3600 s}
    formula: power * dur
    expected: 3.6e6 J
    shown: ['1000\ \text{W} \times 3600\ \text{s} = 3.6 \times 10^{6}\ \text{J}', 'and 1 kWh = 3.6 × 10⁶ J.', '1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J.', 'the kilowatt-hour (3.6 × 10⁶ J)']
    source: {cite: openlearn, at: '2.1 Some basic concepts (one kilowatt hour is the energy delivered at 1 kW for one hour, 3600 kJ)'}
    origin: page-own

  # --- Worked example "Boiling water for tea" ---
  - id: kettle-seconds
    where: 'worked example "Boiling water for tea": 3.0 min = 180 s'
    inputs: {dur: 3.0 minute}
    formula: dur
    expected: 180 second
    shown: ['$\Delta t = 3.0 \times 60 = 180$ s']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: kettle-joules
    where: 'same: E = 2.0 kW × 180 s'
    inputs: {power: 2.0 kW, dur: 180 s}
    formula: power * dur
    expected: 3.6e5 J
    shown: ['$E = P\,\Delta t = 2.0 \times 10^{3} \times 180 = 3.6 \times 10^{5}$ J']
    source: {cite: mit, at: 'Power (ESCMJ), P = W/t turned round (the numbers are the page''s own)'}
    origin: page-own

  - id: kettle-hours
    where: 'same: 3.0 min = 0.050 h'
    inputs: {dur: 3.0 minute}
    formula: dur
    expected: 0.050 hour
    shown: ['3.0 minutes is 0.050 h']
    source: {cite: mit, at: 'Textbook Exercise 5.4, kilowatt-hour question (the numbers are the page''s own)'}
    origin: page-own

  - id: kettle-kwh
    where: 'same: 2.0 kW × 0.050 h'
    inputs: {power: 2.0 kW, dur: 0.050 hour}
    formula: power * dur
    expected: 0.10 kilowatt_hour
    shown: ['$E = 2.0 \text{ kW} \times 0.050 \text{ h} = 0.10$ kWh']
    source: {cite: mit, at: 'Textbook Exercise 5.4, kilowatt-hour question (the numbers are the page''s own)'}
    origin: page-own

  - id: kettle-kwh-check
    where: 'same, check: 3.6 × 10⁵ J / 3.6 × 10⁶ J per kWh'
    inputs: {energy: 3.6e5 J, perkwh: 3.6e6 J}
    formula: energy / perkwh
    expected: '0.10'
    shown: ['divided by $3.6 \times 10^{6}$ J per kWh is also 0.10 kWh']
    source: {cite: mit, at: 'Textbook Exercise 5.4, kilowatt-hour question (the numbers are the page''s own)'}
    origin: page-own

  - id: kettle-cost
    where: 'same: 0.10 kWh at 0.30 euro per kWh'
    inputs: {energy: 0.10, price: 0.30}
    formula: energy * price
    expected: '0.03'
    shown: ['$0.10 \times 0.30 = 0.03$ euro, three cents']
    source: {cite: openlearn, at: '2.1 Some basic concepts, bills count kWh (the numbers are the page''s own)'}
    origin: page-own

  # --- Towards cosmology ---
  - id: sun-luminosity
    kind: fact
    where: 'callout "Towards cosmology": the Sun''s luminosity, 382.8 × 10²⁴ J/s'
    value: 3.8e26 W
    shown: ['The Sun''s luminosity is about $3.8 \times 10^{26}$ W']
    source: {cite: sunfact, at: 'Bulk parameters: luminosity 382.8 × 10²⁴ J/s'}
    origin: later-data

  # --- Quiz ---
  - id: quiz-motor
    where: 'quiz 1: 4800 J in 60 s'
    inputs: {work: 4800 J, dur: 60 s}
    formula: work / dur
    expected: 80 W
    shown: ['$P = W/\\Delta t = 4800/60 = 80$ W']
    source: {cite: mit, at: 'Power (ESCMJ), definition P = W/t (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-motor-minute
    where: 'quiz 1, distractor: 4800 J / 1 s = 4.8 kW'
    inputs: {work: 4800 J, dur: 1 s}
    formula: work / dur
    expected: 4.8 kW
    shown: ['into 60 s gives 4.8 kW']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-motor-times
    where: 'quiz 1, distractor: 4800 × 60 = 288 000'
    inputs: {work: 4800, dur: 60}
    formula: work * dur / 1000
    expected: '288'
    shown: ['multiplying by the time instead of dividing gives 288 kW']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-tractor
    where: 'quiz 2: 6.0 kN × 1.5 m/s'
    inputs: {force: 6.0 kN, vel: 1.5 m/s}
    formula: force * vel
    expected: 9.0 kW
    shown: ['$P = F v = 6.0 \\times 10^{3} \\times 1.5 = 9.0 \\times 10^{3}$ W $= 9.0$ kW']
    source: {cite: mit, at: 'Power (ESCMJ), P = Fv (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-tractor-divide
    where: 'quiz 2, distractor: 6.0 / 1.5 = 4.0'
    inputs: {force: 6.0, vel: 1.5}
    formula: force / vel
    expected: '4.0'
    shown: ['Dividing the force by the speed gives 4.0 kW']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-tractor-nokilo
    where: 'quiz 2, distractor: 6.0 N × 1.5 m/s = 9.0 W'
    inputs: {force: 6.0 N, vel: 1.5 m/s}
    formula: force * vel
    expected: 9.0 W
    shown: ['leaving out the kilo gives 9.0 W']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-tractor-add
    where: 'quiz 2, distractor: 6.0 + 1.5 = 7.5'
    inputs: {force: 6.0, vel: 1.5}
    formula: force + vel
    expected: '7.5'
    shown: ['adding the force and the speed gives 7.5 kW']
    source: {cite: mit, at: 'Power (ESCMJ) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-lamp
    where: 'quiz 3 (LED lamp): 3.0 W / 12 W'
    inputs: {useful: 3.0 W, input: 12 W}
    formula: useful / input * 100
    expected: '25'
    shown: ['$= 3.0/12 = 0.25$, so 25%']
    source: {cite: openlearn, at: '2.1 Some basic concepts, efficiency (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-lamp-wasted
    where: 'quiz 3, distractor: 100% − 25% = 75%'
    inputs: {useful: 3.0 W, input: 12 W}
    formula: (input - useful) / input * 100
    expected: '75'
    shown: ['The other 75% is the part']
    source: {cite: openlearn, at: '2.1 Some basic concepts, efficiency (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-lamp-inverted
    where: 'quiz 3, distractor: 12 / 3.0 = 400%'
    inputs: {useful: 3.0 W, input: 12 W}
    formula: input / useful * 100
    expected: '400'
    shown: ['Turning the fraction upside down gives 400%']
    source: {cite: openlearn, at: '2.1 Some basic concepts, efficiency (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-led-hours
    where: 'quiz 4: 5.0 h a day for 30 days = 150 h'
    inputs: {daily: 5.0 hour, days: 30}
    formula: daily * days
    expected: 150 hour
    shown: ['\\times 150 \\text{ h} = 1200$ Wh']
    source: {cite: mit, at: 'Textbook Exercise 5.4, kilowatt-hour question (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-led
    where: 'quiz 4: 8.0 W × 150 h = 1.2 kWh'
    inputs: {power: 8.0 W, dur: 150 hour}
    formula: power * dur
    expected: 1.2 kilowatt_hour
    shown: ['$= 1.2$ kWh']
    source: {cite: mit, at: 'Textbook Exercise 5.4, kilowatt-hour question (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-led-day
    where: 'quiz 4, distractor: one day, 8.0 W × 5.0 h = 0.040 kWh'
    inputs: {power: 8.0 W, dur: 5.0 hour}
    formula: power * dur
    expected: 0.040 kilowatt_hour
    shown: ['A single day gives only 0.040 kWh']
    source: {cite: mit, at: 'Textbook Exercise 5.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-led-kilo
    where: 'quiz 4, distractor: 1200 Wh written as 1200 kWh'
    inputs: {power: 8.0 W, dur: 150 hour}
    formula: power * dur * 1000
    expected: 1200 kilowatt_hour
    shown: ['writing the 1200 watt-hours as 1200 kWh']
    source: {cite: mit, at: 'Textbook Exercise 5.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-led-kw
    where: 'quiz 4, distractor: 8.0 kW for 5.0 h = 40 kWh'
    inputs: {power: 8.0 kW, dur: 5.0 hour}
    formula: power * dur
    expected: 40 kilowatt_hour
    shown: ['reading 8.0 W as 8.0 kW for one day gives 40 kWh']
    source: {cite: mit, at: 'Textbook Exercise 5.4 (the numbers are the page''s own)'}
    origin: page-own
