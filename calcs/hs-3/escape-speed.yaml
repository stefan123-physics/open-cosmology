# Calculations on content/year-0/hs-3/escape-speed.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Chapter 14 (mit): Sec. 14.4.3 (Eqs. 14.13, 14.15, 14.16), Example 14.2 (escape
# velocity of Toro, the example's Eqs. (14.2)-(14.6)); Chapter 25 (reading1): Sec. 25.4.1-25.4.4; NASA fact sheets
# (Earth, Moon, Mars incl. Phobos, Sun). G = 6.674e-11, M_Earth = 5.9722e24 kg, R_Earth = 6371 km as in lessons 2.11-3.3.
# All example numbers are the page's own: MIT's Toro example (R = 5.0 km, m = 2.0e15 kg, 7.3 m/s) is not reused.
# g = 9.81 m/s² is written ga in the inputs (g alone would be the gram).

page: content/year-0/hs-3/escape-speed.mdx
calcs:
  # --- Quiz ---
  - id: quiz-four-mass
    where: 'quiz 1: four times the mass, √4 = 2 times the escape speed'
    inputs: {}
    formula: sqrt(4)
    expected: '2'
    shown: ['$\\sqrt{4} = 2$ times the speed']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-total
    where: 'quiz 2: E = 3.0e9 + (−5.0e9) = −2.0e9 J'
    inputs: {ek: 3.0e9 J, ep: -5.0e9 J}
    formula: ek + ep
    expected: -2.0e9 J
    shown: ['$3.0 \\times 10^{9} + (-5.0 \\times 10^{9}) = -2.0 \\times 10^{9}$ J', 'kinetic energy $3.0 \\times 10^{9}$ J and gravitational potential energy $-5.0 \\times 10^{9}$ J']
    source: {cite: reading1, at: 'Sec. 25.4.2, elliptic orbit with E below zero (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-mars
    where: 'quiz 3: v_esc of Mars = √(2 × 6.674e-11 × 6.42e23 / 3.39e6) = 5.03e3 m/s'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 6.42e23 kg, R: 3.39e6 m}
    formula: sqrt(2 * G * M / R)
    expected: 5.03e3 m/s
    shown: ['$v_{\\text{esc}} = \\sqrt{2 \\times 6.674 \\times 10^{-11} \\times 6.42 \\times 10^{23}/3.39 \\times 10^{6}} = 5.03 \\times 10^{3}$ m/s']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own, rounded from the Mars Fact Sheet)'}
    origin: page-own

  - id: quiz-mars-no-2
    where: 'quiz 3, distractor: √(GM/R) = 3.56 km/s'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 6.42e23 kg, R: 3.39e6 m}
    formula: sqrt(G * M / R)
    expected: 3.56 km/s
    shown: ['Leaving out the 2 gives 3.56 km/s']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-mars-4
    where: 'quiz 3, distractor: √(4GM/R) = 7.11 km/s'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 6.42e23 kg, R: 3.39e6 m}
    formula: sqrt(4 * G * M / R)
    expected: 7.11 km/s
    shown: ['using $4 G M/R$ gives 7.11 km/s']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-mars-km
    where: 'quiz 3, distractor: radius 3390 taken in metres (km slip), 159 km/s'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 6.42e23 kg, R: 3390 m}
    formula: sqrt(2 * G * M / R)
    expected: 159 km/s
    shown: ['instead of metres gives 159 km/s']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-mars-fact
    kind: fact
    where: 'quiz 3: the Mars Fact Sheet lists 5.03 km/s'
    value: 5.03 km/s
    shown: ['The Mars Fact Sheet lists 5.03 km/s']
    source: {cite: marsfact, at: 'Bulk parameters: escape velocity 5.03 km/s'}
    origin: later-data

  - id: quiz-mars-mass
    kind: fact
    where: 'quiz 3 question: mass 6.42e23 kg, radius 3390 km (Mars Fact Sheet, rounded)'
    value: 6.42e23 kg
    shown: ['Mars has a mass of $6.42 \\times 10^{23}$ kg and a radius of 3390 km']
    source: {cite: marsfact, at: 'Bulk parameters: mass 0.64169 × 10²⁴ kg, volumetric mean radius 3389.5 km'}
    origin: later-data

  - id: quiz-orbit-escape
    where: 'quiz 4: 1.414 × 7.0 = 9.9 km/s'
    inputs: {v: 7.0 km/s}
    formula: sqrt(2) * v
    expected: 9.9 km/s
    shown: ['$1.414 \\times 7.0 = 9.9$ km/s']
    source: {cite: reading1, at: 'Sec. 25.4.1, Eq. (25.4.15) and Sec. 25.4.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-orbit-double
    where: 'quiz 4, distractor: 2 × 7.0 = 14.0 km/s'
    inputs: {v: 7.0 km/s}
    formula: 2 * v
    expected: 14.0 km/s
    shown: ['14.0 km/s doubles the speed']
    source: {cite: reading1, at: 'Sec. 25.4.1 (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-orbit-ground
    where: 'quiz 4, distractor: 11.2 km/s, the escape speed from the ground'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: sqrt(2 * G * M / R)
    expected: 11.2 km/s
    shown: ['11.2 km/s is the escape speed from the ground']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  # --- Flashcards ---
  - id: card-earth
    where: 'flashcard 3: Earth 11.2 km/s'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: sqrt(2 * G * M / R)
    expected: 11.2 km/s
    shown: ['mass. Earth: 11.2 km/s.']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  - id: card-sqrt2
    where: 'flashcard 5: √2 ≈ 1.41'
    inputs: {}
    formula: sqrt(2)
    expected: '1.41'
    shown: ['√(2GM/r), √2 ≈ 1.41 times the orbit speed']
    source: {cite: reading1, at: 'Sec. 25.4.1 and 25.4.3 (the step is the page''s own)'}
    origin: page-own

  - id: summary-earth
    where: 'summary (frontmatter): 11.2 km/s for the Earth'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: sqrt(2 * G * M / R)
    expected: 11.2 km/s
    shown: ['v_esc = √(2GM/R), 11.2 km/s for the Earth']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "Why mgh is not enough" ---
  - id: G
    kind: fact
    where: 'section "Why mgh is not enough": G = 6.674 × 10⁻¹¹ N m²/kg²'
    value: 6.674e-11 N*m**2/kg**2
    shown: ['with $G = 6.674 \times 10^{-11}$ N m²/kg²']
    source: {cite: mit, at: 'Example 14.2 (G, written there 6.67 × 10⁻¹¹ N m² kg⁻²; the page uses the four-figure value of lesson 2.11)'}
    origin: mit

  - id: double-distance
    where: 'same: double the distance and the force drops to a quarter'
    inputs: {}
    formula: 1 / 2**2
    expected: '0.25'
    shown: ['Double the distance from the centre and the force drops to a quarter']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.13) (the step is the page''s own)'}
    origin: page-own

  # --- Section "Work against a force that weakens" ---
  - id: strip-identity
    kind: identity
    where: 'formula "Area of one thin strip": GMm/(r1 r2) × (r2 − r1) = GMm (1/r1 − 1/r2)'
    formula: GMm / (r1 * r2) * (r2 - r1)
    equals: GMm * (1 / r1 - 1 / r2)
    samples:
      GMm: [3.986e14, 1.0, 4.783e17, 7.07e5]
      r1: [6.371e6, 2.0, 7.0e6, 1.1e4]
      r2: [6.5e6, 3.5, 9.1e6, 1.25e4]
    shown: ['tex="\frac{G M m}{r_1 r_2}\,(r_2 - r_1) = G M m \left(\frac{1}{r_1} - \frac{1}{r_2}\right)"']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) (the strip form is the page''s own)'}
    origin: page-own

  - id: strip-sum
    kind: identity
    where: 'formula "Work to lift an object from R to r": the telescoping sum of three strips R → r1 → r2 → r gives GMm (1/R − 1/r)'
    formula: GMm * (1 / R - 1 / r1) + GMm * (1 / r1 - 1 / r2) + GMm * (1 / r2 - 1 / r)
    equals: GMm * (1 / R - 1 / r)
    samples:
      GMm: [3.986e14, 1.0, 4.783e17]
      R: [6.371e6, 1.0, 6.371e6]
      r1: [7.0e6, 1.5, 6.6e6]
      r2: [8.0e6, 2.5, 7.0e6]
      r: [1.3e7, 4.0, 7.371e6]
    shown: ['tex="W = G M m \left(\frac{1}{R} - \frac{1}{r}\right)"']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15)'}
    origin: page-own

  - id: strip-sum-exact
    where: 'same: the area under GMm/r² from R to r (here 1 kg from R to 2R) equals GMm (1/R − 1/r); the integral checks the strip result'
    inputs: {GM: 3.98585e14 m**3/s**2, mk: 1.0 kg, R: 6.371e6 m}
    formula: GM * mk / R * integrate('1 / x**2', 'x', 1, 2)
    expected: 3.13e7 J
    shown: ['takes $G M m/(2R) = 3.13 \times 10^{7}$ J']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: twice-R-mgh
    where: 'same: m g h with h = R = 6.371e6 m gives 6.25e7 J for 1.0 kg, twice as much'
    inputs: {mk: 1.0 kg, ga: 9.81 m/s**2, h: 6.371e6 m}
    formula: mk * ga * h
    expected: 6.25e7 J
    shown: ['would give $6.25 \times 10^{7}$ J, twice as much']
    source: {cite: mit, at: 'Sec. 14.4.3 (the comparison and numbers are the page''s own)'}
    origin: page-own

  - id: twice-R-ratio
    where: 'same: 6.25e7 / 3.13e7 ≈ 2, twice as much'
    inputs: {GM: 3.98585e14 m**3/s**2, ga: 9.81 m/s**2, R: 6.371e6 m}
    formula: (ga * R) / (GM / (2 * R))
    expected: '2.0'
    shown: ['$h = R = 6.371 \times 10^{6}$ m would give']
    source: {cite: mit, at: 'Sec. 14.4.3 (the comparison and numbers are the page''s own)'}
    origin: page-own

  - id: small-h-limit
    kind: identity
    where: 'same: GMm (1/R − 1/(R + h)) = GMm h/(R(R + h))'
    formula: GMm * (1 / R - 1 / (R + h))
    equals: GMm * h / (R * (R + h))
    samples:
      GMm: [3.986e14, 1.0, 4.783e17]
      R: [6.371e6, 2.0, 6.371e6]
      h: [100.0, 0.5, 1.0e6]
    shown: ['the work becomes $G M m\,h/(R(R + h))$']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) and Sec. 14.4.1 (the step is the page''s own)'}
    origin: page-own

  # --- Plot ---
  - id: plot-surface
    where: 'graph caption and curve: E_p per kg at the surface = −GM/R = −62.6 MJ'
    inputs: {GM: 3.98585e14 m**3/s**2, R: 6.371e6 m}
    formula: -GM / R
    expected: -62.6 MJ/kg
    shown: ['It is −62.6 MJ at the surface']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-mgh-slope
    where: 'graph: the mgh line rises by g R = 9.81 × 6.371e6 = 62.5 MJ per kg per Earth radius'
    inputs: {ga: 9.81 m/s**2, R: 6.371e6 m}
    formula: ga * R
    expected: 62.5 MJ/kg
    shown: ['-62.6 + 62.5*(x - 1)']
    source: {cite: mit, at: 'Sec. 14.4.1 (mgh), Sec. 14.4.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-radius
    kind: fact
    where: 'graph caption: Earth radius 6371 km'
    value: 6371 km
    shown: ['with r in Earth radii (6371 km)']
    source: {cite: earthfact, at: 'Bulk parameters: volumetric mean radius 6371.000 km'}
    origin: later-data

  - id: plot-g
    kind: fact
    where: 'graph caption: g = 9.81 m/s²'
    value: 9.81 m/s**2
    shown: ['plus mgh with g = 9.81 m/s²']
    source: {cite: mit, at: 'Sec. 14.4.1 (g near the surface of the Earth)'}
    origin: mit

  # --- Worked example "Lifting a satellite to 1000 km" ---
  - id: sat-r
    where: 'example: r = R + h = 6.371e6 + 1.0e6 = 7.371e6 m'
    inputs: {R: 6.371e6 m, h: 1.0e6 m}
    formula: R + h
    expected: 7.371e6 m
    shown: ['$r = R + h = 7.371 \times 10^{6}$ m', 'to a height of 1000 km', 'gravity at 1000 km is weaker', 'since 1000 km is still small', 'Lifting a satellite to 1000 km']
    source: {cite: mit, at: 'Sec. 14.4.3 (r from the centre; the numbers are the page''s own)'}
    origin: page-own

  - id: sat-gmm
    where: 'example: GMm = 6.674e-11 × 5.9722e24 × 1200 = 4.783e17 J m'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, m: 1200 kg}
    formula: G * M * m
    expected: 4.783e17 J*m
    shown: ['10^{24} \times 1200 = 4.783 \times 10^{17}$ J m']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: sat-inv-R
    where: 'example: 1/R = 1.5696e-7 /m'
    inputs: {R: 6.371e6 m}
    formula: 1 / R
    expected: 1.5696e-7 1/m
    shown: ['(1.5696 - 1.3567) \times 10^{-7}']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: sat-inv-r
    where: 'example: 1/r = 1.3567e-7 /m'
    inputs: {r: 7.371e6 m}
    formula: 1 / r
    expected: 1.3567e-7 1/m
    shown: ['(1.5696 - 1.3567) \times 10^{-7}']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: sat-dEp
    where: 'example: ΔE_p = GMm (1/R − 1/r) = 1.02e10 J'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, m: 1200 kg, R: 6.371e6 m, r: 7.371e6 m}
    formula: G * M * m * (1 / R - 1 / r)
    expected: 1.02e10 J
    shown: ['$\Delta E_p = G M m\,(1/R - 1/r) = 4.783 \times 10^{17} \times (1.5696 - 1.3567) \times 10^{-7} = 1.02 \times 10^{10}$ J']
    source: {cite: mit, at: 'Sec. 14.4.3, Eq. (14.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: sat-mgh
    where: 'example: m g h = 1200 × 9.81 × 1.0e6 = 1.18e10 J'
    inputs: {m: 1200 kg, ga: 9.81 m/s**2, h: 1.0e6 m}
    formula: m * ga * h
    expected: 1.18e10 J
    shown: ['$m g h = 1200 \times 9.81 \times 1.0 \times 10^{6} = 1.18 \times 10^{10}$ J']
    source: {cite: mit, at: 'Sec. 14.4.1 (mgh; the numbers are the page''s own)'}
    origin: page-own

  - id: sat-excess
    where: 'example: mgh is about 16% too much'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, m: 1200 kg, R: 6.371e6 m, r: 7.371e6 m, ga: 9.81 m/s**2, h: 1.0e6 m}
    formula: 100 * (m * ga * h / (G * M * m * (1 / R - 1 / r)) - 1)
    expected: '16'
    shown: ['about 16% too much']
    source: {cite: mit, at: 'Sec. 14.4.1 and 14.4.3 (the comparison and numbers are the page''s own)'}
    origin: page-own

  # --- Section "Escape speed" ---
  - id: gm-over-r
    where: 'section "Escape speed": GM/R = 6.256e7 J/kg for the Earth'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: G * M / R
    expected: 6.256e7 J/kg
    shown: ['For the Earth, $G M/R = 6.256 \times 10^{7}$ J/kg']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  - id: vesc-earth
    where: 'same: v_esc = √(2 × 6.256e7) = 1.12e4 m/s'
    inputs: {GMR: 6.256e7 J/kg}
    formula: sqrt(2 * GMR)
    expected: 1.12e4 m/s
    shown: ['$v_{\text{esc}} = \sqrt{2 \times 6.256 \times 10^{7}} = 1.12 \times 10^{4}$ m/s']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  - id: vesc-earth-kms
    where: 'same: about 11.2 km/s'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: sqrt(2 * G * M / R)
    expected: 11.2 km/s
    shown: ['about **11.2 km/s** or about 40 000 km/h', 'Real rockets do not reach 11.2 km/s']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  - id: vesc-earth-kmh
    where: 'same: about 40 000 km/h'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: sqrt(2 * G * M / R)
    expected: 40000 km/hour
    tolerance: 1%
    shown: ['about **11.2 km/s** or about 40 000 km/h']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own)'}
    origin: page-own

  - id: vesc-earth-fact
    kind: fact
    where: 'same: the Earth Fact Sheet lists 11.186 km/s'
    value: 11.186 km/s
    shown: ['The Earth Fact Sheet lists 11.186 km/s']
    source: {cite: earthfact, at: 'Bulk parameters: escape velocity 11.186 km/s'}
    origin: later-data

  - id: escape-energy-per-kg
    where: 'same: every kilogram needs 62.6 MJ'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6.371e6 m}
    formula: G * M / R
    expected: 62.6 MJ/kg
    shown: ['every kilogram that is to escape from the ground needs 62.6 MJ']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.2) of the example (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "How small a moon could you jump off?" ---
  - id: jump-speed
    where: 'example: a 0.50 m jump on Earth leaves the ground at √(2 × 9.81 × 0.50) = 3.1 m/s'
    inputs: {ga: 9.81 m/s**2, h: 0.50 m}
    formula: sqrt(2 * ga * h)
    expected: 3.1 m/s
    shown: ['$\sqrt{2 \times 9.81 \times 0.50} = 3.1$ m/s']
    source: {cite: mit, at: 'Sec. 14.5.1, mechanical energy near the surface of the Earth (the numbers are the page''s own)'}
    origin: page-own

  - id: jump-speed-squared
    where: 'example: v² = 2 × 9.81 × 0.50 = 9.81 m²/s²'
    inputs: {ga: 9.81 m/s**2, h: 0.50 m}
    formula: 2 * ga * h
    expected: 9.81 m**2/s**2
    shown: ['$v^{2} = 2 \times 9.81 \times 0.50 = 9.81$ m²/s²']
    source: {cite: mit, at: 'Sec. 14.5.1, mechanical energy near the surface of the Earth (the numbers are the page''s own)'}
    origin: page-own

  - id: moon-density
    kind: fact
    where: 'example: density of a small rubble moon taken as 2000 kg/m³ (the page''s own round value)'
    value: 2000 kg/m**3
    shown: ['of 2000 kg/m³, the page''s own round value']
    source: {cite: marsfact, at: 'not in the source: the page''s own round value, checked against Phobos (1.9e3 kg/m³ from its mass and mean radius)'}
    origin: page-own

  - id: moon-coefficient
    where: 'example: 2 × 6.674e-11 × 2000 × (4/3)π = 1.12e-6 per s²'
    inputs: {G: 6.674e-11 N*m**2/kg**2, rho: 2000 kg/m**3}
    formula: 2 * G * rho * 4 / 3 * pi
    expected: 1.12e-6 1/s**2
    shown: ['$2 \times 6.674 \times 10^{-11} \times 2000 \times \tfrac{4}{3}\pi = 1.12 \times 10^{-6}$ per second squared']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own; the radius from a density is the page''s own step, not in the source)'}
    origin: page-own

  - id: moon-radius-squared
    where: 'example: R² = 9.81 / 1.12e-6 = 8.76e6 m²'
    inputs: {v2: 9.81 m**2/s**2, k: 1.12e-6 1/s**2}
    formula: v2 / k
    expected: 8.76e6 m**2
    shown: ['$R^{2} = 9.81/(1.12 \times 10^{-6}) = 8.76 \times 10^{6}$ m²']
    source: {cite: mit, at: 'Example 14.2, Eq. (14.6) of the example (the numbers are the page''s own; the radius from a density is the page''s own step, not in the source)'}
    origin: page-own

  - id: moon-radius
    where: 'example: R = 2.96e3 m, about 3 km (from unrounded inputs 2.962e3 m)'
    inputs: {G: 6.674e-11 N*m**2/kg**2, rho: 2000 kg/m**3, ga: 9.81 m/s**2, h: 0.50 m}
    formula: sqrt(2 * ga * h / (2 * G * rho * 4 / 3 * pi))
    expected: 2.96e3 m
    shown: ['so $R = 2.96 \times 10^{3}$ m, about **3 km**']
