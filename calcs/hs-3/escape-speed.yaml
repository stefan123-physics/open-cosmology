  # --- Section "Orbit speed and escape speed" ---
  - id: orbit-energy
    kind: identity
    where: 'formula "Total energy of a circular orbit": GMm/(2r) − GMm/r = −GMm/(2r), with ½mv² = ½GMm/r'
    formula: 0.5 * m * (GM / r) - GM * m / r
    equals: -GM * m / (2 * r)
    samples:
      GM: [3.986e14, 1.0, 1.327e20]
      m: [420000, 2.0, 5.97e24]
      r: [6.791e6, 3.0, 1.496e11]
    shown: ['tex="E_{\text{mech}} = \frac{G M m}{2 r} - \frac{G M m}{r} = -\frac{G M m}{2 r}"']
    source: {cite: reading1, at: 'Sec. 25.4.1, Eq. (25.4.15) (the step is the page''s own)'}
    origin: page-own

