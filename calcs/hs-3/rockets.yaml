# Calculations on content/year-0/hs-3/rockets.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 12, Momentum and the Flow of Mass (mit); Ch. 10 (reading1);
# NASA, What Was the Saturn V? (saturnv) for the Saturn V figures.
# All worked-example numbers are the page's own: none of MIT's (Example 12.4: 2.81e7 kg rocket, 2.46e7 kg fuel, 510 s,
# u = 3000 m/s, 6250 m/s; Example 12.5: 2.03e7 kg, 150 s, 1.4e6 kg, 360 s, 3840, 3340, 7190 m/s) are reused.
# g = 9.81 m/s², written ga in the inputs.

page: content/year-0/hs-3/rockets.mdx
calcs:
  # --- Quiz ---
  - id: quiz-thrust
    where: 'quiz 2: thrust 40 kg/s × 2500 m/s = 1.0 × 10⁵ N'
    inputs: {mdot: 40 kg/s, u: 2500 m/s}
    formula: mdot * u
    expected: 1.0e5 N
    shown: ['$= 40 \\times 2500 = 1.0 \\times 10^{5}$ N']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.79), thrust (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-thrust-wrong-1
    where: 'quiz 2, wrong choices: 2500/40 = 63 and 40/2500 = 0.016'
    inputs: {mdot: 40, u: 2500}
    formula: u / mdot
    expected: '63'
    shown: ['Dividing the speed by the mass flow gives 63']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.79) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-thrust-wrong-2
    where: 'quiz 2, wrong choice: 40/2500 = 0.016'
    inputs: {mdot: 40, u: 2500}
    formula: mdot / u
    expected: '0.016'
    shown: ['the reverse division gives 0.016']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.79) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-step
    where: 'quiz 3: Δv = 2000 × 1.0 / 800 = 2.5 m/s'
    inputs: {u: 2000 m/s, dm: 1.0 kg, m: 800 kg}
    formula: u * dm / m
    expected: 2.5 m/s
    shown: ['$\\Delta v = u\\,\\Delta m / m = 2000 \\times 1.0 / 800 = 2.5$ m/s']
    source: {cite: mit, at: 'Sec. 12.3, Eqs. (12.3.70) to (12.3.74) (the numbers are the page''s own)'}
    origin: page-own
    quiz: 2

  - id: quiz-step-wrong
    where: 'quiz 3, wrong choices: 800/2000 = 0.40 and 2000 × 1.0 × 800 = 1.6e6'
    inputs: {u: 2000, dm: 1.0, m: 800}
    formula: m / (u * dm)
    expected: '0.40'
    shown: ['The answer 0.40 comes from dividing the wrong way round']
    source: {cite: mit, at: 'Sec. 12.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-step-wrong-2
    where: 'quiz 3, wrong choice: 2000 × 1.0 × 800 = 1.6 × 10⁶'
    inputs: {u: 2000, dm: 1.0, m: 800}
    formula: u * dm * m
    expected: '1.6e6'
    shown: ['$1.6 \\times 10^{6}$ from multiplying by the mass']
    source: {cite: mit, at: 'Sec. 12.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-rocket-eq
    where: 'quiz 4: 2.5 ln 4.0 ≈ 3.5 km/s'
    inputs: {u: 2.5 km/s, R: 4.0}
    formula: u * log(R)
    expected: 3.5 km/s
    shown: ['$\\Delta v = u \\ln 4.0 = 2.5 \\times 1.386 \\approx 3.5$ km/s']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) (the numbers are the page''s own)'}
    origin: page-own
    quiz: 3

  - id: quiz-ln4
    where: 'quiz 4: ln 4.0 = 1.386'
    inputs: {R: 4.0}
    formula: log(R)
    expected: '1.386'
    shown: ['2.5 \\times 1.386']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-rocket-eq-wrong-1
    where: 'quiz 4, wrong choice: u × R = 10 km/s'
    inputs: {u: 2.5 km/s, R: 4.0}
    formula: u * R
    expected: 10 km/s
    shown: ['Multiplying $u$ by the mass ratio gives 10 km/s']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-rocket-eq-wrong-2
    where: 'quiz 4, wrong choice: u log10 4 = 1.5 km/s'
    inputs: {u: 2.5 km/s, R: 4.0}
    formula: u * log10(R)
    expected: 1.5 km/s
    shown: ['using log (base 10) instead of ln gives 1.5 km/s']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-rocket-eq-wrong-3
    where: 'quiz 4, wrong choice: u (R − 1) = 7.5 km/s'
    inputs: {u: 2.5 km/s, R: 4.0}
    formula: u * (R - 1)
    expected: 7.5 km/s
    shown: ['$(4.0 - 1)$ gives 7.5 km/s']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "A short burst from a space probe" ---
  - id: probe-step
    where: 'worked example: Δv = 2400 × 2.0 / 1200 = 4.0 m/s'
    inputs: {u: 2400 m/s, dm: 2.0 kg, m: 1200 kg}
    formula: u * dm / m
    expected: 4.0 m/s
    shown: ['$\Delta v = u\,\Delta m / m = 2400 \times 2.0 / 1200 = 4.0$ m/s']
    source: {cite: mit, at: 'Sec. 12.3, Eqs. (12.3.70) to (12.3.74) (the numbers are the page''s own)'}
    origin: page-own

  - id: probe-gas-momentum
    where: 'check: gas momentum 2.0 × 2400 = 4800 kg·m/s'
    inputs: {u: 2400 m/s, dm: 2.0 kg}
    formula: u * dm
    expected: 4800 kg*m/s
    shown: ['$2.0 \times 2400 = 4800$ kg·m/s']
    source: {cite: reading1, at: 'Sec. 10.7, conservation of momentum (the numbers are the page''s own)'}
    origin: page-own

  - id: probe-fraction
    where: 'check: 2.0 kg is one six-hundredth of 1200 kg'
    inputs: {dm: 2.0 kg, m: 1200 kg}
    formula: m / dm
    expected: '600'
    shown: ['only one six-hundredth of the mass was thrown out']
    source: {cite: mit, at: 'Sec. 12.3 (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example "Can it lift off?" ---
  - id: liftoff-thrust
    where: 'worked example: thrust 250 × 2800 = 7.0 × 10⁵ N'
    inputs: {mdot: 250 kg/s, u: 2.8 km/s}
    formula: mdot * u
    expected: 7.0e5 N
    shown: ['$F_{\text{thrust}} = 250 \times 2800 = 7.0 \times 10^{5}$ N']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.79) (the numbers are the page''s own)'}
    origin: page-own

  - id: liftoff-weight
    where: 'worked example: weight 5.0e4 × 9.81 ≈ 4.9 × 10⁵ N'
    inputs: {m: 5.0e4 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 4.9e5 N
    shown: ['$F_g = m g = 5.0 \times 10^{4} \times 9.81 \approx 4.9 \times 10^{5}$ N']
    source: {cite: mit, at: 'Sec. 12.3.2, Eq. (12.3.96), the weight as the external force (the numbers are the page''s own)'}
    origin: page-own

  - id: liftoff-net
    where: 'worked example: net force 7.0e5 − 4.9e5 ≈ 2.1 × 10⁵ N'
    inputs: {mdot: 250 kg/s, u: 2.8 km/s, m: 5.0e4 kg, ga: 9.81 m/s**2}
    formula: mdot * u - m * ga
    expected: 2.1e5 N
    shown: ['$7.0 \times 10^{5} - 4.9 \times 10^{5} \approx 2.1 \times 10^{5}$ N']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.78) (the numbers are the page''s own)'}
    origin: page-own

  - id: liftoff-a
    where: 'worked example: a ≈ 4.2 m/s²'
    inputs: {mdot: 250 kg/s, u: 2.8 km/s, m: 5.0e4 kg, ga: 9.81 m/s**2}
    formula: (mdot * u - m * ga) / m
    expected: 4.2 m/s**2
    shown: ['$a = F_{\text{net}} / m \approx 2.1 \times 10^{5} / 5.0 \times 10^{4} \approx 4.2$ m/s²']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.78) (the numbers are the page''s own)'}
    origin: page-own

  # --- Saturn V ---
  - id: saturn-mass
    kind: fact
    where: 'Saturn V: about 2.8 million kg fully fuelled'
    value: 2.8e6 kg
    shown: ['had a mass of about 2.8 million kg when fully fuelled']
    source: {cite: saturnv, at: 'fully fueled for liftoff, 2.8 million kilograms'}
    origin: later-data

  - id: saturn-thrust
    kind: fact
    where: 'Saturn V: 34.5 million newtons of thrust at launch'
    value: 34.5e6 N
    shown: ['it gave 34.5 million newtons of thrust at launch']
    source: {cite: saturnv, at: '34.5 million newtons of thrust at launch'}
    origin: later-data

  - id: saturn-weight
    where: 'Saturn V weight 2.8e6 × 9.81 ≈ 2.75 × 10⁷ N'
    inputs: {m: 2.8e6 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 2.75e7 N
    shown: ['$2.8 \times 10^{6} \times 9.81 \approx 2.75 \times 10^{7}$ N']
    source: {cite: saturnv, at: 'fully fueled mass 2.8 million kilograms (the multiplication is the page''s own)'}
    origin: page-own

  - id: saturn-thrust-ratio
    where: 'Saturn V thrust only about a quarter more than the weight: 34.5e6 / 2.75e7 ≈ 1.25'
    inputs: {F: 34.5e6 N, m: 2.8e6 kg, ga: 9.81 m/s**2}
    formula: F / (m * ga)
    expected: '1.25'
    tolerance: 0.02
    shown: ['the thrust was only about a quarter more than the weight']
    source: {cite: saturnv, at: 'mass and thrust at launch (the ratio is the page''s own)'}
    origin: page-own

  - id: saturn-a
    where: 'Saturn V starting acceleration ≈ 2.5 m/s²'
    inputs: {F: 34.5e6 N, m: 2.8e6 kg, ga: 9.81 m/s**2}
    formula: (F - m * ga) / m
    expected: 2.5 m/s**2
    shown: ['$(3.45 \times 10^{7} - 2.75 \times 10^{7}) / 2.8 \times 10^{6} \approx 2.5$ m/s²']
    source: {cite: mit, at: 'Sec. 12.3, Eq. (12.3.78), with the Saturn V figures (the calculation is the page''s own)'}
    origin: page-own

  # --- Worked example "A burn in six steps" ---
  - id: six-first
    where: 'first burst: 2000 × 100 / 1000 = 200 m/s'
    inputs: {u: 2000 m/s, dm: 100 kg, m: 1000 kg}
    formula: u * dm / m
    expected: 200 m/s
    shown: ['$2000 \times 100 / 1000 = 200$ m/s']
    source: {cite: mit, at: 'Sec. 12.3, Eqs. (12.3.70) to (12.3.74) (the numbers are the page''s own)'}
    origin: page-own

  - id: six-gains
    where: 'gains of the bursts 2 to 6: 222, 250, 286, 333, 400 m/s (2000 × 100 / 900 … / 500); here the second'
    inputs: {u: 2000 m/s, dm: 100 kg, m: 900 kg}
    formula: u * dm / m
    expected: 222 m/s
    shown: ['then about 222, 250, 286, 333 and 400 m/s']
    source: {cite: mit, at: 'Sec. 12.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: six-total
    where: 'total of six bursts ≈ 1690 m/s'
    inputs: {u: 2000 m/s, dm: 100}
    formula: u * dm * (1/1000 + 1/900 + 1/800 + 1/700 + 1/600 + 1/500)
    expected: 1690 m/s
    tolerance: 5 m/s
    shown: ['The total is about 1690 m/s']
    source: {cite: mit, at: 'Sec. 12.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: six-one-burst
    where: 'all 600 kg in one burst: 2000 × 600 / 1000 = 1200 m/s'
    inputs: {u: 2000 m/s, dm: 600 kg, m: 1000 kg}
    formula: u * dm / m
    expected: 1200 m/s
    shown: ['$2000 \times 600 / 1000 = 1200$ m/s']
    source: {cite: mit, at: 'Sec. 12.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: six-limit-integral
    where: 'very many tiny steps: the sum of u Δm/m becomes the integral of u/m from 400 to 1000 kg ≈ 1830 m/s'
    inputs: {u: 2000}
    formula: integrate('u / x', 'x', 400, 1000)
    expected: '1830'
    shown: ['with very many tiny steps it approaches about 1830 m/s']
    source: {cite: mit, at: 'Sec. 12.3.1, Eqs. (12.3.80) to (12.3.84) (the numbers are the page''s own)'}
    origin: page-own

  - id: six-rocket-eq
    where: 'rocket equation: 2000 ln 2.5 ≈ 1.83 × 10³ m/s'
    inputs: {u: 2000 m/s, mi: 1000 kg, mf: 400 kg}
    formula: u * log(mi / mf)
    expected: 1.83e3 m/s
    shown: ['$\Delta v = 2000 \times \ln 2.5 \approx 1.83 \times 10^{3}$ m/s']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) (the numbers are the page''s own)'}
    origin: page-own

  - id: six-ratio
    where: 'mass ratio 1000 / 400 = 2.5'
    inputs: {mi: 1000 kg, mf: 400 kg}
    formula: mi / mf
    expected: '2.5'
    shown: ['$m_i / m_f = 1000 / 400 = 2.5$']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.86), mass ratio (the numbers are the page''s own)'}
    origin: page-own

  # --- Section "Why rockets are mostly fuel" ---
  - id: ln2
    where: 'doubling the mass ratio adds u ln 2 ≈ 0.69 u'
    inputs: {}
    formula: log(2)
    expected: '0.69'
    shown: ['$u \ln 2 \approx 0.69\,u$']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) (the page''s own remark)'}
    origin: page-own

  - id: plot-orbit-point
    where: 'graph: mass ratio about 11 for 7.7 km/s (point at R = 11.1, u = 3.2 km/s)'
    inputs: {u: 3.2 km/s, R: 11.1}
    formula: u * log(R)
    expected: 7.7 km/s
    shown: ['Reaching 7.7 km/s needs a mass ratio of about 11, and 11.2 km/s about 33']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-escape-point
    where: 'graph: mass ratio 33 gives 3.2 ln 33 ≈ 11.2 km/s'
    inputs: {u: 3.2 km/s, R: 33}
    formula: u * log(R)
    expected: 11.2 km/s
    tolerance: 0.05 km/s
    shown: ['{ x: 33, y: 11.2, label: "escape" }']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-u
    kind: fact
    where: 'graph caption: exhaust speed 3.2 km/s (the page''s own choice)'
    value: 3.2 km/s
    shown: ['with an exhaust speed of 3.2 km/s and no gravity or air']
    source: {cite: mit, at: 'Sec. 12.3.1 (the value is the page''s own choice)'}
    origin: page-own

  # --- Worked example "How much of a rocket must be fuel?" ---
  - id: orbit-ratio
    where: 'worked example: m_i/m_f = e^(7.7/3.2) = e^2.41 ≈ 11'
    inputs: {dv: 7.7 km/s, u: 3.2 km/s}
    formula: exp(dv / u)
    expected: '11'
    shown: ['$m_i / m_f = e^{7.7 / 3.2} = e^{2.41} \approx 11$']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) solved for the mass ratio (the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-exponent
    where: 'worked example: 7.7 / 3.2 = 2.41'
    inputs: {dv: 7.7 km/s, u: 3.2 km/s}
    formula: dv / u
    expected: '2.41'
    tolerance: 0.006
    shown: ['$3.2 \times \ln 11.1 \approx 3.2 \times 2.41 \approx 7.7$ km/s']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-left
    where: 'worked example: 1/11 ≈ 0.09 of the mass left'
    inputs: {dv: 7.7 km/s, u: 3.2 km/s}
    formula: 1 / exp(dv / u)
    expected: '0.09'
    shown: ['$1/11 \approx 0.09$']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-fuel
    where: 'worked example: about 91% fuel'
    inputs: {dv: 7.7 km/s, u: 3.2 km/s}
    formula: 100 * (1 - 1 / exp(dv / u))
    expected: '91'
    shown: ['About 91% of the rocket at launch must be fuel']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-speed-fact
    kind: fact
    where: 'low orbit speed 7.7 km/s, from lesson 2.12 (ISS)'
    value: 7.7 km/s
    shown: ['lesson 2.12 found 7.7 km/s for the International Space Station']
    source: {ref: 'lesson 2.12 (keplers-laws-and-orbits): v = √(GM/r) ≈ 7.66 km/s at 420 km'}
    origin: later-data

  # --- Gravity loss and escape ---
  - id: gravity-loss
    where: 'gravity loss over 120 s: 9.81 × 120 ≈ 1.2 × 10³ m/s'
    inputs: {ga: 9.81 m/s**2, t: 120 s}
    formula: ga * t
    expected: 1.2e3 m/s
    shown: ['$9.81 \times 120 \approx 1.2 \times 10^{3}$ m/s']
    source: {cite: mit, at: 'Sec. 12.3.2, Eqs. (12.3.100) and (12.3.101) (the numbers are the page''s own)'}
    origin: page-own

  - id: escape-ratio
    where: 'escape: e^(11.2/3.2) = e^3.5 ≈ 33'
    inputs: {dv: 11.2 km/s, u: 3.2 km/s}
    formula: exp(dv / u)
    expected: '33'
    shown: ['$e^{11.2/3.2} = e^{3.5} \approx 33$']
    source: {cite: mit, at: 'Sec. 12.3.1, Eq. (12.3.84) solved for the mass ratio (the numbers are the page''s own)'}
    origin: page-own

  - id: saturn-orbit-ratio
    where: 'Saturn V: 2.8e6 / 118 000 ≈ 24'
    inputs: {m: 2.8e6 kg, p: 118000 kg}
    formula: m / p
    expected: '24'
    shown: ['about 24 times the mass of what it could put into Earth orbit (about 118 000 kg)']
    source: {cite: saturnv, at: '2.8 million kilograms fully fueled; about 118,000 kilograms into Earth orbit (the ratio is the page''s own)'}
    origin: page-own

  - id: saturn-moon-ratio
    where: 'Saturn V: 2.8e6 / 43 500 ≈ 64'
    inputs: {m: 2.8e6 kg, p: 43500 kg}
    formula: m / p
    expected: '64'
    shown: ['about 64 times the mass of what it could send to the Moon (about 43 500 kg)']
    source: {cite: saturnv, at: '2.8 million kilograms fully fueled; about 43,500 kilograms to the moon (the ratio is the page''s own)'}
    origin: page-own

  - id: saturn-first-stage-altitude
    kind: fact
    where: 'Saturn V first stage lifted it to about 68 km'
    value: 68 km
    shown: ['the first lifted it to about 68 km']
    source: {cite: saturnv, at: 'the first stage lifted the rocket to an altitude of about 68 kilometers'}
    origin: later-data

  # --- Worked example "One stage or two?" ---
  - id: one-stage
    where: 'one stage: 2.8 ln 10 ≈ 6.4 km/s'
    inputs: {u: 2.8 km/s, mi: 100, mf: 10}
    formula: u * log(mi / mf)
    expected: 6.4 km/s
    shown: ['$\Delta v = 2.8 \ln 10 \approx 2.8 \times 2.30 \approx 6.4$ km/s']
    source: {cite: mit, at: 'Sec. 12.3.1, Eqs. (12.3.86) and (12.3.87) (the numbers are the page''s own)'}
    origin: page-own

  - id: stage-1
    where: 'first stage: 2.8 ln(100/30) ≈ 3.37 km/s'
    inputs: {u: 2.8 km/s, mi: 100, mf: 30}
    formula: u * log(mi / mf)
    expected: 3.37 km/s
    shown: ['$\Delta v_1 = 2.8 \ln (100/30) \approx 2.8 \times 1.20 \approx 3.37$ km/s']
    source: {cite: mit, at: 'Sec. 12.3.1, after Eq. (12.3.87), stages (the numbers are the page''s own)'}
    origin: page-own

  - id: stage-2
    where: 'second stage: 2.8 ln(23/3.0) ≈ 5.70 km/s'
    inputs: {u: 2.8 km/s, mi: 23, mf: 3.0}
    formula: u * log(mi / mf)
    expected: 5.70 km/s
    shown: ['$\Delta v_2 = 2.8 \ln (23/3.0) \approx 2.8 \times 2.04 \approx 5.70$ km/s']
    source: {cite: mit, at: 'Sec. 12.3.1, after Eq. (12.3.87), stages (the numbers are the page''s own)'}
    origin: page-own

  - id: two-stages-total
    where: 'two stages: 3.37 + 5.70 ≈ 9.1 km/s'
    inputs: {u: 2.8 km/s}
    formula: u * (log(100 / 30) + log(23 / 3.0))
    expected: 9.1 km/s
    shown: ['$3.37 + 5.70 \approx 9.1$ km/s']
    source: {cite: mit, at: 'Sec. 12.3.1, after Eq. (12.3.87), stages (the numbers are the page''s own)'}
    origin: page-own

  - id: stage-masses
    where: 'check: 70 + 7.0 + 20 + 2.0 + 1.0 = 100 t'
    inputs: {}
    formula: 70 + 7.0 + 20 + 2.0 + 1.0
    expected: '100'
    shown: ['$70 + 7.0 + 20 + 2.0 + 1.0 = 100$ t']
    source: {cite: mit, at: 'Sec. 12.3.1 (the numbers are the page''s own)'}
    origin: page-own
