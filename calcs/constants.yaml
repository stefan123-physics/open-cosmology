# Shared physical constants for the calculation tests (docs/CALC_TESTS_PLAN.md).
# Every calculation in calcs/<course>/<slug>.yaml may use these names in its formula.
# Values with units, parsed by pint. Astronomical units (yr = Julian year, Mpc, ly) come from pint itself.

c:
  value: 299792458 m/s
  source: "Exact (SI definition of the metre)"
G:
  value: 6.67430e-11 m**3/(kg*s**2)
  source: "CODATA 2018"
hbar:
  value: 1.054571817646e-34 J*s
  source: "h/2π with h = 6.62607015e-34 J s exact (2019 SI); CODATA prints 1.054571817... (truncated, not rounded)"
k_B:
  value: 1.380649e-23 J/K
  source: "Exact (2019 SI)"
M_sun:
  value: 1.98841e30 kg
  source: "IAU 2015 nominal solar mass parameter GM = 1.3271244e20 m^3/s^2, divided by G (CODATA 2018)"
