# Calculations on content/year-2/8.033/brachistochrone-catenary.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 9 slides (figure on slide 2), with the page's own example.

page: content/year-2/8.033/brachistochrone-catenary.mdx
calcs:
  - id: flat-board-length
    where: 'flat board from (0, 0) to (100 ft, 100 ft)'
    inputs: {}
    formula: 100*sqrt(2)
    expected: '141.4'
    tolerance: 0.05
    shown: ['141.4 ft long']
    source: {cite: mit, at: 'slide 2'}
    origin: page-own

  - id: flat-board-time
    where: 'flat board: √(2 × 141.4/(32/√2)) s, g = 32 ft/s²'
    inputs: {}
    formula: sqrt(2*100*sqrt(2)/(32/sqrt(2)))
    expected: '3.54'
    tolerance: 0.005
    shown: ['takes 3.54 s']
    source: {cite: mit, at: 'slide 2'}
    origin: mit

  - id: cycloid-theta
    where: 'cycloid through (100, 100): θ − sin θ = 1 − cos θ'
    inputs: {}
    formula: solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)
    expected: '2.41'
    tolerance: 0.005
    shown: ['$\theta \approx 2.41$']
    source: {cite: mit, at: 'slide 2'}
    origin: page-own

  - id: cycloid-radius
    where: 'cycloid radius R = 100/(1 − cos θ) ft'
    inputs: {}
    formula: 100/(1 - cos(solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)))
    expected: '57.3'
    tolerance: 0.05
    shown: ['$R \approx 57.3$ ft']
    source: {cite: mit, at: 'slide 2'}
    origin: page-own

  - id: cycloid-radius-plot
    where: 'radius used in the graph'
    inputs: {}
    formula: 100/(1 - cos(solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)))
    expected: '57.29'
    tolerance: 0.005
    shown: ['cycloid with R = 57.29 ft (θ from 0 to 2.412)']
    source: {cite: mit, at: 'slide 2'}
    origin: page-own

  - id: cycloid-time
    where: 'cycloid time θ√(R/g), g = 32 ft/s²'
    inputs: {}
    formula: solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)*sqrt(100/(1 - cos(solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)))/32)
    expected: '3.23'
    tolerance: 0.005
    shown: ['and takes 3.23 s']
    source: {cite: mit, at: 'slide 2'}
    origin: mit

  - id: arc-time
    where: 'quarter circle of radius 100 ft from rest at the vertical tangent: √(R/g) K(1/√2), g = 32 ft/s²'
    inputs: {}
    formula: sqrt(100/32)*integrate('1/sqrt(1 - 0.5*sin(f)**2)', 'f', 0, pi/2)
    expected: '3.28'
    tolerance: 0.005
    shown: ['takes about 3.28 s by numerical integration']
    source: {cite: mit, at: 'slide 2'}
    origin: page-own

  - id: arc-vs-cycloid
    where: 'difference arc − cycloid'
    inputs: {}
    formula: sqrt(100/32)*integrate('1/sqrt(1 - 0.5*sin(f)**2)', 'f', 0, pi/2) - solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)*sqrt(100/(1 - cos(solve('(q - sin(q)) - (1 - cos(q))', 'q', 1, 3)))/32)
    expected: '0.05'
    tolerance: 0.005
    shown: ['though only by 0.05 s']
    source: {cite: mit, at: 'slide 2'}
    origin: page-own

  - id: figure-times
    kind: fact
    where: 'times shown in the figure (flat board, cycloid, circular arc)'
    value: '3.54, 3.23, 3.23 s'
    shown: ['3.54 s on a flat board, 3.23 s on a cycloid and 3.23 s on a circular arc']
    source: {cite: mit, at: 'slide 2'}
    origin: mit

  - id: cycloid-step
    kind: identity
    where: 'along the cycloid ds/v = √(R/g) dθ (R = 2, g = 9.81)'
    formula: 2*2*sin(q/2)/sqrt(2*9.81*2*(1 - cos(q)))
    equals: sqrt(2/9.81)
    samples: {q: [0.3, 1.5, 3.0]}
    tolerance: 1e-9
    shown: ['$v = 2\sqrt{gR}\sin(\theta/2)$']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: first-integral
    kind: identity
    where: 'L − y''∂L/∂y'' for L = √(1 + p²)/√(2gy) equals 1/(√(2gy)√(1 + p²))'
    formula: sqrt(1 + p**2)/sqrt(2*9.81*y) - p*deriv('sqrt(1 + q**2)/sqrt(2*9.81*y)', 'q', p)
    equals: 1/(sqrt(2*9.81*y)*sqrt(1 + p**2))
    samples: {p: [0.2, 1.0, 3.0], y: [0.5, 2.0, 7.0]}
    tolerance: 1e-6
    shown: ['= \text{constant}, \qquad\text{so}\qquad y\left(1 + y''^2\right) = 2R']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-slide-time
    where: 'example: π√(5/9.81) s'
    inputs: {}
    formula: pi*sqrt(5/9.81)
    expected: '2.24'
    tolerance: 0.005
    shown: ['$T = \pi\sqrt{R/g} \approx 2.24$ s']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-across
    where: 'example: πR across, R = 5 m'
    inputs: {}
    formula: pi*5
    expected: '15.7'
    tolerance: 0.05
    shown: ['$\pi R \approx 15.7$ m across']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-ramp-length
    where: 'example: √(15.71² + 10²) m'
    inputs: {}
    formula: sqrt((pi*5)**2 + 10**2)
    expected: '18.6'
    tolerance: 0.05
    shown: ['The straight ramp is 18.6 m long']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-ramp-accel
    where: 'example: 9.81 × 10/18.62 m/s²'
    inputs: {}
    formula: 9.81*10/sqrt((pi*5)**2 + 10**2)
    expected: '5.27'
    tolerance: 0.005
    shown: ['g \times 10/18.6 \approx 5.27$ m/s²']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-ramp-time
    where: 'example: √(2L/a) for the ramp'
    inputs: {}
    formula: sqrt(2*sqrt((pi*5)**2 + 10**2)/(9.81*10/sqrt((pi*5)**2 + 10**2)))
    expected: '2.66'
    tolerance: 0.005
    shown: ['\approx 2.66$ s']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-sag
    where: 'example: 2(cosh 1.5 − 1) m'
    inputs: {}
    formula: 2*(cosh(1.5) - 1)
    expected: '2.70'
    tolerance: 0.005
    shown: ['a(\cosh 1.5 - 1) \approx 2.70$ m']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-chain-length
    where: 'example: 2 × 2 sinh 1.5 m, also as the arc-length integral'
    inputs: {}
    formula: integrate('sqrt(1 + sinh(x/2)**2)', 'x', -3, 3)
    expected: '8.52'
    tolerance: 0.005
    shown: ['= 2a\sinh 1.5 \approx 8.52$ m']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own
