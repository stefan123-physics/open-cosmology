  - id: p3-e-against-d
    where: 'Problem 3(e), check: binding energy over the electric energy of part (d)'
    inputs: {Eb: 28.295 MeV, U1: 14.4 eV}
    formula: Eb/U1
    expected: '2e6'
    tolerance: 1e5
    shown: ['a fraction two million times larger']
    source: {cite: mit, at: 'Problem 3(e) (our own check)'}
    origin: page-own

  # ---- Problem 4: transforming a photon (components in units of hbar omega / c)

  # Independent route: the null condition fixes the x component from the other three (angles in the first quadrant).
  - id: p4-a
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box: x component from the null condition p_x² = (E/c)² − p_y² − p_z²'
    formula: sin(theta)*cos(phi)
    equals: sqrt(1 - cos(theta)**2 - (sin(theta)*sin(phi))**2)
    samples:
      theta: [0.3, 0.6, 0.9, 1.2, 1.0]
      phi: [0.2, 1.3, 0.7, 1.0, 0.4]
    tolerance: 1e-10
    shown: ['id="p4-a"']
    source: {cite: reading3, at: 'slide 24'}
    origin: page-own

  # Independent route: solve the inverse boost p_z = gamma (s + beta E'/c) for s = p_z', with E'/c = gamma (1 − beta cos theta).
  - id: p4-c
    kind: identity
    answer: p4-c
    where: 'Problem 4(c), answer box: against a numerical solve of the inverse Lorentz transformation'
    formula: (cos(theta) - beta)/sqrt(1 - beta**2)
    equals: solve('(s + beta*(1 - beta*cos(theta))/sqrt(1 - beta**2))/sqrt(1 - beta**2) - cos(theta)', 's', -10, 10)
    samples:
      theta: [0.3, 0.6, 0.9, 1.2, 1.0]
      beta: [0.1, 0.8, 0.5, 0.3, 0.65]
    tolerance: 1e-8
    shown: ['id="p4-c"']
    source: {cite: reading1, at: 'slide 27'}
    origin: page-own

  # Independent route: the photon stays a photon, so E'/c is the length of the transformed 3-momentum.
  - id: p4-d-e
    kind: identity
    answer: p4-d-e
    where: 'Problem 4(d), answer box: energy ratio from the length of the transformed momentum'
    formula: (1 - beta*cos(theta))/sqrt(1 - beta**2)
    equals: sqrt(sin(theta)**2 + ((cos(theta) - beta)/sqrt(1 - beta**2))**2)
    samples:
      theta: [0.3, 0.6, 0.9, 1.2, 1.0]
      beta: [0.1, 0.8, 0.5, 0.3, 0.65]
    tolerance: 1e-10
    shown: ['id="p4-d-e"']
    source: {cite: mit, at: 'Problem 4(d), p. 2 (our own solution)'}
    origin: page-own

  # Independent route: the half-angle form of aberration, tan(theta'/2) = sqrt((1 + beta)/(1 − beta)) tan(theta/2).
  - id: p4-d-cos
    kind: identity
    answer: p4-d-cos
    where: 'Problem 4(d), answer box: against the half-angle form of the aberration formula'
    formula: (cos(theta) - beta)/(1 - beta*cos(theta))
    equals: cos(2*atan(sqrt((1 + beta)/(1 - beta))*tan(theta/2)))
    samples:
      theta: [0.3, 0.6, 0.9, 1.2, 1.0]
      beta: [0.1, 0.8, 0.5, 0.3, 0.65]
    tolerance: 1e-10
    shown: ['id="p4-d-cos"']
    source: {cite: reading1, at: 'slide 27'}
    origin: page-own

  - id: p4-d-sine
    kind: identity
    where: 'Problem 4(d), check: sin² + cos² of the new angle is 1'
    formula: (sin(theta)/((1 - beta*cos(theta))/sqrt(1 - beta**2)))**2 + ((cos(theta) - beta)/(1 - beta*cos(theta)))**2
    equals: 1
    samples:
      theta: [0.3, 0.6, 0.9, 1.2, 2.5]
      beta: [0.1, 0.8, 0.5, 0.3, 0.65]
    tolerance: 1e-10
    shown: ['$\sin\theta'' = \sin\theta/[\gamma(1 - \beta\cos\theta)]$']
    source: {cite: mit, at: 'Problem 4(d) (our own check)'}
    origin: page-own

  - id: p4-d-forward
    kind: identity
    where: 'Problem 4(d), check: the forward photon, gamma (1 − beta) = sqrt((1 − beta)/(1 + beta))'
    formula: (1 - beta)/sqrt(1 - beta**2)
    equals: sqrt((1 - beta)/(1 + beta))
    samples:
      beta: [0.1, 0.8, 0.5, 0.3, 0.65]
    tolerance: 1e-12
    shown: ['$E''/E = \gamma(1 - \beta) = \sqrt{(1 - \beta)/(1 + \beta)}$']
    source: {cite: mit, at: 'Problem 4(d) (our own check)'}
    origin: page-own

  # ---- Problem 5: speeding up on a circle

  # Independent route: solve the motion. p = F t gives u(t) = (F t/M0)/sqrt(1 + (F t/(M0 c))²); differentiate it
  # numerically at the time when the Lorentz factor is gamma, t = M0 c sqrt(gamma² − 1)/F.
  - id: p5-a
    kind: identity
    answer: p5-a
    where: 'Problem 5(a), answer box: against the numerical derivative of the solved motion u(t)'
    formula: F/(gamma**3*M0)
    equals: deriv('F*s/M0/sqrt(1 + (F*s/(M0*c))**2)', 's', M0*c*sqrt(gamma**2 - 1)/F)
    samples:
      F: [1, 2.5, 5, 3.3, 1.7]
      gamma: [1.5, 2, 5, 3.1, 4.2]
      M0: [1, 4, 2.2, 3, 1.5]
      c: [3, 2, 5, 1, 4]
    tolerance: 1e-7
    shown: ['id="p5-a"']
    source: {cite: mit, at: 'Problem 5(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p5-a-gamma-cubed
    kind: identity
    where: 'Problem 5(a), formula "Derivative of gamma times u": numerical derivative of u/sqrt(1 − u²) (c = 1)'
    formula: deriv('s/sqrt(1 - s**2)', 's', u)
    equals: (1 - u**2)**(-3/2)
    samples:
      u: [0.1, 0.5, 0.8, 0.95]
    tolerance: 1e-7
    shown: ['<Formula label="Derivative of gamma times u"']
    source: {cite: reading2, at: 'slide 10'}
