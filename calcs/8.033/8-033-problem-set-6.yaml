    where: 'Problem 5(b), check: for large gamma, sqrt(gamma² − 1) approaches gamma'
    formula: sqrt(gamma**2 - 1)/gamma
    limit: 1
    vary: {gamma: [10, 100, 1000]}
    tolerance: 1e-6
    shown: ['$B \approx \gamma M_0c/(qR) = E/(qcR)$']
    source: {cite: mit, at: 'Problem 5(b) (our own check)'}
    origin: page-own

