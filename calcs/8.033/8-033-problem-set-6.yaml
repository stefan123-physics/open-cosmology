  - id: p1-z-over-proton
    where: 'Problem 1(d), check: Z boson mass over proton mass'
    inputs: {mZ: 91188 MeV, mp: 938.272 MeV}
    formula: mZ/mp
    expected: '97'
    shown: ['about 97 times the proton']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  # ---- Problem 2: forbidden reactions

  - id: p2-pair-threshold
