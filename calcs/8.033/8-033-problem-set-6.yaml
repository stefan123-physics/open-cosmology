  # ---- Problem 8: smallest surface of revolution

  - id: p8-ring
    kind: identity
    where: 'Problem 8(b), check: a horizontal line sweeps a flat ring (numerical integral of 2 pi x)'
    formula: integrate('2*pi*s', 's', x1, x2)
    equals: pi*(x2**2 - x1**2)
    samples:
      x1: [0.5, 1, 2, 0.3]
      x2: [1.5, 3, 2.5, 4]
    tolerance: 1e-9
    shown: ['$\pi(x_2^2 - x_1^2)$']
    source: {cite: mit, at: 'Problem 8(b) (our own check)'}
    origin: page-own

  # Independent route: the numerical derivative of MIT's result (8.5), y = a acosh(x/a) + b.
  - id: p8-slope
    kind: identity
    answer: p8-slope
    where: 'Problem 8(d), answer box: against the numerical derivative of y = a acosh(x/a) + b'
    formula: a/sqrt(x**2 - a**2)
    equals: deriv('a*acosh(s/a) + b', 's', x)
    samples:
      a: [0.5, 0.7, 1, 0.85, 0.6]
      x: [1.5, 2.2, 4, 3.1, 1.8]
      b: [0, 1, -2, 0.5, 3]
    tolerance: 1e-7
    shown: ['id="p8-slope"']
    source: {cite: mit, at: 'Problem 8(d), eq. (8.4), p. 3'}
    origin: page-own

  - id: p8-first-integral
    kind: identity
    where: 'Problem 8(d), check: the slope satisfies the first integral x y′/sqrt(1 + y′²) = a'
    formula: x*(a/sqrt(x**2 - a**2))/sqrt(1 + (a/sqrt(x**2 - a**2))**2)
    equals: a
    samples:
      a: [0.5, 0.7, 1, 0.85, 0.6]
      x: [1.5, 2.2, 4, 3.1, 1.8]
    tolerance: 1e-10
    shown: ['so $xy''/\sqrt{1 + y''^2} = a$, as required']
    source: {cite: mit, at: 'Problem 8(c), eq. (8.3), p. 3'}
    origin: page-own

  - id: p8-inverse
    kind: identity
    where: 'Problem 8(e), check: dx/dy of x = a cosh((y − b)/a), numerically, against sqrt(x² − a²)/a'
    formula: deriv('a*cosh((s - b)/a)', 's', y)
    equals: sqrt((a*cosh((y - b)/a))**2 - a**2)/a
    samples:
      a: [0.5, 0.7, 1, 0.85]
      b: [0, 1, -2, 0.5]
      y: [0.4, 2.2, -1, 1.5]
    tolerance: 1e-7
    shown: ['$dx/dy = \sinh[(y - b)/a] = \sqrt{x^2 - a^2}/a$']
    source: {cite: mit, at: 'Problem 8(e), eq. (8.6), p. 4'}
    origin: page-own
