  - id: p1-water-ev
    where: 'Problem 1(c), check: energy released per reaction (two water molecules)'
    inputs: {H: 241.826 kJ/mol}
    formula: 2*H/avogadro_constant
    expected: 5.01 eV
    shown: ['which is 5.01 eV for the two water molecules']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1-water-rest
    where: 'Problem 1(c), check: rest energy of two water molecules'
    inputs: {amu: 931.494 MeV}
    formula: 2*18.015*amu
    expected: 3.356e10 eV
    shown: ['= 3.356\times 10^{10}$ eV']
    source: {cite: codata, at: 'atomic mass unit energy equivalent, 931.494 MeV; molar mass of water 18.015 g/mol'}
    origin: page-own

  - id: p1-water-fraction
    where: 'Problem 1(c), check: fraction of the rest mass that is lost'
    inputs: {H: 241.826 kJ/mol, amu: 931.494 MeV}
    formula: (2*H/avogadro_constant)/(2*18.015*amu)
    expected: '1.5e-10'
    shown: ['a fraction $1.5\times 10^{-10}$']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
