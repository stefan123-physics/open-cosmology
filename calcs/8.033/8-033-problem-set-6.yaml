    where: 'Problem 5(b), answer box: against a numerical solve of the force balance'
    formula: M0*c*sqrt(gamma**2 - 1)/(q*R)
    equals: solve('q*(c*sqrt(1 - 1/gamma**2))*s - gamma*M0*(c*sqrt(1 - 1/gamma**2))**2/R', 's', 0, 1000)
    samples:
      M0: [1, 4, 2.2, 3, 1.5]
      c: [2, 5, 3, 4.4, 2.5]
      gamma: [1.5, 2, 5, 3.1, 4.2]
      q: [1, 3, 2, 1.4, 2.6]
      R: [1, 4, 2.5, 3.2, 1.8]
    tolerance: 1e-8
    shown: ['id="p5-b"']
    source: {cite: reading2, at: 'slide 21 (question only; the answer is our own)'}
    origin: page-own

  - id: p5-b-high-energy
