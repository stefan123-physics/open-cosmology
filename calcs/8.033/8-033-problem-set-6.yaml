# Calculations on content/year-2/8.033/8-033-problem-set-6.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# the centre-of-momentum frame built from its own speed (Problem 1), the null condition and the half-angle form of
# aberration (Problem 4), the solved motion p = F t and a numerical force balance (Problem 5), a numerical solve of
# the quadratic (Problem 7), numerical derivatives and integrals (Problem 8).
# Particle masses: CODATA 2022 (proton 938.272, neutron 939.565, electron 0.510999, alpha 3727.379 MeV) and PDG 2024.

page: content/year-2/8.033/8-033-problem-set-6.mdx
calcs:
  # ---- Problem 1: collider against fixed target

  # Independent route: E² = (invariant mass)² + p², with the invariant 2(γ + 1) and p² = γ² − 1 (units of m0 c²).
  - id: p1-lab
    kind: identity
    answer: p1-lab
    where: 'Problem 1(a), answer box: lab energy from the invariant mass and the momentum'
    formula: gamma + 1
    equals: sqrt(2*(gamma + 1) + (gamma**2 - 1))
    samples:
      gamma: [1.5, 2, 5, 12.3, 20]
    tolerance: 1e-12
    shown: ['id="p1-lab"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  # Independent route: the CM frame moves at beta_cm = p/E = sqrt(γ² − 1)/(γ + 1); in it both particles have the
  # Lorentz factor gamma_cm, so the energy is 2 gamma_cm.
  - id: p1-cm
    kind: identity
    answer: p1-cm
    where: 'Problem 1(a), answer box: CM energy as twice the Lorentz factor of the CM frame'
    formula: sqrt(2*(gamma + 1))
    equals: 2/sqrt(1 - (sqrt(gamma**2 - 1)/(gamma + 1))**2)
    samples:
      gamma: [1.5, 2, 5, 12.3, 20]
    tolerance: 1e-10
    shown: ['id="p1-cm"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-ratio
    kind: identity
    answer: p1-ratio
    where: 'Problem 1(a), answer box: the ratio is the Lorentz factor of the CM frame'
    formula: sqrt((gamma + 1)/2)
    equals: 1/sqrt(1 - (sqrt(gamma**2 - 1)/(gamma + 1))**2)
    samples:
      gamma: [1.5, 2, 5, 12.3, 20]
    tolerance: 1e-10
    shown: ['id="p1-ratio"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lhc-design
    kind: fact
    where: 'Problem 1(b), statement: the LHC design energy per proton (our own choice of numbers)'
    value: '7 TeV per proton, 14 TeV in the CM frame'
    shown: ['each proton with an energy of 7 TeV']
    source: {cite: reading2, at: 'slide 19 (the LHC; the 7 TeV design energy is also in the lesson''s worked example)'}
    origin: page-own

  - id: p1-proton
    kind: fact
    where: 'Problem 1(b), statement: proton rest energy, CODATA 2022 (938.27208943 MeV)'
    value: '0.938272 GeV'
    shown: ['The rest energy of the proton is 0.938272 GeV.']
    source: {cite: codata, at: 'proton mass energy equivalent in MeV'}
    origin: later-data

  - id: p1-fixed-target
    answer: p1-fixed
    where: 'Problem 1(b), answer box: beam energy on a fixed target for 14 TeV in the CM frame'
    inputs: {Ecm: 14000 GeV, mp: 0.938272 GeV}
    formula: Ecm**2/(2*mp) - mp
    expected: 1.04e5 TeV
    shown: ['id="p1-fixed"', '= 1.04\times 10^{5}\ \text{TeV}"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-fixed-target-gev
    where: 'Problem 1(b), solution: the same in GeV'
    inputs: {Ecm: 14000 GeV, mp: 0.938272 GeV}
    formula: Ecm**2/(2*mp) - mp
    expected: 1.04e8 GeV
    shown: ['1.04\times 10^{8}\ \text{GeV}']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # Back the other way: that beam on a proton at rest gives 14 TeV in the CM frame.
  - id: p1-fixed-target-back
    where: 'Problem 1(b), statement: 14 TeV in the CM frame, recovered from the beam energy'
    inputs: {Eb: 1.044473e8 GeV, mp: 0.938272 GeV}
    formula: sqrt(2*mp*(Eb + mp))
    expected: 14 TeV
    tolerance: 0.001 TeV
    shown: ['so that 14 TeV is available in the CM frame']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-times-lhc
    where: 'Problem 1(b), check: the fixed-target beam energy over 7 TeV'
    inputs: {Ecm: 14000 GeV, mp: 0.938272 GeV, E1: 7000 GeV}
    formula: (Ecm**2/(2*mp) - mp)/E1
    expected: '15000'
    tolerance: 100
    shown: ['about 15 000 times the 7 TeV of one LHC beam']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-gamma-lhc
    where: 'Problem 1(b), check: Lorentz factor of a 7 TeV proton'
    inputs: {mp: 0.938272 GeV, E1: 7000 GeV}
    formula: E1/mp
    expected: '7460'
    tolerance: 5
    shown: ['($\gamma \approx 7460$)']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-cm-lhc-fixed
    where: 'Problem 1(b), check: CM energy of a 7 TeV proton on a proton at rest'
    inputs: {mp: 0.938272 GeV, E1: 7000 GeV}
    formula: sqrt(2*(E1/mp + 1))*mp
    expected: 115 GeV
    shown: ['only about 115 GeV in the CM frame']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-cm-lhc-percent
    where: 'Problem 1(b), check: that CM energy as a percentage of the lab energy (1.6%)'
    inputs: {mp: 0.938272 GeV, E1: 7000 GeV}
    formula: 100*sqrt(2*(E1/mp + 1))*mp/(E1 + mp)
    expected: '1.6'
    shown: ['less than 2% of the beam energy']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-lhc-later
    kind: fact
    where: 'Problem 1(b), check: first collisions 2009; 6.8 TeV per proton since 2022'
    value: '2009; 6.8 TeV'
    shown: ['has run at up to 6.8 TeV per proton']
    source: {ref: 'CERN: first LHC collisions in November 2009; Run 3 from July 2022 at 6.8 TeV per beam (13.6 TeV collisions)'}
    origin: later-data

  - id: p1-water-enthalpy
    kind: fact
    where: 'Problem 1(c), check: enthalpy of formation of water vapour'
    value: '241.826 kJ/mol'
    shown: ['releases 241.826 kJ per mole of water']
    source: {cite: webbook, at: 'gas phase thermochemistry data, enthalpy of formation'}
