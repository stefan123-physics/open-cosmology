    where: 'Problem 3(d), check: electric over gravitational force between two protons, in powers of ten'
    inputs: {mp: 1.67262e-27 kg, d1: 1 m}
    formula: log10(elementary_charge**2/(4*pi*vacuum_permittivity*d1**2)/(G*mp**2/d1**2))
    expected: '36'
    shown: ['about 36 powers of ten']
    source: {cite: mit, at: 'Problem 3(d) (our own check)'}
    origin: page-own

  - id: p3-e-sum
    where: 'Problem 3(e), solution: rest energy of two free protons and two free neutrons'
    inputs: {mn: 939.565 MeV, mp: 938.272 MeV}
    formula: 2*mp + 2*mn
    expected: 3755.674 MeV
    shown: ['$2 \times 938.272 + 2 \times 939.565 = 3755.674$ MeV']
    source: {cite: mit, at: 'Problem 3(e) (our own solution)'}
    origin: page-own

