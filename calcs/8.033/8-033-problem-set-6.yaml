    where: 'Problem 3(e), solution: alpha particle rest energy, CODATA 2022 (3727.3794118 MeV)'
    value: '3727.379 MeV'
    shown: ['The alpha particle has 3727.379 MeV.']
    source: {cite: codata, at: 'alpha particle mass energy equivalent in MeV'}
