  - id: p1-neutron-excess
    where: 'Problem 1(d), check: energy left over in neutron decay'
    inputs: {mn: 939.565 MeV, mp: 938.272 MeV, me: 0.511 MeV}
    formula: mn - mp - me
    expected: 0.782 MeV
    shown: ['$939.565 - 938.272 - 0.511 = 0.782$ MeV']
