  - id: p3-e-binding
    where: 'Problem 3(e), formula: binding energy of the alpha particle'
    inputs: {mn: 939.565 MeV, mp: 938.272 MeV, ma: 3727.379 MeV}
    formula: 2*mp + 2*mn - ma
    expected: 28.295 MeV
    shown: ['= 28.295\ \text{MeV}"']
    source: {cite: mit, at: 'Problem 3(e) (our own solution)'}
    origin: page-own

  - id: p3-e-percent
    where: 'Problem 3(e), check: binding energy as a percentage of the free rest energy'
    inputs: {mn: 939.565 MeV, mp: 938.272 MeV, ma: 3727.379 MeV}
    formula: 100*(2*mp + 2*mn - ma)/(2*mp + 2*mn)
    expected: '0.75'
    shown: ['lighter than its parts by 0.75%']
    source: {cite: mit, at: 'Problem 3(e) (our own check)'}
