  # ---- Problem 7: photon rocket

  # Independent route: a numerical solve of the quadratic f² − 2 gamma f + 1 = 0 between 0 and 1.
  - id: p7-f
    kind: identity
    answer: p7-f
    where: 'Problem 7(a), answer box: against a numerical solve of the quadratic'
    formula: gamma - sqrt(gamma**2 - 1)
    equals: solve('s**2 - 2*gamma*s + 1', 's', 0, 1)
    samples:
      gamma: [1.5, 2, 5, 12.3, 20]
    tolerance: 1e-8
    shown: ['id="p7-f"']
    source: {cite: mit, at: 'Problem 7, p. 2 (our own solution)'}
    origin: page-own

  # The root satisfies energy conservation: payload energy gamma f plus light energy (1 − f²)/2 is the starting 1.
  - id: p7-energy
    kind: identity
    where: 'Problem 7(a), formula "Energy of the light": energy conservation with the root, in units of M_i c²'
    formula: gamma*(gamma - sqrt(gamma**2 - 1)) + (1 - (gamma - sqrt(gamma**2 - 1))**2)/2
    equals: 1
    samples:
      gamma: [1.5, 2, 5, 12.3, 20]
    tolerance: 1e-10
    shown: ['<Formula label="Energy of the light"']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  # And momentum conservation: payload momentum sqrt(gamma² − 1) f equals the light's (1 − f²)/2.
  - id: p7-momentum
    kind: identity
    where: 'Problem 7(a), formula "Energy and momentum of the photon rocket": momentum conservation with the root'
    formula: sqrt(gamma**2 - 1)*(gamma - sqrt(gamma**2 - 1))
    equals: (1 - (gamma - sqrt(gamma**2 - 1))**2)/2
    samples:
      gamma: [1.5, 2, 5, 12.3, 20]
    tolerance: 1e-9
    shown: ['<Formula label="Energy and momentum of the photon rocket"']
    source: {cite: mit, at: 'Problem 7, p. 2 (our own solution)'}
    origin: page-own

  - id: p7-large-gamma
    kind: limit
    where: 'Problem 7(a), check: for large gamma, f approaches 1/(2 gamma)'
    formula: (gamma - sqrt(gamma**2 - 1))*2*gamma
    limit: 1
    vary: {gamma: [10, 100, 1000]}
    tolerance: 1e-6
    shown: ['$f \approx 1/(2\gamma)$']
    source: {cite: mit, at: 'Problem 7 (our own check)'}
    origin: page-own

  # Independent route: the quadratic solved numerically with gamma = 1/sqrt(1 − beta²).
