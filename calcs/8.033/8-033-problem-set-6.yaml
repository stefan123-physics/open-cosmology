    formula: 100*(mn - mp)/mp
    expected: '0.14'
    shown: ['a difference of 1.293 MeV or 0.14%']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-b-electrons
    where: 'Problem 3(b), solution: 1000 electron rest energies'
    inputs: {me: 0.511 MeV}
    formula: 1000*me
    expected: 511 MeV
    shown: ['$1000 \times 0.511\ \text{MeV} = 511$ MeV']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-ratio
