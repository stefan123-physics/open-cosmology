  - id: p1-masses
    kind: fact
    where: 'Problem 1(d), solution: rest energies, CODATA 2022 (0.51099895, 938.27208943, 939.56542194 MeV)'
    value: '0.511, 938.272, 939.565 MeV'
    shown: ['electron (0.511 MeV), proton (938.272 MeV), neutron (939.565 MeV)']
    source: {cite: codata, at: 'electron, proton and neutron mass energy equivalents in MeV'}
    origin: later-data

  - id: p1-z-mass
    kind: fact
    where: 'Problem 1(d), solution: Z boson mass, PDG 2024 (91.1880 ± 0.0020 GeV)'
    value: '91.188 GeV'
    shown: ['Z boson (91.188 GeV, which is 91 188 MeV)']
    source: {cite: pdg, at: 'Z boson mass'}
    origin: later-data

  - id: p1-slide-masses
    kind: fact
    where: 'Problem 1(d), solution: the slide''s 2006 values'
    value: '938.26 and 939.55 MeV'
    shown: ['938.26 and 939.55 MeV']
    source: {cite: reading4, at: 'slide 11'}
