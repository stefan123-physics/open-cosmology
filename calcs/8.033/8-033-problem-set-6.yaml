    value: '105.658 MeV'
    shown: ['105.658 MeV against the electron']
    source: {cite: pdg, at: 'muon mass'}
    origin: later-data

  - id: p3-c-ratio
    where: 'Problem 3(c), solution: muon over electron mass'
    inputs: {mmu: 105.658 MeV, me: 0.511 MeV}
    formula: mmu/me
    expected: '207'
    shown: ['still 207 times less rest mass']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-gamma-muon
    where: 'Problem 3(c), check: Lorentz factor of a 10 GeV muon'
    inputs: {mmu: 105.658 MeV, E1: 10 GeV}
    formula: E1/mmu
    expected: '95'
    shown: ['about 95 for the muon']
    source: {cite: mit, at: 'Problem 3(c) (our own check)'}
    origin: page-own

  - id: p3-c-gamma-electron
    where: 'Problem 3(c), check: Lorentz factor of a 100 GeV electron'
    inputs: {me: 0.511 MeV, E1: 100 GeV}
    formula: E1/me
    expected: '196000'
    tolerance: 500
    shown: ['about 196 000 for the electron']
    source: {cite: mit, at: 'Problem 3(c) (our own check)'}
    origin: page-own

  - id: p3-d-coulomb-constant
    where: 'Problem 3(d), formula: e²/(4 pi epsilon0) in eV nm'
    inputs: {d1: 1 nm}
    formula: elementary_charge**2/(4*pi*vacuum_permittivity*d1)*d1
    expected: 1.44 eV*nm
    shown: ['\frac{1.44\ \text{eV nm}}{0.1\ \text{nm}}']
    source: {cite: codata, at: 'elementary charge and electric constant'}
    origin: page-own

  - id: p3-d-coulomb
    where: 'Problem 3(d), formula: potential energy of two protons 1e-10 m apart'
    inputs: {d1: 1e-10 m}
