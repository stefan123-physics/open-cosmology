# Calculations on content/year-2/8.033/lorentz-transformation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 4 slides, with the page's own example.

page: content/year-2/8.033/lorentz-transformation.mdx
calcs:
  - id: cone-conditions
    kind: identity
    where: 'with Λ₁₁ = Λ₄₄ = γ, Λ₄₁ = −βγ: Λ₁₁² − Λ₄₁² = 1 (β samples)'
    formula: (1/sqrt(1 - b**2))**2 - (b/sqrt(1 - b**2))**2
    equals: 1 + 0*b
    samples: {b: [0.1, 0.6, 0.95]}
    tolerance: 1e-9
    shown: ['gamma(ct - \beta x) \end{pmatrix}" cite']
    source: {cite: mit, at: 'slide 15'}
    origin: mit

  - id: cone-conditions-2
    kind: identity
    where: 'Λ₄₄² − β²Λ₁₁² = 1'
    formula: (1/(1 - b**2)) - b**2/(1 - b**2)
    equals: 1 + 0*b
    samples: {b: [0.1, 0.6, 0.95]}
    tolerance: 1e-9
    shown: ['gamma(ct - \beta x) \end{pmatrix}" cite']
    source: {cite: mit, at: 'slide 15'}
    origin: mit

  - id: cone-conditions-3
    kind: identity
    where: 'βΛ₁₁² + Λ₄₁Λ₄₄ = βγ² − βγ² = 0'
    formula: b/(1 - b**2) + (-b/sqrt(1 - b**2))*(1/sqrt(1 - b**2))
    equals: 0*b
    samples: {b: [0.1, 0.6, 0.95]}
    tolerance: 1e-9
    shown: ['gamma(ct - \beta x) \end{pmatrix}" cite']
    source: {cite: mit, at: 'slide 15'}
    origin: mit

  - id: interval-invariant
    kind: identity
    where: 'x′² − (ct′)² = x² − (ct)² for the boost (β = 0.6), sample events'
    formula: (1.25*(x - 0.6*w))**2 - (1.25*(w - 0.6*x))**2
    equals: x**2 - w**2
    samples: {x: [5.0, -2.0, 1.0], w: [3.0, 4.0, 0.5]}
    tolerance: 1e-9
    shown: ['5.0^2 - 3.0^2 = 16 = 4.0^2 - 0^2']
    source: {cite: mit, at: 'slide 20'}
    origin: mit

  - id: rapidity-addition
    kind: identity
    where: 'tanh(a + b) = (tanh a + tanh b)/(1 + tanh a tanh b): rapidities add'
    formula: tanh(a + b)
    equals: (tanh(a) + tanh(b))/(1 + tanh(a)*tanh(b))
    samples: {a: [0.2, 0.693], b: [0.5, 0.693]}
    tolerance: 1e-12
    shown: ['tanh 1.386 \approx 0.882$']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: ex-gamma
    where: 'example: 1/√(1 − 0.6²)'
    inputs: {}
    formula: 1/sqrt(1 - 0.6**2)
    expected: '1.25'
    tolerance: 1e-12
    shown: ['5.0^2 - 3.0^2 = 16 = 4.0^2 - 0^2']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-xprime
    where: 'example: 1.25(5.0 − 0.6 × 3.0)'
    inputs: {}
    formula: 1.25*(5.0 - 0.6*3.0)
    expected: '4.0'
    tolerance: 1e-12
    shown: ['x'' = 1.25(5.0 - 0.6 \times 3.0) = 4.0']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-tprime
    where: 'example: 1.25(3.0 − 0.6 × 5.0)'
    inputs: {}
    formula: 1.25*(3.0 - 0.6*5.0)
    expected: '0'
    tolerance: 1e-12
    shown: ['ct'' = 1.25(3.0 - 0.6 \times 5.0) = 0']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-add
    where: 'example: 1.2/1.36'
    inputs: {}
    formula: (0.6 + 0.6)/(1 + 0.36)
    expected: '0.882'
    tolerance: 0.0005
    shown: ['(1 + 0.36) \approx 0.882$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: ex-rapidity
    where: 'example: atanh 0.6 = ½ ln(1.6/0.4)'
    inputs: {}
    formula: 0.5*log(1.6/0.4)
    expected: '0.693'
    tolerance: 0.0005
    shown: ['tanh^{-1}0.6 \approx 0.693$']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-rapidity-sum
    where: 'example: tanh(2 × 0.6931)'
    inputs: {}
    formula: tanh(2*0.5*log(1.6/0.4))
    expected: '0.882'
    tolerance: 0.0005
    shown: ['tanh 1.386 \approx 0.882$']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own
