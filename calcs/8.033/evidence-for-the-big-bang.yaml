# Calculations on content/year-2/8.033/evidence-for-the-big-bang.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 20 slides (deck "Lecture 18", second deck of that number), with the page's own example.

page: content/year-2/8.033/evidence-for-the-big-bang.mdx
calcs:
  - id: hubble-values
    kind: fact
    where: 'Hubble 1929 and Riess et al. 1996, as on the slide'
    value: '550 and 70 km/s/Mpc'
    shown: ['Hubble''s own data (1929) gave about 550 km/s/Mpc']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: cmb-temperature
    kind: fact
    where: 'CMB temperature, as on the slide'
    value: '2.726 K'
    shown: ['temperature of about 2.726 K (slide 21)']
    source: {cite: mit, at: 'slide 21'}
    origin: mit

  - id: history-times
    kind: fact
    where: 'times on the very brief history figure and the WMAP illustration'
    value: '3 min; 3e5 yr; 3e9 yr; 400,000 years; about 400 million years; 13.7 billion years'
    shown: ['nucleosynthesis at 3 minutes']
    source: {cite: mit, at: 'slides 11–12, 22'}
    origin: mit

  - id: radiation-doubling
    where: 'radiation era a ∝ t^(1/2): doubling needs 4× the age, so from t = 0.1 s it takes 0.3 s'
    inputs: {}
    formula: 4*0.1 - 0.1
    expected: '0.3'
    tolerance: 1e-9
    shown: ['the universe doubled in size in three tenths of a second']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: quiz-hubble-time
    where: 'quiz and example: 9.778/5.5 Gyr'
    inputs: {}
    formula: 9.778/5.5
    expected: '1.8'
    tolerance: 0.05
    shown: ['$9.778\\text{ Gyr}/5.5 \\approx 1.8$ billion years']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-hubble-time
    where: 'example: same'
    inputs: {}
    formula: 9.778/5.5
    expected: '1.8'
    tolerance: 0.05
    shown: ['$1/H = 9.778\text{ Gyr}/5.5 \approx 1.8$ billion years']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: earth-age
    kind: fact
    where: 'age of the Earth (radiometric dating)'
    value: '4.5 billion years'
    shown: ['the age of the Earth, about 4.5 billion years']
    source: {ref: 'Dalrymple, The Age of the Earth (1991): 4.54 ± 0.05 billion years'}
    origin: later-data

  - id: ex-kT
    where: 'example: kT at 2.726 K in eV'
    inputs: {}
    formula: 8.617e-5*2.726
    expected: '2.3e-4'
    tolerance: 0.05e-4
    shown: ['\approx 2.3 \times 10^{-4}$ eV']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-wien
    where: 'example: Wien peak 2.898e-3/2.726 in mm'
    inputs: {}
    formula: 2.898e-3/2.726*1000
    expected: '1.06'
    tolerance: 0.005
    shown: ['\approx 1.06$ mm']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: discovery-years
    kind: fact
    where: 'dates on the slides'
    value: 'Penzias and Wilson 1965; Nobel Prize 2006; Mount Wilson 1931'
    shown: ['Arno Penzias and Robert Wilson discovered the CMB in 1965']
    source: {cite: mit, at: 'slides 25–27'}
    origin: mit
