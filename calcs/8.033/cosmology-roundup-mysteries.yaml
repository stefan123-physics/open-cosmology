# Calculations on content/year-2/8.033/cosmology-roundup-mysteries.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 22 slides (deck "Lecture 20"), with the page's own example.

page: content/year-2/8.033/cosmology-roundup-mysteries.mdx
calcs:
  - id: parameters-2006
    kind: fact
    where: 'WMAP3 + SDSS LRG parameters, as on the slide'
    value: 'Ω_tot = 1.003, Ω_Λ = 0.761, ω_b = 0.0222, ω_c = 0.1050, w = −0.941, n_s = 0.953, r < 0.30'
    shown: ['\Omega_\Lambda = 0.761^{+0.017}_{-0.018}']
    source: {cite: mit, at: 'slide 57'}
    origin: mit

  - id: pie
    kind: fact
    where: 'pie chart on the slide'
    value: '75% dark energy, 21% cold dark matter, 4% ordinary matter'
    shown: ['In round numbers the universe is 75% dark energy, 21% cold dark matter and 4% ordinary matter']
    source: {cite: mit, at: 'slide 57'}
    origin: mit

  - id: flatness
    kind: fact
    where: 'flatness, as on the slide'
    value: '1.003 ± 0.010'
    shown: ['tex="\Omega_{\text{tot}} = 1.003 \pm 0.010"']
    source: {cite: mit, at: 'slide 63'}
    origin: mit

  - id: smoothness
    kind: fact
    where: 'CMB temperature fluctuations of about 1e-5 (COBE, WMAP; not on the slides as a number)'
    value: '1e-5'
    shown: ['the fluctuations are about one part in $10^5$']
    source: {ref: 'Smoot et al. 1992 (COBE DMR): ΔT/T ≈ 1e-5'}
    origin: later-data

  - id: ex-h2
    where: 'example: 0.73²'
    inputs: {}
    formula: 0.73**2
    expected: '0.533'
    tolerance: 0.0005
    shown: ['$h^2 = 0.533$']
    source: {cite: mit, at: 'slide 57'}
    origin: page-own

  - id: ex-omega-b
    where: 'example: 0.0222/0.533'
    inputs: {}
    formula: 0.0222/0.73**2
    expected: '0.042'
    tolerance: 0.0005
    shown: ['\approx 0.042$ and']
    source: {cite: mit, at: 'slide 57'}
    origin: page-own

  - id: ex-omega-c
    where: 'example: 0.105/0.533'
    inputs: {}
    formula: 0.105/0.73**2
    expected: '0.197'
    tolerance: 0.0005
    shown: ['\approx 0.197$. Together']
    source: {cite: mit, at: 'slide 57'}
    origin: page-own

  - id: ex-matter
    where: 'example: Ω_b + Ω_c'
    inputs: {}
    formula: (0.0222 + 0.105)/0.73**2
    expected: '0.239'
    tolerance: 0.0005
    shown: ['$0.239 + 0.761 = 1.000$']
    source: {cite: mit, at: 'slide 57'}
    origin: page-own

  - id: ex-total
    where: 'example: total with Ω_Λ'
    inputs: {}
    formula: (0.0222 + 0.105)/0.73**2 + 0.761
    expected: '1.000'
    tolerance: 0.0005
    shown: ['$0.239 + 0.761 = 1.000$']
    source: {cite: mit, at: 'slide 57'}
    origin: page-own

  - id: ex-curvature
    where: 'example: 4100/√0.01 Mpc'
    inputs: {}
    formula: 4100/sqrt(0.01)
    expected: '41000'
    tolerance: 1
    shown: ['= 41{,}000$ Mpc']
    source: {cite: mit, at: 'slide 63'}
    origin: page-own

  - id: ex-hubble-distance
    where: 'c/H₀ for h = 0.73, Mpc'
    inputs: {}
    formula: 299792/73
    expected: '4100'
    tolerance: 20
    shown: ['$c/H_0 = 4100$ Mpc']
    source: {cite: mit, at: 'slide 63'}
    origin: page-own
