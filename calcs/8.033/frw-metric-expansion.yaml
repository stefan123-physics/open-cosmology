# Calculations on content/year-2/8.033/frw-metric-expansion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 18 slides (deck "Lecture 17"), with the page's own example.

page: content/year-2/8.033/frw-metric-expansion.mdx
calcs:
  - id: hubble-unit
    where: '1/(100 km/s/Mpc) in Gyr (Mpc = 3.0857e19 km, Julian year)'
    inputs: {}
    formula: 3.0856776e19/100/3.15576e7/1e9
    expected: '9.778'
    tolerance: 0.0005
    shown: ['Mpc⁻¹$) = 9.778$ Gyr']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: slide-unit
    kind: fact
    where: 'the slide''s conversion factor, which uses a 365-day year (see hubble-unit for the Julian year)'
    value: '9.7846 Gyr'
    shown: ['\approx H_0 \times 9.7846\text{ Gyr}']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: parameters-2005
    kind: fact
    where: 'cosmological parameters (2005), as on the slide'
    value: 'Ω_b ≈ 0.05, Ω_d ≈ 0.25, Ω_Λ ≈ 0.7, Ω_k ≈ 0, h ≈ 0.70'
    shown: ['baryons $\Omega_b \approx 0.05$, dark matter $\Omega_d \approx 0.25$']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: matter-sum
    where: 'Ω_m = Ω_b + Ω_d'
    inputs: {}
    formula: 0.05 + 0.25
    expected: '0.3'
    tolerance: 1e-9
    shown: ['so matter $\Omega_m = \Omega_b + \Omega_d$ about 0.3']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: planck-h
    kind: fact
    where: 'Planck 2018 h (later development)'
    value: '0.674'
    shown: ['with $h \approx 0.674$']
    source: {ref: 'Planck Collaboration 2018 results VI, H0 = 67.4 ± 0.5 km/s/Mpc'}
    origin: later-data

  - id: hubble-time
    where: 'Hubble time 9.778/0.70 Gyr'
    inputs: {}
    formula: 9.778/0.70
    expected: '14.0'
    tolerance: 0.05
    shown: ['$1/H_0 = 9.778/0.70 \approx 14.0$ billion years']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: quiz-hubble-time
    where: 'quiz: 9.78/0.70'
    inputs: {}
    formula: 9.78/0.70
    expected: '14.0'
    tolerance: 0.05
    shown: ['9.78/0.70 \\approx 14.0$ billion years']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: age-integral
    where: 'integral ∫₀^∞ dz/((1 + z)√(0.3(1 + z)³ + 0.7)), via the closed form'
    inputs: {}
    formula: 2/(3*sqrt(0.7))*asinh(sqrt(0.7/0.3))
    expected: '0.964'
    tolerance: 0.0005
    shown: ['and the integral is about 0.964']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: age-integral-numeric
    where: 'same integral numerically, in the variable x = 1/(1 + z) (x from 0 to 1)'
    inputs: {}
    formula: integrate('x/sqrt(0.3*x + 0.7*x**4)', 'x', 0, 1)
    expected: '0.964'
    tolerance: 0.0005
    shown: ['and the integral is about 0.964']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: age
    where: 'age 9.778/0.70 × 0.964 Gyr'
    inputs: {}
    formula: 9.778/0.70*2/(3*sqrt(0.7))*asinh(sqrt(0.7/0.3))
    expected: '13.5'
    tolerance: 0.05
    shown: ['So the age is about 13.5 billion years']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: flashcard-age
    where: 'same age, in the flashcard'
    inputs: {}
    formula: 9.778/0.70*2/(3*sqrt(0.7))*asinh(sqrt(0.7/0.3))
    expected: '13.5'
    tolerance: 0.05
    shown: ['about 13.5 billion years for $\\Omega_m = 0.3$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: summary-age
    where: 'same age, in the summary'
    inputs: {}
    formula: 9.778/0.70*2/(3*sqrt(0.7))*asinh(sqrt(0.7/0.3))
    expected: '13.5'
    tolerance: 0.05
    shown: ['about 13.5 billion years for the 2005 values']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: H-z1
    where: 'H(z = 1)/H₀ = √(0.3 × 8 + 0.7)'
    inputs: {}
    formula: sqrt(0.3*8 + 0.7)
    expected: '1.76'
    tolerance: 0.005
    shown: ['\approx 1.76H_0$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: H-z1-kms
    where: '70 × 1.761 km/s/Mpc'
    inputs: {}
    formula: 70*sqrt(0.3*8 + 0.7)
    expected: '123'
    tolerance: 0.5
    shown: ['about 123 km/s/Mpc']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: history-years
    kind: fact
    where: 'dates on slides 1 and 15'
    value: 'Friedmann 1888–1925, 1922 paper; Lemaître 1927 paper; Robertson 1935, Walker 1935/1937'
    shown: ['Alexander Friedmann (1888–1925, Russian, 1922 paper)']
    source: {cite: mit, at: 'slide 15'}
    origin: mit

  - id: slide-unit-check
    where: '1/(100 km/s/Mpc) with a 365-day year, as the slide uses'
    inputs: {}
    formula: 3.0856776e19/100/(365*86400)/1e9
    expected: '9.7846'
    tolerance: 0.0005
    shown: ['the slide''s 9.7846 corresponds to a 365-day year']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own
