# Calculations on content/year-2/8.033/time-dilation-length-contraction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 5 slides, with the page's own example.

page: content/year-2/8.033/time-dilation-length-contraction.mdx
calcs:
  - id: muon-light-distance
    where: 'c × 1.56e-6 s in km'
    inputs: {}
    formula: 3e8*1.56e-6/1000
    expected: '0.47'
    tolerance: 0.005
    shown: ['Their half-life is $1.56 \times 10^{-6}$ s, in which even light travels only 0.47 km']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: gamma-099
    where: 'γ at 0.99c'
    inputs: {}
    formula: 1/sqrt(1 - 0.99**2)
    expected: '7'
    tolerance: 0.15
    shown: ['at $v \approx 0.99c$, $\gamma \approx 7$, and at $0.9999c$, $\gamma \approx 71$']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: gamma-09999
    where: 'γ at 0.9999c'
    inputs: {}
    formula: 1/sqrt(1 - 0.9999**2)
    expected: '71'
    tolerance: 0.5
    shown: ['at $v \approx 0.99c$, $\gamma \approx 7$, and at $0.9999c$, $\gamma \approx 71$']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: contraction
    kind: identity
    where: 'x₂′ at t′ = 0: γL − γβ²L = L/γ'
    formula: L/sqrt(1 - b**2) - b**2*L/sqrt(1 - b**2)
    equals: L*sqrt(1 - b**2)
    samples: {L: [1.0, 3.0], b: [0.3, 0.8]}
    tolerance: 1e-12
    shown: ['frac{L}{\gamma} + v(t_1'' - t_2'') = \frac{L}{\gamma}" cite']
    source: {cite: mit, at: 'slide 13'}
    origin: mit

  - id: velocity-matrix
    kind: identity
    where: 'Λ(v₂)Λ(v₁) in (x, ct): ratio −(1,4)/(1,1) = (β₁ + β₂)/(1 + β₁β₂); the (1,1) entry is γ₁γ₂(1 + β₁β₂) and (1,4) is −γ₁γ₂(β₁ + β₂)'
    formula: (a + b)/(1 + a*b)
    equals: tanh(0.5*log((1 + a)/(1 - a)) + 0.5*log((1 + b)/(1 - b)))
    samples: {a: [0.6, 0.2], b: [0.6, 0.9]}
    tolerance: 1e-12
    shown: ['frac{\beta_1 + \beta_2}{1 + \beta_1\beta_2}']
    source: {cite: mit, at: 'slide 14'}
    origin: mit

  - id: ex-gamma
    where: 'example: 1/√(1 − 0.995²)'
    inputs: {}
    formula: 1/sqrt(1 - 0.995**2)
    expected: '10.0'
    tolerance: 0.05
    shown: ['sqrt{1 - 0.995^2} \approx 10.0$']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-trip
    where: 'example: 15e3/(0.995 × 3.00e8)'
    inputs: {}
    formula: 15e3/(0.995*3.00e8)
    expected: '5.03e-5'
    tolerance: 0.005e-5
    shown: ['approx 5.03 \times 10^{-5}$ s']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-dilated
    where: 'example: γ × 1.56 μs'
    inputs: {}
    formula: 1.56/sqrt(1 - 0.995**2)
    expected: '15.6'
    tolerance: 0.05
    shown: ['times 1.56$ μs ≈ 15.6 μs']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-halflives
    where: 'example: trip/dilated half-life, and the surviving fraction 2^(−n)'
    inputs: {}
    formula: 2**(-(15e3/(0.995*3.00e8))/(1.56e-6/sqrt(1 - 0.995**2)))
    expected: '0.11'
    tolerance: 0.005
    shown: ['about 3.2 half-lives and $2^{-3.2} \approx 0.11$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-no-dilation
    where: 'example: without dilation, 2^(−32.2)'
    inputs: {}
    formula: 2**(-(15e3/(0.995*3.00e8))/1.56e-6)
    expected: '2e-10'
    tolerance: 0.1e-10
    shown: ['a fraction near $2 \times 10^{-10}$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-contracted
    where: 'example: 15 km/γ'
    inputs: {}
    formula: 15*sqrt(1 - 0.995**2)
    expected: '1.5'
    tolerance: 0.01
    shown: ['gamma \approx 1.5$ km']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own
