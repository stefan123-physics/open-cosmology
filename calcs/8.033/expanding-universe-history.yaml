# Calculations on content/year-2/8.033/expanding-universe-history.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 19 slides (deck "Lecture 18"), with the page's own example.

page: content/year-2/8.033/expanding-universe-history.mdx
calcs:
  - id: parameters-2006
    kind: fact
    where: 'cosmological parameters (2006), as on the slide'
    value: 'Ω_b ≈ 0.04, Ω_d ≈ 0.21, Ω_Λ ≈ 0.75, Ω_k ≈ 0, h ≈ 0.7, Ω_m ≈ 0.25'
    shown: ['$\Omega_b \approx 0.04$, $\Omega_d \approx 0.21$']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: matter-sum
    where: 'Ω_b + Ω_d (the slide rounds 0.25)'
    inputs: {}
    formula: 0.04 + 0.21
    expected: '0.25'
    tolerance: 1e-9
    shown: ['and $\Omega_m \approx 0.25$ (the']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: history-times
    kind: fact
    where: 'times on the brief-history slide'
    value: '379,000 years; about 200 million years, corrected by hand to 400; 13.7 billion years'
    shown: ['At 379,000 years the cosmic microwave background']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: matter-age-factor
    kind: identity
    where: 'a ∝ t^(2/3) gives H = ȧ/a = 2/(3t)'
    formula: deriv('q**(2/3)', 'q', t)/t**(2/3)
    equals: 2/(3*t)
    samples: {t: [0.5, 1.0, 3.0]}
    tolerance: 1e-6
    shown: ['For matter alone, $H = 2/(3t)$']
    source: {cite: mit, at: 'slide 5'}
    origin: page-own

  - id: ex-hubble-time
    where: 'example: 9.778/0.7 Gyr'
    inputs: {}
    formula: 9.778/0.7
    expected: '14.0'
    tolerance: 0.05
    shown: ['The Hubble time is $9.778/0.7 \approx 14.0$ billion years']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-matter-age
    where: 'example: 2/3 × 13.97 Gyr'
    inputs: {}
    formula: 2/3*9.778/0.7
    expected: '9.3'
    tolerance: 0.05
    shown: ['\times 14.0 \approx 9.3$ billion years']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-lambda-age
    where: 'example: flat age with Ω_m = 0.25, Ω_Λ = 0.75, h = 0.7'
    inputs: {}
    formula: 9.778/0.7*2/(3*sqrt(0.75))*asinh(sqrt(0.75/0.25))
    expected: '14.2'
    tolerance: 0.05
    shown: ['\approx 14.2$ billion years']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-hubble-distance
    where: 'example: c/H₀ in Mpc'
    inputs: {}
    formula: 299800/70
    expected: '4280'
    tolerance: 5
    shown: ['\approx 4280$ Mpc']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-hubble-distance-ly
    where: 'example: 4283 Mpc in billions of light years (1 Mpc = 3.2616e6 ly)'
    inputs: {}
    formula: 299800/70*3.2616e6/1e9
    expected: '14'
    tolerance: 0.5
    shown: ['about 14 billion light years. Beyond it']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: hubble-year
    kind: fact
    where: 'Hubble''s dates as on the slide (his velocity–distance paper is from 1929)'
    value: '1889–1953; 1930 paper'
    shown: ['Edwin Hubble (1889–1953), credited on the slide with a 1930 paper']
    source: {cite: mit, at: 'slide 1'}
    origin: mit

  - id: wmap-like-age
    where: 'flat age for h = 0.71, Ω_m = 0.27, Ω_Λ = 0.73'
    inputs: {}
    formula: 9.778/0.71*2/(3*sqrt(0.73))*asinh(sqrt(0.73/0.27))
    expected: '13.7'
    tolerance: 0.05
    shown: ['$h = 0.71$ and $\Omega_m = 0.27$, give 13.7.)']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own
