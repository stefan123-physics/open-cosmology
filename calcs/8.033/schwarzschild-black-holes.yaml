# Calculations on content/year-2/8.033/schwarzschild-black-holes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 23 slides (deck "Lecture 21"), with the page's own example.

page: content/year-2/8.033/schwarzschild-black-holes.mdx
calcs:
  - id: gamma-form
    kind: identity
    where: '1 − 2M/r = 1/γ_r² with β_r² = 2M/r'
    formula: 1 - 2/x
    equals: 1/(1/sqrt(1 - 2/x))**2
    samples: {x: [2.5, 4.0, 10.0]}
    tolerance: 1e-12
    shown: ['= \frac{dt^2}{\gamma_r^2} - \gamma_r^2\,dr^2']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: quiz-shell-clock
    where: 'quiz: √(1 − 2/3)'
    inputs: {}
    formula: sqrt(1 - 2/3)
    expected: '0.577'
    tolerance: 0.0005
    shown: ['\\sqrt{1 - 2/3} \\approx 0.577$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-earth
    where: 'example: 2GM/c² for the Earth, mm'
    inputs: {}
    formula: 2*6.674e-11*5.972e24/(2.998e8)**2*1000
    expected: '8.9'
    tolerance: 0.05
    shown: ['\approx 8.9$ mm']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-excess-radius
    where: 'example: ∫ from 3 to 4 of dr/√(1 − 2/r), in units of M'
    inputs: {}
    formula: integrate('1/sqrt(1 - 2/q)', 'q', 3, 4)
    expected: '1.54'
    tolerance: 0.005
    shown: ['\approx 1.54M$']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-rs-stellar
    where: 'example: 2GM/c² for 10 solar masses, km'
    inputs: {}
    formula: 2*1.327e21/(2.998e8)**2/1000
    expected: '29.5'
    tolerance: 0.05
    shown: ['$r = 2GM/c^2 \approx 29.5$ km']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: ex-tide-stellar
    where: 'example: 2GM ℓ/r³ at the horizon, 10 solar masses, ℓ = 2 m'
    inputs: {}
    formula: 2*1.327e21*2/(2*1.327e21/(2.998e8)**2)**3
    expected: '2e8'
    tolerance: 0.1e8
    shown: ['\approx 2 \times 10^8$ m/s²']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: ex-tide-g
    where: 'example: in units of g'
    inputs: {}
    formula: 2*1.327e21*2/(2*1.327e21/(2.998e8)**2)**3/9.81/1e6
    expected: '20'
    tolerance: 1.5
    shown: ['twenty million times Earth''s gravity']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: ex-rs-smbh
    where: 'example: 2GM/c² for 4 million solar masses, m'
    inputs: {}
    formula: 2*1.327e20*4e6/(2.998e8)**2
    expected: '1.18e10'
    tolerance: 0.005e10
    shown: ['$r \approx 1.18 \times 10^{10}$ m']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: ex-tide-smbh
    where: 'example: 2GM ℓ/r³ at the horizon, 4 million solar masses'
    inputs: {}
    formula: 2*1.327e20*4e6*2/(2*1.327e20*4e6/(2.998e8)**2)**3
    expected: '1.3e-3'
    tolerance: 0.05e-3
    shown: ['about $1.3 \times 10^{-3}$ m/s²']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: schwarzschild-years
    kind: fact
    where: 'Schwarzschild''s dates, as on slide 1; the metric is from 1916'
    value: '1873–1916'
    shown: ['Karl Schwarzschild (1873–1916)']
    source: {cite: mit, at: 'slide 1'}
    origin: mit
