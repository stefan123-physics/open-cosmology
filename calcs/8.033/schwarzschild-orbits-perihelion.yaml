# Calculations on content/year-2/8.033/schwarzschild-orbits-perihelion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 25 slides (deck "Lecture 23"), with the page's own example.

page: content/year-2/8.033/schwarzschild-orbits-perihelion.mdx
calcs:
  - id: tourist-L
    where: 'L̃² = M r²/(r − 3M) at r = 4M (M = 1)'
    inputs: {}
    formula: sqrt(4**2/(4 - 3))
    expected: '4'
    tolerance: 1e-9
    shown: ['| tourist orbit | $4M$ | $1/\sqrt 2$ | 1 | $4M$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: tourist-E
    where: 'Ẽ = (1 − 2M/r)/√(1 − 3M/r) at r = 4M'
    inputs: {}
    formula: (1 - 2/4)/sqrt(1 - 3/4)
    expected: '1'
    tolerance: 1e-9
    shown: ['| tourist orbit | $4M$ | $1/\sqrt 2$ | 1 | $4M$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: tourist-v
    where: 'v_shell = √(M/(r − 2M)) at r = 4M'
    inputs: {}
    formula: sqrt(1/(4 - 2))
    expected: '0.7071'
    tolerance: 0.0001
    shown: ['| tourist orbit | $4M$ | $1/\sqrt 2$ | 1 | $4M$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: last-stable-L
    where: 'L̃ at r = 6M'
    inputs: {}
    formula: sqrt(6**2/(6 - 3))
    expected: '3.4641'
    tolerance: 0.0001
    shown: ['| last stable orbit | $6M$ | $\frac12$ | $\sqrt{8/9}$ | $\sqrt{12}M$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: last-stable-E
    where: 'Ẽ at r = 6M'
    inputs: {}
    formula: (1 - 2/6)/sqrt(1 - 3/6)
    expected: '0.9428'
    tolerance: 0.0001
    shown: ['| last stable orbit | $6M$ | $\frac12$ | $\sqrt{8/9}$ | $\sqrt{12}M$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: last-stable-v
    where: 'v_shell at r = 6M'
    inputs: {}
    formula: sqrt(1/(6 - 2))
    expected: '0.5'
    tolerance: 1e-9
    shown: ['| last stable orbit | $6M$ | $\frac12$ | $\sqrt{8/9}$ | $\sqrt{12}M$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: photon-v
    where: 'v_shell at r = 3M'
    inputs: {}
    formula: sqrt(1/(3 - 2))
    expected: '1'
    tolerance: 1e-9
    shown: ['| photon orbit | $3M$ | 1 | $\infty$ | $\infty$ |']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: efficiency
    where: '1 − √(8/9), percent'
    inputs: {}
    formula: (1 - sqrt(8/9))*100
    expected: '5.7'
    tolerance: 0.05
    shown: ['radiated $1 - 0.943$, about 5.7%, of its rest energy']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: quiz-efficiency
    where: 'quiz: same'
    inputs: {}
    formula: (1 - sqrt(8/9))*100
    expected: '5.7'
    tolerance: 0.05
    shown: ['so $1 - 0.943$, about 5.7%, has been released']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: efficiency-vs-fusion
    where: '5.7% / 0.7%'
    inputs: {}
    formula: (1 - sqrt(8/9))/0.007
    expected: '8'
    tolerance: 0.3
    shown: ['eight times more than hydrogen fusion (0.7%)']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: mercury-per-orbit
    where: 'example: 6πGM/(c²a(1 − e²)), rad'
    inputs: {}
    formula: 6*pi*1.327e20/((2.998e8)**2*5.791e10*(1 - 0.2056**2))
    expected: '5.02e-7'
    tolerance: 0.005e-7
    shown: ['\approx 5.02 \times 10^{-7}$ rad per orbit']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: mercury-orbits
    where: 'example: orbits per century'
    inputs: {}
    formula: 36525/87.969
    expected: '415'
    tolerance: 0.5
    shown: ['36{,}525/87.969 \approx 415$ orbits']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: mercury-century-rad
    where: 'example: per century, rad'
    inputs: {}
    formula: 6*pi*1.327e20/((2.998e8)**2*5.791e10*(1 - 0.2056**2))*36525/87.969
    expected: '2.08e-4'
    tolerance: 0.005e-4
    shown: ['giving $2.08 \times 10^{-4}$ rad']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: mercury-century-arcsec
    where: 'example: per century, arcseconds'
    inputs: {}
    formula: 6*pi*1.327e20/((2.998e8)**2*5.791e10*(1 - 0.2056**2))*36525/87.969*206265
    expected: '43'
    tolerance: 0.5
    shown: ['or about 43 arcseconds']
    source: {cite: mit, at: 'slide 12'}
    origin: mit
