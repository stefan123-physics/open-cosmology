# Calculations on content/year-2/8.033/lensing-evidence-for-gr.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 26 slides (deck "Lecture 24"), with the page's own example.

page: content/year-2/8.033/lensing-evidence-for-gr.mdx
calcs:
  - id: shadow-radius
    where: 'critical impact parameter √27 M'
    inputs: {}
    formula: sqrt(27)
    expected: '5.196'
    tolerance: 0.0005
    shown: ['towards $\sqrt{27}M \approx 5.196M$']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: photon-sphere-b
    where: 'b = γ r at r_min = 3M: 3/√(1 − 2/3) = √27'
    inputs: {}
    formula: 3/sqrt(1 - 2/3)
    expected: '5.196'
    tolerance: 0.0005
    shown: ['towards $\sqrt{27}M \approx 5.196M$']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: shadow-area
    where: 'area ratio (√27/2)²'
    inputs: {}
    formula: 27/4
    expected: '6.75'
    tolerance: 1e-9
    shown: ['with 27/4 times the area']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: weak-deflection
    where: 'deflection integral for r_min = 1000 M (substituting u = 1 − w² to remove the endpoint singularity) against 4M/b'
    inputs: {}
    formula: (-pi + 2*integrate('2*w/sqrt(1 - (1 - w**2)**2 - 0.002*(1 - (1 - w**2)**3))', 'w', 0, 1)) / (4/(1000/sqrt(1 - 0.002)))
    expected: '1'
    tolerance: 0.02
    shown: ['For $b \gg M$, $\Delta\varphi \approx 4M/b$']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: back-reflection
    kind: fact
    where: 'impact parameter for Δφ = π, as on the slide'
    value: '5.357 M'
    shown: ['At $b \approx 5.357M$, $\Delta\varphi = \pi$']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: eddington
    kind: fact
    where: 'Eddington 1919; radio tests to 0.1% with 3C273, as on the slide'
    value: '1919; 0.1%'
    shown: ['confirmed by Eddington in 1919 and later to 0.1%']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: hulse-taylor
    kind: fact
    where: 'Hulse–Taylor pulsar data, as on the slide'
    value: '1974; 59 ms; 7.75 h; 1.1 and 4.8 solar radii; 3.1 mm per orbit; 300 Myr; 4.2° per year; Nobel 1993'
    shown: ['A neutron star spinning once every 59 milliseconds']
    source: {cite: mit, at: 'slides 29–30'}
    origin: mit

  - id: mercury-degree
    where: 'years for Mercury to precess 1°, at 43″ per century'
    inputs: {}
    formula: 3600/43*100
    expected: '8400'
    tolerance: 50
    shown: ['whereas Mercury needs about 8400 years for 1°']
    source: {cite: mit, at: 'slide 30'}
    origin: mit

  - id: kerr-efficiency
    where: 'maximum accretion efficiency 1 − 3^(−1/2)'
    inputs: {}
    formula: 1 - 3**(-0.5)
    expected: '0.42'
    tolerance: 0.005
    shown: ['$1 - 3^{-1/2} \approx 0.42$, or 42%']
    source: {cite: mit, at: 'slide 37'}
    origin: mit

  - id: quiz-kerr
    where: 'quiz: same'
    inputs: {}
    formula: 1 - 3**(-0.5)
    expected: '0.42'
    tolerance: 0.005
    shown: ['$1 - 3^{-1/2} \\approx 0.42$']
    source: {cite: mit, at: 'slide 37'}
    origin: mit

  - id: time-travel-years
    kind: fact
    where: 'time-travel history, as on the slide (Gödel''s rotating universe is from 1949)'
    value: '1895, 1905, 1916, 1937, 1974, 1988, 1991'
    shown: ['H. G. Wells''s *The Time Machine* (1895)']
    source: {cite: mit, at: 'slide 39'}
    origin: mit

  - id: ex-sun-deflection
    where: 'example: 4GM/(c²R) in rad'
    inputs: {}
    formula: 4*1.327e20/((2.998e8)**2*6.957e8)
    expected: '8.5e-6'
    tolerance: 0.05e-6
    shown: ['6.957 \times 10^8) \approx 8.5 \times 10^{-6}$ rad']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-sun-arcsec
    where: 'example: in arcseconds'
    inputs: {}
    formula: 4*1.327e20/((2.998e8)**2*6.957e8)*206265
    expected: '1.75'
    tolerance: 0.005
    shown: ['rad, about 1.75 arcseconds.']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-sgr-m
    where: 'example: GM/c² for 4 million solar masses, m'
    inputs: {}
    formula: 1.327e20*4e6/(2.998e8)**2
    expected: '5.9e9'
    tolerance: 0.05e9
    shown: ['$GM/c^2 \approx 5.9 \times 10^9$ m']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-sgr-diameter
    where: 'example: 2√27 GM/c²'
    inputs: {}
    formula: 2*sqrt(27)*1.327e20*4e6/(2.998e8)**2
    expected: '6.1e10'
    tolerance: 0.05e10
    shown: ['\approx 6.1 \times 10^{10}$ m']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-sgr-distance
    where: 'example: 8.0 kpc in m'
    inputs: {}
    formula: 8.0*3.086e19
    expected: '2.47e20'
    tolerance: 0.005e20
    shown: ['At $2.47 \times 10^{20}$ m']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-sgr-angle
    where: 'example: angular diameter in microarcseconds'
    inputs: {}
    formula: 2*sqrt(27)*1.327e20*4e6/(2.998e8)**2/(8.0*3.086e19)*206265e6
    expected: '51'
    tolerance: 0.5
    shown: ['that subtends about 51 microarcseconds']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: eht
    kind: fact
    where: 'Event Horizon Telescope ring of Sgr A* (2022), later development'
    value: '51.8 ± 2.3 microarcseconds'
    shown: ['measured a ring of about 52 microarcseconds']
    source: {ref: 'Event Horizon Telescope Collaboration 2022, ApJL 930, L12'}
    origin: later-data

  - id: ex-orbits-per-year
    where: 'example: 8766 h / 7.75 h'
    inputs: {}
    formula: 8766/7.75
    expected: '1131'
    tolerance: 0.5
    shown: ['A year has about $8766/7.75 \approx 1131$ orbits']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: ex-shrink-per-year
    where: 'example: 1131 × 3.1 mm in m'
    inputs: {}
    formula: 8766/7.75*3.1/1000
    expected: '3.5'
    tolerance: 0.05
    shown: ['\approx 3.5$ m per year.']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own
