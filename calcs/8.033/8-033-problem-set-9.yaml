# Calculations on content/year-2/8.033/8-033-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# a numerical integral, derivative or solve of the defining condition, or a second physical argument.
# All quantities are pure numbers. Constants as on the page: G = 6.674e-11, c = 2.998e8 (SI), solar mass 2e30 kg (MIT's sheet).

page: content/year-2/8.033/8-033-problem-set-9.mdx
calcs:
  # ---- Intro

  - id: total-points
    where: 'Introduction: the points of the twelve counted problems'
    formula: 15 + 9 + 6 + 6 + 9 + 27 + 3 + 6 + 18 + 9 + 6 + 12
    expected: '126'
    shown: ['add up to 126 points']
    source: {cite: mit, at: 'Problems 1 to 12, pp. 1-5 (129 points on the sheet, with 3 for handing in)'}
    origin: mit

  - id: constants
    kind: fact
    where: 'How to answer: the constants used for numbers (the values of the lessons; the solar mass is the one on the sheet of MIT)'
    shown: ['$G = 6.674 \times 10^{-11}$ m³ kg⁻¹ s⁻², $c = 2.998 \times 10^8$ m/s', 'a solar mass of $M_\odot = 2 \times 10^{30}$ kg']
    source: {cite: mit, at: 'Problem 8, p. 4 (the solar mass)'}
    origin: mit

  # ---- Problem 1

  - id: p1-facts
    kind: fact
    where: 'Problem 1, solution of part 2: the evidence listed on the slides'
    shown: ['$10^6$ to $10^9$ solar masses', 'less than 0.4 light years', 'between $6M$ and $20M$', 'more than about 3 solar masses', '$12 \pm 2$ solar masses']
    source: {cite: reading2, at: 'slides 11 and 30'}
    origin: mit

  - id: p1-later
    kind: fact
    where: 'Problem 1, part 2, check: later developments, as stated in the lesson lensing-evidence-for-gr'
    shown: ['in 2015 LIGO detected gravitational waves from two merging black holes, and in 2019 and 2022 the Event Horizon Telescope imaged the shadows of two supermassive black holes']
    source: {cite: mit, at: 'not on the sheet: later developments (the lesson on Lecture 26)'}
    origin: later-data

  - id: p1-tide
    where: 'Problem 1, part 3: tidal stretching 2GM l/r^3 across 2 m at the horizon of 4 million solar masses (the worked example of the lesson; GM of the Sun 1.327e20)'
    formula: 2*4e6*1.327e20*2/(2*4e6*1.327e20/(2.998e8)**2)**3
    expected: '1.3e-3'
    shown: ['about $1.3 \times 10^{-3}$ m/s² across a 2 m body']
    source: {cite: reading1, at: 'slide 25 (the question; the number is the lesson''s)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-identity
    kind: identity
    where: 'Problem 2, part 2: 1 + β²γ² = γ² with β² = 2M/r'
    formula: 1 + (2*M/r)/(1 - 2*M/r)
    equals: 1/(1 - 2*M/r)
    samples:
      M: [0.5, 1.0, 1.0, 2.0]
      r: [3.0, 2.5, 10.0, 7.0]
    tolerance: 1e-12
    shown: ['$1 + \beta_r^2\gamma_r^2 = (1 - \beta_r^2 + \beta_r^2)/(1 - \beta_r^2) = \gamma_r^2$']
    source: {cite: mit, at: 'Problem 2, part 2 (our own solution)'}
    origin: page-own

  # The GP metric and the Schwarzschild metric give the same dτ² for the same step (dt, dr): q is dr/dt.
  - id: p2-equivalence
    kind: identity
    where: 'Problem 2, part 3: GP interval of a step against the Schwarzschild interval, for a step with dr/dt = q'
    formula: (1 + sqrt(2*M/r)/(1 - 2*M/r)*q)**2 - (q + sqrt(2*M/r)*(1 + sqrt(2*M/r)/(1 - 2*M/r)*q))**2
    equals: (1 - 2*M/r) - q**2/(1 - 2*M/r)
    samples:
      M: [0.5, 1.0, 1.0, 2.0, 1.0]
      r: [3.0, 2.5, 10.0, 7.0, 4.0]
      q: [0.1, -0.05, 0.6, -0.3, 0.0]
    tolerance: 1e-12
    shown: ['<Formula label="The difference"']
    source: {cite: mit, at: 'Problem 2, part 3 (our own solution)'}
    origin: page-own

  # ---- Problem 3

  # The tidal formula against the exact Newtonian difference, for a small y.
  - id: p3-move
    answer: p3-move
    kind: identity
    where: 'Problem 3(b), answer box: against half t² times the exact difference of the Newtonian pulls at r + y and at r (y much smaller than r)'
    formula: G*M*y*t**2/r**3
    equals: 0.5*t**2*(G*M/r**2 - G*M/(r + y)**2)
    samples:
      G: [1.0, 2.0, 1.5]
      M: [1.0, 1.5, 2.0]
      y: [1.0e-6, 2.0e-6, 1.0e-6]
      t: [1.0, 0.5, 1.5]
      r: [2.0, 3.0, 4.0]
    tolerance: 1e-5
    shown: ['id="p3-move"']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  # The sideways acceleration against the exact Newtonian x-component.
  - id: p3-side
    kind: identity
    where: 'Problem 3(a): the sideways part −GM x/r³ against the exact x-component of the pull at (x, r)'
    formula: -G*M*x/r**3
    equals: -G*M*x/(x**2 + r**2)**1.5
    samples:
      G: [1.0, 2.0]
      M: [1.0, 1.5]
      x: [1.0e-6, 2.0e-6]
      r: [2.0, 3.0]
    tolerance: 1e-11
    shown: ['<Formula label="Relative acceleration"']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  # ---- Problem 4

  # Independent route: with q = 2M + w², the integrand becomes smooth: 2√(2M + w²) dw.
  - id: p4-sigma
    answer: p4-sigma
    kind: identity
    where: 'Problem 4(a), answer box: against numerical integration of dr/√(1 − 2M/r) from 2M to r (after the substitution r = 2M + w²)'
    formula: sqrt(r*(r - 2*M)) + 2*M*log(sqrt(r/(2*M)) + sqrt(r/(2*M) - 1))
    equals: integrate('2*sqrt(2*M + w**2)', 'w', 0, sqrt(r - 2*M))
    samples:
      M: [0.5, 1.0, 1.0, 0.7, 1.0]
      r: [2.5, 3.0, 4.0, 6.0, 12.0]
    tolerance: 1e-6
    shown: ['id="p4-sigma"']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-four
    answer: p4-four
    where: 'Problem 4(b), answer box: numerical integration from 2M to 4M, in units of M'
    formula: integrate('2*sqrt(2 + w**2)', 'w', 0, sqrt(2))
    expected: '4.591'
    shown: ['id="p4-four"', '= 4.591M$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-four-formula
    where: 'Problem 4(b), solution: the closed form at r = 4M'
    formula: sqrt(8) + 2*log(sqrt(2) + 1)
    expected: '4.591'
    shown: ['2.828M + 1.763M = 4.591M']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-term-1
    where: 'Problem 4(b), solution: first term'
    formula: sqrt(8)
    expected: '2.828'
    shown: ['2.828M']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-term-2
    where: 'Problem 4(b), solution: second term'
    formula: 2*log(sqrt(2) + 1)
    expected: '1.763'
    shown: ['1.763M']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-three
    where: 'Problem 4(a), check: the shell distance from the horizon to 3M'
    formula: sqrt(3) + 2*log(sqrt(1.5) + sqrt(0.5))
    expected: '3.049'
    shown: ['4.591M - 3.049M']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-three-four
    where: 'Problem 4(a), check: between 3M and 4M, by numerical integration (the lesson has 1.54M)'
    formula: integrate('1/sqrt(1 - 2/q)', 'q', 3, 4)
    expected: '1.542'
    shown: ['= 1.542M$', 'as $1.54M$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-excess-100
    where: 'Problem 4(c), check: the exact excess at r = 100M'
    formula: sqrt(100*98) + 2*log(sqrt(50) + sqrt(49)) - 98
    expected: '6.283'
    shown: ['an excess of $6.283M$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-approx-100
    where: 'Problem 4(c), check: the approximation at r = 100M'
    formula: 1 + log(200)
    expected: '6.298'
    shown: ['$M + M\ln 200 = 6.298M$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # ---- Problem 5

  - id: p5-given
    kind: fact
    where: 'Problem 5, statement'
    shown: ['$E_0 = 6$ keV', '$M = 2.8 \times 10^{30}$ kg and radius $R = 10$ km']
    source: {cite: mit, at: 'Problem 5, p. 3'}
    origin: mit

  - id: p5-rs
    where: 'Problem 5(a), solution: the Schwarzschild radius of the star, in m'
    formula: 2*6.674e-11*2.8e30/(2.998e8)**2
    expected: '4158'
    shown: ['= 4158$ m']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-ratio
    where: 'Problem 5(a), solution: r_s/R'
    formula: 2*6.674e-11*2.8e30/(2.998e8)**2/1e4
    expected: '0.4158'
    shown: ['$r_s/R = 0.4158$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-factor
    where: 'Problem 5(a), solution: the redshift factor'
    formula: sqrt(1 - 0.4158)
    expected: '0.7643'
    shown: ['\sqrt{0.5842} = 6\ \text{keV} \times 0.7643']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-far
    answer: p5-far
    where: 'Problem 5(a), answer box: the energy far away, in keV'
    formula: 6*sqrt(1 - 2*6.674e-11*2.8e30/((2.998e8)**2*1e4))
    expected: '4.586'
    shown: ['id="p5-far"', '= 4.586\ \text{keV}']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  # Independent route: the photon loses energy shell by shell, dE/E = −g_shell dr_shell (Problem F), integrated to a large radius.
  - id: p5-far-climb
    where: 'Problem 5(a), answer box: against the energy lost while climbing against the shell gravity of Problem F, integrated from R to 10⁹ m'
    formula: 6*exp(-integrate('4158.2536/(2*q**2*(1 - 4158.2536/q))', 'q', 1e4, 1e9))
    expected: '4.586'
    tolerance: 0.001
    shown: ['id="p5-far"']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-redshift
    where: 'Problem 5(a), check: the redshift'
    formula: 1/0.7643 - 1
    expected: '0.308'
    shown: ['$1/0.7643 - 1 = 0.308$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-weak
    where: 'Problem 5(a), check: the weak-field estimate, in keV'
    formula: 6*(1 - 0.4158/2)
    expected: '4.75'
    shown: ['$E_0(1 - GM/(Rc^2)) = 6 \times (1 - 0.2079) = 4.75$ keV']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-size
    where: 'Problem 5(a), check: R over r_s'
    formula: 1e4/4158
    expected: '2.4'
    shown: ['only 2.4 times larger than its own Schwarzschild radius']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  # Independent route for the formula: the same shell-by-shell climb, from R to r.
  - id: p5-shell
    answer: p5-shell
    kind: identity
    where: 'Problem 5(b), answer box: against the energy lost while climbing from R to r against the shell gravity (r_s/2q²)/(1 − r_s/q) per shell distance'
    formula: E*sqrt((1 - s/R)/(1 - s/r))
    equals: E*exp(-integrate('s/(2*q**2*(1 - s/q))', 'q', R, r))
    samples:
      E: [1.0, 2.0, 1.5, 6.0]
      s: [1.0, 2.0, 1.5, 4.158]
      R: [3.0, 4.0, 3.5, 10.0]
      r: [5.0, 9.0, 7.0, 20.0]
    tolerance: 1e-7
    shown: ['id="p5-shell"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-20km
    where: 'Problem 5(b), check: the energy seen at r = 20 km, in keV'
    formula: 6*sqrt((1 - 0.41583)/(1 - 0.41583/2))
    expected: '5.153'
    shown: ['$E_r = 6 \times \sqrt{0.5842/0.7921} = 5.153$ keV']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  # ---- Problem 6

  - id: p6-given
    kind: fact
    where: 'Problem 6, statement: the table of values (GM of the Earth, the orbit radius and the sidereal day are the values used in the lessons and their calcs; R is the value of Problem 11 of MIT)'
    shown: ['| $GM$ of the Earth | $3.986 \times 10^{14}$ m³/s² |', '| Radius of the Earth at the equator, $R$ | $6378$ km |', '| Radius of the orbit of a GPS satellite, $r$ | $26{,}570$ km |', '| One turn of the Earth | $86{,}164$ s |', '| One day | $86{,}400$ s |', 'one nanosecond is an error of 30 cm']
    source: {cite: mit, at: 'Problem 6, p. 4 (our own problem; R from Problem 11, p. 5)'}
    origin: page-own

  - id: p6-ground
    answer: p6-ground
    where: 'Problem 6(b), answer box: GM/(R c²) for the ground clock, in units of 1e-10'
    formula: 3.986e14/(6.378e6*(2.998e8)**2)*1e10
    expected: '6.953'
    shown: ['id="p6-ground"', '= 6.953 \times 10^{-10}$']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
    origin: page-own

  - id: p6-ground-check
    where: 'Problem 6(b), check: half of r_s/R with r_s = 8.9 mm, in units of 1e-10'
    formula: 0.0089/(2*6.378e6)*1e10
    expected: '7.0'
    shown: ['$0.0089/(2 \times 6.378 \times 10^6) = 7.0 \times 10^{-10}$']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
    origin: page-own

  - id: p6-ve
    answer: p6-ve
    where: 'Problem 6(c), answer box: speed of the ground at the equator, m/s'
    formula: 2*pi*6.378e6/86164
    expected: '465.1'
    shown: ['id="p6-ve"', '= 465.1$ m/s']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  - id: p6-ground-speed
    answer: p6-ground-speed
    where: 'Problem 6(c), answer box: v_E²/(2c²), in units of 1e-12'
    formula: (2*pi*6.378e6/86164)**2/(2*(2.998e8)**2)*1e12
    expected: '1.203'
    shown: ['id="p6-ground-speed"', '= 1.203 \times 10^{-12}$']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  - id: p6-ground-ratio
    where: 'Problem 6(c), check: gravity term over speed term on the ground'
    formula: 6.953e-10/1.203e-12
    expected: '578'
    shown: ['= 578$']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  - id: p6-v
    answer: p6-v
    where: 'Problem 6(d), answer box: orbital speed, km/s'
    formula: sqrt(3.986e14/2.657e7)/1000
    expected: '3.873'
    shown: ['id="p6-v"', '= 3873$ m/s, or 3.873 km/s']
    source: {cite: mit, at: 'Problem 6(d) (our own solution)'}
    origin: page-own

  - id: p6-v-over-c
    where: 'Problem 6(d), check: v/c, in units of 1e-5'
    formula: sqrt(3.986e14/2.657e7)/2.998e8*1e5
    expected: '1.3'
    shown: ['about $1.3 \times 10^{-5}$ of the speed of light']
    source: {cite: mit, at: 'Problem 6(d) (our own solution)'}
    origin: page-own

  - id: p6-period
    answer: p6-period
    where: 'Problem 6(e), answer box: period by Kepler''s third law, hours'
    formula: 2*pi*sqrt((2.657e7)**3/3.986e14)/3600
    expected: '11.97'
    shown: ['id="p6-period"', 'which is 11.97 hours']
    source: {cite: mit, at: 'Problem 6(e) (our own solution)'}
    origin: page-own

  - id: p6-period-s
    where: 'Problem 6(e), solution: the period in seconds, as circumference over speed'
    formula: 2*pi*2.657e7/3873
    expected: '43100'
    tolerance: 50
    shown: ['= 43{,}100$ s']
    source: {cite: mit, at: 'Problem 6(e) (our own solution)'}
    origin: page-own

  - id: p6-half-turn
    where: 'Problem 6(e), check: half a turn of the Earth, s'
    formula: 86164/2
    expected: '43082'
    shown: ['$86{,}164/2 = 43{,}082$ s']
    source: {cite: mit, at: 'Problem 6(e) (our own solution)'}
    origin: page-own

  - id: p6-sat
    answer: p6-sat
    where: 'Problem 6(f), answer box: GM/(r c²) for the satellite, in units of 1e-10'
    formula: 3.986e14/(2.657e7*(2.998e8)**2)*1e10
    expected: '1.669'
    shown: ['id="p6-sat"', '= 1.669 \times 10^{-10}$']
    source: {cite: mit, at: 'Problem 6(f) (our own solution)'}
    origin: page-own

  - id: p6-sat-speed
    where: 'Problem 6(f), solution: the speed term of the satellite from its speed, in units of 1e-10'
    formula: (3873.2263)**2/(2*(2.998e8)**2)*1e10
    expected: '0.835'
    shown: ['the speed term is $0.835 \times 10^{-10}$']
    source: {cite: mit, at: 'Problem 6(f) (our own solution)'}
    origin: page-own

  - id: p6-gain
    answer: p6-gain
    where: 'Problem 6(g), answer box: gain through the gravity terms, microseconds per day'
    formula: 3.986e14/(2.998e8)**2*(1/6.378e6 - 1/2.657e7)*86400*1e6
    expected: '45.66'
    shown: ['id="p6-gain"', '$= 45.66$ μs']
    source: {cite: mit, at: 'Problem 6(g) (our own solution)'}
    origin: page-own

  - id: p6-gain-diff
    where: 'Problem 6(g), solution: difference of the gravity terms, in units of 1e-10'
    formula: 6.953 - 1.669
    expected: '5.284'
    shown: ['(6.953 - 1.669) \times 10^{-10} = 5.284 \times 10^{-10}$']
    source: {cite: mit, at: 'Problem 6(g) (our own solution)'}
    origin: page-own

  - id: p6-loss
    answer: p6-loss
    where: 'Problem 6(h), answer box: loss through the speed terms, microseconds per day'
    formula: (3.986e14/2.657e7 - (2*pi*6.378e6/86164)**2)/(2*(2.998e8)**2)*86400*1e6
    expected: '7.107'
    shown: ['id="p6-loss"', 'which is $7.107$ μs per day']
    source: {cite: mit, at: 'Problem 6(h) (our own solution)'}
    origin: page-own

  - id: p6-loss-diff
    where: 'Problem 6(h), solution: difference of the speed terms, in units of 1e-11'
    formula: 8.3455 - 0.1203
    expected: '8.225'
    shown: ['8.3455 \times 10^{-11} - 0.1203 \times 10^{-11} = 8.225 \times 10^{-11}$']
    source: {cite: mit, at: 'Problem 6(h) (our own solution)'}
    origin: page-own

  - id: p6-net
    answer: p6-net
    where: 'Problem 6(h), answer box: net gain, microseconds per day (first order)'
    formula: (3.986e14/(2.998e8)**2*(1/6.378e6 - 1/2.657e7) - (3.986e14/2.657e7 - (2*pi*6.378e6/86164)**2)/(2*(2.998e8)**2))*86400*1e6
    expected: '38.55'
    shown: ['id="p6-net"', '$45.66 - 7.11 = 38.55$ μs per day']
    source: {cite: mit, at: 'Problem 6(h) (our own solution)'}
    origin: page-own

  # Independent route: the exact ratio of the two clock rates of part (a), without the first-order step.
  - id: p6-net-exact
    where: 'Problem 6(h), check: the exact ratio of the two rates, microseconds per day'
    formula: (sqrt(1 - 3*3.986e14/(2.657e7*(2.998e8)**2))/sqrt(1 - 2*3.986e14/(6.378e6*(2.998e8)**2) - (2*pi*6.378e6/86164)**2/(2.998e8)**2) - 1)*86400*1e6
    expected: '38.55'
    shown: ['gives the same 38.55 μs per day']
    source: {cite: mit, at: 'Problem 6(h) (our own solution)'}
    origin: page-own

  - id: p6-lesson-loss
    where: 'Problem 6(h), check: the loss in the lesson on the twin paradox (v = 3.87 km/s, c = 3.00e8, no ground speed), microseconds per day'
    formula: 0.5*(3.87e3/3.00e8)**2*86400*1e6
    expected: '7.2'
    shown: ['finds 7.2 μs for the loss']
    source: {cite: mit, at: 'Problem 6(h) (our own solution; the lesson''s number)'}
    origin: page-own

  - id: p6-km
    answer: p6-km
    where: 'Problem 6(i), answer box: c times the net gain of one day, km'
    formula: 2.998e8*38.5487e-6/1000
    expected: '11.56'
    shown: ['id="p6-km"', 'or 11.56 km']
    source: {cite: mit, at: 'Problem 6(i) (our own solution)'}
    origin: page-own

  # ---- Problem 7

  - id: p7-rho
    answer: p7-rho
    kind: identity
    where: 'Problem 7(a), answer box: against mass over the flat-space volume of a sphere of radius 2M'
    formula: 3/(32*pi*M**2)
    equals: M/(4/3*pi*(2*M)**3)
    samples:
      M: [0.5, 1.0, 2.0, 3.0]
    tolerance: 1e-12
    shown: ['id="p7-rho"']
    source: {cite: mit, at: 'Problem 7 (our own problem and solution)'}
    origin: page-own

  - id: p7-sun
    where: 'Problem 7(a), check: mean density for one solar mass (2e30 kg), from mass over volume with r = 2GM/c², kg/m³'
    formula: 2e30/(4/3*pi*(2*6.674e-11*2e30/(2.998e8)**2)**3)
