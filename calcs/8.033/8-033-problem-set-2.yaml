    expected: '3.2e-7'
    shown: ['by $3.2\times 10^{-7}$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-g01-next-term
    where: 'Problem 5(a): the first term left out at beta = 0.1'
    inputs: {b: 0.1}
    formula: 5/16 * b**6
    expected: '3.1e-7'
