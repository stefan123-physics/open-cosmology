# Calculations on content/year-2/8.033/8-033-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# an exact remainder or a numerical Taylor coefficient for the series, a second geometric route for the aberration
# speeds, Cramer's rule for the inverse Lorentz transformation, the Lorentz transformation and the invariant
# interval for the clock, and a direct evaluation in double precision where the page uses a series.
# The page takes c = 3.00e8 m/s; it is the input `cl` here (the constant `c` of calcs/constants.yaml is the exact value).

page: content/year-2/8.033/8-033-problem-set-2.mdx
calcs:
  # ---- introduction

  - id: points-total
    where: 'introduction: the points of the ten problems that count'
    inputs: {}
    formula: 3 + 6 + 9 + 3 + 3 + 7.5 + 6 + 3 + 1.5 + 3
    expected: '45'
    shown: ['so 45 points count for the score']
    source: {cite: mit, at: 'pp. 1 to 3 (48 points on the sheet, less the 3 for name and staple)'}
    origin: page-own

  # ---- Problem 1 and 2: the sliding shape and the transformed equation

  - id: p1-cubic-check
    kind: identity
    where: 'Problem 1(a), check: y = (x - Vt)^3 obeys the wave equation (second time derivative = V^2 times second space derivative)'
    formula: deriv('(x0 - V*x)**3', 'x', t0, 2)
    equals: V**2 * deriv('(x - V*t0)**3', 'x', x0, 2)
    samples:
      V: [1.5, 0.7, 2.0, 3.1]
      x0: [1.3, 1.2, -0.4, 2.0]
      t0: [0.2, 0.9, 1.1, 0.1]
    tolerance: 1e-6
    shown: ['$\partial^2 y/\partial t^2 = 6V^2(x - Vt)$']
    source: {cite: mit, at: 'Problem 1(a) (our own check)'}
    origin: page-own

  # A = 1 - v^2/c^2 and K = 2v/c^2: the transformed equation is solved by a shape moving at V = v + c.
  # With f = exp(s), s = x' + V t': A - V^2/c^2 + K V must vanish at V = v + c; solved here for A.
  - id: p2-acoef
    kind: identity
    answer: p2-acoef
    where: 'Problem 2(b), answer box A: against the value that makes exp(x'' + (v + c) t'') a solution, given K = 2v/c^2'
    formula: 1 - v**2/c**2
    equals: solve('x - (v + c)**2/c**2 + 2*v*(v + c)/c**2', 'x', -50, 50)
    samples:
      v: [0.5, 1.5, 1.0, 0.8]
      c: [2, 4, 3, 2.5]
    tolerance: 1e-7
    shown: ['id="p2-acoef"']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # K from the two wave speeds: A - V^2/c^2 + K V = 0 for V = v + c and V = v - c; subtracting gives K = 2v/c^2.
  - id: p2-kcoef
    kind: identity
    answer: p2-kcoef
    where: 'Problem 2(b), answer box K: against the value fixed by the two wave speeds v + c and v - c'
    formula: 2*v/c**2
    equals: ((v + c)**2 - (v - c)**2) / (c**2 * ((v + c) - (v - c)))
    samples:
      v: [0.5, 1.5, 1.0, 0.8]
      c: [2, 4, 3, 2.5]
    tolerance: 1e-9
    shown: ['id="p2-kcoef"']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # The transformed equation holds for E = (x' + v t' - c t')^3, the Galilean image of (x - ct)^3,
  # checked with numerical derivatives: A E_xx - E_tt/c^2 + K E_xt = 0, with E_xt = (v - c) E_xx for this shape.
  - id: p2-transformed-equation
    kind: identity
    where: 'Problem 2(b), formula "Wave equation after a Galilean boost": the image of a solution (x - ct)^3 solves it'
    formula: (1 - v**2/c**2) * deriv('(x + (v - c)*t0)**3', 'x', x0, 2) + 2*v/c**2 * (v - c) * deriv('(x + (v - c)*t0)**3', 'x', x0, 2)
    equals: deriv('(x0 + (v - c)*x)**3', 'x', t0, 2) / c**2
    samples:
      v: [0.5, 1.5, 1.0, 0.8]
      c: [2, 4, 3, 2.5]
      x0: [1.3, 1.2, 4.0, 2.0]
      t0: [0.2, 0.9, 1.1, 0.1]
    tolerance: 1e-6
    shown: ['<Formula label="Wave equation after a Galilean boost"']
    source: {cite: reading2, at: 'slide 9'}
    origin: page-own

  # ---- Problem 3: the aeroplane

  - id: p3-still-air
    where: 'Problem 3(a), check: round trip in still air'
    inputs: {l: 160 km, u: 100 m/s}
    formula: 2 * l / u
    expected: 3200 s
    tolerance: 0.5 s
    shown: ['Then $t_0 = 3200$ s']
    source: {cite: mit, at: 'Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-leg-against
    where: 'Problem 3(a), check: the leg against the wind'
    inputs: {l: 160 km, u: 100 m/s, v: 60 m/s}
    formula: l / (u - v)
    expected: 4000 s
    tolerance: 0.5 s
    shown: ['$160\,000/40 = 4000$ s']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-leg-with
    where: 'Problem 3(a), check: the leg with the wind'
    inputs: {l: 160 km, u: 100 m/s, v: 60 m/s}
    formula: l / (u + v)
    expected: 1000 s
    tolerance: 0.5 s
    shown: ['$160\,000/160 = 1000$ s']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-along
    where: 'Problem 3(a), check: MIT''s formula t0/(1 - (v/u)^2) against the sum of the two legs'
    inputs: {l: 160 km, u: 100 m/s, v: 60 m/s}
    formula: (2 * l / u) / (1 - (v/u)**2)
    expected: 5000 s
    tolerance: 0.5 s
    shown: ['together $5000$ s', '$3200/(1 - 0.36) = 5000$ s']
    source: {cite: mit, at: 'Problem 3(a), Eq. (3.1)'}
    origin: page-own

  - id: p3-ground-speed
    where: 'Problem 3(b), check: ground speed in the crosswind'
    inputs: {u: 100 m/s, v: 60 m/s}
    formula: sqrt(u**2 - v**2)
    expected: 80 m/s
    tolerance: 0.5 m/s
    shown: ['$\sqrt{100^2 - 60^2} = 80$ m/s']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-across
    where: 'Problem 3(b), check: MIT''s formula t0/sqrt(1 - (v/u)^2) against two legs at the ground speed'
    inputs: {l: 160 km, u: 100 m/s, v: 60 m/s}
    formula: (2 * l / u) / sqrt(1 - (v/u)**2)
    expected: 4000 s
    tolerance: 0.5 s
    shown: ['each leg takes $2000$ s, and the trip $4000$ s', '$3200/0.8 = 4000$ s']
    source: {cite: mit, at: 'Problem 3(b), Eq. (3.2)'}
    origin: page-own

  - id: p3-times-identity
    kind: identity
    where: 'Problem 3(a) and (b): the closed forms against the sums of the legs'
    formula: l/(u - v) + l/(u + v) + 2*l/sqrt(u**2 - v**2)
    equals: (2*l/u)/(1 - (v/u)**2) + (2*l/u)/sqrt(1 - (v/u)**2)
    samples:
      l: [1, 160, 7.5, 0.3]
      u: [1, 100, 3, 2.2]
      v: [0.5, 60, 2.9, 0.1]
    tolerance: 1e-10
    shown: ['<Formula label="Adding the two legs"', '<Formula label="Adding the two crosswind legs"']
    source: {cite: mit, at: 'Problem 3, Eqs. (3.1) and (3.2)'}
    origin: page-own

  - id: p3-lecture-facts
    kind: fact
    where: 'Problem 3(c): the size of the expected effect and the Earth''s speed, as quoted in the lecture'
    shown: ['the Earth''s motion at about 30 km/s around the Sun', 'of order $(v/c)^2 \approx 10^{-8}$ of the travel time']
    source: {cite: reading2, at: 'slide 17'}
    origin: mit

  # ---- Problem 4: the contraction

  - id: p4-given
    kind: fact
    where: 'Problem 4, statement: MIT''s numbers'
    shown: ['MIT''s sheet gives the arm length as 2.8 m. Take 0.1 nm as the diameter of a typical atom', 'at $v = 30$ km/s, its orbital speed']
    source: {cite: mit, at: 'Problem 4, p. 2 (the 30 km/s is given in Problem 6, p. 2, and on slide 17 of the Lecture 3 slides)'}
    origin: mit

  - id: p4-beta
    where: 'Problem 4, solution: beta for the Earth'
    inputs: {v: 30 km/s, cl: 3.00e8 m/s}
    formula: v / cl
    expected: '1.0e-4'
    shown: ['$\beta = 3.0\times 10^4/3.00\times 10^8 = 1.0\times 10^{-4}$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-half-beta-sq
    where: 'Problem 4, solution: half of beta squared'
    inputs: {v: 30 km/s, cl: 3.00e8 m/s}
    formula: (v / cl)**2 / 2
    expected: '5.0e-9'
    shown: ['$\tfrac12\beta^2 = 5.0\times 10^{-9}$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # The exact shrinkage, not the series: L (1 - sqrt(1 - beta^2)).
  - id: p4-shrink
    where: 'Problem 4, solution: the shrinkage of the arm, from the exact contraction factor'
    inputs: {v: 30 km/s, cl: 3.00e8 m/s, L: 2.8 m}
    formula: L * (1 - sqrt(1 - (v/cl)**2))
    expected: 14 nm
    tolerance: 0.05 nm
    shown: ['= 1.4\times 10^{-8}\ \text{m} = 14\ \text{nm}', 'so 14 nm of arm is 28 nm of path']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-n
    answer: p4-n
    where: 'Problem 4, answer box: the shrinkage in atomic diameters, from the exact contraction factor'
    inputs: {v: 30 km/s, cl: 3.00e8 m/s, L: 2.8 m, d_atom: 0.1 nm}
    formula: L * (1 - sqrt(1 - (v/cl)**2)) / d_atom
    expected: '140'
    tolerance: '0.5'
    shown: ['id="p4-n"', 'About **140 atomic diameters**']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-arm-in-atoms
    where: 'Problem 4, solution: the arm length in atomic diameters'
    inputs: {L: 2.8 m, d_atom: 0.1 nm}
    formula: L / d_atom / 1e9
    expected: '28'
    shown: ['on an arm of 28 billion atomic diameters']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-next-term
    where: 'Problem 4, check: the next term of the expansion, beta^4/8'
    inputs: {v: 30 km/s, cl: 3.00e8 m/s}
    formula: (v / cl)**4 / 8
    expected: '1e-17'
    tolerance: '0.5e-17'
    shown: ['$\beta^4/8 \approx 10^{-17}$']
    source: {cite: mit, at: 'Problem 4 (our own check)'}
    origin: page-own

  - id: p4-path-fraction
    where: 'Problem 4, check: 28 nm of path as a fraction of a 500 nm wavelength (about a twentieth)'
    inputs: {path: 28 nm, wavelength: 500 nm}
    formula: path / wavelength
    expected: '0.05'
    tolerance: '0.01'
    shown: ['about a twentieth of a wavelength']
    source: {cite: reading2, at: 'slide 17 (the wavelength)'}
    origin: page-own

  - id: p4-lecture-facts
    kind: fact
    where: 'Problem 4, check: wavelength and sensitivity quoted in the lecture'
    shown: ['the light had a wavelength of about 500 nm, and shifts of a hundredth of a wavelength could be seen']
    source: {cite: reading2, at: 'slide 17'}
    origin: mit

  # ---- Problem 5: the series

  # Exact remainder of the geometric series: 1/(1 - x) = 1 + x + x^2 + x^3/(1 - x), with x = b^2.
  - id: p5-g2
    kind: identity
    answer: p5-g2
    where: 'Problem 5(a), answer box: three terms of gamma squared, against the exact value less the exact remainder'
    formula: 1 + b**2 + b**4
    equals: 1/(1 - b**2) - b**6/(1 - b**2)
    samples:
      b: [0.2, 0.45, 0.7, 0.05]
    tolerance: 1e-12
    shown: ['id="p5-g2"']
    source: {cite: mit, at: 'Problem 5(a), Eq. (5.2)'}
    origin: mit

  # The coefficients as numerical Taylor coefficients of (1 - x)^(-1/2) at x = 0.
  - id: p5-g
    kind: identity
    answer: p5-g
    where: 'Problem 5(a), answer box: three terms of gamma, against numerical derivatives of (1 - x)^(-1/2) at 0'
    formula: 1 + b**2/2 + 3*b**4/8
    equals: 1 + b**2 * deriv('(1 - x)**(-0.5)', 'x', 0) + b**4 / 2 * deriv('(1 - x)**(-0.5)', 'x', 0, 2)
    samples:
      b: [0.2, 0.45, 0.7, 0.05]
    tolerance: 1e-6
    shown: ['id="p5-g"']
    source: {cite: mit, at: 'Problem 5(a), Eq. (5.3)'}
    origin: mit

  - id: p5-g-limit
    kind: limit
    where: 'Problem 5(a): the three-term series approaches the exact gamma as beta falls (error of order beta^6)'
    formula: (1/sqrt(1 - b**2) - (1 + b**2/2 + 3*b**4/8)) / b**6
    limit: 5/16
    vary: {b: [0.3, 0.1, 0.03]}
    tolerance: 1e-3
    shown: ['+ \frac{5}{16}\beta^6 + \dots']
    source: {cite: mit, at: 'Problem 5(a), Eq. (5.3)'}
    origin: mit

  - id: p5-g01
    answer: p5-g01
    where: 'Problem 5(a), answer box: gamma - 1 from three terms at beta = 0.1'
    inputs: {b: 0.1}
    formula: b**2/2 + 3*b**4/8
    expected: '0.0050375'
    tolerance: '1e-9'
    shown: ['id="p5-g01"', '$5.0375\times 10^{-3}$', '$1 + 0.005 + 0.0000375$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-g01-exact
