    formula: 1/sqrt(1 - b**2) - 1
    expected: '5.03782e-3'
    shown: ['$5.03782\times 10^{-3}$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-g01-miss
