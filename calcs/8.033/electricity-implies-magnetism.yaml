# Calculations on content/year-2/8.033/electricity-implies-magnetism.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 15 slides (deck "Lecture 14"), with the page's own example.

page: content/year-2/8.033/electricity-implies-magnetism.mdx
calcs:
  - id: coulomb-constant
    where: 'k_e = 1/(4πε₀)'
    inputs: {}
    formula: 1/(4*pi*8.8541878128e-12)
    expected: '8.9875e9'
    tolerance: 0.0001e9
    shown: ['\approx 8.9875 \times 10^9\ \text{N m}^2/\text{C}^2']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: history-years
    kind: fact
    where: 'history dates, as on the slides (from 8.02T)'
    value: '1730, 1766–1786, 1800, 1820, 1831, 1873, 1887, 1905'
    shown: ['du Fay''s two kinds of charge (1730)']
    source: {cite: mit, at: 'slides 7–10'}
    origin: mit

  - id: inverse-square
    kind: fact
    where: 'precision of the inverse-square law, as on the slide'
    value: '2e-9'
    shown: ['better than 2 parts in $10^9$']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: hubble-repair
    kind: fact
    where: 'Hubble servicing mission SM4, flown May 2009 (later development)'
    value: '2009'
    shown: ['(a repair mission, flown in 2009)']
    source: {ref: 'NASA, Hubble Servicing Mission 4 (May 2009)'}
    origin: later-data

  - id: field-transform
    kind: identity
    where: 'Λ M Λ⁻¹ for pure E_y gives E′_y = γE_y and B′_z = −γβE_y; check E² − B² invariant: (γE)² − (γβE)² = E²'
    formula: (E/sqrt(1 - b**2))**2 - (b*E/sqrt(1 - b**2))**2
    equals: E**2
    samples: {E: [1.0, 3.0, 2.0], b: [0.1, 0.6, 0.9]}
    tolerance: 1e-9
    shown: ['B_z'' = \gamma\left(B_z - \beta E_y\right)" cite']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: ex-E
    where: 'example: γE_y at 0.6c'
    inputs: {}
    formula: 1e6/sqrt(1 - 0.6**2)
    expected: '1.25e6'
    tolerance: 1
    shown: ['so $E_y'' = 1.25 \times 10^6$ V/m']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: ex-B
    where: 'example: γβE_y/c in tesla'
    inputs: {}
    formula: 1.25*0.6*1e6/3.00e8
    expected: '2.5e-3'
    tolerance: 1e-9
    shown: ['= -2.5 \times 10^{-3}$ T']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: quiz-gamma
    where: 'quiz and example: γ at 0.8c'
    inputs: {}
    formula: 1/sqrt(1 - 0.8**2)
    expected: '1.67'
    tolerance: 0.005
    shown: ['$\gamma = 1/0.6 \approx 1.67$, so']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-rho
    where: 'example: γρ₀'
    inputs: {}
    formula: 1e-6/sqrt(1 - 0.8**2)
    expected: '1.67e-6'
    tolerance: 0.005e-6
    shown: ['\rho = \gamma\rho_0 \approx 1.67 \times 10^{-6}$ C/m³']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-J
    where: 'example: J = γρ₀u'
    inputs: {}
    formula: 1e-6/sqrt(1 - 0.8**2)*0.8*3.00e8
    expected: '400'
    tolerance: 1e-6
    shown: ['(exactly 400 with $\gamma = 5/3$)']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-rhoc
    where: 'example: ρc'
    inputs: {}
    formula: 1e-6/sqrt(1 - 0.8**2)*3.00e8
    expected: '500'
    tolerance: 1e-6
    shown: ['Then $\rho c = 500$ A/m²']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-invariant
    where: 'example: √(500² − 400²) = ρ₀c'
    inputs: {}
    formula: sqrt(500**2 - 400**2)
    expected: '300'
    tolerance: 1e-9
    shown: ['500^2 - 400^2 = 300^2 = (\rho_0c)^2$']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own
