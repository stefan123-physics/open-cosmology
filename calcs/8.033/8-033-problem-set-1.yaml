  # ---- Problem 7: the dropped ball

  # Independent route: solve x = v s for the time s, then evaluate the height at that time.
  - id: p7-path
    kind: identity
    answer: p7-path
    where: 'Problem 7(a), answer box: the height at the time when the ball is at x, with the time found by a numerical solve'
    formula: h - g*x**2/(2*v**2)
    equals: h - 0.5*g*solve('v*s - x', 's', 0, 10)**2
    samples:
      h: [1, 1.3, 2, 1.7]
      g: [9, 9.8, 10, 9.5]
      v: [5, 12, 20, 8]
      x: [0.5, 1.4, 1.8, 1.2]
    tolerance: 1e-8
    shown: ['id="p7-path"']
    source: {cite: mit, at: 'Problem 7, p. 2 (our own solution)'}
    origin: page-own

  # Independent route: the positive root of the path y(x) = 0.
  - id: p7-range
    kind: identity
    answer: p7-range
    where: 'Problem 7(a), answer box: against the numerical root of the path, y(x) = 0'
    formula: v*sqrt(2*h/g)
    equals: solve('h - g*s**2/(2*v**2)', 's', 0.01, 100)
    samples:
      h: [1, 1.3, 2, 1.7]
      g: [9, 9.8, 10, 9.5]
      v: [5, 12, 20, 8]
    tolerance: 1e-8
    shown: ['id="p7-range"']
    source: {cite: mit, at: 'Problem 7, p. 2 (our own solution)'}
    origin: page-own

  - id: p7-fall-time
    where: 'Problem 7(a), picture: the time of fall for a drop of 2 m'
    inputs: {h: 2 m, g: 9.8 m/s**2}
    formula: sqrt(2 * h / g)
    expected: 0.639 s
    shown: ['The ball is in the air for 0.639 s']
