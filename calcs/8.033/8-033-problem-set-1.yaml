  # ---- Problem A: the pulsar

  - id: pa-given
    kind: fact
    where: 'Problem A, statement: distance and timing'
    shown: ['at a distance of 6000 light-years from Earth']
    source: {cite: mit, at: 'Problem A, p. 2'}
    origin: mit

  - id: pa-travel-time
    where: 'Problem A, solution: the travel time in seconds'
    inputs: {year: 3.156e7 s}
    formula: 6000 * year
    expected: 1.894e11 s
    shown: ['$t = 6000 \times 3.156\times 10^{7}\ \text{s} = 1.894\times 10^{11}$ s']
    source: {cite: mit, at: 'Problem A, p. 2 (our own solution)'}
    origin: page-own

  - id: pa-limit
    answer: pa-limit
    where: 'Problem A, answer box: timing error over travel time'
    inputs: {dt: 200e-6 s, year: 3.156e7 s}
    formula: dt / (6000 * year)
    expected: '1.06e-15'
    shown: ['id="pa-limit"', '= 1.06\times 10^{-15}" cite="mit"']
    source: {cite: mit, at: 'Problem A, p. 2 (our own solution)'}
    origin: page-own

  # Independent route: the difference of the travel times d/c and d/(c + dc) for dc = 1.06e-15 c, written
  # as t * x / (1 + x) to avoid subtracting two nearly equal numbers; it must come out as 200 microseconds.
  - id: pa-back-check
    where: 'Problem A, check: a speed difference of 1.06e-15 c over 6000 years gives a delay of 200 microseconds'
    inputs: {year: 3.156e7 s}
    formula: 6000 * year * 1.06e-15 / (1 + 1.06e-15)
    expected: 2.0e-4 s
    tolerance: 1e-6 s
    shown: ['$\Delta t = 2.0\times 10^{-4}$ s']
    source: {cite: mit, at: 'Problem A (our own check)'}
    origin: page-own

  - id: pa-speed
    where: 'Problem A, check: the limit as a speed'
    inputs: {v: 3.0e8 m/s}
    formula: 1.06e-15 * v
    expected: 3e-7 m/s
    tolerance: 0.5e-7 m/s
    shown: ['\approx 3\times 10^{-7}$ m/s']
    source: {cite: mit, at: 'Problem A (our own check)'}
    origin: page-own

