# Calculations on content/year-2/8.033/8-033-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# a second formula for the same quantity (u²/r against ω²r, gravity against the circular motion), a numerical solve
# of the inverse transformation, a numerical derivative, or the direct sum over the particles.

page: content/year-2/8.033/8-033-problem-set-1.mdx
calcs:
  # ---- Problem 1: Rømer

  - id: p1-given
    kind: fact
    where: 'Problem 1, statement: the sum of the period excesses'
    shown: ['Added together, the excesses of all those periods came to 22 minutes.']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-c
    answer: p1-c
    where: 'Problem 1(b), answer box: the diameter of Earth''s orbit over 22 minutes'
    inputs: {R: 1.5e11 m, dt: 22 min}
    formula: 2 * R / dt
    expected: 2.27e8 m/s
    shown: ['id="p1-c"', '= 2.27\times 10^{8}\ \text{m/s}"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-seconds
    where: 'Problem 1(b), solution: 22 minutes in seconds'
    inputs: {dt: 22 min}
    formula: dt
    expected: 1320 s
    shown: ['{1320\ \text{s}}']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  # Independent of the telescoping sum: the Jupiter-Earth distance at D minus that at A, from the law of cosines
  # for an Earth at angle theta on a circle of radius R around a Sun at distance D from Jupiter, equals 2R.
  - id: p1-diameter
    kind: identity
    where: 'Problem 1(a), formula "Sum of the period excesses": the distance at D minus the distance at A is the diameter'
    formula: sqrt(D**2 + R**2 - 2*D*R*cos(pi)) - sqrt(D**2 + R**2 - 2*D*R*cos(0))
    equals: 2*R
    samples:
      D: [5.2, 4.9, 5.5, 10, 3]
      R: [1, 1, 1, 2, 0.5]
    tolerance: 1e-9
    shown: ['<Formula label="Sum of the period excesses"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-too-low
    where: 'Problem 1(b), check: the estimate against the modern value'
    inputs: {R: 1.5e11 m, dt: 22 min}
    formula: 1 - (2 * R / dt) / c
    expected: 0.24
    tolerance: 0.005
    shown: ['this estimate is 24% too low']
    source: {cite: mit, at: 'Problem 1 (our own check)'}
    origin: page-own

  - id: p1-true-time
    where: 'Problem 1(b), check: the real light-crossing time of the orbit'
    inputs: {R: 1.5e11 m}
    formula: 2 * R / c
    expected: 1001 s
    shown: ['m in 1001 s']
    source: {cite: mit, at: 'Problem 1 (our own check)'}
    origin: page-own

  - id: p1-true-minutes
    where: 'Problem 1(b), check: the same in minutes'
    inputs: {R: 1.5e11 m}
    formula: 2 * R / c
    expected: 16.7 min
    shown: ['which is 16.7 minutes']
    source: {cite: mit, at: 'Problem 1 (our own check)'}
    origin: page-own

  - id: p1-c-modern
    where: 'Problem 1(b), check: the modern speed of light (exact by the SI definition of the metre), rounded'
    formula: c
    expected: 2.998e8 m/s
    shown: ['$c = 2.998\times 10^8$ m/s']
    source: {cite: mit, at: 'Problem 1 (our own check; the value is the SI definition, calcs/constants.yaml)'}
    origin: page-own

  # ---- Problem 2: accelerations

  - id: p2-given-mit
    kind: fact
    where: 'Problem 2, statement: the values MIT gives'
    shown: ['the Sun is 10 kpc from the centre of the Galaxy and moves around it at 300 km/s']
    source: {cite: mit, at: 'Problem 2, p. 1'}
    origin: mit

  - id: p2-given-ours
    kind: fact
    where: 'Problem 2, statement: the values we add (Earth''s radius, day, year, month)'
    shown: ['Take: Earth''s radius $6.4\times 10^{6}$ m; one turn of the Earth in 24 hours; one year of $3.156\times 10^{7}$ s; one orbit of the Moon in 27.3 days.']
    source: {cite: mit, at: 'Problem 2, p. 1 (MIT leaves these to the student; ours are standard rounded values: mean radius 6371 km, Julian year 3.15576e7 s, sidereal month 27.32 d)'}
    origin: page-own

  - id: p2-rot
    answer: p2-a
    where: 'Problem 2(a), answer box: omega squared r at the equator'
    inputs: {r: 6.4e6 m, T: 86400 s}
    formula: (2 * pi / T)**2 * r
    expected: 0.0338 m/s**2
    shown: ['id="p2-a"', '= 0.0338\ \text{m/s}^2"']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-rot-speed
    where: 'Problem 2(a), check: the speed of the equator'
    inputs: {r: 6.4e6 m, T: 86400 s}
    formula: 2 * pi * r / T
    expected: 465 m/s
    shown: ['465 m/s, and $u^2/r$']
    source: {cite: mit, at: 'Problem 2(a) (our own check)'}
    origin: page-own

  # Second route: u^2 / r with the rounded speed.
  - id: p2-rot-second-route
    where: 'Problem 2(a), check: u squared over r gives the same acceleration'
    inputs: {u: 465.42 m/s, r: 6.4e6 m}
    formula: u**2 / r
    expected: 0.0338 m/s**2
    shown: ['gives the same acceleration']
    source: {cite: mit, at: 'Problem 2(a) (our own check)'}
    origin: page-own

  - id: p2-rot-over-g
    where: 'Problem 2(a), check: as a fraction of g, in percent'
    inputs: {r: 6.4e6 m, T: 86400 s, g: 9.8 m/s**2}
    formula: 100 * (2 * pi / T)**2 * r / g
    expected: '0.35'
    shown: ['It is 0.35% of $g = 9.8\ \text{m/s}^2$']
    source: {cite: mit, at: 'Problem 2(a) (our own check)'}
    origin: page-own

  - id: p2-rot-sidereal
    where: 'Problem 2(a), check: with the sidereal day (23 h 56 min 4 s) the result is half a percent higher'
    inputs: {T: 86400 s, Ts: 86164 s}
    formula: 100 * ((T / Ts)**2 - 1)
    expected: '0.5'
    tolerance: 0.06
    shown: ['raises the result by half a percent']
    source: {cite: mit, at: 'Problem 2(a) (our own check)'}
    origin: page-own

  - id: p2-orb
    answer: p2-b
    where: 'Problem 2(b), answer box: omega squared r for the orbit round the Sun'
    inputs: {r: 1.5e11 m, T: 3.156e7 s}
    formula: (2 * pi / T)**2 * r
    expected: 5.95e-3 m/s**2
    shown: ['id="p2-b"', '= 5.95\times 10^{-3}\ \text{m/s}^2"']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-orb-speed
    where: 'Problem 2(b), check: the orbital speed'
    inputs: {r: 1.5e11 m, T: 3.156e7 s}
    formula: 2 * pi * r / T
    expected: 29.9 km/s
    shown: ['$\omega r = 29.9$ km/s']
    source: {cite: mit, at: 'Problem 2(b) (our own check)'}
    origin: page-own

  # Second route: u^2 / r with the rounded orbital speed.
  - id: p2-orb-second-route
    where: 'Problem 2(b), check: u squared over r with the orbital speed'
    inputs: {u: 29.863 km/s, r: 1.5e11 m}
    formula: u**2 / r
    expected: 5.95e-3 m/s**2
    shown: ['the familiar 30 km/s of the lesson']
    source: {cite: mit, at: 'Problem 2(b) (our own check)'}
    origin: page-own

  - id: p2-rot-over-orb
    where: 'Problem 2(b), check: ratio of the two accelerations'
    inputs: {rE: 6.4e6 m, Td: 86400 s, r: 1.5e11 m, T: 3.156e7 s}
    formula: ((2 * pi / Td)**2 * rE) / ((2 * pi / T)**2 * r)
    expected: '6'
    tolerance: 0.5
    shown: ['about six times smaller than that of the rotation']
    source: {cite: mit, at: 'Problem 2(b) (our own check)'}
    origin: page-own

  - id: p2-speed-ratio
    where: 'Problem 2(b), check: ratio of the two speeds'
    inputs: {rE: 6.4e6 m, Td: 86400 s, r: 1.5e11 m, T: 3.156e7 s}
    formula: (r / T) / (rE / Td)
    expected: '64'
    shown: ['although the speed is 64 times larger']
    source: {cite: mit, at: 'Problem 2(b) (our own check)'}
    origin: page-own

  - id: p2-gal-radius
    where: 'Problem 2(c), solution: 10 kpc in metres'
    inputs: {kpc: 3.09e19 m}
    formula: 10 * kpc
    expected: 3.09e20 m
    shown: ['$10\ \text{kpc} = 10 \times 3.09\times 10^{19}\ \text{m} = 3.09\times 10^{20}$ m']
    source: {cite: mit, at: 'Problem 2, p. 1 (the parsec in metres)'}
    origin: page-own

  - id: p2-gal
    answer: p2-c
    where: 'Problem 2(c), answer box: u squared over r for the orbit round the Galaxy'
    inputs: {u: 300 km/s, r: 3.09e20 m}
    formula: u**2 / r
    expected: 2.91e-10 m/s**2
    shown: ['id="p2-c"', '= 2.91\times 10^{-10}\ \text{m/s}^2"']
    source: {cite: mit, at: 'Problem 2(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-gal-period
    where: 'Problem 2(c), check: the time of one orbit round the Galaxy, in millions of years'
    inputs: {u: 300 km/s, r: 3.09e20 m, year: 3.156e7 s}
    formula: 2 * pi * r / u / year / 1e6
    expected: '205'
    shown: ['about 205 million years']
    source: {cite: mit, at: 'Problem 2(c) (our own check)'}
    origin: page-own

  # Second route: omega squared r with that period.
  - id: p2-gal-second-route
    where: 'Problem 2(c), check: omega squared r with the period of 205 million years'
    inputs: {T: 6.4717e15 s, r: 3.09e20 m}
    formula: (2 * pi / T)**2 * r
    expected: 2.91e-10 m/s**2
    shown: ['So slow a turn gives a tiny acceleration']
    source: {cite: mit, at: 'Problem 2(c) (our own check)'}
    origin: page-own

  - id: p2-orb-over-gal
    where: 'Problem 2(c), check: ratio of the solar-orbit acceleration to the Galactic one, in millions'
    inputs: {r: 1.5e11 m, T: 3.156e7 s, u: 300 km/s, rg: 3.09e20 m}
    formula: ((2 * pi / T)**2 * r) / (u**2 / rg) / 1e6
    expected: '20'
    tolerance: 0.5
    shown: ['20 million times smaller']
    source: {cite: mit, at: 'Problem 2(c) (our own check)'}
    origin: page-own

  - id: p2-moon-radius
    where: 'Problem 2(d), solution: Earth''s distance from the centre of mass'
    inputs: {d: 3.8e8 m}
    formula: d / (1 + 80)
    expected: 4.69e6 m
    shown: ['= 4.69\times 10^{6}\ \text{m}" cite="mit" at="Problem 2(d)']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-moon-period
    where: 'Problem 2(d), solution: 27.3 days in seconds'
    inputs: {T: 27.3 day}
    formula: T
    expected: 2.359e6 s
    shown: ['which is $2.359\times 10^{6}$ s']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-moon
    answer: p2-d
    where: 'Problem 2(d), answer box: omega squared r for Earth''s circle about the centre of mass'
    inputs: {d: 3.8e8 m, T: 27.3 day}
    formula: (2 * pi / T)**2 * d / (1 + 80)
    expected: 3.33e-5 m/s**2
    shown: ['id="p2-d"', '= 3.33\times 10^{-5}\ \text{m/s}^2"']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own solution)'}
    origin: page-own

  # Independent route: the Moon's pull on the Earth, G M_Moon / d^2 = g (r/d)^2 / 80.
  - id: p2-moon-gravity
    where: 'Problem 2(d), check: the same acceleration from gravity'
    inputs: {g: 9.8 m/s**2, r: 6.4e6 m, d: 3.8e8 m}
    formula: g * (r / d)**2 / 80
    expected: 3.47e-5 m/s**2
    shown: ['= 3.47\times 10^{-5}\ \text{m/s}^2$']
    source: {cite: mit, at: 'Problem 2(d) (our own check)'}
    origin: page-own

  - id: p2-moon-agreement
    where: 'Problem 2(d), check: the two routes differ by about 4 percent'
    inputs: {g: 9.8 m/s**2, r: 6.4e6 m, d: 3.8e8 m, T: 27.3 day}
    formula: 100 * ((g * (r / d)**2 / 80) / ((2 * pi / T)**2 * d / 81) - 1)
    expected: '4'
    tolerance: 0.5
    shown: ['The two routes agree to about 4%']
    source: {cite: mit, at: 'Problem 2(d) (our own check)'}
    origin: page-own

  # ---- Problem 3: the general Galilean transformation

  # Independent route: solve the inverse transformation x = x' + vx t for x'.
  - id: p3-x
    kind: identity
    answer: p3-x
    where: 'Problem 3(a), answer box: against a numerical solve of the inverse transformation x = s + vx t'
    formula: x - vx*t
    equals: solve('s + vx*t - x', 's', -100, 100)
    samples:
      x: [1, 2.2, 3.7, 5, 4.1]
      vx: [0.5, 1.1, 2, 1.6, 0.8]
      t: [1, 3, 2.4, 1.7, 2.9]
    tolerance: 1e-8
    shown: ['id="p3-x"']
    source: {cite: reading1, at: 'slide 10'}
    origin: page-own

  # The entry in row 2, column 4 is the coefficient of t in y' = y0 - vy t: its derivative with respect to t.
  - id: p3-entry
    kind: identity
    answer: p3-entry
    where: 'Problem 3(b), answer box: the coefficient of t in the row for y prime, as a numerical derivative'
    formula: -vy
    equals: deriv('y0 - vy*s', 's', t0)
    samples:
      vy: [0.5, 1.1, 2, 1.6]
      y0: [1, 2, 3, 4]
      t0: [0.3, 1, 2, 2.5]
    tolerance: 1e-8
    shown: ['id="p3-entry"']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  # Two boosts in a row: x'' = (x - vx t) - wx t is one boost with vx + wx.
  - id: p3-composition
    kind: identity
    where: 'Problem 3(b), check: two boosts in a row add their velocities'
    formula: (x - vx*t) - wx*t
    equals: x - (vx + wx)*t
    samples:
      x: [1, 2.2, 3.7, 5]
      vx: [0.5, 1.1, 2, 1.6]
      wx: [-0.5, 0.4, 1.3, -2]
      t: [1, 3, 2.4, 1.7]
    tolerance: 1e-12
    shown: ['two boosts in a row are one boost with the sum of the velocities']
    source: {cite: mit, at: 'Problem 3(b) (our own check)'}
    origin: page-own

  # ---- Problem 4: momentum

  # Direct sum over the particles on one line. The ground observer's conservation law fixes the last final
  # velocity, U2 = (m1 u1 + m2 u2 - M1 U1) / M2; the train observer's momentum after minus before follows.
  - id: p4-dp
    kind: identity
    answer: p4-dp
    where: 'Problem 4(b), answer box: against the direct sum over the particles, with ground-frame conservation imposed'
    formula: -(M1 + M2 - m1 - m2)*v
    equals: (M1*(U1 - v) + M2*((m1*u1 + m2*u2 - M1*U1)/M2 - v)) - (m1*(u1 - v) + m2*(u2 - v))
    samples:
      m1: [1, 1.4, 2, 1.7, 1.2]
      m2: [1, 1.9, 1.5, 2, 1.1]
      M1: [3, 3.6, 4, 3.2, 1.3]
      M2: [3, 3.3, 3.8, 4, 1.0]
      u1: [2, -1, 4, 0.5, 3]
      u2: [-1, 3, 0, 2.5, -2]
      U1: [0.5, 1.5, -2, 3, 1]
      v: [5, 12, 20, 8.5, 6]
    tolerance: 1e-9
    shown: ['id="p4-dp"']
    source: {cite: mit, at: 'Problem 4, p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 5: kinetic energy

  # Independent route: build two equal particles (m = M/2 each) with the given K and P, velocities
  # P/M ± sqrt(2K/M - P²/M²), and add their kinetic energies in the moving frame directly.
  - id: p5-k
    kind: identity
    answer: p5-k
    where: 'Problem 5(a), answer box: against the direct sum for two equal particles that have the given K and P'
    formula: K - v*P + M*v**2/2
    equals: M/4*((P/M + sqrt(2*K/M - (P/M)**2) - v)**2 + (P/M - sqrt(2*K/M - (P/M)**2) - v)**2)
    samples:
      K: [30, 40, 50, 35, 45]
      P: [1, 2.5, 4, 3.5, 2]
      M: [1, 2.5, 4, 3, 1.8]
      v: [1, 3, 5, 2.2, 4.1]
    tolerance: 1e-9
    shown: ['id="p5-k"']
    source: {cite: mit, at: 'Problem 5, p. 2 (our own solution)'}
    origin: page-own

  # The same for two unequal particles, written out with their own velocities.
  - id: p5-k-unequal
    kind: identity
    where: 'Problem 5(a), formula "Kinetic energy in the moving frame": unequal masses'
    formula: 0.5*m1*(u1 - v)**2 + 0.5*m2*(u2 - v)**2
    equals: (0.5*m1*u1**2 + 0.5*m2*u2**2) - v*(m1*u1 + m2*u2) + 0.5*(m1 + m2)*v**2
    samples:
      m1: [1, 1.4, 2, 1.7]
      m2: [3, 0.9, 1.5, 2]
      u1: [2, -1, 4, 0.5]
      u2: [-1, 3, 0, 2.5]
      v: [5, 1.2, -2, 0.7]
    tolerance: 1e-9
    shown: ['<Formula label="Kinetic energy in the moving frame"']
    source: {cite: mit, at: 'Problem 5, p. 2 (our own solution)'}
    origin: page-own

  - id: p5-minimum
    kind: identity
    where: 'Problem 5(a), check: in the zero-momentum frame K prime is K - P²/(2M)'
    formula: K - (P/M)*P + M*(P/M)**2/2
    equals: K - P**2/(2*M)
    samples:
      K: [10, 25, 50, 33]
      P: [2, 5, 8, 3.5]
      M: [1, 2.5, 4, 3]
    tolerance: 1e-9
    shown: ['gives $K'' = K - P^2/(2M)$']
    source: {cite: mit, at: 'Problem 5 (our own check)'}
    origin: page-own

  - id: p5-given
    kind: fact
    where: 'Problem 5(c), statement: our own numbers'
    shown: ['A cart of 2 kg moving at 3 m/s hits a cart of 1 kg at rest, and the two stick together. An observer on a train moving at 5 m/s']
    source: {cite: mit, at: 'Problem 5(c) (our own addition, our own numbers)'}
    origin: page-own

  - id: p5-final-speed
    where: 'Problem 5(c), solution: the common final velocity on the ground'
    inputs: {m1: 2 kg, m2: 1 kg, u1: 3 m/s}
    formula: m1 * u1 / (m1 + m2)
    expected: 2 m/s
    shown: ['so the carts move on at $U = 2$ m/s']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  - id: p5-ground-before
    where: 'Problem 5(c), solution: kinetic energy on the ground before'
    inputs: {m1: 2 kg, u1: 3 m/s}
    formula: 0.5 * m1 * u1**2
    expected: 9 J
    shown: ['$\tfrac12 \times 2 \times 3^2 = 9$ J']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  - id: p5-ground-after
    where: 'Problem 5(c), solution: kinetic energy on the ground after'
    inputs: {m: 3 kg, U: 2 m/s}
    formula: 0.5 * m * U**2
    expected: 6 J
    shown: ['$\tfrac12 \times 3 \times 2^2 = 6$ J']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  - id: p5-train-before
    where: 'Problem 5(c), solution: kinetic energy on the train before'
    inputs: {m1: 2 kg, m2: 1 kg, u1: 3 m/s, u2: 0 m/s, v: 5 m/s}
    formula: 0.5 * m1 * (u1 - v)**2 + 0.5 * m2 * (u2 - v)**2
    expected: 16.5 J
    shown: ['$\tfrac12 \times 2 \times 2^2 + \tfrac12 \times 1 \times 5^2 = 16.5$ J']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  - id: p5-train-after
    where: 'Problem 5(c), solution: kinetic energy on the train after'
    inputs: {m: 3 kg, U: 2 m/s, v: 5 m/s}
    formula: 0.5 * m * (U - v)**2
    expected: 13.5 J
    shown: ['$\tfrac12 \times 3 \times 3^2 = 13.5$ J']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  - id: p5-loss-train
    answer: p5-loss
    where: 'Problem 5(c), answer box: the loss of kinetic energy in the train frame'
    inputs: {m1: 2 kg, m2: 1 kg, u1: 3 m/s, u2: 0 m/s, U: 2 m/s, v: 5 m/s}
    formula: 0.5 * m1 * (u1 - v)**2 + 0.5 * m2 * (u2 - v)**2 - 0.5 * (m1 + m2) * (U - v)**2
    expected: 3 J
    tolerance: 1e-9 J
    shown: ['id="p5-loss"']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  # Independent route: the loss in the ground frame, and the formula of part (a).
  - id: p5-loss-ground
    where: 'Problem 5(c), solution: the loss in the ground frame'
    inputs: {m1: 2 kg, m2: 1 kg, u1: 3 m/s, U: 2 m/s}
    formula: 0.5 * m1 * u1**2 - 0.5 * (m1 + m2) * U**2
    expected: 3 J
    tolerance: 1e-9 J
    shown: ['The loss is 3 J.']
    source: {cite: mit, at: 'Problem 5(c) (our own addition)'}
    origin: page-own

  - id: p5-formula-check
    where: 'Problem 5(c), check: K prime before, from the formula of part (a)'
    formula: 9 - 5 * 6 + 0.5 * 3 * 5**2
    expected: '16.5'
    shown: ['$K'' = 9 - 5 \times 6 + \tfrac12 \times 3 \times 5^2 = 16.5$ J']
    source: {cite: mit, at: 'Problem 5(c) (our own check)'}
    origin: page-own

  # ---- Problem 6: work and kinetic energy

  # Work as the numerical integral of force times ground-frame velocity over the time, against MIT's expression.
  - id: p6-work-ground
    kind: identity
    where: 'Problem 6(a), formula "Work found by the ground observer": against the integral of F times velocity over time'
    formula: integrate('m*a*(v + a*s)', 's', 0, t)
    equals: 0.5*m*a**2*t**2 + m*v*a*t
    samples:
      m: [1, 0.5, 2, 3.3]
      a: [2, 10, 0.7, 1.5]
      v: [30, 5, 12, 0]
