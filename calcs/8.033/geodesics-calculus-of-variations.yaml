# Calculations on content/year-2/8.033/geodesics-calculus-of-variations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 8 slides, with the page's own example.

page: content/year-2/8.033/geodesics-calculus-of-variations.mdx
calcs:
  - id: straight-line-slope
    kind: identity
    where: 'd/dy'' of √(1 + y''²) is y''/√(1 + y''²)'
    formula: deriv('sqrt(1 + q**2)', 'q', p)
    equals: p/sqrt(1 + p**2)
    samples: {p: [-1.5, 0.3, 2.0]}
    tolerance: 1e-6
    shown: ['$\partial L/\partial y'' = y''/\sqrt{1 + y''^2}$ is constant']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: quiz-proper-time
    where: 'quiz: √(1 − 0.8²) × 10 years'
    inputs: {}
    formula: sqrt(1 - 0.8**2)*10
    expected: '6'
    tolerance: 1e-9
    shown: ['= 0.6 \\times 10 = 6$ years']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-parabola
    where: 'example: length of y = x² from 0 to 1'
    inputs: {}
    formula: integrate('sqrt(1 + 4 * t**2)', 't', 0, 1)
    expected: '1.479'
    tolerance: 0.0005
    shown: ['dx \approx 1.479$']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: ex-line
    where: 'example: straight line from (0, 0) to (1, 1)'
    inputs: {}
    formula: sqrt(2)
    expected: '1.414'
    tolerance: 0.0005
    shown: ['$\sqrt 2 \approx 1.414$']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: ex-moving-clock
    where: 'example: √(1 − 0.6²) × 10 years'
    inputs: {}
    formula: sqrt(1 - 0.6**2)*10
    expected: '8'
    tolerance: 1e-9
    shown: ['= 0.8 \times 10 = 8$ years']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own
