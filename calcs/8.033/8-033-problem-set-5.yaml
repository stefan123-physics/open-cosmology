  # ---- Problem 4: transformation of acceleration

  # Independent route for dt/dt': it equals the ratio of the particle's Lorentz factors in S and in S'
  # (dt/dtau over dt'/dtau), with the speed in S from the velocity addition formula.
  - id: p4-dt
    kind: identity
    answer: p4-dt
    where: 'Problem 4(a), answer box: against the ratio of the particle''s Lorentz factors in the two frames'
    formula: (1 + v*ux/c**2)/sqrt(1 - v**2/c**2)
    equals: sqrt(1 - ux**2/c**2)/sqrt(1 - ((ux + v)/(1 + v*ux/c**2))**2/c**2)
    samples:
      v: [0.1, 0.3, 0.5, 0.7, 0.6]
      ux: [-0.7, -0.2, 0.1, 0.4, 0.7]
      c: [1, 1.2, 1.5, 1.1, 1.3]
    tolerance: 1e-9
    shown: ['id="p4-dt"']
    source: {cite: reading4, at: 'slide 15'}
    origin: page-own

  # Independent check of (4.1): let u'_x = w + ap*s in S' (constant a'), so the S' time is s; the S time is
  # T(s) = gamma (s + v x'(s)/c^2) and u_x(s) follows from velocity addition; a_x = (du_x/ds)/(dT/ds), both numerical.
  - id: p4-ax
    kind: identity
    where: 'Problem 4(a), formula (4.1): against numerical derivatives of the velocity addition formula and of the Lorentz-transformed time'
    formula: ap / ((1/sqrt(1 - v**2))**3 * (1 + v*w)**3)
    equals: deriv('(w + ap*s + v)/(1 + v*(w + ap*s))', 's', 0) / deriv('(s + v*(w*s + ap*s**2/2))/sqrt(1 - v**2)', 's', 0)
    samples:
      v: [0.1, 0.3, 0.5, 0.7, 0.6]
      w: [-0.7, -0.2, 0.1, 0.4, 0.7]
      ap: [0.5, 1.0, 0.3, 0.8, 0.2]
    tolerance: 1e-6
    shown: ['<Formula label="The x component of the acceleration"']
    source: {cite: mit, at: 'Problem 4, eq. (4.1), p. 1 (c = 1 in this check)'}
    origin: page-own

  # The same for the general a_y, with u'_y = wy + apy*s and u'_x = w + ap*s.
  - id: p4-ay
    kind: identity
    where: 'Problem 4(b), general formula for a_y: against numerical derivatives'
    formula: apy / ((1/(1 - v**2)) * (1 + v*w)**2) - v*wy*ap / ((1/(1 - v**2)) * (1 + v*w)**3)
    equals: deriv('(wy + apy*s)*sqrt(1 - v**2)/(1 + v*(w + ap*s))', 's', 0) / deriv('(s + v*(w*s + ap*s**2/2))/sqrt(1 - v**2)', 's', 0)
    samples:
      v: [0.1, 0.3, 0.5, 0.7, 0.6]
      w: [-0.6, -0.2, 0.1, 0.4, 0.5]
      wy: [0.3, 0.0, 0.5, 0.2, -0.4]
      ap: [0.5, 1.0, 0.0, 0.8, 0.2]
      apy: [0.2, 0.7, 0.4, 0.0, 0.9]
    tolerance: 1e-6
    shown: ['<Formula label="The y component of the acceleration, general case"']
    source: {cite: mit, at: 'Problem 4, eq. (4.2), p. 1 (c = 1 in this check)'}
    origin: page-own

  # ---- Problem 5: constant force

  # Independent route: solve gamma u = g t numerically for u.
  - id: p5-u
    kind: identity
    answer: p5-u
    where: 'Problem 5(a), answer box: against a numerical solve of u / sqrt(1 - u^2/c^2) = g t'
    formula: g*t/sqrt(1 + (g*t/c)**2)
    equals: solve('s/sqrt(1 - s**2/c**2) - g*t', 's', 0, 0.9999999*c)
    samples:
      g: [4, 5, 6, 4.5, 5.5]
      t: [1, 1.5, 2, 1.2, 1.8]
      c: [20, 25, 30, 22, 28]
    tolerance: 1e-7
    shown: ['id="p5-u"']
    source: {cite: mit, at: 'Problem 5, hint, p. 1'}
    origin: page-own

  # Independent route: integrate the velocity numerically.
  - id: p5-x
    kind: identity
