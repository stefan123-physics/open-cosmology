# Calculations on content/year-2/8.033/8-033-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# the invariant mass of the two neutrons, momentum and energy conservation in Sam's frame, the spacing of the neutrons
# counted in two frames, the ratio of Lorentz factors for dt/dt', numerical derivatives of the velocity addition
# formulas, a numerical solve and a numerical integral for the constant force, a numerical integral of the rocket
# equations, and the stationary point of the travel time for Snell's law.

page: content/year-2/8.033/8-033-problem-set-5.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the six counted problems, against MIT''s 60'
    formula: 15 + 3 + 3 + 9 + 6 + 21
    expected: '57'
    shown: ['so the six problems here count for 57 points and not for MIT''s 60']
    source: {cite: mit, at: 'p. 1 and p. 2 (points per problem; 3 more for name and stapling)'}
    origin: mit

  # ---- Problem 1: the neutron shoot-out

  - id: p1-given
    kind: fact
    where: 'Problem 1, statement: the gun speed and Jim''s five reports'
    shown: ['every neutron leaves its gun at the speed $0.60c$ relative to the gun', 'Jim: "My separation from Sue is 10 km."', 'scattered through an angle of $30^\circ$."', 'Jim: "I am firing neutrons at the rate of 10,000 per second."']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-gamma
    where: 'Problem 1(a), formula: the Lorentz factor for 0.60c'
    inputs: {b: 0.60}
    formula: 1 / sqrt(1 - b**2)
    expected: '1.25'
    shown: ['<Formula label="Lorentz factor between Jim and Sam"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-sep
    answer: p1-sep
    where: 'Problem 1(a), answer box: the contracted separation'
    inputs: {Lp: 10 km, b: 0.60}
    formula: Lp * sqrt(1 - b**2)
    expected: 8.0 km
    shown: ['id="p1-sep"', '= 8.0\ \text{km}"']
    source: {cite: reading4, at: 'slide 13'}
    origin: page-own

  - id: p1-speed
    answer: p1-speed
    where: 'Problem 1(b), answer box: 0.60c added to 0.60c'
    inputs: {b: 0.60}
    formula: (b + b) / (1 + b * b)
    expected: '0.882'
    shown: ['id="p1-speed"', '= \frac{15}{17}\,c = 0.882c"']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  # Independent route: the speed that the rapidities give, tanh(2 artanh 0.6).
  - id: p1-speed-rapidity
    where: 'Problem 1(b), check: the same speed from adding rapidities, tanh(2 artanh 0.60)'
    inputs: {b: 0.60}
    formula: tanh(2 * 0.5 * log((1 + b) / (1 - b)))
    expected: '0.882'
    shown: ['Sam reports: "Jim''s neutrons move at $0.882c$.']
    source: {cite: reading4, at: 'slide 16 (our own check)'}
    origin: page-own

  - id: p1-gamma-u
    where: 'Problem 1(b), check: the Lorentz factor of Jim''s neutron in S'
    formula: 1 / sqrt(1 - (15/17)**2)
    expected: '2.125'
    shown: ['$1/\sqrt{1 - (15/17)^2} = 17/8 = 2.125$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-ke-sam
    answer: p1-ke
    where: 'Problem 1(c), answer box: kinetic energy of the moving neutron in S, in units of m0 c^2'
    formula: 1 / sqrt(1 - (15/17)**2) - 1
    expected: '1.125'
    shown: ['id="p1-ke"', 'K = (\gamma_u - 1)\,m_0c^2 = 1.125\,m_0c^2']
    source: {cite: reading1, at: 'slide 4'}
    origin: page-own

  - id: p1-p-sam
    where: 'Problem 1(c), formula: momentum of the moving neutron in S, in units of m0 c'
    formula: (15/17) / sqrt(1 - (15/17)**2)
    expected: '1.875'
    shown: ['2.125 \times \tfrac{15}{17}\,m_0c = 1.875\,m_0c']
    source: {cite: reading1, at: 'slide 3'}
    origin: page-own

  - id: p1-ke-jim
    where: 'Problem 1(c): total kinetic energy in Jim''s frame, in units of m0 c^2'
    inputs: {b: 0.60}
    formula: 2 * (1 / sqrt(1 - b**2) - 1)
    expected: '0.50'
    shown: ['together $0.50\,m_0c^2$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  # Independent check of (b) and (c): the invariant mass of the pair is the same in both frames.
  - id: p1-invariant
    where: 'Problem 1(c), check: the invariant mass of the two neutrons from Sam''s energy and momentum equals Jim''s 2.5'
    formula: sqrt(3.125**2 - 1.875**2)
    expected: '2.5'
    tolerance: 1e-9
    shown: ['$\sqrt{3.125^2 - 1.875^2} = 2.5$']
    source: {cite: reading1, at: 'slide 6'}
    origin: page-own

  - id: p1-energy-sam
    where: 'Problem 1(c), check: total energy in S in units of m0 c^2'
    formula: 1 / sqrt(1 - (15/17)**2) + 1
    expected: '3.125'
    shown: ['$E = (2.125 + 1)\,m_0c^2 = 3.125\,m_0c^2$']
    source: {cite: reading1, at: 'slide 6'}
    origin: page-own

  - id: p1-components-jim
    where: 'Problem 1(d): components of the scattered velocity in Jim''s frame, 0.60 cos 30° (0.520) and the denominators 1.312 and 0.688'
    inputs: {b: 0.60}
    formula: 1 + b * b * cos(30 * pi / 180)
    expected: '1.312'
    shown: ['With $v = 0.60c$ and $1 + u''_xv/c^2 = 1.312$']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-cos
    where: 'Problem 1(d): 0.60 cos 30°'
    formula: 0.60 * cos(30 * pi / 180)
    expected: '0.520'
    shown: ['= (0.520c,\ 0.300c)$. With']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-denominator-sue
    where: 'Problem 1(d): the denominator for Sue''s neutron'
    inputs: {b: 0.60}
    formula: 1 - b * b * cos(30 * pi / 180)
    expected: '0.688'
    shown: ['Now $1 + u''_xv/c^2 = 0.688$']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-jim-ux
    where: 'Problem 1(d): x velocity of Jim''s neutron in S after the collision, over c'
    inputs: {b: 0.60}
    formula: (b * cos(30 * pi / 180) + b) / (1 + b * b * cos(30 * pi / 180))
    expected: '0.854'
    shown: ['u_x = \frac{0.520c + 0.60c}{1.312} = 0.854c']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-jim-uy
    where: 'Problem 1(d): y velocity of Jim''s neutron in S after the collision, over c'
    inputs: {b: 0.60}
    formula: b * sin(30 * pi / 180) * sqrt(1 - b**2) / (1 + b * b * cos(30 * pi / 180))
    expected: '0.183'
    shown: ['u_y = \frac{0.300c}{1.25 \times 1.312} = 0.183c']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-jim-tan
    where: 'Problem 1(d): tangent of the angle of Jim''s neutron in S'
    inputs: {b: 0.60}
    formula: sin(30 * pi / 180) * sqrt(1 - b**2) / (cos(30 * pi / 180) + 1)
    expected: '0.214'
    shown: ['\tan\theta = \frac{u_y}{u_x} = 0.214"']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-angle-jim
    answer: p1-angle-jim
    where: 'Problem 1(d), answer box: the angle of Jim''s neutron in S, from the transformed velocity components'
    inputs: {b: 0.60}
    formula: atan((b * sin(30 * pi / 180) * sqrt(1 - b**2)) / (b * cos(30 * pi / 180) + b)) * 180 / pi
    expected: '12.1'
    shown: ['id="p1-angle-jim"', 'so $\theta = 12.1^\circ$']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  # Independent route: the half-angle form.
  - id: p1-angle-jim-half
    where: 'Problem 1(d), shorter form: tan 15° / 1.25'
    formula: tan(15 * pi / 180) / 1.25
    expected: '0.214'
    shown: ['$\tan 15^\circ/1.25 = 0.214$']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-sue-ux
    where: 'Problem 1(d): x velocity of Sue''s neutron in S after the collision, over c'
    inputs: {b: 0.60}
    formula: (-b * cos(30 * pi / 180) + b) / (1 - b * b * cos(30 * pi / 180))
    expected: '0.117'
    shown: ['u_x = \frac{-0.520c + 0.60c}{0.688} = 0.117c']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-sue-uy
    where: 'Problem 1(d): y velocity of Sue''s neutron in S after the collision, over c'
    inputs: {b: 0.60}
    formula: -b * sin(30 * pi / 180) * sqrt(1 - b**2) / (1 - b * b * cos(30 * pi / 180))
    expected: '-0.349'
    shown: ['u_y = \frac{-0.300c}{1.25 \times 0.688} = -0.349c']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-sue-tan
    where: 'Problem 1(d): tangent of the angle of Sue''s neutron in S'
    inputs: {b: 0.60}
    formula: sin(30 * pi / 180) * sqrt(1 - b**2) / (1 - cos(30 * pi / 180))
    expected: '2.99'
    shown: ['\tan\theta = \frac{|u_y|}{u_x} = 2.99"']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-angle-sue
    answer: p1-angle-sue
    where: 'Problem 1(d), answer box: the angle of Sue''s neutron in S, from the transformed velocity components'
    inputs: {b: 0.60}
    formula: atan((b * sin(30 * pi / 180) * sqrt(1 - b**2)) / (b - b * cos(30 * pi / 180))) * 180 / pi
    expected: '71.5'
    shown: ['id="p1-angle-sue"', 'so its path makes $71.5^\circ$ with the $x$ axis']
    source: {cite: reading4, at: 'slide 16'}
    origin: page-own

  - id: p1-angle-sue-half
    where: 'Problem 1(d), shorter form: 1 / (1.25 tan 15°)'
    formula: 1 / (1.25 * tan(15 * pi / 180))
    expected: '2.99'
    shown: ['$1/(1.25\tan 15^\circ) = 2.99$']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-speed-jim-after
    where: 'Problem 1(d), check: speed of Jim''s neutron in S after the collision, over c'
    inputs: {ux: 0.853515, uy: 0.182959}
    formula: sqrt(ux**2 + uy**2)
    expected: '0.873'
    shown: ['The speeds in S are $0.873c$ and $0.368c$']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  - id: p1-speed-sue-after
    where: 'Problem 1(d), check: speed of Sue''s neutron in S after the collision, over c'
    inputs: {ux: 0.116799, uy: 0.348720}
    formula: sqrt(ux**2 + uy**2)
    expected: '0.368'
    shown: ['with Lorentz factors 2.050 and 1.075']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  - id: p1-gamma-jim-after
    where: 'Problem 1(d), check: Lorentz factor of Jim''s neutron in S after the collision'
    inputs: {ux: 0.853515, uy: 0.182959}
    formula: 1 / sqrt(1 - ux**2 - uy**2)
    expected: '2.050'
    shown: ['$2.050 \times 0.183 - 1.075 \times 0.349 = 0$ to the rounding']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  - id: p1-gamma-sue-after
    where: 'Problem 1(d), check: Lorentz factor of Sue''s neutron in S after the collision'
    inputs: {ux: 0.116799, uy: 0.348720}
    formula: 1 / sqrt(1 - ux**2 - uy**2)
    expected: '1.075'
    shown: ['$(2.050 + 1.075)\,m_0c^2 = 3.125\,m_0c^2$, the total of part (c)']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  # Independent check of both angles: with the exact transformed velocities, the y momentum in S is zero and the
  # x momentum and the energy equal their values before the collision (1.875 and 3.125).
  - id: p1-momentum-y
    kind: identity
    where: 'Problem 1(d), check: momentum across the motion stays zero in S, and momentum along it and energy are conserved, for any scattering angle'
    formula: (b*sin(th)*sqrt(1 - b**2)/(1 + b*b*cos(th)))/sqrt(1 - ((b*cos(th) + b)/(1 + b*b*cos(th)))**2 - (b*sin(th)*sqrt(1 - b**2)/(1 + b*b*cos(th)))**2)
    equals: (b*sin(th)*sqrt(1 - b**2)/(1 - b*b*cos(th)))/sqrt(1 - ((b - b*cos(th))/(1 - b*b*cos(th)))**2 - (b*sin(th)*sqrt(1 - b**2)/(1 - b*b*cos(th)))**2)
    samples:
      b: [0.6, 0.6, 0.6, 0.3, 0.9]
      th: [0.5235988, 1.0, 2.0, 0.7, 0.4]
    tolerance: 1e-9
    shown: ['Sam''s momentum across the motion must stay zero.']
    source: {cite: reading1, at: 'slide 6'}
    origin: page-own

  - id: p1-energy-after
    kind: identity
    where: 'Problem 1(d), check: the two energies in S after the collision add to the total before it, for any scattering angle'
    formula: 1/sqrt(1 - ((b*cos(th) + b)/(1 + b*b*cos(th)))**2 - (b*sin(th)*sqrt(1 - b**2)/(1 + b*b*cos(th)))**2) + 1/sqrt(1 - ((b - b*cos(th))/(1 - b*b*cos(th)))**2 - (b*sin(th)*sqrt(1 - b**2)/(1 - b*b*cos(th)))**2)
    equals: 1/sqrt(1 - (2*b/(1 + b*b))**2) + 1
    samples:
      b: [0.6, 0.6, 0.6, 0.3, 0.9]
      th: [0.5235988, 1.0, 2.0, 0.7, 0.4]
    tolerance: 1e-9
    shown: ['The two energies add to']
    source: {cite: reading1, at: 'slide 6'}
    origin: page-own

  - id: p1-angle-sum
    where: 'Problem 1(d), check: the angle between the two paths in S'
    inputs: {g: 1.25}
    formula: (atan(tan(15 * pi / 180) / g) + atan(1 / (g * tan(15 * pi / 180)))) * 180 / pi
    expected: '83.6'
    shown: ['$12.1^\circ + 71.5^\circ = 83.6^\circ$']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  - id: p1-newton-angles
    where: 'Problem 1(d), check: for slow neutrons the angles are 15° and 75°'
    formula: atan(1 / tan(15 * pi / 180)) * 180 / pi
    expected: '75'
    tolerance: 1e-9
    shown: ['the two angles would be $15^\circ$ and $75^\circ$']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  - id: p1-rate
    answer: p1-rate
    where: 'Problem 1(e), answer box: the firing rate slowed by time dilation'
    inputs: {rate: 10000 1/s, b: 0.60}
    formula: rate * sqrt(1 - b**2)
    expected: 8000 1/s
    tolerance: 1 1/s
    shown: ['id="p1-rate"', '= 8000\ \text{s}^{-1}"']
    source: {cite: reading4, at: 'slide 4'}
    origin: page-own

  - id: p1-dt
    where: 'Problem 1(e): the time between two firings in S'
    inputs: {dtp: 1e-4 s}
    formula: 1.25 * dtp
    expected: 1.25e-4 s
    shown: ['\Delta t = \gamma\,\Delta t'' = 1.25\times 10^{-4}\ \text{s}']
    source: {cite: reading4, at: 'slide 4'}
    origin: page-own

  - id: p1-spacing-jim
    where: 'Problem 1(e), check: spacing of the neutrons in Jim''s frame'
    inputs: {dtp: 1e-4 s, cc: 2.998e8 m/s}
    formula: 0.60 * cc * dtp
    expected: 17.99 km
    shown: ['$0.60c \times 10^{-4}\ \text{s} = 17.99$ km apart']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

  - id: p1-spacing-rest
    where: 'Problem 1(e), check: spacing in the rest frame of the row of neutrons'
    inputs: {dtp: 1e-4 s, cc: 2.998e8 m/s}
    formula: 1.25 * 0.60 * cc * dtp
    expected: 22.49 km
    shown: ['$1.25 \times 17.99 = 22.49$ km']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

  # Two independent counts of the spacing in S: contraction of the rest spacing, and Sam's own bookkeeping.
  - id: p1-spacing-sam
    where: 'Problem 1(e), check: spacing in S from the contracted rest spacing'
    inputs: {dtp: 1e-4 s, cc: 2.998e8 m/s}
    formula: 1.25 * 0.60 * cc * dtp / 2.125
    expected: 10.58 km
    shown: ['it is $22.49/2.125 = 10.58$ km']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

  - id: p1-spacing-sam-direct
    where: 'Problem 1(e), check: spacing in S from the speed difference and the dilated firing interval'
    inputs: {dt: 1.25e-4 s, cc: 2.998e8 m/s}
    formula: (15/17 - 0.60) * cc * dt
    expected: 10.58 km
    shown: ['$(0.882 - 0.60)\,c \times 1.25\times 10^{-4}\ \text{s} = 10.58$ km']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

  # ---- Problem 2: a ton of sunlight

  - id: p2-given
    kind: fact
    where: 'Problem 2, statement: MIT''s power of the Sun and the two lengths we add'
    shown: ['The Sun radiates energy at the rate of $4.0\times 10^{26}$ W.', 'Take Earth''s distance from the Sun to be $1.5\times 10^{11}$ m', 'Earth''s radius $6.4\times 10^{6}$ m (our own value']
    source: {cite: mit, at: 'Problem 2, p. 1 (the power; the radius and distance are our rounded values, as in Problem Set 1)'}
    origin: mit

  - id: p2-fraction
    where: 'Problem 2: the fraction of the sunlight that hits the Earth'
    inputs: {RE: 6.4e6 m, dist: 1.5e11 m}
    formula: RE**2 / (4 * dist**2)
    expected: '4.55e-10'
    shown: ['<Formula label="Fraction of sunlight that hits the Earth"']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-power
    where: 'Problem 2: the power that falls on the Earth'
    inputs: {RE: 6.4e6 m, dist: 1.5e11 m, Lsun: 4.0e26 W}
    formula: Lsun * RE**2 / (4 * dist**2)
    expected: 1.82e17 W
    shown: ['$4.55\times 10^{-10} \times 4.0\times 10^{26}\ \text{W} = 1.82\times 10^{17}$ W']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-energy
    where: 'Problem 2: the energy caught in one day'
    inputs: {RE: 6.4e6 m, dist: 1.5e11 m, Lsun: 4.0e26 W, day: 86400 s}
    formula: Lsun * RE**2 / (4 * dist**2) * day
    expected: 1.57e22 J
    shown: ['In one day (86,400 s) this is $1.57\times 10^{22}$ J.']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-tonnes
    answer: p2-tonnes
    where: 'Problem 2, answer box: the mass of a day of sunlight on Earth, in tonnes'
    inputs: {RE: 6.4e6 m, dist: 1.5e11 m, Lsun: 4.0e26 W, day: 86400 s, tonne: 1000 kg}
    formula: Lsun * RE**2 / (4 * dist**2) * day / c**2 / tonne
    expected: '175'
    shown: ['id="p2-tonnes"', '= 1.75\times 10^{5}\ \text{kg} = 175\ \text{tonnes}"']
    source: {cite: reading2, at: 'slide 16'}
    origin: page-own

  - id: p2-sun-per-second
    where: 'Problem 2, check: the Sun''s mass loss per second'
    inputs: {Lsun: 4.0e26 W}
    formula: Lsun / c**2
    expected: 4.45e9 kg/s
    shown: ['The Sun as a whole loses $L/c^2 = 4.45\times 10^{9}$ kg each second']
    source: {cite: reading2, at: 'slide 16 (our own check)'}
    origin: page-own

  - id: p2-sun-per-day
    where: 'Problem 2, check: the Sun''s mass loss per day'
    inputs: {Lsun: 4.0e26 W, day: 86400 s}
    formula: Lsun / c**2 * day
    expected: 3.85e14 kg
    shown: ['which is $3.85\times 10^{14}$ kg per day']
    source: {cite: reading2, at: 'slide 16 (our own check)'}
    origin: page-own

  # Second route to the answer: Earth's share of the Sun's daily mass loss.
  - id: p2-second-route
    where: 'Problem 2, check: the share 4.55e-10 of the Sun''s daily loss'
    inputs: {loss: 3.845e14 kg}
    formula: 4.551e-10 * loss
    expected: 1.75e5 kg
    shown: ['of that is again $1.75\times 10^{5}$ kg']
    source: {cite: mit, at: 'Problem 2 (our own check)'}
    origin: page-own

  - id: p2-per-second
    where: 'Problem 2, check: about 2 kg every second'
    inputs: {mass: 1.75e5 kg, day: 86400 s}
    formula: mass / day
    expected: 2 kg/s
    tolerance: 0.1 kg/s
    shown: ['it is 175 tonnes a day, about 2 kg every second']
    source: {cite: mit, at: 'Problem 2 (our own check)'}
    origin: page-own

  # ---- Problem 3: the quasar

  - id: p3-given
    kind: fact
    where: 'Problem 3, statement: MIT''s power of the quasar and solar mass; the length of the year is ours'
    shown: ['A typical quasar radiates energy at the rate of $10^{41}$ W.', 'with one solar mass equal to $2\times 10^{30}$ kg and one year equal to $3.156\times 10^{7}$ s.']
    source: {cite: mit, at: 'Problem 3, p. 1'}
    origin: mit

  - id: p3-per-second
    where: 'Problem 3: the mass loss per second'
    inputs: {Pq: 1e41 W}
    formula: Pq / c**2
    expected: 1.11e24 kg/s
    shown: ['<Formula label="Mass loss of the quasar per second"']
    source: {cite: reading2, at: 'slide 16'}
    origin: page-own

  - id: p3-per-year
    where: 'Problem 3: the mass loss per year'
    inputs: {Pq: 1e41 W, year: 3.156e7 s}
    formula: Pq / c**2 * year
    expected: 3.51e31 kg
    shown: ['$1.11\times 10^{24} \times 3.156\times 10^{7} = 3.51\times 10^{31}$ kg']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-rate
    answer: p3-rate
    where: 'Problem 3, answer box: solar masses per year'
    inputs: {Pq: 1e41 W, year: 3.156e7 s, smu: 2e30 kg}
