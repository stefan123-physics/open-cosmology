  # The check of part (a): du/dt = g / gamma^3, by a numerical derivative.
  - id: p5-acceleration
    kind: identity
    where: 'Problem 5(a), check: du/dt = g / gamma_u^3, the lesson''s force law along the motion'
    formula: deriv('g*s/sqrt(1 + (g*s/c)**2)', 's', t)
    equals: g / (1 + (g*t/c)**2)**1.5
    samples:
      g: [4, 5, 6, 4.5, 5.5]
      t: [1, 1.5, 2, 1.2, 1.8]
      c: [4, 4.5, 5, 4.2, 4.8]
