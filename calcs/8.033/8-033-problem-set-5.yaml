  # ---- Problem 9 (optional): Snell's law

  - id: p9-given
    kind: fact
    where: 'Optional Problem 9, statement: MIT''s range for the index of refraction, and our own example'
    shown: ['typically between 1.4 and 1.6', 'for $n = 1.5$ and $\theta_i = 45^\circ$, what is $\theta_t$ in degrees?']
    source: {cite: mit, at: 'Optional Problem 9, p. 3'}
    origin: mit

  - id: p9-sine
    where: 'Optional Problem 9: the sine of the refraction angle'
    formula: sin(45 * pi / 180) / 1.5
    expected: '0.4714'
    shown: ['<Formula label="Refraction angle of the example"']
    source: {cite: mit, at: 'Optional Problem 9, p. 3 (our own numbers)'}
    origin: page-own

  - id: p9-angle
    answer: p9-angle
    where: 'Optional Problem 9, answer box: the refraction angle from Snell''s law'
    formula: asin(sin(45 * pi / 180) / 1.5) * 180 / pi
    expected: '28.1'
    shown: ['id="p9-angle"', '\theta_t = 28.1^\circ"']
    source: {cite: mit, at: 'Optional Problem 9, p. 3 (our own numbers)'}
    origin: page-own

  - id: p9-x0
    where: 'Optional Problem 9, check: the end point for y0 = 1'
    formula: 1 + tan(asin(sin(45 * pi / 180) / 1.5))
    expected: '1.535'
    shown: ['ends at $x_0 = 1.535$']
    source: {cite: mit, at: 'Optional Problem 9 (our own numbers)'}
    origin: page-own

  # Independent route, without Snell's law: the crossing point that makes the travel time stationary, found by
  # solving dT/dx = 0 numerically for the end point x0 = 1.53452 and y0 = 1. It must be x = 1 (tan 45°).
  - id: p9-fermat
    where: 'Optional Problem 9, check: the crossing point of least time, from dT/dx = 0 solved numerically'
    formula: solve('s/sqrt(s**2 + 1) - 1.5*(1.53452 - s)/sqrt((1.53452 - s)**2 + 1)', 's', 0, 1.53452)
    expected: '1.000'
    shown: ['the ray crosses the surface at $x = 1$']
    source: {cite: mit, at: 'Optional Problem 9, p. 3 (our own check)'}
    origin: page-own

  - id: p9-fermat-angle
    where: 'Optional Problem 9, check: the refraction angle that belongs to that crossing point, atan((x0 - x)/y0)'
    formula: atan(1.53452 - solve('s/sqrt(s**2 + 1) - 1.5*(1.53452 - s)/sqrt((1.53452 - s)**2 + 1)', 's', 0, 1.53452)) * 180 / pi
    expected: '28.1'
    shown: ['continues at 28.1° from the vertical to the point (1.535, −1)']
    source: {cite: mit, at: 'Optional Problem 9, p. 3 (our own check)'}
    origin: page-own

  - id: p9-slope
    where: 'Optional Problem 9, picture: the tangent of the refraction angle used in the plotted path'
    formula: tan(asin(sin(45 * pi / 180) / 1.5))
    expected: '0.53452'
    shown: ['{ expr: "x <= 1 ? 1 - x : -(x - 1)/0.53452" }']
    source: {cite: mit, at: 'Optional Problem 9 (our own numbers)'}
    origin: page-own

  - id: p9-time
    where: 'Optional Problem 9, check: the travel time of the bent path in units of y0/c'
