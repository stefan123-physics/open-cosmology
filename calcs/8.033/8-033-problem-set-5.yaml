  # Independent check of (6.10): integrate du/(1 - u^2/c^2) numerically up to the formula's speed and compare with
  # V ln(Mi/Mf). Here c = 1, V is the exhaust speed over c and q the mass ratio.
  - id: p6-relativistic
    kind: identity
    where: 'Problem 6(d), eq. (6.10): the numerical integral of du / (1 - u^2) up to the formula''s speed equals V ln(Mi/Mf)'
    formula: integrate('1/(1 - s**2)', 's', 0, (q**(2*V) - 1)/(q**(2*V) + 1))
    equals: V * log(q)
    samples:
      V: [0.01, 0.1, 0.3, 0.5, 0.05]
      q: [5, 3, 5, 2, 20]
    tolerance: 1e-7
    shown: ['<Formula label="Integrating the relativistic rocket equation"']
