  # ---- Problem 10 (optional): Lagrange's equations

  - id: p10-history
    kind: fact
    where: 'Optional Problem 10, statement: the years of Hamilton''s two papers'
    shown: ['Hamilton''s principle (1834 to 1835)']
    source: {cite: mit, at: 'Optional Problem 10, p. 3'}
    origin: mit

  # Independent route: -dV/dz / M with the derivative of the potential taken numerically.
  - id: p10-spring
    kind: identity
    answer: p10-spring
    where: 'Optional Problem 10(a), answer box: against minus the numerical derivative of the potential energy, over M'
    formula: -k*z/M - g
    equals: -deriv('0.5*k*s**2 + M*g*s', 's', z) / M
    samples:
      k: [1, 2.5, 5, 3, 4]
      z: [0.2, 0.5, 1, 0.8, 0.3]
      M: [1.5, 2, 3, 1.8, 2.5]
      g: [9, 9.8, 10, 9.5, 9.2]
    tolerance: 1e-7
    shown: ['id="p10-spring"']
    source: {cite: mit, at: 'Optional Problem 10(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p10-spring-rest
    kind: identity
    where: 'Optional Problem 10(a), check: the acceleration vanishes at z = -M g / k'
    formula: -k*(-M*g/k)/M - g + 1
    equals: '1'
    samples:
      k: [1, 2.5, 5]
      M: [1, 2, 3]
      g: [9, 9.8, 10]
    tolerance: 1e-9
    shown: ['The mass can rest ($\ddot z = 0$) at $z = -Mg/k$']
    source: {cite: mit, at: 'Optional Problem 10(a) (our own check)'}
    origin: page-own

  # Independent route: -dV/dphi / (M l^2) with the derivative of the potential taken numerically.
  - id: p10-pendulum
    kind: identity
    answer: p10-pendulum
    where: 'Optional Problem 10(b), answer box: against minus the numerical derivative of M g l (1 - cos phi), over M l^2'
    formula: -(g/l)*sin(phi)
    equals: -deriv('M*g*l*(1 - cos(s))', 's', phi) / (M*l**2)
    samples:
      g: [9, 9.8, 10, 9.5, 9.2]
      l: [1.5, 2, 3, 2.5, 1.8]
      phi: [0.5, 0.8, 1.4, 1.1, 0.6]
      M: [1, 2, 3, 1.5, 2.5]
    tolerance: 1e-7
    shown: ['id="p10-pendulum"']
    source: {cite: mit, at: 'Optional Problem 10(b), p. 3 (our own solution)'}
    origin: page-own

  # The small-angle solution obeys its equation: second derivative of phi0 cos(sqrt(g/l) t) is -(g/l) phi.
  - id: p10-small-angle
    kind: identity
    where: 'Optional Problem 10(b): the small-angle solution satisfies the linearised equation'
    formula: deriv('phi0*cos(sqrt(g/l)*s)', 's', t, 2)
    equals: -(g/l)*phi0*cos(sqrt(g/l)*t)
    samples:
      g: [9, 9.8, 10]
      l: [0.5, 1, 2]
      phi0: [0.1, 0.2, 0.05]
      t: [0.3, 1.1, 0.7]
    tolerance: 1e-5
    shown: ['<Formula label="Small swings of the pendulum"']
    source: {cite: mit, at: 'Optional Problem 10(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p10-period
    where: 'Optional Problem 10(b), check: the period of a 1 m pendulum'
    inputs: {len: 1 m, gg: 9.8 m/s**2}
    formula: 2 * pi * sqrt(len / gg)
    expected: 2.01 s
    shown: ['$2\pi\sqrt{1/9.8} = 2.01$ s']
    source: {cite: mit, at: 'Optional Problem 10(b) (our own check)'}
    origin: page-own
