  - id: p8-energy-integral
    where: 'Optional Problem 8, check: the released energy as the integral of G M^2 / R^2 dR from 3.5e8 m to 7e8 m, in units of 1e41 J'
    formula: 6.674e-11 * 4e60 * integrate('1/s**2', 's', 3.5e8, 7e8) / 1e41
    expected: '3.81'
