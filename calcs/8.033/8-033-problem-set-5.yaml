    where: 'Problem 5(b), answer box: against the numerical integral of u(t)'
    formula: (c**2/g)*(sqrt(1 + (g*t/c)**2) - 1)
    equals: integrate('g*s/sqrt(1 + (g*s/c)**2)', 's', 0, t)
    samples:
      g: [4, 5, 6, 4.5, 5.5]
      t: [1, 1.5, 2, 1.2, 1.8]
      c: [4, 4.5, 5, 4.2, 4.8]
    tolerance: 1e-7
