# Calculations on content/year-2/8.033/particle-processes-unsolved-problems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 14 slides (deck "Lecture 13"), with the page's own example.

page: content/year-2/8.033/particle-processes-unsolved-problems.mdx
calcs:
  - id: rest-energies
    kind: fact
    where: 'rest energies, as on the slide'
    value: '0.511, 105.6, 1777, 938.26, 939.55, 139.6, 135.0 MeV; 931.5 MeV per amu'
    shown: ['electron 0.511 MeV, muon 105.6 MeV, tau 1777 MeV']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: proton-electron
    where: 'proton/electron mass ratio from the slide''s rest energies'
    inputs: {}
    formula: 938.26/0.511
    expected: '1836'
    tolerance: 2
    shown: ['Why is the proton 1836 times heavier than the electron?']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: emission-recoil
    kind: identity
    where: 'two-body decay at rest: photon energy (M² − m²)c⁴/(2Mc²) = (1 − Q/2Mc²)Q, with m = M − Q (units c = 1)'
    formula: (M**2 - (M - Q)**2)/(2*M)
    equals: (1 - Q/(2*M))*Q
    samples: {M: [1.0, 5.0, 50.0], Q: [0.01, 0.2, 0.5]}
    tolerance: 1e-9
    shown: ['tex="\hbar\omega = \left(1 - \frac{Q_0}{2m_0c^2}\right)Q_0"']
    source: {cite: mit, at: 'slide 23'}
    origin: mit

  - id: absorption-recoil
    kind: identity
    where: 'absorption: β′ = p/E of the final state = ħω/(m₀c² + ħω) (units c = 1)'
    formula: w/(m + w)
    equals: w/(m + w)
    samples: {m: [1.0, 2.0], w: [0.1, 0.5]}
    tolerance: 1e-12
    shown: ['tex="\beta'' = \frac{\hbar\omega}{m_0c^2 + \hbar\omega}"']
    source: {cite: mit, at: 'slide 23'}
    origin: mit

  - id: atomic-recoil
    where: 'atomic recoil term Q/(2mc²) for 10 eV and a hydrogen atom'
    inputs: {}
    formula: log10(10/(2*938.8e6))
    expected: '-8'
    tolerance: 0.8
    shown: ['the recoil term is only about $10^{-8}$']
    source: {cite: mit, at: 'slide 24'}
    origin: mit

  - id: doppler-broadening
    where: 'β for atoms at 300 m/s'
    inputs: {}
    formula: log10(300/2.998e8)
    expected: '-6'
    tolerance: 0.1
    shown: ['$\beta \sim 10^{-6}$']
    source: {cite: mit, at: 'slide 24'}
    origin: mit

  - id: tower-shift
    where: 'Pound–Rebka: 2gh/c² over 22.6 m'
    inputs: {}
    formula: 2*9.81*22.6/(2.998e8)**2
    expected: '5e-15'
    tolerance: 0.1e-15
    shown: ['the shift is only about $5 \times 10^{-15}$']
    source: {cite: mit, at: 'slide 25'}
    origin: mit

  - id: quiz-tower
    where: 'quiz: gh/c² each way'
    inputs: {}
    formula: 9.81*22.6/(2.998e8)**2
    expected: '2.5e-15'
    tolerance: 0.05e-15
    shown: ['$gh/c^2 \\approx 2.5 \\times 10^{-15}$ each way']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: quiz-compton
    where: 'quiz: 100/(1 + 100/511) keV'
    inputs: {}
    formula: 100/(1 + 100/511*(1 - cos(pi/2)))
    expected: '83.6'
    tolerance: 0.05
    shown: ['100/(1 + 100/511) \\approx 83.6$ keV']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own

  - id: ex-compton
    where: 'example: same, and the electron''s share'
    inputs: {}
    formula: 100 - 100/(1 + 100/511)
    expected: '16.4'
    tolerance: 0.05
    shown: ['the electron takes the other 16.4 keV']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own

  - id: ex-fe57-rest
    where: 'example: 57 × 931.5 MeV in eV'
    inputs: {}
    formula: 57*931.5e6
    expected: '5.31e10'
    tolerance: 0.005e10
    shown: ['(2 \times 5.31 \times 10^{10})']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: ex-recoil
    where: 'example: 14.4e3/(2 × 5.31e10)'
    inputs: {}
    formula: 14.4e3/(2*57*931.5e6)
    expected: '1.4e-7'
    tolerance: 0.05e-7
    shown: ['\approx 1.4 \times 10^{-7}$']
    source: {cite: mit, at: 'slide 24'}
    origin: page-own

  - id: ex-recoil-speed
    where: 'example: equivalent source speed, m/s'
    inputs: {}
    formula: 14.4e3/(2*57*931.5e6)*2.998e8
    expected: '41'
    tolerance: 0.5
    shown: ['moving at about 41 m/s']
    source: {cite: mit, at: 'slide 24'}
    origin: page-own

  - id: ex-tower
    where: 'example: 9.81 × 22.6/(3.00e8)²'
    inputs: {}
    formula: 9.81*22.6/(3.00e8)**2
    expected: '2.5e-15'
    tolerance: 0.05e-15
    shown: ['(3.00 \times 10^8)^2 \approx 2.5 \times 10^{-15}$']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: ex-ratio
    where: 'example: recoil shift / tower shift, in millions'
    inputs: {}
    formula: 14.4e3/(2*57*931.5e6)/(9.81*22.6/(3.00e8)**2)/1e6
    expected: '50'
    tolerance: 6
    shown: ['is fifty million times smaller']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own

  - id: alpha
    where: 'fine-structure constant from SI values'
    inputs: {}
    formula: 1/((1.602176634e-19)**2/(4*pi*8.8541878128e-12*1.054571817e-34*2.99792458e8))
    expected: '137.036'
    tolerance: 0.001
    shown: ['\approx \frac{1}{137.03599976}']
    source: {cite: mit, at: 'slide 37'}
    origin: mit

  - id: beta-ratio
    where: 'proton/electron mass ratio'
    inputs: {}
    formula: 1.67262192e-27/9.1093837e-31
    expected: '1836.15'
    tolerance: 0.01
    shown: ['\approx \frac{1}{1836.15}']
    source: {cite: mit, at: 'slide 37'}
    origin: mit

  - id: mp-planck
    where: 'proton mass in Planck units'
    inputs: {}
    formula: 1.67262192e-27/sqrt(1.054571817e-34*2.99792458e8/6.6743e-11)
    expected: '7.68e-20'
    tolerance: 0.01e-20
    shown: ['m_{\text{pl}}} \approx 7.68417 \times 10^{-20}']
    source: {cite: mit, at: 'slide 37'}
    origin: mit

  - id: ex-star
    where: 'example: m_pl³/m_p²'
    inputs: {}
    formula: (2.176e-8)**3/(1.6726e-27)**2
    expected: '3.7e30'
    tolerance: 0.05e30
    shown: ['\approx 3.7 \times 10^{30}$ kg']
    source: {cite: mit, at: 'slide 42'}
    origin: page-own

  - id: ex-star-sun
    where: 'example: 3.7e30 / 1.989e30'
    inputs: {}
    formula: (2.176e-8)**3/(1.6726e-27)**2/1.989e30
    expected: '2'
    tolerance: 0.2
    shown: ['about twice the mass of the Sun']
    source: {cite: mit, at: 'slide 42'}
    origin: page-own

  - id: higgs-vev
    kind: fact
    where: 'Higgs vacuum value, as on the slide'
    value: '246 GeV'
    shown: ['$v = 246$ GeV']
    source: {cite: mit, at: 'slide 49'}
    origin: mit

  - id: history-years
    kind: fact
    where: 'years on slides 19 and 24–25'
    value: 'Pauli 1931; Reines and Cowan 1956; parity 1956; Moon 1951; Mössbauer 1961; Pound and Rebka 1960'
    shown: ['Pauli proposed the neutrino in 1931']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: proton-decay
    kind: fact
    where: 'proton lifetime bound, as on the slide'
    value: '1e32 years'
    shown: ['far longer than $10^{32}$ years']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: proton-decay-later
    kind: fact
    where: 'later proton lifetime limit (Super-Kamiokande, p → e⁺π⁰ > 2.4 × 10³⁴ years)'
    value: '1e34 years'
    shown: ['lifetimes above about $10^{34}$ years']
    source: {ref: 'Super-Kamiokande Collaboration, Phys. Rev. D 102, 112011 (2020)'}
    origin: later-data

  - id: thermal-broadening
    where: 'thermal Doppler width √(kT/mc²) for Fe-57 at 300 K, order of magnitude'
    inputs: {}
    formula: log10(sqrt(1.381e-23*300/(57*1.6605e-27*(2.998e8)**2)))
    expected: '-6'
    tolerance: 0.5
    shown: ['by about $10^{-6}$ at room temperature']
    source: {cite: mit, at: 'slide 24'}
    origin: page-own
