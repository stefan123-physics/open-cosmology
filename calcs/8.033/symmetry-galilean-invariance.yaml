# Calculations on content/year-2/8.033/symmetry-galilean-invariance.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 2 slides, with the page's own example.

page: content/year-2/8.033/symmetry-galilean-invariance.mdx
calcs:
  - id: translation
    kind: identity
    where: '|(r₂ + a) − (r₁ + a)| = |r₂ − r₁| in one dimension'
    formula: abs((r2 + a) - (r1 + a))
    equals: abs(r2 - r1)
    samples: {r1: [0.0, 2.0], r2: [3.0, -1.0], a: [5.0, 0.7]}
    tolerance: 1e-12
    shown: ['frac{GmM}{|\vec r_2 - \vec r_1|^2} = F" cite']
    source: {cite: mit, at: 'slide 5'}
    origin: mit

  - id: work-energy
    kind: identity
    where: 'm ∫_{v1}^{v2} v dv = m v2²/2 − m v1²/2 (m = 2)'
    formula: 2*integrate('s', 's', a, b)
    equals: 2*b**2/2 - 2*a**2/2
    samples: {a: [0.0, 3.0], b: [5.0, 1.0]}
    tolerance: 1e-9
    shown: ['frac{mv_2^2}{2} - \frac{mv_1^2}{2} = \Delta KE" cite']
    source: {cite: mit, at: 'slide 14'}
    origin: mit

  - id: nobel
    kind: fact
    where: 'year of Lee and Yang''s Nobel Prize, as on the slide'
    value: '1957'
    shown: ['Lee and Yang received the 1957 Nobel Prize']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: ex-ke-train
    where: 'example: ½ × 0.50 × 10²'
    inputs: {}
    formula: 0.5*0.50*10**2
    expected: '25'
    tolerance: 1e-12
    shown: ['frac12(0.50)(10^2) - 0 = 25$ J']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-w-train
    where: 'example: F = m(10/T), distance ½(10/T)T² = 5T; W = 25 (T = 2)'
    inputs: {}
    formula: (0.50*10/2)*(0.5*(10/2)*2**2)
    expected: '25'
    tolerance: 1e-12
    shown: ['$W = (5/T)(5T) = 25$ J']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-ke-ground
    where: 'example: ½ × 0.50 × (40² − 30²)'
    inputs: {}
    formula: 0.5*0.50*(40**2 - 30**2)
    expected: '175'
    tolerance: 1e-12
    shown: ['frac12(0.50)(40^2 - 30^2) = 175$ J']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-w-ground
    where: 'example: distance 5T + 30T; W = (5/T)(35T) (T = 2)'
    inputs: {}
    formula: (0.50*10/2)*(0.5*(10/2)*2**2 + 30*2)
    expected: '175'
    tolerance: 1e-12
    shown: ['$W = (5/T)(35T) = 175$ J']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own
