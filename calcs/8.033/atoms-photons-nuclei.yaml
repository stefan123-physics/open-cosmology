# Calculations on content/year-2/8.033/atoms-photons-nuclei.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 13 slides (deck "Lecture 12"), with the page's own example.

page: content/year-2/8.033/atoms-photons-nuclei.mdx
calcs:
  - id: quiz-photoelectric
    where: 'quiz: 3.10 − 2.3 eV'
    inputs: {}
    formula: 3.10 - 2.3
    expected: '0.80'
    tolerance: 1e-9
    shown: ['W_e = 3.10 - 2.3 = 0.80$ eV. Brighter']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: lyman-alpha
    where: 'Rydberg: 1 → 2 transition, nm'
    inputs: {}
    formula: 1e9/(1.097e7*(1 - 1/4))
    expected: '122'
    tolerance: 0.5
    shown: ['ending on $n = 1$; 122, 103, 97.3, 95.0 and 93.8 nm']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: lyman-limit-line
    where: 'Rydberg: 1 → 6 transition, nm'
    inputs: {}
    formula: 1e9/(1.097e7*(1 - 1/36))
    expected: '93.8'
    tolerance: 0.05
    shown: ['ending on $n = 1$; 122, 103, 97.3, 95.0 and 93.8 nm']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: balmer-delta
    where: 'Rydberg: 2 → 6 transition, nm'
    inputs: {}
    formula: 1e9/(1.097e7*(1/4 - 1/36))
    expected: '410'
    tolerance: 0.5
    shown: ['ending on $n = 2$; 656, 486, 434 and 410 nm']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: paschen-alpha
    where: 'Rydberg: 3 → 4 transition, nm'
    inputs: {}
    formula: 1e9/(1.097e7*(1/9 - 1/16))
    expected: '1875'
    tolerance: 1
    shown: ['ending on $n = 3$; 1875, 1282 and 1094 nm']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: paschen-gamma
    where: 'Rydberg: 3 → 6 transition, nm'
    inputs: {}
    formula: 1e9/(1.097e7*(1/9 - 1/36))
    expected: '1094'
    tolerance: 1
    shown: ['ending on $n = 3$; 1875, 1282 and 1094 nm']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: ex-balmer
    where: 'example: 1/(1.097e7 (1/4 − 1/9)) in nm'
    inputs: {}
    formula: 1e9/(1.097e7*(1/4 - 1/9))
    expected: '656'
    tolerance: 0.5
    shown: ['so $\lambda \approx 656$ nm']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-photon-energy
    where: 'example: 1240 eV nm / 400 nm'
    inputs: {}
    formula: 1239.84/400
    expected: '3.10'
    tolerance: 0.005
    shown: ['400\text{ nm} \approx 3.10$ eV']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: ex-electron-energy
    where: 'example: 3.10 − 2.3 eV'
    inputs: {}
    formula: 1239.84/400 - 2.3
    expected: '0.80'
    tolerance: 0.005
    shown: ['so $K = 3.10 - 2.3 = 0.80$ eV at most']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: ex-iron
    where: 'example: semi-empirical binding energy of Fe-56, MeV'
    inputs: {A: 56, Z: 26}
    formula: 15.8*A - 18.3*A**(2/3) - 0.714*Z**2/A**(1/3) - 23.2*(A - 2*Z)**2/A + 12/A**0.5
    expected: '485.7'
    tolerance: 0.1
    shown: ['1.6 \approx 485.7$ MeV']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-iron-surface
    where: 'example: surface term 18.3 × 56^(2/3)'
    inputs: {}
    formula: 18.3*56**(2/3)
    expected: '267.9'
    tolerance: 0.05
    shown: ['884.8 - 267.9 - 126.2 - 6.6 + 1.6']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-iron-coulomb
    where: 'example: Coulomb term 0.714 × 26²/56^(1/3)'
    inputs: {}
    formula: 0.714*26**2/56**(1/3)
    expected: '126.2'
    tolerance: 0.05
    shown: ['884.8 - 267.9 - 126.2 - 6.6 + 1.6']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-iron-per-nucleon
    where: 'example: 485.7/56 MeV'
    inputs: {}
    formula: 485.76/56
    expected: '8.67'
    tolerance: 0.005
    shown: ['about 8.67 MeV per nucleon']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: iron-measured
    kind: fact
    where: 'measured binding energy of Fe-56 (AME 2020, not on the slides): 56 × 8.7904 MeV'
    value: '492.3 MeV'
    shown: ['is 492.3 MeV, 8.79 per nucleon']
    source: {cite: ame2020}
    origin: later-data

  - id: iron-measured-per-nucleon
    where: '492.3/56'
    inputs: {}
    formula: 492.3/56
    expected: '8.79'
    tolerance: 0.005
    shown: ['is 492.3 MeV, 8.79 per nucleon']
    source: {cite: ame2020}
    origin: later-data

  - id: formula-accuracy
    where: '(492.3 − 485.7)/492.3 in percent'
    inputs: {}
    formula: (492.3 - 485.7)/492.3*100
    expected: '1'
    tolerance: 0.4
    shown: ['the formula is good to about 1%']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: nucleon-masses
    kind: fact
    where: 'nucleon and quark masses, as on the slide'
    value: '939.6, 938.3, 4, 7, 1.7 MeV'
    shown: ['the neutron (udd) has about 939.6 MeV']
    source: {cite: mit, at: 'slide 28'}
    origin: mit

  - id: quarks-proton
    where: 'uud quark rest energy with the slide values, MeV, against 938.3'
    inputs: {}
    formula: (2*4 + 7)/938.3*100
    expected: '1.6'
    tolerance: 0.05
    shown: ['So a proton''s mass is mostly glue']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: weizsacker-year
    kind: fact
    where: 'year of the semi-empirical formula, as on the slide'
    value: '1935'
    shown: ['semi-empirical formula (1935)']
    source: {cite: mit, at: 'slide 28'}
    origin: mit

  - id: lenard-year
    kind: fact
    where: 'Lenard''s experiment, as on the slide'
    value: '1902'
    shown: ['In 1902 Lenard found']
    source: {cite: mit, at: 'slide 21'}
    origin: mit
