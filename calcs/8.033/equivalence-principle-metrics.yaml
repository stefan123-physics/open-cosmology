# Calculations on content/year-2/8.033/equivalence-principle-metrics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 17 slides (deck "Lecture 16"), with the page's own example.

page: content/year-2/8.033/equivalence-principle-metrics.mdx
calcs:
  - id: spherical-metric
    kind: identity
    where: 'dx² + dy² + dz² = dr² + r²dθ² + r² sin²θ dφ² for spherical coordinates (numerical Jacobian check)'
    formula: (sin(th)*cos(ph)*dr + r*cos(th)*cos(ph)*dth - r*sin(th)*sin(ph)*dph)**2 + (sin(th)*sin(ph)*dr + r*cos(th)*sin(ph)*dth + r*sin(th)*cos(ph)*dph)**2 + (cos(th)*dr - r*sin(th)*dth)**2
    equals: dr**2 + r**2*dth**2 + r**2*sin(th)**2*dph**2
    samples: {r: [1.0, 2.5, 4.0], th: [0.3, 1.2, 2.5], ph: [0.1, 2.0, 4.0], dr: [0.1, -0.3, 0.7], dth: [0.2, 0.05, -0.4], dph: [-0.1, 0.6, 0.3]}
    tolerance: 1e-9
    shown: ['= dt^2 - dr^2 - r^2d\theta^2 - r^2\sin^2\theta\,d\varphi^2"']
    source: {cite: mit, at: 'slide 27'}
    origin: mit

  - id: weak-field-lagrangian
    where: 'weak field, slow motion: √(1 + 2φ − v²) against 1 + φ − v²/2 for φ = −1e-4, v = 1e-3 (agree to second order)'
    inputs: {}
    formula: sqrt(1 + 2*(-1e-4) - (1e-3)**2) - (1 + (-1e-4) - 0.5*(1e-3)**2)
    expected: '0'
    tolerance: 1e-7
    shown: ['\approx \int\left(1 + \phi - \frac12v^2\right)dt']
    source: {cite: mit, at: 'slide 32'}
    origin: page-own

  - id: wep-precision
    kind: fact
    where: 'precision of weak equivalence principle tests, read from the slide''s plot'
    value: '1e-8 (Eötvös) to 1e-13 (2000)'
    shown: ['down to about $10^{-13}$ by 2000']
    source: {cite: mit, at: 'slide 18'}
    origin: mit

  - id: years
    kind: fact
    where: 'years on the slides'
    value: 'equivalence principle 1911; Eötvös 1890; Pound and Rebka 1960'
    shown: ['from 1911 (slide 13)']
    source: {cite: mit, at: 'slide 13'}
    origin: mit

  - id: tower
    where: 'Pound–Rebka: 2gh/c² over 22.6 m'
    inputs: {}
    formula: 2*9.81*22.6/(2.998e8)**2
    expected: '5e-15'
    tolerance: 0.1e-15
    shown: ['the effect is only about $5 \times 10^{-15}$']
    source: {cite: mit, at: 'slide 22'}
    origin: mit

  - id: quiz-everest-rate
    where: 'quiz: 9.81 × 8848/(3.00e8)²'
    inputs: {}
    formula: 9.81*8848/(3.00e8)**2
    expected: '9.6e-13'
    tolerance: 0.05e-13
    shown: ['$gh/c^2 \\approx 9.6 \\times 10^{-13}$']
    source: {cite: mit, at: 'slide 32'}
    origin: page-own

  - id: ex-everest-rate
    where: 'example: same'
    inputs: {}
    formula: 9.81*8848/(3.00e8)**2
    expected: '9.6e-13'
    tolerance: 0.05e-13
    shown: ['(3.00 \times 10^8)^2 \approx 9.6 \times 10^{-13}$']
    source: {cite: mit, at: 'slide 32'}
    origin: page-own

  - id: ex-everest-year
    where: 'example: gain per year in μs'
    inputs: {}
    formula: 9.81*8848/(3.00e8)**2*3.156e7*1e6
    expected: '30'
    tolerance: 1
    shown: ['so the clock gains about 30 μs per year']
    source: {cite: mit, at: 'slide 32'}
    origin: page-own

  - id: ex-schwarzschild-sun
    where: 'example: 2GM/c² for the Sun, km'
    inputs: {}
    formula: 2*6.674e-11*1.989e30/(3.00e8)**2/1000
    expected: '2.95'
    tolerance: 0.005
    shown: ['(3.00 \times 10^8)^2 \approx 2.95$ km']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: sun-radius
    kind: fact
    where: 'radius of the Sun, about 696,000 km'
    value: '700,000 km'
    shown: ['The Sun''s radius is about 700,000 km']
    source: {ref: 'NASA Sun Fact Sheet: volumetric mean radius 695,700 km'}
    origin: later-data

  - id: ex-earth-phi
    where: 'example: GM/(Rc²) at the Earth''s surface'
    inputs: {}
    formula: 3.986e14/(6.371e6*(3.00e8)**2)
    expected: '7.0e-10'
    tolerance: 0.05e-10
    shown: ['$\phi/c^2 \approx -7.0 \times 10^{-10}$']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: ex-earth-factor
    where: 'example: 2|φ|/c²'
    inputs: {}
    formula: 2*3.986e14/(6.371e6*(3.00e8)**2)
    expected: '1.4e-9'
    tolerance: 0.05e-9
    shown: ['differs from 1 by only $1.4 \times 10^{-9}$']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: tower-one-way
    where: 'one-way Pound–Rebka shift gh/c²'
    inputs: {}
    formula: 9.81*22.6/(2.998e8)**2
    expected: '2.5e-15'
    tolerance: 0.05e-15
    shown: ['one way the shift is $2.5 \times 10^{-15}$']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own
