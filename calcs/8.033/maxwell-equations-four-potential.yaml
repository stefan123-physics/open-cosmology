# Calculations on content/year-2/8.033/maxwell-equations-four-potential.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 16 slides (deck "Lecture 15"), with the page's own example.

page: content/year-2/8.033/maxwell-equations-four-potential.mdx
calcs:
  - id: invariant-check
    kind: identity
    where: 'E² − B² after a boost along x: transverse parts (E_y, B_z) mix as γ(E_y − βB_z), γ(B_z − βE_y)'
    formula: (1/(1 - b**2))*((Ey - b*Bz)**2 - (Bz - b*Ey)**2)
    equals: Ey**2 - Bz**2
    samples: {b: [0.1, 0.5, 0.9], Ey: [1.0, 2.0, 3.0], Bz: [0.5, -1.0, 2.5]}
    tolerance: 1e-9
    shown: ['tex="E^2 - B^2, \qquad \vec E\cdot\vec B"']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: moving-field-ahead
    kind: identity
    where: 'field ahead of a moving charge: γ q x/(γ²x²)^(3/2) = q/(γ²x²) (q = 1, x > 0)'
    formula: g*x/(g**2*x**2)**1.5
    equals: 1/(g**2*x**2)
    samples: {g: [1.5, 10.0, 3.0], x: [0.5, 1.0, 2.0]}
    tolerance: 1e-9
    shown: ['= q/(\gamma^2x''^2)$, a factor $1/\gamma^2 = 1/100$']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: quiz-invariant
    where: 'quiz: E² − B² for E = 3, B = 0'
    inputs: {}
    formula: 3**2 - 0**2
    expected: '9'
    tolerance: 1e-9
    shown: ['$E^2 - B^2 = 9$ in every frame']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: abraham-lorentz-time
    where: 'example: τ = 2e²/(4πε₀ · 3mₑc³) in seconds'
    inputs: {}
    formula: 2*(1.602e-19)**2/(4*pi*8.854e-12*3*9.109e-31*(2.998e8)**3)
    expected: '6.3e-24'
    tolerance: 0.05e-24
    shown: ['$\tau \approx 6.3 \times 10^{-24}$ s']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: slide-time
    where: 'slide value with exact constants'
    inputs: {}
    formula: 2*(1.602176634e-19)**2/(4*pi*8.8541878128e-12*3*9.1093837e-31*(2.99792458e8)**3)
    expected: '6.266e-24'
    tolerance: 0.0005e-24
    shown: ['\approx \left(6.266 \times 10^{-24}\text{ s}\right)^{-1}']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: doubling-time
    where: 'example: τ ln 2'
    inputs: {}
    formula: 2*(1.602e-19)**2/(4*pi*8.854e-12*3*9.109e-31*(2.998e8)**3)*log(2)
    expected: '4.3e-24'
    tolerance: 0.06e-24
    shown: ['\ln 2 \approx 4.3 \times 10^{-24}$ s']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own
