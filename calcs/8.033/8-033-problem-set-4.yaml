    where: 'Problem 9(b), formula "The slope of the path": put back into ∂L/∂φ′ it gives the constant a'
    formula: sin(tha)**2*(aa/(sin(tha)*sqrt(sin(tha)**2 - aa**2))) / sqrt(1 + sin(tha)**2*(aa/(sin(tha)*sqrt(sin(tha)**2 - aa**2)))**2)
    equals: aa
