  # ---- Problem 8: the accelerated clock

  # Independent route: numerical integration of sqrt(1 − v²) over the trip, with T = 1 and c = 1.
  # One accelerating stage lasts f/4 and has v = (4β/f) t; there are four of them; the coasting takes 1 − f.
  - id: p8-ratio
    kind: identity
    answer: p8-ratio
    where: 'Problem 8(a), answer box: against numerical integration of the proper time over the six stages'
    formula: (1 - f)*sqrt(1 - b**2) + (f/2)*(sqrt(1 - b**2) + asin(b)/b)
    equals: (1 - f)*sqrt(1 - b**2) + 4*integrate('sqrt(1 - (4*b/f*x)**2)', 'x', 0, f/4)
    samples:
      b: [0.2, 0.5, 0.8, 0.95, 0.6]
      f: [0.1, 0.5, 0.9, 0.3, 1.0]
