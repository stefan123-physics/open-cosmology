# Calculations on content/year-2/8.033/8-033-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# a numerical solve of the defining condition, a numerical integral or derivative, or a second physical argument.
# All quantities are pure numbers: speeds in units of c, times in years, distances in light years, angles in degrees.

page: content/year-2/8.033/8-033-problem-set-4.mdx
calcs:
  # ---- Problem 1: the quasar

  - id: p1-observed
    kind: fact
    where: 'Problem 1, statement: the five line positions, read by us from Figure 1 of MIT (to about 20 angstrom)'
    shown: ['| 1 (the strongest) | 3560 |', '| 2 | 5210 |', '| 3 | 5510 |', '| 4 | 6170 |', '| 5 | 6350 |']
    source: {cite: mit, at: 'Problem 1, Figure 1, p. 2 (read from the figure)'}
    origin: mit

  - id: p1-lab
    kind: fact
    where: 'Problem 1, statement: the laboratory wavelengths of Table I on the sheet of MIT (4959 corrected from the printed 4956)'
    shown: ['| H α | 6563 | [Ne III] | 3869 |', '| [O III] | 5007 | [O II] | 3728 |', '| [O III] | 4959 | Mg II | 2799 |', '| H β | 4861 | C III] | 1909 |', '| [O III] | 4363 | C IV | 1549 |', '| H γ | 4340 | Si IV and O IV] | 1402 |', '| H δ | 4102 | N V | 1241 |', '| H ε and [Ne III] | 3969 | Lyman α | 1216 |']
    source: {cite: mit, at: 'Problem 1, Table I, p. 2'}
    origin: mit

  - id: p1-range
    kind: fact
    where: 'Problem 1, statement: the wavelength range of the spectrum'
    shown: ['from 3400 to 7000 Å']
    source: {cite: mit, at: 'Problem 1, Figure 1, p. 2'}
    origin: mit

  - id: p1-ratio-1
    where: 'Problem 1, solution table: Mg II'
    formula: 3560 / 2799
    expected: '1.2719'
    shown: ['| 3560 | Mg II | 2799 | 1.2719 |']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-ratio-2
    where: 'Problem 1, solution table: H delta'
    formula: 5210 / 4102
    expected: '1.2701'
    shown: ['| 5210 | H δ | 4102 | 1.2701 |']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-ratio-3
    where: 'Problem 1, solution table: H gamma'
    formula: 5510 / 4340
    expected: '1.2696'
    shown: ['| 5510 | H γ | 4340 | 1.2696 |']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-ratio-4
    where: 'Problem 1, solution table: H beta'
    formula: 6170 / 4861
    expected: '1.2693'
    shown: ['| 6170 | H β | 4861 | 1.2693 |']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-ratio-5
    where: 'Problem 1, solution table: [O III] 5007'
    formula: 6350 / 5007
    expected: '1.2682'
    shown: ['| 6350 | [O III] | 5007 | 1.2682 |']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-mean
    where: 'Problem 1, solution: the mean of the five ratios'
    formula: (3560/2799 + 5210/4102 + 5510/4340 + 6170/4861 + 6350/5007) / 5
    expected: '1.2698'
    shown: ['The mean of the five ratios is 1.2698']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-z
    answer: p1-z
    where: 'Problem 1, answer box: the redshift from the mean ratio'
    formula: (3560/2799 + 5210/4102 + 5510/4340 + 6170/4861 + 6350/5007) / 5 - 1
    expected: '0.270'
    shown: ['id="p1-z"', 'z = \frac{\lambda}{\lambda_0} - 1 \approx 0.270']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  # A second route to z: a least-squares fit of lambda = (1 + z) lambda_0 through the five lines.
  - id: p1-z-fit
    where: 'Problem 1, answer box: against a least-squares slope through the five lines'
    formula: (3560*2799 + 5210*4102 + 5510*4340 + 6170*4861 + 6350*5007) / (2799**2 + 4102**2 + 4340**2 + 4861**2 + 5007**2) - 1
    expected: '0.270'
    tolerance: 0.001
    shown: ['id="p1-z"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-spread
    where: 'Problem 1, check: the spread of the five ratios'
    formula: 3560/2799 - 6350/5007
    expected: '0.004'
    shown: ['agree to within 0.004', '$20/5000 = 0.004$']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-pattern-obs-1
    where: 'Problem 1, hint 3 and solution: observed ratio of lines 3 and 2'
    formula: 5510 / 5210
    expected: '1.058'
    shown: ['$5510/5210 = 1.058$']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-pattern-obs-2
    where: 'Problem 1, solution: observed ratio of lines 4 and 3'
    formula: 6170 / 5510
    expected: '1.120'
    shown: ['$6170/5510 = 1.120$']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-pattern-lab-1
    where: 'Problem 1, solution: H gamma over H delta'
    formula: 4340 / 4102
    expected: '1.058'
    shown: ['$4340/4102 = 1.058$']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-pattern-lab-2
    where: 'Problem 1, solution: H beta over H gamma'
    formula: 4861 / 4340
    expected: '1.120'
    shown: ['$4861/4340 = 1.120$']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-back-1
    where: 'Problem 1, solution: line 1 divided by 1.27'
    formula: 3560 / 1.27
    expected: '2803'
    shown: ['gives 2803 and 5000 Å']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-back-5
    where: 'Problem 1, solution: line 5 divided by 1.27'
    formula: 6350 / 1.27
    expected: '5000'
    shown: ['gives 2803 and 5000 Å']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-lya-ratio
    where: 'Problem 1, hint 2 and check: line 1 taken as Lyman alpha'
    formula: 3560 / 1216
    expected: '2.93'
    shown: ['$3560/1216 = 2.93$', 'the ratio is 2.93']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-lya-civ
    where: 'Problem 1, hint 2: where C IV would then be'
    formula: 1549 * 3560 / 1216
    expected: '4540'
    tolerance: 6
    shown: ['near 4540 and 5590 Å']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-lya-ciii
    where: 'Problem 1, hint 2: where C III] would then be'
    formula: 1909 * 3560 / 1216
    expected: '5590'
    tolerance: 6
    shown: ['near 4540 and 5590 Å']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-halpha
    where: 'Problem 1, check: H alpha at this redshift'
    formula: 6563 * 1.27
    expected: '8330'
    tolerance: 10
    shown: ['$6563 \times 1.27 \approx 8330$ Å']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: SS433

  - id: p2-readings
    kind: fact
    where: 'Problem 2, statement: the three Doppler shifts and the period, read by us from Figure 2 of MIT'
    shown: ['| Where the two curves cross | $0.035$ |', '| Highest point of either curve | $0.175$ |', '| Lowest point of either curve | $-0.10$ |', 'every cycle of about 162 days', 'from 1979 to 1983']
    source: {cite: mit, at: 'Problem 2, Figure 2, p. 3 (read from the figure)'}
    origin: mit

  # The drawn curves 0.035 ± (0.049 + 0.090 cos) cross where the bracket is zero.
  - id: p2-cross
    answer: p2-cross
    where: 'Problem 2(a), answer box: the level at which the two drawn curves cross (the bracket 0.049 + 0.090 cos is zero there)'
    formula: 0.035 + 0.049 + 0.090 * (-0.049 / 0.090)
    expected: '0.035'
    shown: ['id="p2-cross"', 'the two cross at 0.035']
    source: {cite: mit, at: 'Problem 2(a), Figure 2, p. 3 (read from the figure)'}
    origin: page-own

  - id: p2-plot-max-1
    where: 'Problem 2, graph caption: highest point of jet 1'
    formula: 0.035 + 0.049 + 0.090
    expected: '0.174'
    shown: ['between about 0.174 and −0.006']
    source: {cite: mit, at: 'Problem 2, Figure 2, p. 3 (our own curve)'}
    origin: page-own

  - id: p2-plot-min-1
    where: 'Problem 2, graph caption: lowest point of jet 1'
    formula: 0.035 + 0.049 - 0.090
    expected: '-0.006'
    shown: ['between about 0.174 and −0.006']
    source: {cite: mit, at: 'Problem 2, Figure 2, p. 3 (our own curve)'}
    origin: page-own

  - id: p2-plot-max-2
    where: 'Problem 2, graph caption: highest point of jet 2'
    formula: 0.035 - 0.049 + 0.090
    expected: '0.076'
    shown: ['between about 0.076 and −0.104']
    source: {cite: mit, at: 'Problem 2, Figure 2, p. 3 (our own curve)'}
    origin: page-own

  - id: p2-plot-min-2
    where: 'Problem 2, graph caption: lowest point of jet 2'
    formula: 0.035 - 0.049 - 0.090
    expected: '-0.104'
    shown: ['between about 0.076 and −0.104']
    source: {cite: mit, at: 'Problem 2, Figure 2, p. 3 (our own curve)'}
    origin: page-own

  - id: p2-beta
    answer: p2-beta
    where: 'Problem 2(c), answer box: beta from gamma = 1.035'
    formula: sqrt(1 - 1 / 1.035**2)
    expected: '0.258'
    shown: ['id="p2-beta"', '= \sqrt{0.0665} = 0.258']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  # Independent route: solve gamma(beta) = 1.035 numerically.
  - id: p2-beta-solve
    where: 'Problem 2(c), answer box: against a numerical solve of 1/sqrt(1 − β²) = 1.035'
    formula: solve('1/sqrt(1 - x**2) - 1.035', 'x', 0.01, 0.9)
    expected: '0.258'
    shown: ['id="p2-beta"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-beta-inner
    where: 'Problem 2(c), solution: 1 − 1/γ²'
    formula: 1 - 1 / 1.035**2
    expected: '0.0665'
    shown: ['\sqrt{0.0665}']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-beta-approx
    where: 'Problem 2(c), check: the small-shift estimate'
    formula: sqrt(2 * 0.035)
    expected: '0.265'
    shown: ['\sqrt{2 \times 0.035} = 0.265']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-beta-low
    where: 'Problem 2(c), check: a crossing of 0.030'
    formula: sqrt(1 - 1 / 1.030**2)
    expected: '0.240'
    shown: ['$\beta = 0.240$ and $0.275$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-beta-high
    where: 'Problem 2(c), check: a crossing of 0.040'
    formula: sqrt(1 - 1 / 1.040**2)
    expected: '0.275'
    shown: ['$\beta = 0.240$ and $0.275$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-theta
    answer: p2-theta
    where: 'Problem 2(d), answer box: the largest angle, in degrees'
    formula: acos((1 - 1.175 / 1.035) / sqrt(1 - 1 / 1.035**2)) * 180 / pi
    expected: '121.6'
    shown: ['id="p2-theta"', '\theta_{\max} = 121.6°']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # Independent route: solve the Doppler formula for the angle numerically, with beta = 0.25786.
  - id: p2-theta-solve
    where: 'Problem 2(d), answer box: against a numerical solve of γ(1 − β cos θ) = 1.175 for θ in degrees'
    formula: solve('1.035 * (1 - 0.25786 * cos(x * pi / 180)) - 1.175', 'x', 90, 180)
    expected: '121.6'
    shown: ['id="p2-theta"']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-ratio-max
    where: 'Problem 2(d), solution: 1.175/γ'
    formula: 1.175 / 1.035
    expected: '1.1353'
    shown: ['\frac{1 - 1.1353}{0.2579}']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-beta-4
    where: 'Problem 2(d), solution: beta to four figures'
    formula: sqrt(1 - 1 / 1.035**2)
    expected: '0.2579'
    shown: ['\frac{1 - 1.1353}{0.2579}']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-cos-max
    where: 'Problem 2(d), solution: the cosine of the largest angle'
    formula: (1 - 1.175 / 1.035) / sqrt(1 - 1 / 1.035**2)
    expected: '-0.525'
    shown: ['= -0.525']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-beyond
    where: 'Problem 2(d), solution: the angle beyond the perpendicular'
    formula: acos((1 - 1.175 / 1.035) / sqrt(1 - 1 / 1.035**2)) * 180 / pi - 90
    expected: '31.6'
    shown: ['points $31.6°$ beyond the perpendicular']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-cos-min
    where: 'Problem 2(d), check: the cosine from the lowest shift'
    formula: (1 - 0.90 / 1.035) / sqrt(1 - 1 / 1.035**2)
    expected: '0.506'
    shown: ['(1 - 0.90/1.035)/0.2579 = 0.506']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-theta-min
    where: 'Problem 2(d), check: the smallest angle'
    formula: acos((1 - 0.90 / 1.035) / sqrt(1 - 1 / 1.035**2)) * 180 / pi
    expected: '59.6'
    shown: ['so $\theta = 59.6°$']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-sum
    where: 'Problem 2(d), check: the two angles add up to about 180 degrees'
    formula: 121.6 + 59.6
    expected: '181.2'
    shown: ['$121.6° + 59.6° = 181.2°$']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # ---- Problem 3: the headlight effect (our own numbers)

  - id: p3-angle
    answer: p3-angle
    where: 'Problem 3(b), answer box: the high-speed formula at β = 0.98, in degrees'
    formula: sqrt(2 * (1 - 0.98)) * 180 / pi
    expected: '11.46'
    shown: ['id="p3-angle"', '\times 180/\pi = 11.46°']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-angle-rad
    where: 'Problem 3(b), solution: the angle in radians'
    formula: sqrt(2 * (1 - 0.98))
    expected: '0.200'
    shown: ['\sqrt{0.04} = 0.200$ rad']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  # Independent route: the exact edge of the cone, cos θ = β.
  - id: p3-angle-exact
    where: 'Problem 3(b), check: the exact half-angle arccos β'
    formula: acos(0.98) * 180 / pi
    expected: '11.48'
    shown: ['\arccos 0.98 = 11.48°']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-angle-diff
    where: 'Problem 3(b), check: exact minus approximate'
    formula: acos(0.98) * 180 / pi - sqrt(2 * (1 - 0.98)) * 180 / pi
    expected: '0.02'
    shown: ['off by only $0.02°$']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  # The exact edge by the aberration formula: the ray with cos θ' = 0 has cos θ = β.
  - id: p3-edge
    kind: identity
    where: 'Problem 3(a), formula "The half-light cone, exact": the inverse aberration formula at cos θ′ = 0, against a numerical solve of the forward formula'
    formula: b
    equals: solve('(x - b)/(1 - b*x)', 'x', -0.99, 0.999)
    samples:
      b: [0.1, 0.5, 0.9, 0.98, 0.993]
    tolerance: 1e-9
    shown: ['<Formula label="The half-light cone, exact"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-speed
    answer: p3-speed
    where: 'Problem 3(c), answer box: 1 − β for a half-angle of 2.0 degrees, in units of 10^-3'
    formula: (2.0 * pi / 180)**2 / 2 * 1000
    expected: '0.609'
    shown: ['id="p3-speed"', 'or $0.609 \times 10^{-3}$']
    source: {cite: mit, at: 'Problem 3(c) (our own numbers)'}
    origin: page-own

  - id: p3-speed-exact
    where: 'Problem 3(c), check: the exact 1 − cos 2°, in units of 10^-4'
    formula: (1 - cos(2.0 * pi / 180)) * 10000
    expected: '6.09'
    shown: ['$1 - \cos 2.0° = 6.09 \times 10^{-4}$']
    source: {cite: mit, at: 'Problem 3(c) (our own numbers)'}
    origin: page-own

  - id: p3-rad
    where: 'Problem 3(c), solution: 2.0 degrees in radians'
    formula: 2.0 * pi / 180
    expected: '0.03491'
    shown: ['$2.0° = 0.03491$ rad']
    source: {cite: mit, at: 'Problem 3(c) (our own numbers)'}
    origin: page-own

  - id: p3-beta
    where: 'Problem 3(c), solution: the speed'
    formula: 1 - (2.0 * pi / 180)**2 / 2
    expected: '0.99939'
    shown: ['$\beta = 0.99939$']
    source: {cite: mit, at: 'Problem 3(c) (our own numbers)'}
    origin: page-own

  - id: p3-gamma
    where: 'Problem 3(c), check: the Lorentz factor, about 29'
    formula: 1 / sqrt(1 - (1 - (2.0 * pi / 180)**2 / 2)**2)
    expected: '29'
    tolerance: 0.5
    shown: ['1/0.03491 \approx 29']
    source: {cite: mit, at: 'Problem 3(c) (our own numbers)'}
    origin: page-own

  # ---- Problem 4: the lamp

  # Independent route 1: solve gamma (1 − β x) = 1 for x numerically.
  - id: p4-cos-solve
    kind: identity
    answer: p4-cos
    where: 'Problem 4, answer box: against a numerical solve of γ(1 − β cos θ) = 1'
    formula: (1 - sqrt(1 - b**2))/b
    equals: solve('(1 - b*x)/sqrt(1 - b**2) - 1', 'x', 0, 1)
    samples:
      b: [0.2, 0.4, 0.6, 0.8, 0.9]
    tolerance: 1e-9
    shown: ['id="p4-cos"']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # Independent route 2: the frame at half the rapidity.
  - id: p4-cos-rapidity
    kind: identity
    where: 'Problem 4, check: the answer is the speed of the halfway frame, tanh(η/2): added to itself by the velocity addition it gives β'
    formula: 2*((1 - sqrt(1 - b**2))/b) / (1 + ((1 - sqrt(1 - b**2))/b)**2)
    equals: b
    samples:
      b: [0.2, 0.4, 0.6, 0.8, 0.9]
    tolerance: 1e-12
    shown: ['this is $\tanh(\eta/2)$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-cos-gamma-form
    kind: identity
    where: 'Problem 4, check: the form γβ/(γ + 1)'
    formula: (1 - sqrt(1 - b**2))/b
    equals: b/sqrt(1 - b**2) / (1/sqrt(1 - b**2) + 1)
    samples:
      b: [0.2, 0.4, 0.6, 0.8, 0.9]
    tolerance: 1e-12
    shown: ['$\cos\theta = \gamma\beta/(\gamma + 1)$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-example-cos
    where: 'Problem 4, check: β = 0.6'
    formula: (1 - sqrt(1 - 0.6**2)) / 0.6
    expected: '0.3333'
    shown: ['$\cos\theta = (1 - 0.8)/0.6 = 1/3$']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-angle
    where: 'Problem 4, check: the angle for β = 0.6, in degrees'
    formula: acos((1 - sqrt(1 - 0.6**2)) / 0.6) * 180 / pi
    expected: '70.5'
    shown: ['so $\theta = 70.5°$']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-halfway
    where: 'Problem 4, check: 1/3 added to 1/3 gives 0.6'
    formula: (1/3 + 1/3) / (1 + 1/9)
    expected: '0.6'
    shown: ['$(1/3 + 1/3)/(1 + 1/9) = 0.6$']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  # ---- Problem 5: three frames

  - id: p5-given
    kind: fact
    where: 'Problem 5, statement: the speeds of the frames and the event A, as MIT gives them'
    shown: ['$v'' = \frac35 c$', '$v'''' = \frac45 c$', '$(x, y, z, ct) = (1, 2, 3, 4)$', '$u = \frac35 c$']
    source: {cite: mit, at: 'Problem 5, p. 4'}
    origin: mit

  - id: p5-gamma-1
    where: 'Problem 5(a): γ for β = 3/5'
    formula: 1 / sqrt(1 - (3/5)**2)
    expected: '1.25'
    shown: ['$\gamma = 1/\sqrt{1 - 9/25} = 5/4$ and $\gamma\beta = 3/4$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-gamma-2
    where: 'Problem 5(a): γ for β = 4/5, as 5/3'
    formula: 1 / sqrt(1 - (4/5)**2) - 5/3
    expected: '0'
    tolerance: 1e-12
    shown: ['$\gamma = 5/3$ and $\gamma\beta = 4/3$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-x1
    answer: p5-x1
    where: 'Problem 5(b), answer box: x′ of event A'
    formula: 1.25 * 1 - 0.75 * 4
    expected: '-1.75'
    shown: ['id="p5-x1"', '| $S''$ | $-1.75$ | $2$ | $3$ | $4.25$ |']
