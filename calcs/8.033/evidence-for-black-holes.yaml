# Calculations on content/year-2/8.033/evidence-for-black-holes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 24 slides (deck "Lecture 22"), with the page's own example.

page: content/year-2/8.033/evidence-for-black-holes.mdx
calcs:
  - id: supermassive-evidence
    kind: fact
    where: 'evidence list, as on the slides'
    value: '1e6–1e9 solar masses; < 0.4 light years; < 0.4 AU; 6–20 M'
    shown: ['implying central masses of $10^6$ to $10^9$ solar masses']
    source: {cite: mit, at: 'slides 13–15'}
    origin: mit

  - id: stellar-evidence
    kind: fact
    where: 'stellar-mass evidence, as on the slide'
    value: 'maximum neutron star mass 3 solar masses; V404 Cygni companion 12 ± 2 solar masses'
    shown: ['whose companion has $12 \pm 2$ solar masses']
    source: {cite: mit, at: 'slide 30'}
    origin: mit

  - id: isco-check
    kind: identity
    where: 'circular orbits: V_eff = (1 − 2/r)(1 + L²/r²); V_eff′ = 0 and V_eff″ = 0 together give r = 6 (M = 1): at r = 6, L² = 12, check V_eff′(6) = 0'
    formula: deriv('(1 - 2/q)*(1 + 12/q**2)', 'q', x)
    equals: 0*x
    samples: {x: [6.0, 6.0, 6.0]}
    tolerance: 1e-6
    shown: ['r_{\text{ISCO}} = 6M = \frac{6GM}{c^2}']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: isco-inflection
    where: 'second derivative of V_eff at r = 6, L² = 12 (zero at the marginally stable orbit)'
    inputs: {}
    formula: deriv('(1 - 2/q)*(1 + 12/q**2)', 'q', 6, 2)
    expected: '0'
    tolerance: 1e-5
    shown: ['As a result, circular orbits are stable only outside']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: quiz-size
    where: 'quiz and example: c × 1 ms in km'
    inputs: {}
    formula: 3.00e8*1e-3/1000
    expected: '300'
    tolerance: 1e-9
    shown: ['10^{-3} = 300$ km at most']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: ex-isco
    where: 'example: 6GM/c² for 10 solar masses, km'
    inputs: {}
    formula: 6*1.327e21/(2.998e8)**2/1000
    expected: '88.6'
    tolerance: 0.05
    shown: ['$r = 6GM/c^2 \approx 88.6$ km']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-period
    where: 'example: 2π√(r³/GM) at the ISCO, ms'
    inputs: {}
    formula: 2*pi*sqrt((6*1.327e21/(2.998e8)**2)**3/1.327e21)*1000
    expected: '4.5'
    tolerance: 0.05
    shown: ['\approx 4.5$ ms']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-sgr-au
    where: 'example: 1.18e10 m in AU'
    inputs: {}
    formula: 1.18e10/1.496e11
    expected: '0.079'
    tolerance: 0.0005
    shown: ['is about 0.079 AU']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-sgr-ratio
    where: 'example: 0.4 AU / 0.079 AU'
    inputs: {}
    formula: 0.4/(1.18e10/1.496e11)
    expected: '5'
    tolerance: 0.1
    shown: ['only about five Schwarzschild radii']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: wheeler-year
    kind: fact
    where: 'Wheeler''s birth year, as on slide 1'
    value: '1911'
    shown: ['John Archibald Wheeler (born 1911;']
    source: {cite: mit, at: 'slide 1'}
    origin: mit
