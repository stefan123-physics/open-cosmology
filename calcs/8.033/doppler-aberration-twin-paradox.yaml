# Calculations on content/year-2/8.033/doppler-aberration-twin-paradox.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 7 slides, with the page's own example.

page: content/year-2/8.033/doppler-aberration-twin-paradox.mdx
calcs:
  - id: geometric-mean
    kind: identity
    where: '√((1 − β)/(1 + β)) = √((1 − β) × 1/(1 + β)): Einstein''s factor is the geometric mean of the classical ones'
    formula: sqrt((1 - b)/(1 + b))
    equals: sqrt((1 - b)*(1/(1 + b)))
    samples: {b: [0.1, 0.5, 0.9]}
    tolerance: 1e-12
    shown: ['sqrt{\frac{1 - \beta}{1 + \beta}}" cite']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: pulse-picture
    kind: identity
    where: 'pulses: arrival interval γ(1 + β)T gives frequency ratio 1/(γ(1 + β)) = √((1 − β)/(1 + β))'
    formula: sqrt(1 - b**2)/(1 + b)
    equals: sqrt((1 - b)/(1 + b))
    samples: {b: [0.1, 0.5, 0.9]}
    tolerance: 1e-12
    shown: ['sqrt{\frac{1 - \beta}{1 + \beta}}" cite']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: quiz-doppler
    where: 'quiz: √(0.5/1.5)'
    inputs: {}
    formula: sqrt(0.5/1.5)
    expected: '0.58'
    tolerance: 0.005
    shown: ['sqrt{1/3} \\approx 0.58$']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: navstar
    kind: fact
    where: 'number of GPS satellites, as on the slide'
    value: '24'
    shown: ['constellation of 24 "NAVSTAR" satellites']
    source: {cite: mit, at: 'slide 22'}
    origin: mit

  - id: ns-light
    where: 'light travel in 1 ns, in cm'
    inputs: {}
    formula: 3.00e8*1e-9*100
    expected: '30'
    tolerance: 0.1
    shown: ['a nanosecond is an error of 30 cm']
    source: {cite: mit, at: 'slide 23'}
    origin: page-own

  - id: ex-home
    where: 'example: 2 × 4.2/0.6 years'
    inputs: {}
    formula: 2*4.2/0.6
    expected: '14.0'
    tolerance: 1e-9
    shown: ['At home: $2 \times 4.2/0.6 = 14.0$ years']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-traveller
    where: 'example: 14.0 × √(1 − 0.36)'
    inputs: {}
    formula: 14.0*sqrt(1 - 0.6**2)
    expected: '11.2'
    tolerance: 1e-9
    shown: ['ages $14.0/1.25 = 11.2$ years: 2.8 years younger']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-sr-rate
    where: 'example: ½(3.87e3/3.00e8)²'
    inputs: {}
    formula: 0.5*(3.87e3/3.00e8)**2
    expected: '8.3e-11'
    tolerance: 0.05e-11
    shown: ['approx 8.3 \times 10^{-11}$']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-sr-day
    where: 'example: 8.32e-11 × 86400 s in μs'
    inputs: {}
    formula: 0.5*(3.87e3/3.00e8)**2*86400*1e6
    expected: '7.2'
    tolerance: 0.05
    shown: ['about 7.2 μs per day slow']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-gr-day
    where: 'gravitational speed-up GM/c²(1/R_E − 1/r) × 86400 s, R_E = 6.371e6 m, r = 2.657e7 m, in μs'
    inputs: {}
    formula: 3.986e14/(3.00e8)**2*(1/6.371e6 - 1/2.657e7)*86400*1e6
    expected: '45.7'
    tolerance: 0.3
    shown: ['$45.7 - 7.2 \approx 38.5$ μs per day fast: about 11.5 km']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-net
    where: 'example: 45.7 − 7.2, and × 30 cm/ns in km'
    inputs: {}
    formula: (45.7 - 7.2)*1000*0.30/1000
    expected: '11.5'
    tolerance: 0.06
    shown: ['$45.7 - 7.2 \approx 38.5$ μs per day fast: about 11.5 km']
    source: {cite: mit, at: 'slide 23'}
    origin: page-own
