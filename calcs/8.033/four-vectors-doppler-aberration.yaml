# Calculations on content/year-2/8.033/four-vectors-doppler-aberration.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 6 slides, with the page's own example.

page: content/year-2/8.033/four-vectors-doppler-aberration.mdx
calcs:
  - id: four-velocity-norm
    kind: identity
    where: 'γ_u²(u² − c²) = −c² (c = 1)'
    formula: (u**2 - 1)/(1 - u**2)
    equals: -1 + 0*u
    samples: {u: [0.1, 0.5, 0.99]}
    tolerance: 1e-9
    shown: ['U^t\eta\vec U = -c^2" cite']
    source: {cite: mit, at: 'slide 21'}
    origin: mit

  - id: aberration-unit
    kind: identity
    where: 'the boosted light direction stays a unit vector: sin²θ + γ²(cosθ − β)² = γ²(1 − β cosθ)²'
    formula: sin(th)**2 + (cos(th) - b)**2/(1 - b**2)
    equals: (1 - b*cos(th))**2/(1 - b**2)
    samples: {th: [0.3, 1.2, 2.5], b: [0.5, 0.2, 0.9]}
    tolerance: 1e-9
    shown: ['k'' = k\gamma(1 - \beta\cos\theta)" cite']
    source: {cite: mit, at: 'slide 27'}
    origin: mit

  - id: tan-form
    kind: identity
    where: 'tanθ′ = sinθ/γ(cosθ − β) agrees with cosθ′ = (cosθ − β)/(1 − β cosθ): sinθ′/cosθ′ with sinθ′ = sinθ/γ(1 − β cosθ)'
    formula: (sin(th)*sqrt(1 - b**2)/(1 - b*cos(th)))/((cos(th) - b)/(1 - b*cos(th)))
    equals: sin(th)*sqrt(1 - b**2)/(cos(th) - b)
    samples: {th: [0.3, 1.2], b: [0.2, 0.1]}
    tolerance: 1e-9
    shown: ['k'' = k\gamma(1 - \beta\cos\theta)" cite']
    source: {cite: mit, at: 'slide 28'}
    origin: mit

  - id: ex-gamma
    where: 'example: 1/√0.75'
    inputs: {}
    formula: 1/sqrt(0.75)
    expected: '1.155'
    tolerance: 0.0005
    shown: ['sqrt{0.75} \approx 1.155$', 'frequency is $\gamma\omega \approx 1.155\omega$']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-angle
    where: 'example: arccos(−0.5) in degrees'
    inputs: {}
    formula: acos((0 - 0.5)/(1 - 0))*180/pi
    expected: '120'
    tolerance: 1e-9
    shown: ['$\theta'' = 120°$']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own

  - id: ex-redshift
    where: 'example: γ(1 − β) at β = 0.5'
    inputs: {}
    formula: (1 - 0.5)/sqrt(0.75)
    expected: '0.577'
    tolerance: 0.0005
    shown: ['sqrt{(1 - 0.5)/(1 + 0.5)} \approx 0.577k$', 'by a factor of about 0.58']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own
