# Calculations on content/year-2/8.033/momentum-energy-sun.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 10 slides, with the page's own example.

page: content/year-2/8.033/momentum-energy-sun.mdx
calcs:
  - id: energy-momentum
    kind: identity
    where: '(γmc²)² − (γmuc)² = (mc²)², with m = c = 1'
    formula: (1/sqrt(1 - u**2))**2 - (u/sqrt(1 - u**2))**2
    equals: 1
    samples: {u: [0.1, 0.6, 0.99]}
    tolerance: 1e-9
    shown: ['E^2 = \left(pc\right)^2 + \left(mc^2\right)^2" cite']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: quiz-gamma
    where: 'quiz: γ at u = 0.6c'
    inputs: {}
    formula: 1/sqrt(1 - 0.6**2)
    expected: '1.25'
    tolerance: 1e-9
    shown: ['\\sqrt{1 - 0.36} = 1.25$']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: sun-mass
    kind: fact
    where: 'mass of the Sun, as on the slide'
    value: '2e30 kg'
    shown: ['mass $2 \times 10^{30}$ kg']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: sun-luminosity
    kind: fact
    where: 'luminosity of the Sun, as on the slide'
    value: '4e26 W'
    shown: ['luminosity $4 \times 10^{26}$ W']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: sun-radius
    where: 'solar radius / Earth radius: 6.957e8/6.371e6'
    inputs: {}
    formula: 6.957e8/6.371e6
    expected: '109'
    tolerance: 0.5
    shown: ['(more precisely 109)']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: composition
    kind: fact
    where: 'hydrogen and helium mass fractions, as on the slide'
    value: '70%, 28%'
    shown: ['about 70% hydrogen and 28% helium']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: helium-fraction
    where: 'mass released: 1 − 0.993'
    inputs: {}
    formula: (1 - 0.993)*100
    expected: '0.7'
    tolerance: 1e-9
    shown: ['whose rest mass is 0.7% less']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: ex-helium-energy
    where: 'example: 0.007 × 4 × 1.67e-27 × (3.00e8)² J'
    inputs: {}
    formula: 0.007*4*1.67e-27*(3.00e8)**2
    expected: '4.2e-12'
    tolerance: 0.05e-12
    shown: ['\approx 4.2 \times 10^{-12}$ J']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-helium-mev
    where: 'example: 4.2e-12 J in MeV'
    inputs: {}
    formula: 0.007*4*1.67e-27*(3.00e8)**2/1.602e-13
    expected: '26'
    tolerance: 0.5
    shown: ['J, about 26 MeV']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-mass-loss
    where: 'example: 4e26/9.0e16 kg/s'
    inputs: {}
    formula: 4e26/9.0e16
    expected: '4.4e9'
    tolerance: 0.05e9
    shown: ['\approx 4.4 \times 10^9$ kg per second']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: ex-per-kg
    where: 'example: 0.007 × (3.00e8)² J/kg'
    inputs: {}
    formula: 0.007*(3.00e8)**2
    expected: '6.3e14'
    tolerance: 0.05e14
    shown: ['\approx 6.3 \times 10^{14}$ J']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-fuel
    where: 'example: 0.1 × 0.7 × 2e30 kg'
    inputs: {}
    formula: 0.1*0.7*2e30
    expected: '1.4e29'
    tolerance: 1e26
    shown: ['= 1.4 \times 10^{29}$ kg']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-fuel-energy
    where: 'example: 1.4e29 × 6.3e14 J'
    inputs: {}
    formula: 0.1*0.7*2e30*0.007*(3.00e8)**2
    expected: '8.8e43'
    tolerance: 0.05e43
    shown: ['worth $8.8 \times 10^{43}$ J']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: ex-lifetime-s
    where: 'example: 8.8e43 J / 4e26 W'
    inputs: {}
    formula: 0.1*0.7*2e30*0.007*(3.00e8)**2/4e26
    expected: '2.2e17'
    tolerance: 0.05e17
    shown: ['that is $2.2 \times 10^{17}$ s']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: ex-lifetime-yr
    where: 'example: 2.2e17 s in billions of years'
    inputs: {}
    formula: 0.1*0.7*2e30*0.007*(3.00e8)**2/4e26/3.156e7/1e9
    expected: '7'
    tolerance: 0.1
    shown: ['or about 7 billion years']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own
