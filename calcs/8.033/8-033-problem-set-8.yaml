    formula: pi*2/(2 - 1)**(3/2)
    expected: '6.28'
    shown: ['$H_0t = 2\pi = 6.28$ Hubble times']
    source: {cite: mit, at: 'Optional Problem 8 (our own addition)'}
    origin: page-own

  # ---- Optional Problem 9: once round

  # χ = H0 sqrt(Ω_m − 1) ∫ dt/a over the whole life, with dt = da/ȧ: twice the integral up to the largest size.
  - id: p9-round
    kind: identity
    where: 'Optional Problem 9: the angle covered from bang to crunch, 2 sqrt(Ω_m − 1) ∫ da/(a ȧ) up to the largest size, equals 2π for every Ω_m (H0 = 1)'
    formula: 2*sqrt(m - 1)*integrate('1/(x*sqrt(m/x - (m - 1)))', 'x', 0, m/(m - 1))
    equals: 2*pi + 0*m
    samples:
      m: [1.2, 1.5, 2, 3, 4]
    tolerance: 1e-6
    shown: ['\chi = \int_0^{2\pi} d\theta = 2\pi']
    source: {cite: mit, at: 'Optional Problem 9 (our own solution)'}
