  # The parametric border: f and df/da both vanish at a = s (w and l are the two formulas).
  - id: p12-border-f
    kind: identity
    where: 'Optional Problem 12(b), formula "Border curve": f(s) = 0 on the curve (1 is added to both sides so that the comparison is relative)'
    formula: 1 + (2*s**3/((s - 1)**2*(2*s + 1)))/s + (1 - 2*s**3/((s - 1)**2*(2*s + 1)) - 1/((s - 1)**2*(2*s + 1))) + (1/((s - 1)**2*(2*s + 1)))*s**2
    equals: 1 + 0*s
    samples:
      s: [0.2, 0.444, 0.6, 2.5, 2.879, 10]
    tolerance: 1e-9
    shown: ['<Formula label="Border curve, with the touching point s as parameter"']
    source: {cite: mit, at: 'Optional Problem 12 (our own solution)'}
    origin: page-own

  - id: p12-border-slope
    kind: identity
    where: 'Optional Problem 12(b), formula "Border curve": Ω_Λ = Ω_m/(2s³) on the curve (the slope condition)'
    formula: 1/((s - 1)**2*(2*s + 1))
    equals: (2*s**3/((s - 1)**2*(2*s + 1)))/(2*s**3)
    samples:
      s: [0.2, 0.444, 0.6, 2.5, 2.879, 10]
    tolerance: 1e-12
    shown: ['gives $\Omega_\Lambda = \Omega_m/(2s^3)$']
    source: {cite: mit, at: 'Optional Problem 12 (our own solution)'}
    origin: page-own

  - id: p12-factor
    kind: identity
    where: 'Optional Problem 12(b), solution: 2s³ − 3s² + 1 = (s − 1)²(2s + 1)'
    formula: 2*s**3 - 3*s**2 + 1
    equals: (s - 1)**2*(2*s + 1)
    samples:
      s: [0.2, 0.444, 0.6, 2.5, 2.879, 10]
    tolerance: 1e-9
    shown: ['$2s^3 - 3s^2 + 1 = (s - 1)^2(2s + 1)$']
    source: {cite: mit, at: 'Optional Problem 12 (our own solution)'}
    origin: page-own

  - id: p12-s
    where: 'Optional Problem 12(b), solution: the root above 1 of s³ − 3s² + 1 = 0'
    formula: solve('x**3 - 3*x**2 + 1', 'x', 2, 3)
    expected: '2.879'
    shown: ['The root above 1 is $s = 2.879$']
    source: {cite: mit, at: 'Optional Problem 12 (our own solution)'}
    origin: page-own

