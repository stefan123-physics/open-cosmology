  # ---- Optional Problem 8: the cycloid

  # The pair (8.1), (8.2) obeys the Friedmann equation: ȧ = (da/dθ)/(dt/dθ), with H0 = 1 and w = Ω_m, q = θ.
  - id: p8-cycloid
    kind: identity
    where: 'Optional Problem 8(a): the cycloid obeys ȧ² = Ω_m/a − (Ω_m − 1), with numerical derivatives with respect to θ (H0 = 1)'
    formula: (deriv('w/(w - 1)/2*(1 - cos(x))', 'x', q) / deriv('w/(w - 1)**1.5/2*(x - sin(x))', 'x', q))**2
    equals: w/(w/(w - 1)/2*(1 - cos(q))) - (w - 1)
    samples:
      w: [1.2, 2, 3, 4, 2]
      q: [0.5, 1, 2, 4, 5.5]
    tolerance: 1e-6
    shown: ['<Formula label="Cycloid solution"']
    source: {cite: mit, at: 'Optional Problem 8, equations (8.1) and (8.2), p. 5'}
    origin: mit

  # Independent route: twice the numerical time from a = 0 to the largest size, ∫ da / sqrt(Ω_m/a − (Ω_m − 1)).
  - id: p8-crunch
    kind: identity
    answer: p8-crunch
    where: 'Optional Problem 8(b), answer box: against twice the numerical integral of da/ȧ from 0 to the largest size'
    formula: pi*m/(m - 1)**(3/2)
    equals: 2*integrate('1/sqrt(m/x - (m - 1))', 'x', 0, m/(m - 1))
    samples:
      m: [1.2, 1.5, 2, 3, 4]
    tolerance: 1e-6
    shown: ['id="p8-crunch"']
    source: {cite: mit, at: 'Optional Problem 8 (our own addition)'}
    origin: page-own

  - id: p8-crunch-two
