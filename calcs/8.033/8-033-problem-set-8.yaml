# Calculations on content/year-2/8.033/8-033-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# a numerical integral, a numerical solve of the defining condition, a derivative, or a second physical argument.
# Unless a unit is given, quantities are pure numbers: ages in units of 1/H0 or in Gyr, lengths in cm in Problem 11.

page: content/year-2/8.033/8-033-problem-set-8.mdx
calcs:
  # ---- Problem 1: geodesics

  - id: p1-time
    kind: identity
    answer: p1-time
    where: 'Problem 1(b), answer box: against the numerical integral of the square root of the metric for a clock at rest (a(t) = 0.3 x^(2/3) as an example, comoving speed 0)'
    formula: t1 - t0
    equals: integrate('sqrt(1 - (0.3*x**(2/3))**2 * 0**2)', 'x', t0, t1)
    samples:
      t0: [1, 2, 3.5, 5]
      t1: [6, 8, 9, 12]
    tolerance: 1e-9
    shown: ['id="p1-time"']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  # A moving clock ages less: comoving speed w out and back, with a(t) = 0.3 t^(2/3).
  - id: p1-moving-less
    where: 'Problem 1(a), solution: a path with comoving speed 0.5 between t = 1 and t = 6 ages less than t1 − t0 = 5 (ratio below 1)'
    formula: integrate('sqrt(1 - (0.3*x**(2/3))**2 * 0.5**2)', 'x', 1, 6) / 5
    expected: '0.935'
    tolerance: 0.001
    shown: ['a path that moves at all has a square root below 1 for some stretch of time']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  # ---- Problem 2: cosmic expansion

  - id: p2-dist
    kind: identity
    answer: p2-dist
    where: 'Problem 2(a), answer box: against the numerical integral of dσ/dx = a along the line'
    formula: a*x0
    equals: integrate('sqrt(a**2 + 0*x)', 'x', 0, x0)
    samples:
      a: [0.2, 0.7, 1, 1.8, 3]
      x0: [1, 2.5, 4, 7, 10]
    tolerance: 1e-9
    shown: ['id="p2-dist"']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-ratio
    kind: identity
    answer: p2-ratio
    where: 'Problem 2(b), answer box: against the ratio of two separations computed with part (a), for several comoving distances'
    formula: a1/a2
    equals: integrate('sqrt(a1**2 + 0*x)', 'x', 0, x0) / integrate('sqrt(a2**2 + 0*x)', 'x', 0, x0)
    samples:
      a1: [0.2, 0.9, 1.5, 3]
      a2: [4, 5, 7.5, 9]
      x0: [1, 3, 6, 10]
    tolerance: 1e-9
    shown: ['id="p2-ratio"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  # H = σ̇/σ for σ = a(t) x0 with the example a = t^(2/3): equals ȧ/a = 2/(3t), whatever x0 is.
  - id: p2-hubble
    kind: identity
    where: 'Problem 2(c), solution: σ̇/σ for σ = a(t) x0 with a = t^(2/3) equals ȧ/a = 2/(3t), for every x0'
    formula: deriv('x**(2/3)*x0', 'x', t) / (t**(2/3)*x0)
    equals: 2/(3*t)
    samples:
      t: [0.5, 1, 2, 5]
      x0: [1, 3, 6, 10]
    tolerance: 1e-6
    shown: ['H = \frac{\dot\sigma}{\sigma} = \frac{\dot a\,x_0}{a\,x_0} = \frac{\dot a}{a}']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  # ---- Problem 3, part I: escape speed

  # The potential energy is minus the work to pull the masses apart: ∫ from a to infinity of GMm/x² dx,
  # computed with u = 1/x as ∫ from 0 to 1/a of GMm du.
  - id: p3-energy
    kind: identity
    answer: p3-energy
    where: 'Problem 3 I(a), answer box: against the kinetic energy minus the work needed to separate the masses (numerical integral of the force)'
    formula: m*v**2/2 - G*M*m/a
    equals: m*v**2/2 - integrate('G*M*m + 0*x', 'x', 0, 1/a)
    samples:
      m: [0.5, 1, 1.5, 2]
      v: [1, 2, 3.5, 5]
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
      a: [1, 2, 3, 4]
    tolerance: 1e-9
    shown: ['id="p3-energy"']
    source: {cite: mit, at: 'Problem 3 I(a) (our own solution)'}
    origin: page-own

  - id: p3-force
    kind: identity
    where: 'Problem 3 I(a), check: the derivative of the potential energy −GMm/a with respect to a is the size of the force GMm/a²'
    formula: deriv('-G*M*m/x', 'x', a)
    equals: G*M*m/a**2
    samples:
      m: [0.5, 1, 1.5, 2]
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
      a: [1, 2, 3, 4]
    tolerance: 1e-6
    shown: ['$GMm/a$ is a force $GMm/a^2$ times a distance']
    source: {cite: mit, at: 'Problem 3 I(a) (our own solution)'}
    origin: page-own

  - id: p3-escape
    kind: identity
    answer: p3-escape
    where: 'Problem 3 I(b), answer box: against a numerical solve of E/m = v²/2 − GM/a = 0'
    formula: sqrt(2*G*M/a)
    equals: solve('x**2/2 - G*M/a', 'x', 0, 100)
    samples:
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
      a: [1, 2, 3, 4]
    tolerance: 1e-8
    shown: ['id="p3-escape"']
    source: {cite: mit, at: 'Problem 3 I(b) (our own solution)'}
    origin: page-own

  # The travel time from 0 to a at the local escape speed, ∫ da / sqrt(2GM/a), must equal t.
  - id: p3-a-of-t
    kind: identity
    answer: p3-a-of-t
    where: 'Problem 3 I(c), answer box: against a numerical solve of (travel time from 0 to x at the escape speed) = t, with the travel time (2/3) x^(3/2)/sqrt(2GM)'
    formula: (9*G*M/2)**(1/3)*t**(2/3)
    equals: solve('2/3*x**1.5/sqrt(2*G*M) - t', 'x', 0, 1000)
    samples:
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
      t: [0.5, 1, 2.5, 4]
    tolerance: 1e-8
    shown: ['id="p3-a-of-t"']
    source: {cite: mit, at: 'Problem 3 I(c) (our own solution)'}
    origin: page-own

  - id: p3-a-of-t-ode
    kind: identity
    where: 'Problem 3 I(c), solution: the result obeys da/dt = sqrt(2GM/a) (numerical derivative)'
    formula: deriv('(9*G*M/2)**(1/3)*x**(2/3)', 'x', t)
    equals: sqrt(2*G*M/((9*G*M/2)**(1/3)*t**(2/3)))
    samples:
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
      t: [0.5, 1, 2.5, 4]
    tolerance: 1e-6
    shown: ['\quad\Longrightarrow\quad a(t) = \left(\frac{9GM}{2}\right)^{1/3}t^{2/3}']
    source: {cite: mit, at: 'Problem 3 I(c) (our own solution)'}
    origin: page-own

  - id: p3-age
    kind: identity
    answer: p3-age
    where: 'Problem 3 I(d), answer box: against the numerical integral of da/v from 0 to a0, with v the escape speed at each distance'
    formula: sqrt(2*a0**3/(9*G*M))
    equals: integrate('sqrt(x/(2*G*M))', 'x', 0, a0)
    samples:
      a0: [1, 2, 3, 4]
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
    tolerance: 1e-8
    shown: ['id="p3-age"']
    source: {cite: mit, at: 'Problem 3 I(d) (our own solution)'}
    origin: page-own

  - id: p3-age-two-thirds
    kind: identity
    where: 'Problem 3 I(d), check: the time is 2/3 of the present distance over the present speed'
    formula: sqrt(2*a0**3/(9*G*M))
    equals: 2/3*a0/sqrt(2*G*M/a0)
    samples:
      a0: [1, 2, 3, 4]
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
    tolerance: 1e-12
    shown: ['t = \sqrt{\frac{2a_0^3}{9GM}} = \frac23\,\frac{a_0}{\sqrt{2GM/a_0}}']
    source: {cite: mit, at: 'Problem 3 I(d) (our own solution)'}
    origin: page-own

  # E < 0: the kinetic energy E + GMm/a is zero at a = GMm/|E| (E written as −En).
  - id: p3-amax
    kind: identity
    where: 'Problem 3 I(e), solution: the turning distance GMm/|E| against a numerical solve of E + GMm/a = 0'
    formula: G*M*m/En
    equals: solve('-En + G*M*m/x', 'x', 0.001, 10000)
    samples:
      En: [1, 2, 5, 10]
      G: [0.5, 1, 1.5, 2]
      M: [5, 10, 15, 20]
      m: [0.5, 1, 1.5, 2]
    tolerance: 1e-8
    shown: ['$a_{\max} = GMm/|E|$']
    source: {cite: mit, at: 'Problem 3 I(e) (our own solution)'}
    origin: page-own

  # ---- Problem 3, part II: the universe

  - id: p3-blob
    kind: identity
    answer: p3-blob
    where: 'Problem 3 II(a), answer box: against the energy of part I(a) with M = (4π/3)ρa³ put in'
    formula: m*v**2/2 - 4*pi*G*rho*m*a**2/3
    equals: m*v**2/2 - G*(4*pi/3*rho*a**3)*m/a
    samples:
      m: [0.5, 1, 1.5, 2]
      v: [1, 2, 3.5, 5]
      G: [0.5, 1, 1.5, 2]
      rho: [0.5, 1, 2, 3]
      a: [1.5, 2, 3, 4]
    tolerance: 1e-12
    shown: ['id="p3-blob"']
    source: {cite: mit, at: 'Problem 3 II(a) (our own solution)'}
    origin: page-own

  # Independent route: from the energy with E = −k m c²/2, solve for the speed numerically, then H² = (v/a)².
  - id: p3-friedmann
    kind: identity
    answer: p3-friedmann
    where: 'Problem 3 II(b), answer box: against (v/a)² with v solved numerically from the energy equation, E = −k m c²/2 (m = 1)'
    formula: 8*pi*G*rho/3 - k*c**2/a**2
    equals: (solve('x**2/2 - 4*pi*G*rho*a**2/3 + k*c**2/2', 'x', 0, 1000)/a)**2
    samples:
      G: [0.5, 1, 1.5, 2]
      rho: [0.5, 1, 2, 3]
      k: [0.2, 0.5, 0.8, 1]
      c: [1, 1.5, 1, 1.2]
      a: [1, 2, 3, 4]
    tolerance: 1e-8
    shown: ['id="p3-friedmann"']
    source: {cite: mit, at: 'Problem 3 II(b) (our own solution)'}
    origin: page-own

  - id: p3-b
    answer: p3-b
    where: 'Problem 3 II(c), answer box: the power B = 2/3'
    formula: 2/3
    expected: '0.6667'
    shown: ['id="p3-b"', '\propto t^{2/3}, \qquad B = \frac23']
    source: {cite: mit, at: 'Problem 3 II(c) (our own solution)'}
    origin: page-own

  # Check of B by the Friedmann equation: for a = t^(2/3), H² a³ is constant (here 4/9).
  - id: p3-b-friedmann
    kind: identity
    where: 'Problem 3 II(c), check: a = t^(2/3) has H² ∝ a⁻³: (ȧ/a)² a³ = 4/9 at every time'
    formula: (deriv('x**(2/3)', 'x', t)/t**(2/3))**2 * (t**(2/3))**3
    equals: 4/9 + 0*t
    samples:
      t: [0.5, 1, 2, 5]
    tolerance: 1e-6
    shown: ['$H = \dot a/a = \frac23/t$ indeed has $H^2 \propto t^{-2}$']
    source: {cite: mit, at: 'Problem 3 II(c) (our own solution)'}
    origin: page-own

  - id: p3-age-h
    kind: identity
    answer: p3-age-h
    where: 'Problem 3 II(d), answer box: against the age integral of Problem 5 for matter only, ∫ da/(aH) with H = H a^(−3/2)'
    formula: 2/(3*H)
    equals: integrate('sqrt(x)', 'x', 0, 1)/H
    samples:
      H: [0.5, 1, 2, 3]
    tolerance: 1e-8
    shown: ['id="p3-age-h"']
    source: {cite: mit, at: 'Problem 3 II(d) (our own solution)'}
    origin: page-own

  # ---- Problem 4: solving the Friedmann equation

  - id: p4-photons
    answer: p4-photons
    where: 'Problem 4(a), answer box: the power 1/2'
    formula: 1/2
    expected: '0.5'
    shown: ['id="p4-photons"', 'a^2 \propto t \;\Longrightarrow\; a \propto t^{1/2}']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-photons-check
    kind: identity
    where: 'Problem 4(a), check: a = t^(1/2) has H² a⁴ constant (1/4)'
    formula: (deriv('x**(1/2)', 'x', t)/t**(1/2))**2 * (t**(1/2))**4
    equals: 1/4 + 0*t
    samples:
      t: [0.5, 1, 2, 5]
    tolerance: 1e-6
    shown: ['$H^2 \propto t^{-2} \propto a^{-4}$']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-empty
    answer: p4-empty
    where: 'Problem 4(b), answer box: the power 1'
    formula: 2/2
    expected: '1'
    shown: ['id="p4-empty"', '\text{constant} \;\Longrightarrow\; a \propto t']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-empty-check
    kind: identity
    where: 'Problem 4(b), check: a = t has H² a² constant (1)'
    formula: (deriv('x', 'x', t)/t)**2 * t**2
    equals: 1 + 0*t
    samples:
      t: [0.5, 1, 2, 5]
    tolerance: 1e-6
    shown: ['\frac{da}{dt} = \text{constant}']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-vacuum
    kind: identity
    answer: p4-vacuum
    where: 'Problem 4(c), answer box: against its own numerical derivative divided by H0 (so ȧ/a = H0)'
    formula: exp(H0*t)
    equals: deriv('exp(H0*x)', 'x', t)/H0
    samples:
      H0: [0.2, 0.5, 1, 1.5]
      t: [0.5, 1, 2, 3]
    tolerance: 1e-6
    shown: ['id="p4-vacuum"']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  # ---- Problem 5: the age of the universe

  - id: p5-matter
    answer: p5-matter
    where: 'Problem 5(a), answer box: numerical age integral for matter only'
    formula: integrate('1/(x*sqrt(x**(-3)))', 'x', 0, 1)
    expected: '0.6667'
    shown: ['id="p5-matter"', '| matter only | 0.6667 | 9.32 |']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-photons
    answer: p5-photons
    where: 'Problem 5(b), answer box: numerical age integral for photons only'
    formula: integrate('1/(x*sqrt(x**(-4)))', 'x', 0, 1)
    expected: '0.5'
    shown: ['id="p5-photons"', '| photons only | 0.5 | 6.99 |']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-empty
    answer: p5-empty
    where: 'Problem 5(c), answer box: numerical age integral for the empty universe'
    formula: integrate('1/(x*sqrt(x**(-2)))', 'x', 0, 1)
    expected: '1'
    tolerance: 1e-6
    shown: ['id="p5-empty"', '| empty | 1 | 13.98 |']
    source: {cite: mit, at: 'Problem 5(c) (our own solution)'}
    origin: page-own

  - id: p5-lcdm
    answer: p5-lcdm
    where: 'Problem 5(d), answer box: numerical age integral for Ω_m = 0.3, Ω_Λ = 0.7'
    formula: integrate('1/sqrt(0.3/x + 0.7*x**2)', 'x', 0, 1)
    expected: '0.9641'
    shown: ['id="p5-lcdm"', '0.79682 \times 1.20994 = 0.9641', 'gives 0.9641 as well']
    source: {cite: mit, at: 'Problem 5(d) (our own solution)'}
    origin: page-own

  - id: p5-lcdm-log
    where: 'Problem 5(d), solution: the form with the logarithm on the sheet of MIT'
    formula: 2/3*(1 - 0.3)**(-1/2)*log(0.3**(-1/2) + ((1 - 0.3)/0.3)**(1/2))
    expected: '0.9641'
    shown: ['0.79682 \times 1.20994 = 0.9641']
    source: {cite: mit, at: 'Problem 5(d), p. 3'}
    origin: mit

  - id: p5-lcdm-forms
    kind: identity
    where: 'Problem 5(d), statement: the two closed forms and the numerical integral agree for several Ω_m (called w here)'
    formula: 2/3*(1 - w)**(-1/2)*asinh(((1 - w)/w)**(1/2))
    equals: integrate('1/sqrt(w/x + (1 - w)*x**2)', 'x', 0, 1)
    samples:
      w: [0.1, 0.3, 0.5, 0.9]
    tolerance: 1e-7
    shown: ['<Formula label="Age of a flat universe with matter and vacuum energy"']
    source: {cite: mit, at: 'Problem 5(d), p. 3'}
    origin: mit

  - id: p5-lcdm-forms-log
    kind: identity
    where: 'Problem 5(d), statement: the logarithm form equals the inverse-sinh form'
    formula: 2/3*(1 - w)**(-1/2)*log(w**(-1/2) + ((1 - w)/w)**(1/2))
    equals: 2/3*(1 - w)**(-1/2)*asinh(((1 - w)/w)**(1/2))
    samples:
      w: [0.1, 0.3, 0.5, 0.9]
    tolerance: 1e-12
    shown: ['<Formula label="Age of a flat universe with matter and vacuum energy"']
    source: {cite: mit, at: 'Problem 5(d), p. 3'}
    origin: mit

  - id: p5-root-1
    where: 'Problem 5(d), solution: 0.7^(−1/2)'
    formula: 0.7**(-1/2)
    expected: '1.19523'
    shown: ['$(1 - \Omega_m)^{-1/2} = 0.7^{-1/2} = 1.19523$']
    source: {cite: mit, at: 'Problem 5(d) (our own solution)'}
    origin: page-own

  - id: p5-root-2
    where: 'Problem 5(d), solution: 0.3^(−1/2)'
    formula: 0.3**(-1/2)
    expected: '1.82574'
    shown: ['$\Omega_m^{-1/2} = 1.82574$']
    source: {cite: mit, at: 'Problem 5(d) (our own solution)'}
    origin: page-own

  - id: p5-root-3
    where: 'Problem 5(d), solution and Problem 5(i): (0.7/0.3)^(1/2)'
    formula: (0.7/0.3)**(1/2)
    expected: '1.52753'
    shown: ['$(0.7/0.3)^{1/2} = 1.52753$', '$\sqrt{0.7/0.3} = 1.52753$']
    source: {cite: mit, at: 'Problem 5(d) (our own solution)'}
    origin: page-own

  - id: p5-prefactor
    where: 'Problem 5(d) and 5(i), solution: 2/(3 sqrt(0.7))'
    formula: 2/(3*sqrt(0.7))
    expected: '0.79682'
    shown: ['0.79682 \times 1.20994', '$2/(3\sqrt{0.7}) = 0.79682$']
    source: {cite: mit, at: 'Problem 5(d) (our own solution)'}
    origin: page-own

  - id: p5-log
    where: 'Problem 5(d), solution: the logarithm'
    formula: log(0.3**(-1/2) + (0.7/0.3)**(1/2))
    expected: '1.20994'
    shown: ['\ln\left(1.82574 + 1.52753\right) = 0.79682 \times 1.20994']
    source: {cite: mit, at: 'Problem 5(d) (our own solution)'}
    origin: page-own

  - id: p5-hubble-time
    where: 'Problem 5(e), solution: the Hubble time for h = 0.7 with the conversion of MIT'
    formula: 9.7846/0.7
    expected: '13.978'
    shown: ['$1/H_0 = 9.7846/0.7 = 13.978$ Gyr']
    source: {cite: mit, at: 'Problem 5(e), p. 4'}
    origin: mit

  - id: p5-conversion
    kind: fact
    where: 'Problem 5(e), statement: the conversion 1/H0 = 9.7846 Gyr / h (also Lecture 18, slide 7) and H0 = 100 h km/s/Mpc'
    shown: ['$H_0^{-1} \approx h^{-1} \times 9.7846$ Gyr', '$= 70$ km/s/Mpc']
    source: {cite: mit, at: 'Problem 5(e), p. 4'}
    origin: mit

  # The conversion recomputed: 1/(100 km/s/Mpc) in Gyr with the Julian year of pint is 9.778.
  - id: p5-conversion-julian
    where: 'Problem 5(e), check: 1/(100 km/s/Mpc) with a year of 365.25 days (the 9.778 of the lesson)'
    inputs: {H: 100 km/s/Mpc}
    formula: 1/H
    expected: 9.778 Gyr
    shown: ['(9.778, for a year of 365.25 days; MIT''s 9.7846 belongs to a year of 365 days)']
    source: {cite: reading1, at: 'slide 7'}
    origin: page-own

  - id: p5-conversion-365
    where: 'Problem 5(e), check: the same with a year of 365 days gives the 9.7846 of MIT'
    inputs: {H: 100 km/s/Mpc}
    formula: 1/H * 365.25/365
    expected: 9.7846 Gyr
    shown: ['MIT''s 9.7846 belongs to a year of 365 days']
    source: {cite: reading1, at: 'slide 7'}
    origin: page-own

  - id: p5-gyr-matter
    answer: p5-gyr-matter
    where: 'Problem 5(e), answer box: matter only'
    formula: 9.7846/0.7 * integrate('sqrt(x)', 'x', 0, 1)
    expected: '9.32'
    shown: ['id="p5-gyr-matter"', '| matter only | 0.6667 | 9.32 |', 'gives 9.32 Gyr against 13.98 Gyr']
    source: {cite: mit, at: 'Problem 5(e) (our own solution)'}
    origin: page-own

  - id: p5-gyr-photons
    answer: p5-gyr-photons
    where: 'Problem 5(e), answer box: photons only'
    formula: 9.7846/0.7 * integrate('x', 'x', 0, 1)
    expected: '6.99'
    shown: ['id="p5-gyr-photons"', '| photons only | 0.5 | 6.99 |']
    source: {cite: mit, at: 'Problem 5(e) (our own solution)'}
    origin: page-own

  - id: p5-gyr-empty
    answer: p5-gyr-empty
    where: 'Problem 5(e), answer box: empty universe'
    formula: 9.7846/0.7 * 1
    expected: '13.98'
    shown: ['id="p5-gyr-empty"', '| empty | 1 | 13.98 |']
    source: {cite: mit, at: 'Problem 5(e) (our own solution)'}
    origin: page-own

  - id: p5-gyr-lcdm
    answer: p5-gyr-lcdm
    where: 'Problem 5(e), answer box: the favoured model'
