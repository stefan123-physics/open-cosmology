  # ---- Optional Problem 10: Minkowski space in disguise

  - id: p10-r
    kind: identity
    answer: p10-r
    where: 'Optional Problem 10(a), answer box: R is the root of the coefficient t²r² of the angular part'
    formula: t*r
    equals: sqrt(t**2*r**2)
    samples:
      t: [0.5, 1, 2, 3]
      r: [0.2, 0.7, 1.3, 2]
    tolerance: 1e-12
    shown: ['id="p10-r"']
    source: {cite: mit, at: 'Optional Problem 10 (our own solution)'}
    origin: page-own

  # Independent route: build T up along a line of constant t from r = 0, with ∂T/∂r = t r/sqrt(1 + r²)
  # (what the dr² coefficient of the metric demands once R = t r).
  - id: p10-t
    kind: identity
    answer: p10-t
    where: 'Optional Problem 10(a), answer box: against T = t at r = 0 plus the numerical integral of t x/sqrt(1 + x²) from 0 to r'
    formula: t*sqrt(1 + r**2)
    equals: t + integrate('t*x/sqrt(1 + x**2)', 'x', 0, r)
    samples:
      t: [0.5, 1, 2, 3]
      r: [0.2, 0.7, 1.3, 2]
    tolerance: 1e-8
    shown: ['id="p10-t"']
    source: {cite: mit, at: 'Optional Problem 10 (our own solution)'}
    origin: page-own

  - id: p10-metric-tt
    kind: identity
    where: 'Optional Problem 10(b): the dt² coefficient, (∂T/∂t)² − (∂R/∂t)² = 1 (numerical derivatives)'
    formula: deriv('x*sqrt(1 + r**2)', 'x', t)**2 - deriv('x*r', 'x', t)**2
    equals: 1 + 0*t
    samples:
      t: [0.5, 1, 2, 3]
      r: [0.2, 0.7, 1.3, 2]
    tolerance: 1e-6
    shown: ['<Formula label="Time and radial parts"']
    source: {cite: mit, at: 'Optional Problem 10 (our own solution)'}
    origin: page-own

  - id: p10-metric-rr
    kind: identity
    where: 'Optional Problem 10(b): the dr² coefficient, (∂T/∂r)² − (∂R/∂r)² = −t²/(1 + r²) (numerical derivatives)'
    formula: deriv('t*sqrt(1 + x**2)', 'x', r)**2 - deriv('t*x', 'x', r)**2
    equals: -t**2/(1 + r**2)
    samples:
      t: [0.5, 1, 2, 3]
      r: [0.2, 0.7, 1.3, 2]
    tolerance: 1e-6
    shown: ['<Formula label="Time and radial parts"']
    source: {cite: mit, at: 'Optional Problem 10 (our own solution)'}
    origin: page-own

  # The mixed coefficient: (∂T/∂t)(∂T/∂r) and (∂R/∂t)(∂R/∂r) are equal, so the dt dr terms cancel.
  - id: p10-metric-tr
    kind: identity
    where: 'Optional Problem 10(b): the dt dr terms cancel, (∂T/∂t)(∂T/∂r) = (∂R/∂t)(∂R/∂r) (numerical derivatives)'
    formula: deriv('x*sqrt(1 + r**2)', 'x', t)*deriv('t*sqrt(1 + x**2)', 'x', r)
    equals: deriv('x*r', 'x', t)*deriv('t*x', 'x', r)
    samples:
      t: [0.5, 1, 2, 3]
      r: [0.2, 0.7, 1.3, 2]
    tolerance: 1e-6
    shown: ['\left(2tr - 2tr\right)dt\,dr']
    source: {cite: mit, at: 'Optional Problem 10 (our own solution)'}
    origin: page-own

  - id: p10-gamma
    kind: identity
    where: 'Optional Problem 10(a), check: a galaxy with the velocity r/sqrt(1 + r²) has γ = sqrt(1 + r²)'
    formula: 1/sqrt(1 - (r/sqrt(1 + r**2))**2)
    equals: sqrt(1 + r**2)
    samples:
      r: [0.2, 0.7, 1.3, 2]
    tolerance: 1e-12
    shown: ['$\gamma = \sqrt{1 + r^2}$']
    source: {cite: mit, at: 'Optional Problem 10 (our own solution)'}
    origin: page-own

