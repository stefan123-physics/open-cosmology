    where: 'Optional Problem 12(a), solution: the slope of f at a = 1 is −Ω_m + 2Ω_Λ (numerical derivative; w = Ω_m, l = Ω_Λ)'
    formula: deriv('w/x + (1 - w - l) + l*x**2', 'x', 1)
    equals: -w + 2*l
    samples:
      w: [0.3, 1, 2, 0.5]
      l: [0.7, 0.2, 1.5, -0.5]
