# Calculations on content/year-2/8.033/force-acceleration-interstellar-travel.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 12 slides (deck "Lecture 11"), with the page's own example.

page: content/year-2/8.033/force-acceleration-interstellar-travel.mdx
calcs:
  - id: quiz-rest-energy
    where: 'quiz: √(5² − 4²) GeV'
    inputs: {}
    formula: sqrt(5**2 - 4**2)
    expected: '3'
    tolerance: 1e-9
    shown: ['\\sqrt{25 - 16} = 3$ GeV']
    source: {cite: mit, at: 'slide 5'}
    origin: page-own

  - id: quiz-beta
    where: 'quiz: β = cp/E = 4/5'
    inputs: {}
    formula: 4/5
    expected: '0.8'
    tolerance: 1e-9
    shown: ['a = cp/E = 0.8$']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ke-correction
    where: 'next term of (γ − 1)c² beyond u²/2, in units of u⁴/c²'
    inputs: {}
    formula: ((1/sqrt(1 - 0.01**2)) - 1 - 0.5*0.01**2)/0.01**4
    expected: '0.375'
    tolerance: 0.001
    shown: ['the correction is in fact $\frac38 m']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: parallel-force
    kind: identity
    where: 'along the motion: 1 + γ²β² = γ², so F = γ³m₀a'
    formula: 1 + b**2/(1 - b**2)
    equals: 1/(1 - b**2)
    samples: {b: [0.1, 0.5, 0.9]}
    tolerance: 1e-9
    shown: ['$\vec F = \gamma_u^3 m_0\vec a$;']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: ring-radius
    where: 'r = p/(eB) for p = 7 TeV/c, B = 8.33 T, in km'
    inputs: {}
    formula: 7e12/(3.00e8*8.33)/1000
    expected: '2.8'
    tolerance: 0.05
    shown: ['\times 8.33) \approx 2.8$ km']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: quiz-ring-radius
    where: 'quiz: same radius'
    inputs: {}
    formula: 7e12/(2.998e8*8.33)/1000
    expected: '2.8'
    tolerance: 0.05
    shown: ['8.33\\text{ T}) \\approx 2.8$ km']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: lhc-ring
    kind: fact
    where: 'circumference of the LHC ring (not on the slide)'
    value: '27 km'
    shown: ['into the 27 km ring of the LHC']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: lhc-start
    kind: fact
    where: 'first LHC collisions (later development)'
    value: '2009'
    shown: ['it began collisions in 2009']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: spacecraft-speeds
    kind: fact
    where: 'spacecraft speeds, as on the slide'
    value: '100,000 mph; 25,000-35,000 mph'
    shown: ['reached about 100,000 miles per hour']
    source: {cite: mit, at: 'slide 25'}
    origin: mit

  - id: slide-times
    kind: fact
    where: 'travel times to Proxima Centauri, as on the slide'
    value: '44,500 and 74,100 years'
    shown: ['of about 44,500 years at Galileo''s speed and 74,100 years']
    source: {cite: mit, at: 'slide 26'}
    origin: mit

  - id: time-galileo
    where: '4.24 ly at 100,000 mph, in years'
    inputs: {}
    formula: 4.24*9.461e15/(1e5*1609.344/3600)/3.156e7
    expected: '28000'
    tolerance: 500
    shown: ['take about 28,000 and 95,000 years']
    source: {cite: mit, at: 'slide 26'}
    origin: page-own

  - id: time-voyager
    where: '4.24 ly at 30,000 mph, in years'
    inputs: {}
    formula: 4.24*9.461e15/(3e4*1609.344/3600)/3.156e7
    expected: '95000'
    tolerance: 500
    shown: ['take about 28,000 and 95,000 years']
    source: {cite: mit, at: 'slide 26'}
    origin: page-own

  - id: propellant
    kind: fact
    where: 'propellant masses by engine type, as on the slide'
    value: '1e137, 1e17, 1e11, 1e5 kg'
    shown: ['chemical (500 s), about $10^{137}$ kg']
    source: {cite: mit, at: 'slide 28'}
    origin: mit

  - id: antimatter-ratios
    where: 'annihilation 9e16 J/kg over H₂/O₂ combustion 1.3e7 J/kg (order ten billion)'
    inputs: {}
    formula: log10(9e16/1.3e7)
    expected: '10'
    tolerance: 0.5
    shown: ['about ten billion times more energy than burning hydrogen']
    source: {cite: mit, at: 'slide 29'}
    origin: mit

  - id: antimatter-facts
    kind: fact
    where: 'antimatter production and cost, as on the slides'
    value: '100 W for 3 s; 1e-8 percent; 62.5 trillion dollars per gram; 1e-9 g per year'
    shown: ['would light a 100 W bulb for three seconds']
    source: {cite: mit, at: 'slides 31–32'}
    origin: mit

  - id: photon-rocket
    where: 'photon rocket mass ratio at β = 0.5'
    inputs: {}
    formula: sqrt(1.5/0.5)
    expected: '1.73'
    tolerance: 0.005
    shown: ['$\sqrt 3 \approx 1.73$']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: photon-rocket-check
    kind: identity
    where: 'photon rocket: exhaust energy = momentum × c gives M_i/M_f = γ(1 + β)'
    formula: (1/sqrt(1 - b**2))*(1 + b)
    equals: sqrt((1 + b)/(1 - b))
    samples: {b: [0.1, 0.5, 0.9]}
    tolerance: 1e-9
    shown: ['M_i}{M_f} = \sqrt{\frac{1 + \beta}{1 - \beta}}']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-exhaust
    where: 'example: 9.81 × 500 m/s in km/s'
    inputs: {}
    formula: 9.81*500/1000
    expected: '4.9'
    tolerance: 0.01
    shown: ['$9.81 \times 500 \approx 4.9$ km/s']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-beta
    where: 'example: 4.37/900'
    inputs: {}
    formula: 4.37/900
    expected: '0.0049'
    tolerance: 0.00005
    shown: ['about 0.0049 $c$']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-speed
    where: 'example: 4.37 ly / 900 yr in km/s'
    inputs: {}
    formula: 4.37*9.461e15/(900*3.156e7)/1000
    expected: '1460'
    tolerance: 10
    shown: ['or 1,460 km/s']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-log-ratio
    where: 'example: 1456/4.905'
    inputs: {}
    formula: 1456/4.905
    expected: '297'
    tolerance: 0.5
    shown: ['1456/4.905 \approx 297$']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own

  - id: ex-mass-ratio
    where: 'example: log10 of e^297'
    inputs: {}
    formula: 1456/4.905/log(10)
    expected: '129'
    tolerance: 0.5
    shown: ['M_i/M_f \approx 10^{129}$']
    source: {cite: mit, at: 'slide 28'}
    origin: page-own
