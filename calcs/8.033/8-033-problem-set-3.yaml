    formula: sqrt((ux + v)**2 + uy**2*(1 - v**2/c**2))/(1 + ux*v/c**2)
    equals: c*sqrt(1 - (1 - (ux**2 + uy**2)/c**2)*(1 - v**2/c**2)/(1 + ux*v/c**2)**2)
    samples:
      ux: [0.1, 0.6, 0.3, -0.5, 0.0]
      uy: [0.2, 0.5, 0.9, 0.4, 0.7]
      v: [0.5, 0.9, 0.2, 0.7, 0.6]
