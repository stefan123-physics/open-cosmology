# Calculations on content/year-2/8.033/8-033-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for the 8.033 problem sets, so every answer is checked here by a route independent of
# the page where one exists: the invariant interval, the matrix product written out term by term, a numerical
# derivative (chain rule, wave operator), a numerical solve, or the normalisation of the 4-velocity.
# In the identities c, g (γ) and b (β) are plain sample numbers; where both g and b appear they are sampled as
# matching pairs (b = 0.6, g = 1.25; b = 0.8, g = 5/3; b = 0.28, g = 1/0.96; b = 0.96, g = 1/0.28).

page: content/year-2/8.033/8-033-problem-set-3.mdx
calcs:
  # ---- Problem 1: four quick questions

  - id: p1-given-speeds
    kind: fact
    where: 'Problem 1(a) and (c), statements: the speeds'
    shown: ['A sphere moves at 90% of the speed of light', 'A lamp moves around you in a circle at 50% of the speed of light']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-contraction-factor
    where: 'Problem 1(a), check: the contraction factor at beta = 0.9'
    inputs: {beta: 0.9}
    formula: sqrt(1 - beta**2)
    expected: '0.436'
    shown: ['$\sqrt{1 - 0.81} = 0.436$']
    source: {cite: mit, at: 'Problem 1(a) (our own check)'}
    origin: page-own

  - id: p1-transverse-factor
    where: 'Problem 1(c), check: 1/gamma at beta = 0.5'
    inputs: {beta: 0.5}
    formula: sqrt(1 - beta**2)
    expected: '0.866'
    shown: ['this is $0.866$ of the emitted frequency']
    source: {cite: reading3, at: 'slide 28 (transverse Doppler effect; our own number)'}
    origin: page-own

  # ---- Problem 2: the slanting rod

  - id: p2-given-values
    kind: fact
    where: 'Problem 2(c), statement'
    shown: ['$\theta'' = 30^\circ$ and $\beta = 0.40$']
    source: {cite: mit, at: 'Problem 2, p. 1'}
    origin: mit

  # The answer against the two components put together with Pythagoras.
  - id: p2-len
    kind: identity
    answer: p2-len
    where: 'Problem 2(a), answer box: against the contracted x component and the unchanged y component'
    formula: L0*sqrt(1 - b**2*cos(th)**2)
    equals: sqrt((L0*cos(th)*sqrt(1 - b**2))**2 + (L0*sin(th))**2)
    samples:
      L0: [1, 0.5, 2, 1.3, 1]
      b: [0.4, 0.9, 0.2, 0.75, 0.99]
      th: [0.5236, 0.2, 1.3, 0.8, 1.5]
    tolerance: 1e-9
    shown: ['id="p2-len"']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  # An independent route: the invariant interval. The two marks are simultaneous in S (interval = L^2); in S' they
  # are L0 apart in space and c dt' = -b L0 cos(th) apart in time.
  - id: p2-len-by-interval
    kind: identity
    where: 'Problem 2(a), check: the same length from the invariant interval'
    formula: L0*sqrt(1 - b**2*cos(th)**2)
    equals: sqrt(L0**2 - (-b*L0*cos(th))**2)
    samples:
      L0: [1, 0.5, 2, 1.3]
      b: [0.4, 0.9, 0.2, 0.75]
      th: [0.5236, 0.2, 1.3, 0.8]
    tolerance: 1e-9
    shown: ['so $\Delta s^2 = L''^2 - \beta^2L''^2\cos^2\theta''$']
    source: {cite: mit, at: 'Problem 2(a) (our own check)'}
    origin: page-own

  # The angle from the tangent against the angle from the cosine (x component over the length).
  - id: p2-theta
    kind: identity
    answer: p2-theta
    where: 'Problem 2(b), answer box: against acos(x component / length)'
    formula: atan(tan(th)/sqrt(1 - b**2))
    equals: acos(cos(th)*sqrt(1 - b**2)/sqrt(1 - b**2*cos(th)**2))
    samples:
      b: [0.4, 0.9, 0.2, 0.75, 0.99]
      th: [0.5236, 0.2, 1.3, 0.8, 1.5]
    tolerance: 1e-9
    shown: ['id="p2-theta"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-gamma
    where: 'Problem 2(c): gamma for beta = 0.40'
    inputs: {beta: 0.40}
    formula: 1/sqrt(1 - beta**2)
    expected: '1.0911'
    shown: ['$\gamma = 1/\sqrt{1 - 0.16} = 1.0911$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-len-num
    answer: p2-len-num
    where: 'Problem 2(c), answer box: the length'
    inputs: {L0: 1.00 m, beta: 0.40}
    formula: L0*sqrt(1 - beta**2*cos(pi/6)**2)
    expected: 0.938 m
    shown: ['id="p2-len-num"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-theta-num
    answer: p2-theta-num
    where: 'Problem 2(c), answer box: the angle in degrees'
    inputs: {beta: 0.40}
    formula: atan(tan(pi/6)/sqrt(1 - beta**2))*180/pi
    expected: '32.2'
    shown: ['id="p2-theta-num"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-tan
    where: 'Problem 2(c): gamma times tan 30 degrees'
    inputs: {}
    formula: 1.0911*0.57735
    expected: '0.6299'
    shown: ['$\tan\theta = 1.0911 \times 0.57735 = 0.6299$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-dx
    where: 'Problem 2(c), check: the contracted x component'
    inputs: {beta: 0.40}
    formula: cos(pi/6)*sqrt(1 - beta**2)
    expected: '0.7937'
    shown: ['$\Delta x = 0.8660/1.0911 = 0.7937$ m']
    source: {cite: mit, at: 'Problem 2(c) (our own check)'}
    origin: page-own

  - id: p2-len-from-components
    where: 'Problem 2(c), check: Pythagoras with the rounded components'
    inputs: {}
    formula: sqrt(0.7937**2 + 0.500**2)
    expected: '0.938'
    shown: ['$\sqrt{0.7937^2 + 0.500^2} = 0.938$ m']
    source: {cite: mit, at: 'Problem 2(c) (our own check)'}
    origin: page-own

  # ---- Problem 3: decay in flight

  - id: p3-given-values
    kind: fact
    where: 'Problem 3, statement'
    shown: ['leaves a track $1.05$ mm long before it decays. Its speed relative to the detector was $0.992c$']
    source: {cite: mit, at: 'Problem 3, p. 1'}
    origin: mit

  - id: p3-lab-time
    where: 'Problem 3: the lifetime in the detector frame'
    inputs: {d: 1.05 mm, beta: 0.992}
    formula: d/(beta*c)
    expected: 3.53e-12 s
    shown: ['(0.992 \times 2.998\times 10^8\ \text{m/s}) = 3.53\times 10^{-12}$ s']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-tau
    answer: p3-tau
    where: 'Problem 3, answer box: the proper lifetime'
    inputs: {d: 1.05 mm, beta: 0.992}
    formula: d/(beta*c)*sqrt(1 - beta**2)
    expected: 0.446 ps
    shown: ['id="p3-tau"']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-root
    where: 'Problem 3: 1/gamma'
    inputs: {beta: 0.992}
    formula: sqrt(1 - beta**2)
    expected: '0.1262'
    shown: ['= \sqrt{0.015936} = 0.1262$']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-gamma
    where: 'Problem 3: gamma'
    inputs: {beta: 0.992}
    formula: 1/sqrt(1 - beta**2)
    expected: '7.92'
    shown: ['that is $\gamma = 7.92$']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  # The same proper lifetime in the particle's frame: the contracted track covered at 0.992c.
  - id: p3-contracted-track
    where: 'Problem 3, check: the track in the particle''s frame'
    inputs: {d: 1.05 mm, beta: 0.992}
    formula: d*sqrt(1 - beta**2)
    expected: 0.133 mm
    shown: ['$1.05\ \text{mm}/7.92 = 0.133$ mm long there']
    source: {cite: mit, at: 'Problem 3 (our own check)'}
    origin: page-own

  - id: p3-tau-by-contraction
    where: 'Problem 3, check: contracted track over speed'
    inputs: {d: 0.133 mm, beta: 0.992, c0: 2.998e8 m/s}
    formula: d/(beta*c0)
    expected: 4.46e-13 s
    tolerance: 2e-15 s
    shown: ['$0.133\times 10^{-3}/(0.992 \times 2.998\times 10^8) = 4.46\times 10^{-13}$ s']
    source: {cite: mit, at: 'Problem 3 (our own check)'}
    origin: page-own

  # ---- Problem 4: the pole and the barn

  - id: p4-given-values
    kind: fact
    where: 'Problem 4, statement'
    shown: ['The pole is 10 m long in its own rest frame', 'A barn is at rest in $S$ and is 8 m long there', 'the right end of the pole is at $x = 5$ m, well inside the barn']
    source: {cite: mit, at: 'Problem 4, p. 2'}
    origin: mit

  - id: p4-a
    answer: p4-a
    where: 'Problem 4(a), answer box: c t'' of event B'
    inputs: {x: 5 m, ct: 0 m}
    formula: 2*(ct - sqrt(3)/2*x)
    expected: -8.66 m
    shown: ['id="p4-a"']
    source: {cite: reading1, at: 'slide 16 (the Lorentz transformation; our own numbers)'}
    origin: page-own

  - id: p4-a-seconds
    where: 'Problem 4(a): the same time in nanoseconds'
    inputs: {x: 5 m}
    formula: -sqrt(3)*x/c
    expected: -28.9 ns
    shown: ['$t''_B = -8.66\ \text{m}/c = -28.9$ ns']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-a-position
    where: 'Problem 4(a), check: x'' of event B is the right end of the pole'
    inputs: {x: 5 m, ct: 0 m}
    formula: 2*(x - sqrt(3)/2*ct)
    expected: 10 m
    shown: ['$x''_B = \gamma(x_B - \beta ct_B) = 2 \times 5 = 10$ m']
    source: {cite: mit, at: 'Problem 4(a) (our own check)'}
    origin: page-own

  - id: p4-a-interval
    where: 'Problem 4(a), check: the interval of A and B in S'''
    inputs: {}
    formula: 10**2 - 8.66**2
    expected: '25'
    shown: ['$10^2 - 8.66^2 = 25\ \text{m}^2$']
    source: {cite: mit, at: 'Problem 4(a) (our own check)'}
    origin: page-own

  - id: p4-b-x
    answer: p4-b-x
    where: 'Problem 4(b), answer box: x of the left end at the vaulter''s time of B'
    inputs: {xp: 0 m, ctp: -8.660254 m}
    formula: 2*(xp + sqrt(3)/2*ctp)
    expected: -15 m
    tolerance: 0.001 m
    shown: ['id="p4-b-x"']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-b-t
    answer: p4-b-t
    where: 'Problem 4(b), answer box: c t of the left end at the vaulter''s time of B'
    inputs: {xp: 0 m, ctp: -8.660254 m}
    formula: 2*(ctp + sqrt(3)/2*xp)
    expected: -17.3 m
    shown: ['id="p4-b-t"']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  # Second route for (b): the left end's world line in S, x = beta c t, at c t = -17.3 m.
  - id: p4-b-worldline
    where: 'Problem 4(b), check: the left end on its world line in S'
    inputs: {ct: -17.3 m}
    formula: sqrt(3)/2*ct
    expected: -15 m
    tolerance: 0.05 m
    shown: ['it was at $x = -\tfrac{\sqrt 3}{2}\times 17.3 = -15$ m']
    source: {cite: mit, at: 'Problem 4(b) (our own check)'}
    origin: page-own

  - id: p4-c-x
    answer: p4-c-x
    where: 'Problem 4(c), answer box: x of the right end at the vaulter''s time of A'
    inputs: {xp: 10 m, ctp: 0 m}
    formula: 2*(xp + sqrt(3)/2*ctp)
    expected: 20 m
    tolerance: 0.001 m
    shown: ['id="p4-c-x"']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  - id: p4-c-t
    answer: p4-c-t
    where: 'Problem 4(c), answer box: c t of the right end at the vaulter''s time of A'
    inputs: {xp: 10 m, ctp: 0 m}
    formula: 2*(ctp + sqrt(3)/2*xp)
    expected: 17.3 m
    shown: ['id="p4-c-t"']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  # Second route for (c): the right end's world line in S, x = 5 m + beta c t, at c t = 17.3 m.
  - id: p4-c-worldline
    where: 'Problem 4(c), check: the right end on its world line in S'
    inputs: {x0: 5 m, ct: 17.3 m}
    formula: x0 + sqrt(3)/2*ct
    expected: 20 m
    tolerance: 0.05 m
    shown: ['it has reached $5 + \tfrac{\sqrt 3}{2}\times 17.3 = 20$ m']
    source: {cite: mit, at: 'Problem 4(c) (our own check)'}
    origin: page-own

  - id: p4-d-barn
    where: 'Problem 4(d): the contracted barn'
    inputs: {L: 8 m}
    formula: L/2
    expected: 4 m
    tolerance: 0.001 m
    shown: ['is $8\ \text{m}/\gamma = 4$ m long']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-left-door
    where: 'Problem 4(d): the left door at the instant of B, in S'''
    inputs: {tip: 10 m, back: 5 m}
    formula: tip - back/2
    expected: 7.5 m
    shown: ['at $x'' = 7.5$ m, and the right door']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-right-door
    where: 'Problem 4(d): the right door at the instant of B, in S'''
    inputs: {tip: 10 m, ahead: 3 m}
    formula: tip + ahead/2
    expected: 11.5 m
    shown: ['at $x'' = 11.5$ m']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-open-time
    where: 'Problem 4(d): c t at which the pole''s tip reaches the right door, in S'
    inputs: {gap: 3 m}
    formula: gap/(sqrt(3)/2)
    expected: 3.46 m
    shown: ['$ct = 3\ \text{m}/\beta = 3.46$ m']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-open-time-vaulter
    where: 'Problem 4(d): the same event in the vaulter''s frame'
    inputs: {x: 8 m, gap: 3 m}
    formula: 2*(gap/(sqrt(3)/2) - sqrt(3)/2*x)
    expected: -6.93 m
    shown: ['2\,(3.464 - 6.928) = -6.93$ m']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-both-closed
    where: 'Problem 4(d): how long both doors are closed in S'
    inputs: {gap: 3 m}
    formula: gap/(sqrt(3)/2)/c
    expected: 11.6 ns
    shown: ['about $11.6$ ns']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-door-speed
    where: 'Problem 4(d), check: the speed of the left door between the two sketches'
    inputs: {}
    formula: 7.5/8.66
    expected: '0.866'
    shown: ['its speed is $7.5/8.66 = 0.866$ of $c$']
    source: {cite: mit, at: 'Problem 4(d) (our own check)'}
    origin: page-own

  # ---- Problem 5: the slanted boost

  # Element (1,1) of R(-th) Lx R(th), written out as the sum over the matrix product.
  - id: p5-xx
    kind: identity
    answer: p5-xx
    where: 'Problem 5(a), answer box: against the matrix product, term by term'
    formula: 1 + (g - 1)*cos(th)**2
    equals: cos(th)*g*cos(th) + (-sin(th))*1*(-sin(th))
    samples:
      g: [1.25, 1.6666666666666667, 1.0416666666666667, 3.5714285714285716, 1]
      th: [0.5236, 0.2, 1.3, 0.8, 1.1]
    tolerance: 1e-9
    shown: ['id="p5-xx"']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  # Element (1,2) of the same product.
  - id: p5-xy
    kind: identity
    answer: p5-xy
    where: 'Problem 5(a), answer box: against the matrix product, term by term'
    formula: (g - 1)*sin(th)*cos(th)
    equals: cos(th)*g*sin(th) + (-sin(th))*1*cos(th)
    samples:
      g: [1.25, 1.6666666666666667, 1.0416666666666667, 3.5714285714285716]
      th: [0.5236, 0.2, 1.3, 0.8]
    tolerance: 1e-9
    shown: ['id="p5-xy"']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  # The time row against the invariant interval: c t' must equal sqrt(x'^2 + y'^2 - x^2 - y^2 + (ct)^2), with x' and
  # y' from the space rows of the page. w stands for ct. The samples keep c t' positive.
  - id: p5-t
    kind: identity
    answer: p5-t
    where: 'Problem 5(b), answer box: against the invariant interval, with the space rows of part (a)'
    formula: g*(w - b*(x*cos(th) + y*sin(th)))
    equals: sqrt(((1 + (g - 1)*cos(th)**2)*x + (g - 1)*sin(th)*cos(th)*y - g*b*cos(th)*w)**2 + ((g - 1)*sin(th)*cos(th)*x + (1 + (g - 1)*sin(th)**2)*y - g*b*sin(th)*w)**2 - x**2 - y**2 + w**2)
    samples:
      b: [0.6, 0.8, 0.28, 0.96]
      g: [1.25, 1.6666666666666667, 1.0416666666666667, 3.5714285714285716]
      th: [0.5236, 0.2, 1.3, 0.8]
      x: [1, 0.5, 3, 0.7]
      y: [2, 1.5, 0.5, 0.9]
      w: [3, 2.5, 4, 2.2]
    tolerance: 1e-8
    shown: ['id="p5-t"']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  # The vector form against the space row for x'.
  - id: p5-vector-form
    kind: identity
    where: 'Problem 5(b), formula "The slanted boost in vector form": its x component against the space row'
    formula: x + (g - 1)*(x*cos(th) + y*sin(th))*cos(th) - g*b*w*cos(th)
    equals: (1 + (g - 1)*cos(th)**2)*x + (g - 1)*sin(th)*cos(th)*y - g*b*cos(th)*w
    samples:
      b: [0.6, 0.8, 0.28, 0.96]
      g: [1.25, 1.6666666666666667, 1.0416666666666667, 3.5714285714285716]
      th: [0.5236, 0.2, 1.3, 0.8]
      x: [1, 0.5, 3, 0.7]
      y: [2, 1.5, 0.5, 0.9]
      w: [3, 2.5, 4, 2.2]
    tolerance: 1e-9
    shown: ['<Formula label="The slanted boost in vector form"']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-check-along
    where: 'Problem 5(b), number test: the coordinate along the velocity'
    inputs: {}
    formula: 1*cos(pi/6) + 2*sin(pi/6)
    expected: '1.866'
    shown: ['$0.866 + 1 = 1.866$']
    source: {cite: mit, at: 'Problem 5 (our own check)'}
    origin: page-own

  - id: p5-check-x
    where: 'Problem 5(b), number test: x'''
    inputs: {}
    formula: (1 + 0.25*cos(pi/6)**2)*1 + 0.25*sin(pi/6)*cos(pi/6)*2 - 1.25*0.6*cos(pi/6)*3
    expected: '-0.545'
    shown: ['$x'' = -0.545$']
    source: {cite: mit, at: 'Problem 5 (our own check)'}
    origin: page-own

  - id: p5-check-y
    where: 'Problem 5(b), number test: y'''
    inputs: {}
    formula: 0.25*sin(pi/6)*cos(pi/6)*1 + (1 + 0.25*sin(pi/6)**2)*2 - 1.25*0.6*sin(pi/6)*3
    expected: '1.108'
    shown: ['$y'' = 1.108$']
    source: {cite: mit, at: 'Problem 5 (our own check)'}
    origin: page-own

  - id: p5-check-t
    where: 'Problem 5(b), number test: c t'''
    inputs: {}
    formula: 1.25*(3 - 0.6*(1*cos(pi/6) + 2*sin(pi/6)))
    expected: '2.350'
    shown: ['$ct'' = 2.350$']
    source: {cite: mit, at: 'Problem 5 (our own check)'}
    origin: page-own

  - id: p5-check-interval
    where: 'Problem 5(b), number test: the interval in S'''
    inputs: {}
    formula: 0.297 + 1.228 - 5.525
    expected: '-4.00'
    shown: ['= 0.297 + 1.228 - 5.525 = -4.00$']
    source: {cite: mit, at: 'Problem 5 (our own check)'}
    origin: page-own

  # ---- Problem 6: the wave equation

  # dt'/dx by numerical differentiation of t' = g (t - v x / c^2).
  - id: p6-dx
    kind: identity
    answer: p6-dx
    where: 'Problem 6(a), answer box: against the numerical derivative of t'' with respect to x'
    formula: -g*v/c**2
    equals: deriv('g*(t0 - v*x/c**2)', 'x', x0)
    samples:
      g: [1.25, 1.6666666666666667, 3, 1.2]
      v: [0.6, 0.8, 0.3, 0.9]
      c: [1, 1, 2, 1.5]
      t0: [0.3, 1.1, 2, 0.7]
      x0: [0.5, 0.2, 1.4, 3]
    tolerance: 1e-7
    shown: ['id="p6-dx"']
    source: {cite: mit, at: 'Problem 6(a) (our own solution)'}
    origin: page-own

  # dx'/dt by numerical differentiation of x' = g (x - v t).
  - id: p6-dt
    kind: identity
    answer: p6-dt
    where: 'Problem 6(a), answer box: against the numerical derivative of x'' with respect to t'
    formula: -g*v
    equals: deriv('g*(x0 - v*x)', 'x', t0)
    samples:
      g: [1.25, 1.6666666666666667, 3, 1.2]
      v: [0.6, 0.8, 0.3, 0.9]
      t0: [0.3, 1.1, 2, 0.7]
      x0: [0.5, 0.2, 1.4, 3]
    tolerance: 1e-7
    shown: ['id="p6-dt"']
    source: {cite: mit, at: 'Problem 6(a) (our own solution)'}
    origin: page-own

  # Part (b) on a test function: F = x'^3 t'^2, written in the coordinates of S. Its wave operator computed in S by
  # numerical second derivatives must equal F_x'x' - F_t't'/c^2 = 6 x' t'^2 - 2 x'^3 / c^2.
  - id: p6-wave-operator
    kind: identity
    where: 'Problem 6(b), formula "The wave operator is invariant": tested on F = x''^3 t''^2 with numerical second derivatives in S'
    formula: deriv('(g*(x - v*t0))**3*(g*(t0 - v*x/c**2))**2', 'x', x0, 2) - deriv('(g*(x0 - v*x))**3*(g*(x - v*x0/c**2))**2', 'x', t0, 2)/c**2
    equals: 6*(g*(x0 - v*t0))*(g*(t0 - v*x0/c**2))**2 - 2*(g*(x0 - v*t0))**3/c**2
    samples:
      g: [1.25, 1.6666666666666667, 1.25]
      v: [0.6, 0.8, 1.2]
      c: [1, 1, 2]
      t0: [0.3, 1.1, 2]
      x0: [1.5, 0.2, 1.4]
    tolerance: 1e-5
    shown: ['<Formula label="The wave operator is invariant"']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
    origin: page-own

  # Part (b), last check: x - ct in the coordinates of S', with x = g (x' + b ct') and ct = g (ct' + b x').
  - id: p6-light-cone-coordinate
    kind: identity
    where: 'Problem 6(b), check: x - ct = gamma (1 - beta) (x'' - ct''), from the inverse transformation'
    formula: g*(xp + b*wp) - g*(wp + b*xp)
    equals: g*(1 - b)*(xp - wp)
    samples:
      b: [0.6, 0.8, 0.28, 0.96]
      g: [1.25, 1.6666666666666667, 1.0416666666666667, 3.5714285714285716]
      xp: [1.3, 0.5, 3, 0.7]
      wp: [0.4, 1.5, 0.5, 2.2]
    tolerance: 1e-9
    shown: ['$x - ct = \gamma(1 - \beta)(x'' - ct'')$']
    source: {cite: mit, at: 'Problem 6(b) (our own check)'}
    origin: page-own

