# Calculations on content/year-2/8.033/speed-of-light-michelson-morley.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 3 slides, with the page's own example.

page: content/year-2/8.033/speed-of-light-michelson-morley.mdx
calcs:
  - id: boosted-wave-equation
    kind: identity
    where: 'E = f(x − ct) written in x′ = x − vt, t′ = t is f(x′ − (c − v)t′); check it solves (1 − v²/c²)E_x′x′ − E_t′t′/c² + 2(v/c²)E_x′t′ = 0 with f = sin, c = 1, v = 0.3, at sample x′ (t′ = 0.5): second derivatives of sin(x′ − 0.7 t′) give −(1 − 0.09) + 0.49 + 2(0.3)(0.7) = 0'
    formula: -(1 - 0.09)*sin(x - 0.35) + 0.49*sin(x - 0.35) + 2*0.3*0.7*sin(x - 0.35)
    equals: 0*x
    samples: {x: [0.2, 1.1, 2.9]}
    tolerance: 1e-12
    shown: ['2\frac{v}{c^2}\frac{d^2E}{dx''dt''} = 0" cite']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: grb-ratio
    where: 'Δt/t ≲ 10² s/10¹⁷ s'
    inputs: {}
    formula: 1e2/1e17
    expected: '1e-15'
    tolerance: 1e-20
    shown: ['10^{17}\ \text{s}} = 10^{-15}']
    source: {cite: mit, at: 'slide 13'}
    origin: mit

  - id: grb-speed
    where: '10⁻¹⁵ c in nm/s'
    inputs: {}
    formula: 1e-15*3e8*1e9
    expected: '300'
    tolerance: 1
    shown: ['about $10^{-15}c \approx 300$ nm/s']
    source: {cite: mit, at: 'slide 13'}
    origin: mit

  - id: binary-years
    where: '2t v/c with t = 100,000 years, v = 300 km/s'
    inputs: {}
    formula: 2*100000*300/3e5
    expected: '200'
    tolerance: 1
    shown: ['approx 200\ \text{years}" cite']
    source: {cite: mit, at: 'slide 14'}
    origin: mit

  - id: binary-exact
    kind: identity
    where: 'd/(c − v) − d/(c + v) = 2dv/(c² − v²)'
    formula: d/(c - v) - d/(c + v)
    equals: 2*d*v/(c**2 - v**2)
    samples: {d: [1.0, 5.0], c: [3.0, 10.0], v: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['approx 200\ \text{years}" cite']
    source: {cite: mit, at: 'slide 14'}
    origin: mit

  - id: parallel-time
    kind: identity
    where: 'L/(c − v) + L/(c + v) = (2L/c)γ²'
    formula: L/(c - v) + L/(c + v)
    equals: (2*L/c)/(1 - v**2/c**2)
    samples: {L: [1.0, 11.0], c: [3.0, 10.0], v: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['frac{2L_\parallel}{c}\gamma^2, \qquad']
    source: {cite: mit, at: 'slide 16'}
    origin: mit

  - id: rotation-shift
    where: 'exact Δt′ − Δt over (L∥ + L⊥)/c × (v/c)² for small v/c (c = 1, L∥ = 5, L⊥ = 6, v = 0.001): → 1'
    inputs: {}
    formula: ((2*6/(1 - 0.001**2) - 2*5/sqrt(1 - 0.001**2)) - (2*6/sqrt(1 - 0.001**2) - 2*5/(1 - 0.001**2)))/((5 + 6)*0.001**2)
    expected: '1'
    tolerance: 0.01
    shown: ['left(\frac vc\right)^2" cite']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: v-over-c-squared
    where: '(30 km/s / 3e5 km/s)²'
    inputs: {}
    formula: (30/3e5)**2
    expected: '1e-8'
    tolerance: 1e-12
    shown: ['$(v/c)^2 \sim 10^{-8}$']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: wavelengths
    where: '11 m / 500 nm'
    inputs: {}
    formula: 11/500e-9
    expected: '2e7'
    tolerance: 0.3e7
    shown: ['$L_\parallel + L_\perp \approx 11$ m was about $2 \times 10^7$']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: expected-fringe
    where: '2.2e7 × 1e-8'
    inputs: {}
    formula: 11/500e-9*(30/3e5)**2
    expected: '0.2'
    tolerance: 0.03
    shown: ['about 0.2 of a fringe']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: michelson-nobel
    kind: fact
    where: 'Michelson''s Nobel Prize year, as on the slides'
    value: '1907'
    shown: ['the first American to win a Nobel Prize in the sciences (1907']
    source: {cite: mit, at: 'slide 15'}
    origin: mit

  - id: kennedy-thorndike
    kind: fact
    where: 'year of the Kennedy–Thorndike experiment, as on the slides'
    value: '1932'
    shown: ['Kennedy and Thorndike (1932)']
    source: {cite: mit, at: 'slide 20'}
    origin: mit

  - id: fizeau
    kind: fact
    where: 'year of Fizeau''s moving-water experiment, as on the slides'
    value: '1851'
    shown: ['(Fizeau, 1851)']
    source: {cite: mit, at: 'slide 20'}
    origin: mit

  - id: ex-fringe
    where: 'example: (2.4/633e-9) × 1e-8'
    inputs: {}
    formula: 2.4/633e-9*1e-8
    expected: '0.038'
    tolerance: 0.0005
    shown: ['times 10^{-8} \approx 0.038$']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-binary
    where: 'example: 2 × 1000 years × 100/300000, in years and days'
    inputs: {}
    formula: 2*1000*100/300000
    expected: '0.67'
    tolerance: 0.005
    shown: ['approx 0.67$ years, about 240 days']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-binary-days
    where: 'example: 0.667 years in days'
    inputs: {}
    formula: 2*1000*100/300000*365.25
    expected: '240'
    tolerance: 5
    shown: ['approx 0.67$ years, about 240 days']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own
