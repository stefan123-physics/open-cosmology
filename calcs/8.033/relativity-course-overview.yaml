# Calculations on content/year-2/8.033/relativity-course-overview.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.033 (Fall 2006, Tegmark) Lecture 1 slides (13 pages), with the page's own examples.

page: content/year-2/8.033/relativity-course-overview.mdx
calcs:
  - id: sr-year
    kind: fact
    where: 'year of special relativity, as on the slides'
    value: '1905'
    shown: ['relativity (Einstein, 1905 and 1916)', 'In 1905, at 26']
    source: {cite: mit, at: 'slides 5 and 8'}
    origin: mit

  - id: einstein-age
    where: 'Einstein''s age in 1905: born March 1879, papers from March 1905 on'
    inputs: {}
    formula: 1905 - 1879
    expected: '26'
    tolerance: 1e-12
    shown: ['In 1905, at 26', 'aged 26']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: gr-year
    kind: fact
    where: 'year general relativity was completed, as on the slides'
    value: '1916'
    shown: ['He completed general relativity in 1916', 'aged 26, and completed general relativity in 1916']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: history-dates
    kind: fact
    where: 'periods of slide 5: Newtonian mechanics 1600s, electromagnetism 1800–1875, stat mech 1850–1900, quantum mechanics 1900–1926'
    value: '1800 to 1875; 1850 to 1900; 1900 to 1926'
    shown: ['from about 1800 to 1875', 'from about 1850 to 1900', 'from 1900 to 1926']
    source: {cite: mit, at: 'slide 5'}
    origin: mit

  - id: principia
    kind: fact
    where: 'year of Newton''s Principia (slide 6 prints 1678)'
    value: '1687'
    shown: ['appeared in 1687, not 1678']
    source: {cite: mit, at: 'slide 6'}
    origin: slip
    note: 'Slide 6 prints 1678; the Principia''s title page (London) is dated 1687.'

  - id: einstein-born
    kind: fact
    where: 'Einstein''s year of birth (slide 7 prints 1899)'
    value: '1879'
    shown: ['born in 1879, not 1899']
    source: {cite: mit, at: 'slide 7'}
    origin: slip
    note: 'Slide 7 prints 1899; Einstein was born in Ulm on 14 March 1879 (consistent with age 26 in 1905 on slide 8).'

  - id: plan-count
    kind: fact
    where: 'class meetings in the plan of slide 4 (L1 to L39) and slide sets published on OCW (26)'
    value: '39 meetings; 26 slide sets'
    shown: ['up to 39; MIT published 26 sets of slides']
    source: {cite: mit, at: 'slide 4; OCW lecture notes list'}
    origin: mit

  - id: freq-range
    kind: fact
    where: 'observed range of electromagnetic frequencies, as on the slide'
    value: '1e3 Hz to 1e27 Hz'
    shown: ['from about $10^3$ Hz to $10^{27}$ Hz', 'from about $10^3$ to $10^{27}$ Hz']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: lambda-low
    where: 'example: λ = c/f at f = 1e3 Hz'
    inputs: {}
    formula: 3.00e8 / 1e3
    expected: '3.00e5'
    tolerance: 1e-12
    shown: ['= 3.00\times10^5$ m, or 300 km']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: lambda-high
    where: 'example: λ = c/f at f = 1e27 Hz'
    inputs: {}
    formula: 3.00e8 / 1e27
    expected: '3.00e-19'
    tolerance: 1e-12
    shown: ['= 3.00\times10^{-19}$ m']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: decades
    where: 'example: the range spans 27 − 3 = 24 powers of ten'
    inputs: {}
    formula: log10(1e27 / 1e3)
    expected: '24'
    tolerance: 1e-12
    shown: ['Twenty-four powers of ten apart']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: train-ratio
    where: 'example: v/c for a train at 50 m/s'
    inputs: {}
    formula: 50 / 3.00e8
    expected: '1.67e-7'
    tolerance: 0.002
    shown: ['= 1.67\times10^{-7}$', 'About two parts in ten million']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: mc2-gram
    where: 'example and quiz 3: E = mc² for m = 1 g'
    inputs: {}
    formula: 1e-3 * (3.00e8)**2
    expected: '9.0e13'
    tolerance: 1e-9
    shown: ['\text{m/s})^2 = 9.0\times10^{13}$ J', '= 9.0\\times10^{13}$ J. The answer']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: mc2-kg
    where: 'quiz 3, wrong choice: E = mc² for m = 1 kg'
    inputs: {}
    formula: 1 * (3.00e8)**2
    expected: '9.0e16'
    tolerance: 1e-9
    shown: ['9.0\\times10^{16}$ J would be for 1 kg']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: ligo
    kind: fact
    where: 'first detection of gravitational waves (GW150914, 14 September 2015), later development'
    value: '2015'
    shown: ['detected by LIGO in 2015']
    source: {ref: 'LIGO Scientific and Virgo Collaborations, Abbott et al. 2016, arXiv:1602.03837'}
    origin: later-data

  - id: eht-m87
    kind: fact
    where: 'first image of the M87 black hole shadow (published 10 April 2019), later development'
    value: '2019'
    shown: ['in the galaxy M87 in 2019']
    source: {ref: 'Event Horizon Telescope Collaboration 2019, ApJL 875, L1, arXiv:1906.11238'}
    origin: later-data
