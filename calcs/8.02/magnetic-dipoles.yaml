# Calculations on content/year-1/8.02/magnetic-dipoles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapters 8–9 and the Session 17 slides, with the page's own numbers.

page: content/year-1/8.02/magnetic-dipoles.mdx
calcs:
  - id: quiz-moment
    where: 'quiz 3: 10 × 2 × 0.01 = 0.2 A m²'
    inputs: {}
    formula: 10 * 2 * 0.01
    expected: '0.2'
    shown: ['0.01 = 0.2$ A m²']
    source: {cite: reading1, at: 'Eq. (8.4.8), p. 8'}
    origin: page-own

  - id: moment
    where: 'worked example (a): NIπR² ≈ 0.0314 A m²'
    inputs: {}
    formula: 50 * 0.5 * pi * 0.02**2
    expected: '0.0314'
    tolerance: '0.2%'
    shown: ['\pi(0.02)^2 \approx 0.0314$ A m²']
    source: {cite: reading1, at: 'Eq. (8.4.8), p. 8'}
    origin: page-own

  - id: torque
    where: 'worked example (b): μB sin 30° ≈ 3.14 × 10⁻³ N m'
    inputs: {}
    formula: 50 * 0.5 * pi * 0.02**2 * 0.2 * sin(pi / 6)
    expected: '3.14e-3'
    tolerance: '0.2%'
    shown: ['\approx 3.14 \times 10^{-3}$ N m']
    source: {cite: reading1, at: 'Eq. (8.4.9), p. 9'}
    origin: page-own

  - id: work
    where: 'worked example (c): 2μB ≈ 0.0126 J'
    inputs: {}
    formula: 2 * 50 * 0.5 * pi * 0.02**2 * 0.2
    expected: '0.0126'
    tolerance: '0.3%'
    shown: ['\approx 0.0126$ J']
    source: {cite: reading1, at: 'Eq. (8.4.11), p. 9'}
    origin: page-own

  - id: force
    where: 'worked example (d): μ dB/dz ≈ −0.0157 N'
    inputs: {}
    formula: 50 * 0.5 * pi * 0.02**2 * (-0.5)
    expected: '-0.0157'
    tolerance: '0.3%'
    shown: ['\approx -0.0157$ N']
    source: {cite: reading1, at: 'Eq. (8.4.15), p. 10'}
    origin: page-own
