# Calculations on content/year-1/8.02/8-02-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Neither MIT's Problem Solving 1 nor the Additional Problems of the course notes print solutions, so every formula
# answer is checked here by an independent route: a numerical integral, a vector sum of the Coulomb fields, a
# derivative of the torque, or a parametrised path.

page: content/year-1/8.02/8-02-problem-set-1.mdx
calcs:
  # ---- Problem 1

  - id: p1-example
    where: 'Problem 1, statement: the worked example of the session, the integral of x + y along the straight line to (1, 1)'
    inputs: {}
    formula: integrate('(s / sqrt(2) + s / sqrt(2))', 's', 0, sqrt(2))
    expected: '1.41421'
    shown: ['I = \int_C (x + y)\,ds = \sqrt 2']
    source: {cite: mit, at: 'Example 1, p. 1'}
    origin: mit

  - id: p1-I1
    answer: p1-a
    where: 'Problem 1(a), answer box and formula "The first piece"'
    inputs: {}
    formula: integrate('x + 0', 'x', 0, 1)
    expected: '0.5'
    shown: ['I_1 = \int_0^1 (x + 0)\,dx = \frac12']
    source: {cite: mit, at: 'Problem 1(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-I2
    answer: p1-b
    where: 'Problem 1(b), answer box and formula "The second piece"'
    inputs: {}
    formula: integrate('1 + y', 'y', 0, 1)
    expected: '1.5'
    shown: ['I_2 = \int_0^1 (1 + y)\,dy = 1 + \frac12 = \frac32']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-Iprime
    where: 'Problem 1(c), solution: the sum of the two pieces'
    inputs: {}
    formula: integrate('x', 'x', 0, 1) + integrate('1 + y', 'y', 0, 1)
    expected: '2'
    shown: ['$I'' = I_1 + I_2 = \tfrac12 + \tfrac32 = 2$']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-sqrt2
    where: 'Problem 1(c), hint and solution: the square root of 2'
    inputs: {}
    formula: sqrt(2)
    expected: '1.41'
    shown: ['$\sqrt 2$ is about 1.41.', 'I = \sqrt 2 \approx 1.41$']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-C3
    answer: p2-a
    where: 'Problem 2(a), answer box: F(0, y) . (dy j) along C3, from y = 1 down to 0'
    inputs: {}
    formula: integrate('y * 0 + (-0) * 1', 'y', 1, 0)
    expected: '0'
    shown: ['\int_{C_3} \vec F \cdot d\vec s = 0']
    source: {cite: mit, at: 'Problem 2(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p2-C2
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "The slanted side": F . ds along (1, 0) to (0, 1), parametrised by t in [0, 1] (x = 1 - t, y = t, dx = -dt, dy = dt), not by the arc length'
    inputs: {}
    formula: integrate('t * (-1) - (1 - t) * 1', 't', 0, 1)
    expected: '-1'
    shown: ['\int_{C_2} \vec F \cdot d\vec s = -\frac{1}{\sqrt 2}\int_0^{\sqrt 2} ds = -1']
    source: {cite: mit, at: 'Problem 2(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p2-C2-arclength
    where: 'Problem 2(b), formula "The slanted side": the arc-length route of the page'
    inputs: {}
    formula: -1 / sqrt(2) * integrate('1', 's', 0, sqrt(2))
    expected: '-1'
    shown: ['= -\frac{x + y}{\sqrt 2}\,ds = -\frac{ds}{\sqrt 2}']
    source: {cite: mit, at: 'Problem 2(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p2-green
    where: 'Problem 2(c): Green''s theorem, curl -2 times the area 1/2 of the triangle (area by integration)'
    inputs: {}
    formula: -2 * integrate('1 - x', 'x', 0, 1)
    expected: '-1'
    shown: ['Round the triangle, $0 + (-1) + 0 = -1$', 'so the double integral is $-2 \times \tfrac12 = -1$']
    source: {cite: mit, at: 'Problem 2(c) (our addition, our own solution)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-rectangle
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "Charge on the rectangle": against the double integral done as an integral over y of the integral over x'
    formula: k*a**2*b**2/4
    equals: integrate('k * y * a**2 / 2', 'y', 0, b)
    samples:
      k: [0.5, 5, 2, 1.3]
      a: [0.1, 2, 0.7, 1.5]
      b: [0.1, 2, 1.2, 0.4]
    tolerance: 1e-9
    shown: ['= \frac{k\,a^2 b^2}{4}']
    source: {cite: mit, at: 'Problem 3(a), p. 7 (our own solution)'}
    origin: page-own

  - id: p3-disc
    kind: identity
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "Charge on the disc": against the integral over r of the ring charge, the integral over theta done numerically'
    formula: 2*pi*k*R**3/3
    equals: integrate('k * r**2', 'r', 0, R) * integrate('1 - sin(t)', 't', 0, 2 * pi)
    samples:
      k: [0.5, 5, 2, 1.3]
      R: [0.1, 2, 0.7, 1.5]
    tolerance: 1e-8
    shown: ['= \frac{2\pi k R^3}{3}']
    source: {cite: mit, at: 'Problem 3(b), p. 7 (our own solution)'}
    origin: page-own

  # ---- Problem 4

  - id: p4-xz
    kind: identity
    answer: p4-a1
    where: 'Problem 4(a)(i), answer box: the dot product (a, b, 0) . (0, 1, 0) times A'
    formula: b*A
    equals: (a * 0 + b * 1 + 0 * 0) * A
    samples:
      a: [1, 10, 3, 7]
      b: [1, 10, 4, 2]
      A: [0.1, 2, 0.5, 1.2]
    tolerance: 1e-12
    shown: ['\Phi_E^{(xz)} = (a\,\hat i + b\,\hat j) \cdot \hat j\,A = bA']
    source: {cite: mit, at: 'Problem 4(a), p. 8 (our own solution)'}
    origin: page-own

  - id: p4-cylinder
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box and formula "Flux through the half side of the cylinder": against the numerical integral of E0 sin(theta) R over theta from 0 to pi, times h'
    formula: 2*E0*R*h
    equals: integrate('E0 * sin(t) * R', 't', 0, pi) * h
    samples:
      E0: [1, 10, 3, 6]
      R: [0.1, 2, 0.5, 1.1]
      h: [0.1, 2, 1, 0.3]
    tolerance: 1e-8
    shown: ['= 2E_0 R h']
    source: {cite: mit, at: 'Problem 4(b), p. 9 (our own solution)'}
    origin: page-own

  # ---- Problem 5

  - id: p5-circle
    kind: identity
    answer: p5-c
    where: 'Problem 5(c), answer box and formula "Round the circle": against y dx - x dy integrated along x = R cos t, y = R sin t'
    formula: -2*pi*R**2
    equals: integrate('R * sin(t) * (-R * sin(t)) - R * cos(t) * (R * cos(t))', 't', 0, 2 * pi)
    samples:
      R: [0.1, 3, 1, 1.7]
    tolerance: 1e-8
    shown: ['= -2\pi R^2']
    source: {cite: reading1, at: 'Additional Problem 1.11.1(a), p. 22 (our addition, our own solution)'}
    origin: page-own

  # ---- Problem 6

  - id: p6-field
    kind: identity
    answer: p6-a
    where: 'Problem 6(a), answer box and formula "Field on the y-axis": against the sum of the x components of the two Coulomb fields, each written out'
    formula: 2*ke*q*a/(a**2 + y**2)**(3/2)
    equals: ke * q * (0 - (-a)) / ((0 - (-a))**2 + y**2)**1.5 + ke * (-q) * (0 - a) / ((0 - a)**2 + y**2)**1.5
    samples:
      ke: [1, 10, 8.99, 3]
      q: [0.5, 5, 1, 2]
      a: [0.1, 2, 1, 0.5]
      y: [-3, 3, 0, 1.2]
    tolerance: 1e-9
    shown: ['\vec E = \frac{2k_e q a}{(a^2 + y^2)^{3/2}}\,\hat i']
    source: {cite: reading1, at: 'Additional Problem 1.11.3, p. 22 (our own solution)'}
    origin: page-own

  # ---- Problem 7

  - id: p7-lambda0
    kind: identity
    answer: p7-a
    where: 'Problem 7(a), answer box and formula "Total charge on the semicircle": Q divided by the numerical integral of R cos(theta) over the semicircle'
    formula: Q/(2*R)
    equals: Q / integrate('R * cos(t)', 't', -pi / 2, pi / 2)
    samples:
      Q: [0.5, 5, 1, 2.2]
      R: [0.1, 2, 1, 0.6]
    tolerance: 1e-8
    shown: ['\lambda_0 = \frac{Q}{2R}']
    source: {cite: reading2, at: 'Additional Problem 2.15.4(a), p. 41 (our own solution)'}
    origin: page-own

  - id: p7-force
    kind: identity
    answer: p7-b
    where: 'Problem 7(b), answer box and formula "Force on the charge at the centre": against the numerical sum of the y parts of the Coulomb forces of the pieces, with lambda0 = Q/(2R)'
    formula: -pi*ke*q*Q/(4*R**2)
    equals: integrate('-ke * q * (Q / (2 * R)) * cos(t) * R / R**2 * cos(t)', 't', -pi / 2, pi / 2)
    samples:
      ke: [1, 10, 8.99, 3]
      q: [0.5, 5, 1, 2]
      Q: [0.5, 5, 1, 2.2]
      R: [0.1, 2, 1, 0.6]
    tolerance: 1e-8
    shown: ['= -\frac{\pi k_e q Q}{4R^2}']
    source: {cite: reading2, at: 'Additional Problem 2.15.4(b), p. 41 (our own solution)'}
    origin: page-own

  - id: p7-factor
    where: 'Problem 7(b), check: the factor pi/4'
    inputs: {}
    formula: pi / 4
    expected: '0.79'
    shown: ['The factor $\pi/4 \approx 0.79$']
    source: {cite: reading2, at: 'Additional Problem 2.15.4(b), p. 41 (our own solution)'}
    origin: page-own

  - id: p7-even-factor
    where: 'Problem 7(b), check: the factor 2/pi of an evenly charged semicircle (lambda = Q/(pi R), integral of cos theta = 2)'
    inputs: {}
    formula: integrate('cos(t)', 't', -pi / 2, pi / 2) / pi
    expected: '0.64'
    shown: ['An even spread would give $2/\pi \approx 0.64$']
    source: {cite: reading2, at: 'Additional Problem 2.15.4(b), p. 41 (our own solution)'}
    origin: page-own

  # ---- Problem 8

  - id: p8-given
    kind: fact
    where: 'Problem 8, statement: the charges, e, the separation and the field, from the notes'
    shown: ['$e = 1.6 \times 10^{-19}$ C', '$d = 10^{-9}$ m', '$\vec E = (3\,\hat i + 3\,\hat j)$ N/C']
    source: {cite: reading2, at: 'Additional Problem 2.15.8, pp. 42 and 43'}
    origin: mit

  - id: p8-p
    answer: p8-a
    where: 'Problem 8(a), answer box and formula "The dipole moment"'
    inputs: {e: 1.6e-19 C, d: 1e-9 m}
    formula: 2 * e * d
    expected: 3.2e-28 C*m
    shown: ['= 3.2 \times 10^{-28}\ \text{C m}\,\hat j']
    source: {cite: reading2, at: 'Additional Problem 2.15.8(a), p. 43 (our own solution)'}
    origin: page-own

  - id: p8-tau
    answer: p8-b
    where: 'Problem 8(b), answer box and formula "The torque on the dipole": the size p E sin(45°), with E = 3 sqrt(2) N/C'
    inputs: {e: 1.6e-19 C, d: 1e-9 m, E: 4.242640687 N/C, deg: 45}
    formula: 2 * e * d * E * sin(deg * pi / 180)
    expected: 9.6e-28 N*m
    shown: ['= -9.6 \times 10^{-28}\ \text{N m}\,\hat k']
    source: {cite: reading2, at: 'Additional Problem 2.15.8(b), p. 43 (our own solution)'}
    origin: page-own

  - id: p8-field-size
    where: 'Problem 8(b), check: the size of the field 3 i + 3 j'
    inputs: {Ex: 3 N/C, Ey: 3 N/C}
    formula: sqrt(Ex**2 + Ey**2)
    expected: 4.24 N/C
    shown: ['the field has the size $3\sqrt 2$ N/C']
    source: {cite: reading2, at: 'Additional Problem 2.15.8(b), p. 43 (our own solution)'}
    origin: page-own

  # ---- Problem 9

  - id: p9-omega
    kind: identity
    answer: p9-b
    where: 'Problem 9(b), answer box and formula "Angular frequency of the dipole": against the square root of the slope at theta = 0 of the restoring torque 2qaE sin(theta), divided by I'
    formula: sqrt(2*q*a*E/I)
    equals: sqrt(deriv('2 * q * a * E * sin(t)', 't', 0) / I)
    samples:
      q: [0.5, 5, 1, 2]
      a: [0.1, 2, 1, 0.4]
      E: [1, 10, 3, 6]
      I: [0.1, 5, 1, 2.5]
    tolerance: 1e-6
    shown: ['\omega = \sqrt{\frac{2qaE}{I}} = \sqrt{\frac{pE}{I}}']
    source: {cite: reading2, at: 'Additional Problem 2.15.5, p. 41 (our own solution)'}
    origin: page-own

  # ---- Problem 10

  - id: p10-zero
    answer: p10-a-dist
    where: 'Problem 10(a), answer box and formula "Where the field vanishes": the distance s/d from -q, by a numerical solve of 1/x^2 = 3/(x + 1)^2 to the left of -q'
    inputs: {}
    formula: solve('1 / x**2 - 3 / (x + 1)**2', 'x', 0.5, 5)
    expected: '1.37'
    shown: ['s = \frac{d}{\sqrt 3 - 1} \approx 1.37\,d']
    source: {cite: reading2, at: 'Conceptual Question 3, p. 38 (our addition, our own solution)'}
    origin: page-own

  - id: p10-zero-closed
    where: 'Problem 10(a), formula "Where the field vanishes": the closed form 1/(sqrt(3) - 1)'
    inputs: {}
    formula: 1 / (sqrt(3) - 1)
    expected: '1.37'
    shown: ['there the distances are $1.37\,d$']
    source: {cite: reading2, at: 'Conceptual Question 3, p. 38 (our addition, our own solution)'}
    origin: page-own

  - id: p10-far
    where: 'Problem 10(a), check: the distance from +3q'
    inputs: {}
    formula: 1 / (sqrt(3) - 1) + 1
    expected: '2.37'
    shown: ['and $2.37\,d$']
    source: {cite: reading2, at: 'Conceptual Question 3, p. 38 (our addition, our own solution)'}
    origin: page-own

  - id: p10-square-near
    where: 'Problem 10(a), check: the square of 1.37'
    inputs: {}
    formula: (1 / (sqrt(3) - 1))**2
    expected: '1.87'
    shown: ['whose squares, 1.87 and 5.60']
    source: {cite: reading2, at: 'Conceptual Question 3, p. 38 (our addition, our own solution)'}
    origin: page-own

  - id: p10-square-far
    where: 'Problem 10(a), check: the square of 2.37, three times that of 1.37'
    inputs: {}
    formula: 3 * (1 / (sqrt(3) - 1))**2
    expected: '5.60'
    shown: ['whose squares, 1.87 and 5.60']
    source: {cite: reading2, at: 'Conceptual Question 3, p. 38 (our addition, our own solution)'}
    origin: page-own
