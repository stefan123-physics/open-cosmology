# Calculations on content/year-1/8.02/conductors-and-capacitors.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapters 4–5 and the Session 7 slides, with the page's own numbers.

page: content/year-1/8.02/conductors-and-capacitors.mdx
calcs:
  - id: earth-capacitance
    where: 'section "Capacitors": 4πε₀ × 6.4 × 10⁶ m ≈ 7 × 10⁻⁴ F'
    inputs: {eps0: 8.85e-12, a: 6.4e6}
    formula: 4 * pi * eps0 * a
    expected: '7e-4'
    tolerance: '3%'
    shown: ['has only about $7 \times 10^{-4}$ F']
    source: {cite: reading3, at: 'slide 28'}
    origin: mit

  - id: one-farad-charge
    where: 'section "Capacitors": 1 F at 12 V holds 12 C'
    inputs: {C: 1, V: 12}
    formula: C * V
    expected: '12'
    shown: ['A 1 F capacitor at 12 V holds 12 C']
    source: {cite: reading3, at: 'slide 29'}
    origin: mit

  - id: one-farad-energy
    where: 'section "Energy stored in a capacitor": ½ (1 F)(12 V)² = 72 J'
    inputs: {C: 1, V: 12}
    formula: 0.5 * C * V**2
    expected: '72'
    shown: ['stores 72 J']
    source: {cite: reading3, at: 'slide 38'}
    origin: mit

  - id: plate-capacitance
    where: 'worked example (a): ε₀A/d ≈ 8.85 × 10⁻¹¹ F'
    inputs: {eps0: 8.854e-12, A: 0.01, d: 0.001}
    formula: eps0 * A / d
    expected: '8.85e-11'
    tolerance: '0.1%'
    shown: ['/0.001 \approx 8.85 \times 10^{-11}$ F']
    source: {cite: reading2, at: 'Eq. (5.2.4), p. 5'}
    origin: page-own

  - id: plate-charge
    where: 'worked example (b): Q = CΔV ≈ 8.85 × 10⁻⁹ C'
    inputs: {eps0: 8.854e-12, A: 0.01, d: 0.001, V: 100}
    formula: eps0 * A / d * V
    expected: '8.85e-9'
    tolerance: '0.1%'
    shown: ['\approx 8.85 \times 10^{-9}$ C']
    source: {cite: reading2, at: 'Eq. (5.1.1), p. 2'}
    origin: page-own

  - id: plate-energy
    where: 'worked example (d): ½CΔV² ≈ 4.43 × 10⁻⁷ J'
    inputs: {eps0: 8.854e-12, A: 0.01, d: 0.001, V: 100}
    formula: 0.5 * eps0 * A / d * V**2
    expected: '4.43e-7'
    tolerance: '0.1%'
    shown: ['(100)^2 \approx 4.43 \times 10^{-7}$ J']
    source: {cite: reading3, at: 'slide 36'}
    origin: page-own

  - id: energy-density
    where: 'worked example (d): ½ε₀E² ≈ 0.0443 J/m³'
    inputs: {eps0: 8.854e-12, E: 1e5}
    formula: 0.5 * eps0 * E**2
    expected: '0.0443'
    tolerance: '0.1%'
    shown: ['\approx 0.0443$ J/m³']
    source: {cite: reading2, at: 'Eq. (5.4.4), p. 13'}
    origin: page-own

  - id: energy-from-density
    where: 'worked example (d): 0.0443 J/m³ × 10⁻⁵ m³ = 4.43 × 10⁻⁷ J'
    inputs: {eps0: 8.854e-12, E: 1e5}
    formula: 0.5 * eps0 * E**2 * 0.01 * 0.001
    expected: '4.43e-7'
    tolerance: '0.1%'
    shown: ['again $4.43 \times 10^{-7}$ J']
    source: {cite: reading2, at: 'Eq. (5.4.3), p. 13'}
    origin: page-own
