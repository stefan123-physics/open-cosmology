# Calculations on content/year-1/8.02/generating-em-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 13 and the Session 32 slides, with the page's own numbers.

page: content/year-1/8.02/generating-em-waves.mdx
calcs:
  - id: am-wavelength
    where: 'section "Dipole radiation": c/f at 700 kHz ≈ 429 m'
    inputs: {}
    formula: 3e8 / 700e3
    expected: '429'
    tolerance: '0.2%'
    shown: ['$\lambda = c/f \approx 429$ m']
    source: {cite: reading2, at: 'slide 18'}
    origin: mit

  - id: am-quarter
    where: 'section "Dipole radiation": λ/4 ≈ 107 m'
    inputs: {}
    formula: 3e8 / 700e3 / 4
    expected: '107'
    tolerance: '0.3%'
    shown: ['a quarter wavelength is about 107 m']
    source: {cite: reading2, at: 'slide 18'}
    origin: mit

  - id: spark-rc
    where: 'section "Spark-gap": RC = (4.5 × 10⁶)(33 × 10⁻¹²) ≈ 1.5 × 10⁻⁴ s'
    inputs: {}
    formula: 4.5e6 * 33e-12
    expected: '1.5e-4'
    tolerance: '1.5%'
    shown: ['about $1.5 \times 10^{-4}$ s']
    source: {cite: reading2, at: 'slide 24'}
    origin: mit

  - id: spark-frequency
    where: 'section "Spark-gap": c/(12.4 cm) ≈ 2.4 GHz'
    inputs: {}
    formula: 3e10 / 12.4 / 1e9
    expected: '2.4'
    tolerance: '1%'
    shown: ['$c/4\ell \approx 2.4$ GHz']
    source: {cite: reading2, at: 'slide 24'}
    origin: mit

  - id: fm-wavelength
    where: 'worked example (a): c/f ≈ 3.0 m'
    inputs: {}
    formula: 2.998e8 / 1e8
    expected: '3.0'
    tolerance: '0.2%'
    shown: ['/10^8 \approx 3.0$ m']
    source: {cite: reading2, at: 'slide 18'}
    origin: page-own

  - id: fm-quarter
    where: 'worked example (a): λ/4 ≈ 0.75 m'
    inputs: {}
    formula: 2.998e8 / 1e8 / 4
    expected: '0.75'
    tolerance: '0.2%'
    shown: ['a quarter is about 0.75 m']
    source: {cite: reading2, at: 'slide 17'}
    origin: page-own

  - id: sheet-E1
    where: 'worked example (b): vσ/(2ε₀c) ≈ 1.9 × 10⁻⁴ V/m'
    inputs: {eps0: 8.854e-12, c: 2.998e8}
    formula: 1 * 1e-6 / (2 * eps0 * c)
    expected: '1.9e-4'
    tolerance: '1%'
    shown: ['\approx 1.9 \times 10^{-4}$ V/m']
    source: {cite: reading1, at: 'Eq. (13.8.6), p. 28'}
    origin: page-own

  - id: sheet-S
    where: 'worked example (b): σ²v²/(4ε₀c) ≈ 9.4 × 10⁻¹¹ W/m²'
    inputs: {eps0: 8.854e-12, c: 2.998e8}
    formula: 1e-12 * 1 / (4 * eps0 * c)
    expected: '9.4e-11'
    tolerance: '0.5%'
    shown: ['\approx 9.4 \times 10^{-11}$ W/m²']
    source: {cite: reading1, at: 'Eq. (13.8.12), p. 29'}
    origin: page-own

  - id: sheet-work
    where: 'worked example (b): σ²v²/(2ε₀c) ≈ 1.9 × 10⁻¹⁰ W/m²'
    inputs: {eps0: 8.854e-12, c: 2.998e8}
    formula: 1e-12 * 1 / (2 * eps0 * c)
    expected: '1.9e-10'
    tolerance: '1%'
    shown: ['$1.9 \times 10^{-10}$ W/m² of work']
    source: {cite: reading1, at: 'Eq. (13.8.9), p. 28'}
    origin: page-own
