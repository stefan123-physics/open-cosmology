# Calculations on content/year-1/8.02/8-02-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Neither MIT's Problem Solving 2 nor the Additional Problems of the course notes print solutions, so every formula
# answer is checked here by an independent route: a numerical integral over the charge, a numerical derivative of the
# potential, a vector sum of Coulomb fields, or a count of the pairs by corner.

page: content/year-1/8.02/8-02-problem-set-2.mdx
calcs:
  - id: ke-value
    kind: fact
    where: 'What you need: the value of k_e used for numbers'
    shown: ['$k_e = 8.99 \times 10^9$ N m²/C²']
    source: {cite: reading1, at: 'Eq. (2.2.2), p. 3 (8.9875 × 10⁹ there, rounded here)'}
    origin: mit

  # ---- Problem 1

  - id: p1-sigma
    kind: identity
    answer: p1-a
    where: 'Problem 1(a), answer box and formula "Surface density of the tube": against Q over the area of the side, the rim length found as the integral of R dθ'
    formula: Q/(2*pi*R*L)
    equals: Q / (integrate('R', 't', 0, 2 * pi) * L)
    samples:
      Q: [0.5, 5, 1, 2]
      R: [0.01, 0.5, 0.1, 0.3]
      L: [1, 10, 2, 5]
    tolerance: 1e-9
    shown: ['\sigma = \frac{Q}{2\pi R L}']
    source: {cite: mit, at: 'Problem 1, Question 1(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-lambda
    kind: identity
    answer: p1-b
    where: 'Problem 1(b), answer box: Q/L, against the charge on a unit length of the side, sigma times 2 pi R'
    formula: Q/L
    equals: 2 * pi * R * Q / (2 * pi * R * L)
    samples:
      Q: [0.5, 5, 1, 2]
      R: [0.01, 0.5, 0.1, 0.3]
      L: [1, 10, 2, 5]
    tolerance: 1e-12
    shown: ['so $\lambda = Q/L$, in C/m']
    source: {cite: mit, at: 'Problem 1, Question 1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-lambda-sigma
    kind: identity
    answer: p1-c
    where: 'Problem 1(c), answer box and formula "Line density from surface density": against the integral of sigma R dθ round the rim'
    formula: 2*pi*R*sigma
    equals: integrate('sigma * R', 't', 0, 2 * pi)
    samples:
      sigma: [0.1, 5, 1, 2]
      R: [0.01, 0.5, 0.1, 0.3]
    tolerance: 1e-9
    shown: ['\lambda = 2\pi R\,\sigma']
    source: {cite: mit, at: 'Problem 1, Question 1(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-rho
    kind: identity
    answer: p1-d
    where: 'Problem 1(d), answer box and formula "Volume density of the solid cylinder": against Q over the volume built from thin shells 2 pi r L dr'
    formula: Q/(pi*R**2*L)
    equals: Q / integrate('2 * pi * r * L', 'r', 0, R)
    samples:
      Q: [0.5, 5, 1, 2]
      R: [0.01, 0.5, 0.1, 0.3]
      L: [1, 10, 2, 5]
    tolerance: 1e-9
    shown: ['\rho = \frac{Q}{\pi R^2 L}']
    source: {cite: mit, at: 'Problem 1, Question 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-lambda-rho
    kind: identity
    answer: p1-e
    where: 'Problem 1(e), answer box and formula "Line density from volume density": against the integral of rho over the cross-section, in rings 2 pi r dr'
    formula: pi*R**2*rho
    equals: integrate('2 * pi * r * rho', 'r', 0, R)
    samples:
      rho: [0.1, 5, 1, 2]
      R: [0.01, 0.5, 0.1, 0.3]
    tolerance: 1e-9
    shown: ['\lambda = \pi R^2 \rho']
    source: {cite: mit, at: 'Problem 1, Question 2(c), p. 3 (our own solution)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-axis
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "The field on the axis": against the numerical integral of the choice marked right in 2(a)'
    formula: ke*Q/(a*(a+L))
    equals: integrate('ke * (Q / L) / (L + a - x)**2', 'x', 0, L)
    samples:
      ke: [1, 10, 3, 5]
      Q: [0.5, 5, 1, 2]
      L: [0.1, 2, 1.3, 0.5]
      a: [0.1, 2, 0.7, 1.5]
    tolerance: 1e-8
    shown: ['= \frac{k_e \lambda L}{a(L + a)} = \frac{k_e Q}{a(L + a)}']
    source: {cite: mit, at: 'Problem 2(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p2-point-limit
    kind: limit
    where: 'Problem 2(c): as L goes to 0 with Q fixed, the field tends to k_e Q/a² (here k_e = Q = a = 1)'
    formula: 1/(1*(1+L))
    vary: {L: [1e-2, 1e-4, 1e-6]}
    limit: '1'
    tolerance: 1e-5
    shown: ['$k_eQ/(a(L + a)) \to k_eQ/a^2$ as $L \to 0$']
    source: {cite: mit, at: 'Problem 2(c), p. 4 (our own solution)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-piece
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "The field of one piece of the rod": against the size k_e lam/r² times the fraction y/r'
    formula: ke*lam*y/(x**2+y**2)**(3/2)
    equals: ke * lam / (x**2 + y**2) * (y / sqrt(x**2 + y**2))
    samples:
      ke: [1, 10, 3, 5]
      lam: [0.5, 5, 1, 2]
      x: [-1, 1, 0.3, -0.6]
      y: [0.1, 2, 0.7, 1.2]
    tolerance: 1e-12
    shown: ['dE_y = \frac{k_e \lambda\,y\,dx}{(x^2 + y^2)^{3/2}}']
    source: {cite: mit, at: 'Problem 3, p. 4 (our own solution)'}
    origin: page-own

  - id: p3-bisector
    kind: identity
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "The field on the perpendicular bisector": against the numerical integral of dE_y over the rod'
    formula: ke*lam*L/(y*sqrt(y**2+L**2/4))
    equals: integrate('ke * lam * y / (x**2 + y**2)**1.5', 'x', -L / 2, L / 2)
    samples:
      ke: [1, 10, 3, 5]
      lam: [0.5, 5, 1, 2]
      L: [0.1, 2, 1.4, 0.5]
      y: [0.1, 3, 0.6, 2]
    tolerance: 1e-8
    shown: ['= \frac{k_e \lambda L}{y\sqrt{y^2 + L^2/4}}']
    source: {cite: mit, at: 'Problem 3, p. 4 (our addition, our own solution)'}
    origin: page-own

  - id: p3-line-limit
    kind: limit
    where: 'Problem 3(b), check: for y much smaller than L the field tends to 2 k_e lam/y (here k_e = lam = y = 1)'
    formula: L/(1*sqrt(1+L**2/4))
    vary: {L: [1e3, 1e5, 1e7]}
    limit: '2'
    tolerance: 1e-5
    shown: ['$E_y \to 2k_e\lambda/y$']
    source: {cite: mit, at: 'Problem 3, p. 4 (our addition, our own solution)'}
    origin: page-own

  - id: p3-point-limit
    kind: limit
    where: 'Problem 3(c): as L goes to 0 with lam L = Q fixed, E_y tends to k_e Q/y² (here k_e = Q = y = 1, lam = 1/L)'
    formula: (1/L)*L/(1*sqrt(1+L**2/4))
    vary: {L: [1e-2, 1e-4, 1e-6]}
    limit: '1'
    tolerance: 1e-4
    shown: ['\to k_eQ/(y \cdot y) = k_eQ/y^2$']
    source: {cite: mit, at: 'Problem 3, p. 4 (our addition, our own solution)'}
    origin: page-own

  # ---- Problem 4

  - id: p4-tube
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box and formula "The field on the axis of the tube": against the numerical sum of ring fields over the height'
    formula: ke*Q/h*(1/sqrt(R**2+(z-h)**2)-1/sqrt(R**2+z**2))
    equals: integrate('ke * Q / h * (z - w) / (R**2 + (z - w)**2)**1.5', 'w', 0, h)
    samples:
      ke: [1, 10, 3, 5]
      Q: [0.5, 5, 1, 2]
      R: [0.1, 1, 0.5, 0.3]
      h: [0.1, 1, 0.8, 0.5]
      z: [1.2, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['= \frac{k_e Q}{h}\left(\frac{1}{\sqrt{R^2 + (z - h)^2}} - \frac{1}{\sqrt{R^2 + z^2}}\right)']
    source: {cite: reading1, at: 'Additional Problem 2.15.6(a), p. 41 (our own solution)'}
    origin: page-own

  - id: p4-cylinder
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box and formula "The field on the axis of the solid cylinder": against the numerical sum of disc fields (sigma = rho dz, 1/(2 eps0) = 2 pi k_e) over the height'
    formula: 2*ke*Q/(R**2*h)*(h-sqrt(z**2+R**2)+sqrt((z-h)**2+R**2))
    equals: integrate('2 * pi * ke * Q / (pi * R**2 * h) * (1 - (z - w) / sqrt((z - w)**2 + R**2))', 'w', 0, h)
    samples:
      ke: [1, 10, 3, 5]
      Q: [0.5, 5, 1, 2]
      R: [0.1, 1, 0.5, 0.3]
      h: [0.1, 1, 0.8, 0.5]
      z: [1.2, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['= 2\pi k_e\rho\left(h - \sqrt{z^2 + R^2} + \sqrt{(z - h)^2 + R^2}\right)']
    source: {cite: reading1, at: 'Additional Problem 2.15.6(b), p. 42 (our own solution)'}
    origin: page-own

  - id: p4-tube-number
    where: 'Problem 4(b), check: the tube field at R = 0.5 m, h = 0.8 m, z = 1.5 m, in units of k_e Q per m²'
    inputs: {R: 0.5, h: 0.8, z: 1.5}
    formula: (1 / sqrt(R**2 + (z - h)**2) - 1 / sqrt(R**2 + z**2)) / h
    expected: '0.66'
    shown: ['$0.66\,k_eQ$ per m² for the tube']
    source: {cite: reading1, at: 'Additional Problem 2.15.6, p. 41 (our own solution)'}
    origin: page-own

  - id: p4-cylinder-number
    where: 'Problem 4(b), check: the solid-cylinder field at R = 0.5 m, h = 0.8 m, z = 1.5 m, in units of k_e Q per m²'
    inputs: {R: 0.5, h: 0.8, z: 1.5}
    formula: 2 / (R**2 * h) * (h - sqrt(z**2 + R**2) + sqrt((z - h)**2 + R**2))
    expected: '0.79'
    shown: ['$0.79\,k_eQ$ per m² for the cylinder']
    source: {cite: reading1, at: 'Additional Problem 2.15.6, p. 42 (our own solution)'}
    origin: page-own

  # ---- Problem 5

  - id: p5-A
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "The potential at A": against the numerical integral of k_e alpha x/(x + d)'
    formula: ke*alpha*(L-d*log((L+d)/d))
    equals: integrate('ke * alpha * x / (x + d)', 'x', 0, L)
    samples:
      ke: [1, 10, 3, 5]
      alpha: [0.5, 5, 1, 2]
      L: [0.1, 2, 1.4, 0.5]
      d: [0.1, 2, 0.4, 1.1]
    tolerance: 1e-8
    shown: ['= k_e\alpha\left(L - d\ln\frac{L + d}{d}\right)']
    source: {cite: reading2, at: 'Additional Problem 3.10.5(b), p. 27 (our own solution)'}
    origin: page-own

  - id: p5-B
    kind: identity
    answer: p5-c
    where: 'Problem 5(c), answer box and formula "The potential at B": against the numerical integral of k_e alpha x over the distance from (x, 0) to (L/2, b)'
    formula: ke*alpha*(L/2)*log((sqrt(L**2/4+b**2)+L/2)/(sqrt(L**2/4+b**2)-L/2))
    equals: integrate('ke * alpha * x / sqrt((x - L / 2)**2 + b**2)', 'x', 0, L)
    samples:
      ke: [1, 10, 3, 5]
      alpha: [0.5, 5, 1, 2]
      L: [0.1, 2, 1.4, 0.5]
      b: [0.1, 2, 0.9, 1.5]
    tolerance: 1e-8
    shown: ['= \frac{k_e\alpha L}{2}\,\ln\frac{\sqrt{L^2/4 + b^2} + L/2}{\sqrt{L^2/4 + b^2} - L/2}']
    source: {cite: reading2, at: 'Additional Problem 3.10.5(c), p. 27 (our own solution)'}
    origin: page-own

  - id: p5-B-asinh
    kind: identity
    where: 'Problem 5(c), solution: the same result written with asinh'
    formula: ke*alpha*L*asinh(L/(2*b))
    equals: ke * alpha * (L / 2) * log((sqrt(L**2 / 4 + b**2) + L / 2) / (sqrt(L**2 / 4 + b**2) - L / 2))
    samples:
      ke: [1, 10, 3, 5]
      alpha: [0.5, 5, 1, 2]
      L: [0.1, 2, 1.4, 0.5]
      b: [0.1, 2, 0.9, 1.5]
    tolerance: 1e-10
    shown: ['$k_e\alpha L\,\operatorname{asinh}(L/(2b))$']
    source: {cite: reading2, at: 'Additional Problem 3.10.5(c), p. 27 (our own solution)'}
    origin: page-own

  # ---- Problem 6

  - id: p6-Ex
    kind: identity
    answer: p6-a1
    where: 'Problem 6(a), answer box: E_x against minus the numerical x derivative of V'
    formula: 3*E0*a**3*x*z/(x**2+y**2+z**2)**(5/2)
    equals: -deriv('V0 - E0 * z + E0 * a**3 * z / (t**2 + y**2 + z**2)**1.5', 't', x)
    samples:
      V0: [1, 2, 3, 4]
      E0: [1, 10, 3, 5]
      a: [0.1, 1, 0.5, 0.8]
      x: [0.5, 2, 1.1, 0.7]
      y: [0.5, 2, 0.9, 1.6]
      z: [0.5, 2, 1.3, 0.6]
    tolerance: 1e-6
    shown: ['E_x = -\frac{\partial V}{\partial x} = \frac{3E_0 a^3 x z}{(x^2 + y^2 + z^2)^{5/2}}']
    source: {cite: reading2, at: 'Additional Problem 3.10.4, p. 27 (our own solution)'}
    origin: page-own

  - id: p6-Ey
    kind: identity
    answer: p6-a2
    where: 'Problem 6(a), answer box: E_y against minus the numerical y derivative of V'
    formula: 3*E0*a**3*y*z/(x**2+y**2+z**2)**(5/2)
    equals: -deriv('V0 - E0 * z + E0 * a**3 * z / (x**2 + t**2 + z**2)**1.5', 't', y)
    samples:
      V0: [1, 2, 3, 4]
      E0: [1, 10, 3, 5]
      a: [0.1, 1, 0.5, 0.8]
      x: [0.5, 2, 1.1, 0.7]
      y: [0.5, 2, 0.9, 1.6]
      z: [0.5, 2, 1.3, 0.6]
    tolerance: 1e-6
    shown: ['E_y = -\frac{\partial V}{\partial y} = \frac{3E_0 a^3 y z}{(x^2 + y^2 + z^2)^{5/2}}']
    source: {cite: reading2, at: 'Additional Problem 3.10.4, p. 27 (our own solution)'}
    origin: page-own

  - id: p6-Ez
    kind: identity
    answer: p6-b
    where: 'Problem 6(b), answer box and formula "The z component": E_z against minus the numerical z derivative of V'
    formula: E0+E0*a**3*(2*z**2-x**2-y**2)/(x**2+y**2+z**2)**(5/2)
    equals: -deriv('V0 - E0 * t + E0 * a**3 * t / (x**2 + y**2 + t**2)**1.5', 't', z)
    samples:
      V0: [1, 2, 3, 4]
      E0: [1, 10, 3, 5]
      a: [0.1, 1, 0.5, 0.8]
      x: [0.5, 2, 1.1, 0.7]
      y: [0.5, 2, 0.9, 1.6]
      z: [0.5, 2, 1.3, 0.6]
    tolerance: 1e-6
    shown: ['= E_0 + \frac{E_0 a^3\,(2z^2 - x^2 - y^2)}{(x^2 + y^2 + z^2)^{5/2}}']
    source: {cite: reading2, at: 'Additional Problem 3.10.4, p. 27 (our own solution)'}
    origin: page-own

  - id: p6-sphere
    kind: identity
    where: 'Problem 6(b), our addition: on the sphere x² + y² + z² = a² the potential is V0 for every z (here the point (sqrt(a² - z²), 0, z))'
    formula: V0
    equals: V0 - E0 * z + E0 * a**3 * z / ((a**2 - z**2) + z**2)**1.5
    samples:
      V0: [1, 2, 3, 4]
      E0: [1, 10, 3, 5]
      a: [1, 2, 1.5, 3]
      z: [0.2, 0.9, -0.5, 0.0]
    tolerance: 1e-9
    shown: ['on the sphere $r = a$ the last two terms cancel and $V = V_0$ everywhere on it']
    source: {cite: reading2, at: 'Additional Problem 3.10.4, p. 27 (our addition)'}
    origin: page-own

  # ---- Problem 7

  - id: p7-given
    kind: fact
    where: 'Problem 7, statement: the charges and the two separations, from the notes'
    shown: ['$q_1 = 3.0$ μC and $q_2 = -4.0$ μC, are at first $r_0 = 2.0$ cm apart', 'until they are $r_f = 5.0$ cm apart']
    source: {cite: reading2, at: 'Additional Problem 3.10.3, p. 26'}
    origin: mit

  - id: p7-kqq
    where: 'Problem 7(a), solution: k_e q1 q2'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: k * q1 * q2
    expected: '-0.108'
    shown: ['(-4.0 \times 10^{-6}) = -0.108$ J m']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(a), p. 26 (our own solution)'}
    origin: page-own

  - id: p7-inverse-r
    where: 'Problem 7(a), formula "Work of the field": 1/r0 - 1/r_f in 1/m'
    inputs: {r0: 0.020, rf: 0.050}
    formula: 1 / r0 - 1 / rf
    expected: '30'
    shown: ['(50 - 20)\ \text{m}^{-1}']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(a), p. 26 (our own solution)'}
    origin: page-own

  - id: p7-field
    answer: p7-a
    where: 'Problem 7(a), answer box and formula "Work of the field": the numerical integral of the Coulomb force from r0 to r_f, in J'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: integrate('k * q1 * q2 / r**2', 'r', 0.020, 0.050)
    expected: '-3.24'
    shown: ['= -3.24\ \text{J}']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(a), p. 26 (our own solution)'}
    origin: page-own

  - id: p7-ext
    answer: p7-b
    where: 'Problem 7(b), answer box: minus the work of the field, in J'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: -k * q1 * q2 * (1 / 0.020 - 1 / 0.050)
    expected: '3.24'
    shown: ['$W_{\text{ext}} = -W = +3.24$ J']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(b), p. 26 (our own solution)'}
    origin: page-own

  - id: p7-U0
    answer: p7-c
    where: 'Problem 7(c), answer box and formula "Energy at the start", in J'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: k * q1 * q2 / 0.020
    expected: '-5.39'
    shown: ['= -5.39\ \text{J}', 'it would take 5.39 J']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(c), p. 27 (our own solution)'}
    origin: page-own

  - id: p7-Uf
    answer: p7-d
    where: 'Problem 7(d), answer box, in J'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: k * q1 * q2 / 0.050
    expected: '-2.16'
    shown: ['(0.050\ \text{m}) = -2.16$ J']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(d), p. 27 (our own solution)'}
    origin: page-own

  - id: p7-dU
    answer: p7-e
    where: 'Problem 7(e), answer box: U_f - U_0, in J'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: k * q1 * q2 / 0.050 - k * q1 * q2 / 0.020
    expected: '3.24'
    shown: ['$\Delta U = U_f - U_0 = +3.24$ J']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(e), p. 27 (our own solution)'}
    origin: page-own

  - id: p7-dU-exact
    where: 'Problem 7(e), solution: U_f - U_0 from the unrounded energies -2.158 J and -5.394 J'
    inputs: {Uf: -2.1576, U0: -5.394}
    formula: Uf - U0
    expected: '3.236'
    shown: ['$-2.158 - (-5.394) = 3.236$']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(e), p. 27 (our own solution)'}
    origin: page-own

  - id: p7-U-unrounded
    where: 'Problem 7(e), solution: the unrounded energies U_f and U_0, in J'
    inputs: {k: 8.99e9, q1: 3.0e-6, q2: -4.0e-6}
    formula: k * q1 * q2 / 0.020
    expected: '-5.394'
    shown: ['$-2.158 - (-5.394)']
    source: {cite: reading2, at: 'Additional Problem 3.10.3(e), p. 27 (our own solution)'}
    origin: page-own

  # ---- Problem 8

  - id: p8-pairs
    answer: p8-a
    where: 'Problem 8(a), answer box: the number of pairs of 8 charges'
    inputs: {}
    formula: 8 * 7 / 2
    expected: '28'
    shown: ['$8 \times 7/2 = 28$ pairs', '$12 + 12 + 4 = 28$, all the pairs']
    source: {cite: reading2, at: 'Additional Problem 3.10.1, p. 26 (our own solution)'}
    origin: page-own

  - id: p8-energy
    kind: identity
    answer: p8-b
    where: 'Problem 8(b), answer box and formula "Energy of the cube of charges": against the sum by corner, half of 8 corners times (3 neighbours at a, 3 at a√2, 1 at a√3)'
    formula: ke*q**2/a*(12+12/sqrt(2)+4/sqrt(3))
    equals: 8 / 2 * ke * q**2 * (3 / a + 3 / (a * sqrt(2)) + 1 / (a * sqrt(3)))
    samples:
      ke: [1, 10, 3, 5]
      q: [0.5, 5, 1, 2]
      a: [0.1, 2, 0.7, 1.5]
