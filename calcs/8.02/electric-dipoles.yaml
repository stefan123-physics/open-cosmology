# Calculations on content/year-1/8.02/electric-dipoles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 2 and the Session 2 slides, with the page's own numbers.

page: content/year-1/8.02/electric-dipoles.mdx
calcs:
  - id: dipole-moment
    where: 'worked example (a): p = 2qa = 2 × 10⁻¹² C m'
    inputs: {q: 1e-9, a: 1e-3}
    formula: 2 * q * a
    expected: '2e-12'
    shown: ['= 2 \times 10^{-12}$ C m']
    source: {cite: reading1, at: 'Eq. (2.7.1), p. 10'}
    origin: page-own

  - id: bracket
    where: 'worked example (b): 1/0.099² − 1/0.101² ≈ 4.001'
    inputs: {}
    formula: 1 / 0.099**2 - 1 / 0.101**2
    expected: '4.001'
    tolerance: '0.02%'
    shown: ['\approx 8.99 \times 4.001']
    source: {cite: reading1, at: 'Eq. (2.7.5), p. 11'}
    origin: page-own

  - id: exact-axis-field
    where: 'worked example (b): exact field on the axis ≈ 35.97 N/C'
    inputs: {k: 8.99e9, q: 1e-9}
    formula: k * q * (1 / 0.099**2 - 1 / 0.101**2)
    expected: '35.97'
    tolerance: '0.02%'
    shown: ['\approx 35.97$ N/C']
    source: {cite: reading1, at: 'Eq. (2.7.5), p. 11'}
    origin: page-own

  - id: point-dipole-axis
    where: 'worked example (b): 2 k_e p / r³ ≈ 35.96 N/C'
    inputs: {k: 8.99e9, p: 2e-12}
    formula: 2 * k * p / 0.1**3
    expected: '35.96'
    tolerance: '0.02%'
    shown: ['\approx 35.96$ N/C']
    source: {cite: reading1, at: 'Eq. (2.7.7), p. 11'}
    origin: page-own

  - id: torque
    where: 'worked example (c): pE sin 30° = 3 × 10⁻⁸ N m'
    inputs: {p: 2e-12, E: 3e4}
    formula: p * E * sin(pi / 6)
    expected: '3e-8'
    shown: ['(0.5) = 3 \times 10^{-8}$ N m']
    source: {cite: reading1, at: 'Eq. (2.8.3), p. 13'}
    origin: page-own

  - id: work-to-turn
    where: 'worked example (c): pE = 6 × 10⁻⁸ J'
    inputs: {p: 2e-12, E: 3e4}
    formula: p * E
    expected: '6e-8'
    shown: ['$pE = 6 \times 10^{-8}$ J']
    source: {cite: reading1, at: 'Eq. (2.8.7), p. 14'}
    origin: page-own
