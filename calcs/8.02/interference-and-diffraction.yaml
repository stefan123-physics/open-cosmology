# Calculations on content/year-1/8.02/interference-and-diffraction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 14 and the Session 33 slides, with the page's own numbers.

page: content/year-1/8.02/interference-and-diffraction.mdx
calcs:
  - id: microwave-wavelength
    where: 'introduction: c/(2 GHz) = 15 cm'
    inputs: {}
    formula: 3e10 / 2e9
    expected: '15'
    shown: ['Microwaves of 2 GHz have a wavelength of 15 cm']
    source: {cite: reading2, at: 'slide 2'}
    origin: mit

  - id: red-wavelength
    where: 'introduction: c/(4.6 × 10¹⁴ Hz) ≈ 6.5 × 10⁻⁵ cm'
    inputs: {}
    formula: 3e10 / 4.6e14
    expected: '6.5e-5'
    tolerance: '0.5%'
    shown: ['has $6.5 \times 10^{-5}$ cm']
    source: {cite: reading2, at: 'slide 2'}
    origin: mit

  - id: fringe-spacing
    where: 'worked example (a): λL/d ≈ 5.06 mm'
    inputs: {}
    formula: 633e-9 * 2 / 0.25e-3 * 1000
    expected: '5.06'
    tolerance: '0.1%'
    shown: ['\approx 5.06$ mm']
    source: {cite: reading1, at: 'Eq. (14.2.8), p. 6'}
    origin: page-own

  - id: first-dark
    where: 'worked example (a): half the spacing ≈ 2.53 mm'
    inputs: {}
    formula: 0.5 * 633e-9 * 2 / 0.25e-3 * 1000
    expected: '2.53'
    tolerance: '0.1%'
    shown: ['about 2.53 mm']
    source: {cite: reading1, at: 'Eq. (14.2.9), p. 6'}
    origin: page-own

  - id: single-first-min
    where: 'worked example (b): λL/a ≈ 12.7 mm'
    inputs: {}
    formula: 633e-9 * 2 / 1e-4 * 1000
    expected: '12.7'
    tolerance: '0.5%'
    shown: ['\approx 12.7$ mm']
    source: {cite: reading2, at: 'slide 30'}
    origin: page-own

  - id: central-width
    where: 'worked example (b): central band ≈ 25.3 mm'
    inputs: {}
    formula: 2 * 633e-9 * 2 / 1e-4 * 1000
    expected: '25.3'
    tolerance: '0.1%'
    shown: ['about 25.3 mm wide']
    source: {cite: reading1, at: 'Example 14.3, pp. 14–15'}
    origin: page-own

  - id: missing-fringe
    where: 'graph caption: with d = 4a the envelope vanishes at d sin θ = 4λ'
    inputs: {}
    formula: (sin(pi * 4 / 4) / (pi * 4 / 4))**2
    expected: '0'
    tolerance: 1e-12
    shown: ['so the fourth fringe is missing']
    source: {cite: reading1, at: 'Eq. (14.7.2), p. 19'}
    origin: page-own

  - id: wavelength-ratio
    where: 'section "Two sources": 15 cm / 6.5 × 10⁻⁵ cm ≈ 2 × 10⁵ (the slide says 10,000)'
    inputs: {}
    formula: 15 / 6.5e-5
    expected: '2e5'
    tolerance: '20%'
    shown: ['about $2 \times 10^5$ times smaller']
    source: {cite: reading2, at: 'slides 2 and 23'}
    origin: page-own
