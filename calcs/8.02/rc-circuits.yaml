# Calculations on content/year-1/8.02/rc-circuits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 7 and the Session 12 slides, with the page's own numbers.

page: content/year-1/8.02/rc-circuits.mdx
calcs:
  - id: one-tau-current
    where: 'section "The time constant": e⁻¹ ≈ 0.368'
    inputs: {}
    formula: exp(-1)
    expected: '0.368'
    tolerance: '0.1%'
    shown: ['by a factor $e^{-1} \approx 0.368$']
    source: {cite: reading1, at: 'Eq. (7.6.14), p. 12'}
    origin: mit

  - id: one-tau-voltage
    where: 'section "The time constant": 1 − e⁻¹ ≈ 0.632'
    inputs: {}
    formula: 1 - exp(-1)
    expected: '0.632'
    tolerance: '0.1%'
    shown: ['reached $1 - e^{-1} \approx 0.632$']
    source: {cite: reading1, at: 'Eq. (7.6.16), p. 12'}
    origin: mit

  - id: tau
    where: 'worked example (a): τ = (10⁴)(10⁻⁴) = 1 s'
    inputs: {}
    formula: 1e4 * 1e-4
    expected: '1'
    shown: ['$\tau = RC = (10^4)(10^{-4}) = 1$ s']
    source: {cite: reading1, at: 'Section 7.6.1, p. 12'}
    origin: page-own

  - id: initial-current
    where: 'worked example (a): 9/10⁴ = 0.9 mA'
    inputs: {}
    formula: 9 / 1e4 * 1000
    expected: '0.9'
    shown: ['= 9/10^4 = 0.9$ mA']
    source: {cite: reading1, at: 'Eq. (7.6.1), p. 9'}
    origin: page-own

  - id: final-charge
    where: 'worked example (b): Cε = 900 μC'
    inputs: {}
    formula: 100 * 9
    expected: '900'
    shown: ['$Q = C\varepsilon = 900\ \mu$C']
    source: {cite: reading1, at: 'Eq. (7.6.11), p. 11'}
    origin: page-own

  - id: charge-2s
    where: 'worked example (b): 900(1 − e⁻²) ≈ 778 μC'
    inputs: {}
    formula: 900 * (1 - exp(-2))
    expected: '778'
    tolerance: '0.1%'
    shown: ['\approx 778\ \mu$C']
    source: {cite: reading1, at: 'Eq. (7.6.9), p. 10'}
    origin: page-own

  - id: voltage-2s
    where: 'worked example (b): V_C ≈ 7.78 V'
    inputs: {}
    formula: 9 * (1 - exp(-2))
    expected: '7.78'
    tolerance: '0.1%'
    shown: ['\approx 7.78$ V']
    source: {cite: reading1, at: 'Eq. (7.6.10), p. 11'}
    origin: page-own

  - id: half-time
    where: 'worked example (c): τ ln 2 ≈ 0.693 s'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    tolerance: '0.1%'
    shown: ['\ln 2 \approx 0.693$ s']
    source: {cite: reading1, at: 'Eq. (7.6.23), p. 14'}
    origin: page-own

  - id: meter-resistance
    kind: fact
    where: 'section "Measuring": 1 Ω on the 250 mA range'
    value: 1
    shown: ['has a resistance of 1 Ω on its 250 mA range']
    source: {cite: reading1, at: 'Section 7.5, p. 8'}
    origin: mit

  - id: meter-drop
    where: 'section "Measuring": 0.25 A × 1 Ω = 0.25 V'
    inputs: {}
    formula: 0.25 * 1
    expected: '0.25'
    shown: ['so at full scale it drops 0.25 V']
    source: {cite: reading1, at: 'Section 7.5, p. 8'}
    origin: mit
