# Calculations on content/year-1/8.02/magnetic-fields.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 8 and the Session 14 slides, with the page's own numbers.

page: content/year-1/8.02/magnetic-fields.mdx
calcs:
  - id: gauss-unit
    kind: fact
    where: 'section "The force on a moving charge": 1 G = 10⁻⁴ T'
    value: 1e-4
    shown: ['the non-SI **gauss** is $10^{-4}$ T']
    source: {cite: reading1, at: 'Section 8.2, p. 3'}
    origin: mit

  - id: force
    where: 'worked example (a): qvB ≈ 8.01 × 10⁻¹⁴ N'
    inputs: {q: 1.602e-19, v: 1e6, B: 0.5}
    formula: q * v * B
    expected: '8.01e-14'
    tolerance: '0.1%'
    shown: ['\approx 8.01 \times 10^{-14}$ N']
    source: {cite: reading1, at: 'Eq. (8.2.2), p. 3'}
    origin: page-own

  - id: radius
    where: 'worked example (b): mv/qB ≈ 2.09 cm'
    inputs: {m: 1.673e-27, q: 1.602e-19, v: 1e6, B: 0.5}
    formula: m * v / (q * B) * 100
    expected: '2.09'
    tolerance: '0.2%'
    shown: ['\approx 2.09$ cm']
    source: {cite: reading1, at: 'Eq. (8.5.2), p. 13'}
    origin: page-own

  - id: period
    where: 'worked example (b): 2πm/qB ≈ 1.31 × 10⁻⁷ s'
    inputs: {m: 1.673e-27, q: 1.602e-19, B: 0.5}
    formula: 2 * pi * m / (q * B)
    expected: '1.31e-7'
    tolerance: '0.3%'
    shown: ['\approx 1.31 \times 10^{-7}$ s']
    source: {cite: reading1, at: 'Eq. (8.5.3), p. 13'}
    origin: page-own

  - id: selector-field
    where: 'worked example (c): E = vB = 5 × 10⁵ V/m'
    inputs: {v: 1e6, B: 0.5}
    formula: v * B
    expected: '5e5'
    shown: ['= 5 \times 10^5$ V/m']
    source: {cite: reading1, at: 'Eq. (8.6.3), p. 15'}
    origin: page-own
