# Calculations on content/year-1/8.02/dc-circuits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapters 6–7 and the Session 10 slides, with the page's own numbers.

page: content/year-1/8.02/dc-circuits.mdx
calcs:
  - id: drift-speed
    kind: fact
    where: 'section "Current and current density": typical drift speed 4 × 10⁻⁵ m/s'
    value: 4e-5
    shown: ['typically about $4 \times 10^{-5}$ m/s']
    source: {cite: reading3, at: 'slide 10'}
    origin: mit

  - id: one-metre-time
    where: 'section "Current and current density": 1 m at 4 × 10⁻⁵ m/s takes hours (≈ 7 h)'
    inputs: {}
    formula: 1 / 4e-5 / 3600
    expected: '6.9'
    tolerance: '1%'
    shown: ['going one metre would take hours']
    source: {cite: reading3, at: 'slide 10'}
    origin: mit

  - id: copper-resistivity
    kind: fact
    where: 'section "Ohm''s law": copper 1.72 × 10⁻⁸ Ω m'
    value: 1.72e-8
    shown: ['$1.72 \times 10^{-8}$ Ω m for copper']
    source: {cite: reading1, at: 'Section 6.2, p. 6'}
    origin: mit

  - id: parallel-pair
    where: 'worked example: 6 × 3/(6 + 3) = 2 Ω'
    inputs: {}
    formula: 6 * 3 / (6 + 3)
    expected: '2'
    shown: ['$6 \times 3/(6 + 3) = 2$ Ω']
    source: {cite: reading2, at: 'Eq. (7.3.5), p. 5'}
    origin: page-own

  - id: current
    where: 'worked example: I = 9/6.5 ≈ 1.385 A'
    inputs: {}
    formula: 9 / 6.5
    expected: '1.385'
    tolerance: '0.05%'
    shown: ['$I = 9/6.5 \approx 1.385$ A']
    source: {cite: reading2, at: 'Eq. (7.2.7), p. 4'}
    origin: page-own

  - id: terminal
    where: 'worked example: 9 − 1.385 × 0.5 ≈ 8.31 V'
    inputs: {}
    formula: 9 - 9 / 6.5 * 0.5
    expected: '8.31'
    tolerance: '0.1%'
    shown: ['\approx 8.31$ V']
    source: {cite: reading2, at: 'Eq. (7.2.5), p. 3'}
    origin: page-own

  - id: pair-voltage
    where: 'worked example: 1.385 × 2 ≈ 2.77 V'
    inputs: {}
    formula: 9 / 6.5 * 2
    expected: '2.77'
    tolerance: '0.2%'
    shown: ['(1.385)(2) \approx 2.77$ V']
    source: {cite: reading1, at: 'Eq. (6.2.7), p. 5'}
    origin: page-own

  - id: branch-6
    where: 'worked example: 2.77/6 ≈ 0.462 A'
    inputs: {}
    formula: 9 / 6.5 * 2 / 6
    expected: '0.462'
    tolerance: '0.2%'
    shown: ['$2.77/6 \approx 0.462$ A']
    source: {cite: reading1, at: 'Eq. (6.2.7), p. 5'}
    origin: page-own

  - id: branch-3
    where: 'worked example: 2.77/3 ≈ 0.923 A'
    inputs: {}
    formula: 9 / 6.5 * 2 / 3
    expected: '0.923'
    tolerance: '0.2%'
    shown: ['$2.77/3 \approx 0.923$ A']
    source: {cite: reading1, at: 'Eq. (6.2.7), p. 5'}
    origin: page-own

  - id: power-supplied
    where: 'worked example: Iε ≈ 12.46 W'
    inputs: {}
    formula: 9 / 6.5 * 9
    expected: '12.46'
    tolerance: '0.1%'
    shown: ['(1.385)(9) \approx 12.46$ W']
    source: {cite: reading2, at: 'Eq. (7.2.8), p. 4'}
    origin: page-own

  - id: power-dissipated
    where: 'worked example: I²(6.5) ≈ 12.46 W'
    inputs: {}
    formula: (9 / 6.5)**2 * 6.5
    expected: '12.46'
    tolerance: '0.1%'
    shown: ['(1.385)^2(6.5) \approx 12.46$ W']
    source: {cite: reading2, at: 'Eq. (7.2.8), p. 4'}
    origin: page-own

  - id: power-internal
    where: 'worked example: I²r ≈ 0.96 W'
    inputs: {}
    formula: (9 / 6.5)**2 * 0.5
    expected: '0.96'
    tolerance: '0.5%'
    shown: ['$I^2r \approx 0.96$ W']
    source: {cite: reading2, at: 'Eq. (7.2.8), p. 4'}
    origin: page-own

  - id: two-loop-I2
    where: 'worked example 2: solving 8I₁ + 6I₂ = 12, 6I₁ + 10I₂ = 6 gives I₂ ≈ −0.545 A'
    inputs: {}
    formula: (8 * 6 - 6 * 12) / (8 * 10 - 6 * 6)
    expected: '-0.545'
    tolerance: '0.2%'
    shown: ['$I_2 \approx -0.545$ A']
    source: {cite: reading2, at: 'Eq. (7.4.2), p. 7'}
    origin: page-own

  - id: two-loop-I1
    where: 'worked example 2: I₁ ≈ 1.909 A'
    inputs: {}
    formula: (12 * 10 - 6 * 6) / (8 * 10 - 6 * 6)
    expected: '1.909'
    tolerance: '0.05%'
    shown: ['$I_1 \approx 1.909$ A']
    source: {cite: reading2, at: 'Eq. (7.4.2), p. 7'}
    origin: page-own

  - id: two-loop-I3
    where: 'worked example 2: I₃ = I₁ + I₂ ≈ 1.364 A'
    inputs: {}
    formula: (12 * 10 - 6 * 6) / 44 + (8 * 6 - 6 * 12) / 44
    expected: '1.364'
    tolerance: '0.05%'
    shown: ['$I_3 \approx 1.364$ A']
    source: {cite: reading2, at: 'Eq. (7.4.1), p. 6'}
    origin: page-own

  - id: two-loop-check
    where: 'worked example 2: 6 × 1.364 ≈ 8.18 V and 12 − 2 × 1.909 ≈ 8.18 V'
    inputs: {}
    formula: 12 - 2 * (84 / 44)
    expected: '8.18'
    tolerance: '0.1%'
    shown: ['$6 \times 1.364 \approx 8.18$ V']
    source: {cite: reading2, at: 'Eq. (7.4.2), p. 7'}
    origin: page-own
