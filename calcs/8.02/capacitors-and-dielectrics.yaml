# Calculations on content/year-1/8.02/capacitors-and-dielectrics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 5 and the Session 8 slides, with the page's own numbers.

page: content/year-1/8.02/capacitors-and-dielectrics.mdx
calcs:
  - id: quiz-series
    where: 'quiz 2: 2 μF and 2 μF in series = 1 μF'
    inputs: {}
    formula: 1 / (1 / 2 + 1 / 2)
    expected: '1'
    shown: ['= 1/2 + 1/2 = 1$, so']
    source: {cite: reading1, at: 'Eq. (5.3.7), p. 10'}
    origin: page-own

  - id: air-strength
    kind: fact
    where: 'section "Dielectrics": dielectric strength of air 3 × 10⁶ V/m'
    value: 3e6
    shown: ['$3 \times 10^6$ V/m for air']
    source: {cite: reading1, at: 'Section 5.5, p. 16'}
    origin: mit

  - id: network-ceq
    where: 'worked example (a): (2 + 4) × 3 / (6 + 3) = 2 μF'
    inputs: {}
    formula: (2 + 4) * 3 / (2 + 4 + 3)
    expected: '2'
    shown: ['$C_{\text{eq}} = 6 \times 3/(6 + 3) = 2\ \mu$F']
    source: {cite: reading1, at: 'Example 5.4, p. 11'}
    origin: page-own

  - id: network-charge
    where: 'worked example (a): Q = 2 μF × 12 V = 24 μC'
    inputs: {}
    formula: 2 * 12
    expected: '24'
    shown: ['(12\text{ V}) = 24\ \mu$C']
    source: {cite: reading1, at: 'Eq. (5.3.5), p. 10'}
    origin: page-own

  - id: network-v3
    where: 'worked example (a): ΔV₃ = 24/3 = 8 V'
    inputs: {}
    formula: 24 / 3
    expected: '8'
    shown: ['= 24/3 = 8$ V']
    source: {cite: reading1, at: 'Eq. (5.3.5), p. 10'}
    origin: page-own

  - id: network-v12
    where: 'worked example (a): ΔV₁₂ = 24/6 = 4 V'
    inputs: {}
    formula: 24 / 6
    expected: '4'
    shown: ['= 24/6 = 4$ V']
    source: {cite: reading1, at: 'Eq. (5.3.5), p. 10'}
    origin: page-own

  - id: network-energy
    where: 'worked example (a): ½ (2 × 10⁻⁶)(144) = 1.44 × 10⁻⁴ J'
    inputs: {}
    formula: 0.5 * 2e-6 * 12**2
    expected: '1.44e-4'
    shown: ['= 1.44 \times 10^{-4}$ J']
    source: {cite: reading1, at: 'Section 5.4, p. 12'}
    origin: page-own

  - id: paper-charge
    where: 'worked example (b): Q₀ = 88.5 pF × 100 V = 8.85 × 10⁻⁹ C'
    inputs: {}
    formula: 88.5e-12 * 100
    expected: '8.85e-9'
    shown: ['(100) = 8.85 \times 10^{-9}$ C']
    source: {cite: reading1, at: 'Section 5.5.2, p. 20'}
    origin: page-own

  - id: paper-capacitance
    where: 'worked example (b): 3.7 × 88.5 ≈ 327 pF'
    inputs: {}
    formula: 3.7 * 88.5
    expected: '327'
    tolerance: '0.2%'
    shown: ['$C = 3.7 \times 88.5 \approx 327$ pF']
    source: {cite: reading1, at: 'Eq. (5.5.14), p. 21'}
    origin: page-own

  - id: paper-voltage
    where: 'worked example (b): 100/3.7 ≈ 27.0 V'
    inputs: {}
    formula: 100 / 3.7
    expected: '27.0'
    tolerance: '0.2%'
    shown: ['= 100/3.7 \approx 27.0$ V']
    source: {cite: reading1, at: 'Eq. (5.5.13), p. 21'}
    origin: page-own

  - id: paper-energy
    where: 'worked example (b): energy falls from 4.43 × 10⁻⁷ J to about 1.20 × 10⁻⁷ J'
    inputs: {}
    formula: (8.85e-9)**2 / (2 * 3.7 * 88.5e-12)
    expected: '1.20e-7'
    tolerance: '0.5%'
    shown: ['4.43 \times 10^{-7}/3.7 \approx 1.20 \times 10^{-7}$ J']
    source: {cite: reading1, at: 'Section 5.5.2, p. 21'}
    origin: page-own

  - id: paper-energy-before
    where: 'worked example (b): energy before, Q₀²/2C₀ = 4.43 × 10⁻⁷ J'
    inputs: {}
    formula: (8.85e-9)**2 / (2 * 88.5e-12)
    expected: '4.43e-7'
    tolerance: '0.2%'
    shown: ['falls from $4.43 \times 10^{-7}$ J to']
    source: {cite: reading1, at: 'Section 5.4, p. 12'}
    origin: page-own
