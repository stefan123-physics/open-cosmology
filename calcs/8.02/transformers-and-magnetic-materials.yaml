# Calculations on content/year-1/8.02/transformers-and-magnetic-materials.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapters 9–11 and the Session 21 slides, with the page's own numbers.

page: content/year-1/8.02/transformers-and-magnetic-materials.mdx
calcs:
  - id: quiz-stepup
    where: 'quiz 1: 120 V × 2000/100 = 2400 V'
    inputs: {}
    formula: 120 * 2000 / 100
    expected: '2400'
    shown: ['120 = 2400$ V: a step-up']
    source: {cite: reading4, at: 'slide 26'}
    origin: page-own

  - id: slide-current-low
    where: 'section "Transformers": 120 kW at 240 V needs 500 A'
    inputs: {}
    formula: 1.2e5 / 240
    expected: '500'
    shown: ['at 240 V needs 500 A']
    source: {cite: reading4, at: 'slide 29'}
    origin: mit

  - id: slide-loss-low
    where: 'section "Transformers": 500² × 0.40 = 100 kW, 83%'
    inputs: {}
    formula: 500**2 * 0.40 / 1000
    expected: '100'
    shown: ['and loses 100 kW, 83% of it']
    source: {cite: reading4, at: 'slide 29'}
    origin: mit

  - id: slide-loss-high
    where: 'section "Transformers": at 24,000 V, 5 A and 10 W'
    inputs: {}
    formula: (1.2e5 / 24000)**2 * 0.40
    expected: '10'
    shown: ['the current is 5 A and the loss only 10 W']
    source: {cite: reading4, at: 'slide 29'}
    origin: mit

  - id: magnetization-estimate
    where: 'section "Magnetic materials": 10⁻²³ × 10²⁹ = 10⁶ A/m, μ₀M ≈ 1 T'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 1e-23 * 1e29
    expected: '1.26'
    tolerance: '1%'
    shown: ['$\mu_0 M$ of order 1 T']
    source: {cite: reading3, at: 'Eq. (9.6.12), p. 32'}
    origin: mit

  - id: turns
    where: 'worked example (a): 500 × 6/120 = 25'
    inputs: {}
    formula: 500 * 6 / 120
    expected: '25'
    shown: ['= 500 \times 6/120 = 25$ turns']
    source: {cite: reading4, at: 'slide 26'}
    origin: page-own

  - id: loss-1kv
    where: 'worked example (b): 50 A, 2500 W, 5%'
    inputs: {}
    formula: (5e4 / 1000)**2 * 1 / 5e4 * 100
    expected: '5'
    shown: ['loss $I^2R = 2500$ W, 5%']
    source: {cite: reading4, at: 'slide 29'}
    origin: page-own

  - id: loss-10kv
    where: 'worked example (b): 5 A, 25 W, 0.05%'
    inputs: {}
    formula: (5e4 / 10000)**2 * 1
    expected: '25'
    shown: ['$I = 5$ A, loss 25 W, 0.05%']
    source: {cite: reading4, at: 'slide 29'}
    origin: page-own

  - id: mutual
    where: 'worked example (c): μ₀πR₂²/2R₁ ≈ 9.87 × 10⁻¹⁰ H'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * pi * 0.01**2 / (2 * 0.2)
    expected: '9.87e-10'
    tolerance: '0.1%'
    shown: ['\approx 9.87 \times 10^{-10}$ H']
    source: {cite: reading2, at: 'Eq. (11.1.11), p. 4'}
    origin: page-own
