# Calculations on content/year-1/8.02/inductance-and-lr-circuits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 11 and the Session 24 slides, with the page's own numbers.

page: content/year-1/8.02/inductance-and-lr-circuits.mdx
calcs:
  - id: inductance
    where: 'worked example (a): μ₀n²πR²ℓ ≈ 3.16 × 10⁻⁴ H'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 2000**2 * pi * 0.01**2 * 0.2
    expected: '3.16e-4'
    tolerance: '0.2%'
    shown: ['(0.2) \approx 3.16 \times 10^{-4}$ H']
    source: {cite: reading1, at: 'Eq. (11.2.6), p. 6'}
    origin: page-own

  - id: tau
    where: 'worked example (b): L/R ≈ 3.16 × 10⁻⁵ s'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 2000**2 * pi * 0.01**2 * 0.2 / 10
    expected: '3.16e-5'
    tolerance: '0.2%'
    shown: ['$\tau = L/R \approx 3.16 \times 10^{-5}$ s']
    source: {cite: reading1, at: 'Eq. (11.4.8), p. 18'}
    origin: page-own

  - id: final-current
    where: 'worked example (b): ε/R = 1.2 A'
    inputs: {}
    formula: 12 / 10
    expected: '1.2'
    shown: ['Final current $\varepsilon/R = 1.2$ A']
    source: {cite: reading1, at: 'Eq. (11.4.7), p. 17'}
    origin: page-own

  - id: energy
    where: 'worked example (c): ½LI² ≈ 2.27 × 10⁻⁴ J'
    inputs: {mu0: 1.25664e-6}
    formula: 0.5 * mu0 * 2000**2 * pi * 0.01**2 * 0.2 * 1.2**2
    expected: '2.27e-4'
    tolerance: '0.3%'
    shown: ['(1.2)^2 \approx 2.27 \times 10^{-4}$ J']
    source: {cite: reading1, at: 'Eq. (11.3.4), p. 9'}
    origin: page-own

  - id: field
    where: 'worked example (c): B = μ₀nI ≈ 3.02 × 10⁻³ T'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 2000 * 1.2
    expected: '3.02e-3'
    tolerance: '0.2%'
    shown: ['$B = \mu_0 nI \approx 3.02 \times 10^{-3}$ T']
    source: {cite: reading1, at: 'Eq. (11.2.4), p. 6'}
    origin: page-own

  - id: energy-density
    where: 'worked example (c): B²/2μ₀ ≈ 3.62 J/m³'
    inputs: {mu0: 1.25664e-6}
    formula: (mu0 * 2000 * 1.2)**2 / (2 * mu0)
    expected: '3.62'
    tolerance: '0.3%'
    shown: ['\approx 3.62$ J/m³']
    source: {cite: reading1, at: 'Eq. (11.3.8), p. 10'}
    origin: page-own

  - id: volume
    where: 'worked example (c): π(0.01)²(0.2) ≈ 6.28 × 10⁻⁵ m³'
    inputs: {}
    formula: pi * 0.01**2 * 0.2
    expected: '6.28e-5'
    tolerance: '0.1%'
    shown: ['\approx 6.28 \times 10^{-5}$ m³']
    source: {cite: reading1, at: 'Eq. (11.3.7), p. 10'}
    origin: page-own

  - id: energy-from-density
    where: 'worked example (c): u_B × volume = 2.27 × 10⁻⁴ J'
    inputs: {mu0: 1.25664e-6}
    formula: (mu0 * 2000 * 1.2)**2 / (2 * mu0) * pi * 0.01**2 * 0.2
    expected: '2.27e-4'
    tolerance: '0.3%'
    shown: ['again $2.27 \times 10^{-4}$ J']
    source: {cite: reading1, at: 'Eq. (11.3.7), p. 10'}
    origin: page-own
