# Calculations on content/year-1/8.02/8-02-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT's Problem Solving 4 prints no solutions and the notes' Additional Problems only a few final numbers, so every
# formula answer is checked here by an independent route: a numerical integral of the field or of the energy density,
# a numerical derivative of a potential or of an energy, the charging integral of q/C, or the potential difference
# added layer by layer. Where a box is written with the capacitance C, the samples of C are the capacitance
# 2 pi eps0 l / ln(b/a) of the coaxial cylinders with the sample radii (computed to 16 digits), so the route through
# the cylinders' own field can be used.

page: content/year-1/8.02/8-02-problem-set-4.mdx
calcs:
  - id: eps0-value
    kind: fact
    where: 'How to answer: the value of eps0 used for numbers'
    shown: ['use $\varepsilon_0 = 8.85 \times 10^{-12}$ F/m']
    source: {cite: reading1, at: 'Example 5.5, p. 14'}
    origin: mit

  - id: strength-table
    kind: fact
    where: 'What you need: dielectric strength of dry air and of paper, from the notes'' table'
    shown: ['for dry air about $3 \times 10^6$ V/m, for paper about $16 \times 10^6$ V/m']
    source: {cite: reading1, at: 'Section 5.5, table on p. 16'}
    origin: mit

  # ---- Problem 1

  - id: p1-E
    kind: identity
    answer: p1-a
    where: 'Problem 1(a), answer box and formula "The field between the cylinders": against Q/eps0 divided by the flux area, the rim length found as the integral of r dphi'
    formula: Q/(2*pi*eps0*l*r)
    equals: Q / (eps0 * integrate('r', 'phi', 0, 2 * pi) * l)
    samples:
      Q: [0.5, 5, 1, 2]
      eps0: [0.5, 2, 1, 1.3]
      l: [1, 10, 2, 5]
      r: [0.2, 2, 0.5, 1]
    tolerance: 1e-9
    shown: ['\vec E = \frac{Q}{2\pi\varepsilon_0 \ell\, r}\,\hat r']
    source: {cite: mit, at: 'Question 1, p. 2 (our own solution)'}
    origin: page-own

  - id: p1-dV
    kind: identity
    answer: p1-b
    where: 'Problem 1(b), answer box and formula "The potential difference": against the numerical integral of the field from a to b'
    formula: Q*log(b/a)/(2*pi*eps0*l)
    equals: integrate('Q / (2 * pi * eps0 * l * rr)', 'rr', a, b)
    samples:
      Q: [0.5, 5, 1, 2]
      eps0: [0.5, 2, 1, 1.3]
      l: [1, 10, 2, 5]
      a: [0.1, 0.5, 0.2, 0.3]
      b: [1, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['= \frac{Q}{2\pi\varepsilon_0 \ell}\ln\frac{b}{a}']
    source: {cite: mit, at: 'Question 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p1-C
    kind: identity
    answer: p1-c
    where: 'Problem 1(c), answer box and formula "Capacitance of two coaxial cylinders": against Q over the integrated potential difference'
    formula: 2*pi*eps0*l/log(b/a)
    equals: Q / integrate('Q / (2 * pi * eps0 * l * rr)', 'rr', a, b)
    samples:
      Q: [0.5, 5, 1, 2]
      eps0: [0.5, 2, 1, 1.3]
      l: [1, 10, 2, 5]
      a: [0.1, 0.5, 0.2, 0.3]
      b: [1, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['C = \frac{Q}{|\Delta V|} = \frac{2\pi\varepsilon_0 \ell}{\ln(b/a)}']
    source: {cite: mit, at: 'Question 3, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-C-narrow
    kind: limit
    where: 'Problem 1(c), solution check: for a narrow gap b = a + gap the capacitance tends to eps0 (2 pi a l)/gap'
    inputs: {eps0: 1, l: 2, a: 1}
    formula: 2*pi*eps0*l/log((a + gap)/a)
    limit: eps0*2*pi*a*l/gap
    vary: {gap: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-3
    shown: ['$C \approx \varepsilon_0(2\pi a\ell)/d$']
    source: {cite: mit, at: 'Question 3, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-U
    kind: identity
    answer: p1-d
    where: 'Problem 1(d), answer box and formula "Energy stored in the cylindrical capacitor": against the numerical integral of eps0 E^2/2 over shells 2 pi r l dr'
    formula: Q**2*log(b/a)/(4*pi*eps0*l)
    equals: integrate('eps0 / 2 * (Q / (2 * pi * eps0 * l * rr))**2 * 2 * pi * rr * l', 'rr', a, b)
    samples:
      Q: [0.5, 5, 1, 2]
      eps0: [0.5, 2, 1, 1.3]
      l: [1, 10, 2, 5]
      a: [0.1, 0.5, 0.2, 0.3]
      b: [1, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['U = \frac{Q^2}{4\pi\varepsilon_0 \ell}\int_a^b \frac{dr}{r} = \frac{Q^2}{4\pi\varepsilon_0 \ell}\ln\frac{b}{a}']
    source: {cite: mit, at: 'Question 4, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-U-QC
    kind: identity
    answer: p1-e
    where: 'Problem 1(e), answer box: Q^2/(2C), against the field-energy integral of the cylinders whose capacitance is the sample C'
    formula: Q**2/(2*C)
    equals: integrate('eps0 / 2 * (Q / (2 * pi * eps0 * l * rr))**2 * 2 * pi * rr * l', 'rr', a, b)
    samples:
      Q: [0.5, 5, 1, 2]
      eps0: [1, 0.5, 2, 1.3]
      l: [1, 3, 7, 10]
      a: [0.2, 0.1, 0.4, 0.3]
      b: [1.5, 2, 1.2, 3]
      C: [3.1183561904079196, 3.146068173037466, 80.06882428664358, 35.47378519988787]
    tolerance: 1e-8
    shown: ['so $U = \tfrac12 Q^2 \ln(b/a)/(2\pi\varepsilon_0\ell) = Q^2/(2C)$']
    source: {cite: mit, at: 'Question 4, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-cable-data
    kind: fact
    where: 'Problem 1(f), statement: our cable, our numbers'
    shown: ['$a = 0.50$ mm and an outer sheath of radius $b = 2.0$ mm', 'a piece $\ell = 1.00$ m long']
    source: {cite: mit, at: 'Question 3, p. 3 (our addition, our numbers)'}
    origin: page-own

  - id: p1-cable-num
    where: 'Problem 1(f), solution: 2 pi eps0 l in F'
    inputs: {eps0: 8.85e-12, l: 1.00}
    formula: 2 * pi * eps0 * l
    expected: '5.561e-11'
    shown: ['= 5.561 \times 10^{-11}\ \text{F}/1.386']
    source: {cite: mit, at: 'Question 3, p. 3 (our addition)'}
    origin: page-own

  - id: p1-ln4
    where: 'Problem 1(f), solution: ln(b/a) = ln 4'
    inputs: {a: 0.50e-3, b: 2.0e-3}
    formula: log(b / a)
    expected: '1.386'
    shown: ['(1.00\ \text{m})/\ln 4']
    source: {cite: mit, at: 'Question 3, p. 3 (our addition)'}
    origin: page-own

  - id: p1-cable-F
    where: 'Problem 1(f), solution: the capacitance in F'
    inputs: {eps0: 8.85e-12, l: 1.00, a: 0.50e-3, b: 2.0e-3}
    formula: 2 * pi * eps0 * l / log(b / a)
    expected: '4.01e-11'
    shown: ['= 4.01 \times 10^{-11}$ F']
    source: {cite: mit, at: 'Question 3, p. 3 (our addition)'}
    origin: page-own

  - id: p1-cable
    answer: p1-f
    where: 'Problem 1(f), answer box: the capacitance of 1 m of cable in pF'
    inputs: {eps0: 8.85e-12, l: 1.00, a: 0.50e-3, b: 2.0e-3}
    formula: 2 * pi * eps0 * l / log(b / a) * 1e12
    expected: '40.1'
    shown: ['F $= 40.1$ pF']
    source: {cite: mit, at: 'Question 3, p. 3 (our addition)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-dV
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box: q/C, against the potential difference of the cylinders (Problem 1(b)) with the charge q, the sample C being their capacitance'
    formula: q/C
    equals: integrate('q / (2 * pi * eps0 * l * rr)', 'rr', a, b)
    samples:
      q: [0.5, 5, 1, 2]
      eps0: [1, 0.5, 2, 1.3]
      l: [1, 3, 7, 10]
      a: [0.2, 0.1, 0.4, 0.3]
      b: [1.5, 2, 1.2, 3]
      C: [3.1183561904079196, 3.146068173037466, 80.06882428664358, 35.47378519988787]
    tolerance: 1e-8
    shown: ['$\Delta V = q/C$: it grows in step']
    source: {cite: mit, at: 'Question 5(a), p. 4 (our own solution)'}
    origin: page-own

  - id: p2-dW
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "Work for one more piece of charge": against dq times the integrated potential difference of the cylinders with the charge q'
    formula: q*dq/C
    equals: dq * integrate('q / (2 * pi * eps0 * l * rr)', 'rr', a, b)
    samples:
      q: [0.5, 5, 1, 2]
      dq: [0.01, 0.1, 0.05, 0.02]
      eps0: [1, 0.5, 2, 1.3]
      l: [1, 3, 7, 10]
      a: [0.2, 0.1, 0.4, 0.3]
      b: [1.5, 2, 1.2, 3]
      C: [3.1183561904079196, 3.146068173037466, 80.06882428664358, 35.47378519988787]
    tolerance: 1e-8
    shown: ['dW = \Delta V\,dq = \frac{q}{C}\,dq']
    source: {cite: mit, at: 'Question 5(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p2-W
    kind: identity
    answer: p2-c
    where: 'Problem 2(c), answer box and formula "Work to charge a capacitor": against the numerical charging integral of the cylinders'' potential difference q ln(b/a)/(2 pi eps0 l) from 0 to Q'
    formula: Q**2/(2*C)
    equals: integrate('qq * log(b / a) / (2 * pi * eps0 * l)', 'qq', 0, Q)
    samples:
      Q: [0.5, 5, 1, 2]
      eps0: [1, 0.5, 2, 1.3]
      l: [1, 3, 7, 10]
      a: [0.2, 0.1, 0.4, 0.3]
      b: [1.5, 2, 1.2, 3]
      C: [3.1183561904079196, 3.146068173037466, 80.06882428664358, 35.47378519988787]
    tolerance: 1e-8
    shown: ['W = \int_0^Q \frac{q}{C}\,dq = \frac{Q^2}{2C}']
    source: {cite: mit, at: 'Question 5(c), p. 4 (our own solution)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-data
    kind: fact
    where: 'Problem 3, statement: the two capacitors and the battery'
    shown: ['$C_1 = 6.00$ μF is charged by connecting it to a battery of $\Delta V = 20.0$ V', '$C_2 = 3.00$ μF, which carries no charge']
    source: {cite: mit, at: 'Homework Problem 1, p. 5'}
    origin: mit

  - id: p3-Q0
    answer: p3-a
    where: 'Problem 3(a), answer box and solution: the charge from the battery, in microcoulombs'
    inputs: {C1: 6.00, V: 20.0}
    formula: C1 * V
    expected: '120'
    tolerance: '0.1'
    shown: ['(20.0\ \text{V}) = 120$ μC']
    source: {cite: mit, at: 'Homework Problem 1(a), p. 5 (our own solution)'}
    origin: page-own

  - id: p3-Vf
    where: 'Problem 3(b), formula "Sharing the charge": the common potential difference, in V'
    inputs: {Q0: 120, C1: 6.00, C2: 3.00}
    formula: Q0 / (C1 + C2)
    expected: '13.3'
    shown: ['= 13.3\ \text{V}', '6.00 \times 13.33 = 80$']
    source: {cite: mit, at: 'Homework Problem 1(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p3-Q1
    answer: p3-b1
    where: 'Problem 3(b), answer box: the final charge on C1, in microcoulombs (from the unrounded potential difference)'
    inputs: {Q0: 120, C1: 6.00, C2: 3.00}
    formula: C1 * Q0 / (C1 + C2)
    expected: '80'
    tolerance: '0.01'
    shown: ['$Q_1 = 6.00 \times 13.33 = 80$ μC']
    source: {cite: mit, at: 'Homework Problem 1(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p3-Q2
    answer: p3-b2
    where: 'Problem 3(b), answer box: the final charge on C2, in microcoulombs'
    inputs: {Q0: 120, C1: 6.00, C2: 3.00}
    formula: C2 * Q0 / (C1 + C2)
    expected: '40'
    tolerance: '0.01'
    shown: ['$Q_2 = 3.00 \times 13.33 = 40$ μC']
    source: {cite: mit, at: 'Homework Problem 1(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p3-sum
    where: 'Problem 3(b), solution check: the two charges add to the first'
    inputs: {Q1: 80, Q2: 40}
    formula: Q1 + Q2
    expected: '120'
    tolerance: '0.01'
    shown: ['$80 + 40 = 120$ μC']
    source: {cite: mit, at: 'Homework Problem 1(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p3-U0
    where: 'Problem 3(c), solution: energy in C1 before, in mJ (microfarads times volts squared give microjoules)'
    inputs: {C1: 6.00, V: 20.0}
    formula: C1 * V**2 / 2 / 1000
    expected: '1.20'
    shown: ['(20.0\ \text{V})^2 = 1.20$ mJ']
    source: {cite: mit, at: 'Homework Problem 1, p. 5 (our addition)'}
    origin: page-own

  - id: p3-Uf
    answer: p3-c
    where: 'Problem 3(c), answer box and solution: energy of the pair after, Q0^2/(2(C1 + C2)), in mJ'
    inputs: {Q0: 120, C1: 6.00, C2: 3.00}
    formula: Q0**2 / (2 * (C1 + C2)) / 1000
    expected: '0.800'
    shown: ['(2 \times 9.00\ \mu\text{F}) = 0.800$ mJ']
    source: {cite: mit, at: 'Homework Problem 1, p. 5 (our addition)'}
    origin: page-own

  - id: p3-loss
    where: 'Problem 3(c), solution: the energy lost, in mJ, and its fraction C2/(C1 + C2) = 1/3'
    inputs: {C1: 6.00, C2: 3.00, V: 20.0}
    formula: C1 * V**2 / 2 / 1000 * C2 / (C1 + C2)
    expected: '0.400'
    shown: ['A third of the energy, 0.400 mJ, is gone']
    source: {cite: mit, at: 'Homework Problem 1, p. 5 (our addition)'}
    origin: page-own

  # ---- Problem 4

  - id: p4-C
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box and formula "A filled parallel-plate capacitor": against 1 over the potential difference per unit charge, the field Q/(kappa eps0 A) integrated across the gap'
    formula: kappa*eps0*A/d
    equals: 1 / integrate('1 / (kappa * eps0 * A)', 'x', 0, d)
    samples:
      kappa: [1.5, 10, 3, 5.4]
      eps0: [0.5, 2, 1, 1.3]
      A: [0.5, 2, 1, 1.5]
      d: [0.1, 1, 0.3, 0.5]
    tolerance: 1e-9
    shown: ['= \frac{\kappa\varepsilon_0 A}{d}" cite="mit" at="Homework Problem 3(a)']
    source: {cite: mit, at: 'Homework Problem 3(a), p. 5 (our own solution)'}
    origin: page-own

  - id: p4-mixed
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box and formula "Slab beside two layers": against the left half plus the right half, each found from its integrated potential difference per unit charge'
    formula: eps0*A/d*(kappa1/2 + kappa2*kappa3/(kappa2 + kappa3))
    equals: 1 / integrate('1 / (kappa1 * eps0 * A / 2)', 'x', 0, d) + 1 / (integrate('1 / (kappa2 * eps0 * A / 2)', 'x', 0, d / 2) + integrate('1 / (kappa3 * eps0 * A / 2)', 'x', d / 2, d))
    samples:
      eps0: [0.5, 2, 1, 1.3]
      A: [0.5, 2, 1, 1.5]
      d: [0.1, 1, 0.3, 0.5]
      kappa1: [1.5, 10, 3, 2]
      kappa2: [2, 1.5, 8, 4]
      kappa3: [6, 9, 1.5, 4]
    tolerance: 1e-9
    shown: ['= \frac{\varepsilon_0 A}{d}\left(\frac{\kappa_1}{2} + \frac{\kappa_2\kappa_3}{\kappa_2 + \kappa_3}\right)']
    source: {cite: mit, at: 'Homework Problem 3(b), pp. 5 and 6 (our own solution)'}
    origin: page-own

  # ---- Problem 5

  - id: p5-factor
    answer: p5-a
    where: 'Problem 5(a), answer box: U(2d)/U(d) at fixed charge, U = Q^2 d/(2 eps0 A)'
    inputs: {Q: 1, eps0: 1, A: 1, d: 1}
    formula: (Q**2 * 2 * d / (2 * eps0 * A)) / (Q**2 * d / (2 * eps0 * A))
    expected: '2'
    tolerance: '0.01'
    shown: ['doubling $d$ doubles $U$']
    source: {cite: mit, at: 'Homework Problem 4(a), p. 6 (our own solution)'}
    origin: page-own

  - id: p5-W
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "Work to double the gap": against the constant force Q^2/(2 eps0 A) integrated over the distance from d to 2d'
    formula: Q**2*d/(2*eps0*A)
    equals: integrate('Q**2 / (2 * eps0 * A)', 'x', d, 2 * d)
    samples:
      Q: [0.5, 5, 1, 2]
      d: [0.1, 1, 0.3, 0.5]
      A: [0.5, 2, 1, 1.5]
      eps0: [0.5, 2, 1, 1.3]
    tolerance: 1e-9
    shown: ['- \frac{Q^2 d}{2\varepsilon_0 A} = \frac{Q^2 d}{2\varepsilon_0 A}']
    source: {cite: mit, at: 'Homework Problem 4(b), p. 6 (our own solution)'}
    origin: page-own

  - id: p5-Qfixed
    kind: identity
    answer: p5-c1
    where: 'Problem 5(c), answer box: U(2b)/U(b) at fixed charge, against the ratio of the field-energy integrals of dr/r'
    formula: log(2*b/a)/log(b/a)
    equals: integrate('1 / rr', 'rr', a, 2 * b) / integrate('1 / rr', 'rr', a, b)
    samples:
      a: [0.2, 0.5, 0.3, 0.4]
      b: [1, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['$U_{\text{new}}/U_{\text{old}} = \ln(2b/a)/\ln(b/a) = 1 + \ln 2/\ln(b/a)$']
    source: {cite: mit, at: 'Homework Problem 4(c), p. 6 (our own solution)'}
    origin: page-own

  - id: p5-ex1
    where: 'Problem 5(c), solution: the factor for b = 2a'
    inputs: {x: 2}
    formula: log(2 * x) / log(x)
    expected: '2'
    tolerance: '1e-9'
    shown: ['it is $\ln 4/\ln 2 = 2$']
    source: {cite: mit, at: 'Homework Problem 4(c), p. 6 (our own solution)'}
    origin: page-own

  - id: p5-ex2
    where: 'Problem 5(c), solution: the factor for b = 10a'
    inputs: {x: 10}
    formula: log(2 * x) / log(x)
    expected: '1.30'
    shown: ['$\ln 20/\ln 10 = 1.30$']
    source: {cite: mit, at: 'Homework Problem 4(c), p. 6 (our own solution)'}
    origin: page-own

  - id: p5-Vfixed
    kind: identity
    answer: p5-d1
    where: 'Problem 5(d), answer box: U(2b)/U(b) at fixed potential difference, U = C dV^2/2, against the ratio of the integrals of dr/r the other way up'
    formula: log(b/a)/log(2*b/a)
    equals: integrate('1 / rr', 'rr', a, b) / integrate('1 / rr', 'rr', a, 2 * b)
    samples:
      a: [0.2, 0.5, 0.3, 0.4]
      b: [1, 3, 1.5, 2]
    tolerance: 1e-8
    shown: ['$U_{\text{new}}/U_{\text{old}} = \ln(b/a)/\ln(2b/a)$, less than 1']
    source: {cite: mit, at: 'Homework Problem 4(d), p. 6 (our own solution)'}
    origin: page-own

  # ---- Problem 6

  - id: p6-data
    kind: fact
    where: 'Problem 6, statement: the four capacitors and the battery'
