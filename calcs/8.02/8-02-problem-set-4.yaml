    origin: page-own

  - id: p6-V-open
    kind: units
    where: 'Problem 6(b), solution check: 8 V across C1 and 4 V across C2 add to the 12 V of the battery (8 + 4 = 12, both terms in volts)'
    inputs: {V1: 8 V, V2: 4 V}
    terms: ['V1', 'V2', 'V1 + V2']
