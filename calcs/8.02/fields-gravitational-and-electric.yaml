# Calculations on content/year-1/8.02/fields-gravitational-and-electric.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 1 and the Session 1 slides, with the page's own numbers.

page: content/year-1/8.02/fields-gravitational-and-electric.mdx
calcs:
  - id: treatise-year
    kind: fact
    where: 'section "Action at a distance and fields": Maxwell''s Treatise, 1873'
    value: 1873
    shown: ['*Treatise on Electricity and Magnetism* of 1873']
    source: {cite: reading1, at: 'Section 1.1, p. 1'}
    origin: mit

  - id: G-value
    kind: fact
    where: 'section "The gravitational field": G = 6.67 × 10⁻¹¹ N m²/kg²'
    value: 6.67e-11
    shown: ['with $G = 6.67 \times 10^{-11}$ N m²/kg²']
    source: {cite: reading1, at: 'Section 1.5, p. 12'}
    origin: mit

  - id: g-surface-quoted
    kind: fact
    where: 'section "The gravitational field": g ≈ 9.8 m/s²'
    value: 9.8
    shown: ['g = GM/R_E^2 \approx 9.8$ m/s²']
    source: {cite: reading1, at: 'Eq. (1.5.3), p. 12'}
    origin: mit

  - id: elementary-charge
    kind: fact
    where: 'section "Electric charge and Coulomb''s law": e = 1.602 × 10⁻¹⁹ C'
    value: 1.602e-19
    shown: ['$e = 1.602 \times 10^{-19}$ C']
    source: {cite: reading2, at: 'slide 46'}
    origin: mit

  - id: coulomb-constant
    where: 'formula "Coulomb''s law": k_e = 1/(4πε₀) ≈ 8.99 × 10⁹'
    inputs: {eps0: 8.854e-12}
    formula: 1 / (4 * pi * eps0)
    expected: '8.99e9'
    tolerance: '0.2%'
    shown: ['\approx 8.99 \times 10^9\ \text{N m}^2/\text{C}^2']
    source: {cite: reading2, at: 'slide 48'}
    origin: mit

  - id: g-earth
    where: 'worked example (a): g = GM/R_E² ≈ 9.81 m/s²'
    inputs: {G: 6.67e-11, M: 5.97e24, R: 6.37e6}
    formula: G * M / R**2
    expected: '9.81'
    tolerance: '0.3%'
    shown: ['\approx 9.81$ m/s²']
    source: {cite: reading1, at: 'Eq. (1.5.3), p. 12'}
    origin: page-own

  - id: E1
    where: 'worked example (b): k_e q₁/r² = 8.99e9 × 2e-6 / 0.16 ≈ 1.12 × 10⁵ N/C'
    inputs: {k: 8.99e9, q1: 2e-6}
    formula: k * q1 / 0.4**2
    expected: '1.124e5'
    tolerance: '0.3%'
    shown: ['/0.16 \approx 1.12 \times 10^5$ N/C']
    source: {cite: reading2, at: 'slide 51'}
    origin: page-own

  - id: distance-q2
    where: 'worked example (b): √(0.3² + 0.4²) = 0.5 m'
    inputs: {}
    formula: sqrt(0.3**2 + 0.4**2)
    expected: '0.5'
    shown: ['\sqrt{0.3^2 + 0.4^2} = 0.5$ m']
    source: {cite: reading2, at: 'slide 51'}
    origin: page-own

  - id: E2
    where: 'worked example (b): k_e |q₂|/0.25 ≈ 3.60 × 10⁴ N/C'
    inputs: {k: 8.99e9, q2: 1e-6}
    formula: k * q2 / 0.5**2
    expected: '3.60e4'
    tolerance: '0.3%'
    shown: ['/0.25 \approx 3.60 \times 10^4$ N/C']
    source: {cite: reading2, at: 'slide 51'}
    origin: page-own

  - id: E-x
    where: 'worked example (b): x component 0.6 × 3.60e4 ≈ 2.16 × 10⁴ N/C'
    inputs: {k: 8.99e9, q2: 1e-6}
    formula: 0.6 * k * q2 / 0.25
    expected: '2.16e4'
    tolerance: '0.3%'
    shown: ['\langle 2.16 \times 10^4,\ 8.36 \times 10^4\rangle']
    source: {cite: reading2, at: 'slide 52'}
    origin: page-own

  - id: E-y
    where: 'worked example (b): y component 1.124e5 − 0.8 × 3.60e4 ≈ 8.36 × 10⁴ N/C'
    inputs: {k: 8.99e9, q1: 2e-6, q2: 1e-6}
    formula: k * q1 / 0.16 - 0.8 * k * q2 / 0.25
    expected: '8.36e4'
    tolerance: '0.3%'
    shown: ['\langle 2.16, -2.88\rangle \times 10^4']
    source: {cite: reading2, at: 'slide 52'}
    origin: page-own

  - id: E-size
    where: 'worked example (b): |E| ≈ 8.6 × 10⁴ N/C'
    inputs: {k: 8.99e9, q1: 2e-6, q2: 1e-6}
    formula: sqrt((0.6 * k * q2 / 0.25)**2 + (k * q1 / 0.16 - 0.8 * k * q2 / 0.25)**2)
    expected: '8.6e4'
    tolerance: '1%'
    shown: ['of size about $8.6 \times 10^4$ N/C']
    source: {cite: reading2, at: 'slide 52'}
    origin: page-own

  - id: force-ratio
    where: 'cosmology callout: electric / gravitational force between a proton and an electron ≈ 2.3 × 10³⁹'
    inputs: {k: 8.99e9, e: 1.602e-19, G: 6.67e-11, mp: 1.673e-27, me: 9.109e-31}
    formula: k * e**2 / (G * mp * me)
    expected: '2.3e39'
    tolerance: '2%'
    shown: ['about $2.3 \times 10^{39}$ times']
    source: {cite: reading2, at: 'slide 48'}
    origin: page-own
