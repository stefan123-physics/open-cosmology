# Calculations on content/year-1/8.02/8-02-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Sources: MIT 8.02T Course Notes (Liao, Dourmashkin, Belcher), Chapter 6 Additional Problems 6.7.4, 6.7.6, 6.7.8 and
# Conceptual Questions 6.6, Chapter 7 Additional Problems 7.11.1, 7.11.2, 7.11.5 and Conceptual Question 7.10.3.
# The notes print no solutions for these: every formula answer is checked here by an independent route
# (a numerical solve of the loop rule, mesh currents by Cramer's rule, a sum of layers, a limit).
# Electron charge: CODATA 2018 (exact in the 2019 SI), e = 1.602176634e-19 C.

page: content/year-1/8.02/8-02-problem-set-5.mdx
calcs:
  # ---- How to answer

  - id: e-charge
    where: 'How to answer: the electron charge, CODATA 2018 (exact), rounded to four figures'
    inputs: {}
    formula: 1.602176634e-19
    expected: '1.602e-19'
    tolerance: '0.1%'
    shown: ['$e = 1.602 \times 10^{-19}$ C']
    source: {cite: reading1, at: 'Section 6.7.4, p. 15 (constant from CODATA 2018)'}
    origin: page-own

  # ---- Problem 1 (Additional Problem 6.7.4; the notes' numbers)

  - id: p1-area
    where: 'Problem 1(b): 31.2 mm² in square metres'
    inputs: {A: 31.2 mm**2}
    formula: A
    expected: 3.12e-5 m**2
    shown: ['$A = 31.2\ \text{mm}^2 = 3.12 \times 10^{-5}\ \text{m}^2$']
    source: {cite: reading1, at: 'Section 6.7.4, p. 14'}
    origin: mit

  - id: p1-J
    answer: p1-b1
    where: 'Problem 1(b), first answer box and solution: J = I/A'
    inputs: {I: 115 A, A: 31.2 mm**2}
    formula: I / A
    expected: 3.69e6 A/m**2
    shown: ['= 3.69 \times 10^{6}\ \text{A}/\text{m}^2']
    source: {cite: reading1, at: 'Section 6.7.4, pp. 14 and 15 (the notes print 3.69e6 A/m²)'}
    origin: page-own

  - id: p1-J-unrounded
    where: 'Problem 1(b), formula "Drift speed in the cable": the unrounded J'
    inputs: {I: 115 A, A: 31.2 mm**2}
    formula: I / A
    expected: 3.686e6 A/m**2
    tolerance: '0.05%'
    shown: ['\frac{3.686 \times 10^{6}}']
    source: {cite: reading1, at: 'Section 6.7.4, p. 14'}
    origin: page-own

  - id: p1-vd
    answer: p1-b2
    where: 'Problem 1(b), second answer box and formula "Drift speed in the cable": v_d = J/(ne)'
    inputs: {I: 115 A, A: 31.2 mm**2, n: 8.49e28 m**-3, e: 1.602176634e-19 C}
    formula: I / A / (n * e)
    expected: 2.71e-4 m/s
    shown: ['= 2.71 \times 10^{-4}\ \text{m/s}']
    source: {cite: reading1, at: 'Section 6.7.4, pp. 14 and 15 (the notes print 2.71e-4 m/s)'}
    origin: page-own

  - id: p1-vd-mm
    where: 'Problem 1(b): the drift speed in millimetres per second, about a quarter'
    inputs: {I: 115 A, A: 31.2 mm**2, n: 8.49e28 m**-3, e: 1.602176634e-19 C}
    formula: I / A / (n * e)
    expected: 0.25 mm/s
    tolerance: '10%'
    shown: ['about a quarter of a millimetre per second']
    source: {cite: reading1, at: 'Section 6.7.4, p. 15 (our own remark)'}
    origin: page-own

  - id: p1-time-s
    where: 'Problem 1(b): t = L/v_d in seconds'
    inputs: {I: 115 A, A: 31.2 mm**2, n: 8.49e28 m**-3, e: 1.602176634e-19 C, L: 85.5 cm}
    formula: L / (I / A / (n * e))
    expected: 3155 s
    tolerance: '0.05%'
    shown: ['$t = L/v_d = 0.855/(2.710 \times 10^{-4}) = 3155$ s']
    source: {cite: reading1, at: 'Section 6.7.4, pp. 14 and 15'}
    origin: page-own

  - id: p1-time-min
    answer: p1-b3
    where: 'Problem 1(b), third answer box: the travel time in minutes'
    inputs: {I: 115 A, A: 31.2 mm**2, n: 8.49e28 m**-3, e: 1.602176634e-19 C, L: 85.5 cm}
    formula: L / (I / A / (n * e))
    expected: 52.6 min
    tolerance: '0.1%'
    shown: ['which is 52.6 minutes']
    source: {cite: reading1, at: 'Section 6.7.4, p. 15'}
    origin: page-own

  - id: p1-notes-time
    kind: fact
    where: 'Problem 1(b): the answer printed in the notes, 52.5 min (52.59 min unrounded; the page notes the rounding)'
    value: 52.5
    shown: ['the notes print 52.5 min']
    source: {cite: reading1, at: 'Section 6.7.4, p. 15'}
    origin: mit

  # ---- Problem 2 (Additional Problem 6.7.6; Conceptual Questions 6.6.1 and 6.6.3)

  - id: p2-stretched
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Resistance of the stretched wire": length ×3, area ÷3 (volume fixed)'
    inputs: {R0: 6.0, k: 3}
    formula: R0 * k / (1 / k)
    expected: '54'
    shown: ['= 9 \times 6.0\ \Omega = 54\ \Omega']
    source: {cite: reading1, at: 'Section 6.7.6, pp. 15 and 16 (the notes print 54 Ω)'}
    origin: page-own

  - id: p2-length-only
    where: 'Problem 2(a), check: tripling only the length'
    inputs: {R0: 6.0, k: 3}
    formula: R0 * k
    expected: '18'
    shown: ['would give 18 Ω']
    source: {cite: reading1, at: 'Section 6.7.6, p. 16 (our own check)'}
    origin: page-own

  - id: p2-area-ratio
    answer: p2-b
    where: 'Problem 2(b), answer box: same metal and length, R ∝ 1/A, so A1/A2 = R2/R1'
    inputs: {R1_over_R2: 4}
    formula: 1 / R1_over_R2
    expected: '0.25'
    shown: ['the ratio is $1/4 = 0.25$']
    source: {cite: reading1, at: 'Section 6.6, Question 1, p. 13 (our own solution)'}
    origin: page-own

  - id: p2-radius-ratio
    where: 'Problem 2(b): a quarter of the area means half the radius'
    inputs: {}
    formula: sqrt(0.25)
    expected: '0.5'
    shown: ['Wire 1 has half the radius of wire 2']
    source: {cite: reading1, at: 'Section 6.6, Question 1, p. 13 (our own solution)'}
    origin: page-own

  - id: p2-power-ratio
    where: 'Problem 2(c): at equal ΔV, P = ΔV²/R; the second (half the resistance) gets twice the power and twice the current'
    inputs: {V: 1, R2: 1}
    formula: (V**2 / R2) / (V**2 / (2 * R2))
    expected: '2'
    shown: ['the second conductor receives twice as much']
    source: {cite: reading1, at: 'Section 6.6, Question 3, p. 13 (our own solution)'}
    origin: page-own

  # ---- Problem 3 (Additional Problem 6.7.8)

  - id: p3-E1
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "Fields in the layers": against the potential drop of one layer divided by its thickness'
    formula: rho1*I/A
    equals: (I * rho1 * (d / 3) / A) / (d / 3)
    samples:
      rho1: [1, 3, 2, 1.7]
      I: [0.5, 2, 1, 0.3]
      A: [0.5, 2, 1, 4]
      d: [1, 2, 0.3, 5]
    tolerance: 1e-9
    shown: ['E_1 = \frac{\rho_1 I}{A}']
    source: {cite: reading1, at: 'Section 6.7.8, p. 16 (the notes print E1 = ρ1 I/A)'}
    origin: page-own

  - id: p3-R
    kind: identity
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "Resistance of the slab": against the integral of ρ(x)/A over the thickness, layer by layer'
    formula: d*(2*rho1 + rho2)/(3*A)
    equals: integrate('rho1 / A', 'x', 0, d / 3) + integrate('rho2 / A', 'x', d / 3, 2 * d / 3) + integrate('rho1 / A', 'x', 2 * d / 3, d)
    samples:
      d: [0.5, 2, 1, 1.3]
      A: [0.5, 2, 1, 0.7]
      rho1: [1, 2, 1.5, 4]
      rho2: [3, 6, 5, 1]
    tolerance: 1e-7
    shown: ['= \frac{d\,(2\rho_1 + \rho_2)}{3A}']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (the notes print R = d(2ρ1 + ρ2)/3A)'}
    origin: page-own

  - id: p3-R-uniform
    kind: identity
    where: 'Problem 3(b), check: with ρ1 = ρ2 = ρ the slab is uniform, R = ρd/A'
    formula: d*(2*rho + rho)/(3*A)
    equals: rho * d / A
    samples:
      d: [0.5, 2, 1]
      A: [0.5, 2, 3]
      rho: [1, 2, 7]
    tolerance: 1e-12
    shown: ['$d\cdot 3\rho/(3A) = \rho d/A$']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17'}
    origin: page-own

  - id: p3-dV2
    kind: identity
    answer: p3-c
    where: 'Problem 3(c), answer box and formula "Potential drops across the layers": the middle drop as current × layer resistance'
    formula: V*rho2/(2*rho1 + rho2)
    equals: (V / (rho1 * d / (3 * A) + rho2 * d / (3 * A) + rho1 * d / (3 * A))) * rho2 * d / (3 * A)
    samples:
      V: [1, 12, 5, 2]
      rho1: [1, 2, 1.5, 3]
      rho2: [3, 6, 4, 0.5]
      d: [1, 2, 0.5, 3]
      A: [1, 0.5, 2, 4]
    tolerance: 1e-9
    shown: ['\Delta V_2 = \frac{\rho_2 V}{2\rho_1 + \rho_2}']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (the notes print Vρ2/(2ρ1 + ρ2))'}
    origin: page-own

  - id: p3-drops-sum
    kind: identity
    where: 'Problem 3(c), check: the three drops add to V'
    formula: 2*V*rho1/(2*rho1 + rho2) + V*rho2/(2*rho1 + rho2)
    equals: V
    samples:
      V: [1, 12, 5]
      rho1: [1, 2, 0.4]
      rho2: [3, 6, 9]
    tolerance: 1e-12
    shown: ['The three drops add to $V(2\rho_1 + \rho_2)/(2\rho_1 + \rho_2) = V$']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17'}
    origin: page-own

  - id: p3-sigma-a
    kind: identity
    answer: p3-d1
    where: 'Problem 3(d), first answer box: Gauss pillbox at a, field 0 in the plate and E1 = ρ1 J in the layer, J = V/(R A)'
    formula: 3*eps0*V*rho1/(d*(2*rho1 + rho2))
    equals: eps0 * (rho1 * V / (A * (d * (2 * rho1 + rho2) / (3 * A))) - 0)
    samples:
      eps0: [0.5, 2, 1, 1.3]
      V: [1, 12, 5, 2]
      d: [0.5, 2, 1, 3]
      rho1: [1, 2, 1.5, 0.7]
      rho2: [3, 6, 4, 2]
      A: [1, 2, 0.5, 3]
    tolerance: 1e-9
    shown: ['\sigma_a = -\sigma_d = \frac{3\varepsilon_0 V \rho_1}{d\,(2\rho_1 + \rho_2)}']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (the notes print σa = 3ε0Vρ1/d(2ρ1 + ρ2))'}
    origin: page-own

  - id: p3-sigma-b
    kind: identity
    answer: p3-d2
    where: 'Problem 3(d), second answer box: Gauss pillbox at b, E2 − E1 with E = ρJ, J = V/(R A)'
    formula: 3*eps0*V*(rho2 - rho1)/(d*(2*rho1 + rho2))
    equals: eps0 * (rho2 - rho1) * V / (A * (d * (2 * rho1 + rho2) / (3 * A)))
    samples:
      eps0: [0.5, 2, 1, 1.3]
      V: [1, 12, 5, 2]
      d: [0.5, 2, 1, 3]
      rho1: [1, 2, 1.5, 0.7]
      rho2: [3, 6, 4, 2]
      A: [1, 2, 0.5, 3]
    tolerance: 1e-9
    shown: ['\sigma_b = -\sigma_c = \frac{3\varepsilon_0 V (\rho_2 - \rho_1)}{d\,(2\rho_1 + \rho_2)}']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (the notes print σb = 3ε0V(ρ2 − ρ1)/d(2ρ1 + ρ2))'}
    origin: page-own

  - id: p3-uniform-plates
    kind: identity
    where: 'Problem 3(d), check: with ρ1 = ρ2 the outer boundaries carry ε0V/d, a parallel-plate capacitor of gap d'
    formula: 3*eps0*V*rho/(d*(2*rho + rho))
    equals: eps0 * V / d
    samples:
      eps0: [0.5, 2, 1]
      V: [1, 12, 5]
      d: [0.5, 2, 1]
      rho: [1, 2, 9]
    tolerance: 1e-12
    shown: ['the outer ones carry $\pm\varepsilon_0 V/d$']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (our own check)'}
    origin: page-own

  - id: p3-limit-sigma-b
    kind: limit
    where: 'Problem 3(e): for ρ2 ≫ ρ1, σb·d/(3ε0V) = (ρ2 − ρ1)/(2ρ1 + ρ2) tends to 1 (ρ1 = 1)'
    formula: (rho2 - 1)/(2 + rho2)
    limit: '1'
    vary: {rho2: [100, 1e4, 1e6, 1e8]}
    tolerance: 1e-6
    shown: ['$\sigma_b \to 3\varepsilon_0 V/d$']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (our own solution)'}
    origin: page-own

  - id: p3-limit-E2
    kind: limit
    where: 'Problem 3(e): E2·d/V = 3ρ2/(2ρ1 + ρ2) tends to 3 for ρ2 ≫ ρ1 (ρ1 = 1)'
    formula: 3*rho2/(2 + rho2)
    limit: '3'
    vary: {rho2: [100, 1e4, 1e6, 1e8]}
    tolerance: 1e-6
    shown: ['tends to $3V/d$']
    source: {cite: reading1, at: 'Section 6.7.8, p. 17 (our own solution)'}
    origin: page-own

  # ---- Problem 4 (Additional Problem 7.11.1)

  - id: p4-series
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box and formula "Series connection": against a numerical solve of the loop rule 2ε − 2xr − xR = 0'
    formula: 2*eps/(R + 2*r)
    equals: solve('2 * eps - 2 * x * r - x * R', 'x', 0, 100)
    samples:
      eps: [1, 12, 1.5, 9]
      R: [3, 10, 10, 0.5]
      r: [0.1, 2, 0.5, 3]
    tolerance: 1e-7
    shown: ['I_s = \frac{2\varepsilon}{R + 2r}']
    source: {cite: mit, at: 'Section 7.11.1, p. 25 (our own solution)'}
    origin: page-own

  - id: p4-parallel
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box and formula "Parallel connection": against a numerical solve with both loops (battery currents i1, i2, i1 + i2 = x, by symmetry checked as ε − i r − x R = 0 with i = x/2)'
    formula: 2*eps/(2*R + r)
    equals: solve('eps - (x / 2) * r - x * R', 'x', 0, 100)
    samples:
      eps: [1, 12, 1.5, 9]
      R: [3, 10, 10, 0.5]
      r: [0.1, 2, 0.5, 3]
    tolerance: 1e-7
    shown: ['= \frac{2\varepsilon}{2R + r}']
    source: {cite: mit, at: 'Section 7.11.1, p. 25 (our own solution)'}
    origin: page-own

  - id: p4-parallel-thevenin
    kind: identity
    where: 'Problem 4(b), check: the pair as one battery of emf ε and internal resistance r/2 (r in parallel with r)'
    formula: eps/(R + r/2)
    equals: eps / (R + 1 / (1 / r + 1 / r))
    samples:
      eps: [1, 12, 1.5]
      R: [3, 10, 10]
      r: [0.1, 2, 0.5]
    tolerance: 1e-12
    shown: ['I_p = \frac{\varepsilon}{R + r/2}']
    source: {cite: mit, at: 'Section 7.11.1, p. 25 (our own solution)'}
    origin: page-own

  - id: p4-equal
    kind: identity
    where: 'Problem 4(c): at R = r the two currents are equal'
    formula: 2*eps/(r + 2*r)
    equals: 2 * eps / (2 * r + r)
    samples:
      eps: [1, 12]
      r: [0.1, 2]
    tolerance: 1e-12
    shown: ['The currents are equal when $R = r$']
    source: {cite: mit, at: 'Section 7.11.1, p. 26 (our own solution)'}
    origin: page-own

  - id: p4-example-series
    where: 'Problem 4(c), example (our numbers): ε = 1.5 V, r = 0.5 Ω, R = 10 Ω, series'
    inputs: {eps: 1.5, r: 0.5, R: 10}
    formula: 2 * eps / (R + 2 * r)
    expected: '0.273'
    tolerance: '0.2%'
    shown: ['gets $3/11 = 0.273$ A in series']
    source: {cite: mit, at: 'Section 7.11.1, p. 26 (our own numbers)'}
    origin: page-own

  - id: p4-example-parallel
    where: 'Problem 4(c), example (our numbers): the same in parallel'
    inputs: {eps: 1.5, r: 0.5, R: 10}
    formula: 2 * eps / (2 * R + r)
    expected: '0.146'
    tolerance: '0.3%'
    shown: ['only $3/20.5 = 0.146$ A in parallel']
    source: {cite: mit, at: 'Section 7.11.1, p. 26 (our own numbers)'}
    origin: page-own

  # ---- Problem 5 (Additional Problem 7.11.2; the notes' numbers)
  # Independent route: mesh currents. Left mesh i1 (up the left branch, down the middle), right mesh i2
  # (T through 5 Ω, down through the 30 V battery, up the middle). Loop rule:
  #   left:  10 − 2 i1 − 20 − 4 (i1 − i2) = 0  →  −6 i1 + 4 i2 = 10
  #   right: −5 i2 − 30 − 4 (i2 − i1) = 0      →   4 i1 − 9 i2 = 30
  # Cramer's rule with det = (−6)(−9) − 4·4 = 38.

  - id: p5-U
    where: 'Problem 5, formula "Junction rule at T": U = 20/19 V, here by a numerical solve of the junction rule'
    inputs: {}
    formula: solve('(-10 - x) / 2 + (30 - x) / 5 - x / 4', 'x', -100, 100)
    expected: '1.053'
    tolerance: '0.05%'
    shown: ['U = \frac{20}{19}\ \text{V} = 1.053\ \text{V}']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own solution)'}
    origin: page-own

  - id: p5-I2ohm
    answer: p5-a
    where: 'Problem 5, first answer box: the size of the current in the 2.0 Ω resistor, −i1 by Cramer''s rule'
    inputs: {}
    formula: -((10 * (-9) - 4 * 30) / 38)
    expected: '5.53'
    shown: ['so 5.53 A flows through the 2.0 Ω resistor']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own solution)'}
    origin: page-own

  - id: p5-I4ohm
    answer: p5-b
    where: 'Problem 5, second answer box: the current down the 4.0 Ω resistor, i1 − i2 by Cramer''s rule'
    inputs: {}
    formula: (10 * (-9) - 4 * 30) / 38 - ((-6) * 30 - 4 * 10) / 38
    expected: '0.263'
    shown: ['$I_M = 1.053/4 = 0.263$ A']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own solution)'}
    origin: page-own

  - id: p5-I5ohm
    answer: p5-c
    where: 'Problem 5, third answer box: the size of the current in the 5.0 Ω resistor, −i2 by Cramer''s rule'
    inputs: {}
    formula: -(((-6) * 30 - 4 * 10) / 38)
    expected: '5.79'
    shown: ['$I_R = (30 - 1.053)/5 = 5.79$ A']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own solution)'}
    origin: page-own

  - id: p5-IL-signed
    where: 'Problem 5: I_L = (−10 − U)/2 with U = 20/19 V'
    inputs: {}
    formula: (-10 - 20 / 19) / 2
    expected: '-5.53'
    shown: ['$I_L = (-10 - 1.053)/2 = -5.53$ A']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own solution)'}
    origin: page-own

  - id: p5-junction-check
    where: 'Problem 5, check at T: 5.53 + 0.263 = 5.79'
    inputs: {}
    formula: (10 + 20 / 19) / 2 + (20 / 19) / 4
    expected: '5.79'
    shown: ['$5.53 + 0.263 = 5.79$']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own check)'}
    origin: page-own

  - id: p5-loop-drop-2ohm
    where: 'Problem 5, loop check: 2.0 Ω × 5.53 A'
    inputs: {}
    formula: 2 * (10 + 20 / 19) / 2
    expected: '11.05'
    tolerance: '0.1%'
    shown: ['10 - 11.05 + 1.05 = 0']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own check)'}
    origin: page-own

  - id: p5-loop-drop-4ohm
    where: 'Problem 5, loop check: 4.0 Ω × 0.263 A, and the loop sum 10 − 11.05 + 1.05 = 0'
    inputs: {}
    formula: 4 * (20 / 19) / 4
    expected: '1.05'
    tolerance: '0.5%'
    shown: ['10 - 11.05 + 1.05 = 0']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own check)'}
    origin: page-own

  - id: p5-loop-sum
    where: 'Problem 5, loop check: the sum is zero'
    inputs: {}
    formula: 10 - 2 * (10 + 20 / 19) / 2 + 4 * (20 / 19) / 4
    expected: '0'
    tolerance: 1e-9
    shown: ['10 - 11.05 + 1.05 = 0']
    source: {cite: mit, at: 'Section 7.11.2, p. 26 (our own check)'}
    origin: page-own

  # ---- Problem 6 (Additional Problem 7.11.5; the notes' numbers; part (c) is ours)

  - id: p6-pair
    where: 'Problem 6(a): R2 and R3 in parallel'
    inputs: {R2: 6.0, R3: 4.0}
    formula: R2 * R3 / (R2 + R3)
    expected: '2.4'
    shown: ['$6.0 \times 4.0/(6.0 + 4.0) = 2.4$ Ω']
    source: {cite: mit, at: 'Section 7.11.5, p. 27 (our own solution)'}
    origin: page-own

  - id: p6-total-0
    where: 'Problem 6(a): the pair in series with R1'
    inputs: {R1: 8.0, R2: 6.0, R3: 4.0}
    formula: R1 + R2 * R3 / (R2 + R3)
    expected: '10.4'
    shown: ['In series with $R_1$: $10.4$ Ω']
    source: {cite: mit, at: 'Section 7.11.5, p. 27 (our own solution)'}
    origin: page-own

  - id: p6-I1-0
    answer: p6-a1
