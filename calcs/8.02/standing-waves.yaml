# Calculations on content/year-1/8.02/standing-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 13 and the Session 30 slides, with the page's own numbers.

page: content/year-1/8.02/standing-waves.mdx
calcs:
  - id: standing-identity
    kind: identity
    where: 'formula "Standing wave": sin(kx − ωt) + sin(kx + ωt) = 2 sin kx cos ωt'
    formula: sin(a - b) + sin(a + b)
    equals: 2 * sin(a) * cos(b)
    samples: {a: [0.3, 1.7, 4.0], b: [0.5, 2.2, 5.1]}
    tolerance: 1e-12
    shown: ['= 2E_0\sin kx\cos\omega t']
    source: {cite: reading2, at: 'slide 7'}
    origin: mit

  - id: em-standing-E
    kind: identity
    where: 'formula "Standing electromagnetic wave": cos(kx − ωt) − cos(kx + ωt) = 2 sin kx sin ωt'
    formula: cos(a - b) - cos(a + b)
    equals: 2 * sin(a) * sin(b)
    samples: {a: [0.3, 1.7, 4.0], b: [0.5, 2.2, 5.1]}
    tolerance: 1e-12
    shown: ['E_y = 2E_0\sin kx\sin\omega t']
    source: {cite: reading1, at: 'Eq. (13.5.6), p. 12'}
    origin: mit

  - id: oven-wavelength
    where: 'worked example (a): c/f ≈ 0.122 m'
    inputs: {}
    formula: 2.998e8 / 2.45e9
    expected: '0.122'
    tolerance: '0.5%'
    shown: ['\approx 0.122$ m']
    source: {cite: reading1, at: 'Eq. (13.4.23), p. 10'}
    origin: page-own

  - id: oven-node-spacing
    where: 'worked example (a): λ/2 ≈ 6.1 cm'
    inputs: {}
    formula: 2.998e8 / 2.45e9 / 2 * 100
    expected: '6.1'
    tolerance: '0.5%'
    shown: ['\lambda/2 \approx 6.1$ cm']
    source: {cite: reading1, at: 'Eq. (13.5.8), p. 13'}
    origin: page-own

  - id: oven-antinode
    where: 'worked example (b): 2E₀ = 2000 V/m'
    inputs: {}
    formula: 2 * 1000
    expected: '2000'
    shown: ['$2E_0 = 2000$ V/m']
    source: {cite: reading2, at: 'slide 7'}
    origin: page-own

  - id: oven-B0
    where: 'worked example (b): E₀/c ≈ 3.3 × 10⁻⁶ T'
    inputs: {}
    formula: 1000 / 2.998e8
    expected: '3.3e-6'
    tolerance: '1.5%'
    shown: ['\approx 3.3 \times 10^{-6}$ T']
    source: {cite: reading1, at: 'Eq. (13.4.26), p. 11'}
    origin: page-own
