# Calculations on content/year-1/8.02/biot-savart-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapters 8–9 and the Session 15 slides, with the page's own numbers.

page: content/year-1/8.02/biot-savart-law.mdx
calcs:
  - id: mu0
    kind: fact
    where: 'section "Currents create fields": μ₀ = 4π × 10⁻⁷ T m/A'
    value: 1.2566e-6
    shown: ['$\mu_0 = 4\pi \times 10^{-7}$ T m/A (Eq. 9.1.2']
    source: {cite: reading2, at: 'Eq. (9.1.2), p. 2'}
    origin: mit

  - id: half-height
    where: 'graph caption: B falls to half its centre value at z ≈ 0.77R'
    inputs: {}
    formula: sqrt(2**(2 / 3) - 1)
    expected: '0.77'
    tolerance: '0.5%'
    shown: ['half of it at z ≈ 0.77R']
    source: {cite: reading2, at: 'Eq. (9.1.15), p. 8'}
    origin: page-own

  - id: wire-field
    where: 'worked example (a): μ₀I/2πa = 4 × 10⁻⁵ T'
    inputs: {mu0: 1.25664e-6, I: 10, a: 0.05}
    formula: mu0 * I / (2 * pi * a)
    expected: '4e-5'
    tolerance: '0.01%'
    shown: ['/0.05 = 4 \times 10^{-5}$ T']
    source: {cite: reading2, at: 'Eq. (9.1.7), p. 5'}
    origin: page-own

  - id: coil-one-turn
    where: 'worked example (b): μ₀I/2R ≈ 3.14 × 10⁻⁵ T'
    inputs: {mu0: 1.25664e-6, I: 5, R: 0.1}
    formula: mu0 * I / (2 * R)
    expected: '3.14e-5'
    tolerance: '0.1%'
    shown: ['/0.2 \approx 3.14 \times 10^{-5}$ T']
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own

  - id: coil-100
    where: 'worked example (b): 100 turns ≈ 3.14 × 10⁻³ T'
    inputs: {mu0: 1.25664e-6, I: 5, R: 0.1}
    formula: 100 * mu0 * I / (2 * R)
    expected: '3.14e-3'
    tolerance: '0.1%'
    shown: ['about $3.14 \times 10^{-3}$ T']
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own

  - id: wires-force
    where: 'worked example (c): μ₀I₁I₂/2πa = 4 × 10⁻⁴ N/m'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 10 * 10 / (2 * pi * 0.05)
    expected: '4e-4'
    tolerance: '0.01%'
    shown: ['= 4 \times 10^{-4}$ N per metre']
    source: {cite: reading2, at: 'Eq. (9.2.1), p. 13'}
    origin: page-own

  - id: wire-force
    where: 'worked example (d): ILB = 1 N'
    inputs: {}
    formula: 10 * 0.2 * 0.5
    expected: '1'
    shown: ['$F = ILB = (10)(0.2)(0.5) = 1$ N']
    source: {cite: reading1, at: 'Eq. (8.3.1), p. 4'}
    origin: page-own
