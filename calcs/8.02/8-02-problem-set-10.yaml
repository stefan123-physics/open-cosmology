# Calculations on content/year-1/8.02/8-02-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Sources: MIT 8.02T Problem Solving 9 (The Displacement Current and Poynting Vector), Questions 1 to 13, and the
# 8.02 Course Notes, Chapter 13 (Liao, Dourmashkin, Belcher): Additional Problems 13.14.2, 13.14.6, 13.14.7(a),
# 13.14.10 and Conceptual Questions 1 and 7 of Section 13.13. Neither prints solutions for these: every formula
# answer is checked here by an independent route (a numerical derivative, an integral over the surface, a limit).
# The page asks readers to take mu0 = 4 pi e-7 T m/A and c = 3.00e8 m/s; the numbers here use the same values as
# inputs (calcs/constants.yaml has no mu0), and the exact c from constants.yaml where only two or three figures are shown.

page: content/year-1/8.02/8-02-problem-set-10.mdx
calcs:
  # ---- How to answer

  - id: mu0-value
    where: 'How to answer: mu0 = 4 pi × 10^-7 T m/A (CODATA 2018: 1.25663706212e-6 N/A², the same to 1e-9)'
    inputs: {mu0: 1.25663706212e-6}
    formula: mu0 / (4 * pi * 1e-7)
    expected: '1'
    tolerance: '1e-6'
    shown: ['Take $\mu_0 = 4\pi \times 10^{-7}\ \text{T·m/A}$']
    source: {cite: reading1, at: 'Section 13.4, p. 9 (value from CODATA 2018)'}
    origin: page-own

  - id: c-value
    where: 'How to answer: c = 3.00e8 m/s, rounded'
    inputs: {}
    formula: c
    expected: 3.00e8 m/s
    tolerance: '0.1%'
    shown: ['$c = 3.00 \times 10^{8}$ m/s']
    source: {cite: reading1, at: 'Eq. (13.4.15), p. 9'}
    origin: page-own

  # ---- Problem 1 (Problem Solving 9, Questions 1 to 8)

  - id: p1-E
    kind: identity
    answer: p1-a
    where: 'Problem 1(a), answer box and formula "Field between the plates": against sigma/eps0 with sigma = Q/(pi a^2)'
    formula: Q/(pi*a**2*eps0)
    equals: (Q / (pi * a**2)) / eps0
    samples:
      Q: [1, 5, 2.3, 0.4]
      a: [1, 2, 1.4, 0.3]
      eps0: [0.5, 2, 1, 3]
    tolerance: 1e-9
    shown: ['\vec E = \frac{Q(t)}{\pi a^2 \varepsilon_0}\,\hat k']
    source: {cite: mit, at: 'Question 1, p. 2; the session prints this field on p. 5'}
    origin: page-own

  - id: p1-flux
    kind: identity
    answer: p1-b
    where: 'Problem 1(b), answer box and formula "Flux through the disc": against the integral of E over the disc in rings 2 pi s ds'
    formula: Q*r**2/(eps0*a**2)
    equals: integrate('Q / (pi * a**2 * eps0) * 2 * pi * s', 's', 0, r)
    samples:
      Q: [1, 5, 2.3, 0.4]
      r: [0.2, 0.8, 0.5, 0.1]
      a: [1, 2, 1.4, 0.9]
      eps0: [0.5, 2, 1, 3]
    tolerance: 1e-7
    shown: ['= \frac{Q\,r^2}{\varepsilon_0 a^2}']
    source: {cite: mit, at: 'Question 2, pp. 2 and 3 (our own solution)'}
    origin: page-own

  - id: p1-Id
    kind: identity
    answer: p1-c
    where: 'Problem 1(c), answer box and formula "Displacement current through the disc": eps0 times a numerical time derivative of the flux, with Q(t) = I t'
    formula: I*r**2/a**2
    equals: eps0 * deriv('(I * t) * r**2 / (eps0 * a**2)', 't', 1.0)
    samples:
      I: [1, 5, 2.3, 0.4]
      r: [0.2, 0.8, 0.5, 0.1]
      a: [1, 2, 1.4, 0.9]
      eps0: [0.5, 2, 1, 3]
    tolerance: 1e-6
    shown: ['= I\,\frac{r^2}{a^2}']
    source: {cite: mit, at: 'Question 3, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-B
    kind: identity
    answer: p1-e
    where: 'Problem 1(e), answer box and formula "Field between the plates": solve B 2 pi r = mu0 I_d for B'
    formula: mu0*I*r/(2*pi*a**2)
    equals: solve('Bx * 2 * pi * r - mu0 * I * r**2 / a**2', 'Bx', 0, 100)
    samples:
      mu0: [0.5, 2, 1, 1.3]
      I: [1, 5, 2.3, 0.4]
      r: [0.2, 0.8, 0.5, 0.1]
      a: [1, 2, 1.4, 0.9]
    tolerance: 1e-7
    shown: ['B = \frac{\mu_0 I\,r}{2\pi a^2}']
    source: {cite: mit, at: 'Questions 5 and 6, p. 4; the session prints this field on p. 5'}
    origin: page-own

  - id: p1-B-edge
    kind: identity
    where: 'Problem 1(e), check: at r = a the field equals mu0 I/(2 pi a), the field of a long wire at the distance a'
    formula: mu0*I*a/(2*pi*a**2)
    equals: mu0 * I / (2 * pi * a)
    samples:
      mu0: [0.5, 2, 1, 1.3]
      I: [1, 5, 2.3, 0.4]
      a: [1, 2, 1.4, 0.9]
    tolerance: 1e-9
    shown: ['At $r = a$ it is $\mu_0 I/2\pi a$']
    source: {cite: mit, at: 'Question 6, p. 4 (our own check)'}
    origin: page-own

  # ---- Problem 2 (Problem Solving 9, Questions 9 to 13)

  - id: p2-S
    kind: identity
    answer: p2-a1
    where: 'Problem 2(a), first answer box and formula "Poynting vector between the plates": E B/mu0 with the session''s fields (mu0 cancels)'
    formula: Q*I*r/(2*pi**2*eps0*a**4)
    equals: (Q / (pi * a**2 * eps0)) * (mu0 * I * r / (2 * pi * a**2)) / mu0
    samples:
      Q: [1, 5, 2.3, 0.4]
      I: [1, 5, 2.3, 0.4]
      r: [0.2, 0.8, 0.5, 0.1]
      a: [1, 2, 1.4, 0.9]
      eps0: [0.5, 2, 1, 3]
      mu0: [0.7, 3, 1.1, 2]
    tolerance: 1e-9
    shown: ['= -\frac{Q\,I\,r}{2\pi^2\varepsilon_0 a^4}\,\hat r']
    source: {cite: mit, at: 'Question 9, p. 5 (our own solution)'}
    origin: page-own

  - id: p2-P
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "Energy per second through the sides": numerical integral of |S(a)| over the side, a dphi dz'
    formula: Q*I*d/(pi*eps0*a**2)
    equals: integrate('(Q * I * a / (2 * pi**2 * eps0 * a**4)) * a * d', 'phi', 0, 2 * pi)
    samples:
      Q: [1, 5, 2.3, 0.4]
      I: [1, 5, 2.3, 0.4]
      d: [0.05, 0.2, 0.1, 0.07]
      a: [1, 2, 1.4, 0.9]
      eps0: [0.5, 2, 1, 3]
    tolerance: 1e-7
    shown: ['= \frac{Q\,I\,d}{\pi\varepsilon_0 a^2}']
    source: {cite: mit, at: 'Question 10, p. 6 (our own solution)'}
    origin: page-own

  - id: p2-P-C
    kind: identity
    answer: p2-c
    where: 'Problem 2(c), answer box and formula "The same power in terms of C": the answer of (b) with C = eps0 pi a^2/d put in'
    formula: Q*I/C
    equals: Q * I * dd / (pi * (C * dd / (pi * aa**2)) * aa**2)
    samples:
      Q: [1, 3, 2.3, 0.4]
      I: [4, 8, 2.3, 0.4]
      C: [0.5, 2, 1, 3]
      dd: [0.05, 0.2, 0.1, 0.07]
      aa: [1, 2, 1.4, 0.9]
    tolerance: 1e-9
    shown: ['Q\,I\,\frac{d}{\varepsilon_0\pi a^2} = \frac{Q\,I}{C}']
    source: {cite: mit, at: 'Question 11, p. 6 (our own solution)'}
    origin: page-own

  - id: p2-dUdt
    kind: identity
    where: 'Problem 2(d), formula "Rate of change of the stored energy": numerical d/dt of Q^2/2C with Q(t) = Q1 + I (t - 1)'
    formula: Q1*I/C
    equals: deriv('(Q1 + I * (t - 1))**2 / (2 * C)', 't', 1.0)
    samples:
      Q1: [1, 3, 2.3, 0.4]
      I: [4, 8, 2.3, 0.4]
      C: [0.5, 2, 1, 3]
    tolerance: 1e-6
    shown: ['= \frac{Q}{C}\,\frac{dQ}{dt} = \frac{Q\,I}{C}']
    source: {cite: mit, at: 'Question 12, p. 6 (our own solution)'}
    origin: page-own

  # ---- Problem 3 (Additional Problem 13.14.10)

  - id: p3-data
    kind: fact
    where: 'Problem 3, statement: amplitude, wave number, angular frequency and the ferrite''s kappa_m and kappa, from the notes'
    shown: ['(300\ \text{V/m})\,\cos\!\left(\frac{2\pi}{3}\,x - 2\pi \times 10^{6}\,t\right)', 'the relative permeability $\kappa_m = 1000$ and the dielectric constant $\kappa = 10$']
    source: {cite: reading1, at: 'Section 13.14.10, pp. 49 and 50'}
    origin: mit

  - id: p3-lambda
    answer: p3-b
    where: 'Problem 3(b), answer box: lambda = 2 pi/k'
    inputs: {k: 2.0943951024 m**-1}
    formula: 2 * pi / k
    expected: 3 m
    tolerance: '0.1%'
    shown: ['$\lambda = 2\pi/k = 3$ m']
    source: {cite: reading1, at: 'Section 13.14.10(b), p. 50 (our own solution)'}
    origin: page-own

  - id: p3-f
    answer: p3-c
    where: 'Problem 3(c), answer box: f = omega/2 pi'
    inputs: {omega: 6.283185307e6 s**-1}
    formula: omega / (2 * pi)
    expected: 1.00e6 Hz
    tolerance: '0.1%'
    shown: ['$f = \omega/2\pi = 1.00 \times 10^6$ Hz']
    source: {cite: reading1, at: 'Section 13.14.10(c), p. 50 (our own solution)'}
    origin: page-own

  - id: p3-v
    answer: p3-d
    where: 'Problem 3(d), answer box and formula "Speed in the ferrite": v = omega/k'
    inputs: {omega: 6.283185307e6 s**-1, k: 2.0943951024 m**-1}
    formula: omega / k
    expected: 3.00e6 m/s
    tolerance: '0.1%'
    shown: ['= 3.00 \times 10^{6}\ \text{m/s}']
    source: {cite: reading1, at: 'Section 13.14.10(d), p. 50 (our own solution)'}
    origin: page-own

  - id: p3-v-material
    where: 'Problem 3(d), check: v = c/sqrt(kappa_m kappa) = c/100'
    inputs: {km: 1000, kappa: 10}
    formula: c / sqrt(km * kappa)
    expected: 3.00e6 m/s
    tolerance: '0.1%'
    shown: ['c/\sqrt{10^4} = c/100$, again $3.00 \times 10^6$ m/s']
    source: {cite: reading1, at: 'Section 13.14.10, p. 50 (our own check)'}
    origin: page-own

  - id: p3-B0
    answer: p3-e1
    where: 'Problem 3(e), first answer box and solution: B0 = E0/v'
    inputs: {E0: 300 V/m, v: 3.00e6 m/s}
    formula: E0 / v
    expected: 1.00e-4 T
    tolerance: '0.1%'
    shown: ['= 1.00 \times 10^{-4}$ T']
    source: {cite: reading1, at: 'Section 13.14.10(e), p. 50 (our own solution)'}
    origin: page-own

  - id: p3-faraday-check
    where: 'Problem 3(e), check: dE_z/dx and dB_y/dt have the same amplitude, 300 × 2 pi/3 = 1e-4 × 2 pi e6 (= 200 pi)'
    inputs: {E0: 300, k: 2.0943951024, B0: 1.00e-4, omega: 6.283185307e6}
    formula: (E0 * k) / (B0 * omega)
    expected: '1'
    tolerance: '1e-6'
    shown: ['both sides are $-(300)(2\pi/3)\sin(\ldots)$']
    source: {cite: reading1, at: 'Section 13.14.8, p. 49 (our own check)'}
    origin: page-own

  - id: p3-lambda-vac
    answer: p3-f
    where: 'Problem 3(f), answer box: lambda = c/f in vacuum, with the page''s c = 3.00e8 m/s'
    inputs: {cc: 3.00e8 m/s, f: 1.00e6 Hz}
    formula: cc / f
    expected: 300 m
    tolerance: '0.1%'
    shown: ['= 300$ m']
    source: {cite: reading1, at: 'Section 13.14.10(g), p. 50 (our own solution)'}
    origin: page-own

  # ---- Problem 4 (Additional Problems 13.14.6 and 13.14.7(a), Conceptual Question 13.13.7)

  - id: p4-u-E
    kind: identity
    answer: p4-a1
    where: 'Problem 4(a), first answer box: numerical time average over one period of u_E + u_B with B = E/c, c^2 = 1/(mu0 eps0)'
    formula: eps0*E0**2/2
    equals: integrate('(eps0 * (E0 * sin(-w * t))**2 / 2 + (E0 * sqrt(mu0 * eps0) * sin(-w * t))**2 / (2 * mu0))', 't', 0, 2 * pi / w) * w / (2 * pi)
    samples:
      eps0: [0.5, 2, 1, 1.3]
      E0: [1, 3, 2, 0.4]
      mu0: [0.7, 3, 1.1, 2]
      w: [1, 2.5, 4, 0.5]
    tolerance: 1e-6
    shown: ['\langle u\rangle = \frac{1}{2}\varepsilon_0 E_0^2']
    source: {cite: reading1, at: 'Section 13.14.6(a), p. 48 (our own solution; Eq. 13.6.11, p. 16)'}
    origin: page-own

  - id: p4-u-B
    kind: identity
    answer: p4-a2
    where: 'Problem 4(a), second answer box: eps0 E0^2/2 with E0 = c B0, c^2 = 1/(mu0 eps0)'
    formula: B0**2/(2*mu0)
    equals: eps0 * (B0 / sqrt(mu0 * eps0))**2 / 2
    samples:
      mu0: [0.5, 2, 1, 1.3]
      B0: [1, 3, 2, 0.4]
      eps0: [0.7, 3, 1.1, 2]
    tolerance: 1e-9
    shown: ['= \frac{B_0^2}{2\mu_0}']
    source: {cite: reading1, at: 'Section 13.14.6(a), p. 48 (our own solution)'}
    origin: page-own

  - id: p4-sun-I
    kind: fact
    where: 'Problem 4(c), statement: the intensity of sunlight outside the atmosphere, from the notes'
    shown: ['with the average intensity 1350 W/m²']
    source: {cite: reading1, at: 'Section 13.14.6(c), p. 48'}
    origin: mit

  - id: p4-u-sun
    answer: p4-c
    where: 'Problem 4(c), answer box and solution: <u> = I/c (also the pressure in Pa)'
    inputs: {I: 1350 W/m**2, cc: 3.00e8 m/s}
    formula: I / cc
    expected: 4.50e-6 J/m**3
    tolerance: '0.1%'
    shown: ['= 4.50 \times 10^{-6}\ \text{J/m}^3', 'the same number, $4.50 \times 10^{-6}$ Pa']
    source: {cite: reading1, at: 'Section 13.14.6(c), p. 48 (our own solution)'}
    origin: page-own

  - id: p4-pressure-vs-air
    where: 'Problem 4(c): the pressure compared with air pressure at the ground, about a twenty-billionth'
    inputs: {P: 4.50e-6 Pa, Patm: 101325 Pa}
    formula: Patm / P
    expected: '2.25e10'
    tolerance: '15%'
    shown: ['about a twenty-billionth of the air pressure at the ground']
    source: {cite: reading1, at: 'Section 13.14.6(c), p. 48 (our own remark; standard atmosphere 101325 Pa)'}
    origin: page-own

  - id: p4-Erms
    kind: fact
    where: 'Problem 4(d), statement: rms field, area and time from the notes'
    shown: ['the rms (root-mean-square) strength $3.0 \times 10^{-2}$ V/m', 'an area of $1.00\ \text{cm}^2$']
    source: {cite: reading1, at: 'Section 13.14.7(a), p. 48'}
    origin: mit

  - id: p4-I-rms
    where: 'Problem 4(d), formula "Intensity from the rms field": I = Erms^2/(mu0 c), with the page''s mu0 and c'
    inputs: {E: 3.0e-2 V/m, mu0: 1.2566370614e-6 T*m/A, cc: 3.00e8 m/s}
    formula: E**2 / (mu0 * cc)
    expected: 2.39e-6 W/m**2
    tolerance: '0.3%'
    shown: ['= 2.39 \times 10^{-6}\ \text{W/m}^2']
    source: {cite: reading1, at: 'Section 13.14.7(a), p. 48 (our own solution)'}
    origin: page-own

  - id: p4-energy-hour
    answer: p4-d
    where: 'Problem 4(d), answer box and solution: U = I A t over one hour'
    inputs: {E: 3.0e-2 V/m, mu0: 1.2566370614e-6 T*m/A, cc: 3.00e8 m/s, A: 1.00 cm**2, t: 3600 s}
    formula: E**2 / (mu0 * cc) * A * t
    expected: 8.6e-7 J
    tolerance: '0.5%'
    shown: ['= 8.6 \times 10^{-7}$ J']
    source: {cite: reading1, at: 'Section 13.14.7(a), p. 48 (our own solution)'}
    origin: page-own

  # ---- Problem 5 (Additional Problem 13.14.2)

  - id: p5-I
    answer: p5-a
    where: 'Problem 5(a), answer box and solution: I = P/(4 pi r^2) at 1 m'
    inputs: {P: 100 W, r: 1 m}
    formula: P / (4 * pi * r**2)
    expected: 7.96 W/m**2
    tolerance: '0.1%'
    shown: ['$I = P/4\pi r^2 = 100/(4\pi \times 1^2) = 7.96\ \text{W/m}^2$']
    source: {cite: reading1, at: 'Section 13.14.2(a), p. 46 (our own solution)'}
    origin: page-own

  - id: p5-E0
    answer: p5-b1
    where: 'Problem 5(b), first answer box and formula "Field amplitudes one metre from the bulb": E0 = sqrt(2 mu0 c I)'
    inputs: {P: 100 W, r: 1 m, mu0: 1.2566370614e-6 T*m/A, cc: 3.00e8 m/s}
    formula: sqrt(2 * mu0 * cc * P / (4 * pi * r**2))
    expected: 77.5 V/m
    tolerance: '0.1%'
    shown: ['= 77.5\ \text{V/m}']
    source: {cite: reading1, at: 'Section 13.14.2(a), p. 46 (our own solution)'}
    origin: page-own

  - id: p5-B0
    answer: p5-b2
    where: 'Problem 5(b), second answer box: B0 = E0/c'
    inputs: {P: 100 W, r: 1 m, mu0: 1.2566370614e-6 T*m/A, cc: 3.00e8 m/s}
    formula: sqrt(2 * mu0 * cc * P / (4 * pi * r**2)) / cc
    expected: 2.58e-7 T
    tolerance: '0.2%'
    shown: ['= 2.58 \times 10^{-7}\ \text{T}']
    source: {cite: reading1, at: 'Section 13.14.2(a), p. 46 (our own solution)'}
    origin: page-own

  - id: p5-two-mu0
    where: 'Problem 5(b), check: 2 mu0 in the denominator'
    inputs: {mu0: 1.2566370614e-6}
    formula: 2 * mu0
    expected: '2.51e-6'
    tolerance: '0.2%'
    shown: ['/(2.51 \times 10^{-6}) \approx 7.96$ W/m²']
    source: {cite: reading1, at: 'Section 13.14.2, p. 46 (our own check)'}
    origin: page-own

  - id: p5-K
    answer: p5-c
    where: 'Problem 5(c), answer box and formula "Largest surface current": K = 2 B0/mu0'
    inputs: {P: 100 W, r: 1 m, mu0: 1.2566370614e-6 T*m/A, cc: 3.00e8 m/s}
    formula: 2 * sqrt(2 * mu0 * cc * P / (4 * pi * r**2)) / cc / mu0
    expected: 0.411 A/m
    tolerance: '0.2%'
    shown: ['= 0.411\ \text{A/m}']
    source: {cite: reading1, at: 'Section 13.14.2(b), p. 46 (our own solution; Eq. 13.10.16, p. 38)'}
    origin: page-own
