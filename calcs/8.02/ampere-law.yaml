# Calculations on content/year-1/8.02/ampere-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 9 and the Session 18 slides, with the page's own numbers.

page: content/year-1/8.02/ampere-law.mdx
calcs:
  - id: frog-field
    kind: fact
    where: 'section "Magnetic materials and levitation": a frog levitated in a 16 T magnet'
    value: 16
    shown: ['a living frog floats stably in a 16 T magnet']
    source: {cite: reading2, at: 'slide 6'}
    origin: mit

  - id: mu0-over-2pi-times-I
    where: 'worked example (a): μ₀I/2π = 2 × 10⁻⁶ T m'
    inputs: {mu0: 1.25664e-6, I: 10}
    formula: mu0 * I / (2 * pi)
    expected: '2e-6'
    tolerance: '0.01%'
    shown: ['$\mu_0 I/2\pi = 2 \times 10^{-6}$ T m']
    source: {cite: reading1, at: 'Example 9.3, p. 17'}
    origin: page-own

  - id: inside
    where: 'worked example (a): inside at 0.5 mm = 10⁻³ T'
    inputs: {}
    formula: 2e-6 * 0.0005 / 0.001**2
    expected: '1e-3'
    shown: ['/(0.001)^2 = 10^{-3}$ T']
    source: {cite: reading1, at: 'Example 9.3, p. 17'}
    origin: page-own

  - id: surface
    where: 'worked example (a): at the surface 2 × 10⁻³ T'
    inputs: {}
    formula: 2e-6 / 0.001
    expected: '2e-3'
    shown: ['/0.001 = 2 \times 10^{-3}$ T']
    source: {cite: reading1, at: 'Example 9.3, p. 17'}
    origin: page-own

  - id: outside
    where: 'worked example (a): at 1 cm 2 × 10⁻⁴ T'
    inputs: {}
    formula: 2e-6 / 0.01
    expected: '2e-4'
    shown: ['/0.01 = 2 \times 10^{-4}$ T']
    source: {cite: reading1, at: 'Example 9.3, p. 17'}
    origin: page-own

  - id: turn-density
    where: 'worked example (b): n = 400/0.2 = 2000 per metre'
    inputs: {}
    formula: 400 / 0.2
    expected: '2000'
    shown: ['$n = 400/0.2 = 2000$ turns per metre']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: solenoid-field
    where: 'worked example (b): μ₀nI ≈ 5.03 × 10⁻³ T'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 2000 * 2
    expected: '5.03e-3'
    tolerance: '0.1%'
    shown: ['\approx 5.03 \times 10^{-3}$ T']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own
