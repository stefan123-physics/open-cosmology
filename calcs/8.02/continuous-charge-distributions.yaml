# Calculations on content/year-1/8.02/continuous-charge-distributions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 2 and the Session 2 slides, with the page's own numbers.

page: content/year-1/8.02/continuous-charge-distributions.mdx
calcs:
  - id: ring-peak-position
    where: 'worked example (a): z = R/√2 ≈ 0.0707 m for R = 0.1 m'
    inputs: {R: 0.1}
    formula: R / sqrt(2)
    expected: '0.0707'
    tolerance: '0.1%'
    shown: ['z = R/\sqrt 2 \approx 0.0707$ m']
    source: {cite: reading1, at: 'Eq. (2.10.14), p. 21'}
    origin: page-own

  - id: ring-peak-check
    where: 'worked example (a): the derivative of z/(R² + z²)^(3/2) vanishes at z = R/√2'
    inputs: {R: 0.1}
    formula: (((R / sqrt(2) + 1e-7) / (R**2 + (R / sqrt(2) + 1e-7)**2)**1.5) - ((R / sqrt(2) - 1e-7) / (R**2 + (R / sqrt(2) - 1e-7)**2)**1.5)) / 2e-7
    expected: '0'
    tolerance: 1e-3
    shown: ['when $R^2 + z^2 = 3z^2$']
    source: {cite: reading1, at: 'Eq. (2.10.14), p. 21'}
    origin: page-own

  - id: ring-r2z2
    where: 'worked example (a): R² + z² = 0.015 m²'
    inputs: {R: 0.1}
    formula: R**2 + R**2 / 2
    expected: '0.015'
    shown: ['There $R^2 + z^2 = 0.015$ m²']
    source: {cite: reading1, at: 'Eq. (2.10.14), p. 21'}
    origin: page-own

  - id: ring-peak-field
    where: 'worked example (a): E_z ≈ 1.73 × 10³ N/C'
    inputs: {k: 8.99e9, Q: 5e-9, R: 0.1}
    formula: k * Q * (R / sqrt(2)) / (1.5 * R**2)**1.5
    expected: '1.73e3'
    tolerance: '0.3%'
    shown: ['\approx 1.73 \times 10^3$ N/C']
    source: {cite: reading1, at: 'Eq. (2.10.14), p. 21'}
    origin: page-own

  - id: sheet-field
    where: 'worked example (b): σ/2ε₀ ≈ 5.65 × 10⁴ N/C'
    inputs: {sigma: 1e-6, eps0: 8.854e-12}
    formula: sigma / (2 * eps0)
    expected: '5.65e4'
    tolerance: '0.2%'
    shown: ['\approx 5.65 \times 10^4$ N/C']
    source: {cite: reading1, at: 'Eq. (2.10.20), p. 23'}
    origin: page-own

  - id: plot-scale
    where: 'graph: the scaled ring curve 2.6 · u/(1 + u²)^(3/2) peaks near 1, at u = 1/√2'
    inputs: {}
    formula: 2.6 * (1 / sqrt(2)) / (1.5)**1.5
    expected: '1.0'
    tolerance: '1%'
    shown: ['scaled so that its peak (at z = R/√2) is near 1']
    source: {cite: reading1, at: 'Eq. (2.10.14), p. 21'}
    origin: page-own
