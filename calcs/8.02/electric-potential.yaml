# Calculations on content/year-1/8.02/electric-potential.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 3 and the Session 4 slides, with the page's own numbers.

page: content/year-1/8.02/electric-potential.mdx
calcs:
  - id: electron-volt
    kind: fact
    where: 'section "The electric potential": 1 eV = 1.6 × 10⁻¹⁹ J'
    value: 1.6e-19
    shown: ['$1\text{ eV} = 1.6 \times 10^{-19}$ J']
    source: {cite: reading1, at: 'Eq. (3.1.12), p. 4'}
    origin: mit

  - id: potential-sum
    where: 'worked example (a): 2/0.9 − 1/0.6 + 1/0.3 terms'
    inputs: {}
    formula: 2 / 0.9 - 1 / 0.6 + 1 / 0.3
    expected: '3.889'
    tolerance: '0.05%'
    shown: ['8.99 \times (2.222 - 1.667 + 3.333)']
    source: {cite: reading1, at: 'Eq. (3.3.4), p. 6'}
    origin: page-own

  - id: potential-at-point
    where: 'worked example (a): V ≈ 35.0 V'
    inputs: {k: 8.99e9, q1: 2e-9, q2: -1e-9, q3: 1e-9}
    formula: k * (q1 / 0.9 + q2 / 0.6 + q3 / 0.3)
    expected: '35.0'
    tolerance: '0.2%'
    shown: ['\approx 35.0$ V']
    source: {cite: reading1, at: 'Eq. (3.3.4), p. 6'}
    origin: page-own

  - id: configuration-energy
    where: 'worked example (b): U ≈ −6.0 × 10⁻⁸ J'
    inputs: {k: 8.99e9, q1: 2e-9, q2: -1e-9, q3: 1e-9}
    formula: k * (q1 * q2 / 0.3 + q1 * q3 / 0.6 + q2 * q3 / 0.3)
    expected: '-6.0e-8'
    tolerance: '0.5%'
    shown: ['\approx -6.0 \times 10^{-8}$ J']
    source: {cite: reading1, at: 'Eq. (3.3.7), p. 8'}
    origin: page-own

  - id: pair-terms
    where: 'worked example (b): −6.667 + 3.333 − 3.333 (in units of 10⁻¹⁸ C²/m)'
    inputs: {}
    formula: 2 * (-1) / 0.3 + 2 * 1 / 0.6 + (-1) * 1 / 0.3
    expected: '-6.667'
    tolerance: '0.05%'
    shown: ['(-6.667 + 3.333 - 3.333)']
    source: {cite: reading1, at: 'Eq. (3.3.7), p. 8'}
    origin: page-own

  - id: electron-energy
    where: 'worked example (c): 100 eV = 1.6 × 10⁻¹⁷ J'
    inputs: {e: 1.6e-19}
    formula: 100 * e
    expected: '1.6e-17'
    shown: ['= 1.6 \times 10^{-17}$ J']
    source: {cite: reading1, at: 'Eq. (3.1.12), p. 4'}
    origin: page-own
