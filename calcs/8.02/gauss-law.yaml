# Calculations on content/year-1/8.02/gauss-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 4 and the Session 5 slides, with the page's own numbers.

page: content/year-1/8.02/gauss-law.mdx
calcs:
  - id: sphere-flux
    where: 'section "Gauss''s law": Q/(4πε₀r²) × 4πr² = Q/ε₀ (checked for Q = 1, ε₀ = 1, r = 2)'
    inputs: {}
    formula: 1 / (4 * pi * 2**2) * 4 * pi * 2**2
    expected: '1'
    shown: ['so the flux is $Q/\varepsilon_0$, whatever the radius']
    source: {cite: reading1, at: 'Eq. (4.2.4), p. 4'}
    origin: mit

  - id: kQ
    where: 'worked example (a): k_e Q = 26.97 V m'
    inputs: {k: 8.99e9, Q: 3e-9}
    formula: k * Q
    expected: '26.97'
    shown: ['= 26.97$ V m']
    source: {cite: reading2, at: 'slide 30'}
    origin: page-own

  - id: inside
    where: 'worked example (a): k_e Q r/a³ at r = 2 cm ≈ 4.32 × 10³ N/C'
    inputs: {k: 8.99e9, Q: 3e-9}
    formula: k * Q * 0.02 / 0.05**3
    expected: '4.32e3'
    tolerance: '0.2%'
    shown: ['\approx 4.32 \times 10^3$ N/C']
    source: {cite: reading2, at: 'slide 31'}
    origin: page-own

  - id: surface
    where: 'worked example (a): k_e Q/a² ≈ 1.08 × 10⁴ N/C'
    inputs: {k: 8.99e9, Q: 3e-9}
    formula: k * Q / 0.05**2
    expected: '1.08e4'
    tolerance: '0.2%'
    shown: ['\approx 1.08 \times 10^4$ N/C']
    source: {cite: reading2, at: 'slide 30'}
    origin: page-own

  - id: outside
    where: 'worked example (a): k_e Q/r² at 10 cm ≈ 2.70 × 10³ N/C'
    inputs: {k: 8.99e9, Q: 3e-9}
    formula: k * Q / 0.1**2
    expected: '2.70e3'
    tolerance: '0.2%'
    shown: ['\approx 2.70 \times 10^3$ N/C']
    source: {cite: reading2, at: 'slide 30'}
    origin: page-own

  - id: wire
    where: 'worked example (b): 2 k_e λ/r ≈ 360 N/C'
    inputs: {k: 8.99e9, lam: 2e-9}
    formula: 2 * k * lam / 0.1
    expected: '360'
    tolerance: '0.2%'
    shown: ['\approx 360$ N/C']
    source: {cite: reading1, at: 'Eq. (4.2.16), p. 8'}
    origin: page-own

  - id: inside-potential-surface
    kind: identity
    where: 'formula "Potential inside a uniform ball": matches k_e Q/a at r = a'
    formula: Q / (8 * pi * e0 * a) * (3 - a**2 / a**2)
    equals: Q / (4 * pi * e0 * a)
    samples: {Q: [1.0, 2.5], e0: [1.0, 0.3], a: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['V(r) = \frac{Q}{8\pi\varepsilon_0 a}\left(3 - \frac{r^2}{a^2}\right)']
    source: {cite: reading2, at: 'slide 44'}
    origin: mit
