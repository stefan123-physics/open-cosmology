# Calculations on content/year-1/8.02/maxwell-equations-and-em-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 13 and the Session 28 slides, with the page's own numbers.

page: content/year-1/8.02/maxwell-equations-and-em-waves.mdx
calcs:
  - id: speed-of-light
    where: 'formula "Speed of electromagnetic waves": 1/√(μ₀ε₀) ≈ 2.998 × 10⁸ m/s (the notes print 2.997)'
    inputs: {mu0: 1.25664e-6, eps0: 8.85e-12}
    formula: 1 / sqrt(mu0 * eps0)
    expected: '2.998e8'
    tolerance: '0.03%'
    shown: ['\approx 2.998 \times 10^8\ \text{m/s}']
    source: {cite: reading1, at: 'Eq. (13.4.15), p. 9'}
    origin: mit

  - id: solar-constant
    kind: fact
    where: 'section "Energy": solar constant 1.35 × 10³ W/m²'
    value: 1.35e3
    shown: ['$\langle S\rangle = 1.35 \times 10^3$ W/m²']
    source: {cite: reading1, at: 'Example 13.1, pp. 16–17'}
    origin: mit

  - id: solar-E0
    where: 'section "Energy": E₀ = √(2S/cε₀) ≈ 1.01 × 10³ V/m'
    inputs: {S: 1.35e3, c: 3.0e8, eps0: 8.85e-12}
    formula: sqrt(2 * S / (c * eps0))
    expected: '1.01e3'
    tolerance: '0.5%'
    shown: ['$E_0 \approx 1.01 \times 10^3$ V/m']
    source: {cite: reading1, at: 'Example 13.1, pp. 16–17'}
    origin: mit

  - id: solar-B0
    where: 'section "Energy": B₀ = E₀/c ≈ 3.4 × 10⁻⁶ T'
    inputs: {S: 1.35e3, c: 3.0e8, eps0: 8.85e-12}
    formula: sqrt(2 * S / (c * eps0)) / c
    expected: '3.4e-6'
    tolerance: '2%'
    shown: ['$B_0 \approx 3.4 \times 10^{-6}$ T']
    source: {cite: reading1, at: 'Example 13.1, pp. 16–17'}
    origin: mit

  - id: capacitor-field
    where: 'worked example (a): μ₀I/2πR = 8 × 10⁻⁶ T'
    inputs: {mu0: 1.25664e-6}
    formula: mu0 * 2 / (2 * pi * 0.05)
    expected: '8e-6'
    tolerance: '0.01%'
    shown: ['/0.05 = 8 \times 10^{-6}$ T']
    source: {cite: reading1, at: 'Eq. (13.1.4), p. 3'}
    origin: page-own

  - id: laser-intensity
    where: 'worked example (b): 10⁻³/10⁻⁶ = 1000 W/m²'
    inputs: {}
    formula: 1e-3 / 1e-6
    expected: '1000'
    shown: ['$I = 10^{-3}/10^{-6} = 1000$ W/m²']
    source: {cite: reading1, at: 'Eq. (13.6.8), p. 16'}
    origin: page-own

  - id: laser-E0
    where: 'worked example (b): √(2μ₀cI) ≈ 868 V/m'
    inputs: {mu0: 1.25664e-6, c: 2.998e8}
    formula: sqrt(2 * mu0 * c * 1000)
    expected: '868'
    tolerance: '0.2%'
    shown: ['\approx 868$ V/m']
    source: {cite: reading1, at: 'Eq. (13.6.8), p. 16'}
    origin: page-own

  - id: laser-B0
    where: 'worked example (b): E₀/c ≈ 2.9 × 10⁻⁶ T'
    inputs: {mu0: 1.25664e-6, c: 2.998e8}
    formula: sqrt(2 * mu0 * c * 1000) / c
    expected: '2.9e-6'
    tolerance: '1%'
    shown: ['\approx 2.9 \times 10^{-6}$ T']
    source: {cite: reading1, at: 'Eq. (13.6.8), p. 16'}
    origin: page-own

  - id: radio-wavelength
    where: 'worked example (c): c/f ≈ 3.0 m'
    inputs: {}
    formula: 2.998e8 / 1e8
    expected: '3.0'
    tolerance: '0.2%'
    shown: ['\approx 3.0$ m']
    source: {cite: reading2, at: 'slide 19'}
    origin: page-own

  - id: radio-k
    where: 'worked example (c): 2π/λ ≈ 2.10 rad/m'
    inputs: {}
    formula: 2 * pi / (2.998e8 / 1e8)
    expected: '2.10'
    tolerance: '0.3%'
    shown: ['\approx 2.10$ rad/m']
    source: {cite: reading2, at: 'slide 18'}
    origin: page-own
