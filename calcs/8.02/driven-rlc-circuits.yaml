# Calculations on content/year-1/8.02/driven-rlc-circuits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 12 and the Session 26 slides, with the page's own numbers.

page: content/year-1/8.02/driven-rlc-circuits.mdx
calcs:
  - id: us-mains
    kind: fact
    where: 'section "AC sources": 120 V rms at 60 Hz'
    value: 120
    shown: ['US wall sockets supply 120 V rms at 60 Hz']
    source: {cite: reading1, at: 'Section 12.2.1, p. 4'}
    origin: mit

  - id: omega0
    where: 'worked example (a): 1/√(0.1 × 10⁻⁵) = 1000 rad/s'
    inputs: {}
    formula: 1 / sqrt(0.1 * 1e-5)
    expected: '1000'
    tolerance: '0.01%'
    shown: ['(10^{-5})} = 1000$ rad/s']
    source: {cite: reading1, at: 'Eq. (12.3.17), p. 12'}
    origin: page-own

  - id: f0
    where: 'worked example (a): f₀ ≈ 159 Hz'
    inputs: {}
    formula: 1000 / (2 * pi)
    expected: '159'
    tolerance: '0.2%'
    shown: ['\approx 159$ Hz']
    source: {cite: reading1, at: 'Section 12.1, p. 1'}
    origin: page-own

  - id: xl
    where: 'worked example (b): X_L = 50 Ω'
    inputs: {}
    formula: 500 * 0.1
    expected: '50'
    shown: ['$X_L = 500 \times 0.1 = 50$ Ω']
    source: {cite: reading1, at: 'Eq. (12.2.16), p. 5'}
    origin: page-own

  - id: xc
    where: 'worked example (b): X_C = 200 Ω'
    inputs: {}
    formula: 1 / (500 * 1e-5)
    expected: '200'
    shown: ['= 200$ Ω']
    source: {cite: reading1, at: 'Eq. (12.2.23), p. 7'}
    origin: page-own

  - id: z
    where: 'worked example (b): Z ≈ 150.3 Ω'
    inputs: {}
    formula: sqrt(10**2 + 150**2)
    expected: '150.3'
    tolerance: '0.05%'
    shown: ['\approx 150.3$ Ω']
    source: {cite: reading2, at: 'slide 33'}
    origin: page-own

  - id: i0
    where: 'worked example (b): I₀ ≈ 0.067 A'
    inputs: {}
    formula: 10 / sqrt(10**2 + 150**2)
    expected: '0.0665'
    tolerance: '1%'
    shown: ['\approx 0.067$ A']
    source: {cite: reading2, at: 'slide 33'}
    origin: page-own

  - id: phase
    where: 'worked example (b): φ ≈ −86°'
    inputs: {}
    formula: atan(-150 / 10) * 180 / pi
    expected: '-86.2'
    tolerance: '0.5%'
    shown: ['$\varphi \approx -86°$']
    source: {cite: reading2, at: 'slide 33'}
    origin: page-own

  - id: quality
    where: 'worked example (c): Q = 10, Δω = 100 rad/s'
    inputs: {}
    formula: 1000 * 0.1 / 10
    expected: '10'
    shown: ['= 1000 \times 0.1/10 = 10$']
    source: {cite: reading1, at: 'Eq. (12.4.16), p. 16'}
    origin: page-own

  - id: width
    where: 'worked example (c): R/L = 100 rad/s'
    inputs: {}
    formula: 10 / 0.1
    expected: '100'
    shown: ['$\Delta\omega = R/L = 100$ rad/s']
    source: {cite: reading1, at: 'Eq. (12.4.15), p. 16'}
    origin: page-own

  - id: peak-voltage
    where: 'worked example (d): √2 × 120 ≈ 170 V'
    inputs: {}
    formula: sqrt(2) * 120
    expected: '170'
    tolerance: '0.5%'
    shown: ['\times 120 \approx 170$ V']
    source: {cite: reading1, at: 'Eq. (12.2.8), p. 4'}
    origin: page-own
