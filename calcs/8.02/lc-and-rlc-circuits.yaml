# Calculations on content/year-1/8.02/lc-and-rlc-circuits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.02T (Spring 2005) Course Notes Chapter 11 and the Session 25 slides, with the page's own numbers.

page: content/year-1/8.02/lc-and-rlc-circuits.mdx
calcs:
  - id: plot-omega-prime
    where: 'graph caption: R/2L = 0.1ω₀ gives ω′ ≈ 0.995ω₀'
    inputs: {}
    formula: sqrt(1 - 0.1**2)
    expected: '0.995'
    tolerance: '0.05%'
    shown: ['(so ω′ ≈ 0.995ω₀)']
    source: {cite: reading1, at: 'Eq. (11.6.6), p. 26'}
    origin: page-own

  - id: omega0
    where: 'worked example (a): 1/√(LC) = 10⁴ rad/s'
    inputs: {}
    formula: 1 / sqrt(1e-2 * 1e-6)
    expected: '1e4'
    tolerance: '0.01%'
    shown: ['= 10^4$ rad/s, so']
    source: {cite: reading1, at: 'Eq. (11.5.6), p. 21'}
    origin: page-own

  - id: frequency
    where: 'worked example (a): f = ω₀/2π ≈ 1592 Hz'
    inputs: {}
    formula: 1e4 / (2 * pi)
    expected: '1592'
    tolerance: '0.05%'
    shown: ['\approx 1592$ Hz']
    source: {cite: reading2, at: 'slide 12'}
    origin: page-own

  - id: max-current
    where: 'worked example (a): ω₀Q₀ = 0.05 A'
    inputs: {}
    formula: 1e4 * 5e-6
    expected: '0.05'
    shown: ['(5 \times 10^{-6}) = 0.05$ A']
    source: {cite: reading1, at: 'Eq. (11.5.7), p. 21'}
    origin: page-own

  - id: energy
    where: 'worked example (b): Q₀²/2C = 1.25 × 10⁻⁵ J = ½LI₀²'
    inputs: {}
    formula: 0.5 * 1e-2 * 0.05**2
    expected: '1.25e-5'
    shown: ['= 1.25 \times 10^{-5}$ J']
    source: {cite: reading1, at: 'Eq. (11.5.12), p. 22'}
    origin: page-own

  - id: damping
    where: 'worked example (c): R/2L = 1000 s⁻¹'
    inputs: {}
    formula: 20 / (2 * 1e-2)
    expected: '1000'
    shown: ['$R/2L = 20/0.02 = 1000$']
    source: {cite: reading1, at: 'Eq. (11.6.5), p. 26'}
    origin: page-own

  - id: omega-damped
    where: 'worked example (c): √(10⁸ − 10⁶) ≈ 9950 rad/s'
    inputs: {}
    formula: sqrt(1e8 - 1e6)
    expected: '9950'
    tolerance: '0.01%'
    shown: ['\approx 9950$ rad/s']
    source: {cite: reading1, at: 'Eq. (11.6.6), p. 26'}
    origin: page-own

  - id: decay-time
    where: 'worked example (c): 2L/R = 1 ms, about 1.6 oscillations'
    inputs: {}
    formula: 2 * 1e-2 / 20 * 9950 / (2 * pi)
    expected: '1.58'
    tolerance: '0.5%'
    shown: ['in $2L/R = 1$ ms, about 1.6 oscillations']
    source: {cite: reading1, at: 'Eq. (11.6.4), p. 25'}
    origin: page-own

  - id: half-percent
    where: 'worked example (c): ω′ is half a percent below ω₀'
    inputs: {}
    formula: (1 - sqrt(1e8 - 1e6) / 1e4) * 100
    expected: '0.5'
    tolerance: '1%'
    shown: ['half a percent lower']
    source: {cite: reading1, at: 'Eq. (11.6.6), p. 26'}
    origin: page-own
