# Calculations on content/year-1/8.02/8-02-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Neither MIT's Problem Solving 3 nor the Additional Problems of the course notes print solutions, so every formula
# answer is checked here by an independent route: the enclosed charge or the potential as a numerical integral,
# the field from Gauss's law with a numerically integrated charge, or the stored energy integrated over the field.

page: content/year-1/8.02/8-02-problem-set-3.mdx
calcs:
  # ---- Problem 1 (Problem Solving 3)

  - id: p1-regions
    answer: p1-c
    where: 'Problem 1(c), answer box: three regions, r < a, a < r < b and r > b'
    inputs: {}
    formula: 1 + 1 + 1
    expected: '3'
    shown: ['So there are three regions.']
    source: {cite: mit, at: 'Step 3, p. 2 (our own solution)'}
    origin: page-own

  - id: p1-flux
    kind: identity
    answer: p1-e
    where: 'Problem 1(e), answer box and formula "Flux out of the Gaussian cylinder": E times the side area, the angle integral done numerically'
    formula: 2*pi*r*l*E
    equals: integrate('E * r', 't', 0, 2 * pi) * l
    samples:
      r: [0.1, 2, 0.7, 1.3]
      l: [0.5, 5, 2, 1]
      E: [1, 10, 3, 6]
    tolerance: 1e-9
    shown: ['= 2\pi r\ell\,E']
    source: {cite: mit, at: 'Step 5, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-qin
    kind: identity
    answer: p1-f
    where: 'Problem 1(f), answer box and formula "Charge inside the Gaussian cylinder": the density integrated over rings of area 2 pi s ds, times the length l'
    formula: Q*r**2*l/(a**2*L)
    equals: integrate('Q / (pi * a**2 * L) * 2 * pi * s', 's', 0, r) * l
    samples:
      Q: [0.5, 5, 2, 1]
      r: [0.1, 1, 0.5, 0.8]
      a: [1, 2, 1.5, 1.2]
      l: [0.5, 5, 2, 1]
      L: [5, 20, 10, 7]
    tolerance: 1e-9
    shown: ['= \frac{Q r^2 \ell}{a^2 L}']
    source: {cite: mit, at: 'Step 6, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-E-inside
    kind: identity
    answer: p1-g
    where: 'Problem 1(g), answer box and formula "Field inside the solid cylinder": the numerically integrated charge per length over eps0, divided by 2 pi r'
    formula: Q*r/(2*pi*eps0*a**2*L)
    equals: integrate('Q / (pi * a**2 * L) * 2 * pi * s', 's', 0, r) / (eps0 * 2 * pi * r)
    samples:
      Q: [0.5, 5, 2, 1]
      r: [0.1, 1, 0.5, 0.8]
      eps0: [0.5, 2, 1, 1.5]
      a: [1, 2, 1.5, 1.2]
      L: [5, 20, 10, 7]
    tolerance: 1e-9
    shown: ['E = \frac{Q\,r}{2\pi\varepsilon_0 a^2 L}']
    source: {cite: mit, at: 'Step 7, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-E-between
    kind: identity
    answer: p1-h
    where: 'Problem 1(h), answer box and formula "Field between the cylinders": the whole inner charge per length, integrated numerically, over eps0 and 2 pi r'
    formula: Q/(2*pi*eps0*L*r)
    equals: integrate('Q / (pi * a**2 * L) * 2 * pi * s', 's', 0, a) / (eps0 * 2 * pi * r)
    samples:
      Q: [0.5, 5, 2, 1]
      r: [1, 3, 2, 1.5]
      a: [0.5, 1, 0.7, 0.9]
      eps0: [0.5, 2, 1, 1.5]
      L: [5, 20, 10, 7]
    tolerance: 1e-9
    shown: ['E = \frac{Q}{2\pi\varepsilon_0 L\,r}']
    source: {cite: mit, at: 'Step 7, p. 3 (our own solution)'}
    origin: page-own

  - id: p1-dV-inner
    kind: identity
    answer: p1-j
    where: 'Problem 1(j), answer box and formula "From the axis to the surface": minus the numerical integral of the inside field from 0 to a'
    formula: -Q/(4*pi*eps0*L)
    equals: -integrate('Q * s / (2 * pi * eps0 * a**2 * L)', 's', 0, a)
    samples:
      Q: [0.5, 5, 2, 1]
      eps0: [0.5, 2, 1, 1.5]
      a: [0.5, 2, 1, 1.3]
      L: [5, 20, 10, 7]
    tolerance: 1e-9
    shown: ['= -\frac{Q}{4\pi\varepsilon_0 L}']
    source: {cite: mit, at: 'Penultimate Question, p. 4 (our own solution)'}
    origin: page-own

  - id: p1-dV-between
    kind: identity
    answer: p1-k
    where: 'Problem 1(k), answer box and formula "Between the cylinders": minus the numerical integral of the field between a and b'
    formula: -Q*log(b/a)/(2*pi*eps0*L)
    equals: -integrate('Q / (2 * pi * eps0 * L * s)', 's', a, b)
    samples:
      Q: [0.5, 5, 2, 1]
      a: [0.5, 1, 0.7, 0.9]
      b: [1.5, 4, 2, 3]
      eps0: [0.5, 2, 1, 1.5]
      L: [5, 20, 10, 7]
    tolerance: 1e-9
    shown: ['= -\frac{Q}{2\pi\varepsilon_0 L}\ln\frac{b}{a}']
    source: {cite: mit, at: 'Final Question, p. 4 (our own solution)'}
    origin: page-own

  - id: p1-dV-number
    answer: p1-l
    where: 'Problem 1(l), answer box and formula "The number": Q = 4.0 nC, L = 2.0 m, a = 1.0 cm, b = 4.0 cm, with 2 ke = 1/(2 pi eps0)'
    inputs: {Q: 4e-9 C, L: 2 m, a: 0.01 m, b: 0.04 m, eps0: 8.85e-12 F/m}
    formula: -Q * log(b / a) / (2 * pi * eps0 * L)
    expected: -49.9 V
    shown: ['\ln 4 \approx -49.9\ \text{V}']
    source: {cite: mit, at: 'Final Question, p. 4 (our addition, our own solution)'}
    origin: page-own

  - id: p1-dV-number-check
    where: 'Problem 1(l), solution check: ln 4 and 2 ke Q / L'
    inputs: {}
    formula: log(4)
    expected: '1.39'
    shown: ['$\ln 4 \approx 1.39$']
    source: {cite: mit, at: 'Final Question, p. 4 (our addition, our own solution)'}
    origin: page-own

  - id: p1-dV-number-check2
    where: 'Problem 1(l), solution check: 2 ke Q / L'
    inputs: {ke: 8.99e9, Q: 4e-9, L: 2}
    formula: 2 * ke * Q / L
    expected: '36'
    shown: ['$2k_e Q/L \approx 36$ V']
    source: {cite: mit, at: 'Final Question, p. 4 (our addition, our own solution)'}
    origin: page-own

  - id: p1-ke
    where: '"How to answer": ke = 1/(4 pi eps0) with eps0 = 8.85e-12 F/m'
    inputs: {eps0: 8.85e-12}
    formula: 1 / (4 * pi * eps0)
    expected: '8.99e9'
    shown: ['$k_e = 1/(4\pi\varepsilon_0) = 8.99 \times 10^9$ N m²/C²']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  # ---- Problem 2 (Additional Problem 4.10.1)

  - id: p2-hollow
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Field in the hollow": the y component of the two ball fields at a sample point (0, y0, 0) in the hollow, each from Gauss''s law with its enclosed charge integrated numerically'
    formula: rho*R/(3*eps0)
    equals: integrate('rho * 4 * pi * s**2', 's', 0, y0) / (4 * pi * eps0 * y0**2) + integrate('rho * 4 * pi * s**2', 's', 0, R - y0) / (4 * pi * eps0 * (R - y0)**2)
    samples:
      rho: [0.5, 5, 2, 1]
      R: [0.5, 2, 1, 1.5]
      eps0: [0.5, 2, 1, 1.5]
      y0: [0.2, 0.6, 0.3, 0.5]
    tolerance: 1e-9
    shown: ['= \frac{\rho R}{3\varepsilon_0}\,\hat j']
    source: {cite: reading1, at: 'Additional Problem 4.10.1, p. 36 (our own solution)'}
    origin: page-own

  # ---- Problem 3 (Additional Problem 4.10.2)

  - id: p3-E-n
    kind: identity
    answer: p3-a1
    where: 'Problem 3(a), first box and formula "Field in the n layer": E_z = (charge per area below z minus above z) / (2 eps0), each slab layer as a sheet of field sigma/2eps0, integrated numerically'
    formula: rho0*(z - a)/eps0
    equals: (integrate('-rho0', 's', -a, 0) + integrate('rho0', 's', 0, z) - integrate('rho0', 's', z, a)) / (2 * eps0)
    samples:
      rho0: [0.5, 5, 2, 1]
      z: [0.1, 0.9, 0.5, 0.3]
      a: [1, 2, 1.5, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['E_z = \frac{\rho_0}{\varepsilon_0}\,(z - a)']
    source: {cite: reading1, at: 'Additional Problem 4.10.2(a), p. 37 (our own solution)'}
    origin: page-own

  - id: p3-E-p
    kind: identity
    answer: p3-a2
    where: 'Problem 3(a), second box and formula "Field in the p layer": the same sheet superposition for -a < z < 0'
    formula: -rho0*(z + a)/eps0
    equals: (integrate('-rho0', 's', -a, z) - integrate('-rho0', 's', z, 0) - integrate('rho0', 's', 0, a)) / (2 * eps0)
    samples:
      rho0: [0.5, 5, 2, 1]
      z: [-0.9, -0.1, -0.5, -0.3]
      a: [1, 2, 1.5, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['E_z = -\frac{\rho_0}{\varepsilon_0}\,(z + a)']
    source: {cite: reading1, at: 'Additional Problem 4.10.2(a), p. 37 (our own solution)'}
    origin: page-own

  - id: p3-E-outside
    where: 'Problem 3(a), third box: above both layers the sheet superposition gives zero (sample rho0 = 2, a = 1.5, eps0 = 1)'
    inputs: {rho0: 2, a: 1.5, eps0: 1}
    formula: (integrate('-rho0', 's', -a, 0) + integrate('rho0', 's', 0, a)) / (2 * eps0)
    expected: '0'
    tolerance: 1e-12
    shown: ['for $|z| > a$ the field is zero']
    source: {cite: reading1, at: 'Additional Problem 4.10.2(a), p. 37 (our own solution)'}
    origin: page-own

  - id: p3-dV
    kind: identity
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "Potential across the junction": minus the numerical integral of E_z from -a to a'
    formula: rho0*a**2/eps0
    equals: -(integrate('-rho0 * (s + a) / eps0', 's', -a, 0) + integrate('rho0 * (s - a) / eps0', 's', 0, a))
    samples:
      rho0: [0.5, 5, 2, 1]
      a: [0.1, 2, 1, 1.5]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['= \frac{\rho_0 a^2}{\varepsilon_0}']
    source: {cite: reading1, at: 'Additional Problem 4.10.2(b), p. 37 (our own solution)'}
    origin: page-own

  # ---- Problem 4 (Additional Problem 4.10.3)

  - id: p4-E-in
    kind: identity
    answer: p4-a1
    where: 'Problem 4(a), first box and formula "Field of the sphere": the enclosed charge integrated numerically, over 4 pi eps0 r^2'
    formula: beta*r**2/(4*eps0)
    equals: integrate('beta * s * 4 * pi * s**2', 's', 0, r) / (4 * pi * eps0 * r**2)
    samples:
      beta: [0.5, 5, 2, 1]
      r: [0.1, 1, 0.5, 0.8]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['\frac{\beta r^2}{4\varepsilon_0}\ \ (r < R)']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(a), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-E-out
    kind: identity
    answer: p4-a2
    where: 'Problem 4(a), second box and formula "Field of the sphere": the total charge integrated numerically, over 4 pi eps0 r^2'
    formula: beta*R**4/(4*eps0*r**2)
    equals: integrate('beta * s * 4 * pi * s**2', 's', 0, R) / (4 * pi * eps0 * r**2)
    samples:
      beta: [0.5, 5, 2, 1]
      R: [0.5, 1, 0.7, 0.9]
      r: [1.5, 4, 2, 3]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['E = \frac{\beta R^4}{4\varepsilon_0 r^2}']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(a), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-V-in
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box and formula "Potential inside the sphere": minus the numerical integral of the outside field from far away (a large upper limit, with the tail added) to R, then of the inside field from R to r'
    formula: beta*(4*R**3 - r**3)/(12*eps0)
    equals: integrate('beta * R**4 / (4 * eps0 * s**2)', 's', R, 1000 * R) + beta * R**4 / (4 * eps0 * 1000 * R) + integrate('beta * s**2 / (4 * eps0)', 's', r, R)
    samples:
      beta: [0.5, 5, 2, 1]
      R: [1, 2, 1.5, 1.2]
      r: [0.1, 0.9, 0.5, 0.7]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-7
    shown: ['= \frac{\beta\,(4R^3 - r^3)}{12\varepsilon_0}']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(b), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-U
    kind: identity
    answer: p4-c
    where: 'Problem 4(c), answer box and formula "Work to assemble the sphere": against the field energy, half eps0 E^2 integrated numerically inside and outside (outside in closed form, pi beta^2 R^7 / (8 eps0), checked in p4-U-out)'
    formula: pi*beta**2*R**7/(7*eps0)
    equals: integrate('eps0 / 2 * (beta * s**2 / (4 * eps0))**2 * 4 * pi * s**2', 's', 0, R) + pi * beta**2 * R**7 / (8 * eps0)
    samples:
      beta: [0.5, 5, 2, 1]
      R: [0.5, 1.5, 1, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['= \frac{\pi\beta^2 R^7}{7\varepsilon_0}']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(c), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-U-out
    kind: identity
    where: 'Problem 4(c), solution check: the field energy outside the sphere, integrated numerically to 1000 R plus the tail'
    formula: pi*beta**2*R**7/(8*eps0)
    equals: integrate('eps0 / 2 * (beta * R**4 / (4 * eps0 * s**2))**2 * 4 * pi * s**2', 's', R, 1000 * R) + pi * beta**2 * R**8 / (8 * eps0 * 1000 * R)
    samples:
      beta: [0.5, 5, 2, 1]
      R: [0.5, 1.5, 1, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-7
    shown: ['outside, $\pi\beta^2 R^7/(8\varepsilon_0)$']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(c), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-U-in
    kind: identity
    where: 'Problem 4(c), solution check: the field energy inside the sphere'
    formula: pi*beta**2*R**7/(56*eps0)
    equals: integrate('eps0 / 2 * (beta * s**2 / (4 * eps0))**2 * 4 * pi * s**2', 's', 0, R)
    samples:
      beta: [0.5, 5, 2, 1]
      R: [0.5, 1.5, 1, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['Inside, it gives $\pi\beta^2 R^7/(56\varepsilon_0)$']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(c), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-U-Q
    kind: identity
    where: 'Problem 4(c), solution: the energy written with Q = pi beta R^4'
    formula: pi*beta**2*R**7/(7*eps0)
    equals: (pi * beta * R**4)**2 / (7 * pi * eps0 * R)
    samples:
      beta: [0.5, 5, 2, 1]
      R: [0.5, 1.5, 1, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['$U = Q^2/(7\pi\varepsilon_0 R)$']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(c), p. 37 (our own solution)'}
    origin: page-own

  - id: p4-dV
    kind: identity
    answer: p4-d
    where: 'Problem 4(d), answer box and formula "From the centre outwards": V(0) - V(r) from the potential of part (b)'
    formula: beta*r**3/(12*eps0)
    equals: beta * (4 * R**3 - 0) / (12 * eps0) - beta * (4 * R**3 - r**3) / (12 * eps0)
    samples:
      beta: [0.5, 5, 2, 1]
      r: [0.1, 1, 0.5, 0.8]
      R: [1, 2, 1.5, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['= \frac{\beta r^3}{12\varepsilon_0}']
    source: {cite: reading1, at: 'Additional Problem 4.10.3(d), p. 37 (our own solution)'}
    origin: page-own

  # ---- Problem 5 (Additional Problem 4.10.4)

  - id: p5-in
    kind: identity
    answer: p5-a
    where: 'Problem 5(a), answer box and formula "Field inside the slab": the slab as thin sheets, each with field sigma/(2 eps0) away from it, summed numerically at x'
    formula: rho*x/eps0
    equals: (integrate('rho', 's', -d / 2, x) - integrate('rho', 's', x, d / 2)) / (2 * eps0)
    samples:
      rho: [0.5, 5, 2, 1]
      x: [-0.4, 0.4, 0.1, -0.2]
      d: [1, 2, 1.5, 1.2]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['E_x = \frac{\rho\,x}{\varepsilon_0}']
    source: {cite: reading1, at: 'Additional Problem 4.10.4(a), p. 37 (our own solution)'}
    origin: page-own

  - id: p5-out
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "Field outside the slab": all the sheets lie below a point with x > d/2'
    formula: rho*d/(2*eps0)
    equals: integrate('rho', 's', -d / 2, d / 2) / (2 * eps0)
    samples:
      rho: [0.5, 5, 2, 1]
      d: [0.1, 2, 1, 1.5]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['E_x = \frac{\rho\,d}{2\varepsilon_0}\ \ (x > d/2)']
    source: {cite: reading1, at: 'Additional Problem 4.10.4(b), p. 37 (our own solution)'}
    origin: page-own

  # ---- Problem 6 (Additional Problem 4.10.5)

  - id: p6-U
    kind: identity
    answer: p6-a
    where: 'Problem 6, answer box and formula "Energy of a uniform ball": against the field energy, half eps0 E^2 integrated numerically inside, plus the outside energy Q^2/(8 pi eps0 R)'
    formula: 3*Q**2/(20*pi*eps0*R)
    equals: integrate('eps0 / 2 * (Q * s / (4 * pi * eps0 * R**3))**2 * 4 * pi * s**2', 's', 0, R) + Q**2 / (8 * pi * eps0 * R)
    samples:
      Q: [0.5, 5, 2, 1]
      R: [0.1, 2, 1, 0.5]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['= \frac{3Q^2}{20\pi\varepsilon_0 R}']
    source: {cite: reading1, at: 'Additional Problem 4.10.5, p. 38 (our own solution)'}
    origin: page-own

  - id: p6-U-shells
    kind: identity
    where: 'Problem 6, formula "Energy of a uniform ball": the shell-by-shell integral of the page, done numerically'
    formula: 3*Q**2/(20*pi*eps0*R)
    equals: integrate('(Q * s**3 / R**3) / (4 * pi * eps0 * s) * 3 * Q * s**2 / R**3', 's', 0, R)
    samples:
      Q: [0.5, 5, 2, 1]
      R: [0.1, 2, 1, 0.5]
      eps0: [0.5, 2, 1, 1.5]
    tolerance: 1e-9
    shown: ['= \frac{3}{5}\,\frac{Q^2}{4\pi\varepsilon_0 R}']
    source: {cite: reading1, at: 'Additional Problem 4.10.5, p. 38 (our own solution)'}
    origin: page-own

  # ---- Problem 7 (Additional Problem 4.10.6)

  - id: p7-Ez-middle
    kind: identity
    answer: p7-a
    where: 'Problem 7(a), answer box and formula "Field in the middle": minus the derivative of 15 - 5 z^2'
    formula: 10*z
    equals: -deriv('15 - 5 * q**2', 'q', z)
    samples:
      z: [-1, 1, 0.3, -0.6]
    tolerance: 1e-9
    shown: ['E_z = -\frac{dV}{dz} = 10\,z\ \ \text{V/m}']
    source: {cite: reading1, at: 'Additional Problem 4.10.6(a), p. 38 (our own solution)'}
    origin: page-own

  - id: p7-Ez-above
    answer: p7-b
    where: 'Problem 7(b), answer box: minus the slope of the straight line from (1 m, 10 V) to (2 m, 0 V)'
    inputs: {}
    formula: -(0 - 10) / (2 - 1)
    expected: '10'
    shown: ['so $E_z = +10$ V/m']
    source: {cite: reading1, at: 'Additional Problem 4.10.6(b), p. 38 (our own solution)'}
    origin: page-own

  - id: p7-Ez-below
    answer: p7-c
    where: 'Problem 7(c), answer box: minus the slope of the straight line from (-2 m, 0 V) to (-1 m, 10 V)'
    inputs: {}
    formula: -(10 - 0) / (-1 - (-2))
    expected: '-10'
    shown: ['so $E_z = -10$ V/m']
    source: {cite: reading1, at: 'Additional Problem 4.10.6(c), p. 38 (our own solution)'}
    origin: page-own

  - id: p7-rho0
    answer: p7-d2
    where: 'Problem 7(d), answer box and formula "Density of the slab": eps0 times dE_z/dz = 10 V/m per m'
    inputs: {eps0: 8.85e-12}
    formula: eps0 * deriv('10 * q', 'q', 0.5)
    expected: '8.85e-11'
    shown: ['= 8.85 \times 10^{-11}\ \text{C/m}^3']
    source: {cite: reading1, at: 'Additional Problem 4.10.6(d), p. 38 (our own solution)'}
    origin: page-own

  - id: p7-slab-check
    where: 'Problem 7(d), solution check: the field outside a slab of thickness 2 m and density 10 eps0, rho d / (2 eps0)'
    inputs: {eps0: 8.85e-12, d: 2}
    formula: 10 * eps0 * d / (2 * eps0)
    expected: '10'
    shown: ['$\rho_0 \cdot 2/(2\varepsilon_0) = 10$ V/m']
    source: {cite: reading1, at: 'Additional Problem 4.10.6(d), p. 38 (our own solution)'}
    origin: page-own

  # ---- Problem 8 (our own, built on Section 4.3)

