# Calculations on content/year-4/8.08/information-equipartition-ideal-gas.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.08 (Spring 2005, Wen) Lecture Notes, Chapter I "Canonical Ensemble" (handwritten scan). Page numbers
# are Wen's handwritten numbers (pp. 1-7 and 9-12; there is no p. 8; PDF page 8 carries the number 9): this page
# covers pp. 5-12, points 5 to 7.
# Numbers from the notes: the ideal memory chip and bus (p. 7, at room temperature, taken as 300 K) and the table of
# rotational and vibrational temperatures (p. 10).
# Page's own examples: a chain of 2000 segments at 310 K and Stirling's formula for N = 100; a helium-argon mixture at
# 300 K; helium at 300 K and 1 atm; quiz 2, a million bits at 300 K; plot captions.
# Constants: k_B (exact), h = 6.62607015e-34 J s (exact), u = 1.66053906660e-27 kg (CODATA 2018),
# R = N_A k_B = 8.314462618 J/(mol K) (exact).

page: content/year-4/8.08/information-equipartition-ideal-gas.mdx
calcs:
  # ---------------------------------------------------------------- the chain (pp. 5-6)
  - id: chain-free-energy-ends
    kind: identity
    where: 'text after "Energy cost of stretching the chain": A(x)/NkT = ((1+x)/2) ln((1+x)/2) + ((1-x)/2) ln((1-x)/2) is -ln 2 at x = 0 (checked at x = 0, written as A + ln 2 + 1 = 1)'
    formula: (1 + xx)/2*log((1 + xx)/2) + (1 - xx)/2*log((1 - xx)/2) + log(2) + 1
    equals: 1
    samples: {xx: [0.0, 0.0]}
    tolerance: 1e-12
    shown: ['which runs from $-\ln 2$ at $x = 0$ up to $0$ at full stretch']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: chain-tension
    kind: identity
    where: 'text "Its slope is the force": d/dx of A(x)/NkT equals artanh(x)'
    formula: deriv('(1 + t)/2*log((1 + t)/2) + (1 - t)/2*log((1 - t)/2)', 't', xx)
    equals: 0.5*log((1 + xx)/(1 - xx))
    samples: {xx: [0.1, 0.5, 0.9]}
    tolerance: 1e-6
    shown: ['in units of $k_BT$ per link length it is $\tanh^{-1}x$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: chain-plot-ln2
    where: 'plot caption: ln 2'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['about 0.693 Nk_BT, all of it entropy']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: ex-chain-work
    where: 'worked example "Pulling a molecular chain straight": N k_B T ln 2, N = 2000, T = 310 K'
    inputs: {N: 2000, T: 310 K}
    formula: N*k_B*T*log(2)
    expected: 5.93e-18 J
    shown: ['$= 5.93 \times 10^{-18}$ J']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-chain-per-segment
    where: 'worked example: k_B T ln 2 per segment at 310 K'
    inputs: {T: 310 K}
    formula: k_B*T*log(2)
    expected: 2.97e-21 J
    shown: ['or $2.97 \times 10^{-21}$ J per segment']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-chain-kT
    where: 'worked example: k_B T at 310 K'
    inputs: {T: 310 K}
    formula: k_B*T
    expected: 4.28e-21 J
    shown: ['$k_BT = 4.28 \times 10^{-21}$ J']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-chain-ratio
    where: 'worked example: each segment costs 0.69 k_B T'
    inputs: {}
    formula: log(2)
    expected: '0.69'
    shown: ['each segment costs $0.69\,k_BT$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-lnC-100
    where: 'worked example, step "Stirling''s formula for N = 100": ln(100!/(50!)^2), with 100!/(50!)^2 = 100891344545564193334812497256 exactly'
    inputs: {}
    formula: log(100891344545564193334812497256)
    expected: '66.78'
    shown: ['\ln[100!/(50!)^2] = 66.78$']
    source: {cite: reading1, at: 'p. 5, point 5'}
    origin: page-own

  - id: ex-Nln2-100
    where: 'worked example: 100 ln 2'
    inputs: {}
    formula: 100*log(2)
    expected: '69.31'
    shown: ['against $100\ln 2 = 69.31$']
    source: {cite: reading1, at: 'p. 5, point 5'}
    origin: page-own

  - id: ex-diff-100
    where: 'worked example: the difference 100 ln 2 - ln(100!/(50!)^2)'
    inputs: {}
    formula: 100*log(2) - (log(100891344545564193334812497256))
    expected: '2.53'
    shown: ['The difference, $2.53$']
    source: {cite: reading1, at: 'p. 5, point 5'}
    origin: page-own

  - id: ex-stirling-term-100
    where: 'worked example: (1/2) ln(pi N/2) for N = 100'
    inputs: {}
    formula: 0.5*log(pi*100/2)
    expected: '2.53'
    shown: ['$\frac12\ln(\pi N/2) = 2.53$']
    source: {cite: reading1, at: 'p. 5, point 5'}
    origin: page-own

  # ---------------------------------------------------------------- information (pp. 6-7)
  - id: memory-chip-J
    where: 'text "An ideal memory chip": k_B T ln 2 times 8e9 bits at 300 K, in J'
    inputs: {T: 300 K}
    formula: k_B*T*log(2)*8e9
    expected: 2.3e-11 J
    shown: ['$k_BT\ln 2 \times 8 \times 10^9 = 2.3 \times 10^{-11}$ J']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: memory-chip-erg
    where: 'text "An ideal memory chip": the same in erg, Wen''s 2.3e-4 erg'
    inputs: {T: 300 K}
    formula: k_B*T*log(2)*8e9
    expected: 2.3e-4 erg
    shown: ['which is Wen''s $2.3 \times 10^{-4}$ erg']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: bus-W
    where: 'text "An ideal bus": k_B T ln 2 times 1e9 bits per second at 300 K, in W (2.87e-12, "about 3e-12")'
    inputs: {T: 300 K, tt: 1 s}
    formula: k_B*T*log(2)*1e9/tt
    expected: 3e-12 W
    shown: ['a power of about $3 \times 10^{-12}$ W']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: bus-erg
    where: 'text "An ideal bus": the same in erg/s, Wen''s 3e-5 erg/s'
    inputs: {T: 300 K, tt: 1 s}
    formula: k_B*T*log(2)*1e9/tt
    expected: 3e-5 erg/s
    shown: ['($3 \times 10^{-5}$ erg/s)']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: computer-power
    kind: fact
    where: 'text "An ideal bus": a computer uses roughly 100 W (Wen''s figure)'
    value: '100 W'
    shown: ['the roughly 100 W that a computer actually uses']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: landauer-year
    kind: fact
    where: 'text after "Energy cost of one bit": Landauer''s 1961 paper'
    value: '1961'
    shown: ['who argued in 1961 that erasing a bit']
    source: {ref: 'R. Landauer, "Irreversibility and heat generation in the computing process", IBM J. Res. Dev. 5, 183 (1961)'}
    origin: later-data

  - id: info-zero-uniform
    kind: identity
    where: 'formula "Information": zero when all rho_i = 1/Gamma (checked as info + 1 = 1)'
    formula: log(GG) - GG*(1/GG)*log(GG) + 1
    equals: 1
    samples: {GG: [2.0, 7.0, 100.0]}
    tolerance: 1e-12
    shown: ['The information is zero if all states are equally likely']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: info-plot-ln2
    where: 'information plot caption: ln 2'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['reaches ln 2, about 0.693, when the bit is certain']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  # ---------------------------------------------------------------- equipartition (p. 9)
  - id: equipartition-integral
    kind: identity
    where: 'formula "Mean kinetic energy of one component": the ratio of integrals equals 1/(2 beta), for any m'
    formula: integrate('p**2/(2*mm)*exp(-bb*p**2/(2*mm))', 'p', -60, 60)/integrate('exp(-bb*p**2/(2*mm))', 'p', -60, 60)
    equals: 1/(2*bb)
    samples: {mm: [1.0, 4.0, 0.5], bb: [1.0, 2.5, 0.7]}
    tolerance: 1e-6
    shown: ['= \frac{1}{2\beta} = \frac{k_BT}{2}']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: mit

  - id: equipartition-log-derivative
    kind: identity
    where: 'same formula: -d/dbeta ln(sqrt(pi) sqrt(2m/beta)) = 1/(2 beta)'
    formula: -deriv('log(sqrt(pi)*sqrt(2*mm/b))', 'b', bb)
    equals: 1/(2*bb)
    samples: {mm: [1.0, 4.0, 0.5], bb: [1.0, 2.5, 0.7]}
    tolerance: 1e-6
    shown: ['-\frac{d}{d\beta}\ln\left(\sqrt\pi\sqrt{\frac{2m}{\beta}}\right)']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: mit

  - id: ex-mix-KE
    where: 'worked example "A helium and argon mixture": (3/2) k_B T at 300 K'
    inputs: {T: 300 K}
    formula: 1.5*k_B*T
    expected: 6.21e-21 J
    shown: ['$= 6.21 \times 10^{-21}$ J per atom']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: page-own

  - id: ex-mix-vHe
    where: 'worked example and quiz 3: rms speed of helium (4.003 u) at 300 K'
    inputs: {T: 300 K, m: 4.002602 u}
    formula: sqrt(3*k_B*T/m)
    expected: 1367 m/s
    shown: ['$1367$ m/s for helium', 'about 1367 m/s for helium']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: page-own

  - id: ex-mix-vAr
    where: 'worked example and quiz 3: rms speed of argon (39.95 u) at 300 K'
    inputs: {T: 300 K, m: 39.948 u}
    formula: sqrt(3*k_B*T/m)
    expected: 433 m/s
    shown: ['$433$ m/s for argon', 'against 433 m/s for argon']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: page-own

  - id: quiz-speed-ratio
    where: 'quiz 3: ratio of rms speeds sqrt(39.95/4.003)'
    inputs: {}
    formula: sqrt(39.95/4.003)
    expected: '3.16'
    quiz: 2
    shown: ['the ratio is $\\sqrt{39.95/4.003} = 3.16$']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: page-own

  - id: quiz-mass-ratio
    where: 'quiz 3 explanation: the ratio of the masses, about 10'
    inputs: {}
    formula: 39.95/4.003
    expected: '10'
    shown: ['The ratio of the masses, 10']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: page-own

  - id: ex-mix-CV
    where: 'worked example: C_V = (3/2) R for 1.00 mol in all (0.25 + 0.75)'
    inputs: {R: 8.314462618 J/(mol*K), n: 1.00 mol}
    formula: 1.5*R*n
    expected: 12.47 J/K
    shown: ['$= 12.47$ J/K']
    source: {cite: reading1, at: 'p. 9, point 6'}
    origin: page-own

  # ---------------------------------------------------------------- rotation (p. 10)
  - id: rot-high-T
    kind: identity
    where: 'formula "Mean rotational energy at high temperature": the Gaussian integrals give 1/(2 beta) (E0 = 1)'
    formula: integrate('t**2*exp(-bb*t**2)', 't', -80, 80)/integrate('exp(-bb*t**2)', 't', -80, 80)
    equals: 1/(2*bb)
    samples: {bb: [0.05, 0.2, 1.0]}
    tolerance: 1e-6
    shown: ['= \frac12k_BT" cite="reading1" at="p. 10" />']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: rot-low-T
    kind: identity
    where: 'formula "Mean rotational energy at low temperature": at large beta E0 the exact sum (E0 = 1, j up to 7) approaches 2 e^(-beta), checked as ratio to within 1e-3 at beta = 12'
    formula: (2*(exp(-bb) + 4*exp(-4*bb) + 9*exp(-9*bb))/(1 + 2*(exp(-bb) + exp(-4*bb) + exp(-9*bb))))/(2*exp(-bb))
    equals: 1
    samples: {bb: [12.0, 15.0]}
    tolerance: 1e-4
    shown: ['\langle E\rangle \approx 2E_0\,e^{-E_0/k_BT}']
    source: {cite: reading1, at: 'p. 10'}
    origin: slip

  - id: rot-half-E0
    where: 'rotation plot caption: at k_BT = E0/2, the exact sum over |j| <= 7 as a percentage of k_BT/2'
    inputs: {}
    formula: 100*(2*(exp(-2) + 4*exp(-8) + 9*exp(-18) + 16*exp(-32))/(1 + 2*(exp(-2) + exp(-8) + exp(-18) + exp(-32))))/0.25
    expected: '86'
    shown: ['At k_BT = E₀/2 the exact value is 86% of k_BT/2']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: rot-E0
    where: 'rotation plot caption: at k_BT = E0, as a percentage of k_BT/2'
    inputs: {}
    formula: 100*(2*(exp(-1) + 4*exp(-4) + 9*exp(-9) + 16*exp(-16) + 25*exp(-25))/(1 + 2*(exp(-1) + exp(-4) + exp(-9) + exp(-16) + exp(-25))))/0.5
    expected: '99.8'
    shown: ['at k_BT = E₀ it is already 99.8%']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: table-H2
    kind: fact
    where: 'table: T_rot and T_vib of H2 (Wen''s table)'
    value: '85.4 K, 6100 K'
    shown: ['| H₂ | 85.4 | 6100 |']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: table-N2
    kind: fact
    where: 'table and quiz 4: T_rot and T_vib of N2'
    value: '2.86 K, 3340 K'
    shown: ['| N₂ | 2.86 | 3340 |', '3340 K for nitrogen']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: table-O2
    kind: fact
    where: 'table and quiz 4: T_rot and T_vib of O2'
    value: '2.07 K, 2230 K'
    shown: ['| O₂ | 2.07 | 2230 |', '2230 K for oxygen']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  # ---------------------------------------------------------------- ideal gas (pp. 11-12)
  - id: gas-momentum-integral
    kind: identity
    where: 'formula "Thermal wavelength": integral dp/h exp(-beta p^2/2m) = 1/lambda, lambda = sqrt(2 pi hbar^2/(m kT)) (h = 2 pi hbar, hbar = 1)'
    formula: integrate('exp(-p**2/(2*mm*kT))', 'p', -200, 200)/(2*pi)
    equals: 1/sqrt(2*pi/(mm*kT))
    samples: {mm: [1.0, 3.0], kT: [1.0, 0.4]}
    tolerance: 1e-6
    shown: ['\lambda = \sqrt{\frac{2\pi\hbar^2}{mk_BT}}']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: mit

  - id: gas-free-energy
    kind: identity
    where: 'formula "Free energy of the ideal gas": -kT ln((V/lambda^3)^N/N!) with Stirling ln N! = N ln N - N equals N kT [ln(N lambda^3/V) - 1]'
    formula: -kT*(NN*log(VV/ll**3) - (NN*log(NN) - NN))
    equals: NN*kT*(log(NN*ll**3/VV) - 1)
    samples: {kT: [1.0, 2.0], NN: [100.0, 1000.0], VV: [50.0, 7.0], ll: [0.3, 0.1]}
    tolerance: 1e-9
    shown: ['= Nk_BT\left[\ln\frac{N\lambda^3}{V} - 1\right]']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: gas-entropy
    kind: identity
    where: 'formula "Entropy of the ideal gas": -dA/dT with lambda = c T^(-1/2) equals N [5/2 + ln(V/(N lambda^3))] (k_B = 1)'
    formula: -deriv('NN*t*(log(NN*(cc*t**(-0.5))**3/VV) - 1)', 't', TT)
    equals: NN*(2.5 + log(VV/(NN*(cc*TT**(-0.5))**3)))
    samples: {NN: [10.0, 3.0], VV: [50.0, 7.0], cc: [0.3, 1.0], TT: [1.0, 2.5]}
    tolerance: 1e-5
    shown: ['= Nk_B\left(\frac52 + \ln\frac{V}{N\lambda^3}\right)']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: mit

  - id: gas-pressure
    kind: identity
    where: 'formula "Equation of state": -dA/dV = N kT/V'
    formula: -deriv('NN*kT*(log(NN*ll**3/v) - 1)', 'v', VV)
    equals: NN*kT/VV
    samples: {NN: [10.0, 3.0], kT: [1.0, 2.5], ll: [0.3, 1.0], VV: [50.0, 7.0]}
    tolerance: 1e-6
    shown: ['= \frac{Nk_BT}{V}" cite="reading1" at="p. 12" />']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: ex-He-mass
    where: 'worked example "Helium at room temperature and pressure": m = 4.003 u in kg'
    inputs: {m: 4.002602 u}
    formula: m
    expected: 6.646e-27 kg
    shown: ['$m = 6.646 \times 10^{-27}$ kg']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: page-own

  - id: ex-He-kT
    where: 'worked example: k_B T at 300 K'
    inputs: {T: 300 K}
    formula: k_B*T
    expected: 4.142e-21 J
    shown: ['$k_BT = 4.142 \times 10^{-21}$ J']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: page-own

  - id: ex-He-lambda
    where: 'worked example: lambda = h/sqrt(2 pi m k_B T)'
    inputs: {T: 300 K, m: 4.002602 u, h: 6.62607015e-34 J*s}
    formula: h/sqrt(2*pi*m*k_B*T)
    expected: 5.04e-11 m
    shown: ['$\lambda = 5.04 \times 10^{-11}$ m']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: page-own

  - id: ex-He-density
    where: 'worked example: N/V = P/k_B T at 1 atm, 300 K'
    inputs: {T: 300 K, P: 101325 Pa}
    formula: P/(k_B*T)
    expected: 2.45e25 m**-3
    shown: ['$N/V = P/k_BT = 2.45 \times 10^{25}$ m⁻³']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-He-states
    where: 'worked example: V/(N lambda^3)'
    inputs: {T: 300 K, m: 4.002602 u, h: 6.62607015e-34 J*s, P: 101325 Pa}
    formula: (k_B*T/P)/(h/sqrt(2*pi*m*k_B*T))**3
    expected: '3.20e5'
    shown: ['so $V/N\lambda^3 = 3.20 \times 10^5$']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: page-own

  - id: ex-He-S-per-N
    where: 'worked example: S/(N k_B) = 5/2 + ln(V/(N lambda^3))'
    inputs: {T: 300 K, m: 4.002602 u, h: 6.62607015e-34 J*s, P: 101325 Pa}
    formula: 2.5 + log((k_B*T/P)/(h/sqrt(2*pi*m*k_B*T))**3)
    expected: '15.18'
    shown: ['\ln(3.20 \times 10^5) = 15.18$']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: page-own

  - id: ex-He-S-molar
    where: 'worked example: molar entropy 15.18 R'
    inputs: {T: 300 K, m: 4.002602 u, h: 6.62607015e-34 J*s, P: 101325 Pa, R: 8.314462618 J/(mol*K)}
    formula: (2.5 + log((k_B*T/P)/(h/sqrt(2*pi*m*k_B*T))**3))*R
    expected: 126.2 J/(mol*K)
    shown: ['$15.18\,R = 126.2$ J/(mol K)']
    source: {cite: reading1, at: 'p. 11, point 7'}
    origin: page-own

  - id: He-standard-entropy
    kind: fact
    where: 'worked example: tabulated standard molar entropy of helium gas at 298.15 K and 1 bar'
    value: '126.15 J/(mol K)'
    shown: ['Tables give about 126.15 J/(mol K) for helium at 298 K and 1 bar']
    source: {ref: 'standard molar entropy of He(g), 126.15 J/(mol K) at 298.15 K, 1 bar (CODATA Key Values for Thermodynamics)'}
    origin: later-data

  # ---------------------------------------------------------------- quiz
  - id: quiz-million-bits
    where: 'quiz 2: 1e6 bits at 300 K'
    inputs: {T: 300 K}
    formula: 1e6*k_B*T*log(2)
    expected: 2.9e-15 J
    quiz: 1
    shown: ['so $10^6$ bits cost $2.87 \\times 10^{-15}$ J']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: quiz-bit-cost
    where: 'quiz 2 explanation and flashcard 2: k_B T ln 2 at 300 K'
    inputs: {T: 300 K}
    formula: k_B*T*log(2)
    expected: 2.87e-21 J
    shown: ['2.87 \\times 10^{-21}$ J, so', 'At 300 K that is $2.87 \\times 10^{-21}$ J']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: quiz-no-ln2
    where: 'quiz 2 explanation: a million k_B T without ln 2'
    inputs: {T: 300 K}
    formula: 1e6*k_B*T
    expected: 4.1e-15 J
    shown: ['Forgetting the $\\ln 2$ gives $4.1 \\times 10^{-15}$ J']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own
