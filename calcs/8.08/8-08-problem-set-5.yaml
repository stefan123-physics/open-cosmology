# Calculations on content/year-4/8.08/8-08-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 finds the pure density as the root of mu_e = 0 (mu_e + mu_h = 0 with n_e = n_h) by a root search, and the
# doped densities as the roots of n(n -/+ n_d) = n_i^2 by root searches; Problem 2 counts rolls; Problem 3 takes the
# variance of x as the ratio of two numerical integrals over the Boltzmann weight e^(-Mgx^2/2Lk_BT); Problem 4 takes
# the mean and variance of k from Wen's generating function, x d/dx of n ln(1 + x) and x times the derivative of the
# mean (numerical derivatives), and the Gaussian tail from erfc.
# The numbers of Problems 1(c), 3(b) and 3(c) use the rounded constants the page states (k_B = 1.381e-23 J/K,
# hbar = 1.055e-34 J s, m = 9.109e-31 kg, 1 eV = 1.602e-19 J), as a reader would; with CODATA 2018 values the boxes
# move by at most 1.4% (checked in the entries marked "CODATA"), inside their tolerances.
# Choice boxes have no entries: their reasons are in the solutions.

page: content/year-4/8.08/8-08-problem-set-5.mdx
calcs:
  # ---- How to answer

  - id: points-total
    where: 'How to answer: our points for Problems 1 to 4, 20 + 15 + 15 + 20'
    formula: |-
      20 + 15 + 15 + 20
    expected: '70'
    shown: ['70 points in all']
    source: {cite: mit, at: 'Problems 1 to 4, p. 1 (our points)'}
    origin: page-own

  # ---- Problem 1: electrons and holes

  - id: p1-ni
    kind: identity
    answer: p1-ni
    where: 'Problem 1(a), answer box: n_i = (m kB T/2 pi hbar^2)^(3/2) e^(-D/2kB T), against the root of mu_e = kB T ln(n lambda^3) + D/2 = 0'
    formula: |-
      (m*kB*T/(2*pi*hbar**2))**(3/2)*exp(-D/(2*kB*T))
    equals: |-
      solve('kB*T*log(y*(2*pi*hbar**2/(m*kB*T))**1.5) + D/2', 'y', 1e-6, 100)
    samples:
      m: [0.5, 1.0, 2.0, 1.3, 0.8]
      kB: [0.5, 1.0, 1.5, 1.2, 0.7]
      T: [0.5, 2.0, 1.0, 1.4, 0.9]
      hbar: [0.5, 1.0, 1.5, 0.7, 1.2]
      D: [0.5, 2.0, 1.0, 1.7, 0.6]
    tolerance: 1e-6
    shown: ['id="p1-ni"', '<Formula label="Carrier density of a pure semiconductor"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-ne
    kind: identity
    answer: p1-ne
    where: 'Problem 1(b), answer box: n_e, against the root of n(n - n_d) = n_i^2 between n_d and n_d + n_i'
    formula: |-
      nd/2 + sqrt(nd**2/4 + ni**2)
    equals: |-
      solve('y*(y - nd) - ni**2', 'y', nd, nd + ni)
    samples:
      nd: [0.5, 2.0, 1.0, 1.3, 0.7]
      ni: [0.5, 1.0, 2.0, 0.6, 1.5]
    tolerance: 1e-6
    shown: ['id="p1-ne"', '<Formula label="Electrons and holes in a doped semiconductor"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nh
    kind: identity
    answer: p1-nh
    where: 'Problem 1(b), answer box: n_h, against the root of n(n + n_d) = n_i^2 between 0 and n_i'
    formula: |-
      -nd/2 + sqrt(nd**2/4 + ni**2)
    equals: |-
      solve('y*(y + nd) - ni**2', 'y', 0, ni)
    samples:
      nd: [0.5, 2.0, 1.0, 1.3, 0.7]
      ni: [0.5, 1.0, 2.0, 0.6, 1.5]
    tolerance: 1e-6
    shown: ['id="p1-nh"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-kT
    where: 'Problem 1(c) and 3(b): kB T at 300 K with kB = 1.381e-23 J/K'
    formula: |-
      1.381e-23*300
    expected: '4.143e-21'
    shown: ['$k_BT = 4.143 \times 10^{-21}$ J', '$k_BTL = 4.143 \times 10^{-21}$ J']
    source: {cite: mit, at: 'Problem 3(b), p. 1 (our constants)'}
    origin: page-own

  - id: p1-q
    where: 'Problem 1(c): m kB T/2 pi hbar^2 for the free-electron mass at 300 K'
    formula: |-
      9.109e-31*1.381e-23*300/(2*pi*1.055e-34**2)
    expected: '5.40e16'
    shown: ['$mk_BT/2\pi\hbar^2 = 5.40 \times 10^{16}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-q32
    where: 'Problem 1(c): its 3/2 power'
    formula: |-
      (9.109e-31*1.381e-23*300/(2*pi*1.055e-34**2))**1.5
    expected: '1.25e25'
    shown: ['power is $1.25 \times 10^{25}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-gap
    where: 'Problem 1(c): D = 1.10 eV in joules'
    formula: |-
      1.10*1.602e-19
    expected: '1.762e-19'
    shown: ['= 1.762 \times 10^{-19}/']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-2kT
    where: 'Problem 1(c): 2 kB T at 300 K'
    formula: |-
      2*1.381e-23*300
    expected: '8.286e-21'
    shown: ['/8.286 \times 10^{-21} = 21.27$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-exponent
    where: 'Problem 1(c): the exponent D/2kB T'
    formula: |-
      1.10*1.602e-19/(2*1.381e-23*300)
    expected: '21.27'
    shown: ['= 21.27$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-boltzmann
    where: 'Problem 1(c): e^(-D/2kB T), which is also n_i lambda^3'
    formula: |-
      exp(-1.10*1.602e-19/(2*1.381e-23*300))
    expected: '5.80e-10'
    shown: ['e^{-21.27} = 5.80 \times 10^{-10}$. So', '= 5.80 \times 10^{-10} \ll 1$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-num-ni
    answer: p1-num-ni
    where: 'Problem 1(c), answer box: n_i for m = 9.109e-31 kg, D = 1.10 eV, T = 300 K (page constants)'
    formula: |-
      (9.109e-31*1.381e-23*300/(2*pi*1.055e-34**2))**1.5*exp(-1.10*1.602e-19/(2*1.381e-23*300))
    expected: '7.28e15'
    shown: ['id="p1-num-ni"', 'So $n_i = 7.28 \times 10^{15}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-num-ni-codata
    where: 'Problem 1(c), CODATA check: n_i with CODATA 2018 kB, hbar, m_e and eV, inside the 3% tolerance of 7.28e15'
    formula: |-
      (9.1093837015e-31*1.380649e-23*300/(2*pi*1.054571817e-34**2))**1.5*exp(-1.10*1.602176634e-19/(2*1.380649e-23*300))
    expected: '7.23e15'
    shown: ['id="p1-num-ni" label="$n_i$ in m⁻³:" value="7.28e15" tolerance="3%"']
    source: {cite: codata, at: 'electron mass, electron volt, Boltzmann constant, reduced Planck constant'}
    origin: page-own

  - id: p1-cube
    where: 'Problem 1(c): the side of the cube that holds one carrier, (1/n_i)^(1/3), about 5 micrometres'
    formula: |-
      (1/7.28e15)**(1/3)
    expected: '5.2e-6'
    tolerance: 0.3e-6
    shown: ['a cube about 5 μm on a side']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-ratio-nd
    where: 'Problem 1(c): n_d/n_i, more than 1e5'
    formula: |-
      1.00e21/7.28e15
    expected: '1.37e5'
    shown: ['is more than $10^5$ times $n_i$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-num-nh
    answer: p1-num-nh
    where: 'Problem 1(c), answer box: n_h from the exact root of part (b) with n_d = 1.00e21 m^-3 (page constants)'
    formula: |-
      -1.00e21/2 + sqrt(1.00e21**2/4 + ((9.109e-31*1.381e-23*300/(2*pi*1.055e-34**2))**1.5*exp(-1.10*1.602e-19/(2*1.381e-23*300)))**2)
    expected: '5.29e10'
    tolerance: 0.02e10
    shown: ['id="p1-num-nh"', '$n_h = n_i^2/n_d = 5.29 \times 10^{10}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-num-nh-codata
    where: 'Problem 1(c), CODATA check: n_h = n_i^2/n_d with CODATA 2018 constants, 1.3% below 5.29e10, inside the 3% tolerance'
    formula: |-
      ((9.1093837015e-31*1.380649e-23*300/(2*pi*1.054571817e-34**2))**1.5*exp(-1.10*1.602176634e-19/(2*1.380649e-23*300)))**2/1.00e21
    expected: '5.22e10'
    shown: ['id="p1-num-nh" label="$n_h$ in m⁻³:" value="5.29e10" tolerance="3%"']
    source: {cite: codata, at: 'electron mass, electron volt, Boltzmann constant, reduced Planck constant'}
    origin: page-own

  - id: p1-holes-factor
    where: 'Problem 1(c): the holes fall by n_i/n_h, more than 1e5'
    formula: |-
      7.28e15/5.29e10
    expected: '1.38e5'
    shown: ['by a factor of more than $10^5$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-solid-density
    where: 'Problem 1(c): atoms per cubic metre in a solid, from silicon (2330 kg/m^3, 28.09 g/mol, Avogadro 6.02214e23)'
    formula: |-
      2330/0.02809*6.02214076e23
    expected: '5e28'
    tolerance: 0.1e28
    shown: ['some $5 \times 10^{28}$ atoms per cubic metre']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own estimate)'}
    origin: page-own

  - id: p1-dopant-fraction
    where: 'Problem 1(c): one dopant in 5e28/1e21 atoms'
    formula: |-
      5e28/1.00e21
    expected: '5e7'
    shown: ['One dopant in about $5 \times 10^7$ atoms']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  # ---- Problem 2: two dice

  - id: p2-k2
    where: 'Problem 2(a): P(k+ = 2), only the roll (1, 1)'
    formula: |-
      1/36
    expected: '0.02778'
    shown: ['$(1, 1)$, with probability $1/36$', '$P(k_+ = 2) = 1/36$']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-km1
    where: 'Problem 2(a): P(k- = 1), the five rolls (2,1) to (6,5)'
    formula: |-
      5/36
    expected: '0.1389'
    shown: ['$P(k_- = 1) = 5/36$']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-product
    where: 'Problem 2(a): the product (1/36)(5/36) = 5/1296'
    formula: |-
      (1/36)*(5/36)
    expected: '0.003858'
    shown: ['The product $5/1296$']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-cond
    answer: p2-cond
    where: 'Problem 2(a), answer box: P(k- = 0 given k+ = 4): one of the three rolls (1,3), (2,2), (3,1)'
    formula: |-
      (1/36)/(3/36)
    expected: '0.333'
    shown: ['id="p2-cond"', 'has the probability $1/3 = 0.333$']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our addition)'}
    origin: page-own

  - id: p2-km0
    where: 'Problem 2(a): P(k- = 0), the six rolls with n1 = n2'
    formula: |-
      6/36
    expected: '0.1667'
    shown: ['$P(k_- = 0) = 6/36 = 1/6$']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-mod-pairs
    where: 'Problem 2(b): 6 x 6 pairs (m+, m-), each 1/36 = (1/6)(1/6)'
    formula: |-
      (1/6)*(1/6)
    expected: '0.02778'
    shown: ['$6 \times 6 = 36$ pairs', 'with probability $1/36$. Separately', '$\frac16 \times \frac16 = \frac{1}{36}$']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 3: the pendulum

  - id: p3-dx
    kind: identity
    answer: p3-dx
    where: 'Problem 3(a), answer box: sqrt(kB T L/M g), against the root-mean-square x of the Boltzmann weight exp(-M g x^2/2 L kB T), by numerical integration'
    formula: |-
      sqrt(kB*T*L/(M*g))
    equals: |-
      sqrt(integrate('x**2*exp(-M*g*x**2/(2*L*kB*T))', 'x', -30, 30)/integrate('exp(-M*g*x**2/(2*L*kB*T))', 'x', -30, 30))
    samples:
      kB: [0.5, 1.0, 1.5, 1.2, 0.7]
      T: [0.5, 2.0, 1.0, 1.4, 0.9]
      L: [0.5, 2.0, 1.0, 1.6, 0.8]
      M: [0.5, 1.0, 2.0, 0.7, 1.5]
      g: [9.0, 9.5, 10.0, 9.81, 9.2]
    tolerance: 1e-6
    shown: ['id="p3-dx"', '<Formula label="Thermal fluctuation of a pendulum"']
    source: {cite: mit, at: 'Problem 3(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p3-kTL
    where: 'Problem 3(b): kB T L with L = 0.1 m'
    formula: |-
      1.381e-23*300*0.1
    expected: '4.143e-22'
    shown: ['= 4.143 \times 10^{-22}$ J m']
    source: {cite: mit, at: 'Problem 3(b), p. 1'}
    origin: page-own

  - id: p3-Mg
    where: 'Problem 3(b): M g with M = 1e-3 kg, g = 9.81 m/s^2'
    formula: |-
      1e-3*9.81
    expected: '9.81e-3'
    shown: ['$Mg = 9.81 \times 10^{-3}$ N']
    source: {cite: mit, at: 'Problem 3(b), p. 1'}
    origin: page-own

  - id: p3-x2
    where: 'Problem 3(b): <x^2> = kB T L/M g'
    formula: |-
      1.381e-23*300*0.1/(1e-3*9.81)
    expected: '4.22e-20'
    shown: ['$\langle x^2\rangle = 4.22 \times 10^{-20}$ m²']
    source: {cite: mit, at: 'Problem 3(b), p. 1'}
    origin: page-own

  - id: p3-dx-m
    where: 'Problem 3(b): Delta x in metres'
    formula: |-
      sqrt(1.381e-23*300*0.1/(1e-3*9.81))
    expected: '2.06e-10'
    tolerance: 0.006e-10
    shown: ['$\Delta x = 2.06 \times 10^{-10}$ m']
    source: {cite: mit, at: 'Problem 3(b), p. 1'}
    origin: page-own

  - id: p3-num
    answer: p3-num
    where: 'Problem 3(b), answer box: Delta x in nm for M = 1 g, L = 10 cm, T = 300 K (0.2055 with the page constants; 0.2055 rounds to 0.206)'
    formula: |-
      sqrt(1.381e-23*300*0.1/(1e-3*9.81))*1e9
    expected: '0.206'
    tolerance: 0.0006
    shown: ['id="p3-num"', 'm $= 0.206$ nm']
    source: {cite: mit, at: 'Problem 3(b), p. 1'}
    origin: page-own

  - id: p3-num-codata
    where: 'Problem 3(b), CODATA check: with kB = 1.380649e-23 J/K, Delta x = 0.2055 nm, inside the 2% tolerance of 0.206'
    formula: |-
      sqrt(1.380649e-23*300*0.1/(1e-3*9.81))*1e9
    expected: '0.2055'
    shown: ['id="p3-num" label="$\Delta x$ in nm:" value="0.206" tolerance="2%"']
    source: {cite: codata, at: 'Boltzmann constant'}
    origin: page-own

  - id: p3-omega
    where: 'Problem 3(c): omega = sqrt(g/L) for g = 9.81 m/s^2, L = 0.1 m'
    formula: |-
      sqrt(9.81/0.1)
    expected: '9.90'
    shown: ['= 9.90$ s⁻¹']
    source: {cite: mit, at: 'Problem 3(b), p. 1 (our addition)'}
    origin: page-own

  - id: p3-hbar-omega
    where: 'Problem 3(c): hbar omega with hbar = 1.055e-34 J s'
    formula: |-
      1.055e-34*sqrt(9.81/0.1)
    expected: '1.045e-33'
    shown: ['$\hbar\omega = 1.045 \times 10^{-33}$ J', '= 1.045 \times 10^{-33}/4.143']
    source: {cite: mit, at: 'Problem 3(b), p. 1 (our addition)'}
    origin: page-own

  - id: p3-quantum
    answer: p3-quantum
    where: 'Problem 3(c), answer box: hbar omega/kB T at 300 K'
    formula: |-
      1.055e-34*sqrt(9.81/0.1)/(1.381e-23*300)
    expected: '2.52e-13'
    shown: ['id="p3-quantum"', '= 2.52 \times 10^{-13}$.']
    source: {cite: mit, at: 'Problem 3(b), p. 1 (our addition)'}
    origin: page-own

  - id: p3-quantum-inverse
    where: 'Problem 3(c): kB T/hbar omega, about 4e12'
    formula: |-
      1.381e-23*300/(1.055e-34*sqrt(9.81/0.1))
    expected: '4e12'
    shown: ['some $4 \times 10^{12}$ times more closely']
    source: {cite: mit, at: 'Problem 3(b), p. 1 (our addition)'}
    origin: page-own

  # ---- Problem 4: random walk (our own problem)

  - id: p4-mean
    kind: identity
    answer: p4-mean
    where: 'Problem 4(a), answer box: <X> = n l (2p - 1), against (2<k> - n) l with <k> = x d/dx [n ln(1 + x)], x = p/(1 - p) (Wen''s generating function, numerical derivative)'
    formula: |-
      n*l*(2*p - 1)
    equals: |-
      l*(2*(p/(1 - p))*deriv('n*log(1 + y)', 'y', p/(1 - p)) - n)
    samples:
      n: [10, 100, 37, 64, 15]
      l: [0.5, 2.0, 1.0, 1.3, 0.8]
      p: [0.6, 0.9, 0.75, 0.3, 0.55]
    tolerance: 1e-6
    shown: ['id="p4-mean"', '<Formula label="Average position of the walk"']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own problem and solution)'}
    origin: page-own

  - id: p4-var
    kind: identity
    answer: p4-var
    where: 'Problem 4(b), answer box: 4 n l^2 p(1 - p), against (2l)^2 x d<k>/dx with <k> = n x/(1 + x), x = p/(1 - p) (numerical derivative)'
    formula: |-
      4*n*l**2*p*(1 - p)
    equals: |-
      4*l**2*(p/(1 - p))*deriv('n*y/(1 + y)', 'y', p/(1 - p))
    samples:
      n: [10, 100, 37, 64, 15]
      l: [0.5, 2.0, 1.0, 1.3, 0.8]
      p: [0.1, 0.4, 0.25, 0.7, 0.55]
    tolerance: 1e-6
    shown: ['id="p4-var"', '<Formula label="Variance of the walk"']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own problem and solution)'}
    origin: page-own

  - id: p4-k-mean
    where: 'Problem 4(c): <k> = n p for n = 400, p = 0.55'
    formula: |-
      400*0.55
    expected: '220'
    shown: ['$\langle k\rangle = np = 220$', '(220 - 199.5)/9.95']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-k-var
    where: 'Problem 4(c): variance n p (1 - p)'
    formula: |-
      400*0.55*0.45
    expected: '99.0'
    shown: ['$np(1 - p) = 99.0$']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-dk
    where: 'Problem 4(c): Delta k = sqrt(99)'
    formula: |-
      sqrt(400*0.55*0.45)
    expected: '9.95'
    shown: ['$\Delta k = 9.95$', '/9.95 = 2.06$']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-z
    where: 'Problem 4(c): z = (220 - 199.5)/9.95'
    formula: |-
      (400*0.55 - 199.5)/sqrt(400*0.55*0.45)
    expected: '2.06'
    shown: ['= 2.06$ standard deviations', 'erfc}(2.06/\sqrt2)']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-left
    answer: p4-left
    where: 'Problem 4(c), answer box: Gaussian tail below k = 199.5'
    formula: |-
      0.5*erfc((400*0.55 - 199.5)/sqrt(400*0.55*0.45)/sqrt(2))
    expected: '0.0197'
    shown: ['id="p4-left"', '\sqrt2) = 0.0197$']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-one-in
    where: 'Problem 4(c): one walk in 1/0.0197, about 51'
    formula: |-
      1/(0.5*erfc((400*0.55 - 199.5)/sqrt(400*0.55*0.45)/sqrt(2)))
    expected: '51'
    shown: ['about one walk in 51']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-drift
    where: 'Problem 4(c): <X> = 400 x (2 x 0.55 - 1) l = 40 l'
    formula: |-
      400*(2*0.55 - 1)
