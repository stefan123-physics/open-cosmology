# Calculations on content/year-4/8.08/random-variables-binomial-distribution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.08 (Spring 2005) Lecture Notes, Chapter V "Random Variable" (Wen, handwritten scan), pp. 36-40.
# Page numbers are the handwritten numbers at the top right of each scanned page (36-40 = PDF pages 1-5).
# The notes' only numbers are the probabilities of the two dice examples (pp. 37-38).
# Page's own examples: correlation of Example II; plot caption (n = 20, p = 0.6); worked example (twelve-sided die;
# 400 spins with p = 0.6; 10^22 spins); the 10^22 / 10^-11 estimate in "Why large systems hardly fluctuate"; quizzes.
# Notation in the formulas: nn = n, pp = p, xx = x = p/(1 - p), kk = k, vv = variance of one variable.

page: content/year-4/8.08/random-variables-binomial-distribution.mdx
calcs:
  # ---------------------------------------------------------------- one random variable (p. 36)
  - id: fluctuation-two-forms
    kind: identity
    where: 'formula "Fluctuation": <(s - <s>)^2> = <s^2> - <s>^2, checked for a three-valued variable with values 0, 1, 3 and probabilities q0, q1, 1 - q0 - q1'
    formula: q0*(0 - (q1 + 3*(1 - q0 - q1)))**2 + q1*(1 - (q1 + 3*(1 - q0 - q1)))**2 + (1 - q0 - q1)*(3 - (q1 + 3*(1 - q0 - q1)))**2
    equals: (q1 + 9*(1 - q0 - q1)) - (q1 + 3*(1 - q0 - q1))**2
    samples: {q0: [0.2, 0.5, 0.1], q1: [0.3, 0.1, 0.6]}
    tolerance: 1e-12
    shown: ['\Delta s = \sqrt{\langle(s - \langle s\rangle)^2\rangle} = \sqrt{\langle s^2\rangle - \langle s\rangle^2}" cite']
    source: {cite: reading1, at: 'p. 36, point 1'}
    origin: mit

  - id: two-valued-variance
    kind: identity
    where: 'text after "Fluctuation": a variable that is 1 with probability p has variance p - p^2 = p(1 - p)'
    formula: pp*(1 - pp)**2 + (1 - pp)*(0 - pp)**2
    equals: pp*(1 - pp)
    samples: {pp: [0.2, 0.5, 0.9]}
    tolerance: 1e-12
    shown: ['so $(\Delta s)^2 = p - p^2 = p(1 - p)$']
    source: {cite: reading1, at: 'p. 36, point 1'}
    origin: page-own

  # ---------------------------------------------------------------- dice examples (pp. 37-38)
  - id: ex1-cond-s2-1
    where: 'Example I: P(s1 = 1 | s2 = 1) = (1/6)/(1/6 + 1/6)'
    formula: (1/6)/(1/6 + 1/6)
    expected: '0.5'
    shown: ['$\frac{1/6}{1/6 + 1/6} = \frac{1}{2}$']
    source: {cite: reading1, at: 'p. 37'}
    origin: mit

  - id: ex1-cond-s2-0
    where: 'Example I: P(s1 = 1 | s2 = 0) = (1/3)/(2/3)'
    formula: (1/3)/(2/3)
    expected: '0.5'
    shown: ['$\frac{1/3}{2/3} = \frac{1}{2}$']
    source: {cite: reading1, at: 'p. 37'}
    origin: mit

  - id: ex1-cond-s1-1
    where: 'Example I: P(s2 = 1 | s1 = 1) = (1/6)/(1/6 + 1/3) = 1/3'
    formula: (1/6)/(1/6 + 1/3)
    expected: '0.3333'
    shown: ['given $s_1 = 1$ the probabilities of $s_2 = 1$ and $s_2 = 0$ are $\frac{1}{3}$ and $\frac{2}{3}$']
    source: {cite: reading1, at: 'p. 37'}
    origin: mit

  - id: ex1-product
    where: 'Example I: P12(1,1) = P1(1) P2(1) = 1/2 x 1/3 = 1/6'
    formula: 1/2*1/3
    expected: '0.16667'
    shown: ['$P_{12}(1,1) = \frac{1}{2} \times \frac{1}{3} = \frac{1}{6}$']
    source: {cite: reading1, at: 'p. 37'}
    origin: page-own

  - id: ex2-cond-s2-1
    where: 'Example II: P(s1 = 1 | s2 = 1) = (1/6)/(1/2) = 1/3'
    formula: (1/6)/(1/6 + 1/3)
    expected: '0.3333'
    shown: ['$\frac{1/6}{1/2} = \frac{1}{3}$']
    source: {cite: reading1, at: 'p. 38'}
    origin: mit

  - id: ex2-cond-s2-0
    where: 'Example II: P(s1 = 1 | s2 = 0) = (1/3)/(1/3 + 1/6) = 2/3'
    formula: (1/3)/(1/3 + 1/6)
    expected: '0.6667'
    shown: ['given $s_2 = 0$ they are $\frac{2}{3}$ and $\frac{1}{3}$']
    source: {cite: reading1, at: 'p. 38'}
    origin: mit

  - id: ex2-correlation
    where: 'section "Independence and correlation": correlation of Example II, <s1 s2> - <s1><s2> = 1/6 - 1/4'
    formula: 1/6 - 1/2*1/2
    expected: '-0.08333'
    shown: ['the correlation is $\frac{1}{6} - \frac{1}{4} = -\frac{1}{12}$']
    source: {cite: reading1, at: 'p. 38'}
    origin: page-own

  # ---------------------------------------------------------------- independence (p. 38)
  - id: product-average
    kind: identity
    where: 'formula "Average of a product of independent variables": the double sum of s1 s2 P1 P2 over s1, s2 in {0, 1, 2} with distributions (a0, a1, a2), (b0, b1, b2) equals the product of the averages'
    formula: (1*a1 + 2*a2)*(1*b1 + 2*b2)
    equals: 1*1*a1*b1 + 1*2*a1*b2 + 2*1*a2*b1 + 2*2*a2*b2
    samples: {a1: [0.3, 0.1], a2: [0.2, 0.5], b1: [0.6, 0.25], b2: [0.1, 0.25]}
    tolerance: 1e-12
    shown: ['= \Big(\sum_{s_1}s_1P_1(s_1)\Big)\Big(\sum_{s_2}s_2P_2(s_2)\Big) = \langle s_1\rangle\langle s_2\rangle" cite']
    source: {cite: reading1, at: 'p. 38'}
    origin: mit

  # ---------------------------------------------------------------- binomial distribution (p. 39)
  - id: binomial-mean
    kind: identity
    where: 'formula "Mean and second moment": sum_k k B(k; 4, p) = 4p (n = 4 written out)'
    formula: 0*(1 - pp)**4 + 1*4*pp*(1 - pp)**3 + 2*6*pp**2*(1 - pp)**2 + 3*4*pp**3*(1 - pp) + 4*pp**4
    equals: 4*pp
    samples: {pp: [0.2, 0.5, 0.7]}
    tolerance: 1e-12
    shown: ['\langle k\rangle = \sum_k k\,B(k; n, p) = np']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: mit

  - id: binomial-second-moment
    kind: identity
    where: 'formula "Mean and second moment": sum_k k^2 B(k; 4, p) = n^2 p^2 + n p (1 - p) with n = 4'
    formula: 1*4*pp*(1 - pp)**3 + 4*6*pp**2*(1 - pp)**2 + 9*4*pp**3*(1 - pp) + 16*pp**4
    equals: 16*pp**2 + 4*pp*(1 - pp)
    samples: {pp: [0.2, 0.5, 0.7]}
    tolerance: 1e-12
    shown: ['\langle k^2\rangle = n^2p^2 + np(1 - p)"']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: mit

  - id: generating-x2-coefficient
    kind: identity
    where: 'formula "Generating function": the x^2 coefficient of (1 + x)^n is n(n - 1)/2 (second derivative at 0, halved); the notes'' n(n + 1)/2 is a slip'
    formula: deriv('(1 + t)**nn', 't', 0, 2)/2
    equals: nn*(nn - 1)/2
    samples: {nn: [3, 5, 10]}
    tolerance: 1e-4
    shown: ['$\binom{n}{2} = \frac{n(n - 1)}{2}$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: slip

  - id: generating-term
    kind: identity
    where: 'formula "Each term is a probability": binom(n,k) x^k / (1 + x)^n with x = p/(1 - p) equals binom(n,k) p^k (1 - p)^(n - k); checked for n = 5, k = 2 (binom = 10)'
    formula: 10*(pp/(1 - pp))**2/(1 + pp/(1 - pp))**5
    equals: 10*pp**2*(1 - pp)**3
    samples: {pp: [0.2, 0.5, 0.8]}
    tolerance: 1e-12
    shown: ['\binom{n}{k}\frac{(p/(1 - p))^k}{(1 + p/(1 - p))^n}']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: mit

  - id: generating-mean
    kind: identity
    where: 'formula "Average from the generating function": x d/dx ln (1 + x)^n = n x/(1 + x) = n p with x = p/(1 - p)'
    formula: (pp/(1 - pp))*deriv('nn*log(1 + t)', 't', pp/(1 - pp))
    equals: nn*pp
    samples: {pp: [0.2, 0.5, 0.7], nn: [3, 10, 50]}
    tolerance: 1e-6
    shown: ['\langle k\rangle = x\,\frac{n}{1 + x} = np']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: mit

  - id: generating-variance
    kind: identity
    where: 'formula "Variance from the generating function": x d/dx [n x/(1 + x)] = n x/(1 + x)^2 = n p (1 - p) with x = p/(1 - p)'
    formula: (pp/(1 - pp))*deriv('nn*t/(1 + t)', 't', pp/(1 - pp))
    equals: nn*pp*(1 - pp)
    samples: {pp: [0.2, 0.5, 0.7], nn: [3, 10, 50]}
    tolerance: 1e-6
    shown: ['= \frac{nx}{(1 + x)^2} = np(1 - p)']
    source: {cite: reading1, at: 'p. 39, point 3 (variance step ours)'}
    origin: page-own

  - id: caption-binomial-peak
    where: 'plot caption: B(12; 20, 0.6) = C(20,12) 0.6^12 0.4^8 with C(20,12) = 125970'
    formula: 125970*0.6**12*0.4**8
    expected: '0.180'
    shown: ['with probability 0.180']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: caption-gauss-peak
    where: 'plot caption: peak of the Gaussian with variance n p (1 - p) = 4.8, 1/sqrt(2 pi 4.8)'
    formula: 1/sqrt(2*pi*20*0.6*0.4)
    expected: '0.182'
    shown: ['the Gaussian peaks at 0.182']
    source: {cite: reading1, at: 'p. 40, point 4'}
    origin: page-own

  # ---------------------------------------------------------------- central limit theorem (p. 40)
  - id: variance-of-mean
    kind: identity
    where: 'formula "Variance of the mean": for n = 3 independent variables with variance vv, the average of (sum of deviations)^2 / n^2 has 3 diagonal terms vv and zero cross terms, giving vv/3 = (1/n)<(x - <x>)^2>'
    formula: (vv + vv + vv + 6*0)/3**2
    equals: vv/3
    samples: {vv: [1.0, 4.0, 0.25]}
    tolerance: 1e-12
    shown: ['\sigma^2 = \frac{1}{n}\big\langle(x - \langle x\rangle)^2\big\rangle']
    source: {cite: reading1, at: 'p. 40 (boxed)'}
    origin: mit

  - id: macroscopic-relative
    where: 'section "Why large systems hardly fluctuate": relative fluctuation of a sum of 10^22 parts, of order 1/sqrt(10^22)'
    formula: 1/sqrt(1e22)
    expected: '1e-11'
    shown: ['is of order $10^{-11}$']
    source: {cite: reading1, at: 'p. 40, point 4'}
    origin: page-own

  # ---------------------------------------------------------------- worked example (a): twelve-sided die, s2 = prime
  - id: we-p2
    where: 'worked example (a): five primes (2, 3, 5, 7, 11) among 12 faces'
    formula: 5/12
    expected: '0.4167'
    shown: ['so $P_2(1) = 5/12$']
    source: {cite: reading1, at: 'p. 37'}
    origin: page-own

  - id: we-sum
    where: 'worked example (a): the four joint probabilities add up to 1'
    formula: 3/12 + 3/12 + 2/12 + 4/12
    expected: '1'
    shown: ['They add up to $12/12 = 1$.']
    source: {cite: reading1, at: 'p. 36, point 2'}
    origin: page-own

  - id: we-cond-prime
    where: 'worked example (a): P(s1 = 1 | prime) = (3/12)/(5/12)'
    formula: (3/12)/(5/12)
    expected: '0.6'
    shown: ['\frac{3/12}{5/12} = \frac{3}{5} = 0.6']
    source: {cite: reading1, at: 'p. 37'}
    origin: page-own

  - id: we-cond-nonprime
    where: 'worked example (a): P(s1 = 1 | not prime) = (3/12)/(7/12)'
    formula: (3/12)/(7/12)
    expected: '0.429'
    shown: ['\frac{3/12}{7/12} = \frac{3}{7} \approx 0.429']
    source: {cite: reading1, at: 'p. 37'}
    origin: page-own

  - id: we-correlation
    where: 'worked example (a): correlation 3/12 - (1/2)(5/12) = 1/24'
    formula: 3/12 - 1/2*5/12
    expected: '0.042'
    shown: ['= \frac{1}{24} \approx 0.042']
    source: {cite: reading1, at: 'p. 38'}
    origin: page-own

  # ---------------------------------------------------------------- worked example (b): 400 spins, p = 0.6
  - id: we-mean
    where: 'worked example (b): <k> = n p'
    formula: 400*0.6
    expected: '240'
    shown: ['$\langle k\rangle = np = 400 \times 0.6 = 240$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: we-variance
    where: 'worked example (b): (Delta k)^2 = n p (1 - p)'
    formula: 400*0.6*0.4
    expected: '96'
    shown: ['$(\Delta k)^2 = np(1 - p) = 240 \times 0.4 = 96$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: we-dk
    where: 'worked example (b): Delta k = sqrt(96)'
    formula: sqrt(96)
    expected: '9.80'
    shown: ['giving $\Delta k \approx 9.80$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: we-relative
    where: 'worked example (b): relative fluctuation 9.80/240 (about 4%)'
    formula: sqrt(96)/240
    expected: '0.041'
    shown: ['$9.80/240 \approx 0.041$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: we-z
    where: 'worked example (b): (259.5 - 240)/9.80 standard deviations'
    formula: (259.5 - 240)/sqrt(96)
    expected: '1.99'
    shown: ['$(259.5 - 240)/9.80 \approx 1.99$']
    source: {cite: reading1, at: 'p. 40, point 4'}
    origin: page-own

  - id: we-tail
    where: 'worked example (b): Gaussian tail 0.5 erfc(z/sqrt 2) with z = 19.5/sqrt(96)'
    formula: 0.5*erfc((259.5 - 240)/sqrt(96)/sqrt(2))
    expected: '0.023'
    shown: ['\text{erfc}(1.99/\sqrt2) \approx 0.023$']
    source: {cite: reading1, at: 'p. 40, point 4'}
    origin: page-own

  - id: we-one-in
    where: 'worked example (b): one chance in 1/0.0233'
    formula: 1/(0.5*erfc((259.5 - 240)/sqrt(96)/sqrt(2)))
    expected: '43'
    shown: ['about one chance in 43']
    source: {cite: reading1, at: 'p. 40, point 4'}
    origin: page-own

  - id: we-macroscopic
    where: 'worked example (b): sqrt(0.4/(0.6 x 10^22))'
    formula: sqrt(0.4/(0.6*1e22))
    expected: '8.2e-12'
    shown: ['\approx 8.2 \times 10^{-12}$']
    source: {cite: reading1, at: 'p. 40, point 4'}
    origin: page-own

  # ---------------------------------------------------------------- quizzes
  - id: quiz1-cond
    where: 'quiz 1: P(s1 = 1 | s2 = 1) = 0.3/(0.3 + 0.1)'
    formula: 0.3/(0.3 + 0.1)
    expected: '0.75'
    shown: ['= 0.3/0.4 = 0.75$']
    source: {cite: reading1, at: 'p. 37'}
    origin: page-own

  - id: quiz1-marginal
    where: 'quiz 1: P1(1) = 0.3 + 0.2'
    formula: 0.3 + 0.2
    expected: '0.5'
    shown: ['$P_1(1) = 0.3 + 0.2$']
    source: {cite: reading1, at: 'p. 36, point 2'}
    origin: page-own

  - id: quiz1-normalized
    where: 'quiz 1: the four joint probabilities add up to 1'
    formula: 0.3 + 0.2 + 0.1 + 0.4
    expected: '1'
    shown: ['$P_{12}(0,0) = 0.4$. What is']
    source: {cite: reading1, at: 'p. 36, point 2'}
    origin: page-own

  - id: quiz2-mean
    where: 'quiz 2: <k> = 50 x 0.2'
    formula: 50*0.2
    expected: '10'
    shown: ['np = 50 \\times 0.2 = 10$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: quiz2-variance
    where: 'quiz 2: variance 10 x 0.8'
    formula: 10*0.8
    expected: '8'
    shown: ['np(1 - p) = 10 \\times 0.8 = 8$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: quiz2-dk
    where: 'quiz 2: Delta k = sqrt 8 (choices and explanation)'
    formula: sqrt(8)
    expected: '2.83'
    shown: ['\\sqrt 8 \\approx 2.83$', '$\\langle k\\rangle = 10$, $\\Delta k \\approx 2.83$", "$\\langle', '$\\langle k\\rangle = 40$, $\\Delta k \\approx 2.83$"]']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: quiz2-wrong-sqrt10
    where: 'quiz 2: the distractor sqrt(10), forgetting 1 - p'
    formula: sqrt(10)
    expected: '3.16'
    shown: ['$\\Delta k \\approx 3.16$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: quiz2-zeros
    where: 'quiz 2: the distractor 40 = mean number of zeros, 50 x 0.8'
    formula: 50*0.8
    expected: '40'
    shown: ['$\\langle k\\rangle = 40$']
    source: {cite: reading1, at: 'p. 39, point 3'}
    origin: page-own

  - id: quiz3-variance
    where: 'quiz 3: variance of the mean 4/100'
    formula: 4/100
    expected: '0.04'
    shown: ['= 4/100 = 0.04$']
    source: {cite: reading1, at: 'p. 40 (boxed)'}
    origin: page-own

  - id: quiz3-sd
    where: 'quiz 3: standard deviation sqrt(0.04)'
    formula: sqrt(0.04)
    expected: '0.2'
    shown: ['\\sqrt{0.04} = 0.2$']
    source: {cite: reading1, at: 'p. 40 (boxed)'}
    origin: page-own

  - id: quiz3-sum
    where: 'quiz 3: the distractor 20 = standard deviation of the sum, sqrt(100 x 4)'
    formula: sqrt(100*4)
    expected: '20'
    shown: ['and 20 is the standard deviation of the sum']
    source: {cite: reading1, at: 'p. 40 (boxed)'}
    origin: page-own

  - id: quiz4-example2
    where: 'quiz 4 explanation: Example II, <s1 s2> = P12(1,1) = 1/6 and <s1><s2> = 1/4'
    formula: 1/2*1/2
    expected: '0.25'
    shown: ['but $\\langle s_1\\rangle\\langle s_2\\rangle = 1/4$']
    source: {cite: reading1, at: 'p. 38'}
    origin: page-own
