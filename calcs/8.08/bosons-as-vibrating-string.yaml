# Calculations on content/year-4/8.08/bosons-as-vibrating-string.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.08 (Spring 2005), Supplement 2 "Quantum Theory for Interacting Bosons": Wen's typed book chapter 4
# "Boson systems", sections 4.1-4.5. Page numbers are the printed page numbers of the chapter (28-54 = PDF pages 1-27);
# equation numbers are Wen's. Wen sets hbar = 1.
# The notes quote no numbers. Page's own numbers: the dispersion plot (points), the worked example (ring of 2 cm,
# two bosons at n = -2 and one at n = 5; counting three bosons in three levels) and quiz 1.
# Notation in the formulas: eps = epsilon_kappa, XX, PP = oscillator coordinate and momentum, xx, yy = coordinates,
# cc = c, mm = m, kk = k.

page: content/year-4/8.08/bosons-as-vibrating-string.mdx
calcs:
  # ---------------------------------------------------------------- the fermion Hamiltonian (section 4.2, p. 31)
  - id: theta-derivative-x
    kind: identity
    where: 'text after "Removing the extra terms by a phase": e^(iΘ) ∂x e^(-iΘ) = ∂x - i ∂xΘ, and ∂xΘ = -y/(x² + y²) for Θ = atan(y/x) (x > 0), so the added term is +iy/(x² + y²)'
    formula: -deriv('atan(yy/t)', 't', xx)
    equals: yy/(xx**2 + yy**2)
    samples: {xx: [0.5, 1.2, 3.0], yy: [0.3, -0.7, 2.0]}
    tolerance: 1e-6
    shown: ['$e^{i\Theta}\partial_x e^{-i\Theta} = \partial_x + iy/(x^2 + y^2)$']
    source: {cite: reading1, at: '§4.2, p. 31'}
    origin: mit

  - id: theta-derivative-y
    kind: identity
    where: 'same: ∂yΘ = x/(x² + y²), so e^(iΘ) ∂y e^(-iΘ) = ∂y - ix/(x² + y²)'
    formula: -deriv('atan(t/xx)', 't', yy)
    equals: -xx/(xx**2 + yy**2)
    samples: {xx: [0.5, 1.2, 3.0], yy: [0.3, -0.7, 2.0]}
    tolerance: 1e-6
    shown: ['$e^{i\Theta}\partial_y e^{-i\Theta} = \partial_y - ix/(x^2 + y^2)$']
    source: {cite: reading1, at: '§4.2, p. 31'}
    origin: mit

  - id: extra-term-cancels
    kind: identity
    where: 'formula "Two fermions described by a symmetric wave function": with relative coordinates (x, y) = (x1 - x2, y1 - y2), the phase adds i∂xΘ = -iy/r² to ∂x1, which cancels i a_x with a_x = y/r²'
    formula: yy/(xx**2 + yy**2) + deriv('atan(yy/t)', 't', xx)
    equals: 0
    samples: {xx: [0.5, 1.2, 3.0], yy: [0.3, -0.7, 2.0]}
    tolerance: 1e-6
    shown: ['a_x = \frac{y_1 - y_2}{r_{12}^2}']
    source: {cite: reading1, at: '§4.2, p. 31, eqn (4.2.1)'}
    origin: mit

  - id: phase-flips-sign
    kind: identity
    where: 'text: turning a vector round adds π to its angle, so e^(iΘ(-x,-y)) = -e^(iΘ(x,y)) (real part checked, x > 0)'
    formula: cos(atan(yy/xx) + pi)
    equals: -cos(atan(yy/xx))
    samples: {xx: [0.5, 1.2, 3.0], yy: [0.3, -0.7, 2.0]}
    tolerance: 1e-12
    shown: ['$e^{i\Theta(-x, -y)} = -e^{i\Theta(x, y)}$']
    source: {cite: reading1, at: '§4.2, p. 31'}
    origin: mit

  # ---------------------------------------------------------------- the vibrating string (section 4.4, pp. 34-35)
  - id: wave-equation-from-phase-space
    kind: identity
    where: 'formula "The string''s wave equation" from "Phase-space form": for a plane wave e^(ikx), ḧ = Ω ṗ = -Ω² h with Ω² = c²k² + m²c⁴, the Fourier form of c²∂x² h - m²c⁴ h'
    formula: -(cc**2*kk**2 + mm**2*cc**4)
    equals: cc**2*(-kk**2) - mm**2*cc**4
    samples: {cc: [1.0, 2.0, 0.5], kk: [0.3, 1.5, 2.0], mm: [0.0, 1.0, 0.7]}
    tolerance: 1e-12
    shown: ['\ddot h(x, t) = c^2\partial_x^2h(x, t) - m^2c^4h(x, t)']
    source: {cite: reading1, at: '§4.4, pp. 34-35, eqns (4.4.1) and (4.4.2)'}
    origin: mit

  - id: oscillator-equation-real-part
    kind: identity
    where: 'formula "Each mode is an oscillator": with φ = (X + iP)/√2 and Ṗ = -εX, the real part of iφ̇, -Ṗ/√2, equals the real part of εφ'
    formula: -(-eps*XX)/sqrt(2)
    equals: eps*XX/sqrt(2)
    samples: {eps: [0.5, 1.0, 3.0], XX: [0.2, -1.0, 2.5]}
    tolerance: 1e-12
    shown: ['\dot X_{\kappa} = \epsilon_{\kappa}P_{\kappa}, \qquad \dot P_{\kappa} = -\epsilon_{\kappa}X_{\kappa}']
    source: {cite: reading1, at: '§4.4, p. 35, eqn (4.4.6)'}
    origin: mit

  - id: oscillator-frequency
    kind: identity
    where: 'text after "Each mode is an oscillator": ω = √(K/M) with M = 1/ε, K = ε gives ω = ε'
    formula: sqrt(eps/(1/eps))
    equals: eps
    samples: {eps: [0.5, 1.0, 3.0]}
    tolerance: 1e-12
    shown: ['$\omega_\kappa = \sqrt{K_\kappa/M_\kappa} = \epsilon_\kappa$']
    source: {cite: reading1, at: '§4.4, p. 35'}
    origin: mit

  - id: energy-two-forms
    kind: identity
    where: 'formula "Energy of the string": P²/2M + KX²/2 with M = 1/ε, K = ε equals ε|φ|² with φ = (X + iP)/√2; with the notes'' φ = X + iP of §4.4 it would be twice as large (the slip the page notes)'
    formula: PP**2/(2*(1/eps)) + 0.5*eps*XX**2
    equals: eps*((XX/sqrt(2))**2 + (PP/sqrt(2))**2)
    samples: {eps: [0.5, 1.0, 3.0], XX: [0.2, -1.0, 2.5], PP: [1.1, 0.4, -0.9]}
    tolerance: 1e-12
    shown: ['only the second makes the two forms of the energy below agree']
    source: {cite: reading1, at: '§4.4, p. 35, eqn (4.4.7)'}
    origin: slip

  - id: energy-h-form
    kind: identity
    where: 'formula "Energy of the string", last form: for one mode, ½ ḣ Ω⁻¹ ḣ + ½ h Ω h with ḣ = Ω p equals ½ Ω (h² + p²) = Ω |φ|²'
    formula: 0.5*(eps*pp)*(1/eps)*(eps*pp) + 0.5*hh*eps*hh
    equals: eps*(hh**2 + pp**2)/2
    samples: {eps: [0.5, 1.0, 3.0], hh: [0.2, -1.0, 2.5], pp: [1.1, 0.4, -0.9]}
    tolerance: 1e-12
    shown: ['\frac12\dot h\,\frac{1}{\sqrt{-c^2\partial_x^2 + m^2c^4}}\,\dot h']
    source: {cite: reading1, at: '§4.4, p. 35, eqn (4.4.7)'}
    origin: mit

  # ---------------------------------------------------------------- dispersion plot
  - id: plot-point-1
    where: 'plot points: ε = √(1 + x²) at x = 0.5 (n = ±1 with 2π/L = 0.5 mc/ħ)'
    formula: sqrt(1 + 0.5**2)
    expected: '1.11803'
    shown: ['{ x: 0.5, y: 1.11803 }']
    source: {cite: reading1, at: '§4.1, p. 30, eqn (4.1.5)'}
    origin: page-own

  - id: plot-point-2
    where: 'plot points: ε at x = 1 (n = ±2)'
    formula: sqrt(1 + 1**2)
    expected: '1.41421'
    shown: ['{ x: 1, y: 1.41421 }']
    source: {cite: reading1, at: '§4.1, p. 30, eqn (4.1.5)'}
    origin: page-own

  - id: plot-point-3
    where: 'plot points: ε at x = 1.5 (n = ±3)'
    formula: sqrt(1 + 1.5**2)
    expected: '1.80278'
    shown: ['{ x: 1.5, y: 1.80278 }']
    source: {cite: reading1, at: '§4.1, p. 30, eqn (4.1.5)'}
    origin: page-own

  # ---------------------------------------------------------------- worked example: ring of 2 cm
  - id: ex-hc
    where: 'worked example: 2πħc = hc'
    inputs: {}
    formula: 2*pi*hbar*c
    expected: 1.986e-25 J*m
    shown: ['$2\pi\hbar c = 1.986 \times 10^{-25}$ J m']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: ex-unit-J
    where: 'worked example: one unit 2πħc/L with L = 2 cm'
    inputs: {L: 0.02 m}
    formula: 2*pi*hbar*c/L
    expected: 9.93e-24 J
    shown: ['one unit is $9.93 \times 10^{-24}$ J']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: ex-unit-eV
    where: 'worked example: the same unit in eV'
    inputs: {L: 0.02 m}
    formula: 2*pi*hbar*c/L
    expected: 6.20e-5 eV
    shown: ['or $6.20 \times 10^{-5}$ eV']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: ex-energy
    where: 'worked example: (2 + 2 + 5) units = 9 units'
    inputs: {L: 0.02 m}
    formula: (2 + 2 + 5)*2*pi*hbar*c/L
    expected: 5.58e-4 eV
    shown: ['$E = 5.58 \times 10^{-4}$ eV above the vacuum']
    source: {cite: reading1, at: '§4.3, p. 34, eqn (4.3.1)'}
    origin: page-own

  - id: quiz-energy-units
    where: 'quiz 1: energy in units of 2πħc/L, |−2| + |−2| + 5'
    formula: abs(-2) + abs(-2) + 5
    expected: '9'
    quiz: 1
    shown: ['so $E = 2 + 2 + 5 = 9$ in these units']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: quiz-momentum-units
    where: 'quiz 1 explanation: total momentum (−2 − 2 + 5) units of 2πħ/L'
    formula: -2 - 2 + 5
    expected: '1'
    shown: ['$(-2 - 2 + 5) = 1$ unit of $2\\pi\\hbar/L$']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: ex-momentum
    where: 'worked example: momentum 1 × 2πħ/L = h/L'
    inputs: {L: 0.02 m}
    formula: 2*pi*hbar/L
    expected: 3.31e-32 kg*m/s
    shown: ['$(-2 - 2 + 5)(2\pi\hbar/L) = h/L = 3.31 \times 10^{-32}$ kg m/s']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: ex-count-bosons
    where: 'worked example: occupation numbers (n1, n2, n3) adding up to 3: C(5, 2) = 5·4/2'
    formula: 5*4/2
    expected: '10'
    shown: ['there are $\binom{5}{2} = 10$ ways to choose them']
    source: {cite: reading1, at: '§4.3, p. 34'}
    origin: page-own

  - id: ex-count-distinguishable
    where: 'worked example: three distinguishable particles in three levels, 3^3'
    formula: 3**3
    expected: '27'
    shown: ['$3^3 = 27$ states']
    source: {cite: reading1, at: '§4.1, p. 29'}
    origin: page-own

  - id: ex-count-check
    where: 'worked example: 3 states (3,0,0)-type × 1 + 6 states (2,1,0)-type × 3 + 1 state (1,1,1) × 3! = 27'
    formula: 3*1 + 6*3 + 1*6
    expected: '27'
    shown: ['which gives $3 + 18 + 6 = 27$']
    source: {cite: reading1, at: '§4.1, p. 29'}
    origin: page-own
