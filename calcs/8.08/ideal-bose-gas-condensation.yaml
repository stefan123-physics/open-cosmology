    formula: 2*pi*hbar**2/(m*k_B)*(rho/m/2.6123753)**(2/3)
    expected: 2.8 K
    shown: ['the formula gives about 2.8 K. (The notes print']
    source: {cite: reading1, at: 'p. 61'}
    origin: page-own

  - id: helium-tc-notes
    kind: fact
    where: 'laboratory section and quiz 2: the notes print T_c = 1.8 K, which does not follow from their numbers'
    value: '1.8 K'
    shown: ['(The notes print $T_c = 1.8$ K, which does not follow from their numbers.)']
    source: {cite: reading1, at: 'p. 61'}
    origin: slip

  - id: helium-lambda
    kind: fact
    where: 'laboratory section, heat-capacity section and summary: the superfluid transition of helium-4 at 2.17 K (Wen: actual T_c = 2.17)'
    value: '2.17 K'
    shown: ['The actual transition of liquid helium, to a superfluid, is at 2.17 K']
    source: {cite: reading1, at: 'p. 61'}
    origin: mit

  # ---------------------------------------------------------------- worked example: potassium-41
  - id: k41-mass
    where: 'worked example "A potassium condensate": m = 40.96 u'
    inputs: {}
    formula: 40.96*1.66053906660e-27
    expected: '6.802e-26'
    shown: ['(6.802 \times 10^{-26} \times 1.381 \times 10^{-23})$ K m²']
    source: {cite: reading1, at: 'p. 61'}
    origin: page-own

  - id: k41-prefactor
    where: 'worked example, step "The transition": 2 pi hbar^2/(m k_B)'
    inputs: {m: 6.8016e-26 kg}
    formula: 2*pi*hbar**2/(m*k_B)
    expected: 7.44e-20 K*m**2
    shown: ['$= 7.44 \times 10^{-20}$ K m²']
    source: {cite: reading1, at: 'p. 61'}
    origin: page-own

  - id: k41-density-term
    where: 'worked example: (n/2.612)^(2/3)'
    inputs: {n: 5.0e19 1/m**3}
    formula: (n/2.6123753)**(2/3)
    expected: 7.16e12 1/m**2
    shown: ['$(n/2.612)^{2/3} = 7.16 \times 10^{12}$ m⁻²']
    source: {cite: reading1, at: 'p. 61'}
    origin: page-own

  - id: k41-tc
    where: 'worked example: T_c'
    inputs: {m: 6.8016e-26 kg, n: 5.0e19 1/m**3}
    formula: 2*pi*hbar**2/(m*k_B)*(n/2.6123753)**(2/3)
    expected: 5.3e-7 K
