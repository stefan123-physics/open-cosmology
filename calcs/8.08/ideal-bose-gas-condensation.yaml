    where: 'worked example: n^(-1/3)'
    inputs: {n: 5.0e19 1/m**3}
    formula: n**(-1/3)
    expected: 0.27 um
    shown: ['the spacing $n^{-1/3}$ is 0.27 μm']
    source: {cite: reading1, at: 'p. 61'}
