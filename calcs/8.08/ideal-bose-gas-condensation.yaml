  - id: k41-one-minus-z
    where: 'worked example: 1 - z = 1/N_0'
    inputs: {}
    formula: 1/(1e5*(1 - 0.5**1.5))
    expected: '1.5e-5'
    shown: ['$1 - z = 1.5 \times 10^{-5}$']
    source: {cite: reading1, at: 'p. 58'}
    origin: page-own

  - id: k41-mu
    where: 'worked example: mu/k_B = -T/N_0 at T = T_c/2'
    inputs: {m: 6.8016e-26 kg, n: 5.0e19 1/m**3}
