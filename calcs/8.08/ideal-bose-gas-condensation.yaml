  - id: k41-n0
    where: 'worked example, step "Half the transition temperature": N_0 = 1e5 x 0.646'
    inputs: {}
    formula: 1e5*(1 - 0.5**1.5)
    expected: '64600'
    tolerance: 100
    shown: ['so about 64,600 atoms are in the lowest level']
    source: {cite: reading1, at: 'p. 58'}
