    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  # ---------------------------------------------------------------- callout
  - id: g-count
    where: 'cosmology callout: g = 2 + (7/8)(6 + 4) for photons, three neutrino species with antineutrinos, and e+ e- pairs (8.286 Lecture 17)'
    inputs: {}
    formula: 2 + 7/8*(6 + 4)
    expected: '10.75'
    shown: ['which gives $g = 10\frac34$ for photons, neutrinos and electron-positron pairs']
    source: {cite: reading1, at: 'p. 55 (the Bose distribution; the count itself is from 8.286 Lecture 17)'}
