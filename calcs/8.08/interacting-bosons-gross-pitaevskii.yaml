# Calculations on content/year-4/8.08/interacting-bosons-gross-pitaevskii.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.08 (Spring 2005, Wen) Lecture Notes, Chapter VII "The Bose Gas", first file (handwritten scan).
# Page numbers are Wen's handwritten numbers at the top right of each page (pp. 48-69 = PDF pages 1-22); this page
# covers pp. 62-69, point 4. The notes quote no numbers in this part.
# Page's own examples: the potential plot (mu/v0 = 0.8); the dispersion plot; a sodium condensate (n = 1e20 m^-3,
# v0 = 1.0e-50 J m^3, from a = 2.75 nm through v0 = 4 pi hbar^2 a/m, a relation not in the notes); quiz 2 (rubidium-87,
# mu/k_B = 50 nK).
# Notation in identities: units hbar = m = 1 unless stated; kk = k, mu = mu, v0 = v_0, nn = n.
# Constants: k_B, hbar from calcs/constants.yaml; u = 1.66053906660e-27 kg (CODATA 2018).

page: content/year-4/8.08/interacting-bosons-gross-pitaevskii.mdx
calcs:
  # ---------------------------------------------------------------- uniform condensate (p. 68)
  - id: uniform-density
    kind: identity
    where: 'formula "Uniform ground state with repulsion": the minimum of -mu n + (v0/2) n^2 over n >= 0 is at n = mu/v0 for mu > 0 (checked as the zero of the derivative)'
    formula: solve('-mu + v0*t', 't', 0, 100)
    equals: mu/v0
    samples: {mu: [0.3, 1.0], v0: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['n = \frac{\mu}{v_0} \ \text{ or } \ n = 0']
    source: {cite: reading1, at: 'p. 68'}
    origin: mit

  - id: uniform-omega
    kind: identity
    where: 'formula "Grand potential of the uniform condensate": -mu n + (v0/2) n^2 at n = mu/v0 equals -mu^2/(2 v0)'
    formula: -mu*(mu/v0) + v0/2*(mu/v0)**2
    equals: -mu**2/(2*v0)
    samples: {mu: [0.3, 1.0], v0: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['-\dfrac{\mu^2}{2v_0}, & \mu > 0,\ \psi_0 \neq 0']
    source: {cite: reading1, at: 'p. 68'}
    origin: mit

  - id: plot-minimum
    where: 'potential plot caption: the minimum of -0.8 x^2 + x^4/2 lies at x = sqrt(0.8)'
    inputs: {}
    formula: sqrt(0.8)
    expected: '0.89'
    shown: ['(for μ/v₀ = 0.8, at ψ = ±0.89']
    source: {cite: reading1, at: 'p. 68'}
    origin: page-own

  - id: plot-depth
    where: 'potential plot caption: depth -mu^2/(2 v0) = -0.32 for mu/v0 = 0.8'
    inputs: {}
    formula: -0.8*0.8 + 0.5*0.8**2
    expected: '-0.32'
    shown: ['at ψ = ±0.89 with depth −0.32']
    source: {cite: reading1, at: 'p. 68'}
    origin: page-own

  # ---------------------------------------------------------------- collective modes (pp. 68-69)
  - id: mode-amplitudes
    kind: identity
    where: 'formulas "Collective mode" and "Dispersion of the collective mode": with delta psi_1 = (hbar k^2/2m omega) C cos and delta psi_2 = C sin, the first equation needs hbar omega C = (eps_k + 2 mu) times the amplitude of delta psi_1 (units hbar = m = 1, C = 1)'
    formula: (kk**2/2 + 2*mu)*kk**2/(2*sqrt((kk**2/2 + 2*mu)*kk**2/2))
    equals: sqrt((kk**2/2 + 2*mu)*kk**2/2)
    samples: {kk: [0.1, 1.0, 3.0], mu: [0.5, 2.0, 1.0]}
    tolerance: 1e-9
    shown: ['\omega_k^2 = \left(\frac{\hbar^2}{2m}k^2 + 2\mu\right)\frac{k^2}{2m} = \frac{k^2}{2m}\left(\frac{\hbar^2}{2m}k^2 + 2v_0n\right)']
    source: {cite: reading1, at: 'p. 69'}
    origin: mit

  - id: sound-limit
    kind: limit
    where: 'formula "Speed of sound in the condensate": omega_k/k tends to sqrt(mu/m) as k -> 0 (units hbar = m = 1, mu = 0.7)'
    inputs: {}
    formula: sqrt((kk**2/2 + 2*0.7)*kk**2/2)/kk
    limit: sqrt(0.7)
    vary: {kk: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 1e-3
    shown: ['v_s = \sqrt{\frac{\mu}{m}} = \sqrt{\frac{v_0n}{m}}']
    source: {cite: reading1, at: 'p. 69'}
    origin: mit

  - id: dispersion-plot-units
    kind: identity
    where: 'dispersion plot: with x = hbar k/sqrt(2 m mu), hbar omega/mu = x sqrt(x^2 + 2) (units hbar = m = 1)'
    formula: sqrt((kk**2/2 + 2*mu)*kk**2/2)/mu
    equals: (kk/sqrt(2*mu))*sqrt((kk/sqrt(2*mu))**2 + 2)
    samples: {kk: [0.2, 1.0, 4.0], mu: [0.5, 2.0, 1.0]}
    tolerance: 1e-9
    shown: ['{ expr: "x*sqrt(x^2 + 2)", label: "interacting" }']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: dispersion-sound-slope
    kind: identity
    where: 'dispersion plot caption: the sound line hbar v_s k is sqrt(2) x in these units'
    formula: kk*sqrt(mu)/mu
    equals: sqrt(2)*kk/sqrt(2*mu)
    samples: {kk: [0.5, 2.0], mu: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['(slope √2 in these units)']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  # ---------------------------------------------------------------- worked example: sodium
  - id: na-scattering
    kind: fact
    where: 'worked example "Sound in a sodium condensate": sodium''s scattering length, about 2.75 nm (about 52 Bohr radii)'
    value: '2.75 nm'
    shown: ['scattering length of about 2.75 nm']
    source: {ref: 'measured s-wave scattering length of sodium-23 in its |F = 1> state, about 52 Bohr radii (2.75 nm)'}
    origin: later-data

  - id: na-v0
    where: 'worked example: v0 = 4 pi hbar^2 a/m'
    inputs: {a: 2.75 nm, m: 3.8175e-26 kg}
    formula: 4*pi*hbar**2*a/m
    expected: 1.0e-50 J*m**3
    shown: ['contact strength $v_0 = 1.0 \times 10^{-50}$ J m³']
    source: {cite: reading1, at: 'p. 67'}
    origin: page-own

  - id: na-mu
    where: 'worked example, step "Chemical potential": mu = v0 n'
    inputs: {v0: 1.0e-50 J*m**3, n: 1.0e20 1/m**3}
    formula: v0*n
    expected: 1.0e-30 J
    shown: ['$\mu = v_0n = 1.0 \times 10^{-50} \times 10^{20}$ J $= 1.0 \times 10^{-30}$ J']
    source: {cite: reading1, at: 'p. 68'}
    origin: page-own

  - id: na-mu-nK
    where: 'worked example: mu/k_B with the printed v0 = 1.0e-50 J m^3'
    inputs: {v0: 1.0e-50 J*m**3, m: 3.8175e-26 kg, n: 1.0e20 1/m**3}
    formula: v0*n/k_B
    expected: 72 nK
    shown: ['or $\mu/k_B = 72$ nK']
    source: {cite: reading1, at: 'p. 68'}
    origin: page-own

  - id: na-mass
    where: 'worked example, step "Speed of sound": m = 22.99 u'
    inputs: {}
    formula: 22.99*1.6605e-27
    expected: '3.82e-26'
    shown: ['$m = 22.99 \times 1.6605 \times 10^{-27}$ kg $= 3.82 \times 10^{-26}$ kg']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: na-mu-over-m
    where: 'worked example: mu/m'
    inputs: {v0: 1.0e-50 J*m**3, m: 3.8175e-26 kg, n: 1.0e20 1/m**3}
    formula: v0*n/m
    expected: 2.62e-5 m**2/s**2
    shown: ['$v_s = \sqrt{\mu/m} = \sqrt{2.62 \times 10^{-5}}$ m/s']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: na-sound
    where: 'worked example: v_s = sqrt(mu/m)'
    inputs: {v0: 1.0e-50 J*m**3, m: 3.8175e-26 kg, n: 1.0e20 1/m**3}
    formula: sqrt(v0*n/m)
    expected: 5.1e-3 m/s
    shown: ['m/s $= 5.1 \times 10^{-3}$ m/s: about 5 millimetres per second']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: na-sound-air
    where: 'worked example: sound in air (343 m/s) against v_s'
    inputs: {v0: 1.0e-50 J*m**3, m: 3.8175e-26 kg, n: 1.0e20 1/m**3, vair: 343 m/s}
    formula: vair/sqrt(v0*n/m)
    expected: '67000'
    tolerance: 500
    shown: ['about 67,000 times slower than sound in air (343 m/s)']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: na-crossover-k
    where: 'worked example, step "The crossover": k = sqrt(4 m mu)/hbar'
    inputs: {v0: 1.0e-50 J*m**3, m: 3.8175e-26 kg, n: 1.0e20 1/m**3}
    formula: sqrt(4*m*v0*n)/hbar
    expected: 3.7e6 1/m
    shown: ['$k = \sqrt{4m\mu}/\hbar = 3.7 \times 10^6$ m⁻¹']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: na-crossover-wavelength
    where: 'worked example: 2 pi/k'
    inputs: {v0: 1.0e-50 J*m**3, m: 3.8175e-26 kg, n: 1.0e20 1/m**3}
    formula: 2*pi*hbar/sqrt(4*m*v0*n)
    expected: 1.7 um
    shown: ['a wavelength $2\pi/k = 1.7$ μm']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  # ---------------------------------------------------------------- quiz 2: rubidium-87
  - id: rb-mu
    where: 'quiz 2 explanation: mu = k_B x 50 nK'
    inputs: {T: 50 nK}
    formula: k_B*T
    expected: 6.90e-31 J
    shown: ['\\sqrt{6.90 \\times 10^{-31}/1.443 \\times 10^{-25}}$ m/s']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: rb-mass
    where: 'quiz 2 explanation: m = 86.9 u'
    inputs: {}
    formula: 86.909*1.66053906660e-27
    expected: '1.443e-25'
    shown: ['A rubidium-87 condensate (mass 86.9 u)']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: rb-sound
    where: 'quiz 2 (answer 1): v_s = sqrt(mu/m)'
    inputs: {T: 50 nK, m: 1.4432e-25 kg}
    formula: sqrt(k_B*T/m)
    expected: 2.19e-3 m/s
    shown: ['m/s $= 2.19 \\times 10^{-3}$ m/s. 3.1 mm/s is']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own

  - id: rb-sound-wrong
    where: 'quiz 2 distractor: sqrt(2 mu/m)'
    inputs: {T: 50 nK, m: 1.4432e-25 kg}
    formula: sqrt(2*k_B*T/m)
    expected: 3.1 mm/s
    shown: ['$\\sqrt{2\\mu/m}$, a factor $\\sqrt2$ too large']
    source: {cite: reading1, at: 'p. 69'}
    origin: page-own
