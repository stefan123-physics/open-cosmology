# Calculations on content/year-4/8.08/semiconductors-and-diodes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.08 (Spring 2005) Chapter VIII notes, "The Fermi Gas" (Wen, handwritten scan). Page numbers are Wen's
# handwritten numbers, top right (76-92 = PDF pages 1-13 and 15-18). This page uses pp. 89-92 (PDF pages 15-18);
# PDF page 14, between pp. 88 and 89, is an unnumbered homework sketch (Huang Problem 12.6), not used. The notes
# quote no numbers on these pages. Identities use units hbar = k_B = 1 unless stated.
# Page's own example: a silicon-like semiconductor, gap 1.12 eV, m_e = 1.08 m, m_h = 0.81 m, two spin states.

page: content/year-4/8.08/semiconductors-and-diodes.mdx
calcs:
  # ---------------------------------------------------------------- bands (p. 89)
  - id: lattice-periodic
    kind: identity
    where: 'formula "A plane wave on a lattice": exp(i (k + 2 pi/a) n a) = exp(i k n a); real part checked, cos((k + 2 pi/a) n a) = cos(k n a)'
    formula: cos((kk + 2*pi/aa)*nn*aa)
    equals: cos(kk*nn*aa)
    samples: {kk: [0.3, 1.7, -0.9], aa: [1.0, 0.5, 2.0], nn: [3, -2, 7]}
    tolerance: 1e-9
    shown: ['since $e^{i2\pi n} = 1$ at every site']
    source: {cite: reading1, at: 'p. 89'}
    origin: mit

  - id: band-small-k
    kind: limit
    where: 'formula "A band on a lattice": (1/(m a^2))(1 - cos ka) divided by k^2/2m tends to 1 as k goes to 0'
    formula: (1 - cos(kk*1.3))/1.3**2/(kk**2/2)
    vary: {kk: [0.1, 0.01, 0.001]}
    limit: 1
    tolerance: 1e-5
    shown: ['where $1 - \cos ka \approx \frac12k^2a^2$']
    source: {cite: reading1, at: 'p. 89'}
    origin: mit

  - id: band-maximum
    kind: identity
    where: 'plot caption: the band maximum, at ka = pi, is 2 hbar^2/(m a^2) (in those units, 1 - cos(pi) = 2)'
    formula: 1 - cos(pi)
    equals: 2
    samples: {dd: [1.0]}
    tolerance: 1e-12
    shown: ['levels off at its maximum, 2ħ²/ma²']
    source: {cite: reading1, at: 'p. 89'}
    origin: page-own

  # ---------------------------------------------------------------- Method 1 (p. 90)
  - id: hole-occupation
    kind: identity
    where: 'formula "Densities of electrons and holes": 1 minus the occupation of a valence level at energy -(eps_h + Delta/2) is 1/(exp(beta(eps_h + Delta/2 + mu)) + 1)'
    formula: 1 - 1/(exp((-(eh + dl/2) - mu)/TT) + 1)
    equals: 1/(exp((eh + dl/2 + mu)/TT) + 1)
    samples: {eh: [0.1, 0.5], dl: [1.0, 2.0], mu: [0.05, -0.2], TT: [0.1, 0.3]}
    tolerance: 1e-9
    shown: ['the probability that a level is empty is one minus its Fermi–Dirac occupation']
    source: {cite: reading1, at: 'p. 90'}
    origin: mit

  - id: equal-masses-mu-zero
    kind: identity
    where: 'text: with m_e = m_h and mu = 0 the electron and hole integrals are equal (radial integrals, m = 1, Delta = 1, T = 0.2)'
    formula: integrate('k**2/(exp((k**2/2 + 0.5 - 0)/0.2) + 1)', 'k', 0, 8)
    equals: integrate('k**2/(exp((k**2/2 + 0.5 + 0)/0.2) + 1)', 'k', 0, 8)
    samples: {dd: [1.0]}
    tolerance: 1e-12
    shown: ['If $m_e = m_h$ the two integrals are mirror images and $\mu = 0$']
    source: {cite: reading1, at: 'p. 90'}
    origin: mit

  - id: large-t-substitution
    kind: identity
    where: 'formula "Carrier density when the gap is negligible": integral d^3k/(2 pi)^3 1/(exp(k^2/2mT) + 1) = (1/2 pi^2)(2mT)^(3/2) integral t^2/(exp(t^2) + 1) dt (hbar = k_B = 1); the notes write e^t'
    formula: integrate('4*pi*k**2/(exp(k**2/(2*mm*TT)) + 1)', 'k', 0, 30*sqrt(mm*TT))/(2*pi)**3
    equals: (2*mm*TT)**1.5/(2*pi**2)*integrate('t**2/(exp(t**2) + 1)', 't', 0, 20)
    samples: {mm: [1.0, 0.4], TT: [1.0, 3.0]}
    tolerance: 1e-6
    shown: ['(Here $t = \hbar k/\sqrt{2mk_BT}$; the notes write $e^t$ in the denominator']
    source: {cite: reading1, at: 'p. 90'}
    origin: slip

  - id: large-t-order-lambda
    kind: identity
    where: 'formula "Carrier density when the gap is negligible": the result is a number of order 1 times lambda^-3 (n lambda^3 = 0.765, the Dirichlet eta function at 3/2)'
    formula: (2)**1.5/(2*pi**2)*integrate('t**2/(exp(t**2) + 1)', 't', 0, 20)*(2*pi)**1.5
    equals: 0.765
    samples: {dd: [1.0]}
    tolerance: 0.01
    shown: ['about one carrier per thermal wavelength cubed']
    source: {cite: reading1, at: 'p. 90'}
    origin: page-own

  - id: small-t-classical
    kind: identity
    where: 'formula "Carrier density when the gap is large": integral d^3k/(2 pi)^3 exp(-beta eps) exp(-beta Delta/2) = lambda^-3 exp(-beta Delta/2) (hbar = k_B = 1)'
    formula: integrate('4*pi*k**2*exp(-k**2/(2*mm*TT))', 'k', 0, 40*sqrt(mm*TT))/(2*pi)**3*exp(-dl/(2*TT))
    equals: (2*pi/(mm*TT))**(-1.5)*exp(-dl/(2*TT))
    samples: {mm: [1.0, 0.4], TT: [0.05, 0.1], dl: [1.0, 1.5]}
    tolerance: 1e-6
    shown: ['= \lambda^{-3}\,e^{-\beta\Delta/2}']
    source: {cite: reading1, at: 'p. 90'}
    origin: mit

  # ---------------------------------------------------------------- Method 2 (p. 91)
  - id: mass-action-mu-cancels
    kind: identity
    where: 'formula "Mass action for electrons and holes": with n_e = g lambda_e^-3 exp(-beta(Delta/2 - mu)), n_h = g lambda_h^-3 exp(-beta(Delta/2 + mu)), the product lambda_e^3 n_e lambda_h^3 n_h = g^2 exp(-beta Delta) for any mu'
    formula: (gg*exp(-(dl/2 - mu)/TT))*(gg*exp(-(dl/2 + mu)/TT))
    equals: gg**2*exp(-dl/TT)
    samples: {gg: [1.0, 2.0], dl: [1.0, 2.0], mu: [0.1, -0.3], TT: [0.1, 0.2]}
    tolerance: 1e-9
    shown: ['The chemical potential has dropped out']
    source: {cite: reading1, at: 'p. 91'}
    origin: mit

  - id: ne-from-mass-action
    kind: identity
    where: 'formula "Carrier density of an undoped semiconductor": sqrt(4 exp(-Delta/T)/(lambda_e^3 lambda_h^3)) = 2 exp(-Delta/2T)(sqrt(me mh) T/2 pi)^(3/2) (hbar = k_B = 1)'
    formula: sqrt(4*exp(-dl/TT)/((2*pi/(me*TT))**1.5*(2*pi/(mh*TT))**1.5))
    equals: 2*exp(-dl/(2*TT))*(sqrt(me*mh)*TT/(2*pi))**1.5
    samples: {me: [1.0, 1.08], mh: [1.0, 0.81], TT: [0.1, 0.05], dl: [1.0, 2.0]}
    tolerance: 1e-9
    shown: ['n_e = n_h = 2\,e^{-\Delta/2k_BT}\left(\frac{\sqrt{m_em_h}\,k_BT}{2\pi\hbar^2}\right)^{3/2}']
    source: {cite: reading1, at: 'p. 91'}
    origin: mit

  - id: spin-factor-four
    kind: identity
    where: 'text: two spin states for each carrier multiply the right-hand side by 2 x 2 = 4'
    formula: 2*2
    equals: 4
    samples: {dd: [1.0]}
    tolerance: 1e-12
    shown: ['which multiplies the right-hand side by $2 \times 2 = 4$']
    source: {cite: reading1, at: 'p. 91'}
    origin: slip

  - id: mu-unequal-masses
    kind: identity
    where: 'text: n_e = n_h with masses me, mh gives mu = (3/4) T ln(mh/me) (k_B = 1)'
    formula: (me*TT)**1.5*exp(-(dl/2 - 0.75*TT*log(mh/me))/TT)
    equals: (mh*TT)**1.5*exp(-(dl/2 + 0.75*TT*log(mh/me))/TT)
    samples: {me: [1.08, 0.3], mh: [0.81, 0.6], TT: [0.03, 0.1], dl: [1.12, 1.0]}
    tolerance: 1e-9
    shown: ['$\mu = \frac34k_BT\ln(m_h/m_e)$']
    source: {cite: reading1, at: 'p. 90'}
    origin: page-own

  # ---------------------------------------------------------------- plot and worked example
  - id: ex-kt
    where: 'worked example (a): kT at 300 K in eV'
    inputs: {T: 300 K}
    formula: k_B*T
    expected: 0.0259 eV
    shown: ['$k_BT = 0.0259$ eV']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-exponent
    where: 'worked example (a): Delta/2kT at 300 K'
    inputs: {D: 1.12 eV, T: 300 K}
    formula: D/(2*k_B*T)
    expected: '21.7'
    shown: ['$\Delta/2k_BT \approx 21.7$']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: plot-exponent
    where: 'plot expression: Delta/2k at 300 K, written as 21.6618 in exp(21.6618 (1 - 300/T))'
    inputs: {D: 1.12 eV, T: 300 K}
    formula: D/(2*k_B*T)
    expected: '21.6618'
    shown: ['exp(21.6618*(1 - 300/x))']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-boltzmann
    where: 'worked example (a): e^(-21.7)'
    inputs: {D: 1.12 eV, T: 300 K}
    formula: exp(-D/(2*k_B*T))
    expected: 4e-10
    shown: ['$e^{-21.7}$ is about $4 \times 10^{-10}$']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-prefactor
    where: 'worked example (a): 2 (sqrt(me mh) kT/2 pi hbar^2)^(3/2) at 300 K'
    inputs: {me0: 9.1093837e-31 kg, T: 300 K}
    formula: 2*(sqrt(1.08*0.81)*me0*k_B*T/(2*pi*hbar**2))**1.5
    expected: 2.3e25 m**-3
    shown: ['is about $2.3 \times 10^{25}$ m⁻³']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-ne
    where: 'worked example (a): n_e = n_h at 300 K'
    inputs: {me0: 9.1093837e-31 kg, T: 300 K, D: 1.12 eV}
    formula: 2*(sqrt(1.08*0.81)*me0*k_B*T/(2*pi*hbar**2))**1.5*exp(-D/(2*k_B*T))
    expected: 8.9e15 m**-3
    shown: ['$n_e = n_h \approx 8.9 \times 10^{15}$ m⁻³']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: plot-ne300
    where: 'plot expression: n_e at 300 K written as 8.88e15'
    inputs: {me0: 9.1093837e-31 kg, T: 300 K, D: 1.12 eV}
    formula: 2*(sqrt(1.08*0.81)*me0*k_B*T/(2*pi*hbar**2))**1.5*exp(-D/(2*k_B*T))
    expected: 8.88e15 m**-3
    shown: ['log10(8.88e15*(x/300)^1.5']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: plot-million
    where: 'plot caption: n_e(500 K)/n_e(250 K), "about a million times"'
    inputs: {}
    formula: (500/250)**1.5*exp(21.6618*300*(1/250 - 1/500))
    expected: 1e6
    tolerance: 50%
    shown: ['rises about a million times between 250 K and 500 K']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-atoms
    kind: fact
    where: 'worked example (a): a solid has about 5e28 atoms per cubic metre (silicon: 5.0e28 m^-3), quoted for scale'
    shown: ['A solid has about $5 \times 10^{28}$ atoms per cubic metre']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-trillions
    where: 'worked example (a): 5e28/8.9e15, "one electron in several trillion"'
    inputs: {}
    formula: 5e28/8.9e15/1e12
    expected: '5.6'
    tolerance: '0.1'
    shown: ['only one electron in several trillion is free']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-lambda
    where: 'worked example (b): thermal wavelength of the electrons (m_e = 1.08 m) at 300 K'
    inputs: {me0: 9.1093837e-31 kg, T: 300 K}
    formula: sqrt(2*pi*hbar**2/(1.08*me0*k_B*T))
    expected: 4.1 nm
    shown: ['\approx 4.1$ nm']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-nlambda3
    where: 'worked example (b): n_e lambda_e^3'
    inputs: {me0: 9.1093837e-31 kg, T: 300 K, D: 1.12 eV}
    formula: 2*(sqrt(1.08*0.81)*me0*k_B*T/(2*pi*hbar**2))**1.5*exp(-D/(2*k_B*T))*(2*pi*hbar**2/(1.08*me0*k_B*T))**1.5
    expected: 6e-10
    shown: ['$n_e\lambda_e^3 \approx 6 \times 10^{-10}$']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-power-factor
    where: 'worked example (c) and quiz 4: (350/300)^(3/2)'
    inputs: {}
    formula: (350/300)**1.5
    expected: '1.26'
    shown: ['\approx 1.26 \times 22.1 \approx 28$. A 17%', '$(350/300)^{3/2} \\times e^{(\\Delta/2k_B)(1/300 - 1/350)} \\approx 1.26 \\times 22.1 \\approx 28$']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-exp-factor
    where: 'worked example (c) and quiz 4: exp((Delta/2k)(1/300 - 1/350))'
    inputs: {D: 1.12 eV, T1: 300 K, T2: 350 K}
    formula: exp(D/(2*k_B)*(1/T1 - 1/T2))
    expected: '22.1'
    shown: ['= (350/300)^{3/2}\,e^{(\Delta/2k_B)(1/300 - 1/350)}']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-ratio
    where: 'worked example (c) and quiz 4: n_e(350)/n_e(300)'
    inputs: {D: 1.12 eV, T1: 300 K, T2: 350 K}
    formula: (T2/T1)**1.5*exp(D/(2*k_B)*(1/T1 - 1/T2))
    expected: '28'
    shown: ['conduct about 28 times better', '"About 28"']
    quiz: 3
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  - id: ex-percent
    where: 'worked example (c): 350 K is 17% above 300 K'
    inputs: {}
    formula: 100*(350/300 - 1)
    expected: '17'
    shown: ['A 17% rise in temperature']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own

  # ---------------------------------------------------------------- callout
  - id: deuterium-binding
    kind: fact
    where: 'callout: the deuteron binding energy 2.22 MeV, quoted from the linked 8.902 Lecture 20 page (not in Wen''s notes)'
    shown: ['a Boltzmann factor of the binding energy, $2.22$ MeV']
    source: {cite: reading1, at: 'p. 91'}
    origin: page-own
