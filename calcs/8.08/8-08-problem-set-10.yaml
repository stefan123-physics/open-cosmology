# Calculations on content/year-4/8.08/8-08-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT's sheet gives only textbook pointers and MIT publishes no solutions, so every problem and answer is our own and is
# checked here by a route independent of the page's solution where one exists: Problem 1 takes Curie's law from the
# moment μ_B tanh(βμ_B B) of one electron at a tiny field, and the field of full polarization as the root of the number
# of electrons in the lowered band, integrated numerically from the one-spin density of states; Problem 2 takes the
# crossing temperature as the root of C_el − C_ph; Problem 3 takes the density of states by slicing the pyramid of
# levels, the Fermi energy as the root of the integrated count, and the energy by numerical integration; Problem 4
# takes the barrier as the root of the Boltzmann balance N_D e^(−ε_B/k_BT) = n_i²/N_A.
# Constants: hbar, k_B from calcs/constants.yaml; electron mass, Bohr magneton in eV/T, Avogadro constant (CODATA 2018)
# and our model values as inputs. Choice boxes have no entries: their reasons are in the solutions.

page: content/year-4/8.08/8-08-problem-set-10.mdx
calcs:
