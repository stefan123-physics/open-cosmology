    where: 'Problem 3(e), answer box: C, against (π²/3)k_B²T D(ε_F) with D(ε_F) = ε_F²/2(ħω)³ evaluated with (ħω)³ = ε_F³/6N and ε_F = k_B T_F'
    formula: |-
