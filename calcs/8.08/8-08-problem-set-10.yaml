  # ---- Problem 1: electron spins in a magnetic field

  - id: p1-curie
    kind: identity
    answer: p1-curie
    where: 'Problem 1(b), answer box: χ for k_BT ≫ ε_F, against N μ_B tanh(μ_B B/k_BT)/B of classical two-orientation moments at a tiny field B = 1e-6'
    formula: |-
      N*muB**2/(kB*T)
    equals: |-
      N*muB*tanh(muB*1e-6/(kB*T))/1e-6
    samples:
      N: [1, 100, 30, 7]
      muB: [0.5, 2.0, 1.0, 1.3]
      kB: [0.5, 1.5, 1.0, 0.8]
      T: [0.5, 2.0, 1.0, 1.7]
    tolerance: 1e-6
    shown: ['id="p1-curie"', '<Formula label="Curie''s law for free electrons"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-zero
    kind: identity
    where: 'Problem 1(a), solution check: at T = 0 the general formula gives 2μ_B² D(ε_F); with the one-spin D = (3N/4)ε^(1/2)/ε_F^(3/2) this is (3/2)Nμ_B²/ε_F (N = 1), checked against the numerical integral of D times the derivative of n_F at a low temperature'
    formula: |-
      3/2*muB**2/eF
    equals: |-
      2*muB**2*integrate('3/4*sqrt(u)/eF**1.5/(4*0.001*eF*cosh((u - eF)/(0.002*eF))**2)', 'u', 0.5*eF, 1.5*eF)
    samples:
      muB: [0.5, 2.0, 1.0]
      eF: [1.0, 5.0, 2.0]
    tolerance: 1e-4
    shown: ['$\chi = 2\mu_B^2D(\epsilon_F)$, the notes'' result (reading 1, p. 85)']
    source: {cite: reading1, at: 'p. 85'}
    origin: page-own

  - id: p1-bp
    kind: identity
    answer: p1-bp
    where: 'Problem 1(c), answer box: B_p, against the root of the number in the lowered band (filled to 2μ_B B above its bottom), integrated numerically from the one-spin density of states (3/4)ε^(1/2)/ε_F^(3/2) per electron, set equal to all of the electrons'
    formula: |-
      eF/(2**(1/3)*muB)
    equals: |-
      solve("integrate('3/4*sqrt(u)/eF**1.5', 'u', 0, 2*muB*x) - 1", 'x', 0.01*eF/muB, 2*eF/muB)
    samples:
      eF: [1.0, 5.0, 2.0, 3.3]
      muB: [0.5, 2.0, 1.0, 1.4]
    tolerance: 1e-6
    shown: ['id="p1-bp"', '<Formula label="The field of full polarization"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-factor
    where: 'Problem 1(c) and (d): 2^(−1/3) = 0.794'
    formula: |-
      2**(-1/3)
    expected: '0.794'
    shown: ['\mu_BB_p = 2^{-1/3}\,\epsilon_F = 0.794\,\epsilon_F', 'gets there later, at $0.794\,\epsilon_F$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-linear
    where: 'Problem 1(c), check: the linear law (3/2)Nμ_B B/ε_F reaches N at μ_B B = (2/3)ε_F, below 0.794 ε_F'
    formula: |-
      1/(3/2)
    expected: '0.6667'
    shown: ['would reach $N$ already at $\mu_BB = \frac23\epsilon_F$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-bpnum
    answer: p1-bpnum
    where: 'Problem 1(d), answer box: B_p = 2^(−1/3) ε_F/μ_B with ε_F = 3.24 eV, μ_B = 5.7883818060e-5 eV/T, in units of 1e4 T'
    formula: |-
      2**(-1/3)*3.24/5.7883818060e-5/1e4
    expected: '4.44'
    shown: ['id="p1-bpnum"', '$B_p = 0.794 \times 3.24\ \text{eV}/(5.788 \times 10^{-5}\ \text{eV/T}) = 4.44 \times 10^4$ T']
    source: {cite: codata, at: 'Bohr magneton in eV/T (our own numbers)'}
    origin: page-own

  - id: p1-const-muB
    kind: fact
    where: 'Problem 1(d), statement: μ_B = 5.788e-5 eV/T (CODATA 2018: 5.7883818060e-5 eV/T)'
    expected: '5.788e-5'
    shown: ['$\mu_B = 5.788 \times 10^{-5}$ eV/T (CODATA 2018)']
    source: {cite: codata, at: 'Bohr magneton in eV/T'}
    origin: page-own

  - id: p1-const-eF
    kind: fact
    where: 'Problem 1(d), statement: ε_F = 3.24 eV, our value (close to the free-electron value for sodium)'
    expected: '3.24'
    shown: ['Take $\epsilon_F = 3.24$ eV (our value']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

