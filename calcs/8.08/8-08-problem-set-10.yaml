  # ---- Problem 3: a cloud of fermionic atoms in a harmonic trap

  - id: p3-dos
    kind: identity
    answer: p3-dos
    where: 'Problem 3(a), answer box: D(ε), against slicing the pyramid of levels: at fixed n_x the states with n_y + n_z between s − n_x and s − n_x + ds number (s − n_x) ds, integrated over n_x numerically'
    formula: |-
      eps**2/(2*(hbar*w)**3)
    equals: |-
      integrate('(eps - u)/(hbar*w)**3', 'u', 0, eps)
    samples:
      eps: [1.0, 10.0, 4.0]
      hbar: [0.5, 1.5, 1.0]
      w: [0.5, 2.0, 1.0]
    tolerance: 1e-8
    shown: ['id="p3-dos"', '<Formula label="Density of states in a harmonic trap"']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-ef
    kind: identity
    answer: p3-ef
    where: 'Problem 3(b), answer box: ε_F, against the root of ∫₀^ε_F D dε = N solved numerically'
    formula: |-
      (6*N)**(1/3)*hbar*w
    equals: |-
      solve("integrate('u**2/(2*(hbar*w)**3)', 'u', 0, x) - N", 'x', 0, 100*N*hbar*w)
    samples:
      N: [10, 1000, 100]
      hbar: [0.5, 1.5, 1.0]
      w: [0.5, 2.0, 1.0]
    tolerance: 1e-6
    shown: ['id="p3-ef"', '<Formula label="Fermi energy in a harmonic trap"']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-e0
    kind: identity
    answer: p3-e0
    where: 'Problem 3(c), answer box: E_0, against the numerical integral of ε D(ε) up to ε_F, with (ħω)³ = ε_F³/6N'
    formula: |-
      3/4*N*eF
    equals: |-
      integrate('u**3/2', 'u', 0, eF)*6*N/eF**3
    samples:
      N: [10, 1000, 100]
      eF: [1.0, 5.0, 2.0]
    tolerance: 1e-8
    shown: ['id="p3-e0"', '<Formula label="Energy of the trapped cloud at zero temperature"']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

