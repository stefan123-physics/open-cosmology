  - id: p3-tf
    answer: p3-tf
    where: 'Problem 3(d), answer box: T_F = (6N)^(1/3) ħω/k_B for N = 1e6, ω = 2π × 100 s⁻¹, in nK'
    inputs: {omega: 628.3185307179586 1/s}
    formula: |-
