    where: 'Problem 2(b), answer box: T*, against the root of C_el − C_ph = (π²/2)T/T_F − (12π⁴/5)(T/T_D)³ (per atom, in units of k_B) solved numerically'
    formula: |-
      sqrt(5*TD**3/(24*pi**2*TF))
    equals: |-
      solve("pi**2/2*x/TF - 12*pi**4/5*(x/TD)**3", 'x', 1e-3, TD)
    samples:
      TD: [50, 500, 91, 300]
