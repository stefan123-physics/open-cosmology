# Calculations on content/year-4/8.08/8-08-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT's sheet gives only textbook numbers, so every problem is our own, and MIT publishes no solutions. Every answer is
# checked here by a route independent of the page: the g functions are integrals of the Bose distribution over the
# density of states (never the printed 2.612 and 1.341); Problem 1 takes U/N and P/n as ratios of those integrals and
# the entropy as the integral of C_V/T; Problem 2 integrates the two-dimensional Bose distribution numerically; Problem 3
# integrates the Debye function numerically and keeps the next order of its expansion; Problem 4 integrates the energy
# of the sound quanta over k numerically and takes C_V as a numerical derivative.
# Constants: k_B, hbar from calcs/constants.yaml; u = 1.66053906660e-27 kg (CODATA 2018).
# Choice boxes have no entries: their reasons are in the solutions.

page: content/year-4/8.08/8-08-problem-set-7.mdx
calcs:
  # ---- How to answer and notation

  - id: points-total
    where: 'How to answer: our points, 20 + 15 + 20 + 15'
    formula: |-
      20 + 15 + 20 + 15
    expected: '70'
    shown: ['and 15 for Problem 4, 70 points in all']
    source: {cite: mit, at: 'Problems 1 to 4, p. 1 (points are ours)'}
    origin: page-own

  - id: g32
    where: 'Notation: g_3/2(1) = (2/√π) ∫ √x/(eˣ − 1) dx'
    inputs: {}
    formula: |-
      2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)
    expected: '2.612'
    shown: ['with $g_{3/2}(1) = 2.612$']
    source: {cite: reading1, at: 'p. 56'}
    origin: mit

  - id: g52
    where: 'Notation: g_5/2(1) = (4/(3√π)) ∫ x^(3/2)/(eˣ − 1) dx'
    inputs: {}
    formula: |-
      4/(3*sqrt(pi))*integrate('x**1.5/(exp(x) - 1)', 'x', 1e-12, 80)
    expected: '1.341'
    shown: ['and $g_{5/2}(1) = 1.341$']
    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  - id: amu
    kind: fact
    where: 'Notation: the atomic mass unit (CODATA 2018, rounded)'
    value: '1.6605e-27'
    shown: ['$1$ u $= 1.6605 \times 10^{-27}$ kg']
    source: {cite: mit, at: 'CODATA 2018 value, rounded (our addition)'}
    origin: page-own

  # ---- Problem 1: rubidium gas

  - id: p1-m
    where: 'Problem 1(a): the mass of a rubidium-87 atom, 86.909 u'
    inputs: {}
    formula: |-
      86.909*1.66053906660e-27
    expected: '1.443e-25'
    shown: ['$m = 86.909 \times 1.6605 \times 10^{-27}$ kg $= 1.443 \times 10^{-25}$ kg']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-coef
    where: 'Problem 1(a): 2πħ²/(m k_B) for rubidium-87'
    inputs: {m: 1.443155e-25 kg}
    formula: |-
      2*pi*hbar**2/(m*k_B)
    expected: 3.507e-20 K*m**2
    shown: ['$2\pi\hbar^2/(mk_B) = 3.507 \times 10^{-20}$ K m²']
    source: {cite: reading1, at: 'p. 57'}
    origin: page-own

  - id: p1-dens
    where: 'Problem 1(a): (n/g_3/2(1))^(2/3) for n = 1.0e20 m^-3'
    inputs: {n: 1.0e20 1/m**3}
    formula: |-
      (n/(2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)))**(2/3)
    expected: 1.136e13 1/m**2
    shown: ['$(n/2.612)^{2/3} = 1.136 \times 10^{13}$ m⁻²']
    source: {cite: reading1, at: 'p. 57'}
    origin: page-own

  - id: p1-tc
    answer: p1-tc
    where: 'Problem 1(a), answer box: T_c for rubidium-87 at n = 1.0e20 m^-3, from n λ³ = g_3/2(1) with g_3/2(1) as an integral'
    inputs: {m: 1.443155e-25 kg, n: 1.0e20 1/m**3}
    formula: |-
      2*pi*hbar**2/(m*k_B)*(n/(2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)))**(2/3)
    expected: 398 nK
    shown: ['id="p1-tc"', '$T_c = 3.98 \times 10^{-7}$ K $= 398$ nK']
    source: {cite: reading1, at: 'p. 57'}
    origin: page-own

  - id: p1-lam
    where: 'Problem 1(a), check: λ at T_c, (g_3/2(1)/n)^(1/3)'
    inputs: {n: 1.0e20 1/m**3}
    formula: |-
      (2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)/n)**(1/3)
    expected: 0.297 um
    shown: ['$\lambda = (2.612/n)^{1/3} = 0.297$ μm']
    source: {cite: reading1, at: 'p. 57'}
    origin: page-own

  - id: p1-spacing
    where: 'Problem 1(a), check: the spacing n^(-1/3)'
    inputs: {n: 1.0e20 1/m**3}
    formula: |-
      n**(-1/3)
    expected: 0.215 um
    shown: ['$n^{-1/3} = 0.215$ μm']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-sodium
    where: 'Problem 1(a), check: the notes'' example, sodium (22.99 u) at n = 1e14 cm^-3'
    inputs: {m: 3.81758e-26 kg, n: 1e14 1/cm**3}
    formula: |-
      2*pi*hbar**2/(m*k_B)*(n/(2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)))**(2/3)
    expected: 1.5 uK
    shown: ['condenses near $1.5$ μK']
    source: {cite: reading1, at: 'p. 61'}
    origin: mit

  - id: p1-u
    answer: p1-u
    where: 'Problem 1(b), answer box: U/(N k_B T) at z = 1, as the ratio of ∫ε D(ε) dε/(e^(βε) − 1) to k_BT ∫D(ε) dε/(e^(βε) − 1) with D ∝ √ε'
    inputs: {}
    formula: |-
      integrate('x**1.5/(exp(x) - 1)', 'x', 1e-12, 80)/integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)
    expected: '0.770'
    shown: ['id="p1-u"', '= 0.770\,k_BT_c$']
    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  - id: p1-p
    answer: p1-p
    where: 'Problem 1(c), answer box: P/(n k_B T) = (2/3) U/(N k_B T) at z = 1, from the same two integrals'
    inputs: {}
    formula: |-
      2/3*integrate('x**1.5/(exp(x) - 1)', 'x', 1e-12, 80)/integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)
    expected: '0.514'
    shown: ['id="p1-p"', '= 1.341/2.612 = 0.514$']
    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  - id: p1-pa
    answer: p1-pa
    where: 'Problem 1(c), answer box: P = (P/n k_B T) n k_B T_c'
    inputs: {m: 1.443155e-25 kg, n: 1.0e20 1/m**3}
    formula: |-
      2/3*integrate('x**1.5/(exp(x) - 1)', 'x', 1e-12, 80)/integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)*n*k_B*2*pi*hbar**2/(m*k_B)*(n/(2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)))**(2/3)
    expected: 2.82e-10 Pa
    shown: ['id="p1-pa"', 'Pa $= 2.82 \times 10^{-10}$ Pa.']
    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  - id: p1-nkt
    where: 'Problem 1(c), check: n k_B T_c of a classical gas'
    inputs: {m: 1.443155e-25 kg, n: 1.0e20 1/m**3}
    formula: |-
      n*k_B*2*pi*hbar**2/(m*k_B)*(n/(2/sqrt(pi)*integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)))**(2/3)
    expected: 5.50e-10 Pa
    shown: ['$nk_BT_c = 5.50 \times 10^{-10}$ Pa']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-s
    kind: identity
    answer: p1-s
    where: 'Problem 1(d), answer box: S(T)/S(T_c) below T_c, against the integral of C_V/T from 0 with C_V ∝ T^(3/2) (notes p. 60)'
    formula: |-
      (T/Tc)**(3/2)
    equals: |-
      integrate('w**1.5/w', 'w', 1e-12, T)/integrate('w**1.5/w', 'w', 1e-12, Tc)
    samples:
      T: [0.2, 0.5, 0.9, 0.3, 0.7]
      Tc: [1.0, 1.5, 2.0, 1.2, 1.8]
    tolerance: 1e-6
    shown: ['id="p1-s"', '<Formula label="Entropy of the condensed Bose gas"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-s-per
    where: 'Problem 1(d), check: S/(N k_B) at T_c = (5/3) U/(N k_B T_c)'
    inputs: {}
    formula: |-
      5/3*integrate('x**1.5/(exp(x) - 1)', 'x', 1e-12, 80)/integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 80)
    expected: '1.28'
    shown: ['$S/(Nk_B) = \frac52 \times 1.341/2.612 = 1.28$', 'the same entropy, $1.28\,k_B$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-iso-before
    where: 'Problem 1(e): N₀/N at T = 0.5 T_c'
    inputs: {}
    formula: |-
      1 - 0.5**1.5
    expected: '0.65'
    shown: ['$1 - 0.5^{3/2} = 0.65$']
    source: {cite: reading1, at: 'p. 58'}
    origin: page-own

  - id: p1-iso-after
    where: 'Problem 1(e): N₀/N at T = 0.5 T_c after halving the volume (density doubled, excited density unchanged)'
    inputs: {}
    formula: |-
      1 - 0.5**1.5/2
    expected: '0.82'
    shown: ['$1 - 0.5^{3/2}/2 = 0.82$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: bosons on a surface

  - id: p2-z
    kind: identity
    answer: p2-z
    where: 'Problem 2(a), answer box: z = 1 − e^(−nλ²), against the numerical integral ∫dx/(z⁻¹eˣ − 1), which must give nλ²'
    formula: |-
      1 - exp(-n*lam**2)
    equals: |-
      1 - exp(-integrate('1/(exp(x)/(1 - exp(-n*lam**2)) - 1)', 'x', 1e-12, 80))
    samples:
      n: [0.5, 1.0, 2.0, 0.8, 1.5]
      lam: [0.5, 1.0, 1.5, 1.2, 0.7]
    tolerance: 1e-6
    shown: ['id="p2-z"', '<Formula label="Density of a Bose gas on a surface"']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-1mz
    where: 'Problem 2(c): 1 − z = e^(−4)'
    inputs: {}
    formula: |-
      exp(-4)
    expected: '0.01832'
    shown: ['$1 - z = e^{-4} = 0.01832$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-zval
    where: 'Problem 2(c): z = 1 − e^(−4)'
    inputs: {}
    formula: |-
      1 - exp(-4)
    expected: '0.98168'
    shown: ['so $z = 0.98168$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-mu
    answer: p2-mu
    where: 'Problem 2(c), answer box: μ/k_BT = ln z, with z found by solving the numerical integral = 4 for y = βμ'
    inputs: {}
    formula: |-
      solve("integrate('1/(exp(x - y) - 1)', 'x', 1e-12, 80) - 4", 'y', -0.1, -0.001)
    expected: '-0.01849'
    shown: ['id="p2-mu"', '$\mu/k_BT = \ln 0.98168 = -0.01849$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-n0
    where: 'Problem 2(c), check: z/(1 − z) for z = 1 − e^(−4)'
    inputs: {}
    formula: |-
      (1 - exp(-4))/exp(-4)
    expected: '53.6'
    shown: ['$z/(1 - z) = e^4 - 1 = 53.6$']
    source: {cite: reading1, at: 'p. 58'}
    origin: page-own

  # ---- Problem 3: Debye solid at high temperature

  - id: p3-u
    kind: identity
    answer: p3-u
    where: 'Problem 3(a), answer box: U/N ≈ 3k_BT − (9/8)k_BT_D, against 3k_BT 𝒟(T_D/T) integrated numerically, less the next term (3/20)k_BT_D²/T'
    formula: |-
      3*kB*T - 9*kB*TD/8
    equals: |-
      3*kB*T*3/(TD/T)**3*integrate('t**3/(exp(t) - 1)', 't', 1e-12, TD/T) - 3/20*kB*TD**2/T
    samples:
      kB: [0.5, 1.0, 1.5, 0.8, 1.2]
      T: [5, 10, 7, 6, 9]
      TD: [1, 2, 1.5, 1.2, 1.8]
    tolerance: 1e-4
    shown: ['id="p3-u"', '<Formula label="Energy per atom at high temperature"']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-c
    kind: identity
    answer: p3-c
    where: 'Problem 3(b), answer box: C_V/(3Nk_B) ≈ 1 − u²/20, against the exact Debye heat capacity (3/u³)∫t⁴eᵗ/(eᵗ − 1)² dt integrated numerically, less the next term u⁴/560'
    formula: |-
      1 - TD**2/(20*T**2)
    equals: |-
      3/(TD/T)**3*integrate('t**4*exp(t)/(exp(t) - 1)**2', 't', 1e-12, TD/T) - (TD/T)**4/560
    samples:
      TD: [1, 2, 1.5, 1.2, 1.8]
      T: [5, 10, 7, 6, 9]
    tolerance: 1e-5
    shown: ['id="p3-c"', '<Formula label="Heat capacity of a warm Debye solid"']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-approx-1
    where: 'Problem 3(b), check: 1 − 1/20 at T = T_D'
    inputs: {}
    formula: |-
      1 - 1/20
    expected: '0.950'
    shown: ['At $T = T_D$ this gives $0.950$']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-exact-1
    where: 'Problem 3(b), check: the exact Debye heat capacity at u = 1'
    inputs: {}
    formula: |-
      3*integrate('t**4*exp(t)/(exp(t) - 1)**2', 't', 1e-12, 1)
    expected: '0.952'
    shown: ['at $u = 1$, is $0.952$']
    source: {cite: reading1, at: 'p. 54'}
    origin: page-own

  - id: p3-t99
    answer: p3-t99
    where: 'Problem 3(c), answer box: T/T_D where the correction u²/20 is 0.01 (root found numerically)'
    inputs: {}
    formula: |-
      solve('1 - 1/(20*w**2) - 0.99', 'w', 1, 5)
    expected: '2.236'
    shown: ['id="p3-t99"', '$T/T_D = \sqrt5 = 2.236$']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-exact-t99
    where: 'Problem 3(c), check: the exact Debye heat capacity at T = √5 T_D'
    inputs: {}
    formula: |-
      3/(1/sqrt(5))**3*integrate('t**4*exp(t)/(exp(t) - 1)**2', 't', 1e-12, 1/sqrt(5))
    expected: '0.9901'
    shown: ['is $0.9901 \times 3Nk_B$']
    source: {cite: reading1, at: 'p. 54'}
    origin: page-own

  - id: p3-5pct
    where: 'Problem 3(c), check: at T = T_D the exact C_V falls short of 3Nk_B by about 5 per cent'
    inputs: {}
    formula: |-
      100*(1 - 3*integrate('t**4*exp(t)/(exp(t) - 1)**2', 't', 1e-12, 1))
    expected: '5'
    shown: ['within about 5 per cent of $3Nk_B$']
    source: {cite: reading1, at: 'p. 54'}
    origin: page-own

  - id: p3-zp
    kind: identity
    where: 'Problem 3(d): the zero-point energy ∫D(ε) ε/2 dε with D = 9Nε²/ε_max³, integrated numerically'
    formula: |-
      9/8*N*em
    equals: |-
      integrate('9*N*w**2/em**3*w/2', 'w', 0, em)
    samples:
      N: [1, 10, 100, 7, 50]
      em: [0.5, 1.0, 2.0, 1.5, 0.8]
    tolerance: 1e-6
    shown: ['<Formula label="Zero-point energy of a Debye solid"']
    source: {cite: reading1, at: 'p. 54'}
    origin: page-own

  - id: p3-d1
    where: 'Problem 3(d): U at T_D, 3 N k_B T_D 𝒟(1), in units of N k_B T_D'
    inputs: {}
    formula: |-
      3*3*integrate('t**3/(exp(t) - 1)', 't', 1e-12, 1)
    expected: '2.02'
    shown: ['$3Nk_BT_D\,\mathcal D(1) = 2.02\,Nk_BT_D$']
    source: {cite: reading1, at: 'p. 54'}
    origin: page-own

  # ---- Problem 4: liquid helium

  - id: p4-n
    where: 'Problem 4, statement: n = ρ/m for ρ = 0.145 g/cm³ and m = 4.0026 u'
    inputs: {rho: 0.145 g/cm**3, m: 6.64651e-27 kg}
    formula: |-
      rho/m
    expected: 2.18e28 1/m**3
    shown: ['so $n = 2.18 \times 10^{28}$ atoms per m³']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-u
    kind: identity
    answer: p4-u
    where: 'Problem 4(a), answer box: U/V of one polarisation of sound quanta, against ∫d³k/(2π)³ ħvk/(e^(βħvk) − 1) integrated numerically over k'
    formula: |-
      pi**2*(kB*T)**4/(30*(hbar*v)**3)
    equals: |-
      integrate('4*pi/(2*pi)**3*q**2*hbar*v*q/(exp(hbar*v*q/(kB*T)) - 1)', 'q', 1e-12*kB*T/(hbar*v), 80*kB*T/(hbar*v))
    samples:
      kB: [0.5, 1.0, 1.5, 0.8, 1.2]
      T: [0.5, 2.0, 1.0, 1.3, 0.7]
      hbar: [0.5, 1.0, 1.5, 0.7, 1.2]
      v: [0.5, 2.0, 1.0, 1.5, 0.8]
    tolerance: 1e-6
    shown: ['id="p4-u"', '<Formula label="Energy of the sound quanta of a liquid"']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own solution)'}
    origin: page-own

  - id: p4-kt
    where: 'Problem 4(b): k_BT/ħv at 0.30 K and v = 238 m/s'
    inputs: {T: 0.30 K, v: 238 m/s}
    formula: |-
      k_B*T/(hbar*v)
    expected: 1.650e8 1/m
    shown: ['m⁻¹ $= 1.650 \times 10^8$ m⁻¹']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-kt3
    where: 'Problem 4(b): (k_BT/ħv)³'
    inputs: {T: 0.30 K, v: 238 m/s}
    formula: |-
      (k_B*T/(hbar*v))**3
    expected: 4.494e24 1/m**3
    shown: ['cubed, $4.494 \times 10^{24}$ m⁻³']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-2pi2
    where: 'Problem 4(b): 2π²/15'
    inputs: {}
    formula: |-
      2*pi**2/15
    expected: '1.316'
    shown: ['Times $2\pi^2/15 = 1.316$']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own solution)'}
    origin: page-own

  - id: p4-c
    answer: p4-c
    where: 'Problem 4(b), answer box: C_V/(N k_B) at 0.30 K, as the numerical T-derivative of the energy density (k-integral) divided by n k_B'
    inputs: {v: 238 m/s, n: 2.18165e28 1/m**3}
    formula: |-
      deriv('pi**2*w**4/30', 'w', 0.30)*(k_B*kelvin/(hbar*v))**3/n
