    origin: page-own

  - id: p4-spacing
    where: 'Problem 4(b), check: the spacing n^(-1/3)'
    inputs: {n: 2.18165e28 1/m**3}
    formula: |-
      n**(-1/3)
    expected: 0.36 nm
    shown: ['$n^{-1/3} = 0.36$ nm']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-m
    where: 'Problem 4(c): the mass of a helium-4 atom, 4.0026 u'
    inputs: {}
