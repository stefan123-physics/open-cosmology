    inputs: {T: 300 K, P: 101325 Pa}
    formula: |-
      P/(k_B*T)
    expected: 2.446e25 1/m**3
    shown: ['$n = P/k_BT = 101\,325/4.142 \times 10^{-21} = 2.446 \times 10^{25}$ m⁻³']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

  - id: p4-sigma
