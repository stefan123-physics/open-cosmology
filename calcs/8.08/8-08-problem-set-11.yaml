    inputs: {r: 0.20e-9 m}
    formula: |-
      4*pi*r**2
    expected: 5.027e-19 m**2
    shown: ['$\sigma = 4\pi(0.20 \times 10^{-9})^2 = 5.027 \times 10^{-19}$ m²']
    source: {cite: reading1, at: 'p. 93 (our own numbers)'}
