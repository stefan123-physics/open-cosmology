    shown: ['id="p4-lam"', 'm $= 8.13 \times 10^{-8}$ m $= 81.3$ nm']
    source: {cite: reading1, at: 'p. 93 (our own numbers)'}
    origin: page-own

  - id: p4-spacing
    where: 'Problem 4(a), check: spacing n^(-1/3) between atoms'
    inputs: {T: 300 K, P: 101325 Pa}
    formula: |-
      (P/(k_B*T))**(-1/3)
    expected: 3.44 nm
    shown: ['$n^{-1/3} = 3.44$ nm']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own numbers)'}
    origin: page-own

