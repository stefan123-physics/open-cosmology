  # ---- Problem 5: noise with a Gaussian correlation (setup ours)

  - id: p5-pf
    kind: identity
    answer: p5-pf
    where: 'Problem 5(a), answer box: P^F(omega), against the numerical Fourier integral of A exp(-t^2/tau^2) divided by pi'
    formula: |-
      A*tau/sqrt(pi)*exp(-omega**2*tau**2/4)
    equals: |-
      integrate('A*exp(-u**2/tau**2)*cos(omega*u)', 'u', -30, 30)/pi
    samples:
      A: [0.5, 2.0, 1.0, 1.4]
      tau: [0.5, 2.0, 1.0, 0.8]
      omega: [0.2, 2.0, 1.0, 1.5]
    tolerance: 1e-6
    shown: ['id="p5-pf"', '<Formula label="Power spectrum of the force"']
    source: {cite: mit, at: 'Problem 5(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p5-total
    kind: identity
    where: 'Problem 5(a), solution check: the integral of P^F over omega from 0 to infinity is A'
    formula: |-
      integrate('A*tau/sqrt(pi)*exp(-u**2*tau**2/4)', 'u', 0, 60/tau)
    equals: |-
      A
    samples:
      A: [0.5, 2.0, 1.0]
      tau: [0.5, 2.0, 1.0]
    tolerance: 1e-6
    shown: ['\cdot\frac{\sqrt\pi}{\tau} = A = \varphi(0)']
    source: {cite: mit, at: 'Problem 5(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p5-half
    answer: p5-half
    where: 'Problem 5(b), answer box: omega tau where exp(-omega^2 tau^2/4) = 1/2, solved numerically'
    formula: |-
      solve('exp(-x**2/4) - 0.5', 'x', 0.1, 5)
    expected: '1.665'
    shown: ['id="p5-half"', 'gives $\omega\tau = 2\sqrt{\ln 2} = 1.665$']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own problem)'}
    origin: page-own

  - id: p5-e4
    where: 'Problem 5(b), solution: e^(-4), about 0.02'
    formula: |-
      exp(-4)
    expected: '0.02'
    shown: ['by a factor $e^{-4} \approx 0.02$']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own problem)'}
    origin: page-own

  - id: p5-fric
    kind: identity
    answer: p5-fric
    where: 'Problem 5(c), answer box: m gamma for gamma tau << 1, against the numerical integral of the notes'' friction formula at gamma = 0'
    formula: |-
      sqrt(pi)*A*tau/(2*kB*T)
    equals: |-
      integrate('A*exp(-u**2/tau**2)', 'u', 0, 30)/(kB*T)
    samples:
      A: [0.5, 2.0, 1.0]
      tau: [0.5, 2.0, 1.0]
      kB: [0.5, 1.5, 1.0]
      T: [0.5, 2.0, 1.2]
    tolerance: 1e-6
    shown: ['id="p5-fric"', '<Formula label="Friction for a short correlation time"']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own problem and solution)'}
    origin: page-own

  - id: p5-exact-ratio
    where: 'Problem 5(c), solution check: at gamma tau = 0.1 the exact integral of exp(-s^2/tau^2 - gamma s) is 5.4% smaller than sqrt(pi) tau/2 (tau = 1), numerically'
    formula: |-
      100*(1 - integrate('exp(-u**2 - 0.1*u)', 'u', 0, 30)/(sqrt(pi)/2))
    expected: '5.4'
    shown: ['at $\gamma\tau = 0.1$ it is 5.4% smaller']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own solution)'}
    origin: page-own

  - id: p5-exact-erfc
    kind: identity
    where: 'Problem 5(c), solution check: the closed form (sqrt(pi)/2) tau e^(gamma^2 tau^2/4) erfc(gamma tau/2), against the numerical integral'
    formula: |-
      sqrt(pi)/2*tau*exp(g**2*tau**2/4)*erfc(g*tau/2)
    equals: |-
      integrate('exp(-u**2/tau**2 - g*u)', 'u', 0, 40)
    samples:
      tau: [0.5, 1.0, 2.0]
      g: [0.1, 1.0, 0.5]
    tolerance: 1e-6
    shown: ['= \frac{\sqrt\pi}{2}\,\tau\,e^{\gamma^2\tau^2/4}\operatorname{erfc}(\gamma\tau/2)$']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own solution)'}
    origin: page-own

  - id: p5-pv
    kind: identity
    answer: p5-pv
    where: 'Problem 5(d), answer box: P^v(omega), against K(omega)/(pi m^2 (gamma^2 + omega^2)) with K(omega) the numerical Fourier integral of A exp(-t^2/tau^2) and A fixed by the numerical integral of the friction formula at gamma tau -> 0'
    formula: |-
      2*kB*T*gamma*exp(-omega**2*tau**2/4)/(pi*m*(gamma**2 + omega**2))
    equals: |-
      kB*T*m*gamma/integrate('exp(-u**2/tau**2)', 'u', 0, 30)*integrate('exp(-u**2/tau**2)*cos(omega*u)', 'u', -30, 30)/(pi*m**2*(gamma**2 + omega**2))
    samples:
      kB: [0.5, 1.5, 1.0]
      T: [0.5, 2.0, 1.1]
      m: [0.5, 2.0, 1.0]
      gamma: [0.5, 2.0, 1.0]
      tau: [0.3, 1.0, 0.6]
      omega: [0.5, 3.0, 1.2]
    tolerance: 1e-6
    shown: ['id="p5-pv"', '<Formula label="Power spectrum of the velocity"']
    source: {cite: mit, at: 'Problem 5(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p5-equipartition
    kind: identity
    where: 'Problem 5(e): with the exact friction, the integral of P^v over omega from 0 to infinity is k_B T/m for any tau (numerical double route: the omega integral of K/(pi m^2 (gamma^2 + omega^2)) with K in closed form, and A fixed by the exact friction integral)'
    formula: |-
      kB*T*m*gamma/integrate('exp(-u**2/tau**2 - gamma*u)', 'u', 0, 40)*sqrt(pi)*tau*integrate('exp(-w**2*tau**2/4)/(gamma**2 + w**2)', 'w', 0, 200)/(pi*m**2)
    equals: |-
      kB*T/m
    samples:
      kB: [1.0, 0.7]
      T: [1.0, 1.5]
      m: [1.0, 2.0]
      gamma: [0.5, 2.0]
      tau: [0.3, 1.5]
    tolerance: 1e-5
    shown: ['so $\int_0^\infty P^v\,d\omega = k_BT/m = \langle v^2\rangle$']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own problem and solution)'}
    origin: page-own

  - id: p5-approx-total
    kind: identity
    where: 'Problem 5(e), solution check: with the approximate friction the total is (k_B T/m) e^(gamma^2 tau^2/4) erfc(gamma tau/2), against the numerical omega integral'
    formula: |-
      kB*T/m*exp(gamma**2*tau**2/4)*erfc(gamma*tau/2)
    equals: |-
      integrate('2*kB*T*gamma*exp(-w**2*tau**2/4)/(pi*m*(gamma**2 + w**2))', 'w', 0, 200)
    samples:
      kB: [1.0, 0.7]
      T: [1.0, 1.5]
      m: [1.0, 2.0]
      gamma: [0.5, 2.0]
      tau: [0.3, 1.5]
    tolerance: 1e-5
    shown: ['the total comes out as $(k_BT/m)\,e^{\gamma^2\tau^2/4}\operatorname{erfc}(\gamma\tau/2)$']
    source: {cite: mit, at: 'Problem 5, p. 1 (our own solution)'}
    origin: page-own
