# Calculations on content/year-4/8.08/8-08-problem-set-12.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page
# where one exists: Problem 1 checks K and the Lorenz number against the unsimplified kinetic formula with an
# independent Fermi speed (which must cancel), and the heat capacity against the derivative of the Sommerfeld energy;
# Problems 2 to 4
# recompute the estimates from the inputs with full-precision constants (the route is the one the page states);
# Problem 5 takes the power spectra from numerical Fourier integrals of the Gaussian correlation function, and the
# friction from the numerical integral of the notes' friction formula.
# Problem 1 (our own): aluminium 2.65e-8 Ohm m at 293 K, measured 237 W/(m K), Lorenz numbers about 2.3e-8 (our values).
# Inputs given on MIT's sheet: silicon 2.3 g/cm^3, 2200 m/s, 1.5 W/(cm K) at 300 K; copper 8.9 g/cm^3,
# 1.7e-6 Ohm cm; air at 300 K and 1 atm, a ball of radius 0.1 mm, a drift of 1 mm. Our values: atomic masses
# (Si 28.0855 u, Cu 63.546 u, air 28.97 u), the molecular diameter of air 0.37 nm, the measured viscosity of air.
# Constants: k_B and hbar from calcs/constants.yaml; e, m_e and the atomic mass unit (CODATA 2018) as inputs.
# Choice boxes: none.

page: content/year-4/8.08/8-08-problem-set-12.mdx
calcs:
  # ---- How to answer

  - id: points-total
    where: 'How to answer: our points, 15 + 15 + 15 + 20 + 20'
    formula: |-
      15 + 15 + 15 + 20 + 20
    expected: '85'
    shown: ['and 20 each for Problems 4 and 5, 85 points in all']
    source: {cite: mit, at: 'Problems 1 to 5, p. 1 (points are ours)'}
    origin: page-own

  # ---- Problem 1: heat carried by the electrons of a metal (our own problem)

  - id: p1-k
    kind: identity
    answer: p1-k
    where: 'Problem 1(a), answer box: K of the electrons, against (1/3) n vF (vF tau) c_v with c_v = (pi^2/2) kB (kB T/eF) and eF = m vF^2/2 evaluated at an independent vF (which must cancel)'
    formula: |-
      pi**2*n*tau*kB**2*T/(3*m)
    equals: |-
      1/3*n*vF*(vF*tau)*(pi**2/2)*kB*(kB*T/(m*vF**2/2))
    samples:
      n: [1, 10, 3.0, 7.0]
      tau: [0.5, 2.0, 1.0, 1.3]
      kB: [0.5, 1.5, 1.0, 0.8]
      T: [0.5, 2.0, 1.0, 1.7]
      m: [0.5, 2.0, 1.0, 1.4]
      vF: [3.0, 0.7, 10.0, 1.9]
    tolerance: 1e-9
    shown: ['id="p1-k"', '<Formula label="Thermal conductivity of the electrons"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem and solution)'}
    origin: page-own

  - id: p1-cv
    kind: identity
    where: 'Problem 1, statement: the electronic heat capacity per electron (pi^2/2) kB (kB T/eF), against the numerical derivative with respect to T of the Sommerfeld energy per electron (3/5) eF + (pi^2/4) (kB T)^2/eF'
    formula: |-
      pi**2/2*kB*(kB*T/eF)
    equals: |-
      deriv('3/5*eF + pi**2/4*(kB*x)**2/eF', 'x', T)
    samples:
      kB: [1.0, 0.5, 1.5]
      T: [0.02, 0.05, 0.1]
      eF: [1.0, 2.0, 1.5]
    tolerance: 1e-6
    shown: ['<Formula label="Heat capacity per electron"']
    source: {cite: reading2, at: 'p. 87'}
    origin: mit

  - id: p1-l
    kind: identity
    answer: p1-l
    where: 'Problem 1(b), answer box: L = K/(sigma T), against the ratio of the two independent forms (1/3) n vF^2 tau c_v and e^2 n tau T/m at sample values of n, tau, m and vF (which must cancel)'
    formula: |-
      pi**2*kB**2/(3*e**2)
    equals: |-
      (1/3*n*vF**2*tau*(pi**2/2)*kB*(kB*T/(m*vF**2/2)))/(e**2*n*tau/m*T)
    samples:
      kB: [0.5, 1.5, 1.0]
      e: [0.5, 1.5, 1.2]
      n: [2.0, 5.0, 9.0]
      tau: [0.7, 1.9, 1.0]
      m: [0.6, 1.8, 1.0]
      vF: [2.0, 0.9, 5.0]
      T: [0.3, 1.0, 2.0]
    tolerance: 1e-9
    shown: ['id="p1-l"', '<Formula label="Lorenz number of the free-electron model"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-kbe
    where: 'Problem 1(c), solution: k_B/e in V/K'
    inputs: {e_ch: 1.602176634e-19 C}
    formula: |-
      k_B/e_ch
    expected: 8.617e-5 V/K
    shown: ['$k_B/e = 8.617 \times 10^{-5}$ V/K']
    source: {cite: codata, at: 'k_B, elementary charge'}
    origin: page-own

  - id: p1-kbe2
    where: 'Problem 1(c), solution: (k_B/e)^2 in V^2/K^2'
    inputs: {e_ch: 1.602176634e-19 C}
    formula: |-
      (k_B/e_ch)**2
    expected: 7.426e-9 V**2/K**2
    shown: ['$(k_B/e)^2 = 7.426 \times 10^{-9}$ V²/K²']
    source: {cite: codata, at: 'k_B, elementary charge'}
    origin: page-own

  - id: p1-pi23
    where: 'Problem 1(c), solution: pi^2/3'
    formula: |-
      pi**2/3
    expected: '3.290'
    shown: ['$L = 3.290 \times 7.426']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lnum
    answer: p1-lnum
    where: 'Problem 1(c), answer box: L = (pi^2/3)(k_B/e)^2 in units of 1e-8 W Ohm/K^2'
    inputs: {e_ch: 1.602176634e-19 C}
    formula: |-
      pi**2/3*(k_B/e_ch)**2/(1e-8*watt*ohm/kelvin**2)
    expected: '2.44'
    shown: ['id="p1-lnum"', '= 2.44 \times 10^{-8}$ W Ω/K²']
    source: {cite: codata, at: 'k_B, elementary charge (our own solution)'}
    origin: page-own

  - id: p1-lnum-half
    where: 'Problem 1(c), listed mistake of the box: with the notes'' 1/6, (pi^2/6)(k_B/e)^2 in units of 1e-8 W Ohm/K^2'
    inputs: {e_ch: 1.602176634e-19 C}
    formula: |-
      pi**2/6*(k_B/e_ch)**2/(1e-8*watt*ohm/kelvin**2)
    expected: '1.22'
    shown: ['calc: "p1-lnum-half"']
    source: {cite: reading1, at: 'p. 104 (our own check)'}
    origin: page-own

  - id: p1-lhalf
    where: 'Problem 1(c), solution check: with the notes'' 1/6, (pi^2/6)(k_B/e)^2 in W Ohm/K^2'
    inputs: {e_ch: 1.602176634e-19 C}
    formula: |-
      pi**2/6*(k_B/e_ch)**2
    expected: 1.22e-8 W*ohm/K**2
    shown: ['it would be half, $1.22 \times 10^{-8}$ W Ω/K²']
    source: {cite: reading1, at: 'p. 104 (our own check)'}
    origin: page-own

  - id: p1-lmeasured
    kind: fact
    where: 'Problem 1(c), solution check: measured Lorenz numbers of copper, silver and gold near room temperature, about 2.3e-8 W Ohm/K^2 (our values)'
    value: '2.3e-8 W Ohm/K^2'
    shown: ['are all about 2.3 in these units (our values)']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own values)'}
    origin: page-own

  - id: p1-al
    answer: p1-al
    where: 'Problem 1(d), answer box: K = L T/rho for aluminium, rho = 2.65e-8 Ohm m at 293 K, with L = (pi^2/3)(k_B/e)^2, in W/(m K)'
    inputs: {e_ch: 1.602176634e-19 C, rho: 2.65e-8 ohm*meter}
    formula: |-
      pi**2/3*(k_B/e_ch)**2*293*kelvin/rho/(watt/(meter*kelvin))
    expected: '270'
    shown: ['id="p1-al"', 'W/(m K) $= 270$ W/(m K)']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-al-rho
    kind: fact
    where: 'Problem 1(d): resistivity of aluminium at 293 K (our value)'
    value: '2.65e-8 Ohm m'
    shown: ['Aluminium has a resistivity of $2.65 \times 10^{-8}$ Ω m at 293 K (our value)']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own value)'}
    origin: page-own

  - id: p1-al-measured
    kind: fact
    where: 'Problem 1(d), solution check: measured thermal conductivity of aluminium near room temperature (our value)'
    value: '237 W/(m K)'
    shown: ['The measured value is about 237 W/(m K) (our value)']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own value)'}
    origin: page-own

  - id: p1-al-14
    where: 'Problem 1(d), solution check: the estimate is 14% above the measured 237 W/(m K)'
    inputs: {e_ch: 1.602176634e-19 C, rho: 2.65e-8 ohm*meter}
    formula: |-
      100*(pi**2/3*(k_B/e_ch)**2*293*kelvin/rho/(237*watt/(meter*kelvin)) - 1)
    expected: '14'
    tolerance: '1'
    shown: ['the estimate is 14% above it']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own check)'}
    origin: page-own

  - id: p1-al-half
    where: 'Problem 1(d), solution check: with the notes'' 1/6, (pi^2/6)(k_B/e)^2 T/rho, in W/(m K)'
    inputs: {e_ch: 1.602176634e-19 C, rho: 2.65e-8 ohm*meter}
    formula: |-
      pi**2/6*(k_B/e_ch)**2*293*kelvin/rho
    expected: 135 W/(m*K)
    shown: ['the estimate would be 135 W/(m K)']
    source: {cite: reading1, at: 'p. 104 (our own check)'}
    origin: page-own

  - id: p1-al-ratio
    where: 'Problem 1(d), solution check: 237 over that estimate, 1.75'
    inputs: {e_ch: 1.602176634e-19 C, rho: 2.65e-8 ohm*meter}
    formula: |-
      237*watt/(meter*kelvin)/(pi**2/6*(k_B/e_ch)**2*293*kelvin/rho)
    expected: '1.75'
    shown: ['1.75 times too small']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own check)'}
    origin: page-own

  # ---- Problem 2: phonons in silicon

  - id: p2-na
    where: 'Problem 2(a), solution: atoms of silicon per m^3 from 2.3 g/cm^3 and 28.0855 u'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton}
    formula: |-
      rho_m/m_Si
    expected: 4.93e28 m**-3
    shown: ['m⁻³ $= 4.93 \times 10^{28}$ m⁻³']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-c
    answer: p2-c
    where: 'Problem 2(a), answer box: C = 3 n_a k_B, in units of 1e6 J/(m^3 K)'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton}
    formula: |-
      3*rho_m/m_Si*k_B/(1e6*joule/(meter**3*kelvin))
    expected: '2.04'
    shown: ['id="p2-c"', 'J/(m³ K) $= 2.04 \times 10^6$ J/(m³ K)']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-debye
    where: 'Problem 2(a), solution check: Debye temperature hbar c_s (6 pi^2 n_a)^(1/3)/k_B with MIT''s c_s = 2200 m/s'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton, c_s: 2200 m/s}
    formula: |-
      hbar*c_s*(6*pi**2*rho_m/m_Si)**(1/3)/k_B
    expected: 240 K
    shown: ['$\hbar c_s(6\pi^2n_a)^{1/3}/k_B$ is 240 K']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own check)'}
    origin: page-own

  - id: p2-dulong
    where: 'Problem 2(a), solution check: 3 N_A k_B per mole'
    inputs: {N_A: 6.02214076e23 mol**-1}
    formula: |-
      3*N_A*k_B
    expected: 24.9 J/(mol*K)
    shown: ['$3N_Ak_B = 24.9$ J/(mol K)']
    source: {cite: codata, at: 'Avogadro constant, k_B'}
    origin: page-own

  - id: p2-lam
    answer: p2-lam
    where: 'Problem 2(b), answer box: phonon mean free path 6K/(C c_s), in nm'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton, c_s: 2200 m/s, K_th: 1.5 W/(cm*kelvin)}
    formula: |-
      6*K_th/(3*rho_m/m_Si*k_B*c_s)/nanometer
    expected: '200'
    shown: ['id="p2-lam"', '\ \text{m} = 2.0 \times 10^{-7}\ \text{m}']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-spacing
    where: 'Problem 2(b), solution check: atomic spacing n_a^(-1/3), in nm'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton}
    formula: |-
      (rho_m/m_Si)**(-1/3)
    expected: 0.27 nanometer
    shown: ['$n_a^{-1/3} = 0.27$ nm']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own check)'}
    origin: page-own

  - id: p2-ratio
    where: 'Problem 2(b), solution check: mean free path over atomic spacing, some 730'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton, c_s: 2200 m/s, K_th: 1.5 W/(cm*kelvin)}
    formula: |-
      6*K_th/(3*rho_m/m_Si*k_B*c_s)/(rho_m/m_Si)**(-1/3)
    expected: '730'
    tolerance: '1%'
    shown: ['That is some 730 times the spacing between atoms']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own check)'}
    origin: page-own

  - id: p2-third
    where: 'Problem 2(b), solution check: the K = (1/3) C v lambda route gives 100 nm'
    inputs: {rho_m: 2.3 g/cm**3, m_Si: 28.0855 dalton, c_s: 2200 m/s, K_th: 1.5 W/(cm*kelvin)}
    formula: |-
      3*K_th/(3*rho_m/m_Si*k_B*c_s)
    expected: 100 nanometer
    shown: ['that route gives half, 100 nm']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own check)'}
    origin: page-own

  # ---- Problem 3: electrons in copper

  - id: p3-n
    answer: p3-n
    where: 'Problem 3(a), answer box: conduction electrons per m^3 (one per atom), in units of 1e28 m^-3'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton}
    formula: |-
      rho_m/m_Cu/(1e28*meter**-3)
    expected: '8.43'
    shown: ['id="p3-n"', 'm⁻³ $= 8.43 \times 10^{28}$ m⁻³']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-tau
    answer: p3-tau
    where: 'Problem 3(b), answer box: Drude relaxation time m/(rho e^2 n), in units of 1e-14 s'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, rho: 1.7e-6 ohm*cm, e_ch: 1.602176634e-19 C, m_e: 9.1093837015e-31 kg}
    formula: |-
      m_e/(rho*e_ch**2*rho_m/m_Cu)/(1e-14*second)
    expected: '2.47'
    shown: ['id="p3-tau"', '\ \text{s} = 2.47 \times 10^{-14}\ \text{s}']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-kf
    where: 'Problem 3(c), solution: k_F = (3 pi^2 n)^(1/3)'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton}
    formula: |-
      (3*pi**2*rho_m/m_Cu)**(1/3)
    expected: 1.36e10 m**-1
    shown: ['m⁻¹ $= 1.36 \times 10^{10}$ m⁻¹']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-vf
    where: 'Problem 3(c), solution: v_F = hbar k_F/m'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, m_e: 9.1093837015e-31 kg}
    formula: |-
      hbar*(3*pi**2*rho_m/m_Cu)**(1/3)/m_e
    expected: 1.57e6 m/s
    shown: ['$v_F = \hbar k_F/m = 1.57 \times 10^6$ m/s']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-ef
    where: 'Problem 3(c), solution: Fermi energy hbar^2 k_F^2/2m in eV'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, m_e: 9.1093837015e-31 kg}
    formula: |-
      hbar**2*(3*pi**2*rho_m/m_Cu)**(2/3)/(2*m_e)
    expected: 7.0 eV
    shown: ['(a Fermi energy of 7.0 eV)']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-lam
    answer: p3-lam
    where: 'Problem 3(c), answer box: mean free path v_F tau, in nm'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, rho: 1.7e-6 ohm*cm, e_ch: 1.602176634e-19 C, m_e: 9.1093837015e-31 kg}
    formula: |-
      hbar*(3*pi**2*rho_m/m_Cu)**(1/3)/m_e*m_e/(rho*e_ch**2*rho_m/m_Cu)/nanometer
    expected: '38.9'
    shown: ['id="p3-lam"', '$\lambda = v_F\tau = 1.57 \times 10^6 \times 2.47 \times 10^{-14}$ m $= 3.89 \times 10^{-8}$ m']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-spacing
    where: 'Problem 3(c), solution check: spacing n^(-1/3) in nm'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton}
    formula: |-
      (rho_m/m_Cu)**(-1/3)
    expected: 0.23 nanometer
    shown: ['$n^{-1/3} = 0.23$ nm']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own check)'}
    origin: page-own

  - id: p3-ratio
    where: 'Problem 3(c), solution check: mean free path over spacing, about 170'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, rho: 1.7e-6 ohm*cm, e_ch: 1.602176634e-19 C, m_e: 9.1093837015e-31 kg}
    formula: |-
      hbar*(3*pi**2*rho_m/m_Cu)**(1/3)/(rho*e_ch**2*rho_m/m_Cu)/(rho_m/m_Cu)**(-1/3)
    expected: '170'
    tolerance: '1%'
    shown: ['That is about 170 times the spacing between atoms']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own check)'}
    origin: page-own

  - id: p3-vth
    where: 'Problem 3(c), solution check: classical thermal speed sqrt(3 k_B T/m) at 300 K'
    inputs: {m_e: 9.1093837015e-31 kg}
    formula: |-
      sqrt(3*k_B*300*kelvin/m_e)
    expected: 1.2e5 m/s
    shown: ['$\sqrt{3k_BT/m} = 1.2 \times 10^5$ m/s at 300 K']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own check)'}
    origin: page-own

  - id: p3-lam-classical
    where: 'Problem 3(c), solution check: the classical path sqrt(3 k_B T/m) tau, in nm'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, rho: 1.7e-6 ohm*cm, e_ch: 1.602176634e-19 C, m_e: 9.1093837015e-31 kg}
    formula: |-
      sqrt(3*k_B*300*kelvin/m_e)*m_e/(rho*e_ch**2*rho_m/m_Cu)
    expected: 2.9 nanometer
    shown: ['which gives a path of only 2.9 nm']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own check)'}
    origin: page-own

  - id: p3-thirteen
    where: 'Problem 3(c), solution check: v_F over the classical speed, thirteen'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, m_e: 9.1093837015e-31 kg}
    formula: |-
      hbar*(3*pi**2*rho_m/m_Cu)**(1/3)/m_e/sqrt(3*k_B*300*kelvin/m_e)
    expected: '13'
    tolerance: '5%'
    shown: ['thirteen times shorter']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own check)'}
    origin: page-own

  - id: p3-lam-wen
    where: 'Problem 3(c), solution check: the path with the notes'' rough speed sqrt(eF/m) = vF/sqrt 2, in nm'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, rho: 1.7e-6 ohm*cm, e_ch: 1.602176634e-19 C, m_e: 9.1093837015e-31 kg}
    formula: |-
      sqrt((hbar**2*(3*pi**2*rho_m/m_Cu)**(2/3)/(2*m_e))/m_e)*m_e/(rho*e_ch**2*rho_m/m_Cu)
    expected: 27.5 nanometer
    shown: ['is $v_F/\sqrt2$ and gives 27.5 nm']
    source: {cite: reading1, at: 'p. 106 (our own check)'}
    origin: page-own

  - id: p3-lam-n13
    where: 'Problem 3(c), solution check: the path with the speed hbar n^(1/3)/m, in nm'
    inputs: {rho_m: 8.9 g/cm**3, m_Cu: 63.546 dalton, rho: 1.7e-6 ohm*cm, e_ch: 1.602176634e-19 C, m_e: 9.1093837015e-31 kg}
    formula: |-
      hbar*(rho_m/m_Cu)**(1/3)/m_e*m_e/(rho*e_ch**2*rho_m/m_Cu)
    expected: 12.6 nanometer
    shown: ['$\hbar n^{1/3}/m$ gives 12.6 nm']
    source: {cite: reading1, at: 'p. 106 (our own check)'}
    origin: page-own

  # ---- Problem 4: air and a small ball

  - id: p4-n
    where: 'Problem 4(a), solution: n = P/k_B T at 1 atm and 300 K'
    inputs: {P: 101325 pascal}
    formula: |-
      P/(k_B*300*kelvin)
    expected: 2.45e25 m**-3
    shown: ['m⁻³ $= 2.45 \times 10^{25}$ m⁻³']
    source: {cite: mit, at: 'Problem 4, p. 1 (our own solution)'}
    origin: page-own

