  # ---------------------------------------------------------------- Ising chain (p. 35)
  - id: wall-cost
    kind: identity
    where: 'text: flipping one bond from aligned (-J) to opposite (+J) costs 2J'
    formula: (+JJ) - (-JJ)
    equals: 2*JJ
    samples: {JJ: [0.5, 1.0]}
    tolerance: 1e-12
    shown: ['Each costs $2J$, since one bond goes from $-J$ to $+J$']
    source: {cite: reading1, at: 'p. 35, point 4d'}
    origin: mit

  - id: wall-exact
    kind: identity
    where: 'our check: the probability that a link is a wall, e^(-bJ)/(e^(bJ) + e^(-bJ)), equals 1/(1 + e^(2bJ))'
