# Calculations on content/year-4/8.07/separation-of-variables-spherical.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.07 (Fall 2012) Lecture Notes 6, "Separation of Variables in Spherical Coordinates" (Guth, handwritten
# notes for Lecture 11, October 1, 2012), circled pages 1-7. The radial solutions come from Lecture Notes 9, eq. (9.31).
# The notes quote no numbers. Page's own example: a thin spherical shell of radius a = 10 cm held at V0 cos^2(theta),
# V0 = 60 V; inside V = V0/3 + V0 (r/a)^2 (cos^2 - 1/3), outside V = (V0/3)(a/r) + V0 (a/r)^3 (cos^2 - 1/3).

page: content/year-4/8.07/separation-of-variables-spherical.mdx
calcs:
  # ---------------------------------------------------------------- symmetric and traceless (pp. 3-4)
  - id: trace-removed
    kind: identity
    where: 'formula "Removing the trace": the trace of C - (lambda/3) delta is lambda - (lambda/3)*3 = 0 (checked as that plus 1 equals 1)'
    formula: (LL - LL/3*3) + 1
    equals: 1
    samples: {LL: [1.0, -2.5, 9.0]}
    tolerance: 1e-12
    shown: ['since $\delta_{ii} = 3$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: trace-becomes-constant
    kind: identity
    where: 'formula "The trace becomes a constant": for a diagonal C with entries c1, c2, c3 and trace lambda, sum c_k n_k^2 = sum (c_k - lambda/3) n_k^2 + lambda/3, with n the unit vector at angles (th, ph)'
    formula: c1*(sin(th)*cos(ph))**2 + c2*(sin(th)*sin(ph))**2 + c3*cos(th)**2
    equals: (c1 - (c1+c2+c3)/3)*(sin(th)*cos(ph))**2 + (c2 - (c1+c2+c3)/3)*(sin(th)*sin(ph))**2 + (c3 - (c1+c2+c3)/3)*cos(th)**2 + (c1+c2+c3)/3
    samples: {c1: [1.0, 0.3, -2.0], c2: [2.0, 1.5, 0.7], c3: [6.0, -0.4, 1.1], th: [0.4, 1.2, 2.5], ph: [0.3, 2.0, 4.0]}
    tolerance: 1e-12
    shown: ['The constant $\lambda/3$ can be added to $C^{(0)}$.']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: quiz-trace
    kind: value
    where: 'quiz 3: diagonal coefficients 1, 2, 6; trace 9; the constant added to C(0) is 9/3'
    inputs: {c1: 1, c2: 2, c3: 6}
    formula: (c1 + c2 + c3)/3
    expected: '3'
    shown: ['The trace is $\\lambda = 1 + 2 + 6 = 9$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  # ---------------------------------------------------------------- every term harmonic (pp. 5-6)
  - id: laplacian-quadratic
    kind: identity
    where: 'formula "The Laplacian of the quadratic term": for a diagonal C, the Laplacian of c1 x^2 + c2 y^2 + c3 z^2 is 2 (c1 + c2 + c3), twice the trace (zero when traceless)'
    formula: deriv('c1*t**2', 't', xx, 2) + deriv('c2*t**2', 't', yy, 2) + deriv('c3*t**2', 't', zz, 2)
    equals: 2*(c1 + c2 + c3)
    samples: {c1: [1.0, -1.0, 0.5], c2: [2.0, -1.0, 0.5], c3: [-3.0, 2.0, 4.0], xx: [0.3, 1.0, -0.7], yy: [0.5, -0.2, 1.1], zz: [1.2, 0.4, 0.9]}
    tolerance: 1e-5
    shown: ['The two terms in the bracket give the same result']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  # ---------------------------------------------------------------- the eigenvalues (p. 7)
  - id: radial-part
    kind: identity
    where: 'formula "The radial part": (1/r^2) d/dr (r^2 d(r^l)/dr) = l (l + 1) r^(l - 2) (numerical derivative of l r^2 r^(l-1))'
    formula: deriv('s**2 * LL * s**(LL - 1)', 's', rr)/rr**2
    equals: LL*(LL + 1)*rr**(LL - 2)
    samples: {LL: [1, 2, 3, 5], rr: [0.7, 1.3, 2.0, 0.9]}
    tolerance: 1e-6
    shown: ['The radial part is a short calculation:']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: quiz-l3
    kind: value
    where: 'quiz 1: the eigenvalue -l(l + 1) for l = 3'
    inputs: {LL: 3}
    formula: -LL*(LL + 1)
    expected: '-12'
    shown: ['With $\\ell = 3$ the eigenvalue is $-3 \\times 4 = -12$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  # ---------------------------------------------------------------- radial solutions (notes 9)
  - id: radial-roots
    kind: identity
    where: 'section "The radial solutions": p = l and p = -(l + 1) both satisfy p (p + 1) = l (l + 1) (checked as p(p+1) - l(l+1) + 1 = 1 for the second root)'
    formula: (-(LL + 1))*(-(LL + 1) + 1) - LL*(LL + 1) + 1
    equals: 1
    samples: {LL: [0, 1, 2, 7]}
    tolerance: 1e-12
    shown: ['a quadratic with the roots']
    source: {cite: notes9, at: 'eqs. (9.29)-(9.31), pp. 6-7'}
    origin: mit

  - id: radial-second-solution
    kind: identity
    where: 'formula "The radial solutions": R = r^-(l+1) satisfies d/dr (r^2 dR/dr) = l (l + 1) R (numerical derivative of r^2 * (-(l+1)) r^(-l-2))'
    formula: deriv('s**2 * (-(LL + 1)) * s**(-LL - 2)', 's', rr)
    equals: LL*(LL + 1)*rr**(-LL - 1)
    samples: {LL: [0, 1, 2, 4], rr: [0.7, 1.3, 2.0, 0.9]}
    tolerance: 1e-6
    shown: ['Inside a sphere the potential must be finite at the centre']
    source: {cite: notes9, at: 'eq. (9.31), p. 7'}
    origin: mit

  # ---------------------------------------------------------------- worked example (page's own)
  - id: example-direct-step1
    kind: identity
    where: 'worked example, step "Check the eigenvalue directly": sin(th) d(cos^2 th)/d th = -2 cos th sin^2 th'
    formula: sin(th)*deriv('cos(t)**2', 't', th)
    equals: -2*cos(th)*sin(th)**2
    samples: {th: [0.3, 1.0, 2.2]}
    tolerance: 1e-6
    shown: ['For $f = \cos^2\theta$ (no $\phi$ dependence)']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: example-direct-step2
    kind: identity
    where: 'worked example: (1/sin th) d/d th (-2 cos th sin^2 th) = 2 sin^2 - 4 cos^2 = 2 - 6 cos^2 = -6 (cos^2 - 1/3)'
    formula: deriv('-2*cos(t)*sin(t)**2', 't', th)/sin(th)
    equals: -6*(cos(th)**2 - 1/3)
    samples: {th: [0.3, 1.0, 2.2]}
    tolerance: 1e-6
    shown: ['as the boxed formula says for $\ell = 2$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-polynomial-harmonic
    kind: identity
    where: 'worked example, step "Inside and outside": the Laplacian of 2 z^2 - x^2 - y^2 is 4 - 2 - 2 = 0 (checked as that plus 1)'
    formula: deriv('-t**2', 't', xx, 2) + deriv('-t**2', 't', yy, 2) + deriv('2*t**2', 't', zz, 2) + 1
    equals: 1
    samples: {xx: [0.3, 1.0], yy: [0.5, -0.2], zz: [1.2, 0.4]}
    tolerance: 1e-5
    shown: ['plainly a constant times $4 - 2 - 2 = 0$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: example-cartesian-form
    kind: identity
    where: 'worked example: (r/a)^2 (cos^2 th - 1/3) = (2 z^2 - x^2 - y^2)/(3 a^2) with z = r cos th, x^2 + y^2 = r^2 sin^2 th'
    formula: (rr/aa)**2*(cos(th)**2 - 1/3)
    equals: (2*(rr*cos(th))**2 - (rr*sin(th))**2)/(3*aa**2)
    samples: {rr: [0.05, 0.08, 0.02], aa: [0.1, 0.1, 0.3], th: [0.3, 1.2, 2.6]}
    tolerance: 1e-12
    shown: ['With $r\cos\theta = z$ this is']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-match-at-a
    kind: identity
    where: 'worked example: inside and outside solutions both equal V0 cos^2 th at r = a'
    formula: VV/3*(aa/aa) + VV*(aa/aa)**3*(cos(th)**2 - 1/3)
    equals: VV*cos(th)**2
    samples: {VV: [60.0, 1.0], aa: [0.1, 2.0], th: [0.4, 1.9]}
    tolerance: 1e-12
    shown: ['Both agree with the boundary value at $r = a$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-centre
    kind: value
    where: 'worked example, step "Numbers": potential at the centre, V0/3'
    inputs: {VV: 60}
    formula: VV/3
    expected: '20'
    shown: ['At the centre the potential is 20 V']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-axis-5cm
    kind: value
    where: 'worked example: on the axis at r = 5 cm, 20 + 60 (1/4)(2/3)'
    inputs: {VV: 60, rr: 5, aa: 10, c2: 1}
    formula: VV/3 + VV*(rr/aa)**2*(c2 - 1/3)
    expected: '30'
    shown: ['on the axis ($\cos^2\theta = 1$) the potential is $20 + 60 \times \frac{1}{4} \times \frac{2}{3} = 30$ V']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-equator-5cm
    kind: value
    where: 'worked example: in the equatorial plane at r = 5 cm, 20 - 60 (1/4)(1/3)'
    inputs: {VV: 60, rr: 5, aa: 10, c2: 0}
    formula: VV/3 + VV*(rr/aa)**2*(c2 - 1/3)
    expected: '15'
    shown: ['$20 - 60 \times \frac{1}{4} \times \frac{1}{3} = 15$ V']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-axis-20cm
    kind: value
    where: 'worked example: on the axis at r = 20 cm, 20 (1/2) + 60 (1/8)(2/3)'
    inputs: {VV: 60, rr: 20, aa: 10, c2: 1}
    formula: VV/3*(aa/rr) + VV*(aa/rr)**3*(c2 - 1/3)
    expected: '15'
    shown: ['on the axis $10 + 5 = 15$ V']
    source: {cite: notes9, at: 'eq. (9.31), p. 7'}
    origin: page-own

  - id: example-equator-20cm
    kind: value
    where: 'worked example: in the equatorial plane at r = 20 cm, 10 - 60 (1/8)(1/3)'
    inputs: {VV: 60, rr: 20, aa: 10, c2: 0}
    formula: VV/3*(aa/rr) + VV*(aa/rr)**3*(c2 - 1/3)
    expected: '7.5'
    shown: ['in the equatorial plane $10 - 2.5 = 7.5$ V']
    source: {cite: notes9, at: 'eq. (9.31), p. 7'}
    origin: page-own

  - id: example-charge
    kind: value
    where: 'worked example: the l = 0 part outside is the potential of Q = 4 pi eps0 a V0/3 (in nC), a = 0.10 m, V0 = 60 V'
    inputs: {aa: 0.10, VV: 60}
    formula: 4*pi*8.8541878128e-12*aa*VV/3 * 1e9
    expected: '0.22'
    shown: ['about 0.22 nC']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: plot-poles
    kind: value
    where: 'plot caption: inside potential at r = a on the axis, 20 + 40'
    inputs: {VV: 60, rr: 10, aa: 10, c2: 1}
    formula: VV/3 + VV*(rr/aa)**2*(c2 - 1/3)
    expected: '60'
    shown: ['to 60 V at the poles and 0 V on the equator']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: plot-equator
    kind: value
    where: 'plot caption: inside potential at r = a on the equator, 20 - 20'
    inputs: {VV: 60, rr: 10, aa: 10, c2: 0}
    formula: VV/3 + VV*(rr/aa)**2*(c2 - 1/3) + 1
    expected: '1'
    shown: ['from the 20 V of the centre']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
