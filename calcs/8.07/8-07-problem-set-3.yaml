# Calculations on content/year-4/8.07/8-07-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 adds the potentials of the three charges at a point of the sphere and differentiates the image potential
# numerically (the page uses Coulomb's law); Problem 2 solves the zero-potential conditions at the top and at the rim
# of the bulge, checks the four charges on the sphere, and differentiates the image potential; Problem 3 solves for
# the image from the nearest and farthest points of the cylinder, integrates the field in from infinity for the
# voltage and differentiates the energy for the force; Problem 4 does the integrals numerically; Problem 5 takes
# numerical second derivatives, does the Fourier integrals numerically and sums the series (the page uses symmetry).
# Constants: eps0 = 8.8541878128e-12 F/m (CODATA 2018); the page's rounded 8.988e9, 1.7975e10 and 1.1127e-10 are checked against it.

page: content/year-4/8.07/8-07-problem-set-3.mdx
calcs:
  # ---- Introduction

  - id: points-mit
    where: 'How to answer: MIT''s points, 10 + 15 + 15 + 20 + 15'
    formula: |-
      10 + 15 + 15 + 20 + 15
    expected: '75'
    shown: ['75 points in all']
    source: {cite: mit, at: 'Problems 1 to 5, pp. 1–2'}
    origin: mit

  # ---- Problem 1: spheres and image charges (our own problem)

  - id: p1-v0
    kind: identity
    answer: p1-v0
    where: 'Problem 1(a), answer box: the potential at a point of the sphere (angle t from the direction of Q), added up from Q, the image −aQ/R at a²/R and the image +aQ/R at the centre'
    formula: |-
      Q/(4*pi*eps0*R)
    equals: |-
      Q/(4*pi*eps0*sqrt(a**2 + R**2 - 2*a*R*cos(t))) - (a*Q/R)/(4*pi*eps0*sqrt(a**2 + (a**2/R)**2 - 2*a*(a**2/R)*cos(t))) + (a*Q/R)/(4*pi*eps0*a)
    samples:
      Q: [0.5, 0.9, 1.3, 1.7, 2.0]
      eps0: [2.0, 1.6, 1.2, 0.8, 0.5]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      t: [0.0, 0.7, 1.5, 2.4, 3.1]
    tolerance: 1e-9
    shown: ['id="p1-v0"', '<Formula label="The potential of the uncharged sphere"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-force
    kind: identity
    answer: p1-force
    where: 'Problem 1(b), answer box: Q times the derivative, at the place of Q, of the potential of the two images (held fixed)'
    formula: |-
      Q**2*a**3*(2*R**2 - a**2)/(4*pi*eps0*R**3*(R**2 - a**2)**2)
    equals: |-
      Q*deriv('-(a*Q/R)/(4*pi*eps0*(s - a**2/R)) + (a*Q/R)/(4*pi*eps0*s)', 's', R)
    samples:
      Q: [0.5, 0.9, 1.3, 1.7, 2.0]
      eps0: [2.0, 1.6, 1.2, 0.8, 0.5]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
    tolerance: 1e-6
    shown: ['id="p1-force"', '<Formula label="The force on a charge near an uncharged conducting sphere"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-far
    where: 'Problem 1(b), check: for R = 100 a the force divided by 2Q²a³/(4πε₀R⁵), which is (2R² − a²)R²/(2(R² − a²)²)'
    formula: |-
      (2*100**2 - 1)*100**2/(2*(100**2 - 1)**2)
    expected: '1'
    tolerance: 0.001
    shown: ['the force tends to $2Q^2a^3/(4\pi\varepsilon_0R^5)$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-k
    where: 'Problem 1(c): 1/(4πε₀) from the CODATA value of ε₀, in units of 10⁹ N m²/C²'
    formula: |-
      1/(4*pi*8.8541878128e-12)/1e9
    expected: '8.988'
    shown: ['$1/(4\pi\varepsilon_0) = 8.988 \times 10^9\ \text{N m}^2/\text{C}^2$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-image
    where: 'Problem 1(c): the image charge aQ/R for a = 4.0 cm, R = 10 cm, Q = 6.0 nC, in nC'
    formula: |-
      4.0/10*6.0
    expected: '2.4'
    shown: ['-(4.0/10) \times 6.0\ \text{nC} = -2.4\ \text{nC}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-d
    where: 'Problem 1(c): the image distance a²/R, in cm'
    formula: |-
      4.0**2/10
    expected: '1.6'
    shown: ['$d = 4.0^2/10\ \text{cm} = 1.6\ \text{cm}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-gap
    where: 'Problem 1(c): the distance from the charge to the image, R − d, in cm'
    formula: |-
      10 - 1.6
    expected: '8.4'
    shown: ['so $8.4\ \text{cm}$ from the charge']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-fg
    answer: p1-fg
    where: 'Problem 1(c), answer box: the force for the grounded sphere from the closed form Q²aR/(4πε₀(R² − a²)²), in µN (the page uses Coulomb''s law with the image)'
    formula: |-
      (6.0e-9)**2*0.04*0.10/(4*pi*8.8541878128e-12*(0.10**2 - 0.04**2)**2)*1e6
    expected: '18.3'
    shown: ['id="p1-fg"', '0.084^2\ \text{N} = 18.3\ \text{µN}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-push
    where: 'Problem 1(c): the push of the central image, in µN'
    formula: |-
      8.988e9*6.0e-9*2.4e-9/0.10**2*1e6
    expected: '12.9'
    shown: ['0.10^2\ \text{N} = 12.9\ \text{µN}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-fn
    answer: p1-fn
    where: 'Problem 1(c), answer box: the force for the uncharged sphere from the formula of part (b), in µN (the page subtracts the two image forces)'
    formula: |-
      (6.0e-9)**2*0.04**3*(2*0.10**2 - 0.04**2)/(4*pi*8.8541878128e-12*0.10**3*(0.10**2 - 0.04**2)**2)*1e6
    expected: '5.40'
    shown: ['id="p1-fn"', '$18.3 - 12.9 = 5.40\ \text{µN}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-fn-difference
    where: 'Problem 1(c): the same force as the difference of the two image forces with unrounded values, in µN'
    formula: |-
      8.988e9*6.0e-9*2.4e-9*(1/0.084**2 - 1/0.10**2)*1e6
    expected: '5.40'
    shown: ['(with unrounded values)']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-geometry
    where: 'Problem 1(c), check: a³(2R² − a²)/(R³(R² − a²)²) for a = 0.04 m, R = 0.10 m, in 1/m²'
    formula: |-
      0.04**3*(2*0.10**2 - 0.04**2)/(0.10**3*(0.10**2 - 0.04**2)**2)
    expected: '16.69'
    shown: ['= 16.69\ \text{m}^{-2}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-triples
    where: 'Problem 1(c), check: the grounded force divided by the uncharged force'
    formula: |-
      0.10**4/(0.04**2*(2*0.10**2 - 0.04**2))
    expected: '3.4'
    shown: ['more than triples the pull']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-vnum
    answer: p1-vnum
    where: 'Problem 1(c), answer box: the potential at the nearest point of the sphere, added up from Q at 6 cm, the image −2.4 nC at 2.4 cm and the image +2.4 nC at 4 cm, in V (the page uses Q/(4πε₀R))'
    formula: |-
      (6.0e-9/0.06 - 2.4e-9/0.024 + 2.4e-9/0.04)/(4*pi*8.8541878128e-12)
    expected: '539'
    shown: ['id="p1-vnum"', '0.10\ \text{V} = 539\ \text{V}$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  # ---- Problem 2: a plane with a hemispherical bulge

  - id: p2-qimg
    kind: identity
    answer: p2-qimg
    where: 'Problem 2(a), answer box: the charge s at height a²/z₀ that cancels the potential of q at the top of the bulge, (0, 0, a), solved numerically'
    formula: |-
      -q*a/z0
    equals: |-
      solve('q/(z0 - a) + s/(a - a**2/z0)', 's', -10, 0)
    samples:
      q: [0.5, 0.9, 1.3, 1.7, 2.0]
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      z0: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-8
    shown: ['id="p2-qimg"', '- $-qa/z_0$ at $(0, 0, a^2/z_0)$,']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-zimg
    kind: identity
    answer: p2-zimg
    where: 'Problem 2(a), answer box: the height s at which the charge −qa/z₀ cancels the potential of q on the rim of the bulge, (a, 0, 0), solved numerically'
    formula: |-
      a**2/z0
    equals: |-
      solve('1/sqrt(a**2 + z0**2) - (a/z0)/sqrt(a**2 + s**2)', 's', 0.0001, a)
    samples:
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      z0: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-8
    shown: ['id="p2-zimg"', 'at $(0, 0, a^2/z_0)$. Since $z_0 > a$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-sphere-zero
    kind: identity
    where: 'Problem 2(a): the four charges give V = 0 at every point of the sphere r = a (angle t from the z axis; checked as V + 1 = 1, with q/(4πε₀) = 1)'
    formula: |-
      1/sqrt(a**2 + z0**2 - 2*a*z0*cos(t)) - 1/sqrt(a**2 + z0**2 + 2*a*z0*cos(t)) - (a/z0)/sqrt(a**2 + (a**2/z0)**2 - 2*a*(a**2/z0)*cos(t)) + (a/z0)/sqrt(a**2 + (a**2/z0)**2 + 2*a*(a**2/z0)*cos(t)) + 1
    equals: |-
      1
    samples:
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      z0: [1.5, 1.9, 2.3, 2.7, 3.0]
      t: [0.0, 0.4, 0.8, 1.2, 1.5]
    tolerance: 1e-10
    shown: ['Hence $V = 0$ on the whole plane and on the whole sphere']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-plane-zero
    kind: identity
    where: 'Problem 2(a): the four charges give V = 0 at every point of the plane z = 0 (distance x from the axis; checked as V + 1 = 1)'
    formula: |-
      1/sqrt(x**2 + z0**2) - 1/sqrt(x**2 + (-z0)**2) - (a/z0)/sqrt(x**2 + (a**2/z0)**2) + (a/z0)/sqrt(x**2 + (-a**2/z0)**2) + 1
    equals: |-
      1
    samples:
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      z0: [1.5, 1.9, 2.3, 2.7, 3.0]
      x: [1.0, 2.5, 0.9, 4.0, 1.7]
    tolerance: 1e-12
    shown: ['so each pair gives zero there']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-force
    kind: identity
    where: 'Problem 2(b): MIT''s eq. (2.2) in units of q²/(4πε₀), against the derivative along the axis, at z₀, of the potential of the three images'
    formula: |-
      1/(4*z0**2) + 4*a**3*z0**3/(z0**4 - a**4)**2
    equals: |-
      deriv('-1/(s + z0) - (a/z0)/(s - a**2/z0) + (a/z0)/(s + a**2/z0)', 's', z0)
    samples:
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      z0: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-6
    shown: ['<Formula label="The force on the charge above the bulge"']
    source: {cite: mit, at: 'Problem 2, eq. (2.2), p. 1'}
    origin: mit

  - id: p2-ratio
    answer: p2-ratio
    where: 'Problem 2(b), answer box: for z₀ = 2a (a = 1) the three Coulomb terms of the images, divided by the flat-plate term (the page uses the combined formula)'
    formula: |-
      (1/(2*2)**2 + (1/2)/(2 - 1/2)**2 - (1/2)/(2 + 1/2)**2)/(1/(2*2)**2)
    expected: '3.28'
    shown: ['id="p2-ratio"', '= 1 + 512/225 = 3.28$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  - id: p2-ratio-terms
    where: 'Problem 2(b): 16 a³z₀⁵/(z₀⁴ − a⁴)² for z₀ = 2a, as 16 × 32/15²; times 225'
    formula: |-
      16*2**5/(2**4 - 1)**2*225
    expected: '512'
    shown: ['$1 + 16 \times 32/15^2 = 1 + 512/225']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  - id: p2-close
    where: 'Problem 2(b), check: for z₀ = a + h with h = 0.001 a, the second term divided by 1/(2h)²'
    formula: |-
      4*1.001**3/(1.001**4 - 1)**2*(2*0.001)**2
    expected: '1'
    tolerance: 0.005
    shown: ['the second term tends to $4q^2a^6/(16a^6h^2) = q^2/(2h)^2$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-far
    kind: identity
    answer: p2-far
    where: 'Problem 2(c), answer box: the pull of the induced dipole p = 4πε₀a³E, with E = 2q/(4πε₀z₀²), on the charge q: 2qp/(4πε₀z₀³) (the page expands the exact formula)'
    formula: |-
      4*q**2*a**3/(4*pi*eps0*z0**5)
    equals: |-
      2*q*(4*pi*eps0*a**3*(2*q/(4*pi*eps0*z0**2)))/(4*pi*eps0*z0**3)
    samples:
      q: [0.5, 0.9, 1.3, 1.7, 2.0]
      a: [1.0, 0.6, 0.8, 0.5, 0.9]
      z0: [1.5, 1.9, 2.3, 2.7, 3.0]
      eps0: [2.0, 1.6, 1.2, 0.8, 0.5]
    tolerance: 1e-10
    shown: ['id="p2-far"', '<Formula label="The correction far from the bulge"']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  - id: p2-far-exact
    where: 'Problem 2(c): the exact second term for z₀ = 5a, in units of q²/(4πε₀a²)'
    formula: |-
      4*5**3/(5**4 - 1)**2
    expected: '0.001284'
    shown: ['the exact term is $0.001284\,q^2/(4\pi\varepsilon_0a^2)$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  - id: p2-far-leading
    where: 'Problem 2(c): the leading form for z₀ = 5a, in the same units'
    formula: |-
      4/5**5
    expected: '0.001280'
    shown: ['this leading form gives $0.001280$ in the same units']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  - id: p2-far-percent
    where: 'Problem 2(c): the difference between the two, in percent of the exact term'
    formula: |-
      (1 - (4/5**5)/(4*5**3/(5**4 - 1)**2))*100
    expected: '0.33'
    tolerance: 0.02
    shown: ['they agree to a third of a percent']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  - id: p2-dipole-images
    kind: identity
    where: 'Problem 2(c): the dipole moment of the two bulge images, (qa/z₀)(2a²/z₀), against 4πε₀a³E with E = 2q/(4πε₀z₀²)'
    formula: |-
      (q*a/z0)*(2*a**2/z0)
    equals: |-
      4*pi*eps0*a**3*2*q/(4*pi*eps0*z0**2)
    samples:
      q: [0.5, 0.9, 1.3]
      a: [1.0, 0.6, 0.8]
      z0: [1.5, 1.9, 2.3]
      eps0: [2.0, 1.6, 1.2]
    tolerance: 1e-12
    shown: ['have the moment $2qa^3/z_0^2$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own addition)'}
    origin: page-own

  # ---- Problem 3: a line charge and a conducting cylinder

  - id: p3-d
    kind: identity
    answer: p3-d
    where: 'Problem 3(a), answer box: the distance s of the image from the axis for which the ratio of the distances to the two lines is the same at the nearest and at the farthest point of the cylinder, solved numerically'
    formula: |-
      b**2/R
    equals: |-
      solve('(b - s)/(R - b) - (b + s)/(R + b)', 's', 0, b)
    samples:
      b: [1.0, 0.6, 0.8, 0.5, 0.9]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-8
    shown: ['id="p3-d"', 'Choose $d = b^2/R$.']
    source: {cite: mit, at: 'Problem 3(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p3-ratio
    kind: identity
    where: 'Problem 3(a): the ratio s₂/s₁ at a point of the surface at angle t is b/R'
    formula: |-
      sqrt(b**2 + (b**2/R)**2 - 2*b*(b**2/R)*cos(t))/sqrt(b**2 + R**2 - 2*b*R*cos(t))
    equals: |-
      b/R
    samples:
      b: [1.0, 0.6, 0.8, 0.5, 0.9]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
      t: [0.0, 0.7, 1.5, 2.4, 3.1]
    tolerance: 1e-12
    shown: ['so $s_2/s_1 = b/R$ at every point of the surface']
    source: {cite: mit, at: 'Problem 3(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p3-v0
    kind: identity
    answer: p3-v0
    where: 'Problem 3(b), answer box: the field of the two lines integrated from far away to the point of the cylinder farthest from the real line, along the line through both; with the distance from the axis written as 1/w the integral runs over w from 0 to 1/b'
    formula: |-
      -lam/(2*pi*eps0)*log(R/b)
    equals: |-
      integrate('lam/(2*pi*eps0)*(b**2/R - R)/((1 + R*w)*(1 + b**2/R*w))', 'w', 0, 1/b)
    samples:
      lam: [0.5, 0.9, 1.3, 1.7, 2.0]
      eps0: [2.0, 1.6, 1.2, 0.8, 0.5]
      b: [1.0, 0.6, 0.8, 0.5, 0.9]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-7
    shown: ['id="p3-v0"', '<Formula label="The potential of the cylinder"']
    source: {cite: mit, at: 'Problem 3(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p3-f
    kind: identity
    answer: p3-f
    where: 'Problem 3(c), answer box: the derivative with respect to R of the energy per unit length, (λ²/4πε₀) ln((R² − b²)/b) (the page uses the field of the image line)'
    formula: |-
      lam**2*R/(2*pi*eps0*(R**2 - b**2))
    equals: |-
      deriv('lam**2/(4*pi*eps0)*log((s**2 - b**2)/b)', 's', R)
    samples:
      lam: [0.5, 0.9, 1.3, 1.7, 2.0]
      eps0: [2.0, 1.6, 1.2, 0.8, 0.5]
      b: [1.0, 0.6, 0.8, 0.5, 0.9]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-6
    shown: ['id="p3-f"', 'it changes with $R$ as $(\lambda^2/4\pi\varepsilon_0)\ln(R^2 - b^2)$']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own addition)'}
    origin: page-own

  - id: p3-energy
    kind: identity
    where: 'Problem 3(c), check: the energy per unit length, ½λ times the potential of the image at the real line plus ½(−λ) times V₀, is (λ²/4πε₀) ln((R² − b²)/b) (with λ/(2πε₀) = 1, lengths in the same unit)'
    formula: |-
      0.5*log(R - b**2/R) - 0.5*log(b/R)
    equals: |-
      0.5*log((R**2 - b**2)/b)
    samples:
      b: [1.0, 0.6, 0.8, 0.5, 0.9]
      R: [1.5, 1.9, 2.3, 2.7, 3.0]
    tolerance: 1e-12
    shown: ['A second check uses the energy per unit length.']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own addition)'}
    origin: page-own

  - id: p3-const
    where: 'Problem 3(c): 1/(2πε₀) from the CODATA value of ε₀, in units of 10¹⁰ N m²/C²'
    formula: |-
      1/(2*pi*8.8541878128e-12)/1e10
    expected: '1.7975'
    shown: ['$1/(2\pi\varepsilon_0) = 1.7975 \times 10^{10}\ \text{N m}^2/\text{C}^2$']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own addition)'}
    origin: page-own

  - id: p3-scale
    where: 'Problem 3(c): λ/(2πε₀) for λ = 20 nC/m, in V'
    formula: |-
      1.7975e10*20e-9
    expected: '359.5'
    shown: ['\times 20 \times 10^{-9}\ \text{V} = 359.5\ \text{V}$']
