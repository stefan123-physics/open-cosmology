    formula: |-
      n**2/(2*n - 1)
    equals: |-
      integrate('n**2*w**(2*n - 2)', 'w', 0, 1)
    samples:
      n: [1.0, 1.5, 2.0, 3.0, 4.0]
    tolerance: 1e-7
    shown: ['id="p4-trial"', '<Formula label="The trial value for a power law outside a sphere"']
