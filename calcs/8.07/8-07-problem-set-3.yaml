  # ---- Problem 4: the capacitance of a single conductor

  - id: p4-sphere
    kind: identity
    answer: p4-sphere
    where: 'Problem 4(a), answer box: ε₀/V₀² times the integral of V₀²R²/r⁴ over the space outside the sphere, done numerically with r = 1/w (so 4πr² dr/r⁴ becomes 4π dw)'
    formula: |-
      4*pi*eps0*R
    equals: |-
      eps0*R**2*integrate('4*pi + 0*w', 'w', 0, 1/R)
    samples:
      eps0: [2.0, 1.6, 1.2, 0.8, 0.5]
      R: [0.5, 1.1, 1.7, 2.4, 3.0]
    tolerance: 1e-9
    shown: ['id="p4-sphere"', '<Formula label="The formula applied to a sphere"']
    source: {cite: mit, at: 'Problem 4(a), p. 2 (our own addition)'}
    origin: page-own

  - id: p4-trial
