  - id: plot-first-term
    where: 'plot caption: at x = 1 cm the first term alone exceeds the series by about 4% (per cent)'
    formula: 100*((1600/pi**2)*exp(-pi*sqrt(1/4 + 1)*1.0) - (1600/pi**2)*(exp(-pi*sqrt(1/4 + 1)*1.0)/1 - exp(-pi*sqrt(1/4 + 9)*1.0)/3 + exp(-pi*sqrt(1/4 + 25)*1.0)/5 - exp(-pi*sqrt(1/4 + 49)*1.0)/7 - exp(-pi*sqrt(9/4 + 1)*1.0)/3 + exp(-pi*sqrt(9/4 + 9)*1.0)/9 - exp(-pi*sqrt(9/4 + 25)*1.0)/15 + exp(-pi*sqrt(9/4 + 49)*1.0)/21 + exp(-pi*sqrt(25/4 + 1)*1.0)/5 - exp(-pi*sqrt(25/4 + 9)*1.0)/15 + exp(-pi*sqrt(25/4 + 25)*1.0)/25 - exp(-pi*sqrt(25/4 + 49)*1.0)/35 - exp(-pi*sqrt(49/4 + 1)*1.0)/7 + exp(-pi*sqrt(49/4 + 9)*1.0)/21 - exp(-pi*sqrt(49/4 + 25)*1.0)/35 + exp(-pi*sqrt(49/4 + 49)*1.0)/49))/((1600/pi**2)*(exp(-pi*sqrt(1/4 + 1)*1.0)/1 - exp(-pi*sqrt(1/4 + 9)*1.0)/3 + exp(-pi*sqrt(1/4 + 25)*1.0)/5 - exp(-pi*sqrt(1/4 + 49)*1.0)/7 - exp(-pi*sqrt(9/4 + 1)*1.0)/3 + exp(-pi*sqrt(9/4 + 9)*1.0)/9 - exp(-pi*sqrt(9/4 + 25)*1.0)/15 + exp(-pi*sqrt(9/4 + 49)*1.0)/21 + exp(-pi*sqrt(25/4 + 1)*1.0)/5 - exp(-pi*sqrt(25/4 + 9)*1.0)/15 + exp(-pi*sqrt(25/4 + 25)*1.0)/25 - exp(-pi*sqrt(25/4 + 49)*1.0)/35 - exp(-pi*sqrt(49/4 + 1)*1.0)/7 + exp(-pi*sqrt(49/4 + 9)*1.0)/21 - exp(-pi*sqrt(49/4 + 25)*1.0)/35 + exp(-pi*sqrt(49/4 + 49)*1.0)/49))
    expected: '4'
    shown: ['within about 4% of the series at x = 1 cm']
    source: {cite: griffiths, at: 'Example 3.5'}
    origin: page-own

  # ---------------------------------------------------------------- classification (p. 63-5) and quizzes
  - id: quiz-classify
    kind: identity
    where: 'quiz 2: A = 4, B = 4, C = 1 give B^2 - 4AC = 0 (checked as + 1)'
    formula: 4**2 - 4*4*1 + 1
    equals: 1
    samples: {kk: [1]}
    tolerance: 1e-12
    shown: ['$B^2 - 4AC = 16 - 16 = 0$']
    source: {cite: reading1, at: 'p. 63-5'}
    origin: page-own

  - id: quiz-decay-length
    where: 'quiz 3: 1/(pi sqrt(1/a^2 + 1/b^2)) for a = 2.0 cm, b = 1.0 cm, in cm'
    formula: 1/(pi*sqrt(1/2.0**2 + 1/1.0**2))
    expected: '0.285'
    quiz: 2
    shown: ['"About 0.285 cm"']
    source: {cite: griffiths, at: 'Example 3.5'}
    origin: page-own

  - id: quiz-rate
    where: 'quiz 3 explanation: pi sqrt(0.25 + 1) per cm'
    formula: pi*sqrt(0.25 + 1)
    expected: '3.51'
    shown: ['per cm $\\approx 3.51$ per cm']
    source: {cite: griffiths, at: 'Example 3.5'}
    origin: page-own

  - id: quiz-a-over-pi
    where: 'quiz 3 distractor: a/pi with a = 2.0 cm'
    formula: 2.0/pi
    expected: '0.637'
    shown: ['"About 0.637 cm"']
    source: {cite: griffiths, at: 'Example 3.5'}
    origin: page-own

  - id: quiz-b-over-pi
    where: 'quiz 3 distractor: b/pi with b = 1.0 cm'
    formula: 1.0/pi
    expected: '0.318'
    shown: ['"About 0.318 cm"']
    source: {cite: griffiths, at: 'Example 3.5'}
    origin: page-own

  - id: quiz-half
    where: 'quiz 3 distractor: half the right answer'
    formula: 0.5/(pi*sqrt(1/2.0**2 + 1/1.0**2))
    expected: '0.142'
    shown: ['"About 0.142 cm"']
    source: {cite: griffiths, at: 'Example 3.5'}
    origin: page-own
