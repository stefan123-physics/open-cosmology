# Calculations on content/year-4/8.07/8-07-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 counts the non-zero entries of the Levi-Civita symbol, computes the cross products component by
# component (the page uses the BAC-CAB rule) and takes the curl of the example field by numerical derivatives;
# Problem 2 computes the two cross products in a row and builds the acceleration from its components;
# Problem 3 rotates the answer forward again and differentiates the function written in the rotated coordinates;
# Problem 4 uses numerical derivatives of the temperature field and of the screened potential;
# Problem 5 uses the radial form of the Laplacian with numerical derivatives (the page uses Cartesian indices) and
# numerical integration over shells; Problem 6 integrates the volume element numerically; Problem 7 integrates
# over the hemisphere and round the circle (the page uses the closed surface and the area of the disk).

page: content/year-4/8.07/8-07-problem-set-1.mdx
calcs:
  # ---- Introduction

  - id: points-mit
    where: 'How to answer: MIT''s points, 20 + 10 + 15 + 10 + 20 + 10 + 15'
    formula: |-
      20 + 10 + 15 + 10 + 20 + 10 + 15
    expected: '100'
    shown: ['100 points in all']
    source: {cite: mit, at: 'Problems 1 to 7, pp. 1–4'}
    origin: mit

  # ---- Problem 1: the Levi-Civita symbol and the vector identities

  - id: p1-cases
    where: 'Problem 1(a): the number of sets of values of the four free indices, 3⁴'
    formula: |-
      3**4
    expected: '81'
    shown: ['$3^4 = 81$ sets of values']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own remark)'}
    origin: page-own

  - id: p1-full
    answer: p1-full
    where: 'Problem 1(a), answer box: ε_ijk ε_ijk counted directly: the six orders of 1, 2, 3 each contribute (±1)² (the page contracts the identity: 3·3 − 3)'
    formula: |-
      1**2 + 1**2 + 1**2 + (-1)**2 + (-1)**2 + (-1)**2
    expected: '6'
    shown: ['id="p1-full"', '= 2\,\delta_{kk} = 6$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own addition)'}
    origin: page-own

  - id: p1-full-contract
    where: 'Problem 1(a): the same number from the identity, δ_jj δ_kk − δ_jk δ_kj = 9 − 3'
    formula: |-
      3*3 - 3
    expected: '6'
    shown: ['= 2\,\delta_{kk} = 6$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own addition)'}
    origin: page-own

  - id: p1-two
    where: 'Problem 1(a), choice box: ε_ijk ε_ijm for k = m = 3: the terms (i, j) = (1, 2) and (2, 1) each give 1, so the factor in front of δ_km is 2'
    formula: |-
      1*1 + (-1)*(-1)
    expected: '2'
    shown: ['= 3\,\delta_{km} - \delta_{km} = 2\,\delta_{km}']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own addition)'}
    origin: page-own

  - id: p1-ac
    where: 'Problem 1(b): A · C for A = (1, 2, −1), C = (−2, 1, 4)'
    formula: |-
      1*(-2) + 2*1 + (-1)*4
    expected: '-4'
    shown: ['$\vec A\cdot\vec C = -2 + 2 - 4 = -4$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-ab
    where: 'Problem 1(b): A · B for A = (1, 2, −1), B = (3, 0, 2)'
    formula: |-
      1*3 + 2*0 + (-1)*2
    expected: '1'
    shown: ['$\vec A\cdot\vec B = 3 + 0 - 2 = 1$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-bx
    answer: p1-bx
    where: 'Problem 1(b), answer box: x component of A × (B × C), from the components of B × C (the page uses B(A·C) − C(A·B))'
    formula: |-
      2*(3*1 - 0*(-2)) - (-1)*(2*(-2) - 3*4)
    expected: '-10'
    shown: ['id="p1-bx"', '= 6 - 16 = -10$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-by
    where: 'Problem 1(b): y component of A × (B × C), directly'
    formula: |-
      (-1)*(0*4 - 2*1) - 1*(3*1 - 0*(-2))
    expected: '-1'
    shown: ['for which $\vec A\times(\vec B\times\vec C) = (-10, -1, -12)$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-bz
    where: 'Problem 1(b): z component of A × (B × C), directly'
    formula: |-
      1*(2*(-2) - 3*4) - 2*(0*4 - 2*1)
    expected: '-12'
    shown: ['for which $\vec A\times(\vec B\times\vec C) = (-10, -1, -12)$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-bx-rule
    where: 'Problem 1(b): x component from the rule, −4·3 − 1·(−2)'
    formula: |-
      -4*3 - 1*(-2)
    expected: '-10'
    shown: ['= -4\,(3, 0, 2) - (-2, 1, 4) = (-10, -1, -12)']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-perp
    where: 'Problem 1(b), check: the result is perpendicular to A'
    formula: |-
      1*(-10) + 2*(-1) + (-1)*(-12)
    expected: '0'
    shown: ['= -10 - 2 + 12 = 0$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-dx
    kind: identity
    answer: p1-dx
    where: 'Problem 1(d), answer box: x component of A × (∇ × A) for A = (−ky, kx, 0): A_y times the z component of the curl, the curl taken by numerical derivatives'
    formula: |-
      2*k**2*x
    equals: |-
      k*x*(deriv('k*s', 's', x) - deriv('-k*s', 's', 0.7))
    samples:
      k: [0.5, 0.9, 1.3, 1.7, 2.0]
      x: [2.0, 1.5, 1.1, 0.7, 0.3]
    tolerance: 1e-6
    shown: ['id="p1-dx"', '\left(2k^2x,\ 2k^2y,\ 0\right)']
    source: {cite: mit, at: 'Problem 1(d), p. 2 (our own example)'}
    origin: page-own

  - id: p1-dx-identity
    kind: identity
    where: 'Problem 1(d), check: the same component from the right side of the identity, ½ ∂_x(A²) − (A·∇)A_x, with A² = k²(x² + y²) and A_x = −ky'
    formula: |-
      2*k**2*x
    equals: |-
      0.5*deriv('k**2*(s**2 + y**2)', 's', x) - (-k*y*0 + k*x*deriv('-k*s', 's', y))
    samples:
      k: [0.5, 0.9, 1.3, 1.7, 2.0]
      x: [2.0, 1.5, 1.1, 0.7, 0.3]
      y: [0.4, 1.9, 0.8, 1.2, 1.6]
    tolerance: 1e-6
    shown: ['The difference is $(2k^2x, 2k^2y, 0)$']
    source: {cite: mit, at: 'Problem 1(d), p. 2 (our own example)'}
    origin: page-own

  # ---- Problem 2: triple cross products (our own problem)

  - id: p2-bc
    where: 'Problem 2(a): B · C for B = (3, 0, 2), C = (−2, 1, 4)'
    formula: |-
      3*(-2) + 0*1 + 2*4
    expected: '2'
    shown: ['$\vec B\cdot\vec C = -6 + 0 + 8 = 2$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-ax
    answer: p2-ax
    where: 'Problem 2(a), answer box: x component of (A × B) × C from the components of A × B = (4, −5, −6) (the page uses B(A·C) − A(B·C))'
    formula: |-
      (-1*3 - 1*2)*4 - (1*0 - 2*3)*1
    expected: '-14'
    shown: ['id="p2-ax"', '= (-14, -4, -6)']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-ay
    where: 'Problem 2(a): y component of (A × B) × C, directly'
    formula: |-
      (1*0 - 2*3)*(-2) - (2*2 - (-1)*0)*4
    expected: '-4'
    shown: ['= (-14, -4, -6)']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-az
    where: 'Problem 2(a): z component of (A × B) × C, directly'
    formula: |-
      (2*2 - (-1)*0)*1 - (-1*3 - 1*2)*(-2)
    expected: '-6'
    shown: ['= (-14, -4, -6)']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-ax-rule
    where: 'Problem 2(a): x component from the rule, −4·3 − 2·1'
    formula: |-
      -4*3 - 2*1
    expected: '-14'
    shown: ['= -4\,(3, 0, 2) - 2\,(1, 2, -1) = (-14, -4, -6)']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-perp
    where: 'Problem 2(a), check: the result is perpendicular to C'
    formula: |-
      (-14)*(-2) + (-4)*1 + (-6)*4
    expected: '0'
    shown: ['$(-14)(-2) + (-4)(1) + (-6)(4) = 0$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-diff-x
    where: 'Problem 2(b), check: x component of the difference of the two bracketings, and of A(B·C) − C(A·B)'
    formula: |-
      (-10 - (-14)) - (2*1 - 1*(-2))
    expected: '0'
    shown: ['$(-10, -1, -12) - (-14, -4, -6) = (4, 3, -6)$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-diff-z
    where: 'Problem 2(b), check: z component of the difference, −12 − (−6), against 2·(−1) − 1·4'
    formula: |-
      (-12 - (-6)) - (2*(-1) - 1*4)
    expected: '0'
    shown: ['= 2\,(1, 2, -1) - (-2, 1, 4) = (4, 3, -6)$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-acc
    kind: identity
    answer: p2-acc
    where: 'Problem 2(c), answer box: |ω × (ω × r)| built from components with ω along z and r = r(sin θ, 0, cos θ): first ω × r = (0, ω r sin θ, 0), then ω × that = (−ω² r sin θ, 0, 0)'
    formula: |-
      w**2*r*sin(th)
    equals: |-
      sqrt((0*0 - w*(w*r*sin(th)))**2 + (w*0 - 0*0)**2 + (0*(w*r*sin(th)) - 0*0)**2)
    samples:
      w: [0.5, 1.1, 1.8, 2.4, 3.0]
      r: [2.0, 1.5, 1.1, 0.6, 0.2]
      th: [0.3, 0.6, 0.9, 1.2, 1.4]
    tolerance: 1e-12
    shown: ['id="p2-acc"', 'its size is $\omega^2r\sin\theta$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-accnum
    answer: p2-accnum
    where: 'Problem 2(c), answer box: ω² r sin θ for ω = 3 rad/s, r = 0.5 m, θ = 40°, in m/s²'
    formula: |-
      3**2*0.5*sin(40*pi/180)
    expected: '2.89'
    tolerance: 0.005
    shown: ['id="p2-accnum"', '= 2.89\ \text{m/s}^2$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  - id: p2-sin40
    where: 'Problem 2(c): sin 40°'
    formula: |-
      sin(40*pi/180)
    expected: '0.6428'
    tolerance: 0.00005
    shown: ['4.5\times 0.6428']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own problem)'}
    origin: page-own

  # ---- Problem 3: the rotation matrix

  - id: p3-a1
    answer: p3-a1
    where: 'Problem 3(b), answer box: A_1 = R_11 A′_1 + R_21 A′_2 for the rotation by 30° about z and A′ = (2, 1, 5)'
    formula: |-
      2*cos(pi/6) + 1*sin(pi/6)
    expected: '2.23'
    tolerance: 0.005
    shown: ['id="p3-a1"', '= 1.732 + 0.5 = 2.23$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-a2
    where: 'Problem 3(b), check: A_2 = R_12 A′_1 + R_22 A′_2'
    formula: |-
      -2*sin(pi/6) + cos(pi/6)
    expected: '-0.134'
    tolerance: 0.0005
    shown: ['= -2\sin 30° + \cos 30° = -0.134$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-forward
    where: 'Problem 3(b), check: rotating (A_1, A_2) forward again gives A′_1 = 2 (independent of the page''s route: uses row 1 of R on the answer)'
    formula: |-
      (2*cos(pi/6) + sin(pi/6))*cos(pi/6) - (-2*sin(pi/6) + cos(pi/6))*sin(pi/6)
    expected: '2.00'
    tolerance: 0.005
    shown: ['= 2.232\cos 30° + 0.134\sin 30° = 2.00$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-forward-2
    where: 'Problem 3(b), check: rotating forward gives A′_2 = 1'
    formula: |-
      (2*cos(pi/6) + sin(pi/6))*sin(pi/6) + (-2*sin(pi/6) + cos(pi/6))*cos(pi/6)
    expected: '1'
    tolerance: 1e-9
    shown: ['The rotated vector is $\vec A'' = (2, 1, 5)$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-wrong-row
    where: 'Problem 3(b), check: the result of using row 1 instead of column 1'
    formula: |-
      2*cos(pi/6) - sin(pi/6)
    expected: '1.23'
    tolerance: 0.005
    shown: ['$2\cos 30° - \sin 30° = 1.23$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-grad
    answer: p3-grad
    where: 'Problem 3(c), answer box: ∂f′/∂x′_2 at the point with old coordinates (1, 2, 0), from f′ written in the rotated coordinates and differentiated numerically (the page rotates the old gradient): x′_1 = cos 30° − 2 sin 30° is held fixed, x′_2 = sin 30° + 2 cos 30° varies'
    formula: |-
      deriv('(cos(pi/6)*(cos(pi/6) - 2*sin(pi/6)) + sin(pi/6)*u)**2 + 3*(-sin(pi/6)*(cos(pi/6) - 2*sin(pi/6)) + cos(pi/6)*u)', 'u', sin(pi/6) + 2*cos(pi/6))
    expected: '3.60'
    tolerance: 0.005
    shown: ['id="p3-grad"', '= 1 + 2.598 = 3.60$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-grad-rot
    where: 'Problem 3(c): the page''s route, R_21·2 + R_22·3'
    formula: |-
      2*sin(pi/6) + 3*cos(pi/6)
    expected: '3.598'
    tolerance: 0.0005
    shown: ['$(0.232, 3.598, 0)$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-grad-1
    where: 'Problem 3(c), check: the first new component, R_11·2 + R_12·3'
    formula: |-
      2*cos(pi/6) - 3*sin(pi/6)
    expected: '0.232'
    tolerance: 0.0005
    shown: ['$(0.232, 3.598, 0)$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-grad-length
    where: 'Problem 3(c), check: the length of the gradient before the rotation'
    formula: |-
      sqrt(2**2 + 3**2)
    expected: '3.61'
    tolerance: 0.005
    shown: ['$\sqrt{2^2 + 3^2} = 3.61$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-grad-length-new
    where: 'Problem 3(c), check: the length of the gradient after the rotation'
    formula: |-
      sqrt((2*cos(pi/6) - 3*sin(pi/6))**2 + (2*sin(pi/6) + 3*cos(pi/6))**2)
    expected: '3.61'
    tolerance: 0.005
    shown: ['$\sqrt{0.232^2 + 3.598^2} = 3.61$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own numbers)'}
    origin: page-own

  # ---- Problem 4: use of the gradient (our own problem)

  - id: p4-max
    answer: p4-max
    where: 'Problem 4(a), answer box: the length of ∇T at P = (1, 2, 1) for T = 20 + 2xy − z², each component by a numerical derivative'
    formula: |-
      sqrt(deriv('20 + 2*s*2 - 1**2', 's', 1)**2 + deriv('20 + 2*1*s - 1**2', 's', 2)**2 + deriv('20 + 2*1*2 - s**2', 's', 1)**2)
    expected: '4.90'
    tolerance: 0.005
    shown: ['id="p4-max"', '= \sqrt{24} = 4.90$']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  - id: p4-dir
    answer: p4-dir
    where: 'Problem 4(a), answer box: the rate of change of T at P along n = (2, −1, 2)/3, as the derivative of T along the line P + t n at t = 0'
    formula: |-
      deriv('20 + 2*(1 + 2*t/3)*(2 - t/3) - (1 + 2*t/3)**2', 't', 0)
    expected: '0.667'
    tolerance: 0.0005
    shown: ['id="p4-dir"', '= \frac13(8 - 2 - 4) = 0.667$']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  - id: p4-n-unit
    where: 'Problem 4(a): n = (2, −1, 2)/3 has length 1'
    formula: |-
      sqrt(2**2 + 1**2 + 2**2)/3
    expected: '1'
    shown: ['unit vector $\hat n = \frac13(2, -1, 2)$']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  - id: p4-step
    where: 'Problem 4(a), check: T at the point (1.02, 1.99, 1.02), a step of 0.03 m from P along n'
    formula: |-
      20 + 2*1.02*1.99 - 1.02**2
    expected: '23.0192'
    tolerance: 0.00005
    shown: ['= 23.0192$']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  - id: p4-tp
    where: 'Problem 4(a), check: T at P'
    formula: |-
      20 + 2*1*2 - 1**2
    expected: '23'
    shown: ['$T(P) = 23$']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  - id: p4-step-linear
    where: 'Problem 4(a), check: the first-order estimate of the rise over 0.03 m'
    formula: |-
      (2/3)*0.03
    expected: '0.0200'
    tolerance: 0.00005
    shown: ['$0.667\times 0.03 = 0.0200$']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  - id: p4-yuk
    kind: identity
    answer: p4-yuk
    where: 'Problem 4(b), answer box: the radial derivative of e^(−r/L)/r, against a numerical derivative'
    formula: |-
      -(1/r**2 + 1/(L*r))*exp(-r/L)
    equals: |-
      deriv('exp(-s/L)/s', 's', r)
    samples:
      r: [0.3, 0.9, 1.6, 2.3, 3.0]
      L: [3.0, 2.2, 1.5, 0.9, 0.5]
    tolerance: 1e-6
    shown: ['id="p4-yuk"', '<Formula label="The gradient of the screened potential"']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own problem)'}
    origin: page-own

  # ---- Problem 5: the smooth function that becomes a delta function

  - id: p5-g
    kind: identity
    answer: p5-g
    where: 'Problem 5(a), answer box: g_a from the radial form of the Laplacian, f″ + (2/r) f′, with numerical derivatives (the page differentiates in Cartesian index notation)'
    formula: |-
      3*a**2/(4*pi*(r**2 + a**2)**(5/2))
    equals: |-
      deriv('-1/(4*pi*sqrt(s**2 + a**2))', 's', r, 2) + 2/r*deriv('-1/(4*pi*sqrt(s**2 + a**2))', 's', r)
    samples:
      r: [0.3, 0.7, 1.1, 1.6, 2.0]
      a: [2.0, 1.6, 1.2, 0.8, 0.5]
    tolerance: 1e-5
    shown: ['id="p5-g"', '<Formula label="The Laplacian of the smooth function"']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-g0
    answer: p5-g0
    where: 'Problem 5(a), answer box: g_a(0) in units of 1/a³, as the Laplacian at the origin: three equal second derivatives of f along a line through the origin (a = 1)'
    formula: |-
      3*deriv('-1/(4*pi*sqrt(s**2 + 1))', 's', 0, 2)
    expected: '0.239'
    tolerance: 0.0005
    shown: ['id="p5-g0"', '= \frac{3}{4\pi a^3} = 0.239/a^3$']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own addition)'}
    origin: page-own

  - id: p5-plot-0
    where: 'Problem 5(a), graph: the value at r = 0, 3/(4π)'
    formula: |-
      3/(4*pi)
    expected: '0.2387'
    tolerance: 0.00005
    shown: ['{ x: 0, y: 0.2387 }']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-plot-1
    where: 'Problem 5(a), graph: the value at r = a'
    formula: |-
      3/(4*pi*2**2.5)
    expected: '0.0422'
    tolerance: 0.00005
    shown: ['{ x: 1, y: 0.0422 }', 'has dropped to 0.042']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-norm
    where: 'Problem 5(b): the integral of g_a over all space, by numerical integration over shells (a = 1; the tail beyond r = 2000 is below 10⁻⁶)'
    formula: |-
      integrate('4*pi*s**2*3/(4*pi*(s**2 + 1)**2.5)', 's', 0, 2000)
    expected: '1'
    tolerance: 1e-5
