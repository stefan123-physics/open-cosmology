# Calculations on content/year-4/8.07/rotations-index-notation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.07 (Fall 2012, Guth) Lecture Notes 2, "Rotations in Index Notation", pp. 1-3, eqs. (2.1)-(2.10).
# Page's own worked examples: A = (3, 1, 2) rotated by 30 degrees about z; a rotation by 120 degrees about
# n = (1, 1, 1)/sqrt(3) built from eq. (2.10), applied to the same A. Quiz 1: A = (2, 0, 5) rotated by 30 degrees
# about z. Quiz 4: eq. (2.10) at 180 degrees. Vectors and matrices are checked entry by entry (the harness has
# scalars only); the Levi-Civita symbol is written out as the numbers +1, -1, 0.

page: content/year-4/8.07/rotations-index-notation.mdx
calcs:
  # ---------------------------------------------------------------- eq. (2.3)-(2.5): R_z(phi) is a rotation
  - id: rz-columns-unit
    kind: identity
    where: 'eqs. (2.3)-(2.5): the rotated basis vector e_x'' = (cos phi, sin phi, 0) has length 1'
    formula: cos(ph)**2 + sin(ph)**2
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.9, -0.8]}
    tolerance: 1e-12
    shown: ['tex="\hat e''_x = \hat e_x\cos\phi + \hat e_y\sin\phi, \qquad \hat e''_y = -\hat e_x\sin\phi + \hat e_y\cos\phi, \qquad \hat e''_z = \hat e_z"']
    source: {cite: reading1, at: 'eq. (2.3), p. 2'}
    origin: mit

  - id: rz-columns-orthogonal
    kind: identity
    where: 'eq. (2.5): the first two columns of R_z(phi), (cos, sin, 0) and (-sin, cos, 0), are perpendicular (plus 1 so the relative difference is defined); the page calls R an orthogonal matrix'
    formula: 1 + cos(ph)*(-sin(ph)) + sin(ph)*cos(ph) + 0*0
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.9, -0.8]}
    tolerance: 1e-12
    shown: ['so $R$ is an orthogonal matrix']
    source: {cite: reading1, at: 'eq. (2.5), p. 2'}
    origin: page-own

  # ---------------------------------------------------------------- worked example 1: (3, 1, 2), 30 degrees about z
  - id: cos30
    where: 'Worked example "Turning a vector by 30 degrees": cos 30 degrees'
    inputs: {}
    formula: cos(pi/6)
    expected: '0.8660'
    shown: ['$\cos 30^\circ \approx 0.8660$']
    source: {cite: reading1, at: 'eq. (2.5), p. 2'}
    origin: page-own

  - id: sin30
    where: 'Worked example: sin 30 degrees'
    inputs: {}
    formula: sin(pi/6)
    expected: '0.5'
    shown: ['$\sin 30^\circ = 0.5$']
    source: {cite: reading1, at: 'eq. (2.5), p. 2'}
    origin: page-own

  - id: ex1-A1
    where: 'Worked example: A''_1 = R_1j A_j = cos30 * 3 - sin30 * 1'
    inputs: {}
    formula: cos(pi/6)*3 - sin(pi/6)*1
    expected: '2.098'
    shown: ['$A''_1 = 0.8660 \times 3 - 0.5 \times 1 \approx 2.098$']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  - id: ex1-A2
    where: 'Worked example: A''_2 = sin30 * 3 + cos30 * 1'
    inputs: {}
    formula: sin(pi/6)*3 + cos(pi/6)*1
    expected: '2.366'
    shown: ['$A''_2 = 0.5 \times 3 + 0.8660 \times 1 \approx 2.366$']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  - id: ex1-length-before
    where: 'Worked example: |A|^2 = 3^2 + 1^2 + 2^2'
    inputs: {}
    formula: 3**2 + 1**2 + 2**2
    expected: '14'
    shown: ['$3^2 + 1^2 + 2^2 = 14$']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  - id: ex1-A1-squared
    where: 'Worked example: 2.098^2 (rounded component)'
    inputs: {}
    formula: 2.098**2
    expected: '4.402'
    shown: ['$2.098^2 + 2.366^2 + 2^2 \approx 4.402 + 5.598 + 4 = 14.000$']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  - id: ex1-A2-squared
    where: 'Worked example: 2.366^2 (rounded component), same line'
    inputs: {}
    formula: 2.366**2
    expected: '5.598'
    shown: ['After: $2.098^2']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  - id: ex1-length-after
    where: 'Worked example: |A''|^2 from the exact components equals 14'
    inputs: {}
    formula: (cos(pi/6)*3 - sin(pi/6))**2 + (sin(pi/6)*3 + cos(pi/6))**2 + 2**2
    expected: '14.000'
    shown: ['= 14.000$. A rotation keeps lengths']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  # ---------------------------------------------------------------- quiz 1: (2, 0, 5), 30 degrees about z
  - id: quiz1-A1
    where: 'Quiz 1: A''_1 = 2 cos 30 degrees (choices (1.73, -1, 5) and (1.73, 1, 5) both contain 1.73, so not linked to the quiz index)'
    inputs: {}
    formula: 2*cos(pi/6)
    expected: '1.73'
    shown: ['$A''_1 = 2\\cos 30^\\circ \\approx 1.73$']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  - id: quiz1-A2
    where: 'Quiz 1: A''_2 = 2 sin 30 degrees'
    inputs: {}
    formula: 2*sin(pi/6)
    expected: '1'
    shown: ['$A''_2 = 2\\sin 30^\\circ = 1$']
    source: {cite: reading1, at: 'eq. (2.8), p. 2'}
    origin: page-own

  # ---------------------------------------------------------------- eq. (2.10) reproduces eq. (2.5) for n = e_z
  - id: eq210-R12-z
    kind: identity
    where: 'eq. (2.10) with n = (0, 0, 1): R_12 = delta_12 cos + n1 n2 (1 - cos) - eps_123 n3 sin = -sin phi (plus 2 for a defined relative difference)'
    formula: 2 + 0*cos(ph) + 0*0*(1 - cos(ph)) - 1*1*sin(ph)
    equals: 2 - sin(ph)
    samples: {ph: [0.3, 1.2, 2.9]}
    tolerance: 1e-12
    shown: ['$R_{12} = -\epsilon_{123}\sin\phi = -\sin\phi$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: mit

  - id: eq210-R21-z
    kind: identity
    where: 'eq. (2.10) with n = e_z: R_21 = -eps_213 sin phi = +sin phi'
    formula: 2 - (-1)*1*sin(ph)
    equals: 2 + sin(ph)
    samples: {ph: [0.3, 1.2, 2.9]}
    tolerance: 1e-12
    shown: ['$R_{21} = -\epsilon_{213}\sin\phi = \sin\phi$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: mit

  - id: eq210-R33-z
    kind: identity
    where: 'eq. (2.10) with n = e_z: R_33 = cos phi + 1*(1 - cos phi) = 1, the diagonal 1 of eq. (2.5)'
    formula: cos(ph) + 1*1*(1 - cos(ph))
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.9]}
    tolerance: 1e-12
    shown: ['the last of these equals $\cos\phi + (1 - \cos\phi)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  # ---------------------------------------------------------------- worked example 2: 120 degrees about (1,1,1)/sqrt3
  - id: ex2-middle-term
    where: 'Worked example "A third of a turn": n_i n_j (1 - cos 120 degrees) = (1/3)(3/2)'
    inputs: {}
    formula: (1/3)*(1 - cos(2*pi/3))
    expected: '0.5'
    shown: ['$\tfrac13 \times \tfrac32 = \tfrac12$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-last-term
    where: 'Worked example: n_k sin 120 degrees = (1/sqrt3)(sqrt3/2)'
    inputs: {}
    formula: (1/sqrt(3))*sin(2*pi/3)
    expected: '0.5'
    shown: ['$\hat n_k\sin\phi = \tfrac{1}{\sqrt 3}\cdot\tfrac{\sqrt 3}{2} = \tfrac12$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-diagonal
    where: 'Worked example: R_11 = cos 120 + 1/2 = 0 (plus 1 for a defined relative difference)'
    inputs: {}
    formula: 1 + cos(2*pi/3) + (1/3)*(1 - cos(2*pi/3)) - 0
    expected: '1'
    tolerance: 1e-12
    shown: ['Diagonal: $-\tfrac12 + \tfrac12 = 0$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-R12
    where: 'Worked example: R_12 = 1/2 - eps_123 n_3 sin = 1/2 - 1/2 = 0 (plus 1)'
    inputs: {}
    formula: 1 + (1/3)*(1 - cos(2*pi/3)) - 1*(1/sqrt(3))*sin(2*pi/3)
    expected: '1'
    tolerance: 1e-12
    shown: ['$R_{12} = \tfrac12 - \tfrac12\epsilon_{123} = 0$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-R21
    where: 'Worked example: R_21 = 1/2 - eps_213 n_3 sin = 1/2 + 1/2 = 1 (also R_32 = R_13 = 1, by the cyclic eps_321 = eps_132 = -1)'
    inputs: {}
    formula: (1/3)*(1 - cos(2*pi/3)) - (-1)*(1/sqrt(3))*sin(2*pi/3)
    expected: '1'
    tolerance: 1e-12
    shown: ['$R_{21} = \tfrac12 - \tfrac12\epsilon_{213} = 1$', '$R_{32} = R_{13} = 1$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-R23
    where: 'Worked example: R_23 = 1/2 - eps_231/2 = 0 (eps_231 = +1; likewise R_31 with eps_312 = +1), plus 1'
    inputs: {}
    formula: 1 + (1/3)*(1 - cos(2*pi/3)) - 1*(1/sqrt(3))*sin(2*pi/3)
    expected: '1'
    tolerance: 1e-12
    shown: ['$R_{23} = R_{31} = 0$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-axis-fixed
    where: 'Worked example: each row of the permutation matrix sums to 1, so R n = n (row 1: 0 + 0 + 1)'
    inputs: {}
    formula: 0 + 0 + 1
    expected: '1'
    shown: ['Each row sums to 1']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  - id: ex2-length
    where: 'Worked example: |(2, 3, 1)|^2 = 14, the same as |(3, 1, 2)|^2'
    inputs: {}
    formula: 2**2 + 3**2 + 1**2
    expected: '14'
    shown: ['again of length $\sqrt{14}$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own

  # ---------------------------------------------------------------- quiz 4: eq. (2.10) at 180 degrees
  - id: quiz4-half-turn
    kind: identity
    where: 'Quiz 4: at phi = pi, delta cos + n n (1 - cos) - eps n sin = -delta + 2 n n; checked for a diagonal entry (delta = 1) with n_i n_i = nn'
    formula: 3 + 1*cos(pi) + nn*(1 - cos(pi)) - 0.7*sin(pi)
    equals: 3 - 1 + 2*nn
    samples: {nn: [0.1, 0.5, 0.9]}
    tolerance: 1e-12
    shown: ['$R_{ij} = -\\delta_{ij} + 2\\hat n_i\\hat n_j$']
    source: {cite: reading1, at: 'eq. (2.10), p. 3'}
    origin: page-own
