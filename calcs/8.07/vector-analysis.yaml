# Calculations on content/year-4/8.07/vector-analysis.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.07 (Fall 2012, Guth) Lecture Notes 1, "Vector Analysis", pp. 1-5 (no numbered equations).
# Page's own worked example: A = (2, -1, 3), B = (1, 4, -2); a quarter-turn about z sends (x, y, z) to (-y, x, z),
# so A' = (1, 2, 3), B' = (-4, 1, -2). The counterexample to the sine product uses A = e_x, B = e_y, C = -e_y.
# Vectors are handled component by component (the harness has scalars only).

page: content/year-4/8.07/vector-analysis.mdx
calcs:
  # ---------------------------------------------------------------- the sine product is not distributive (p. 2)
  - id: sine-product-pair
    where: '"The dot product, and a question": e_x with e_y (and with -e_y), both at 90 degrees; quiz 2'
    inputs: {}
    formula: 1 * 1 * sin(pi/2)
    expected: '1'
    shown: ['so each sine product is $1$', '$1 \\times 1 \\times \\sin 90^\\circ = 1$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: sine-product-sum
    where: '"The dot product, and a question": the two sine products add up to 2, while e_y + (-e_y) = 0 gives 0'
    inputs: {}
    formula: 2 * 1 * 1 * sin(pi/2)
    expected: '2'
    shown: ['the sum of the two is $2$', 'the right side $2$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  # ---------------------------------------------------------------- the proof (p. 4)
  - id: half-turn-about-x
    kind: identity
    where: '"Why the cosine": a rotation by angle t about the x axis sends e_y = (0, 1, 0) to (0, cos t, sin t); at t = 180 degrees this is (0, -1, 0) = -e_y. Checked component by component: y component cos(pi) = -1, z component sin(pi) = 0 (written as 1 + sin so the relative difference is defined)'
    formula: cos(tt) + 2*(1 + sin(tt))
    equals: -1 + 2
    samples: {tt: [3.141592653589793]}
    tolerance: 1e-12
    shown: ['Turn the pair $(\hat e_x, \hat e_y)$ through $180^\circ$ about the $x$ axis']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: cosine-from-components
    kind: identity
    where: '"Why the cosine": with A along x, A_x B_x = |A| |B| cos(theta); checked for A = (a, 0, 0), B = |B|(cos th, sin th cos ph, sin th sin ph)'
    formula: aa * bb*cos(th) + 0 * bb*sin(th)*cos(ph) + 0 * bb*sin(th)*sin(ph)
    equals: aa * bb * cos(th)
    samples: {aa: [1.5, 2.0, 0.7], bb: [2.0, 0.3, 4.1], th: [0.4, 2.2, 1.1], ph: [0.3, 5.0, 2.7]}
    tolerance: 1e-12
    shown: ['And $B_x = |\vec B|\cos\theta$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  # ---------------------------------------------------------------- cross product in components (p. 5)
  - id: determinant-expansion
    kind: identity
    where: 'formula "Cross product as a determinant": the first-row expansion gives the components of the formula "Cross product in components" (sum of the three components with weights 1, 10, 100 to test all at once)'
    formula: (ay*bz - az*by) + 10*(-(ax*bz - az*bx)) + 100*(ax*by - ay*bx)
    equals: (ay*bz - az*by) + 10*(az*bx - ax*bz) + 100*(ax*by - ay*bx)
    samples: {ax: [2, 0.3, -1.7], ay: [-1, 2.2, 0.4], az: [3, -0.8, 1.9], bx: [1, 1.1, -0.6], by: [4, -2.5, 3.3], bz: [-2, 0.7, 0.2]}
    tolerance: 1e-12
    shown: ['which is the same as a determinant, expanded along its first row']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: lagrange-identity
    kind: identity
    where: 'worked example step "Cross product": |A x B|^2 = |A|^2 |B|^2 - (A . B)^2, i.e. |A||B| sin(theta) = sqrt(|A|^2|B|^2 - (A.B)^2)'
    formula: (ay*bz - az*by)**2 + (az*bx - ax*bz)**2 + (ax*by - ay*bx)**2
    equals: (ax**2 + ay**2 + az**2)*(bx**2 + by**2 + bz**2) - (ax*bx + ay*by + az*bz)**2
    samples: {ax: [2, 0.3, -1.7], ay: [-1, 2.2, 0.4], az: [3, -0.8, 1.9], bx: [1, 1.1, -0.6], by: [4, -2.5, 3.3], bz: [-2, 0.7, 0.2]}
    tolerance: 1e-12
    shown: ['because $\sin^2\theta = 1 - \cos^2\theta$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  # ---------------------------------------------------------------- worked example
  - id: ex-dot
    where: 'worked example step "Dot product and angle"; quiz 3 explanation'
    inputs: {}
    formula: 2*1 + (-1)*4 + 3*(-2)
    expected: '-8'
    shown: ['= 2 - 4 - 6 = -8$', 'add up to the dot product, $-8$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-length-a-squared
    where: 'worked example: |A|^2 = 14'
    inputs: {}
    formula: 2**2 + (-1)**2 + 3**2
    expected: '14'
    shown: ['$|\vec A| = \sqrt{4 + 1 + 9} = \sqrt{14}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-length-b-squared
    where: 'worked example: |B|^2 = 21'
    inputs: {}
    formula: 1**2 + 4**2 + (-2)**2
    expected: '21'
    shown: ['$|\vec B| = \sqrt{1 + 16 + 4} = \sqrt{21}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-length-product-squared
    where: 'worked example: |A|^2 |B|^2 = 14 x 21 = 294'
    inputs: {}
    formula: 14 * 21
    expected: '294'
    shown: ['$\cos\theta = -8/\sqrt{294} \approx -0.467$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-cos
    where: 'worked example: cos(theta) = -8/sqrt(294)'
    inputs: {}
    formula: -8 / sqrt(294)
    expected: '-0.467'
    shown: ['\approx -0.467$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-angle
    where: 'worked example: theta = arccos(-8/sqrt(294))'
    inputs: {}
    formula: acos(-8 / sqrt(294)) * 180 / pi
    expected: '117.8'
    shown: ['$\theta \approx 117.8^\circ$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-cross-x
    where: 'worked example step "Cross product"; quiz 3'
    inputs: {}
    formula: (-1)*(-2) - 3*4
    expected: '-10'
    shown: ['$A_yB_z - A_zB_y = 2 - 12 = -10$', '$A_yB_z - A_zB_y = (-1)(-2) - 3 \\times 4 = -10$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-cross-y
    where: 'worked example step "Cross product"; quiz 3'
    inputs: {}
    formula: 3*1 - 2*(-2)
    expected: '7'
    shown: ['= 7$, the $z$ component $A_xB_y - A_yB_x = 8 + 1 = 9$. So']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-cross-z
    where: 'worked example step "Cross product"; quiz 3'
    inputs: {}
    formula: 2*4 - (-1)*1
    expected: '9'
    shown: ['= 9$. So $']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-cross-perp-a
    where: 'worked example: A . (A x B) = 0'
    inputs: {}
    formula: 2*(-10) + (-1)*7 + 3*9
    expected: '0'
    tolerance: 1e-12
    shown: ['$\vec A \cdot (\vec A \times \vec B) = -20 - 7 + 27 = 0$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-cross-perp-b
    where: 'worked example: B . (A x B) = 0'
    inputs: {}
    formula: 1*(-10) + 4*7 + (-2)*9
    expected: '0'
    tolerance: 1e-12
    shown: ['$\vec B \cdot (\vec A \times \vec B) = -10 + 28 - 18 = 0$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-cross-length-squared
    where: 'worked example: |A x B|^2 = 100 + 49 + 81 = 230 = 294 - 64'
    inputs: {}
    formula: (-10)**2 + 7**2 + 9**2
    expected: '230'
    shown: ['$\sqrt{100 + 49 + 81} = \sqrt{230} \approx 15.17$', '$|\vec A||\vec B|\sin\theta = \sqrt{294 - 64}$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-cross-length
    where: 'worked example: |A x B| = sqrt(230)'
    inputs: {}
    formula: sqrt(230)
    expected: '15.17'
    shown: ['\sqrt{230} \approx 15.17$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-cross-length-sine
    where: 'worked example: |A||B| sin(theta) with theta from the dot product equals |A x B|'
    inputs: {}
    formula: sqrt(294) * sin(acos(-8 / sqrt(294)))
    expected: '15.17'
    shown: ['equals $|\vec A||\vec B|\sin\theta']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-rotated-dot
    where: 'worked example step "Rotate both by 90° about z": A'' . B'' with A'' = (1, 2, 3), B'' = (-4, 1, -2)'
    inputs: {}
    formula: 1*(-4) + 2*1 + 3*(-2)
    expected: '-8'
    shown: ['Their dot product is $-4 + 2 - 6 = -8$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-rotation-map
    kind: identity
    where: 'worked example: a quarter-turn about z, (x, y) to (x cos t - y sin t, x sin t + y cos t) at t = 90 degrees, is (-y, x); checked for both components (weights 1 and 10) on A and B'
    formula: (xx*cos(tt) - yy*sin(tt)) + 10*(xx*sin(tt) + yy*cos(tt))
    equals: -yy + 10*xx
    samples: {xx: [2, 1], yy: [-1, 4], tt: [1.5707963267948966, 1.5707963267948966]}
    tolerance: 1e-12
    shown: ['so a vector $(x, y, z)$ becomes $(-y, x, z)$', '$\vec A'' = (1, 2, 3)$ and $\vec B'' = (-4, 1, -2)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-rotated-cross-x
    where: 'worked example: x component of A'' x B'' = -7, the rotated -(7) (the y component of A x B, negated)'
    inputs: {}
    formula: 2*(-2) - 3*1
    expected: '-7'
    shown: ['$(2 \times (-2) - 3 \times 1,\; 3 \times (-4) - 1 \times (-2),\; 1 \times 1 - 2 \times (-4)) = (-7, -10, 9)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-rotated-cross-y
    where: 'worked example: y component of A'' x B'' = -10, the x component of A x B'
    inputs: {}
    formula: 3*(-4) - 1*(-2)
    expected: '-10'
    shown: ['which is exactly $(-10, 7, 9)$ turned by the same quarter-turn']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-rotated-cross-z
    where: 'worked example: z component of A'' x B'' = 9, unchanged by a turn about z'
    inputs: {}
    formula: 1*1 - 2*(-4)
    expected: '9'
    shown: ['So $\vec A \times \vec B = (-10, 7, 9)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own
