# Calculations on content/year-4/8.07/traceless-tensors-legendre-polynomials.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.07 (Fall 2012) Lecture Notes 9, "Traceless Symmetric Tensor Approach to Legendre Polynomials and Spherical
# Harmonics" (Guth, typed, October 17, 2012), Sections 1-6, eqs. (9.1)-(9.45), pp. 1-11. The notes quote no numbers, only
# exact coefficients and counts.
# Page's own worked example: a sphere of radius a = 5 cm held at V0 cos^3(theta), V0 = 100 V.

page: content/year-4/8.07/traceless-tensors-legendre-polynomials.mdx
calcs:
  # ---------------------------------------------------------------- Section 1
  - id: radial-term-forms
    kind: identity
    where: 'eq. (9.3): (1/r^2) d/dr (r^2 dV/dr) = (1/r) d^2(rV)/dr^2, checked for V = r^a (numerical derivatives)'
    formula: deriv('s**2 * AA * s**(AA - 1)', 's', rr)/rr**2
    equals: deriv('s**(AA + 1)', 's', rr, 2)/rr
    samples: {AA: [2, 3, -1.5, 0.5], rr: [0.7, 1.3, 2.0, 0.9]}
    tolerance: 1e-5
    shown: ['Both sides equal $\partial^2 V/\partial r^2 + (2/r)\,\partial V/\partial r$']
    source: {cite: reading1, at: 'eq. (9.3)'}
    origin: mit

  # ---------------------------------------------------------------- Section 2
  - id: trace-moves
    kind: identity
    where: 'eqs. (9.13)-(9.18): for a diagonal C with entries c1, c2, c3 and trace lambda, sum c_k n_k^2 = sum (c_k - lambda/3) n_k^2 + lambda/3'
    formula: c1*(sin(th)*cos(ph))**2 + c2*(sin(th)*sin(ph))**2 + c3*cos(th)**2
    equals: (c1 - (c1+c2+c3)/3)*(sin(th)*cos(ph))**2 + (c2 - (c1+c2+c3)/3)*(sin(th)*sin(ph))**2 + (c3 - (c1+c2+c3)/3)*cos(th)**2 + (c1+c2+c3)/3
    samples: {c1: [1.0, 0.3, -2.0], c2: [2.0, 1.5, 0.7], c3: [6.0, -0.4, 1.1], th: [0.4, 1.2, 2.5], ph: [0.3, 2.0, 4.0]}
    tolerance: 1e-12
    shown: ['has zero trace because $\delta_{ii} = 3$']
    source: {cite: reading1, at: 'eqs. (9.13)-(9.18)'}
    origin: mit

  # ---------------------------------------------------------------- Section 4
  - id: radial-roots
    kind: identity
    where: 'eq. (9.30): p = -(l + 1) satisfies p (p + 1) = l (l + 1) (checked as p(p+1) - l(l+1) + 1 = 1)'
    formula: (-(LL + 1))*(-(LL + 1) + 1) - LL*(LL + 1) + 1
    equals: 1
    samples: {LL: [0, 1, 2, 7]}
    tolerance: 1e-12
    shown: ['with the two roots $p = \ell$ and $p = -(\ell + 1)$']
    source: {cite: reading1, at: 'eq. (9.30)'}
    origin: mit

  # ---------------------------------------------------------------- Section 5 counting
  - id: nsym-formula
    kind: value
    where: 'eq. (9.33) for l = 2: (l + 2)!/(l! 2!) = 4!/(2! 2!) = 6, the same as (l + 1)(l + 2)/2'
    formula: (4*3*2*1)/((2*1)*(2*1))
    expected: '6'
    shown: ['which gives 1, 3 and 6 for $\ell = 0, 1, 2$, as found above']
    source: {cite: reading1, at: 'eq. (9.33)'}
    origin: mit

  - id: nsym-2
    kind: value
    where: 'p. 7: a symmetric rank-2 tensor has 6 independent entries, (2 + 1)(2 + 2)/2'
    inputs: {LL: 2}
    formula: (LL + 1)*(LL + 2)/2
    expected: '6'
    shown: ['leaves six, those with the index pairs 11, 12, 13, 22, 23 and 33']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: balls-example
    kind: value
    where: 'p. 8: nine balls, three in hat 1, two in hat 2, four in hat 3'
    formula: 3 + 2 + 4
    expected: '9'
    shown: ['Nine balls with three in the first hat, two in the second and four in the third']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: ntraceless
    kind: identity
    where: 'eq. (9.35): (l + 1)(l + 2)/2 - (l - 1) l/2 = 2 l + 1 (also for l = 0 and 1, where the subtracted term is 0)'
    formula: (LL + 1)*(LL + 2)/2 - (LL - 1)*LL/2
    equals: 2*LL + 1
    samples: {LL: [0, 1, 2, 3, 4, 10]}
    tolerance: 1e-12
    shown: ['and the formula $\frac12(\ell - 1)\ell$ duly gives zero']
    source: {cite: reading1, at: 'eq. (9.35)'}
    origin: mit

  - id: quiz-rank4-count
    kind: value
    where: 'quiz 1: N_S(4) - N_S(2) = 15 - 6'
    inputs: {LL: 4}
    formula: (LL + 1)*(LL + 2)/2 - (LL - 1)*LL/2
    expected: '9'
    quiz: 0
    shown: ['leaving $15 - 6 = 9 = 2\\ell + 1$']
    source: {cite: reading1, at: 'eq. (9.35)'}
    origin: page-own

  # ---------------------------------------------------------------- Section 6 traceless parts
  - id: trace-rank3
    kind: identity
    where: 'eq. (9.40): z_k - (z_k + z_k + 3 z_k)/5 = 0 (checked as that plus 1)'
    formula: zz - (zz + zz + 3*zz)/5 + 1
    equals: 1
    samples: {zz: [1.0, 0.0, -1.0, 0.4]}
    tolerance: 1e-12
    shown: ['To check the $\frac15$, sum over $i = j$:']
    source: {cite: reading1, at: 'eq. (9.40)'}
    origin: mit

  - id: trace-rank4-c1
    kind: value
    where: 'eq. (9.42): 1 + 7 c1 = 0 gives c1 = -1/7'
    formula: -1/7
    expected: '-0.142857'
    tolerance: 1e-6
    shown: ['so $c_1 = -\frac17$ and $c_2 = \frac{1}{35}$ (notes p. 10)']
    source: {cite: reading1, at: 'eq. (9.42)'}
    origin: mit

  - id: trace-rank4-c2
    kind: identity
    where: 'eq. (9.42): with c1 = -1/7, c1 + 5 c2 = 0 at c2 = 1/35 (checked as that plus 1)'
    formula: -1/7 + 5*cc + 1
    equals: 1
    samples: {cc: [0.0285714285714286]}
    tolerance: 1e-12
    shown: ['both brackets must be zero']
    source: {cite: reading1, at: 'eq. (9.42)'}
    origin: mit

  - id: trace-rank4-full
    kind: identity
    where: 'eq. (9.42) summed explicitly: the i = j trace of eq. (9.43) for z = (0,0,1) and index values k, m, as (1 + 7 c1) z_k z_m + (c1 + 5 c2) delta_km = 0 (checked as that plus 1)'
    formula: (1 + 7*(-1/7))*zk*zm + (-1/7 + 5/35)*dkm + 1
    equals: 1
    samples: {zk: [1.0, 0.0, 1.0], zm: [1.0, 0.0, 0.0], dkm: [1.0, 1.0, 0.0]}
    tolerance: 1e-12
    shown: ['in the $c_2$ bracket the terms give $3\delta_{km}$']
    source: {cite: reading1, at: 'eqs. (9.42)-(9.43)'}
    origin: mit

  - id: azimuthal-orthogonality
    kind: value
    where: 'p. 11: the integral of cos((m - m'') phi) over a full turn is 0 for m != m'' (m - m'' = 2 here; the imaginary part integrates to zero as well)'
    formula: integrate('cos(2*t)', 't', 0, 2*pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['These are orthogonal over a full turn,']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: legendre-table-l4
    kind: identity
    where: 'eq. (9.45): eq. (9.43) contracted with n gives c^4 - (1/7)(6 c^2) + (1/35)(3) (each delta joins two n to n.n = 1)'
    formula: cc**4 - (1/7)*6*cc**2 + (1/35)*3
    equals: cc**4 - 6*cc**2/7 + 3/35
    samples: {cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-12
    shown: ['each Kronecker delta joins two factors of $\hat n$']
    source: {cite: reading1, at: 'eq. (9.45)'}
    origin: mit

  - id: legendre-p2-normalized
    kind: identity
    where: 'after eq. (9.45): (3/2)(cos^2 - 1/3) = P2 = (3 cos^2 - 1)/2'
    formula: 3/2*(cc**2 - 1/3)
    equals: (3*cc**2 - 1)/2
    samples: {cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-12
    shown: ['for example $\frac32\left(\cos^2\theta - \frac13\right) = P_2(\cos\theta)$']
    source: {cite: reading1, at: 'eq. (9.45)'}
    origin: page-own

  # ---------------------------------------------------------------- worked example
  - id: example-split
    kind: identity
    where: 'worked example: cos^3 = (cos^3 - (3/5) cos) + (3/5) cos'
    formula: (cc**3 - 3*cc/5) + 3*cc/5
    equals: cc**3
    samples: {cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-12
    shown: ['an $\ell = 3$ term and an $\ell = 1$ term, with no $\ell = 0$ or $\ell = 2$ part']
    source: {cite: reading1, at: 'eq. (9.45)'}
    origin: page-own

  - id: example-boundary-inside
    kind: identity
    where: 'worked example: the inside solution V0[(3/5)(r/a) cos + (r/a)^3 (cos^3 - (3/5) cos)] evaluated at r = a equals V0 cos^3'
    formula: VV*(3/5*(rr/aa)*cc + (rr/aa)**3*(cc**3 - 3*cc/5))
    equals: VV*cc**3
    samples: {VV: [100.0, 100.0, 100.0], rr: [5.0, 5.0, 5.0], aa: [5.0, 5.0, 5.0], cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-9
    shown: ['Both equal $V_0\cos^3\theta$ at $r = a$.']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own

  - id: example-boundary-outside
    kind: identity
    where: 'worked example: the outside solution V0[(3/5)(a/r)^2 cos + (a/r)^4 (cos^3 - (3/5) cos)] evaluated at r = a equals V0 cos^3'
    formula: VV*(3/5*(aa/rr)**2*cc + (aa/rr)**4*(cc**3 - 3*cc/5))
    equals: VV*cc**3
    samples: {VV: [100.0, 100.0, 100.0], rr: [5.0, 5.0, 5.0], aa: [5.0, 5.0, 5.0], cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-9
    shown: ['Outside, $V = V_0\left[\frac35\,\frac{a^2}{r^2}\cos\theta']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own

  - id: legendre-table-l3
    kind: identity
    where: 'eq. (9.45): eq. (9.39) contracted with n gives c^3 - (1/5)(3 c), since each of the three delta terms gives (z.n)(n.n) = c'
    formula: cc**3 - (1/5)*(cc + cc + cc)
    equals: cc**3 - 3*cc/5
    samples: {cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-12
    shown: ['\{\hat z_i\hat z_j\hat z_k\}\,\hat n_i\hat n_j\hat n_k &= \cos^3\theta - \frac35\cos\theta']
    source: {cite: reading1, at: 'eq. (9.45)'}
    origin: mit

  - id: normalization-l3
    kind: identity
    where: 'after eq. (9.45): (2l)!/(2^l (l!)^2) = 720/(2^3 x 6^2) times the rank-3 row gives the standard P_3'
    formula: 720/(2**3*6**2)*(cc**3 - 3*cc/5)
    equals: (5*cc**3 - 3*cc)/2
    samples: {cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-12
    shown: ['which multiplies each by $(2\ell)!/(2^\ell(\ell\,!)^2)$']
    source: {cite: reading1, at: 'eq. (9.45)'}
    origin: page-own

  - id: normalization-l4
    kind: identity
    where: 'after eq. (9.45): (2l)!/(2^l (l!)^2) = 40320/(2^4 x 24^2) times the rank-4 row gives the standard P_4'
    formula: 40320/(2**4*24**2)*(cc**4 - 6*cc**2/7 + 3/35)
    equals: (35*cc**4 - 30*cc**2 + 3)/8
    samples: {cc: [0.3, -0.7, 0.95]}
    tolerance: 1e-12
    shown: ['these are the Legendre polynomials $P_\ell(\cos\theta)$: for example']
    source: {cite: reading1, at: 'eq. (9.45)'}
    origin: page-own

  - id: example-harmonic
    kind: identity
    where: 'worked example: Laplacian of z^3 - (3/5) z (x^2 + y^2 + z^2) is 6z - (3/5)(2z + 2z + 6z) = 0 (checked as that plus 1, numerically)'
    formula: deriv('-(3/5)*zz*t**2', 't', xx, 2) + deriv('-(3/5)*zz*t**2', 't', yy, 2) + deriv('t**3 - (3/5)*t*(xx**2 + yy**2 + t**2)', 't', zz, 2) + 1
    equals: 1
    samples: {xx: [0.3, 1.0], yy: [0.5, -0.2], zz: [1.2, 0.4]}
    tolerance: 1e-5
    shown: ['is $6z - \frac35(2z + 2z + 6z) = 0$']
    source: {cite: reading1, at: 'eq. (9.27)'}
    origin: page-own

  - id: example-centre
    kind: value
    where: 'worked example and quiz 3: the average of cos^3 over the sphere, (1/2) integral of cos^3 sin from 0 to pi'
    formula: integrate('cos(t)**3*sin(t)', 't', 0, pi)/2
    expected: '0'
    tolerance: 1e-9
    shown: ['At the centre $V = 0$: the average of $\cos^3\theta$ over the sphere is zero.']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own

  - id: example-axis-inside
    kind: value
    where: 'worked example: on the axis at r = 2.5 cm, 100 (3/5 x 1/2 + 1/8 x 2/5)'
    inputs: {VV: 100, rr: 2.5, aa: 5, cc: 1}
    formula: VV*(3/5*(rr/aa)*cc + (rr/aa)**3*(cc**3 - 3*cc/5))
    expected: '35'
    shown: ['= 30 + 5 = 35$ V']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own

  - id: example-axis-outside
    kind: value
    where: 'worked example: on the axis at r = 10 cm, 100 (3/5 x 1/4 + 1/16 x 2/5)'
    inputs: {VV: 100, rr: 10, aa: 5, cc: 1}
    formula: VV*(3/5*(aa/rr)**2*cc + (aa/rr)**4*(cc**3 - 3*cc/5))
    expected: '17.5'
    shown: ['= 15 + 2.5 = 17.5$ V']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own

  - id: example-60deg
    kind: value
    where: 'worked example: at r = 2.5 cm, theta = 60 deg, 100 (3/5 x 1/2 x 1/2 + 1/8 (1/8 - 3/10)) = 15 - 2.19'
    inputs: {VV: 100, rr: 2.5, aa: 5, cc: 0.5}
    formula: VV*(3/5*(rr/aa)*cc + (rr/aa)**3*(cc**3 - 3*cc/5))
    expected: '12.8'
    shown: ['= 15 - 2.19 \approx 12.8$ V']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own

  - id: example-60deg-l3
    kind: value
    where: 'worked example: the l = 3 part at 60 deg, 100 x (1/8)(1/8 - 3/10)'
    formula: 100*(1/8)*(1/8 - 3/10)
    expected: '-2.19'
    shown: ['\frac{3}{10}\right)\right) = 15']
    source: {cite: reading1, at: 'eq. (9.31)'}
    origin: page-own
