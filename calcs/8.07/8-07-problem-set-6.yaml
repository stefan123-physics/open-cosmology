  # ---- Problem 6: the circular capacitor

  - id: p6-area
    kind: identity
    where: 'Problem 6(a): the covered area, the integral of the chord length 2√(R² − x²) from x0 to R (numerical), against R² arccos(x0/R) − x0 √(R² − x0²)'
    formula: |-
      integrate('2*sqrt(R**2 - u**2)', 'u', x0, R)
    equals: |-
      R**2*acos(x0/R) - x0*sqrt(R**2 - x0**2)
    samples:
      R: [2.0, 2.5, 3.0, 2.2, 2.8]
      x0: [-1.5, 0.0, 1.5, 0.7, -0.9]
    tolerance: 1e-6
    shown: ['<Formula label="The area of the disk covered by the sheet"']
    source: {cite: mit, at: 'Problem 6, p. 3 (our own solution)'}
    origin: page-own

  - id: p6-c
    kind: identity
    answer: p6-c
    where: 'Problem 6(a), answer box: the two parallel pieces, ε0 (πR² − A) + εr ε0 A, over d, with A the numerical integral of the chord length'
    formula: |-
      eps0*(pi*R**2 + (er - 1)*(R**2*acos(x0/R) - x0*sqrt(R**2 - x0**2)))/d
    equals: |-
      (eps0*(pi*R**2 - integrate('2*sqrt(R**2 - u**2)', 'u', x0, R)) + er*eps0*integrate('2*sqrt(R**2 - u**2)', 'u', x0, R))/d
    samples:
      eps0: [1.0, 0.5, 2.0, 1.3, 0.8]
      er: [1.5, 2.0, 4.0, 6.0, 3.0]
      R: [2.0, 2.5, 3.0, 2.2, 2.8]
      x0: [-1.5, 0.0, 1.5, 0.7, -0.9]
      d: [0.1, 0.2, 0.5, 0.3, 0.4]
    tolerance: 1e-6
    shown: ['id="p6-c"', '<Formula label="The capacitance with the sheet part way in"']
    source: {cite: mit, at: 'Problem 6, p. 3 (our own solution)'}
    origin: page-own

  - id: p6-f
    kind: identity
    answer: p6-f
    where: 'Problem 6(b), answer box: ½ V0² dC/dx0, with the derivative of the covered area taken numerically'
    formula: |-
      -eps0*(er - 1)*V0**2*sqrt(R**2 - x0**2)/d
    equals: |-
      0.5*V0**2*eps0*(er - 1)/d*deriv('R**2*acos(u/R) - u*sqrt(R**2 - u**2)', 'u', x0, 1)
    samples:
      eps0: [1.0, 0.5, 2.0, 1.3, 0.8]
      er: [1.5, 2.0, 4.0, 6.0, 3.0]
      V0: [1.0, 2.0, 3.0, 1.5, 2.5]
      R: [2.0, 2.5, 3.0, 2.2, 2.8]
      x0: [-1.5, 0.0, 1.5, 0.7, -0.9]
      d: [0.1, 0.2, 0.5, 0.3, 0.4]
    tolerance: 1e-6
    shown: ['id="p6-f"', '<Formula label="The force on the sheet"']
    source: {cite: mit, at: 'Problem 6, p. 3'}
    origin: page-own

