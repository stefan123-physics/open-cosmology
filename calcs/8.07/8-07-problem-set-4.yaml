# Calculations on content/year-4/8.07/8-07-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates the lid's potential against the sines numerically and sums the series with sinh ratios
# (the page uses 1/(2 cosh)); Problem 2 finds each image by a root search for the charge and the position that
# make the potential vanish at the top and the bottom of the sphere, adds up the potentials of all five charges
# at points of the sphere, and compares the energy with the first terms of the closed series for the capacitance
# of a sphere and a plane; Problem 3 does the angular integral for A_11 numerically (the page reads it off);
# Problem 4 differentiates and integrates the potential numerically; Problem 5 integrates the Legendre polynomials
# and the rings of charge numerically; Problem 6 averages the field of the point charge over the ball numerically
# (the page uses the field of a fictitious ball).
# Constants not in calcs/constants.yaml are CODATA 2018 inputs: eps0.

page: content/year-4/8.07/8-07-problem-set-4.mdx
calcs:
  # ---- Introduction

  - id: points-mit
    where: 'How to answer: MIT''s points, 15 + 25 + 15 + 15 + 15 + 20'
    formula: |-
      15 + 25 + 15 + 15 + 15 + 20
    expected: '105'
    shown: ['105 points in all']
    source: {cite: mit, at: 'Problems 1 to 6, pp. 1–2'}
    origin: mit

  # ---- Problem 1: the box

  - id: p1-centre
    kind: identity
    answer: p1-centre
    where: 'Problem 1(a), answer box: the potential at the centre, against the form V0/(2 cosh(πh/(√2 L)))'
    formula: |-
      V0*sinh(pi*h/(sqrt(2)*L))/sinh(sqrt(2)*pi*h/L)
    equals: |-
      V0/(2*cosh(pi*h/(sqrt(2)*L)))
    samples:
      V0: [1.0, 1.5, 2.0, 2.5, 3.0]
      h: [0.5, 2.0, 1.2, 0.8, 1.6]
      L: [2.0, 0.5, 1.0, 1.7, 0.9]
    tolerance: 1e-10
    shown: ['id="p1-centre"', '<Formula label="The potential at the centre of the box"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-laplace
    kind: identity
    where: 'Problem 1(a): the z factor sinh(√2 πz/L) has the second derivative (2π²/L²) times itself (numerical derivative), which cancels the −2π²/L² from the two sines'
    formula: |-
      deriv('sinh(sqrt(2)*pi*s/L)', 's', z, 2)
    equals: |-
      2*pi**2/L**2*sinh(sqrt(2)*pi*z/L)
    samples:
      z: [0.2, 0.5, 0.8, 1.1, 0.4]
      L: [1.0, 1.5, 2.0, 1.2, 0.8]
    tolerance: 1e-5
    shown: ['<Formula label="The potential in the box for the single pattern"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-arg
    where: 'Problem 1(a): π/√2'
    formula: |-
      pi/sqrt(2)
    expected: '2.221'
    shown: ['$\pi/\sqrt2 = 2.221$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-cosh
    where: 'Problem 1(a): cosh(π/√2)'
    formula: |-
      cosh(pi/sqrt(2))
    expected: '4.665'
    shown: ['$\cosh 2.221 = 4.665$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-cube
    answer: p1-cube
    where: 'Problem 1(a), answer box: the potential at the centre of the cube over V0, as the ratio of hyperbolic sines (the page uses 1/(2 cosh))'
    formula: |-
      sinh(pi/sqrt(2))/sinh(sqrt(2)*pi)
    expected: '0.107'
    shown: ['id="p1-cube"', 'so $V_{\text{centre}} = 0.107\,V_0$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-coef
    kind: identity
    answer: p1-coef
    where: 'Problem 1(b), answer box: the coefficient, against (4/L²) times the two integrals over the lid done numerically (L = 1)'
    formula: |-
      32*V0/(n*m*pi**2)
    equals: |-
      4*V0*(integrate('sin(n*pi*s)', 's', 0, 0.5) - integrate('sin(n*pi*s)', 's', 0.5, 1))*integrate('sin(m*pi*s)', 's', 0, 1)
    samples:
      V0: [1.0, 1.5, 2.0, 2.5, 3.0]
      n: [2, 6, 2, 6, 10]
      m: [1, 3, 5, 1, 3]
    tolerance: 1e-7
    shown: ['id="p1-coef"', '<Formula label="The coefficients for the lid in two strips"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-n2
    where: 'Problem 1(b), choice box: the integral over x for n = 2, times nπ/L (L = 1), numerically: the bracket is 4'
    formula: |-
      2*pi*(integrate('sin(2*pi*s)', 's', 0, 0.5) - integrate('sin(2*pi*s)', 's', 0.5, 1))
    expected: '4'
    tolerance: 1e-7
    shown: ['it is $1 + 2 + 1 = 4$ for']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-n4
    where: 'Problem 1(b), choice box: the same for n = 4: the bracket is 0'
    formula: |-
      4*pi*(integrate('sin(4*pi*s)', 's', 0, 0.5) - integrate('sin(4*pi*s)', 's', 0.5, 1))
    expected: '0'
    tolerance: 1e-7
    shown: ['it is $1 - 2 + 1 = 0$ when']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-n3
    where: 'Problem 1(b), choice box: the same for n = 3: the bracket is 0'
    formula: |-
      3*pi*(integrate('sin(3*pi*s)', 's', 0, 0.5) - integrate('sin(3*pi*s)', 's', 0.5, 1))
    expected: '0'
    tolerance: 1e-7
    shown: ['The bracket is $0$ for odd $n$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-c21
    where: 'Problem 1(c): c_21 over V0'
    formula: |-
      32/(2*pi**2)
    expected: '1.621'
    shown: ['32V_0/(2\pi^2) = 1.621\,V_0$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-g21
    where: 'Problem 1(c): γ_21 L/2 = √5 π/2'
    formula: |-
      sqrt(5)*pi/2
    expected: '3.512'
    shown: ['\sqrt5\,\pi/2 = 3.512$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-cosh21
    where: 'Problem 1(c): cosh(√5 π/2)'
    formula: |-
      cosh(sqrt(5)*pi/2)
    expected: '16.78'
    shown: ['$\cosh 3.512 = 16.78$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-term21
    where: 'Problem 1(c): the term n = 2, m = 1 at the point (L/4, L/2, L/2), over V0, with the ratio of hyperbolic sines'
    formula: |-
      32/(2*pi**2)*sinh(sqrt(5)*pi/2)/sinh(sqrt(5)*pi)*sin(2*pi/4)*sin(pi/2)
    expected: '0.0483'
    shown: ['(2 \times 16.78) = 0.0483\,V_0$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-c23
    where: 'Problem 1(c): c_23 over V0'
    formula: |-
      32/(6*pi**2)
    expected: '0.540'
    shown: ['32V_0/(6\pi^2) = 0.540\,V_0$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-g23
    where: 'Problem 1(c): γ_23 L/2 = √13 π/2'
    formula: |-
      sqrt(13)*pi/2
    expected: '5.664'
    shown: ['\sqrt{13}\,\pi/2 = 5.664$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-cosh23
    where: 'Problem 1(c): cosh(√13 π/2)'
    formula: |-
      cosh(sqrt(13)*pi/2)
    expected: '144.1'
    shown: ['$\cosh 5.664 = 144.1$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-term23
    where: 'Problem 1(c): the term n = 2, m = 3 at the point, over V0'
    formula: |-
      32/(6*pi**2)*sinh(sqrt(13)*pi/2)/sinh(sqrt(13)*pi)*sin(2*pi/4)*sin(3*pi/2)
    expected: '-0.0019'
    shown: ['(2 \times 144.1) = -0.0019\,V_0$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-term61
    where: 'Problem 1(c): the term n = 6, m = 1 at the point, over V0'
    formula: |-
      32/(6*pi**2)*sinh(sqrt(37)*pi/2)/sinh(sqrt(37)*pi)*sin(6*pi/4)*sin(pi/2)
    expected: '-0.00004'
    shown: ['is $-0.00004\,V_0$, and the rest are smaller still']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-point
    answer: p1-point
    where: 'Problem 1(c), answer box: the six largest terms of the series at (L/4, L/2, L/2) in the cube, over V0: (n, m) = (2,1), (2,3), (6,1), (2,5), (6,3), (10,1)'
    formula: |-
      32/pi**2*(sinh(sqrt(5)*pi/2)/sinh(sqrt(5)*pi)/2 - sinh(sqrt(13)*pi/2)/sinh(sqrt(13)*pi)/6 - sinh(sqrt(37)*pi/2)/sinh(sqrt(37)*pi)/6 + sinh(sqrt(29)*pi/2)/sinh(sqrt(29)*pi)/10 + sinh(sqrt(45)*pi/2)/sinh(sqrt(45)*pi)/18 + sinh(sqrt(101)*pi/2)/sinh(sqrt(101)*pi)/10)
    expected: '0.0465'
    shown: ['id="p1-point"', '+ \cdots\right)V_0 = 0.0465\,V_0']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own problem)'}
    origin: page-own

  - id: p1-first-alone
    where: 'Problem 1(c): the first term alone against the sum, 0.0483/0.0465 − 1'
    formula: |-
      0.0483/0.0465 - 1
    expected: '0.04'
    shown: ['The first term alone is 4% too large']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: the sphere and the plane

  - id: p2-q2
    kind: identity
    answer: p2-q2
    where: 'Problem 2(b), answer box: q2 against a root search for the charge at z2 that cancels the potential of q1 = −q0 at the top of the sphere (distances 2 z0 + R and R + R²/(2 z0))'
    formula: |-
      q0*R/(2*z0)
    equals: |-
      solve('-q0/(2*z0 + R) + x/(R + R**2/(2*z0))', 'x', 0, 10)
    samples:
      q0: [0.5, 1.0, 1.5, 2.2, 3.0]
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
    tolerance: 1e-7
    shown: ['id="p2-q2"']
    source: {cite: mit, at: 'Problem 2(b), p. 1'}
    origin: mit

  - id: p2-z2
    kind: identity
    answer: p2-z2
    where: 'Problem 2(b), answer box: z2 against a root search for the distance s below the centre at which the ratio of distances to q2 and to q1 is the same at the top and at the bottom of the sphere'
    formula: |-
      z0 - R**2/(2*z0)
    equals: |-
      z0 - solve('(R + s)/(2*z0 + R) - (R - s)/(2*z0 - R)', 's', 0, R)
    samples:
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
    tolerance: 1e-7
    shown: ['id="p2-z2"', '<Formula label="The second image charge"']
    source: {cite: mit, at: 'Problem 2(b), p. 1'}
    origin: mit

  - id: p2-q4
    kind: identity
    answer: p2-q4
    where: 'Problem 2(b), answer box: q4 against a root search for the charge at z4 that cancels the potential of q3 = −q0 R/(2 z0) at the top of the sphere (q3 is at the distance d3 = 2 z0 − R²/(2 z0) from the centre)'
    formula: |-
      q0*R**2/(4*z0**2 - R**2)
    equals: |-
      solve('-(q0*R/(2*z0))/(2*z0 - R**2/(2*z0) + R) + x/(R + R**2/(2*z0 - R**2/(2*z0)))', 'x', 0, 10)
    samples:
      q0: [0.5, 1.0, 1.5, 2.2, 3.0]
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
    tolerance: 1e-7
    shown: ['id="p2-q4"']
    source: {cite: mit, at: 'Problem 2(b), p. 1'}
    origin: mit

  - id: p2-z4
    kind: identity
    answer: p2-z4
    where: 'Problem 2(b), answer box: z4 against a root search for the distance s below the centre at which the ratio of distances to q4 and to q3 is the same at the top and at the bottom of the sphere'
    formula: |-
      z0 - 2*z0*R**2/(4*z0**2 - R**2)
    equals: |-
      z0 - solve('(R + s)/(2*z0 - R**2/(2*z0) + R) - (R - s)/(2*z0 - R**2/(2*z0) - R)', 's', 0, R)
    samples:
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
    tolerance: 1e-7
    shown: ['id="p2-z4"', '<Formula label="The fourth image charge"']
    source: {cite: mit, at: 'Problem 2(b), p. 1'}
    origin: mit

  - id: p2-d3
    kind: identity
    where: 'Problem 2(b): the distance of q3 from the centre, z0 + z2, against (4 z0² − R²)/(2 z0)'
    formula: |-
      (4*z0**2 - R**2)/(2*z0)
    equals: |-
      z0 + (z0 - R**2/(2*z0))
    samples:
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
    tolerance: 1e-12
    shown: ['<Formula label="The distance of the third image from the centre of the sphere"']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p2-check-z2
    where: 'Problem 2(b), check: z2/R for z0 = 2R'
    formula: |-
      2 - 1/(2*2)
    expected: '1.75'
    shown: ['$q_2 = q_0/4$ at $z_2 = 1.75R$']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own check)'}
    origin: page-own

  - id: p2-check-q4
    where: 'Problem 2(b), check: q0/q4 for z0 = 2R'
    formula: |-
      4*2**2 - 1
    expected: '15'
    shown: ['$q_4 = q_0/15$ at']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own check)'}
    origin: page-own

  - id: p2-check-z4
    where: 'Problem 2(b), check: z4/R for z0 = 2R'
    formula: |-
      2 - 2*2/(4*2**2 - 1)
    expected: '1.733'
    shown: ['at $z_4 = 1.733R$']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own check)'}
    origin: page-own

  - id: p2-check-ratio
    where: 'Problem 2(b), check: q2/q4 for z0 = 2R is 15/4, about 4'
    formula: |-
      (1/4)/(1/15)
    expected: '4'
    tolerance: 0.5
    shown: ['shrink by a factor of about 4']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own check)'}
    origin: page-own

  - id: p2-v
    kind: identity
    answer: p2-v
    where: 'Problem 2(c), answer box: the potential of the five charges q0 to q4 added up at a point of the sphere, at the angle tt from its top (numerically the same at every angle)'
    formula: |-
      q0/(4*pi*eps0*R)
    equals: |-
      (q0/R - q0/sqrt((R*sin(tt))**2 + (2*z0 + R*cos(tt))**2) + (q0*R/(2*z0))/sqrt((R*sin(tt))**2 + (R*cos(tt) + R**2/(2*z0))**2) - (q0*R/(2*z0))/sqrt((R*sin(tt))**2 + (2*z0 - R**2/(2*z0) + R*cos(tt))**2) + (q0*R**2/(4*z0**2 - R**2))/sqrt((R*sin(tt))**2 + (R*cos(tt) + 2*z0*R**2/(4*z0**2 - R**2))**2))/(4*pi*eps0)
    samples:
      q0: [0.5, 1.0, 1.5, 2.2, 3.0]
      eps0: [0.5, 2.0, 1.0, 1.4, 0.8]
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
      tt: [0.0, 0.7, 1.6, 2.4, 3.1]
    tolerance: 1e-10
    shown: ['id="p2-v"', '<Formula label="The potential of the sphere after four images"']
    source: {cite: mit, at: 'Problem 2(c), p. 1'}
    origin: mit

  - id: p2-plane-first
    where: 'Problem 2(c), check: the potential at the origin from q0 alone over V0, R/z0 for z0 = 2R'
    formula: |-
      1/2
    expected: '0.5'
    shown: ['= 0.5\,V_0$ with $q_0$ alone']
    source: {cite: mit, at: 'Problem 2(c), p. 1 (our own check)'}
    origin: page-own

  - id: p2-plane-after
    where: 'Problem 2(c), check: the potential at the origin from all five charges over V0, for z0 = 2R (R = 1): q0 and q1, q2 and q3 cancel in pairs'
    formula: |-
      1/2 - 1/2 + (1/4)/1.75 - (1/4)/1.75 + (1/15)/(2 - 4/15)
    expected: '0.038'
    shown: ['V_0\,(1/15)/1.733 = 0.038\,V_0$']
    source: {cite: mit, at: 'Problem 2(c), p. 1 (our own check)'}
    origin: page-own

  - id: p2-w
    kind: identity
    answer: p2-w
    where: 'Problem 2(d), answer box: the energy against (1/2) C V0² with the first three terms of the closed series for the capacitance of a sphere and a plane, C = 4πε0 R sinh β Σ 1/sinh(nβ), cosh β = z0/R'
    formula: |-
      2*pi*eps0*R*V0**2*(1 + R/(2*z0) + R**2/(4*z0**2 - R**2))
    equals: |-
      2*pi*eps0*R*V0**2*sinh(acosh(z0/R))*(1/sinh(acosh(z0/R)) + 1/sinh(2*acosh(z0/R)) + 1/sinh(3*acosh(z0/R)))
    samples:
      eps0: [0.5, 2.0, 1.0, 1.4, 0.8]
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      z0: [1.5, 3.0, 2.0, 2.6, 1.8]
      V0: [1.0, 1.5, 2.0, 2.5, 3.0]
    tolerance: 1e-10
    shown: ['id="p2-w"', '<Formula label="The energy of the sphere and the plane"']
    source: {cite: mit, at: 'Problem 2(d), p. 1'}
    origin: mit

  - id: p2-w-pref
    where: 'Problem 2(d): 2π ε0 R V0² for R = 5.0 cm, V0 = 600 V'
    inputs: {eps0: 8.8541878128e-12 F/m, R: 5.0 cm, V0: 600 V}
    formula: |-
      2*pi*eps0*R*V0**2
    expected: 1.001e-6 J
    shown: ['\times 600^2 = 1.001 \times 10^{-6}$ J']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-w-bracket
    where: 'Problem 2(d): the bracket for R = 5.0 cm, z0 = 10 cm'
    formula: |-
      1 + 5/(2*10) + 5**2/(4*10**2 - 5**2)
    expected: '1.317'
    shown: ['$1 + 0.25 + 0.0667 = 1.317$']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-wnum
    answer: p2-wnum
    where: 'Problem 2(d), answer box: (1/2)(q0 + q2 + q4) V0 for R = 5.0 cm, z0 = 10 cm, V0 = 600 V, with q0 = 4π ε0 R V0'
    inputs: {eps0: 8.8541878128e-12 F/m, R: 5.0 cm, z0: 10 cm, V0: 600 V}
    formula: |-
      0.5*V0*(4*pi*eps0*R*V0)*(1 + R/(2*z0) + R**2/(4*z0**2 - R**2))
    expected: 1.32 microjoule
    shown: ['id="p2-wnum"', 'So $W = 1.32$ µJ.']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own addition)'}
    origin: page-own

  - id: p2-exact
    where: 'Problem 2(d), check: the full series sinh β Σ 1/sinh(nβ) for z0 = 2R (cosh β = 2), twelve terms'
    formula: |-
      sinh(acosh(2))*(1/sinh(acosh(2)) + 1/sinh(2*acosh(2)) + 1/sinh(3*acosh(2)) + 1/sinh(4*acosh(2)) + 1/sinh(5*acosh(2)) + 1/sinh(6*acosh(2)) + 1/sinh(7*acosh(2)) + 1/sinh(8*acosh(2)) + 1/sinh(9*acosh(2)) + 1/sinh(10*acosh(2)) + 1/sinh(11*acosh(2)) + 1/sinh(12*acosh(2)))
    expected: '1.341'
    shown: ['gives the bracket 1.341']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own remark)'}
    origin: page-own

  - id: p2-within
    where: 'Problem 2(d), check: the three terms for z0 = 2R against the full series, 1 − 1.3167/1.3411'
    formula: |-
      1 - (1 + 1/4 + 1/15)/1.3411
    expected: '0.02'
    tolerance: 0.005
    shown: ['are within 2% of the full answer']
    source: {cite: mit, at: 'Problem 2(d), p. 1 (our own remark)'}
    origin: page-own

  # ---- Problem 3: the spherical cavity

  - id: p3-y11-norm
    where: 'Problem 3(b): Y_11 as written is normalised: (3/(8π)) times the integral of sin³θ over θ, times 2π'
    formula: |-
      3/(8*pi)*integrate('sin(s)**3', 's', 0, pi)*2*pi
    expected: '1'
    tolerance: 1e-7
    shown: ['<Formula label="The spherical harmonics of degree 1 with m = ±1"']
    source: {cite: reading3, at: 'eqs. (8.36) and (8.37), p. 7'}
