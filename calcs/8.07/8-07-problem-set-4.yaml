  # ---- Problem 4: the charged metal sphere in a uniform field

  - id: p4-v
    kind: identity
    answer: p4-v
    where: 'Problem 4(a), answer box: the potential against the value on the sphere, Q/(4πε0 R), minus the integral of the radial field of part (b) from R to r (numerical)'
    formula: |-
      -E0*r*cos(th) + E0*R**3*cos(th)/r**2 + Q/(4*pi*eps0*r)
    equals: |-
      Q/(4*pi*eps0*R) - integrate('E0*(1 + 2*R**3/s**3)*cos(th) + Q/(4*pi*eps0*s**2)', 's', R, r)
    samples:
      E0: [0.5, 1.0, 1.5, 2.0, 0.8]
      r: [1.2, 3.0, 2.0, 1.6, 2.5]
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
      th: [0.3, 1.4, 0.8, 1.1, 0.5]
      Q: [0.5, 3.0, 1.5, 2.2, 1.0]
      eps0: [0.5, 2.0, 1.0, 1.4, 0.8]
    tolerance: 1e-7
    shown: ['id="p4-v"', '<Formula label="The potential outside the charged sphere in a uniform field"']
    source: {cite: mit, at: 'Problem 4, p. 2 (our own problem)'}
    origin: page-own

  - id: p4-laplace
    kind: identity
    where: 'Problem 4(a): the ℓ = 1 radial function f = −(r − R³/r²) obeys d/dr(r² f′) = 2 f (numerical derivative of r² f′, with f′ = −(1 + 2R³/r³))'
    formula: |-
      deriv('s**2*(-(1 + 2*R**3/s**3))', 's', r)
    equals: |-
      2*(-(r - R**3/r**2))
    samples:
      r: [1.2, 3.0, 2.0, 1.6, 2.5]
      R: [0.5, 1.0, 0.7, 0.9, 0.6]
    tolerance: 1e-6
    shown: ['$-E_0R + B_1/R^2 = 0$']
    source: {cite: reading2, at: 'eqs. (7.2) and (7.4), p. 1'}
    origin: page-own

  - id: p4-sigma
    kind: identity
    answer: p4-sigma
    where: 'Problem 4(b), answer box: the surface charge against −ε0 times the numerical radial derivative of the potential of part (a) at r = R'
    formula: |-
      3*eps0*E0*cos(th) + Q/(4*pi*R**2)
    equals: |-
      -eps0*deriv('-E0*s*cos(th) + E0*R**3*cos(th)/s**2 + Q/(4*pi*eps0*s)', 's', R)
