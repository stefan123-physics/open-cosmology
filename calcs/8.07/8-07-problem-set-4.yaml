    samples:
      q: [0.5, 3.0, 1.5, 2.2, 1.0]
      b: [2.5, 4.0, 3.0, 3.6, 2.8]
      R: [1.0, 2.0, 1.5, 1.2, 1.8]
      eps0: [0.5, 2.0, 1.0, 1.4, 0.8]
    tolerance: 1e-6
    shown: ['id="p6-out"', '<Formula label="The average field of a charge outside the ball"']
    source: {cite: mit, at: 'Problem 6, p. 2 (our own problem)'}
    origin: page-own

