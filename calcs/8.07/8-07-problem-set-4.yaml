  # ---- Problem 6: the average field over a ball

  - id: p6-in
    kind: identity
    answer: p6-in
    where: 'Problem 6(b), answer box: the z component of the field of q (on the z axis at height b < R) averaged over the ball. The integral over each disk at height s is done in closed form, 2π[sign(s − b) − (s − b)/√(R² + b² − 2bs)]; the integral of the sign over the heights is −2b, and the rest is integrated numerically'
    formula: |-
      -q*b/(4*pi*eps0*R**3)
    equals: |-
      q/(4*pi*eps0)*3/(4*pi*R**3)*2*pi*(-2*b - integrate('(s - b)/sqrt(R**2 + b**2 - 2*b*s)', 's', -R, R))
    samples:
      q: [0.5, 3.0, 1.5, 2.2, 1.0]
      b: [0.2, 0.9, 0.5, 0.7, 0.35]
      R: [1.0, 2.0, 1.5, 1.2, 1.8]
      eps0: [0.5, 2.0, 1.0, 1.4, 0.8]
    tolerance: 1e-6
    shown: ['id="p6-in"', '<Formula label="The average field of a charge inside the ball"']
    source: {cite: mit, at: 'Problem 6, p. 2 (our own problem)'}
    origin: page-own

  - id: p6-out
    kind: identity
    answer: p6-out
