# Calculations on content/year-4/8.07/multipole-expansion-traceless-tensors.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.07 (Fall 2012) Lecture Notes 9, "Traceless Symmetric Tensor Approach to Legendre Polynomials and Spherical
# Harmonics" (Guth, typed, October 17, 2012), Section 7, eqs. (9.46)-(9.74), pp. 11-16. The notes quote no numbers.
# Page's own worked example: +2q at z = +d and -q at z = -d, q = 1 nC, d = 1 cm, seen from r = 10 cm.
# k = 1/(4 pi eps0) with eps0 = 8.8541878128e-12 F/m (CODATA 2018).

page: content/year-4/8.07/multipole-expansion-traceless-tensors.mdx
calcs:
  # ---------------------------------------------------------------- Griffiths' route
  - id: law-of-cosines
    kind: identity
    where: 'eq. (9.48): |r - r''|^2 = r^2 + r''^2 - 2 r r'' cos(theta''), with r along z and r'' at angle th in the x-z plane'
    formula: 1/sqrt((rr - rp*cos(th))**2 + (rp*sin(th))**2)
    equals: 1/sqrt(rr**2 + rp**2 - 2*rr*rp*cos(th))
    samples: {rr: [1.0, 2.5, 0.7], rp: [0.3, 1.0, 0.2], th: [0.4, 2.0, 3.0]}
    tolerance: 1e-12
    shown: ['$\theta''$ the angle between them,']
    source: {cite: reading1, at: 'eq. (9.48)'}
    origin: mit

  - id: generating-function
    kind: identity
    where: 'eq. (9.50): 1/sqrt(1 + lam^2 - 2 lam x) = sum lam^l P_l(x), checked to l = 5 at lam = 0.05 (the rest is of order lam^6)'
    formula: 1/sqrt(1 + lam**2 - 2*lam*xx)
    equals: 1 + lam*xx + lam**2*(3*xx**2 - 1)/2 + lam**3*(5*xx**3 - 3*xx)/2 + lam**4*(35*xx**4 - 30*xx**2 + 3)/8 + lam**5*(63*xx**5 - 70*xx**3 + 15*xx)/8
    samples: {lam: [0.05, 0.05, 0.05], xx: [0.3, -0.8, 1.0]}
    tolerance: 1e-7
    shown: ['meaning that its power series in $\lambda$ has them as coefficients:']
    source: {cite: reading1, at: 'eq. (9.50)'}
    origin: mit

  # ---------------------------------------------------------------- derivatives of 1/r
  - id: deriv-r
    kind: identity
    where: 'eq. (9.63): d r/d x = x/r = n_x (numerical derivative)'
    formula: deriv('sqrt(t**2 + yy**2 + zz**2)', 't', xx)
    equals: xx/sqrt(xx**2 + yy**2 + zz**2)
    samples: {xx: [0.3, 1.0, -0.6], yy: [0.5, -0.2, 0.9], zz: [1.2, 0.4, 0.1]}
    tolerance: 1e-6
    shown: ['The two basic derivatives are (notes p. 14)']
    source: {cite: reading1, at: 'eq. (9.63)'}
    origin: mit

  - id: deriv-n
    kind: identity
    where: 'eq. (9.63): d n_y / d x = (delta_xy - n_x n_y)/r = -n_x n_y / r (numerical derivative)'
    formula: deriv('yy/sqrt(t**2 + yy**2 + zz**2)', 't', xx)
    equals: -(xx*yy/(xx**2 + yy**2 + zz**2))/sqrt(xx**2 + yy**2 + zz**2)
    samples: {xx: [0.3, 1.0, -0.6], yy: [0.5, -0.2, 0.9], zz: [1.2, 0.4, 0.1]}
    tolerance: 1e-6
    shown: ['= \frac{1}{r}\left(\delta_{ij} - \hat n_i\hat n_j\right)" cite="reading1" at="eq. (9.63)"']
    source: {cite: reading1, at: 'eq. (9.63)'}
    origin: mit

  - id: deriv1-inv-r
    kind: identity
    where: 'eq. (9.64), first: d(1/r)/dx = -n_x/r^2 (numerical derivative)'
    formula: deriv('1/sqrt(t**2 + yy**2 + zz**2)', 't', xx)
    equals: -(xx/sqrt(xx**2 + yy**2 + zz**2))/(xx**2 + yy**2 + zz**2)
    samples: {xx: [0.3, 1.0, -0.6], yy: [0.5, -0.2, 0.9], zz: [1.2, 0.4, 0.1]}
    tolerance: 1e-6
    shown: ['With these it is straightforward to differentiate $1/r$ again and again:']
    source: {cite: reading1, at: 'eq. (9.64)'}
    origin: mit

  - id: deriv2-inv-r
    kind: identity
    where: 'eq. (9.64), second, for i = j = x: d^2(1/r)/dx^2 = 3 {n_x n_x}/r^3 = (3 n_x^2 - 1)/r^3 (numerical derivative)'
    formula: deriv('1/sqrt(t**2 + yy**2 + zz**2)', 't', xx, 2)
    equals: (3*xx**2/(xx**2 + yy**2 + zz**2) - 1)/(xx**2 + yy**2 + zz**2)**1.5
    samples: {xx: [0.3, 1.0, -0.6], yy: [0.5, -0.2, 0.9], zz: [1.2, 0.4, 0.1]}
    tolerance: 1e-4
    shown: ['which is $3\{\hat n_i\hat n_j\}/r^3$']
    source: {cite: reading1, at: 'eq. (9.64)'}
    origin: mit

  - id: deriv3-inv-r
    kind: identity
    where: 'eq. (9.64), third, for i = j = k = x: d/dx of (3 n_x^2 - 1)/r^3 = -15 (n_x^3 - (3/5) n_x)/r^4, the traceless part {n_x n_x n_x} (numerical derivative)'
    formula: deriv('(3*t**2/(t**2 + yy**2 + zz**2) - 1)/(t**2 + yy**2 + zz**2)**1.5', 't', xx)
    equals: -15*((xx**3/(xx**2 + yy**2 + zz**2)**1.5) - 3/5*xx/sqrt(xx**2 + yy**2 + zz**2))/(xx**2 + yy**2 + zz**2)**2
    samples: {xx: [0.3, 1.0, -0.6], yy: [0.5, -0.2, 0.9], zz: [1.2, 0.4, 0.1]}
    tolerance: 1e-5
    shown: ['-\frac{5 \cdot 3}{r^4}']
    source: {cite: reading1, at: 'eq. (9.64)'}
    origin: mit

  - id: deriv2-mixed-trace
    kind: identity
    where: 'eq. (9.60) for l = 2: the trace of (3 n_i n_j - delta_ij)/r^3 is (3 - 3)/r^3 = 0 (sum of the three second derivatives, numerically; checked as that plus 1)'
    formula: deriv('1/sqrt(t**2 + yy**2 + zz**2)', 't', xx, 2) + deriv('1/sqrt(xx**2 + t**2 + zz**2)', 't', yy, 2) + deriv('1/sqrt(xx**2 + yy**2 + t**2)', 't', zz, 2) + 1
    equals: 1
    samples: {xx: [0.3, 1.0, -0.6], yy: [0.5, -0.2, 0.9], zz: [1.2, 0.4, 0.1]}
    tolerance: 1e-4
    shown: ['because $\nabla^2(1/r) = 0$ everywhere except at $r = 0$']
    source: {cite: reading1, at: 'eq. (9.60)'}
    origin: mit

  # ---------------------------------------------------------------- double factorial and coefficients
  - id: double-factorial-3
    kind: value
    where: 'eq. (9.66) for l = 3: (2l)!/(2^l l!) = 720/(8 x 6) = 15 = 5 x 3 x 1'
    formula: 720/(8*6)
    expected: '15'
    shown: ['So $3!! = 3$ and $5!! = 15$']
    source: {cite: reading1, at: 'eq. (9.66)'}
    origin: page-own

  - id: double-factorial-2
    kind: value
    where: 'eq. (9.66) for l = 2: 4!/(2^2 2!) = 24/8 = 3'
    formula: 24/(4*2)
    expected: '3'
    shown: ['the factors 3 and $5 \cdot 3$ above']
    source: {cite: reading1, at: 'eq. (9.66)'}
    origin: page-own

  - id: coefficient-identity
    kind: identity
    where: 'eq. (9.70): (2l - 1)!!/l! = (2l)!/(2^l (l!)^2), using (2l - 1)!! = (2l)!/(2^l l!), for l = 1..4 with the factorials written out'
    formula: DF/LF
    equals: F2L/(2**LL*LF**2)
    samples: {LL: [1, 2, 3, 4], DF: [1, 3, 15, 105], LF: [1, 2, 6, 24], F2L: [2, 24, 720, 40320]}
    tolerance: 1e-12
    shown: ['the same number that turns the traceless tensors into Legendre polynomials']
    source: {cite: reading1, at: 'eq. (9.70)'}
    origin: mit

  - id: quiz-octupole-coefficient
    kind: value
    where: 'quiz 2: (2l - 1)!!/l! for l = 3, 15/6 = 720/288'
    formula: 15/6
    expected: '2.5'
    shown: ['so the coefficient is $15/6 = 5/2$']
    source: {cite: reading1, at: 'eq. (9.70)'}
    origin: page-own

  - id: quiz-octupole-distractor
    kind: value
    where: 'quiz 2, wrong choice: (2l)!/(2^l l!)^2 = 720/48^2 = 5/16'
    formula: 720/(8*6)**2
    expected: '0.3125'
    shown: ['and $5/16$ squares the whole denominator']
    source: {cite: reading1, at: 'eq. (9.70)'}
    origin: page-own

  - id: quadrupole-convention
    kind: identity
    where: 'remark after eq. (9.74): (3/2)(x_i x_j - r^2 delta_ij/3) = (1/2)(3 x_i x_j - r^2 delta_ij), for i = j and for i != j'
    formula: 3/2*(xi*xj - r2*dij/3)
    equals: (3*xi*xj - r2*dij)/2
    samples: {xi: [0.3, 1.0], xj: [0.3, -0.4], r2: [1.5, 2.0], dij: [1.0, 0.0]}
    tolerance: 1e-12
    shown: ['which is half of the quadrupole moment tensor']
    source: {cite: reading1, at: 'eq. (9.69)'}
    origin: page-own

  # ---------------------------------------------------------------- worked example
  - id: example-dipole
    kind: value
    where: 'worked example: p = 2q d + (-q)(-d) = 3 q d with q = 1 nC, d = 0.01 m (C m)'
    inputs: {qq: 1e-9, dd: 0.01}
    formula: 3*qq*dd
    expected: '3e-11'
    shown: ['which is $3 \times 10^{-11}$ C m']
    source: {cite: reading1, at: 'eq. (9.74)'}
    origin: page-own

  - id: example-quadrupole-p2
    kind: identity
    where: 'worked example: (3/2) q d^2 (cos^2 - 1/3) = q d^2 P2(cos)'
    formula: 3/2*(cc**2 - 1/3)
    equals: (3*cc**2 - 1)/2
    samples: {cc: [0.0, 1.0, 0.4]}
    tolerance: 1e-12
    shown: ['= q d^2 P_2(\cos\theta)$.']
    source: {cite: reading1, at: 'eq. (9.69)'}
    origin: page-own

  - id: example-unit
    kind: value
    where: 'worked example: q/(4 pi eps0 d) with q = 1 nC, d = 0.01 m (V)'
    inputs: {qq: 1e-9, dd: 0.01}
    formula: qq/(4*pi*8.8541878128e-12*dd)
    expected: '898.8'
    shown: ['With $q/(4\pi\varepsilon_0 d) = 898.8$ V']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-mono
    kind: value
    where: 'worked example: monopole term at r = 10 cm, k q/r (V)'
    inputs: {qq: 1e-9, rr: 0.1}
    formula: qq/(4*pi*8.8541878128e-12*rr)
    expected: '89.88'
    shown: ['are 89.88 V, 26.96 V and 0.90 V']
    source: {cite: reading1, at: 'eq. (9.71)'}
    origin: page-own

  - id: example-dip-axis
    kind: value
    where: 'worked example: dipole term on the axis, k 3 q d / r^2 (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: 3*qq*dd/(4*pi*8.8541878128e-12*rr**2)
    expected: '26.96'
    shown: ['89.88 V, 26.96 V and 0.90 V, adding up to']
    source: {cite: reading1, at: 'eq. (9.73)'}
    origin: page-own

  - id: example-quad-axis
    kind: value
    where: 'worked example: quadrupole term on the axis, k q d^2 / r^3 (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq*dd**2/(4*pi*8.8541878128e-12*rr**3)
    expected: '0.90'
    shown: ['26.96 V and 0.90 V, adding up to 117.74 V']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-sum-axis
    kind: value
    where: 'worked example: three terms on the axis, k q (1/r + 3d/r^2 + d^2/r^3) (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq*(1/rr + 3*dd/rr**2 + dd**2/rr**3)/(4*pi*8.8541878128e-12)
    expected: '117.74'
    shown: ['adding up to 117.74 V. In the plane']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-quad-plane
    kind: value
    where: 'worked example: quadrupole term in the plane z = 0, k q d^2 (-1/2)/r^3 (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: -qq*dd**2/(2*4*pi*8.8541878128e-12*rr**3)
    expected: '-0.45'
    shown: ['the terms are 89.88 V and $-0.45$ V']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-sum-plane
    kind: value
    where: 'worked example: series in the plane z = 0, k q (1/r - d^2/(2 r^3)) (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq*(1/rr - dd**2/(2*rr**3))/(4*pi*8.8541878128e-12)
    expected: '89.43'
    shown: ['a total of 89.43 V']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-exact-axis-ratio
    kind: value
    where: 'worked example: 2/9 - 1/11 = 13/99'
    formula: 2/9 - 1/11
    expected: '0.131313'
    tolerance: 1e-6
    shown: ['\frac{13}{99} = 118.02$ V']
    source: {cite: reading1, at: 'eq. (9.47)'}
    origin: page-own

  - id: example-exact-axis
    kind: value
    where: 'worked example: exact potential on the axis at 10 cm, k q (2/(r - d) - 1/(r + d)) (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq*(2/(rr - dd) - 1/(rr + dd))/(4*pi*8.8541878128e-12)
    expected: '118.02'
    shown: ['\frac{1}{11}\right) = 898.8 \times']
    source: {cite: reading1, at: 'eq. (9.47)'}
    origin: page-own

  - id: example-miss
    kind: value
    where: 'worked example: exact minus three terms on the axis (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq*(2/(rr - dd) - 1/(rr + dd) - 1/rr - 3*dd/rr**2 - dd**2/rr**3)/(4*pi*8.8541878128e-12)
    expected: '0.28'
    shown: ['The three terms miss by 0.28 V']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-miss-percent
    kind: value
    where: 'worked example: the miss as a fraction of the exact value, (13/99 - 0.131)/(13/99), in percent'
    formula: (13/99 - 0.131)/(13/99)*100
    expected: '0.24'
    shown: ['miss by 0.28 V, 0.24%']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: example-octupole
    kind: value
    where: 'worked example: octupole moment sum q d^3 = 2q d^3 - q(-d)^3 = 3 q d^3; on the axis k 3 q d^3/r^4 (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: (2*qq*dd**3 - qq*(-dd)**3)/(4*pi*8.8541878128e-12*rr**4)
    expected: '0.27'
    shown: ['0.27 V here']
    source: {cite: reading1, at: 'eq. (9.69)'}
    origin: page-own

  - id: example-octupole-tensor
    kind: identity
    where: 'worked example: (5!!/3!) x 3 q d^3 {zzz}.nnn = 3 q d^3 P3, since (5/2)(c^3 - 3c/5) = P3(c)'
    formula: 15/6*(cc**3 - 3*cc/5)
    equals: (5*cc**3 - 3*cc)/2
    samples: {cc: [0.0, 1.0, 0.4]}
    tolerance: 1e-12
    shown: ['3qd^3 P_3(\cos\theta)/r^4']
    source: {cite: reading1, at: 'eq. (9.69)'}
    origin: page-own

  - id: example-exact-plane
    kind: value
    where: 'worked example: exact potential in the plane z = 0, both charges at sqrt(r^2 + d^2) = sqrt(101) cm, k q / sqrt(r^2 + d^2) (V)'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq/(4*pi*8.8541878128e-12*sqrt(rr**2 + dd**2))
    expected: '89.43'
    shown: ['\frac{1}{\sqrt{101}} = 89.43$ V']
    source: {cite: reading1, at: 'eq. (9.47)'}
    origin: page-own

  - id: example-plane-agreement
    kind: value
    where: 'worked example: exact minus series in the plane z = 0 (V), about 0.003'
    inputs: {qq: 1e-9, dd: 0.01, rr: 0.1}
    formula: qq*(1/sqrt(rr**2 + dd**2) - 1/rr + dd**2/(2*rr**3))/(4*pi*8.8541878128e-12)
    expected: '0.003'
    shown: ['matches to about 0.003 V']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: plot-within
    kind: value
    where: 'plot caption: at r = 10 cm the three-term series is within 0.3% of the exact value (relative miss in percent)'
    formula: (13/99 - 0.131)/(13/99)*100
    expected: '0.3'
    tolerance: 0.1
    shown: ['by 10 cm it is within 0.3% of the exact value']
    source: {cite: reading1, at: 'eq. (9.68)'}
    origin: page-own

  - id: plot-monopole-low
    kind: value
    where: 'plot caption: the monopole alone at r = 10 cm is low by 1 - 0.1/(13/99), in percent'
    formula: (1 - 0.1/(13/99))*100
    expected: '24'
    shown: ['while the monopole alone is still 24% low']
    source: {cite: reading1, at: 'eq. (9.71)'}
    origin: page-own
