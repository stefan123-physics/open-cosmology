  # ---- Problem 6: reflection and transmission

  - id: p6-r
    kind: identity
    answer: p6-r
    where: 'Problem 6(a), answer box: R, against the square of t − 1, where t solves 2 = (1 + β)t (the two boundary conditions added), by a root search'
    formula: |-
      ((1 - b)/(1 + b))**2
    equals: |-
      (solve('2 - (1 + b)*x', 'x', 0, 5) - 1)**2
    samples:
      b: [1.5, 2.0, 3.0, 4.0, 2.7]
    tolerance: 1e-8
    shown: ['id="p6-r"', '<Formula label="The reflection coefficient"']
    source: {cite: mit, at: 'Problem 6, p. 2 (our own problem)'}
    origin: page-own

  - id: p6-t
