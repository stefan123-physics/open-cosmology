# Calculations on content/year-4/8.07/magnetic-multipole-expansion-dipoles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.07 (Fall 2012) Lecture Notes 10, "Magnetic Multipole Expansion and Magnetic Dipoles" (Guth, handwritten,
# Lecture 25, November 7, 2012), pp. 1-9. The notes have no numbered equations and quote no numbers except the 21 cm line.
# Page's own worked example: a loop along six edges of a cube, s = 4 cm, I = 3 A, field 50 cm from the centre along z.
# Plot: circular loop R = 5 cm, I = 2 A, field on the axis. mu0/4pi = 1e-7 T m/A (to 1e-10, enough here).

page: content/year-4/8.07/magnetic-multipole-expansion-dipoles.mdx
calcs:
  # ---------------------------------------------------------------- the expansion and current conservation
  - id: coefficient-l1
    kind: value
    where: 'p. 4: for l = 1 the coefficient (2l - 1)!!/l! = 1!!/1! = 1'
    formula: 1/1
    expected: '1'
    shown: ['For $\ell = 1$ the coefficient $(2\ell - 1)!!/\ell\,!$ is 1']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: loop-no-monopole
    kind: identity
    where: 'p. 3, l = 1 (int J d^3x = 0) for a circular wire loop of radius R: the x component of the closed integral of dl, -R sin(phi) dphi, vanishes (checked by adding 1 to the integrand: the integral is then 2 pi)'
    formula: integrate('-RR*sin(t) + 1', 't', 0, 2*pi)
    equals: 2*pi
    samples: {RR: [0.05, 1.0, 3.0]}
    tolerance: 1e-9
    shown: ['So there is no $1/r$ term in $\vec A$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: loop-symmetric-part
    kind: identity
    where: 'p. 3, l = 2: the symmetric part of the closed integral of x_i dl_j vanishes; for a circle, x dy + y dx = R^2 (cos^2 - sin^2) dphi integrates to 0 (checked by adding 1 to the integrand: the integral is then 2 pi)'
    formula: integrate('RR**2*(cos(t)**2 - sin(t)**2) + 1', 't', 0, 2*pi)
    equals: 2*pi
    samples: {RR: [0.05, 1.0, 3.0]}
    tolerance: 1e-9
    shown: ['The second identity says that the symmetric part of this $3 \times 3$ array vanishes.']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: loop-moment-area
    kind: identity
    where: 'p. 6: half the closed integral of r x dl is the area; for a circle the z component is (1/2) integral of (x dy - y dx) = (1/2) R^2 2 pi = pi R^2'
    formula: integrate('RR**2*(cos(t)**2 + sin(t)**2)/2', 't', 0, 2*pi)
    equals: pi*RR**2
    samples: {RR: [0.05, 1.0, 3.0]}
    tolerance: 1e-9
    shown: ['So half the line integral is the **vector area**']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  # ---------------------------------------------------------------- worked example: the skew loop
  - id: example-edge-sum-x
    kind: identity
    where: 'worked example: x component of the sum of P x Q over the six edges A(0,0,0) B(s,0,0) C(s,s,0) D(s,s,s) E(0,s,s) F(0,0,s), (P x Q)_x = Py Qz - Pz Qy, equals 2 s^2'
    formula: (0*0 - 0*0) + (0*0 - 0*ss) + (ss*ss - 0*ss) + (ss*ss - ss*ss) + (ss*ss - ss*0) + (0*0 - ss*0)
    equals: 2*ss**2
    samples: {ss: [0.04, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['adding up to $2s^2(1, -1, 1)$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: example-edge-sum-y
    kind: identity
    where: 'worked example: y component, (P x Q)_y = Pz Qx - Px Qz, summed over the same six edges, equals -2 s^2'
    formula: (0*ss - 0*0) + (0*ss - ss*0) + (0*ss - ss*ss) + (ss*0 - ss*ss) + (ss*0 - 0*ss) + (ss*0 - 0*0)
    equals: -2*ss**2
    samples: {ss: [0.04, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['The others give $s^2(0, 0, 1)$, $s^2(1, -1, 0)$, $s^2(0, -1, 1)$ and $s^2(1, 0, 0)$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: example-edge-sum-z
    kind: identity
    where: 'worked example: z component, (P x Q)_z = Px Qy - Py Qx, summed over the same six edges, equals 2 s^2'
    formula: (0*0 - 0*ss) + (ss*ss - 0*ss) + (ss*ss - ss*ss) + (ss*ss - ss*0) + (0*0 - ss*0) + (0*0 - 0*0)
    equals: 2*ss**2
    samples: {ss: [0.04, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['So $\vec m = \frac12 I \cdot 2s^2(1, -1, 1) = I s^2(1, -1, 1)$.']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: example-vector-area-length
    kind: identity
    where: 'worked example: |s^2 (1, -1, 1)| = sqrt(3) s^2'
    formula: sqrt(ss**4 + ss**4 + ss**4)
    equals: sqrt(3)*ss**2
    samples: {ss: [0.04, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['of length $\sqrt3\,s^2$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: example-m0
    kind: value
    where: 'worked example: I s^2 with I = 3 A, s = 0.04 m (A m^2)'
    inputs: {II: 3, ss: 0.04}
    formula: II*ss**2
    expected: '4.8e-3'
    shown: ['$I s^2 = 3 \times (0.04)^2 = 4.8 \times 10^{-3}$ A m²']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: example-m-magnitude
    kind: value
    where: 'worked example: |m| = sqrt(3) I s^2 (A m^2)'
    inputs: {II: 3, ss: 0.04}
    formula: sqrt(3)*II*ss**2
    expected: '8.31e-3'
    shown: ['$|\vec m| = 8.31 \times 10^{-3}$ A m²']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: example-dipole-bracket
    kind: value
    where: 'worked example: 3 (m . z) z - m for m = m0 (1, -1, 1): components (-1, 1, 2) m0 (checked as x + 10 y + 100 z = -1 + 10 + 200 = 209)'
    formula: (3*0*1 - 1) + 10*(3*0*1 - (-1)) + 100*(3*1*1 - 1)
    expected: '209'
    shown: ['= m_0(-1, 1, 2)$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-field-prefactor
    kind: value
    where: 'worked example: (mu0/4pi) m0 / r^3 with m0 = 4.8e-3 A m^2, r = 0.5 m, in nT'
    inputs: {m0: 4.8e-3, rr: 0.5}
    formula: 1e-7*m0/rr**3*1e9
    expected: '3.84'
    shown: ['10^{-7} \times 4.8 \times 10^{-3}/0.125 = 3.84$ nT']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-field-z
    kind: value
    where: 'worked example: B_z = 2 x 3.84 nT'
    inputs: {m0: 4.8e-3, rr: 0.5}
    formula: 2*1e-7*m0/rr**3*1e9
    expected: '7.68'
    shown: ['$\vec B = (-3.84, 3.84, 7.68)$ nT']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-field-magnitude
    kind: value
    where: 'worked example: |B| = 3.84 nT x sqrt(1 + 1 + 4) = 3.84 sqrt(6)'
    inputs: {m0: 4.8e-3, rr: 0.5}
    formula: sqrt(6)*1e-7*m0/rr**3*1e9
    expected: '9.41'
    shown: ['$3.84\sqrt6 = 9.41$ nT']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: example-distance-ratio
    kind: value
    where: 'worked example: 50 cm against the 4 cm cube, more than ten times its size'
    formula: 50/4
    expected: '12.5'
    tolerance: 2.5
    shown: ['50 cm is more than ten times the size of the loop']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  # ---------------------------------------------------------------- the dipole field and the delta-function term
  - id: angular-average-dipole
    kind: identity
    where: 'p. 7 and quiz 3: the angular average of the z component of 3 (m . r) r - m for m along z is the average of 3 cos^2 - 1, (1/2) integral over theta of (3 cos^2 - 1) sin = 0 (checked as that plus mm)'
    formula: mm*integrate('(3*cos(t)**2 - 1)*sin(t)/2', 't', 0, pi) + mm
    equals: mm
    samples: {mm: [1.0, 4.8e-3]}
    tolerance: 1e-9
    shown: ['so the first term averages to $\vec m - \vec m = 0$ on every spherical shell']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: angular-average-third
    kind: value
    where: 'p. 7: the average of r_z r_z = cos^2 over directions is 1/3'
    formula: integrate('cos(t)**2*sin(t)/2', 't', 0, pi)
    expected: '0.333333'
    tolerance: 1e-6
    shown: ['Averaged over directions, $\hat r_i\hat r_j$ gives $\frac13\delta_{ij}$, so']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: sphere-integral-of-b
    kind: identity
    where: 'remark after the dipole field: the integral of B over a sphere of radius R containing the currents is (2/3) mu0 m; it is the average field (mu0/4pi) 2m/R^3 times the volume (4/3) pi R^3 (a standard result, e.g. Jackson, Classical Electrodynamics, eq. (5.62))'
    formula: (MU/(4*pi))*2*mm/RR**3*(4/3)*pi*RR**3
    equals: 2/3*MU*mm
    samples: {MU: [1.2566e-6, 1.0], mm: [4.8e-3, 2.0], RR: [0.1, 3.0]}
    tolerance: 1e-12
    shown: ['the integral of $\vec B$ over the sphere is $\frac23\mu_0\vec m$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: line-21cm
    kind: fact
    where: 'p. 7: "Galaxy is mapped by 21 cm line"; the transition energy comes "100% from" the delta-function term'
    value: 21 cm, 100%
    shown: ['the energy difference of the transition comes 100% from the delta-function term']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  # ---------------------------------------------------------------- plot: circular loop on its axis
  - id: plot-constant
    kind: value
    where: 'plot: mu0 I R^2 / 2 for I = 2 A, R = 0.05 m, in uT cm^3 (z in cm), the 3141.59 of the curves'
    inputs: {II: 2, RR: 0.05}
    formula: 4*pi*1e-7*II*RR**2/2*1e6*1e6
    expected: '3141.59'
    shown: ['{ expr: "3141.59/(25 + z^2)^1.5", label: "exact" }']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: plot-centre
    kind: value
    where: 'plot caption: field at the centre mu0 I/(2R) = 4 pi 1e-7 x 2 / 0.1 T, in uT'
    inputs: {II: 2, RR: 0.05}
    formula: 4*pi*1e-7*II/(2*RR)*1e6
    expected: '25.1'
    shown: ['At the centre the exact field is 25.1 μT']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: plot-dipole-moment-form
    kind: identity
    where: 'plot caption: mu0 m/(2 pi z^3) with m = I pi R^2 equals mu0 I R^2/(2 z^3), the large-z limit of the exact field'
    formula: MU*II*pi*RR**2/(2*pi*zz**3)
    equals: MU*II*RR**2/(2*zz**3)
    samples: {MU: [1.2566e-6, 1.0], II: [2.0, 0.5], RR: [0.05, 1.0], zz: [0.2, 3.0]}
    tolerance: 1e-12
    shown: ['and the dipole term μ₀m/2πz³ with m = IπR² (dashed)']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: plot-error-20
    kind: value
    where: 'plot caption: dipole over exact on the axis at z = 20 cm, ((R^2 + z^2)/z^2)^1.5 - 1, in percent'
    formula: ((25 + 400)/400)**1.5*100 - 100
    expected: '9.5'
    shown: ['the dipole value is 9.5% too high at 20 cm']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: plot-error-30
    kind: value
    where: 'plot caption: dipole over exact on the axis at z = 30 cm, in percent'
    formula: ((25 + 900)/900)**1.5*100 - 100
    expected: '4.2'
    shown: ['and 4.2% at 30 cm']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  # ---------------------------------------------------------------- quiz
  - id: quiz-square-loop
    kind: value
    where: 'quiz 2: m = I a = 2 A x (0.03 m)^2 (A m^2)'
    inputs: {II: 2, aa: 0.03}
    formula: II*aa**2
    expected: '1.8e-3'
    shown: ['so $m = 2 \\times 9 \\times 10^{-4} = 1.8 \\times 10^{-3}$ A m²']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: quiz-square-area
    kind: value
    where: 'quiz 2: the area (0.03 m)^2 (m^2), also the distractor that forgets the current'
    formula: 0.03**2
    expected: '9e-4'
    shown: ['$(0.03\\ \\text{m})^2 = 9 \\times 10^{-4}$ m²']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: quiz-square-double
    kind: value
    where: 'quiz 2, wrong choice: twice the moment, as if the 1/2 were missing'
    formula: 2*2*0.03**2
    expected: '3.6e-3'
    shown: ['$3.6 \\times 10^{-3}$ doubles the result']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: quiz-square-side
    kind: value
    where: 'quiz 2, wrong choice: current times side, 2 x 0.03'
    formula: 2*0.03
    expected: '6e-2'
    shown: ['$6 \\times 10^{-2}$ multiplies the current by the side']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own
