# Calculations on content/year-2/18.03/direction-fields.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 1 transcript, with the page's own examples. Formula checks only.

page: content/year-2/18.03/direction-fields.mdx
calcs:
  - id: circles-solve
    kind: identity
    where: 'section "Isoclines": y = √(C₁ − x²) solves y′ = −x/y'
    formula: (sqrt(C1 - (x + 1e-6)**2) - sqrt(C1 - (x - 1e-6)**2)) / 2e-6
    equals: -x / sqrt(C1 - x**2)
    samples: {C1: [4.0, 9.0], x: [0.5, -1.2]}
    tolerance: 1e-5
    shown: ['$y = \sqrt{C_1 - x^2}$']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: line-solution
    kind: identity
    where: 'section "Isoclines": y = x solves y′ = 1 + x − y'
    formula: 1 + x - x
    equals: 1
    samples: {x: [0.0, 2.5, -3.0]}
    tolerance: 1e-12
    shown: ['so $y = x$ is a solution']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: plotted-solutions
    kind: identity
    where: 'graph: y = x + Ce^(−x) solves y′ = 1 + x − y'
    formula: ((x + 1e-6 + C * exp(-(x + 1e-6))) - (x - 1e-6 + C * exp(-(x - 1e-6)))) / 2e-6
    equals: 1 + x - (x + C * exp(-x))
    samples: {C: [2.0, -2.0], x: [0.3, 2.0]}
    tolerance: 1e-5
    shown: ['solutions y = x + Ce^(−x)']
    source: {cite: reading1, at: 'pp. 10–15'}
    origin: page-own

  - id: lines-through-point
    kind: identity
    where: 'section "Integral curves cannot cross": y = 1 + Cx solves xy′ = y − 1 (the transcript''s 1 − y version has a sign slip)'
    formula: x * C
    equals: (1 + C * x) - 1
    samples: {C: [0.5, -3.0], x: [1.0, -2.0]}
    tolerance: 1e-12
    shown: ['gives the solutions $y = 1 + Cx$']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: worked-straight
    kind: identity
    where: 'worked example (b): y = −x − 1 solves y′ = x + y'
    formula: x + (-x - 1)
    equals: -1
    samples: {x: [0.0, 1.7, -4.0]}
    tolerance: 1e-12
    shown: ['indeed $y'' = -1$ and $x + y = -1$']
    source: {cite: reading1, at: 'pp. 6–7'}
    origin: page-own

  - id: worked-general
    kind: identity
    where: 'worked example (c): y = Ceˣ − x − 1 solves y′ = x + y'
    formula: ((C * exp(x + 1e-6) - (x + 1e-6) - 1) - (C * exp(x - 1e-6) - (x - 1e-6) - 1)) / 2e-6
    equals: x + C * exp(x) - x - 1
    samples: {C: [1.0, -0.5], x: [0.2, 1.5]}
    tolerance: 1e-5
    shown: ['$y = Ce^x - x - 1$ gives']
    source: {cite: reading1, at: 'pp. 6–7'}
    origin: page-own

  - id: slip-check
    kind: identity
    where: 'bracket: with xy′ = 1 − y the solutions are y = 1 − C/x'
    formula: x * ((1 - C / (x + 1e-6)) - (1 - C / (x - 1e-6))) / 2e-6
    equals: 1 - (1 - C / x)
    samples: {C: [0.5, -3.0], x: [1.0, -2.0]}
    tolerance: 1e-5
    shown: ['the hyperbolas $y = 1 - C/x$']
    source: {cite: reading1, at: 'pp. 16–18'}
    origin: page-own
