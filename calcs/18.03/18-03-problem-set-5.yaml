    expected: '-0.333'
    shown: ['$a_3 = -\frac{1}{3} = -0.333$']
    source: {cite: solutions, at: 'Problem 20(b), p. 2'}
    origin: mit

  - id: p20-b-a5
    answer: p20-b-a5
    where: 'Problem 20(b), answer box: a₅ from the integral'
    inputs: {}
    formula: (2/pi)*(integrate('(pi/4)*cos(5*t)', 't', 0, pi/2) - integrate('(pi/4)*cos(5*t)', 't', pi/2, pi))
    expected: '0.2'
    tolerance: 1e-6
    shown: ['$a_5 = \frac{1}{5} = 0.2$']
    source: {cite: solutions, at: 'Problem 20(b), p. 2'}
    origin: mit

  - id: p20-b-closed-form
    kind: identity
    where: 'Problem 20(b), formula "The coefficients in closed form": sin(nπ/2)/n against the integral, n = 1 to 6'
    formula: sin(n*pi/2)/n
    equals: (2/pi)*(integrate('(pi/4)*cos(n*t)', 't', 0, pi/2) - integrate('(pi/4)*cos(n*t)', 't', pi/2, pi))
    samples:
      n: [1, 2, 3, 4, 5, 6]
    tolerance: 1e-7
    shown: ['= \frac{1}{n}\sin\frac{n\pi}{2}']
    source: {cite: solutions, at: 'Problem 20(b), p. 2'}
    origin: mit

  - id: p20-c-formula
    kind: identity
    where: 'Problem 20(c), formula "Mean square distance to the target": against the integral of the squared difference over half a period (the integrand is even), with the sliders a₁ and a₃ (A₁ = 1, A₃ = −1/3)'
    formula: pi**2/16 - (a1*1 + a3*(-1/3)) + 0.5*(a1**2 + a3**2)
    equals: (1/pi)*(integrate('(pi/4 - a1*cos(t) - a3*cos(3*t))**2', 't', 0, pi/2) + integrate('(-pi/4 - a1*cos(t) - a3*cos(3*t))**2', 't', pi/2, pi))
    samples:
      a1: [1, 0.5, 0.2, -0.4]
      a3: [-0.3333, 0.1, -0.5, 0.6]
    tolerance: 1e-7
    shown: ['= \frac{\pi^2}{16} - \sum_n a_nA_n + \frac{1}{2}\sum_n a_n^2']
    source: {cite: secondHalf, at: 'Part II, Problem 20(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p20-c-squares
    kind: identity
    where: 'Problem 20(c), formula "The distance as a sum of separate parabolas": the completed squares against the expanded form, for two sliders'
    formula: pi**2/16 - 0.5*(1 + 1/9) + 0.5*((a1 - 1)**2 + (a3 + 1/3)**2)
    equals: pi**2/16 - (a1*1 + a3*(-1/3)) + 0.5*(a1**2 + a3**2)
    samples:
      a1: [1, 0.5, 0.2, -0.4]
      a3: [-0.3333, 0.1, -0.5, 0.6]
    tolerance: 1e-9
    shown: ['- \frac{1}{2}\sum_n A_n^2 + \frac{1}{2}\sum_n\,(a_n - A_n)^2']
    source: {cite: secondHalf, at: 'Part II, Problem 20(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p20-c-d2
    where: 'Problem 20(c), step "The two boxes": D² = π²/16 − 1/2'
    inputs: {}
    formula: pi**2/16 - 0.5
    expected: '0.1169'
    shown: ['$D^2 = \pi^2/16 - \frac{1}{2} = 0.1169$']
    source: {cite: secondHalf, at: 'Part II, Problem 20(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p20-c-rms
    answer: p20-c-rms
    where: 'Problem 20(c), answer box: the root mean square distance between f and cos t, from the integral of the squared difference'
