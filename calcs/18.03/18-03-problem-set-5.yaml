# Calculations on content/year-2/18.03/18-03-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# the circuit results from the differential equation itself (a numerical derivative, the root of the reactance,
# undetermined coefficients instead of the complex gain), the damping ratio from the root of the halving condition,
# and every Fourier coefficient from its integral (the page finds most of them without integrals).

page: content/year-2/18.03/18-03-problem-set-5.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the four problems of Part II (28 + 12 + 12 + 32)'
    inputs: {}
    formula: 28 + 12 + 12 + 32
    expected: '84'
    shown: ['four problems (84 points)']
    source: {cite: solutions, at: 'Part II solutions, pp. 1–2'}
    origin: mit

  - id: intro-part-i-points
    kind: fact
    where: 'Last section: the points of MIT''s Part I (4 + 0 + 4 + 4)'
    shown: ['(12 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 17

  - id: p17-steady-state
    kind: identity
    where: 'Problem 17: the steady current I = A sin(ωt − φ), with A of part (d) and tan φ = (Lω − 1/(Cω))/R, satisfies the circuit equation. For a sinusoid Ï = −ω²I, so the left side is (1/C − Lω²)I + Rİ (numerical derivative); both sides divided by V₀ω'
    formula: ((1/C - L*omega**2)*(V0/sqrt(R**2 + (L*omega - 1/(C*omega))**2)*sin(omega*t - atan((L*omega - 1/(C*omega))/R))) + R*deriv('V0/sqrt(R**2 + (L*omega - 1/(C*omega))**2)*sin(omega*x - atan((L*omega - 1/(C*omega))/R))', 'x', t))/(V0*omega)
    equals: cos(omega*t)
    samples:
      V0: [500, 100, 300, 500]
      R: [100, 50, 200, 100]
      L: [1, 0.5, 2, 0.5]
      C: [0.0001, 0.00005, 0.0002, 0.00002]
      omega: [100, 200, 60, 200]
      t: [0.004, 0.002, 0.03, 0.011]
    tolerance: 1e-6
    shown: ['Write it as $I(t) = A\sin(\omega t - \phi)$']
    source: {cite: mit, at: 'Part II, Problem 17, p. 2'}
    origin: page-own

  - id: p17-b-cap
    kind: identity
    answer: p17-b-cap
    where: 'Problem 17(b), answer box and formula "Condition for current in phase with voltage": against the root in C of the reactance Lω − 1/(Cω), where the phase lag atan((Lω − 1/(Cω))/R) is zero'
    formula: 1/(L*omega**2)
    equals: solve('L*omega - 1/(x*omega)', 'x', 0.0000001, 1)
    samples:
      L: [0.1, 0.5, 1, 2]
      omega: [500, 200, 100, 50]
    tolerance: 1e-6
    shown: ['C = \frac{1}{L\,\omega^2}']
    source: {cite: solutions, at: 'Problem 17(b), p. 1'}
    origin: mit

  - id: p17-b-example
    where: 'Problem 17(b), check: C in μF for L = 0.5 H, ω = 200 rad/s'
    inputs: {}
    formula: 1/(0.5*200**2)*1e6
    expected: '50'
    shown: ['F $= 50$ μF']
    source: {cite: solutions, at: 'Problem 17(b), p. 1'}
    origin: mit

  - id: p17-b-example-farad
    where: 'Problem 17(b), check: 0.5 × 200² = 20000'
    inputs: {}
    formula: 0.5*200**2
    expected: '20000'
    shown: ['= 1/20000 = 50 \times 10^{-6}$ F']
    source: {cite: solutions, at: 'Problem 17(b), p. 1'}
    origin: mit

  - id: p17-b-num
    answer: p17-b-num
    where: 'Problem 17(b), answer box: C in μF for L = 0.2 H, ω = 500 rad/s, as the root of the reactance'
    inputs: {}
    formula: solve('0.2*500 - 1/(x*500)', 'x', 0.0000001, 1)*1e6
    expected: '20'
    tolerance: 0.001
    shown: ['F $= 20$ μF']
    source: {cite: solutions, at: 'Problem 17(b), p. 1'}
    origin: page-own

  - id: p17-b-num-farad
    where: 'Problem 17(b), check: 1/(0.2 × 500²) in farads'
    inputs: {}
    formula: 1/(0.2*500**2)
    expected: '2e-5'
    shown: ['= 2 \times 10^{-5}$ F']
    source: {cite: solutions, at: 'Problem 17(b), p. 1'}
    origin: page-own

  - id: p17-c-omega
    answer: p17-c-omega
    where: 'Problem 17(c), answer box: ω of the largest amplitude for L = 1 H, C = 10⁻⁴ F, as the root of the reactance Lω − 1/(Cω)'
    inputs: {}
    formula: solve('1*x - 1/(0.0001*x)', 'x', 1, 1000)
    expected: '100'
    tolerance: 0.001
    shown: ['\omega_r = 1/\sqrt{10^{-4}} = 100$ rad/s']
    source: {cite: solutions, at: 'Problem 17(c) and (d), p. 1'}
    origin: mit

  - id: p17-c-amp
    answer: p17-c-amp
    where: 'Problem 17(c), answer box: the amplitude formula at ω = 100 rad/s for R = 100 Ω, L = 1 H, C = 10⁻⁴ F, V₀ = 500 V'
    inputs: {}
    formula: 500/sqrt(100**2 + (1*100 - 1/(0.0001*100))**2)
    expected: '5'
    tolerance: 0.001
    shown: ['I_r = 500/100 = 5$ A']
    source: {cite: solutions, at: 'Problem 17(c) and (d), p. 1'}
    origin: mit

  - id: p17-c-lag
    answer: p17-c-lag
    where: 'Problem 17(c), answer box: the phase lag atan((Lω − 1/(Cω))/R) at ω = 100 rad/s'
    inputs: {}
    formula: atan((1*100 - 1/(0.0001*100))/100)
    expected: '0'
    tolerance: 1e-9
    shown: ['so the phase lag at $\omega_r$ is zero']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: mit

  - id: p17-d-amp
    kind: identity
    answer: p17-d-amp
    where: 'Problem 17(d), answer box and formula "Amplitude of the current": against undetermined coefficients, I = a cos ωt + b sin ωt with P = 1/C − Lω², Q = Rω: Pa + Qb = V₀ω, Pb − Qa = 0, so √(a² + b²) = V₀ω/√(P² + Q²)'
    formula: V0/sqrt(R**2 + (L*omega - 1/(C*omega))**2)
    equals: sqrt((V0*omega*(1/C - L*omega**2)/((1/C - L*omega**2)**2 + (R*omega)**2))**2 + (V0*omega*R*omega/((1/C - L*omega**2)**2 + (R*omega)**2))**2)
    samples:
      V0: [500, 100, 300, 450]
      R: [100, 50, 200, 120]
      L: [1, 0.5, 2, 1.5]
      C: [0.0001, 0.00005, 0.0002, 0.00015]
      omega: [100, 250, 60, 290]
    tolerance: 1e-9
    shown: ['A(\omega) = \frac{V_0}{\sqrt{R^2 + \bigl(L\omega - \frac{1}{C\omega}\bigr)^2}}']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: mit

  - id: p17-d-omega
    kind: identity
    answer: p17-d-omega
    where: 'Problem 17(d), answer box and formula "Resonant frequency of the current": against the root in ω of the reactance Lω − 1/(Cω)'
    formula: 1/sqrt(L*C)
    equals: solve('L*x - 1/(C*x)', 'x', 1, 100000)
    samples:
      L: [0.5, 1, 2, 1.5]
      C: [0.0001, 0.0001, 0.001, 0.0004]
    tolerance: 1e-6
    shown: ['\omega_r = \frac{1}{\sqrt{LC}}']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: mit

  - id: p17-d-peak-symmetry
    kind: identity
    where: 'Problem 17(d): the amplitude is the same at ω_r·q and ω_r/q, so its one peak is at ω_r (here V₀ = 1)'
    formula: 1/sqrt(R**2 + (L*(q/sqrt(L*C)) - 1/(C*(q/sqrt(L*C))))**2)
    equals: 1/sqrt(R**2 + (L*(1/(q*sqrt(L*C))) - 1/(C*(1/(q*sqrt(L*C)))))**2)
    samples:
      R: [100, 50, 200, 120]
      L: [1, 0.5, 2, 1.5]
      C: [0.0001, 0.00005, 0.0002, 0.00015]
      q: [1.1, 2, 0.7, 5]
    tolerance: 1e-9
    shown: ['The point of that line closest to the origin is $Ri$']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: page-own

  - id: p17-d-ir
    kind: identity
    answer: p17-d-ir
    where: 'Problem 17(d), answer box and formula "Largest amplitude of the current": against the amplitude formula evaluated at ω = 1/√(LC)'
    formula: V0/R
    equals: V0/sqrt(R**2 + (L*(1/sqrt(L*C)) - 1/(C*(1/sqrt(L*C))))**2)
    samples:
      V0: [500, 100, 300, 450]
      R: [100, 50, 200, 120]
      L: [1, 0.5, 2, 1.5]
      C: [0.0001, 0.00005, 0.0002, 0.00015]
    tolerance: 1e-9
    shown: ['I_r = \frac{V_0}{R}']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: mit

  - id: p17-d-below
    where: 'Problem 17(d), check: the amplitude at ω = 90 rad/s'
    inputs: {}
    formula: 500/sqrt(100**2 + (1*90 - 1/(0.0001*90))**2)
    expected: '4.89'
    shown: ['$4.89$ A at $\omega = 90$ rad/s']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: page-own

  - id: p17-d-above
    where: 'Problem 17(d), check: the amplitude at ω = 110 rad/s'
    inputs: {}
    formula: 500/sqrt(100**2 + (1*110 - 1/(0.0001*110))**2)
    expected: '4.91'
    shown: ['$4.91$ A at $\omega = 110$ rad/s']
    source: {cite: solutions, at: 'Problem 17(d), p. 1'}
    origin: page-own

  # ---- Problem 18

  - id: p18-alpha
    where: 'Problem 18, formula "The constant α": ln 2/(2π)'
    inputs: {}
    formula: log(2)/(2*pi)
    expected: '0.1103178'
    shown: ['\alpha = \frac{\ln 2}{2\pi} \simeq 0.1103178']
    source: {cite: mit, at: 'Part II, Problem 18, p. 2'}
    origin: mit

  - id: p18-zeta
    kind: identity
    answer: p18-zeta
    where: 'Problem 18, answer box and formula "Damping ratio from the number of cycles": against the root in ζ of ζ/√(1 − ζ²) = α/n'
    formula: (alpha/n)/sqrt(1 + (alpha/n)**2)
    equals: solve('x/sqrt(1 - x**2) - alpha/n', 'x', 0, 0.999)
    samples:
      alpha: [0.1103178, 0.1103178, 0.1103178, 0.1103178]
      n: [1, 2, 5, 10]
    tolerance: 1e-7
    shown: ['\zeta = \frac{\alpha/n}{\sqrt{1 + (\alpha/n)^2}}']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-halving
    kind: identity
    where: 'Problem 18: with the formula for ζ, the exponential factor after n cycles, exp(−2πnζ/√(1 − ζ²)), is one half'
    formula: exp(-2*pi*n*((log(2)/(2*pi*n))/sqrt(1 + (log(2)/(2*pi*n))**2))/sqrt(1 - ((log(2)/(2*pi*n))/sqrt(1 + (log(2)/(2*pi*n))**2))**2))
    equals: 0.5 + 0*n
    samples:
      n: [0.5, 1, 3, 10, 40]
    tolerance: 1e-9
    shown: ['\frac{1}{2} = e^{-2\pi n\zeta/\sqrt{1 - \zeta^2}}']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-alpha-over-n
    where: 'Problem 18, step "Ten cycles": α/n for n = 10'
    inputs: {}
    formula: log(2)/(2*pi*10)
    expected: '0.01103178'
    shown: ['$\alpha/n = 0.01103178$']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-num
    answer: p18-num
    where: 'Problem 18, answer box: ζ for n = 10, as the root of 2π·10·ζ/√(1 − ζ²) = ln 2'
    inputs: {}
    formula: solve('2*pi*10*x/sqrt(1 - x**2) - log(2)', 'x', 0, 0.999)
    expected: '0.01103'
    shown: ['so $\zeta = 0.0110311$']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-num-digits
    where: 'Problem 18, step "Ten cycles": ζ to six significant figures, from the formula'
    inputs: {}
    formula: (log(2)/(2*pi*10))/sqrt(1 + (log(2)/(2*pi*10))**2)
    expected: '0.0110311'
    shown: ['Put $\zeta = 0.0110311$ back']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-ratio
    answer: p18-ratio
    where: 'Problem 18, answer box: ζ/(α/n) for n = 10, with ζ from the root of the halving condition'
    inputs: {}
    formula: solve('2*pi*10*x/sqrt(1 - x**2) - log(2)', 'x', 0, 0.999)/(log(2)/(2*pi*10))
    expected: '0.999939'
    shown: ['1/\sqrt{1 + (\alpha/n)^2} = 0.99993916$']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-ratio-digits
    where: 'Problem 18, step "Ten cycles": MIT''s 0.99993916'
    inputs: {}
    formula: 1/sqrt(1 + (log(2)/(2*pi*10))**2)
    expected: '0.99993916'
    shown: ['= 0.99993916$, so']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: mit

  - id: p18-parts
    where: 'Problem 18, step "Ten cycles": the exact value is smaller by about 6 parts in 100 000'
    inputs: {}
    formula: (1 - 1/sqrt(1 + (log(2)/(2*pi*10))**2))*100000
    expected: '6'
    shown: ['about 6 parts in 100 000']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: page-own

  - id: p18-check
    where: 'Problem 18, check: 2π·10·ζ/√(1 − ζ²) for ζ = 0.0110311'
    inputs: {}
    formula: 2*pi*10*0.0110311/sqrt(1 - 0.0110311**2)
    expected: '0.6931'
    shown: ['= 0.6931 = \ln 2$']
    source: {cite: solutions, at: 'Problem 18, p. 1'}
    origin: page-own

  # ---- Problem 20

  - id: p20-a-three-terms
    where: 'Problem 20(a), check: 1 − 1/3 + 1/5'
