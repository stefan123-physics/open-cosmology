    expected: '0'
    tolerance: 1e-6
    shown: ['For even $n$, $\sin(n\pi/2) = 0$.']
    source: {cite: solutions, at: 'Problem 20(b), p. 2'}
    origin: mit

  - id: p20-b-a3
    answer: p20-b-a3
