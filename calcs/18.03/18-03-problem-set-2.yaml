  - id: p4-c-num-formula
    where: 'Problem 4(c): y(10) = ½(e^(−1) − e^(−2)) from the formula'
    inputs: {}
    formula: 0.5*(exp(-1) - exp(-2))
    expected: '0.1163'
    shown: ['so $y(10) = ']
    source: {cite: solutions, at: 'Problem 4(c), p. 1'}
    origin: page-own

  - id: p4-c-z-10
    where: 'Problem 4(c): z(10) from the formula for z, σ = 0.1, μ = 0.2'
