# Calculations on content/year-2/18.03/18-03-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# the amounts from the differential equation (a numerical integral and a numerical derivative), the peak time
# from the root of the slope, and the complex numbers from real arithmetic (moduli, angles, real parts).

page: content/year-2/18.03/18-03-problem-set-2.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the four problems of Part II (20 + 18 + 16 + 18)'
    inputs: {}
    formula: 20 + 18 + 16 + 18
    expected: '72'
    shown: ['four problems (72 points)']
    source: {cite: solutions, at: 'Part II solutions, pp. 1–2'}
    origin: mit

  - id: intro-part-i-points
    kind: fact
    where: 'Last section: the points of MIT''s Part I (4 + 6 + 8 + 6)'
    shown: ['(24 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 4

  - id: p4-b-sigma
    kind: identity
    answer: p4-b-sigma
    where: 'Problem 4(b), answer box and formula "Decay constants from half-lives": against σ = −ln(1/2)/t_S, from x(t_S) = 1/2'
    formula: log(2)/tS
    equals: -log(1/2)/tS
    samples: {tS: [1, 2.5, 4, 10]}
    tolerance: 1e-12
    shown: ['\sigma = \frac{\ln 2}{t_S}']
    source: {cite: solutions, at: 'Problem 4(b), p. 1'}
    origin: mit

  - id: p4-b-total
    kind: identity
    where: 'Problem 4(b), check: the sum of the three right-hand sides is zero (at several amounts)'
    formula: (-sigma*x) + (-mu*y + 0.5*sigma*x) + (0.5*sigma*x + mu*y)
    equals: 0*x
    samples: {sigma: [0.1, 0.3, 0.7], mu: [0.2, 0.9, 0.5], x: [1, 0.4, 0.2], y: [0, 0.3, 0.1]}
    tolerance: 1e-12
    shown: ['Every term cancels, so $\dot x + \dot y + \dot z = 0$']
    source: {cite: solutions, at: 'Problem 4(b), p. 1'}
    origin: mit

  - id: p4-b-wrong-sum
    kind: identity
    where: 'Problem 4(b), check: with the wrong equation ẏ = −μy + σx the sum is ½σx'
    formula: (-sigma*x) + (-mu*y + sigma*x) + (0.5*sigma*x + mu*y)
    equals: 0.5*sigma*x
    samples: {sigma: [0.1, 0.3, 0.7], mu: [0.2, 0.9, 0.5], x: [1, 0.4, 0.2], y: [0, 0.3, 0.1]}
    tolerance: 1e-12
    shown: ['\frac{1}{2}\sigma x \neq 0']
    source: {cite: solutions, at: 'Problem 4(b), p. 1'}
    origin: page-own

  - id: p4-c-y
    kind: identity
    answer: p4-c-y
    where: 'Problem 4(c), answer box and formula "Solution for Mi": against the convolution integral of the decay of x and the decay of y, the integral of (σ/2)e^(−σs) e^(−μ(t−s)) over s'
    formula: sigma/(2*(mu-sigma))*(exp(-sigma*t) - exp(-mu*t))
    equals: integrate('0.5*sigma*exp(-sigma*s)*exp(-mu*(t-s))', 's', 0, t)
    samples:
      sigma: [0.1, 0.3, 0.5, 0.2]
      mu: [0.6, 1.2, 0.9, 1.5]
      t: [0.2, 1, 3, 2.5]
    tolerance: 1e-7
    shown: ['y = \frac{\sigma}{2(\mu - \sigma)}\left(e^{-\sigma t} - e^{-\mu t}\right)']
    source: {cite: solutions, at: 'Problem 4(c), p. 1'}
    origin: mit

  - id: p4-c-y-ode
    kind: identity
    where: 'Problem 4(c): the numerical derivative of y plus μy equals ½σ e^(−σt), the equation for y'
    formula: deriv('sigma/(2*(mu-sigma))*(exp(-sigma*x)-exp(-mu*x))', 'x', t) + mu*(sigma/(2*(mu-sigma))*(exp(-sigma*t)-exp(-mu*t)))
    equals: 0.5*sigma*exp(-sigma*t)
    samples:
      sigma: [0.1, 0.3, 0.5, 0.2]
      mu: [0.6, 1.2, 0.9, 1.5]
      t: [0.2, 1, 3, 2.5]
    tolerance: 1e-7
    shown: ['standard linear form, $\dot y + \mu y = \frac{1}{2}\sigma e^{-\sigma t}$']
    source: {cite: solutions, at: 'Problem 4(c), p. 1'}
    origin: mit

  - id: p4-c-y-zero
    kind: identity
    where: 'Problem 4(c): y(0) = 0 for the formula'
    formula: sigma/(2*(mu-sigma))*(exp(-sigma*0)-exp(-mu*0))
    equals: 0*sigma
    samples: {sigma: [0.1, 0.3, 0.5], mu: [0.6, 1.2, 0.9]}
    tolerance: 1e-12
    shown: ['gives $0$']
    source: {cite: solutions, at: 'Problem 4(c), p. 1'}
    origin: mit

  - id: p4-c-y-slope
    kind: identity
    where: 'Problem 4(c), check: the slope of y at t = 0 is σ/2'
    formula: deriv('sigma/(2*(mu-sigma))*(exp(-sigma*x)-exp(-mu*x))', 'x', 0)
    equals: 0.5*sigma
    samples: {sigma: [0.1, 0.3, 0.5], mu: [0.6, 1.2, 0.9]}
    tolerance: 1e-7
    shown: ['(-\sigma + \mu) = \frac{1}{2}\sigma']
    source: {cite: solutions, at: 'Problem 4(c), p. 1'}
    origin: page-own

  - id: p4-c-num
    answer: p4-c-num
    where: 'Problem 4(c), answer box: y(10) for σ = 0.1, μ = 0.2, by integrating (σ/2)e^(−σs) e^(−μ(10−s)) over s from 0 to 10'
    inputs: {}
    formula: integrate('0.5*0.1*exp(-0.1*s)*exp(-0.2*(10-s))', 's', 0, 10)
