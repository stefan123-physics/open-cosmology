  - id: p4-c-prefactor
    where: 'Problem 4(c): the prefactor σ/(2(μ − σ)) for σ = 0.1, μ = 0.2'
    inputs: {}
    formula: 0.1/(2*(0.2 - 0.1))
    expected: '0.5'
    shown: ['\dfrac{0.1}{2 \times 0.1} = \frac{1}{2}']
    source: {cite: solutions, at: 'Problem 4(c), p. 1'}
    origin: page-own

  - id: p4-d-formula
    kind: identity
    answer: p4-d-formula
    where: 'Problem 4(d), answer box and formula "Time of the peak of Midium": against the root of the slope, σ e^(−σt) = μ e^(−μt)'
    formula: (log(mu) - log(sigma))/(mu - sigma)
    equals: solve('sigma*exp(-sigma*x) - mu*exp(-mu*x)', 'x', 0, 200)
    samples:
      sigma: [0.1, 0.3, 0.5, 0.2]
      mu: [0.6, 1.2, 0.9, 1.5]
    tolerance: 1e-6
    shown: ['t_{\max} = \frac{\ln\mu - \ln\sigma}{\mu - \sigma}']
    source: {cite: solutions, at: 'Problem 4(d), p. 1'}
    origin: mit

  - id: p4-d-num
    answer: p4-d-num
    where: 'Problem 4(d), answer box: t_max for σ = 0.1, μ = 0.2, as the root of 0.1 e^(−0.1t) = 0.2 e^(−0.2t)'
    inputs: {}
    formula: solve('0.1*exp(-0.1*x) - 0.2*exp(-0.2*x)', 'x', 0, 100)
    expected: '6.93'
    shown: ['\ln 2/0.1 = 6.93']
    source: {cite: solutions, at: 'Problem 4(d), p. 1'}
    origin: page-own

  - id: p4-d-num-ratio
    where: 'Problem 4(d): ln 2 / 0.1'
    inputs: {}
    formula: log(2)/0.1
    expected: '6.93'
    shown: ['\ln 2/0.1 = 6.93']
    source: {cite: solutions, at: 'Problem 4(d), p. 1'}
    origin: page-own

  - id: p4-d-limit
    kind: identity
    where: 'Problem 4(d), check: as μ tends to σ the time tends to 1/σ (μ = 1.00001σ)'
    formula: (log(1.00001*sigma) - log(sigma))/(0.00001*sigma)
    equals: 1/sigma
    samples: {sigma: [0.1, 0.5, 2]}
    tolerance: 1e-4
    shown: ['it tends to $1/\sigma$']
    source: {cite: solutions, at: 'Problem 4(d), p. 1'}
