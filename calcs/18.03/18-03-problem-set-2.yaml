  - id: p4-f-q
    kind: identity
    answer: p4-f-q
    where: 'Problem 4(f), answer box and formula "The right side": against t·x′ + 2x with x = e^t, the derivative taken numerically'
    formula: (t + 2)*exp(t)
    equals: t*deriv('exp(x)', 'x', t) + 2*exp(t)
    samples: {t: [0.5, 1, 1.7, 2, -1.3]}
    tolerance: 1e-7
    shown: ['q(t) = t\,e^t + 2e^t = (t + 2)\,e^t']
    source: {cite: solutions, at: 'Problem 4(f), p. 1'}
    origin: mit

  - id: p4-f-homogeneous
    kind: identity
    where: 'Problem 4(f): C/t² solves t·x′ + 2x = 0'
    formula: t*deriv('C/x**2', 'x', t) + 2*C/t**2
    equals: 0*C
    samples: {C: [1, -2, 0.5, 3], t: [0.5, 1, 2.2, -1.5]}
    tolerance: 1e-7
    shown: ['it solves the homogeneous equation']
    source: {cite: solutions, at: 'Problem 4(f), p. 1'}
