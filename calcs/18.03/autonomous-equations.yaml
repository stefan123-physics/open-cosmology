# Calculations on content/year-2/18.03/autonomous-equations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 5 transcript, with the page's own numbers.

page: content/year-2/18.03/autonomous-equations.mdx
calcs:
  - id: logistic-solution
    kind: identity
    where: 'graph: y = 1/(1 + Ce^(−t)) solves y′ = y − y² (a = b = 1)'
    formula: ((1 / (1 + C * exp(-(t + 1e-6)))) - (1 / (1 + C * exp(-(t - 1e-6))))) / 2e-6
    equals: 1 / (1 + C * exp(-t)) - (1 / (1 + C * exp(-t)))**2
    samples: {t: [0.0, 2.0], C: [19.0, -0.375]}
    tolerance: 1e-5
    shown: ['computed from y = (a/b)/(1 + Ce^(−at))']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: plot-start-low
    where: 'graph: C = 19 starts at 0.05'
    inputs: {}
    formula: 1 / (1 + 19)
    expected: '0.05'
    shown: ['with starting values 0.05 a/b and 1.6 a/b']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: plot-start-high
    where: 'graph: C = −0.375 starts at 1.6'
    inputs: {}
    formula: 1 / (1 - 0.375)
    expected: '1.6'
    shown: ['both approach the stable critical point a/b']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: hm-formula
    kind: identity
    where: 'section "Harvesting": the peak of ay − by² at y = a/2b is a²/4b'
    formula: a * (a / (2 * b)) - b * (a / (2 * b))**2
    equals: a**2 / (4 * b)
    samples: {a: [0.4, 2.0], b: [0.002, 0.5]}
    tolerance: 1e-9
    shown: ['which gives $h_m = \frac{a^2}{4b}$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: fish-capacity
    where: 'worked example (a): 0.4/0.002 = 200 tonnes'
    inputs: {}
    formula: 0.4 / 0.002
    expected: '200'
    shown: ['$y = 0.4/0.002 = 200$ tonnes']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: fish-hm
    where: 'worked example (b): 0.16/0.008 = 20 tonnes a year'
    inputs: {}
    formula: 0.4**2 / (4 * 0.002)
    expected: '20'
    shown: ['= 0.16/0.008 = 20$ tonnes a year']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: fish-high
    where: 'worked example (c): (0.4 + 0.2)/0.004 = 150'
    inputs: {}
    formula: (0.4 + sqrt(0.4**2 - 4 * 0.002 * 15)) / (2 * 0.002)
    expected: '150'
    shown: ['$y = 150$ (stable)']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: fish-low
    where: 'worked example (c): (0.4 − 0.2)/0.004 = 50'
    inputs: {}
    formula: (0.4 - sqrt(0.4**2 - 4 * 0.002 * 15)) / (2 * 0.002)
    expected: '50'
    shown: ['$y = 50$ (unstable)']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own
