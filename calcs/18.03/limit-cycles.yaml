# Calculations on content/year-2/18.03/limit-cycles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 32 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/limit-cycles.mdx
calcs:
  - id: bendixson-example
    kind: identity
    where: 'divergence of (x³ + y³, 3x + y³ + 2y) is 3x² + 3y² + 2'
    formula: ((x+1e-4)**3 + y**3 - ((x-1e-4)**3 + y**3)) / 2e-4 + ((3*x + (y+1e-4)**3 + 2*(y+1e-4)) - (3*x + (y-1e-4)**3 + 2*(y-1e-4))) / 2e-4
    equals: 3*x**2 + 3*y**2 + 2
    samples: {x: [0.0, 1.0, -2.0], y: [0.5, -1.0, 3.0]}
    tolerance: 1e-4
    shown: ['its divergence $3x^2 + 3y^2 + 2$']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: mit

  - id: plot-r-inside
    kind: identity
    where: 'graph: r = 2/√(1 + 24e^(−2t)) solves r′ = r(1 − r²/4), starting at r = 0.4'
    formula: (2/sqrt(1 + 24*exp(-2*(t+1e-4))) - 2/sqrt(1 + 24*exp(-2*(t-1e-4)))) / 2e-4
    equals: (2/sqrt(1 + 24*exp(-2*t))) * (1 - (4/(1 + 24*exp(-2*t)))/4)
    samples: {t: [0.0, 1.0, 3.0]}
    tolerance: 1e-4
    shown: ['trajectories started at r = 0.4 and r = 3']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: plot-r-start
    where: 'graph: the inside trajectory starts at 2/√25 = 0.4'
    inputs: {}
    formula: 2/sqrt(1 + 24)
    expected: '0.4'
    shown: ['2*cos(s)/sqrt(1 + 24*exp(-2*s))']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: plot-r-outside
    where: 'graph: the outside trajectory starts at 2/√(1 − 5/9) = 3'
    inputs: {}
    formula: 2/sqrt(1 - 0.5556)
    expected: '3'
    shown: ['1 - 0.5556*exp(-2*s))", y']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-a-radial
    kind: identity
    where: 'example (a): x·x′ + y·y′ = r² − r⁴/4 for the system'
    formula: x*(x - y - x*(x**2 + y**2)/4) + y*(x + y - y*(x**2 + y**2)/4)
    equals: (x**2 + y**2) - (x**2 + y**2)**2/4
    samples: {x: [0.3, 1.0, -0.7], y: [0.5, -1.2, 0.4]}
    tolerance: 1e-12
    shown: ["r^4$, so $r' = r(1"]
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-a-angular
    kind: identity
    where: 'example (a): x·y′ − y·x′ = r², so θ′ = 1'
    formula: x*(x + y - y*(x**2 + y**2)/4) - y*(x - y - x*(x**2 + y**2)/4)
    equals: x**2 + y**2
    samples: {x: [0.3, 1.0, -0.7], y: [0.5, -1.2, 0.4]}
    tolerance: 1e-12
    shown: ['= 1$. On $r = 2$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-c-div
    where: 'example (c): divergence of (1 + y², xy) is 0 + x, zero on the y-axis'
    inputs: {}
    formula: 0 + 0
    expected: '0'
    shown: ['the divergence $0 + x$ vanishes']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b
    where: 'example (b): divergence of (−x + y², −y + x³) is −1 − 1'
    inputs: {}
    formula: -1 + -1
    expected: '-2'
    shown: ['$f_x + g_y = -1 - 1 = -2$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
