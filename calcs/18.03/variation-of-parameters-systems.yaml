# Calculations on content/year-2/18.03/variation-of-parameters-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 28 transcript, with the page's own example.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/variation-of-parameters-systems.mdx
calcs:
  - id: tank-balance-1
    where: 'tank 1: out 3 L/h, in 2 from tank 2, so 1 L/h from outside'
    inputs: {}
    formula: 3 - 2
    expected: '1'
    shown: ['1 L/h enters each from outside']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: tank-balance-2
    where: 'tank 2: out 2 + 2 L/h, in 3 from tank 1, so 1 L/h from outside'
    inputs: {}
    formula: (2 + 2) - 3
    expected: '1'
    shown: ['2 L/h leaves the second']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: ex-wronskian
    where: 'example: det X = e^t(−e^(−t)) − e^(−t)e^t'
    inputs: {}
    formula: exp(0.7)*(-exp(-0.7)) - exp(-0.7)*exp(0.7)
    expected: '-2'
    tolerance: '1e-12'
    shown: ['Its determinant is $-1 - 1 = -2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-xp-x
    kind: identity
    where: 'example: x_p = (e^(2t)/3, 2e^(2t)/3) satisfies x′ = y'
    formula: (exp(2*(t+1e-4))/3 - exp(2*(t-1e-4))/3) / 2e-4
    equals: 2*exp(2*t)/3
    samples: {t: [0.0, 0.5, 1.0]}
    tolerance: 1e-4
    shown: ['$x'' = \frac{2}{3}e^{2t} = y$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-xp-y
    kind: identity
    where: 'and y′ = x + e^(2t)'
    formula: (2*exp(2*(t+1e-4))/3 - 2*exp(2*(t-1e-4))/3) / 2e-4
    equals: exp(2*t)/3 + exp(2*t)
    samples: {t: [0.0, 0.5, 1.0]}
    tolerance: 1e-4
    shown: ['$y'' = \frac{4}{3}e^{2t}']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-v
    where: 'example: v₁ = ½e^t and v₂ = −e^(3t)/6 give x-component ½e^(2t) − e^(2t)/6 = e^(2t)/3 (at t = 0)'
    inputs: {}
    formula: 0.5 - 1/6
    expected: '0.33333'
    shown: ['and $\vec v = (\frac{1}{2}e^t']
    source: {cite: reading1, at: 'pp. 15–16'}
    origin: page-own
