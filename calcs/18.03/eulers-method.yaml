# Calculations on content/year-2/18.03/eulers-method.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 2 transcript, with the page's own numbers.

page: content/year-2/18.03/eulers-method.mdx
calcs:
  - id: table-A1
    where: 'table: A₁ = 0.1² − 0.9² = −0.80'
    inputs: {}
    formula: 0.1**2 - 0.9**2
    expected: '-0.80'
    shown: ['| 1 | 0.1 | 0.9 | $-0.80$ | $-0.08$ |']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: table-y2
    where: 'table: y₂ = 0.9 − 0.08 = 0.82'
    inputs: {}
    formula: 1 + 0.1 * (0 - 1) + 0.1 * (0.1**2 - 0.9**2)
    expected: '0.82'
    shown: ['So Euler gives $y(0.2) \approx 0.82$']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: second-derivative
    where: 'formula "Second derivative from the equation": y″(0) = 2'
    inputs: {}
    formula: 2 * 0 - 2 * 1 * (-1)
    expected: '2'
    shown: ['y''''(0) = 2(0) - 2(1)(-1) = 2']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: euler-half
    where: 'worked example (a): 1.5² = 2.25, error 0.47'
    inputs: {}
    formula: e - 1.5**2
    expected: '0.47'
    tolerance: '0.5%'
    shown: ['$y(1) \approx 1.5^2 = 2.25$, error 0.47']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: euler-quarter
    where: 'worked example (a): 1.25⁴ ≈ 2.441, error 0.28'
    inputs: {}
    formula: 1.25**4
    expected: '2.441'
    tolerance: '0.05%'
    shown: ['$1.25^4 \approx 2.441$, error 0.28']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: error-ratio
    where: 'worked example (a): error ratio ≈ 1.7'
    inputs: {}
    formula: (e - 2.25) / (e - 1.25**4)
    expected: '1.7'
    tolerance: '2%'
    shown: ['a factor of about 1.7']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: heun-factor
    where: 'worked example (b): 1 + h + h²/2 = 1.625'
    inputs: {}
    formula: 1 + 0.5 + 0.5**2 / 2
    expected: '1.625'
    shown: ['$1 + h + h^2/2 = 1.625$']
    source: {cite: reading1, at: 'pp. 14–15'}
    origin: page-own

  - id: heun-result
    where: 'worked example (b): 1.625² ≈ 2.641, error 0.08'
    inputs: {}
    formula: e - 1.625**2
    expected: '0.08'
    tolerance: '5%'
    shown: ['$1.625^2 \approx 2.641$, error 0.08']
    source: {cite: reading1, at: 'pp. 14–16'}
    origin: page-own

  - id: blowup
    kind: identity
    where: 'section "A pitfall": y = 1/(c − x) solves y′ = y²'
    formula: ((1 / (c - x - 1e-6)) - (1 / (c - x + 1e-6))) / 2e-6
    equals: (1 / (c - x))**2
    samples: {c: [1.0, 3.0], x: [0.2, -1.0]}
    tolerance: 1e-5
    shown: ['the solutions $y = 1/(c - x)$']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit
