# Calculations on content/year-2/18.03/laplace-discontinuous-inputs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 22 transcript, with the page's own examples.
# Transforms are checked by numerical integration at sample values of s.

page: content/year-2/18.03/laplace-discontinuous-inputs.mdx
calcs:
  - id: box-transform
    where: 'L(u(t − 2) − u(t − 4)) at s = 1 equals (e^(−2) − e^(−4))/1'
    inputs: {}
    formula: integrate('exp(-t)', 't', 2, 4)
    expected: '0.117019'
    tolerance: '1e-6'
    shown: ['{e^{-as} - e^{-bs}}{s}" cite']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: parabola-transform
    where: 'L(u(t − 1)t²) at s = 2 equals e^(−2)(2/8 + 2/4 + 1/2)'
    inputs: {}
    formula: integrate('t**2*exp(-2*t)', 't', 1, 60)
    expected: '0.169169'
    tolerance: '1e-5'
    shown: ['+ \frac{2}{s^2} + \frac{1}{s}']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: arch-transform
    where: 'one arch of sin t has transform (1 + e^(−πs))/(s² + 1); at s = 1: (1 + e^(−π))/2'
    inputs: {}
    formula: integrate('sin(t)*exp(-t)', 't', 0, pi)
    expected: '0.521607'
    tolerance: '1e-5'
    shown: ['{1 + e^{-\pi s}}{s^2 + 1}']
    source: {cite: reading1, at: 'pp. 15–16'}
    origin: mit

  - id: ex-b
    where: 'example (b): L(u(t − 2)e^t) at s = 3 equals e^(−6)e²/2'
    inputs: {}
    formula: integrate('exp(t)*exp(-3*t)', 't', 2, 60)
    expected: '0.0091578'
    tolerance: '1e-6'
    shown: ['{e^2}{s - 1}$, for $s > 1$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-c
    kind: identity
    where: 'example (c): y = 1 − e^(−(t − 1)) for t > 1 solves y′ + y = 1'
    formula: ((1 - exp(-(t + 1e-4 - 1))) - (1 - exp(-(t - 1e-4 - 1)))) / 2e-4 + (1 - exp(-(t - 1)))
    equals: 1 + 0*t
    samples: {t: [1.5, 2.0, 4.0]}
    tolerance: 1e-4
    shown: ['$y = u(t - 1)\left(1 - e^{-(t - 1)}\right)$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-d
    where: 'example (d): L(u(t − 3)(t − 3)) at s = 1 equals e^(−3)'
    inputs: {}
    formula: integrate('(t - 3)*exp(-t)', 't', 3, 60)
    expected: '0.049787'
    tolerance: '1e-6'
    shown: ['comes from $u(t - 3)(t - 3)$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
