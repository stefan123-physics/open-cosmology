# Calculations on content/year-2/18.03/exponential-input-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 13 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/exponential-input-theorem.mdx
calcs:
  - id: lecture-example
    kind: identity
    where: 'lecture example: (5/3)e^(−x)(cos x + sin x) solves y″ − y′ + 2y = 10e^(−x) sin x'
    formula: ((5/3)*exp(-(x+1e-4))*(cos(x+1e-4) + sin(x+1e-4)) - 2*(5/3)*exp(-x)*(cos(x) + sin(x)) + (5/3)*exp(-(x-1e-4))*(cos(x-1e-4) + sin(x-1e-4))) / 1e-8 - ((5/3)*exp(-(x+1e-4))*(cos(x+1e-4) + sin(x+1e-4)) - (5/3)*exp(-(x-1e-4))*(cos(x-1e-4) + sin(x-1e-4))) / 2e-4 + 2 * (5/3)*exp(-x)*(cos(x) + sin(x))
    equals: 10 * exp(-x) * sin(x)
    samples: {x: [0.0, 0.8, 2.0]}
    tolerance: 1e-3
    shown: ['y_p = \frac{5}{3}\,e^{-x}(\cos x + \sin x)']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: p-of-alpha-real
    where: 'lecture example: real part of p(−1 + i) = (1 − 1) + 1 + 2'
    inputs: {}
    formula: (1 - 1) + 1 + 2
    expected: '3'
    shown: ['{3 - 3i}']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: mit

  - id: polar-form
    kind: identity
    where: 'cos x + sin x = √2 cos(x − π/4)'
    formula: (5/3) * (cos(x) + sin(x))
    equals: (5 * sqrt(2) / 3) * cos(x - pi/4)
    samples: {x: [0.0, 1.0, 2.5]}
    tolerance: 1e-9
    shown: ['= \frac{5\sqrt2}{3}\,e^{-x}']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: simple-root-example
    kind: identity
    where: 'lecture example: −xe^x solves y″ − 3y′ + 2y = e^x'
    formula: ((-(x+1e-4)*exp(x+1e-4)) - 2*(-x*exp(x)) + (-(x-1e-4)*exp(x-1e-4))) / 1e-8 - 3 * ((-(x+1e-4)*exp(x+1e-4)) - (-(x-1e-4)*exp(x-1e-4))) / 2e-4 + 2 * (-x*exp(x))
    equals: exp(x)
    samples: {x: [0.0, 0.5, 1.2]}
    tolerance: 1e-3
    shown: ['= -x\,e^x']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: ex-a
    where: 'example (a): p(−1) = 1 + 4'
    inputs: {}
    formula: (-1)**2 + 4
    expected: '5'
    shown: ['$p(-1) = 5$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-b
    kind: identity
    where: 'example (b): (−cos 2x + 2 sin 2x)/10 solves y″ + 2y′ + 2y = cos 2x'
    formula: (((-cos(2*(x+1e-4)) + 2*sin(2*(x+1e-4)))/10) - 2*((-cos(2*x) + 2*sin(2*x))/10) + ((-cos(2*(x-1e-4)) + 2*sin(2*(x-1e-4)))/10)) / 1e-8 + 2 * (((-cos(2*(x+1e-4)) + 2*sin(2*(x+1e-4)))/10) - ((-cos(2*(x-1e-4)) + 2*sin(2*(x-1e-4)))/10)) / 2e-4 + 2 * ((-cos(2*x) + 2*sin(2*x))/10)
    equals: cos(2*x)
    samples: {x: [0.0, 0.8, 2.0]}
    tolerance: 1e-3
    shown: ['y_p = \frac{1}{10}(-\cos 2x + 2\sin 2x)']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-b-amplitude
    where: 'example (b): amplitude √(1 + 4)/10'
    inputs: {}
    formula: sqrt(5) / 10
    expected: '0.224'
    shown: ['\approx 0.224$']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-c
    kind: identity
    where: 'example (c): xe^(2x)/4 solves y″ − 4y = e^(2x)'
    formula: (((x+1e-4)*exp(2*(x+1e-4))/4) - 2*(x*exp(2*x)/4) + ((x-1e-4)*exp(2*(x-1e-4))/4)) / 1e-8 - 4 * (x*exp(2*x)/4)
    equals: exp(2*x)
    samples: {x: [0.0, 0.5, 1.0]}
    tolerance: 1e-3
    shown: ['y_p = \frac14 xe^{2x}']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-d
    kind: identity
    where: 'example (d): x²e^(3x)/2 solves y″ − 6y′ + 9y = e^(3x)'
    formula: (((x+1e-4)**2*exp(3*(x+1e-4))/2) - 2*(x**2*exp(3*x)/2) + ((x-1e-4)**2*exp(3*(x-1e-4))/2)) / 1e-8 - 6 * (((x+1e-4)**2*exp(3*(x+1e-4))/2) - ((x-1e-4)**2*exp(3*(x-1e-4))/2)) / 2e-4 + 9 * (x**2*exp(3*x)/2)
    equals: exp(3*x)
    samples: {x: [0.0, 0.4, 0.9]}
    tolerance: 1e-3
    shown: ['y_p = \frac12 x^2e^{3x}']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: quiz-1
    where: 'quiz 1: p(2) = 4 + 6 + 2'
    inputs: {}
    formula: 2**2 + 3*2 + 2
    expected: '12'
    shown: ['$p(2) = 4 + 6 + 2 = 12$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
