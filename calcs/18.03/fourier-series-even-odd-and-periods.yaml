page: content/year-2/18.03/fourier-series-even-odd-and-periods.mdx
calcs:
  - id: sawtooth-b3
    where: 'sawtooth: b₃ = (2/π)∫₀^π t sin 3t = 2/3'
    inputs: {}
    formula: (2 / pi) * integrate('t*sin(3*t)', 't', 0, pi)
    expected: '0.6667'
    shown: ['= \frac{2}{n}(-1)^{n+1}" cite']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: sawtooth-b2
    where: 'sawtooth: b₂ = −1'
    inputs: {}
    formula: (2 / pi) * integrate('t*sin(2*t)', 't', 0, pi)
    expected: '-1'
    tolerance: '1e-9'
    shown: ['- \frac{\sin 2t}{2} + \frac{\sin 3t}{3} - \cdots\right)" cite']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: mit

  - id: ex-a-constant
    where: 'example (a): a₀/2 = ½∫₀² t dt'
    inputs: {}
    formula: 0.5 * integrate('t', 't', 0, 2)
    expected: '1'
    tolerance: '1e-9'
    shown: ['\int_0^2t\,dt = 1$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-a-a1
    where: 'example (a): a₁ = −8/π²'
    inputs: {}
    formula: integrate('t*cos(pi*t/2)', 't', 0, 2)
    expected: '-0.81057'
    shown: ['-\frac{8}{n^2\pi^2}$ for odd $n$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-b-b1
    where: 'example (b): b₁ = 4/π'
    inputs: {}
    formula: integrate('sin(pi*t/2)', 't', 0, 2)
    expected: '1.27324'
    shown: ['$\frac{4}{n\pi}$ for odd $n$, 0 for even. At']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-c
    where: 'example (c): 2·π/4 = π/2'
    inputs: {}
    formula: 2 * (pi / 4)
    expected: '1.5708'
    shown: ['= 2\cdot\frac{\pi}{4} = \frac{\pi}{2}$']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own
