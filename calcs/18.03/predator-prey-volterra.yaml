# Calculations on content/year-2/18.03/predator-prey-volterra.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 33 transcript, with the page's own example.

page: content/year-2/18.03/predator-prey-volterra.mdx
calcs:
  - id: peak-value
    where: 'graph: the maximum of u e^(−u) at u = 1 is 1/e'
    inputs: {}
    formula: exp(-1)
    expected: '0.3679'
    shown: ['y: 0.3679']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: conserved
    kind: identity
    where: 'h = x e^(−x) y e^(−y) is constant along x′ = −x + xy, y′ = y − xy: h_x x′ + h_y y′ = 0'
    formula: (1 - x)*exp(-x)*y*exp(-y)*(-x + x*y) + x*exp(-x)*(1 - y)*exp(-y)*(y - x*y)
    equals: 0*x
    samples: {x: [0.5, 1.5, 2.0], y: [0.3, 2.0, 1.2]}
    tolerance: 1e-12
    shown: ['x\,e^{-x}\cdot y\,e^{-y} = C']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: ex-conserved
    kind: identity
    where: 'example (b): x³e^(−x) y²e^(−y) is constant along x′ = −2x + xy, y′ = 3y − xy'
    formula: (3*x**2 - x**3)*exp(-x)*y**2*exp(-y)*(-2*x + x*y) + x**3*exp(-x)*(2*y - y**2)*exp(-y)*(3*y - x*y)
    equals: 0*x
    samples: {x: [0.5, 1.5, 4.0], y: [0.3, 2.0, 1.2]}
    tolerance: 1e-9
    shown: ['x^3e^{-x}\cdot y^2e^{-y} = C']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-eigen
    where: 'example (a): λ² + 6 = 0 from J(3, 2) with det 0·0 − 3·(−2)'
    inputs: {}
    formula: 0*0 - 3*(-2)
    expected: '6'
    shown: ['$\lambda^2 + 6 = 0$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-fishing
    where: 'example (c): (c − k)/d = (3 − 1)/1'
    inputs: {}
    formula: (3 - 1) / 1
    expected: '2'
    shown: ['= (2, 3)$: fewer predators']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
