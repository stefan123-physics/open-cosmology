# Calculations on content/year-2/18.03/laplace-transform-introduction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 19 transcript, with the page's own examples.
# Transforms are checked by numerical integration at sample values of s (upper limit 60 stands in for infinity).

page: content/year-2/18.03/laplace-transform-introduction.mdx
calcs:
  - id: transform-of-1
    where: 'L(1) = 1/s at s = 2'
    inputs: {}
    formula: integrate('exp(-2*t)', 't', 0, 60)
    expected: '0.5'
    tolerance: '1e-6'
    shown: ['= \frac{1}{s}, \qquad s > 0']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: mit

  - id: transform-of-cos
    where: 'L(cos 3t) = s/(s² + 9) at s = 2: 2/13'
    inputs: {}
    formula: integrate('cos(3*t)*exp(-2*t)', 't', 0, 60)
    expected: '0.153846'
    tolerance: '1e-5'
    shown: ['= \frac{s}{s^2 + a^2}" cite']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: transform-of-sin
    where: 'L(sin 3t) = a/(s² + a²) at s = 2: 3/13'
    inputs: {}
    formula: integrate('sin(3*t)*exp(-2*t)', 't', 0, 60)
    expected: '0.230769'
    tolerance: '1e-5'
    shown: ['= \frac{a}{s^2 + a^2}" cite']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: transform-of-t3
    where: 'L(t³) = 3!/s⁴ at s = 2: 6/16'
    inputs: {}
    formula: integrate('t**3*exp(-2*t)', 't', 0, 60)
    expected: '0.375'
    tolerance: '1e-5'
    shown: ['= \frac{n!}{s^{n+1}}, \qquad s > 0']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: inverse-example
    where: 'L(1/3 − e^(−3t)/3) = 1/(s(s + 3)) at s = 2: 1/10'
    inputs: {}
    formula: integrate('(1/3 - exp(-3*t)/3)*exp(-2*t)', 't', 0, 60)
    expected: '0.1'
    tolerance: '1e-5'
    shown: ['- \frac{1}{3}\,e^{-3t}']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: ex-a
    where: 'example (a): L(e^(2t) cos 3t) at s = 4: 2/13'
    inputs: {}
    formula: integrate('exp(2*t)*cos(3*t)*exp(-4*t)', 't', 0, 60)
    expected: '0.153846'
    tolerance: '1e-5'
    shown: ['{(s - 2)^2 + 9}$, for $s > 2$']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-b
    where: 'example (b): L(t³ − 4t) at s = 2: 6/16 − 4/4'
    inputs: {}
    formula: integrate('(t**3 - 4*t)*exp(-2*t)', 't', 0, 60)
    expected: '-0.625'
    tolerance: '1e-5'
    shown: ['= \frac{6}{s^4} - \frac{4}{s^2}$']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: ex-c
    where: 'example (c): L(−1/2 + (3/2)e^(2t)) at s = 4: (s + 1)/(s(s − 2)) = 5/8'
    inputs: {}
    formula: integrate('(-0.5 + 1.5*exp(2*t))*exp(-4*t)', 't', 0, 60)
    expected: '0.625'
    tolerance: '1e-5'
    shown: ['-\frac{1}{2} + \frac{3}{2}e^{2t}$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own
