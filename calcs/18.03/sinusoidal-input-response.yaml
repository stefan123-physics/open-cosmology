# Calculations on content/year-2/18.03/sinusoidal-input-response.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 7 transcript, with the page's own numbers.

page: content/year-2/18.03/sinusoidal-input-response.mdx
calcs:
  - id: response-solves-ode
    kind: identity
    where: 'A cos(ωt − φ) solves y′ + ky = k cos ωt'
    formula: (1 / sqrt(1 + (w/k)**2)) * (-w * sin(w*t - atan(w/k))) + k * (1 / sqrt(1 + (w/k)**2)) * cos(w*t - atan(w/k))
    equals: k * cos(w*t)
    samples: {w: [0.25, 1.0, 3.0], k: [0.25, 1.0, 2.0], t: [0.0, 1.7, 4.2]}
    tolerance: 1e-6
    shown: ['$\phi$ the **phase lag**']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: cartesian-equals-polar
    kind: identity
    where: 'section "Amplitude and phase lag": the Cartesian form equals the polar one'
    formula: (cos(w*t) + (w/k) * sin(w*t)) / (1 + (w/k)**2)
    equals: (1 / sqrt(1 + (w/k)**2)) * cos(w*t - atan(w/k))
    samples: {w: [0.25, 1.0, 3.0], k: [0.25, 1.0, 2.0], t: [0.0, 1.7, 4.2]}
    tolerance: 1e-6
    shown: ['written as a combination of cosine and sine']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: plot-amplitude
    where: 'graph: ω = k gives A = 1/√2'
    inputs: {}
    formula: 1 / sqrt(2)
    expected: '0.71'
    shown: ['A = 1/√2 ≈ 0.71']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: plot-transient
    where: 'graph: y(0) = 0 needs C = −A cos φ = −0.5'
    inputs: {}
    formula: -(1 / sqrt(2)) * cos(pi / 4)
    expected: '-0.5'
    shown: ['− 0.5e^(−kt)']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-a-amplitude
    where: 'worked example (a): 8 A with ω/k = 1'
    inputs: {}
    formula: 8 / sqrt(2)
    expected: '5.66'
    shown: ['20 + 5.66']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-a-A
    where: 'worked example (a): A = 1/√2'
    inputs: {}
    formula: 1 / sqrt(2)
    expected: '0.707'
    shown: ['\approx 0.707$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b-lag
    where: 'worked example (b): time lag φ/ω'
    inputs: {}
    formula: (pi / 4) / 0.25
    expected: '3.14'
    shown: ['3.14$ minutes']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-c-denominator
    where: 'worked example (c): 1 + 0.25²'
    inputs: {}
    formula: 1 + 0.25**2
    expected: '1.0625'
    shown: ['1.0625']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-c-A
    where: 'worked example (c): A'
    inputs: {}
    formula: 1 / sqrt(1.0625)
    expected: '0.970'
    shown: ['0.970']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-c-swing
    where: 'worked example (c): 8 A'
    inputs: {}
    formula: 8 / sqrt(1.0625)
    expected: '7.76'
    shown: ['7.76']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-c-phi
    where: 'worked example (c): φ = arctan 0.25'
    inputs: {}
    formula: atan(0.25)
    expected: '0.245'
    shown: ['0.245']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-c-phi-deg
    where: 'worked example (c): φ in degrees'
    inputs: {}
    formula: atan(0.25) * 180 / pi
    expected: '14.0'
    shown: ['(14.0°)']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-c-lag
    where: 'worked example (c): time lag φ/ω with ω = 0.25'
    inputs: {}
    formula: atan(0.25) / 0.25
    expected: '0.98'
    shown: ['0.98$ minutes']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own
