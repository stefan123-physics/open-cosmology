# Calculations on content/year-2/18.03/first-order-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 24 transcript, with the page's own example.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/first-order-systems.mdx
calcs:
  - id: egg-T1
    kind: identity
    where: 'T₁ = 50e^(−t) − 10e^(−6t) and T₂ = 25e^(−t) + 20e^(−6t) satisfy T₁′ = −2T₁ + 2T₂'
    formula: ((50*exp(-(t+1e-4)) - 10*exp(-6*(t+1e-4))) - (50*exp(-(t-1e-4)) - 10*exp(-6*(t-1e-4)))) / 2e-4
    equals: -2*(50*exp(-t) - 10*exp(-6*t)) + 2*(25*exp(-t) + 20*exp(-6*t))
    samples: {t: [0.0, 0.5, 1.5]}
    tolerance: 1e-4
    shown: ['T_1 = 50e^{-t} - 10e^{-6t}']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: egg-T2
    kind: identity
    where: 'and T₂′ = 2T₁ − 5T₂'
    formula: ((25*exp(-(t+1e-4)) + 20*exp(-6*(t+1e-4))) - (25*exp(-(t-1e-4)) + 20*exp(-6*(t-1e-4)))) / 2e-4
    equals: 2*(50*exp(-t) - 10*exp(-6*t)) - 5*(25*exp(-t) + 20*exp(-6*t))
    samples: {t: [0.0, 0.5, 1.5]}
    tolerance: 1e-4
    shown: ['T_2 = 25e^{-t} + 20e^{-6t}']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: egg-coefficients
    where: 'eliminating: 4 − 10 = −6, so +6T₁; 2 + 5 = 7'
    inputs: {}
    formula: -(4 - 10) + (2 + 5)
    expected: '13'
    shown: ["+ 7T_1' + 6T_1 = 0"]
    source: {cite: reading1, at: 'pp. 10–11'}
    origin: mit

  - id: egg-initial
    where: 'c₁ + c₂ = 40 and c₁/2 − 2c₂ = 45 with c₁ = 50, c₂ = −10'
    inputs: {}
    formula: (50 + -10) + (50/2 - 2*(-10))
    expected: '85'
    shown: ['$c_2 = -10$, $c_1 = 50$']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: ex-solves
    kind: identity
    where: 'example: x = e^(−2t) + e^(−4t), y = e^(−2t) − e^(−4t) satisfy x′ = −3x + y'
    formula: ((exp(-2*(t+1e-4)) + exp(-4*(t+1e-4))) - (exp(-2*(t-1e-4)) + exp(-4*(t-1e-4)))) / 2e-4
    equals: -3*(exp(-2*t) + exp(-4*t)) + (exp(-2*t) - exp(-4*t))
    samples: {t: [0.0, 0.5, 1.5]}
    tolerance: 1e-4
    shown: ['$x = e^{-2t} + e^{-4t}$']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-solves-y
    kind: identity
    where: 'and y′ = x − 3y'
    formula: ((exp(-2*(t+1e-4)) - exp(-4*(t+1e-4))) - (exp(-2*(t-1e-4)) - exp(-4*(t-1e-4)))) / 2e-4
    equals: (exp(-2*t) + exp(-4*t)) - 3*(exp(-2*t) - exp(-4*t))
    samples: {t: [0.0, 0.5, 1.5]}
    tolerance: 1e-4
    shown: ['$y = e^{-2t} - e^{-4t}$']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: yolk-peak
    where: 'graph caption: T₁ peaks at t = ln(1.2)/5, about 0.17 °C above 40'
    inputs: {}
    formula: (50*exp(-log(1.2)/5) - 10*exp(-6*log(1.2)/5)) - 40
    expected: '0.2'
    tolerance: 0.05
    shown: ['under 0.2 °C']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: page-own
