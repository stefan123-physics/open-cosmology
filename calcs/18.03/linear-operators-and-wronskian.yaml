# Calculations on content/year-2/18.03/linear-operators-and-wronskian.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 11 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/linear-operators-and-wronskian.mdx
calcs:
  - id: wronskian-cos-sin
    kind: identity
    where: 'quiz 2: W(cos x, sin x) = 1'
    formula: cos(x) * cos(x) - sin(x) * (-sin(x))
    equals: 1 + 0*x
    samples: {x: [0.0, 1.1, 3.0]}
    tolerance: 1e-9
    shown: ['What is the Wronskian of']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: cosh-normalized
    where: 'normalized Y₁ = cosh x of y″ − y = 0 has Y₁(0) = 1'
    inputs: {}
    formula: (exp(0) + exp(-0)) / 2
    expected: '1'
    shown: ['= \cosh x']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: sinh-slope
    where: 'normalized Y₂ = sinh x has Y₂′(0) = (e⁰ + e⁰)/2 = 1'
    inputs: {}
    formula: (exp(1e-6) - exp(-1e-6)) / 2 / 1e-6
    expected: '1'
    shown: ['= \sinh x']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: ex-a-wronskian
    kind: identity
    where: 'example (a): W(e^(−at), te^(−at)) = e^(−2at)'
    formula: exp(-a*t) * (exp(-a*t) - a*t*exp(-a*t)) - t*exp(-a*t) * (-a*exp(-a*t))
    equals: exp(-2*a*t)
    samples: {t: [0.0, 0.8, 2.5], a: [1.0, 2.0, 0.5]}
    tolerance: 1e-9
    shown: ['= e^{-2at}$, never zero']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: ex-b-wronskian
    kind: identity
    where: 'example (b): W(e^(2x), e^(−2x)) = −4'
    formula: exp(2*x) * (-2*exp(-2*x)) - exp(-2*x) * (2*exp(2*x))
    equals: -4 + 0*x
    samples: {x: [0.0, 0.9, -1.5]}
    tolerance: 1e-9
    shown: ['= -4$, never zero']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: ex-b-Y2
    where: 'example (b): Y₂ = ½ sinh 2x has slope cosh 0 = 1 at 0'
    inputs: {}
    formula: (0.5 * sinh(2e-6) - 0.5 * sinh(-2e-6)) / 2e-6
    expected: '1'
    shown: ['Y_2 = \frac12\sinh 2x']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-c-solves
    kind: identity
    where: 'example (c): 3 cosh 2x − sinh 2x solves y″ − 4y = 0'
    formula: ((3*cosh(2*(x+1e-4)) - sinh(2*(x+1e-4))) - 2*(3*cosh(2*x) - sinh(2*x)) + (3*cosh(2*(x-1e-4)) - sinh(2*(x-1e-4)))) / 1e-8
    equals: 4 * (3*cosh(2*x) - sinh(2*x))
    samples: {x: [0.0, 0.5, 1.2]}
    tolerance: 1e-4
    shown: ['3\cosh 2x - \sinh 2x$. Check']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-c-slope
    where: 'example (c): y′(0) = 6 sinh 0 − 2 cosh 0'
    inputs: {}
    formula: 6 * sinh(0) - 2 * cosh(0)
    expected: '-2'
    shown: ['- 2\cosh 0 = -2$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: abel-age
    kind: fact
    where: 'Abel died at 26 (1802–1829)'
    value: '26'
    shown: ['he died at 26']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit
