# Calculations on content/year-2/18.03/nonlinear-autonomous-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 31 transcript, with the page's own example.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/nonlinear-autonomous-systems.mdx
calcs:
  - id: origin-eigen
    where: 'λ² + λ + 2 = 0: imaginary part √7/2 (the plot uses 1.3229)'
    inputs: {}
    formula: sqrt(7) / 2
    expected: '1.3229'
    shown: ['sin(1.3229*s))", y:']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: saddle-char
    kind: identity
    where: 'at (π, 0): λ² + λ − 2 = (λ + 2)(λ − 1)'
    formula: l**2 + l - 2
    equals: (l + 2)*(l - 1)
    samples: {l: [-1.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['$\lambda^2 + \lambda - 2 = (\lambda + 2)(\lambda - 1) = 0$']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: saddle-eigvec
    where: 'at (π, 0): J(1, −2) second component 2·1 − 1·(−2) = 4 = −2·(−2)'
    inputs: {}
    formula: 2*1 - 1*(-2)
    expected: '4'
    shown: ['for $\lambda = -2$ it is $(1, -2)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: plot-trajectory
    kind: identity
    where: 'graph: θ = e^(−t/2)(cos(√7t/2) + sin(√7t/2)/√7) has θ′ = −(4/√7)e^(−t/2) sin(√7t/2), the plotted ω'
    formula: (exp(-(t+1e-4)/2)*(cos(sqrt(7)*(t+1e-4)/2) + sin(sqrt(7)*(t+1e-4)/2)/sqrt(7)) - exp(-(t-1e-4)/2)*(cos(sqrt(7)*(t-1e-4)/2) + sin(sqrt(7)*(t-1e-4)/2)/sqrt(7))) / 2e-4
    equals: -(4/sqrt(7))*exp(-t/2)*sin(sqrt(7)*t/2)
    samples: {t: [0.0, 1.0, 3.0]}
    tolerance: 1e-4
    shown: ['-1.51186*exp(-s/2)']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: plot-solves
    kind: identity
    where: 'graph: that θ satisfies θ″ + θ′ + 2θ = 0'
    formula: (-(4/sqrt(7))*exp(-(t+1e-4)/2)*sin(sqrt(7)*(t+1e-4)/2) + (4/sqrt(7))*exp(-(t-1e-4)/2)*sin(sqrt(7)*(t-1e-4)/2)) / 2e-4 - (4/sqrt(7))*exp(-t/2)*sin(sqrt(7)*t/2) + 2*exp(-t/2)*(cos(sqrt(7)*t/2) + sin(sqrt(7)*t/2)/sqrt(7))
    equals: 0*t
    samples: {t: [0.0, 1.0, 3.0]}
    tolerance: 1e-3
    shown: ['released from rest at θ = 1']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-coexist
    where: 'example: x + y = 4 and x + 3y = 6 give y = 1'
    inputs: {}
    formula: (6 - 4) / 2
    expected: '1'
    shown: ['$x + 3y = 6$: $(3, 1)$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-det
    where: 'example: det J(3, 1) = (−3)(−3) − (−3)(−1)'
    inputs: {}
    formula: (-3)*(-3) - (-3)*(-1)
    expected: '6'
    shown: ['determinant $9 - 3 = 6$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-eigen
    where: 'example: λ = −3 + √3 is negative'
    inputs: {}
    formula: -3 + sqrt(3)
    expected: '-1.268'
    shown: ['both negative: a nodal sink']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own
