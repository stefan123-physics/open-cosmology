  # ---- Problem 29

  - id: p29-a-2
    kind: identity
    answer: p29-a-2
    where: 'Problem 29(a), answer box of diagram 2: the transform of e^(−t) sin 4t, against the numerically integrated defining integral'
    formula: 4/((s + 1)**2 + 16)
    equals: integrate('exp(-x)*sin(4*x)*exp(-s*x)', 'x', 0, 60)
    samples: {s: [0.3, 1, 2, 4]}
    tolerance: 1e-6
    shown: ['expr="4/((s + 1)^2 + 16)"']
    source: {cite: solutions, at: 'Problem 29(a)(2), p. 1'}
    origin: mit

  - id: p29-a-2-number
    where: 'Problem 29(a), check: the transform of e^(−t) sin 4t at s = 1, by numerical integration'
    inputs: {}
    formula: integrate('exp(-x)*sin(4*x)*exp(-x)', 'x', 0, 60)
    expected: '0.2'
    shown: ['$\dfrac{4}{4 + 16} = 0.2$']
    source: {cite: mit, at: 'Part II, Problem 29(a) (our own check)'}
    origin: page-own

  - id: p29-a-4
