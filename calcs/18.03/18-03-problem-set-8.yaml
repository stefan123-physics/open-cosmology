    equals: integrate('exp(-s*x)', 'x', 0, b)
    samples:
      b: [0.5, 1, 2, 1.3]
      s: [0.3, 1, 4, 2]
    tolerance: 1e-8
    shown: ['expr="(1 - exp(-b*s))/s"']
    source: {cite: solutions, at: 'Problem 29(a)(4), p. 1'}
    origin: mit

  - id: p29-a-4-number
