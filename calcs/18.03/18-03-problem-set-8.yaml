# Calculations on content/year-2/18.03/18-03-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# transforms by numerical integration of the defining integral, solutions by putting them back into their
# differential equations (numerical derivatives) and by their starting values, the practical resonance by a
# numerical root of the derivative and by the lesson's formula, zeros and crossing times by numerical roots,
# and eigenvectors through the row of A − λI that the page's solution did not use first.
# The general solution and the picture of Problem 33(c) are our own (MIT's solution shows a Mathlet picture only).

page: content/year-2/18.03/18-03-problem-set-8.mdx
