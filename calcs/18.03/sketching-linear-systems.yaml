# Calculations on content/year-2/18.03/sketching-linear-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 27 transcript, with the page's own examples.

page: content/year-2/18.03/sketching-linear-systems.mdx
calcs:
  - id: node-char
    kind: identity
    where: 'nodal sink: λ² + 4λ + 3 = (λ + 3)(λ + 1)'
    formula: l**2 + 4*l + 3
    equals: (l + 3)*(l + 1)
    samples: {l: [-2.0, 0.5, 3.0]}
    tolerance: 1e-9
    shown: ['(\lambda + 3)(\lambda + 1) = 0$ (p. 3)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: saddle-char
    kind: identity
    where: 'saddle: λ² + 4λ − 12 = (λ + 6)(λ − 2); determinant 3 − 15'
    formula: l**2 + 4*l + (3 - 15)
    equals: (l + 6)*(l - 2)
    samples: {l: [-2.0, 0.5, 3.0]}
    tolerance: 1e-9
    shown: ['(\lambda + 6)(\lambda - 2) = 0$ (p. 11)']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: saddle-eigvec
    where: 'saddle: A(3, −5) first component −3 + 3·(−5) = −18 = −6·3'
    inputs: {}
    formula: -1*3 + 3*(-5)
    expected: '-18'
    shown: ['eigenvector $(3, -5)$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: mit

  - id: spiral-real-part
    where: 'spiral: real part of (−4 ± √(16 − 20))/2'
    inputs: {}
    formula: -4 / 2
    expected: '-2'
    shown: ['= -2 \pm i']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: spiral-direction
    where: 'spiral: velocity at (1, 0) is (−1, 2)'
    inputs: {}
    formula: -1*1 + -1*0
    expected: '-1'
    shown: ['the system gives $(-1, 2)$']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: ex-c
    where: 'example (c): λ² + 2λ + 5 has real part −1 and imaginary part √(20 − 4)/2 = 2'
    inputs: {}
    formula: sqrt(4*5 - 4) / 2
    expected: '2'
    shown: ['$\lambda = -1 \pm 2i$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: saddle-eigvec-2
    where: 'saddle: A(1, 1) = (−1 + 3, 5 − 3) = 2(1, 1); first component'
    inputs: {}
    formula: -1 + 3
    expected: '2'
    shown: ['eigenvector $(1, 1)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: spiral-direction-y
    where: 'spiral: second component of the velocity at (1, 0) is 2·1 − 3·0'
    inputs: {}
    formula: 2*1 - 3*0
    expected: '2'
    shown: ['so the motion is counterclockwise']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: ex-c-direction
    where: 'example (c): velocity at (1, 0) is (−1, −1); second component'
    inputs: {}
    formula: -1*1 + -1*0
    expected: '-1'
    shown: ['the velocity is $(-1, -1)$']
    source: {cite: reading1, at: 'p. 17'}
    origin: page-own
