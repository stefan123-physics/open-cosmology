# Calculations on content/year-2/18.03/damped-oscillations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 10 transcript, with the page's own numbers.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/damped-oscillations.mdx
calcs:
  - id: damped-solves-ode
    kind: identity
    where: 'e^(−pt) cos(ω₁t) with ω₁² = ω₀² − p² solves y″ + 2py′ + ω₀²y = 0'
    formula: ((exp(-p*(t+1e-4))*cos(sqrt(w0**2 - p**2)*(t+1e-4))) - 2*(exp(-p*t)*cos(sqrt(w0**2 - p**2)*t)) + (exp(-p*(t-1e-4))*cos(sqrt(w0**2 - p**2)*(t-1e-4)))) / 1e-8 + 2*p * ((exp(-p*(t+1e-4))*cos(sqrt(w0**2 - p**2)*(t+1e-4))) - (exp(-p*(t-1e-4))*cos(sqrt(w0**2 - p**2)*(t-1e-4)))) / 2e-4
    equals: -w0**2 * exp(-p*t)*cos(sqrt(w0**2 - p**2)*t)
    samples: {t: [0.0, 0.7, 2.0], p: [0.4, 0.2, 1.0], w0: [2.0, 5.0, 3.0]}
    tolerance: 1e-3
    shown: ['A\,e^{-pt}\cos(\omega_1t - \phi)" cite']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: real-form-solves
    kind: identity
    where: 'e^(at)(2C cos bt − 2d sin bt) solves y″ − 2ay′ + (a² + b²)y = 0, whose roots are a ± bi'
    formula: ((exp(a*(t+1e-4))*(2*C*cos(b*(t+1e-4)) - 2*d*sin(b*(t+1e-4)))) - 2*(exp(a*t)*(2*C*cos(b*t) - 2*d*sin(b*t))) + (exp(a*(t-1e-4))*(2*C*cos(b*(t-1e-4)) - 2*d*sin(b*(t-1e-4))))) / 1e-8 - 2*a * ((exp(a*(t+1e-4))*(2*C*cos(b*(t+1e-4)) - 2*d*sin(b*(t+1e-4)))) - (exp(a*(t-1e-4))*(2*C*cos(b*(t-1e-4)) - 2*d*sin(b*(t-1e-4))))) / 2e-4
    equals: -(a**2 + b**2) * exp(a*t)*(2*C*cos(b*t) - 2*d*sin(b*t))
    samples: {t: [0.0, 0.7, 1.5], a: [-0.5, -1.0, 0.3], b: [2.0, 1.0, 3.0], C: [1.0, -0.5, 0.2], d: [0.7, 2.0, -1.0]}
    tolerance: 1e-3
    shown: ['(2C\cos bt - 2d\sin bt)']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: plot-omega1
    where: 'graph: ω₁ = √(4 − 0.16)'
    inputs: {}
    formula: sqrt(4 - 0.16)
    expected: '1.96'
    shown: ['0.16) ≈ 1.96']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: plot-omega1-expr
    where: 'graph: the curve uses ω₁ = 1.9596'
    inputs: {}
    formula: sqrt(4 - 0.16)
    expected: '1.9596'
    shown: ['cos(1.9596*t)']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: plot-half-period
    where: 'graph: crossings every π/ω₁'
    inputs: {}
    formula: pi / sqrt(4 - 0.16)
    expected: '1.60'
    shown: ['≈ 1.60']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-p
    where: 'example (a): p = c/2m'
    inputs: {}
    formula: 0.8 / (2 * 2)
    expected: '0.2'
    shown: ['$p = c/2m = 0.2$']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-omega0
    where: 'example (a): ω₀ = √(k/m)'
    inputs: {}
    formula: sqrt(50 / 2)
    expected: '5'
    shown: ['\sqrt{25} = 5$ rad/s']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-omega1
    where: 'example (a): ω₁ = √(25 − 0.04)'
    inputs: {}
    formula: sqrt(25 - 0.2**2)
    expected: '4.996'
    shown: ['\approx 4.996$ rad/s']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-pseudo-period
    where: 'example (b): 2π/ω₁'
    inputs: {}
    formula: 2 * pi / sqrt(25 - 0.04)
    expected: '1.2576'
    shown: ['1.2576$ s']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-period
    where: 'example (b): 2π/ω₀'
    inputs: {}
    formula: 2 * pi / 5
    expected: '1.2566'
    shown: ['1.2566$ s']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-envelope
    where: 'example (c): e^(−pt) at t = 10 s'
    inputs: {}
    formula: exp(-0.2 * 10)
    expected: '0.135'
    shown: ['e^{-2} \approx 0.135$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-envelope-percent
    where: 'example (c): as a percentage'
    inputs: {}
    formula: 100 * exp(-2)
    expected: '13.5'
    shown: ['about 13.5%']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-critical
    where: 'example (d): c = 2mω₀'
    inputs: {}
    formula: 2 * 2 * 5
    expected: '20'
    shown: ['= 20$ kg/s']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own
