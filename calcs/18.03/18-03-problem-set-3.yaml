# Calculations on content/year-2/18.03/18-03-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# critical points as numerical roots of the right side, the linearized rate as a numerical derivative,
# roots of the characteristic polynomial by a numerical solve, the constants of the door from the two
# initial conditions solved numerically, and each solution put back into its differential equation
# (numerical first and second derivatives).

page: content/year-2/18.03/18-03-problem-set-3.mdx
calcs:
  # ---- Introduction and last section

  - id: intro-points
    where: 'Introduction: the points of the four problems of Part II (16 + 12 + 15 + 17)'
    inputs: {}
    formula: 16 + 12 + 15 + 17
    expected: '60'
    shown: ['four problems (60 points)']
    source: {cite: solutions, at: 'points in square brackets, pp. 1–2'}
    origin: mit

  - id: intro-part-i-points
    where: 'Last section: the points of MIT''s Part I (8 + 12 + 9 + 7)'
    inputs: {}
    formula: 8 + 12 + 9 + 7
    expected: '36'
    shown: ['(36 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 8

  - id: p8-b-merge
    answer: p8-b-count
    where: 'Problem 8(b), answer box: the hunting rate at which the equilibria merge is the top of the parabola (1 − y)y, at the root of its slope 1 − 2y'
    inputs: {}
    formula: (1 - solve('1 - 2*x', 'x', 0, 1))*solve('1 - 2*x', 'x', 0, 1)
    expected: '0.25'
    shown: ['The square root is real exactly when $a \le \tfrac14$']
    source: {cite: solutions, at: 'Problem 8(b), p. 1'}
    origin: mit

  - id: p8-b-upper
    kind: identity
    answer: p8-b-upper
    where: 'Problem 8(b), answer box and formula "Critical points": against the numerical root of (1 − y)y − a above y = 1/2'
    formula: 1/2 + sqrt(1/4 - a)
    equals: solve('(1 - x)*x - a', 'x', 0.5, 2)
    samples: {a: [0.02, 0.1, 0.1875, 0.2]}
    tolerance: 1e-7
    shown: ['y = \frac12 \pm \sqrt{\frac14 - a}']
    source: {cite: solutions, at: 'Problem 8(b), p. 1'}
    origin: mit

  - id: p8-b-lower
    kind: identity
    where: 'Problem 8(b), formula "Critical points": the smaller root against the numerical root below y = 1/2'
    formula: 1/2 - sqrt(1/4 - a)
    equals: solve('(1 - x)*x - a', 'x', -1, 0.5)
    samples: {a: [0.02, 0.1, 0.1875, 0.2]}
    tolerance: 1e-7
    shown: ['y = \frac12 \pm \sqrt{\frac14 - a}']
    source: {cite: solutions, at: 'Problem 8(b), p. 1'}
    origin: mit

  - id: p8-b-wrong-sign
    kind: identity
    where: 'Problem 8(b), hint of a listed mistake: 1/2 + √(1/4 + a) put into y² − y + a gives 2a'
    formula: (1/2 + sqrt(1/4 + a))**2 - (1/2 + sqrt(1/4 + a)) + a
    equals: 2*a
    samples: {a: [0.02, 0.1, 0.1875, 0.2]}
    tolerance: 1e-9
    shown: ['you get $2a$, not $0$']
    source: {cite: solutions, at: 'Problem 8(b), p. 1'}
    origin: page-own

  - id: p8-b-top
    kind: identity
    where: 'Problem 8(b), check: the top of the parabola is f(1/2) = 1/4 − a'
    formula: (1 - 0.5)*0.5 - a
    equals: 1/4 - a
    samples: {a: [0.02, 0.1, 0.1875, 0.3]}
    tolerance: 1e-12
    shown: ['$f(\tfrac12) = \tfrac14 - a$']
    source: {cite: solutions, at: 'Problem 8(b), p. 1'}
    origin: page-own

  - id: p8-c-rate
    where: 'Problem 8(c): 187.5 animals a year in kilo-oryx a year'
