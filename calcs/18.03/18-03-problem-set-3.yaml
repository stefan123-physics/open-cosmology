  # The critically damped solution as the limit of the overdamped one: for distinct roots r1, r2 the solution with
  # x(0) = 1, x'(0) = 0 is (r2 e^(r1 t) − r1 e^(r2 t))/(r2 − r1); here r = −√5/2 ± 0.0001.
  - id: p12-a-x
    kind: identity
