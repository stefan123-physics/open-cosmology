  - id: p9-a
    kind: identity
    answer: p9-a
    where: 'Problem 9(a), answer box and formula "The equation for the excess": against the original right side at y = u + 3/4'
    formula: -u/2 - u**2
    equals: (1 - (u + 0.75))*(u + 0.75) - 3/16
    samples: {u: [0.1, 0.3, 0.5, -0.2, -0.5, 1.5]}
    tolerance: 1e-9
    shown: ['-\tfrac12\,u - u^2']
    source: {cite: solutions, at: 'Problem 9(a), p. 1 (MIT prints the factor u + 3/4 with the wrong sign)'}
    origin: mit

  - id: p9-a-second-point
    where: 'Problem 9(a), check: the other critical point y = 1/4 is u = −1/2, a root of −u/2 − u² between −1 and −0.1'
    inputs: {}
    formula: solve('-x/2 - x**2', 'x', -1, -0.1)
    expected: '-0.5'
    shown: ['The other critical point $y = \tfrac14$ is $u = -\tfrac12$']
    source: {cite: solutions, at: 'Problem 9(a), p. 1'}
    origin: page-own

  - id: p9-b
    kind: identity
    answer: p9-b
    where: 'Problem 9(b), answer box and formula "Its general solution" with c = 1: against the linearized equation, u = −2 du/dt, with the derivative taken numerically'
    formula: exp(-t/2)
    equals: -2*deriv('exp(-x/2)', 'x', t)
    samples: {t: [0.5, 1, 2.3, 4]}
    tolerance: 1e-7
    shown: ['u = c\,e^{-t/2}']
    source: {cite: solutions, at: 'Problem 9(b), p. 1'}
