    inputs: {}
    formula: -1.5 - sqrt(1.5**2 - 0.62/0.5)
    expected: '-2.505'
    shown: ['$-0.495$ and $-2.505$']
    source: {cite: setTwo, at: 'Problem 11, p. 2 (k = 0.62 is MIT''s remark; the roots are our own calculation)'}
    origin: page-own

  - id: p11-a-poly
    kind: identity
    answer: p11-a-poly
    where: 'Problem 11(a), answer box and formula "The characteristic polynomial": against (m s² + b s + k) from the differential equation applied to e^(st), divided by e^(st), with numerical derivatives'
    formula: s**2/2 + 3*s/2 + 5/8
    equals: (0.5*deriv('exp(s*x)', 'x', 0.3, 2) + 1.5*deriv('exp(s*x)', 'x', 0.3) + 0.625*exp(0.3*s))/exp(0.3*s)
