  - id: p11-b-ode
    kind: identity
    where: 'Problem 11(b): the solution with these constants satisfies the door equation, m x″ + b x′ = −k x (numerical derivatives)'
    formula: 0.5*deriv('(5*x0 + 2*v0)/4*exp(-x/2) - (x0 + 2*v0)/4*exp(-5*x/2)', 'x', t, 2) + 1.5*deriv('(5*x0 + 2*v0)/4*exp(-x/2) - (x0 + 2*v0)/4*exp(-5*x/2)', 'x', t)
    equals: -0.625*((5*x0 + 2*v0)/4*exp(-t/2) - (x0 + 2*v0)/4*exp(-5*t/2))
    samples:
      x0: [0.1, 0.5, 0.9, 0.25]
      v0: [-0.9, 0.3, 0.9, -0.7]
      t: [0.2, 0.3, 2, 0.4]
    tolerance: 1e-4
    shown: ['x = c_1\,e^{-t/2} + c_2\,e^{-5t/2}']
    source: {cite: solutions, at: 'Problem 11(b), p. 2'}
    origin: mit

