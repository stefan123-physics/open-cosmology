  # The boundary by another route: for x0 > 0 the solution starts positive and has at most one zero, so it has
  # crossed by a late time T exactly when x(T) < 0. The initial velocity at which x(T) = 0 (found numerically,
  # with x(T) divided by e^(−T/2)) tends to the boundary as T grows; at T = 10 it differs by a part in 10⁹.
  - id: p11-d-edge
    kind: identity
    answer: p11-d-edge
    where: 'Problem 11(d), answer box and formula "The door swings through": against the initial velocity for which the solution is zero at the late time T = 10'
    formula: -5*x0/2
    equals: solve('(5*x0 + 2*x)/4 - (x0 + 2*x)/4*exp(-2*10)', 'x', -10, 0)
    samples: {x0: [0.1, 0.25, 0.6, 1]}
    tolerance: 1e-6
    shown: ['\dot x_0 < -\tfrac52\,x_0']
    source: {cite: solutions, at: 'Problem 11(d), p. 2'}
    origin: mit

  - id: p11-d-number
    answer: p11-d-number
    where: 'Problem 11(d), answer box: the boundary for x₀ = 0.25, as the initial velocity for which the solution is zero at the late time T = 10'
    inputs: {}
    formula: solve('(5*0.25 + 2*x)/4 - (0.25 + 2*x)/4*exp(-2*10)', 'x', -10, 0)
    expected: '-0.625'
    shown: ['$\tfrac52 \cdot 0.25 = 0.625$']
    source: {cite: solutions, at: 'Problem 11(d), p. 2'}
    origin: mit

  - id: p11-d-number-direct
    where: 'Problem 11(d): 5/2 times 0.25'
    inputs: {}
