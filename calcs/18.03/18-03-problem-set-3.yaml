  - id: p11-b-c1
    kind: identity
    answer: p11-b-c1
    where: 'Problem 11(b), answer box and formula "The constants": against the numerical solution of the two initial conditions, with c₂ = x₀ − c₁ put into the condition on the slope'
    formula: (5*x0 + 2*v0)/4
    equals: solve('-x/2 - 5*(x0 - x)/2 - v0', 'x', -50, 50)
    samples:
      x0: [0.1, 0.5, 0.9, 0.25, 0.7]
      v0: [-0.9, 0.3, 0.9, -0.7, -0.2]
    tolerance: 1e-7
    shown: ['c_1 = \tfrac14\,(5x_0 + 2\dot x_0)']
    source: {cite: solutions, at: 'Problem 11(b), p. 2'}
    origin: mit

  - id: p11-b-c2
    kind: identity
    answer: p11-b-c2
    where: 'Problem 11(b), answer box and formula "The constants": against the numerical solution of the two initial conditions, with c₁ = x₀ − c₂ put into the condition on the slope'
    formula: -(x0 + 2*v0)/4
    equals: solve('-(x0 - x)/2 - 5*x/2 - v0', 'x', -50, 50)
    samples:
      x0: [0.1, 0.5, 0.9, 0.25, 0.7]
      v0: [-0.9, 0.3, 0.9, -0.7, -0.2]
    tolerance: 1e-7
    shown: ['c_2 = -\tfrac14\,(x_0 + 2\dot x_0)']
