# Calculations on content/year-2/18.03/18-03-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# transforms by numerical integration of the defining integral, responses by putting them back into their
# differential equations (numerical derivatives) and through their Laplace transforms, the convolution by numerical
# integration, and the partial-fraction constants by solving the decomposition for each of them at sample values of s.
# The step response of Problem 27(a) and the whole of the optional problem (D⁴ + I) are our own solutions.

page: content/year-2/18.03/18-03-problem-set-7.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the three problems of Part II (26 + 22 + 20)'
    inputs: {}
    formula: 26 + 22 + 20
    expected: '68'
    shown: ['three problems (68 points)']
    source: {cite: solutions, at: 'Part II solutions, pp. 1–2'}
    origin: mit

  - id: intro-part-i-points
    where: 'Introduction and last section: the points of MIT''s Part I (6 + 10 + 12)'
    inputs: {}
    formula: 6 + 10 + 12
    expected: '28'
    shown: ['(28 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 26

  - id: p26-a-cube
    kind: identity
    answer: p26-a-cube
    where: 'Problem 26(a), answer box: the transform of (at)³, against the numerically integrated defining integral'
    formula: 6*a**3/s**4
    equals: integrate('(a*x)**3*exp(-s*x)', 'x', 0, 150)
    samples:
      a: [0.5, 1, 2, 1.3]
      s: [1, 3, 2, 0.8]
    tolerance: 1e-6
    shown: ['expr="6*a^3/s^4"']
    source: {cite: solutions, at: 'Problem 26(a), p. 1'}
    origin: mit

  - id: p26-a-rule-power
    kind: identity
    where: 'Problem 26(a), formula "The rule for a power": (1/a) F(s/a) with F = n!/s^(n+1), for n = 2, against the numerically integrated transform of (at)²'
    formula: (1/a)*2/(s/a)**3
    equals: integrate('(a*x)**2*exp(-s*x)', 'x', 0, 150)
    samples:
      a: [0.5, 1, 2, 1.3]
      s: [1, 3, 2, 0.8]
    tolerance: 1e-6
    shown: ['\frac{1}{a}\,F\!\left(\frac{s}{a}\right) = \frac{1}{a}\cdot\frac{n!}{(s/a)^{n+1}}']
    source: {cite: solutions, at: 'Problem 26(a), p. 1'}
    origin: mit

  - id: p26-a-rule-exp
    kind: identity
    where: 'Problem 26(a), check: the rule for f = e^(−t), (1/a)·1/(s/a + 1), against the numerically integrated transform of e^(−at)'
    formula: (1/a)*1/(s/a + 1)
    equals: integrate('exp(-a*x)*exp(-s*x)', 'x', 0, 150)
    samples:
      a: [0.5, 1, 2, 1.3]
      s: [1, 3, 2, 0.8]
    tolerance: 1e-8
    shown: ['\dfrac{1}{a}\cdot\dfrac{1}{s/a + 1} = \dfrac{1}{s + a}']
    source: {cite: mit, at: 'Part II, Problem 26(a) (our own check)'}
    origin: page-own

  - id: p26-b-ones
    kind: identity
    where: 'Problem 26(b), check: the transform of 1 ∗ 1 = t (integrated numerically) equals (1/s)(1/s)'
    formula: integrate('x*exp(-s*x)', 'x', 0, 150)
    equals: (1/s)*(1/s)
    samples: {s: [0.8, 1, 2, 3]}
    tolerance: 1e-8
    shown: ['$F(s)\,G(s) = \dfrac{1}{s}\cdot\dfrac{1}{s}$ is the same']
    source: {cite: mit, at: 'Part II, Problem 26(b) (our own check)'}
    origin: page-own

  - id: p26-b-example
    kind: identity
    where: 'Problem 26(b), a further test of the convolution formula (not printed): e^(−t) ∗ t, has the transform 1/((s + 1)s²); checked through its closed form t − 1 + e^(−t)'
    formula: integrate('(x - 1 + exp(-x))*exp(-s*x)', 'x', 0, 150)
    equals: 1/((s + 1)*s**2)
    samples: {s: [0.8, 1, 2, 3]}
    tolerance: 1e-7
    shown: ['F(s)\,G(s) = \int_0^{\infty}\left(\int_0^{t}f(t - \tau)\,g(\tau)\,d\tau\right)e^{-st}\,dt']
    source: {cite: solutions, at: 'Problem 26(b), p. 1'}
    origin: page-own

  - id: p26-b-example-conv
    kind: identity
    where: 'Problem 26(b), the same test: the convolution integral of e^(−(t−τ)) with τ equals t − 1 + e^(−t)'
    formula: integrate('exp(-(t - x))*x', 'x', 0, t)
    equals: t - 1 + exp(-t)
    samples: {t: [0.3, 1, 2, 3.5]}
    tolerance: 1e-9
    shown: ['f(t) * g(t) = \int_0^{t}f(t - \tau)\,g(\tau)\,d\tau']
    source: {cite: solutions, at: 'Problem 26(b), p. 1'}
    origin: page-own

  - id: p26-c
    kind: identity
    answer: p26-c
    where: 'Problem 26(c), answer box: the transform of the box, against the numerical integral of e^(−st) from 0 to 1 (negative s included)'
    formula: (1 - exp(-s))/s
    equals: integrate('exp(-s*x)', 'x', 0, 1)
    samples: {s: [0.3, 1, 4, -2]}
    tolerance: 1e-9
    shown: ['expr="(1 - exp(-s))/s"']
    source: {cite: solutions, at: 'Problem 26(c), p. 1'}
    origin: mit

  - id: p26-c-num
    where: 'Problem 26(c), check: F(1), by numerical integration of e^(−t) from 0 to 1'
    inputs: {}
    formula: integrate('exp(-x)', 'x', 0, 1)
    expected: '0.6321'
    shown: ['$F(1) = 1 - e^{-1} = 0.6321$']
    source: {cite: solutions, at: 'Problem 26(c), p. 1'}
    origin: page-own

  - id: p26-c-zero
    where: 'Problem 26(c), check: the formula close to s = 0 has the limit 1 (value at s = 10⁻⁶)'
    inputs: {}
    formula: (1 - exp(-1e-6))/1e-6
    expected: '1'
    tolerance: 1e-5
    shown: ['the formula has the limit $1$ there too']
    source: {cite: solutions, at: 'Problem 26(c), p. 1'}
    origin: mit

  # ---- Problem 27

  - id: p27-a-w
    kind: identity
    answer: p27-a-w
    where: 'Problem 27(a), answer box: the unit impulse response, against the numerical derivative of the unit step response'
    formula: exp(-b*t/a)/a
    equals: deriv('(1 - exp(-b*x/a))/b', 'x', t)
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.2, 1, 3, 2.1]
    tolerance: 1e-7
    shown: ['expr="exp(-b*t/a)/a"']
    source: {cite: solutions, at: 'Problem 27(a), p. 1'}
    origin: mit

  - id: p27-a-w-laplace
    kind: identity
    where: 'Problem 27(a): the Laplace transform of the impulse response (integrated numerically) equals 1/(as + b)'
    formula: integrate('exp(-b*x/a)/a*exp(-s*x)', 'x', 0, 150)
    equals: 1/(a*s + b)
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      s: [0.5, 1, 2, 3]
    tolerance: 1e-8
    shown: ['W(s) = \frac{1}{as + b} = \frac{1/a}{s + b/a}']
    source: {cite: solutions, at: 'Problem 27(a), p. 1'}
    origin: mit

  - id: p27-a-v
    kind: identity
    answer: p27-a-v
    where: 'Problem 27(a), answer box: the unit step response, against the numerical integral of the impulse response from 0 to t'
    formula: (1 - exp(-b*t/a))/b
    equals: integrate('exp(-b*x/a)/a', 'x', 0, t)
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.2, 1, 3, 2.1]
    tolerance: 1e-9
    shown: ['expr="(1 - exp(-b*t/a))/b"']
    source: {cite: mit, at: 'Part II, Problem 27(a) (our own solution)'}
    origin: page-own

  - id: p27-a-v-ode
    kind: identity
    where: 'Problem 27(a): for t > 0 the step response solves aẋ + bx = 1'
    formula: a*deriv('(1 - exp(-b*x/a))/b', 'x', t) + (1 - exp(-b*t/a))
    equals: 1 + 0*t
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.2, 1, 3, 2.1]
    tolerance: 1e-7
    shown: ['v(t) = \frac{1}{b}\,u(t)\left(1 - e^{-bt/a}\right)']
    source: {cite: mit, at: 'Part II, Problem 27(a) (our own solution)'}
    origin: page-own

  - id: p27-a-v-laplace
    kind: identity
    where: 'Problem 27(a): the Laplace transform of the step response (integrated numerically) equals 1/(s(as + b))'
    formula: integrate('(1 - exp(-b*x/a))/b*exp(-s*x)', 'x', 0, 150)
    equals: 1/(s*(a*s + b))
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      s: [0.5, 1, 2, 3]
    tolerance: 1e-8
    shown: ['V(s) = \frac{1}{s\,(as + b)} = \frac{1}{b}\left(\frac{1}{s} - \frac{1}{s + b/a}\right)']
    source: {cite: mit, at: 'Part II, Problem 27(a) (our own solution)'}
    origin: page-own

  - id: p27-a-v-zero
    kind: identity
    where: 'Problem 27(a): for very small b the step response is close to t/a'
    formula: (1 - exp(-0.0001*t/a))/0.0001
    equals: t/a
    samples:
      a: [0.5, 1, 2, 1.3]
      t: [0.2, 1, 3, 2.1]
    tolerance: 1e-3
    shown: ['$v(t) = u(t)\,\dfrac{t}{a}$']
    source: {cite: mit, at: 'Part II, Problem 27(a) (our own solution)'}
    origin: page-own

  - id: p27-a-num-v
    where: 'Problem 27(a), check: v(2) for a = 2, b = 1, by integrating the impulse response from 0 to 2'
    inputs: {}
    formula: integrate('exp(-x/2)/2', 'x', 0, 2)
    expected: '0.6321'
    shown: ['$v(2) = 1 - e^{-1} = 0.6321$']
    source: {cite: mit, at: 'Part II, Problem 27(a) (our own solution)'}
    origin: page-own

  - id: p27-a-num-w
    where: 'Problem 27(a), check: the slope of v at t = 2 for a = 2, b = 1 (numerical derivative) equals w(2)'
    inputs: {}
    formula: deriv('1 - exp(-x/2)', 'x', 2)
    expected: '0.1839'
    shown: ['$w(2) = \frac{1}{2}e^{-1} = 0.1839$']
    source: {cite: solutions, at: 'Problem 27(a), p. 1'}
    origin: page-own

  - id: p27-b-i
    kind: identity
    answer: p27-b-i
    where: 'Problem 27(b)(i), answer box: the unit ramp response, against the numerical convolution integral of the impulse response with τ'
    formula: t/b - a*(1 - exp(-b*t/a))/b**2
    equals: integrate('exp(-b*(t - x)/a)/a*x', 'x', 0, t)
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.3, 1, 3, 2.1]
    tolerance: 1e-9
    shown: ['expr="t/b - a*(1 - exp(-b*t/a))/b^2"']
    source: {cite: solutions, at: 'Problem 27(b)(i), p. 1'}
    origin: mit

  - id: p27-b-i-ode
    kind: identity
    where: 'Problem 27(b)(i): for t > 0 the ramp response solves aẋ + bx = t'
    formula: a*deriv('x/b - a*(1 - exp(-b*x/a))/b**2', 'x', t) + b*(t/b - a*(1 - exp(-b*t/a))/b**2)
    equals: t
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.3, 1, 3, 2.1]
    tolerance: 1e-7
    shown: ['x(t) = u(t)\left(\frac{1}{b}\,t - \frac{a}{b^2}\left(1 - e^{-bt/a}\right)\right)']
    source: {cite: solutions, at: 'Problem 27(b)(i), p. 1'}
    origin: mit

  - id: p27-b-i-slope
    where: 'Problem 27(b)(i), check: the slope of the ramp response at t = 0 is zero (a = 2, b = 1)'
    inputs: {}
    formula: deriv('x - 2*(1 - exp(-x/2))', 'x', 0)
    expected: '0'
    tolerance: 1e-7
    shown: ['The slope at $t = 0$ is $\dfrac{1}{b} - \dfrac{a}{b^2}\cdot\dfrac{b}{a} = 0$']
    source: {cite: solutions, at: 'Problem 27(b)(i), p. 1'}
    origin: page-own

  - id: p27-b-i-particular
    kind: identity
    where: 'Problem 27(b)(i), formula "Particular solution": a times the slope 1/b plus b times (t/b − a/b²) equals t'
    formula: a*(1/b) + b*(t/b - a/b**2)
    equals: t
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.3, 1, 3, 2.1]
    tolerance: 1e-12
    shown: ['x_p = \frac{1}{b}\,t - \frac{a}{b^2}']
    source: {cite: solutions, at: 'Problem 27(b)(i), p. 1'}
    origin: mit

  - id: p27-b-i-zero
    kind: identity
    answer: p27-b-i-zero
    where: 'Problem 27(b)(i), answer box for b = 0: against the numerical integral of τ/a from 0 to t'
    formula: t**2/(2*a)
    equals: integrate('x/a', 'x', 0, t)
    samples:
      a: [0.5, 1, 2, 1.3]
      t: [0.3, 1, 3, 2.1]
    tolerance: 1e-9
    shown: ['expr="t^2/(2*a)"']
    source: {cite: solutions, at: 'Problem 27(b)(i), p. 1'}
    origin: mit

  - id: p27-b-i-zero-limit
    kind: identity
    where: 'Problem 27(b)(i), check: for very small b the formula for b ≠ 0 is close to t²/(2a)'
    formula: t/0.001 - a*(1 - exp(-0.001*t/a))/0.001**2
    equals: t**2/(2*a)
    samples:
      a: [0.5, 1, 2, 1.3]
      t: [0.3, 1, 1.5, 0.7]
    tolerance: 2e-3
    shown: ['\dfrac{t}{b} - \dfrac{t}{b} + \dfrac{t^2}{2a} = \dfrac{t^2}{2a}']
    source: {cite: solutions, at: 'Problem 27(b)(i), p. 1'}
    origin: page-own

  - id: p27-b-ii-parts
    kind: identity
    where: 'Problem 27(b)(ii), formula "The integral": the result of the integration by parts, against the numerical integral of τ e^(bτ/a)'
    formula: (a/b)*t*exp(b*t/a) - (a**2/b**2)*(exp(b*t/a) - 1)
    equals: integrate('x*exp(b*x/a)', 'x', 0, t)
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      t: [0.3, 1, 3, 2.1]
    tolerance: 1e-9
    shown: ['= \frac{a}{b}\,t\,e^{bt/a} - \frac{a^2}{b^2}\left(e^{bt/a} - 1\right)']
    source: {cite: solutions, at: 'Problem 27(b)(ii), p. 2'}
    origin: mit

  - id: p27-b-ii-num
    answer: p27-b-ii-num
    where: 'Problem 27(b)(ii), answer box: for a = 2, b = 1, t = 2, the numerical convolution integral of the impulse response with τ'
    inputs: {}
