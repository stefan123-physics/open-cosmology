    formula: 2/1 - 2*(1 - exp(-1*2/2))/1**2
    expected: '0.736'
    shown: ['the formula gives $2 - 2\left(1 - e^{-1}\right)']
    source: {cite: solutions, at: 'Problem 27(b)(ii), p. 2'}
    origin: page-own

  - id: p27-b-iii-a
    kind: identity
    answer: p27-b-iii-a
    where: 'Problem 27(b)(iii), answer box A: against the decomposition solved for A at sample values of s, with B = 1/b and C = a²/b²'
    formula: -a/b**2
    equals: (1/(s**2*(a*s + b)) - (1/b)/s**2 - (a**2/b**2)/(a*s + b))*s
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      s: [0.7, 1, 2, 3]
    tolerance: 1e-9
    shown: ['expr="-a/b^2"']
    source: {cite: solutions, at: 'Problem 27(b)(iii), p. 2'}
