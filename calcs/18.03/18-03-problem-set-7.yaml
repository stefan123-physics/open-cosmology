    answer: p27-b-iii-c
    where: 'Problem 27(b)(iii), answer box C: against the decomposition solved for C at sample values of s, with A = −a/b² and B = 1/b'
    formula: a**2/b**2
    equals: (1/(s**2*(a*s + b)) + (a/b**2)/s - (1/b)/s**2)*(a*s + b)
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
      s: [0.7, 1, 2, 3]
    tolerance: 1e-9
    shown: ['expr="a^2/b^2"']
    source: {cite: solutions, at: 'Problem 27(b)(iii), p. 2'}
