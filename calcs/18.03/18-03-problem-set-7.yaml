  - id: p27-b-iii-b
    kind: identity
    answer: p27-b-iii-b
    where: 'Problem 27(b)(iii), answer box B: against the decomposition solved for B at sample values of s, with A = −a/b² and C = a²/b²'
    formula: 1/b
    equals: (1/(s**2*(a*s + b)) + (a/b**2)/s - (a**2/b**2)/(a*s + b))*s**2
    samples:
      a: [0.5, 1, 2, 1.3]
      b: [2, 1, 0.5, 1.7]
