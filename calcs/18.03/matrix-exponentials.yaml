# Calculations on content/year-2/18.03/matrix-exponentials.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 29 transcript, with the page's own examples.

page: content/year-2/18.03/matrix-exponentials.mdx
calcs:
  - id: series-cosh
    kind: identity
    where: 'the diagonal series 1 + t²/2! + t⁴/4! + t⁶/6! + t⁸/8! approximates cosh t (t ≤ 1)'
    formula: 1 + t**2/2 + t**4/24 + t**6/720 + t**8/40320
    equals: cosh(t)
    samples: {t: [0.0, 0.5, 1.0]}
    tolerance: 1e-5
    shown: ['= \begin{pmatrix} \cosh t & \sinh t']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: series-sinh
    kind: identity
    where: 'the off-diagonal series t + t³/3! + t⁵/5! + t⁷/7! approximates sinh t (t ≤ 1)'
    formula: t + t**3/6 + t**5/120 + t**7/5040
    equals: sinh(t)
    samples: {t: [0.0, 0.5, 1.0]}
    tolerance: 1e-5
    shown: ['the hyperbolic functions']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: cosh-solves
    kind: identity
    where: '(cosh t, sinh t) solves x′ = y, y′ = x: derivative of cosh is sinh'
    formula: (cosh(t+1e-4) - cosh(t-1e-4)) / 2e-4
    equals: sinh(t)
    samples: {t: [0.0, 0.7, 2.0]}
    tolerance: 1e-4
    shown: ['computed from cosh t and sinh t']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: ex-b-x0inv
    where: 'example (b): det X(0) = 1·0 − 1·(−1)'
    inputs: {}
    formula: 1*0 - 1*(-1)
    expected: '1'
    shown: ['with determinant 1 and inverse']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-b-solution
    kind: identity
    where: 'example (b): x = 3e^(−t) − e^(−3t), y = e^(−3t) satisfy x′ = −x + 2y'
    formula: ((3*exp(-(t+1e-4)) - exp(-3*(t+1e-4))) - (3*exp(-(t-1e-4)) - exp(-3*(t-1e-4)))) / 2e-4
    equals: -(3*exp(-t) - exp(-3*t)) + 2*exp(-3*t)
    samples: {t: [0.0, 0.5, 1.5]}
    tolerance: 1e-4
    shown: ['3e^{-t} - e^{-3t} \\ e^{-3t}']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-b-entry
    kind: identity
    where: 'example (b): the (1, 2) entry of e^(At) satisfies X′ = AX: its derivative equals −1·(e^(−t) − e^(−3t)) + 2·e^(−3t)'
    formula: ((exp(-(t+1e-4)) - exp(-3*(t+1e-4))) - (exp(-(t-1e-4)) - exp(-3*(t-1e-4)))) / 2e-4
    equals: -1*(exp(-t) - exp(-3*t)) + 2*exp(-3*t)
    samples: {t: [0.0, 0.5, 1.5]}
    tolerance: 1e-4
    shown: ['e^{-t} - e^{-3t} \\ 0 & e^{-3t}']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
