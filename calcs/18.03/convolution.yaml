# Calculations on content/year-2/18.03/convolution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 21 transcript, with the page's own examples.

page: content/year-2/18.03/convolution.mdx
calcs:
  - id: t2-star-t
    where: 't² ∗ t at t = 2: ∫₀² u²(2 − u) du = 16/12'
    inputs: {}
    formula: integrate('u**2*(2 - u)', 'u', 0, 2)
    expected: '1.33333'
    shown: ['= \frac{t^4}{12}$. By transforms']
    source: {cite: reading1, at: 'pp. 1–2'}
    origin: mit

  - id: t2-star-t-constant
    where: '2/4! = 1/12'
    inputs: {}
    formula: 2 / 24
    expected: '0.083333'
    shown: ['this is $\frac{1}{12}t^4$']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: convolution-theorem
    where: 'L(t² ∗ t) at s = 2 equals 2/s⁵ = 1/16 (numerical integration of t⁴/12 e^(−2t))'
    inputs: {}
    formula: integrate('t**4/12*exp(-2*t)', 't', 0, 60)
    expected: '0.0625'
    tolerance: '1e-6'
    shown: ['\frac{2}{s^5}$, and since']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: plot-limit
    where: 'graph: 1 ∗ e^(−0.5t) levels off at 1/k'
    inputs: {}
    formula: 1 / 0.5
    expected: '2'
    shown: ['levels off at 1/k = 2']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: plot-formula
    where: 'graph: 1 ∗ e^(−0.5t) at t = 4 by direct integration equals (1 − e^(−2))/0.5'
    inputs: {}
    formula: integrate('exp(-0.5*(4 - u))', 'u', 0, 4)
    expected: '1.72933'
    shown: ['(1 - exp(-0.5*t)) / 0.5']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-a
    where: 'example (a): e^t ∗ e^(2t) at t = 1 equals e² − e'
    inputs: {}
    formula: integrate('exp(u)*exp(2*(1 - u))', 'u', 0, 1)
    expected: '4.67077'
    shown: ['= e^{2t} - e^t$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-b
    where: 'example (b): 30(1 − e^(−1))'
    inputs: {}
    formula: integrate('3*exp(-0.1*(10 - u))', 'u', 0, 10)
    expected: '19.0'
    shown: ['\approx 19.0$ kg']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-c
    where: 'example (c): t ∗ e^(−t) at t = 2 equals 2 − 1 + e^(−2)'
    inputs: {}
    formula: integrate('u*exp(-(2 - u))', 'u', 0, 2)
    expected: '1.135335'
    shown: ['= t - 1 + e^{-t}$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own
