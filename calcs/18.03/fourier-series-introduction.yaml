# Calculations on content/year-2/18.03/fourier-series-introduction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 15 transcript, with the page's own examples.

page: content/year-2/18.03/fourier-series-introduction.mdx
calcs:
  - id: orthogonality-example
    where: 'quiz 1: ∫ sin 3t cos 4t over [−π, π]'
    inputs: {}
    formula: integrate('sin(3*t)*cos(4*t)', 't', -pi, pi)
    expected: '0'
    tolerance: '1e-9'
    shown: ['What is $']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: sin-squared
    where: '∫ sin² 5t over [−π, π] = π'
    inputs: {}
    formula: integrate('sin(5*t)**2', 't', -pi, pi) / pi
    expected: '1'
    tolerance: '1e-9'
    shown: ['cos^2 nt\,dt = \pi" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: square-wave-b3
    where: 'square wave b₃ = 4/(3π)'
    inputs: {}
    formula: (integrate('-sin(3*t)', 't', -pi, 0) + integrate('sin(3*t)', 't', 0, pi)) / pi
    expected: '0.4244'
    shown: ['(1 - \cos n\pi)']
    source: {cite: reading1, at: 'p. 15'}
    origin: slip

  - id: square-wave-b2
    where: 'square wave b₂ = 0'
    inputs: {}
    formula: (integrate('-sin(2*t)', 't', -pi, 0) + integrate('sin(2*t)', 't', 0, pi)) / pi
    expected: '0'
    tolerance: '1e-9'
    shown: ['0 \text{ for even } n']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: halfwave-b3
    where: 'example (a): half-wave b₃ = (1/π)∫₀^π sin 3t = 2/(3π)'
    inputs: {}
    formula: integrate('sin(3*t)', 't', 0, pi) / pi
    expected: '0.21221'
    shown: ['{1 - \cos n\pi}{n\pi}$']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: triangle-constant
    where: 'example (b): constant term (1/2π)∫|t| = π/2'
    inputs: {}
    formula: integrate('abs(t)', 't', -pi, pi) / (2 * pi)
    expected: '1.5708'
    shown: ['|t|\,dt = \frac{\pi}{2}']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: triangle-a3
    where: 'example (b): a₃ = −4/(9π)'
    inputs: {}
    formula: integrate('abs(t)*cos(3*t)', 't', -pi, pi) / pi
    expected: '-0.14147'
    shown: ['for odd $n$ and 0 for even $n$. So $|t|']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: triangle-check
    where: 'example (c): π/2 − (4/π)(π²/8) = 0'
    inputs: {}
    formula: pi/2 - (4/pi) * (pi**2 / 8)
    expected: '0'
    tolerance: '1e-12'
    shown: ['= 0 = |0|']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own
