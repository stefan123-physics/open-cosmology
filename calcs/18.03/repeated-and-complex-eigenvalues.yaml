# Calculations on content/year-2/18.03/repeated-and-complex-eigenvalues.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 26 transcript, with the page's own examples.

page: content/year-2/18.03/repeated-and-complex-eigenvalues.mdx
calcs:
  - id: char-poly
    kind: identity
    where: 'the fish-tank characteristic polynomial: (λ + 2)³ − 2 − 3(λ + 2) = λ(λ + 3)²'
    formula: (l + 2)**3 - 2 - 3*(l + 2)
    equals: l * (l + 3)**2
    samples: {l: [-1.0, 0.5, 2.0]}
    tolerance: 1e-9
    shown: ['= \lambda(\lambda + 3)^2 = 0']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: constant-term
    where: 'constant term 8 − 2 − 6'
    inputs: {}
    formula: 8 - 2 - 6
    expected: '0'
    shown: ['The constant term $8 - 2 - 6$ vanishes']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: eigvec-check
    where: '(1, 0, −1) is an eigenvector for −3: first row −2·1 + 0 + (−1) = −3 = −3·1'
    inputs: {}
    formula: -2*1 + 0 + (-1)
    expected: '-3'
    shown: ['for example $(1, 0, -1)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: complex-solution
    kind: identity
    where: 'x = cos t, y = −(cos t + sin t)/2 satisfies x′ = x + 2y'
    formula: -sin(t)
    equals: cos(t) + 2*(-0.5*cos(t) - 0.5*sin(t))
    samples: {t: [0.0, 1.0, 2.5]}
    tolerance: 1e-9
    shown: ['x = \cos t, \qquad y = -\frac{1}{2}\cos t - \frac{1}{2}\sin t']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: complex-solution-y
    kind: identity
    where: 'and y′ = −x − y'
    formula: 0.5*sin(t) - 0.5*cos(t)
    equals: -cos(t) - (-0.5*cos(t) - 0.5*sin(t))
    samples: {t: [0.0, 1.0, 2.5]}
    tolerance: 1e-9
    shown: ['travelled round and round']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: ex-c-real
    kind: identity
    where: 'example (c): e^(−t)(cos 2t, sin 2t) satisfies x′ = −x − 2y and y′ = 2x − y (sum of squared residuals)'
    formula: ((-exp(-t)*cos(2*t) - 2*exp(-t)*sin(2*t)) - (-exp(-t)*cos(2*t) - 2*exp(-t)*sin(2*t)))**2 + ((-exp(-t)*sin(2*t) + 2*exp(-t)*cos(2*t)) - (2*exp(-t)*cos(2*t) - exp(-t)*sin(2*t)))**2
    equals: 0*t
    samples: {t: [0.0, 1.0, 2.5]}
    tolerance: 1e-9
    shown: ['$e^{-t}(\cos 2t, \sin 2t)$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-c-derivative
    kind: identity
    where: 'example (c): derivative of x = e^(−t) cos 2t by central difference equals −x − 2y'
    formula: (exp(-(t+1e-4))*cos(2*(t+1e-4)) - exp(-(t-1e-4))*cos(2*(t-1e-4))) / 2e-4
    equals: -exp(-t)*cos(2*t) - 2*exp(-t)*sin(2*t)
    samples: {t: [0.0, 1.0, 2.5]}
    tolerance: 1e-4
    shown: ['$\lambda = -1 \pm 2i$. For']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
