  - id: p35-det
    kind: identity
    answer: p35-det
    where: 'Problem 35(a), answer box: the determinant a·(−1) − (−3)·1'
    formula: 3 - a
    equals: a*(-1) - (-3)*1
    samples: {a: [-5, 0, 2.5, 4]}
    tolerance: 1e-12
    shown: ['expr="3 - a"']
    source: {cite: solutions, at: 'Problem 35(a), p. 1'}
