    expected: '79'
    shown: ['from $(-6, 8)$ to $(3, -1)$']
    source: {cite: mit, at: 'Part II, Problem 35(a) (our own remark)'}
    origin: page-own

  - id: p35-b-det
    answer: p35-b-det
    where: 'Problem 35(b), answer box: the a with det A = 0, solved numerically'
