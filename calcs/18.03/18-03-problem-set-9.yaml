# Calculations on content/year-2/18.03/18-03-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# solutions of systems by putting them back into their differential equations (numerical derivatives),
# eigenvalues by putting them into the characteristic polynomial or through trace and determinant,
# crossing values by solving the wall equations numerically, and matrix entries by solving the eigenvector equations.
# The phase portraits and eigenlines of Problems 34(b) and 35(d), the determinant of Problem 36(c)(ii) and the
# second routes in the checks are our own.

page: content/year-2/18.03/18-03-problem-set-9.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the three problems of Part II (18 + 8, 4 + 4 + 18, 9 + 9 + 9)'
    inputs: {}
    formula: (18 + 8) + (4 + 4 + 18) + (9 + 9 + 9)
    expected: '79'
    shown: ['three problems (79 points)']
    source: {cite: solutions, at: 'Part II solutions, pp. 1–3'}
    origin: mit

  - id: intro-part-i-points
    where: 'Introduction and last section: the points of MIT''s Part I (4 + 10 + 6)'
    inputs: {}
    formula: 4 + 10 + 6
    expected: '20'
    shown: ['(20 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 34(a)

  - id: p34-re
    answer: p34-re
    where: 'Problem 34(a)(i), answer box: the real part of the eigenvalues is half the trace 0.5 + 0.5'
    inputs: {}
    formula: (0.5 + 0.5)/2
    expected: '0.5'
    tolerance: '0.0001'
    shown: ['So $p = 0.5$ and $q = 1.5$.']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-im
    answer: p34-im
    where: 'Problem 34(a)(i), answer box: the imaginary part is the root of det A − (tr A/2)², with det A = 0.5·0.5 + 2.25'
    inputs: {}
    formula: sqrt((0.5*0.5 + 2.25*1) - ((0.5 + 0.5)/2)**2)
    expected: '1.5'
    tolerance: '0.0001'
    shown: ['So $p = 0.5$ and $q = 1.5$.']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-det
    where: 'Problem 34(a)(i): the determinant of the matrix'
    inputs: {}
    formula: 0.5*0.5 - 1*(-2.25)
    expected: '2.5'
    tolerance: '0.0001'
    shown: ['determinant $0.25 + 2.25 = 2.5$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-charpoly
    where: 'Problem 34(a)(i), check: the real part of p_A at λ = (1 + 3i)/2, which is p² − q² − p + 2.5, vanishes (and the imaginary part 2pq − q too)'
    inputs: {}
    formula: (0.5**2 - 1.5**2 - 0.5 + 2.5)**2 + (2*0.5*1.5 - 1.5)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['p_A(\lambda) = \lambda^2 - \lambda + 2.5']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-x
    kind: identity
    answer: p34-x
    where: 'Problem 34(a)(ii), answer box: x(t), against the second equation solved for x, x = (0.5y − ẏ)/2.25, with a numerical derivative of y'
    formula: exp(t/2)*cos(3*t/2)
    equals: (0.5*(-(3/2)*exp(t/2)*sin(3*t/2)) - deriv('-(3/2)*exp(x/2)*sin(3*x/2)', 'x', t))/2.25
    samples: {t: [-2, -0.7, 0.4, 1.9]}
    tolerance: 1e-6
    shown: ['expr="exp(t/2)*cos(3*t/2)"']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-y
    kind: identity
    answer: p34-y
    where: 'Problem 34(a)(ii), answer box: y(t), against the first equation solved for y, y = ẋ − 0.5x, with a numerical derivative of x'
    formula: -(3/2)*exp(t/2)*sin(3*t/2)
    equals: deriv('exp(x/2)*cos(3*x/2)', 'x', t) - 0.5*exp(t/2)*cos(3*t/2)
    samples: {t: [-2, -0.7, 0.4, 1.9]}
    tolerance: 1e-6
    shown: ['expr="-(3/2)*exp(t/2)*sin(3*t/2)"']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-u2
    kind: identity
    where: 'Problem 34(a)(i): the second real solution, x = e^(t/2) sin(3t/2), y = (3/2)e^(t/2) cos(3t/2), satisfies the second equation (ẏ against −2.25x + 0.5y)'
    formula: deriv('(3/2)*exp(x/2)*cos(3*x/2)', 'x', t)
    equals: -2.25*exp(t/2)*sin(3*t/2) + 0.5*(3/2)*exp(t/2)*cos(3*t/2)
    samples: {t: [-2, -0.7, 0.4, 1.9]}
    tolerance: 1e-6
    shown: ['\vec u_2 = e^{t/2}\begin{pmatrix} \sin(3t/2) \\ \frac{3}{2}\cos(3t/2) \end{pmatrix}']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-xdot0
    where: 'Problem 34(a)(ii): ẋ(0), by a numerical derivative of x(t)'
    inputs: {}
    formula: deriv('exp(x/2)*cos(3*x/2)', 'x', 0)
    expected: '0.5'
    tolerance: '1e-6'
    shown: ['So $\dot x(0) = 0.5 > 0$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-ydot0
    where: 'Problem 34(a)(ii): ẏ(0), by a numerical derivative of y(t)'
    inputs: {}
    formula: deriv('-(3/2)*exp(x/2)*sin(3*x/2)', 'x', 0)
    expected: '-2.25'
    tolerance: '1e-6'
    shown: ['And $\dot y(0) = -2.25 < 0$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-next
    answer: p34-next
    where: 'Problem 34(a)(ii), answer box: the first zero of y(t) after t = 0, found numerically'
    inputs: {}
    formula: solve('-(3/2)*exp(x/2)*sin(3*x/2)', 'x', 1, 3)
    expected: '2.094'
    shown: ['$t = \dfrac{2\pi}{3} = 2.094$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-pos
    answer: p34-pos
    where: 'Problem 34(a)(iii), answer box: x at t = 2π/3'
    inputs: {}
    formula: exp((2*pi/3)/2)*cos(3*(2*pi/3)/2)
    expected: '-2.850'
    shown: ['$x = e^{\pi/3}\cos\pi = -2.850$', '$(-2.850, 0)$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-pos-m2
    where: 'Problem 34(a)(iii): x at t = −2π/3'
    inputs: {}
    formula: exp((-2*pi/3)/2)*cos(3*(-2*pi/3)/2)
    expected: '-0.351'
    shown: ['$(-0.351, 0)$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-pos-m1
    where: 'Problem 34(a)(iii): y at t = −π/3'
    inputs: {}
    formula: -(3/2)*exp((-pi/3)/2)*sin(3*(-pi/3)/2)
    expected: '0.889'
    shown: ['$(0, 0.889)$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-pos-p1
    where: 'Problem 34(a)(iii): y at t = π/3'
    inputs: {}
    formula: -(3/2)*exp((pi/3)/2)*sin(3*(pi/3)/2)
    expected: '-2.532'
    shown: ['$(0, -2.532)$']
    source: {cite: solutions, at: 'Problem 34(a), p. 1'}
    origin: mit

  - id: p34-growth
    where: 'Problem 34(a)(iii), check: the growth over one full turn, the ratio of x at t = 2π/3 and at t = −2π/3, which is e^(2π/3)'
    inputs: {}
    formula: (exp((2*pi/3)/2)*cos(pi))/(exp((-2*pi/3)/2)*cos(-pi))
    expected: '8.12'
    shown: ['by the factor $e^{2\pi/3} = 8.12$']
    source: {cite: mit, at: 'Part II, Problem 34(a) (our own check)'}
    origin: page-own

  # ---- Problem 34(b)

  - id: p34-b-w
    kind: identity
    answer: p34-b-w
    where: 'Problem 34(b), answer box: w₂, from the first equation ẋ = x + by applied to the extra solution x = t e^t, y = w₂ e^t (numerical derivative)'
    formula: 1/b
    equals: (deriv('x*exp(x)', 'x', t) - t*exp(t))/(b*exp(t))
    samples:
      b: [0.5, 1, 4, -2]
      t: [-1, 0.3, 1, 2]
    tolerance: 1e-6
    shown: ['expr="1/b"']
    source: {cite: solutions, at: 'Problem 34(b), p. 1'}
    origin: mit

  - id: p34-b-ratio
    kind: identity
    where: 'Problem 34(b), our own phase portrait: the ratio x/y of the general solution, e^t(c₁ + c₂t) over e^t c₂/b, equals b(c₁/c₂ + t)'
    formula: (exp(t)*(c1 + c2*t))/(exp(t)*c2/b)
    equals: b*(c1/c2 + t)
    samples:
      b: [0.5, 1, 4, -2]
      t: [-1, 0.3, 1, 2]
      c1: [1, -2, 0, 3]
      c2: [1, 1, -1, 2]
    tolerance: 1e-9
    shown: ['\dfrac{x}{y} = b\left(\dfrac{c_1}{c_2} + t\right)']
    source: {cite: mit, at: 'Part II, Problem 34(b) (our own solution)'}
    origin: page-own

  # ---- Problem 35

  - id: p35-tr
    kind: identity
    answer: p35-tr
    where: 'Problem 35(a), answer box: the trace, the sum of the diagonal entries a and −1'
    formula: a - 1
    equals: a + (-1)
    samples: {a: [-5, 0, 2.5, 4]}
