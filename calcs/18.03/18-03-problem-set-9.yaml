    tolerance: '0.0001'
    shown: ['$\det A = 3 - a = 0$ at $a = 3$']
    source: {cite: solutions, at: 'Problem 35(a), p. 1'}
    origin: mit

  - id: p35-b-tr
    answer: p35-b-tr
    where: 'Problem 35(b), answer box: the a with tr A = 0, solved numerically'
    inputs: {}
    formula: solve('x + (-1)', 'x', -5, 4)
    expected: '1'
    tolerance: '0.0001'
    shown: ['$\operatorname{tr}A = a - 1 = 0$ at $a = 1$']
    source: {cite: solutions, at: 'Problem 35(a), p. 1'}
    origin: mit

  - id: p35-b-low
