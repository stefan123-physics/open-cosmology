# Calculations on content/year-2/18.03/impulse-inputs-delta-function.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 23 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/impulse-inputs-delta-function.mdx
calcs:
  - id: box-transform
    where: 'the box (1/h)(u(t) − u(t − h)) at h = 0.5, s = 2 has transform (1 − e^(−1))/1'
    inputs: {}
    formula: integrate('(1/0.5)*exp(-2*t)', 't', 0, 0.5)
    expected: '0.632121'
    tolerance: '1e-6'
    shown: ['= \frac{1 - e^{-hs}}{hs}" cite']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: limit-one
    where: '(1 − e^(−v))/v → 1 as v → 0 (v = 1e-6)'
    inputs: {}
    formula: (1 - exp(-1e-6)) / 1e-6
    expected: '1'
    tolerance: '1e-5'
    shown: ['= \lim_{v \to 0}e^{-v} = 1$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: mit

  - id: kicked-spring-continuity
    where: 'both pieces of the kicked spring vanish at π/2'
    inputs: {}
    formula: cos(pi/2)
    expected: '0'
    tolerance: '1e-12'
    shown: ['where both are 0']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: kicked-spring-jump
    where: 'velocity jump at π/2 equals A: −(1 − A) sin(π/2) − (−sin(π/2)), with A = 0.5'
    inputs: {}
    formula: -(1 - 0.5)*sin(pi/2) + sin(pi/2)
    expected: '0.5'
    shown: ['a smaller oscillation for A = 0.5']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: ex-a
    kind: identity
    where: 'example (a): w = ½ sin 2t solves y″ + 4y = 0 with w(0) = 0, w′(0) = 1'
    formula: ((0.5*sin(2*(t+1e-4))) - 2*(0.5*sin(2*t)) + (0.5*sin(2*(t-1e-4)))) / 1e-8 + 4 * (0.5*sin(2*t))
    equals: 0*t
    samples: {t: [0.3, 1.0, 2.0]}
    tolerance: 1e-3
    shown: ['$w(t) = \frac{1}{2}\sin 2t$']
    source: {cite: reading1, at: 'pp. 16–17'}
    origin: page-own

  - id: ex-b
    where: 'example (b): ∫₀² (e^(−u) − e^(−2u)) du equals ½ − e^(−2) + ½e^(−4)'
    inputs: {}
    formula: integrate('exp(-u) - exp(-2*u)', 'u', 0, 2)
    expected: '0.373823'
    tolerance: '1e-6'
    shown: ['- e^{-t} + \frac{1}{2}e^{-2t}$']
    source: {cite: reading1, at: 'pp. 15–16'}
    origin: page-own

  - id: ex-c
    where: 'example (c): (2 − A) cos t vanishes for A = 2'
    inputs: {}
    formula: 2 - 2
    expected: '0'
    shown: ['So $A = 2$ stops it']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own
