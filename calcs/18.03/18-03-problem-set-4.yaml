  # ---- Problem 14

  - id: p14-a-gain
    answer: p14-a-gain
    where: 'Problem 14(a), answer box: the amplitude of A cos 2t + B sin 2t, with A and B from the two real equations (4 − 4)A + (0.5·2)B = 4 and −(0.5·2)A + (4 − 4)B = 0'
    inputs: {}
    formula: sqrt(0**2 + (4/(0.5*2))**2)
    expected: '4'
    tolerance: 1e-12
    shown: ['The gain is the amplitude $4$']
    source: {cite: solutions, at: 'Problem 14(a), p. 1'}
