  # ---- Problem 15

  - id: p15-a
    kind: identity
    answer: p15-a
    where: 'Problem 15(a), answer box and formula "Resonant exponential response": against the solution with x(0) = 0, the integral of e^(−(t−s)) e^(−s) over s from 0 to t'
    formula: t*exp(-t)
