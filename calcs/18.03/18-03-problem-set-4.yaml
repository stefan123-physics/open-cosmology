  - id: p13-b-xh
    kind: identity
    where: 'Problem 13(b), formula "The homogeneous solution": e^(−t/2) cos(√7 t/2) in ẍ + ẋ + 2x, the second derivative as a numerical derivative of the first'
    formula: deriv('exp(-x/2)*(-cos(sqrt(7)/2*x)/2 - sqrt(7)/2*sin(sqrt(7)/2*x))', 'x', t) + exp(-t/2)*(-cos(sqrt(7)/2*t)/2 - sqrt(7)/2*sin(sqrt(7)/2*t)) + 2*exp(-t/2)*cos(sqrt(7)/2*t)
    equals: 0*t
    samples: {t: [0.2, 0.9, 1.7, 3]}
    tolerance: 1e-6
    shown: ['has the roots $-\tfrac12 \pm i\tfrac{\sqrt 7}{2}$']
    source: {cite: solutions, at: 'Problem 13(b), p. 1'}
    origin: mit

  - id: p13-c
    answer: p13-c
    where: 'Problem 13(c), answer box: twice the first positive zero of the solution with x(0) = 0, ẋ(0) = 1, which is e^(−t/2) sin(√7 t/2)/(√7/2), found as a numerical root'
    inputs: {}
    formula: 2*solve('exp(-x/2)*sin(sqrt(7)/2*x)', 'x', 2, 3)
    expected: '4.7496'
    shown: ['T_d = \frac{2\pi}{\omega_d} = \frac{4\pi}{\sqrt 7} = 4.7496']
    source: {cite: solutions, at: 'Problem 13(c), p. 1'}
