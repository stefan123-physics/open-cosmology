  - id: p14-a-lag
    answer: p14-a-lag
    where: 'Problem 14(a), answer box: the first peak of the response 4 sin 2t after the peak of the input at t = 0, as the root of its slope'
    inputs: {}
    formula: solve('8*cos(2*x)', 'x', 0, 1.5)
    expected: '0.7854'
    shown: ['t_0 = \frac{\phi}{\omega} = \frac{\pi/2}{2} = \frac{\pi}{4} = 0.7854']
    source: {cite: solutions, at: 'Problem 14(a), p. 1'}
    origin: mit

  - id: p14-a-ode
    kind: identity
    where: 'Problem 14(a), check: x_p = 4 sin 2t in ẍ + ½ẋ + 4x'
    formula: -16*sin(2*t) + 0.5*8*cos(2*t) + 4*4*sin(2*t)
    equals: 4*cos(2*t)
    samples: {t: [0, 0.3, 1.1, 2.6]}
    tolerance: 1e-12
    shown: ['-16\sin 2t + \tfrac12\cdot 8\cos 2t + 16\sin 2t = 4\cos 2t']
    source: {cite: solutions, at: 'Problem 14(a), p. 1'}
    origin: mit

  - id: p14-b-gain
    kind: identity
    answer: p14-b-gain
    where: 'Problem 14(b), answer box and formula "Gain": against the amplitude √(A² + B²) of the real solution A cos ωt + B sin ωt, with A = 4(4 − ω²)/D and B = 2ω/D, D = (4 − ω²)² + ω²/4'
    formula: 4/sqrt((4 - w**2)**2 + w**2/4)
    equals: sqrt((4*(4 - w**2)/((4 - w**2)**2 + w**2/4))**2 + (2*w/((4 - w**2)**2 + w**2/4))**2)
    samples: {w: [0.5, 1.3, 2, 3.5]}
    tolerance: 1e-10
    shown: ['g(\omega) = |H(\omega)| = \frac{4}{\sqrt{(4 - \omega^2)^2 + \tfrac14\,\omega^2}}']
    source: {cite: solutions, at: 'Problem 14(b), p. 1'}
    origin: mit

  - id: p14-b-real-solution
    kind: identity
    where: 'Problem 14(b): A cos ωt + B sin ωt with those A and B solves ẍ + ½ẋ + 4x = 4 cos ωt (derivatives written out)'
    formula: (4 - w**2)*(4*(4 - w**2)*cos(w*t) + 2*w*sin(w*t))/((4 - w**2)**2 + w**2/4) + 0.5*w*(-4*(4 - w**2)*sin(w*t) + 2*w*cos(w*t))/((4 - w**2)**2 + w**2/4)
    equals: 4*cos(w*t)
    samples: {w: [0.5, 1.3, 2, 3.5], t: [0.2, 1.1, 0.7, 2.3]}
    tolerance: 1e-10
    shown: ['H(\omega) = \frac{4}{p(i\omega)} = \frac{4}{4 - \omega^2 + \tfrac12\,i\omega}']
    source: {cite: solutions, at: 'Problem 14(b), p. 1'}
    origin: mit

  - id: p14-b-tan
    kind: identity
    answer: p14-b-tan
    where: 'Problem 14(b), answer box and formula "Phase lag": against B/A of the real solution A cos ωt + B sin ωt = g cos(ωt − φ)'
    formula: (w/2)/(4 - w**2)
    equals: (2*w/((4 - w**2)**2 + w**2/4))/(4*(4 - w**2)/((4 - w**2)**2 + w**2/4))
    samples: {w: [0.3, 0.9, 1.4, 1.7]}
    tolerance: 1e-10
    shown: ['\tan\phi = \frac{\mathrm{Im}\,p(i\omega)}{\mathrm{Re}\,p(i\omega)} = \frac{\omega/2}{4 - \omega^2}']
    source: {cite: solutions, at: 'Problem 14(b), p. 1'}
    origin: mit

