  - id: p13-e
    kind: identity
    answer: p13-e
    where: 'Problem 13(e), answer box and formula "The transient for rest initial conditions": against the rest solution minus x_p, the rest solution being the integral over s from 0 to t of the unit impulse response e^(−(t−s)/2) sin(√7(t−s)/2)/(√7/2) times cos s'
    formula: exp(-t/2)*(-cos(sqrt(7)/2*t)/2 - 3*sin(sqrt(7)/2*t)/(2*sqrt(7)))
    equals: integrate('exp(-(t-s)/2)*sin(sqrt(7)/2*(t-s))/(sqrt(7)/2)*cos(s)', 's', 0, t) - (cos(t) + sin(t))/2
    samples: {t: [0.5, 1.2, 2.1, 3]}
    tolerance: 1e-6
    shown: ['x_h = e^{-t/2}\left(-\frac12\cos\frac{\sqrt 7}{2}t - \frac{3}{2\sqrt 7}\sin\frac{\sqrt 7}{2}t\right)']
    source: {cite: solutions, at: 'Problem 13(e), p. 1'}
    origin: mit

  - id: p13-e-b
    kind: identity
    where: 'Problem 13(e): the constant b = (2/√7)(−1/2 − 1/4) against −3/(2√7) (the sample is a dummy factor)'
    formula: q*2/sqrt(7)*(-1/2 - 1/4)
    equals: -q*3/(2*sqrt(7))
    samples: {q: [1, 2]}
    tolerance: 1e-12
    shown: ['b = \frac{2}{\sqrt 7}\left(-\frac12 - \frac14\right) = -\frac{3}{2\sqrt 7}']
    source: {cite: solutions, at: 'Problem 13(e), p. 1'}
