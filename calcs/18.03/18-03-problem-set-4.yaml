# Calculations on content/year-2/18.03/18-03-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II up to Problem 15(b); every answer is still checked here by an independent route,
# in real arithmetic only: particular solutions against the convolution integral of the input with the system's own
# decaying response, the differential equations by numerical derivatives, the gain and phase lag against the real
# coefficients of A cos ωt + B sin ωt, and the peak and the 45 degree point as numerical roots.

page: content/year-2/18.03/18-03-problem-set-4.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'How to answer: the points of the four problems (21 + 16 + 18 + 26), with the parts of each'
    inputs: {}
    formula: (4 + 4 + 4 + 4 + 5) + (8 + 8) + (6 + 6 + 6) + (10 + 6 + 4 + 6)
    expected: '81'
    shown: ['we gave 6 points to 15(c) and 26 to Problem 16']
    source: {cite: solutions, at: 'Problems 13 to 15(b), p. 1'}
    origin: page-own

  - id: intro-part-i-points
    where: 'Last section: the points of MIT''s Part I (3 + 8 + 5 + 4)'
    inputs: {}
    formula: 3 + 8 + 5 + 4
    expected: '20'
    shown: ['(20 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 13

  - id: p13-a
    kind: identity
    answer: p13-a
    where: 'Problem 13(a), answer box and formula "The real particular solution": against the integral of e^(−2(t−s)) e^(3s) cos 4s over s from far in the past (the solution with no homogeneous part)'
    formula: exp(3*t)*(5*cos(4*t) + 4*sin(4*t))/41
    equals: integrate('exp(-2*(t-s))*exp(3*s)*cos(4*s)', 's', -12, t)
    samples: {t: [0, 0.1, 0.35, 0.6]}
    tolerance: 1e-6
    shown: ['\frac{e^{3t}}{41}\,(5\cos 4t + 4\sin 4t)']
    source: {cite: solutions, at: 'Problem 13(a), p. 1'}
    origin: mit

  - id: p13-a-ode
    kind: identity
    where: 'Problem 13(a): the numerical derivative of x_p plus 2x_p equals e^(3t) cos 4t'
    formula: deriv('exp(3*x)*(5*cos(4*x) + 4*sin(4*x))/41', 'x', t) + 2*exp(3*t)*(5*cos(4*t) + 4*sin(4*t))/41
    equals: exp(3*t)*cos(4*t)
    samples: {t: [0, 0.1, 0.35, 0.6]}
    tolerance: 1e-6
    shown: ['\dot x + 2x = e^{3t}\cos 4t']
    source: {cite: mit, at: 'Problem 13(a), p. 2'}
    origin: mit

  - id: p13-a-check-slope
    where: 'Problem 13(a), check: the slope of x_p at t = 0, by a numerical derivative, against 31/41'
    inputs: {}
    formula: deriv('exp(3*x)*(5*cos(4*x) + 4*sin(4*x))/41', 'x', 0)*41
    expected: '31'
    tolerance: 1e-5
    shown: ['\dot x_p = 3 \cdot 5/41 + (16)/41 = 31/41']
    source: {cite: solutions, at: 'Problem 13(a), p. 1'}
    origin: page-own

  - id: p13-a-check-sum
    where: 'Problem 13(a), check: 31/41 + 10/41'
    inputs: {}
    formula: 31/41 + 2*5/41
    expected: '1'
    tolerance: 1e-12
    shown: ['31/41 + 10/41 = 1']
    source: {cite: solutions, at: 'Problem 13(a), p. 1'}
    origin: page-own

  - id: p13-a-mit-slip
    where: 'Problem 13(a): MIT''s last line (3/25 and 4/25) does not solve the equation at t = 0, where ẋ + 2x would be (3·3 + 4·4)/25 + 2·3/25 instead of 1'
    inputs: {}
    formula: (3*3 + 4*4)/25 + 2*3/25
    expected: '1.24'
    shown: ['its last line has $3/25$ and $4/25$ in place of $5/41$ and $4/41$']
    source: {cite: solutions, at: 'Problem 13(a), p. 1'}
    origin: slip

  - id: p13-b-a
    answer: p13-b-a
    where: 'Problem 13(b), answer box: a from the two real equations (2 − 1)a + b = 1 and −a + (2 − 1)b = 0, by Cramer''s rule'
    inputs: {}
    formula: (1*1 - 1*0)/(1*1 + 1*1)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['so $a = b = \tfrac12$']
    source: {cite: solutions, at: 'Problem 13(b), p. 1'}
