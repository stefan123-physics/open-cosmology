    equals: cos(t)
    samples: {t: [0, 0.4, 1.3, 2.9]}
    tolerance: 1e-12
    shown: ['\ddot x + \dot x + 2x = \cos t']
    source: {cite: mit, at: 'Problem 13(b), p. 2'}
    origin: mit

  - id: p13-b-polar
    kind: identity
    where: 'Problem 13(b), formula "Polar form of the particular solution": equal to the Cartesian form'
    formula: cos(t - pi/4)/sqrt(2)
