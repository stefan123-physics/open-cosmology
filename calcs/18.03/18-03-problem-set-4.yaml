    samples: {t: [0, 0.4, 1.3, 2.9]}
    tolerance: 1e-12
    shown: ['x_p = \frac{1}{\sqrt 2}\cos\!\left(t - \frac{\pi}{4}\right)']
    source: {cite: solutions, at: 'Problem 13(b), p. 1'}
