# Calculations on content/year-2/18.03/linear-first-order-equations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 3 transcript, with the page's own numbers.

page: content/year-2/18.03/linear-first-order-equations.mdx
calcs:
  - id: example1
    kind: identity
    where: 'formula "Example 1": y = x³/2 + Cx solves xy′ − y = x³'
    formula: x * (3 * x**2 / 2 + C) - (x**3 / 2 + C * x)
    equals: x**3
    samples: {x: [0.5, 2.0, -1.5], C: [1.0, -3.0, 0.0]}
    tolerance: 1e-9
    shown: ['y = \frac{x^3}{2} + Cx']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: example2
    kind: identity
    where: 'formula "Example 2": y = (x² + 2)/(1 + cos x) solves (1 + cos x)y′ − (sin x)y = 2x'
    formula: (1 + cos(x)) * (((x + 1e-6)**2 + 2) / (1 + cos(x + 1e-6)) - ((x - 1e-6)**2 + 2) / (1 + cos(x - 1e-6))) / 2e-6 - sin(x) * (x**2 + 2) / (1 + cos(x))
    equals: 2 * x
    samples: {x: [0.3, 1.0, -0.8]}
    tolerance: 1e-5
    shown: ['y = \frac{x^2 + 2}{1 + \cos x}']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: example2-initial
    where: 'formula "Example 2": y(0) = (0 + 2)/(1 + 1) = 1'
    inputs: {}
    formula: (0 + 2) / (1 + cos(0))
    expected: '1'
    shown: ['and with $y(0) = 1$, $C = 2$']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: coffee-20
    where: 'worked example: T(20) = 20 + 70e⁻¹ ≈ 45.8 °C'
    inputs: {}
    formula: 20 + 70 * exp(-0.05 * 20)
    expected: '45.8'
    tolerance: '0.2%'
    shown: ['\approx 45.8$ °C']
    source: {cite: reading1, at: 'p. 17'}
    origin: page-own

  - id: coffee-40
    where: 'worked example: ln(3.5)/0.05 ≈ 25.1 minutes'
    inputs: {}
    formula: log(3.5) / 0.05
    expected: '25.1'
    tolerance: '0.2%'
    shown: ['\approx 25.1$ minutes']
    source: {cite: reading1, at: 'p. 17'}
    origin: page-own

  - id: cooling-solution
    kind: identity
    where: 'worked example and graph: T = 20 + Ce^(−0.05t) solves T′ = 0.05(20 − T)'
    formula: ((20 + C * exp(-0.05 * (t + 1e-6))) - (20 + C * exp(-0.05 * (t - 1e-6)))) / 2e-6
    equals: 0.05 * (20 - (20 + C * exp(-0.05 * t)))
    samples: {C: [70.0, -15.0], t: [0.0, 12.0]}
    tolerance: 1e-6
    shown: ['$T = 20 + Ce^{-0.05t}$']
    source: {cite: reading1, at: 'pp. 16–17'}
    origin: page-own
