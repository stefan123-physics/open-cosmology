# Calculations on content/year-2/18.03/complex-exponentials.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 6 transcript, with the page's own numbers. Complex products are
# checked through their real and imaginary parts.

page: content/year-2/18.03/complex-exponentials.mdx
calcs:
  - id: division-real
    where: 'formula "A division": real part of (2 + i)(1 + 3i) = 2·1 − 1·3 = −1'
    inputs: {}
    formula: 2 * 1 - 1 * 3
    expected: '-1'
    shown: ['= \frac{-1 + 7i}{10}']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: division-imag
    where: 'formula "A division": imaginary part 2·3 + 1·1 = 7, over 1² + 3² = 10'
    inputs: {}
    formula: (2 * 3 + 1 * 1) / (1**2 + 3**2)
    expected: '0.7'
    shown: ['-\frac{1}{10} + \frac{7}{10}\,i']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: integral
    kind: identity
    where: 'formula "Result": d/dx[e^(−x)(sin x − cos x)/2] = e^(−x) cos x'
    formula: ((exp(-(x + 1e-6)) * (sin(x + 1e-6) - cos(x + 1e-6)) / 2) - (exp(-(x - 1e-6)) * (sin(x - 1e-6) - cos(x - 1e-6)) / 2)) / 2e-6
    equals: exp(-x) * cos(x)
    samples: {x: [0.2, 1.3, -0.7]}
    tolerance: 1e-6
    shown: ['= \frac{e^{-x}}{2}\,(\sin x - \cos x) + C']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: root-angle
    where: 'graph caption: 360°/5 = 72°'
    inputs: {}
    formula: 360 / 5
    expected: '72'
    shown: ['72° apart']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: root-point
    where: 'graph: ζ = (cos 72°, sin 72°) ≈ (0.309, 0.951)'
    inputs: {}
    formula: cos(2 * pi / 5)
    expected: '0.309'
    tolerance: '0.1%'
    shown: ['{ x: 0.309, y: 0.951, label: "ζ" }']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: example-division
    where: 'worked example (a): (3 + 4i)(1 − 2i)/5 = (11 − 2i)/5'
    inputs: {}
    formula: (3 * 1 + 4 * 2) / (1**2 + 2**2)
    expected: '2.2'
    shown: ['= \frac{11 - 2i}{5}']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: example-power
    where: 'worked example (b): (√2)⁸ = 16'
    inputs: {}
    formula: sqrt(2)**8
    expected: '16'
    shown: ['= (\sqrt2)^8 e^{2\pi i} = 16']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: example-integral
    kind: identity
    where: 'worked example (c): d/dx[eˣ(sin x − cos x)/2] = eˣ sin x'
    formula: ((exp(x + 1e-6) * (sin(x + 1e-6) - cos(x + 1e-6)) / 2) - (exp(x - 1e-6) * (sin(x - 1e-6) - cos(x - 1e-6)) / 2)) / 2e-6
    equals: exp(x) * sin(x)
    samples: {x: [0.2, 1.3, -0.7]}
    tolerance: 1e-6
    shown: ['whose imaginary part is $\frac{e^x}{2}(\sin x - \cos x)$']
    source: {cite: reading1, at: 'pp. 11–13'}
    origin: page-own

  - id: cube-root
    where: 'worked example (d): cos(2π/3) = −1/2, sin(2π/3) = √3/2'
    inputs: {}
    formula: sin(2 * pi / 3) - sqrt(3) / 2 + cos(2 * pi / 3)
    expected: '-0.5'
    tolerance: 1e-9
    shown: ['$1$ and $-\frac12 \pm \frac{\sqrt3}{2}i$']
    source: {cite: reading1, at: 'pp. 14–15'}
    origin: page-own
