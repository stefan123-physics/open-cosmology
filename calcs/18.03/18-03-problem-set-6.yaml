  - id: p23-c-ends
    where: 'Problem 23(c): the values of 2t − 1 at the ends of the window, t = 0 and t = 1, differ by the box area 2'
    inputs: {}
    formula: (2*1 - 1) - (2*0 - 1)
    expected: '2'
    shown: ['At $t = 0$ the function jumps from $0$ to $-1$, down by $1$. At $t = 1$ it jumps from $1$ to $0$']
    source: {cite: solutions, at: 'Problem 23(c), p. 1'}
    origin: mit

  - id: p23-d-test
    where: 'Problem 23(d), check: the formula u(t)t − u(t − 1) − u(t − 2) − … at t = 2.3'
