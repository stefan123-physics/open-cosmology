# Calculations on content/year-2/18.03/18-03-problem-set-6.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for Part II; every answer is still checked here by an independent route:
# the Fourier coefficients of the triangle wave by numerical integration, the responses by putting them back into
# their differential equations (numerical derivatives), the impulse and step responses through their Laplace
# transforms (numerical integrals), and every convolution by numerical integration of its defining integral.

page: content/year-2/18.03/18-03-problem-set-6.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the four problems of Part II (20 + 12 + 24 + 24)'
    inputs: {}
    formula: 20 + 12 + 24 + 24
    expected: '80'
    shown: ['four problems (80 points)']
    source: {cite: solutions, at: 'Part II solutions, pp. 1–2'}
    origin: mit

  - id: intro-part-i-points
    kind: fact
    where: 'Introduction and last section: the points of MIT''s Part I (8 + 0 + 8 + 0)'
    shown: ['(16 points at MIT, not scored here)']
    source: {cite: solutions, at: 'Part I points, p. 1'}
    origin: mit

  # ---- Problem 22

  - id: p22-series-b1
    kind: identity
    where: 'Problem 22, the Fourier series of the triangle wave: the coefficient of sin t, (2/π) times the integral of g(t) sin t over half a period, equals 4/π'
    formula: (2/pi)*(integrate('x*sin(x)', 'x', 0, pi/2) + integrate('(pi - x)*sin(x)', 'x', pi/2, pi))
    equals: 4/pi + 0*z
    samples: {z: [1]}
    tolerance: 1e-9
    shown: ['g(t) = \frac{4}{\pi}\left(\sin t - \frac{1}{3^2}\sin 3t + \frac{1}{5^2}\sin 5t - \cdots\right)']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: mit

  - id: p22-series-b3-b5-b2
    kind: identity
    where: 'Problem 22, the Fourier series: the coefficients of sin 3t and sin 5t are −4/(9π) and 4/(25π), and the coefficient of sin 2t is zero (sum of the three checked against −4/(9π) + 4/(25π))'
    formula: (2/pi)*(integrate('x*(sin(3*x) + sin(5*x) + sin(2*x))', 'x', 0, pi/2) + integrate('(pi - x)*(sin(3*x) + sin(5*x) + sin(2*x))', 'x', pi/2, pi))
    equals: -4/(9*pi) + 4/(25*pi) + 0*z
    samples: {z: [1]}
    tolerance: 1e-8
    shown: ['The series of $g$ has a term $\sin mt$ with a coefficient different from zero for every odd $m$']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: mit

  - id: p22-a-one-term
    kind: identity
    where: 'Problem 22(a), formula "Response to one sine": the second derivative of A sin ωt/(ω₀² − ω²) plus ω₀² times it equals A sin ωt'
    formula: deriv('A*sin(om*x)/(w0**2 - om**2)', 'x', t, 2) + w0**2*A*sin(om*t)/(w0**2 - om**2)
    equals: A*sin(om*t)
    samples:
      A: [1, 0.5, 2, 1.3]
      om: [1, 3, 5, 1]
      w0: [1.6, 2.2, 0.7, 4]
      t: [0.3, 1.1, 2, 0.8]
    tolerance: 1e-5
    shown: ['x = \frac{A\sin\omega t}{\omega_0^2 - \omega^2} \quad\text{solves}']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: mit

  - id: p22-a-c1
    kind: identity
    answer: p22-a-c1
    where: 'Problem 22(a), answer box: the coefficient of sin t in x_p, against the numerically integrated Fourier coefficient of g divided by ω₀² − 1'
    formula: 4/(pi*(w0**2 - 1))
    equals: (2/pi)*(integrate('x*sin(x)', 'x', 0, pi/2) + integrate('(pi - x)*sin(x)', 'x', pi/2, pi))/(w0**2 - 1)
    samples: {w0: [1.2, 1.7, 2, 2.8]}
    tolerance: 1e-8
    shown: ['expr="4/(pi*(w0^2 - 1))"']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: mit

  - id: p22-a-c3
    kind: identity
    answer: p22-a-c3
    where: 'Problem 22(a), answer box: the coefficient of sin 3t in x_p, against the numerically integrated Fourier coefficient of g divided by ω₀² − 9'
    formula: -4/(9*pi*(w0**2 - 9))
    equals: (2/pi)*(integrate('x*sin(3*x)', 'x', 0, pi/2) + integrate('(pi - x)*sin(3*x)', 'x', pi/2, pi))/(w0**2 - 9)
    samples: {w0: [1.2, 1.7, 2, 2.8]}
    tolerance: 1e-8
    shown: ['expr="-4/(9*pi*(w0^2 - 9))"']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: mit

  - id: p22-a-check-1
    where: 'Problem 22(a), check: the coefficient of sin t for ω₀ = 2'
    inputs: {}
    formula: 4/(pi*(2**2 - 1))
    expected: '0.4244'
    shown: ['\dfrac{4}{3\pi} = 0.4244']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: page-own

  - id: p22-a-check-3
    where: 'Problem 22(a), check: the coefficient of sin 3t for ω₀ = 2'
    inputs: {}
    formula: -4/(9*pi*(2**2 - 9))
    expected: '0.0283'
    shown: ['-\dfrac{4}{9\pi(4 - 9)} = 0.0283']
    source: {cite: solutions, at: 'Problem 22(a), p. 1'}
    origin: page-own

  - id: p22-b-resonant
    kind: identity
    where: 'Problem 22(b), formula "The resonant response": the second derivative of −(A/2m) t cos mt plus m² times it equals A sin mt'
    formula: deriv('-A/(2*m)*x*cos(m*x)', 'x', t, 2) + m**2*(-A/(2*m)*t*cos(m*t))
    equals: A*sin(m*t)
    samples:
      A: [1, 0.5, 2, 1.3]
      m: [1, 3, 5, 1]
      t: [0.4, 1.1, 2, 2.6]
    tolerance: 1e-5
    shown: ['x = -\frac{A}{2m}\,t\cos mt \quad\text{solves}']
    source: {cite: mit, at: 'Part II, Problem 22(b) (our own solution)'}
    origin: page-own

  - id: p22-c-below
    answer: p22-c-below
    where: 'Problem 22(c), answer box: the coefficient of sin t for ω₀ = 0.9, from the numerically integrated Fourier coefficient of g divided by 0.81 − 1'
    inputs: {}
    formula: (2/pi)*(integrate('x*sin(x)', 'x', 0, pi/2) + integrate('(pi - x)*sin(x)', 'x', pi/2, pi))/(0.9**2 - 1)
    expected: '-6.70'
    shown: ['\dfrac{4}{\pi(0.81 - 1)} = -6.70']
    source: {cite: solutions, at: 'Problem 22(c), p. 1'}
    origin: page-own

  - id: p22-c-above
    answer: p22-c-above
    where: 'Problem 22(c), answer box: the coefficient of sin t for ω₀ = 1.1, from the numerically integrated Fourier coefficient of g divided by 1.21 − 1'
    inputs: {}
    formula: (2/pi)*(integrate('x*sin(x)', 'x', 0, pi/2) + integrate('(pi - x)*sin(x)', 'x', pi/2, pi))/(1.1**2 - 1)
    expected: '6.06'
    shown: ['\dfrac{4}{\pi(1.21 - 1)} = 6.06']
    source: {cite: solutions, at: 'Problem 22(c), p. 1'}
    origin: page-own

  - id: p22-c-third
    where: 'Problem 22(c), check: the coefficient of sin 3t for ω₀ = 0.9'
    inputs: {}
    formula: -4/(9*pi*(0.9**2 - 9))
    expected: '0.0173'
    shown: ['the coefficient of $\sin 3t$ is $0.0173$']
    source: {cite: solutions, at: 'Problem 22(c), p. 1'}
    origin: page-own

  - id: p22-d-half
    where: 'Problem 22(d), check: for ω₀ = 1/2 the free period 2π/ω₀, in units of π'
    inputs: {}
    formula: (2*pi/0.5)/pi
    expected: '4'
    shown: ['the free oscillation $\cos\frac{t}{2}$ has period $4\pi$']
    source: {cite: solutions, at: 'Problem 22(d), p. 1'}
    origin: page-own

  - id: p22-e-period
    answer: p22-e-period
    where: 'Problem 22(e), answer box: for ω₀ = 3/2, three free periods 2π/ω₀'
    inputs: {}
    formula: 3*(2*pi/1.5)
    expected: '12.57'
    shown: ['The shortest time that is a whole number of both is $4\pi = 12.57$']
    source: {cite: mit, at: 'Part II, Problem 22(e) (our own addition)'}
    origin: page-own

  - id: p22-e-period-input
    where: 'Problem 22(e), check: the same time is two periods 2π of the input'
    inputs: {}
    formula: 2*(2*pi)
    expected: '12.57'
    shown: ['three free periods and two periods of the input']
    source: {cite: mit, at: 'Part II, Problem 22(e) (our own addition)'}
    origin: page-own

  # ---- Problem 23

  - id: p23-c-integral
    where: 'Problem 23(c), check: the integral of f′ over all t, the box 2 × 1 and two spikes of −1'
    inputs: {}
    formula: integrate('2 + 0*x', 'x', 0, 1) - 1 - 1
    expected: '0'
    tolerance: 1e-9
    shown: ['the box contributes $2 \times 1 = 2$ and the two spikes contribute $-1$ each']
    source: {cite: solutions, at: 'Problem 23(c), p. 1'}
