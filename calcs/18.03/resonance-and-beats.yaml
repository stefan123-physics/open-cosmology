# Calculations on content/year-2/18.03/resonance-and-beats.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 14 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/resonance-and-beats.mdx
calcs:
  - id: resonant-solves
    kind: identity
    where: 't sin ω₀t/(2ω₀) solves y″ + ω₀²y = cos ω₀t'
    formula: (((t+1e-4)*sin(w*(t+1e-4))/(2*w)) - 2*(t*sin(w*t)/(2*w)) + ((t-1e-4)*sin(w*(t-1e-4))/(2*w))) / 1e-8 + w**2 * (t*sin(w*t)/(2*w))
    equals: cos(w*t)
    samples: {t: [0.0, 1.3, 4.0], w: [1.0, 3.0, 2.0]}
    tolerance: 1e-3
    shown: ['y_p = \frac{t\sin\omega_0t}{2\omega_0}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: limit
    kind: identity
    where: 'the near-resonant solution tends to the resonant one as ω₁ → ω₀ (checked with ω₁ = ω₀ + 1e-6)'
    formula: (cos((w+1e-6)*t) - cos(w*t)) / (w**2 - (w+1e-6)**2)
    equals: t*sin(w*t)/(2*w)
    samples: {t: [0.5, 1.3, 4.0], w: [1.0, 3.0, 2.0]}
    tolerance: 1e-3
    shown: ['exactly the resonant solution']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: cosine-difference
    kind: identity
    where: 'cos B − cos A = 2 sin((A − B)/2) sin((A + B)/2)'
    formula: cos(B) - cos(A)
    equals: 2 * sin((A - B)/2) * sin((A + B)/2)
    samples: {A: [0.3, 2.0, -1.0], B: [1.1, 0.4, 2.5]}
    tolerance: 1e-9
    shown: ['The lecture checks the factor 2']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: mit

  - id: practical-resonance
    kind: identity
    where: 'd/dω² of (ω₀² − ω²)² + 4p²ω² is zero at ω² = ω₀² − 2p²'
    formula: -2*(w0**2 - (w0**2 - 2*p**2)) + 4*p**2
    equals: 0*w0
    samples: {w0: [3.0, 1.0, 5.0], p: [0.5, 0.2, 1.0]}
    tolerance: 1e-9
    shown: ['is smallest at']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: plot-envelope
    where: 'graph: envelope height 2/(1 − 1.21)'
    inputs: {}
    formula: 2 / (1.21 - 1)
    expected: '9.52'
    shown: ['±(2/0.21) sin(0.05t)']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: plot-zero
    where: 'graph: envelope zero at 0.05t = π'
    inputs: {}
    formula: pi / 0.05
    expected: '62.8'
    shown: ['t = 20π ≈ 62.8']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: plot-fast
    where: 'graph: fast frequency (1 + 1.1)/2'
    inputs: {}
    formula: (1 + 1.1) / 2
    expected: '1.05'
    shown: ['about 1.05']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-a
    where: 'example (a): 9 − 4'
    inputs: {}
    formula: 9 - 2**2
    expected: '5'
    shown: ['= \frac15\cos 2t']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-b
    where: 'example (b): 4/(2·3)'
    inputs: {}
    formula: 4 / (2 * 3)
    expected: '0.667'
    shown: ['= \frac23\,t\sin 3t']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-c-solves
    kind: identity
    where: 'example (c): (cos 2.8t − cos 3t)/1.16 solves y″ + 9y = cos 2.8t'
    formula: (((cos(2.8*(t+1e-4)) - cos(3*(t+1e-4)))/1.16) - 2*((cos(2.8*t) - cos(3*t))/1.16) + ((cos(2.8*(t-1e-4)) - cos(3*(t-1e-4)))/1.16)) / 1e-8 + 9 * ((cos(2.8*t) - cos(3*t))/1.16)
    equals: cos(2.8*t)
    samples: {t: [0.0, 1.3, 4.0]}
    tolerance: 1e-3
    shown: ['{9 - 7.84}']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-c-height
    where: 'example (c): envelope height 2/1.16'
    inputs: {}
    formula: 2 / 1.16
    expected: '1.72'
    shown: ['\approx 1.72$']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-c-period
    where: 'example (c): envelope zeros every π/0.1'
    inputs: {}
    formula: pi / 0.1
    expected: '31.4'
    shown: ['\approx 31.4$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-d-omega1
    where: 'example (d): ω₁ = √(9 − 0.25)'
    inputs: {}
    formula: sqrt(9 - 0.5**2)
    expected: '2.958'
    shown: ['\approx 2.958$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-d-omegar
    where: 'example (d): ω_r = √(9 − 2·0.25)'
    inputs: {}
    formula: sqrt(9 - 2 * 0.5**2)
    expected: '2.915'
    shown: ['\approx 2.915$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own
