# Calculations on content/year-2/18.03/inhomogeneous-equations-and-stability.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 12 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/inhomogeneous-equations-and-stability.mdx
calcs:
  - id: plot-solves
    kind: identity
    where: 'graph: 2 − e^(−t)(2 cos 2t + sin 2t) solves y″ + 2y′ + 5y = 10'
    formula: ((2 - exp(-(t+1e-4))*(2*cos(2*(t+1e-4)) + sin(2*(t+1e-4)))) - 2*(2 - exp(-t)*(2*cos(2*t) + sin(2*t))) + (2 - exp(-(t-1e-4))*(2*cos(2*(t-1e-4)) + sin(2*(t-1e-4))))) / 1e-8 + 2 * ((2 - exp(-(t+1e-4))*(2*cos(2*(t+1e-4)) + sin(2*(t+1e-4)))) - (2 - exp(-(t-1e-4))*(2*cos(2*(t-1e-4)) + sin(2*(t-1e-4))))) / 2e-4 + 5 * (2 - exp(-t)*(2*cos(2*t) + sin(2*t)))
    equals: 10 + 0*t
    samples: {t: [0.0, 0.7, 2.0]}
    tolerance: 1e-3
    shown: ['computed from y_p = 2 plus the complementary solution']
    source: {cite: reading1, at: 'pp. 6–7'}
    origin: page-own

  - id: plot-initial-slope
    where: 'graph: y′(0) = e⁰(2 + 0) − e⁰(0 + 2) = 0'
    inputs: {}
    formula: (2*cos(0) + sin(0)) - (-4*sin(0) + 2*cos(0))
    expected: '0'
    shown: ['fitted to y(0) = y′(0) = 0']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: plot-overshoot
    where: 'graph: y′ = 5e^(−t) sin 2t vanishes at t = π/2, where y = 2 + 2e^(−π/2)'
    inputs: {}
    formula: 2 - exp(-pi/2) * (2*cos(pi) + sin(pi))
    expected: '2.42'
    shown: ['overshoots to about 2.42']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-b-roots
    where: 'example (b): real part of the roots of r² − r + 2'
    inputs: {}
    formula: 1 / 2
    expected: '0.5'
    shown: ['grows like $e^{t/2}$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-c-imag
    where: 'example (c): √(100 − 16) for r² + 8r + 100 = 0'
    inputs: {}
    formula: sqrt(100 - 16)
    expected: '9.17'
    shown: ['-4 \pm 9.17i']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-c-coefficients
    where: 'example (c): 0.5i″ + 4i′ + 50i: 1/C = 50, so r² + 8r + 100 after dividing by 0.5'
    inputs: {}
    formula: (1 / 0.02) / 0.5
    expected: '100'
    shown: ['r^2 + 8r + 100 = 0']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
