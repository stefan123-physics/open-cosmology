# Calculations on content/year-2/18.03/laplace-transform-of-derivatives.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 20 transcript, with the page's own examples.
# Derivatives are checked by central differences (h = 1e-4); transforms by numerical integration.

page: content/year-2/18.03/laplace-transform-of-derivatives.mdx
calcs:
  - id: max-ratio
    where: 'graph: maximum of t³e^(−t) at t = 3 is 27/e³'
    inputs: {}
    formula: 27 * exp(-3)
    expected: '1.344'
    shown: ['y: 1.344']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: max-ratio-caption
    where: 'graph caption: 27/e³ to two decimals'
    inputs: {}
    formula: 27 * exp(-3)
    expected: '1.34'
    shown: ['27/e³ ≈ 1.34 at t = 3']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: derivative-formula
    where: 'L(f′) = sF − f(0) for f = cos 2t at s = 3: L(−2 sin 2t) = 3·3/13 − 1'
    inputs: {}
    formula: integrate('-2*sin(2*t)*exp(-3*t)', 't', 0, 60)
    expected: '-0.307692'
    tolerance: '1e-5'
    shown: ['= s\,F(s) - f(0)" cite']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: lecture-solution-ode
    kind: identity
    where: 'the solution (3/4)e^t + (1/4)e^(−t) − (1/2)te^(−t) satisfies y″ − y = e^(−t)'
    formula: ((0.75*exp(t+1e-4) + 0.25*exp(-(t+1e-4)) - 0.5*(t+1e-4)*exp(-(t+1e-4))) - 2*(0.75*exp(t) + 0.25*exp(-t) - 0.5*t*exp(-t)) + (0.75*exp(t-1e-4) + 0.25*exp(-(t-1e-4)) - 0.5*(t-1e-4)*exp(-(t-1e-4)))) / 1e-8 - (0.75*exp(t) + 0.25*exp(-t) - 0.5*t*exp(-t))
    equals: exp(-t)
    samples: {t: [0.0, 0.6, 1.5]}
    tolerance: 1e-3
    shown: ['- \frac{1}{2}\,t\,e^{-t}']
    source: {cite: reading1, at: 'pp. 18–19'}
    origin: mit

  - id: lecture-solution-y0
    where: 'y(0) = 3/4 + 1/4'
    inputs: {}
    formula: 0.75 + 0.25
    expected: '1'
    tolerance: '1e-12'
    shown: ['y(0) = 1, \quad y''(0) = 0']
    source: {cite: reading1, at: 'pp. 13–15'}
    origin: mit

  - id: lecture-solution-y0-prime
    where: 'y′(0) = 3/4 − 1/4 − 1/2'
    inputs: {}
    formula: 0.75 - 0.25 - 0.5
    expected: '0'
    tolerance: '1e-12'
    shown: ['y(0) = 1, \quad y''(0) = 0']
    source: {cite: reading1, at: 'pp. 13–15'}
    origin: mit

  - id: bound-holds
    where: 'graph caption: 1.35e³ − 27 > 0, so t³ ≤ 1.35 e^t'
    inputs: {}
    formula: 1.35 * exp(3) - 27
    expected: '0.115'
    shown: ['so t³ ≤ 1.35 e^t']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: partial-fraction-c
    where: 'the coefficient c from s = 0: −1 = −1/2 + c − 3/4'
    inputs: {}
    formula: -1 + 0.5 + 0.75
    expected: '0.25'
    shown: ['so $c = \frac{1}{4}$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: mit

  - id: ex-a
    kind: identity
    where: 'example (a): 2 cos 2t + 3 sin 2t solves y″ + 4y = 0'
    formula: ((2*cos(2*(t+1e-4)) + 3*sin(2*(t+1e-4))) - 2*(2*cos(2*t) + 3*sin(2*t)) + (2*cos(2*(t-1e-4)) + 3*sin(2*(t-1e-4)))) / 1e-8 + 4 * (2*cos(2*t) + 3*sin(2*t))
    equals: 0*t
    samples: {t: [0.0, 0.6, 1.5]}
    tolerance: 1e-3
    shown: ['y = 2\cos 2t + 3\sin 2t$.']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b
    where: 'example (b): partial fractions of (s + 6)/(s(s + 3)) at s = 0 gives 6/3'
    inputs: {}
    formula: 6 / 3
    expected: '2'
    shown: ['$y = 2 - e^{-3t}$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-c
    where: 'example (c): 27e^(−3)'
    inputs: {}
    formula: 27 * exp(-3)
    expected: '1.344'
    shown: ['27e^{-3} \approx 1.344$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
