# Calculations on content/year-2/18.03/decoupling-linear-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 30 transcript, with the page's own example.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/decoupling-linear-systems.mdx
calcs:
  - id: tray-u-constant
    kind: identity
    where: 'u′ = x′ + 2y′ = (−2x + 2y) + 2(x − y) = 0'
    formula: (-2*x + 2*y) + 2*(x - y)
    equals: 0*x
    samples: {x: [0.0, 1.0, 2.5], y: [3.0, 0.5, 1.0]}
    tolerance: 1e-12
    shown: ['= 0, \qquad v']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: tray-v
    kind: identity
    where: 'v′ = x′ − y′ = −3(x − y)'
    formula: (-2*x + 2*y) - (x - y)
    equals: -3*(x - y)
    samples: {x: [0.0, 1.0, 2.5], y: [3.0, 0.5, 1.0]}
    tolerance: 1e-12
    shown: ['= -3(x - y) = -3v']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: tray-det-E
    where: 'det E = 1·1 − (−2)·1'
    inputs: {}
    formula: 1*1 - (-2)*1
    expected: '3'
    shown: ['determinant 3, and']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: plot-level
    where: 'graph: u = x + 2y = 0 + 2·3 = 6, common level u/3'
    inputs: {}
    formula: (0 + 2*3) / 3
    expected: '2'
    shown: ['common level u/3 = 2']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: plot-x
    kind: identity
    where: 'graph: x = 2 − 2e^(−3t), y = 2 + e^(−3t) satisfy x′ = −2x + 2y'
    formula: ((2 - 2*exp(-3*(t+1e-4))) - (2 - 2*exp(-3*(t-1e-4)))) / 2e-4
    equals: -2*(2 - 2*exp(-3*t)) + 2*(2 + exp(-3*t))
    samples: {t: [0.0, 0.3, 1.0]}
    tolerance: 1e-4
    shown: ['2 - 2*exp(-3*t)']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-solution
    kind: identity
    where: 'example: x = 2e^(4t) + e^(2t), y = 2e^(4t) − e^(2t) satisfy x′ = 3x + y'
    formula: ((2*exp(4*(t+1e-4)) + exp(2*(t+1e-4))) - (2*exp(4*(t-1e-4)) + exp(2*(t-1e-4)))) / 2e-4
    equals: 3*(2*exp(4*t) + exp(2*t)) + (2*exp(4*t) - exp(2*t))
    samples: {t: [0.0, 0.2, 0.5]}
    tolerance: 1e-4
    shown: ['$x = u + v = 2e^{4t} + e^{2t}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-solution-y
    kind: identity
    where: 'and y′ = x + 3y'
    formula: ((2*exp(4*(t+1e-4)) - exp(2*(t+1e-4))) - (2*exp(4*(t-1e-4)) - exp(2*(t-1e-4)))) / 2e-4
    equals: (2*exp(4*t) + exp(2*t)) + 3*(2*exp(4*t) - exp(2*t))
    samples: {t: [0.0, 0.2, 0.5]}
    tolerance: 1e-4
    shown: ['$y = u - v = 2e^{4t} - e^{2t}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
