  - id: square-wave-check
    where: 'the series at t = 1/2: 1/2 + (2/π)(1 − 1/3 + 1/5 − …) = 1'
    inputs: {}
    formula: 0.5 + (2/pi)*(pi/4)
    expected: '1'
    shown: ['Square wave of period 2']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

