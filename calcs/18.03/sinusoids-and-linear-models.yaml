# Calculations on content/year-2/18.03/sinusoids-and-linear-models.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 8 transcript, with the page's own numbers.

page: content/year-2/18.03/sinusoids-and-linear-models.mdx
calcs:
  - id: cartesian-equals-polar
    kind: identity
    where: 'section "The sine–cosine identity": the Cartesian answer equals the polar one'
    formula: (cos(w*t) + (w/k) * sin(w*t)) / (1 + (w/k)**2)
    equals: (1 / sqrt(1 + (w/k)**2)) * cos(w*t - atan(w/k))
    samples: {w: [0.25, 1.0, 3.0], k: [0.25, 1.0, 2.0], t: [0.0, 1.7, 4.2]}
    tolerance: 1e-6
    shown: ['cancels down to exactly the polar answer']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: sine-cosine-identity
    kind: identity
    where: 'a cos θ + b sin θ = √(a² + b²) cos(θ − φ), tan φ = b/a (a > 0)'
    formula: a * cos(x) + b * sin(x)
    equals: sqrt(a**2 + b**2) * cos(x - atan(b / a))
    samples: {a: [3.0, 1.0, 0.5], b: [4.0, -2.0, 7.0], x: [0.3, 2.0, -1.1]}
    tolerance: 1e-6
    shown: ['remember the picture']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

