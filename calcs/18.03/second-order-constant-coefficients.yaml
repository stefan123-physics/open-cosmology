# Calculations on content/year-2/18.03/second-order-constant-coefficients.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 9 transcript, with the page's own numbers.
# Derivatives are checked by central differences (h = 1e-4).

page: content/year-2/18.03/second-order-constant-coefficients.mdx
calcs:
  - id: overdamped-ode
    kind: identity
    where: 'Case 1 example: y = −½e^(−3t) + (3/2)e^(−t) solves y″ + 4y′ + 3y = 0'
    formula: ((-0.5*exp(-3*(t+1e-4)) + 1.5*exp(-(t+1e-4))) - 2*(-0.5*exp(-3*t) + 1.5*exp(-t)) + (-0.5*exp(-3*(t-1e-4)) + 1.5*exp(-(t-1e-4)))) / 1e-8 + 4 * ((-0.5*exp(-3*(t+1e-4)) + 1.5*exp(-(t+1e-4))) - (-0.5*exp(-3*(t-1e-4)) + 1.5*exp(-(t-1e-4)))) / 2e-4
    equals: -3 * (-0.5*exp(-3*t) + 1.5*exp(-t))
    samples: {t: [0.0, 0.7, 2.0]}
    tolerance: 1e-4
    shown: ['y = -\tfrac12\,e^{-3t} + \tfrac32\,e^{-t}']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: overdamped-initial-slope
    where: 'Case 1 example: y′(0) = 3/2 − 3/2 = 0'
    inputs: {}
    formula: -0.5 * -3 + 1.5 * -1
    expected: '0'
    shown: ['giving $c_1 = -\frac12$, $c_2 = \frac32$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: underdamped-ode
    kind: identity
    where: 'Case 2 example: e^(−2t)(cos t + 2 sin t) solves y″ + 4y′ + 5y = 0'
    formula: ((exp(-2*(t+1e-4))*(cos(t+1e-4) + 2*sin(t+1e-4))) - 2*(exp(-2*t)*(cos(t) + 2*sin(t))) + (exp(-2*(t-1e-4))*(cos(t-1e-4) + 2*sin(t-1e-4)))) / 1e-8 + 4 * ((exp(-2*(t+1e-4))*(cos(t+1e-4) + 2*sin(t+1e-4))) - (exp(-2*(t-1e-4))*(cos(t-1e-4) + 2*sin(t-1e-4)))) / 2e-4
    equals: -5 * exp(-2*t)*(cos(t) + 2*sin(t))
    samples: {t: [0.0, 0.7, 2.0]}
    tolerance: 1e-4
    shown: ['c_1 = 1$ and $c_2 = 2$']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: underdamped-phase
    where: 'Case 2 example: φ = arctan 2 in degrees (the lecture estimates about 70°)'
    inputs: {}
    formula: atan(2) * 180 / pi
    expected: '63.4'
    shown: ['\arctan 2 \approx 63.4°']
    source: {cite: reading1, at: 'p. 14'}
    origin: slip

  - id: underdamped-amplitude
    kind: identity
    where: 'Case 2 example: cos t + 2 sin t = √5 cos(t − arctan 2)'
    formula: cos(t) + 2*sin(t)
    equals: sqrt(5) * cos(t - atan(2))
    samples: {t: [0.0, 1.3, 4.0]}
    tolerance: 1e-9
    shown: ['= \sqrt5\,e^{-2t}\cos(t - \phi)']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: critical-ode
    kind: identity
    where: 'Case 3: t e^(−at) solves y″ + 2ay′ + a²y = 0'
    formula: (((t+1e-4)*exp(-a*(t+1e-4))) - 2*(t*exp(-a*t)) + ((t-1e-4)*exp(-a*(t-1e-4)))) / 1e-8 + 2*a * (((t+1e-4)*exp(-a*(t+1e-4))) - ((t-1e-4)*exp(-a*(t-1e-4)))) / 2e-4
    equals: -a**2 * t * exp(-a*t)
    samples: {t: [0.0, 0.7, 2.0], a: [1.0, 2.0, 3.0]}
    tolerance: 1e-4
    shown: ['y = t\,e^{-at}']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: plot-crossing
    where: 'graph: the underdamped curve crosses zero where tan t = −1/2'
    inputs: {}
    formula: pi - atan(0.5)
    expected: '2.7'
    shown: ['after t ≈ 2.7']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: plot-critical-slope
    where: 'graph: e^(−2t)(1 + 2t) has y′(0) = −2 + 2 = 0'
    inputs: {}
    formula: -2 * 1 + 2
    expected: '0'
    shown: ['y = e^(−2t)(1 + 2t)']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-a
    kind: identity
    where: 'example (a): e^(−2t) − e^(−3t) solves x″ + 5x′ + 6x = 0'
    formula: ((exp(-2*(t+1e-4)) - exp(-3*(t+1e-4))) - 2*(exp(-2*t) - exp(-3*t)) + (exp(-2*(t-1e-4)) - exp(-3*(t-1e-4)))) / 1e-8 + 5 * ((exp(-2*(t+1e-4)) - exp(-3*(t+1e-4))) - (exp(-2*(t-1e-4)) - exp(-3*(t-1e-4)))) / 2e-4
    equals: -6 * (exp(-2*t) - exp(-3*t))
    samples: {t: [0.0, 0.7, 2.0]}
    tolerance: 1e-4
    shown: ['x = e^{-2t} - e^{-3t}']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-b
    kind: identity
    where: 'example (b): e^(−t)(2 cos 3t + sin 3t) solves x″ + 2x′ + 10x = 0'
    formula: ((exp(-(t+1e-4))*(2*cos(3*(t+1e-4)) + sin(3*(t+1e-4)))) - 2*(exp(-t)*(2*cos(3*t) + sin(3*t))) + (exp(-(t-1e-4))*(2*cos(3*(t-1e-4)) + sin(3*(t-1e-4))))) / 1e-8 + 2 * ((exp(-(t+1e-4))*(2*cos(3*(t+1e-4)) + sin(3*(t+1e-4)))) - (exp(-(t-1e-4))*(2*cos(3*(t-1e-4)) + sin(3*(t-1e-4))))) / 2e-4
    equals: -10 * exp(-t)*(2*cos(3*t) + sin(3*t))
    samples: {t: [0.0, 0.7, 2.0]}
    tolerance: 1e-4
    shown: ['so $c_2 = 1$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-b-phi
    where: 'example (b): φ = arctan ½'
    inputs: {}
    formula: atan(0.5)
    expected: '0.464'
    shown: ['0.464$ rad']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-b-phi-deg
    where: 'example (b): φ in degrees'
    inputs: {}
    formula: atan(0.5) * 180 / pi
    expected: '26.6'
    shown: ['(26.6°)']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own
