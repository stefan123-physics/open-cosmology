# Calculations on content/year-2/18.03/substitution-methods.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 4 transcript, with the page's own examples. Formula checks only.

page: content/year-2/18.03/substitution-methods.mdx
calcs:
  - id: bernoulli-example
    kind: identity
    where: 'formula "Example solution": y = 2x/(x² + C₁) solves y′ = y/x − y²'
    formula: ((2 * (x + 1e-6) / ((x + 1e-6)**2 + C)) - (2 * (x - 1e-6) / ((x - 1e-6)**2 + C))) / 2e-6
    equals: (2 * x / (x**2 + C)) / x - (2 * x / (x**2 + C))**2
    samples: {x: [0.5, 2.0], C: [1.0, 3.0]}
    tolerance: 1e-5
    shown: ['y = \frac{2x}{x^2 + C_1}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: boat-equation
    kind: identity
    where: 'formula "The boat''s path": tan(α + 45°) = (y/x + 1)/(1 − y/x)'
    formula: tan(atan(y / x) + pi / 4)
    equals: (x + y) / (x - y)
    samples: {x: [3.0, 2.0], y: [1.0, 0.5]}
    tolerance: 1e-9
    shown: ['= \frac{x + y}{x - y}']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: boat-integral
    kind: identity
    where: 'formula "Integrated": d/dz[arctan z − ½ ln(1 + z²)] = (1 − z)/(1 + z²)'
    formula: ((atan(z + 1e-6) - 0.5 * log(1 + (z + 1e-6)**2)) - (atan(z - 1e-6) - 0.5 * log(1 + (z - 1e-6)**2))) / 2e-6
    equals: (1 - z) / (1 + z**2)
    samples: {z: [0.3, -1.2, 2.5]}
    tolerance: 1e-5
    shown: ['\arctan z - \tfrac12\ln(1 + z^2) = \ln x + c']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: spiral-45
    kind: identity
    where: 'graph: on r = e^θ the tangent makes 45° with the radius (dr/dθ = r)'
    formula: atan(exp(s) / exp(s))
    equals: pi / 4
    samples: {s: [-2.0, 0.5, 1.4]}
    tolerance: 1e-12
    shown: ['at every point the path makes a 45° angle with the line to the origin']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: logistic
    kind: identity
    where: 'worked example (a): y = 1/(1 + Ce^(−x)) solves y′ = y − y²'
    formula: ((1 / (1 + C * exp(-(x + 1e-6)))) - (1 / (1 + C * exp(-(x - 1e-6))))) / 2e-6
    equals: 1 / (1 + C * exp(-x)) - (1 / (1 + C * exp(-x)))**2
    samples: {x: [0.0, 1.5], C: [2.0, 0.5]}
    tolerance: 1e-5
    shown: ['so $y = \dfrac{1}{1 + Ce^{-x}}$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: homogeneous-example
    kind: identity
    where: 'worked example (b): y = x√(2 ln x + C) solves y′ = (x² + y²)/(xy)'
    formula: (((x + 1e-6) * sqrt(2 * log(x + 1e-6) + C)) - ((x - 1e-6) * sqrt(2 * log(x - 1e-6) + C))) / 2e-6
    equals: (x**2 + x**2 * (2 * log(x) + C)) / (x * x * sqrt(2 * log(x) + C))
    samples: {x: [1.5, 3.0], C: [1.0, 2.0]}
    tolerance: 1e-5
    shown: ['$y^2 = x^2(2\ln|x| + C)$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own
