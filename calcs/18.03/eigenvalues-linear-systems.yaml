# Calculations on content/year-2/18.03/eigenvalues-linear-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.03 (Spring 2010) Lecture 25 transcript, with the page's own example.

page: content/year-2/18.03/eigenvalues-linear-systems.mdx
calcs:
  - id: egg-char-constant
    where: '(λ + 2)(λ + 5) − 4 has constant term 10 − 4'
    inputs: {}
    formula: 2*5 - 4
    expected: '6'
    shown: ['= \lambda^2 + 7\lambda + 6 = 0']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: egg-eigvec-1
    where: 'λ = −1: A(2, 1) = (−2·2 + 2·1, 2·2 − 5·1) = −1·(2, 1); first component'
    inputs: {}
    formula: -2*2 + 2*1
    expected: '-2'
    shown: ['Taking $a_2 = 1$ gives $(2, 1)$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: egg-eigvec-6
    where: 'λ = −6: A(1, −2) second component 2·1 − 5·(−2) = 12 = −6·(−2)'
    inputs: {}
    formula: 2*1 - 5*(-2)
    expected: '12'
    shown: ['$a_1 = 1$, $a_2 = -2$']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: mit

  - id: plot-start
    where: 'graph: the curve starts at (50 − 10, 25 + 20) = (40, 45)'
    inputs: {}
    formula: (50 - 10) + (25 + 20)
    expected: '85'
    shown: ['Lecture 24, x(0) = 40, y(0) = 45']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-det
    where: 'example: det A = 1·1 − 2·2'
    inputs: {}
    formula: 1*1 - 2*2
    expected: '-3'
    shown: ['$\det A = 1 - 4 = -3$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-solution
    kind: identity
    where: 'example: x = 2e^(3t) + e^(−t), y = 2e^(3t) − e^(−t) satisfy x′ = x + 2y'
    formula: ((2*exp(3*(t+1e-4)) + exp(-(t+1e-4))) - (2*exp(3*(t-1e-4)) + exp(-(t-1e-4)))) / 2e-4
    equals: (2*exp(3*t) + exp(-t)) + 2*(2*exp(3*t) - exp(-t))
    samples: {t: [0.0, 0.3, 1.0]}
    tolerance: 1e-4
    shown: ['$x = 2e^{3t} + e^{-t}$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: egg-eigvec-1-second
    where: 'λ = −1: second component 2·2 − 5·1 = −1 = −1·1'
    inputs: {}
    formula: 2*2 - 5*1
    expected: '-1'
    shown: ['the slow eigenvector (2, 1)']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: ex-solution-y
    kind: identity
    where: 'example: y′ = 2x + y'
    formula: ((2*exp(3*(t+1e-4)) - exp(-(t+1e-4))) - (2*exp(3*(t-1e-4)) - exp(-(t-1e-4)))) / 2e-4
    equals: 2*(2*exp(3*t) + exp(-t)) + (2*exp(3*t) - exp(-t))
    samples: {t: [0.0, 0.3, 1.0]}
    tolerance: 1e-4
    shown: ['$y = 2e^{3t} - e^{-t}$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own
