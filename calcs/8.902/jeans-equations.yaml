# Calculations on content/year-5/8.902/jeans-equations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Jeans mass estimates for an isothermal sphere and a steeper tracer, and the plot's range.

page: content/year-5/8.902/jeans-equations.mdx
calcs:
  - id: isothermal-mass
    where: 'worked example (a): M = 2σ²r/G for σ = 150 km/s, r = 10 kpc'
    inputs: {}
    formula: 2 * 150**2 * 1e4 / 0.0043
    expected: '1.05e11'
    shown: ['$M = 2\sigma^2r/G = 2 \times 150^2 \times 10^4/0.0043 = 1.05\times10^{11}M_\odot$']
    source: {cite: reading1, at: 'eq. (186), p. 42'}
    origin: page-own

  - id: isothermal-vc
    where: 'worked example (a): v_c = √2 σ'
    inputs: {}
    formula: sqrt(2) * 150
    expected: '212'
    shown: ['$v_c = \sqrt{GM/r} = \sqrt2\,\sigma = 212$ km/s']
    source: {cite: reading1, at: 'eq. (186), p. 42'}
    origin: page-own

  - id: steeper-mass
    where: 'worked example (b): M = 3σ²r/G'
    inputs: {}
    formula: 3 * 150**2 * 1e4 / 0.0043
    expected: '1.6e11'
    shown: ['$M = 3\sigma^2r/G = 1.6\times10^{11}M_\odot$, 50% more']
    source: {cite: reading1, at: 'eq. (186), p. 42'}
    origin: page-own

  - id: plot-tangential
    where: 'plot caption: β = −0.5 with n ∝ r⁻³, constant σ gives 4 σ²r/G'
    inputs: {}
    formula: -(-3 + 0 + 2 * (-0.5))
    expected: '4'
    tolerance: '1e-9'
    shown: ['from 4 σ²r/G for tangential orbits (β = −0.5)']
    source: {cite: reading1, at: 'eq. (186), p. 42'}
    origin: page-own

  - id: plot-radial
    where: 'plot caption: β = 1 gives 1 σ²r/G'
    inputs: {}
    formula: -(-3 + 0 + 2 * 1)
    expected: '1'
    tolerance: '1e-9'
    shown: ['to 1 for strongly radial ones (β = 1)']
    source: {cite: reading1, at: 'eq. (186), p. 42'}
    origin: page-own
