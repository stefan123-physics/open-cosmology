# Calculations on content/year-5/8.902/spherical-collapse.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Einstein–de Sitter spherical collapse: ξ = (3π/4)², δ_c = (3/5)(3π/2)^(2/3), Δ_V = 18π².

page: content/year-5/8.902/spherical-collapse.mdx
calcs:
  - id: xi-turnaround
    where: 'formula "Overdensity at turnaround"; flashcard 2; summary'
    inputs: {}
    formula: (3 * pi / 4)**2
    expected: '5.55'
    shown: ['\xi = \left(\frac{3\pi}{4}\right)^2 \approx 5.55']
    source: {cite: reading2, at: 'eq. (436), p. 94'}
    origin: mit

  - id: delta-ta
    where: 'formula "Linear density contrast at turnaround"; flashcard 2'
    inputs: {}
    formula: 3 / 5 * (3 * pi / 4)**(2/3)
    expected: '1.06'
    shown: ['\frac35\left(\frac{3\pi}{4}\right)^{2/3} \approx 1.06']
    source: {cite: reading2, at: 'eqs. (442)–(444), p. 95'}
    origin: mit

  - id: delta-c
    where: 'formula "Critical linear density contrast"; summary'
    inputs: {}
    formula: 3 / 5 * (3 * pi / 2)**(2/3)
    expected: '1.69'
    shown: ['\frac35\left(\frac{3\pi}{2}\right)^{2/3} \approx 1.69']
    source: {cite: reading2, at: 'eq. (445), p. 95'}
    origin: mit

  - id: delta-c-from-delta-ta
    where: 'formula "Critical linear density contrast": 4^(1/3) δ_ta, to four digits as in quiz 2 and flashcard 3'
    inputs: {}
    formula: 4**(1/3) * 3 / 5 * (3 * pi / 4)**(2/3)
    expected: '1.686'
    shown: ['(3\\pi/2)^{2/3} \\approx 1.686$.', '(3\\pi/2)^{2/3} \\approx 1.686$"', '\\approx 1.686$"']
    source: {cite: reading2, at: 'eq. (445), p. 95'}
    origin: mit

  - id: x-collapse
    kind: identity
    where: 'formula "Scale factor at collapse": (3/2)^(2/3) (4/3)^(2/3) = 4^(1/3)'
    formula: (3 / 2)**(2/3) * (4 / 3)**(2/3) * one
    equals: 4**(1/3) * one
    samples: {one: [1]}
    shown: ['x_c = \left(\frac{3}{2}\right)^{2/3}\left(\frac{4}{3}\right)^{2/3} = 4^{1/3}']
    source: {cite: reading2, at: 'eq. (437), p. 94'}
    origin: mit

  - id: virial-overdensity
    where: 'formula "Virial overdensity": 32ξ = 18π² ≈ 178; quiz 3'
    inputs: {}
    formula: 32 * (3 * pi / 4)**2
    expected: '178'
    shown: ['= 18\pi^2 \approx 178"', '= 18\pi^2 \approx 178$']
    quiz: 3
    source: {cite: reading2, at: 'eq. (447), p. 96'}
    origin: mit

  - id: virial-is-18-pi-squared
    kind: identity
    where: 'formula "Virial overdensity": (4^(1/3)/(1/2))³ ξ must equal 18π²'
    formula: (4**(1/3) / (1 / 2))**3 * (3 * pi / 4)**2 * one
    equals: 18 * pi**2 * one
    samples: {one: [1]}
    shown: ['\Delta_V = \left(\frac{x_c}{y}\right)^3\xi = \left(\frac{4^{1/3}}{1/2}\right)^3\xi = 32\,\xi']
    source: {cite: reading2, at: 'eq. (447), p. 96'}
    origin: mit

  - id: z-turnaround
    where: 'worked example "A cluster that collapses today", step "Turnaround time"'
    inputs: {}
    formula: 2**(2/3)
    expected: '1.59'
    shown: ['$1 + z_\text{ta} = 2^{2/3} = 1.59$']
    source: {cite: reading2, at: 'eq. (437), p. 94'}
    origin: page-own

  - id: rho-c
    where: 'worked example, problem: ρ_c = 3H0²/8πG with H0 = 70 km/s/Mpc'
    inputs: {H: 70 km/s/Mpc}
    formula: 3 * H**2 / (8 * pi * G)
    expected: 9.2e-27 kg/m**3
    shown: ['\rho_c = 3H_0^2/8\pi G = 9.2\times10^{-27}$ kg/m³']
    source: {cite: reading2, at: 'eq. (447), p. 96'}
    origin: page-own

  - id: r-vir-m
    where: 'worked example, step "Virial radius"'
    inputs: {M: 1e15, Ms: 1.99e30 kg, rho: 9.2e-27 kg/m**3}
    formula: (3 * M * Ms / (4 * pi * 178 * rho))**(1/3)
    expected: 6.6e22 m
    shown: ['= 6.6\times10^{22}$ m']
    source: {cite: reading2, at: 'eq. (447), p. 96'}
    origin: page-own

  - id: r-vir-mpc
    where: 'worked example, step "Virial radius"'
    inputs: {M: 1e15, Ms: 1.99e30 kg, rho: 9.2e-27 kg/m**3}
    formula: (3 * M * Ms / (4 * pi * 178 * rho))**(1/3)
    expected: 2.1 Mpc
    shown: ['m $\approx 2.1$ Mpc']
    source: {cite: reading2, at: 'eq. (447), p. 96'}
    origin: page-own

  - id: r-ta
    where: 'worked example, step "Turnaround radius, a check": R_ta = 2 R_vir'
    inputs: {M: 1e15, Ms: 1.99e30 kg, rho: 9.2e-27 kg/m**3}
    formula: 2 * (3 * M * Ms / (4 * pi * 178 * rho))**(1/3)
    expected: 4.3 Mpc
    shown: ['$R_\text{ta} = 2R_\text{vir} \approx 4.3$ Mpc']
    source: {cite: reading2, at: 'eq. (446), p. 96'}
    origin: page-own

  - id: r-ta-independent
    where: 'worked example, step "Turnaround radius, a check": from the density ξρ_c(1 + z_ta)³ at turnaround'
    inputs: {M: 1e15, Ms: 1.99e30 kg, rho: 9.2e-27 kg/m**3}
    formula: (3 * M * Ms / (4 * pi * (3 * pi / 4)**2 * rho * (2**(2/3))**3))**(1/3)
    expected: 4.3 Mpc
    shown: ['also gives 4.3 Mpc']
    source: {cite: reading2, at: 'eq. (436), p. 94'}
    origin: page-own

  - id: delta-lin-z1
    where: 'worked example, step "Linear density today": δ_c/2 at z = 1'
    inputs: {}
    formula: 3 / 5 * (3 * pi / 2)**(2/3) / 2
    expected: '0.84'
    shown: ['linear theory gave it 0.84']
    source: {cite: reading2, at: 'eq. (445), p. 95'}
    origin: page-own

  - id: tau-z1
    where: 'worked example, step "Linear density today": background x = (a/a_ta) = ½ · 2^(2/3), τ = (2/3)x^(3/2)'
    inputs: {}
    formula: 2 / 3 * (0.5 * 2**(2/3))**1.5
    expected: '0.471'
    shown: ['$\tau = 0.471$']
    source: {cite: reading2, at: 'eqs. (431)–(432), p. 93'}
    origin: page-own

  - id: s-z1
    where: 'worked example, step "Linear density today": the cycloid parameter s with (2/3π)(s − sin s) = τ'
    inputs: {}
    formula: solve('2 / (3 * pi) * (q - sin(q)) - 2 / 3 * (0.5 * 2**(2/3))**1.5', 'q', 2, 3)
    expected: '2.67'
    shown: ['$s = 2.67$']
    source: {cite: reading2, at: 'eq. (435), p. 94'}
    origin: page-own

  - id: y-z1
    where: 'worked example, step "Linear density today": y = (1 − cos s)/2'
    inputs: {}
    formula: (1 - cos(solve('2 / (3 * pi) * (q - sin(q)) - 2 / 3 * (0.5 * 2**(2/3))**1.5', 'q', 2, 3))) / 2
    expected: '0.946'
    shown: ['$y = 0.946$']
    source: {cite: reading2, at: 'eq. (435), p. 94'}
    origin: page-own

  - id: big-delta-z1
    where: 'worked example, step "Linear density today": Δ = ξ(x/y)³ ≈ 3.3'
    inputs: {}
    formula: (3 * pi / 4)**2 * (0.5 * 2**(2/3) / ((1 - cos(solve('2 / (3 * pi) * (q - sin(q)) - 2 / 3 * (0.5 * 2**(2/3))**1.5', 'q', 2, 3))) / 2))**3
    expected: '3.3'
    shown: ['$\Delta \approx 3.3$']
    source: {cite: reading2, at: 'eq. (439), p. 94'}
    origin: page-own

  - id: small-delta-z1
    where: 'worked example, step "Linear density today": δ = Δ − 1 ≈ 2.3'
    inputs: {}
    formula: (3 * pi / 4)**2 * (0.5 * 2**(2/3) / ((1 - cos(solve('2 / (3 * pi) * (q - sin(q)) - 2 / 3 * (0.5 * 2**(2/3))**1.5', 'q', 2, 3))) / 2))**3 - 1
    expected: '2.3'
    shown: ['$\delta \approx 2.3$']
    source: {cite: reading2, at: 'eq. (441), p. 95'}
    origin: page-own

  - id: bryan-norman-mean
    where: 'callout "Beyond the simple model": Bryan & Norman Δ_c = 18π² + 82x − 39x² (x = Ω_m − 1, relative to critical), divided by Ω_m = 0.3 for the mean density: "roughly 340" (337; the page said 330 until the calculation audit)'
    inputs: {Om: 0.3}
    formula: (18 * pi**2 + 82 * (Om - 1) - 39 * (Om - 1)**2) / Om
    expected: '340'
    shown: ['rises to roughly 340 for $\Omega_m \approx 0.3$']
    source: {cite: bryannorman, at: 'eq. (6)'}
    origin: later-data
