  - id: radiation-small-p1
    where: 'section "The model universe": radiation changes Problem 1(a) by less than 0.1% (relative change of Δχ, in %)'
    inputs: {Om: 0.3, OL: 0.7, Or: 8.24e-5}
    formula: 100*(1 - integrate('1/sqrt(Om*(1+x)**3 + Or*(1+x)**4 + OL)', 'x', 4711/1206 - 1, 4836/1206 - 1) / integrate('1/sqrt(Om*(1+x)**3 + OL)', 'x', 4711/1206 - 1, 4836/1206 - 1))
    expected: '0.05'
    tolerance: '0.04'
    shown: ['Radiation would change the answers there by less than 0.1%']
    source: {cite: mit, at: 'Introduction (our own solution)'}
    origin: page-own

