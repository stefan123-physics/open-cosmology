# Calculations on content/year-5/8.902/8-902-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set. Every distance is a numerical integral (SciPy quad); each is checked
# by a second route: Simpson's rule written out, the same integral in the other variable (z or a), or the
# exact integral without the cosmological constant, which is negligible at the early times concerned.

page: content/year-5/8.902/8-902-problem-set-4.mdx
calcs:
  # ---- MIT's data and our chosen values

  - id: mit-parameters
    kind: fact
    where: 'section "The model universe": the parameters MIT assumes for the whole set'
    shown: ['tex="\Omega_{m,0} = 0.3, \qquad \Omega_{\Lambda,0} = 0.7, \qquad H_0 = 71\ \text{km/s/Mpc}"']
    source: {cite: mit, at: 'Introduction, p. 1'}
    origin: mit

  - id: mit-wavelengths
    kind: fact
    where: 'Problem 1: rest wavelength of Si++ and the two observed wavelengths'
    shown: ['whose rest wavelength is 1206 Å', 'We observe the two lines at 4711 Å and 4836 Å']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: mit-absorber-data
