  - id: p2-slope-min
    where: 'Problem 2(a): the logarithmic slope 2 − (3/2)Ω_m(1+z)^3/E^2 tends to its smallest value 1/2 at large z'
    kind: limit
    inputs: {}
    formula: 2 - 1.5*0.3*(1 + z)**3/(0.3*(1 + z)**3 + 0.7)
    limit: 0.5
    vary: {z: [10, 100, 1000, 10000]}
    tolerance: 1e-6
    shown: ['so the slope is at least $\frac12$']
    source: {cite: mit, at: 'Problem 2(A) (our own solution)'}
