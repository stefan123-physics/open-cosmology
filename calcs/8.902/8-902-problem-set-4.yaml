  - id: p2-denominator
    where: 'Problem 2(b): n (1+z)^2 c/H(2), per Mpc² (the number crossed per unit redshift for σ = 1 Mpc²)'
    inputs: {H0: '71 km/s/Mpc', n: '0.001 Mpc**-3'}
