  # ---- Problem 3

  - id: p3-omega-r
    where: 'Problem 3: radiation density parameter from photons at 2.725 K plus three kinds of neutrinos, for H0 = 71'
    inputs: {T: '2.725 K', H0: '71 km/s/Mpc'}
