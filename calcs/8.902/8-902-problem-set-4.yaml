  - id: p1-midpoint
    where: 'Problem 1(c), check: estimate with H at the midpoint redshift'
    inputs: {H0: '71 km/s/Mpc'}
    formula: c*(4836/1206 - 4711/1206)/(H0*sqrt(0.3*((4711/1206 + 4836/1206)/2)**3 + 0.7))
    expected: '99.61 Mpc'
    shown: ['instead gives 99.61 Mpc']
