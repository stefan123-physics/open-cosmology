  - id: p1-midpoint-diff
    where: 'Problem 1(c), check: midpoint estimate within 0.01% of the integral (relative difference in %, below 0.01)'
    inputs: {Om: 0.3, OL: 0.7}
    formula: 100*(1 - ((4836/1206 - 4711/1206)/sqrt(Om*((4711/1206 + 4836/1206)/2)**3 + OL)) / integrate('1/sqrt(Om*(1+x)**3 + OL)', 'x', 4711/1206 - 1, 4836/1206 - 1))
