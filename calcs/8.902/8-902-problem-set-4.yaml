  # Independent route: Simpson's rule with 4 intervals, written out, against SciPy's adaptive quadrature.
  - id: p1-integral-simpson
    kind: identity
    where: 'Problem 1(a): the integral by quadrature against Simpson''s rule with four intervals (the interval is short and smooth)'
    formula: integrate('1/sqrt(Om*(1+x)**3 + OL)', 'x', za, zb)
    equals: ((zb - za)/12) * (1/sqrt(Om*(1+za)**3 + OL) + 4/sqrt(Om*(1+za+(zb-za)/4)**3 + OL) + 2/sqrt(Om*(1+za+(zb-za)/2)**3 + OL) + 4/sqrt(Om*(1+za+3*(zb-za)/4)**3 + OL) + 1/sqrt(Om*(1+zb)**3 + OL))
    samples:
      za: [2.906301824212272, 1.0, 0.5]
      zb: [3.009950248756219, 1.1, 0.55]
      Om: [0.3, 0.3, 0.25]
      OL: [0.7, 0.7, 0.75]
    tolerance: 1e-7
    shown: ['(for example Simpson''s rule)']
    source: {cite: mit, at: 'Problem 1(A) (our own solution)'}
    origin: page-own

  - id: p1-dchi
    answer: p1-dchi
    where: 'Problem 1(a): comoving distance between the galaxies'
    inputs: {H0: '71 km/s/Mpc', Om: 0.3, OL: 0.7}
    formula: c/H0 * integrate('1/sqrt(Om*(1+x)**3 + OL)', 'x', 4711/1206 - 1, 4836/1206 - 1)
    expected: '99.6 Mpc'
    shown: ['\Delta\chi = 4222 \times 0.023593 = 99.6$ Mpc']
    source: {cite: reading2, at: 'eqs. (334)–(335), p. 74'}
    origin: page-own

  - id: p1-trapezoid
    where: 'Problem 1(a), check: two-point trapezoid rule'
    inputs: {H0: '71 km/s/Mpc'}
    formula: c/H0 * (4836/1206 - 4711/1206) * (1/sqrt(0.3*(4711/1206)**3 + 0.7) + 1/sqrt(0.3*(4836/1206)**3 + 0.7))/2
    expected: '99.64 Mpc'
    shown: ['\times 4222 = 99.64$ Mpc']
    source: {cite: mit, at: 'Problem 1(A) (our own solution)'}
    origin: page-own

  - id: p1-dz
