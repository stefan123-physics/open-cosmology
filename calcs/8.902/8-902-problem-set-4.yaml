  # ---- Problem 2

  # The formula answer against the count done in proper units: proper density n(1+z)^3, cross-section σ,
  # proper path c|dt| = c dz/[(1+z)H].
  - id: p2-dndz
    kind: identity
    answer: p2-dndz
    where: 'Problem 2(a), formula box and "Absorbers per unit redshift": against the count in proper units'
    formula: n*sigma*c*(1 + z)**2/(H0*sqrt(Om*(1 + z)**3 + OL))
    equals: (n*(1 + z)**3) * sigma * c / ((1 + z) * H0*sqrt(Om*(1 + z)**3 + OL))
    samples:
      n: [0.001, 1, 2, 0.5]
      sigma: [0.156, 1, 0.5, 2]
      c: [299792.458, 1, 3, 2]
      H0: [71, 1, 2, 0.5]
      Om: [0.3, 0.1, 0.5, 0.3]
      OL: [0.7, 0.9, 0.5, 0.7]
      z: [2, 0.5, 4, 1]
    tolerance: 1e-12
    shown: ['\frac{dN}{dz} = n\,\sigma(1 + z)^2\,\frac{d\chi}{dz} = \frac{n\,\sigma\,c\,(1 + z)^2}{H_0\sqrt{\Omega_{m,0}(1 + z)^3 + \Omega_{\Lambda,0}}}']
    source: {cite: reading2, at: 'eqs. (339)–(341), p. 75'}
    origin: page-own

  # A second, numerical route: integrate n σ (1+z)^2 dχ over a short interval and divide by its length.
  - id: p2-dndz-numerical
    kind: identity
    where: 'Problem 2(a): the count per unit redshift as a numerical integral over a small interval around z, against the formula'
    formula: n*sigma*c*(1 + z)**2/(H0*sqrt(Om*(1 + z)**3 + OL))
    equals: integrate('n*sigma*(1+x)**2 * c/(H0*sqrt(Om*(1+x)**3 + OL))', 'x', z - 1e-4, z + 1e-4) / 2e-4
    samples:
      n: [1, 2]
      sigma: [1, 0.5]
      c: [1, 3]
      H0: [1, 2]
      Om: [0.3, 0.2]
      OL: [0.7, 0.8]
      z: [2, 0.7]
    tolerance: 1e-6
    shown: ['The same result follows in proper units']
    source: {cite: mit, at: 'Problem 2(A) (our own solution)'}
    origin: page-own

  - id: p2-growth-0-to-2
    where: 'Problem 2(a): dN/dz grows by (1+z)^2/E(z) = 3.03 from z = 0 to 2'
    inputs: {}
    formula: 9/sqrt(0.3*27 + 0.7)
    expected: '3.03'
    shown: ['it grows by a factor of 3.03']
    source: {cite: mit, at: 'Problem 2(A) (our own solution)'}
