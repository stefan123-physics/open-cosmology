  # The formula answer against an independent route: H = c / (dχ/dz), with χ(z) found by numerical integration.
  - id: p1-hz
    kind: identity
    answer: p1-hz
    where: 'Problem 1(c), formula box and "Hubble parameter of the model": against c divided by the numerical derivative of the integrated comoving distance (c = 1)'
    formula: H0*sqrt(Om*(1 + z)**3 + OL)
    equals: 1/deriv("integrate('1/(H0*sqrt(Om*(1+x)**3 + OL))', 'x', 0, y)", 'y', z)
    samples:
      H0: [71, 50, 100, 1]
      Om: [0.3, 0.1, 0.5, 0.25]
      OL: [0.7, 0.9, 0.5, 0.75]
      z: [2.9063, 0.5, 5, 1.3]
    tolerance: 1e-6
    shown: ['tex="H(z) = H_0\sqrt{\Omega_{m,0}(1+z)^3 + \Omega_{\Lambda,0}}"']
    source: {cite: reading2, at: 'eq. (334), p. 74'}
    origin: page-own

  - id: p1-hz1
    answer: p1-hz1
    where: 'Problem 1(c): H(z1)'
    inputs: {H0: '71 km/s/Mpc'}
    formula: H0*sqrt(0.3*(4711/1206)**3 + 0.7)
    expected: '306.1 km/s/Mpc'
    shown: ['= 306.1$ km s⁻¹ Mpc⁻¹']
