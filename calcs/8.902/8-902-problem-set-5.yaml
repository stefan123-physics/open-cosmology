# Calculations on content/year-5/8.902/8-902-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set. Problem 1: every number from the cycloid, with eta found by solve() here
# and checked independently with scipy (brentq) by the author; the two formulas of parts (a) and (b) are checked as
# identities. Problem 2: every distance by numerical integration here; the matter-only closed forms (Mattig) are checked
# against the integral as identities; the author's script (scipy quad) gave the same values.
#
# Problem 2's table is our own, generated in place of MIT's data file (the SNLS 3-year catalogue of Guy et al. 2010,
# which is not used): numpy.random.default_rng(2); z = 0.02, 0.03, 0.04, 0.05, 0.07, 0.10, 0.15, 0.22, 0.30, 0.37,
# 0.40, 0.44, 0.51, 0.58, 0.65, 0.72, 0.79, 0.86, 0.93, 1.00; true s ~ N(0, 0.12), true c ~ N(0, 0.10) (drawn in
# that order); errors sigma_m = sigma_c = 0.02 + 0.04 z and sigma_s = 0.02 + 0.05 z (rounded to 0.001);
# m* = mu(z; flat, Omega_M = 0.30, H0 = 71) + M - alpha s + beta c + N(0, 0.10), with alpha = 1.50, beta = 3.10,
# M = -19.30; then measurement noise N(0, sigma) added to m*, s and c; m* rounded to 0.01, s and c to 0.001.
# The fit (MIT's algorithm, sigma_int = 0.10 mag) was done by an iterated weighted linear least squares in (alpha, beta, M)
# with a bounded 1-D search in Omega_M, and checked by a Nelder-Mead minimisation over all four at the final weights
# (same values to 1e-5). The harness cannot read a table or fit, so the fit and grid results are kind: fact.
# Unrounded: alpha 1.4986, beta 2.7419, M -19.3107, Omega_M 0.2938, chi2 22.382; Delta chi2 = 1 range 0.2129-0.3866;
# with sigma_int^2 = 0.10: alpha 1.469, beta 2.707, M -19.303, Omega_M 0.307, chi2 4.900.
# Curved grid (step 0.01, Omega_M 0-1.5, Omega_Lambda -0.5-2.0, models without a big bang below z = 1 left out):
# minimum (0.41, 0.86), chi2 22.269 (refined (0.4109, 0.8644), 22.2685); flat best Delta chi2 = 0.114;
# (0.3, 0) Delta chi2 = 21.31; (1, 0) 77.71; Delta chi2 < 2.3 region: Omega_M 0-0.87, Omega_Lambda 0.20-1.49;
# Hessian at the minimum: smallest-curvature direction (0.591, 0.807), slope 1.364.

page: content/year-5/8.902/8-902-problem-set-5.mdx
calcs:
