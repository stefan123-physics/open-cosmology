  # ---- Problem 1: the timing argument

  - id: p1-velocity-identity
    kind: identity
    where: 'Problem 1(a): v = (dr/deta)/(dt/deta) equals MIT''s expression in r, t and eta'
    formula: (A*(1 - cos(x)))/(B*(x - sin(x)))*sin(x)*(x - sin(x))/(1 - cos(x))**2
    equals: deriv('A*(1 - cos(y))', 'y', x)/deriv('B*(y - sin(y))', 'y', x)
    samples:
      A: [1, 2.5, 498.8, 0.7]
      B: [1, 0.3, 2.628, 4]
      x: [0.5, 2.0, 4.297, 5.9]
    shown: ['tex="v = \frac{r}{t}\,\frac{\sin\eta\,(\eta - \sin\eta)}{(1 - \cos\eta)^2}"']
    source: {cite: mit, at: 'Problem 1(A), p. 1'}
    origin: mit

  - id: p1-energy-constant
    kind: identity
    where: 'Problem 1(b): with GM_T = A^3/B^2, the energy (1/2) rdot^2 - GM_T/r on the cycloid is the constant -A^2/(2B^2)'
    formula: 0.5*(A/B)**2*sin(x)**2/(1 - cos(x))**2 - (A**3/B**2)/(A*(1 - cos(x)))
    equals: -A**2/(2*B**2)
    samples:
      A: [1, 2.5, 498.8, 0.7]
      B: [1, 0.3, 2.628, 4]
      x: [0.5, 2.0, 4.297, 5.9]
    shown: ['The energy is $E = -A^2/(2B^2) < 0$']
    source: {cite: mit, at: 'Problem 1(B), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-small-eta
    kind: limit
    where: 'Problem 1(a), check: near the start v t/r tends to 2/3'
    inputs: {}
    formula: sin(x)*(x - sin(x))/(1 - cos(x))**2
    limit: 2/3
    vary: {x: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 1e-4
    shown: ['$v \approx \frac{r}{t}\cdot\frac{\eta^4/6}{\eta^4/4} = \frac{2}{3}\frac{r}{t}$']
    source: {cite: mit, at: 'Problem 1(A) (our own check)'}
    origin: page-own

  - id: p1-time-seconds
