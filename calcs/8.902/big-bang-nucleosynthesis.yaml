# Calculations on content/year-5/8.902/big-bang-nucleosynthesis.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Neutron-to-proton ratio at freeze-out, the instant-fusion helium fraction, the Saha condition for deuterium
# (solved for kT), neutron decay up to deuterium formation and the resulting helium fraction.

page: content/year-5/8.902/big-bang-nucleosynthesis.mdx
calcs:
  - id: np-freeze
    where: 'eq. (481) and worked example (a): e^(−1.29/0.8)'
    inputs: {}
    formula: exp(-1.29 / 0.8)
    expected: '0.199'
    shown: ['$e^{-1.29/0.8} = e^{-1.61} = 0.199$']
    source: {cite: reading1, at: 'eq. (481), p. 110'}
    origin: mit

  - id: np-exponent
    where: 'worked example (a) and quiz 1: 1.29/0.8'
    inputs: {}
    formula: 1.29 / 0.8
    expected: '1.61'
    shown: ['$e^{-1.61} = 0.20$']
    source: {cite: reading1, at: 'eq. (481), p. 110'}
    origin: page-own

  - id: mass-prefactor
    where: 'section "Neutrons and protons in equilibrium": (m_n/m_p)^(3/2) ≈ 1.002'
    inputs: {}
    formula: (939.565 / 938.272)**1.5
    expected: '1.002'
    shown: ['$(m_n/m_p)^{3/2} \approx 1.002$']
    source: {cite: reading1, at: 'eq. (479), p. 109'}
    origin: page-own

  - id: instant-fusion-Y
    where: 'eq. (483) and quiz 3: Y = 4/12'
    inputs: {}
    formula: 4 / 12
    expected: '0.33'
    shown: ['= \frac{4}{12} \approx 0.33']
    source: {cite: reading1, at: 'eq. (483), p. 110'}
    origin: mit

  - id: observed-Y-notes
    kind: fact
    where: 'section "A first estimate": observations give about 0.24 in the notes'
    shown: ['about 0.24 in the notes']
    source: {cite: reading1, at: 'p. 110'}
    origin: mit

  - id: saha-factor
    where: 'section "When does deuterium form?": (3/4) · 2^(3/2) · 2^(3/2) = 6'
    inputs: {}
    formula: 0.75 * 2**1.5 * 2**1.5
    expected: '6'
    tolerance: '1e-9'
    shown: ['\tfrac34 \cdot 2^{3/2} \cdot 2^{3/2} = 6']
    source: {cite: reading1, at: 'eq. (485), p. 110'}
    origin: page-own

  - id: n-gamma-coefficient
    where: 'eq. (488): n_γ = 0.24 (kT/ħc)³, the coefficient 2ζ(3)/π²'
    inputs: {}
    formula: 2 * 1.2020569 / pi**2
    expected: '0.24'
    shown: ['$n_\gamma = 0.24\,(kT/\hbar c)^3$']
    source: {cite: reading1, at: 'eq. (488), p. 111'}
    origin: page-own

  - id: prefactor-exact
    where: 'bracket after eq. (489): 0.24 × 5 × π^(3/2) = 1.2 × 5.57 = 6.7'
    inputs: {}
    formula: 0.24 * 5 * pi**1.5
    expected: '6.7'
    shown: ['$0.24 \times 5 \times \pi^{3/2} = 1.2 \times 5.57 = 6.7$']
    source: {cite: reading1, at: 'eq. (489), p. 111'}
    origin: slip

  - id: pi-three-halves
    where: 'bracket after eq. (489): π^(3/2) = 5.57'
    inputs: {}
    formula: pi**1.5
    expected: '5.57'
    shown: ['1.2 \times 5.57']
    source: {cite: reading1, at: 'eq. (489), p. 111'}
    origin: page-own

  - id: prefactor-notes
    where: 'eq. (489): 6.9 η with η = 5 × 10⁻¹⁰ gives 3.4 × 10⁻⁹'
    inputs: {}
    formula: 6.9 * 5e-10
    expected: '3.4e-9'
    tolerance: '0.1e-9'
    shown: ['\approx 3.4\times10^{-9}\left(']
    source: {cite: reading1, at: 'eq. (489), p. 111'}
    origin: mit

  - id: deuterium-kT
    where: 'plot caption: the Saha condition crosses n_D = n_n at kT ≈ 0.066 MeV (exact prefactor, η = 5 × 10⁻¹⁰, B = 2.22 MeV)'
    inputs: {}
    formula: solve('log(1.2 * pi**1.5 * 5e-10) + 1.5 * log(x / 939.565) + 2.22 / x', 'x', 0.03, 0.2)
    expected: '0.066'
    shown: ['at kT ≈ 0.066 MeV']
    source: {cite: reading1, at: 'eq. (489), p. 111'}
    origin: page-own

  - id: deuterium-T
    where: 'plot caption: kT = 0.066 MeV is about 7.6 × 10⁸ K'
    inputs: {}
    formula: solve('log(1.2 * pi**1.5 * 5e-10) + 1.5 * log(x / 939.565) + 2.22 / x', 'x', 0.03, 0.2) * 1e6 / 8.617333e-5
    expected: '7.6e8'
    shown: ['about 7.6 × 10⁸ K']
    source: {cite: reading1, at: 'eq. (490), p. 111'}
    origin: page-own

  - id: deuterium-T-notes
    kind: fact
    where: 'eq. (490): T ≈ 8 × 10⁸ K, t ≈ 200 s'
    shown: ['T \approx 8\times10^8\ \text{K}, \qquad t \approx 200\ \text{s}']
    source: {cite: reading1, at: 'eq. (490), p. 111'}
    origin: mit

  - id: rough-time
    where: 'bracket: t ≈ 1.78 s (10¹⁰ K/T)² (t = 1/2H, g* = 3.36) for T = 7.6 × 10⁸ K'
    inputs: {}
    formula: 1.78 * (1e10 / 7.6e8)**2
    expected: '310'
    tolerance: '5'
    shown: ['about 310 s for $T = 7.6\times10^8$ K']
    source: {cite: reading1, at: 'eq. (490), p. 111'}
    origin: page-own

  - id: half-life
    where: 'section "Neutron decay": τ ln 2 for τ = 890 s'
    inputs: {}
    formula: 890 * log(2)
    expected: '620'
    tolerance: '10'
    shown: ['the half-life is $\tau\ln2 \approx 620$ s']
    source: {cite: reading1, at: 'p. 111'}
    origin: slip

  - id: decay-factor
    where: 'worked example (b): e^(−200/890)'
    inputs: {}
    formula: exp(-200 / 890)
    expected: '0.799'
    shown: ['0.1667 \times 0.799']
    source: {cite: reading1, at: 'p. 111'}
    origin: page-own

  - id: Xn-200
    where: 'worked example (b): X_n = (1/6) e^(−200/890)'
    inputs: {}
    formula: exp(-200 / 890) / 6
    expected: '0.133'
    shown: ['= 0.133$']
    source: {cite: reading1, at: 'p. 111'}
    origin: page-own

  - id: ratio-200
    where: 'worked example (b) and eq. (491): n_n/n_p after 200 s'
    inputs: {}
    formula: (exp(-200 / 890) / 6) / (1 - exp(-200 / 890) / 6)
    expected: '0.154'
    shown: ['$n_n/n_p = 0.133/0.867 = 0.154$']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: Y-200
    where: 'worked example (b): Y = 2X_n'
    inputs: {}
    formula: 2 * exp(-200 / 890) / 6
    expected: '0.266'
    shown: ['$Y = 2X_n = 0.266$']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: page-own

  - id: Y-200-plot
    where: 'second plot caption: at 200 s, Y ≈ 0.27'
    inputs: {}
    formula: exp(-200 / 890) / 3
    expected: '0.27'
    shown: ['at 200 s, Y ≈ 0.27']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: page-own

  - id: Y-rounded
    where: 'worked example (b): eq. (493) with the rounded ratio 0.15'
    inputs: {}
    formula: 2 * 0.15 / 1.15
    expected: '0.26'
    shown: ['$2(0.15)/1.15 = 0.26$']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: page-own

  - id: Y-notes
    kind: fact
    where: 'eq. (493): Y ≈ 0.25 as quoted in the notes'
    shown: ['\approx 0.25" cite="reading1" at="eq. (493), p. 112"']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: mit

  - id: Xn-300
    where: 'worked example (c): X_n at 300 s'
    inputs: {}
    formula: exp(-300 / 890) / 6
    expected: '0.119'
    shown: ['$X_n = \tfrac16 e^{-300/890} = 0.119$']
    source: {cite: reading1, at: 'p. 112'}
    origin: page-own

  - id: Y-300
    where: 'worked example (c): Y at 300 s'
    inputs: {}
    formula: 2 * exp(-300 / 890) / 6
    expected: '0.238'
    shown: ['so $Y = 0.238$']
    source: {cite: reading1, at: 'p. 112'}
    origin: page-own

  - id: binding-energy
    kind: fact
    where: 'deuteron binding energy 2.22 MeV and m_n c² = 939.6 MeV'
    shown: ['The deuteron is held together by $2.22$ MeV', 'm_n c² = 939.6 MeV']
    source: {cite: reading1, at: 'p. 110 (binding energy); neutron mass: standard value'}
    origin: mit

  - id: eta-fiducial
    kind: fact
    where: 'eq. (489): fiducial η ∼ 5 × 10⁻¹⁰'
    shown: ['using the fiducial value $\eta \sim 5\times10^{-10}$']
    source: {cite: reading1, at: 'eq. (489), p. 111'}
    origin: mit

  - id: lithium-problem
    kind: fact
    where: 'callout "Later measurements": BBN predicts about three times more lithium-7 than seen'
    shown: ['about three times more than is seen in old stars']
    source: {ref: 'Fields, "The primordial lithium problem", Ann. Rev. Nucl. Part. Sci. 61, 47 (2011): predicted Li/H about 3 to 4 times the Spite plateau'}
    origin: later-data

  - id: neutron-lifetime-today
    kind: fact
    where: 'symbol meaning of τ: about 879 s measured today'
    shown: []
    source: {ref: 'Particle Data Group, Review of Particle Physics: neutron mean life 878.4 ± 0.5 s'}
    origin: later-data
