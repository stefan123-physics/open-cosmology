# Calculations on content/year-5/8.902/cmb-anisotropies.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Angles of the horizon and the sound horizon at recombination, the plateau and damping multipoles,
# and the figures quoted from the 8.902 Lecture 17 notes.

page: content/year-5/8.902/cmb-anisotropies.mdx
calcs:
  - id: dT-observed
    kind: fact
    where: 'section "The basic picture" and summary: observed CMB ripples'
    shown: ['observed: $\delta T/T \sim 10^{-5}$', 'are smaller than the $\sim 10^{-3}$ that baryons alone would need']
    source: {cite: reading1, at: 'p. 100'}
    origin: mit

  - id: dT-without-dm
    kind: fact
    where: 'section "The basic picture": expected ripples without dark matter'
    shown: ['$\delta T/T \sim 10^{-3}$']
    source: {cite: reading1, at: 'p. 100'}
    origin: mit

  - id: dm-factor-hundred
    where: 'section "The basic picture": 10⁻³ is about a hundred times 10⁻⁵'
    inputs: {}
    formula: 1e-3 / 1e-5
    expected: '100'
    shown: ['about a hundred times larger']
    source: {cite: reading1, at: 'p. 100'}
    origin: page-own

  - id: z-decoupling
    kind: fact
    where: 'sections "The basic picture" and "Large scales": decoupling at z ∼ 1000'
    shown: ['a snapshot of the universe at $z \sim 1000$', 'Until a redshift of about 1000']
    source: {cite: reading1, at: 'pp. 100–101'}
    origin: mit

  - id: silk-scale
    kind: fact
    where: 'section "Primary anisotropies": Silk damping below about 5 arcminutes'
    shown: ['smaller than about 5 arcminutes']
    source: {cite: reading1, at: 'p. 100'}
    origin: mit

  - id: horizon-angle-notes
    kind: fact
    where: 'section "Large scales": φ_horizon,rec ≈ 1.7° √Ω_m,0'
    shown: ['1.7^\circ\,\sqrt{\Omega_{m,0}}']
    source: {cite: reading1, at: 'eq. (463), p. 101'}
    origin: mit

  - id: plateau-ell
    where: 'section "Large scales": ℓ ≪ 180°/1.7° ≈ 100'
    inputs: {}
    formula: 180 / 1.7
    expected: '100'
    tolerance: '10'
    shown: ['180^\circ/1.7^\circ \approx 100']
    source: {cite: reading1, at: 'p. 102'}
    origin: mit

  - id: first-peak-angle
    where: 'section "Small scales": θ₁ ≈ 1.7°/√3 ∼ 1°'
    inputs: {}
    formula: 1.7 / sqrt(3)
    expected: '1'
    tolerance: '0.05'
    shown: ['\frac{1.7^\circ}{\sqrt3} \sim 1^\circ']
    source: {cite: reading1, at: 'eq. (465), p. 102'}
    origin: mit

  - id: first-peak-ell-notes
    where: 'section "Small scales": ℓ₁ ≈ 180°/1° ≈ 200 (order of magnitude, as in the notes)'
    inputs: {}
    formula: 180 / (1.7 / sqrt(3))
    expected: '200'
    tolerance: '20'
    shown: ['\sim 1^\circ, \qquad \ell_1 \approx 200']
    source: {cite: reading1, at: 'eq. (465), p. 102'}
    origin: mit

  - id: sketch-angles
    kind: fact
    where: 'section "Small scales": the notes'' sketch, first peak at 1° (ℓ ≈ 200), small peaks to 0.2° (ℓ ≈ 1000)'
    shown: ['continuing to about $0.2^\circ$ ($\ell \approx 1000$)']
    source: {cite: reading1, at: 'figure, p. 103'}
    origin: mit

  - id: sqrt-1001
    where: 'worked example, step (a): √1001'
    inputs: {}
    formula: sqrt(1001)
    expected: '31.64'
    shown: ['31.64 - 1']
    source: {cite: reading1, at: 'eq. (463), p. 101'}
    origin: page-own

  - id: eds-horizon-angle-rad
    where: 'worked example, step (a): θ = 1/(√(1+z) − 1) for z = 1000, in radians'
    inputs: {}
    formula: 1 / (sqrt(1001) - 1)
    expected: '0.0326'
    shown: ['= 0.0326$ rad']
    source: {cite: reading1, at: 'eq. (463), p. 101'}
    origin: page-own

  - id: eds-horizon-angle-deg
    where: 'worked example, step (a): the same angle in degrees'
    inputs: {}
    formula: 180 / pi / (sqrt(1001) - 1)
    expected: '1.87'
    shown: ['which is $1.87^\circ$']
    source: {cite: reading1, at: 'eq. (463), p. 101'}
    origin: page-own

  - id: eds-sound-angle
    where: 'worked example, step (b): 1.87°/√3'
    inputs: {}
    formula: 180 / pi / (sqrt(1001) - 1) / sqrt(3)
    expected: '1.08'
    shown: ['1.87^\circ/\sqrt3 = 1.08^\circ']
    source: {cite: reading1, at: 'eq. (465), p. 102'}
    origin: page-own

  - id: eds-sound-ell
    where: 'worked example, step (b): ℓ ≈ 180°/1.08° ≈ 170'
    inputs: {}
    formula: 180 / 1.08
    expected: '170'
    tolerance: '5'
    shown: ['\ell \approx 180^\circ/1.08^\circ \approx 170']
    source: {cite: reading1, at: 'eq. (465), p. 102'}
    origin: page-own

  - id: planck-first-peak
    kind: fact
    where: 'worked example step (b) and the callout "The measured spectrum": the first peak near ℓ ≈ 220, data to ℓ ≈ 2500'
    shown: ['near $\ell \approx 220$', 'measured out to $\ell \approx 2500$']
    source: {ref: 'Planck 2018 results V (A&A 641, A5, 2020), Fig. 57, reproduced in the 8.902 Lecture 18 notes, p. 104'}
    origin: later-data

  - id: arcmin-in-degrees
    where: 'worked example, step (c): 5 arcminutes in degrees'
    inputs: {}
    formula: 5 / 60
    expected: '0.083'
    shown: ['$5/60 = 0.083^\circ$']
    source: {cite: reading1, at: 'p. 100'}
    origin: page-own

  - id: silk-ell
    where: 'worked example, step (c): ℓ ≈ 180°/(5/60)°'
    inputs: {}
    formula: 180 / (5 / 60)
    expected: '2160'
    shown: ['\approx 2160']
    source: {cite: reading1, at: 'p. 100'}
    origin: page-own

  - id: plot-first-peak
    where: 'plot: the schematic spectrum at ℓ = ℓ₁ = 200 (S ≈ 0.984, damping factor e^(−1/36))'
    inputs: {}
    formula: 1 + 6 * (1 - exp(-(200 / 140)**4)) * exp(-(200 / 1200)**2)
    expected: '6.74'
    shown: []
    source: {cite: reading1, at: 'figure, p. 103'}
    origin: page-own

  - id: reionization
    kind: fact
    where: 'section "Secondary anisotropies": bracket on the notes'' reionization redshifts'
    shown: ['under way by z ∼ 10 and complete by z ∼ 6']
    source: {ref: 'Standard picture of reionization (e.g. Planck 2018 VI: midpoint z ≈ 7.7; quasar spectra: complete by z ≈ 6)'}
    origin: later-data
