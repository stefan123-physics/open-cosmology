# Calculations on content/year-5/8.902/relaxation-times.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# The encounter integral, the strong-encounter probability, the Coulomb logarithm and relaxation times
# for a galaxy and a globular cluster.

page: content/year-5/8.902/relaxation-times.mdx
calcs:
  - id: encounter-integral
    where: 'eq. (61): ∫ ds/(1 + s²)^(3/2) over all s equals 2'
    inputs: {}
    formula: integrate('1 / (1 + s**2)**1.5', 's', -1000, 1000)
    expected: '2'
    tolerance: '0.001'
    shown: ['(the last integral equals 2)']
    source: {cite: reading1, at: 'eq. (61), p. 17'}
    origin: page-own

  - id: strong-probability
    where: 'eq. (66) and quiz 2: p = 3/N for N = 10¹¹'
    inputs: {}
    formula: 3 / 1e11
    expected: '3e-11'
    shown: ['about $3\\times10^{-11}$ for $10^{11}$ stars']
    source: {cite: reading1, at: 'eq. (66), p. 17'}
    origin: page-own

  - id: coulomb-log-notes
    where: 'eq. (71): ln(10¹¹) ≈ 25'
    inputs: {}
    formula: log(1e11)
    expected: '25.3'
    shown: ['24.6 instead of 25.3']
    source: {cite: reading1, at: 'eq. (71), p. 19'}
    origin: mit

  - id: coulomb-log-2R
    where: 'bracket after eq. (71): ln(R/(2R/N)) = ln(5 × 10¹⁰)'
    inputs: {}
    formula: log(5e10)
    expected: '24.6'
    shown: ['24.6 instead of 25.3']
    source: {cite: reading1, at: 'eq. (70), p. 19'}
    origin: page-own

  - id: bmin-au
    where: 'bracket after eq. (71): 2 × 10⁻¹⁰ kpc in AU'
    inputs: {}
    formula: 2e-10 * 1000 * 206265
    expected: '0.04'
    tolerance: '0.002'
    shown: ['is about 0.04 AU rather than']
    source: {cite: reading1, at: 'eq. (70), p. 19'}
    origin: slip

  - id: ratio-galaxy
    where: 'quiz 3, plot and worked example (a): N/(6 ln N) for N = 10¹¹'
    inputs: {}
    formula: 1e11 / (6 * log(1e11))
    expected: '6.6e8'
    shown: ['10^{11}/(6 \times 25.3) = 6.6\times10^8$']
    source: {cite: reading1, at: 'eq. (74), p. 19'}
    origin: page-own

  - id: plot-galaxy
    where: 'plot point: log10 of N/(6 ln N) at N = 10¹¹'
    inputs: {}
    formula: log10(1e11 / (6 * log(1e11)))
    expected: '8.818'
    shown: []
    source: {cite: reading1, at: 'eq. (74), p. 19'}
    origin: page-own

  - id: plot-gc
    where: 'plot point: log10 of N/(6 ln N) at N = 10⁵'
    inputs: {}
    formula: log10(1e5 / (6 * log(1e5)))
    expected: '3.161'
    shown: []
    source: {cite: reading1, at: 'eq. (74), p. 19'}
    origin: page-own

  - id: crossing-galaxy-s
    where: 'worked example (a): R/v = 3.086 × 10¹⁷ km / 200 km/s'
    inputs: {}
    formula: 3.086e17 / 200
    expected: '1.5e15'
    shown: ['= 1.5\times10^{15}$ s']
    source: {cite: reading1, at: 'eq. (73), p. 19'}
    origin: page-own

  - id: crossing-galaxy-yr
    where: 'worked example (a): about 49 million years'
    inputs: {}
    formula: 3.086e17 / 200 / 3.156e7 / 1e6
    expected: '49'
    shown: ['about 49 million years']
    source: {cite: reading1, at: 'eq. (73), p. 19'}
    origin: page-own

  - id: relax-galaxy
    where: 'worked example (a): t_relax ≈ 3 × 10¹⁶ years'
    inputs: {}
    formula: 3.086e17 / 200 / 3.156e7 * 1e11 / (6 * log(1e11))
    expected: '3e16'
    shown: ['$t_\text{relax} \approx 3\times10^{16}$ years']
    source: {cite: reading1, at: 'eq. (74), p. 19'}
    origin: page-own

  - id: crossing-gc
    where: 'worked example (b): 5 pc / 10 km/s ≈ 0.49 million years'
    inputs: {}
    formula: 5 * 3.086e13 / 10 / 3.156e7 / 1e6
    expected: '0.49'
    shown: ['\approx 0.49$ million years']
    source: {cite: reading1, at: 'eq. (73), p. 19'}
    origin: page-own

  - id: ratio-gc
    where: 'worked example (b): 6 ln 10⁵ = 69 and 10⁵/69 = 1450'
    inputs: {}
    formula: 1e5 / (6 * log(1e5))
    expected: '1450'
    tolerance: '10'
    shown: ['$N/(6\ln N) = 10^5/69 = 1450$']
    source: {cite: reading1, at: 'eq. (74), p. 19'}
    origin: page-own

  - id: relax-gc
    where: 'worked example (b): t_relax ≈ 0.7 billion years'
    inputs: {}
    formula: 5 * 3.086e13 / 10 / 3.156e7 * 1e5 / (6 * log(1e5)) / 1e9
    expected: '0.7'
    shown: ['$t_\text{relax} \approx 0.7$ billion years']
    source: {cite: reading1, at: 'eq. (74), p. 19'}
    origin: page-own
