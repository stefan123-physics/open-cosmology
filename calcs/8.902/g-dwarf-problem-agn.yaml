# Calculations on content/year-5/8.902/g-dwarf-problem-agn.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Closed-box metal-poor fraction, light-travel sizes, Schwarzschild radii, the Eddington luminosity and accretion rate.

page: content/year-5/8.902/g-dwarf-problem-agn.mdx
calcs:
  - id: gdwarf-fraction
    where: 'plot caption and quiz 1: f(≤ Z☉/4) for u0 = 0.1, y = Z☉'
    inputs: {}
    formula: (1 - 0.1**(0.25 / log(10))) / (1 - 0.1)
    expected: '0.25'
    tolerance: '0.01'
    shown: ['about 25% of long-lived stars have less than a quarter of the solar metallicity']
    source: {cite: reading1, at: 'eq. (256), p. 56'}
    origin: page-own

  - id: gas-metallicity-today
    where: 'plot caption: Z0 = ln(1/u0) Z☉ = 2.3 Z☉'
    inputs: {}
    formula: log(1 / 0.1)
    expected: '2.3'
    shown: ['(2.3 Z☉ for the default gas fraction u₀ = 0.1)']
    source: {cite: reading1, at: 'eq. (253), p. 55'}
    origin: page-own

  - id: light-day-pc
    where: 'quiz 2: c × 1 day = 8 × 10⁻⁴ pc'
    inputs: {}
    formula: 86400 * 2.998e8 / 3.0857e16
    expected: '8e-4'
    tolerance: '0.5e-4'
    shown: ['$r_\\text{emission} \\lesssim c\\,\\Delta t = 8\\times10^{-4}$ pc']
    source: {cite: reading1, at: 'eq. (257), p. 58'}
    origin: page-own

  - id: rs-1e6
    where: 'eq. (259): R_s for 10⁶ M☉ ≈ 10⁻⁷ pc'
    inputs: {}
    formula: 2 * 6.674e-11 * 1e6 * 1.989e30 / 2.998e8**2 / 3.0857e16
    expected: '1e-7'
    tolerance: '0.1e-7'
    shown: []
    source: {cite: reading1, at: 'eq. (259), p. 58'}
    origin: mit

  - id: eddington-coefficient
    where: 'eq. (264): 4πcG M☉ m_p/σ_T in erg/s'
    inputs: {}
    formula: 4 * pi * 2.998e8 * 6.674e-11 * 1.989e30 * 1.6726e-27 / 6.652e-29 * 1e7
    expected: '1.3e38'
    shown: ['L_\text{Edd} = \frac{4\pi cGM_\text{BH} m_p}{\sigma_T} = 1.3\times10^{38}']
    source: {cite: reading1, at: 'eq. (264), p. 59'}
    origin: mit

  - id: one-gram-kwh
    where: 'section "Accretion": 1 g yields about 10⁶ kWh at efficiency 1/16'
    inputs: {}
    formula: 1e-3 * 2.998e8**2 / 16 / 3.6e6
    expected: '1e6'
    tolerance: '0.6e6'
    shown: ['so 1 gram of matter yields about $10^6$ kWh']
    source: {cite: reading1, at: 'p. 59'}
    origin: mit

  - id: mdot-edd-coefficient
    where: 'bracket after eq. (266): 16 L_Edd/c² per solar mass, in M☉/yr'
    inputs: {}
    formula: 16 * 4 * pi * 2.998e8 * 6.674e-11 * 1.989e30 * 1.6726e-27 / 6.652e-29 / 2.998e8**2 * 3.156e7 / 1.989e30
    expected: '3.6e-8'
    shown: ['gives $3.6\times10^{-8}\,(M_\text{BH}/M_\odot)\,M_\odot$/yr, about 70 times more']
    source: {cite: reading1, at: 'eq. (266), p. 59'}
    origin: slip

  - id: mdot-ratio
    where: 'bracket after eq. (266): 3.6e-8/5e-10 ≈ 70'
    inputs: {}
    formula: 3.55e-8 / 5e-10
    expected: '70'
    tolerance: '3'
    shown: ['about 70 times more']
    source: {cite: reading1, at: 'eq. (266), p. 59'}
    origin: slip

  - id: mdot-10pc
    where: 'bracket after eq. (266): with 10% efficiency, 2.2 × 10⁻⁸'
    inputs: {}
    formula: 4 * pi * 2.998e8 * 6.674e-11 * 1.989e30 * 1.6726e-27 / 6.652e-29 / (0.1 * 2.998e8**2) * 3.156e7 / 1.989e30
    expected: '2.2e-8'
    shown: ['with the common choice of 10% efficiency it is $2.2\times10^{-8}$']
    source: {cite: reading1, at: 'eq. (266), p. 59'}
    origin: page-own

  - id: radio-lum-check
    where: 'bracket on radio galaxies: 10¹⁸ L☉ ≈ 4 × 10⁵¹ erg/s'
    inputs: {}
    formula: 1e18 * 3.828e33
    expected: '4e51'
    tolerance: '0.3e51'
    shown: ['that is about $4\times10^{51}$ erg/s']
    source: {cite: reading1, at: 'p. 57'}
    origin: slip

  - id: quasar-ledd
    where: 'quiz 3 and worked example (a): L_Edd for 10⁸ M☉'
    inputs: {}
    formula: 1.3e38 * 1e8
    expected: '1.3e46'
    shown: ['$L_\text{Edd} = 1.3\times10^{38} \times 10^8 = 1.3\times10^{46}$ erg/s']
    source: {cite: reading1, at: 'eq. (264), p. 59'}
    origin: page-own

  - id: quasar-mdot-kg
    where: 'worked example (b): 16 L/c² in kg/s'
    inputs: {}
    formula: 16 * 1.26e39 / (3e8)**2
    expected: '2.2e23'
    shown: ['= 2.2\times10^{23}$ kg/s']
    source: {cite: reading1, at: 'eq. (260), p. 59'}
    origin: page-own

  - id: quasar-mdot-msun
    where: 'worked example (b): about 3.6 M☉ per year'
    inputs: {}
    formula: 16 * 1.26e39 / (3e8)**2 * 3.16e7 / 1.99e30
    expected: '3.6'
    shown: ['about **3.6 solar masses per year**']
    source: {cite: reading1, at: 'eq. (260), p. 59'}
    origin: page-own

  - id: o-star-power
    kind: fact
    where: 'section "How big is the engine?": 3 × 10⁸ O stars of 10^5.5 L☉; 10¹⁰ supernovae of 10⁵² erg in 10⁷ yr'
    shown: ['about $3\times10^8$ O stars', '$10^{10}$ supernovae within $10^{-3}$ pc over $10^7$ years']
    source: {cite: reading1, at: 'p. 58'}
    origin: mit

  - id: gdwarf-fraction-solar-gas
    where: 'quiz 1 explanation: with today''s gas at solar metallicity (Z0 = Z☉), about half the stars lie below Z☉/4'
    inputs: {}
    formula: (1 - 0.1**0.25) / (1 - 0.1)
    expected: '0.5'
    tolerance: '0.03'
    shown: ['about half of the stars below a quarter of solar']
    source: {cite: reading1, at: 'eq. (256), p. 56'}
    origin: page-own
