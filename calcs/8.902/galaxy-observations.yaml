# Calculations on content/year-5/8.902/galaxy-observations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# AB zero point, flux ratio of 5 magnitudes, the mass of a rotating galaxy, and a distance modulus.

page: content/year-5/8.902/galaxy-observations.mdx
calcs:
  - id: ab-zero-point
    where: 'eq. (11): −2.5 log(3.63 × 10⁻²⁰) = 48.6'
    inputs: {}
    formula: -2.5 * log10(3.63e-20)
    expected: '48.6'
    shown: ['with $-2.5\log(3.63\times10^{-20}) = 48.6$']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: five-magnitudes
    where: 'quiz 1 and section "Magnitudes": 5 magnitudes is a factor 100'
    inputs: {}
    formula: 10**(5 / 2.5)
    expected: '100'
    shown: ['5 magnitudes is a factor of 100 in flux']
    source: {cite: reading1, at: 'eq. (6), p. 5'}
    origin: page-own

  - id: ab-vega-offsets
    kind: fact
    where: 'eq. (13) and its bracket: the notes'' offsets and Blanton & Roweis (2007)'
    shown: ['$U_\text{AB} = U_\text{Vega} - 0.8$', 'give $U_\text{AB} - U_\text{Vega} \approx +0.79$ and $B_\text{AB} - B_\text{Vega} \approx -0.09$']
    source: {cite: blanton2007, at: 'Table 1'}
    origin: later-data

  - id: schechter-params
    kind: fact
    where: 'section "How many galaxies": φ* ≈ 0.02 h³ Mpc⁻³, α ≈ −1.09, L* ≈ 10¹⁰ h⁻² L☉'
    shown: ['$\phi_* \approx 0.02\,h^3$ Mpc⁻³', '$\alpha \approx -1.09$']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: schechter-point
    where: 'Schechter plot: at L = L*, log10 of e^(−1) = −0.434'
    inputs: {}
    formula: -1 / log(10)
    expected: '-0.4343'
    shown: []
    source: {cite: reading1, at: 'eq. (21), p. 10'}
    origin: page-own

  - id: velocities
    kind: fact
    where: 'rotation (200 ± 50 km/s) and elliptical dispersions (200–300 km/s, v_c 50–100 km/s)'
    shown: ['$V_c \sim 200 \pm 50$ km/s', '$\sigma_v \sim 200$–$300$ km/s']
    source: {cite: reading1, at: 'pp. 10–11'}
    origin: mit

  - id: mass-10kpc-kg
    where: 'worked example (a): M = v²r/G for 200 km/s at 10 kpc'
    inputs: {}
    formula: (2e5)**2 * 10 * 3.086e19 / 6.674e-11
    expected: '1.8e41'
    shown: ['= 1.8\times10^{41}$ kg']
    source: {cite: reading1, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: mass-10kpc-msun
    where: 'worked example (a): in solar masses'
    inputs: {}
    formula: (2e5)**2 * 10 * 3.086e19 / 6.674e-11 / 1.989e30
    expected: '9e10'
    shown: ['which is $9\times10^{10}$ solar masses']
    source: {cite: reading1, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: mass-30kpc
    where: 'worked example (b): three times as much inside 30 kpc'
    inputs: {}
    formula: 3 * (2e5)**2 * 10 * 3.086e19 / 6.674e-11 / 1.989e30
    expected: '2.8e11'
    shown: ['about $2.8\times10^{11}$ solar masses']
    source: {cite: reading1, at: 'eq. (23), p. 10'}
    origin: page-own

  - id: recession-speed
    where: 'worked example "Distance modulus": v = cz = 3 × 10⁵ × 0.005'
    inputs: {}
    formula: 3e5 * 0.005
    expected: '1500'
    shown: ['$v = cz = 3\times10^5 \times 0.005 = 1500$ km/s']
    source: {cite: reading1, at: 'eq. (26), p. 11'}
    origin: page-own

  - id: distance
    where: 'worked example: d = 1500/70'
    inputs: {}
    formula: 1500 / 70
    expected: '21.4'
    shown: ['$d = 1500/70 = 21.4$ Mpc']
    source: {cite: reading1, at: 'eq. (25), p. 11'}
    origin: page-own

  - id: distance-modulus
    where: 'worked example: μ = 5 log(2.14 × 10⁷) − 5'
    inputs: {}
    formula: 5 * log10(1500 / 70 * 1e6) - 5
    expected: '31.65'
    shown: ['$\mu = 5\log(2.14\times10^7) - 5 = 31.65$']
    source: {cite: reading1, at: 'eq. (15), p. 8'}
    origin: page-own

  - id: apparent-magnitude
    where: 'worked example: m = −21 + 31.65'
    inputs: {}
    formula: -21 + 5 * log10(1500 / 70 * 1e6) - 5
    expected: '10.65'
    shown: ['$m = M + \mu = -21 + 31.65 = 10.65$']
    source: {cite: reading1, at: 'eq. (14), p. 7'}
    origin: page-own
