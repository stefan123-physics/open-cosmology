# Calculations on content/year-5/8.902/virial-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# G in galaxy units, the virial speed of a galaxy, a cluster mass, and the quiz's kinetic energy.

page: content/year-5/8.902/virial-theorem.mdx
calcs:
  - id: G-galaxy-units
    where: 'section "How fast do stars move": G = 0.0043 M☉⁻¹ pc (km/s)²'
    inputs: {}
    formula: 6.674e-11 * 1.989e30 / 3.0857e16 / 1e6
    expected: '0.0043'
    shown: ['$G = 0.0043\,M_\odot^{-1}\,\text{pc}\,(\text{km/s})^2$. With']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: virial-speed-squared
    where: 'eq. (53): 0.0043 × 10¹¹ / 10 000'
    inputs: {}
    formula: 0.0043 * 1e11 / 1e4
    expected: '4e4'
    tolerance: '0.5e4'
    shown: ['\approx \sqrt{4\times10^4}\ \text{km/s}']
    source: {cite: reading1, at: 'eq. (53), p. 15'}
    origin: mit

  - id: virial-speed
    where: 'eq. (53) and quiz 3: v ≈ 207 km/s ≈ 200 km/s'
    inputs: {}
    formula: sqrt(0.0043 * 1e11 / 1e4)
    expected: '207'
    shown: ['\\approx 207$ km/s']
    source: {cite: reading1, at: 'eq. (53), p. 15'}
    origin: page-own

  - id: cluster-mass
    where: 'worked example: M = v²R/G for 1000 km/s and 1 Mpc'
    inputs: {}
    formula: 1000**2 * 1e6 / 0.0043
    expected: '2.3e14'
    shown: ['$M = v^2R/G = (1000)^2 \times 10^6/0.0043 = 2.3\times10^{14}M_\odot$']
    source: {cite: reading1, at: 'eq. (52), p. 15'}
    origin: page-own

  - id: quiz-kinetic
    where: 'quiz 1: T = −U/2 for U = −10⁵² J'
    inputs: {}
    formula: 1e52 / 2
    expected: '5e51'
    shown: ['$T = -U/2 = 5\\times10^{51}$ J']
    source: {cite: reading1, at: 'eq. (48), p. 14'}
    origin: page-own
