# Calculations on content/year-5/8.902/why-cold-dark-matter.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# The worked example uses the page's own rounded inputs (k = 1.38e-23 J/K, m_p = 1.67e-27 kg, G = 6.67e-11, ρ_c = 8.6e-27 kg/m³).

page: content/year-5/8.902/why-cold-dark-matter.mdx
calcs:
  - id: recombination-temperature
    where: 'worked example "The Jeans mass just after recombination", problem: T = 2.7255 K × 1101 ≈ 3000 K'
    inputs: {T0: 2.7255 K}
    formula: T0 * 1101
    expected: 3000 K
    shown: ['$T = 2.7255\ \text{K} \times 1101 \approx 3000$ K']
    source: {cite: reading1, at: 'eq. (395), p. 85'}
    origin: page-own

  - id: sound-speed
    where: 'worked example, step "Sound speed": c_s = √(kT/m_p) = 5.0 km/s'
    inputs: {k: 1.38e-23 J/K, T: 3000 K, mp: 1.67e-27 kg}
    formula: sqrt(k * T / mp)
    expected: 5.0 km/s
    shown: ['= 5.0$ km/s']
    source: {cite: reading1, at: 'eq. (395), p. 85'}
    origin: page-own

  - id: mean-density
    where: 'worked example, step "Density": ρ̄ = 0.31 ρ_c (1 + z)³'
    inputs: {rhoc: 8.6e-27 kg/m**3}
    formula: 0.31 * rhoc * 1101**3
    expected: 3.6e-18 kg/m**3
    shown: ['= 3.6 \times 10^{-18}$ kg/m³']
    source: {cite: reading1, at: 'eq. (396), p. 86'}
    origin: page-own

  - id: jeans-length-m
    where: 'worked example, step "Jeans length and mass": λ_J = c_s √(π/(Gρ̄))'
    inputs: {cs: 5.0e3 m/s, Gr: 6.67e-11 m**3/(kg*s**2), rho: 3.6e-18 kg/m**3}
    formula: cs * sqrt(pi / (Gr * rho))
    expected: 5.7e17 m
    shown: ['\approx 5.7 \times 10^{17}$ m']
    source: {cite: reading1, at: 'eq. (396), p. 86'}
    origin: page-own

  - id: jeans-length-pc
    where: 'worked example, step "Jeans length and mass": ≈ 19 pc'
    inputs: {cs: 5.0e3 m/s, Gr: 6.67e-11 m**3/(kg*s**2), rho: 3.6e-18 kg/m**3}
    formula: cs * sqrt(pi / (Gr * rho))
    expected: 19 pc
    shown: ['\approx 19$ pc']
    source: {cite: reading1, at: 'eq. (396), p. 86'}
    origin: page-own

  - id: jeans-mass
    where: 'worked example, step "Jeans length and mass": M_J = (4/3)πρ̄λ_J³ ≈ 1.4 × 10⁶ M☉'
    inputs: {cs: 5.0e3 m/s, Gr: 6.67e-11 m**3/(kg*s**2), rho: 3.6e-18 kg/m**3}
    formula: 4 / 3 * pi * rho * (cs * sqrt(pi / (Gr * rho)))**3 / M_sun
    expected: '1.4e6'
    shown: ['$M_J \approx 1.4 \times 10^6\,M_\odot$']
    source: {cite: reading1, at: 'eq. (396), p. 86'}
    origin: page-own

  - id: plot-equality
    where: 'plot caption: a_eq ≈ 1/3400, log a ≈ −3.53'
    inputs: {}
    formula: log10(1 / 3400)
    expected: '-3.53'
    shown: ['a_eq ≈ 1/3400, log a ≈ −3.53']
    source: {cite: reading2, at: 'eq. (401), p. 88'}
    origin: page-own

  - id: plot-recombination
    where: 'plot caption: a ≈ 1/1100, log a ≈ −3.04'
    inputs: {}
    formula: log10(1 / 1100)
    expected: '-3.04'
    shown: ['a ≈ 1/1100, log a ≈ −3.04']
    source: {cite: reading2, at: 'eq. (401), p. 88'}
    origin: page-own

  - id: baryon-growth
    where: 'section "Baryons alone are not enough": 10⁻⁵ × 10³ = 10⁻²'
    inputs: {d0: 1e-5, growth: 1e3}
    formula: d0 * growth
    expected: '1e-2'
    tolerance: '1e-4'
    shown: ['10^{-5} \times 10^3 = 10^{-2}']
    source: {cite: reading1, at: 'p. 86 (after eq. 396)'}
    origin: mit
