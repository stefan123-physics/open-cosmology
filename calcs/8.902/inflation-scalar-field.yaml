# Calculations on content/year-5/8.902/inflation-scalar-field.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Recombination temperature and redshift, η, the radiation fraction at recombination, the horizon angle,
# and the flatness fine-tuning estimate.

page: content/year-5/8.902/inflation-scalar-field.mdx
calcs:
  - id: ionization-energy-K
    where: 'quiz 1: 13.6 eV in kelvin, about 1.6 × 10⁵ K'
    inputs: {}
    formula: 13.6 / 8.617333e-5
    expected: '1.6e5'
    shown: ['corresponds to about $1.6\\times10^5$ K']
    source: {cite: reading1, at: 'p. 76'}
    origin: page-own

  - id: recombination-notes
    kind: fact
    where: 'section "Recombination and the CMB": T ≈ 3000 K, z_recomb ≈ 1090 (Ω_b,0 = 0.045, T0 = 2.73 K)'
    shown: ['keeps the gas ionized until $T \approx 3000$ K: recombination happens at $z_\text{recomb} \approx 1090$']
    source: {cite: reading1, at: 'p. 76'}
    origin: mit

  - id: recombination-z-check
    where: 'check: 3000 K / 2.73 K − 1 ≈ 1100, consistent with z ≈ 1090'
    inputs: {}
    formula: 3000 / 2.73 - 1
    expected: '1100'
    tolerance: '15'
    shown: []
    source: {cite: reading1, at: 'p. 76'}
    origin: page-own

  - id: eta-usual
    where: 'bracket after eq. (347): η = 2.74 × 10⁻⁸ Ω_b h² = 6.1 × 10⁻¹⁰ for Ω_b h² = 0.0224'
    inputs: {}
    formula: 2.74e-8 * 0.0224
    expected: '6.1e-10'
    shown: ['which gives $6.1\times10^{-10}$ for today''s $\Omega_{b,0}h^2 = 0.0224$']
    source: {ref: 'η = 273.9 × 10⁻¹⁰ Ω_b h² (standard relation for T_CMB = 2.7255 K; e.g. Particle Data Group, Big-Bang nucleosynthesis review)'}
    origin: later-data

  - id: radiation-fraction-rec
    where: 'bracket after eq. (352): Ω_r,0(1 + z)/Ω_m,0 at z = 1090, with Ω_r,0 = 9.2 × 10⁻⁵'
    inputs: {}
    formula: 9.2e-5 * 1091 / 0.315
    expected: '0.3'
    shown: ['9.2\times10^{-5} \times 1091/0.315 \approx 0.3']
    source: {cite: reading1, at: 'eq. (353), p. 76'}
    origin: slip

  - id: horizon-angle
    where: 'eq. (356) and quiz 2: 1/√1090 rad in degrees'
    inputs: {}
    formula: 180 / pi / sqrt(1090)
    expected: '1.7'
    shown: ['$\\varphi \\approx 1/\\sqrt{z_\\text{recomb}} = 1/\\sqrt{1090} = 0.030$ rad $\\approx 1.7°$']
    source: {cite: reading1, at: 'eq. (356), p. 77'}
    origin: mit

  - id: horizon-angle-rad
    where: 'quiz 2: 1/√1090 = 0.030 rad'
    inputs: {}
    formula: 1 / sqrt(1090)
    expected: '0.030'
    shown: []
    source: {cite: reading1, at: 'eq. (356), p. 77'}
    origin: page-own

  - id: age-seconds
    where: 'worked example: 13.8 billion years in seconds'
    inputs: {}
    formula: 13.8e9 * 3.156e7
    expected: '4.4e17'
    shown: ['13.8 billion years ($4.4\times10^{17}$ s)']
    source: {ref: 'Planck 2018 VI: age 13.79 Gyr'}
    origin: later-data

  - id: equality-seconds
    where: 'worked example: 50,000 years in seconds'
    inputs: {}
    formula: 5e4 * 3.156e7
    expected: '1.6e12'
    shown: ['about 50,000 years ($1.6\times10^{12}$ s)']
    source: {ref: 'Matter–radiation equality at about 50,000 years (Planck 2018 ΛCDM, z_eq ≈ 3400)'}
    origin: later-data

  - id: ratio-matter-era
    where: 'worked example: 1.6e12/4.4e17 = 3.6e-6'
    inputs: {}
    formula: 1.6e12 / 4.4e17
    expected: '3.6e-6'
    shown: ['(3.6\times10^{-6})^{2/3}']
    source: {cite: reading1, at: 'eq. (360), p. 77'}
    origin: page-own

  - id: factor-matter-era
    where: 'worked example: (3.6e-6)^(2/3) = 2.4e-4'
    inputs: {}
    formula: (1.6e12 / 4.4e17)**(2/3)
    expected: '2.4e-4'
    shown: ['= 2.4\times10^{-4}$.']
    source: {cite: reading1, at: 'eq. (360), p. 77'}
    origin: page-own

  - id: factor-radiation-era
    where: 'worked example: 1/1.6e12 ≈ 6e-13'
    inputs: {}
    formula: 1 / 1.6e12
    expected: '6e-13'
    tolerance: '0.5e-13'
    shown: ['falls by another $6\times10^{-13}$']
    source: {cite: reading1, at: 'eq. (360), p. 77'}
    origin: page-own

  - id: omega-at-1s
    where: 'worked example: 0.01 × 2.4e-4 × 6.25e-13 ≈ 1.5 × 10⁻¹⁸'
    inputs: {}
    formula: 0.01 * (1.6e12 / 4.4e17)**(2/3) / 1.6e12
    expected: '1.5e-18'
    tolerance: '0.05e-18'
    shown: ['\approx 1.5\times10^{-18}$ at one second']
    source: {cite: reading1, at: 'eq. (360), p. 77'}
    origin: page-own

  - id: story-redshifts
    kind: fact
    where: 'section "The story so far": z ≈ 3200, 1100, 0.33 and t ∼ 10⁻³⁴ s'
    shown: ['$z \approx 3200$: matter takes over', '$z \approx 0.33$: $\Lambda$ takes over', '$t \sim 10^{-34}$ s: inflation']
    source: {cite: reading1, at: 'p. 81'}
    origin: mit
