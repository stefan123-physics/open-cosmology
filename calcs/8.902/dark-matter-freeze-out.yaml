# Calculations on content/year-5/8.902/dark-matter-freeze-out.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Radiation era: ρc² = g*(π²/30)(kT)⁴/(ħc)³, H² = (8π/3)Gρ, t = 1/2H; comoving horizon 2ct(1 + z), 1 + z = T/2.7255 K.
# The worked example and the keV/eV timeline entries use g* = 3.36 (photons + three neutrinos); the GeV-scale
# timeline entries use g* ≈ 100 and are order-of-magnitude statements, checked as log10(t/s).

page: content/year-5/8.902/dark-matter-freeze-out.mdx
calcs:
  - id: ev-in-kelvin
    where: 'introduction: 1 eV/k_B = 1.16 × 10⁴ K'
    inputs: {E: 1 eV}
    formula: E / k_B
    expected: 1.16e4 K
    shown: ['$1\ \text{eV}/k_B = 1.16 \times 10^4$ K']
    source: {cite: reading1, at: 'p. 105'}
    origin: mit

  - id: hundred-gev-in-kelvin
    where: 'section "Equilibrium", bracket: 100 GeV corresponds to 1.2 × 10¹⁵ K'
    inputs: {E: 100 GeV}
    formula: E / k_B
    expected: 1.2e15 K
    shown: ['100 GeV corresponds to $1.2\times10^{15}$ K']
    source: {cite: reading1, at: 'p. 105'}
    origin: page-own

  - id: e12-kelvin-in-mev
    where: 'section "Equilibrium", bracket: 10¹² K is only about 86 MeV'
    inputs: {T: 1e12 K}
    formula: k_B * T
    expected: 86 MeV
    shown: ['$10^{12}$ K is only about 86 MeV']
    source: {cite: reading1, at: 'p. 105'}
    origin: page-own

  - id: hot-kt
    where: 'worked example "Free-streaming scales for three kinds of particle", step "(a) 2 eV, hot": kT = mc²/3'
    inputs: {m: 2 eV}
    formula: m / 3
    expected: 0.67 eV
    shown: ['$kT = 0.67$ eV']
    source: {cite: reading1, at: 'eq. (473), p. 107'}
    origin: page-own

  - id: hot-temperature
    where: 'worked example, step "(a)"'
    inputs: {m: 2 eV}
    formula: m / 3 / k_B
    expected: 7.7e3 K
    shown: ['$T = 7.7\times10^3$ K']
    source: {cite: reading1, at: 'eq. (473), p. 107'}
    origin: page-own

  - id: hot-time
    where: 'worked example, step "(a)": t = 1/2H with g* = 3.36'
    inputs: {E: 0.6666667 eV, g: 3.36}
    formula: 1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2))
    expected: 3.0e12 s
    shown: ['$t \approx 3.0\times10^{12}$ s']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: hot-time-myr
    where: 'worked example, step "(a)": about 0.1 Myr'
    inputs: {E: 0.6666667 eV, g: 3.36}
    formula: 1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2))
    expected: 0.1e6 yr
    shown: ['(about 0.1 Myr)']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: hot-redshift
    where: 'worked example, step "(a)": 1 + z = T/2.7255 K ≈ 2800'
    inputs: {E: 0.6666667 eV, T0: 2.7255 K}
    formula: E / k_B / T0
    expected: '2800'
    shown: ['$1 + z \approx 2800$']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: hot-horizon
    where: 'worked example, step "(a)": comoving horizon 2ct(1 + z) ≈ 160 Mpc'
    inputs: {E: 0.6666667 eV, g: 3.36, T0: 2.7255 K}
    formula: 2 * c / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) * E / k_B / T0
    expected: 160 Mpc
    shown: ['Comoving horizon $\approx 160$ Mpc']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: warm-time
    where: 'worked example, step "(b) 3 keV, warm": kT = 1 keV'
    inputs: {E: 1 keV, g: 3.36}
    formula: 1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2))
    expected: 1.3e6 s
    shown: ['$t \approx 1.3\times10^6$ s']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: warm-time-weeks
    where: 'worked example, step "(b)": about two weeks'
    inputs: {E: 1 keV, g: 3.36}
    formula: 1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2))
    expected: 2 week
    shown: ['(about two weeks)']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: warm-redshift
    where: 'worked example, step "(b)"'
    inputs: {E: 1 keV, T0: 2.7255 K}
    formula: E / k_B / T0
    expected: '4e6'
    shown: ['$1 + z \approx 4\times10^6$']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: warm-horizon
    where: 'worked example, step "(b)"'
    inputs: {E: 1 keV, g: 3.36, T0: 2.7255 K}
    formula: 2 * c / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) * E / k_B / T0
    expected: 0.1 Mpc
    shown: ['Comoving horizon $\approx 0.1$ Mpc']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: page-own

  - id: wimp-nonrelativistic
    where: 'worked example, step "(c) 100 GeV WIMP, cold": kT ~ m/3'
    inputs: {m: 100 GeV}
    formula: m / 3
    expected: 30 GeV
    shown: ['at $kT \sim 30$ GeV']
    source: {cite: reading1, at: 'eq. (473), p. 107'}
    origin: page-own

  - id: wimp-freeze-out
    where: 'worked example, step "(c)": kT ≈ m/25'
    inputs: {m: 100 GeV}
    formula: m / 25
    expected: 4 GeV
    shown: ['$kT \approx m/25 \approx 4$ GeV']
    source: {cite: reading1, at: 'p. 107'}
    origin: page-own

  - id: notes-time-2ev
    where: 'bracket after formula "Time and scale of the non-relativistic transition": a 2 eV particle turns non-relativistic at t ≈ 3 × 10¹² s'
    inputs: {E: 0.6666667 eV, g: 3.36}
    formula: 1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2))
    expected: 3e12 s
    shown: ['a 2 eV particle turns non-relativistic at $t \approx 3\times10^{12}$ s']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: slip

  - id: notes-length-3ev
    where: 'same bracket: for 3 eV, ct(1 + z) ≈ 55 Mpc'
    inputs: {E: 1 eV, g: 3.36, T0: 2.7255 K}
    formula: c / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) * E / k_B / T0
    expected: 55 Mpc
    shown: ['$ct(1 + z) \approx 55$ Mpc']
    source: {cite: reading1, at: 'eq. (476), p. 108'}
    origin: slip

  - id: timeline-planck
    where: 'timeline, bracket: with g* ≈ 100, 10¹⁹ GeV is reached at about 10⁻⁴⁵ s (order of magnitude)'
    inputs: {E: 1e19 GeV, g: 106.75, s1: 1 s}
    formula: log10(1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) / s1)
    expected: '-45'
    tolerance: '0.5'
    shown: ['would put $10^{19}$ GeV at about $10^{-45}$ s']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: timeline-wimp-100gev
    where: 'timeline, bracket: 100 GeV ↔ about 10⁻¹¹ s (g* ≈ 100)'
    inputs: {E: 100 GeV, g: 106.75, s1: 1 s}
    formula: log10(1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) / s1)
    expected: '-11'
    tolerance: '0.5'
    shown: ['10–100 GeV correspond to about $10^{-9}$–$10^{-11}$ s']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: timeline-wimp-10gev
    where: 'timeline, bracket: 10 GeV ↔ about 10⁻⁹ s (g* ≈ 100)'
    inputs: {E: 10 GeV, g: 106.75, s1: 1 s}
    formula: log10(1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) / s1)
    expected: '-9'
    tolerance: '0.5'
    shown: ['10–100 GeV correspond to about $10^{-9}$–$10^{-11}$ s']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: timeline-wimp-4gev
    where: 'timeline, bracket: 10⁻⁸ s fits kT ≈ 4 GeV (g* ≈ 100)'
    inputs: {E: 4 GeV, g: 106.75, s1: 1 s}
    formula: log10(1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) / s1)
    expected: '-8'
    tolerance: '0.5'
    shown: ['$10^{-8}$ s fits $kT \approx 4$ GeV']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: timeline-1kev
    where: 'timeline, bracket: 1 keV is reached after about two weeks (g* = 3.36)'
    inputs: {E: 1 keV, g: 3.36}
    formula: 1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2))
    expected: 2 week
    shown: ['1 keV is reached after about two weeks']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: timeline-one-day
    where: 'timeline, bracket: one day corresponds to kT ≈ 4 keV (t ∝ T⁻², so kT = 1 keV × √(t(1 keV)/1 day))'
    inputs: {E: 1 keV, g: 3.36, day1: 1 day}
    formula: E * sqrt(1 / (2 * sqrt(8 * pi / 3 * G * g * pi**2 / 30 * E**4 / (hbar * c)**3 / c**2)) / day1)
    expected: 4 keV
    shown: ['one day corresponds to $kT \approx 4$ keV']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: equality-temperature
    where: 'timeline, bracket: equality at 1 + z ≈ 3400, T ≈ 9000 K'
    inputs: {T0: 2.7255 K}
    formula: 3400 * T0
    expected: 9000 K
    shown: ['$T \approx 9000$ K']
    source: {cite: reading1, at: 'p. 108'}
    origin: later-data

  - id: equality-kt
    where: 'timeline, bracket: kT ≈ 0.8 eV at equality'
    inputs: {T0: 2.7255 K}
    formula: k_B * 3400 * T0
    expected: 0.8 eV
    shown: ['$kT \approx 0.8$ eV']
    source: {cite: reading1, at: 'p. 108'}
    origin: later-data

  - id: recombination-kt
    where: 'timeline, bracket: kT ≈ 0.26 eV at T ≈ 3000 K'
    inputs: {T: 3000 K}
    formula: k_B * T
    expected: 0.26 eV
    shown: ['$kT \approx 0.26$ eV ($T \approx 3000$ K)']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own

  - id: today-kt
    where: 'timeline: today T = 2.7 K, kT = 2.3 × 10⁻⁴ eV'
    inputs: {T: 2.7 K}
    formula: k_B * T
    expected: 2.3e-4 eV
    shown: ['$kT = 2.3\times10^{-4}$ eV']
    source: {cite: reading1, at: 'p. 108'}
    origin: page-own
