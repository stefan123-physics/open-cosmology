# Calculations on content/year-5/8.902/observational-cosmology-distances.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Redshift from the scale factor, the Einstein–de Sitter distances and the maximum of D_A,
# and the flat ΛCDM distances at z = 1 (Planck values).

page: content/year-5/8.902/observational-cosmology-distances.mdx
calcs:
  - id: quiz-z
    where: 'quiz 1: 1 + z = 1/0.5'
    inputs: {}
    formula: 1 / 0.5 - 1
    expected: '1'
    tolerance: '0.01'
    shown: ['$1 + z = a_\\text{obs}/a_\\text{em} = 1/0.5 = 2$']
    source: {cite: reading1, at: 'eq. (310), p. 70'}
    origin: page-own

  - id: eds-DA-max-z
    where: 'plot caption and quiz 4: D_A of Einstein–de Sitter peaks where √(1+z) = 3/2'
    inputs: {}
    formula: 1.5**2 - 1
    expected: '1.25'
    shown: ['peaks at z = 1.25']
    source: {cite: reading1, at: 'eq. (324), p. 73'}
    origin: page-own

  - id: eds-DA-max-value
    where: 'plot caption: the maximum, 8/27 ≈ 0.296 c/H0'
    inputs: {}
    formula: 2 / 2.25 * (1 - 1 / 1.5)
    expected: '0.296'
    shown: ['at 8/27 ≈ 0.296 c/H₀']
    source: {cite: reading1, at: 'eq. (324), p. 73'}
    origin: page-own

  - id: chi-z1
    where: 'worked example: comoving distance to z = 1 for flat ΛCDM (Ω_m = 0.315, Ω_Λ = 0.6847, Ω_r = 9.2e-5, H0 = 67.4)'
    inputs: {}
    formula: 299792.458 / 67.4 * integrate('1 / sqrt(0.315 * (1 + x)**3 + 9.2e-5 * (1 + x)**4 + 0.6847)', 'x', 0, 1)
    expected: '3400'
    tolerance: '50'
    shown: ['a comoving distance of about 3400 Mpc']
    source: {cite: reading1, at: 'eq. (335), p. 74'}
    origin: page-own

  - id: DA-z1
    where: 'worked example: D_A = 3400/2'
    inputs: {}
    formula: 3400 / 2
    expected: '1700'
    shown: ['$D_A = 3400/2 = 1700$ Mpc']
    source: {cite: reading1, at: 'eq. (318), p. 72'}
    origin: page-own

  - id: DL-z1
    where: 'worked example: D_L = 3400 × 2'
    inputs: {}
    formula: 3400 * 2
    expected: '6800'
    shown: ['$D_L = 3400 \times 2 = 6800$ Mpc']
    source: {cite: reading1, at: 'eq. (322), p. 73'}
    origin: page-own

  - id: hubble-distance
    where: 'worked example: c/H0 for H0 = 67.4'
    inputs: {}
    formula: 299792.458 / 67.4
    expected: '4450'
    tolerance: '10'
    shown: ['$c/H_0 = 4450$ Mpc']
    source: {cite: reading1, at: 'p. 74'}
    origin: page-own

  - id: angle-rad
    where: 'worked example: φ = 0.01/1700'
    inputs: {}
    formula: 0.01 / 1700
    expected: '5.9e-6'
    shown: ['$\varphi = l/D_A = 0.01/1700 = 5.9\times10^{-6}$ rad']
    source: {cite: reading1, at: 'eq. (316), p. 72'}
    origin: page-own

  - id: angle-arcsec
    where: 'worked example: about 1.2 arcseconds'
    inputs: {}
    formula: 0.01 / 1700 * 206265
    expected: '1.2'
    shown: ['about **1.2 arcseconds**']
    source: {cite: reading1, at: 'eq. (316), p. 72'}
    origin: page-own

  - id: planck-plot-values
    kind: fact
    where: 'section "The flat universe in general": the notes'' plot uses Ω_m = 0.315, H0 = 67.4'
    shown: ['for the Planck values $\Omega_m = 0.315$, $H_0 = 67.4$ km/s/Mpc']
    source: {cite: reading1, at: 'figure, p. 74'}
    origin: mit

  - id: lcdm-DA-peak
    where: 'bracket on the notes'' plot: flat ΛCDM D_A peaks near z ≈ 1.6 at about 1800 Mpc (value at z = 1.6)'
    inputs: {}
    formula: 299792.458 / 67.4 / 2.6 * integrate('1 / sqrt(0.315 * (1 + x)**3 + 9.2e-5 * (1 + x)**4 + 0.6847)', 'x', 0, 1.6)
    expected: '1800'
    tolerance: '20'
    shown: ['at about 1800 Mpc']
    source: {cite: reading1, at: 'figure, p. 74'}
    origin: slip
