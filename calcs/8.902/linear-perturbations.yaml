  - id: expanding-growth
    where: 'worked example, step "Expanding universe": 8^(2/3) = 4'
    inputs: {}
    formula: 8**(2/3)
    expected: '4'
    tolerance: '0.001'
    shown: ['8^{2/3} = 4$']
    source: {cite: reading1, at: 'eqs. (391)–(393), p. 85'}
    origin: page-own

  - id: matter-density-identity
    kind: identity
    where: 'worked example: with ρ̄ = 1/(6πGt²), 4πGρ̄ = 2/(3t²)'
    formula: 4 * pi * (1 / (6 * pi * t**2))
    equals: 2 / (3 * t**2)
    samples: {t: [0.5, 1, 3]}
    shown: ['$4\pi G\bar\rho = 4\pi G/(6\pi Gt_1^2) = 2/(3t_1^2)$']
    source: {cite: reading1, at: 'eq. (388), p. 85'}
    origin: page-own

  - id: growing-mode-matter
    kind: identity
    where: 'section "Growth without pressure": δ ∝ t^(2/3) solves δ̈ + 2Hδ̇ = 4πGρ̄δ with H = 2/(3t), 4πGρ̄ = (3/2)H² (matter era)'
    formula: deriv('x**(2/3)', 'x', t, 2) + 2 * (2 / (3 * t)) * deriv('x**(2/3)', 'x', t)
    equals: 3 / 2 * (2 / (3 * t))**2 * t**(2/3)
    samples: {t: [1e-3, 0.5, 1, 4, 1e3]}
    tolerance: 1e-5
    shown: ['with $H = 2/(3t)$ in the matter era']
    source: {cite: reading1, at: 'eqs. (389)–(393), p. 85'}
    origin: mit

  - id: decaying-mode-matter
    kind: identity
    where: 'same equation: the decaying mode δ ∝ t⁻¹ solves it too'
    formula: deriv('1 / x', 'x', t, 2) + 2 * (2 / (3 * t)) * deriv('1 / x', 'x', t)
    equals: 3 / 2 * (2 / (3 * t))**2 / t
    samples: {t: [1e-3, 0.5, 1, 4, 1e3]}
    tolerance: 1e-5
    shown: ['The $n = -1$ solutions are **decaying modes**']
    source: {cite: reading1, at: 'eqs. (389)–(393), p. 85'}
    origin: mit

  - id: growing-mode-radiation
    kind: identity
    where: 'radiation era: δ ∝ t solves δ̈ + 2Hδ̇ = (32π/3)Gρ̄δ with H = 1/(2t) and (8π/3)Gρ̄ = H², so the right side is 4H²δ'
    formula: deriv('x', 'x', t, 2) + 2 * (1 / (2 * t)) * deriv('x', 'x', t)
    equals: 4 * (1 / (2 * t))**2 * t
    samples: {t: [1e-3, 0.5, 1, 4, 1e3]}
    tolerance: 1e-5
    shown: ['$H = 1/(2t)$ in the radiation era']
    source: {cite: reading1, at: 'eqs. (389)–(393), p. 85'}
    origin: mit
