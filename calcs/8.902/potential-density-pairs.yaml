# Calculations on content/year-5/8.902/potential-density-pairs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Oscillation through a uniform sphere, the Mestel disc surface density, and the NFW profile at r = a.

page: content/year-5/8.902/potential-density-pairs.mdx
calcs:
  - id: omega-squared
    where: 'worked example "Falling through a uniform sphere": ω² = 4πGρ/3 for ρ = 0.1 M☉/pc³'
    inputs: {}
    formula: 4 * pi * 0.0043 * 0.1 / 3
    expected: '1.80e-3'
    shown: ['= 1.80\times10^{-3}$ (km/s/pc)²']
    source: {cite: reading1, at: 'eq. (87), p. 23'}
    origin: page-own

  - id: omega
    where: 'worked example: ω = 0.0424 km/s per pc'
    inputs: {}
    formula: sqrt(4 * pi * 0.0043 * 0.1 / 3)
    expected: '0.0424'
    shown: ['$\omega = 0.0424$ km/s per pc']
    source: {cite: reading1, at: 'eq. (87), p. 23'}
    origin: page-own

  - id: period-units
    where: 'worked example: P = 2π/ω = 148 pc/(km/s)'
    inputs: {}
    formula: 2 * pi / sqrt(4 * pi * 0.0043 * 0.1 / 3)
    expected: '148'
    shown: ['$P = 2\pi/\omega = 148$ pc/(km/s)']
    source: {cite: reading1, at: 'eq. (87), p. 23'}
    origin: page-own

  - id: pc-per-kms
    where: 'worked example: 1 pc/(km/s) = 0.978 million years'
    inputs: {}
    formula: 3.0857e13 / 3.156e7 / 1e6
    expected: '0.978'
    shown: ['(1 pc/(km/s) is 0.978 million years)']
    source: {cite: reading1, at: 'p. 23 (the unit conversion itself is the page''s own)'}
    origin: page-own

  - id: period-myr
    where: 'worked example: about 145 million years'
    inputs: {}
    formula: 2 * pi / sqrt(4 * pi * 0.0043 * 0.1 / 3) * 0.9777
    expected: '145'
    shown: ['\approx 145$ million years']
    source: {cite: reading1, at: 'eq. (87), p. 23'}
    origin: page-own

  - id: mestel-denominator
    where: 'worked example "How dense is a Mestel disc?": 2π × 0.0043 × 8000'
    inputs: {}
    formula: 2 * pi * 0.0043 * 8000
    expected: '216'
    shown: ['\frac{40\,000}{216}']
    source: {cite: reading1, at: 'eq. (98), p. 25'}
    origin: page-own

  - id: mestel-sigma
    where: 'worked example: Σ = v_c²/(2πGr) for 200 km/s at 8 kpc'
    inputs: {}
    formula: 200**2 / (2 * pi * 0.0043 * 8000)
    expected: '185'
    shown: ['\approx 185\,M_\odot$/pc²']
    source: {cite: reading1, at: 'eq. (98), p. 25'}
    origin: page-own

  - id: nfw-at-a
    where: 'plot: log10(ρ/ρ0) at r = a is log10(1/4)'
    inputs: {}
    formula: log10(1 / 4)
    expected: '-0.602'
    shown: []
    source: {cite: reading1, at: 'eq. (99), p. 25'}
    origin: page-own

  - id: nfw-slope-at-a
    where: 'plot caption and quiz 3: the local slope −1 − 2x/(1 + x) at x = 1'
    inputs: {}
    formula: -1 - 2 * 1 / (1 + 1)
    expected: '-2'
    tolerance: '1e-9'
    shown: ['the local slope is exactly −2']
    source: {cite: reading1, at: 'eq. (99), p. 25'}
    origin: page-own
