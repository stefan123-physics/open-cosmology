  - id: p1d-kappa
    kind: identity
    answer: p1d-kappa
    where: 'Problem 1(d), formula box: sqrt(−4B(A − B)) equals the notes'' κ² = R dΩ²/dR + 4Ω² (eq. 151) for a power-law rotation curve (samples: A and B computed from the sheet''s definitions for v_c = v0 (R/R0)^pw, to 12 digits)'
    formula: sqrt(-4 * B * (A - B))
    equals: sqrt(R0 * deriv('(v0 * (x / R0)**pw / x)**2', 'x', R0) + 4 * (v0 / R0)**2)
    samples:
      A: [9.05882352941, 14.44375, 22.5, 1.25]
      B: [-16.8235294118, -14.44375, -7.5, -23.75]
      v0: [220, 231.1, 150, 300]
      R0: [8.5, 8, 5, 12]
      pw: [0.3, 0, -0.5, 0.9]
    tolerance: 1e-6
    shown: ['\kappa^2 = -4B\left(A - B\right)']
    source: {cite: reading1, at: 'eqs. (151) and (157), pp. 35 and 36'}
    origin: page-own

  - id: p1d-kappa-sq
