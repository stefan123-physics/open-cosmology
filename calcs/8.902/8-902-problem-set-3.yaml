# Calculations on content/year-5/8.902/8-902-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set. Problem 1 uses the sheet's Oort constants (A = 14.82, B = −12.37 km/s/kpc)
# and R0 = 8.5 kpc; times use 977.8 Myr per kpc/(km/s). Formula boxes are checked against independent routes:
# the rotation curve v_c = v0 (R/R0)^pw with derivatives taken numerically (deriv), the notes' eq. (151) for κ²,
# the exact relative velocities of Problem 1(a) differentiated in d at d = 0, and the free-fall integral done
# numerically (integrate). Variable names have more than one letter so none is read as a unit.

page: content/year-5/8.902/8-902-problem-set-3.mdx
calcs:
  - id: intro-points
    kind: fact
    where: 'How to answer: our split of the points (the sheet gives none); 70 + 30 = 100, parts 20 + 15 + 10 + 15 + 10 = 70 and 15 + 10 + 5 = 30'
    shown: ['Problem 1 has 70 and Problem 2 has 30']
    source: {cite: mit, at: 'Problem Set 3 (our own points)'}
    origin: page-own

  - id: sheet-values
    kind: fact
    where: 'Problem 1: the sheet''s Oort constants with their errors, said to come from Hipparcos, and R0 = 8.5 kpc; Hipparcos flew from 1989 to 1993'
    shown:
      - 'A = 14.82 \pm 0.84\ \text{km/s/kpc}, \qquad B = -12.37 \pm 0.64\ \text{km/s/kpc}'
      - 'and asks you to take $R_0 = 8.5$ kpc'
      - 'the Hipparcos satellite (a mission of 1989 to 1993)'
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: kpc-per-kms
    where: 'Problem 1, before part (b): 1 kpc/(km/s) in millions of years (our choice of constants)'
    inputs: {}
    formula: 3.0857e16 / (365.25 * 86400) / 1e6
    expected: '977.8'
    shown: ['1 kpc/(km/s) = 977.8 million years (with 1 kpc = 3.0857 × 10¹⁶ km and a year of 365.25 days; our choice)']
    source: {cite: mit, at: 'Problem 1 (our own computation)'}
    origin: page-own

  - id: p1a-flat
    kind: identity
    answer: p1a-flat
    where: 'Problem 1(a), answer box: A for a flat rotation curve, against A = −½ R0 dΩ/dR with Ω = v0/R differentiated numerically'
    formula: v0 / (2 * R0)
    equals: -0.5 * R0 * deriv('v0 / x', 'x', R0)
    samples:
      v0: [150, 300, 220, 231.1]
      R0: [5, 12, 8.5, 7.3]
    tolerance: 1e-6
    shown: ['so $A = v_0/(2R_0)$ and $B = -v_0/(2R_0)$']
    source: {cite: mit, at: 'Problem 1(A), p. 1 (our own solution)'}
    origin: page-own

  - id: p1a-vr-first-order
    kind: identity
    where: 'Problem 1(a), solution: d(v_r)/dd at d = 0 from the exact v_r = (Ω − Ω0) R0 sin l, for v_c = v0 (R/R0)^pw, equals A sin 2l with A = ½(v0/R0 − dv_c/dR)'
    formula: deriv('(v0 * (sqrt(R0**2 + x**2 - 2*R0*x*cos(ell)) / R0)**pw / sqrt(R0**2 + x**2 - 2*R0*x*cos(ell)) - v0 / R0) * R0 * sin(ell)', 'x', 0)
    equals: 0.5 * (v0 / R0 - pw * v0 / R0) * sin(2 * ell)
    samples:
      v0: [220, 231.1, 150, 300]
      R0: [8.5, 8, 5, 12]
      pw: [0.3, 0, -0.5, 1]
      ell: [0.3, 1.2, 2.5, 4.0]
    tolerance: 1e-5
    shown: ['v_r = \left(\Omega - \Omega_0\right)R_0\sin l, \qquad v_T = \left(\Omega - \Omega_0\right)R_0\cos l - \Omega\,d']
    source: {cite: mit, at: 'Problem 1(A), p. 1 (our own solution)'}
    origin: page-own

  - id: p1a-vt-first-order
    kind: identity
    where: 'Problem 1(a), solution: d(v_T)/dd at d = 0 from the exact v_T = (Ω − Ω0) R0 cos l − Ω d equals A cos 2l + B, B = −½(v0/R0 + dv_c/dR)'
    formula: deriv('(v0 * (sqrt(R0**2 + x**2 - 2*R0*x*cos(ell)) / R0)**pw / sqrt(R0**2 + x**2 - 2*R0*x*cos(ell)) - v0 / R0) * R0 * cos(ell) - v0 * (sqrt(R0**2 + x**2 - 2*R0*x*cos(ell)) / R0)**pw / sqrt(R0**2 + x**2 - 2*R0*x*cos(ell)) * x', 'x', 0)
    equals: 0.5 * (v0 / R0 - pw * v0 / R0) * cos(2 * ell) - 0.5 * (v0 / R0 + pw * v0 / R0)
    samples:
      v0: [220, 231.1, 150, 300]
      R0: [8.5, 8, 5, 12]
      pw: [0.3, 0, -0.5, 1]
      ell: [0.3, 1.2, 2.5, 4.0]
    tolerance: 1e-5
    shown: ['v_r = A\,d\sin 2l, \qquad v_T = d\left(A\cos 2l + B\right)']
    source: {cite: mit, at: 'Problem 1(A), p. 1'}
    origin: page-own

  - id: p1b-v0
    kind: identity
    answer: p1b-v0
    where: 'Problem 1(b), formula box v0 = R0 (A − B): with A and B built from a power-law rotation curve, R0 (A − B) gives back v0 (samples: A and B computed from the sheet''s definitions for v_c = v0 (R/R0)^pw, to 12 digits)'
    formula: R0 * (A - B)
    equals: v0
    samples:
      A: [9.05882352941, 14.44375, 22.5, 1.25]
      B: [-16.8235294118, -14.44375, -7.5, -23.75]
      v0: [220, 231.1, 150, 300]
      R0: [8.5, 8, 5, 12]
      pw: [0.3, 0, -0.5, 0.9]
    tolerance: 1e-6
    shown: ['v_0 = R_0\left(A - B\right), \qquad P = \frac{2\pi R_0}{v_0} = \frac{2\pi}{A - B}']
    source: {cite: mit, at: 'Problem 1(B), p. 1 (our own solution)'}
    origin: page-own

