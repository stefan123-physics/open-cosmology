# Calculations on content/year-5/8.902/orbits-and-epicycles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Epicycle frequency for a flat rotation curve, the Oort-constant example at the Sun, Mercury's precession
# with the toy correction, and the Tully–Fisher scaling.

page: content/year-5/8.902/orbits-and-epicycles.mdx
calcs:
  - id: flat-kappa
    where: 'quiz 2 and section on κ: flat rotation curve, κ = √2 Ω'
    inputs: {}
    formula: sqrt(-2 + 4)
    expected: '1.41'
    shown: ['close to the $\sqrt2 = 1.41$ of a flat rotation curve']
    source: {cite: reading1, at: 'eq. (151), p. 35'}
    origin: page-own

  - id: oort-values
    kind: fact
    where: 'worked example "Epicycles at the Sun": A = 15.3, B = −11.9 km/s/kpc'
    shown: ['$A = 15.3$ km/s/kpc and $B = -11.9$ km/s/kpc (Bovy 2017)']
    source: {cite: bovy2017, at: 'abstract'}
    origin: later-data

  - id: omega-sun
    where: 'worked example: Ω = A − B'
    inputs: {}
    formula: 15.3 - (-11.9)
    expected: '27.2'
    shown: ['$\Omega = A - B = 27.2$ km/s/kpc']
    source: {cite: reading1, at: 'eq. (156), p. 36'}
    origin: page-own

  - id: kappa-squared
    where: 'worked example and quiz 3: −4B(A − B)'
    inputs: {}
    formula: -4 * (-11.9) * 27.2
    expected: '1295'
    shown: ['\sqrt{1295} = 36.0$ km/s/kpc']
    source: {cite: reading1, at: 'eq. (157), p. 36'}
    origin: page-own

  - id: kappa-sun
    where: 'worked example and quiz 3: κ ≈ 36 km/s/kpc'
    inputs: {}
    formula: sqrt(-4 * (-11.9) * 27.2)
    expected: '36.0'
    shown: ['\sqrt{1295} = 36.0$ km/s/kpc']
    source: {cite: reading1, at: 'eq. (157), p. 36'}
    origin: page-own

  - id: kappa-over-omega
    where: 'worked example: κ/Ω = 1.32'
    inputs: {}
    formula: sqrt(-4 * (-11.9) * 27.2) / 27.2
    expected: '1.32'
    shown: ['so $\kappa/\Omega = 1.32$']
    source: {cite: reading1, at: 'eq. (157), p. 36'}
    origin: page-own

  - id: orbit-period
    where: 'worked example: 2π/Ω = 0.231 kpc/(km/s) = 226 Myr'
    inputs: {}
    formula: 2 * pi / 27.2 * 977.8
    expected: '226'
    shown: ['$2\pi/\Omega = 0.231$ kpc/(km/s) $= 226$ million years']
    source: {cite: reading1, at: 'eq. (150), p. 34'}
    origin: page-own

  - id: epicycle-period
    where: 'worked example: 2π/κ = 0.175 kpc/(km/s) = 171 Myr'
    inputs: {}
    formula: 2 * pi / sqrt(-4 * (-11.9) * 27.2) * 977.8
    expected: '171'
    shown: ['$2\pi/\kappa = 0.175$ kpc/(km/s) $= 171$ million years']
    source: {cite: reading1, at: 'eq. (152), p. 35'}
    origin: page-own

  - id: kpc-per-kms
    where: 'worked example: 1 kpc/(km/s) = 977.8 Myr'
    inputs: {}
    formula: 3.0857e16 / 3.15576e13
    expected: '977.8'
    shown: ['(1 kpc/(km/s) is 977.8 million years)']
    source: {cite: reading1, at: 'p. 36 (the unit conversion itself is the page''s own)'}
    origin: page-own

  - id: mercury-toy
    where: 'bracket after eq. (124): the toy correction gives about 29″ per century for Mercury'
    inputs: {GMsun: 1.32712e20, clight: 2.99792458e8, sma: 5.7909e10, ecc: 0.2056}
    formula: 2 * pi * (1 / sqrt(1 - 4 * GMsun / (clight**2 * sma * (1 - ecc**2))) - 1) * 206265 * 36525 / 87.969
    expected: '29'
    tolerance: '0.6'
    shown: ['about 29 arcseconds per century instead of the observed anomalous 43']
    source: {cite: reading1, at: 'eq. (122), p. 30'}
    origin: page-own

  - id: mercury-gr
    where: 'bracket after eq. (124): general relativity gives 43″ per century'
    inputs: {GMsun: 1.32712e20, clight: 2.99792458e8, sma: 5.7909e10, ecc: 0.2056}
    formula: 6 * pi * GMsun / (clight**2 * sma * (1 - ecc**2)) * 206265 * 36525 / 87.969
    expected: '43'
    tolerance: '0.6'
    shown: ['about 29 arcseconds per century instead of the observed anomalous 43']
    source: {ref: 'General relativity: Δψ = 6πGM/(c²a(1 − e²)) per orbit; observed anomalous precession of Mercury 43″ per century'}
    origin: later-data

  - id: tully-fisher-ratio
    where: 'quiz 4: 1.5⁴'
    inputs: {}
    formula: 1.5**4
    expected: '5.06'
    shown: ['$1.5^4 = 5.06$']
    source: {cite: reading1, at: 'eq. (162), p. 37'}
    origin: page-own

  - id: tf-constant
    kind: fact
    where: 'section "Luminosity and velocity": constant roughly L*/(220 km/s)⁴'
    shown: ['roughly $L_*/(220\ \text{km/s})^4$']
    source: {cite: reading1, at: 'p. 37'}
    origin: mit
