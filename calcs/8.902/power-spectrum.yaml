# Calculations on content/year-5/8.902/power-spectrum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Galaxy correlation function ξ = (r/5 h⁻¹ Mpc)^(−1.8).

page: content/year-5/8.902/power-spectrum.mdx
calcs:
  - id: xi-2mpc
    where: 'worked example "Reading the correlation function", step (a): ξ(2 h⁻¹ Mpc) = 0.4^(−1.8)'
    inputs: {}
    formula: 0.4**(-1.8)
    expected: '5.2'
    shown: ['$\xi = (0.4)^{-1.8} = 5.2$']
    source: {cite: reading1, at: 'eq. (409), p. 90'}
    origin: page-own

  - id: pair-excess-2mpc
    where: 'worked example, step (a): 1 + ξ'
    inputs: {}
    formula: 1 + 0.4**(-1.8)
    expected: '6.2'
    shown: ['$1 + \xi = 6.2$ times the random rate']
    source: {cite: reading1, at: 'eq. (409), p. 90'}
    origin: page-own

  - id: xi-20mpc
    where: 'worked example, step (a): ξ(20 h⁻¹ Mpc) = 4^(−1.8), 8% above random'
    inputs: {}
    formula: 4**(-1.8)
    expected: '0.082'
    shown: ['$\xi = 4^{-1.8} = 0.082$, only 8% above random']
    source: {cite: reading1, at: 'eq. (409), p. 90'}
    origin: page-own

  - id: twenty-power
    where: 'worked example, step (b): 20^(1/1.8)'
    inputs: {}
    formula: 20**(1 / 1.8)
    expected: '5.28'
    shown: ['5 \times 20^{1/1.8} = 5 \times 5.28']
    source: {cite: reading1, at: 'eq. (409), p. 90'}
    origin: page-own

  - id: cluster-r0
    where: 'worked example, step (b): r0 for clusters'
    inputs: {}
    formula: 5 * 20**(1 / 1.8)
    expected: '26'
    shown: ['\approx 26\,h^{-1}$ Mpc']
    source: {cite: reading1, at: 'eq. (409), p. 90'}
    origin: page-own

  - id: sigma-mass-scaling
    where: 'section "Fluctuations on a mass scale": for n = 1, 1000 times the mass gives fluctuations 100 times smaller (σ ∝ M^(−2/3))'
    inputs: {}
    formula: 1000**(2/3)
    expected: '100'
    tolerance: '0.01'
    shown: ['1000 times more mass has fluctuations 100 times smaller']
    source: {cite: reading1, at: 'eqs. (411)–(412), p. 90'}
    origin: page-own

  - id: spectrum-peak
    where: 'plot caption: P = k/(1 + (kL0)²)² peaks at kL0 = 1/√3 ≈ 0.58 (where the slope is zero)'
    inputs: {}
    formula: solve('1 / q - 4 * q / (1 + q**2)', 'q', 0.1, 1)
    expected: '0.58'
    shown: ['peaks at kL₀ = 1/√3 ≈ 0.58']
    source: {cite: reading2, at: 'eq. (422), p. 92'}
    origin: page-own
