# Calculations on content/year-5/8.902/8-902-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set. The data are our own (generated with NumPy, recorded as facts); every
# answer is recomputed here from the numbers printed in the page's tables: the sky levels as means, the fits as
# explicit least-squares sums, the centroids as weighted sums, and the Gaussian of Problem 3(a) by checking that
# its depth, centre and width each minimise the sum of squares with the other two held at the fitted values.
# Long formulas are generated by a script from the tables; DN, arcsec and magnitudes are dimensionless here.

page: content/year-5/8.902/8-902-problem-set-1.mdx
calcs:
- id: intro-mit-values
  kind: fact
  where: 'Introduction and Problem 1: the sheet''s constants kept on the page: the camera scale 0.394 arcsec per pixel, the 8545 Å it gives for Ca II, its 95 km/s control width, H0 = 71 km/s/Mpc, the 90% of the Sun''s light in the band, the rest wavelength 6563 Å of Hα'
  shown:
  - 'the strongest line of the Ca II triplet, the one meant, lies at 8542 Å'
  - '(MIT''s sheet has 95 km/s for its own spectrograph)'
  - a camera with a scale of 0.394 arcseconds per pixel
  - with $H_0 = 71$ km/s/Mpc as on the sheet
  - with rest wavelength 6563 Å
  source:
    cite: mit
    at: 'Problem Set 1, pp. 1 to 3'
  origin: mit
- id: intro-points
  kind: fact
  where: 'How to answer: our split of the points (the sheet gives none); 40 + 35 + 25 = 100'
  shown:
  - 'Problem 1 has 40, Problem 2 has 35 and Problem 3 has 25'
  source:
    cite: mit
    at: Problem Set 1 (our own points)
  origin: page-own
- id: p1-table
  kind: fact
  where: 'Problem 1, table: our own generated images (Python, NumPy default_rng seed 8902): 410 × 410 pixels of 0.394 arcsec, centre on pixel (205, 205); Galaxy 1 = de Vaucouleurs law with r_e = 10.0 arcsec and 31.0 DN at r_e; Galaxy 2 = exponential disc I0 = 230 DN, r_s = 9.0 arcsec plus a de Vaucouleurs bulge r_e = 2.0 arcsec, 80 DN at r_e; sky 120.0 DN; Gaussian noise of standard deviation sqrt(sky + model) per pixel, models evaluated at pixel centres. Each row is the number of pixels with r in [lo, lo + 2) arcsec and the median of their counts, rounded to 0.1 DN'
  shown:
  - '| 0 to 2 | 81 | 729.4 | 473.4 |'
  - '| 10 to 12 | 892 | 146.2 | 188.0 |'
  - '| 28 to 30 | 2336 | 123.0 | 129.3 |'
  - '| 60 to 62 | 4924 | 120.2 | 120.0 |'
  - '| 70 to 72 | 5732 | 120.3 | 120.1 |'
  - '| 78 to 80 | 6448 | 120.0 | 120.2 |'
  source:
    cite: mit
    at: Problem 1 (our own computation)
  origin: page-own
- id: p1e-made
  kind: fact
  where: 'Problem 1(e), solution: the parameters of our generated galaxies (as in p1-table)'
  shown:
  - Galaxy 1 is a pure de Vaucouleurs law with $r_e = 10.0$ arcseconds and 31.0 DN per pixel at $r_e$
  - exponential disc with $I_0 = 230$ DN per pixel and $r_s = 9.0$ arcseconds
  - bulge with $r_e = 2.0$ arcseconds and 80 DN per pixel at its $r_e$
  - Both sit on a sky of 120.0 DN per pixel
  source:
    cite: mit
    at: Problem 1(E) (our own computation)
  origin: page-own
- id: p1a-s1
  answer: p1a-s1
  where: 'Problem 1(a), answer box: the sky of Galaxy 1, mean of its three outermost rings'
  formula: ((120.2 + 120.3 + 120.0)/3)
  expected: '120.17'
  shown:
  - 'id="p1a-s1"'
  - $(120.2 + 120.3 + 120.0)/3 = 120.17$
  source:
    cite: mit
    at: 'Problem 1(A), p. 1 (our own rule)'
  origin: page-own
- id: p1a-s2
  answer: p1a-s2
  where: 'Problem 1(a), answer box: the sky of Galaxy 2'
  formula: ((120.0 + 120.1 + 120.2)/3)
  expected: '120.10'
  shown:
  - 'id="p1a-s2"'
  - $(120.0 + 120.1 + 120.2)/3 = 120.10$
  source:
    cite: mit
    at: 'Problem 1(A), p. 1 (our own rule)'
  origin: page-own
- id: p1a-outer
  where: 'Problem 1(a), solution: the light of Galaxy 1 in the bin 28 to 30 arcsec above the sky'
  formula: 123.0 - ((120.2 + 120.3 + 120.0)/3)
  expected: '3'
  tolerance: '0.5'
  shown:
  - the galaxy adds only about 3 DN to a sky of 120 DN
  source:
    cite: mit
    at: Problem 1(A) (our own solution)
  origin: page-own
- id: p1a-third
  where: 'Problem 1(a), solution: an error of 1 DN in S compared with the 2.83 DN of galaxy light there'
  formula: 1/(123.0 - ((120.2 + 120.3 + 120.0)/3))
  expected: '0.35'
  tolerance: '0.03'
  shown:
  - changes the light of the galaxy by a third
  source:
    cite: mit
    at: Problem 1(A) (our own solution)
  origin: page-own
- id: p1b-npix
  answer: p1b-npix
  where: 'Problem 1(b), answer box: pixels in the ring 10 to 12 arcsec, area over pixel area'
  formula: 'pi*(12**2 - 10**2)/0.394**2'
  expected: '890'
  shown:
  - 'id="p1b-npix"'
  - '\frac{\pi(144 - 100)}{0.1552} \approx 890'
  source:
    cite: mit
    at: 'Problem 1(B), p. 2 (our own addition)'
  origin: page-own
- id: p1b-pixarea
  where: 'Problem 1(b), solution: the area of one pixel in square arcseconds'
  formula: '0.394**2'
  expected: '0.1552'
  shown:
  - '(0.394'''')^2} = '
  source:
    cite: mit
    at: 'Problem 1(B), p. 2'
  origin: page-own
- id: p1b-noise
  where: 'Problem 1(b), check: the noise of one pixel, the square root of the 120 counts of sky'
  formula: sqrt(120)
  expected: '11'
  tolerance: '0.5'
  shown:
  - a single pixel scatters by about 11 DN
  source:
    cite: mit
    at: Problem 1(B) (our own solution)
  origin: page-own
- id: p1c-mu1
