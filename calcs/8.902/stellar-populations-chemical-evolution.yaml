# Calculations on content/year-5/8.902/stellar-populations-chemical-evolution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Lifetimes, Salpeter fractions, and the closed-box metallicities.

page: content/year-5/8.902/stellar-populations-chemical-evolution.mdx
calcs:
  - id: sfr-calibrations
    kind: fact
    where: 'eqs. (219)–(221): SFR calibrations and the Milky Way SFR of about 3 M☉/yr'
    shown: ['the Milky Way forms about $3\,M_\odot$/yr']
    source: {cite: reading1, at: 'p. 48'}
    origin: mit

  - id: lifetime-10
    where: 'worked example (a): 10¹⁰ × 10⁻³ years for 10 M☉'
    inputs: {}
    formula: 1e10 * 10**-3
    expected: '1e7'
    shown: ['$10^{10} \times 10^{-3} = 10^7$ years']
    source: {cite: reading1, at: 'eq. (227), p. 51'}
    origin: page-own

  - id: lifetime-quiz
    where: 'quiz 1: a 10 M☉ star lives about a thousand times shorter'
    inputs: {}
    formula: 10**3
    expected: '1000'
    shown: ['lives about a thousand times shorter than the Sun']
    source: {cite: reading1, at: 'eq. (229), p. 51'}
    origin: page-own

  - id: salpeter-number-above-8
    where: 'worked example (b) and quiz 2: number fraction above 8 M☉ for a Salpeter IMF from 0.1 to 100'
    inputs: {}
    formula: integrate('m**-2.35', 'm', 8, 100) / integrate('m**-2.35', 'm', 0.1, 100)
    expected: '0.003'
    tolerance: '0.0005'
    shown: ['about 0.3% of the stars, but 14% of the mass, are above 8 $M_\odot$']
    source: {cite: reading1, at: 'eq. (225), p. 50'}
    origin: page-own

  - id: salpeter-mass-above-8
    where: 'worked example (b) and quiz 2: mass fraction above 8 M☉'
    inputs: {}
    formula: integrate('m**-1.35', 'm', 8, 100) / integrate('m**-1.35', 'm', 0.1, 100)
    expected: '0.14'
    shown: ['about 0.3% of the stars, but 14% of the mass, are above 8 $M_\odot$']
    source: {cite: reading1, at: 'eq. (225), p. 50'}
    origin: page-own

  - id: imf-limits
    kind: fact
    where: 'IMF limits 0.08 and 100 M☉, Z☉ ≈ 0.02, x = 1.35'
    shown: ['$m_l \approx 0.08\,M_\odot$', 'x = 1.35" cite="reading1" at="eq. (225)']
    source: {cite: reading1, at: 'pp. 50, 52'}
    origin: mit

  - id: ln10
    where: 'quiz 3, plot and worked example: ln 10 = 2.303'
    inputs: {}
    formula: log(10)
    expected: '2.303'
    shown: ['$Z = y\ln(1/u) = 0.02 \times 2.303 = 0.046$']
    source: {cite: reading1, at: 'eq. (253), p. 55'}
    origin: page-own

  - id: closed-box-gas
    where: 'worked example: Z = 0.02 ln 10'
    inputs: {}
    formula: 0.02 * log(10)
    expected: '0.046'
    shown: ['= 0.046$, about 2.3 times solar']
    source: {cite: reading1, at: 'eq. (253), p. 55'}
    origin: page-own

  - id: closed-box-ratio
    where: 'worked example: u/(1 − u) = 0.111'
    inputs: {}
    formula: 0.1 / 0.9
    expected: '0.111'
    shown: ['0.046 \times 0.111']
    source: {cite: reading1, at: 'eq. (253), p. 55'}
    origin: page-own

  - id: closed-box-stars
    where: 'worked example and plot caption: Z_s = y − Z u/(1 − u) = 0.0149 (0.74 y)'
    inputs: {}
    formula: 0.02 - 0.02 * log(10) * 0.1 / 0.9
    expected: '0.0149'
    shown: ['= 0.0149$, about 0.74 times solar', 'the stars 0.74y']
    source: {cite: reading1, at: 'eq. (253), p. 55'}
    origin: page-own
