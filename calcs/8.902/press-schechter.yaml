# Calculations on content/year-5/8.902/press-schechter.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Collapsed fraction with the factor 2: F = erfc(ν/√2), ν = δ_c/(σD).

page: content/year-5/8.902/press-schechter.mdx
calcs:
  - id: nu-today
    where: 'worked example "Massive clusters are rare, and rarer in the past", step "Today"'
    inputs: {dc: 1.686, sigma: 0.5}
    formula: dc / sigma
    expected: '3.37'
    shown: ['$\nu = 1.686/0.5 = 3.37$']
    source: {cite: reading1, at: 'eq. (452), p. 97'}
    origin: page-own

  - id: erfc-argument-today
    where: 'worked example, step "Today": ν/√2'
    inputs: {dc: 1.686, sigma: 0.5}
    formula: dc / sigma / sqrt(2)
    expected: '2.38'
    shown: ['\text{erfc}(2.38)']
    source: {cite: reading1, at: 'eq. (452), p. 97'}
    origin: page-own

  - id: fraction-today
    where: 'worked example, step "Today": F = erfc(ν/√2) ≈ 7.5 × 10⁻⁴, less than 0.1%'
    inputs: {dc: 1.686, sigma: 0.5}
    formula: erfc(dc / sigma / sqrt(2))
    expected: '7.5e-4'
    shown: ['\approx 7.5\times10^{-4}$: less than 0.1%']
    source: {cite: reading1, at: 'eqs. (452), (458), p. 97'}
    origin: page-own

  - id: nu-z1
    where: 'worked example, step "At z = 1": D = 1/2'
    inputs: {dc: 1.686, sigma: 0.5, D: 0.5}
    formula: dc / (sigma * D)
    expected: '6.74'
    shown: ['$\nu = 6.74$']
    source: {cite: reading1, at: 'eq. (452), p. 97'}
    origin: page-own

  - id: erfc-argument-z1
    where: 'worked example, step "At z = 1"'
    inputs: {dc: 1.686, sigma: 0.5, D: 0.5}
    formula: dc / (sigma * D) / sqrt(2)
    expected: '4.77'
    shown: ['\text{erfc}(4.77)']
    source: {cite: reading1, at: 'eq. (452), p. 97'}
    origin: page-own

  - id: fraction-z1
    where: 'worked example, step "At z = 1"'
    inputs: {dc: 1.686, sigma: 0.5, D: 0.5}
    formula: erfc(dc / (sigma * D) / sqrt(2))
    expected: '1.5e-11'
    shown: ['\approx 1.5\times10^{-11}$']
    source: {cite: reading1, at: 'eqs. (452), (458), p. 97'}
    origin: page-own

  - id: abundance-drop
    where: 'worked example, step "Lesson": halving D cuts the abundance by about 5 × 10⁷'
    inputs: {dc: 1.686, sigma: 0.5, D: 0.5}
    formula: erfc(dc / sigma / sqrt(2)) / erfc(dc / (sigma * D) / sqrt(2))
    expected: '5e7'
    shown: ['by a factor of about $5\times10^7$']
    source: {cite: reading1, at: 'eq. (458), p. 97'}
    origin: page-own

  - id: half-the-mass
    where: 'section "Counting halos": as σ → ∞, F → ½ erfc(0) = ½ (the missing half)'
    inputs: {}
    formula: erfc(0) / 2
    expected: '0.5'
    tolerance: '0.001'
    shown: ['$F \to \frac12\text{erfc}(0) = \frac12$']
    source: {cite: reading1, at: 'eq. (457), p. 97'}
    origin: mit

  - id: collapsed-fraction-limit
    kind: limit
    where: 'formula "Collapsed fraction": F = ½ erfc(δ_c/√2σ) must approach ½ as σ → ∞ (all scales collapsed, yet only half the mass counted)'
    inputs: {dc: 1.686}
    formula: erfc(dc / (sqrt(2) * s)) / 2
    limit: 1 / 2
    vary: {s: [10, 100, 1000, 10000, 100000]}
    tolerance: 1e-4
    shown: ['F(M, z) = \int_{\delta_c}^\infty d\bar\delta\;p(\bar\delta, z) = \frac12\,\text{erfc}']
    source: {cite: reading1, at: 'eq. (452), p. 97'}
    origin: mit

  - id: collapsed-fraction-is-gaussian-tail
    kind: identity
    where: 'formula "Collapsed fraction": the Gaussian tail ∫ from δ_c to ∞ of p(δ̄) must equal ½ erfc(δ_c/√2σ)'
    formula: integrate('exp(-x**2 / (2 * s**2)) / sqrt(2 * pi * s**2)', 'x', dc, dc + 12 * s)
    equals: erfc(dc / (sqrt(2) * s)) / 2
    samples: {dc: [1.686, 1.686, 1.686, 1.686], s: [0.5, 1, 3, 30]}
    tolerance: 1e-6
    shown: ['p(\bar\delta, z) = \frac{1}{\sqrt{2\pi\sigma_R^2(z)}}\;e^{-\bar\delta^2/2\sigma_R^2(z)}', '\frac12\,\text{erfc}\!\left(\frac{\delta_c}{\sqrt2\,\sigma_R(z)}\right)']
    source: {cite: reading1, at: 'eqs. (451)–(452), pp. 96–97'}
    origin: mit
