# Calculations on content/year-5/8.902/cosmological-principle-expansion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Hubble's law example, the Hubble time for H0 = 67.4 and the ages of single-component universes.

page: content/year-5/8.902/cosmological-principle-expansion.mdx
calcs:
  - id: H0-notes
    kind: fact
    where: 'section "Hubble''s law": H0 ∼ 70 km/s/Mpc'
    shown: ['$H_0 \sim 70$ km/s/Mpc']
    source: {cite: reading1, at: 'p. 62'}
    origin: mit

  - id: recession-100Mpc
    where: 'worked example "Using Hubble''s law": 70 × 100'
    inputs: {}
    formula: 70 * 100
    expected: '7000'
    shown: ['$v = 70 \times 100 = 7000$ km/s']
    source: {cite: reading1, at: 'eq. (267), p. 62'}
    origin: page-own

  - id: hubble-time-unit
    where: 'worked example "How old is each universe?": 1 Mpc/(1 km/s) in Gyr = 977.8'
    inputs: {}
    formula: 3.0857e19 / 3.15576e16
    expected: '977.8'
    shown: ['977.8 billion years is the Hubble time']
    source: {cite: reading1, at: 'p. 65'}
    origin: page-own

  - id: hubble-time
    where: 'worked example and quiz 4: 1/H0 = 977.8/67.4'
    inputs: {}
    formula: 977.8 / 67.4
    expected: '14.5'
    shown: ['$1/H_0 = 977.8/67.4 = 14.5$ billion years']
    source: {cite: reading1, at: 'p. 69 (H0 = 67.4)'}
    origin: page-own

  - id: age-radiation
    where: 'worked example: radiation-only age, half the Hubble time'
    inputs: {}
    formula: 977.8 / 67.4 / 2
    expected: '7.3'
    shown: ['$\frac12 \times 14.5 = 7.3$ billion years']
    source: {cite: reading1, at: 'p. 64'}
    origin: page-own

  - id: age-matter
    where: 'worked example and quiz 4: matter-only age, two thirds of the Hubble time'
    inputs: {}
    formula: 977.8 / 67.4 * 2 / 3
    expected: '9.7'
    shown: ['$\frac23 \times 14.5 = 9.7$ billion years']
    source: {cite: reading1, at: 'p. 65'}
    origin: page-own

  - id: age-real
    kind: fact
    where: 'worked example: the real universe is about 13.8 billion years old'
    shown: ['about 13.8 billion years old']
    source: {ref: 'Planck 2018 results VI: age 13.79 ± 0.02 Gyr'}
    origin: later-data

  - id: lcdm-budget
    kind: fact
    where: 'section "How each ingredient dilutes": roughly 30% matter, 70% dark energy'
    shown: ['roughly 30% matter, 70% dark energy']
    source: {cite: reading1, at: 'p. 64'}
    origin: mit

  - id: plot-zero-matter
    where: 'plot caption: the matter curve reaches a = 0 at Δt = −2/3'
    inputs: {}
    formula: solve('1 + 1.5 * x', 'x', -2, 0)
    expected: '-0.667'
    shown: []
    source: {cite: reading1, at: 'p. 65'}
    origin: page-own

  - id: plot-zero-radiation
    where: 'plot caption: the radiation curve reaches a = 0 at Δt = −1/2'
    inputs: {}
    formula: solve('1 + 2 * x', 'x', -2, 0)
    expected: '-0.5'
    shown: []
    source: {cite: reading1, at: 'p. 64'}
    origin: page-own

  - id: plot-zero-empty
    where: 'plot caption: the empty-universe line reaches a = 0 at Δt = −1'
    inputs: {}
    formula: solve('1 + x', 'x', -2, 0)
    expected: '-1'
    shown: []
    source: {cite: reading1, at: 'p. 65'}
    origin: page-own
