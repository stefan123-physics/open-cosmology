# Calculations on content/year-5/8.902/friedmann-equations-density-parameters.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Critical density, protons per cubic metre, the matter-Λ and matter-radiation equality epochs, and the plot's crossings.

page: content/year-5/8.902/friedmann-equations-density-parameters.mdx
calcs:
  - id: rho-crit-coefficient
    where: 'eq. (295) and worked example: 3(100 km/s/Mpc)²/8πG in g/cm³'
    inputs: {}
    formula: 3 * (100e5 / 3.0857e24)**2 / (8 * pi * 6.674e-8)
    expected: '1.878e-29'
    shown: ['The more precise coefficient is $1.878\times10^{-29}$']
    source: {cite: reading1, at: 'eq. (295), p. 68'}
    origin: page-own

  - id: rho-crit-notes
    kind: fact
    where: 'eq. (295): ≈ 1.8 × 10⁻²⁹ h² g/cm³ in the notes'
    shown: ['\approx 1.8\times10^{-29}\,h^2\ \text{g/cm}^3']
    source: {cite: reading1, at: 'eq. (295), p. 68'}
    origin: mit

  - id: rho-crit-h0674
    where: 'worked example (a): 1.88 × 10⁻²⁹ × 0.674²'
    inputs: {}
    formula: 1.878e-29 * 0.674**2
    expected: '8.5e-30'
    shown: ['$1.88\times10^{-29} \times 0.674^2 = 8.5\times10^{-30}$ g/cm³']
    source: {cite: reading1, at: 'eq. (295), p. 68'}
    origin: page-own

  - id: protons-per-cm3
    where: 'worked example (a): divided by the proton mass'
    inputs: {}
    formula: 1.878e-29 * 0.674**2 / 1.6726e-24
    expected: '5.1e-6'
    shown: ['$5.1\times10^{-6}$ protons per cm³']
    source: {cite: reading1, at: 'eq. (295), p. 68'}
    origin: page-own

  - id: baryons-per-m3
    where: 'worked example (b): 0.049 × 5.1 protons per m³'
    inputs: {}
    formula: 0.049 * 1.878e-29 * 0.674**2 / 1.6726e-24 * 1e6
    expected: '0.25'
    shown: ['$0.049 \times 5.1 \approx 0.25$ protons per cubic metre']
    source: {cite: reading1, at: 'eq. (300), p. 69'}
    origin: page-own

  - id: planck-values
    kind: fact
    where: 'eq. (300): Planck 2018 values quoted in the notes'
    shown: ['\Omega_{m,0} = 0.315 \pm 0.007', '\Omega_{\Lambda,0} = 0.6847 \pm 0.0073', 'with $H_0 = 67.4 \pm 0.5$ km/s/Mpc']
    source: {cite: reading1, at: 'eq. (300), p. 69'}
    origin: mit

  - id: omega-r
    kind: fact
    where: 'eq. (300) text: Ω_r,0 ≈ 10⁻⁴'
    shown: ['together with the neutrinos: $\Omega_{r,0} \approx 10^{-4}$']
    source: {cite: reading1, at: 'p. 69'}
    origin: mit

  - id: mL-ratio
    where: 'quiz 2: a³ = 0.315/0.685'
    inputs: {}
    formula: 0.315 / 0.685
    expected: '0.46'
    shown: ['$a^3 = 0.315/0.685 = 0.46$']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: page-own

  - id: mL-inverse-cube
    where: 'bracket after eq. (303): Ω_Λ/Ω_m = 2.17, the notes'' "2.3" is a⁻³'
    inputs: {}
    formula: 0.6847 / 0.315
    expected: '2.17'
    shown: ['$2.17 \approx 2.3$ is the value of $a^{-3}$']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: slip

  - id: mL-a
    where: 'bracket after eq. (303) and quiz 2: a = (Ω_m/Ω_Λ)^(1/3)'
    inputs: {}
    formula: (0.315 / 0.6847)**(1/3)
    expected: '0.77'
    shown: ['= 0.77$ and $z \approx 0.3$']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: slip

  - id: mL-z
    where: 'plot caption: z ≈ 0.30 at matter-Λ equality'
    inputs: {}
    formula: (0.685 / 0.315)**(1/3) - 1
    expected: '0.30'
    shown: ['(z ≈ 0.30)']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: page-own

  - id: age-at-mL
    where: 'bracket after eq. (303): about 10 billion years after the Big Bang at z ≈ 0.3 (flat ΛCDM, H0 = 67.4, Ω_r,0 = 9.2e-5)'
    inputs: {}
    formula: 977.8 / 67.4 * integrate('1 / (x * sqrt(9.2e-5 / x**4 + 0.315 / x**3 + 0.6847))', 'x', 1e-6, 0.772)
    expected: '10'
    tolerance: '0.5'
    shown: ['and $z \approx 0.3$, about 10 billion years after the Big Bang. Their']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: page-own

  - id: age-at-z1
    where: 'bracket after eq. (303): z = 1 is 5.8 billion years after the Big Bang'
    inputs: {}
    formula: 977.8 / 67.4 * integrate('1 / (x * sqrt(9.2e-5 / x**4 + 0.315 / x**3 + 0.6847))', 'x', 1e-6, 0.5)
    expected: '5.8'
    shown: ['(5.8 billion for these parameters)']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: page-own

  - id: mr-notes
    kind: fact
    where: 'eq. (305): a ≈ 1/3700, z ≈ 3700 in the notes'
    shown: ['The notes give $a \approx 1/3700$, $z \approx 3700$']
    source: {cite: reading1, at: 'eq. (305), p. 69'}
    origin: mit

  - id: mr-rounded
    where: 'matter-radiation equality with Ω_r,0 = 10⁻⁴: a = 1/3150'
    inputs: {}
    formula: 0.315 / 1e-4
    expected: '3150'
    shown: ['the formula gives $1/3150$']
    source: {cite: reading1, at: 'eq. (305), p. 69'}
    origin: page-own

  - id: mr-precise
    where: 'matter-radiation equality with Ω_r,0 = 9.2 × 10⁻⁵ (T = 2.7255 K, N_eff = 3.046, h = 0.674): z ≈ 3420'
    inputs: {}
    formula: 0.315 / (2.4730e-5 * (1 + 0.22711 * 3.046) / 0.674**2) - 1
    expected: '3420'
    tolerance: '5'
    shown: ['$z \approx 3420$. Planck']
    source: {cite: reading1, at: 'eq. (305), p. 69'}
    origin: page-own

  - id: mr-planck
    kind: fact
    where: 'matter-radiation equality: Planck z_eq ≈ 3400'
    shown: ['$z_\text{eq} \approx 3400$']
    source: {ref: 'Planck 2018 results VI, Table 2: z_eq = 3402 ± 26 (TT,TE,EE+lowE+lensing; 3387 ± 21 with BAO)'}
    origin: later-data

  - id: plot-log-aeq
    where: 'plot caption: log10 a = −3.53 at matter-radiation equality'
    inputs: {}
    formula: log10(9.2e-5 / 0.315)
    expected: '-3.53'
    shown: ['cross at log₁₀ a = −3.53']
    source: {cite: reading1, at: 'eq. (304), p. 69'}
    origin: page-own

  - id: plot-log-aml
    where: 'plot caption: log10 a = −0.11 at matter-Λ equality'
    inputs: {}
    formula: log10(0.315 / 0.685) / 3
    expected: '-0.11'
    shown: ['and −0.11 (z ≈ 0.30)']
    source: {cite: reading1, at: 'eq. (303), p. 69'}
    origin: page-own
