# Calculations on content/year-5/8.902/stability-jeans-toomre.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Jeans length, mass and free-fall time of a cold cloud; the Toomre coefficient; Q for a disc patch.

page: content/year-5/8.902/stability-jeans-toomre.mdx
calcs:
  - id: cloud-sound-speed
    where: 'worked example "The Jeans mass of a cold cloud": v_s = √(kT/2.33 m_H) at 10 K'
    inputs: {}
    formula: sqrt(1.380649e-23 * 10 / (2.33 * 1.6735e-27))
    expected: '188'
    shown: ['= 188$ m/s']
    source: {cite: reading1, at: 'eq. (195), p. 44'}
    origin: page-own

  - id: cloud-density
    where: 'worked example: ρ0 = 10⁹ m⁻³ × 2.33 m_H'
    inputs: {}
    formula: 1e9 * 2.33 * 1.6735e-27
    expected: '3.9e-18'
    shown: ['$= 3.9\times10^{-18}$ kg/m³']
    source: {cite: reading1, at: 'eq. (203), p. 45'}
    origin: page-own

  - id: cloud-jeans-length-m
    where: 'worked example: λ_J = √(π v_s²/(Gρ0)) in metres'
    inputs: {}
    formula: sqrt(pi * (1.380649e-23 * 10 / (2.33 * 1.6735e-27)) / (6.674e-11 * 1e9 * 2.33 * 1.6735e-27))
    expected: '2.1e16'
    shown: ['= 2.1\times10^{16}$ m']
    source: {cite: reading1, at: 'eq. (203), p. 45'}
    origin: page-own

  - id: cloud-jeans-length-pc
    where: 'worked example: λ_J ≈ 0.67 pc'
    inputs: {}
    formula: sqrt(pi * (1.380649e-23 * 10 / (2.33 * 1.6735e-27)) / (6.674e-11 * 1e9 * 2.33 * 1.6735e-27)) / 3.0857e16
    expected: '0.67'
    shown: ['$= 0.67$ pc']
    source: {cite: reading1, at: 'eq. (203), p. 45'}
    origin: page-own

  - id: cloud-jeans-mass
    where: 'worked example: M_J = (4/3)πρ0λ_J³ ≈ 73 M☉'
    inputs: {}
    formula: 4 / 3 * pi * (1e9 * 2.33 * 1.6735e-27) * (pi * (1.380649e-23 * 10 / (2.33 * 1.6735e-27)) / (6.674e-11 * 1e9 * 2.33 * 1.6735e-27))**1.5 / 1.989e30
    expected: '73'
    tolerance: '1'
    shown: ['\approx 73\,M_\odot$']
    source: {cite: reading1, at: 'eq. (203), p. 45'}
    origin: page-own

  - id: cloud-freefall-s
    where: 'worked example: t_ff = 1/√(Gρ0)'
    inputs: {}
    formula: 1 / sqrt(6.674e-11 * 1e9 * 2.33 * 1.6735e-27)
    expected: '6.2e13'
    shown: ['= 6.2\times10^{13}$ s']
    source: {cite: reading1, at: 'eq. (204), p. 45'}
    origin: page-own

  - id: cloud-freefall-myr
    where: 'worked example: about 2 million years'
    inputs: {}
    formula: 1 / sqrt(6.674e-11 * 1e9 * 2.33 * 1.6735e-27) / 3.156e13
    expected: '2'
    tolerance: '0.1'
    shown: ['\approx 2$ million years']
    source: {cite: reading1, at: 'eq. (204), p. 45'}
    origin: page-own

  - id: toomre-coefficient
    where: 'eq. (215): √(32/3) = 3.27, the notes'' 3.26'
    inputs: {}
    formula: sqrt(32 / 3)
    expected: '3.27'
    shown: ['which gives their $\sqrt{32/3} = 3.27$']
    source: {cite: reading1, at: 'eq. (215), p. 47'}
    origin: mit

  - id: toomre-exact
    kind: fact
    where: 'bracket after eq. (216): Toomre''s exact 3.36 for a stellar disc, π for gas'
    shown: ['Toomre''s exact calculation for a disc of stars actually gives 3.36 (Toomre 1964)']
    source: {cite: toomre1964, at: 'the stellar-disc criterion (the gas-disc factor π is due to Safronov 1960 and Goldreich and Lynden-Bell 1965)'}
    origin: later-data

  - id: sigma-crit
    where: 'worked example "Is the solar neighbourhood stable?" and quiz 4: 3.26 × 0.0043 × 50/0.036'
    inputs: {}
    formula: 3.26 * 0.0043 * 50 / 0.036
    expected: '19.5'
    shown: ['$\sigma_\text{crit} = 3.26 \times 0.0043 \times 50/0.036 = 19.5$ km/s']
    source: {cite: reading1, at: 'eq. (216), p. 47'}
    origin: page-own

  - id: toomre-Q
    where: 'worked example: Q = 35/19.5'
    inputs: {}
    formula: 35 / (3.26 * 0.0043 * 50 / 0.036)
    expected: '1.8'
    shown: ['$Q = 35/19.5 = 1.8 > 1$']
    source: {cite: reading1, at: 'eq. (217), p. 47'}
    origin: page-own
