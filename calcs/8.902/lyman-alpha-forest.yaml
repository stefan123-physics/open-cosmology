# Calculations on content/year-5/8.902/lyman-alpha-forest.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Redshifted line positions, the Gunn–Peterson optical depth at z = 3, the neutral fraction it implies,
# temperature from line widths, ionization and recombination timescales and the equilibrium neutral fraction.

page: content/year-5/8.902/lyman-alpha-forest.mdx
calcs:
  - id: lya-emission-z3
    where: 'worked example (a) and quiz 1: 1216 Å × 4'
    inputs: {}
    formula: 1216 * 4
    expected: '4864'
    shown: ['$1216\,\text{Å} \times (1 + 3) = 4864$ Å']
    source: {cite: reading1, at: 'p. 114'}
    origin: page-own

  - id: lya-absorber-z25
    where: 'worked example (b) and quiz 1: 1216 Å × 3.5'
    inputs: {}
    formula: 1216 * 3.5
    expected: '4256'
    shown: ['$1216\,\text{Å} \times 3.5 = 4256$ Å, short-ward']
    source: {cite: reading1, at: 'p. 114'}
    origin: page-own

  - id: lyb-limit-z3
    where: 'worked example (c): Lyman-β 1026 Å × 4'
    inputs: {}
    formula: 1026 * 4
    expected: '4103'
    tolerance: '2'
    shown: ['$1026\,\text{Å} \times 4 = 4103$ Å']
    source: {cite: reading1, at: 'p. 116 (figure marks the Lyβ forest); Lyman-β rest wavelength 1025.7 Å'}
    origin: page-own

  - id: gp-quasar-lya
    where: 'section "The Gunn–Peterson test": the z = 6.13 quasar''s Lyman-α at 1216 × 7.13'
    inputs: {}
    formula: 1216 * 7.13
    expected: '8670'
    tolerance: '5'
    shown: ['$1216 \times 7.13 \approx 8670$ Å']
    source: {cite: reading1, at: 'figure, p. 116'}
    origin: page-own

  - id: quasar-redshifts
    kind: fact
    where: 'section "Quasars as backlights" and the Gunn–Peterson section: quasars at z = 0.158, 3.62 and 6.13 shown in the notes'
    shown: ['a nearby quasar at $z = 0.158$', 'one at $z = 3.62$', 'a quasar at $z = 6.13$']
    source: {cite: reading1, at: 'figures, pp. 115–116'}
    origin: mit

  - id: mgii-doublet
    kind: fact
    where: 'bullet on doublets: Mg II at 2796 and 2803 Å (the notes print 2795, 2802)'
    shown: ['the magnesium doublet at 2796 and 2803 Å', '(λ = 2795 Å, 2802 Å)']
    source: {cite: reading1, at: 'p. 115'}
    origin: mit

  - id: column-densities
    kind: fact
    where: 'bullets on absorber types: 10¹⁷ cm⁻², 912 Å = 13.6 eV, DLA threshold 10³² (notes) vs 2 × 10²⁰ (usual)'
    shown: ['$N_\text{HI} \lesssim 10^{17}\ \text{cm}^{-2}$', 'below 912 Å (13.6 eV)', 'the usual definition is $N_\text{HI} \geq 2\times10^{20}\ \text{cm}^{-2}$']
    source: {cite: reading1, at: 'p. 115'}
    origin: mit

  - id: lyman-limit-energy
    where: 'bullet on Lyman-limit systems: hc/912 Å in eV'
    inputs: {}
    formula: 12398.4 / 912
    expected: '13.6'
    shown: ['(13.6 eV)']
    source: {cite: reading1, at: 'p. 115'}
    origin: page-own

  - id: reionization-z6
    kind: fact
    where: 'section "The Gunn–Peterson test": neutral above z ≈ 6, ionized below'
    shown: ['mostly neutral above $z \approx 6$ and mostly ionized below it']
    source: {cite: reading1, at: 'p. 116'}
    origin: mit

  - id: H0-in-SI
    where: 'eq. (503): 70 km/s/Mpc in s⁻¹'
    inputs: {}
    formula: 70e3 / 3.0857e22
    expected: '2.27e-18'
    shown: ['2.27\times10^{-18} \times 0.548']
    source: {cite: reading1, at: 'eq. (503), p. 118'}
    origin: page-own

  - id: sqrt-0p3
    where: 'worked example: √0.3'
    inputs: {}
    formula: sqrt(0.3)
    expected: '0.548'
    shown: ['\sqrt{0.3}\,(4)^{3/2} = 2.27']
    source: {cite: reading1, at: 'eq. (502), p. 118'}
    origin: page-own

  - id: gp-numerator
    where: 'worked example: σ0 n_HI λ0 = 10⁻² × 10⁻⁵ × 1.216 × 10⁻⁵'
    inputs: {}
    formula: 1e-2 * 1e-5 * 1.216e-5
    expected: '1.2e-12'
    shown: ['1.216\times10^{-5} = 1.2\times10^{-12}\ \text{s}^{-1}']
    source: {cite: reading1, at: 'eq. (503), p. 118'}
    origin: page-own

  - id: gp-denominator
    where: 'worked example: H0 √0.3 × 4^(3/2)'
    inputs: {}
    formula: 70e3 / 3.0857e22 * sqrt(0.3) * 4**1.5
    expected: '9.9e-18'
    shown: ['0.548 \times 8 = 9.9\times10^{-18}\ \text{s}^{-1}']
    source: {cite: reading1, at: 'eq. (502), p. 118'}
    origin: page-own

  - id: gp-tau-z3
    where: 'worked example and plot caption: τ ≈ 1.2 × 10⁵ at z = 3 for neutral gas'
    inputs: {}
    formula: 1e-2 * 1e-5 * 1.216e-5 / (70e3 / 3.0857e22 * sqrt(0.3) * 4**1.5)
    expected: '1.2e5'
    shown: ['= 1.2\times10^5$, as in the notes']
    source: {cite: reading1, at: 'p. 118'}
    origin: page-own

  - id: gp-tau-notes
    kind: fact
    where: 'section "Neutral gas would absorb everything": τ ∼ 10⁵ (notes), observed τ ∼ 1, X_HI ∼ 10⁻⁵'
    shown: ['a Lyman-α optical depth $\tau \sim 10^5$', '$X_\text{HI} \equiv n_\text{HI}/n_\text{H} \sim 10^{-5}$']
    source: {cite: reading1, at: 'p. 118'}
    origin: mit

  - id: needed-neutral-fraction
    where: 'worked example: 1/(1.2 × 10⁵)'
    inputs: {}
    formula: 1 / 1.2e5
    expected: '8e-6'
    shown: ['$1/(1.2\times10^5) \approx 8\times10^{-6}$']
    source: {cite: reading1, at: 'p. 118'}
    origin: page-own

  - id: n-HI-check
    where: 'eq. (503): ρ_crit Ω_b (1 + z)³/m_H at z = 3 is of order 10⁻⁵ cm⁻³ (Ω_b = 0.049, h = 0.7)'
    inputs: {}
    formula: 3 * (70e5 / 3.0857e24)**2 / (8 * pi * 6.674e-8) * 0.049 / 1.6735e-24 * 64
    expected: '1.7e-5'
    shown: []
    source: {cite: reading1, at: 'eq. (503), p. 118'}
    origin: page-own

  - id: transmission-z3
    where: 'plot caption: with X_HI = 10⁻⁵ about 30% gets through at z = 3'
    inputs: {}
    formula: exp(-1.2)
    expected: '0.30'
    tolerance: '0.01'
    shown: ['about 30% of the light gets through at z = 3']
    source: {cite: reading1, at: 'eq. (502), p. 118'}
    origin: page-own

  - id: transmission-z6
    where: 'plot caption: only 6% at z = 6'
    inputs: {}
    formula: exp(-1.2 * (7 / 4)**1.5)
    expected: '0.06'
    tolerance: '0.005'
    shown: ['only 6% at z = 6']
    source: {cite: reading1, at: 'eq. (502), p. 118'}
    origin: page-own

  - id: temperature-from-width
    where: 'bracket after eq. (504): T = m v²/2k for 20 km/s with the proton mass'
    inputs: {}
    formula: 1.6726e-27 * (20e3)**2 / (2 * 1.380649e-23)
    expected: '2.4e4'
    shown: ['$T = mv^2/2k \approx 2.4\times10^4$ K']
    source: {cite: reading1, at: 'eq. (504), p. 119'}
    origin: page-own

  - id: temperature-eV
    where: 'bracket after eq. (504): 2.4 × 10⁴ K in eV'
    inputs: {}
    formula: 2.4e4 * 8.617333e-5
    expected: '2'
    tolerance: '0.2'
    shown: ['about 2 eV; the notes round up']
    source: {cite: reading1, at: 'eq. (504), p. 119'}
    origin: page-own

  - id: ionization-time
    where: 'eq. (505): 10¹² s in years'
    inputs: {}
    formula: 1e12 / 3.156e7
    expected: '30000'
    tolerance: '2000'
    shown: ['10^{12}\ \text{s} \sim 30{,}000\ \text{yr}']
    source: {cite: reading1, at: 'eq. (505), p. 119'}
    origin: mit

  - id: recombination-time-years
    where: 'bracket after eq. (506): 2 × 10¹⁷ s is about 6 × 10⁹ years (the notes say 3 × 10⁶)'
    inputs: {}
    formula: 2e17 / 3.156e7
    expected: '6e9'
    shown: ['$2\times10^{17}$ s is about $6\times10^9$ years']
    source: {cite: reading1, at: 'eq. (506), p. 119'}
    origin: slip

  - id: recombination-time-s
    where: 'eq. (506): 1/(R n_e) with R = 4.3 × 10⁻¹³ cm³/s and n_e ∼ 10⁻⁵ cm⁻³'
    inputs: {}
    formula: 1 / (4.3e-13 * 1e-5)
    expected: '2e17'
    tolerance: '0.5e17'
    shown: ['\sim 2\times10^{17}\ \text{s}']
    source: {cite: reading1, at: 'eq. (506), p. 119'}
    origin: mit

  - id: equilibrium-neutral-fraction
    where: 'eq. (509): X_HI = R n_H/Γ with R = 4.3 × 10⁻¹³, n_H = 10⁻⁵, Γ = 10⁻¹²'
    inputs: {}
    formula: 4.3e-13 * 1e-5 / 1e-12
    expected: '5e-6'
    tolerance: '1e-6'
    shown: ['\sim 5\times10^{-6}" cite="reading1" at="eq. (509)']
    source: {cite: reading1, at: 'eq. (509), p. 119'}
    origin: mit

  - id: rates-quoted
    kind: fact
    where: 'section "What keeps the gas ionized?": Γ ∼ 10⁻¹² s⁻¹, R = 4.3 × 10⁻¹³ (T/10⁴ K)^(−0.7) cm³/s'
    shown: ['at a rate $\Gamma \sim 10^{-12}\ \text{s}^{-1}$', '$R = 4.3\times10^{-13}\,(T/10^4\ \text{K})^{-0.7}$ cm³/s']
    source: {cite: reading1, at: 'pp. 119'}
    origin: mit

  - id: reionization-sketch
    kind: fact
    where: 'section "The history of reionization": recombination z ≈ 1100, reionization z ≈ 15 to 6 in the sketch'
    shown: ['roughly $z \approx 15$ down to 6 in the notes'' sketch']
    source: {cite: reading1, at: 'figure, p. 120'}
    origin: mit

  - id: oscillator-strength
    kind: fact
    where: 'symbol meaning of f: 0.416 for Lyman-α; σ0 = πe²f/m_e c ≈ 10⁻² cm² Hz'
    shown: ['For Lyman-α the prefactor is $\sigma_0 \approx 10^{-2}\ \text{cm}^2\,\text{Hz}$']
    source: {cite: reading1, at: 'p. 117'}
    origin: mit

  - id: sigma0-check
    where: 'πe²f/m_e c for f = 0.4164 in CGS, about 0.011 cm² Hz'
    inputs: {}
    formula: pi * (4.803e-10)**2 / (9.109e-28 * 2.998e10) * 0.4164
    expected: '0.011'
    shown: []
    source: {cite: reading1, at: 'eq. (495), p. 117'}
    origin: page-own
