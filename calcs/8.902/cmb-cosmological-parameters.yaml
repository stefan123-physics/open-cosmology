# Calculations on content/year-5/8.902/cmb-cosmological-parameters.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Shift of the first peak with the angular diameter distance, the age at recombination versus Ω_m,
# the toy-model peak ratio (1 + 2R)², and the Planck figures quoted in words.

page: content/year-5/8.902/cmb-cosmological-parameters.mdx
calcs:
  - id: angle-factor
    where: 'worked example "Moving the first peak": the angle grows by 1/0.9'
    inputs: {}
    formula: 1 / 0.9
    expected: '1.11'
    shown: ['grows by $1/0.9 = 1.11$']
    source: {cite: reading1, at: 'p. 103'}
    origin: page-own

  - id: shifted-peak
    where: 'worked example "Moving the first peak": 0.9 × 220'
    inputs: {}
    formula: 0.9 * 220
    expected: '198'
    shown: ['$0.9 \times 220 = 198$']
    source: {cite: reading1, at: 'p. 103'}
    origin: page-own

  - id: sqrt-two
    where: 'worked example "How much younger?": doubling Ω_m divides t_rec by √2'
    inputs: {}
    formula: sqrt(2)
    expected: '1.41'
    shown: ['$\sqrt2 = 1.41$']
    source: {cite: reading1, at: 'p. 105 (figure of a(t) for Ω₁ > Ω₂)'}
    origin: page-own

  - id: inverse-sqrt-two
    where: 'worked example "How much younger?": the factor 1/√2'
    inputs: {}
    formula: 1 / sqrt(2)
    expected: '0.71'
    shown: ['the factor $1/\sqrt2 = 0.71$']
    source: {cite: reading1, at: 'p. 105'}
    origin: page-own

  - id: earlier-percent
    where: 'worked example "How much younger?": about 29% earlier'
    inputs: {}
    formula: 100 * (1 - 1 / sqrt(2))
    expected: '29'
    shown: ['about 29% earlier']
    source: {cite: reading1, at: 'p. 105'}
    origin: page-own

  - id: quiz-R
    where: 'quiz 4: (1 + 2R)² = 2.3 gives R = (√2.3 − 1)/2'
    inputs: {}
    formula: (sqrt(2.3) - 1) / 2
    expected: '0.26'
    shown: ['so $R \\approx 0.26$']
    source: {cite: reading1, at: 'p. 105'}
    origin: page-own

  - id: quiz-sqrt
    where: 'quiz 4 explanation: √2.3'
    inputs: {}
    formula: sqrt(2.3)
    expected: '1.52'
    shown: ['\\sqrt{2.3} = 1.52']
    source: {cite: reading1, at: 'p. 105'}
    origin: page-own

  - id: planck-heights
    kind: fact
    where: 'callout "What Planck measured": first peak near ℓ ≈ 220 at almost 6000 μK², second and third about 2500 μK²'
    shown: ['near $\ell \approx 220$, rises to almost 6000 μK²', 'reach only about 2500 μK²']
    source: {ref: 'Planck 2018 results V (A&A 641, A5, 2020), Fig. 57, as reproduced in the 8.902 Lecture 18 notes, p. 104'}
    origin: later-data

  - id: planck-ratio
    where: 'callout: about 6000/2500, roughly the quiz''s ratio of 2.3'
    inputs: {}
    formula: 5800 / 2500
    expected: '2.3'
    tolerance: '0.15'
    shown: []
    source: {ref: 'Planck 2018 results V, Fig. 57 (peak heights read off the figure: about 5800 and 2500 μK²)'}
    origin: later-data

  - id: planck-composition
    kind: fact
    where: 'callout "What Planck measured": about 5% baryons, about 31% all matter, curvature below a few tenths of a percent with BAO'
    shown: ['gives about 5% of the critical density in baryons and about 31% in all matter', 'the curvature is below a few tenths of a percent']
    source: {ref: 'Planck 2018 results VI (A&A 641, A6, 2020): Ω_b h² = 0.0224, Ω_m = 0.315 (Ω_b ≈ 0.049); Planck + BAO: Ω_k = 0.0007 ± 0.0019'}
    origin: later-data

  - id: real-baryon-loading
    kind: fact
    where: 'callout and quiz 4: the real baryon loading at recombination, about 0.6'
    shown: ['the real baryon loading at recombination is about 0.6', 'The real baryon loading at recombination is about 0.6']
    source: {ref: 'R = 3ρ_b/4ρ_γ ≈ 0.6 at z ≈ 1090 for Ω_b h² = 0.0224 (standard value, e.g. Hu & Dodelson, ARA&A 40, 171, 2002)'}
    origin: later-data

  - id: planck-ratio-text
    kind: fact
    where: 'callout: a ratio of about 2.3'
    shown: ['a ratio of about 2.3']
    source: {ref: 'Planck 2018 results V, Fig. 57 (about 5800 / 2500)'}
    origin: later-data

  - id: example-peak
    kind: fact
    where: 'worked example "Moving the first peak": the starting value ℓ₁ = 220'
    shown: ['if it was at $\ell_1 = 220$ before']
    source: {ref: 'Planck 2018 results V, Fig. 57: first peak near ℓ ≈ 220'}
    origin: later-data
