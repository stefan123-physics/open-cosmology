# Calculations on content/year-1/8.01/momentum-and-impulse.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 15 (segments 15.1–15.5) and Course Notes Chapter 10, with the page's own numbers.

page: content/year-1/8.01/momentum-and-impulse.mdx
calcs:
  - id: triangle-impulse
    where: 'graph caption and worked example "A tennis ball", step "Impulse": ½ × 400 N × 4.0 ms = 0.80 N·s'
    inputs: {F: 400 N, dt: 4.0 ms}
    formula: 0.5 * F * dt
    expected: 0.80 N*s
    shown: ['$I = \tfrac12 \times 400 \times 0.0040 = 0.80$ N·s', 'the triangle''s area, ½ × 400 N × 4 ms = 0.80 N·s']
    source: {cite: reading1, at: 'Eq. (10.2.11), p. 10-3'}
    origin: page-own

  - id: triangle-integral
    kind: identity
    where: 'graph: the area under the triangular F(t) equals ½ × peak × duration (checked with the slope b = 200 N/ms)'
    formula: 0.5 * (b * T / 2) * T
    equals: b * T**2 / 4
    samples: {b: [200.0, 20.0], T: [4.0, 1.0]}
    tolerance: 1e-9
    shown: ['average force over 4 ms']
    source: {cite: reading1, at: 'Eq. (10.2.11), p. 10-3'}
    origin: mit

  - id: tennis-average
    where: 'worked example "A tennis ball", step "Average force": 0.80/0.0040 = 200 N'
    inputs: {I: 0.80 N*s, dt: 4.0 ms}
    formula: I / dt
    expected: 200 N
    shown: ['$F_\text{ave} = I/\Delta t = 0.80/0.0040 = 200$ N', 'and the average force is 0.80 N·s / 4 ms = 200 N']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: tennis-dv
    where: 'worked example "A tennis ball", step "Final velocity": Δv = 0.80/0.058 ≈ 13.8 m/s'
    inputs: {I: 0.80 N*s, m: 58 g}
    formula: I / m
    expected: 13.8 m/s
    shown: ['$\Delta v = I/m = 0.80/0.058 \approx 13.8$ m/s']
    source: {cite: reading1, at: 'Eq. (10.2.5), p. 10-2'}
    origin: page-own

  - id: tennis-final
    where: 'worked example "A tennis ball": −15 + 13.8 ≈ −1.2 m/s'
    inputs: {I: 0.80 N*s, m: 58 g, v0: -15 m/s}
    formula: v0 + I / m
    expected: -1.2 m/s
    shown: ['the ball leaves at $-15 + 13.8 \approx -1.2$ m/s']
    source: {cite: reading1, at: 'Eq. (10.2.5), p. 10-2'}
    origin: page-own

  - id: tennis-return
    where: 'worked example "A tennis ball": impulse to send it back at 15 m/s is 0.058 × 30 = 1.74 N·s'
    inputs: {m: 58 g, dv: 30 m/s}
    formula: m * dv
    expected: 1.74 N*s
    shown: ['$0.058 \times 30 = 1.74$ N·s']
    source: {cite: reading1, at: 'Eq. (10.2.5), p. 10-2'}
    origin: page-own

  - id: quiz-bounce
    where: 'quiz 3: m(v_a + v_b) = 0.10 × 9.0 = 0.90 N·s'
    inputs: {m: 0.10 kg, va: 4.0 m/s, vb: 5.0 m/s}
    formula: m * (va + vb)
    expected: 0.90 N*s
    shown: ['$\\Delta p_y = m(v_a + v_b) = 0.10 \\times (4.0 + 5.0) = 0.90$ N·s']
    quiz: 2
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: page-own

  - id: bounce-vb
    where: 'worked example "A bouncing ball", step "Speeds": √(2 × 9.81 × 1.8) ≈ 5.94 m/s'
    inputs: {g: 9.81 m/s**2, h: 1.8 m}
    formula: sqrt(2 * g * h)
    expected: 5.94 m/s
    shown: ['$v_b = \sqrt{2 \times 9.81 \times 1.8} \approx 5.94$ m/s']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: bounce-va
    where: 'worked example "A bouncing ball", step "Speeds": √(2 × 9.81 × 1.2) ≈ 4.85 m/s'
    inputs: {g: 9.81 m/s**2, h: 1.2 m}
    formula: sqrt(2 * g * h)
    expected: 4.85 m/s
    shown: ['$v_a = \sqrt{2 \times 9.81 \times 1.2} \approx 4.85$ m/s']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: bounce-force
    where: 'worked example "A bouncing ball", step "Average force": ≈ 130 N'
    inputs: {m: 0.060 kg, g: 9.81 m/s**2, hi: 1.8 m, hf: 1.2 m, dt: 5.0 ms}
    formula: m * (sqrt(2 * g * hf) + sqrt(2 * g * hi)) / dt + m * g
    expected: 130 N
    tolerance: 0.5 N
    shown: ['\approx 129.5 + 0.59 \approx 130$ N']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: bounce-impulse-part
    where: 'worked example "A bouncing ball": 0.060 × (4.85 + 5.94)/0.0050 ≈ 129.5 N'
    inputs: {m: 0.060 kg, dt: 5.0 ms, va: 4.85 m/s, vb: 5.94 m/s}
    formula: m * (va + vb) / dt
    expected: 129.5 N
    tolerance: 0.1 N
    shown: ['0.060 \times (4.85 + 5.94)/0.0050 + 0.060 \times 9.81']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: bounce-weight
    where: 'worked example "A bouncing ball": weight 0.060 × 9.81 ≈ 0.59 N'
    inputs: {m: 0.060 kg, g: 9.81 m/s**2}
    formula: m * g
    expected: 0.59 N
    shown: ['the ball''s weight (0.59 N)']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: bounce-ratio
    where: 'worked example "A bouncing ball": about 220 times the weight'
    inputs: {}
    formula: 130 / (0.060 * 9.81)
    expected: '220'
    tolerance: 2
    shown: ['about 220 times the ball''s weight']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: bounce-formula
    kind: identity
    where: 'formula "Average normal force": solving (N_ave − mg)Δt = m(v_a + v_b)'
    formula: (m * (sqrt(2 * g * hf) + sqrt(2 * g * hi)) / dt + m * g - m * g) * dt
    equals: m * (sqrt(2 * g * hf) + sqrt(2 * g * hi))
    samples: {m: [0.06, 0.5], g: [9.81, 9.81], hf: [1.2, 0.3], hi: [1.8, 2.0], dt: [0.005, 0.01]}
    tolerance: 1e-9
    shown: ['N_\text{ave} = \frac{m\left(\sqrt{2gh_f} + \sqrt{2gh_i}\right)}{\Delta t} + mg']
    source: {cite: reading4, at: 'p. 3'}
    origin: mit
