# Calculations on content/year-1/8.01/acceleration-1d.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-1/8.01/acceleration-1d.mdx
calcs:
  - id: second-derivative-example
    kind: identity
    where: 'section "Acceleration": x = 3 + 2t − 4t³ gives a(t) = −24t'
    formula: deriv('3 + 2 * x - 4 * x**3', 'x', t, 2)
    equals: -24 * t
    samples: {t: [0.5, 1, 2]}
    tolerance: 1e-5
    shown: ['$x(t) = 3 + 2t - 4t^3$ gives $v(t) = 2 - 12t^2$ and $a(t) = -24t$']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: time-to-top
    where: 'worked example "A ball thrown upward", step "Highest point": t_top = 12/9.8'
    inputs: {v0: 12 m/s, g: 9.8 m/s**2}
    formula: v0 / g
    expected: 1.22 s
    shown: ['so $t_\text{top} = 1.22$ s']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: rise-above-hand
    where: 'worked example, step "Highest point": 12(1.22) − ½(9.8)(1.22)² = 7.35 m'
    inputs: {v0: 12 m/s, g: 9.8 m/s**2}
    formula: v0**2 / (2 * g)
    expected: 7.35 m
    shown: ['= 1.5 + 7.35 = 8.85$ m above the ground']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: max-height
    where: 'worked example, step "Highest point"'
    inputs: {x0: 1.5 m, v0: 12 m/s, g: 9.8 m/s**2}
    formula: x0 + v0**2 / (2 * g)
    expected: 8.85 m
    shown: ['= 1.5 + 7.35 = 8.85$ m above the ground']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: landing-time
    where: 'worked example, step "Landing": t = (12 + √(144 + 29.4))/9.8'
    inputs: {x0: 1.5 m, v0: 12 m/s, g: 9.8 m/s**2}
    formula: (v0 + sqrt(v0**2 + 2 * g * x0)) / g
    expected: 2.57 s
    shown: ['\dfrac{12 + \sqrt{144 + 29.4}}{9.8} = 2.57$ s']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: landing-speed
    where: 'worked example, step "Speed at the ground": v = 12 − 9.8(2.57) = −13.2 m/s'
    inputs: {x0: 1.5 m, v0: 12 m/s, g: 9.8 m/s**2}
    formula: v0 - g * (v0 + sqrt(v0**2 + 2 * g * x0)) / g
    expected: -13.2 m/s
    shown: ['$v = 12 - 9.8(2.57) = -13.2\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: integrated-velocity
    where: 'worked example "From acceleration to position", step "Evaluate at t = 2 s": v(2) = 9 m/s'
    inputs: {}
    formula: 1 + integrate('6 * x - 2', 'x', 0, 2)
    expected: '9'
    tolerance: '1e-6'
    shown: ['$v(2) = 1 + 12 - 4 = 9\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: integrated-position
    where: 'worked example, step "Evaluate at t = 2 s": x(2) = 6 m'
    inputs: {}
    formula: integrate('1 - 2 * x + 3 * x**2', 'x', 0, 2)
    expected: '6'
    tolerance: '1e-6'
    shown: ['$x(2) = 2 - 4 + 8 = 6$ m']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: constant-acceleration-position
    kind: identity
    where: 'formula for constant acceleration: x = x0 + v0 t + ½at² has second derivative a'
    formula: deriv('x0 + v0 * x + a * x**2 / 2', 'x', t, 2)
    equals: a
    samples: {t: [0.5, 2, 3], x0: [1, 0, -2], v0: [12, 3, 0], a: [-9.8, 2, 4]}
    tolerance: 1e-5
    shown: ['$x = x_0 + v_0 t + \tfrac12 a t^2$']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: mit

  - id: quiz-car
    where: 'quiz 2: ½ a t² with a = 2 m/s², t = 5 s'
    inputs: {a: 2 m/s**2, t: 5 s}
    formula: a * t**2 / 2
    expected: 25 m
    shown: ['\\tfrac12 (2)(5)^2 = 25\\ \\text{m}$']
    quiz: 2
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own
