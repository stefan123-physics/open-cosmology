# Calculations on content/year-1/8.01/massive-rope.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 13 (segments 13.1–13.6) and Course Notes Chapter 8 (Example 8.4, Section 8.5.2, Example 8.11), with the page's own numbers.

page: content/year-1/8.01/massive-rope.mdx
calcs:
  - id: trees-solution
    kind: identity
    where: 'formula "Tensions at the end and the middle": T_mid = T_end sin θ with T_end = mg/(2 cos θ) gives (mg/2) tan θ'
    formula: m * g / (2 * cos(th)) * sin(th)
    equals: m * g / 2 * tan(th)
    samples: {m: [2.0, 0.5, 1.0], g: [9.81, 1.0, 9.81], th: [0.3, 1.0, 1.4]}
    tolerance: 1e-9
    shown: ['T_\text{mid} = \frac{mg}{2}\,\tan\theta']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: chain-end
    where: 'worked example "A heavy chain", step "At the ends"'
    inputs: {m: 2.0 kg, g: 9.81 m/s**2}
    formula: m * g / (2 * cos(60 * pi / 180))
    expected: 19.6 N
    shown: ['$T_\text{end} = 2.0 \times 9.81/(2\cos 60^\circ) = 19.62/1.0 \approx 19.6$ N']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: chain-mid
    where: 'worked example "A heavy chain", step "At the middle"'
    inputs: {m: 2.0 kg, g: 9.81 m/s**2}
    formula: m * g / 2 * tan(60 * pi / 180)
    expected: 17.0 N
    shown: ['\approx 9.81 \times 1.732 \approx 17.0$ N']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: tan60
    where: 'worked example "A heavy chain": tan 60° ≈ 1.732'
    inputs: {}
    formula: tan(60 * pi / 180)
    expected: '1.732'
    shown: ['9.81 \times 1.732']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: chain-80
    where: 'worked example "A heavy chain", step "Pulled tighter": 9.81 × tan 80° ≈ 55.6 N'
    inputs: {m: 2.0 kg, g: 9.81 m/s**2}
    formula: m * g / 2 * tan(80 * pi / 180)
    expected: 55.6 N
    shown: ['$T_\text{mid} = 9.81 \times \tan 80^\circ \approx 55.6$ N']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: chain-80-ratio
    where: 'worked example "A heavy chain": more than five times its half-weight (tan 80° ≈ 5.67)'
    inputs: {}
    formula: tan(80 * pi / 180)
    expected: '5.67'
    shown: ['more than five times its own half-weight']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: hanging-rope-ode
    kind: identity
    where: 'formula "Tension in a hanging rope": T(x) = mg(1 − x/l) solves dT/dx = −mg/l with T(0) = mg'
    formula: deriv('m * g * (1 - x / l)', 'x', x0) + m * g / l
    equals: 0 * x0
    samples: {m: [3.0, 0.7], g: [9.81, 1.0], l: [2.0, 5.0], x0: [0.3, 1.1]}
    tolerance: 1e-6
    shown: ['T(x) = \frac{l - x}{l}\,mg = \left(1 - \frac{x}{l}\right) mg']
    source: {cite: reading3, at: 'pp. 1–2, 4, 6'}
    origin: mit

  - id: quiz-quarter
    where: 'quiz 1: T(l/4) = 3mg/4'
    inputs: {}
    formula: 1 - 1 / 4
    expected: '0.75'
    shown: ['at $x = l/4$ the rope below weighs $\\tfrac34 mg$']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: plot-top
    where: 'graph caption: top tension mg = 29.4 N for m = 3.0 kg'
    inputs: {m: 3.0 kg, g: 9.81 m/s**2}
    formula: m * g
    expected: 29.4 N
    shown: ['With m = 3.0 kg the top tension is 29.4 N']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: plot-half-uniform
    where: 'graph caption: 14.7 N halfway down the uniform rope'
    inputs: {m: 3.0 kg, g: 9.81 m/s**2}
    formula: m * g * (1 - 1.0 / 2.0)
    expected: 14.7 N
    shown: ['halfway down it is 14.7 N for the uniform rope']
    source: {cite: reading3, at: 'p. 6'}
    origin: page-own

  - id: taper-total-mass
    kind: identity
    where: 'worked example "A rope that gets thinner": λ(x) = 2m(l − x)/l² has total mass m'
    formula: 2 * m / l**2 * (l * l - l**2 / 2)
    equals: m
    samples: {m: [3.0, 0.4], l: [2.0, 7.0]}
    tolerance: 1e-9
    shown: ['with linear density $\lambda(x) = 2m(l - x)/l^2$']
    source: {cite: reading3, at: 'p. 7'}
    origin: page-own

  - id: taper-ode
    kind: identity
    where: 'worked example "A rope that gets thinner": T(x) = mg(l − x)²/l² solves dT/dx = −λ(x) g'
    formula: deriv('m * g * (l - x)**2 / l**2', 'x', x0) + 2 * m * (l - x0) / l**2 * g
    equals: 0 * x0
    samples: {m: [3.0, 0.4], g: [9.81, 1.0], l: [2.0, 7.0], x0: [0.5, 1.5]}
    tolerance: 1e-6
    shown: ['$T(x) = g\int_x^l \lambda(x'')\,dx'' = mg\,(l - x)^2/l^2$']
    source: {cite: reading3, at: 'p. 7'}
    origin: page-own

  - id: taper-half
    where: 'worked example "A rope that gets thinner", step "Halfway down" and graph caption: 7.36 N'
    inputs: {m: 3.0 kg, g: 9.81 m/s**2}
    formula: m * g * (1.0 / 2.0)**2
    expected: 7.36 N
    shown: ['$T(1.0\ \text{m}) = 3.0 \times 9.81 \times (1.0/2.0)^2 \approx 7.36$ N', '7.36 N for the tapering one']
    source: {cite: reading3, at: 'p. 7'}
    origin: page-own

  - id: taper-uniform-compare
    where: 'worked example "A rope that gets thinner": half the 14.7 N of a uniform rope'
    inputs: {m: 3.0 kg, g: 9.81 m/s**2}
    formula: m * g / 2
    expected: 14.7 N
    shown: ['half the 14.7 N of a uniform rope']
    source: {cite: reading3, at: 'p. 6'}
    origin: page-own

  - id: cable-lambda
    where: 'worked example "A hanging cable", step "Linear density": λ = ρA = 1.6 kg/m'
    inputs: {rho: 8000 kg/m**3, A: 2.0 cm**2}
    formula: rho * A
    expected: 1.6 kg/m
    shown: ['$\lambda = \rho A = 8000 \times 2.0 \times 10^{-4} = 1.6$ kg/m']
    source: {cite: reading5, at: 'p. 1'}
    origin: page-own

  - id: cable-top
    where: 'worked example "A hanging cable", step "Tension at the top": λLg ≈ 1570 N'
    inputs: {lam: 1.6 kg/m, L: 100 m, g: 9.81 m/s**2}
    formula: lam * L * g
    expected: 1570 N
    tolerance: 2 N
    shown: ['$T = \lambda L g = 1.6 \times 100 \times 9.81 \approx 1570$ N']
    source: {cite: reading3, at: 'p. 6'}
    origin: page-own

  - id: capstan-solution
    kind: identity
    where: 'formula "Capstan equation": T = T_A e^(−μs θ) solves dT/dθ = −μs T'
    formula: deriv('TA * exp(-mu * th)', 'th', t0) + mu * TA * exp(-mu * t0)
    equals: 0 * t0
    samples: {TA: [5000.0, 1.0], mu: [0.3, 0.25], t0: [0.5, 6.0]}
    tolerance: 1e-5
    shown: ['T_B = T_A\,e^{-\mu_s \theta_{BA}}']
    source: {cite: reading1, at: 'Eqs. (8.6.102), (8.6.108), p. 8-49'}
    origin: mit

  - id: capstan-one-turn
    where: 'capstan graph caption: one turn with μs = 0.30 needs 15% of the load'
    inputs: {}
    formula: exp(-0.30 * 2 * pi)
    expected: '0.15'
    tolerance: 0.005
    shown: ['one turn needs 15% of the load']
    source: {cite: reading1, at: 'Eq. (8.6.108), p. 8-49'}
    origin: page-own

  - id: capstan-three-turns-percent
    where: 'capstan graph caption: three turns need 0.35%'
    inputs: {}
    formula: exp(-0.30 * 6 * pi) * 100
    expected: '0.35'
    shown: ['three turns only 0.35%']
    source: {cite: reading1, at: 'Eq. (8.6.108), p. 8-49'}
    origin: page-own

  - id: bollard-angle
    where: 'worked example "Three turns", step "Angle of wrap": 6π ≈ 18.85 rad, μs θ ≈ 5.65'
    inputs: {}
    formula: 6 * pi
    expected: '18.85'
    shown: ['$\theta = 3 \times 2\pi \approx 18.85$ rad']
    source: {cite: reading1, at: 'p. 8-49'}
    origin: page-own

  - id: bollard-exponent
    where: 'worked example "Three turns": μs θ ≈ 5.65'
    inputs: {}
    formula: 0.30 * 6 * pi
    expected: '5.65'
    tolerance: 0.006
    shown: ['so $\mu_s\theta \approx 5.65$']
    source: {cite: reading1, at: 'p. 8-49'}
    origin: page-own

  - id: bollard-factor
    where: 'worked example "Three turns": e^(−5.65) ≈ 0.00350'
    inputs: {}
    formula: exp(-0.30 * 6 * pi)
    expected: '0.00350'
    shown: ['5000 \times 0.00350']
    source: {cite: reading1, at: 'Eq. (8.6.108), p. 8-49'}
    origin: page-own

  - id: bollard-force
    where: 'worked example "Three turns", step "Holding force": 17.5 N'
    inputs: {TA: 5000 N}
    formula: TA * exp(-0.30 * 6 * pi)
    expected: 17.5 N
    shown: ['\approx 17.5$ N: about the weight of a 1.8 kg bag']
    source: {cite: reading1, at: 'Eq. (8.6.108), p. 8-49'}
    origin: page-own

  - id: bollard-bag
    where: 'worked example "Three turns": 17.5 N is the weight of about 1.8 kg'
    inputs: {F: 17.5 N, g: 9.81 m/s**2}
    formula: F / g
    expected: 1.8 kg
    tolerance: 0.05 kg
    shown: ['about the weight of a 1.8 kg bag']
    source: {cite: reading1, at: 'p. 8-49'}
    origin: page-own

  - id: quiz-two-turns
    where: 'quiz 4: two turns with μs = 0.25 give e^π ≈ 23'
    inputs: {}
    formula: exp(0.25 * 4 * pi)
    expected: '23'
    tolerance: 0.5
    shown: ['$e^{\\mu_s\\theta} = e^{0.25 \\times 4\\pi} = e^{\\pi} \\approx 23$']
    quiz: 3
    source: {cite: reading1, at: 'Eq. (8.6.108), p. 8-49'}
    origin: page-own
