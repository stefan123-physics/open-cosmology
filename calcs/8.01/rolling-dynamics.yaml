# Calculations on content/year-1/8.01/rolling-dynamics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 36 (segments 36.1–36.5) and Course Notes Chapter 21, with the page's own numbers.

page: content/year-1/8.01/rolling-dynamics.mdx
calcs:
  - id: incline-a
    kind: identity
    where: 'formula "Acceleration down the incline": solves the three equations'
    formula: m * g * sin(p) - I / R**2 * (m * g * sin(p) / (m + I / R**2))
    equals: m * (m * g * sin(p) / (m + I / R**2))
    samples: {m: [1.0, 3.0], g: [9.8, 9.8], p: [0.3, 0.6], I: [0.02, 0.5], R: [0.1, 0.4]}
    tolerance: 1e-9
    shown: ['a_x = \frac{mg\sin\phi}{m + I_{\text{cm}}/R^2}']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: incline-v
    kind: identity
    where: 'formula "Speed at the bottom": v² = 2 (h/sin φ) a'
    formula: 2 * (h / sin(p)) * (m * g * sin(p) / (m + I / R**2))
    equals: 2 * m * g * h / (m + I / R**2)
    samples: {m: [1.0, 3.0], g: [9.8, 9.8], p: [0.3, 0.6], I: [0.02, 0.5], R: [0.1, 0.4], h: [1.0, 2.5]}
    tolerance: 1e-9
    shown: ['v_{\text{cm}} = \sqrt{\frac{2mgh}{m + I_{\text{cm}}/R^2}}']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: yoyo-formula
    kind: identity
    where: 'formula "Pull and friction on the yo-yo": satisfies f_s R − bF = I a/R with a = (F − f_s)/m'
    formula: f * R - b * (f * (R + I / (m * R)) / (b + I / (m * R)))
    equals: I / R * ((f * (R + I / (m * R)) / (b + I / (m * R))) - f) / m
    samples: {f: [0.5, 1.0], R: [0.05, 0.1], b: [0.02, 0.03], I: [0.00025, 0.001], m: [0.2, 0.5]}
    tolerance: 1e-9
    shown: ['F = f_s\,\frac{R + I_{\text{cm}}/(mR)}{b + I_{\text{cm}}/(mR)}']
    source: {cite: reading4, at: 'p. 2'}
    origin: mit

  - id: sphere-a
    where: 'worked example (a): sphere 4.9/1.4 = 3.5 m/s²'
    inputs: {g: 9.8 m/s^2}
    formula: g * sin(pi / 6) / (1 + 2 / 5)
    expected: 3.5 m/s^2
    shown: ['$\frac{4.9}{1.4} = 3.5$ m/s²']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: cylinder-a
    where: 'worked example (a) and quiz 4: cylinder 4.9/1.5 ≈ 3.27 m/s²'
    inputs: {g: 9.8 m/s^2}
    formula: g * sin(pi / 6) / (1 + 1 / 2)
    expected: 3.27 m/s^2
    shown: ['$\frac{4.9}{1.5} \approx 3.27$ m/s²']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: hoop-a
    where: 'same: hoop 2.45 m/s²'
    inputs: {g: 9.8 m/s^2}
    formula: g * sin(pi / 6) / 2
    expected: 2.45 m/s^2
    shown: ['Hoop (1): $2.45$ m/s²']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: cylinder-mu
    where: 'same: μ_s ≥ (½ a)/(g cos 30°) ≈ 0.19 = tan 30°/3'
    inputs: {}
    formula: tan(pi / 6) / 3
    expected: '0.19'
    tolerance: '2%'
    shown: ['so $\mu_s \ge 0.19$']
    source: {cite: reading1, at: 'Eq. (21.6.47), p. 21-18'}
    origin: page-own

  - id: cylinder-normal
    where: 'same: g cos 30° ≈ 8.49 m/s² (normal force per unit mass)'
    inputs: {}
    formula: 9.8 * cos(pi / 6)
    expected: '8.49'
    shown: ['$mg\cos 30° \approx 8.49\,m$']
    source: {cite: reading1, at: 'Eq. (21.6.38), Example 21.4'}
    origin: page-own

  - id: yoyo-fmax
    where: 'worked example (b): F_max ≈ 1.31 N'
    inputs: {mu: 0.40, m: 0.20 kg, g: 9.8 m/s^2, R: 0.050 m, b: 0.020 m}
    formula: mu * m * g * (R + R / 2) / (b + R / 2)
    expected: 1.31 N
    tolerance: '1%'
    shown: ['\approx 0.784 \times 1.67 \approx 1.31$ N']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: yoyo-a
    where: 'same: a = (1.31 − 0.784)/0.20 ≈ 2.6 m/s²'
    inputs: {F: 1.3067 N, f: 0.784 N, m: 0.20 kg}
    formula: (F - f) / m
    expected: 2.6 m/s^2
    tolerance: '2%'
    shown: ['\approx 2.6$ m/s²']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own
