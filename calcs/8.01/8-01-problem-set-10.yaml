    where: 'Problem 4(a), answer box N2: against a numerical solve of the torque balance about the downhill foot'
    formula: m*g*(cos(alpha)/2 - h*sin(alpha)/d)
    equals: solve('x*d - m*g*cos(alpha)*d/2 + m*g*sin(alpha)*h', 'x', -5000, 5000)
    samples:
      m: [50, 90, 70]
      g: [9, 10, 9.8]
      alpha: [0.1, 0.4, 0.3491]
      h: [0.8, 1.1, 1.0]
      d: [1.0, 1.5, 0.80]
    tolerance: 1e-7
    shown: ['N_2 = m g\left(\tfrac12\cos\alpha - \frac{h}{d}\sin\alpha\right)']
    source: {cite: reading3, at: 'Example 18.3, Eq. (18.4.14), p. 18-11'}
    origin: mit

