  # ---- Problem 6

  # (a) The acceleration against a numerical solve of the equations of motion with T and α eliminated:
  # m g sin β − m a = T, T R = ½ mp R² α, a = R α.
  - id: p6-a-by-solve
    kind: identity
    answer: p6-a
    where: 'Problem 6(a), answer box and formula "Incline: acceleration of the block": against a numerical solve of the equations of motion'
    formula: m*g*sin(beta)/(m + mp/2)
    equals: solve('m*g*sin(beta) - m*x - (mp*R**2/2)*x/R**2', 'x', 0, 20)
    samples:
      m: [0.5, 3, 2.0, 1]
      mp: [1, 5, 4.0, 0.2]
      g: [9, 10, 9.8, 9.8]
      beta: [0.2, 1.2, 0.5236, 1.5708]
      R: [0.05, 0.5, 0.1, 0.3]
    tolerance: 1e-7
    shown: ['a = \frac{m g\sin\beta}{m + \tfrac12 m_p}']
    source: {cite: mit, at: 'Problem 6 (our own solution)'}
    origin: page-own

  # (b) The time against the notes' energy result, Eq. (16.3.15) with m1 = 0 and m2 = m, and t = 2d/v.
  - id: p6-b-by-energy
    kind: identity
    answer: p6-b
    where: 'Problem 6(b), answer box and formula "Incline: time to slide the distance d": against the energy result of the notes (Eq. (16.3.15) with m1 = 0), with t = 2d/v'
    formula: sqrt(d*(2*m + mp)/(m*g*sin(beta)))
    equals: 2*d/sqrt(2*g*d*(-0 + m*sin(beta))/(0 + m + mp/2))
    samples:
      m: [0.5, 3, 2.0, 1]
      mp: [1, 5, 4.0, 0.2]
      g: [9, 10, 9.8, 9.8]
      beta: [0.2, 1.2, 0.5236, 1.5708]
      d: [0.5, 3, 1.0, 2]
    tolerance: 1e-10
    shown: ['= \sqrt{\frac{d\,(2m + m_p)}{m g\sin\beta}}']
    source: {cite: reading1, at: 'Example 16.4, Eq. (16.3.15), p. 16-14'}
    origin: page-own

