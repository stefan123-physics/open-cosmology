# Calculations on content/year-1/8.01/8-01-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# a numerical integral of r² dm, a numerical solve of the equations of motion or of the torque balance
# about another point, or energy conservation. Problems 3 and 4 can also be compared with MIT's course
# notes, Examples 18.2 and 18.3.

page: content/year-1/8.01/8-01-problem-set-10.mdx
calcs:
  # ---- Problem 1

  # (a)(i) The disc against the numerical integral over rings.
  - id: p1-a1-by-integration
    kind: identity
    answer: p1-a1
    where: 'Problem 1(a)(i), answer box and formula "Uniform disc about the axis through its centre": against the numerical integral over rings'
    formula: M*R**2/2
    equals: integrate('2*M/R**2*r**3', 'r', 0, R)
    samples:
      M: [1, 5, 2.5]
      R: [0.2, 2, 0.7]
    tolerance: 1e-9
    shown: ['= \frac12\,M R^2']
    source: {cite: reading1, at: 'Example 16.2, Eq. (16.2.11), p. 16-9'}
    origin: mit

  # (a)(ii) The rim axis without the parallel axis theorem: polar coordinates centred on the rim point,
  # where the disc is r < 2R cos x for −π/2 < x < π/2, so I = σ ∫ (2R cos x)⁴/4 dx with σ = M/(πR²).
  - id: p1-a2-by-integration
    kind: identity
    answer: p1-a2
    where: 'Problem 1(a)(ii), answer box and formula "Uniform disc about an axis through its rim": against a direct integral in polar coordinates centred on the rim point'
    formula: 3*M*R**2/2
    equals: integrate('M/(pi*R**2)*4*R**4*cos(x)**4', 'x', -pi/2, pi/2)
    samples:
      M: [1, 5, 2.5]
      R: [0.2, 2, 0.7]
    tolerance: 1e-9
    shown: ['= \tfrac32\,M R^2']
    source: {cite: reading1, at: 'Example 16.3, Eq. (16.2.20), p. 16-11'}
    origin: mit

  - id: p1-given-washer
    kind: fact
    where: 'Problem 1(b), statement: the washer'
    shown: ['$r_i = 13.5$ mm', '$r_o = 31.0$ mm', '$d = 4.0$ mm', '$\rho = 7.8 \times 10^3\ \text{kg/m}^3$']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: mit

  - id: p1-example-typing
    kind: fact
    where: 'Problem 1(b), statement: how to type the answer (an example value, not a result)'
    shown: ['for $2.5 \times 10^{-5}\ \text{kg}\,\text{m}^2$ you would type 2.5']
    source: {cite: mit, at: 'Problem 1(b) (our own instruction)'}
    origin: page-own

  - id: p1-washer-formula
    kind: identity
    where: 'Problem 1(b), formula "Washer about the axis through its centre": against the numerical integral over rings'
    formula: 0.5*pi*rho*d*(ro**4 - ri**4)
    equals: integrate('r**2*rho*d*2*pi*r', 'r', ri, ro)
    samples:
      rho: [7800, 2700, 1000]
      d: [0.004, 0.01, 0.002]
      ri: [0.0135, 0.02, 0.0]
      ro: [0.031, 0.05, 0.1]
    tolerance: 1e-9
    shown: ['= \tfrac12\,\pi\,\rho\,d\,\bigl(r_o^4 - r_i^4\bigr)']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-washer-inertia
    answer: p1-b
    where: 'Problem 1(b), answer box: moment of inertia of the washer, in units of 10⁻⁵ kg m²'
    formula: 0.5 * pi * 7800 * 0.004 * (0.031**4 - 0.0135**4) * 1e5
    expected: '4.36'
    shown: ['= 4.36 \times 10^{-5}\ \text{kg}\,\text{m}^2']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-metres
    kind: fact
    where: 'Problem 1(b), numbers: the given lengths in metres'
    shown: ['$r_i = 0.0135$ m, $r_o = 0.0310$ m and $d = 0.0040$ m']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: mit

  - id: p1-ro4
    where: 'Problem 1(b), numbers: fourth power of the outer radius'
    inputs: {ro: 0.0310 m}
    formula: ro**4
    expected: 9.235e-7 m**4
    shown: ['$r_o^4 = 9.235 \times 10^{-7}\ \text{m}^4$']
    source: {cite: mit, at: 'Problem 1(b) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-ri4
    where: 'Problem 1(b), numbers: fourth power of the inner radius'
    inputs: {ri: 0.0135 m}
    formula: ri**4
    expected: 0.332e-7 m**4
    shown: ['$r_i^4 = 0.332 \times 10^{-7}\ \text{m}^4$']
    source: {cite: mit, at: 'Problem 1(b) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-difference
    where: 'Problem 1(b), numbers: difference of the fourth powers'
    inputs: {ro: 0.0310 m, ri: 0.0135 m}
    formula: ro**4 - ri**4
    expected: 8.903e-7 m**4
    shown: ['the difference $8.903 \times 10^{-7}\ \text{m}^4$']
    source: {cite: mit, at: 'Problem 1(b) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-prefactor
    where: 'Problem 1(b), numbers: the factor ½ π ρ d'
    inputs: {rho: 7.8e3 kg/m**3, d: 0.0040 m}
    formula: 0.5 * pi * rho * d
    expected: 49.0 kg/m**2
    shown: ['$\tfrac12 \pi \times 7.8 \times 10^3 \times 0.0040 = 49.0\ \text{kg/m}^2$']
    source: {cite: mit, at: 'Problem 1(b) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-product
    where: 'Problem 1(b), formula "Washer: the number"'
    inputs: {A: 49.0 kg/m**2, D: 8.903e-7 m**4}
    formula: A * D
    expected: 4.36e-5 kg*m**2
    shown: ['I_{\text{cm}} = 49.0 \times 8.903 \times 10^{-7} = 4.36 \times 10^{-5}\ \text{kg}\,\text{m}^2']
    source: {cite: mit, at: 'Problem 1(b) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-full-disc-mass
    where: 'Problem 1(b), check: mass of a full disc of radius r_o'
    inputs: {rho: 7.8e3 kg/m**3, ro: 0.0310 m, d: 0.0040 m}
    formula: rho * pi * ro**2 * d
    expected: 0.0942 kg
    shown: ['$\rho\,\pi r_o^2 d = 0.0942$ kg']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-full-disc-inertia
    where: 'Problem 1(b), check: moment of inertia of the full disc'
    inputs: {m: 0.0942 kg, ro: 0.0310 m}
    formula: 0.5 * m * ro**2
    expected: 4.526e-5 kg*m**2
    shown: ['$\tfrac12 \times 0.0942 \times 0.0310^2 = 4.526 \times 10^{-5}\ \text{kg}\,\text{m}^2$']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-hole-mass
    where: 'Problem 1(b), check: mass of the missing disc of radius r_i'
    inputs: {rho: 7.8e3 kg/m**3, ri: 0.0135 m, d: 0.0040 m}
    formula: rho * pi * ri**2 * d
    expected: 0.0179 kg
    shown: ['The missing disc has the mass $0.0179$ kg']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-hole-inertia
    where: 'Problem 1(b), check: moment of inertia of the missing disc'
    inputs: {m: 0.0179 kg, ri: 0.0135 m}
    formula: 0.5 * m * ri**2
    expected: 0.163e-5 kg*m**2
    shown: ['$\tfrac12 \times 0.0179 \times 0.0135^2 = 0.163 \times 10^{-5}\ \text{kg}\,\text{m}^2$']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-difference-of-discs
    where: 'Problem 1(b), check: full disc minus missing disc, in units of 10⁻⁵ kg m²'
    formula: 4.526 - 0.163
    expected: '4.36'
    shown: ['The difference is $4.36 \times 10^{-5}\ \text{kg}\,\text{m}^2$, the same']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-hole-mass-share
    where: 'Problem 1(b), check: share of the mass of the full disc that the hole takes away, in per cent'
    formula: 0.0135**2 / 0.031**2 * 100
    expected: '19'
    shown: ['The hole takes away 19% of the mass of the full disc']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  # The share is 3.6%; the page says "less than 4%".
  - id: p1-hole-inertia-share
    where: 'Problem 1(b), check: share of the moment of inertia of the full disc that the hole takes away, in per cent (3.6, printed as "less than 4%")'
    formula: 0.0135**4 / 0.031**4 * 100
    expected: '3.6'
    shown: ['but less than 4% of its moment of inertia']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-washer-mass
    where: 'Problem 1(b), check: mass of the washer'
    inputs: {mf: 0.0942 kg, mh: 0.0179 kg}
    formula: mf - mh
    expected: 0.0763 kg
    shown: ['$0.0942 - 0.0179 = 0.0763$ kg, about 76 grams']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-washer-by-mass
    kind: identity
    where: 'Problem 1(b), check: the form ½ m (r_o² + r_i²) with m the mass of the washer'
    formula: 0.5*pi*rho*d*(ro**4 - ri**4)
    equals: 0.5*(rho*pi*(ro**2 - ri**2)*d)*(ro**2 + ri**2)
    samples:
      rho: [7800, 2700, 1000]
      d: [0.004, 0.01, 0.002]
      ri: [0.0135, 0.02, 0.0]
      ro: [0.031, 0.05, 0.1]
    tolerance: 1e-12
    shown: ['$I_{\text{cm}} = \tfrac12\,m\,(r_o^2 + r_i^2)$']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  # ---- Problem 2

  # (a) The wheel against the numerical integrals over the rings of both discs.
  - id: p2-a-by-integration
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Moment of inertia of the wheel": against the numerical integrals over the rings of the two discs'
    formula: M1*R**2/2 + M2*R**2/8
    equals: integrate('2*M1/R**2*r**3', 'r', 0, R) + integrate('2*M2/(R/2)**2*r**3', 'r', 0, R/2)
    samples:
      M1: [1, 5, 4.0]
      M2: [1, 5, 2.0]
      R: [0.2, 1, 0.5]
    tolerance: 1e-9
    shown: ['= \tfrac12\,M_1 R^2 + \tfrac18\,M_2 R^2']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # (b) The acceleration against a numerical solve of the three equations with T and α eliminated:
  # Mb g − Mb a = T, T (R/2) = I α, a = (R/2) α. R is in the equations and drops out of the result.
  - id: p2-b-by-solve
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "Compound pulley: acceleration of the block": against a numerical solve of the equations of motion'
    formula: Mb*g/(Mb + 2*M1 + M2/2)
    equals: solve('Mb*g - Mb*x - (M1*R**2/2 + M2*R**2/8)*x/(R/2)**2', 'x', 0, 20)
    samples:
      M1: [1, 5, 4.0, 3]
      M2: [1, 5, 2.0, 0.5]
      Mb: [0.5, 3, 1.0, 2]
      g: [9, 10, 9.8, 9.8]
      R: [0.2, 1, 0.5, 0.05]
    tolerance: 1e-7
    shown: ['a = \frac{M_b\,g}{M_b + 2 M_1 + \tfrac12 M_2}']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # (c) The time against energy conservation: Mb g d = ½ (Mb + I/(R/2)²) v², and for a constant
  # acceleration from rest the average speed is v/2, so t = 2d/v.
  - id: p2-c-by-energy
    kind: identity
    answer: p2-c
    where: 'Problem 2(c), answer box and formula "Compound pulley: time to fall the distance d": against energy conservation, with t = 2d/v'
    formula: sqrt(d*(2*Mb + 4*M1 + M2)/(Mb*g))
    equals: 2*d/sqrt(2*Mb*g*d/(Mb + (M1*R**2/2 + M2*(R/2)**2/2)/(R/2)**2))
    samples:
      M1: [1, 5, 4.0, 3]
      M2: [1, 5, 2.0, 0.5]
      Mb: [0.5, 3, 1.0, 2]
      g: [9, 10, 9.8, 9.8]
      d: [0.5, 3, 1.0, 2]
      R: [0.2, 1, 0.5, 0.05]
    tolerance: 1e-10
    shown: ['= \sqrt{\frac{d\,(2M_b + 4M_1 + M_2)}{M_b\,g}}']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-example-given
    kind: fact
    where: 'Problem 2(c), check: our own example values'
    shown: ['$M_1 = 4.0$ kg, $M_2 = 2.0$ kg, $M_b = 1.0$ kg and $d = 1.0$ m']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-acceleration
    where: 'Problem 2(c), check: acceleration for M1 = 4.0 kg, M2 = 2.0 kg, Mb = 1.0 kg'
    inputs: {M1: 4.0 kg, M2: 2.0 kg, Mb: 1.0 kg, g: 9.8 m/s**2}
    formula: Mb * g / (Mb + 2 * M1 + M2 / 2)
    expected: 0.98 m/s**2
    shown: ['$9.8/(1.0 + 8.0 + 1.0) = 0.98\ \text{m/s}^2$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-time
    where: 'Problem 2(c), check: time to fall 1.0 m'
    inputs: {d: 1.0 m, a: 0.98 m/s**2}
    formula: sqrt(2 * d / a)
    expected: 1.43 s
    shown: ['$t = \sqrt{2 \times 1.0/0.98} = 1.43$ s']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-time-by-formula
    where: 'Problem 2(c), check: the same time from the answer formula'
    inputs: {M1: 4.0 kg, M2: 2.0 kg, Mb: 1.0 kg, g: 9.8 m/s**2, d: 1.0 m}
    formula: sqrt(d * (2 * Mb + 4 * M1 + M2) / (Mb * g))
    expected: 1.43 s
    shown: ['= 1.43$ s']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-free-fall
    where: 'Problem 2(c), check: time of a free fall over 1.0 m'
    inputs: {d: 1.0 m, g: 9.8 m/s**2}
    formula: sqrt(2 * d / g)
    expected: 0.45 s
    shown: ['In free fall the block would take $0.45$ s']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-v2
    where: 'Problem 2(c), check: square of the final speed'
    inputs: {a: 0.98 m/s**2, d: 1.0 m}
    formula: 2 * a * d
    expected: 1.96 m**2/s**2
    shown: ['$v^2 = 2 a d = 1.96\ \text{m}^2/\text{s}^2$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-block-energy
    where: 'Problem 2(c), check: kinetic energy of the block'
    inputs: {Mb: 1.0 kg, v2: 1.96 m**2/s**2}
    formula: 0.5 * Mb * v2
    expected: 0.98 J
    shown: ['$0.5 \times 1.0 \times 1.96 = 0.98$ J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-effective-mass
    where: 'Problem 2(c), check: the extra mass 2 M1 + ½ M2 of the wheel'
    inputs: {M1: 4.0 kg, M2: 2.0 kg}
    formula: 2 * M1 + M2 / 2
    expected: 9.0 kg
    shown: ['0.5 \times 9.0 \times 1.96']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-wheel-energy
    where: 'Problem 2(c), check: kinetic energy of the wheel'
    inputs: {Me: 9.0 kg, v2: 1.96 m**2/s**2}
    formula: 0.5 * Me * v2
    expected: 8.82 J
    shown: ['= 0.5 \times 9.0 \times 1.96 = 8.82$ J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-total-energy
    where: 'Problem 2(c), check: block and wheel together'
    inputs: {Kb: 0.98 J, Kw: 8.82 J}
    formula: Kb + Kw
    expected: 9.8 J
    shown: ['Together that is $9.8$ J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-potential-energy
    where: 'Problem 2(c), check: potential energy lost by the block'
    inputs: {Mb: 1.0 kg, g: 9.8 m/s**2, d: 1.0 m}
    formula: Mb * g * d
    expected: 9.8 J
    shown: ['$M_b\,g\,d = 1.0 \times 9.8 \times 1.0$ J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-wheel-share
    where: 'Problem 2(c), check: share of the energy that went into the wheel'
    inputs: {Kw: 8.82 J, E: 9.8 J}
    formula: Kw / E
    expected: '0.9'
    shown: ['Nine tenths of the energy went into the wheel']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-tenth
    where: 'Problem 2(c), check: the acceleration as a share of g'
    inputs: {a: 0.98 m/s**2, g: 9.8 m/s**2}
    formula: a / g
    expected: '0.1'
    shown: ['a tenth of $g$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-given
    kind: fact
    where: 'Problem 3, statement: the rod and the cable'
    shown: ['length $L = 2.0$ m and mass $m = 4.0$ kg', 'the angle $\beta = 30°$ with the rod']
    source: {cite: mit, at: 'Problem 3, p. 3'}
    origin: mit

  - id: p3-tension
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "Rod: the tension"'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2}
    formula: m * g / (2 * sin(pi/6))
    expected: 39.2 N
    shown: ['T = \frac{4.0 \times 9.8}{2 \sin 30°} = 39.2\ \text{N}']
    source: {cite: reading3, at: 'Example 18.2, Eq. (18.4.3), p. 18-9 (the notes give 39.2 N)'}
    origin: mit

  - id: p3-tension-up
    where: 'Problem 3(a), check: upward part of the tension'
    inputs: {T: 39.2 N}
    formula: T * sin(pi/6)
    expected: 19.6 N
    shown: ['$T\sin\beta = 19.6$ N']
    source: {cite: mit, at: 'Problem 3(a) (our own check)'}
    origin: page-own

  - id: p3-weight
    where: 'Problem 3(a), check: the weight of the rod'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 39.2 N
    shown: ['the weight $4.0 \times 9.8 = 39.2$ N']
    source: {cite: mit, at: 'Problem 3(a) (our own check)'}
    origin: page-own

  - id: p3-pivot-along
    where: 'Problem 3(b): component of the pivot force along the rod'
    inputs: {T: 39.2 N}
    formula: T * cos(pi/6)
    expected: 33.9 N
    shown: ['$F\cos\alpha = 39.2 \times \cos 30° = 33.9$ N']
    source: {cite: mit, at: 'Problem 3(b) (MIT''s numbers; the notes give the formula in Eq. (18.4.4))'}
    origin: page-own

  - id: p3-pivot-up
    where: 'Problem 3(b): upward component of the pivot force'
    inputs: {W: 39.2 N, Tup: 19.6 N}
    formula: W - Tup
    expected: 19.6 N
    shown: ['$F\sin\alpha = 39.2 - 19.6 = 19.6$ N']
    source: {cite: mit, at: 'Problem 3(b) (MIT''s numbers; the notes give the formula in Eq. (18.4.4))'}
    origin: page-own

  # The angle from the two force equations, with plain numbers (newtons): atan of the upward component
  # over the component along the rod, in degrees.
  - id: p3-pivot-angle
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "Rod: direction of the pivot force", in degrees'
    formula: atan((4.0 * 9.8 - 39.2 * sin(pi/6)) / (39.2 * cos(pi/6))) * 180 / pi
    expected: '30'
    tolerance: 0.01
    shown: ['\alpha = \beta = 30°']
    source: {cite: reading3, at: 'Example 18.2, p. 18-9 (the notes find α = β)'}
    origin: mit

  - id: p3-pivot-force
    answer: p3-c
    where: 'Problem 3(c), answer box: size of the pivot force from its exact components'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2}
    formula: sqrt((m * g / 2 / tan(pi/6))**2 + (m * g / 2)**2)
    expected: 39.2 N
    shown: ['The pivot force is as large as the tension']
    source: {cite: reading3, at: 'Example 18.2, Eq. (18.4.5), p. 18-9 (the notes give 39.2 N)'}
    origin: mit

  - id: p3-pivot-force-rounded
    where: 'Problem 3(c), formula "Rod: size of the pivot force": the same from the rounded components'
    inputs: {Fx: 33.9 N, Fy: 19.6 N}
    formula: sqrt(Fx**2 + Fy**2)
    expected: 39.2 N
    shown: ['\sqrt{33.9^2 + 19.6^2} = 39.2\ \text{N}']
    source: {cite: mit, at: 'Problem 3(c) (our own route)'}
    origin: page-own

  - id: p3-pivot-force-by-torque
    where: 'Problem 3(c), check: torques about the right end of the rod'
    inputs: {Fy: 19.6 N}
    formula: Fy / sin(pi/6)
    expected: 39.2 N
    shown: ['$F = 19.6/\sin 30° = 39.2$ N']
    source: {cite: reading3, at: 'Example 18.2, p. 18-9 (the alternative with torques about the right end)'}
    origin: page-own

  # ---- Problem 4

  # (a) N1 against the notes' route: torques about the centre of mass, (N1 − N2) d/2 = h (f1 + f2),
  # with f1 + f2 = m g sin α and N2 = m g cos α − N1, solved numerically.
  - id: p4-a1-by-solve
    kind: identity
    answer: p4-a1
    where: 'Problem 4(a), answer box N1 and formula "Hill: the two normal forces": against a numerical solve of the torque balance about the centre of mass'
    formula: m*g*(cos(alpha)/2 + h*sin(alpha)/d)
    equals: solve('(x - (m*g*cos(alpha) - x))*d/2 - h*m*g*sin(alpha)', 'x', 0, 5000)
    samples:
      m: [50, 90, 70]
      g: [9, 10, 9.8]
      alpha: [0.1, 0.4, 0.3491]
      h: [0.8, 1.1, 1.0]
      d: [1.0, 1.5, 0.80]
    tolerance: 1e-7
    shown: ['N_1 = m g\left(\tfrac12\cos\alpha + \frac{h}{d}\sin\alpha\right)']
    source: {cite: reading3, at: 'Example 18.3, Eq. (18.4.13), p. 18-11'}
    origin: mit

  # N2 against torques about the downhill foot: N2 d = m g cos α (d/2) − m g sin α h, solved numerically.
