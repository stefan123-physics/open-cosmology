  # ---- Problem 5

  - id: p5-given-angle
    kind: fact
    where: 'Problem 5, statement: the walls of the groove'
    shown: ['Each wall of the groove makes the angle $45°$ with the horizontal']
    source: {cite: mit, at: 'Problem 5, p. 5 (the drawing)'}
    origin: mit

  # (a) N1 against the force balance in level and vertical axes. Level: N1 − N2 − μ (N1 + N2) = 0 gives
  # N2 = N1 (1 − μ)/(1 + μ); vertical: (N1 + N2 + μ N1 − μ N2)/√2 = m g, solved numerically for N1.
  - id: p5-a1-by-solve
    kind: identity
    answer: p5-a1
    where: 'Problem 5(a), answer box N1 and formula "Groove: the two normal forces": against a numerical solve of the force balance in level and vertical axes'
    formula: m*g*(1 + mu)/(sqrt(2)*(1 + mu**2))
    equals: solve('(x + x*(1 - mu)/(1 + mu) + mu*(x - x*(1 - mu)/(1 + mu)))/sqrt(2) - m*g', 'x', 0, 1000)
    samples:
      m: [1, 5, 2.0]
      g: [9, 10, 9.8]
      mu: [0.1, 0.8, 0.30]
    tolerance: 1e-7
    shown: ['N_1 = \frac{m g\,(1 + \mu)}{\sqrt 2\,(1 + \mu^2)}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  # The same for N2, with N1 = N2 (1 + μ)/(1 − μ) from the level balance.
  - id: p5-a2-by-solve
    kind: identity
    answer: p5-a2
    where: 'Problem 5(a), answer box N2: against a numerical solve of the force balance in level and vertical axes'
    formula: m*g*(1 - mu)/(sqrt(2)*(1 + mu**2))
    equals: solve('(x*(1 + mu)/(1 - mu) + x + mu*(x*(1 + mu)/(1 - mu) - x))/sqrt(2) - m*g', 'x', 0, 1000)
    samples:
      m: [1, 5, 2.0]
      g: [9, 10, 9.8]
      mu: [0.1, 0.8, 0.30]
    tolerance: 1e-7
    shown: ['N_2 = \frac{m g\,(1 - \mu)}{\sqrt 2\,(1 + \mu^2)}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  # (b) The torque against μ R (N1 + N2), with both normal forces from the numerical solves above.
  - id: p5-b-by-solve
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "Groove: torque needed to keep the cylinder turning": against μ R (N1 + N2) with the normal forces solved numerically in level and vertical axes'
    formula: sqrt(2)*mu*m*g*R/(1 + mu**2)
    equals: mu*R*(solve('(x + x*(1 - mu)/(1 + mu) + mu*(x - x*(1 - mu)/(1 + mu)))/sqrt(2) - m*g', 'x', 0, 1000) + solve('(x*(1 + mu)/(1 - mu) + x + mu*(x*(1 + mu)/(1 - mu) - x))/sqrt(2) - m*g', 'x', 0, 1000))
    samples:
      m: [1, 5, 2.0]
      g: [9, 10, 9.8]
      mu: [0.1, 0.8, 0.30]
      R: [0.05, 0.5, 0.10]
    tolerance: 1e-7
    shown: ['\tau = \frac{\sqrt 2\,\mu\,m g R}{1 + \mu^2}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-level-balance
    kind: identity
    where: 'Problem 5(a), check: the level components of the five forces add up to zero (tested as N1 − N2 = μ (N1 + N2))'
    formula: m*g*(1 + mu)/(sqrt(2)*(1 + mu**2)) - m*g*(1 - mu)/(sqrt(2)*(1 + mu**2))
    equals: mu*(m*g*(1 + mu)/(sqrt(2)*(1 + mu**2)) + m*g*(1 - mu)/(sqrt(2)*(1 + mu**2)))
    samples:
      m: [1, 5, 2.0]
      g: [9, 10, 9.8]
      mu: [0.1, 0.8, 0.30]
    tolerance: 1e-12
    shown: ['A check with level and vertical axes']
