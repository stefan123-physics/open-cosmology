# Calculations on content/year-1/8.01/potential-energy-diagrams.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 25 (segments 25.1–25.3) and Course Notes Chapter 14, Section 14.6 and Example 14.1, with the page's own numbers.

page: content/year-1/8.01/potential-energy-diagrams.mdx
calcs:
  - id: spring-force-quiz
    where: 'quiz 1: F = −200 × 0.10 = −20 N'
    inputs: {k: 200 N/m, x: 0.10 m}
    formula: -k * x
    expected: -20 N
    shown: ['= -200 \\times 0.10 = -20$ N']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: cubic-force
    kind: identity
    where: 'formula "Force for the cubic potential": −d/dx(ax² − bx³) = −2ax + 3bx²'
    formula: -deriv('A * x**2 - B * x**3', 'x', y, 1)
    equals: -2 * A * y + 3 * B * y**2
    samples: {A: [4.0, 1.0], B: [2.0, 3.0], y: [0.5, 1.5]}
    tolerance: 1e-6
    shown: ['= -2ax + 3bx^2']
    source: {cite: reading3, at: 'p. 1'}
    origin: slip
    note: 'The transcript writes F = 2ax − 3bx², with the signs reversed; the zeros are the same.'

  - id: hilltop
    where: 'section "Equilibrium": x = 2a/(3b) = 4/3 m'
    inputs: {a: 4 J/m^2, b: 2 J/m^3}
    formula: 2 * a / (3 * b)
    expected: 1.3333 m
    shown: ['= \frac43$ m']
    source: {cite: reading3, at: 'p. 1'}
    origin: mit

  - id: zero-of-U
    where: 'same: U = 0 at x = a/b = 2 m'
    inputs: {a: 4 J/m^2, b: 2 J/m^3}
    formula: a / b
    expected: 2 m
    shown: ['$x = a/b = 2$ m']
    source: {cite: reading3, at: 'p. 2'}
    origin: mit

  - id: hill-height
    where: 'plot caption: U(4/3) = 64/27 ≈ 2.37 J'
    inputs: {}
    formula: 4 * (4 / 3)**2 - 2 * (4 / 3)**3
    expected: '2.37'
    shown: ['U = 64/27 ≈ 2.37 J']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: page-own

  - id: double-well-curvature
    kind: identity
    where: 'worked example "A double well": U'''' = 12x² − 4'
    formula: deriv('x**4 - 2 * x**2', 'x', y, 2)
    equals: 12 * y**2 - 4
    samples: {y: [0.0, 1.0, -1.0]}
    tolerance: 1e-4
    shown: ['$U'''' = 12x^2 - 4$']
    source: {cite: reading1, at: 'Eqs. (14.14)–(14.16), pp. 14-19–14-20'}
    origin: page-own

  - id: double-well-inner
    where: 'same: inner turning point x ≈ 0.541 m'
    inputs: {}
    formula: sqrt(1 - sqrt(0.5))
    expected: '0.541'
    shown: ['$x \approx 0.541$ m']
    source: {cite: reading1, at: 'Eq. (14.18), p. 14-20'}
    origin: page-own

  - id: double-well-outer
    where: 'same: outer turning point x ≈ 1.307 m'
    inputs: {}
    formula: sqrt(1 + sqrt(0.5))
    expected: '1.307'
    shown: ['$x \approx 1.307$ m']
    source: {cite: reading1, at: 'Eq. (14.18), p. 14-20'}
    origin: page-own

  - id: double-well-check
    where: 'same: U(0.541) = −0.5 J'
    inputs: {}
    formula: (1 - sqrt(0.5))**2 - 2 * (1 - sqrt(0.5))
    expected: '-0.5'
    tolerance: '1e-9'
    shown: ['$x^4 - 2x^2 = -0.5$ gives']
    source: {cite: reading1, at: 'Eq. (14.18), p. 14-20'}
    origin: page-own

  - id: plot-turning-points
    where: 'plot caption: with E = 1.5 J, U(x) = 1.5 J at x ≈ −0.54, 0.79 and 1.76 m'
    inputs: {}
    formula: (4 * (-0.543)**2 - 2 * (-0.543)**3) + (4 * 0.786**2 - 2 * 0.786**3) + (4 * 1.757**2 - 2 * 1.757**3)
    expected: '4.5'
    tolerance: '0.01'
    shown: ['turning points at about −0.54 m and 0.79 m; the line meets the curve again at about 1.76 m']
    source: {cite: reading4, at: 'pp. 1–2'}
    origin: page-own

  - id: notes-mapping
    where: 'section "Equilibrium": x1 = a/b = 2 m and U1 = a³/b² = 16 J map the notes'' potential onto the lesson''s'
    inputs: {a: 4 J/m^2, b: 2 J/m^3}
    formula: a**3 / b**2
    expected: 16 J
    shown: ['$U_1 = a^3/b^2 = 16$ J']
    source: {cite: reading1, at: 'Eq. (14.10), p. 14-18'}
    origin: page-own
