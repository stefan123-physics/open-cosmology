# Calculations on content/year-1/8.01/circular-motion-acceleration.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 10 (segments 10.1–10.4) and Course Notes Chapter 6, Sections 6.3 and 6.5.2.

page: content/year-1/8.01/circular-motion-acceleration.mdx
calcs:
  - id: general-acceleration-x
    kind: identity
    where: 'formula "Acceleration on a circle": x-component of d/dt [r θ̇ (−sin θ)] equals r θ̈ (−sin θ) − r θ̇² cos θ, checked for θ(t) = 0.3 t³ + 0.5 t'
    formula: deriv('r * (0.9 * t**2 + 0.5) * (-sin(0.3 * t**3 + 0.5 * t))', 't', t0)
    equals: r * (1.8 * t0) * (-sin(0.3 * t0**3 + 0.5 * t0)) - r * (0.9 * t0**2 + 0.5)**2 * cos(0.3 * t0**3 + 0.5 * t0)
    samples: {r: [2, 0.5, 3], t0: [0.4, 1.1, 1.7]}
    tolerance: 1e-6
    shown: ['tex="\vec a(t) = r\,\frac{d^2\theta}{dt^2}\,\hat\theta(t) - r\left(\frac{d\theta}{dt}\right)^2\hat r(t)"']
    source: {cite: reading1, at: 'Eq. (6.3.6), p. 6'}
    origin: mit

  - id: theta-hat-derivative
    kind: identity
    where: 'section "The product rule gives both parts": dθ̂/dt = −θ̇ r̂ (x-component: d/dt(−sin θ) = −θ̇ cos θ), θ(t) = 0.8 t²'
    formula: deriv('-sin(0.8 * t**2)', 't', t0)
    equals: -(1.6 * t0) * cos(0.8 * t0**2)
    samples: {t0: [0.3, 1.0, 1.9]}
    tolerance: 1e-7
    shown: ['$d\hat\theta/dt = -(d\theta/dt)\,\hat r$']
    source: {cite: reading1, at: 'Eq. (6.2.7), p. 3'}
    origin: mit

  - id: quiz-tangential
    where: 'quiz 2: a_θ = r d²θ/dt² = 3.0 × 2.0'
    inputs: {r: 3.0 m, alpha: 2.0 1/s**2}
    formula: r * alpha
    expected: 6.0 m/s**2
    shown: ['$a_\\theta = r\\,d^2\\theta/dt^2 = 3.0 \\times 2.0 = 6.0$ m/s².']
    quiz: 1
    source: {cite: reading1, at: 'Eq. (6.3.7), p. 6'}
    origin: page-own

  - id: car-omega
    where: 'worked example "A car accelerating", step "Angular speed and speed": dθ/dt = 0.020 × 10'
    inputs: {alpha: 0.020 1/s**2, t: 10 s}
    formula: alpha * t
    expected: 0.20 1/s
    shown: ['$d\theta/dt = 0.020 \times 10 = 0.20$ rad/s']
    source: {cite: reading4, at: 'transcript 10.3, p. 1 (method)'}
    origin: page-own

  - id: car-speed
    where: 'worked example "A car accelerating": v = r dθ/dt'
    inputs: {r: 50 m, w: 0.20 1/s}
    formula: r * w
    expected: 10 m/s
    shown: ['$v = r\,d\theta/dt = 50 \times 0.20 = 10$ m/s']
    source: {cite: reading1, at: 'Eq. (6.3.2), p. 6'}
    origin: page-own

  - id: car-tangential
    where: 'worked example "A car accelerating", step "Tangential component"'
    inputs: {r: 50 m, alpha: 0.020 1/s**2}
    formula: r * alpha
    expected: 1.0 m/s**2
    shown: ['$a_\theta = r\,d^2\theta/dt^2 = 50 \times 0.020 = 1.0$ m/s²']
    source: {cite: reading1, at: 'Eq. (6.3.7), p. 6'}
    origin: page-own

  - id: car-radial
    where: 'worked example "A car accelerating", step "Radial component"'
    inputs: {r: 50 m, w: 0.20 1/s}
    formula: -r * w**2
    expected: -2.0 m/s**2
    shown: ['$a_r = -r\,(d\theta/dt)^2 = -50 \times 0.20^2 = -2.0$ m/s²']
    source: {cite: reading1, at: 'Eq. (6.3.8), p. 7'}
    origin: page-own

  - id: car-total
    where: 'worked example "A car accelerating", step "Total acceleration": √(1.0² + 2.0²)'
    inputs: {at: 1.0 m/s**2, ar: 2.0 m/s**2}
    formula: sqrt(at**2 + ar**2)
    expected: 2.24 m/s**2
    shown: ['$|\vec a| = \sqrt{1.0^2 + 2.0^2} \approx 2.24$ m/s²']
    source: {cite: reading1, at: 'Eq. (6.3.1), p. 5'}
    origin: page-own

  - id: car-angle
    where: 'worked example "A car accelerating": the tilt from the inward radius, tan = 1.0/2.0'
    inputs: {}
    formula: atan(1.0 / 2.0) * 180 / pi
    expected: '26.6'
    shown: ['about 26.6°']
    source: {cite: reading1, at: 'Eq. (6.3.1), p. 5'}
    origin: page-own

  - id: car-equal-time
    where: 'worked example "A car accelerating": the two parts are equal at t = 1/√α'
    inputs: {alpha: 0.020 1/s**2}
    formula: 1 / sqrt(alpha)
    expected: 7.07 s
    shown: ['$t = 1/\sqrt{0.020} \approx 7.07$ s']
    source: {cite: reading1, at: 'Eqs. (6.3.7)–(6.3.8), pp. 6–7'}
    origin: page-own

  - id: plot-point
    where: 'graph: at t = 10 s the radial part is r(αt)² = 2.0 m/s² for r = 50 m, α = 0.02'
    inputs: {r: 50 m, alpha: 0.02 1/s**2, t: 10 s}
    formula: r * (alpha * t)**2
    expected: 2 m/s**2
    shown: ['{ x: 10, y: 2, label: "t = 10 s: 2.0 m/s²" }']
    source: {cite: reading1, at: 'Eq. (6.3.8), p. 7'}
    origin: page-own

  - id: constant-alpha-angle
    kind: identity
    where: 'formula "Constant angular acceleration": θ = θ₀ + ω₀ t + ½ α t² has dθ/dt = ω₀ + α t'
    formula: deriv('th0 + w0 * t + 0.5 * al * t**2', 't', t1)
    equals: w0 + al * t1
    samples: {th0: [0, 1, 0.3], w0: [0, -0.5, 2], al: [0.02, 1.5, -0.3], t1: [10, 2, 4]}
    tolerance: 1e-6
    shown: ['\theta(t) = \theta_0 + \omega_{z,0}\,t + \tfrac12\,\alpha_z t^2']
    source: {cite: reading4, at: 'method of transcript 10.3, p. 1, with B = 0'}
    origin: page-own

  - id: car-angle-turned
    where: 'section "From angular acceleration back to angle": ½ × 0.020 × 10² = 1.0 rad'
    inputs: {alpha: 0.020 1/s**2, t: 10 s}
    formula: 0.5 * alpha * t**2
    expected: '1.0'
    shown: ['$\tfrac12 \times 0.020 \times 10^2 = 1.0$ rad']
    source: {cite: reading4, at: 'transcript 10.3, p. 1 (method)'}
    origin: page-own

  - id: car-arc
    where: 'section "From angular acceleration back to angle": arc 50 × 1.0 = 50 m'
    inputs: {r: 50 m, th: 1.0}
    formula: r * th
    expected: 50 m
    shown: ['an arc of $50 \times 1.0 = 50$ m']
    source: {cite: reading4, at: 'transcript 10.3, p. 1 (method)'}
    origin: page-own

  - id: integration-103
    kind: identity
    where: 'formula "Integrating the tangential acceleration": ds/dt = v0 + A t − ½ B t² and dv/dt = A − B t'
    formula: deriv('v0 * t + 0.5 * A * t**2 - B * t**3 / 6', 't', t1) + deriv('v0 + A * t - 0.5 * B * t**2', 't', t1)
    equals: (v0 + A * t1 - 0.5 * B * t1**2) + (A - B * t1)
    samples: {v0: [1, 0, 3.5], A: [2, 0.5, 1], B: [0.3, 1, 0.1], t1: [1.5, 3, 0.4]}
    tolerance: 1e-6
    shown: ['s(t) = v_0 t + \tfrac12 At^2 - \tfrac16 Bt^3']
    source: {cite: reading4, at: 'transcript 10.3, p. 1'}
    origin: mit
