# Calculations on content/year-1/8.01/rigid-body-kinematics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 28 (segments 28.2–28.3) and Course Notes Chapter 16, Sections 16.1–16.2, with the page's own numbers.

page: content/year-1/8.01/rigid-body-kinematics.mdx
calcs:
  - id: integrate-omega
    kind: identity
    where: 'formula "Angular velocity from angular acceleration" with α_z = bt, from rest: ω_z = bt²/2'
    formula: integrate('b * s', 's', 0, t)
    equals: b * t**2 / 2
    samples: {b: [1.5, 0.4], t: [4.0, 2.5]}
    tolerance: 1e-6
    shown: ['= \frac{1}{2}bt^2 = 0.75 \times 16 = 12$ rad/s']
    source: {cite: reading3, at: 'p. 1'}
    origin: mit

  - id: integrate-theta
    kind: identity
    where: 'formula "Angle from angular velocity" with ω_z = bt²/2: θ = bt³/6'
    formula: integrate('b * s**2 / 2', 's', 0, t)
    equals: b * t**3 / 6
    samples: {b: [1.5, 0.4], t: [4.0, 2.5]}
    tolerance: 1e-6
    shown: ['= \frac{1}{6}bt^3 = 16$ rad']
    source: {cite: reading3, at: 'p. 2'}
    origin: mit

  - id: drum-omega
    where: 'worked example (a) and plot caption: ω_z = 12 rad/s after 4.0 s'
    inputs: {b: 1.5 rad/s^3, t: 4.0 s}
    formula: b * t**2 / 2
    expected: 12 rad/s
    shown: ['After 4.0 s, ω_z = 12 rad/s and θ = 16 rad.']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: drum-theta
    where: 'same: θ = 16 rad'
    inputs: {b: 1.5 rad/s^3, t: 4.0 s}
    formula: b * t**3 / 6
    expected: 16 rad
    shown: ['= 16$ rad, about 2.5 turns']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: drum-turns
    where: 'same: about 2.5 turns'
    inputs: {}
    formula: 16 / (2 * pi)
    expected: '2.5'
    tolerance: '2%'
    shown: ['about 2.5 turns']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: drum-speed
    where: 'same: rim speed 0.25 × 12 = 3.0 m/s'
    inputs: {r: 0.25 m, w: 12 rad/s}
    formula: r * w
    expected: 3.0 m/s
    shown: ['$r\omega_z = 0.25 \times 12 = 3.0$ m/s']
    source: {cite: reading1, at: 'Eq. (16.1.3), p. 16-4'}
    origin: page-own

  - id: drum-alpha
    where: 'same: α_z = bt = 6.0 rad/s² at 4.0 s'
    inputs: {b: 1.5 rad/s^3, t: 4.0 s}
    formula: b * t
    expected: 6.0 rad/s^2
    shown: ['0.25 \times 6.0 = 1.5$ m/s²']
    source: {cite: reading1, at: 'Eq. (16.1.4), p. 16-5'}
    origin: page-own

  - id: drum-atan
    where: 'same: tangential acceleration 1.5 m/s²'
    inputs: {r: 0.25 m, a: 6.0 rad/s^2}
    formula: r * a
    expected: 1.5 m/s^2
    shown: ['= 1.5$ m/s² and its radial']
    source: {cite: reading1, at: 'Eq. (16.1.4), p. 16-5'}
    origin: page-own

  - id: drum-arad
    where: 'same: radial acceleration −0.25 × 144 = −36 m/s²'
    inputs: {r: 0.25 m, w: 12 rad/s}
    formula: -r * w**2
    expected: -36 m/s^2
    shown: ['$-r\omega_z^2 = -0.25 \times 144 = -36$ m/s²']
    source: {cite: reading1, at: 'Eq. (16.1.5), p. 16-5'}
    origin: page-own

  - id: drum-g
    where: 'same: nearly four times g'
    inputs: {a: 36 m/s^2, g: 9.8 m/s^2}
    formula: a / g
    expected: '3.7'
    tolerance: '2%'
    shown: ['nearly four times $g$']
    source: {cite: reading1, at: 'Eq. (16.1.5), p. 16-5'}
    origin: page-own

  - id: record-omega
    where: 'worked example (b): 45 rpm = 4.71 rad/s'
    inputs: {}
    formula: 45 * 2 * pi / 60
    expected: '4.71'
    shown: ['= 45 \times 2\pi/60 \approx 4.71$ rad/s']
    source: {cite: reading1, at: 'Eq. (16.1.1), p. 16-3'}
    origin: page-own

  - id: record-alpha
    where: 'same: α_z = −4.71/5.0 ≈ −0.94 rad/s²'
    inputs: {}
    formula: -(45 * 2 * pi / 60) / 5.0
    expected: '-0.94'
    shown: ['$\alpha_z = -4.71/5.0 \approx -0.94$ rad/s²']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: record-angle
    where: 'same: ½ × 4.71 × 5.0 ≈ 11.8 rad'
    inputs: {}
    formula: 0.5 * (45 * 2 * pi / 60) * 5.0
    expected: '11.8'
    shown: ['\times 4.71 \times 5.0 \approx 11.8$ rad']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: record-turns
    where: 'same: 1.9 turns'
    inputs: {}
    formula: 0.5 * (45 / 60) * 5.0
    expected: '1.9'
    tolerance: '2%'
    shown: ['or 1.9 turns']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: quiz-disc-speed
    where: 'quiz 3: v = 0.20 × 10 = 2.0 m/s'
    inputs: {r: 0.20 m, w: 10 rad/s}
    formula: r * w
    expected: 2.0 m/s
    shown: ['$v = r\\omega = 0.20 \\times 10 = 2.0$ m/s']
    source: {cite: reading1, at: 'Eq. (16.1.3), p. 16-4'}
    origin: page-own

  - id: quiz-disc-accel
    where: 'quiz 3: rω² = 20 m/s²'
    inputs: {r: 0.20 m, w: 10 rad/s}
    formula: r * w**2
    expected: 20 m/s^2
    shown: ['$r\\omega^2 = 0.20 \\times 100 = 20$ m/s²']
    source: {cite: reading1, at: 'Eq. (16.1.5), p. 16-5'}
    origin: page-own

  - id: quiz-angle
    where: 'quiz 4: θ = ½ × 3.0 × 4.0 = 6.0 rad'
    inputs: {a: 3.0 rad/s^2, t: 2.0 s}
    formula: 0.5 * a * t**2
    expected: 6.0 rad
    shown: ['\\frac{1}{2} \\times 3.0 \\times 4.0 = 6.0$ rad']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own
