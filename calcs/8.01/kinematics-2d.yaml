# Calculations on content/year-1/8.01/kinematics-2d.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-1/8.01/kinematics-2d.mdx
calcs:
  - id: cliff-time
    where: 'worked example "A ball rolling off a cliff", step "Time in the air": t = √(40/9.8)'
    inputs: {h: 20 m, g: 9.8 m/s**2}
    formula: sqrt(2 * h / g)
    expected: 2.02 s
    shown: ['$t = \sqrt{40/9.8} = 2.02$ s']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: cliff-distance
    where: 'worked example, step "Distance"'
    inputs: {h: 20 m, g: 9.8 m/s**2, v: 8.0 m/s}
    formula: v * sqrt(2 * h / g)
    expected: 16.2 m
    shown: ['$x = v_{x,0}\,t = 8.0 \times 2.02 = 16.2$ m']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: cliff-vy
    where: 'worked example, step "Velocity at landing"'
    inputs: {h: 20 m, g: 9.8 m/s**2}
    formula: -g * sqrt(2 * h / g)
    expected: -19.8 m/s
    shown: ['$v_y = -9.8 \times 2.02 = -19.8\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: cliff-speed
    where: 'worked example, step "Velocity at landing"'
    inputs: {h: 20 m, g: 9.8 m/s**2, v: 8.0 m/s}
    formula: sqrt(v**2 + 2 * g * h)
    expected: 21.4 m/s
    shown: ['$\sqrt{8.0^2 + 19.8^2} = 21.4\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: cliff-angle
    where: 'worked example, step "Velocity at landing": angle below the horizontal'
    inputs: {h: 20 m, g: 9.8 m/s**2, v: 8.0 m/s}
    formula: atan(sqrt(2 * g * h) / v) * 180 / pi
    expected: '68'
    shown: ['$\tan^{-1}(19.8/8.0) = 68^\circ$ below the horizontal']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: kick-vx
    where: 'worked example "A kicked ball", step "Components"'
    inputs: {v0: 15 m/s}
    formula: v0 * cos(35 * pi / 180)
    expected: 12.3 m/s
    shown: ['$v_{x,0} = 15\cos 35^\circ = 12.3\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: kick-vy
    where: 'worked example "A kicked ball", step "Components"'
    inputs: {v0: 15 m/s}
    formula: v0 * sin(35 * pi / 180)
    expected: 8.60 m/s
    shown: ['$v_{y,0} = 15\sin 35^\circ = 8.60\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: kick-flight-time
    where: 'worked example, step "Time of flight": t = 2v_y0/g'
    inputs: {v0: 15 m/s, g: 9.8 m/s**2}
    formula: 2 * v0 * sin(35 * pi / 180) / g
    expected: 1.76 s
    shown: ['$t = 2v_{y,0}/g = 2(8.60)/9.8 = 1.76$ s']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: kick-top-time
    where: 'worked example, step "Maximum height": halfway through the flight'
    inputs: {v0: 15 m/s, g: 9.8 m/s**2}
    formula: v0 * sin(35 * pi / 180) / g
    expected: 0.88 s
    shown: ['halfway through the flight at $t = 0.88$ s']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: kick-max-height
    where: 'worked example, step "Maximum height"'
    inputs: {v0: 15 m/s, g: 9.8 m/s**2}
    formula: (v0 * sin(35 * pi / 180))**2 / (2 * g)
    expected: 3.78 m
    shown: ['$y_\text{max} = v_{y,0}^2/(2g) = 8.60^2/19.6 = 3.78$ m']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: kick-range
    where: 'worked example, step "Range": v0² sin(2θ0)/g'
    inputs: {v0: 15 m/s, g: 9.8 m/s**2}
    formula: v0**2 * sin(2 * 35 * pi / 180) / g
    expected: 21.6 m
    shown: ['$x = v_{x,0}\,t = 12.3 \times 1.76 = 21.6$ m']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: range-formula
    kind: identity
    where: 'worked example, step "Range": 2v_x0 v_y0/g = v0² sin(2θ0)/g'
    formula: 2 * (v * cos(th)) * (v * sin(th)) / g
    equals: v**2 * sin(2 * th) / g
    samples: {v: [15, 8, 30], th: [0.61, 0.2, 1.1], g: [9.8, 9.8, 1.62]}
    shown: ['In general the range is $2v_{x,0}v_{y,0}/g = v_0^2\sin(2\theta_0)/g$']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: range-largest-at-45
    where: 'worked example, step "Range": the range is largest at 45°'
    inputs: {}
    formula: solve('cos(2 * q * pi / 180)', 'q', 1, 89)
    expected: '45'
    tolerance: '1e-6'
    shown: ['which is largest at $\theta_0 = 45^\circ$']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: page-own

  - id: orbit-equation
    kind: identity
    where: 'formula "orbit equation": y(x) from eliminating t must agree with y(t) at x = v_x0 t'
    formula: tan(th) * (v * cos(th) * t) - 9.8 * (v * cos(th) * t)**2 / (2 * v**2 * cos(th)**2)
    equals: v * sin(th) * t - 9.8 * t**2 / 2
    samples: {v: [15, 8, 30, 3], th: [0.61, 1.0, 1.45, 0.05], t: [0.5, 1.3, 5, 0.2]}
    shown: ['tan(th*pi/180)*x - 9.8*x^2/(2*v0^2*cos(th*pi/180)^2)']
    source: {cite: reading1, at: 'Chapter 5'}
    origin: mit
