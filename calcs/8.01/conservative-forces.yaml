# Calculations on content/year-1/8.01/conservative-forces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 22 (segments 22.1–22.5) and Course Notes Chapter 14, Section 14.2, with the page's own numbers.

page: content/year-1/8.01/conservative-forces.mdx
calcs:
  - id: path-2-friction
    kind: identity
    where: 'formula "Friction on the longer path": −μmg(x_a − x_i) + μmg(x_f − x_a) = −μmg(2x_a − x_i − x_f)'
    formula: -k * (xa - xi) + k * (xf - xa)
    equals: -k * (2 * xa - xi - xf)
    samples: {k: [1.0, 58.8], xi: [0.0, 1.0], xf: [3.0, 4.0], xa: [5.0, 6.0]}
    tolerance: 1e-9
    shown: ['= -\mu_k mg\,(2x_a - x_i - x_f)']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: mit

  - id: gravity-box
    where: 'worked example "Two kinds of force" (a) and quiz 1: 3.0 × 9.8 × 2.0 = 58.8 J'
    inputs: {m: 3.0 kg, g: 9.8 m/s^2, h: 2.0 m}
    formula: m * g * h
    expected: 58.8 J
    shown: ['$W = mg\,(y_i - y_f) = 3.0 \times 9.8 \times 2.0 = 58.8$ J']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: crate-straight
    where: 'same (b): −0.30 × 20 × 9.8 × 3.0 ≈ −176 J'
    inputs: {m: 20 kg, g: 9.8 m/s^2, d: 3.0 m}
    formula: -0.30 * m * g * d
    expected: -176 J
    shown: ['Straight: $-0.30 \times 20 \times 9.8 \times 3.0 \approx -176$ J']
    source: {cite: reading3, at: 'pp. 1–2'}
    origin: page-own

  - id: crate-back-and-forth
    where: 'same (b) and quiz 2: 7.0 m travelled, ≈ −412 J'
    inputs: {m: 20 kg, g: 9.8 m/s^2, d: 7.0 m}
    formula: -0.30 * m * g * d
    expected: -412 J
    shown: ['Forward and back (7.0 m travelled): $\approx -412$ J']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: page-own

  - id: circulating-loop
    where: 'worked example "A force that circulates": ∮ F·ds round the unit circle = 2π ≈ 6.28 J'
    inputs: {}
    formula: integrate('(-sin(x)) * (-sin(x)) + cos(x) * cos(x)', 'x', 0, 2 * pi)
    expected: '6.28'
    shown: ['= 2\pi \approx 6.28$ J']
    source: {cite: reading5, at: 'p. 1'}
    origin: page-own

  - id: circulating-quarter
    where: 'same: from (1, 0) to (0, 1) along the quarter circle, π/2 J'
    inputs: {}
    formula: integrate('(-sin(x)) * (-sin(x)) + cos(x) * cos(x)', 'x', 0, pi / 2)
    expected: '1.5708'
    shown: ['along the quarter circle the work is $\pi/2$ J']
    source: {cite: reading4, at: 'pp. 1–2'}
    origin: page-own
