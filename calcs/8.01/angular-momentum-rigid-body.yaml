# Calculations on content/year-1/8.01/angular-momentum-rigid-body.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 33 (segments 33.1–33.5) and Course Notes Chapter 19, Sections 19.6–19.7, with the page's own numbers.

page: content/year-1/8.01/angular-momentum-rigid-body.mdx
calcs:
  - id: pair-cancels
    kind: identity
    where: 'formula "Two particles, about S": the radial parts −hmRω r̂₁ and −hmRω r̂₂ = +hmRω r̂₁ cancel'
    formula: -h * m * R * w + h * m * R * w
    equals: 0 * h
    samples: {h: [0.3, 1.0], m: [0.5, 2.0], R: [0.2, 1.5], w: [4.0, 1.0]}
    tolerance: 1e-12
    shown: ['= 2mR^2\omega_z\,\hat k" cite']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: kinetic-energy
    kind: identity
    where: 'formula "Rotational kinetic energy": ½ I ω² = L²/2I with L = Iω'
    formula: 0.5 * I * w**2
    equals: (I * w)**2 / (2 * I)
    samples: {I: [0.096, 0.45], w: [5.0, 100.0]}
    tolerance: 1e-9
    shown: ['= \frac{1}{2}I\omega^2 = \frac{L^2}{2I}']
    source: {cite: reading6, at: 'p. 1'}
    origin: mit

  - id: dumbbell-i
    where: 'worked example (a): I = 2 × 0.30 × 0.40² = 0.096 kg m²'
    inputs: {m: 0.30 kg, r: 0.40 m}
    formula: 2 * m * r**2
    expected: 0.096 kg*m^2
    shown: ['$I = 2 \times 0.30 \times 0.40^2 = 0.096$ kg m²']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: dumbbell-l
    where: 'same: L = 0.096 × 5.0 = 0.48 kg m²/s'
    inputs: {I: 0.096 kg*m^2, w: 5.0 1/s}
    formula: I * w
    expected: 0.48 kg*m^2/s
    shown: ['$L = 0.096 \times 5.0 = 0.48$ kg m²/s']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: dumbbell-k
    where: 'same: K = 0.2304/0.192 = 1.2 J'
    inputs: {L: 0.48 kg*m^2/s, I: 0.096 kg*m^2}
    formula: L**2 / (2 * I)
    expected: 1.2 J
    shown: ['= \frac{0.2304}{0.192} = 1.2$ J']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: rotor-axial
    where: 'worked example (b): mR²ω = 0.50 × 0.04 × 4.0 = 0.080 kg m²/s'
    inputs: {m: 0.50 kg, R: 0.20 m, w: 4.0 1/s}
    formula: m * R**2 * w
    expected: 0.080 kg*m^2/s
    shown: ['$mR^2\omega = 0.50 \times 0.04 \times 4.0 = 0.080$ kg m²/s']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: rotor-radial
    where: 'same: hmRω = 0.30 × 0.50 × 0.20 × 4.0 = 0.12 kg m²/s'
    inputs: {h: 0.30 m, m: 0.50 kg, R: 0.20 m, w: 4.0 1/s}
    formula: h * m * R * w
    expected: 0.12 kg*m^2/s
    shown: ['$hmR\omega = 0.30 \times 0.50 \times 0.20 \times 4.0 = 0.12$ kg m²/s']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: flywheel-i
    where: 'worked example (c) and quiz 3: I = ½ × 10 × 0.30² = 0.45 kg m²'
    inputs: {M: 10 kg, R: 0.30 m}
    formula: 0.5 * M * R**2
    expected: 0.45 kg*m^2
    shown: ['$I = \frac{1}{2} \times 10 \times 0.30^2 = 0.45$ kg m²']
    source: {cite: reading1, at: 'p. 19-19 (I_S as the sum of m r²; the disc value ½MR² is from Lesson 29)'}
    origin: page-own

  - id: flywheel-k
    where: 'same: K = 45²/(2 × 0.45) = 2250 J'
    inputs: {L: 45 kg*m^2/s, I: 0.45 kg*m^2}
    formula: L**2 / (2 * I)
    expected: 2250 J
    shown: ['$K = \frac{45^2}{2 \times 0.45} = 2250$ J']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: rotor-force
    where: 'worked example (b): mRω² = 0.50 × 0.20 × 16 = 1.6 N'
    inputs: {m: 0.50 kg, R: 0.20 m, w: 4.0 1/s}
    formula: m * R * w**2
    expected: 1.6 N
    shown: ['($mR\omega^2 = 1.6$ N here)']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
