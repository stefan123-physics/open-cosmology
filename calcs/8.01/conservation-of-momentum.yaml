# Calculations on content/year-1/8.01/conservation-of-momentum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 16 (segments 16.1–16.2) and Course Notes Chapter 10, Sections 10.7–10.9, with the page's own numbers.

page: content/year-1/8.01/conservation-of-momentum.mdx
calcs:
  - id: quiz-blocks
    where: 'quiz 1: 2.0 × 3.0 = 3.0 v_f, v_f = 2.0 m/s'
    inputs: {m1: 2.0 kg, m2: 1.0 kg, v1: 3.0 m/s}
    formula: m1 * v1 / (m1 + m2)
    expected: 2.0 m/s
    shown: ['$2.0 \\times 3.0 = 3.0\\,v_f$, so $v_f = 2.0$ m/s']
    quiz: 0
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: wagons-speed
    where: 'worked example "Coupling railway wagons", step "Common speed"'
    inputs: {m1: 12000 kg, m2: 8000 kg, v1: 2.0 m/s}
    formula: m1 * v1 / (m1 + m2)
    expected: 1.2 m/s
    shown: ['$v_f = 12\,000 \times 2.0/(12\,000 + 8000) = 24\,000/20\,000 = 1.2$ m/s']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: wagons-gain
    where: 'worked example "Coupling railway wagons": the second wagon gains 8000 × 1.2 = 9600 kg·m/s'
    inputs: {m2: 8000 kg, vf: 1.2 m/s}
    formula: m2 * vf
    expected: 9600 kg*m/s
    shown: ['The second wagon gains $8000 \times 1.2 = 9600$ kg·m/s']
    source: {cite: reading1, at: 'Eq. (10.8.4), p. 10-12'}
    origin: page-own

  - id: wagons-loss
    where: 'worked example "Coupling railway wagons": the first loses 12 000 × (2.0 − 1.2) = 9600 kg·m/s'
    inputs: {m1: 12000 kg, v1: 2.0 m/s, vf: 1.2 m/s}
    formula: m1 * (v1 - vf)
    expected: 9600 kg*m/s
    shown: ['$12\,000 \times (2.0 - 1.2) = 9600$ kg·m/s']
    source: {cite: reading1, at: 'Eq. (10.8.4), p. 10-12'}
    origin: page-own

  - id: crossroads-px
    where: 'worked example "A crossroads collision" and quiz 4: p_x = 1200 × 15 = 18 000 kg·m/s'
    inputs: {m: 1200 kg, v: 15 m/s}
    formula: m * v
    expected: 18000 kg*m/s
    shown: ['$x$ (east): $1200 \times 15 = 18\,000$ kg·m/s']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: crossroads-vx
    where: 'worked example "A crossroads collision": v_x,f = 18 000/3000 = 6.0 m/s (and the same for y)'
    inputs: {p: 18000 kg*m/s, M: 3000 kg}
    formula: p / M
    expected: 6.0 m/s
    shown: ['$= 3000\,v_{x,f}$, so $v_{x,f} = 6.0$ m/s']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: crossroads-py
    where: 'worked example "A crossroads collision": p_y = 1800 × 10 = 18 000 kg·m/s'
    inputs: {m: 1800 kg, v: 10 m/s}
    formula: m * v
    expected: 18000 kg*m/s
    shown: ['$y$ (north): $1800 \times 10 = 18\,000$ kg·m/s']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: crossroads-speed
    where: 'worked example "A crossroads collision", step "Speed and direction": √(6² + 6²) ≈ 8.5 m/s'
    inputs: {vx: 6.0 m/s, vy: 6.0 m/s}
    formula: sqrt(vx**2 + vy**2)
    expected: 8.5 m/s
    shown: ['$v_f = \sqrt{6.0^2 + 6.0^2} \approx 8.5$ m/s']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: crossroads-angle
    where: 'worked example "A crossroads collision": 45° north of east'
    inputs: {}
    formula: atan(18000 / 18000) * 180 / pi
    expected: '45'
    shown: ['at 45° north of east']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: projectile-v3
    kind: identity
    where: 'formula "Momentum across the explosion": v₃ = 5v₁/3 satisfies m₁v₁ = −¼ m₁v₁ + ¾ m₁v₃'
    formula: -0.25 * m1 * v1 + 0.75 * m1 * (5 * v1 / 3)
    equals: m1 * v1
    samples: {m1: [1.0, 4.0], v1: [10.0, 3.0]}
    tolerance: 1e-9
    shown: ['v_3 = \tfrac53\,v_1']
    source: {cite: reading1, at: 'Eqs. (10.9.11)–(10.9.12), p. 10-17'}
    origin: mit

  - id: projectile-landing
    where: 'section "An exploding projectile": the large piece lands at x_i + 5x_i/3 = 8x_i/3'
    inputs: {}
    formula: 1 + 5 / 3
    expected: '2.667'
    shown: ['lands at $\tfrac83 x_i$']
    source: {cite: reading1, at: 'Eq. (10.9.14), p. 10-17'}
    origin: mit

  - id: plane-sandbag
    where: 'notes Example 10.6 (mentioned only): the plane stops after about 3.8 × 10² m'
    inputs: {mp: 1000 kg, ms: 120 kg, v: 40 m/s, F: 1400 N, mu: 0.4, g: 9.8 m/s**2}
    formula: mp**2 * v**2 / (2 * (mp + ms) * (F + mu * ms * g))
    expected: 380 m
    tolerance: 5 m
    shown: ['a landing plane snags a sandbag']
    source: {cite: reading1, at: 'Eq. (10.9.30), p. 10-20'}
    origin: mit

  - id: shell-landing
    where: 'worked example "A shell splits in two", step "Distance": 400 + 800 = 1200 m'
    inputs: {xi: 400 m}
    formula: xi + 2 * xi
    expected: 1200 m
    shown: ['landing at $400 + 800 = 1200$ m from the gun']
    source: {cite: reading1, at: 'Eqs. (10.9.11)–(10.9.14), p. 10-17'}
    origin: page-own

  - id: shell-cm-check
    where: 'worked example "A shell splits in two": the centre of mass lands at 800 m, halfway between 400 m and 1200 m'
    inputs: {}
    formula: (400 + 1200) / 2
    expected: '800'
    shown: ['it lands at 800 m, halfway between the pieces']
    source: {cite: reading1, at: 'p. 10-15'}
    origin: page-own
