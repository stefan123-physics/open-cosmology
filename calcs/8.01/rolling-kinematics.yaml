# Calculations on content/year-1/8.01/rolling-kinematics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 35 (segments 35.1–35.5) and Course Notes Chapter 20, Section 20.2 and Example 20.1, with the page's own numbers.

page: content/year-1/8.01/rolling-kinematics.mdx
calcs:
  - id: cycloid-height
    kind: identity
    where: 'formula "Path of a point on the rim": at V t/R = π the height is zero'
    formula: R * (1 + cos(pi))
    equals: 0 * R
    samples: {R: [0.35, 1.0]}
    tolerance: 1e-9
    shown: ['y = R\left(1 + \cos\frac{V_{\text{cm}}t}{R}\right)']
    source: {cite: reading1, at: 'Eq. (20.2.39), p. 20-9'}
    origin: mit

  - id: cycloid-vx
    kind: identity
    where: 'same: dx/dt = V(1 + cos(Vt/R)) is zero at Vt/R = π and 2V at the top'
    formula: V * (1 + cos(pi)) + V * (1 + cos(0))
    equals: 2 * V
    samples: {V: [6.0, 2.0]}
    tolerance: 1e-9
    shown: ['x = V_{\text{cm}}t + R\sin\frac{V_{\text{cm}}t}{R}']
    source: {cite: reading1, at: 'Eq. (20.2.39), p. 20-9'}
    origin: mit

  - id: quiz-omega
    where: 'quiz 1: ω = 6.0/0.30 = 20 rad/s'
    inputs: {V: 6.0 m/s, R: 0.30 m}
    formula: V / R
    expected: 20 1/s
    shown: ['$\\omega = 6.0/0.30 = 20$ rad/s']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: bike-omega
    where: 'worked example (a): ω = 6.0/0.35 ≈ 17 rad/s'
    inputs: {V: 6.0 m/s, R: 0.35 m}
    formula: V / R
    expected: 17 1/s
    tolerance: '1%'
    shown: ['$\omega = V_{\text{cm}}/R = 6.0/0.35 \approx 17$ rad/s']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: bike-top
    where: 'same: top moves at 2 × 6.0 = 12 m/s'
    inputs: {V: 6.0 m/s}
    formula: 2 * V
    expected: 12 m/s
    shown: ['The top moves at $2 \times 6.0 = 12$ m/s']
    source: {cite: reading6, at: 'p. 2'}
    origin: page-own

  - id: bike-front
    where: 'same: front point speed √(6² + 6²) ≈ 8.5 m/s'
    inputs: {V: 6.0 m/s}
    formula: sqrt(2) * V
    expected: 8.5 m/s
    tolerance: '1%'
    shown: ['$\sqrt{6.0^2 + 6.0^2} \approx 8.5$ m/s']
    source: {cite: reading4, at: 'p. 1'}
    origin: page-own

  - id: skid
    where: 'worked example (b): Rω = 12 m/s, contact point slides at 8.0 m/s'
    inputs: {V: 20 m/s, R: 0.30 m, w: 40 1/s}
    formula: V - R * w
    expected: 8.0 m/s
    shown: ['The contact point moves at $20 - 12 = 8.0$ m/s forward']
    source: {cite: reading1, at: 'Eq. (20.2.9), p. 20-4'}
    origin: page-own

  - id: skid-rim
    where: 'same: Rω = 0.30 × 40 = 12 m/s'
    inputs: {R: 0.30 m, w: 40 1/s}
    formula: R * w
    expected: 12 m/s
    shown: ['$R\omega = 0.30 \times 40 = 12$ m/s']
    source: {cite: reading5, at: 'pp. 2–3'}
    origin: page-own

  - id: slip
    where: 'worked example (c): contact point at 2.0 − 15 = −13 m/s'
    inputs: {V: 2.0 m/s, R: 0.30 m, w: 50 1/s}
    formula: V - R * w
    expected: -13 m/s
    shown: ['The contact point moves at $2.0 - 15 = -13$ m/s']
    source: {cite: reading1, at: 'Eq. (20.2.9), p. 20-4'}
    origin: page-own

  - id: slip-rim
    where: 'same: Rω = 0.30 × 50 = 15 m/s'
    inputs: {R: 0.30 m, w: 50 1/s}
    formula: R * w
    expected: 15 m/s
    shown: ['$R\omega = 0.30 \times 50 = 15$ m/s']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own
