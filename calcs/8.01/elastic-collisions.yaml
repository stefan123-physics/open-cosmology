# Calculations on content/year-1/8.01/elastic-collisions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 27 (segments 27.1–27.6) and Course Notes Chapter 15, Sections 15.4 and 15.6, with the page's own numbers.

page: content/year-1/8.01/elastic-collisions.mdx
calcs:
  - id: quadratic-root
    kind: identity
    where: 'formula "The quadratic for v₁ₓ,f": v₁ₓ,f = −v₁ₓ,i/3 is a root'
    formula: (-v / 3)**2 - (2 / 3) * v * (-v / 3) - v**2 / 3
    equals: 0 * v
    samples: {v: [1.0, 4.0, -2.5]}
    tolerance: 1e-9
    shown: ['v_{1x,f}^2 - \frac{2}{3}v_{1x,i}\,v_{1x,f} - \frac{1}{3}v_{1x,i}^2 = 0']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: mit

  - id: general-momentum
    kind: identity
    where: 'formula "Final velocities": momentum is conserved'
    formula: m1 * ((m1 - m2) / (m1 + m2) * u1 + 2 * m2 / (m1 + m2) * u2) + m2 * (2 * m1 / (m1 + m2) * u1 + (m2 - m1) / (m1 + m2) * u2)
    equals: m1 * u1 + m2 * u2
    samples: {m1: [0.5, 2.0, 7.0], m2: [1.5, 1.0, 3.0], u1: [4.0, 3.0, -1.0], u2: [0.0, -3.0, 2.5]}
    tolerance: 1e-9
    shown: ['\frac{m_1 - m_2}{m_1 + m_2}\,v_{1x,i} + \frac{2m_2}{m_1 + m_2}\,v_{2x,i}']
    source: {cite: reading1, at: 'Eqs. (15.4.14), (15.4.17), pp. 15-9–15-10'}
    origin: mit

  - id: general-energy
    kind: identity
    where: 'same: kinetic energy is conserved'
    formula: m1 * ((m1 - m2) / (m1 + m2) * u1 + 2 * m2 / (m1 + m2) * u2)**2 + m2 * (2 * m1 / (m1 + m2) * u1 + (m2 - m1) / (m1 + m2) * u2)**2
    equals: m1 * u1**2 + m2 * u2**2
    samples: {m1: [0.5, 2.0, 7.0], m2: [1.5, 1.0, 3.0], u1: [4.0, 3.0, -1.0], u2: [0.0, -3.0, 2.5]}
    tolerance: 1e-9
    shown: ['\frac{2m_1}{m_1 + m_2}\,v_{1x,i} + \frac{m_2 - m_1}{m_1 + m_2}\,v_{2x,i}']
    source: {cite: reading1, at: 'Eqs. (15.4.14), (15.4.17), pp. 15-9–15-10'}
    origin: mit

  - id: mit-v1f
    where: 'formula "Result for m₂ = 2m₁": v₁ₓ,f = −v₁ₓ,i/3'
    inputs: {}
    formula: (1 - 2) / (1 + 2)
    expected: '-0.3333'
    shown: ['v_{1x,f} = -\frac{1}{3}v_{1x,i}, \qquad v_{2x,f} = \frac{2}{3}v_{1x,i}']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: mit

  - id: mit-v2f
    where: 'same: v₂ₓ,f = 2v₁ₓ,i/3'
    inputs: {}
    formula: 2 * 1 / (1 + 2)
    expected: '0.6667'
    shown: ['so $v_{2x,f} = \frac{2}{3}v_{1x,i}$']
    source: {cite: reading5, at: 'p. 2'}
    origin: mit

  - id: motorway
    where: 'section "Relative velocity": 60 − 50 = 10 mph'
    inputs: {}
    formula: 60 - 50
    expected: '10'
    shown: ['approach at only 10 mph']
    source: {cite: reading3, at: 'p. 1'}
    origin: mit

  - id: example-a-v1f
    where: 'worked example (a): v₁ₓ,f = −2.0 m/s'
    inputs: {m1: 0.50 kg, m2: 1.5 kg, u: 4.0 m/s}
    formula: (m1 - m2) / (m1 + m2) * u
    expected: -2.0 m/s
    shown: ['so $v_{1x,f} = -2.0$ m/s']
    source: {cite: reading1, at: 'Eq. (15.4.14), p. 15-9'}
    origin: page-own

  - id: example-a-v2f
    where: 'same: v₂ₓ,f = +2.0 m/s'
    inputs: {m1: 0.50 kg, m2: 1.5 kg, u: 4.0 m/s}
    formula: 2 * m1 / (m1 + m2) * u
    expected: 2.0 m/s
    shown: ['and $v_{2x,f} = +2.0$ m/s']
    source: {cite: reading1, at: 'Eq. (15.4.17), p. 15-10'}
    origin: page-own

  - id: example-a-ki
    where: 'same: 4.0 J before'
    inputs: {m1: 0.50 kg, u: 4.0 m/s}
    formula: 0.5 * m1 * u**2
    expected: 4.0 J
    shown: ['4.0 J before']
    source: {cite: reading1, at: 'Eq. (15.4.2), p. 15-8'}
    origin: page-own

  - id: example-a-kf
    where: 'same: 1.0 + 3.0 = 4.0 J after'
    inputs: {m1: 0.50 kg, m2: 1.5 kg, v: 2.0 m/s}
    formula: 0.5 * m1 * v**2 + 0.5 * m2 * v**2
    expected: 4.0 J
    shown: ['$1.0 + 3.0 = 4.0$ J after']
    source: {cite: reading1, at: 'Eq. (15.4.2), p. 15-8'}
    origin: page-own

  - id: example-b-v1f
    where: 'worked example (b): v₁ₓ,f = −1.0 m/s'
    inputs: {m1: 2.0 kg, m2: 1.0 kg, u1: 3.0 m/s, u2: -3.0 m/s}
    formula: (m1 - m2) / (m1 + m2) * u1 + 2 * m2 / (m1 + m2) * u2
    expected: -1.0 m/s
    shown: ['$v_{1x,f} = -1.0$ m/s']
    source: {cite: reading1, at: 'Eq. (15.4.14), p. 15-9'}
    origin: page-own

  - id: example-b-v2f
    where: 'same: v₂ₓ,f = +5.0 m/s'
    inputs: {m1: 2.0 kg, m2: 1.0 kg, u1: 3.0 m/s, u2: -3.0 m/s}
    formula: 2 * m1 / (m1 + m2) * u1 + (m2 - m1) / (m1 + m2) * u2
    expected: 5.0 m/s
    shown: ['$v_{2x,f} = +5.0$ m/s']
    source: {cite: reading1, at: 'Eq. (15.4.17), p. 15-10'}
    origin: page-own

  - id: example-b-p
    where: 'same: momentum 3.0 kg m/s'
    inputs: {m1: 2.0 kg, m2: 1.0 kg, u1: 3.0 m/s, u2: -3.0 m/s}
    formula: m1 * u1 + m2 * u2
    expected: 3.0 kg*m/s
    shown: ['= 3.0$ kg m/s']
    source: {cite: reading1, at: 'Eq. (15.4.1), p. 15-8'}
    origin: page-own

  - id: example-b-k
    where: 'same: kinetic energy 13.5 J before and after'
    inputs: {m1: 2.0 kg, m2: 1.0 kg, v1: 1.0 m/s, v2: 5.0 m/s}
    formula: 0.5 * m1 * v1**2 + 0.5 * m2 * v2**2
    expected: 13.5 J
    shown: ['13.5 J before and after']
    source: {cite: reading1, at: 'Eq. (15.4.2), p. 15-8'}
    origin: page-own

  - id: slingshot-mit
    where: 'section "The gravitational slingshot": arrives at 3V, leaves at 5V'
    inputs: {}
    formula: 3 + 2 * 1
    expected: '5'
    shown: ['arrives at $3V$ and leaves at $5V$']
    source: {cite: reading6, at: 'pp. 2–3'}
    origin: mit

  - id: slingshot-jupiter
    where: 'same: 10 + 2 × 13 = 36 km/s'
    inputs: {vi: 10 km/s, V: 13 km/s}
    formula: vi + 2 * V
    expected: 36 km/s
    shown: ['$10 + 2 \times 13 = 36$ km/s']
    source: {cite: reading6, at: 'p. 2'}
    origin: page-own

  - id: jupiter-speed
    kind: fact
    where: 'same: Jupiter orbits at about 13 km/s'
    value: 13 km/s
    shown: ['orbits at about 13 km/s']
    source: {cite: nasa-jupiter, at: 'mean orbital velocity'}
    origin: page-own

  - id: quiz-slingshot
    where: 'quiz 3: 5 + 2 × 10 = 25 km/s'
    inputs: {vi: 5 km/s, V: 10 km/s}
    formula: vi + 2 * V
    expected: 25 km/s
    shown: ['$v_f = v_i + 2V = 25$ km/s']
    source: {cite: reading6, at: 'p. 2'}
    origin: page-own

  - id: puck-v1f
    where: 'worked example "A glancing collision": v₁,f = 5.0 cos 60° = 2.5 m/s'
    inputs: {}
    formula: 5.0 * cos(pi / 3)
    expected: '2.5'
    shown: ['$v_{1,f} = 5.0\cos 60° = 2.5$ m/s']
    source: {cite: reading1, at: 'Eq. (15.6.20), p. 15-20'}
    origin: page-own

  - id: puck-v2f
    where: 'same: v₂,f = 2.5 × 0.866/0.5 ≈ 4.33 m/s'
    inputs: {}
    formula: 2.5 * sin(pi / 3) / sin(pi / 6)
    expected: '4.33'
    shown: ['2.5 \times 0.866/0.5 \approx 4.33$ m/s']
    source: {cite: reading7, at: 'pp. 2–3'}
    origin: page-own

  - id: puck-px
    where: 'same: 2.5 cos 60° + 4.33 cos 30° = 1.25 + 3.75 = 5.0'
    inputs: {}
    formula: 2.5 * cos(pi / 3) + 2.5 * sqrt(3) * cos(pi / 6)
    expected: '5.0'
    shown: ['= 1.25 + 3.75 = 5.0$ m/s']
    source: {cite: reading7, at: 'p. 2'}
    origin: page-own

  - id: puck-energy
    where: 'same: 2.5² + 4.33² = 6.25 + 18.75 = 25'
    inputs: {}
    formula: 2.5**2 + (2.5 * sqrt(3))**2
    expected: '25'
    shown: ['6.25 + 18.75 = 25 = 5.0^2']
    source: {cite: reading7, at: 'p. 3'}
    origin: page-own
