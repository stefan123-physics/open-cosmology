# Calculations on content/year-1/8.01/newtons-second-law-circular-motion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 11 (segments 11.1–11.3) and Course Notes Chapter 9, Sections 9.1–9.2.2.

page: content/year-1/8.01/newtons-second-law-circular-motion.mdx
calcs:
  - id: bank-divide
    kind: identity
    where: 'formula "Speed on a frictionless banked turn": dividing N sin φ = m v²/r by N cos φ = m g gives tan φ = v²/(r g); check v = √(r g tan φ) satisfies both with N = m g/cos φ'
    formula: (m * g / cos(ph)) * sin(ph) - m * (r * g * tan(ph)) / r
    equals: 0 * ph
    samples: {m: [1000, 2.5], g: [9.81, 9.8], r: [120, 50], ph: [0.26, 0.35]}
    tolerance: 1e-9
    shown: ['\tan\varphi = \frac{v^2}{rg} \quad\Longrightarrow\quad v = \sqrt{rg\tan\varphi}']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: mit

  - id: quiz-bank
    where: 'quiz 2: v = √(50 × 9.8 × tan 20°) ≈ 13 m/s'
    inputs: {r: 50 m, g: 9.8 m/s**2}
    formula: sqrt(r * g * tan(20 * pi / 180))
    expected: 13 m/s
    shown: ['= \\sqrt{50 \\times 9.8 \\times 0.364} \\approx 13$ m/s.']
    quiz: 1
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: tan-20
    where: 'quiz 2 explanation: tan 20° ≈ 0.364'
    inputs: {}
    formula: tan(20 * pi / 180)
    expected: '0.364'
    shown: ['50 \\times 9.8 \\times 0.364']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: quiz-kepler
    where: 'quiz 4: T ∝ R^(3/2), so 4 times the radius gives 8 times the period'
    inputs: {}
    formula: 4**1.5
    expected: '8'
    shown: ['$4^{3/2} = 8$']
    source: {cite: reading1, at: 'Eq. (9.2.7), p. 9-6'}
    origin: page-own

  - id: curve-tan
    where: 'worked example "Designing a banked curve": tan 15° ≈ 0.268'
    inputs: {}
    formula: tan(15 * pi / 180)
    expected: '0.268'
    shown: ['$\tan 15° \approx 0.268$']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: curve-v-squared
    where: 'worked example "Designing a banked curve": 120 × 9.81 × 0.268 ≈ 315'
    inputs: {}
    formula: 120 * 9.81 * tan(15 * pi / 180)
    expected: '315'
    shown: ['\approx \sqrt{315} \approx 17.8$ m/s']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: curve-speed
    where: 'worked example "Designing a banked curve" and the graph point: v = √(120 × 9.81 × tan 15°)'
    inputs: {r: 120 m, g: 9.81 m/s**2}
    formula: sqrt(r * g * tan(15 * pi / 180))
    expected: 17.8 m/s
    shown: ['\approx \sqrt{315} \approx 17.8$ m/s', 'label: "15°, 120 m: 17.8 m/s"']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: curve-kmh
    where: 'worked example "Designing a banked curve": 17.8 m/s is about 64 km/h'
    inputs: {v: 17.76 m/s}
    formula: v
    expected: 64 km/hour
    shown: ['about 64 km/h']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: plot-point
    where: 'graph: point at φ = 15°, v = 17.76 m/s for r = 120 m'
    inputs: {}
    formula: sqrt(120 * 9.81 * tan(15 * pi / 180))
    expected: '17.76'
    shown: ['{ x: 15, y: 17.76, label']
    source: {cite: reading3, at: 'transcript 11.2, p. 3'}
    origin: page-own

  - id: bucket-top
    kind: identity
    where: 'section "The rotating bucket": with N = 0 at the top, m g = m v²/R gives v = √(g R)'
    formula: m * g - m * (sqrt(g * R))**2 / R
    equals: 0 * R
    samples: {m: [0.003, 1], g: [9.81, 9.8], R: [0.8, 1.2]}
    tolerance: 1e-12
    shown: ['the speed at the top must be at least $\sqrt{gR}$']
    source: {cite: seg113, at: 'segment 11.3'}
    origin: page-own

  - id: bucket-speed
    where: 'worked example "How fast must the bucket go round?": √(9.81 × 0.80)'
    inputs: {g: 9.81 m/s**2, R: 0.80 m}
    formula: sqrt(g * R)
    expected: 2.80 m/s
    shown: ['$v = \sqrt{gR} = \sqrt{9.81 \times 0.80} \approx 2.80$ m/s']
    source: {cite: seg113, at: 'segment 11.3'}
    origin: page-own

  - id: bucket-period
    where: 'worked example "How fast must the bucket go round?": 2π × 0.80/2.80'
    inputs: {R: 0.80 m, g: 9.81 m/s**2}
    formula: 2 * pi * R / sqrt(g * R)
    expected: 1.79 s
    shown: ['$2\pi R/v = 2\pi \times 0.80/2.80 \approx 1.79$ s']
    source: {cite: seg113, at: 'segment 11.3'}
    origin: page-own

  - id: notes-moon-distance
    kind: fact
    where: 'section "Gravity on a circle": the notes use R_e,m = 3.82 × 10⁸ m'
    value: 3.82e8
    shown: ['$R_{e,m} = 3.82 \times 10^8$ m']
    source: {cite: reading1, at: 'p. 9-4'}
    origin: mit

  - id: notes-earth-mass
    kind: fact
    where: 'section "Gravity on a circle": the notes use m₂ = 5.98 × 10²⁴ kg'
    value: 5.98e24
    shown: ['$m_2 = 5.98 \times 10^{24}$ kg']
    source: {cite: reading1, at: 'p. 9-4'}
    origin: mit

  - id: moon-period
    where: 'section "Gravity on a circle": T = √(4π² R³/(G m₂)) with the notes'' values (G = 6.67 × 10⁻¹¹)'
    inputs: {R: 3.82e8 m, M: 5.98e24 kg, Gn: 6.67e-11 m**3/(kg*s**2)}
    formula: sqrt(4 * pi**2 * R**3 / (Gn * M))
    expected: 2.35e6 s
    shown: ['the notes find $T \approx 2.35 \times 10^6$ s']
    source: {cite: reading1, at: 'Eq. (9.2.5), p. 9-5'}
    origin: mit

  - id: moon-period-days
    where: 'section "Gravity on a circle": 2.35 × 10⁶ s is 27.2 days'
    inputs: {T: 2.35e6 s}
    formula: T
    expected: 27.2 day
    shown: ['or 27.2 days']
    source: {cite: reading1, at: 'Eq. (9.2.6), p. 9-5'}
    origin: mit

  - id: synodic-month
    kind: fact
    where: 'section "Gravity on a circle": the synodic month is 29.53 days on average'
    value: 29.53
    shown: ['29.53 days on average']
    source: {cite: reading1, at: 'p. 9-5'}
    origin: mit

  - id: sun-speed
    kind: fact
    where: 'cosmology callout: about 229 km/s'
    value: 229
    shown: ['at about 229 km/s']
    source: {ref: eilers2019}
    origin: later-data

  - id: sun-distance
    kind: fact
    where: 'cosmology callout: about 8178 parsecs'
    value: 8178
    shown: ['at about 8178 parsecs']
    source: {ref: gravity2019}
    origin: later-data

  - id: galaxy-mass
    where: 'cosmology callout: v² R/G with v = 229 km/s, R = 8178 pc'
    inputs: {v: 229 km/s, R: 8178 pc}
    formula: v**2 * R / G
    expected: 2.0e41 kg
    shown: ['That gives about $2.0 \times 10^{41}$ kg']
    source: {cite: eilers2019}
    origin: page-own

  - id: galaxy-mass-suns
    where: 'cosmology callout: roughly 10¹¹ solar masses'
    inputs: {v: 229 km/s, R: 8178 pc}
    formula: v**2 * R / G / M_sun
    expected: '1e11'
    tolerance: 0.1e11
    shown: ['roughly $10^{11}$ solar masses']
    source: {cite: eilers2019}
    origin: page-own

  - id: kepler-solve
    kind: identity
    where: 'cosmology callout: 4π² R³/(G T²) = v² R/G for a circle (v = 2π R/T)'
    formula: 4 * pi**2 * R**3 / (Gx * T**2)
    equals: (2 * pi * R / T)**2 * R / Gx
    samples: {R: [3.0, 7.5], T: [2.0, 11.0], Gx: [1.0, 6.7]}
    tolerance: 1e-9
    shown: ['$m_2 = 4\pi^2R^3/(GT^2) = v^2R/G$']
    source: {cite: reading1, at: 'Eq. (9.2.7), p. 9-6'}
    origin: page-own
