# Calculations on content/year-1/8.01/contact-forces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 6 (segments 6.1–6.2) and Course Notes Chapter 8, Section 8.3. g = 9.8 m/s² throughout.

page: content/year-1/8.01/contact-forces.mdx
calcs:
  - id: lift-normal-force
    where: 'worked example "Standing in a lift", step "Solve": N = m(g + a) = 678 N'
    inputs: {m: 60 kg, g: 9.8 m/s**2, a: 1.5 m/s**2}
    formula: m * (g + a)
    expected: 678 N
    shown: ['$N = m(g + a) = 60 \times (9.8 + 1.5) = 678$ N']
    source: {cite: reading1, at: 'Eqs. (8.3.2)–(8.3.4), p. 8-12'}
    origin: page-own

  - id: lift-scale-kg
    where: 'worked example, step "Interpret": about 69 kg on a kilogram scale'
    inputs: {N: 678 N, g: 9.8 m/s**2}
    formula: N / g
    expected: 69 kg
    shown: ['about 69 kg on a scale calibrated in kilograms']
    source: {cite: reading1, at: 'p. 8-12'}
    origin: page-own

  - id: lift-gravity
    where: 'worked example, step "Interpret": gravity on the person is still 60 × 9.8 = 588 N'
    inputs: {m: 60 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 588 N
    shown: ['$60 \times 9.8 = 588$ N']
    source: {cite: reading1, at: 'p. 8-12'}
    origin: page-own

  - id: friction-history
    kind: fact
    where: 'section "Kinetic friction": da Vinci about 1493–1515, Amontons 1699'
    value: 1699
    shown: ['between about 1493 and 1515; Guillaume Amontons rediscovered his results and published them in 1699']
    source: {cite: reading1, at: 'p. 8-14'}
    origin: mit

  - id: crate-normal
    where: 'worked example "Pushing a crate", step "Normal force": N = mg = 245 N'
    inputs: {m: 25 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 245 N
    shown: ['$N = mg = 25 \times 9.8 = 245$ N']
    source: {cite: reading1, at: 'Eq. (8.3.4), p. 8-12'}
    origin: page-own

  - id: crate-push
    where: 'worked example, step "Constant speed means balance": F = μ_k N ≈ 74 N; also step "Check" and quiz 2'
    inputs: {mu: 0.30, N: 245 N}
    formula: mu * N
    expected: 74 N
    shown: ['$F = \mu_k N = 0.30 \times 245 \approx 74$ N', 'Pushing at 74 N on a crate']
    source: {cite: reading1, at: 'Eq. (8.3.5), p. 8-14'}
    origin: page-own

  - id: crate-push-quiz
    where: 'quiz 2: marked choice "About 59 N"'
    inputs: {mu: 0.20, m: 30 kg, g: 9.8 m/s**2, u: 1 N}
    formula: mu * m * g / u
    expected: 59
    shown: ['$F = \\mu_k N = \\mu_k mg = 0.20 \\times 30 \\times 9.8 \\approx 59$ N."']
    quiz: 1
    source: {cite: reading1, at: 'Eq. (8.3.5), p. 8-14'}
    origin: page-own

  - id: static-max-quiz
    where: 'quiz 3: the question gives the maximum static friction, 98 N; it matches a 20 kg box with μ_s = 0.5 (the plot defaults), and the static friction equals the 20 N push'
    inputs: {mu: 0.5, m: 20 kg, g: 9.8 m/s**2}
    formula: mu * m * g
    expected: 98 N
    shown: ['The maximum static friction would be 98 N', 'it exactly balances your 20 N push. 98 N is only its upper limit']
    source: {cite: reading1, at: 'Eq. (8.3.7), p. 8-15'}
    origin: page-own

  - id: plot-slip
    where: 'plot caption: with 20 kg, μ_s = 0.5, μ_k = 0.4 it slips at 98 N and kinetic friction is 78 N'
    inputs: {mu: 0.5, m: 20 kg, g: 9.8 m/s**2}
    formula: mu * m * g
    expected: 98 N
    shown: ['it slips at 98 N and kinetic friction is 78 N']
    source: {cite: reading1, at: 'Eqs. (8.3.5)–(8.3.7), pp. 8-14–8-15'}
    origin: page-own

  - id: plot-kinetic
    where: 'plot caption: kinetic friction 0.4 × 20 × 9.8 ≈ 78 N'
    inputs: {mu: 0.4, m: 20 kg, g: 9.8 m/s**2}
    formula: mu * m * g
    expected: 78 N
    shown: ['it slips at 98 N and kinetic friction is 78 N']
    source: {cite: reading1, at: 'Eq. (8.3.5), p. 8-14'}
    origin: page-own

  - id: slip-angle
    where: 'worked example "When does a block start to slide down a slope?", step "Just slipping": θ = arctan 0.45 ≈ 24.2°'
    formula: atan(0.45) * 180 / pi
    expected: 24.2
    shown: ['$\theta = \arctan 0.45 \approx 24.2°$']
    source: {cite: reading1, at: 'Eq. (8.3.7), p. 8-15'}
    origin: page-own

  - id: slip-condition
    kind: identity
    where: 'worked example, step "Just slipping": mg sin θ = μ_s mg cos θ is tan θ = μ_s'
    formula: sin(atan(mu)) - mu * cos(atan(mu))
    equals: 0 * mu
    samples: {mu: [0.1, 0.45, 1.2]}
    tolerance: 1e-12
    shown: ['The block slips when $\tan\theta = \mu_s$']
    source: {cite: reading1, at: 'Eq. (8.3.7), p. 8-15'}
    origin: page-own

  - id: slide-acceleration
    where: 'worked example, step "Sliding": a = 9.8 × (0.410 − 0.35 × 0.912) ≈ 0.89 m/s²'
    inputs: {g: 9.8 m/s**2}
    formula: g * (sin(atan(0.45)) - 0.35 * cos(atan(0.45)))
    expected: 0.89 m/s**2
    shown: ['$a = g(\sin\theta - \mu_k\cos\theta) = 9.8 \times (0.410 - 0.35 \times 0.912) \approx 0.89$ m/s²']
    source: {cite: reading1, at: 'Eq. (8.3.5), p. 8-14'}
    origin: page-own
