# Calculations on content/year-1/8.01/newtons-laws.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-1/8.01/newtons-laws.mdx
calcs:
  - id: acceleration-component
    where: 'worked example "Two ropes on a puck", step "Acceleration": a_x = a_y = 4.0 N / 2.0 kg; quiz 3 explanation (the quiz choices are not matched automatically: every choice ends in m/s², whose "2" the matcher would read as a number)'
    inputs: {F: 4.0 N, m: 2.0 kg}
    formula: F / m
    expected: 2.0 m/s**2
    shown: ['$\vec a = \vec F_\text{net}/m = (2.0\,\hat i + 2.0\,\hat j)\ \text{m/s}^2$', 'divided by 2.0 kg gives $(2\\hat i + 2\\hat j)\\ \\text{m/s}^2$']
    source: {cite: reading1, at: 'Chapter 7'}
    origin: page-own

  - id: acceleration-magnitude
    where: 'worked example, step "Acceleration"'
    inputs: {F: 4.0 N, m: 2.0 kg}
    formula: sqrt(2) * F / m
    expected: 2.83 m/s**2
    shown: ['with magnitude $2.83\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Chapter 7'}
    origin: page-own

  - id: velocity-component
    where: 'worked example, step "Velocity after 3.0 s"'
    inputs: {F: 4.0 N, m: 2.0 kg, t: 3.0 s}
    formula: F / m * t
    expected: 6.0 m/s
    shown: ['$\vec v = \vec a\,t = (6.0\,\hat i + 6.0\,\hat j)\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 7'}
    origin: page-own

  - id: speed
    where: 'worked example, step "Velocity after 3.0 s"'
    inputs: {F: 4.0 N, m: 2.0 kg, t: 3.0 s}
    formula: sqrt(2) * F / m * t
    expected: 8.5 m/s
    shown: ['a speed of $8.5\ \text{m/s}$']
    source: {cite: reading1, at: 'Chapter 7'}
    origin: page-own

  - id: quiz-mass-ratio
    where: 'quiz 1 explanation: m_B/m_A = a_A/a_B = 3 (two choices contain the number 3, so the quiz itself is not matched automatically)'
    inputs: {aA: 6 m/s**2, aB: 2 m/s**2}
    formula: aA / aB
    expected: '3'
    tolerance: '1e-9'
    shown: ['$m_B/m_A = a_A/a_B = 3$']
    source: {cite: reading1, at: 'Chapter 7'}
    origin: page-own
