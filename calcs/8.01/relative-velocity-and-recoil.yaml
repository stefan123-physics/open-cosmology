# Calculations on content/year-1/8.01/relative-velocity-and-recoil.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 18 (segments 18.1–18.4) and Course Notes Chapter 11, with the page's own numbers.

page: content/year-1/8.01/relative-velocity-and-recoil.mdx
calcs:
  - id: quiz-train
    where: 'quiz 1: 30 + (−1.5) = 28.5 m/s'
    inputs: {V: 30 m/s, u: 1.5 m/s}
    formula: V - u
    expected: 28.5 m/s
    shown: ['$30 + (-1.5) = 28.5$ m/s']
    source: {cite: reading1, at: 'Eq. (11.3.2), p. 11-4'}
    origin: page-own

  - id: rain-speed
    where: 'worked example "Rain on a windscreen": speed √(20² + 8.0²) ≈ 21.5 m/s'
    inputs: {vx: 20 m/s, vy: 8.0 m/s}
    formula: sqrt(vx**2 + vy**2)
    expected: 21.5 m/s
    shown: ['\sqrt{20^2 + 8.0^2} \approx 21.5$ m/s']
    source: {cite: reading1, at: 'Eq. (11.3.2), p. 11-4'}
    origin: page-own

  - id: rain-angle
    where: 'same worked example: tan⁻¹(20/8.0) ≈ 68° from the vertical'
    inputs: {}
    formula: atan(20 / 8.0) * 180 / pi
    expected: '68'
    shown: ['\tan^{-1}(20/8.0) \approx 68°']
    source: {cite: reading1, at: 'Example 11.1, pp. 11-4–11-6'}
    origin: page-own

  - id: recoil-ground
    kind: identity
    where: 'formula "Recoil in the ground frame": v_c = −m_p u/(m_c + m_p) solves 0 = m_c v_c + m_p (v_c + u)'
    formula: mc * (-mp * u / (mc + mp)) + mp * (-mp * u / (mc + mp) + u)
    equals: 0 * u
    samples: {mc: [15.0, 30.0], mp: [60.0, 50.0], u: [3.0, 1.2]}
    tolerance: 1e-9
    shown: ['v_c = -\frac{m_p\,u}{m_c + m_p}']
    source: {cite: reading4, at: 'p. 1'}
    origin: mit

  - id: recoil-person
    kind: identity
    where: 'section "Solving in the ground frame": v_p = v_c + u = m_c u/(m_c + m_p)'
    formula: -mp * u / (mc + mp) + u
    equals: mc * u / (mc + mp)
    samples: {mc: [15.0, 30.0], mp: [60.0, 50.0], u: [3.0, 1.2]}
    tolerance: 1e-9
    shown: ['$v_p = v_c + u = m_c u/(m_c + m_p)$']
    source: {cite: reading4, at: 'p. 1'}
    origin: mit

  - id: recoil-moving
    kind: identity
    where: 'formula "Recoil in the moving frame": −(m_p + m_c) v_c = m_p u with the same v_c'
    formula: -(mp + mc) * (-mp * u / (mp + mc))
    equals: mp * u
    samples: {mc: [15.0, 30.0], mp: [60.0, 50.0], u: [3.0, 1.2]}
    tolerance: 1e-9
    shown: ['-(m_p + m_c)\,v_c = m_p\,u']
    source: {cite: reading5, at: 'p. 1'}
    origin: mit

  - id: sled
    where: 'worked example "Jumping off a sled" and quiz 3: v_c = −60 × 3.0/75 = −2.4 m/s'
    inputs: {mp: 60 kg, mc: 15 kg, u: 3.0 m/s}
    formula: -mp * u / (mp + mc)
    expected: -2.4 m/s
    shown: ['$v_c = -m_p u/(m_p + m_c) = -60 \times 3.0/75 = -2.4$ m/s']
    source: {cite: reading4, at: 'p. 1'}
    origin: page-own

  - id: skater
    where: 'same worked example and quiz 4: v_p = −2.4 + 3.0 = 0.6 m/s'
    inputs: {mp: 60 kg, mc: 15 kg, u: 3.0 m/s}
    formula: -mp * u / (mp + mc) + u
    expected: 0.6 m/s
    shown: ['$v_p = v_c + u = -2.4 + 3.0 = 0.6$ m/s. Check']
    source: {cite: reading4, at: 'p. 1'}
    origin: page-own

  - id: skater-momentum
    where: 'same worked example, check: 60 × 0.6 = 36 kg·m/s'
    inputs: {mp: 60 kg, vp: 0.6 m/s}
    formula: mp * vp
    expected: 36 kg*m/s
    shown: ['$60 \times 0.6 + 15 \times (-2.4) = 36 - 36 = 0$']
    source: {cite: reading4, at: 'p. 1'}
    origin: page-own

  - id: sled-wrong
    where: 'same worked example, "The usual mistake": −60 × 3.0/15 = −12 m/s'
    inputs: {mp: 60 kg, mc: 15 kg, u: 3.0 m/s}
    formula: -mp * u / mc
    expected: -12 m/s
    shown: ['$v_c = -60 \times 3.0/15 = -12$ m/s']
    source: {cite: reading4, at: 'p. 1'}
    origin: page-own

  - id: cart-angle-formula
    kind: identity
    where: 'formula "Angle seen from the ground": tan φ = (m1+m2+m3)/(m1+m2) tan θ follows from Eqs. (11.4.19) and (11.4.21)'
    formula: (v0 * sin(th)) / (v0 * cos(th) - m3 * v0 * cos(th) / (m1 + m2 + m3))
    equals: (m1 + m2 + m3) / (m1 + m2) * tan(th)
    samples: {m1: [50.0, 70.0], m2: [30.0, 10.0], m3: [2.0, 5.0], v0: [10.0, 4.0], th: [0.698, 0.3]}
    tolerance: 1e-9
    shown: ['\tan\varphi = \frac{m_1 + m_2 + m_3}{m_1 + m_2}\,\tan\theta']
    source: {cite: reading1, at: 'Eq. (11.4.22), p. 11-10'}
    origin: mit

  - id: throw-recoil
    where: 'worked example "A throw from a cart": 2.0 × 10 × cos 40°/82 ≈ 0.187 m/s'
    inputs: {m3: 2.0 kg, v0: 10 m/s, M: 82 kg}
    formula: m3 * v0 * cos(40 * pi / 180) / M
    expected: 0.187 m/s
    shown: ['\cos 40°/82 \approx 0.187$ m/s']
    source: {cite: reading1, at: 'Eq. (11.4.19), p. 11-9'}
    origin: page-own

  - id: throw-vx
    where: 'same worked example: 10 cos 40° − 0.187 ≈ 7.47 m/s'
    inputs: {m3: 2.0 kg, v0: 10 m/s, M: 82 kg}
    formula: v0 * cos(40 * pi / 180) - m3 * v0 * cos(40 * pi / 180) / M
    expected: 7.47 m/s
    shown: ['$10\cos 40° - 0.187 \approx 7.47$ m/s']
    source: {cite: reading1, at: 'Eq. (11.4.21), p. 11-9'}
    origin: page-own

  - id: throw-vy
    where: 'same worked example: 10 sin 40° ≈ 6.43 m/s'
    inputs: {v0: 10 m/s}
    formula: v0 * sin(40 * pi / 180)
    expected: 6.43 m/s
    shown: ['$10 \sin 40° \approx 6.43$ m/s']
    source: {cite: reading1, at: 'Eq. (11.4.21), p. 11-9'}
    origin: page-own

  - id: throw-angle
    where: 'same worked example: tan⁻¹(6.43/7.47) ≈ 40.7°'
    inputs: {}
    formula: atan(82 / 80 * tan(40 * pi / 180)) * 180 / pi
    expected: '40.7'
    shown: ['\tan^{-1}(6.43/7.47) \approx 40.7°']
    source: {cite: reading1, at: 'Eq. (11.4.22), p. 11-10'}
    origin: page-own

  - id: hubble-from-A
    where: 'cosmology note: a galaxy 50 Mpc from A recedes from A at 70 × 50 = 3500 km/s'
    inputs: {H0: 70 km/s/Mpc, d: 50 Mpc}
    formula: H0 * d
    expected: 3500 km/s
    shown: ['recedes from A at 3500 km/s']
    source: {cite: reading1, at: 'Eq. (11.3.2), p. 11-4'}
    origin: page-own
