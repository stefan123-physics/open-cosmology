# Calculations on content/year-1/8.01/uniform-circular-motion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 9 (segments 9.1–9.2) and Course Notes Chapter 6, Sections 6.3–6.4.1.

page: content/year-1/8.01/uniform-circular-motion.mdx
calcs:
  - id: acceleration-derivation
    kind: identity
    where: 'section "The acceleration points to the centre": d/dt of r θ̇ (−sin θ) with θ = ω t is −r ω² cos θ (x-component of −r ω² r̂)'
    formula: deriv('r * w * (-sin(w * t))', 't', t0)
    equals: -r * w**2 * cos(w * t0)
    samples: {r: [2, 0.5, 3], w: [1.3, 0.4, 2.0], t0: [0.3, 2.1, 1.0]}
    tolerance: 1e-7
    shown: ['-r\left(\frac{d\theta}{dt}\right)^2\hat r(t)']
    source: {cite: reading2, at: 'transcript 9.1, p. 2; result stated in 9.2, p. 1'}
    origin: mit

  - id: chord-of-velocity
    kind: identity
    where: 'section "Why inwards": |Δv| = 2v sin(Δθ/2) is the length of the chord between two vectors of length v an angle Δθ apart'
    formula: sqrt((v * cos(dth) - v)**2 + (v * sin(dth))**2)
    equals: 2 * v * sin(dth / 2)
    samples: {v: [3, 10, 0.7], dth: [0.1, 0.5, 1.2]}
    tolerance: 1e-12
    shown: ['|\Delta\vec v| = 2v\sin(\Delta\theta/2)']
    source: {cite: reading1, at: 'Eq. (6.5.1), p. 10'}
    origin: mit

  - id: forms-agree
    kind: identity
    where: 'section "Five ways to write the same acceleration": r ω² = v²/r = v ω = 4π² r f² = 4π² r/T² with v = r ω, f = ω/2π, T = 1/f'
    formula: (r * w**2) + ((r * w)**2 / r) + ((r * w) * w) + (4 * pi**2 * r * (w / (2 * pi))**2) + (4 * pi**2 * r / (2 * pi / w)**2)
    equals: 5 * r * w**2
    samples: {r: [0.25, 3.0, 50], w: [125.7, 0.4, 2.0]}
    tolerance: 1e-9
    shown: ['$a = r\omega^2 = v^2/r = v\omega = 4\pi^2 r f^2 = 4\pi^2 r/T^2$.']
    source: {cite: reading1, at: 'Eqs. (6.4.6)–(6.4.9), pp. 8–9'}
    origin: mit

  - id: plot-point
    where: 'graph: the marked point, 20 m/s on a 50 m circle, at 8 m/s²'
    inputs: {v: 20 m/s, r: 50 m}
    formula: v**2 / r
    expected: 8 m/s**2
    shown: ['{ x: 20, y: 8, label: "20 m/s on a 50 m circle" }']
    source: {cite: reading1, at: 'Eq. (6.4.7), p. 8'}
    origin: page-own

  - id: quiz-cyclist
    where: 'quiz 2: a = v²/r = 400/50 = 8.0 m/s²'
    inputs: {v: 20 m/s, r: 50 m}
    formula: v**2 / r
    expected: 8.0 m/s**2
    shown: ['= (20)^2/50 = 400/50 = 8.0$ m/s²']
    quiz: 1
    source: {cite: reading1, at: 'Eq. (6.4.7), p. 8'}
    origin: page-own

  - id: quiz-double-speed
    where: 'quiz 3: doubling v multiplies v²/r by 4'
    inputs: {}
    formula: 2**2
    expected: '4'
    shown: ['$2^2 = 4$']
    source: {cite: reading1, at: 'Eq. (6.4.7), p. 8'}
    origin: page-own

  - id: quiz-period
    where: 'quiz 4: T = 2π/ω with ω = 0.50 rad/s'
    inputs: {w: 0.50 1/s}
    formula: 2 * pi / w
    expected: 12.6 s
    shown: ['$T = 2\\pi/\\omega = 2\\pi/0.50 \\approx 12.6$ s.']
    quiz: 3
    source: {cite: reading1, at: 'Eq. (6.4.4), p. 8'}
    origin: page-own

  - id: drum-frequency
    where: 'worked example "A washing machine", step "Frequency and period": 1200 turns per minute is 20 Hz'
    inputs: {n: 1200, m: 60 s}
    formula: n / m
    expected: 20 Hz
    shown: ['$f = 1200/60 = 20$ Hz']
    source: {cite: reading1, at: 'Eq. (6.4.5), p. 8'}
    origin: page-own

  - id: drum-period
    where: 'worked example "A washing machine": T = 1/f'
    inputs: {f: 20 Hz}
    formula: 1 / f
    expected: 0.050 s
    shown: ['$T = 1/f = 0.050$ s']
    source: {cite: reading1, at: 'Eq. (6.4.5), p. 8'}
    origin: page-own

  - id: drum-omega
    where: 'worked example "A washing machine", step "Angular speed and speed": ω = 2π f'
    inputs: {f: 20 Hz}
    formula: 2 * pi * f
    expected: 125.7 1/s
    shown: ['$\omega = 2\pi f = 2\pi \times 20 \approx 125.7$ rad/s']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: drum-speed
    where: 'worked example "A washing machine": v = r ω'
    inputs: {r: 0.25 m, f: 20 Hz}
    formula: r * 2 * pi * f
    expected: 31.4 m/s
    shown: ['$v = r\omega = 0.25 \times 125.7 \approx 31.4$ m/s']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: drum-acceleration
    where: 'worked example "A washing machine", step "Centripetal acceleration, five ways": r ω² ≈ 3950 m/s² (all five forms; see forms-agree)'
    inputs: {r: 0.25 m, f: 20 Hz}
    formula: r * (2 * pi * f)**2
    expected: 3950 m/s**2
    tolerance: 5 m/s**2
    shown: ['$r\omega^2 = 0.25 \times 125.7^2 \approx 3950$ m/s²', '$4\pi^2 r f^2 = 39.48 \times 0.25 \times 400 \approx 3950$', '$4\pi^2 r/T^2 = 39.48 \times 0.25/0.0025 \approx 3950$ m/s²']
    source: {cite: reading1, at: 'Eqs. (6.4.6)–(6.4.9), pp. 8–9'}
    origin: page-own

  - id: drum-four-pi-squared
    where: 'worked example "A washing machine": 4π² ≈ 39.48'
    inputs: {}
    formula: 4 * pi**2
    expected: 39.48
    shown: ['39.48 \times 0.25 \times 400']
    source: {cite: reading1, at: 'Eq. (6.4.8), p. 8'}
    origin: page-own

  - id: drum-in-g
    where: 'worked example "A washing machine", step "Compared with gravity": 3950/9.81 ≈ 400'
    inputs: {a: 3950 m/s**2, g: 9.81 m/s**2}
    formula: a / g
    expected: '400'
    tolerance: 5
    shown: ['$3950/9.81 \approx 400$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: moon-distance
    kind: fact
    where: 'worked example "Newton''s test with the Moon": semimajor axis 384,400 km'
    value: 384400
    shown: ['at a distance of 384,400 km']
    source: {ref: moonfact}
    origin: later-data

  - id: moon-period
    kind: fact
    where: 'worked example "Newton''s test with the Moon": sidereal period 27.3217 days, printed as 27.32'
    value: 27.32
    shown: ['once every 27.32 days']
    source: {ref: moonfact}
    origin: later-data

  - id: moon-period-seconds
    where: 'worked example "Newton''s test with the Moon", step "Period in seconds"'
    inputs: {T: 27.32 day}
    formula: T
    expected: 2.36e6 s
    shown: ['$T = 27.32 \times 86{,}400 \approx 2.36 \times 10^6$ s']
    source: {cite: moonfact}
    origin: page-own

  - id: moon-acceleration
    where: 'worked example "Newton''s test with the Moon", step "Centripetal acceleration": 4π² r/T²'
    inputs: {r: 384400 km, T: 27.32 day}
    formula: 4 * pi**2 * r / T**2
    expected: 2.72e-3 m/s**2
    shown: ['\approx 2.72 \times 10^{-3}$ m/s²']
    source: {cite: reading1, at: 'Eq. (6.4.9), p. 9'}
    origin: page-own

  - id: moon-earth-radii
    where: 'worked example "Newton''s test with the Moon": the Moon is about 60 Earth radii away (R_E = 6371 km)'
    inputs: {r: 384400 km, R: 6371 km}
    formula: r / R
    expected: '60'
    tolerance: 1
    shown: ['about 60 Earth radii away']
    source: {cite: moonfact}
    origin: page-own

  - id: moon-g-over-3600
    where: 'worked example "Newton''s test with the Moon", step "Compare": g/60²'
    inputs: {g: 9.81 m/s**2}
    formula: g / 60**2
    expected: 2.73e-3 m/s**2
    shown: ['$g/60^2 = 9.81/3600 \approx 2.73 \times 10^{-3}$ m/s²']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: sun-speed
    kind: fact
    where: 'cosmology callout: the Sun circles the Galactic centre at about 229 km/s'
    value: 229
    shown: ['at about 229 km/s']
    source: {ref: eilers2019}
    origin: later-data

  - id: sun-distance
    kind: fact
    where: 'cosmology callout: R₀ = 8178 pc'
    value: 8178
    shown: ['at a distance of 8178 parsecs']
    source: {ref: gravity2019}
    origin: later-data

  - id: sun-distance-metres
    where: 'cosmology callout: 8178 pc ≈ 2.5 × 10²⁰ m'
    inputs: {R: 8178 pc}
    formula: R
    expected: 2.5e20 m
    shown: ['about 2.5 × 10²⁰ m']
    source: {cite: gravity2019}
    origin: page-own

  - id: sun-period
    where: 'cosmology callout: T = 2π r/v ≈ 220 million years'
    inputs: {R: 8178 pc, v: 229 km/s}
    formula: 2 * pi * R / v
    expected: 220e6 yr
    tolerance: 5e6 yr
    shown: ['a period $T = 2\pi r/v$ of about 220 million years']
    source: {cite: eilers2019}
    origin: page-own

  - id: sun-acceleration
    where: 'cosmology callout: v²/r ≈ 2 × 10⁻¹⁰ m/s²'
    inputs: {R: 8178 pc, v: 229 km/s}
    formula: v**2 / R
    expected: 2e-10 m/s**2
    shown: ['$v^2/r$ of only about 2 × 10⁻¹⁰ m/s²']
    source: {cite: eilers2019}
    origin: page-own

  - id: mond-scale
    kind: fact
    where: 'cosmology callout and leadsTo: MOND changes gravity below about 10⁻¹⁰ m/s² (Ferreras Section 7.2, as on the MOND page)'
    value: 1.0e-10
    shown: ['proposes that gravity itself changes, about 10⁻¹⁰ m/s².']
    source: {ref: ferreras}
    origin: later-data

  - id: sun-over-mond
    where: 'cosmology callout: v²/r at the Sun is only about twice the MOND scale 10⁻¹⁰ m/s²'
    inputs: {R: 8178 pc, v: 229 km/s, a0: 1e-10 m/s**2}
    formula: v**2 / R / a0
    expected: '2'
    tolerance: 0.2
    shown: ['That is only about twice the acceleration below which']
    source: {cite: eilers2019}
    origin: page-own

  - id: g-comparison
    kind: fact
    where: 'graph: the dashed line g = 9.81 m/s²'
    value: 9.81
    shown: ['{ expr: "9.81", label: "g, for comparison", dash: true }']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own
