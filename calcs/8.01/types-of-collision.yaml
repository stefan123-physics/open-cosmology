# Calculations on content/year-1/8.01/types-of-collision.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 26 (segments 26.1–26.3) and Course Notes Chapter 15, Sections 15.1, 15.3 and Example 15.2, with the page's own numbers.

page: content/year-1/8.01/types-of-collision.mdx
calcs:
  - id: loss-fraction
    kind: identity
    where: 'formula "Kinetic energy lost": ½(m1+m2)v_f² − ½m1v1² = −m2/(m1+m2) · ½m1v1²'
    formula: 0.5 * (m1 + m2) * (m1 * v / (m1 + m2))**2 - 0.5 * m1 * v**2
    equals: -m2 / (m1 + m2) * 0.5 * m1 * v**2
    samples: {m1: [1500.0, 0.01], m2: [1000.0, 2.0], v: [20.0, 400.0]}
    tolerance: 1e-6
    shown: ['= -\frac{m_2}{m_1 + m_2}\,K_i']
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: mit

  - id: crash-speed
    where: 'worked example (a): v_f = 1500 × 20/2500 = 12 m/s'
    inputs: {m1: 1500 kg, m2: 1000 kg, v: 20 m/s}
    formula: m1 * v / (m1 + m2)
    expected: 12 m/s
    shown: ['$v_f = 1500 \times 20/2500 = 12$ m/s']
    source: {cite: reading4, at: 'pp. 1–2'}
    origin: page-own

  - id: crash-ki
    where: 'same: K_i = 300 kJ'
    inputs: {m1: 1500 kg, v: 20 m/s}
    formula: 0.5 * m1 * v**2
    expected: 300 kJ
    shown: ['= 300$ kJ']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own

  - id: crash-kf
    where: 'same: K_f = 180 kJ'
    inputs: {M: 2500 kg, v: 12 m/s}
    formula: 0.5 * M * v**2
    expected: 180 kJ
    shown: ['= 180$ kJ: 120 kJ']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own

  - id: crash-fraction
    where: 'same and quiz 2: m2/(m1 + m2) = 0.4'
    inputs: {}
    formula: 1000 / 2500
    expected: '0.4'
    shown: ['as $m_2/(m_1 + m_2) = 0.4$ says']
    source: {cite: reading1, at: 'Eq. (15.5.5), p. 15-14'}
    origin: page-own

  - id: bullet-speed
    where: 'worked example (b): 0.010 × 400/2.01 ≈ 1.99 m/s'
    inputs: {m: 0.010 kg, u: 400 m/s, M: 2.01 kg}
    formula: m * u / M
    expected: 1.99 m/s
    shown: ['$v_f = 0.010 \times 400/2.01 \approx 1.99$ m/s']
    source: {cite: reading4, at: 'pp. 1–2'}
    origin: page-own

  - id: bullet-fraction
    where: 'same: 2.0/2.01 ≈ 0.995'
    inputs: {}
    formula: 2.0 / 2.01
    expected: '0.995'
    shown: ['$2.0/2.01 \approx 0.995$, or 99.5%']
    source: {cite: reading1, at: 'Eq. (15.5.5), p. 15-14'}
    origin: page-own

  - id: pendulum-height
    where: 'same: h = v²/2g ≈ 0.20 m'
    inputs: {v: 1.99 m/s, g: 9.8 m/s^2}
    formula: v**2 / (2 * g)
    expected: 0.20 m
    shown: ['rises $h = v_f^2/2g \approx 0.20$ m']
    source: {cite: reading1, at: 'p. 15-13'}
    origin: page-own
