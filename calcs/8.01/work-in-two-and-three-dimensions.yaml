# Calculations on content/year-1/8.01/work-in-two-and-three-dimensions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 21 (segments 21.1–21.6) and Course Notes Chapter 13, Sections 13.8–13.11, with the page's own numbers.

page: content/year-1/8.01/work-in-two-and-three-dimensions.mdx
calcs:
  - id: dot-components
    where: 'worked example "The angle between two vectors" and quiz 1: 3 × 2 + 4 × (−1) = 2'
    inputs: {}
    formula: 3 * 2 + 4 * (-1)
    expected: '2'
    tolerance: '1e-9'
    shown: ['$\vec A\cdot\vec B = 6 - 4 = 2$']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: length-A
    where: 'same worked example: |A| = 5'
    inputs: {}
    formula: sqrt(3**2 + 4**2)
    expected: '5'
    tolerance: '1e-9'
    shown: ['$|\vec A| = 5$']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: page-own

  - id: length-B
    where: 'same worked example: |B| = √5 ≈ 2.236'
    inputs: {}
    formula: sqrt(2**2 + 1**2)
    expected: '2.236'
    shown: ['$|\vec B| = \sqrt5 \approx 2.236$']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: page-own

  - id: cos-angle
    where: 'same worked example: cos θ = 2/(5√5) ≈ 0.179'
    inputs: {}
    formula: 2 / (5 * sqrt(5))
    expected: '0.179'
    shown: ['$\cos\theta = 2/(5\sqrt5) \approx 0.179$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: angle
    where: 'same worked example: θ ≈ 79.7°'
    inputs: {}
    formula: acos(2 / (5 * sqrt(5))) * 180 / pi
    expected: '79.7'
    shown: ['so $\theta \approx 79.7°$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: sled
    where: 'worked example "Pulling at an angle" (a) and quiz 3: 50 × 20 × cos 30° ≈ 866 J'
    inputs: {F: 50 N, d: 20 m}
    formula: F * d * cos(30 * pi / 180)
    expected: 866 J
    shown: ['$W = |\vec F|\,|\Delta\vec x|\cos 30° = 50 \times 20 \times 0.866 \approx 866$ J']
    source: {cite: reading1, at: 'Eq. (13.8.16), p. 13-25'}
    origin: page-own

  - id: constant-force-work
    where: 'same (b): 3 × 4 + 2 × (−1) = 10 J'
    inputs: {}
    formula: 3 * 4 + 2 * (-1)
    expected: '10'
    tolerance: '1e-9'
    shown: ['$W = \vec F\cdot\Delta\vec s = 3 \times 4 + 2 \times (-1) = 10$ J']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: notes-gravity
    where: 'section "A block down a ramp": notes Example 13.10, 4.0 × 9.8 × 3.0 × sin 30° = 58.8 J'
    inputs: {m: 4.0 kg, g: 9.8 m/s^2, l: 3.0 m}
    formula: m * g * l * sin(30 * pi / 180)
    expected: 58.8 J
    shown: ['gets $+58.8$ J from gravity']
    source: {cite: reading1, at: 'Example 13.10, p. 13-26'}
    origin: mit

  - id: notes-friction
    where: 'same: −0.2 × 4.0 × 9.8 × cos 30° × 3.0 = −20.4 J'
    inputs: {m: 4.0 kg, g: 9.8 m/s^2, l: 3.0 m}
    formula: -0.2 * m * g * cos(30 * pi / 180) * l
    expected: -20.4 J
    shown: ['$-20.4$ J from friction']
    source: {cite: reading1, at: 'Example 13.10, p. 13-26'}
    origin: mit

  - id: notes-total
    where: 'same: total 38.4 J'
    inputs: {m: 4.0 kg, g: 9.8 m/s^2, l: 3.0 m}
    formula: m * g * l * (sin(30 * pi / 180) - 0.2 * cos(30 * pi / 180))
    expected: 38.4 J
    shown: ['$38.4$ J in all']
    source: {cite: reading1, at: 'Example 13.10, p. 13-27'}
    origin: mit

  - id: ramp-gravity
    where: 'worked example "Down a 25° ramp": 2.0 × 9.8 × 4.0 × sin 25° ≈ 33.1 J'
    inputs: {m: 2.0 kg, g: 9.8 m/s^2, L: 4.0 m}
    formula: m * g * L * sin(25 * pi / 180)
    expected: 33.1 J
    shown: ['Gravity: $2.0 \times 9.8 \times 4.0 \times \sin 25° \approx 33.1$ J']
    source: {cite: reading7, at: 'p. 2'}
    origin: page-own

  - id: ramp-friction
    where: 'same: −0.15 × 2.0 × 9.8 × cos 25° × 4.0 ≈ −10.7 J'
    inputs: {m: 2.0 kg, g: 9.8 m/s^2, L: 4.0 m}
    formula: -0.15 * m * g * cos(25 * pi / 180) * L
    expected: -10.7 J
    shown: ['\times 4.0 \approx -10.7$ J']
    source: {cite: reading7, at: 'p. 2'}
    origin: page-own

  - id: ramp-total
    where: 'same: total ≈ 22.5 J'
    inputs: {m: 2.0 kg, g: 9.8 m/s^2, L: 4.0 m}
    formula: m * g * L * (sin(25 * pi / 180) - 0.15 * cos(25 * pi / 180))
    expected: 22.5 J
    shown: ['Total $\approx 22.5$ J.']
    source: {cite: reading7, at: 'p. 2'}
    origin: page-own

  - id: ramp-speed
    where: 'same and quiz 4: v ≈ 4.7 m/s'
    inputs: {m: 2.0 kg, g: 9.8 m/s^2, L: 4.0 m}
    formula: sqrt(2 * g * L * (sin(25 * pi / 180) - 0.15 * cos(25 * pi / 180)))
    expected: 4.7 m/s
    shown: ['gives $v \approx 4.7$ m/s']
    quiz: 3
    source: {cite: reading7, at: 'p. 2'}
    origin: page-own

  - id: line-of-sight
    where: 'cosmology note: 300 km/s at 60° to the line of sight shows 300 cos 60° = 150 km/s'
    inputs: {v: 300 km/s}
    formula: v * cos(60 * pi / 180)
    expected: 150 km/s
    shown: ['shows only 150 km/s']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: theorem-components
    kind: identity
    where: 'formula "Work–kinetic energy theorem": ∫ v dv over each component gives ½(v_f² − v_i²)'
    formula: integrate('x', 'x', vi, vf)
    equals: (vf**2 - vi**2) / 2
    samples: {vi: [1.0, -2.0], vf: [4.0, 3.0]}
    tolerance: 1e-9
    shown: ['= \tfrac12 m v_B^2 - \tfrac12 m v_A^2 = \Delta K']
    source: {cite: reading6, at: 'pp. 1–2'}
    origin: mit
