# Calculations on content/year-1/8.01/centre-of-mass.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 17 (segments 17.1–17.7) and Course Notes Chapter 10, Sections 10.5–10.6, with the page's own numbers.

page: content/year-1/8.01/centre-of-mass.mdx
calcs:
  - id: quiz-two-masses
    where: 'quiz 1: X = (2.0 × 0 + 6.0 × 4.0)/8.0 = 3.0 m'
    inputs: {m1: 2.0 kg, m2: 6.0 kg, x2: 4.0 m}
    formula: m2 * x2 / (m1 + m2)
    expected: 3.0 m
    shown: ['= 24/8.0 = 3.0$ m']
    quiz: 0
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: planets-x-sum
    where: 'formula "Three planets": 35 + 3 × 5 + 0.5 × 40 = 70 (in units of m1)'
    inputs: {}
    formula: 1 * 35 + 3 * 5 + 0.5 * 40
    expected: '70'
    tolerance: '1e-9'
    shown: ['(35 + 15 + 20)\,\hat i']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: mit

  - id: planets-y-sum
    where: 'formula "Three planets": 10 + 3 × 20 + 0.5 × 30 = 85 (in units of m1)'
    inputs: {}
    formula: 1 * 10 + 3 * 20 + 0.5 * 30
    expected: '85'
    tolerance: '1e-9'
    shown: ['(10 + 60 + 15)\,\hat j']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: mit

  - id: planets-x
    where: 'formula "Three planets": 70/4.5 ≈ 15.6 (the lecture says 15.5)'
    inputs: {}
    formula: 70 / 4.5
    expected: '15.6'
    shown: ['\approx 15.6\,\hat i', 'it is 15.6']
    source: {cite: reading3, at: 'p. 3'}
    origin: slip
    note: 'The lecture rounds 70/4.5 = 15.56 down to 15.5; the page gives 15.6 and says so.'

  - id: planets-y
    where: 'formula "Three planets": 85/4.5 ≈ 18.9'
    inputs: {}
    formula: 85 / 4.5
    expected: '18.9'
    shown: ['18.9\,\hat j']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: saturn-mass
    kind: fact
    where: 'section "Three planets": the lecture''s 318 Earth masses for Saturn is Jupiter''s mass'
    value: 318
    shown: ['Saturn 318 Earth masses']
    source: {cite: reading3, at: 'p. 3'}
    origin: slip
    note: 'The lecture gives Saturn 318 Earth masses (Jupiter''s value); the page corrects it to about 95.'

  - id: saturn-mass-correct
    kind: fact
    where: 'section "Three planets": Saturn has about 95 Earth masses'
    value: 95
    shown: ['Saturn has about 95']
    source: {ref: nasa-saturn}
    origin: later-data

  - id: planets-real-x
    where: 'section "Three planets": with Earth 1, Saturn 95, Pluto 0.0025, X ≈ 5.3'
    inputs: {}
    formula: (1 * 35 + 95 * 5 + 0.0025 * 40) / (1 + 95 + 0.0025)
    expected: '5.3'
    shown: ['$(5.3, 19.9)$']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: planets-real-y
    where: 'same: Y ≈ 19.9'
    inputs: {}
    formula: (1 * 10 + 95 * 20 + 0.0025 * 30) / (1 + 95 + 0.0025)
    expected: '19.9'
    shown: ['$(5.3, 19.9)$']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: pluto-mass
    kind: fact
    where: 'section "Three planets": Pluto 0.0025 Earth masses (as quoted in the lecture)'
    value: 0.0025
    shown: ['Pluto 0.0025']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: earth-moon
    where: 'formula "Earth–Moon centre of mass": R = m_m r_em/(m_e + m_m) = 4.66 × 10⁶ m'
    inputs: {mm: 7.34e22 kg, me: 5.98e24 kg, rem: 3.84e8 m}
    formula: mm * rem / (me + mm)
    expected: 4.66e6 m
    shown: ['= 4.66\times 10^{6}\ \text{m}']
    source: {cite: reading1, at: 'Eqs. (10.5.6)–(10.5.7), p. 10-7'}
    origin: mit

  - id: earth-radius
    kind: fact
    where: 'section "Three planets": the Earth''s radius, 6.37 × 10⁶ m (notes, Example 10.2)'
    value: 6.37e6
    shown: ['$6.37\times 10^6$ m']
    source: {cite: reading1, at: 'p. 10-7'}
    origin: mit

  - id: sun-mass
    kind: fact
    where: 'worked example "Does Jupiter pull the Sun''s centre outside the Sun?": Sun''s mass 1.988 × 10³⁰ kg'
    value: 1.988e30
    shown: ['$1.988\times 10^{30}$ kg']
    source: {ref: nasa-sun}
    origin: later-data

  - id: sun-radius
    kind: fact
    where: 'same worked example: Sun''s radius 6.957 × 10⁸ m'
    value: 6.957e8
    shown: ['$6.957\times 10^8$ m']
    source: {ref: nasa-sun}
    origin: later-data

  - id: jupiter-mass
    kind: fact
    where: 'same worked example: Jupiter''s mass 1.898 × 10²⁷ kg'
    value: 1.898e27
    shown: ['$1.898\times 10^{27}$ kg']
    source: {ref: nasa-jupiter}
    origin: later-data

  - id: jupiter-distance
    kind: fact
    where: 'same worked example: Jupiter''s average distance 7.785 × 10¹¹ m'
    value: 7.785e11
    shown: ['$7.785\times 10^{11}$ m']
    source: {ref: nasa-jupiter}
    origin: later-data

  - id: sun-jupiter-total
    where: 'same worked example, step "Compute": M_sun + m_J = 1.9899 × 10³⁰ kg'
    inputs: {Ms: 1.988e30 kg, mJ: 1.898e27 kg}
    formula: Ms + mJ
    expected: 1.9899e30 kg
    shown: ['(1.9899\times 10^{30})']
    source: {cite: reading1, at: 'Eq. (10.5.6), p. 10-7'}
    origin: page-own

  - id: sun-jupiter-cm
    where: 'same worked example, step "Compute", and quiz 5: X ≈ 7.43 × 10⁸ m'
    inputs: {Ms: 1.988e30 kg, mJ: 1.898e27 kg, d: 7.785e11 m}
    formula: mJ * d / (Ms + mJ)
    expected: 7.43e8 m
    shown: ['\approx 7.43\times 10^{8}$ m']
    source: {cite: reading1, at: 'Eq. (10.5.6), p. 10-7'}
    origin: page-own

  - id: sun-jupiter-ratio
    where: 'same worked example, step "Compare", and quiz 5: about 1.07 solar radii'
    inputs: {Ms: 1.988e30 kg, mJ: 1.898e27 kg, d: 7.785e11 m, Rs: 6.957e8 m}
    formula: mJ * d / (Ms + mJ) / Rs
    expected: '1.07'
    shown: ['about $1.07$ times the Sun''s radius', 'about 1.07 solar radii']
    source: {cite: reading1, at: 'Eq. (10.5.6), p. 10-7'}
    origin: page-own

  - id: jupiter-year
    kind: fact
    where: 'same worked example: Jupiter''s orbital period, about 12 years'
    value: 12
    shown: ['about 12 years']
    source: {ref: nasa-jupiter}
    origin: later-data

  - id: cubes-top-height
    where: 'worked example "Two stacked cubes": the small cube''s centre at 0.40 + 0.10 = 0.50 m'
    inputs: {a: 0.40 m, b: 0.20 m}
    formula: a + b / 2
    expected: 0.50 m
    shown: ['$0.40 + 0.10 = 0.50$ m']
    source: {cite: reading5, at: 'text page'}
    origin: page-own

  - id: cubes-cm
    where: 'worked example "Two stacked cubes", step "Combine": Y = 1.10/4.0 = 0.275 m'
    inputs: {m1: 3.0 kg, m2: 1.0 kg, y1: 0.20 m, y2: 0.50 m}
    formula: (m1 * y1 + m2 * y2) / (m1 + m2)
    expected: 0.275 m
    shown: ['$Y = (3.0 \times 0.20 + 1.0 \times 0.50)/4.0 = 1.10/4.0 = 0.275$ m']
    source: {cite: reading5, at: 'text page'}
    origin: page-own

  - id: uniform-rod
    kind: identity
    where: 'formula "Uniform rod": ∫₀ᴸ (M/L) x dx / M = L/2'
    formula: integrate('(M / L) * x', 'x', 0, L) / integrate('M / L', 'x', 0, L)
    equals: L / 2
    samples: {M: [1.0, 3.5], L: [1.0, 2.4]}
    tolerance: 1e-9
    shown: ['= \frac{L}{2}\,\hat i']
    source: {cite: reading6, at: 'pp. 3–4'}
    origin: mit

  - id: nonuniform-rod-mass
    kind: identity
    where: 'notes'' non-uniform rod: M = ∫₀ᴸ λ₀ x²/L² dx = λ₀ L/3'
    formula: integrate('l0 * x**2 / L**2', 'x', 0, L)
    equals: l0 * L / 3
    samples: {l0: [1.0, 2.5], L: [1.0, 3.0]}
    tolerance: 1e-9
    shown: ['= \lambda_0 L/3']
    source: {cite: reading1, at: 'Eq. (10.5.12), p. 10-9'}
    origin: mit

  - id: nonuniform-rod-cm
    kind: identity
    where: 'notes'' non-uniform rod and quiz 2: centre of mass at 3L/4'
    formula: integrate('x * x**2', 'x', 0, L) / integrate('x**2', 'x', 0, L)
    equals: 3 * L / 4
    samples: {L: [1.0, 2.0, 5.0]}
    tolerance: 1e-9
    shown: ['$\tfrac{3}{4} L$', '= 3L/4']
    source: {cite: reading1, at: 'Eq. (10.5.14), p. 10-9'}
    origin: mit

  - id: pole-mass
    where: 'worked example "A rod that thickens", step "Mass": M = 3.0 kg'
    inputs: {}
    formula: integrate('1.0 + 0.5 * x', 'x', 0, 2)
    expected: '3.0'
    shown: ['$M = \int_0^{2} (1.0 + 0.5\,x)\,dx = 2.0 + 0.25 \times 4 = 3.0$ kg']
    source: {cite: reading1, at: 'Eq. (10.5.12), p. 10-9'}
    origin: page-own

  - id: pole-moment
    where: 'worked example "A rod that thickens", step "Centre of mass": ∫ x λ dx ≈ 3.33 kg·m'
    inputs: {}
    formula: integrate('x * (1.0 + 0.5 * x)', 'x', 0, 2)
    expected: '3.33'
    shown: ['\approx 3.33$ kg·m']
    source: {cite: reading1, at: 'Eq. (10.5.14), p. 10-9'}
    origin: page-own

  - id: pole-cm
    where: 'worked example "A rod that thickens" and plot caption: X = 10/9 ≈ 1.11 m'
    inputs: {}
    formula: integrate('x * (1.0 + 0.5 * x)', 'x', 0, 2) / integrate('1.0 + 0.5 * x', 'x', 0, 2)
    expected: '1.11'
    shown: ['$X = 3.33/3.0 \approx 1.11$ m', 'X = 10/9 ≈ 1.11 m']
    source: {cite: reading1, at: 'Eq. (10.5.14), p. 10-9'}
    origin: page-own

  - id: skaters-cm
    where: 'worked example "Skaters pushing apart", step "Centre of mass": X = 90 × 3.0/150 = 1.8 m'
    inputs: {m1: 60 kg, m2: 90 kg, d: 3.0 m}
    formula: m2 * d / (m1 + m2)
    expected: 1.8 m
    shown: ['$X = (60 \times 0 + 90 \times 3.0)/150 = 1.8$ m']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: skaters-distance
    where: 'worked example "Skaters pushing apart", step "The other skater": d = 60 × 2.4/90 = 1.6 m'
    inputs: {m1: 60 kg, m2: 90 kg, s1: 2.4 m}
    formula: m1 * s1 / m2
    expected: 1.6 m
    shown: ['$d = 1.6$ m']
    source: {cite: reading8, at: 'p. 1'}
    origin: page-own

  - id: skaters-speed
    where: 'worked example "Skaters pushing apart": 60 × 1.5/90 = 1.0 m/s'
    inputs: {m1: 60 kg, m2: 90 kg, v1: 1.5 m/s}
    formula: m1 * v1 / m2
    expected: 1.0 m/s
    shown: ['$60 \times 1.5/90 = 1.0$ m/s']
    source: {cite: reading7, at: 'pp. 1–2'}
    origin: page-own
