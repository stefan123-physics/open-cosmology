# Calculations on content/year-1/8.01/circular-motion-position-velocity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 8 (segments 8.1–8.2) and Course Notes Chapter 6, Sections 6.1–6.2.1.

page: content/year-1/8.01/circular-motion-position-velocity.mdx
calcs:
  - id: newton-moon-year
    kind: fact
    where: 'section "Why circular motion needs a force": Newton, 1666'
    value: 1666
    shown: ['Newton realised in 1666']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: unit-vectors-perpendicular
    kind: identity
    where: 'section "Polar unit vectors in Cartesian form": r̂ · θ̂ = 0 and both have length 1'
    formula: cos(t) * (-sin(t)) + sin(t) * cos(t) + (cos(t)**2 + sin(t)**2 - 1) + ((-sin(t))**2 + cos(t)**2 - 1)
    equals: 0 * t
    samples: {t: [0.3, 1.2, 2.5, 4.0, 5.9]}
    tolerance: 1e-12
    shown: ['$\hat\theta$ is $\hat r$ turned by a right angle anticlockwise']
    source: {cite: reading1, at: 'Eqs. (6.2.2)–(6.2.3), p. 2'}
    origin: mit

  - id: velocity-derivation
    kind: identity
    where: 'section "The velocity vector": d/dt (r cos θ(t)) = −r sin θ dθ/dt, checked for θ(t) = 0.7 t² + 0.3 at several t (x-component of r θ̇ θ̂)'
    formula: deriv('r * cos(0.7 * t**2 + 0.3)', 't', t0)
    equals: -r * sin(0.7 * t0**2 + 0.3) * (1.4 * t0)
    samples: {r: [2, 2, 5, 0.5], t0: [0.4, 1.1, 2.0, 0.9]}
    tolerance: 1e-7
    shown: ['The bracket is exactly $\hat\theta$']
    source: {cite: reading3, at: 'transcript 8.2, p. 3'}
    origin: mit

  - id: rhat-derivative
    kind: identity
    where: 'section "The velocity vector": dr̂/dt = θ̇ θ̂ (x-component: d/dt cos θ = −θ̇ sin θ), for θ(t) = 1.3 t'
    formula: deriv('cos(1.3 * t)', 't', t0)
    equals: 1.3 * (-sin(1.3 * t0))
    samples: {t0: [0.2, 1.0, 2.7]}
    tolerance: 1e-7
    shown: ['tex="\frac{d\hat r}{dt} = \frac{d\theta}{dt}\,\hat\theta']
    source: {cite: reading1, at: 'Eq. (6.2.4), p. 3'}
    origin: mit

  - id: thetahat-derivative
    kind: identity
    where: 'section "The velocity vector": dθ̂/dt = −θ̇ r̂ (x-component: d/dt (−sin θ) = −θ̇ cos θ), for θ(t) = 1.3 t'
    formula: deriv('-sin(1.3 * t)', 't', t0)
    equals: -1.3 * cos(1.3 * t0)
    samples: {t0: [0.2, 1.0, 2.7]}
    tolerance: 1e-7
    shown: ['\frac{d\hat\theta}{dt} = -\frac{d\theta}{dt}\,\hat r"']
    source: {cite: reading1, at: 'Eq. (6.2.7), p. 3'}
    origin: mit

  - id: roundabout-speed
    where: 'worked example "A car on a roundabout", step "Tangential component": 50 × 0.40 = 20 m/s'
    inputs: {r: 50 m, w: 0.40 1/s}
    formula: r * w
    expected: 20 m/s
    shown: ['$v_\theta = r\,d\theta/dt = 50 \times 0.40 = 20$ m/s']
    source: {cite: reading1, at: 'Eq. (6.2.9), p. 3'}
    origin: page-own

  - id: roundabout-thetahat-x
    where: 'worked example, step "The unit vector θ̂ at 30°": −sin 30° = −0.500'
    formula: -sin(30 * pi / 180)
    expected: -0.500
    shown: ['$\hat\theta = -\sin 30°\,\hat i + \cos 30°\,\hat j = -0.500\,\hat i + 0.866\,\hat j$']
    source: {cite: reading1, at: 'Eq. (6.2.3), p. 2'}
    origin: page-own

  - id: roundabout-thetahat-y
    where: 'worked example, step "The unit vector θ̂ at 30°": cos 30° = 0.866'
    formula: cos(30 * pi / 180)
    expected: 0.866
    shown: ['$\hat\theta = -\sin 30°\,\hat i + \cos 30°\,\hat j = -0.500\,\hat i + 0.866\,\hat j$']
    source: {cite: reading1, at: 'Eq. (6.2.3), p. 2'}
    origin: page-own

  - id: roundabout-vx
    where: 'worked example, step "Velocity": v_x = −10.0 m/s'
    formula: -20 * sin(30 * pi / 180)
    expected: -10.0
    shown: ['$\vec v = 20\,\hat\theta = (-10.0\,\hat i + 17.3\,\hat j)$ m/s']
    source: {cite: reading1, at: 'Eq. (6.2.8), p. 3'}
    origin: page-own

  - id: roundabout-vy
    where: 'worked example, step "Velocity": v_y = 17.3 m/s'
    formula: 20 * cos(30 * pi / 180)
    expected: 17.3
    shown: ['$\vec v = 20\,\hat\theta = (-10.0\,\hat i + 17.3\,\hat j)$ m/s']
    source: {cite: reading1, at: 'Eq. (6.2.8), p. 3'}
    origin: page-own

  - id: roundabout-length-check
    where: 'worked example, step "Velocity": √(10.0² + 17.3²) ≈ 20'
    formula: sqrt(10.0**2 + 17.3**2)
    expected: 20
    shown: ['its length is $\sqrt{10.0^2 + 17.3^2} \approx 20$ m/s']
    source: {cite: reading1, at: 'Eq. (6.2.8), p. 3'}
    origin: page-own

  - id: roundabout-perpendicular-check
    where: 'worked example, step "Velocity": (−10.0)(0.866) + (17.3)(0.500) ≈ 0'
    formula: (-10.0) * 0.866 + 17.3 * 0.500
    expected: 0
    tolerance: 0.05
    shown: ['$(-10.0)(0.866) + (17.3)(0.500) \approx 0$']
    source: {cite: reading1, at: 'Eqs. (6.2.2), (6.2.8), pp. 2–3'}
    origin: page-own

  - id: quiz-vtheta
    where: 'quiz 2: v_θ = 2.0 × (−0.5) = −1.0 m/s (choices "1.0" and "−1.0" share the digits, so not checked as a quiz answer)'
    inputs: {r: 2.0 m, w: -0.5 1/s}
    formula: r * w
    expected: -1.0 m/s
    shown: ['$v_\\theta = r\\,d\\theta/dt = 2.0 \\times (-0.5) = -1.0$ m/s']
    source: {cite: reading1, at: 'Eq. (6.2.9), p. 3'}
    origin: page-own

  - id: small-angle-radians
    where: 'worked example "How good is the small-angle approximation?": 10° = 0.1745 rad'
    formula: 10 * pi / 180
    expected: 0.1745
    shown: ['$10° = 0.1745$ rad']
    source: {cite: reading1, at: 'Eqs. (6.2.12)–(6.2.14), pp. 4–5'}
    origin: page-own

  - id: small-angle-sin5
    where: 'worked example, step "The chord": sin 5° = 0.08716'
    formula: sin(5 * pi / 180)
    expected: 0.08716
    shown: ['$2r\sin 5° = 2 \times 0.08716\,r = 0.1743\,r$']
    source: {cite: reading1, at: 'Eq. (6.2.11), p. 4'}
    origin: page-own

  - id: small-angle-chord
    where: 'worked example, step "The chord": 2 sin 5° = 0.1743'
    formula: 2 * sin(5 * pi / 180)
    expected: 0.1743
    shown: ['$2r\sin 5° = 2 \times 0.08716\,r = 0.1743\,r$']
    source: {cite: reading1, at: 'Eq. (6.2.11), p. 4'}
    origin: page-own

  - id: small-angle-difference
    where: 'worked example, step "Compare": the chord is shorter by about 0.13%'
    formula: (1 - 2 * sin(5 * pi / 180) / (10 * pi / 180)) * 100
    expected: 0.13
    shown: ['The chord is shorter by only about 0.13%']
    source: {cite: reading1, at: 'Eqs. (6.2.11)–(6.2.14), pp. 4–5'}
    origin: page-own

  - id: sun-distance-notes
    kind: fact
    where: 'cosmology callout: the notes give 50,000 light years'
    value: 50000
    shown: ['as 50,000 light years']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: sun-distance-gravity
    where: 'cosmology callout: GRAVITY 2019, R₀ = 8178 pc ≈ 26,700 light years, about half the notes'' 50,000'
    inputs: {R: 8178 pc}
    formula: R
    expected: 26700 ly
    tolerance: 50 ly
    shown: ['measured 8178 parsecs in 2019, about 26,700 light years']
    source: {cite: gravity2019, at: 'R₀ = 8178 pc'}
    origin: later-data

  - id: sun-distance-ratio
    where: 'cosmology callout: the notes'' 50,000 ly is about twice the true value'
    inputs: {R: 8178 pc, N: 50000 ly}
    formula: N / R
    expected: 1.9
    shown: ['about twice the true value']
    source: {cite: gravity2019, at: 'R₀ = 8178 pc'}
    origin: later-data

  - id: roundabout-omega
    where: 'section "Angular velocity": the roundabout car has ω_z = +0.40 rad/s, ω = 0.40 k̂ rad/s'
    formula: 20 / 50
    expected: 0.40
    shown: ['$\omega_z = +0.40$ rad/s and $\vec\omega = 0.40\,\hat k$ rad/s']
    source: {cite: reading4, at: 'transcript 8.3, p. 3'}
    origin: page-own

  - id: velocity-from-omega
    kind: identity
    where: 'section "Angular velocity": v = r ω_z θ̂ is the same as r (dθ/dt) θ̂ (speed r|ω_z| = r ω)'
    formula: r * abs(w)
    equals: abs(r * w)
    samples: {r: [50, 2, 0.3], w: [0.4, -0.5, 7]}
    tolerance: 1e-12
    shown: ['tex="\vec v = r\,\omega_z\,\hat\theta"']
    source: {cite: reading4, at: 'transcript 8.3, p. 3'}
    origin: mit
