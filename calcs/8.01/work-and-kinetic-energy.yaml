# Calculations on content/year-1/8.01/work-and-kinetic-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 20 (segments 20.1–20.6) and Course Notes Chapter 13, Sections 13.2–13.7, with the page's own numbers.

page: content/year-1/8.01/work-and-kinetic-energy.mdx
calcs:
  - id: quiz-ke
    where: 'quiz 1: K = ½ × 2.0 × 3.0² = 9.0 J'
    inputs: {m: 2.0 kg, v: 3.0 m/s}
    formula: m * v**2 / 2
    expected: 9.0 J
    shown: ['$K = \\tfrac12 \\times 2.0 \\times 3.0^2 = 9.0$ J']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: quiz-p2-2m
    where: 'quiz 1: p²/2m = 36/4.0 = 9.0 J'
    inputs: {p: 6.0 kg*m/s, m: 2.0 kg}
    formula: p**2 / (2 * m)
    expected: 9.0 J
    shown: ['$p^2/2m = 36/4.0 = 9.0$ J']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: cars-ratio
    where: 'section "Kinetic energy": notes Example 13.1, (60² − 50²)/(20² − 10²) = 11/3'
    inputs: {}
    formula: (60**2 - 50**2) / (20**2 - 10**2)
    expected: '3.6667'
    shown: ['gains $11/3$ times as much']
    source: {cite: reading1, at: 'Example 13.1, pp. 13-5–13-6'}
    origin: mit

  - id: cars-ratio-moving
    where: 'same: in a frame moving at 10 mph, (50² − 40²)/10² = 9'
    inputs: {}
    formula: (50**2 - 40**2) / 10**2
    expected: '9'
    tolerance: '1e-9'
    shown: ['the ratio becomes 9']
    source: {cite: reading1, at: 'Example 13.1, p. 13-6'}
    origin: mit

  - id: cup-push
    where: 'section "Work done by a constant force": notes Example 13.3, 2.0 N × 0.5 m = 1.0 J'
    inputs: {F: 2.0 N, d: 0.5 m}
    formula: F * d
    expected: 1.0 J
    shown: ['a 2.0 N push over 0.5 m does 1.0 J']
    source: {cite: reading1, at: 'Eq. (13.4.6), p. 13-11'}
    origin: mit

  - id: cup-friction
    where: 'same: friction −0.10 × 0.2 × 9.8 × 0.5 = −0.10 J'
    inputs: {mu: 0.10, m: 0.2 kg, g: 9.8 m/s^2, d: 0.5 m}
    formula: -mu * m * g * d
    expected: -0.10 J
    shown: ['does $-0.10$ J']
    source: {cite: reading1, at: 'Eq. (13.4.7), p. 13-11'}
    origin: mit

  - id: spring-work
    kind: identity
    where: 'formula "Work done by a spring": ∫(−kx)dx = −½k(x_f² − x_i²)'
    formula: integrate('-k * x', 'x', xi, xf)
    equals: -k * (xf**2 - xi**2) / 2
    samples: {k: [200.0, 35.0], xi: [-0.1, 0.3], xf: [0.0, 0.1]}
    tolerance: 1e-9
    shown: ['= -\tfrac12\,k\,(x_f^2 - x_i^2)']
    source: {cite: reading1, at: 'Eq. (13.5.5), p. 13-15'}
    origin: mit

  - id: area-3x2
    where: 'plot caption and worked example (c): ∫₀² 3x² dx = 8 J'
    inputs: {}
    formula: integrate('3 * x**2', 'x', 0, 2)
    expected: '8.0'
    shown: ['$W = \int_0^2 3x^2\,dx = 8.0$ J']
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: page-own

  - id: area-rectangle
    where: 'plot caption: the final force 12 N over 2 m would do 24 J; 8 J is one third of it'
    inputs: {F: 12 N, d: 2 m}
    formula: F * d
    expected: 24 J
    shown: ['one third of the 24 J']
    source: {cite: reading3, at: 'pp. 1–2'}
    origin: page-own

  - id: accel-space
    kind: identity
    where: 'formula "Over position": ∫ v dv = ½(v_f² − v_i²)'
    formula: integrate('x', 'x', vi, vf)
    equals: (vf**2 - vi**2) / 2
    samples: {vi: [1.0, 4.0], vf: [3.0, -2.0]}
    tolerance: 1e-9
    shown: ['= \tfrac12\left(v_{x,f}^2 - v_{x,i}^2\right)']
    source: {cite: reading5, at: 'pp. 2–3'}
    origin: mit

  - id: ball-work
    where: 'section "The work–kinetic energy theorem": notes Example 13.7, 0.2 × 9.8 × 10 ≈ 20 J'
    inputs: {m: 0.2 kg, g: 9.8 m/s^2, h: 10 m}
    formula: m * g * h
    expected: 20 J
    shown: ['$W = mg \times 10\ \text{m} \approx 20$ J']
    source: {cite: reading1, at: 'Eq. (13.6.2), p. 13-16'}
    origin: mit

  - id: ball-speed
    where: 'same: v = √(2W/m) ≈ 14 m/s'
    inputs: {m: 0.2 kg, g: 9.8 m/s^2, h: 10 m}
    formula: sqrt(2 * m * g * h / m)
    expected: 14 m/s
    shown: ['$v = \sqrt{2W/m} \approx 14$ m/s']
    source: {cite: reading1, at: 'Eq. (13.6.4), p. 13-16'}
    origin: mit

  - id: brake-dK
    where: 'worked example "Braking and launching" (a): ΔK = −½ × 1200 × 20² = −240 000 J'
    inputs: {m: 1200 kg, v: 20 m/s}
    formula: -(m * v**2 / 2)
    expected: -240000 J
    shown: ['= -240\,000$ J']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: brake-force
    where: 'same (a): F = −240 000 J/40 m = −6000 N'
    inputs: {m: 1200 kg, v: 20 m/s, d: 40 m}
    formula: -(m * v**2 / 2) / d
    expected: -6000 N
    shown: ['so $F_x = -6000$ N']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: spring-launch-work
    where: 'same (b) and quiz 3: W = ½ × 200 × 0.10² = 1.0 J'
    inputs: {k: 200 N/m, x: 0.10 m}
    formula: k * x**2 / 2
    expected: 1.0 J
    shown: ['$W = -\tfrac12 k(0 - 0.10^2) = 1.0$ J']
    source: {cite: reading1, at: 'Eq. (13.5.5), p. 13-15'}
    origin: page-own

  - id: spring-launch-speed
    where: 'same (b) and quiz 3: v = √(2 × 1.0/0.050) ≈ 6.3 m/s'
    inputs: {W: 1.0 J, m: 0.050 kg}
    formula: sqrt(2 * W / m)
    expected: 6.3 m/s
    shown: ['so $v = \sqrt{2 \times 1.0/0.050} \approx 6.3$ m/s']
    quiz: 2
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: ball-average-power
    where: 'section "Power": notes Example 13.8, average power ≈ 14 W'
    inputs: {m: 0.2 kg, g: 9.8 m/s^2, h: 10 m}
    formula: m * g * h / sqrt(2 * h / g)
    expected: 13.7 W
    shown: ['about 13.7 W on average']
    source: {cite: reading1, at: 'Eq. (13.7.7), p. 13-19'}
    origin: mit

  - id: ball-final-power
    where: 'same: instantaneous power at the end ≈ 27 W'
    inputs: {m: 0.2 kg, g: 9.8 m/s^2, h: 10 m}
    formula: m * g * sqrt(2 * g * h)
    expected: 27.4 W
    shown: ['about 27.4 W at the end']
    source: {cite: reading1, at: 'Eq. (13.7.12), p. 13-19'}
    origin: mit

  - id: cyclist
    where: 'worked example "Cycling power" and quiz 5: F = 250/10 = 25 N'
    inputs: {P: 250 W, v: 10 m/s}
    formula: P / v
    expected: 25 N
    shown: ['$P = Fv$: $F = 250/10 = 25$ N.']
    source: {cite: reading7, at: 'p. 1'}
    origin: page-own

  - id: gravity-work
    kind: identity
    where: 'cosmology note: ∫(−GMm/r²)dr from r_i to r_f = GMm(1/r_f − 1/r_i)'
    formula: integrate('-A / x**2', 'x', ri, rf)
    equals: A * (1 / rf - 1 / ri)
    samples: {A: [1.0, 5.0], ri: [1.0, 2.0], rf: [3.0, 2.5]}
    tolerance: 1e-6
    shown: ['= GMm\,(1/r_f - 1/r_i)']
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: page-own
