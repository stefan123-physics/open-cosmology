# Calculations on content/year-1/8.01/energy-conservation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 24 (segments 24.1–24.4) and Course Notes Chapter 14, Sections 14.5, 14.7–14.8 and Example 14.6, with the page's own numbers.

page: content/year-1/8.01/energy-conservation.mdx
calcs:
  - id: friction-integral
    kind: identity
    where: 'formula "Work of a varying friction": −∫₀ᵈ (μ₀ + μ₁x) mg dx = −μ₀mgd − μ₁mg d²/2'
    formula: -integrate('(m0 + m1 * x) * w', 'x', 0, d)
    equals: -m0 * w * d - m1 * w * d**2 / 2
    samples: {m0: [0.1, 0.3], m1: [0.05, 0.2], w: [19.6, 5.0], d: [2.0, 1.2]}
    tolerance: 1e-6
    shown: ['= -\mu_0 mgd - \mu_1 mg\frac{d^2}{2}']
    source: {cite: reading4, at: 'p. 3'}
    origin: mit

  - id: ramp-start
    where: 'worked example "Down a ramp…": E_i = 2.0 × 9.8 × 1.5 = 29.4 J'
    inputs: {m: 2.0 kg, g: 9.8 m/s^2, h: 1.5 m}
    formula: m * g * h
    expected: 29.4 J
    shown: ['$E_i = mgh = 2.0 \times 9.8 \times 1.5 = 29.4$ J']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own

  - id: ramp-friction
    where: 'same: W_nc = −19.6 × 0.30 ≈ −5.88 J'
    inputs: {m: 2.0 kg, g: 9.8 m/s^2, d: 2.0 m, mu0: 0.10, mu1: 0.05 1/m}
    formula: -m * g * (mu0 * d + mu1 * d**2 / 2)
    expected: -5.88 J
    shown: ['= -19.6 \times 0.30 \approx -5.88$ J']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: ramp-spring-energy
    where: 'same: ½ku² = 29.4 − 5.88 = 23.52 J'
    inputs: {}
    formula: 29.4 - 5.88
    expected: '23.52'
    shown: ['= 29.4 - 5.88 = 23.52$ J']
    source: {cite: reading4, at: 'pp. 3–4'}
    origin: page-own

  - id: ramp-compression
    where: 'same: u_f ≈ 0.31 m'
    inputs: {E: 23.52 J, k: 500 N/m}
    formula: sqrt(2 * E / k)
    expected: 0.31 m
    shown: ['so $u_f \approx 0.31$ m']
    source: {cite: reading4, at: 'pp. 3–4'}
    origin: page-own

  - id: sphere-angle
    where: 'formula "Where the object leaves the sphere", quiz 3 and worked example: cos⁻¹(2/3) ≈ 48.2°'
    inputs: {}
    formula: acos(2 / 3) * 180 / pi
    expected: '48.2'
    shown: ['\theta_1 = \cos^{-1}\tfrac23 \approx 48.2^\circ']
    source: {cite: reading1, at: 'Eq. (14.43), p. 14-33'}
    origin: mit

  - id: sphere-energy-check
    kind: identity
    where: 'Example 14.6: with v² = gR cos θ, ½v² + gR cos θ = gR gives cos θ = 2/3'
    formula: 0.5 * (g * R * (2 / 3)) + g * R * (2 / 3)
    equals: g * R
    samples: {g: [9.8, 1.6], R: [6.0, 20.0]}
    tolerance: 1e-9
    shown: ['v_1 = \sqrt{\tfrac23 gR}']
    source: {cite: reading1, at: 'Eqs. (14.41)–(14.44), p. 14-33'}
    origin: mit

  - id: dome-drop
    where: 'worked example "Sliding off a snow dome": drop R/3 = 2.0 m'
    inputs: {R: 6.0 m}
    formula: R - R * (2 / 3)
    expected: 2.0 m
    shown: ['$R - R\cos\theta = R/3 = 2.0$ m']
    source: {cite: reading1, at: 'p. 14-33'}
    origin: page-own

  - id: dome-speed
    where: 'same: v = √(2 × 9.8 × 6.0/3) ≈ 6.3 m/s'
    inputs: {g: 9.8 m/s^2, R: 6.0 m}
    formula: sqrt(2 * g * R / 3)
    expected: 6.3 m/s
    shown: ['$v = \sqrt{2gR/3} = \sqrt{2 \times 9.8 \times 6.0/3} \approx 6.3$ m/s']
    source: {cite: reading1, at: 'Eq. (14.44), p. 14-33'}
    origin: page-own
