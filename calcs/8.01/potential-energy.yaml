# Calculations on content/year-1/8.01/potential-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 23 (segments 23.1–23.5) and Course Notes Chapter 14, Sections 14.3–14.5, with the page's own numbers.

page: content/year-1/8.01/potential-energy.mdx
calcs:
  - id: ball-ke
    where: 'worked example "How high does it go?": K = ½ × 0.50 × 12² = 36 J'
    inputs: {m: 0.50 kg, v: 12 m/s}
    formula: m * v**2 / 2
    expected: 36 J
    shown: ['$K = \tfrac12 \times 0.50 \times 12^2 = 36$ J']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ball-height
    where: 'same and quiz 2: h = 36/(0.50 × 9.8) ≈ 7.3 m'
    inputs: {v: 12 m/s, g: 9.8 m/s^2}
    formula: v**2 / (2 * g)
    expected: 7.3 m
    shown: ['$h = 36/(0.50 \times 9.8) \approx 7.3$ m']
    quiz: 1
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: spring-integral
    kind: identity
    where: 'formula "Spring: change in potential energy": −∫(−kx)dx = ½k(x_f² − x_i²)'
    formula: -integrate('-k * x', 'x', xi, xf)
    equals: k * (xf**2 - xi**2) / 2
    samples: {k: [400.0, 30.0], xi: [0.0, -0.2], xf: [0.05, 0.3]}
    tolerance: 1e-9
    shown: ['= \tfrac12 k x_f^2 - \tfrac12 k x_i^2']
    source: {cite: reading5, at: 'p. 2'}
    origin: mit

  - id: spring-05
    where: 'plot caption: ½ × 400 × 0.05² = 0.5 J'
    inputs: {k: 400 N/m, x: 0.05 m}
    formula: k * x**2 / 2
    expected: 0.5 J
    shown: ['by 0.05 m stores 0.5 J']
    source: {cite: reading5, at: 'p. 3'}
    origin: page-own

  - id: spring-10
    where: 'plot caption: ½ × 400 × 0.10² = 2.0 J'
    inputs: {k: 400 N/m, x: 0.10 m}
    formula: k * x**2 / 2
    expected: 2.0 J
    shown: ['four times as much, 2.0 J']
    source: {cite: reading5, at: 'p. 3'}
    origin: page-own

  - id: gravity-integral
    kind: identity
    where: 'formula "Gravity: change in potential energy": −∫(−GMm/r²)dr = −GMm(1/r_f − 1/r_i)'
    formula: -integrate('-A / x**2', 'x', ri, rf)
    equals: -A * (1 / rf - 1 / ri)
    samples: {A: [1.0, 4.0], ri: [1.0, 3.0], rf: [2.0, 1.5]}
    tolerance: 1e-6
    shown: ['= -GMm\left(\frac{1}{r_f} - \frac{1}{r_i}\right)']
    source: {cite: reading6, at: 'pp. 2–3'}
    origin: mit

  - id: earth-gm
    kind: fact
    where: 'worked example "Escape speed…": GM = 3.986 × 10¹⁴ m³/s²'
    value: 3.986e14
    shown: ['$GM = 3.986\times10^{14}$ m³/s²']
    source: {ref: nasa-earth}
    origin: later-data

  - id: earth-radius
    kind: fact
    where: 'same: R = 6.371 × 10⁶ m'
    value: 6.371e6
    shown: ['$R = 6.371\times10^6$ m']
    source: {ref: nasa-earth}
    origin: later-data

  - id: escape-speed
    where: 'same (a): v = √(2GM/R) ≈ 11.2 km/s'
    inputs: {GM: 3.986e14 m^3/s^2, R: 6.371e6 m}
    formula: sqrt(2 * GM / R)
    expected: 11.2 km/s
    shown: ['$v = \sqrt{2GM/R} \approx 11.2$ km/s']
    source: {cite: reading6, at: 'pp. 3–4'}
    origin: page-own

  - id: satellite-exact
    where: 'same (b): ΔU = GMm(1/R − 1/(R + h)) ≈ 3.70 × 10⁹ J'
    inputs: {GM: 3.986e14 m^3/s^2, R: 6.371e6 m, m: 1000 kg, h: 4e5 m}
    formula: GM * m * (1 / R - 1 / (R + h))
    expected: 3.70e9 J
    shown: ['\approx 3.70\times10^9$ J']
    source: {cite: reading6, at: 'pp. 2–3'}
    origin: page-own

  - id: satellite-mgh
    where: 'same (b): mgh = 1000 × 9.81 × 4 × 10⁵ ≈ 3.92 × 10⁹ J'
    inputs: {m: 1000 kg, g: 9.81 m/s^2, h: 4e5 m}
    formula: m * g * h
    expected: 3.92e9 J
    shown: ['\approx 3.92\times10^9$ J']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: satellite-percent
    where: 'same (b): mgh is about 6% too high'
    inputs: {GM: 3.986e14 m^3/s^2, R: 6.371e6 m, m: 1000 kg, h: 4e5 m, g: 9.81 m/s^2}
    formula: (m * g * h / (GM * m * (1 / R - 1 / (R + h))) - 1) * 100
    expected: '6'
    tolerance: '1'
    shown: ['about 6% too high']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: critical-density
    where: 'cosmology note: ρ = 3H²/(8πG) ≈ 9.2 × 10⁻²⁷ kg/m³ for H0 = 70 km/s/Mpc'
    inputs: {H: 70 km/s/Mpc, G: 6.674e-11 m^3/kg/s^2}
    formula: 3 * H**2 / (8 * pi * G)
    expected: 9.2e-27 kg/m^3
    shown: ['about $9.2\times10^{-27}$ kg/m³']
    source: {cite: reading6, at: 'pp. 3–4'}
    origin: page-own

  - id: hydrogen-atoms
    where: 'cosmology note: about five hydrogen atoms per cubic metre'
    inputs: {rho: 9.2e-27 kg/m^3, mH: 1.674e-27 kg}
    formula: rho / mH
    expected: 5.5 1/m^3
    tolerance: 1 1/m^3
    shown: ['roughly five hydrogen atoms per cubic metre']
    source: {cite: reading6, at: 'pp. 3–4'}
    origin: page-own
