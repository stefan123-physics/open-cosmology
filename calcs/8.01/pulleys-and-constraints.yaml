# Calculations on content/year-1/8.01/pulleys-and-constraints.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 12 (segments 12.1–12.5) and Course Notes Chapter 8, Example 8.9, with the page's own numbers.

page: content/year-1/8.01/pulleys-and-constraints.mdx
calcs:
  - id: a1-solves-system
    kind: identity
    where: 'formula "Acceleration of block 1": a₁ = 2(2m₁ − m₂)g/(4m₁ + m₂) with T = m₁(g − a₁) satisfies m₂g − 2T = m₂a₂, a₂ = −a₁/2'
    formula: m2 * g - 2 * m1 * (g - 2 * (2 * m1 - m2) * g / (4 * m1 + m2)) - m2 * (-(2 * (2 * m1 - m2) * g / (4 * m1 + m2)) / 2)
    equals: 0 * g
    samples: {m1: [1.0, 2.0, 0.5], m2: [3.0, 6.0, 1.0], g: [9.81, 1.0, 9.81]}
    tolerance: 1e-9
    shown: ['a_1 = \frac{2m_1 - m_2}{2m_1 + \tfrac12 m_2}\,g = \frac{2\,(2m_1 - m_2)}{4m_1 + m_2}\,g']
    source: {cite: reading5, at: 'p. 2'}
    origin: mit

  - id: tension-formula
    kind: identity
    where: 'formula "Acceleration of block 2 and the tension": T = m₁(g − a₁) = 3m₁m₂g/(4m₁ + m₂)'
    formula: m1 * (g - 2 * (2 * m1 - m2) * g / (4 * m1 + m2))
    equals: 3 * m1 * m2 * g / (4 * m1 + m2)
    samples: {m1: [1.0, 2.0, 0.5], m2: [3.0, 6.0, 1.0], g: [9.81, 1.0, 9.81]}
    tolerance: 1e-9
    shown: ['T = \frac{3\,m_1 m_2}{4m_1 + m_2}\,g']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: ex1-a1
    where: 'worked example "Unequal blocks", step "Acceleration of block 1"'
    inputs: {m1: 2.0 kg, m2: 6.0 kg, g: 9.81 m/s**2}
    formula: 2 * (2 * m1 - m2) * g / (4 * m1 + m2)
    expected: -2.80 m/s**2
    shown: ['-4 \times 9.81/14 \approx -2.80$ m/s²']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: ex1-a2
    where: 'worked example "Unequal blocks", step "Acceleration of block 2"'
    inputs: {m1: 2.0 kg, m2: 6.0 kg, g: 9.81 m/s**2}
    formula: -(2 * (2 * m1 - m2) * g / (4 * m1 + m2)) / 2
    expected: 1.40 m/s**2
    shown: ['$a_2 = -a_1/2 \approx 1.40$ m/s²']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: ex1-tension
    where: 'worked example "Unequal blocks", step "Tension"'
    inputs: {m1: 2.0 kg, m2: 6.0 kg, g: 9.81 m/s**2}
    formula: 3 * m1 * m2 * g / (4 * m1 + m2)
    expected: 25.2 N
    shown: ['$T = 3 \times 2.0 \times 6.0 \times 9.81/14 \approx 25.2$ N']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: ex1-check
    where: 'worked example "Unequal blocks": m₁g − T = 19.62 − 25.23 = −5.61 N'
    inputs: {m1: 2.0 kg, m2: 6.0 kg, g: 9.81 m/s**2}
    formula: m1 * g - 3 * m1 * m2 * g / (4 * m1 + m2)
    expected: -5.61 N
    shown: ['$m_1 g - T = 19.62 - 25.23 = -5.61$ N']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ex1-weight
    where: 'worked example "Unequal blocks": m₁g = 19.62 N'
    inputs: {m1: 2.0 kg, g: 9.81 m/s**2}
    formula: m1 * g
    expected: 19.62 N
    shown: ['19.62 - 25.23']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ex1-ma
    where: 'worked example "Unequal blocks": m₁a₁ = 2.0 × (−2.80) = −5.61 N'
    inputs: {m1: 2.0 kg, m2: 6.0 kg, g: 9.81 m/s**2}
    formula: m1 * 2 * (2 * m1 - m2) * g / (4 * m1 + m2)
    expected: -5.61 N
    shown: ['$m_1 a_1 = 2.0 \times (-2.80) = -5.61$ N']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: quiz-virtual
    where: 'quiz 1: the movable pulley drops 10 cm, so the other block rises 2 × 10 = 20 cm'
    inputs: {dy2: 10 cm}
    formula: 2 * dy2
    expected: 20 cm
    shown: ['"rises 20 cm"']
    quiz: 0
    source: {cite: reading4, at: 'p. 1'}
    origin: page-own

  - id: notes-three-blocks
    kind: identity
    where: 'formula "Tension in string B": with T_B from Eq. (8.6.67), the accelerations satisfy 2a₁ + a₂ + a₃ = 0'
    formula: 2 * (g - 2 * (4 * g * m1 * m2 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)) / m1) + (g - (4 * g * m1 * m2 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)) / m2) + (g - (4 * g * m1 * m2 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)) / m3)
    equals: 0 * g
    samples: {m1: [4.0, 1.0, 2.0], m2: [1.0, 2.0, 3.0], m3: [2.0, 5.0, 1.0], g: [9.81, 9.81, 1.0]}
    tolerance: 1e-9
    shown: ['T_B = \frac{4g\,m_1 m_2 m_3}{m_1 m_3 + m_1 m_2 + 4m_2 m_3}']
    source: {cite: reading1, at: 'Eqs. (8.6.67), (8.6.69)–(8.6.71), pp. 8-42–8-43'}
    origin: mit

  - id: ex2-denominator
    where: 'worked example "Three blocks": the denominator m₁m₃ + m₁m₂ + 4m₂m₃ = 20 kg²'
    inputs: {m1: 4.0, m2: 1.0, m3: 2.0}
    formula: m1 * m3 + m1 * m2 + 4 * m2 * m3
    expected: '20'
    shown: ['$4 \times 2 + 4 \times 1 + 4 \times 1 \times 2 = 20$ kg²']
    source: {cite: reading1, at: 'Eq. (8.6.67), p. 8-42'}
    origin: page-own

  - id: ex2-TB
    where: 'worked example "Three blocks", step "Tensions": T_B'
    inputs: {m1: 4.0 kg, m2: 1.0 kg, m3: 2.0 kg, g: 9.81 m/s**2}
    formula: 4 * g * m1 * m2 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)
    expected: 15.7 N
    shown: ['$T_B = 4 \times 9.81 \times 8/20 \approx 15.7$ N']
    source: {cite: reading1, at: 'Eq. (8.6.67), p. 8-42'}
    origin: page-own

  - id: ex2-TA
    where: 'worked example "Three blocks", step "Tensions": T_A = 2T_B'
    inputs: {m1: 4.0 kg, m2: 1.0 kg, m3: 2.0 kg, g: 9.81 m/s**2}
    formula: 8 * g * m1 * m2 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)
    expected: 31.4 N
    shown: ['$T_A = 2T_B \approx 31.4$ N']
    source: {cite: reading1, at: 'Eq. (8.6.68), p. 8-42'}
    origin: page-own

  - id: ex2-a1
    where: 'worked example "Three blocks", step "Accelerations": a₁'
    inputs: {m1: 4.0 kg, m2: 1.0 kg, m3: 2.0 kg, g: 9.81 m/s**2}
    formula: g - 8 * g * m2 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)
    expected: 1.96 m/s**2
    shown: ['$a_1 = 9.81 - 31.39/4.0 \approx 1.96$ m/s²']
    source: {cite: reading1, at: 'Eq. (8.6.69), p. 8-42'}
    origin: page-own

  - id: ex2-a2
    where: 'worked example "Three blocks", step "Accelerations": a₂'
    inputs: {m1: 4.0 kg, m2: 1.0 kg, m3: 2.0 kg, g: 9.81 m/s**2}
    formula: g - 4 * g * m1 * m3 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)
    expected: -5.89 m/s**2
    shown: ['$a_2 = 9.81 - 15.70/1.0 \approx -5.89$ m/s²']
    source: {cite: reading1, at: 'Eq. (8.6.70), p. 8-43'}
    origin: page-own

  - id: ex2-a3
    where: 'worked example "Three blocks", step "Accelerations": a₃'
    inputs: {m1: 4.0 kg, m2: 1.0 kg, m3: 2.0 kg, g: 9.81 m/s**2}
    formula: g - 4 * g * m1 * m2 / (m1 * m3 + m1 * m2 + 4 * m2 * m3)
    expected: 1.96 m/s**2
    shown: ['$a_3 = 9.81 - 15.70/2.0 \approx 1.96$ m/s²']
    source: {cite: reading1, at: 'Eq. (8.6.71), p. 8-43'}
    origin: page-own

  - id: ex2-check
    where: 'worked example "Three blocks", step "Check the constraint": −5.89 + 1.96 + 3.92 ≈ 0'
    inputs: {}
    formula: -5.89 + 1.96 + 3.92
    expected: '0'
    tolerance: 0.01
    shown: ['$a_2 + a_3 + 2a_1 = -5.89 + 1.96 + 3.92 \approx 0$']
    source: {cite: reading1, at: 'p. 8-43'}
    origin: page-own

  - id: horizontal-force
    kind: identity
    where: 'formula "Force needed for a given acceleration": F = (m₁ + 4m₂/9) a₁ from the four equations and a₁ = 3a₂/2'
    formula: m1 * a1 + 2 * (m2 * (2 * a1 / 3) / 3)
    equals: (m1 + 4 * m2 / 9) * a1
    samples: {m1: [1.0, 2.5], m2: [3.0, 0.7], a1: [0.9, 2.0]}
    tolerance: 1e-9
    shown: ['F = \left(m_1 + \tfrac49\,m_2\right) a_1']
    source: {cite: reading6, at: 'p. 4'}
    origin: page-own

  - id: horizontal-power
    kind: identity
    where: 'section "A horizontal system": F v₁ = m₁a₁v₁ + m₂a₂v₂ with v₂ = 2v₁/3, a₂ = 2a₁/3'
    formula: (m1 + 4 * m2 / 9) * a1 * v1
    equals: m1 * a1 * v1 + m2 * (2 * a1 / 3) * (2 * v1 / 3)
    samples: {m1: [1.0, 2.5], m2: [3.0, 0.7], a1: [0.9, 2.0], v1: [1.0, 0.3]}
    tolerance: 1e-9
    shown: ['$F v_1 = m_1 a_1 v_1 + m_2 a_2 v_2$']
    source: {cite: reading6, at: 'pp. 2–4'}
    origin: page-own

  - id: ex3-force
    where: 'worked example "Pulling the horizontal system", step "Force"'
    inputs: {m1: 1.0 kg, m2: 3.0 kg, a1: 0.90 m/s**2}
    formula: (m1 + 4 * m2 / 9) * a1
    expected: 2.1 N
    shown: ['(1.0 + 1.333) \times 0.90 \approx 2.1$ N']
    source: {cite: reading6, at: 'p. 4'}
    origin: page-own

  - id: ex3-fraction
    where: 'worked example "Pulling the horizontal system": 4/9 × 3.0 = 1.333'
    inputs: {}
    formula: 4 / 9 * 3.0
    expected: '1.333'
    shown: ['(1.0 + 1.333)']
    source: {cite: reading6, at: 'p. 4'}
    origin: page-own

  - id: ex3-a2
    where: 'worked example "Pulling the horizontal system", step "Tensions": a₂ = 2a₁/3 = 0.60 m/s²'
    inputs: {a1: 0.90 m/s**2}
    formula: 2 * a1 / 3
    expected: 0.60 m/s**2
    shown: ['$a_2 = \tfrac23 \times 0.90 = 0.60$ m/s²']
    source: {cite: reading6, at: 'p. 3'}
    origin: page-own

  - id: ex3-T
    where: 'worked example "Pulling the horizontal system": T = m₂a₂/3 = 0.60 N'
    inputs: {m2: 3.0 kg, a1: 0.90 m/s**2}
    formula: m2 * (2 * a1 / 3) / 3
    expected: 0.60 N
    shown: ['$T = m_2 a_2/3 = 0.60$ N']
    source: {cite: reading6, at: 'p. 4'}
    origin: page-own

  - id: ex3-TA
    where: 'worked example "Pulling the horizontal system": T_A = T_B = 2T = 1.2 N'
    inputs: {m2: 3.0 kg, a1: 0.90 m/s**2}
    formula: 2 * m2 * (2 * a1 / 3) / 3
    expected: 1.2 N
    shown: ['$T_A = T_B = 1.2$ N']
    source: {cite: reading6, at: 'p. 4'}
    origin: page-own

  - id: ex3-check
    where: 'worked example "Pulling the horizontal system": F − T_B = 0.9 N = m₁a₁'
    inputs: {m1: 1.0 kg, a1: 0.90 m/s**2}
    formula: m1 * a1
    expected: 0.9 N
    shown: ['$F - T_B = 2.1 - 1.2 = 0.9$ N $= m_1 a_1$']
    source: {cite: reading6, at: 'p. 4'}
    origin: page-own
