  # ---- Problem 5

  # The answer against the motion itself. For an inverse-cube attraction of strength kf (force kf/r³) the
  # separation obeys r² = d² − 2 d v0 x + (v0² − w²) x², with x the time since t0 and w² = kf/(μ d²)
  # (μ the reduced mass): d²(r²)/dt² is constant for this force law. The collision is at x = d/(v0 + w),
  # so a given collision time fixes w = d/(t1 − t0) − v0. Particle 1 has the velocity
  # V_cm − (m2/(m1 + m2)) dr/dt. Its integral over the whole trip must equal L.
  - id: p5-distance-by-integration
    kind: identity
    answer: p5-dist
    where: 'Problem 5, answer box and formula "Distance travelled by particle 1": against numerical integration of the velocity of particle 1 in the exact inverse-cube motion'
    formula: (m2*d + m1*v0*(t1 - t0))/(m1 + m2)
    equals: integrate('m1 * v0 / (m1 + m2) - m2 / (m1 + m2) * (-d * v0 + (v0**2 - (d / (t1 - t0) - v0)**2) * x) / sqrt(d**2 - 2 * d * v0 * x + (v0**2 - (d / (t1 - t0) - v0)**2) * x**2)', 'x', 0, t1 - t0)
    samples:
      m1: [1, 2, 1.0, 5, 1.5]
      m2: [3, 5, 3.0, 0.2, 4]
      d: [10, 20, 12, 15, 11]
      v0: [1, 2, 2.0, 1.5, 0]
      t0: [0, 1, 0, 2.5, 0.7]
      t1: [2, 3, 4.0, 9, 3.3]
    tolerance: 1e-6
    shown: ['L = X_\text{cm}(t_1) - 0 = \frac{m_2\,d + m_1 v_0\,(t_1 - t_0)}{m_1 + m_2}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

