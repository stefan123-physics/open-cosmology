# Calculations on content/year-1/8.01/rolling-energy-and-angular-momentum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 37 (segments 37.1–37.4) and Course Notes Chapter 20, Sections 20.3–20.4 and Example 20.5, with the page's own numbers.

page: content/year-1/8.01/rolling-energy-and-angular-momentum.mdx
calcs:
  - id: energy-speed
    kind: identity
    where: 'formula "Speed at the bottom, by energy": ½(m + I/R²)v² = mgh'
    formula: 0.5 * (m + I / R**2) * (2 * m * g * h / (m + I / R**2))
    equals: m * g * h
    samples: {m: [1.0, 7.0], I: [0.02, 0.0339], R: [0.1, 0.11], g: [9.8, 9.8], h: [1.0, 2.0]}
    tolerance: 1e-9
    shown: ['v_f = \sqrt{\frac{2mgh}{m + I_{\text{cm}}/R^2}}']
    source: {cite: reading3, at: 'p. 2'}
    origin: mit

  - id: ball-ktrans
    where: 'worked example (a): K_trans = ½ × 7.0 × 8.0² = 224 J'
    inputs: {m: 7.0 kg, v: 8.0 m/s}
    formula: 0.5 * m * v**2
    expected: 224 J
    shown: ['= \frac{1}{2} \times 7.0 \times 8.0^2 = 224$ J']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ball-krot
    where: 'same: K_rot = (2/5) × 224 ≈ 89.6 J'
    inputs: {m: 7.0 kg, v: 8.0 m/s}
    formula: 0.5 * (2 / 5) * m * v**2
    expected: 89.6 J
    shown: ['\times 224 \approx 89.6$ J']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ball-ktotal
    where: 'same: total about 314 J'
    inputs: {m: 7.0 kg, v: 8.0 m/s}
    formula: 0.5 * (7 / 5) * m * v**2
    expected: 314 J
    tolerance: '1%'
    shown: ['so the total is about 314 J']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ball-orbital
    where: 'same: orbital mvR = 7.0 × 8.0 × 0.11 ≈ 6.16 kg m²/s'
    inputs: {m: 7.0 kg, v: 8.0 m/s, R: 0.11 m}
    formula: m * v * R
    expected: 6.16 kg*m^2/s
    shown: ['$|\vec R \times m\vec V_{\text{cm}}| = mvR = 7.0 \times 8.0 \times 0.11 \approx 6.16$ kg m²/s']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: ball-spin
    where: 'same: spin (2/5) mvR ≈ 2.46 kg m²/s'
    inputs: {m: 7.0 kg, v: 8.0 m/s, R: 0.11 m}
    formula: 2 / 5 * m * v * R
    expected: 2.46 kg*m^2/s
    shown: ['\frac{2}{5}mvR \approx 2.46$ kg m²/s']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: ball-total-l
    where: 'same: total (7/5) mvR ≈ 8.62 kg m²/s'
    inputs: {m: 7.0 kg, v: 8.0 m/s, R: 0.11 m}
    formula: 7 / 5 * m * v * R
    expected: 8.62 kg*m^2/s
    shown: ['$\frac{7}{5}mvR \approx 8.62$ kg m²/s']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: cylinder-v
    where: 'worked example (b) and quiz 3: √(4gh/3) ≈ 3.6 m/s'
    inputs: {g: 9.8 m/s^2, h: 1.0 m}
    formula: sqrt(4 / 3 * g * h)
    expected: 3.6 m/s
    shown: ['\times 9.8 \times 1.0} \approx 3.6$ m/s']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: no-rotation-v
    where: 'quiz 3: √(2gh) ≈ 4.4 m/s'
    inputs: {g: 9.8 m/s^2, h: 1.0 m}
    formula: sqrt(2 * g * h)
    expected: 4.4 m/s
    shown: ['\\sqrt{2gh} \\approx 4.4$ m/s']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: earth-orbital
    where: 'note: Earth orbital L ≈ 2.7 × 10^40 kg m²/s (notes Example 20.5)'
    inputs: {m: 5.97e24 kg, r: 1.50e11 m, w: 1.991e-7 1/s}
    formula: m * r**2 * w
    expected: 2.7e40 kg*m^2/s
    tolerance: '2%'
    shown: ['about $2.7 \times 10^{40}$ kg m²/s']
    source: {cite: reading1, at: 'Eq. (20.3.20), p. 20-16'}
    origin: mit

  - id: earth-spin
    where: 'same: spin ≈ 7.1 × 10^33 kg m²/s'
    inputs: {m: 5.97e24 kg, R: 6.38e6 m, w: 7.293e-5 1/s}
    formula: 2 / 5 * m * R**2 * w
    expected: 7.1e33 kg*m^2/s
    tolerance: '1%'
    shown: ['about $7.1 \times 10^{33}$ kg m²/s']
    source: {cite: reading1, at: 'Eq. (20.3.23), p. 20-16'}
    origin: mit

  - id: earth-ratio
    where: 'same: ratio about 3.8 million'
    inputs: {}
    formula: (5.97e24 * 1.50e11**2 * 1.991e-7) / (2 / 5 * 5.97e24 * 6.38e6**2 * 7.293e-5)
    expected: '3.8e6'
    tolerance: '2%'
    shown: ['about 3.8 million times larger']
    source: {cite: reading1, at: 'Eq. (20.3.24), p. 20-17'}
    origin: mit
