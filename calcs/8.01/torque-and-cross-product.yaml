# Calculations on content/year-1/8.01/torque-and-cross-product.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 30 (segments 30.1–30.5) and Course Notes Chapter 17, Sections 17.1–17.3 and 17.4.2, with the page's own numbers.

page: content/year-1/8.01/torque-and-cross-product.mdx
calcs:
  - id: components-perpendicular
    kind: identity
    where: 'formula "Vector product in components": A × B is perpendicular to A'
    formula: ax * (ay * bz - az * by) + ay * (az * bx - ax * bz) + az * (ax * by - ay * bx)
    equals: 0 * ax
    samples: {ax: [2.0, -1.0], ay: [1.0, 4.0], az: [0.0, 2.5], bx: [1.0, 3.0], by: [3.0, -2.0], bz: [2.0, 1.5]}
    tolerance: 1e-9
    shown: ['(A_yB_z - A_zB_y)\,\hat i + (A_zB_x - A_xB_z)\,\hat j + (A_xB_y - A_yB_x)\,\hat k']
    source: {cite: reading4, at: 'pp. 3–4'}
    origin: mit

  - id: components-magnitude
    kind: identity
    where: 'same: |A × B|² = |A|²|B|² − (A·B)² (so |A × B| = AB sin θ)'
    formula: (ay * bz - az * by)**2 + (az * bx - ax * bz)**2 + (ax * by - ay * bx)**2
    equals: (ax**2 + ay**2 + az**2) * (bx**2 + by**2 + bz**2) - (ax * bx + ay * by + az * bz)**2
    samples: {ax: [2.0, -1.0], ay: [1.0, 4.0], az: [0.0, 2.5], bx: [1.0, 3.0], by: [3.0, -2.0], bz: [2.0, 1.5]}
    tolerance: 1e-9
    shown: ['|\vec A \times \vec B| = |\vec A|\,|\vec B|\sin\theta, \qquad 0 \le \theta \le \pi']
    source: {cite: reading3, at: 'pp. 1–2'}
    origin: mit

  - id: example-a-x
    where: 'worked example (a): î component 1 × 2 − 0 × 3 = 2'
    inputs: {}
    formula: 1 * 2 - 0 * 3
    expected: '2'
    shown: ['$\hat i$ part $1 \times 2 - 0 \times 3 = 2$']
    source: {cite: reading4, at: 'p. 4'}
    origin: page-own

  - id: example-a-y
    where: 'same: ĵ component 0 × 1 − 2 × 2 = −4'
    inputs: {}
    formula: 0 * 1 - 2 * 2
    expected: '-4'
    shown: ['$\hat j$ part $0 \times 1 - 2 \times 2 = -4$']
    source: {cite: reading4, at: 'p. 4'}
    origin: page-own

  - id: example-a-z
    where: 'same: k̂ component 2 × 3 − 1 × 1 = 5'
    inputs: {}
    formula: 2 * 3 - 1 * 1
    expected: '5'
    shown: ['$\hat k$ part $2 \times 3 - 1 \times 1 = 5$']
    source: {cite: reading4, at: 'p. 4'}
    origin: page-own

  - id: example-a-area
    where: 'same: √45 ≈ 6.7'
    inputs: {}
    formula: sqrt(4 + 16 + 25)
    expected: '6.7'
    shown: ['$\sqrt{4 + 16 + 25} = \sqrt{45} \approx 6.7$']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: wrench
    where: 'worked example (b): 0.25 × 40 × sin 60° ≈ 8.7 N m'
    inputs: {r: 0.25 m, F: 40 N}
    formula: r * F * sin(pi / 3)
    expected: 8.7 N*m
    shown: ['0.25 \times 40 \times 0.866 \approx 8.7$ N m']
    source: {cite: reading5, at: 'p. 1'}
    origin: page-own

  - id: wrench-arm
    where: 'same: moment arm 0.25 × 0.866 ≈ 0.22 m'
    inputs: {r: 0.25 m}
    formula: r * sin(pi / 3)
    expected: 0.22 m
    shown: ['$0.25 \times 0.866 \approx 0.22$ m']
    source: {cite: reading5, at: 'p. 1'}
    origin: page-own

  - id: shelf
    where: 'worked example (c): 0.40 × 3.0 × 9.8 ≈ 11.8 N m'
    inputs: {d: 0.40 m, M: 3.0 kg, g: 9.8 m/s^2}
    formula: d * M * g
    expected: 11.8 N*m
    shown: ['0.40 \times 3.0 \times 9.8 \approx 11.8$ N m']
    source: {cite: reading6, at: 'p. 2'}
    origin: page-own

  - id: quiz-area
    where: 'quiz 2: 3 × 4 × sin 30° = 6'
    inputs: {}
    formula: 3 * 4 * sin(pi / 6)
    expected: '6'
    shown: ['3 \\times 4 \\times 0.5 = 6$']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

