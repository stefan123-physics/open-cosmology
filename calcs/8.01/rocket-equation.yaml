# Calculations on content/year-1/8.01/rocket-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 19 (segments 19.1–19.7) and Course Notes Chapter 12, Section 12.3, with the page's own numbers.

page: content/year-1/8.01/rocket-equation.mdx
calcs:
  - id: separated-integral
    kind: identity
    where: 'formula "Separated": ∫ −u dm/m from m_i to m_f = u ln(m_i/m_f)'
    formula: u * integrate('-1 / x', 'x', mi, mf)
    equals: u * log(mi / mf)
    samples: {u: [3000.0, 2500.0], mi: [10.0, 8.0], mf: [2.0, 5.0]}
    tolerance: 1e-6
    shown: ['= u\ln\frac{m_{r,i}}{m_{r,f}}']
    source: {cite: reading7, at: 'pp. 1–2'}
    origin: mit

  - id: single-stage-R
    where: 'notes Example 12.4: R = 2.81/0.35 = 8.03'
    inputs: {}
    formula: 2.81e7 / (2.81e7 - 2.46e7)
    expected: '8.03'
    shown: ['has $R = 8.03$']
    source: {cite: reading1, at: 'Example 12.4, p. 12-23'}
    origin: mit

  - id: single-stage-v
    where: 'notes Example 12.4: u ln R ≈ 6250 m/s'
    inputs: {u: 3000 m/s}
    formula: u * log(2.81e7 / (2.81e7 - 2.46e7))
    expected: 6250 m/s
    shown: ['u\ln R \approx 6250$ m/s']
    source: {cite: reading1, at: 'Example 12.4, p. 12-23'}
    origin: mit

  - id: stage-one
    where: 'notes Example 12.5: 3000 ln 3.60 ≈ 3840 m/s'
    inputs: {u: 3000 m/s}
    formula: u * log(2.81e7 / (2.81e7 - 2.03e7))
    expected: 3840 m/s
    shown: ['$3000\ln 3.60 \approx 3840$ m/s']
    source: {cite: reading1, at: 'Eq. (12.3.93), p. 12-23'}
    origin: mit

  - id: stage-two
    where: 'notes Example 12.5: 3000 ln 3.05 ≈ 3340 m/s'
    inputs: {u: 3000 m/s}
    formula: u * log(6.4e6 / 2.1e6)
    expected: 3340 m/s
    shown: ['$3000\ln 3.05 \approx 3340$ m/s']
    source: {cite: reading1, at: 'Eq. (12.3.94), p. 12-23'}
    origin: mit

  - id: two-stage-total
    where: 'notes Example 12.5: together about 7190 m/s'
    inputs: {u: 3000 m/s}
    formula: u * log(2.81e7 / (2.81e7 - 2.03e7)) + u * log(6.4e6 / 2.1e6)
    expected: 7190 m/s
    shown: ['together about 7190 m/s']
    source: {cite: reading1, at: 'Eq. (12.3.95), p. 12-24'}
    origin: mit

  - id: probe
    where: 'worked example "The tyranny of the logarithm" (a) and quiz 2: 2500 ln 4 ≈ 3470 m/s'
    inputs: {u: 2500 m/s}
    formula: u * log(4)
    expected: 3470 m/s
    shown: ['$\Delta v = 2500 \ln 4 \approx 3470$ m/s']
    quiz: 1
    source: {cite: reading1, at: 'Eq. (12.3.84), p. 12-21'}
    origin: page-own

  - id: e-squared
    where: 'same worked example (b) and quiz 3: R = e² ≈ 7.39'
    inputs: {}
    formula: exp(2)
    expected: '7.39'
    shown: ['$R = e^2 \approx 7.39$, so the dry']
    source: {cite: reading1, at: 'Eq. (12.3.87), p. 12-22'}
    origin: page-own

  - id: fuel-fraction
    where: 'same worked example (b) and quiz 3: 1 − e⁻² ≈ 0.86'
    inputs: {}
    formula: 1 - exp(-2)
    expected: '0.86'
    shown: ['and the fuel $1 - e^{-2} \approx 0.86$, about 86%.']
    source: {cite: reading1, at: 'Eq. (12.3.87), p. 12-22'}
    origin: page-own

  - id: e-value
    where: 'same worked example: e ≈ 2.72'
    inputs: {}
    formula: exp(1)
    expected: '2.72'
    shown: ['another $e \approx 2.72$']
    source: {cite: reading1, at: 'Eq. (12.3.87), p. 12-22'}
    origin: page-own

  - id: burn-rate
    where: 'worked example "A small launcher": 40 000/120 ≈ 333 kg/s'
    inputs: {mf: 40000 kg, T: 120 s}
    formula: mf / T
    expected: 333 kg/s
    shown: ['$40\,000/120 \approx 333$ kg/s']
    source: {cite: reading6, at: 'pp. 1–2'}
    origin: page-own

  - id: thrust
    where: 'same worked example: thrust 333 × 2800 ≈ 9.33 × 10⁵ N'
    inputs: {mf: 40000 kg, T: 120 s, u: 2800 m/s}
    formula: mf / T * u
    expected: 9.33e5 N
    shown: ['$333 \times 2800 \approx 9.33\times10^5$ N']
    source: {cite: reading6, at: 'pp. 1–2'}
    origin: page-own

  - id: weight
    where: 'same worked example: weight 50 000 × 9.8 = 4.9 × 10⁵ N'
    inputs: {m: 50000 kg, g: 9.8 m/s^2}
    formula: m * g
    expected: 4.9e5 N
    shown: ['$50\,000 \times 9.8 = 4.9\times10^5$ N']
    source: {cite: reading8, at: 'p. 1'}
    origin: page-own

  - id: lift-off-acceleration
    where: 'same worked example: (9.33 − 4.9) × 10⁵/50 000 ≈ 8.9 m/s²'
    inputs: {mf: 40000 kg, T: 120 s, u: 2800 m/s, m: 50000 kg, g: 9.8 m/s^2}
    formula: (mf / T * u - m * g) / m
    expected: 8.9 m/s^2
    shown: ['\approx 8.9$ m/s²']
    source: {cite: reading6, at: 'pp. 1–2'}
    origin: page-own

  - id: launcher-no-gravity
    where: 'same worked example and plot caption: 2800 ln 5 ≈ 4506 m/s'
    inputs: {u: 2800 m/s}
    formula: u * log(50000 / 10000)
    expected: 4506 m/s
    shown: ['In empty space it would have reached 4506 m/s.']
    source: {cite: reading1, at: 'Eq. (12.3.87), p. 12-22'}
    origin: page-own

  - id: gravity-loss
    where: 'same worked example and plot caption: 9.8 × 120 = 1176 m/s'
    inputs: {g: 9.8 m/s^2, T: 120 s}
    formula: g * T
    expected: 1176 m/s
    shown: ['1176 m/s by burn-out']
    source: {cite: reading8, at: 'p. 2'}
    origin: page-own

  - id: launcher-burnout
    where: 'same worked example: v = 2800 ln 5 − 9.8 × 120 ≈ 3330 m/s'
    inputs: {u: 2800 m/s, g: 9.8 m/s^2, T: 120 s}
    formula: u * log(5) - g * T
    expected: 3330 m/s
    shown: ['\approx 4506 - 1176 \approx 3330$ m/s']
    source: {cite: reading8, at: 'p. 2'}
    origin: page-own

  - id: plot-end
    kind: identity
    where: 'plot: the curve formula at t = 120 s equals u ln 5 − g·120 (mass 50 000 − 333.33 t reaches the dry mass)'
    formula: 2800 * log(50000 / (50000 - 333.33 * x)) - 9.8 * x
    equals: 2800 * log(5) - 9.8 * x
    samples: {x: [120.0]}
    tolerance: 0.5
    shown: ['m(t) = 50 000 − 333.33t kg']
    source: {cite: reading1, at: 'Eq. (12.3.100), p. 12-25'}
    origin: page-own
