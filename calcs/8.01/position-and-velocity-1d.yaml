# Calculations on content/year-1/8.01/position-and-velocity-1d.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-1/8.01/position-and-velocity-1d.mdx
calcs:
  - id: turnaround-time
    where: 'worked example, step "Turning point": 3 − 2t = 0'
    inputs: {}
    formula: solve('3 - 2 * t', 't', 0, 5)
    expected: '1.5'
    shown: ['$3 - 2t = 0$ gives $t = 1.5$ s']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: turnaround-position
    where: 'worked example, step "Turning point": x(1.5) = 4.25 m'
    inputs: {t: 1.5}
    formula: 2 + 3 * t - t**2
    expected: '4.25'
    shown: ['$x(1.5) = 2 + 4.5 - 2.25 = 4.25$ m']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: velocity-from-limit
    kind: identity
    where: 'worked example: v(t) = 3 − 2t is the derivative of x(t) = 2 + 3t − t²'
    formula: deriv('2 + 3 * x - x**2', 'x', t)
    equals: 3 - 2 * t
    samples: {t: [0, 0.7, 1.5, 3]}
    tolerance: 1e-6
    shown: ['so $v(t) = 3 - 2t$ m/s']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: average-velocity-1-2
    where: 'worked example, step "Average velocity": x(2) − x(1) over 1 s'
    inputs: {}
    formula: ((2 + 3 * 2 - 2**2) - (2 + 3 * 1 - 1**2)) / (2 - 1)
    expected: '0'
    tolerance: '1e-9'
    shown: ['$x(1) = 4$ m and $x(2) = 4$ m, so $v_\text{ave} = 0$']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: quiz-runner
    where: 'quiz 0: a lap ends where it began, so the average velocity is 0'
    inputs: {d: 0 m, t: 80 s}
    formula: d / t
    expected: 0 m/s
    shown: ['ending at the starting line']
    quiz: 0
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: quiz-runner-speed
    where: 'quiz 0 explanation: the average speed is 400 m / 80 s'
    inputs: {d: 400 m, t: 80 s}
    formula: d / t
    expected: 5 m/s
    shown: ['The average *speed* (distance over time) is 5 m/s.']
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own

  - id: quiz-velocity
    where: 'quiz 2: x = 4 + 2t², v(3) = 12 m/s'
    inputs: {}
    formula: deriv('4 + 2 * x**2', 'x', 3)
    expected: '12'
    shown: ['so $v(3) = 12\\ \\text{m/s}$']
    quiz: 2
    source: {cite: reading1, at: 'Chapter 4'}
    origin: page-own
