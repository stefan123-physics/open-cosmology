# Calculations on content/year-1/8.01/tension-and-springs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 7 (segments 7.1–7.4) and Course Notes Chapter 8, Sections 8.1.1 and 8.5. g = 9.8 m/s² throughout.

page: content/year-1/8.01/tension-and-springs.mdx
calcs:
  - id: sled-tension
    where: 'worked example "How much does the rope matter?", step "Solve": T_sled = 30 − 0.40 × 2.0 = 29.2 N'
    inputs: {F: 30 N, m: 0.40 kg, a: 2.0 m/s**2}
    formula: F - m * a
    expected: 29.2 N
    shown: ['$T_\text{sled} = 30 - 0.40 \times 2.0 = 29.2$ N']
    source: {cite: reading3, at: 'transcript 7.2, p. 2'}
    origin: page-own

  - id: sled-difference
    where: 'worked example, step "Is the rope light?": a 0.8 N difference, under 3% of the 30 N pull'
    inputs: {m: 0.40 kg, a: 2.0 m/s**2}
    formula: m * a
    expected: 0.8 N
    shown: ['The difference is 0.8 N, under 3% of the pull']
    source: {cite: reading3, at: 'transcript 7.2, p. 2'}
    origin: page-own

  - id: sled-fraction
    where: 'worked example, step "Is the rope light?": 0.8 / 30 is under 3%'
    formula: 0.8 / 30 * 100
    expected: 2.7
    shown: ['under 3% of the pull']
    source: {cite: reading3, at: 'transcript 7.2, p. 2'}
    origin: page-own

  - id: atwood-acceleration-derivation
    kind: identity
    where: 'section "Solving a pulley system": adding m1 g − T = m1 a and T − m2 g = m2 a gives a = (m1 − m2) g / (m1 + m2)'
    formula: (m1 * g - T) + (T - m2 * g) - (m1 + m2) * ((m1 - m2) * g / (m1 + m2))
    equals: 0 * g
    samples: {m1: [3.0, 5.0, 0.7], m2: [2.0, 3.0, 4.1], g: [9.8, 9.8, 9.8], T: [1.0, 20.0, 7.5]}
    tolerance: 1e-12
    shown: ['Adding the two equations removes $T$']
    source: {cite: reading4, at: 'transcript 7.3, pp. 3–4'}
    origin: mit

  - id: atwood-tension-formula
    kind: identity
    where: 'section "Solving a pulley system": T = m2 (g + a) = 2 m1 m2 g / (m1 + m2)'
    formula: m2 * (g + (m1 - m2) * g / (m1 + m2)) - 2 * m1 * m2 * g / (m1 + m2)
    equals: 0 * g
    samples: {m1: [3.0, 5.0, 0.7], m2: [2.0, 3.0, 4.1], g: [9.8, 9.8, 9.8]}
    tolerance: 1e-12
    shown: ['$T = m_2(g + a) = 2m_1m_2 g/(m_1 + m_2)$']
    source: {cite: reading4, at: 'transcript 7.3, pp. 3–4'}
    origin: page-own

  - id: atwood-a
    where: 'worked example "Two blocks over a pulley", step "Acceleration": a = 1.96 m/s²'
    inputs: {m1: 3.0 kg, m2: 2.0 kg, g: 9.8 m/s**2}
    formula: (m1 - m2) * g / (m1 + m2)
    expected: 1.96 m/s**2
    shown: ['\times 9.8 = 1.96$ m/s², the 3.0 kg block going down']
    source: {cite: reading4, at: 'transcript 7.3, p. 4'}
    origin: page-own

  - id: atwood-tension-2
    where: 'worked example, step "Tension": T = m2 (g + a) ≈ 23.5 N'
    inputs: {m2: 2.0 kg, g: 9.8 m/s**2, a: 1.96 m/s**2}
    formula: m2 * (g + a)
    expected: 23.5 N
    shown: ['$T = m_2(g + a) = 2.0 \times (9.8 + 1.96) \approx 23.5$ N']
    source: {cite: reading4, at: 'transcript 7.3, p. 4'}
    origin: page-own

  - id: atwood-tension-1
    where: 'worked example, step "Tension": check T = m1 (g − a) ≈ 23.5 N'
    inputs: {m1: 3.0 kg, g: 9.8 m/s**2, a: 1.96 m/s**2}
    formula: m1 * (g - a)
    expected: 23.5 N
    shown: ['$T = m_1(g - a) = 3.0 \times (9.8 - 1.96) \approx 23.5$ N']
    source: {cite: reading4, at: 'transcript 7.3, p. 3'}
    origin: page-own

  - id: atwood-weight-2
    where: 'worked example, step "Tension": weights 19.6 N and 29.4 N (this one: 2.0 kg)'
    inputs: {m: 2.0 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 19.6 N
    shown: ['(19.6 N and 29.4 N)']
    source: {cite: reading4, at: 'transcript 7.3, p. 3'}
    origin: page-own

  - id: atwood-weight-1
    where: 'worked example, step "Tension": weights 19.6 N and 29.4 N (this one: 3.0 kg)'
    inputs: {m: 3.0 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 29.4 N
    shown: ['(19.6 N and 29.4 N)']
    source: {cite: reading4, at: 'transcript 7.3, p. 3'}
    origin: page-own

  - id: atwood-support
    where: 'worked example, step "Support of the pulley": 2T ≈ 47.0 N'
    inputs: {m1: 3.0 kg, m2: 2.0 kg, g: 9.8 m/s**2}
    formula: 2 * 2 * m1 * m2 * g / (m1 + m2)
    expected: 47.0 N
    shown: ['the support carries $2T \approx 47.0$ N']
    source: {cite: reading4, at: 'transcript 7.3, p. 2'}
    origin: page-own

  - id: atwood-total-weight
    where: 'worked example, step "Support of the pulley": the two blocks weigh 49 N'
    inputs: {m: 5.0 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 49 N
    shown: ['less than the 49 N the two blocks would weigh at rest']
    source: {cite: reading4, at: 'transcript 7.3, p. 2'}
    origin: page-own

  - id: atwood-cm-force
    where: 'worked example, step "Support of the pulley": the 1.96 N difference = (m1 + m2) × centre-of-mass acceleration'
    inputs: {m1: 3.0 kg, m2: 2.0 kg, g: 9.8 m/s**2}
    formula: (m1 + m2) * g - 4 * m1 * m2 * g / (m1 + m2)
    expected: 1.96 N
    shown: ['the 1.96 N difference is what accelerates']
    source: {cite: reading4, at: 'transcript 7.3, p. 2'}
    origin: page-own

  - id: atwood-quiz
    where: 'quiz 1: marked choice "2.45 m/s²" for 5.0 kg and 3.0 kg'
    inputs: {m1: 5.0 kg, m2: 3.0 kg, g: 9.8 m/s**2, u: 1 m/s**2}
    formula: (m1 - m2) * g / (m1 + m2) / u
    expected: 2.45
    shown: ['\\dfrac{2.0}{8.0} \\times 9.8 = 2.45$ m/s²']
    quiz: 0
    source: {cite: reading4, at: 'transcript 7.3, p. 4'}
    origin: page-own

  - id: spring-quiz
    where: 'quiz 3 explanation: 6.0 N for k = 200 N/m compressed 3.0 cm (the choices 0 and 1 differ only in direction, so it is not checked as a quiz answer)'
    inputs: {k: 200 N/m, x: 0.030 m}
    formula: k * x
    expected: 6.0 N
    shown: ['$|F_x| = k|x| = 200 \\times 0.030 = 6.0$ N']
    source: {cite: reading1, at: 'Eq. (8.1.2), p. 8-4'}
    origin: page-own

  - id: spring-k
    where: 'worked example "Measuring a spring, then predicting", step "Find k": k = 2.45 / 0.049 = 50 N/m'
    inputs: {m: 0.25 kg, g: 9.8 m/s**2, x: 0.049 m}
    formula: m * g / x
    expected: 50 N/m
    shown: ['$k \times 0.049 = 0.25 \times 9.8$, so $k = 2.45 / 0.049 = 50$ N/m']
    source: {cite: reading1, at: 'Eq. (8.1.1), p. 8-3'}
    origin: page-own

  - id: spring-a
    where: 'worked example, step "Predict the acceleration": a = 50 × 0.060 / 0.25 = 12 m/s²'
    inputs: {k: 50 N/m, x: 0.060 m, m: 0.25 kg}
    formula: k * x / m
    expected: 12 m/s**2
    shown: ['$a = k|x|/m = 50 \times 0.060 / 0.25 = 12$ m/s²']
    source: {cite: reading1, at: 'Eq. (8.1.3), p. 8-5'}
    origin: page-own
