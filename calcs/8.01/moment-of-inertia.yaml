# Calculations on content/year-1/8.01/moment-of-inertia.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 29 (segments 29.1–29.6) and Course Notes Chapter 16, Section 16.3 and Appendix 16A, with the page's own numbers.

page: content/year-1/8.01/moment-of-inertia.mdx
calcs:
  - id: rod-centre
    kind: identity
    where: 'formula "Uniform rod about its centre": ∫ (m/L) x² dx from −L/2 to L/2 = mL²/12'
    formula: integrate('m / L * s**2', 's', -L / 2, L / 2)
    equals: m * L**2 / 12
    samples: {m: [2.0, 0.5], L: [1.2, 3.0]}
    tolerance: 1e-6
    shown: ['= \frac{1}{12}\,m L^2" cite']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: mit

  - id: disc
    kind: identity
    where: 'formula "Uniform disc about its centre": ∫ (2m/R²) r³ dr = mR²/2'
    formula: integrate('2 * m / R**2 * s**3', 's', 0, R)
    equals: m * R**2 / 2
    samples: {m: [2.0, 0.5], R: [0.3, 1.5]}
    tolerance: 1e-6
    shown: ['= \frac{1}{2}\,m R^2" cite']
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: mit

  - id: sphere
    kind: identity
    where: 'formula "Uniform sphere about its centre": (2/3)∫ (3m/R³) r⁴ dr = 2mR²/5'
    formula: 2 / 3 * integrate('3 * m / R**3 * s**4', 's', 0, R)
    equals: 2 * m * R**2 / 5
    samples: {m: [7.0, 0.5], R: [0.11, 2.0]}
    tolerance: 1e-6
    shown: ['I_{\text{cm}} = \frac{2}{5}\,m R^2" cite']
    source: {cite: reading6, at: 'pp. 2–3'}
    origin: mit

  - id: rod-end
    kind: identity
    where: 'section "The parallel axis theorem": 1/12 + 1/4 = 1/3 and the direct integral from 0 to L'
    formula: integrate('m / L * s**2', 's', 0, L)
    equals: m * L**2 / 12 + m * (L / 2)**2
    samples: {m: [2.0, 0.5], L: [1.2, 3.0]}
    tolerance: 1e-6
    shown: ['$I_{\text{end}} = \frac{1}{12}mL^2 + \frac{1}{4}mL^2 = \frac{1}{3}mL^2$']
    source: {cite: reading5, at: 'p. 2'}
    origin: mit

  - id: plot-centre
    where: 'plot: 1/12 ≈ 0.0833 at the centre'
    inputs: {}
    formula: 1 / 12
    expected: '0.0833'
    shown: ['y: 0.0833']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: plot-end
    where: 'plot: 1/12 + 1/4 ≈ 0.3333 at the end'
    inputs: {}
    formula: 1 / 12 + 0.25
    expected: '0.3333'
    shown: ['y: 0.3333']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: baton-icm
    where: 'worked example (a): I_cm = 2.0 × 1.2²/12 = 0.24 kg m²'
    inputs: {m: 2.0 kg, L: 1.2 m}
    formula: m * L**2 / 12
    expected: 0.24 kg*m^2
    shown: ['\times 2.0 \times 1.2^2 = 0.24$ kg m²']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: baton-k
    where: 'same: K = ½ × 0.24 × 5.0² = 3.0 J'
    inputs: {I: 0.24 kg*m^2, w: 5.0 rad/s}
    formula: 0.5 * I * w**2
    expected: 3.0 J
    shown: ['\times 0.24 \times 5.0^2 = 3.0$ J']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: baton-end
    where: 'same: I_end = 0.96 kg m²'
    inputs: {m: 2.0 kg, L: 1.2 m}
    formula: m * L**2 / 3
    expected: 0.96 kg*m^2
    shown: ['= 0.96$ kg m²']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: baton-end-k
    where: 'same: K = 12 J about the end'
    inputs: {I: 0.96 kg*m^2, w: 5.0 rad/s}
    formula: 0.5 * I * w**2
    expected: 12 J
    shown: ['$K = 12$ J']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: ball-i
    where: 'worked example (b): I = 2/5 × 7.0 × 0.11² ≈ 0.0339 kg m²'
    inputs: {m: 7.0 kg, R: 0.11 m}
    formula: 2 / 5 * m * R**2
    expected: 0.0339 kg*m^2
    shown: ['\approx 0.0339$ kg m²']
    source: {cite: reading6, at: 'p. 3'}
    origin: page-own

  - id: ball-k
    where: 'same: K = ½ × 0.0339 × 900 ≈ 15 J'
    inputs: {m: 7.0 kg, R: 0.11 m, w: 30 rad/s}
    formula: 0.5 * (2 / 5 * m * R**2) * w**2
    expected: 15 J
    tolerance: '2%'
    shown: ['\times 900 \approx 15$ J']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: ball-speed
    where: 'worked example (b): rolling without slipping, v = Rω = 0.11 × 30 = 3.3 m/s'
    inputs: {R: 0.11 m, w: 30 rad/s}
    formula: R * w
    expected: 3.3 m/s
    shown: ['= 0.11 \times 30 = 3.3$ m/s']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: ball-translation
    where: 'same: ½ × 7.0 × 3.3² ≈ 38 J'
    inputs: {m: 7.0 kg, v: 3.3 m/s}
    formula: 0.5 * m * v**2
    expected: 38 J
    tolerance: '1%'
    shown: ['\times 3.3^2 \approx 38$ J']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: quiz-disc
    where: 'quiz 4: I = 0.090 kg m², K = 4.5 J'
    inputs: {m: 2.0 kg, R: 0.30 m, w: 10 rad/s}
    formula: 0.5 * (0.5 * m * R**2) * w**2
    expected: 4.5 J
    shown: ['\\times 0.090 \\times 100 = 4.5$ J']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: pulsar-i
    where: 'callout: I = 2/5 × 1.4 M_sun × (10 km)² ≈ 1e38 kg m²'
    inputs: {M: 2.78e30 kg, R: 1.0e4 m}
    formula: 2 / 5 * M * R**2
    expected: 1.1e38 kg*m^2
    tolerance: '10%'
    shown: ['\approx 1 \times 10^{38}$ kg m²']
    source: {cite: reading6, at: 'p. 3'}
    origin: page-own

  - id: pulsar-omega
    where: 'callout: about 30 turns per second, ω ≈ 190 rad/s'
    inputs: {f: 30 1/s}
    formula: 2 * pi * f
    expected: 190 rad/s
    tolerance: '2%'
    shown: ['$\omega \approx 190$ rad/s']
    source: {cite: atnf, at: 'PSR B0531+21'}
    origin: page-own

  - id: pulsar-k
    where: 'callout: K ≈ 2e42 J'
    inputs: {I: 1.1e38 kg*m^2, w: 188 rad/s}
    formula: 0.5 * I * w**2
    expected: 2e42 J
    tolerance: '10%'
    shown: ['about $2 \times 10^{42}$ J']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
