  # ---- Problem 5

  # (a) The answer against one finite step of momentum conservation: the speed after a short time h is
  # (m0 + b t) v/(m0 + b (t + h)); its change divided by h tends to the answer.
  - id: p5-a-by-finite-step
    kind: identity
    answer: p5-a
    where: 'Problem 5(a), answer box and formula "Rain: change of speed in a short interval": against a finite step of momentum conservation with h = 1e-6 s'
    formula: -b*v/(m0 + b*t)
    equals: ((m0 + b*t)*v/(m0 + b*(t + 1e-6)) - v)/1e-6
    samples:
      b: [0.5, 2, 0.5, 1.3]
      v: [1, 10, 3.0, 6]
      m0: [50, 200, 100, 80]
      t: [10, 60, 200, 0]
    tolerance: 1e-5
    shown: ['\frac{dv}{dt} = -\frac{b\,v}{m_0 + b\,t}']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  # (b) The answer against the numerical integral of part (a): ln(v/v0) = −∫ b dt/(m0 + b t).
  - id: p5-b-by-integration
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "Rain: speed of the vehicle": against the numerical integral of the rate of part (a)'
    formula: m0*v0/(m0 + b*t)
    equals: v0 * exp(-integrate('b / (m0 + b * x)', 'x', 0, t))
    samples:
      b: [0.5, 2, 0.5, 1.3]
      v0: [1, 10, 3.0, 6]
      m0: [50, 200, 100, 80]
      t: [10, 60, 200, 5]
    tolerance: 1e-7
    shown: ['v(t) = \frac{m_0\,v_0}{m_0 + b\,t}']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

