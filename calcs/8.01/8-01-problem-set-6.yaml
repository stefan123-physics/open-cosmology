  - id: p2-a-example-after
    where: 'Problem 2(a), check: momentum after the throw'
    inputs: {m1: 60 kg, vf: 1.5 m/s, m: 4 kg, vb: 6.5 m/s}
    formula: m1 * vf - m * vb
    expected: 64 kg*m/s
