  - id: p2-b-example-common
    where: 'Problem 2(b), check: common speed for m2 = 76 kg, v2 = 2.0 m/s'
    inputs: {M: 64 kg, v1: 1.0 m/s, m2: 76 kg, v2: 2.0 m/s}
    formula: (M * v1 + m2 * v2) / (M + m2)
    expected: 1.543 m/s
    shown: ['$v_f = (64 \times 1.0 + 76 \times 2.0)/140 = 1.543$ m/s']
    source: {cite: mit, at: 'Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-b-example-u
    where: 'Problem 2(b), check: the throwing speed'
    inputs: {m2: 76 kg, M: 64 kg, dv: 1.0 m/s, m: 4 kg, Mtot: 140 kg}
    formula: m2 * M * dv / (m * Mtot)
    expected: 8.69 m/s
    shown: ['$u = 76 \times 64 \times 1.0/(4 \times 140) = 8.69$ m/s']
    source: {cite: mit, at: 'Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-b-example-ball
    where: 'Problem 2(b), check: velocity of the ball on its way'
    inputs: {vf: 1.543 m/s, u: 8.686 m/s}
    formula: vf - u
