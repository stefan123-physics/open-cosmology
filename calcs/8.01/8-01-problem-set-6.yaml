# Calculations on content/year-1/8.01/8-01-problem-set-6.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# a numerical solve of the momentum balance, a finite step of momentum conservation, or a numerical integral.
# The rocket numbers of Problem 3 can also be compared with MIT's course notes, Examples 12.4 and 12.5.

page: content/year-1/8.01/8-01-problem-set-6.mdx
calcs:
  # ---- Problem 1

  - id: p1-given-current
    kind: fact
    where: 'Problem 1, statement: speed of the water'
    shown: ['The water flows downstream at a constant 1.0 m/s']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-given-rowing
    kind: fact
    where: 'Problem 1, statement: rowing speed seen from the drifting boat'
    shown: ['the student rows at 0.5 m/s']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-given-width
    kind: fact
    where: 'Problem 1, statement: width of the river'
    shown: ['straight and parallel, 800 m apart']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-speed
    answer: p1-a-speed
    where: 'Problem 1(a), answer box: speed seen from the bank'
    inputs: {vx: 0.5 m/s, vy: 1.0 m/s}
    formula: sqrt(vx**2 + vy**2)
    expected: 1.12 m/s
    shown: ['$\sqrt{0.5^2 + 1.0^2} = 1.12$ m/s']
    source: {cite: mit, at: 'Problem 1(a) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-angle
    answer: p1-a-angle
    where: 'Problem 1(a), answer box: angle from the straight-across direction, in degrees'
    formula: atan(1.0 / 0.5) * 180 / pi
    expected: '63.4'
    shown: ['so $\theta = 63.4°$']
    source: {cite: mit, at: 'Problem 1(a) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-sum-of-parts
    where: 'Problem 1(a), check: the sum of the two parts of the velocity'
    inputs: {vx: 0.5 m/s, vy: 1.0 m/s}
    formula: vx + vy
    expected: 1.5 m/s
    shown: ['smaller than their sum, 1.5 m/s']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-time
    answer: p1-c
    where: 'Problem 1(b) and (c): the crossing time'
    inputs: {w: 800 m, vx: 0.5 m/s}
    formula: w / vx
    expected: 1600 s
    shown: ['The crossing takes $800/0.5 = 1600$ s', '$800/0.5 = 1600$ s, a little under 27 minutes']
    source: {cite: mit, at: 'Problem 1(c) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-time-minutes
    where: 'Problem 1(c): the crossing time in minutes'
    formula: 1600 / 60
    expected: '26.7'
    shown: ['a little under 27 minutes']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-drift
    answer: p1-b
    where: 'Problem 1(b), answer box: distance downstream'
    inputs: {w: 800 m, vx: 0.5 m/s, vy: 1.0 m/s}
    formula: vy * w / vx
    expected: 1600 m
    shown: ['$1.0 \times 1600 = 1600$ m downstream']
    source: {cite: mit, at: 'Problem 1(b) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-drift-by-angle
    where: 'Problem 1(b), check: drift from the angle of part (a)'
    formula: 800 * tan(atan(1.0 / 0.5))
    expected: '1600'
    shown: ['$800 \times \tan\theta = 800 \times 2 = 1600$ m']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-path-length
    where: 'Problem 1(c), check: length of the path seen from the bank'
    inputs: {w: 800 m, d: 1600 m}
    formula: sqrt(w**2 + d**2)
    expected: 1789 m
    shown: ['$\sqrt{800^2 + 1600^2} = 1789$ m']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-time-by-path
    where: 'Problem 1(c), check: path length over speed'
    inputs: {L: 1789 m, v: 1.118 m/s}
    formula: L / v
    expected: 1600 s
    shown: ['$1789/1.118 = 1600$ s again']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  # ---- Problem 2

  # (a) The answer against a numerical solve of the momentum balance of astronaut 1 and the ball.
  - id: p2-a-by-solve
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Catch: speed of astronaut 1 after the throw": against a numerical solve of (m1 + m) v1 = m1 x + m (x − u)'
    formula: v1 + m*u/(m1 + m)
    equals: solve('(m1 + m) * v1 - m1 * x - m * (x - u)', 'x', -1000, 1000)
    samples:
      v1: [1, 3, 1.0, 2.2]
      u: [5, 20, 8.0, 12]
      m: [5, 20, 4, 0.5]
      m1: [40, 60, 60, 75]
    tolerance: 1e-7
    shown: ['v_{f,1} = v_1 + \frac{m\,u}{m_1 + m}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  # (b) The answer against a numerical solve of v_f1 = v_f2, with the throw and the catch followed one
  # after the other: v_f1 = v1 + m x/(m1 + m), then the catch (m2 v2 + m (v_f1 − x))/(m2 + m).
  - id: p2-b-by-solve
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "Catch: throwing speed for equal final speeds": against a numerical solve of v_f1 = v_f2 through the throw and the catch'
    formula: m2*(m1 + m)*(v2 - v1)/(m*(m1 + m2 + m))
    equals: solve('v1 + m * x / (m1 + m) - (m2 * v2 + m * (v1 + m * x / (m1 + m) - x)) / (m2 + m)', 'x', 0, 100000)
    samples:
      v1: [1, 3, 1.0, 2.2]
      v2: [4, 8, 2.0, 2.5]
      m: [5, 20, 4, 0.5]
      m1: [40, 60, 60, 75]
      m2: [70, 100, 76, 50]
    tolerance: 1e-7
    shown: ['= \frac{m_2\,(m_1 + m)\,(v_2 - v_1)}{m\,(m_1 + m_2 + m)}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-gain
    kind: identity
    where: 'Problem 2(b), formula "Catch: gain of astronaut 1": common speed minus v1'
    formula: ((m1 + m)*v1 + m2*v2)/(m1 + m2 + m) - v1
    equals: m2*(v2 - v1)/(m1 + m2 + m)
    samples:
      v1: [1, 3, 1.0, 2.2]
      v2: [4, 8, 2.0, 2.5]
      m: [5, 20, 4, 0.5]
      m1: [40, 60, 60, 75]
      m2: [70, 100, 76, 50]
    tolerance: 1e-12
    shown: ['v_f - v_1 = \frac{m_2\,(v_2 - v_1)}{m_1 + m_2 + m}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-a-example
    where: 'Problem 2(a), check: v_f1 for m1 = 60 kg, m = 4 kg, v1 = 1.0 m/s, u = 8.0 m/s'
    inputs: {m1: 60 kg, m: 4 kg, v1: 1.0 m/s, u: 8.0 m/s}
    formula: v1 + m * u / (m1 + m)
    expected: 1.5 m/s
    shown: ['$v_{f,1} = 1.0 + 32/64 = 1.5$ m/s']
    source: {cite: mit, at: 'Problem 2(a) (our own numbers)'}
    origin: page-own

  - id: p2-a-example-ball
    where: 'Problem 2(a), check: velocity of the ball'
    inputs: {vf: 1.5 m/s, u: 8.0 m/s}
    formula: vf - u
    expected: -6.5 m/s
    shown: ['$1.5 - 8.0 = -6.5$ m/s']
