  # ---- Problem 4

  # (a) The answer against one finite step of the two physical laws. In a short time h the mass grows from
  # m to m (1 + k v h) (growth law) and the momentum from m v to m v + m g h (momentum principle), so the
  # new speed is (v + g h)/(1 + k v h); its change divided by h tends to the answer. The mass drops out.
  - id: p4-a-by-finite-step
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box and formula "Raindrop: acceleration": against a finite step of the growth law and the momentum principle with h = 1e-7 s'
    formula: g - k*v**2
    equals: ((v + g*1e-7)/(1 + k*v*1e-7) - v)/1e-7
    samples:
      g: [9, 10, 9.8, 9.8]
      k: [0.01, 0.1, 0.2, 0.05]
      v: [1, 8, 7.0, 0]
    tolerance: 1e-5
    shown: ['\frac{dv_r}{dt} = g - k\,v_r^2']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  # A second check on a whole motion: v(t) = sqrt(g/k) tanh(sqrt(g k) t) with m(t) = m0 cosh(sqrt(g k) t).
  # p4-growth-law shows that this m(t) obeys dm/dt = k m v, p4-momentum-law that d(m v)/dt = m g, and this
  # entry that its acceleration, by numerical differentiation, is g − k v².
  - id: p4-a-trial-motion
    kind: identity
    where: 'Problem 4(a), formula "Raindrop: acceleration": on a motion that obeys the growth law and the momentum principle'
    formula: g - k*(sqrt(g/k)*tanh(sqrt(g*k)*t))**2
    equals: deriv('sqrt(g/k) * tanh(sqrt(g*k) * x)', 'x', t)
    samples:
      g: [9, 10, 9.8, 9.8]
      k: [0.01, 0.1, 0.2, 0.05]
      t: [0.5, 1, 0.3, 2]
    tolerance: 1e-6
    shown: ['\frac{dv_r}{dt} = g - k\,v_r^2']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-growth-law
    kind: identity
    where: 'Problem 4, formula "Raindrop: growth of the mass": the trial motion obeys dm/dt = k m v'
    formula: deriv('m0 * cosh(sqrt(g*k) * x)', 'x', t)
    equals: k * m0 * cosh(sqrt(g*k)*t) * sqrt(g/k) * tanh(sqrt(g*k)*t)
    samples:
      g: [9, 10, 9.8, 9.8]
      k: [0.01, 0.1, 0.2, 0.05]
      t: [0.5, 1, 0.3, 2]
      m0: [1, 2, 0.5, 3]
    tolerance: 1e-6
    shown: ['\frac{dm_r}{dt} = k\,m_r\,v_r']
    source: {cite: mit, at: 'Problem 4, p. 4'}
    origin: mit

  - id: p4-momentum-law
    kind: identity
    where: 'Problem 4(a), formula "Raindrop: momentum principle": the trial motion obeys d(m v)/dt = m g'
    formula: deriv('m0 * cosh(sqrt(g*k) * x) * sqrt(g/k) * tanh(sqrt(g*k) * x)', 'x', t)
    equals: m0 * cosh(sqrt(g*k)*t) * g
    samples:
      g: [9, 10, 9.8, 9.8]
      k: [0.01, 0.1, 0.2, 0.05]
      t: [0.5, 1, 0.3, 2]
      m0: [1, 2, 0.5, 3]
    tolerance: 1e-6
    shown: ['m_r\,g = m_r\,\frac{dv_r}{dt} + v_r\,\frac{dm_r}{dt}']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  # (b) The answer against a numerical root of g − k x² = 0.
  - id: p4-b-by-solve
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box and formula "Raindrop: terminal speed": against a numerical root of g − k x² = 0'
    formula: sqrt(g/k)
    equals: solve('g - k * x**2', 'x', 0, 100000)
    samples:
      g: [9, 10, 9.8, 9.8]
      k: [0.01, 0.1, 0.2, 0.05]
    tolerance: 1e-7
