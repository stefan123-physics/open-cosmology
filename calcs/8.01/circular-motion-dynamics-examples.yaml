# Calculations on content/year-1/8.01/circular-motion-dynamics-examples.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Course Notes Chapter 9, Section 9.3 (Examples 9.1–9.6), with the page's own numbers.

page: content/year-1/8.01/circular-motion-dynamics-examples.mdx
calcs:
  - id: geostationary-earth
    where: 'section "A stationary orbit": the notes'' geostationary orbit at about 6.6 Earth radii (notes: 4.22 × 10⁷ m = 6.62 R_e)'
    inputs: {Gm: 3.986e14 m**3/s**2, T: 86164 s, R: 6.37e6 m}
    formula: (Gm / (2 * pi / T)**2)**(1 / 3) / R
    expected: '6.6'
    tolerance: 0.05
    shown: ['a geostationary orbit at about 6.6 Earth radii']
    source: {cite: reading1, at: 'Eq. (9.3.7), p. 9-7'}
    origin: mit

  - id: double-star-algebra
    kind: identity
    where: 'formula "Period of a double star": r₁ + r₂ = s with r₁ = G m₂/(ω² s²), r₂ = G m₁/(ω² s²) gives ω² = G(m₁ + m₂)/s³'
    formula: Gx * m2 / (w**2 * s**2) + Gx * m1 / (w**2 * s**2) - s
    equals: 0 * s
    samples: {Gx: [1.0, 2.0], m1: [1.0, 3.0], m2: [2.0, 0.5], s: [1.5, 2.0], w: [0.94281, 0.93541]}
    tolerance: 1e-4
    shown: ['T = \frac{2\pi}{\omega} = \left(\frac{4\pi^2 s^3}{G\,(m_1 + m_2)}\right)^{1/2}']
    source: {cite: reading1, at: 'Eq. (9.3.8), p. 9-10'}
    origin: mit

  - id: earth-moon-difference
    where: 'section "A double star": the difference for the Earth and Moon is about 0.17 days (notes'' values)'
    inputs: {R: 3.82e8 m, Me: 5.98e24 kg, Mm: 7.36e22 kg, Gn: 6.67e-11 m**3/(kg*s**2)}
    formula: sqrt(4 * pi**2 * R**3 / (Gn * Me)) - sqrt(4 * pi**2 * R**3 / (Gn * (Me + Mm)))
    expected: 0.17 day
    tolerance: 0.01 day
    shown: ['about 0.17 days in a month']
    source: {cite: reading1, at: 'p. 9-10'}
    origin: mit

  - id: mars-gm
    kind: fact
    where: 'worked example "A satellite that stays above one spot on Mars": Gm = 4.2828 × 10¹³ m³/s²'
    value: 4.2828e13
    shown: ['$Gm = 4.2828 \times 10^{13}$ m³/s²']
    source: {ref: marsfact}
    origin: later-data

  - id: mars-day
    kind: fact
    where: 'worked example "Mars": sidereal rotation period 24.6229 hours'
    value: 24.6229
    shown: ['turns once in 24.6229 hours']
    source: {ref: marsfact}
    origin: later-data

  - id: mars-omega
    where: 'worked example "Mars", step "Rotation rate"'
    inputs: {P: 24.6229 hour}
    formula: 2 * pi / P
    expected: 7.088e-5 1/s
    shown: ['\approx 7.088 \times 10^{-5}$ s⁻¹']
    source: {cite: marsfact}
    origin: page-own

  - id: mars-orbit
    where: 'worked example "Mars", step "Orbit radius": (Gm/ω²)^(1/3)'
    inputs: {Gm: 4.2828e13 m**3/s**2, P: 24.6229 hour}
    formula: (Gm / (2 * pi / P)**2)**(1 / 3)
    expected: 2.04e7 m
    shown: ['\approx 2.04 \times 10^7$ m, about 20,400 km from the centre']
    source: {cite: reading1, at: 'Eq. (9.3.5), p. 9-7'}
    origin: page-own

  - id: mars-height
    where: 'worked example "Mars", step "Height": orbit radius minus 3389.5 km'
    inputs: {Gm: 4.2828e13 m**3/s**2, P: 24.6229 hour, R: 3389.5 km}
    formula: (Gm / (2 * pi / P)**2)**(1 / 3) - R
    expected: 17000 km
    tolerance: 100 km
    shown: ['about 17,000 km above the surface']
    source: {cite: marsfact}
    origin: page-own

  - id: mars-radius
    kind: fact
    where: 'worked example "Mars": mean radius 3389.5 km'
    value: 3389.5
    shown: ['Mars''s mean radius is 3389.5 km']
    source: {ref: marsfact}
    origin: later-data

  - id: double-sun
    where: 'worked example "Two Suns one astronomical unit apart": T = 2π √(AU³/(G · 2 M_sun))'
    inputs: {s: 1 au}
    formula: 2 * pi * sqrt(s**3 / (G * 2 * M_sun))
    expected: 0.707 yr
    shown: ['$T = 1\ \text{yr}/\sqrt2 \approx 0.707$ yr']
    source: {cite: reading1, at: 'Eq. (9.3.8), p. 9-10'}
    origin: page-own

  - id: double-sun-days
    where: 'worked example "Two Suns": about 258 days'
    inputs: {s: 1 au}
    formula: 2 * pi * sqrt(s**3 / (G * 2 * M_sun))
    expected: 258 day
    tolerance: 1 day
    shown: ['about 258 days']
    source: {cite: reading1, at: 'Eq. (9.3.8), p. 9-10'}
    origin: page-own

  - id: quiz-double-mass
    where: 'quiz 1: doubling the total mass divides the period by √2'
    inputs: {}
    formula: sqrt(2)
    expected: '1.414'
    shown: ['doubling the total mass divides the period by $\\sqrt2$']
    source: {cite: reading1, at: 'Eq. (9.3.8), p. 9-10'}
    origin: page-own

  - id: shaft-outer
    where: 'worked example "A whirling toy", step "Outer string"'
    inputs: {m2: 0.10 kg, r: 0.60 m, w: 10 1/s}
    formula: m2 * r * w**2
    expected: 6.0 N
    shown: ['$T_2 = 0.10 \times 0.60 \times 10^2 = 6.0$ N']
    source: {cite: reading1, at: 'Example 9.3, p. 9-11'}
    origin: page-own

  - id: shaft-inner
    where: 'worked example "A whirling toy", step "Inner string": d ω² (m₁ + 2 m₂)'
    inputs: {d: 0.30 m, w: 10 1/s, m1: 0.20 kg, m2: 0.10 kg}
    formula: d * w**2 * (m1 + 2 * m2)
    expected: 12.0 N
    shown: ['$T_1 = 0.30 \times 10^2 \times (0.20 + 2 \times 0.10) = 12.0$ N']
    source: {cite: reading1, at: 'Example 9.3, p. 9-12'}
    origin: page-own

  - id: rope-solution
    kind: identity
    where: 'formula "Tension along a spinning rope": T(r) = (m ω²/2L)(L² − r²) solves dT/dr = −(m/L) ω² r with T(L) = 0'
    formula: deriv('m * w**2 / (2 * L) * (L**2 - r**2)', 'r', r0) + (m / L) * w**2 * r0
    equals: 0 * r0
    samples: {m: [1.5, 0.4], w: [4, 7], L: [2, 1.2], r0: [0.5, 1.0]}
    tolerance: 1e-6
    shown: ['T(r) = \frac{m\,\omega^2}{2L}\,\bigl(L^2 - r^2\bigr)']
    source: {cite: reading1, at: 'Eqs. (9.3.11)–(9.3.13), p. 9-13'}
    origin: mit

  - id: rope-shaft
    where: 'graph caption: T(0) = m ω² L/2 = 24 N for m = 1.5 kg, ω = 4 rad/s, L = 2.0 m'
    inputs: {m: 1.5 kg, w: 4 1/s, L: 2.0 m}
    formula: m * w**2 * L / 2
    expected: 24 N
    shown: ['it is 24 N at the shaft']
    source: {cite: reading1, at: 'Eq. (9.3.13), p. 9-13'}
    origin: page-own

  - id: rope-halfway
    where: 'graph: T(1 m) = (m ω²/2L)(L² − 1) = 18 N'
    inputs: {m: 1.5 kg, w: 4 1/s, L: 2.0 m, r: 1.0 m}
    formula: m * w**2 / (2 * L) * (L**2 - r**2)
    expected: 18 N
    shown: ['18 N halfway along']
    source: {cite: reading1, at: 'Eq. (9.3.13), p. 9-13'}
    origin: page-own

  - id: cone-radius
    where: 'worked example "A marble in a funnel", step "Radius"'
    inputs: {v: 2.0 m/s, g: 9.81 m/s**2}
    formula: v**2 * tan(30 * pi / 180) / g
    expected: 0.235 m
    shown: ['\approx 4.0 \times 0.577/9.81 \approx 0.235$ m']
    source: {cite: reading1, at: 'Example 9.5, p. 9-14'}
    origin: page-own

  - id: cone-tan
    where: 'worked example "A marble in a funnel": tan 30° ≈ 0.577'
    inputs: {}
    formula: tan(30 * pi / 180)
    expected: '0.577'
    shown: ['4.0 \times 0.577/9.81']
    source: {cite: reading1, at: 'Example 9.5, p. 9-14'}
    origin: page-own

  - id: cone-period
    where: 'worked example "A marble in a funnel", step "Period"'
    inputs: {v: 2.0 m/s, g: 9.81 m/s**2}
    formula: 2 * pi * (v**2 * tan(30 * pi / 180) / g) / v
    expected: 0.74 s
    shown: ['$T = 2\pi r/v = 2\pi \times 0.235/2.0 \approx 0.74$ s']
    source: {cite: reading1, at: 'Example 9.5, p. 9-14'}
    origin: page-own

  - id: coin-omega
    where: 'worked example "A coin on a record player", step "Limit"'
    inputs: {mu: 0.40, g: 9.81 m/s**2, R: 0.15 m}
    formula: sqrt(mu * g / R)
    expected: 5.11 1/s
    shown: ['$\omega_{\max} = \sqrt{0.40 \times 9.81/0.15} \approx 5.11$ rad/s']
    source: {cite: reading1, at: 'Eq. (9.3.21), p. 9-16'}
    origin: page-own

  - id: coin-rpm
    where: 'worked example "A coin on a record player": 5.11 rad/s ≈ 48.8 turns per minute'
    inputs: {mu: 0.40, g: 9.81, R: 0.15}
    formula: sqrt(mu * g / R) * 60 / (2 * pi)
    expected: '48.8'
    shown: ['\approx 48.8$ turns per minute']
    source: {cite: reading1, at: 'Eq. (9.3.21), p. 9-16'}
    origin: page-own

  - id: rpm-45
    where: 'worked example "A coin on a record player": 45 rpm = 4.71 rad/s'
    inputs: {}
    formula: 45 * 2 * pi / 60
    expected: '4.71'
    shown: ['45 rpm is 4.71 rad/s']
    source: {cite: reading1, at: 'p. 9-16'}
    origin: page-own

  - id: rpm-78
    where: 'worked example "A coin on a record player": 78 rpm = 8.17 rad/s'
    inputs: {}
    formula: 78 * 2 * pi / 60
    expected: '8.17'
    shown: ['78 rpm is 8.17 rad/s']
    source: {cite: reading1, at: 'p. 9-16'}
    origin: page-own

  - id: zwicky-year
    kind: fact
    where: 'cosmology callout: Zwicky 1933'
    value: 1933
    shown: ['In 1933 Fritz Zwicky used the same principle']
    source: {ref: ferreras}
    origin: later-data
