# Calculations on content/year-1/8.01/torque-and-angular-acceleration.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 31 (segments 31.1–31.7), Course Notes Chapter 17 §17.4.1 and Chapter 16 §16.4, with the page's own numbers.

page: content/year-1/8.01/torque-and-angular-acceleration.mdx
calcs:
  - id: falling-mass-formula
    kind: identity
    where: 'formula "Moment of inertia from a falling mass": solving RT = Iα, mg − T = ma, a = Rα'
    formula: m * R**2 * (g / a - 1)
    equals: R * (m * g - m * a) / (a / R)
    samples: {m: [0.5, 2.0], R: [0.2, 0.5], g: [9.8, 9.8], a: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['I_{\text{cm}} = mR^2\left(\frac{g}{a} - 1\right)']
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: mit

  - id: atwood-formula
    kind: identity
    where: 'formula "Atwood machine with a massive pulley": the solution satisfies the pulley equation'
    formula: (m2 * (g - (m2 - m1) * g / (m1 + m2 + I / R**2)) - m1 * (g + (m2 - m1) * g / (m1 + m2 + I / R**2))) * R
    equals: I * ((m2 - m1) * g / (m1 + m2 + I / R**2)) / R
    samples: {m1: [2.0, 1.0], m2: [3.0, 4.0], g: [9.8, 9.8], R: [0.1, 0.3], I: [0.01, 0.2]}
    tolerance: 1e-9
    shown: ['a = \frac{(m_2 - m_1)\,g}{m_1 + m_2 + I/R^2}']
    source: {cite: reading5, at: 'p. 5'}
    origin: mit

  - id: energy-formula
    kind: identity
    where: 'formula "Two blocks and a pulley, by energy": the speed makes the energy balance'
    formula: 0.5 * (m1 + m2 + I / R**2) * (2 * m2 * g * h / (m1 + m2 + I / R**2))
    equals: m2 * g * h
    samples: {m1: [1.0, 2.0], m2: [0.5, 3.0], I: [0.005, 0.1], R: [0.1, 0.2], g: [9.8, 9.8], h: [0.8, 2.0]}
    tolerance: 1e-9
    shown: ['v = \sqrt{\frac{2m_2gh}{m_1 + m_2 + I/R^2}}']
    source: {cite: reading8, at: 'pp. 3–4'}
    origin: mit

  - id: wheel-a
    where: 'worked example (a): a = 2h/t² = 0.50 m/s²'
    inputs: {h: 1.0 m, t: 2.0 s}
    formula: 2 * h / t**2
    expected: 0.50 m/s^2
    shown: ['$a = 2h/t^2 = 2 \times 1.0/4.0 = 0.50$ m/s²']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: wheel-i
    where: 'same: I = 0.020 × 18.6 ≈ 0.37 kg m²'
    inputs: {m: 0.50 kg, R: 0.20 m, g: 9.8 m/s^2, a: 0.50 m/s^2}
    formula: m * R**2 * (g / a - 1)
    expected: 0.37 kg*m^2
    tolerance: '1%'
    shown: ['= 0.020 \times 18.6 \approx 0.37$ kg m²']
    source: {cite: reading4, at: 'p. 3'}
    origin: page-own

  - id: atwood-a
    where: 'worked example (b), quiz 3 and plot: a = 1.0 × 9.8/6.0 ≈ 1.63 m/s²'
    inputs: {m1: 2.0 kg, m2: 3.0 kg, k: 1.0 kg, g: 9.8 m/s^2}
    formula: (m2 - m1) * g / (m1 + m2 + k)
    expected: 1.63 m/s^2
    shown: ['$a = 1.0 \times 9.8/(2.0 + 3.0 + 1.0) \approx 1.63$ m/s²']
    source: {cite: reading5, at: 'p. 5'}
    origin: page-own

  - id: atwood-massless
    where: 'quiz 3 and plot: a massless pulley gives 1.96 m/s²'
    inputs: {m1: 2.0 kg, m2: 3.0 kg, g: 9.8 m/s^2}
    formula: (m2 - m1) * g / (m1 + m2)
    expected: 1.96 m/s^2
    shown: ['A massless pulley would give 1.96 m/s²']
    source: {cite: reading5, at: 'p. 5'}
    origin: page-own

  - id: atwood-t1
    where: 'worked example (b): T₁ = m₁(g + a) ≈ 22.9 N'
    inputs: {m1: 2.0 kg, g: 9.8 m/s^2, a: 1.6333 m/s^2}
    formula: m1 * (g + a)
    expected: 22.9 N
    shown: ['$T_1 = m_1(g + a) \approx 22.9$ N']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: atwood-t2
    where: 'same: T₂ = m₂(g − a) ≈ 24.5 N'
    inputs: {m2: 3.0 kg, g: 9.8 m/s^2, a: 1.6333 m/s^2}
    formula: m2 * (g - a)
    expected: 24.5 N
    shown: ['$T_2 = m_2(g - a) \approx 24.5$ N']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: atwood-check
    where: 'same: T₂ − T₁ ≈ 1.63 N = (I/R²) a'
    inputs: {m1: 2.0 kg, m2: 3.0 kg, g: 9.8 m/s^2, a: 1.6333 m/s^2}
    formula: m2 * (g - a) - m1 * (g + a)
    expected: 1.63 N
    shown: ['$T_2 - T_1 \approx 1.63$ N']
    source: {cite: reading5, at: 'p. 4'}
    origin: page-own

  - id: table-v
    where: 'worked example (c): v = √3.92 ≈ 1.98 m/s'
    inputs: {m1: 1.0 kg, m2: 0.50 kg, k: 0.50 kg, g: 9.8 m/s^2, h: 0.80 m}
    formula: sqrt(2 * m2 * g * h / (m1 + m2 + k))
    expected: 1.98 m/s
    shown: ['= \sqrt{3.92} \approx 1.98$ m/s']
    source: {cite: reading8, at: 'pp. 3–4'}
    origin: page-own

  - id: table-massless
    where: 'same: massless pulley √(7.84/1.5) ≈ 2.29 m/s'
    inputs: {m1: 1.0 kg, m2: 0.50 kg, g: 9.8 m/s^2, h: 0.80 m}
    formula: sqrt(2 * m2 * g * h / (m1 + m2))
    expected: 2.29 m/s
    shown: ['$\sqrt{7.84/1.5} \approx 2.29$ m/s']
    source: {cite: reading8, at: 'pp. 3–4'}
    origin: page-own

  - id: crab-period
    kind: fact
    where: 'callout: Crab period 0.0334 s (ATNF, epoch MJD 48442.5)'
    value: 0.0334 s
    shown: ['its period of 0.0334 s']
    source: {cite: atnf, at: 'PSR B0531+21'}
    origin: page-own

  - id: crab-pdot
    kind: fact
    where: 'callout: period derivative 4.2e-13'
    value: '4.2e-13'
    shown: ['$4.2 \times 10^{-13}$ s every second']
    source: {cite: atnf, at: 'PSR B0531+21'}
    origin: page-own

  - id: crab-alpha
    where: 'callout: α = 2π Ṗ/P² ≈ 2.4e-9 rad/s²'
    inputs: {P: 0.0334 s, Pdot: 4.21e-13}
    formula: 2 * pi * Pdot / P**2
    expected: 2.4e-9 1/s^2
    tolerance: '2%'
    shown: ['of about $2.4 \times 10^{-9}$ rad/s²']
    source: {cite: atnf, at: 'PSR B0531+21'}
    origin: page-own

  - id: crab-torque
    where: 'callout: τ = Iα ≈ 2.4e29 N m with I = 1e38 kg m²'
    inputs: {I: 1e38 kg*m^2, a: 2.371e-9 1/s^2}
    formula: I * a
    expected: 2.4e29 N*m
    tolerance: '2%'
    shown: ['about $2.4 \times 10^{29}$ N m']
    source: {cite: atnf, at: 'PSR B0531+21'}
    origin: page-own

  - id: crab-power
    where: 'callout: τω ≈ 4.5e31 W'
    inputs: {T: 2.371e29 N*m, P: 0.0334 s}
    formula: T * 2 * pi / P
    expected: 4.5e31 W
    tolerance: '2%'
    shown: ['about $4.5 \times 10^{31}$ W']
    source: {cite: atnf, at: 'PSR B0531+21'}
    origin: page-own
