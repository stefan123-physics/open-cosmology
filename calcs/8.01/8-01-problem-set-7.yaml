  - id: p3-example-tension
    where: 'Problem 3(b), check: tension at B from the answer formula'
    inputs: {m: 0.50 kg, g: 9.8 m/s**2, R: 0.80 m, v0: 6.0 m/s}
    formula: m * v0**2 / R - 5 * m * g * sin(pi/6) - 2 * pi * 0.10 * m * g * cos(pi/6)
    expected: 7.58 N
    shown: ['the string the other 7.58 N', '$22.5 - 12.25 - 2.67 = 7.58$ N']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-term1
    where: 'Problem 3(b), check: first term of the formula, m v0²/R'
    inputs: {m: 0.50 kg, R: 0.80 m, v0: 6.0 m/s}
    formula: m * v0**2 / R
    expected: 22.5 N
    shown: ['$22.5 - 12.25 - 2.67 = 7.58$ N']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-term2
    where: 'Problem 3(b), check: second term of the formula, 5 m g sin φ'
    inputs: {m: 0.50 kg, g: 9.8 m/s**2}
    formula: 5 * m * g * sin(pi/6)
    expected: 12.25 N
    shown: ['$22.5 - 12.25 - 2.67 = 7.58$ N']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
