# Calculations on content/year-1/8.01/8-01-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# a numerical integral of the force along the path, or a numerical solve of the work-kinetic energy balance.
# The numbers of Problem 1(a) to (c) can also be compared with MIT's course notes, Example 13.10.

page: content/year-1/8.01/8-01-problem-set-7.mdx
calcs:
  # ---- Problem 1

  - id: p1-given-mass
    kind: fact
    where: 'Problem 1, statement: mass of the object'
    shown: ['An object of mass $m = 4.0$ kg']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-given-length
    kind: fact
    where: 'Problem 1, statement: length of the plane'
    shown: ['The plane has the length $l = 3.0$ m']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-given-angle
    kind: fact
    where: 'Problem 1, statement: angle of the plane'
    shown: ['makes the angle $\theta = 30°$ with the level ground']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-given-mu-plane
    kind: fact
    where: 'Problem 1, statement: coefficient of kinetic friction on the plane'
    shown: ['the coefficient of kinetic friction is 0.2']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-given-mu-floor
    kind: fact
    where: 'Problem 1, statement: coefficient of kinetic friction on the floor'
    shown: ['where the coefficient of kinetic friction is 0.3']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: mit

  - id: p1-normal
    where: 'Problem 1(a): normal force on the plane'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2}
    formula: m * g * cos(pi/6)
    expected: 33.95 N
    shown: ['$N = 4.0 \times 9.8 \times \cos 30° = 33.95$ N']
    source: {cite: mit, at: 'Problem 1(a) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-friction-force
    where: 'Problem 1(a): friction force on the plane'
    inputs: {N: 33.95 N}
    formula: 0.2 * N
    expected: 6.79 N
    shown: ['$f_k = 0.2 \times 33.95 = 6.79$ N']
    source: {cite: mit, at: 'Problem 1(a) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-work-friction
    answer: p1-a
    where: 'Problem 1(a), answer box: work done by friction on the plane'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2, l: 3.0 m}
    formula: -0.2 * m * g * cos(pi/6) * l
    expected: -20.4 J
    shown: ['-6.79 \times 3.0 = -20.4\ \text{J}']
    source: {cite: reading1, at: 'Example 13.10, p. 13-26 (the notes give −20.4 J)'}
    origin: page-own

  - id: p1-work-friction-level
    where: 'Problem 1(a), check: the same slide on a level floor'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2, l: 3.0 m}
    formula: 0.2 * m * g * l
    expected: 23.5 J
    shown: ['$0.2 \times 4.0 \times 9.8 \times 3.0 = 23.5$ J']
    source: {cite: mit, at: 'Problem 1(a) (our own check)'}
    origin: page-own

  - id: p1-work-gravity
    answer: p1-b
    where: 'Problem 1(b), answer box: work done by gravity on the plane'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2, l: 3.0 m}
    formula: m * g * sin(pi/6) * l
    expected: 58.8 J
    shown: ['4.0 \times 9.8 \times \sin 30° \times 3.0 = 58.8\ \text{J}']
    source: {cite: reading1, at: 'Example 13.10, p. 13-26 (the notes give 58.8 J)'}
    origin: page-own

  - id: p1-drop
    where: 'Problem 1(b), check: drop in height'
    inputs: {l: 3.0 m}
    formula: l * sin(pi/6)
    expected: 1.5 m
    shown: ['$l\sin\theta = 3.0 \times \sin 30° = 1.5$ m']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-weight
    where: 'Problem 1(b), check: the weight'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2}
    formula: m * g
    expected: 39.2 N
    shown: ['$4.0 \times 9.8 = 39.2$ N']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-work-gravity-by-height
    where: 'Problem 1(b), check: weight times drop'
    inputs: {W: 39.2 N, h: 1.5 m}
    formula: W * h
    expected: 58.8 J
    shown: ['$39.2 \times 1.5 = 58.8$ J']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1-kinetic-energy
    answer: p1-c
    where: 'Problem 1(c), answer box: kinetic energy at the bottom of the plane'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2, l: 3.0 m}
    formula: m * g * l * (sin(pi/6) - 0.2 * cos(pi/6))
    expected: 38.4 J
    shown: ['58.8 - 20.4 = 38.4\ \text{J}']
    source: {cite: reading1, at: 'Example 13.10, p. 13-27 (the notes give 38.4 J for the total work)'}
    origin: page-own

  - id: p1-acceleration
    where: 'Problem 1(c), check: acceleration down the plane'
    inputs: {g: 9.8 m/s**2}
    formula: g * (0.5 - 0.2 * 0.866)
    expected: 3.20 m/s**2
    shown: ['$g(\sin\theta - \mu_k\cos\theta) = 9.8 \times (0.5 - 0.2 \times 0.866) = 3.20\ \text{m/s}^2$']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1-cos30
    where: 'Problem 1(c), check: cos 30°'
    formula: cos(pi/6)
    expected: '0.866'
    shown: ['0.2 \times 0.866']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1-speed-squared
    where: 'Problem 1(c), check: square of the speed at the bottom'
    inputs: {a: 3.20 m/s**2, l: 3.0 m}
    formula: 2 * a * l
    expected: 19.2 m**2/s**2
    shown: ['$v^2 = 2 a l = 2 \times 3.20 \times 3.0 = 19.2\ \text{m}^2/\text{s}^2$']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1-kinetic-energy-by-kinematics
    where: 'Problem 1(c), check: kinetic energy from the speed'
    inputs: {m: 4.0 kg, v2: 19.2 m**2/s**2}
    formula: 0.5 * m * v2
    expected: 38.4 J
    shown: ['$\tfrac12 m v^2 = 0.5 \times 4.0 \times 19.2 = 38.4$ J']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1-speed
    where: 'Problem 1(c), check: speed at the bottom'
    inputs: {v2: 19.2 m**2/s**2}
    formula: sqrt(v2)
    expected: 4.38 m/s
    shown: ['$\sqrt{19.2} = 4.38$ m/s']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1-speed-no-friction
    where: 'Problem 1(c), check: speed at the bottom without friction'
    inputs: {g: 9.8 m/s**2, h: 1.5 m}
    formula: sqrt(2 * g * h)
    expected: 5.42 m/s
    shown: ['$\sqrt{2 \times 9.8 \times 1.5} = 5.42$ m/s']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  # (d) The formula against the numerical integral of the constant friction force along the floor.
  - id: p1-d-by-integration
    kind: identity
    answer: p1-d
    where: 'Problem 1(d), answer box and formula "Floor: work done by friction": against the numerical integral of the force'
    formula: -mu*m*g*d
    equals: integrate('-mu*m*g', 'x', 0, d)
    samples:
      mu: [0.1, 0.5, 0.3]
      m: [1, 5, 4.0]
      g: [9, 10, 9.8]
      d: [1, 5, 3.27]
    tolerance: 1e-9
    shown: ['= -\mu_k\,m g\,d']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1-floor-friction
    where: 'Problem 1(e): friction force on the floor'
    inputs: {m: 4.0 kg, g: 9.8 m/s**2}
    formula: 0.3 * m * g
    expected: 11.76 N
    shown: ['$0.3 \times 4.0 \times 9.8 = 11.76$ N']
    source: {cite: mit, at: 'Problem 1(e) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-distance
    answer: p1-e
    where: 'Problem 1(e), answer box: stopping distance along the floor'
    inputs: {K: 38.4 J, f: 11.76 N}
    formula: K / f
    expected: 3.27 m
    shown: ['$d = 38.4/11.76 = 3.27$ m']
    source: {cite: mit, at: 'Problem 1(e) (MIT''s numbers; the solution is our own)'}
    origin: page-own

  - id: p1-distance-direct
    where: 'Problem 1(e), check: stopping distance straight from the given numbers'
    inputs: {l: 3.0 m}
    formula: l * (sin(pi/6) - 0.2 * cos(pi/6)) / 0.3
    expected: 3.27 m
    shown: ['d = \frac{l\,(\sin 30° - 0.2\cos 30°)}{0.3} = 3.27\ \text{m}']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

  - id: p1-total-work
    where: 'Problem 1(e), check: the work over the whole trip'
    inputs: {Wg: 58.8 J, Wf: 20.4 J, Wfloor: 38.4 J}
    formula: Wg - Wf - Wfloor
    expected: 0 J
    tolerance: 0.05 J
    shown: ['$58.8 - 20.4 - 38.4 = 0$ J']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

  # ---- Problem 2

  # The answer against a numerical solve of the work-kinetic energy balance, with the friction work
  # as a numerical integral of the force −b x (mA + mB) g over the strip.
  - id: p2-by-solve
    kind: identity
    answer: p2-s
    where: 'Problem 2, answer box and formula "Compression of the spring": against a numerical solve of ½ k s² = K0 + W_f, with W_f integrated numerically'
    formula: sqrt((mA**2*vA**2/(mA + mB) - (mA + mB)*g*b*d**2)/k)
    equals: solve('0.5*k*x**2 - 0.5*(mA + mB)*(mA*vA/(mA + mB))**2 - integrate("-b*u*(mA + mB)*g", "u", 0, d)', 'x', 0, 1000)
    samples:
      vA: [8, 12, 6.0, 10]
      mA: [2, 4, 2.0, 3]
      mB: [1, 2, 1.0, 5]
      b: [0.05, 0.2, 0.20, 0.1]
      d: [0.5, 1.5, 1.5, 1]
      g: [9, 10, 9.8, 9.8]
      k: [50, 200, 300, 80]
    tolerance: 1e-7
    shown: ['s = \sqrt{\frac{1}{k}\left(\frac{m_A^2\,v_A^2}{m_A + m_B} - (m_A + m_B)\,g\,b\,d^2\right)}']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-friction-work
    kind: identity
    where: 'Problem 2, formula "Strip: work done by friction": against the numerical integral'
    formula: -0.5*(mA + mB)*g*b*d**2
    equals: integrate('-b*x*(mA + mB)*g', 'x', 0, d)
    samples:
      mA: [2, 4, 2.0]
      mB: [1, 2, 1.0]
      b: [0.05, 0.2, 0.20]
      d: [0.5, 1.5, 1.5]
      g: [9, 10, 9.8]
    tolerance: 1e-9
    shown: ['= -\tfrac12\,(m_A + m_B)\,g\,b\,d^2']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-no-friction-limit
    kind: identity
    where: 'Problem 2, check: the limit b = 0'
    formula: sqrt((mA**2*vA**2/(mA + mB) - (mA + mB)*g*0*d**2)/k)
    equals: (mA*vA/(mA + mB)) * sqrt((mA + mB)/k)
    samples:
      vA: [8, 12, 6.0]
      mA: [2, 4, 2.0]
      mB: [1, 2, 1.0]
      d: [0.5, 1.5, 1.5]
      g: [9, 10, 9.8]
      k: [50, 200, 300]
    tolerance: 1e-12
    shown: ['$s = V\sqrt{(m_A + m_B)/k}$']
    source: {cite: mit, at: 'Problem 2 (our own check)'}
    origin: page-own

  - id: p2-example-speed
    where: 'Problem 2, check: speed of the pair for mA = 2.0 kg, mB = 1.0 kg, vA = 6.0 m/s'
    inputs: {mA: 2.0 kg, mB: 1.0 kg, vA: 6.0 m/s}
    formula: mA * vA / (mA + mB)
    expected: 4.0 m/s
    shown: ['$V = 2.0 \times 6.0/3.0 = 4.0$ m/s']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-k0
    where: 'Problem 2, check: kinetic energy of the pair'
    inputs: {M: 3.0 kg, V: 4.0 m/s}
    formula: 0.5 * M * V**2
    expected: 24 J
    shown: ['$K_0 = 24$ J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-ka
    where: 'Problem 2, check: kinetic energy of block A before the collision'
    inputs: {mA: 2.0 kg, vA: 6.0 m/s}
    formula: 0.5 * mA * vA**2
    expected: 36 J
    shown: ['Block A alone had 36 J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-loss
    where: 'Problem 2, check: kinetic energy lost in the collision'
    inputs: {KA: 36 J, K0: 24 J}
    formula: KA - K0
    expected: 12 J
    shown: ['the collision took 12 J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-friction
    where: 'Problem 2, check: work done by friction on the strip'
    inputs: {M: 3.0 kg, g: 9.8 m/s**2, b: 0.20 1/m, d: 1.5 m}
    formula: -0.5 * M * g * b * d**2
    expected: -6.6 J
    shown: ['$-0.5 \times 3.0 \times 9.8 \times 0.20 \times 1.5^2 = -6.6$ J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-at-spring
    where: 'Problem 2, check: kinetic energy at the spring'
    inputs: {K0: 24 J, Wf: 6.6 J}
    formula: K0 - Wf
    expected: 17.4 J
    shown: ['the pair reaches the spring with 17.4 J']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-compression
    where: 'Problem 2, check: compression of the spring'
    inputs: {K: 17.4 J, k: 300 N/m}
    formula: sqrt(2 * K / k)
    expected: 0.34 m
    shown: ['$s = \sqrt{2 \times 17.4/300} = 0.34$ m']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-compression-by-formula
    where: 'Problem 2, check: the same compression from the answer formula'
    inputs: {mA: 2.0 kg, mB: 1.0 kg, vA: 6.0 m/s, g: 9.8 m/s**2, b: 0.20 1/m, d: 1.5 m, k: 300 N/m}
    formula: sqrt((mA**2 * vA**2 / (mA + mB) - (mA + mB) * g * b * d**2) / k)
    expected: 0.34 m
    shown: ['= 0.34$ m']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-example-mu-end
    where: 'Problem 2, check: coefficient of friction at the end of the strip'
    inputs: {b: 0.20 1/m, d: 1.5 m}
    formula: b * d
    expected: '0.30'
    shown: ['$\mu_k = 0.20 \times 1.5 = 0.30$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  # ---- Problem 3

  # (a) The answer against the numerical integral of the tangential friction force over the half circle
  # (x is the angle from A, the step of the path is R dx).
  - id: p3-a-by-integration
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "Circle: work done by friction from A to B": against the numerical integral over the angle from A'
    formula: -pi*mu*m*g*R*cos(phi)
    equals: integrate('-mu*m*g*cos(phi)*R', 'x', 0, pi)
    samples:
      mu: [0.05, 0.3, 0.10]
      m: [0.5, 2, 0.50]
      g: [9, 10, 9.8]
      R: [0.5, 2, 0.80]
      phi: [0.2, 1.2, 0.5236]
    tolerance: 1e-9
    shown: ['= -\pi\,\mu\,m g R\cos\phi']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  # (b) The answer against a route that does not use the height: the tangential forces (gravity −m g sin φ sin x
  # and friction −μ m g cos φ, with x the angle from A) are integrated numerically over the half circle to get
  # the kinetic energy at B, and the radial equation at B gives the tension.
  - id: p3-b-by-integration
    kind: identity
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "Circle: tension at B": against the numerical integral of the tangential forces from A to B'
    formula: m*v0**2/R - 5*m*g*sin(phi) - 2*pi*mu*m*g*cos(phi)
    equals: (m*v0**2 + 2*integrate('(-m*g*sin(phi)*sin(x) - mu*m*g*cos(phi))*R', 'x', 0, pi))/R - m*g*sin(phi)
    samples:
      v0: [10, 15, 6.0]
      mu: [0.05, 0.3, 0.10]
      m: [0.5, 2, 0.50]
      g: [9, 10, 9.8]
      R: [0.5, 1, 0.80]
      phi: [0.2, 1.2, 0.5236]
    tolerance: 1e-7
    shown: ['T = \frac{m v_0^2}{R} - 5\,m g\sin\phi - 2\pi\,\mu\,m g\cos\phi']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-example-k0
    where: 'Problem 3(b), check: kinetic energy at A for m = 0.50 kg, v0 = 6.0 m/s'
    inputs: {m: 0.50 kg, v0: 6.0 m/s}
    formula: 0.5 * m * v0**2
    expected: 9.0 J
    shown: ['$0.5 \times 0.50 \times 6.0^2 = 9.0$ J']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-gravity
    where: 'Problem 3(b), check: work done by gravity from A to B'
    inputs: {m: 0.50 kg, g: 9.8 m/s**2, R: 0.80 m}
    formula: -2 * m * g * R * sin(pi/6)
    expected: -3.92 J
    shown: ['$-2 \times 0.50 \times 9.8 \times 0.80 \times \sin 30° = -3.92$ J']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-friction
    where: 'Problem 3(b), check: work done by friction from A to B'
    inputs: {m: 0.50 kg, g: 9.8 m/s**2, R: 0.80 m}
    formula: -pi * 0.10 * m * g * R * cos(pi/6)
    expected: -1.07 J
    shown: ['$-\pi \times 0.10 \times 0.50 \times 9.8 \times 0.80 \times \cos 30° = -1.07$ J']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-kb
    where: 'Problem 3(b), check: kinetic energy at B'
    inputs: {K0: 9.0 J, Wg: 3.92 J, Wf: 1.07 J}
    formula: K0 - Wg - Wf
    expected: 4.01 J
    shown: ['That leaves 4.01 J at B']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-vb
    where: 'Problem 3(b), check: speed at B'
    inputs: {m: 0.50 kg, g: 9.8 m/s**2, R: 0.80 m, v0: 6.0 m/s}
    formula: sqrt(2 * (0.5 * m * v0**2 - 2 * m * g * R * sin(pi/6) - pi * 0.10 * m * g * R * cos(pi/6)) / m)
    expected: 4.01 m/s
    shown: ['a speed of 4.01 m/s']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-centripetal
    where: 'Problem 3(b), check: force towards the centre needed at B'
    inputs: {K: 4.01 J, R: 0.80 m}
    formula: 2 * K / R
    expected: 10.0 N
    shown: ['$2 \times 4.01/0.80 = 10.0$ N']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-weight-part
    where: 'Problem 3(b), check: down-slope part of the weight'
    inputs: {m: 0.50 kg, g: 9.8 m/s**2}
    formula: m * g * sin(pi/6)
