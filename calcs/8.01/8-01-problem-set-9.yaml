# Calculations on content/year-1/8.01/8-01-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# a numerical solve of the kinetic energy balance (with the momentum equation put in), the reduced-mass form
# of the kinetic energy, or the amplitude of the oscillation.

page: content/year-1/8.01/8-01-problem-set-9.mdx
calcs:
  # ---- Problem 1

  # The answer is the limit of a very heavy bowling ball. Independent route: for a mass ratio of 1e-7 the final
  # velocity of the ping-pong ball is the negative root of the kinetic energy balance, with the bowling ball's
  # final velocity taken from momentum.
  - id: p1-by-solve
    kind: identity
    answer: p1-v
    where: 'Problem 1, answer box and formula "Ping-pong ball: velocity after the collision": against a numerical solve of momentum and kinetic energy for a mass ratio of 1e-7'
    formula: -vp0 - 2*vb0
    equals: solve('0.5*mp*x**2 + 0.5*mb*((mp*vp0 - mb*vb0 - mp*x)/mb)**2 - 0.5*mp*vp0**2 - 0.5*mb*vb0**2', 'x', -1000, 0)
    samples:
      vp0: [1, 5, 3.0, 2.5]
      vb0: [1, 5, 2.0, 4]
      mp: [1.0e-7, 1.0e-7, 1.0e-7, 1.0e-7]
      mb: [1, 1, 1, 1]
    tolerance: 1e-5
    shown: ['v_{px,f} = -v_{p,0} - 2\,v_{b,0}']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-general-limit
    kind: limit
    where: 'Problem 1, check: the general result of the notes for a heavier and heavier body 2'
    formula: (m1 - m2)/(m1 + m2)*3.0 + 2*m2/(m1 + m2)*(-2.0)
    limit: -3.0 + 2*(-2.0)
    inputs: {m1: 1}
    vary: {m2: [10, 1000, 100000, 10000000]}
    tolerance: 1e-6
    shown: ['$v_{1x,f} \to -v_{1x,i} + 2\,v_{2x,i}$']
    source: {cite: reading1, at: 'Eq. (15.4.14), p. 15-9 (the limit is our own step)'}
    origin: page-own

  - id: p1-example-given
    kind: fact
    where: 'Problem 1, check: our own example values'
    shown: ['$v_{p,0} = 3.0$ m/s and $v_{b,0} = 2.0$ m/s', '$m_p = 2.7$ g and $m_b = 7.0$ kg']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-example
    where: 'Problem 1, check: the ping-pong ball for 3.0 m/s against 2.0 m/s'
    inputs: {vp0: 3.0 m/s, vb0: 2.0 m/s}
    formula: -vp0 - 2 * vb0
    expected: -7.0 m/s
    shown: ['$v_{px,f} = -3.0 - 2 \times 2.0 = -7.0$ m/s']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-example-finite-masses
    where: 'Problem 1, check: the general formula with a 2.7 g ball and a 7.0 kg ball'
    inputs: {mp: 2.7 g, mb: 7.0 kg, vp0: 3.0 m/s, vb0: 2.0 m/s}
    formula: (mp - mb) / (mp + mb) * vp0 + 2 * mb / (mp + mb) * (-vb0)
    expected: -6.996 m/s
    shown: ['the general formula gives $-6.996$ m/s']
    source: {cite: reading1, at: 'Eq. (15.4.14), p. 15-9 (our own numbers)'}
    origin: page-own

  # ---- Problem 2

  # Independent route: for a satellite of 1e-7 of the Earth's mass arriving at 4 ve, the satellite's final
  # velocity is the negative root of the kinetic energy balance with momentum put in; the speed is minus that.
  - id: p2-by-solve
    kind: identity
    answer: p2-v
    where: 'Problem 2, answer box and formula "Fly-by: final speed for the given case": against a numerical solve of momentum and kinetic energy for a mass ratio of 1e-7'
    formula: 2*ve
    equals: -solve('0.5*msat*x**2 + 0.5*mE*((msat*4*ve + mE*ve - msat*x)/mE)**2 - 0.5*msat*(4*ve)**2 - 0.5*mE*ve**2', 'x', -1000, 0)
    samples:
      ve: [1, 5, 3, 2.2]
      msat: [1.0e-7, 1.0e-7, 1.0e-7, 1.0e-7]
      mE: [1, 1, 1, 1]
    tolerance: 1e-5
    shown: ['v_f = 4\,v_e - 2\,v_e = 2\,v_e']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-relative-speed
    where: 'Problem 2: relative speed in units of the Earth''s speed'
    formula: 4 - 1
    expected: '3'
    shown: ['at the relative speed $3\,v_e$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-energy-kept
    where: 'Problem 2, check: fraction of its kinetic energy that the satellite keeps'
    formula: (2/4)**2
    expected: '0.25'
    shown: ['it keeps a quarter of its kinetic energy']
    source: {cite: mit, at: 'Problem 2 (our own check)'}
    origin: page-own

  # ---- Problem 3

  # (a) Independent route: the height as the root of the energy balance, with the common velocity from momentum.
  - id: p3-a-by-solve
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "Greatest height of the cube": against a numerical solve of the energy balance'
    formula: mb*vc0**2/(2*g*(mb + mc))
    equals: solve('0.5*mc*vc0**2 - 0.5*(mb + mc)*(mc*vc0/(mb + mc))**2 - mc*g*x', 'x', 0, 1000)
    samples:
      vc0: [1, 3, 2.0, 2.5]
      g: [9, 10, 9.8, 9.8]
      mb: [2, 5, 0.60, 3]
      mc: [0.5, 1.5, 0.20, 1]
    tolerance: 1e-8
    shown: ['h = \frac{m_b}{m_b + m_c}\;\frac{v_{c,0}^2}{2g}']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-heavy-block
    kind: limit
    where: 'Problem 3(a), check: a very heavy block acts as a fixed ramp'
    formula: mb*vc0**2/(2*g*(mb + mc))
    limit: vc0**2/(2*g)
    inputs: {vc0: 2.0, g: 9.8, mc: 0.20}
    vary: {mb: [1, 100, 10000, 1000000, 100000000]}
    tolerance: 1e-6
    shown: ['$h = v_{c,0}^2/(2g)$']
    source: {cite: mit, at: 'Problem 3(a) (our own check)'}
    origin: page-own

  - id: p3-example-given
    kind: fact
    where: 'Problem 3(a), check: our own example values'
    shown: ['$m_c = 0.20$ kg, $m_b = 0.60$ kg and $v_{c,0} = 2.0$ m/s, with $g = 9.8\ \text{m/s}^2$']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-common
    where: 'Problem 3(a), check: common velocity at the highest point'
    inputs: {mc: 0.20 kg, mb: 0.60 kg, vc0: 2.0 m/s}
    formula: mc * vc0 / (mb + mc)
    expected: 0.50 m/s
    shown: ['$V = 0.20 \times 2.0/0.80 = 0.50$ m/s']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-k0
    where: 'Problem 3(a), check: kinetic energy of the cube at the start'
    inputs: {mc: 0.20 kg, vc0: 2.0 m/s}
    formula: 0.5 * mc * vc0**2
    expected: 0.40 J
    shown: ['$0.5 \times 0.20 \times 2.0^2 = 0.40$ J']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-k-top
    where: 'Problem 3(a), check: kinetic energy of cube and block at the highest point'
    inputs: {mtot: 0.80 kg, V: 0.50 m/s}
    formula: 0.5 * mtot * V**2
    expected: 0.10 J
    shown: ['$0.5 \times 0.80 \times 0.50^2 = 0.10$ J']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-stored
    where: 'Problem 3(a), check: energy stored as height'
    inputs: {K0: 0.40 J, Ktop: 0.10 J}
    formula: K0 - Ktop
    expected: 0.30 J
    shown: ['so 0.30 J is stored as height']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-height
    where: 'Problem 3(a), check: height from the stored energy'
    inputs: {E: 0.30 J, mc: 0.20 kg, g: 9.8 m/s**2}
    formula: E / (mc * g)
    expected: 0.153 m
    shown: ['$h = 0.30/(0.20 \times 9.8) = 0.153$ m']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-mass-fraction
    where: 'Problem 3(a), check: the fraction m_b/(m_b + m_c)'
    inputs: {mc: 0.20 kg, mb: 0.60 kg}
    formula: mb / (mb + mc)
    expected: '0.75'
    shown: ['$0.75 \times 2.0^2/(2 \times 9.8) = 0.153$ m']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  - id: p3-example-height-by-formula
    where: 'Problem 3(a), check: height from the answer formula'
    inputs: {mc: 0.20 kg, mb: 0.60 kg, vc0: 2.0 m/s, g: 9.8 m/s**2}
    formula: mb * vc0**2 / (2 * g * (mb + mc))
    expected: 0.153 m
    shown: ['$0.75 \times 2.0^2/(2 \times 9.8) = 0.153$ m']
    source: {cite: mit, at: 'Problem 3(a) (our own numbers)'}
    origin: page-own

  # (b) Independent route: the cube's final velocity is the negative root of the kinetic energy balance with the
  # block's velocity taken from momentum (the positive root is the initial state); the block's speed follows.
  - id: p3-b-cube-by-solve
    kind: identity
    answer: p3-b-cube
    where: 'Problem 3(b), first answer box and formula "Cube and block: final speeds": against a numerical solve of momentum and kinetic energy'
    formula: (mb - mc)*vc0/(mb + mc)
    equals: -solve('0.5*mc*x**2 + 0.5*mb*((mc*vc0 - mc*x)/mb)**2 - 0.5*mc*vc0**2', 'x', -1000, 0)
    samples:
      vc0: [1, 3, 2.0, 2.5]
      mb: [2, 5, 0.60, 3]
      mc: [0.5, 1.5, 0.20, 1]
    tolerance: 1e-8
    shown: ['|v_{cx,f}| = \frac{m_b - m_c}{m_b + m_c}\,v_{c,0}']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-block-by-solve
    kind: identity
    answer: p3-b-block
    where: 'Problem 3(b), second answer box and formula "Cube and block: final speeds": against a numerical solve of momentum and kinetic energy'
    formula: 2*mc*vc0/(mb + mc)
    equals: (mc*vc0 - mc*solve('0.5*mc*x**2 + 0.5*mb*((mc*vc0 - mc*x)/mb)**2 - 0.5*mc*vc0**2', 'x', -1000, 0))/mb
    samples:
      vc0: [1, 3, 2.0, 2.5]
      mb: [2, 5, 0.60, 3]
      mc: [0.5, 1.5, 0.20, 1]
    tolerance: 1e-8
    shown: ['|v_{bx,f}| = \frac{2\,m_c}{m_b + m_c}\,v_{c,0}']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-twice-common
    kind: identity
    where: 'Problem 3(b), check: the block ends with twice the common velocity of part (a)'
    formula: 2*mc*vc0/(mb + mc)
    equals: 2*(mc*vc0/(mb + mc))
    samples:
      vc0: [1, 3, 2.0]
      mb: [2, 5, 0.60]
      mc: [0.5, 1.5, 0.20]
    tolerance: 1e-12
    shown: ['The block ends with twice the common velocity $V$ of part (a).']
    source: {cite: mit, at: 'Problem 3(b) (our own check)'}
    origin: page-own

  - id: p3-example-cube
    where: 'Problem 3(b), check: final speed of the cube'
    inputs: {mc: 0.20 kg, mb: 0.60 kg, vc0: 2.0 m/s}
    formula: (mb - mc) * vc0 / (mb + mc)
    expected: 1.0 m/s
    shown: ['the cube ends at $0.40 \times 2.0/0.80 = 1.0$ m/s']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-block
    where: 'Problem 3(b), check: final speed of the block'
    inputs: {mc: 0.20 kg, mb: 0.60 kg, vc0: 2.0 m/s}
    formula: 2 * mc * vc0 / (mb + mc)
    expected: 1.0 m/s
    shown: ['the block at $2 \times 0.20 \times 2.0/0.80 = 1.0$ m/s']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-momentum-after
    where: 'Problem 3(b), check: momentum after'
    inputs: {mc: 0.20 kg, mb: 0.60 kg, vc: -1.0 m/s, vb: 1.0 m/s}
    formula: mc * vc + mb * vb
    expected: 0.40 kg*m/s
    shown: ['$0.20 \times (-1.0) + 0.60 \times 1.0 = 0.40$ kg m/s']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-momentum-before
    where: 'Problem 3(b), check: momentum before'
    inputs: {mc: 0.20 kg, vc0: 2.0 m/s}
    formula: mc * vc0
    expected: 0.40 kg*m/s
    shown: ['$0.20 \times 2.0 = 0.40$ kg m/s']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-k-cube-after
    where: 'Problem 3(b), check: kinetic energy of the cube afterwards'
    inputs: {mc: 0.20 kg, vc: 1.0 m/s}
    formula: 0.5 * mc * vc**2
    expected: 0.10 J
    shown: ['$0.10 + 0.30 = 0.40$ J']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-k-block-after
    where: 'Problem 3(b), check: kinetic energy of the block afterwards'
    inputs: {mb: 0.60 kg, vb: 1.0 m/s}
    formula: 0.5 * mb * vb**2
    expected: 0.30 J
    shown: ['$0.10 + 0.30 = 0.40$ J']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  - id: p3-example-k-after
    where: 'Problem 3(b), check: kinetic energy afterwards'
    inputs: {Kc: 0.10 J, Kb: 0.30 J}
    formula: Kc + Kb
    expected: 0.40 J
    shown: ['$0.10 + 0.30 = 0.40$ J']
    source: {cite: mit, at: 'Problem 3(b) (our own numbers)'}
    origin: page-own

  # ---- Problem 4

  # Independent route: the notes' split of the kinetic energy (Eq. (15.2.19)). At the greatest compression the
  # relative velocity is zero, so the spring holds ½ μ v1² with the reduced mass μ = 1/(1/m1 + 1/m2).
  - id: p4-by-reduced-mass
    kind: identity
    answer: p4-x
    where: 'Problem 4, answer box and formula "Greatest compression of the spring": against the reduced-mass form of the kinetic energy'
    formula: v1*sqrt(m1*m2/(k*(m1 + m2)))
    equals: sqrt((1/(1/m1 + 1/m2))*v1**2/k)
    samples:
      v1: [1, 5, 2.0, 3]
      m1: [1, 4, 1.0, 2.5]
      m2: [1, 4, 3.0, 1.5]
      k: [50, 200, 300, 120]
    tolerance: 1e-12
    shown: ['x_\text{max} = v_1\,\sqrt{\frac{m_1\,m_2}{k\,(m_1 + m_2)}}']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # The same answer against a numerical solve of the energy balance in the frame of the table.
  - id: p4-by-solve
    kind: identity
    where: 'Problem 4, formula "Two blocks: energy at the start and at the greatest compression": numerical solve for the compression'
    formula: v1*sqrt(m1*m2/(k*(m1 + m2)))
    equals: solve('0.5*m1*v1**2 - 0.5*(m1 + m2)*(m1*v1/(m1 + m2))**2 - 0.5*k*x**2', 'x', 0, 1000)
    samples:
      v1: [1, 5, 2.0, 3]
      m1: [1, 4, 1.0, 2.5]
      m2: [1, 4, 3.0, 1.5]
      k: [50, 200, 300, 120]
    tolerance: 1e-8
    shown: ['\tfrac12\,m_1\,v_1^2 = \tfrac12\,(m_1 + m_2)\,V^2 + \tfrac12\,k\,x_\text{max}^2']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-heavy-block
    kind: limit
    where: 'Problem 4, check: a very heavy block 2 acts as a wall'
    formula: v1*sqrt(m1*m2/(k*(m1 + m2)))
    limit: v1*sqrt(m1/k)
    inputs: {v1: 2.0, m1: 1.0, k: 300}
    vary: {m2: [1, 100, 10000, 1000000, 100000000]}
    tolerance: 1e-6
    shown: ['$x_\text{max} = v_1\sqrt{m_1/k}$']
    source: {cite: mit, at: 'Problem 4 (our own check)'}
    origin: page-own

  - id: p4-example-given
    kind: fact
    where: 'Problem 4, check: our own example values'
    shown: ['$m_1 = 1.0$ kg, $m_2 = 3.0$ kg, $v_1 = 2.0$ m/s and $k = 300$ N/m']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-common
    where: 'Problem 4, check: common velocity'
    inputs: {m1: 1.0 kg, m2: 3.0 kg, v1: 2.0 m/s}
    formula: m1 * v1 / (m1 + m2)
    expected: 0.50 m/s
    shown: ['$V = 1.0 \times 2.0/4.0 = 0.50$ m/s']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-k0
    where: 'Problem 4, check: kinetic energy of block 1 at the start'
    inputs: {m1: 1.0 kg, v1: 2.0 m/s}
    formula: 0.5 * m1 * v1**2
    expected: 2.0 J
    shown: ['$0.5 \times 1.0 \times 2.0^2 = 2.0$ J']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-k-common
    where: 'Problem 4, check: kinetic energy of the common motion'
    inputs: {mtot: 4.0 kg, V: 0.50 m/s}
    formula: 0.5 * mtot * V**2
    expected: 0.50 J
    shown: ['$0.5 \times 4.0 \times 0.50^2 = 0.50$ J']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-spring-energy
    where: 'Problem 4, check: energy in the spring'
    inputs: {K0: 2.0 J, Kc: 0.50 J}
    formula: K0 - Kc
    expected: 1.5 J
    shown: ['The spring stores the other 1.5 J']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-compression
    where: 'Problem 4, check: greatest compression'
    inputs: {E: 1.5 J, k: 300 N/m}
    formula: sqrt(2 * E / k)
    expected: 0.10 m
    shown: ['$x_\text{max} = \sqrt{2 \times 1.5/300} = 0.10$ m']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-example-compression-by-formula
    where: 'Problem 4, check: the same compression from the answer formula'
    inputs: {m1: 1.0 kg, m2: 3.0 kg, v1: 2.0 m/s, k: 300 N/m}
    formula: v1 * sqrt(m1 * m2 / (k * (m1 + m2)))
    expected: 0.10 m
    shown: ['= 0.10$ m']
    source: {cite: mit, at: 'Problem 4 (our own numbers)'}
    origin: page-own

  # ---- Problem 5

  # (a) Independent route: the speed as the root of the momentum balance.
  - id: p5-a-by-solve
    kind: identity
    answer: p5-a
    where: 'Problem 5(a), answer box and formula "Bullet and block: speed just after the collision": against a numerical solve of the momentum balance'
    formula: mb*v0/(M + mb)
    equals: solve('(M + mb)*x - mb*v0', 'x', 0, 100000)
    samples:
      M: [1, 5, 0.98, 2]
      mb: [0.01, 0.1, 0.020, 0.05]
      v0: [100, 400, 200, 300]
    tolerance: 1e-8
    shown: ['v_a = \frac{m_b\,v_0}{M + m_b}']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  # (b) Independent route: after the collision the block with the bullet is a harmonic oscillator with the
  # angular frequency sqrt(k/(M + mb)); it starts at the centre with the speed va, so its amplitude is va/ω.
  - id: p5-b-by-amplitude
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "Bullet and block: distance to the first stop": against the amplitude of the oscillation, speed over angular frequency'
    formula: mb*v0/sqrt(k*(M + mb))
    equals: (mb*v0/(M + mb))/sqrt(k/(M + mb))
    samples:
      M: [1, 5, 0.98, 2]
      mb: [0.01, 0.1, 0.020, 0.05]
      v0: [100, 400, 200, 300]
      k: [100, 1000, 400, 650]
    tolerance: 1e-12
    shown: ['x_1 = v_a\,\sqrt{\frac{M + m_b}{k}} = \frac{m_b\,v_0}{\sqrt{k\,(M + m_b)}}']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-b-by-solve
    kind: identity
    where: 'Problem 5(b), formula "Bullet and block: energy from the collision to the first stop": numerical solve for the distance'
    formula: mb*v0/sqrt(k*(M + mb))
    equals: solve('0.5*(M + mb)*(mb*v0/(M + mb))**2 - 0.5*k*x**2', 'x', 0, 1000)
    samples:
      M: [1, 5, 0.98, 2]
      mb: [0.01, 0.1, 0.020, 0.05]
      v0: [100, 400, 200, 300]
      k: [100, 1000, 400, 650]
    tolerance: 1e-8
    shown: ['\tfrac12\,(M + m_b)\,v_a^2 = \tfrac12\,k\,x_1^2']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  # (c) Independent route: the two kinetic energies written out with a bullet speed, and the notes' Eq. (15.5.5).
  - id: p5-c-by-energies
    kind: identity
    answer: p5-c
    where: 'Problem 5(c), answer box and formula "Bullet and block: kinetic energy after over kinetic energy before": against the two kinetic energies written out'
    formula: mb/(M + mb)
    equals: (0.5*(M + mb)*(mb*v0/(M + mb))**2)/(0.5*mb*v0**2)
    samples:
      M: [1, 5, 0.98, 2]
      mb: [0.01, 0.1, 0.020, 0.05]
