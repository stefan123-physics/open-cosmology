  # Independent route: with v1i = 1 and x for each component of particle 2's velocity (v2f/√2), momentum gives
  # particle 1 the components 1 − 2x and 2x; x is the non-zero root of the kinetic energy balance.
  - id: p6-tan
    answer: p6-tan
    where: 'Problem 6, answer box: tangent of the angle of particle 1, from a numerical solve of the energy balance'
    formula: 2*solve('(1 - 2*x)**2 + (2*x)**2 + 2*(2*x**2) - 1', 'x', 0.1, 1)/(1 - 2*solve('(1 - 2*x)**2 + (2*x)**2 + 2*(2*x**2) - 1', 'x', 0.1, 1))
    expected: '2'
    tolerance: 1e-6
    shown: ['\tan\theta_{1,f} = \frac{2/3}{1/3} = 2']
    source: {cite: mit, at: 'Problem 6 (our own solution)'}
    origin: page-own

