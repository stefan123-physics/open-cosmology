# Calculations on content/year-1/8.01/torque-and-angular-impulse.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 34 (segments 34.1–34.5) and Course Notes Chapter 19, with the page's own numbers.

page: content/year-1/8.01/torque-and-angular-impulse.mdx
calcs:
  - id: ring-moment
    kind: identity
    where: 'formula "Particle hits pivoted ring": I_P = (m₁r² + m₁r²) + m₂(√2 r)² = 2(m₁ + m₂)r²'
    formula: (m1 * r**2 + m1 * r**2) + m2 * (sqrt(2) * r)**2
    equals: 2 * (m1 + m2) * r**2
    samples: {m1: [1.0, 3.0], m2: [0.5, 2.0], r: [0.2, 1.5]}
    tolerance: 1e-9
    shown: ['\left(2m_1r^2 + 2m_2r^2\right)\omega_f']
    source: {cite: reading5, at: 'p. 3'}
    origin: mit

  - id: ring-omega
    kind: identity
    where: 'same: ω_f = m₂vᵢ/(2(m₁ + m₂)r)'
    formula: m2 * v * r / (2 * (m1 + m2) * r**2)
    equals: m2 * v / (2 * (m1 + m2) * r)
    samples: {m1: [1.0, 3.0], m2: [0.5, 2.0], r: [0.2, 1.5], v: [3.0, 10.0]}
    tolerance: 1e-9
    shown: ['\omega_f = \frac{m_2v_i}{2(m_1 + m_2)\,r}']
    source: {cite: reading5, at: 'p. 4'}
    origin: mit

  - id: impulse-j
    where: 'worked example (a) and quiz 2: J = 2.0 × 0.50 = 1.0 kg m²/s'
    inputs: {T: 2.0 N*m, t: 0.50 s}
    formula: T * t
    expected: 1.0 kg*m^2/s
    shown: ['$J = 2.0 \times 0.50 = 1.0$ kg m²/s']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own

  - id: impulse-omega
    where: 'same: ω = 1.0/0.25 = 4.0 rad/s'
    inputs: {J: 1.0 kg*m^2/s, I: 0.25 kg*m^2}
    formula: J / I
    expected: 4.0 1/s
    shown: ['so $\omega = 1.0/0.25 = 4.0$ rad/s']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own

  - id: rod-l
    where: 'worked example (b): L = 0.20 × 6.0 × 1.0 = 1.2 kg m²/s'
    inputs: {m: 0.20 kg, v: 6.0 m/s, d: 1.0 m}
    formula: m * v * d
    expected: 1.2 kg*m^2/s
    shown: ['$L = mv\ell = 0.20 \times 6.0 \times 1.0 = 1.2$ kg m²/s']
    source: {cite: reading1, at: 'Example 19.7, pp. 19-21–19-26'} 
    origin: page-own

  - id: rod-i
    where: 'same: I = ⅓ × 1.2 × 1.0² + 0.20 × 1.0² = 0.60 kg m²'
    inputs: {M: 1.2 kg, m: 0.20 kg, d: 1.0 m}
    formula: M * d**2 / 3 + m * d**2
    expected: 0.60 kg*m^2
    shown: ['$I = \frac{1}{3}M\ell^2 + m\ell^2 = 0.40 + 0.20 = 0.60$ kg m²']
    source: {cite: reading1, at: 'Example 19.7, pp. 19-21–19-26'} 
    origin: page-own

  - id: rod-omega
    where: 'same: ω = 1.2/0.60 = 2.0 rad/s'
    inputs: {L: 1.2 kg*m^2/s, I: 0.60 kg*m^2}
    formula: L / I
    expected: 2.0 1/s
    shown: ['so $\omega = 1.2/0.60 = 2.0$ rad/s']
    source: {cite: reading1, at: 'Example 19.7, pp. 19-21–19-26'} 
    origin: page-own

  - id: rod-k-before
    where: 'same: ½ × 0.20 × 6.0² = 3.6 J'
    inputs: {m: 0.20 kg, v: 6.0 m/s}
    formula: 0.5 * m * v**2
    expected: 3.6 J
    shown: ['$\frac{1}{2} \times 0.20 \times 6.0^2 = 3.6$ J']
    source: {cite: reading1, at: 'Example 19.7, pp. 19-21–19-26'} 
    origin: page-own

  - id: rod-k-after
    where: 'same: ½ × 0.60 × 2.0² = 1.2 J'
    inputs: {I: 0.60 kg*m^2, w: 2.0 1/s}
    formula: 0.5 * I * w**2
    expected: 1.2 J
    shown: ['$\frac{1}{2} \times 0.60 \times 2.0^2 = 1.2$ J']
    source: {cite: reading1, at: 'Example 19.7, pp. 19-21–19-26'} 
    origin: page-own

