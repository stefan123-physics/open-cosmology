# Calculations on content/year-1/8.01/angular-momentum-point-particle.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.01SC Lesson 32 (segments 32.1–32.4) and Course Notes Chapter 19, Sections 19.1–19.2 and Example 19.6, with the page's own numbers.

page: content/year-1/8.01/angular-momentum-point-particle.mdx
calcs:
  - id: two-particles-a
    kind: identity
    where: 'formula "Two particles, about A": z components r p1 + r p1 = 2 r p1'
    formula: (-r) * (-p) + r * p
    equals: 2 * r * p
    samples: {r: [1.0, 2.5], p: [3.0, 0.4]}
    tolerance: 1e-9
    shown: ['= 2r\,p_1\,\hat k']
    source: {cite: reading4, at: 'p. 2'}
    origin: mit

  - id: two-particles-b
    kind: identity
    where: 'section "A system about different points": (2r + d) p1 − d p1 = 2 r p1'
    formula: (2 * r + d) * p - d * p
    equals: 2 * r * p
    samples: {r: [1.0, 2.5], p: [3.0, 0.4], d: [0.7, 4.0]}
    tolerance: 1e-9
    shown: ['which again add to $2r\,p_1\,\hat k$']
    source: {cite: reading4, at: 'pp. 2–3'}
    origin: mit

  - id: circular
    kind: identity
    where: 'formula "Angular momentum in circular motion": r · m r ω = m r² ω'
    formula: r * (m * r * w)
    equals: m * r**2 * w
    samples: {r: [0.8, 2.0], m: [0.2, 5.0], w: [3.0, 0.5]}
    tolerance: 1e-9
    shown: ['= mr^2\omega_z\,\hat k = I_S\,\vec\omega']
    source: {cite: reading5, at: 'p. 2'}
    origin: mit

  - id: example-a
    where: 'worked example (a): L_z = −(3.0 m)(2.0 kg m/s) = −6.0 kg m²/s'
    inputs: {y: 3.0 m, m: 0.50 kg, v: 4.0 m/s}
    formula: -y * m * v
    expected: -6.0 kg*m^2/s
    shown: ['= -6.0\,\hat k$ kg m²/s']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: example-a-p
    where: 'same: p = 0.50 × 4.0 = 2.0 kg m/s'
    inputs: {m: 0.50 kg, v: 4.0 m/s}
    formula: m * v
    expected: 2.0 kg*m/s
    shown: ['$\vec p = 2.0\,\hat i$ kg m/s']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): 1.5 × 1.0 × 2.0 = 3.0 kg m²/s'
    inputs: {d: 1.5 m, m: 1.0 kg, v: 2.0 m/s}
    formula: d * m * v
    expected: 3.0 kg*m^2/s
    shown: ['$1.5 \times 1.0 \times 2.0 = 3.0$ kg m²/s']
    source: {cite: reading4, at: 'p. 4'}
    origin: page-own

  - id: example-c
    where: 'worked example (c) and quiz 4: 0.20 × 0.80² × 3.0 ≈ 0.38 kg m²/s'
    inputs: {m: 0.20 kg, r: 0.80 m, w: 3.0 1/s}
    formula: m * r**2 * w
    expected: 0.384 kg*m^2/s
    shown: ['\times 0.80^2 \times 3.0 \approx 0.38$ kg m²/s']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: quiz-2
    where: 'quiz 2: (1.0 î + 2.0 ĵ) × 6.0 î = −12 k̂'
    inputs: {y: 2.0 m, p: 6.0 kg*m/s}
    formula: -y * p
    expected: -12 kg*m^2/s
    shown: ['= 12\\,(\\hat j \\times \\hat i) = -12\\,\\hat k$ kg m²/s']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own
