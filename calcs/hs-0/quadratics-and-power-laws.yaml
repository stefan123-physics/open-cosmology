# Calculations on content/year-0/hs-0/quadratics-and-power-laws.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Mathematics Grade 10 6.3, 6.4, 2.3; Stitz–Zeager 0.6.1 and 0.7. All numbers are the page's own.

page: content/year-0/hs-0/quadratics-and-power-laws.mdx
calcs:
  - id: sqrt-method
    where: 'section "Solving quadratic equations", method 1: 3x² − 48 = 0 gives x² = 16, x = ±4'
    inputs: {}
    formula: solve('3*x**2 - 48', 'x', 0, 10)
    expected: '4'
    shown: ['From $3x^{2} - 48 = 0$: $x^{2} = 16$, so $x = 4$ or $x = -4$']
    source: {cite: reading1, at: 'Sec. 0.7, Extracting square roots, p. 83 (the numbers are the page''s own)'}
    origin: page-own

  - id: factor-root-1
    where: 'method 2: x² + 2x − 15 = (x + 5)(x − 3) = 0 at x = 3'
    inputs: {}
    formula: solve('x**2 + 2*x - 15', 'x', 0, 10)
    expected: '3'
    shown: ['when $x = -5$ or $x = 3$']
    source: {cite: reading1, at: 'Sec. 0.6.1, p. 77 (the numbers are the page''s own)'}
    origin: page-own

  - id: factor-root-2
    where: 'same: and at x = −5'
    inputs: {}
    formula: solve('x**2 + 2*x - 15', 'x', -10, 0)
    expected: '-5'
    shown: ['$x^{2} + 2x - 15 = (x + 5)(x - 3)$']
    source: {cite: reading1, at: 'Sec. 0.6.1, p. 77 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-discriminant
    where: 'worked example "A ball thrown upward": b² − 4ac = 196 + 29.4 = 225.4'
    inputs: {a: -4.9, b: 14, c: 1.5}
    formula: b**2 - 4*a*c
    expected: '225.4'
    shown: ['$b^{2} - 4ac = 196 - 4(-4.9)(1.5) = 196 + 29.4 = 225.4$']
    source: {cite: reading1, at: 'Sec. 0.7, Theorem 0.9, p. 86 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-root
    where: 'same: √225.4 ≈ 15.01'
    inputs: {}
    formula: sqrt(225.4)
    expected: '15.01'
    shown: ['$\sqrt{225.4} \approx 15.01$']
    source: {cite: reading1, at: 'Sec. 0.7, p. 86 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-time
    where: 'same: the physical solution t ≈ 2.96 s'
    inputs: {}
    formula: solve('1.5 + 14*t - 4.9*t**2', 't', 0, 5)
    expected: '2.96'
    shown: ['The minus sign gives $t = 29.01/9.8 \approx 2.96$ s']
    source: {cite: reading1, at: 'Sec. 0.7, p. 86 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-negative
    where: 'same: the other solution t ≈ −0.10 s'
    inputs: {}
    formula: solve('1.5 + 14*t - 4.9*t**2', 't', -1, 0)
    expected: '-0.10'
    shown: ['the plus sign gives $t = 1.01/(-9.8) \approx -0.10$ s']
    source: {cite: reading1, at: 'Sec. 0.7, p. 86 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-check
    where: 'same, check: 14 × 2.96 = 41.44 and 4.9 × 2.96² ≈ 42.93, so the height is about 0'
    inputs: {t: 2.96}
    formula: 4.9 * t**2
    expected: '42.93'
    shown: ['$1.5 + 14(2.96) - 4.9(2.96)^{2} = 1.5 + 41.44 - 42.93 \approx 0$']
    source: {cite: reading1, at: 'Sec. 0.7, p. 86 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-check-middle
    where: 'same: 14 × 2.96 = 41.44'
    inputs: {t: 2.96}
    formula: 14 * t
    expected: '41.44'
    shown: ['= 1.5 + 41.44 - 42.93']
    source: {cite: reading1, at: 'Sec. 0.7, p. 86 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-factor
    where: 'quiz 1: x² − 5x + 6 = 0 at x = 2 and x = 3'
    inputs: {}
    formula: solve('x**2 - 5*x + 6', 'x', 2.5, 5)
    expected: '3'
    shown: ['It factors as $(x - 2)(x - 3) = 0$']
    source: {cite: reading1, at: 'Sec. 0.6.1, p. 77 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-discriminant
    where: 'quiz 2: x² + 4x + 5 has discriminant 16 − 20 = −4'
    inputs: {a: 1, b: 4, c: 5}
    formula: b**2 - 4*a*c
    expected: '-4'
    shown: ['$b^{2} - 4ac = 16 - 20 = -4$']
    source: {cite: reading1, at: 'Sec. 0.7, Theorem 0.10, p. 92 (the numbers are the page''s own)'}
    origin: page-own

  - id: cube-scaling
    where: 'section "Power laws" and quiz 4: doubling a cube''s side multiplies its volume by 2³ = 8'
    inputs: {}
    formula: 2**3
    expected: '8'
    shown: ['multiplies its volume by $2^{3} = 8$']
    source: {cite: reading3, at: 'Sec. 2.3 covers rational exponents only; the scaling argument and numbers are the page''s own'}
    origin: page-own

  - id: lamp-double
    where: 'same: doubling the distance from a lamp divides the brightness by 2² = 4'
    inputs: {}
    formula: 2**2
    expected: '4'
    shown: ['divides the brightness by $2^{2} = 4$']
    source: {cite: reading2, at: 'Sec. 6.4, Hyperbolic functions (the source covers hyperbolas only; the inverse square law and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-lamp
    where: 'quiz 5: at 3 m the brightness is 1/3² = 1/9 of that at 1 m'
    inputs: {}
    formula: 1 / 3**2
    expected: '0.111'
    shown: ['gives $1/3^{2} = 1/9$ of the brightness']
    source: {cite: reading2, at: 'Sec. 6.4 covers hyperbolas only; the inverse square law and numbers are the page''s own'}
    origin: page-own

  - id: plot-caption
    where: 'inverse-square plot caption: at r = 2, 1/r² is a quarter and 1/r a half'
    inputs: {r: 2}
    formula: (1 / r**2) / (1 / r)
    expected: '0.5'
    shown: ['at r = 2 it is a quarter of its value at r = 1, where 1/r is a half']
    source: {cite: reading2, at: 'Sec. 6.4 covers hyperbolas only; the inverse square law and numbers are the page''s own'}
    origin: page-own

  - id: matter-density
    where: 'cosmology callout: doubling every distance divides the matter density by 2³ = 8'
    inputs: {}
    formula: 2**3
    expected: '8'
    shown: ['the density of matter falls by $2^{3} = 8$']
    source: {cite: reading3, at: 'Sec. 2.3 covers rational exponents only; the scaling and numbers are the page''s own (the cosmology matches the 8.286 lessons)'}
    origin: page-own

  - id: quiz-factor-2
    where: 'quiz 1: x² − 5x + 6 = 0 also at x = 2'
    inputs: {}
    formula: solve('x**2 - 5*x + 6', 'x', 0, 2.5)
    expected: '2'
    shown: ['so one of the factors is zero: $x = 2$ or $x = 3$']
    source: {cite: reading1, at: 'Sec. 0.6.1, p. 77 (the numbers are the page''s own)'}
    origin: page-own

  - id: factor-pair
    where: 'section "Solving quadratic equations": 5 × −3 = −15 and 5 + (−3) = 2'
    inputs: {}
    formula: 5 * -3
    expected: '-15'
    shown: ['since $5 \times -3 = -15$ and $5 + (-3) = 2$']
    source: {cite: reading1, at: 'Sec. 0.6.1, p. 77 (the numbers are the page''s own)'}
    origin: page-own
