# Calculations on content/year-0/hs-0/rearranging-formulas.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10 1.3 (changing the subject); Stitz–Zeager Section 0.3; the page's own numbers.
# Solutions of equations are checked by substituting them back (both sides must agree).

page: content/year-0/hs-0/rearranging-formulas.mdx
calcs:
  - id: linear-solution
    where: 'worked example "Unknowns on both sides": 5x − 7 = 2x + 8 gives x = 5'
    inputs: {}
    formula: solve('5*x - 7 - (2*x + 8)', 'x', 0, 10)
    expected: '5'
    shown: ['Divide both sides by 3: $x = 5$.']
    source: {cite: reading1, at: 'Sec. 0.3.1, Strategy for solving linear equations, p. 39'}
    origin: page-own

  - id: linear-check
    where: 'same, step "Check": both sides are 18'
    inputs: {x: 5}
    formula: 5*x - 7
    expected: '18'
    shown: ['the left side is $5 \cdot 5 - 7 = 18$ and the right side is $2 \cdot 5 + 8 = 18$']
    source: {cite: reading1, at: 'Sec. 0.3.1, p. 39'}
    origin: page-own

  - id: fraction-solution
    where: 'worked example "A fraction": (x + 6)/4 = x − 3 gives x = 6'
    inputs: {}
    formula: solve('(x + 6)/4 - (x - 3)', 'x', 0, 10)
    expected: '6'
    shown: ['Divide by 3: $x = 6$.']
    source: {cite: reading1, at: 'Sec. 0.3.1, p. 39'}
    origin: page-own

  - id: fraction-check
    where: 'same, step "Check": both sides are 3'
    inputs: {x: 6}
    formula: (x + 6) / 4
    expected: '3'
    shown: ['Left: $(6 + 6)/4 = 3$. Right: $6 - 3 = 3$.']
    source: {cite: reading1, at: 'Sec. 0.3.1, p. 39'}
    origin: page-own

  - id: trip-time
    where: 'worked example "Time from distance and speed": 450 km at 90 km/h takes 5.0 h'
    inputs: {d: 450 km, v: 90 km/hour}
    formula: d / v
    expected: 5.0 hour
    shown: ['= 5.0$ h']
    source: {cite: mit, at: 'Sec. 1.3, Changing the subject of a formula'}
    origin: page-own

  - id: quiz-linear
    where: 'quiz 1: 4x + 9 = x + 21 gives x = 4 (both sides 25)'
    inputs: {}
    formula: solve('4*x + 9 - (x + 21)', 'x', 0, 10)
    expected: '4'
    shown: ['$4 \\cdot 4 + 9 = 25$ and $4 + 21 = 25$']
    source: {cite: reading1, at: 'Sec. 0.3.1, p. 39'}
    origin: page-own

  - id: hubble-distance
    where: 'cosmology callout: d = 7000/70 = 100 Mpc'
    inputs: {v: 7000 km/s, H: 70 km/s/Mpc}
    formula: v / H
    expected: 100 Mpc
    shown: ['$d = 7000/70 = 100$ Mpc away']
    source: {cite: mit, at: 'the page''s own example; the source has no Hubble law (H = 70 km/s/Mpc is the site''s round example value, calcs/values.yaml)'}
    origin: page-own

  - id: megaparsec
    where: 'same: a megaparsec is about 3.26 million light-years'
    inputs: {D: 1 Mpc, u: 1 ly}
    formula: D / u
    expected: '3.26e6'
    shown: ['a megaparsec is about 3.26 million light-years']
    source: {cite: mit, at: 'the page''s own unit conversion (not in the source)'}
    origin: page-own

  - id: cyclist-time
    where: 'worked example "When does the cyclist get there?": t = (80 − 20)/6.0 = 10 s'
    inputs: {x: 80 m, x0: 20 m, v: 6.0 m/s}
    formula: (x - x0) / v
    expected: 10 s
    shown: ['$t = (80 - 20)\ \text{m} / 6.0\ \text{m/s} = 10$ s']
    source: {cite: reading1, at: 'Sec. 0.3.1, Strategy for solving linear equations, p. 39 (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-check
    where: 'same, check: 20 + 6.0 × 10 = 80 m'
    inputs: {x0: 20 m, v: 6.0 m/s, t: 10 s}
    formula: x0 + v * t
    expected: 80 m
    shown: ['Check: $20 + 6.0 \times 10 = 80$ m']
    source: {cite: reading1, at: 'Sec. 0.3.1, p. 39 (the numbers are the page''s own)'}
    origin: page-own

  - id: root-25
    where: 'section "Changing the subject": √25 = 5'
    inputs: {}
    formula: sqrt(25)
    expected: '5'
    shown: ['$\sqrt{25} = 5$, because $5^{2} = 25$']
    source: {cite: mit, at: 'the page''s own example (not in the source)'}
    origin: page-own
