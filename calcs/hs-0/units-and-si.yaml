# Calculations on content/year-0/hs-0/units-and-si.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Siyavula Physical Sciences Grade 10, 1.3 Units, with the page's own numbers.

page: content/year-0/hs-0/units-and-si.mdx
calcs:
  - id: pound-force
    where: 'section "Why units matter": one pound-force is about 4.45 newtons'
    inputs: {F: 1 lbf}
    formula: F
    expected: 4.45 N
    shown: ['One pound-force is about 4.45 newtons']
    source: {cite: mit, at: 'Sec. 1.3, The importance of units'}
    origin: mit

  - id: orbiter-flight
    kind: fact
    where: 'same: flown to Mars for about ten months'
    value: 10
    shown: ['for about ten months']
    source: {cite: mit, at: 'Sec. 1.3, The importance of units'}
    origin: mit

  - id: prefix-kn
    where: 'section "Units built from base units": 5 kN = 5 × 10³ N'
    inputs: {F: 5 kN}
    formula: F
    expected: 5e3 N
    shown: ['5 kN is $5 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 1.3, Prefixes of base units'}
    origin: page-own

  - id: prefix-mhz
    where: 'section "Units built from base units": 2 MHz = 2 × 10⁶ Hz'
    inputs: {f: 2 MHz}
    formula: f
    expected: 2e6 Hz
    shown: ['2 MHz is $2 \times 10^{6}$ Hz']
    source: {cite: mit, at: 'Sec. 1.3, Prefixes of base units'}
    origin: page-own

  - id: km-to-m
    where: 'section "Converting units": 2.5 km = 2500 m'
    inputs: {x: 2.5 km}
    formula: x
    expected: 2500 m
    shown: ['= 2500\ \text{m}$']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: hour-seconds
    where: 'worked example "Motorway speed": one hour is 3600 s'
    inputs: {h: 1 hour}
    formula: h
    expected: 3600 s
    shown: ['$60 \times 60 = 3600$ s']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: motorway
    where: 'worked example "Motorway speed": 90 km/h = 25 m/s'
    inputs: {v: 90 km/hour}
    formula: v
    expected: 25 m/s
    shown: ['= 25\ \text{m/s}$', '$90/3.6 = 25$']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: factor-3-6
    where: 'same, step "Check": 1000/3600 = 1/3.6'
    inputs: {}
    formula: 3600 / 1000
    expected: '3.6'
    shown: ['$1000/3600 = 1/3.6$']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: mit

  - id: m2-cm2
    where: 'section "Squares and cubes": 1 m² = 10⁴ cm²; quiz 3'
    inputs: {A: 1 m**2}
    formula: A
    expected: 1e4 cm**2
    shown: ['= 10^{4}\ \text{cm}^{2}, \qquad']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: m3-cm3
    where: 'same: 1 m³ = 10⁶ cm³'
    inputs: {V: 1 m**3}
    formula: V
    expected: 1e6 cm**3
    shown: ['= 10^{6}\ \text{cm}^{3}$']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: floor
    where: 'same: 12 m² = 1.2 × 10⁵ cm²'
    inputs: {A: 12 m**2}
    formula: A
    expected: 1.2e5 cm**2
    shown: ['$12 \times 10^{4} = 1.2 \times 10^{5}$ cm²']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: water-step
    where: 'worked example "The density of water": 1.0 g/cm³ = 1.0 × 10⁻³ kg/cm³'
    inputs: {rho: 1.0 g/cm**3}
    formula: rho
    expected: 1.0e-3 kg/cm**3
    shown: ['= 1.0 \times 10^{-3}\ \dfrac{\text{kg}}{\text{cm}^{3}}$']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: water-density
    where: 'same: 1.0 g/cm³ = 1.0 × 10³ kg/m³'
    inputs: {rho: 1.0 g/cm**3}
    formula: rho
    expected: 1.0e3 kg/m**3
    shown: ['= 1.0 \times 10^{3}$ kg/m³']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: water-tonne
    where: 'same, step "Check": 1 m³ of water is 1000 litres, about 1000 kg'
    inputs: {V: 1 m**3, rho: 1.0e3 kg/m**3}
    formula: rho * V
    expected: 1000 kg
    shown: ['holds 1000 litres and has a mass of about 1000 kg']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: room-kelvin
    where: 'section "Temperature": 20 °C = 293 K; flashcard 4'
    inputs: {T: 20}
    formula: T + 273
    expected: '293'
    shown: ['$20 + 273 = 293$ K']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: absolute-zero
    kind: fact
    where: 'same: the exact offset between the scales is 273.15 (absolute zero is −273.15 °C)'
    value: 273.15
    shown: ['The exact number to add is 273.15']
    source: {cite: nist-si, at: 'Sec. 4.2.1.1'}
    origin: page-own

  - id: quiz-cyclist
    where: 'quiz 2: 18 km/h = 5.0 m/s'
    inputs: {v: 18 km/hour}
    formula: v
    expected: 5.0 m/s
    shown: ['$18 \\times 1000/3600 = 5.0$ m/s']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own
    quiz: 1

  - id: quiz-cold
    where: 'quiz 4: −40 °C + 273 = 233 K'
    inputs: {T: -40}
    formula: T + 273
    expected: '233'
    shown: ['$-40 + 273 = 233$ K']
    source: {cite: mit, at: 'Sec. 1.3, How to change units'}
    origin: page-own

  - id: year-seconds
    where: 'cosmology callout: a year (365.25 days) is 3.156 × 10⁷ s'
    inputs: {t: 1 year}
    formula: t
    expected: 3.156e7 s
    shown: ['times $3.156 \times 10^{7}$ s']
    source: {cite: mit, at: 'the page''s own (Siyavula gives no year in seconds)'}
    origin: page-own

  - id: light-year
    where: 'cosmology callout: one light-year = 9.46 × 10¹⁵ m'
    inputs: {t: 1 year}
    formula: c * t
    expected: 9.46e15 m
    shown: ['which is $9.46 \times 10^{15}$ m']
    source: {cite: mit, at: 'Sec. 1.3, Constants in equations (c only; the light-year is the page''s own)'}
    origin: page-own

  - id: light-speed-shown
    where: 'cosmology callout: c ≈ 2.998 × 10⁸ m/s'
    inputs: {}
    formula: c
    expected: 2.998e8 m/s
    shown: ['about $2.998 \times 10^{8}$ m/s']
    source: {cite: mit, at: 'Sec. 1.3, Constants in equations'}
    origin: mit
