# Calculations on content/year-0/hs-0/exponentials-and-logs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Mathematics Grade 10 6.5, Grade 11 1.4, Grade 12 2.6 and 2.8; MIT 8.286 Lecture 1 slide 10. Numbers are the page's own unless stated.

page: content/year-0/hs-0/exponentials-and-logs.mdx
calcs:
  - id: algae-factor
    where: 'worked example "Algae on a pond": 1.30⁶ = 4.83'
    inputs: {}
    formula: 1.30**6
    expected: '4.83'
    shown: ['$50 \times 1.30^{6} = 50 \times 4.83 = 241$ m²']
    source: {cite: reading2, at: 'Sec. 1.4, growth formula (the numbers are the page''s own)'}
    origin: page-own

  - id: algae-6-weeks
    where: 'same: 50 × 1.30⁶ = 241 m²'
    inputs: {}
    formula: 50 * 1.30**6
    expected: '241'
    shown: ['= 241$ m². The area has almost quintupled']
    source: {cite: reading2, at: 'Sec. 1.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: algae-linear
    where: 'same: 50 + 6 × 15 = 140 m²'
    inputs: {}
    formula: 50 + 6 * 15
    expected: '140'
    shown: ['$50 + 6 \times 15 = 140$ m²']
    source: {cite: reading2, at: 'Sec. 1.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-exp-12
    where: 'plot caption: after 12 weeks the exponential reaches about 1160 m²'
    inputs: {}
    formula: 50 * 1.3**12
    expected: '1160'
    tolerance: 10
    shown: ['the exponential reaches about 1160 m² against 230 m²']
    source: {cite: reading2, at: 'Sec. 1.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-lin-12
    where: 'same: the linear curve reaches 230 m²'
    inputs: {}
    formula: 50 + 15 * 12
    expected: '230'
    shown: ['against 230 m²']
    source: {cite: reading2, at: 'Sec. 1.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: log2-8
    where: 'section "Logarithms": log₂ 8 = 3'
    inputs: {}
    formula: log(8) / log(2)
    expected: '3'
    shown: ['So $\log_{2} 8 = 3$ because $2^{3} = 8$']
    source: {cite: mit, at: 'Sec. 2.6, Logarithms (the numbers are the page''s own)'}
    origin: page-own

  - id: log-2
    where: 'same: log 2 ≈ 0.301'
    inputs: {}
    formula: log10(2)
    expected: '0.301'
    shown: ['$\log 2 \approx 0.301$, because $10^{0.301} \approx 2$']
    source: {cite: mit, at: 'Sec. 2.6, Logarithms using a calculator (the numbers are the page''s own)'}
    origin: page-own

  - id: algae-1000
    where: 'worked example "When does the algae cover 1000 m²?": log 20 / log 1.30 = 11.4 weeks'
    inputs: {}
    formula: log10(20) / log10(1.30)
    expected: '11.4'
    shown: ['= \dfrac{1.301}{0.1139} = 11.4$ weeks']
    source: {cite: reading3, at: 'Sec. 2.8, Laws of logarithms; change of base in Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: log-20
    where: 'same: log 20 = 1.301'
    inputs: {}
    formula: log10(20)
    expected: '1.301'
    shown: ['\dfrac{\log 20}{\log 1.30} = \dfrac{1.301}{0.1139}']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: log-1-3
    where: 'same: log 1.30 = 0.1139'
    inputs: {}
    formula: log10(1.30)
    expected: '0.1139'
    shown: ['\dfrac{1.301}{0.1139} = 11.4']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: half-life-decay
    where: 'same, check step: decay by 20% per hour, 0.80ˣ = 0.5 gives x ≈ 3.1 hours'
    inputs: {}
    formula: log(0.5) / log(0.80)
    expected: '3.1'
    shown: ['$x = \log 0.5 / \log 0.80 \approx 3.1$ hours']
    source: {cite: mit, at: 'Sec. 2.6, Laws of logarithms (the numbers are the page''s own)'}
    origin: page-own

  - id: e-value
    where: 'section "The number e": e ≈ 2.718'
    inputs: {}
    formula: exp(1)
    expected: '2.718'
    shown: ['the number $e \approx 2.718$']
    source: {cite: mit, at: 'Sec. 2.6, Logarithm bases'}
    origin: page-own

  - id: inflation-doublings
    where: 'cosmology callout: 28/log 2 = 28/0.301 ≈ 93 doublings for a factor 10²⁸'
    inputs: {}
    formula: 28 / log10(2)
    expected: '93'
    shown: ['$x = 28/\log 2 = 28/0.301 \approx 93$ doublings']
    source: {cite: guth1, at: 'slides 4–5 (patch ~10⁻²⁸ cm, factor ≥ 10²⁸, marble); about 1 cm from the transcript (guth1t); the count is the page''s own'}
    origin: page-own

  - id: quiz-population
    where: 'quiz 1: 200 × 1.5³ = 675'
    inputs: {}
    formula: 200 * 1.5**3
    expected: '675'
    shown: ['$200 \\times 1.5^{3} = 200 \\times 3.375 = 675$']
    source: {cite: reading2, at: 'Sec. 1.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-half-life
    where: 'quiz 4: 24 h is 4 half-lives of 6 h, (1/2)⁴ = 1/16'
    inputs: {}
    formula: 0.5**(24 / 6)
    expected: '0.0625'
    shown: ['$(\\tfrac12)^{4} = \\tfrac{1}{16}$ is left']
    source: {cite: reading1, at: 'Sec. 6.5 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-solve
    where: 'quiz 5: 3ˣ = 50 gives x = log 50 / log 3 ≈ 3.56'
    inputs: {}
    formula: log10(50) / log10(3)
    expected: '3.56'
    shown: ['\\approx 1.699/0.477 \\approx 3.56$']
    source: {cite: mit, at: 'Sec. 2.6, Laws of logarithms (the numbers are the page''s own)'}
    origin: page-own

  - id: log-1000
    where: 'section "Logarithms": log 1000 = 3'
    inputs: {}
    formula: log10(1000)
    expected: '3'
    shown: ['$\log 1000 = 3$, $\log 1 = 0$, $\log 0.01 = -2$']
    source: {cite: reading3, at: 'Sec. 2.8, useful summary table'}
    origin: page-own

  - id: log-001
    where: 'same: log 0.01 = −2'
    inputs: {}
    formula: log10(0.01)
    expected: '-2'
    shown: ['$\log 0.01 = -2$. For numbers']
    source: {cite: reading3, at: 'Sec. 2.8, useful summary table'}
    origin: page-own

  - id: sqrt10
    where: 'same: 10^(1/2) = √10 ≈ 3.16'
    inputs: {}
    formula: 10**0.5
    expected: '3.16'
    shown: ['$10^{1/2} = \sqrt{10} \approx 3.16$']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: algae-check
    where: 'worked example, check: 1.30^11.4 ≈ 20'
    inputs: {}
    formula: 1.30**11.4
    expected: '20'
    tolerance: 0.5
    shown: ['$1.30^{11.4} \approx 20$']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: algae-week-11
    where: 'same: the curve passes 1000 m² between weeks 11 and 12 (50 × 1.3¹¹ = 896, 50 × 1.3¹² = 1165)'
    inputs: {}
    formula: 50 * 1.3**11
    expected: '896'
    shown: ['passes 1000 m² between weeks 11 and 12']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-log-0001
    where: 'quiz 2: log 0.001 = −3'
    inputs: {}
    formula: log10(0.001)
    expected: '-3'
    shown: ['$0.001 = 10^{-3}$, so the power of ten is $-3$']
    source: {cite: reading3, at: 'Sec. 2.8, useful summary table'}
    origin: page-own

  - id: quiz-log-100
    where: 'quiz 3: log 50 + log 2 = log 100 = 2'
    inputs: {}
    formula: log10(50) + log10(2)
    expected: '2'
    shown: ['$\\log(50 \\times 2) = \\log 100 = 2$']
    source: {cite: reading3, at: 'Sec. 2.8, Laws of logarithms (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-linear-500
    where: 'quiz 1: linear growth by 50% of the original each year gives 200 + 3 × 100 = 500'
    inputs: {}
    formula: 200 + 3 * 100
    expected: '500'
    shown: ['(linear growth) would give only 500']
    source: {cite: reading2, at: 'Sec. 1.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-log50
    where: 'quiz 5: log 50 ≈ 1.699 and log 3 ≈ 0.477'
    inputs: {}
    formula: log10(50)
    expected: '1.699'
    shown: ['\\approx 1.699/0.477']
    source: {cite: mit, at: 'Sec. 2.6, Logarithms using a calculator (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-log3
    where: 'same: log 3 ≈ 0.477'
    inputs: {}
    formula: log10(3)
    expected: '0.477'
    shown: ['1.699/0.477 \\approx 3.56']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-check
    where: 'quiz 5 check: 3^3.56 ≈ 50'
    inputs: {}
    formula: 3**3.56
    expected: '50'
    tolerance: 0.5
    shown: ['Check: $3^{3.56} \\approx 50$']
    source: {cite: mit, at: 'Sec. 2.6 (the numbers are the page''s own)'}
    origin: page-own
