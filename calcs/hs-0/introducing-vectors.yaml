# Calculations on content/year-0/hs-0/introducing-vectors.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10 Ch. 20 and Grade 11 Ch. 1. All numbers are the page's own.

page: content/year-0/hs-0/introducing-vectors.mdx
calcs:
  - id: same-line
    where: 'section "Adding vectors": +7 + (−3) = +4 N'
    inputs: {}
    formula: 7 + (-3)
    expected: '4'
    shown: ['$+7 + (-3) = +4$ N']
    source: {cite: reading3, at: 'Sec. 20.4, Vectors in a straight line (the numbers are the page''s own)'}
    origin: page-own

  - id: diagram-magnitude
    where: 'components diagram caption: Rx = 5.0, Ry = 2.5 give R ≈ 5.6'
    inputs: {}
    formula: sqrt(5.0**2 + 2.5**2)
    expected: '5.6'
    shown: ['so R ≈ 5.6 and θ ≈ 26.6°']
    source: {cite: mit, at: 'Sec. 1.3, Components of vectors (the numbers are the page''s own)'}
    origin: page-own

  - id: diagram-angle
    where: 'same: θ ≈ 26.6°'
    inputs: {}
    formula: atan(2.5 / 5.0) * 180 / pi
    expected: '26.6'
    shown: ['θ ≈ 26.6°."']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: leg1-x
    where: 'worked example "A sailing trip": 8.0 cos 20° = 7.52 km'
    inputs: {}
    formula: 8.0 * cos(20 * pi / 180)
    expected: '7.52'
    shown: ['$8.0\cos 20° = 7.52$ km']
    source: {cite: mit, at: 'Sec. 1.3, Vector addition using components (the numbers are the page''s own)'}
    origin: page-own

  - id: leg1-y
    where: 'same: 8.0 sin 20° = 2.74 km'
    inputs: {}
    formula: 8.0 * sin(20 * pi / 180)
    expected: '2.74'
    shown: ['$8.0\sin 20° = 2.74$ km']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: leg2-x
    where: 'same: 5.0 cos 150° = −4.33 km'
    inputs: {}
    formula: 5.0 * cos(150 * pi / 180)
    expected: '-4.33'
    shown: ['$5.0\cos 150° = -4.33$ km']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: leg2-y
    where: 'same: 5.0 sin 150° = 2.50 km'
    inputs: {}
    formula: 5.0 * sin(150 * pi / 180)
    expected: '2.50'
    shown: ['$5.0\sin 150° = 2.50$ km']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: sum-x
    where: 'same: Rx = 3.19 km'
    inputs: {}
    formula: 8.0 * cos(20 * pi / 180) + 5.0 * cos(150 * pi / 180)
    expected: '3.19'
    shown: ['$R_x = 7.52 + (-4.33) = 3.19$ km']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: sum-y
    where: 'same: Ry = 5.24 km'
    inputs: {}
    formula: 8.0 * sin(20 * pi / 180) + 5.0 * sin(150 * pi / 180)
    expected: '5.24'
    shown: ['$R_y = 2.74 + 2.50 = 5.24$ km']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: resultant
    where: 'same: R = 6.13 km'
    inputs: {}
    formula: sqrt(3.19**2 + 5.24**2)
    expected: '6.13'
    shown: ['$R = \sqrt{3.19^{2} + 5.24^{2}} = 6.13$ km']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: resultant-angle
    where: 'same: θ = 58.7°'
    inputs: {}
    formula: atan(5.24 / 3.19) * 180 / pi
    expected: '58.7'
    shown: ['$\theta = \tan^{-1}(5.24/3.19) = 58.7°$']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-component
    where: 'quiz 2: 10 cos 60° = 5.0 N, and 10 sin 60° ≈ 8.7 N'
    inputs: {}
    formula: 10 * cos(60 * pi / 180)
    expected: '5.0'
    shown: ['$F_x = F\\cos\\theta = 10 \\cos 60^\\circ = 10 \\times 0.5 = 5.0$ N']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-component-y
    where: 'same: 10 sin 60° ≈ 8.7 N'
    inputs: {}
    formula: 10 * sin(60 * pi / 180)
    expected: '8.7'
    shown: ['$10 \\sin 60^\\circ \\approx 8.7$ N']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-right-angle
    where: 'quiz 3: √(5.0² + 12²) = 13 N'
    inputs: {}
    formula: sqrt(5.0**2 + 12**2)
    expected: '13'
    shown: ['$\\sqrt{5.0^{2} + 12^{2}} = \\sqrt{169} = 13$ N']
    source: {cite: reading4, at: 'Sec. 1.2, Magnitude of the resultant of vectors at right angles (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-quadrant
    where: 'quiz 4: (−5.0, −2.0) points 180° + 21.8° ≈ 202° from the +x axis'
    inputs: {}
    formula: 180 + atan(2.0 / 5.0) * 180 / pi
    expected: '202'
    shown: ['$180° + 21.8° \\approx 202°$']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: sailing-rounded
    where: 'worked example, step "Magnitude and direction": about 6.1 km at 59° to two significant figures'
    inputs: {}
    formula: sqrt(3.19**2 + 5.24**2)
    expected: '6.1'
    shown: ['the boat ends about 6.1 km from its start, in a direction 59° from east']
    source: {cite: mit, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own
