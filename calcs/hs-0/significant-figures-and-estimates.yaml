page: content/year-0/hs-0/significant-figures-and-estimates.mdx
calcs:
  - id: round-2dp
    where: 'section "Rounding": 7.3486 to two decimal places is 7.35'
    inputs: {}
    formula: 7.3486
    expected: '7.35'
    shown: ['So 7.3486 rounded to two decimal places is 7.35']
    source: {cite: reading1, at: 'Sec. 1.4, Rounding off'}
    origin: page-own

  - id: round-1dp
    where: 'same: to one decimal place it is 7.3'
    inputs: {}
    formula: 7.3486
    expected: '7.3'
    shown: ['and to one decimal place it is 7.3']
    source: {cite: reading1, at: 'Sec. 1.4, Rounding off'}
    origin: page-own

  - id: round-nine
    where: 'same: 2.497 to two decimal places is 2.50'
    inputs: {}
    formula: 2.497
    expected: '2.50'
    shown: ['2.497 to two decimal places is 2.50']
    source: {cite: reading1, at: 'Sec. 1.4, Rounding off'}
    origin: page-own

  - id: round-late
    where: 'same: 2.46 × 3.46 = 8.5116'
    inputs: {}
    formula: 2.46 * 3.46
    expected: '8.5116'
    shown: ['$2.46 \times 3.46 = 8.5116$']
    source: {cite: mit, at: 'Sec. 1.2, Rounding off'}
    origin: page-own

  - id: round-early
    where: 'same: rounding first gives 2.5 × 3.5 = 8.75'
    inputs: {}
    formula: 2.5 * 3.5
    expected: '8.75'
    shown: ['$2.5 \times 3.5 = 8.75$']
    source: {cite: mit, at: 'Sec. 1.2, Rounding off'}
    origin: page-own

  - id: table-area
    where: 'worked example "A table top": 1.25 × 0.80 = 1.0 m²'
    inputs: {a: 1.25 m, b: 0.80 m}
    formula: a * b
    expected: 1.0 m**2
    shown: ['so the area is $1.0$ m²']
    source: {cite: mit, at: 'the page''s own rule and numbers (Siyavula states no significant-figure rules)'}
    origin: page-own

  - id: table-perimeter
    where: 'same: perimeter 4.10 m'
    inputs: {a: 1.25 m, b: 0.80 m}
    formula: 2 * (a + b)
    expected: 4.10 m
    shown: ['$1.25 + 0.80 + 1.25 + 0.80 = 4.10$ m']
    source: {cite: mit, at: 'the page''s own rule and numbers (Siyavula states no significant-figure rules)'}
    origin: page-own

  - id: sum-rule
    where: 'section "Calculating with measured numbers": 12.11 + 0.3 = 12.41, written 12.4 m'
    inputs: {}
    formula: 12.11 + 0.3
    expected: '12.41'
    shown: ['$12.11\ \text{m} + 0.3\ \text{m} = 12.41$ m']
    source: {cite: mit, at: 'the page''s own rule and numbers (Siyavula states no significant-figure rules)'}
    origin: page-own

  - id: heart-powers
    where: 'worked example "Heartbeats in a lifetime": powers give 10⁶'
    inputs: {}
    formula: 10**(1 + 1 + 1 + 2 + 1)
    expected: '1e6'
    shown: ['$10^{1+1+1+2+1} = 10^{6}$']
    source: {cite: reading2, at: 'notes p. 8'}
    origin: page-own

  - id: heart-front
    where: 'same: 7 × 6 × 2.4 × 3.65 × 8 ≈ 2900'
    inputs: {}
    formula: 7 * 6 * 2.4 * 3.65 * 8
    expected: '2900'
    tolerance: 50
    shown: ['$7 \times 6 \times 2.4 \times 3.65 \times 8 \approx 2900$']
    source: {cite: reading2, at: 'notes p. 8'}
    origin: page-own

  - id: heartbeats
    where: 'same: about 2.9 × 10⁹ beats'
    inputs: {}
    formula: 70 * 60 * 24 * 365 * 80
    expected: '2.9e9'
    shown: ['Together: about $2.9 \times 10^{9}$ beats']
    source: {cite: reading2, at: 'notes pp. 7–11'}
    origin: page-own

  - id: heartbeats-exact
    where: 'same, step "State it honestly": 2 943 360 000'
    inputs: {}
    formula: 70 * 60 * 24 * 365 * 80
    expected: '2943360000'
    shown: ['Writing 2 943 360 000 would claim']
    source: {cite: reading2, at: 'notes pp. 7–11'}
    origin: page-own

  - id: year-front
    where: 'section "Estimates": 3.6 × 2.4 × 3.65 ≈ 32; quiz 5'
    inputs: {}
    formula: 3.6 * 2.4 * 3.65
    expected: '32'
    shown: ['$3.6 \times 2.4 \times 3.65 \approx 32$, so about $3.2 \times 10^{7}$ s']
    source: {cite: reading2, at: 'notes p. 8'}
    origin: page-own

  - id: year-seconds
    where: 'same: a year is about 3.2 × 10⁷ s'
    inputs: {t: 365 day}
    formula: t
    expected: 3.2e7 s
    shown: ['so about $3.2 \times 10^{7}$ s']
    source: {cite: reading2, at: 'notes p. 8'}
    origin: page-own

  - id: year-pi
    where: 'same: a year is close to π × 10⁷ s'
    inputs: {t: 1 year, u: 1 s}
    formula: t / (pi * 1e7 * u)
    expected: '1.00'
    tolerance: 0.01
    shown: ['a year is close to $\pi \times 10^{7}$ seconds']
    source: {cite: reading2, at: 'front matter, table "Back-of-the-envelope numbers"'}
    origin: mit

  - id: quiz-sigfigs
    where: 'quiz 1: 0.004 070 has 4 significant figures'
    kind: fact
    value: 4
    shown: ['The digits 4, 0, 7 and the final 0 count']
    source: {cite: mit, at: 'the page''s own rule and numbers (Siyavula states no significant-figure rules)'}
    origin: page-own

  - id: quiz-round
    where: 'quiz 2: 0.067 49 to two significant figures is 0.067'
    inputs: {}
    formula: 0.06749
    expected: '0.067'
    shown: ['so the 7 stays: 0.067']
    source: {cite: reading1, at: 'Sec. 1.4, Rounding off'}
    origin: page-own

  - id: quiz-area
    where: 'quiz 3: 3.15 × 2.0 = 6.3 m²'
    inputs: {a: 3.15 m, b: 2.0 m}
    formula: a * b
    expected: 6.3 m**2
    shown: ['$3.15 \\times 2.0 = 6.3$']
    source: {cite: mit, at: 'the page''s own rule and numbers (Siyavula states no significant-figure rules)'}
    origin: page-own

  - id: quiz-sum
    where: 'quiz 4: 23.4 + 0.256 = 23.656, written 23.7 s'
    inputs: {}
    formula: 23.4 + 0.256
    expected: '23.656'
    shown: ['so $23.656$ becomes 23.7 s']
    source: {cite: mit, at: 'the page''s own rule and numbers (Siyavula states no significant-figure rules)'}
