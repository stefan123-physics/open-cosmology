  - id: quiz-year
    where: 'quiz 5: 32 × 10⁶ = 3.2 × 10⁷'
    inputs: {}
    formula: 32 * 10**6
    expected: '3.2e7'
    shown: ['$32 \\times 10^{6} = 3.2 \\times 10^{7}$']
    source: {cite: reading2, at: 'notes p. 8'}
    origin: page-own

  - id: cmb-fixsen
    kind: fact
    where: 'cosmology callout: T = 2.72548 K, uncertainty 0.00057 K (Fixsen 2009)'
    value: 2.72548
    shown: ['as 2.72548 K with an uncertainty of about 0.00057 K']
    source: {cite: fixsen, at: 'abstract'}
    origin: later-data

  - id: cmb-rounded
    where: 'same: rounded to 2.7 K'
    inputs: {T: 2.72548 K}
    formula: T
    expected: 2.7 K
    shown: ['cosmologists round it to 2.7 K']
    source: {cite: fixsen, at: 'abstract'}
    origin: page-own

  - id: cmb-five-figures
    where: 'cosmology callout: 2.72548 ± 0.00057 K written to the first uncertain digit is 2.7255 K'
    inputs: {T: 2.72548 K}
    formula: T
    expected: 2.7255 K
    shown: ['that is 2.7255 K: five significant figures']
    source: {cite: fixsen, at: 'abstract'}
    origin: page-own
