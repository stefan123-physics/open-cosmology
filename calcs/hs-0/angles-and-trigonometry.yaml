# Calculations on content/year-0/hs-0/angles-and-trigonometry.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Mathematics Grade 10 5.3, 5.6, 5.8, 6.6; Stitz–Zeager College Trigonometry 10.1. All numbers are the page's own.

page: content/year-0/hs-0/angles-and-trigonometry.mdx
calcs:
  - id: radian-degrees
    where: 'formula "Degrees and radians": 1 rad = 180°/π ≈ 57.3°; flashcard 1'
    inputs: {}
    formula: 180 / pi
    expected: '57.3'
    shown: ['1\ \text{rad} = \frac{180^{\circ}}{\pi} \approx 57.3^{\circ}']
    source: {cite: reading1, at: 'Sec. 10.1, Equation 10.1, p. 704'}
    origin: page-own

  - id: sixty-degrees
    where: 'section "Degrees and radians": 60° = π/3 rad'
    inputs: {}
    formula: 60 * pi / 180 - pi / 3
    expected: '0'
    tolerance: 1e-12
    shown: ['60° is $60 \times \pi/180 = \pi/3$ rad']
    source: {cite: reading1, at: 'Sec. 10.1, Equation 10.1, p. 704'}
    origin: page-own

  - id: wheel-arc
    where: 'same: a wheel of radius 0.30 m turning 2.0 rad rolls 0.60 m'
    inputs: {r: 0.30 m, theta: 2.0}
    formula: r * theta
    expected: 0.60 m
    shown: ['rolls $0.30 \times 2.0 = 0.60$ m']
    source: {cite: reading1, at: 'Sec. 10.1, s = r θ, p. 707 (the numbers are the page''s own)'}
    origin: page-own

  - id: calculator-trap
    where: 'calculator warning: sin 30 (radians) ≈ −0.99'
    inputs: {}
    formula: sin(30)
    expected: '-0.99'
    shown: ['but about $-0.99$ in radian mode']
    source: {cite: reading1, at: 'Sec. 10.1 defines radians; the sine value is the page''s own calculation'}
    origin: page-own

  - id: ramp-height
    where: 'worked example "A ramp": 4.0 sin 20° = 1.37 m'
    inputs: {}
    formula: 4.0 * sin(20 * pi / 180)
    expected: '1.37'
    shown: ['$4.0 \times \sin 20^{\circ} = 4.0 \times 0.342 = 1.37$ m']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-reach
    where: 'same: 4.0 cos 20° = 3.76 m'
    inputs: {}
    formula: 4.0 * cos(20 * pi / 180)
    expected: '3.76'
    shown: ['$4.0 \times \cos 20^{\circ} = 4.0 \times 0.940 = 3.76$ m']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-pythagoras
    where: 'same, check: 1.37² + 3.76² = 1.88 + 14.14 = 16.0'
    inputs: {}
    formula: 1.37**2 + 3.76**2
    expected: '16.0'
    shown: ['$1.37^{2} + 3.76^{2} = 1.88 + 14.14 = 16.0$']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: path-angle
    where: 'section "Sine, cosine and tangent": tan⁻¹(3.0/4.0) = 36.9°'
    inputs: {}
    formula: atan(3.0 / 4.0) * 180 / pi
    expected: '36.9'
    shown: ['$\theta = \tan^{-1}(3.0/4.0) = 36.9^{\circ}$']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: small-angle
    where: 'section "Small angles": sin 0.10 = 0.0998, less than half a percent from 0.10'
    inputs: {}
    formula: sin(0.10)
    expected: '0.0998'
    shown: ['$\sin 0.10 = 0.0998$']
    source: {cite: mit1801, at: 'Lecture 9 notes, sin x ≈ x (the numbers are the page''s own)'}
    origin: page-own

  - id: small-angle-degrees
    where: 'same: 0.10 rad is 5.7°'
    inputs: {}
    formula: 0.10 * 180 / pi
    expected: '5.7'
    shown: ['At 0.10 rad (5.7°)']
    source: {cite: reading1, at: 'Sec. 10.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: person-angle
    where: 'same: 1.8 m seen from 100 m fills 0.018 rad, about 1.0°'
    inputs: {}
    formula: (1.8 / 100) * 180 / pi
    expected: '1.0'
    shown: ['fills $1.8/100 = 0.018$ rad, about 1.0°']
    source: {cite: reading1, at: 'Sec. 10.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: galaxy-distance
    where: 'cosmology callout: 100 000 light-years at 0.001 rad is about 10⁸ light-years away'
    inputs: {}
    formula: 1e5 / 0.001
    expected: '1e8'
    shown: ['must be about $10^{8}$ light-years away']
    source: {cite: reading1, at: 'Sec. 10.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sine
    where: 'quiz 2: 5.0/13 ≈ 0.38'
    inputs: {}
    formula: 5.0 / 13
    expected: '0.38'
    shown: ['$5.0/13 \\approx 0.38$']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ladder
    where: 'quiz 3: 5.0 sin 70° ≈ 4.7 m'
    inputs: {}
    formula: 5.0 * sin(70 * pi / 180)
    expected: '4.7'
    shown: ['$5.0 \\sin 70^\\circ \\approx 4.7$ m']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-ladder-foot
    where: 'quiz 3: 5.0 cos 70° ≈ 1.7 m'
    inputs: {}
    formula: 5.0 * cos(70 * pi / 180)
    expected: '1.7'
    shown: ['$5.0\\cos 70^\\circ \\approx 1.7$ m']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-45
    where: 'quiz 4: sin 45° = cos 45° = 1/√2 ≈ 0.71'
    inputs: {}
    formula: 1 / sqrt(2)
    expected: '0.71'
    shown: ['both are $1/\\sqrt{2} \\approx 0.71$']
    source: {cite: reading2, at: 'Sec. 5.6, Special angles'}
    origin: page-own

  - id: quiz-small
    where: 'quiz 5: 2.0/400 = 0.005 rad, about 0.29°'
    inputs: {}
    formula: (2.0 / 400) * 180 / pi
    expected: '0.29'
    shown: ['= 2.0/400 = 0.005 rad (about 0.29°)']
    source: {cite: reading1, at: 'Sec. 10.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ramp-rounded
    where: 'worked example "A ramp": answers to two significant figures, 1.4 m and 3.8 m'
    inputs: {}
    formula: 4.0 * sin(20 * pi / 180)
    expected: '1.4'
    shown: ['so the answers are 1.4 m and 3.8 m']
    source: {cite: mit, at: 'Sec. 5.3 (the numbers are the page''s own)'}
    origin: page-own
