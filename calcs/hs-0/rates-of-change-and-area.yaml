# Calculations on content/year-0/hs-0/rates-of-change-and-area.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Mathematics Grade 11 5.2, Grade 12 6.1; Physical Sciences Grade 10 21.5–21.6. All numbers are the page's own.

page: content/year-0/hs-0/rates-of-change-and-area.mdx
calcs:
  - id: ball-x1
    where: 'worked example "A ball rolling down a ramp": x(1.0) = 0.80 m'
    inputs: {t: 1.0}
    formula: 0.80 * t**2
    expected: '0.80'
    shown: ['$x(1.0) = 0.80 \times 1.0^{2} = 0.80$ m']
    source: {cite: mit, at: 'Sec. 5.2, Average gradient (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-x3
    where: 'same: x(3.0) = 7.2 m'
    inputs: {t: 3.0}
    formula: 0.80 * t**2
    expected: '7.2'
    shown: ['$x(3.0) = 0.80 \times 3.0^{2} = 7.2$ m']
    source: {cite: mit, at: 'Sec. 5.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-average
    where: 'same: average velocity 6.4/2.0 = 3.2 m/s'
    inputs: {}
    formula: (0.80 * 3.0**2 - 0.80 * 1.0**2) / (3.0 - 1.0)
    expected: '3.2'
    shown: ['= \dfrac{6.4}{2.0} = 3.2$ m/s']
    source: {cite: mit, at: 'Sec. 5.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-h1
    where: 'table, gap 1.0 s: average velocity 4.0 m/s'
    inputs: {a: 2.0, h: 1.0}
    formula: (0.8 * (a + h)**2 - 0.8 * a**2) / h
    expected: '4.0'
    shown: ['| 1.0 | 7.2 | 4.0 |']
    source: {cite: reading1, at: 'Sec. 6.1, Gradient at a point (the numbers are the page''s own)'}
    origin: page-own

  - id: table-h01
    where: 'table, gap 0.1 s: x = 3.528 m, average 3.28 m/s'
    inputs: {a: 2.0, h: 0.1}
    formula: (0.8 * (a + h)**2 - 0.8 * a**2) / h
    expected: '3.28'
    shown: ['| 0.1 | 3.528 | 3.28 |']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-h001
    where: 'table, gap 0.01 s: x = 3.23208 m, average 3.208 m/s'
    inputs: {a: 2.0, h: 0.01}
    formula: (0.8 * (a + h)**2 - 0.8 * a**2) / h
    expected: '3.208'
    shown: ['| 0.01 | 3.23208 | 3.208 |']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-h0001
    where: 'table, gap 0.001 s: x = 3.2032008 m, average 3.2008 m/s'
    inputs: {a: 2.0, h: 0.001}
    formula: (0.8 * (a + h)**2 - 0.8 * a**2) / h
    expected: '3.2008'
    shown: ['| 0.001 | 3.2032008 | 3.2008 |']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-x0001
    where: 'table: x(2.001) = 3.2032008 m'
    inputs: {t: 2.001}
    formula: 0.8 * t**2
    expected: '3.2032008'
    shown: ['3.2032008']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: instant-velocity
    where: 'section "The rate at one instant": the limit is 3.2 m/s at t = 2.0 s (exactly 1.6 × 2.0)'
    inputs: {}
    formula: deriv('0.8*t**2', 't', 2.0)
    expected: '3.2'
    shown: ['The averages close in on **3.2 m/s**']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: velocity-at-3
    where: 'section "Area under a velocity–time graph": v = 1.6 t reaches 4.8 m/s at 3.0 s'
    inputs: {t: 3.0}
    formula: deriv('0.8*u**2', 'u', t)
    expected: '4.8'
    shown: ['In the first 3.0 s it rises from 0 to 4.8 m/s']
    source: {cite: reading2, at: 'Sec. 21.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: triangle-area
    where: 'same: ½ × 3.0 × 4.8 = 7.2 m, equal to x(3.0)'
    inputs: {}
    formula: 0.5 * 3.0 * 4.8
    expected: '7.2'
    shown: ['$\tfrac12 \times 3.0\ \text{s} \times 4.8\ \text{m/s} = 7.2$ m']
    source: {cite: reading2, at: 'Sec. 21.6, Motion at constant velocity: area under a velocity–time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: integral-check
    where: 'same: the area under v = 1.6 t from 0 to 3.0 s, computed as an integral, is 7.2 m'
    inputs: {}
    formula: integrate('1.6*t', 't', 0, 3.0)
    expected: '7.2'
    shown: ['exactly the position $x(3.0) = 7.2$ m found earlier']
    source: {cite: reading2, at: 'Sec. 21.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-average
    where: 'quiz 1: (34 − 10)/(6 − 2) = 6'
    inputs: {}
    formula: (34 - 10) / (6 - 2)
    expected: '6'
    shown: ['$(34 - 10)/(6 - 2) = 24/4 = 6$ per second']
    source: {cite: mit, at: 'Sec. 5.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-rectangle
    where: 'quiz 3: 5.0 × 8.0 = 40 m'
    inputs: {v: 5.0 m/s, t: 8.0 s}
    formula: v * t
    expected: 40 m
    shown: ['$5.0 \\times 8.0 = 40$ m']
    source: {cite: reading2, at: 'Sec. 21.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-triangle
    where: 'quiz 4: ½ × 10 × 20 = 100 m'
    inputs: {t: 10 s, v: 20 m/s}
    formula: 0.5 * t * v
    expected: 100 m
    shown: ['$\\tfrac12 \\times 10 \\times 20 = 100$ m']
    source: {cite: reading2, at: 'Sec. 21.6 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-x2
    where: 'section "The rate at one instant": x(2.0) = 3.2 m'
    inputs: {t: 2.0}
    formula: 0.8 * t**2
    expected: '3.2'
    shown: ['with $x(2.0) = 3.2$ m']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-x21
    where: 'table: x(2.1) = 3.528 m'
    inputs: {t: 2.1}
    formula: 0.8 * t**2
    expected: '3.528'
    shown: ['| 0.1 | 3.528 |']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-x201
    where: 'table: x(2.01) = 3.23208 m'
    inputs: {t: 2.01}
    formula: 0.8 * t**2
    expected: '3.23208'
    shown: ['| 0.01 | 3.23208 |']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-rise
    where: 'worked example: 7.2 − 0.80 = 6.4 m'
    inputs: {}
    formula: 7.2 - 0.80
    expected: '6.4'
    shown: ['= \dfrac{6.4}{2.0}']
    source: {cite: mit, at: 'Sec. 5.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: general-slope-check
    where: 'section "The rate at one instant": 1.6 t + 0.80 h at t = 2.0, h = 0.1 gives 3.28'
    inputs: {t: 2.0, h: 0.1}
    formula: 1.6 * t + 0.80 * h
    expected: '3.28'
    shown: ['it gives $3.2 + 0.08 = 3.28$ m/s']
    source: {cite: reading1, at: 'Sec. 6.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-displacement
    where: 'section "Below the axis": 12 − 6.0 = 6.0 m'
    inputs: {}
    formula: 3.0 * 4.0 - 2.0 * 3.0
    expected: '6.0'
    shown: ['ends $12 - 6.0 = 6.0$ m from its start']
    source: {cite: reading2, at: 'Sec. 21.6, Worked examples (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-distance
    where: 'same: 12 + 6.0 = 18 m'
    inputs: {}
    formula: 3.0 * 4.0 + 2.0 * 3.0
    expected: '18'
    shown: ['travelled $12 + 6.0 = 18$ m']
    source: {cite: reading2, at: 'Sec. 21.6, Worked examples (the numbers are the page''s own)'}
    origin: page-own
