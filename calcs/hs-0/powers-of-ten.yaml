# Calculations on content/year-0/hs-0/powers-of-ten.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Siyavula Physical Sciences Grade 10, 1.2 Mathematical skills (scientific notation), with the page's own numbers.

page: content/year-0/hs-0/powers-of-ten.mdx
calcs:
  - id: ten-to-six
    where: 'section "Powers of ten": 10⁶ = 1 000 000'
    inputs: {}
    formula: 10**6
    expected: '1000000'
    shown: ['$10^{6} = 1\,000\,000$']
    source: {cite: reading1, at: 'Sec. 2.2, list of exponent laws'}
    origin: page-own

  - id: ten-to-minus-three
    where: 'section "Powers of ten" and flashcard 2: 10⁻³ = 0.001'
    inputs: {}
    formula: 10**-3
    expected: '0.001'
    shown: ['- $10^{-3} = 0.001$']
    source: {cite: reading1, at: 'Sec. 2.2, list of exponent laws'}
    origin: page-own

  - id: law-example
    where: 'section "The rules for exponents": 10⁴ × 10⁻⁶ = 10⁻²'
    inputs: {}
    formula: 10**4 * 10**-6
    expected: '0.01'
    shown: ['$10^{4} \times 10^{-6} = 10^{4 + (-6)} = 10^{-2}$']
    source: {cite: reading1, at: 'Sec. 2.2, list of exponent laws'}
    origin: page-own

  - id: ex-large
    where: 'worked example "Converting both ways": 52 000 000 = 5.2 × 10⁷'
    inputs: {}
    formula: 5.2 * 10**7
    expected: '52000000'
    shown: ['$52\,000\,000 = 5.2 \times 10^{7}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: ex-small
    where: 'worked example "Converting both ways": 0.000 078 = 7.8 × 10⁻⁵'
    inputs: {}
    formula: 7.8 * 10**-5
    expected: '0.000078'
    shown: ['$0.000\,078 = 7.8 \times 10^{-5}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: ex-back
    where: 'worked example "Converting both ways": 9.1 × 10⁻³ = 0.0091'
    inputs: {}
    formula: 9.1 * 10**-3
    expected: '0.0091'
    shown: ['$9.1 \times 10^{-3} = 0.0091$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: product-example
    where: 'section "Multiplying and dividing": (3.0 × 10⁴)(5.0 × 10²) = 1.5 × 10⁷'
    inputs: {}
    formula: 3.0e4 * 5.0e2
    expected: '1.5e7'
    shown: ['= 15 \times 10^{6} = 1.5 \times 10^{7}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: sun-distance
    kind: fact
    where: 'worked example "How old is sunlight?": NASA gives 150 million km'
    value: 1.50e11
    shown: ['$1.50 \times 10^{11}$ m from Earth']
    source: {ref: nasa-sun}
    origin: later-data

  - id: light-speed-rounded
    where: 'worked example "How old is sunlight?": c = 299 792 458 m/s rounded to 3.00 × 10⁸ m/s'
    inputs: {}
    formula: c
    expected: 3.00e8 m/s
    shown: ['light travels at $3.00 \times 10^{8}$ m/s']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: mit

  - id: sunlight-time
    where: 'worked example "How old is sunlight?": t = 5.00 × 10² s'
    inputs: {d: 1.50e11 m, v: 3.00e8 m/s}
    formula: d / v
    expected: 500 s
    shown: ['= 5.00 \times 10^{2}$ s, which is 500 seconds']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: sunlight-minutes
    where: 'same: about 8.3 minutes'
    inputs: {d: 1.50e11 m, v: 3.00e8 m/s}
    formula: d / v
    expected: 8.3 min
    shown: ['about 8.3 minutes']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: sum-example
    where: 'section "Adding and subtracting": 4.2 × 10⁵ + 3.1 × 10⁴ = 4.51 × 10⁵'
    inputs: {}
    formula: 4.2e5 + 3.1e4
    expected: '4.51e5'
    shown: ['= 4.51 \times 10^{5}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: sum-small-term
    where: 'same section: 2.0 × 10² is 4 × 10⁻⁷ of 5.0 × 10⁸, less than a millionth'
    inputs: {}
    formula: 2.0e2 / 5.0e8
    expected: '4e-7'
    shown: ['the second number is less than a millionth of the first']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: school-day
    where: 'section "Orders of magnitude": 6 hours = 21 600 s = 2.16 × 10⁴ s'
    inputs: {h: 6 hour}
    formula: h
    expected: 21600 s
    shown: ['21 600 s, which is $2.16 \times 10^{4}$ s']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: atom-nucleus
    where: 'section "Orders of magnitude": stadium 10² m over pea 10⁻² m = 10⁴'
    inputs: {}
    formula: 10**2 / 10**-2
    expected: '1e4'
    shown: ['= 10^{2-(-2)} = 10^{4}$']
    source: {cite: reading3, at: 'Sec. 4.3, How small is the nucleus?'}
    origin: page-own

  - id: mega-milli-ratio
    where: 'section "Prefixes": M and m are a factor of 10⁹ apart'
    inputs: {}
    formula: 10**6 / 10**-3
    expected: '1e9'
    shown: ['a factor of $10^{9}$ apart']
    source: {cite: reading2, at: 'Sec. 1.3, Prefixes of base units'}
    origin: page-own

  - id: km-convert
    where: 'section "Prefixes": 32 km = 3.2 × 10⁴ m'
    inputs: {x: 32 km}
    formula: x
    expected: 3.2e4 m
    shown: ['$= 3.2 \times 10^{4}$ m']
    source: {cite: reading2, at: 'Sec. 1.3, Prefixes of base units'}
    origin: page-own

  - id: ms-convert
    where: 'section "Prefixes": 4.5 ms = 4.5 × 10⁻³ s'
    inputs: {x: 4.5 ms}
    formula: x
    expected: 4.5e-3 s
    shown: ['4.5 ms $= 4.5 \times 10^{-3}$ s']
    source: {cite: reading2, at: 'Sec. 1.3, Prefixes of base units'}
    origin: page-own

  - id: quiz-convert
    where: 'quiz 1: 0.000 36 = 3.6 × 10⁻⁴'
    inputs: {}
    formula: 3.6e-4
    expected: '0.00036'
    shown: ['$3.6 \\times 10^{-4}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: quiz-powers
    where: 'quiz 2: 10⁵ × 10⁻⁸ = 10⁻³'
    inputs: {}
    formula: 10**5 * 10**-8
    expected: '0.001'
    shown: ['$5 + (-8) = -3$']
    source: {cite: reading1, at: 'Sec. 2.2, list of exponent laws'}
    origin: page-own

  - id: quiz-product
    where: 'quiz 3: (4.0 × 10⁶)(5.0 × 10³) = 2.0 × 10¹⁰'
    inputs: {}
    formula: 4.0e6 * 5.0e3
    expected: '2.0e10'
    shown: ['the answer is $2.0 \\times 10^{10}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: quiz-sum
    where: 'quiz 4: 6.0 × 10⁴ + 3.0 × 10³ = 6.3 × 10⁴'
    inputs: {}
    formula: 6.0e4 + 3.0e3
    expected: '63000'
    shown: ['so the sum is $6.3 \\times 10^{4}$ (63 000)']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: quiz-micro
    where: 'quiz 5: 2.5 μm = 2.5 × 10⁻⁶ m'
    inputs: {x: 2.5 um}
    formula: x
    expected: 2.5e-6 m
    shown: ['2.5 μm $= 2.5 \\times 10^{-6}$ m']
    source: {cite: reading2, at: 'Sec. 1.3, Prefixes of base units'}
    origin: page-own

  - id: flatness
    kind: fact
    where: 'cosmology callout: about 18 decimal places, one part in 10¹⁸ (from the site''s 8.286 lesson "The flatness problem")'
    value: 1e-18
    shown: ['one part in $10^{18}$']
    source: {cite: guth21, at: 'p. 18'}
    origin: page-own

  - id: light-per-second
    where: 'introduction: sunlight travels about 300 000 000 metres in one second'
    inputs: {t: 1 s}
    formula: c * t
    expected: 3e8 m
    shown: ['about 300 000 000 metres in one second']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: dust-grain
    where: 'introduction: a dust grain perhaps 0.000 01 m (a hundredth of a millimetre) across'
    inputs: {x: 0.01 mm}
    formula: x
    expected: 0.00001 m
    shown: ['perhaps 0.000 01 metres across']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own

  - id: negative-example
    where: 'section "Scientific notation": −4 200 = −4.2 × 10³'
    inputs: {}
    formula: -4.2 * 10**3
    expected: '-4200'
    shown: ['$-4\,200 = -4.2 \times 10^{3}$']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation'}
    origin: page-own
