# Calculations on content/year-0/hs-0/towards-the-universe-scales.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: NASA fact pages (sizes and distances), NIST CODATA 2022 (proton, Bohr radius), MIT 8.286 Lecture 4 (Hubble's law).

page: content/year-0/hs-0/towards-the-universe-scales.mdx
calcs:
  - id: proton
    kind: fact
    where: 'table: proton rms charge radius 0.84 fm = 8.4 × 10⁻¹⁶ m (CODATA 2022: 8.4075 × 10⁻¹⁶ m)'
    value: 8.4e-16
    shown: ['$8.4 \times 10^{-16}$']
    source: {cite: nist-rp}
    origin: later-data

  - id: bohr
    kind: fact
    where: 'table: hydrogen atom radius about 0.053 nm, the Bohr radius 5.29 × 10⁻¹¹ m (CODATA 2022)'
    value: 5.3e-11
    shown: ['$5.3 \times 10^{-11}$']
    source: {cite: nist-a0}
    origin: later-data

  - id: earth-diameter
    kind: fact
    where: 'table: Earth equatorial diameter 12 756 km'
    value: 1.2756e7
    shown: ['| 12 756 km | $1.28 \times 10^{7}$ |']
    source: {cite: nasa-earth}
    origin: later-data

  - id: moon-distance
    kind: fact
    where: 'table: Earth to Moon 384 400 km'
    value: 3.844e8
    shown: ['| 384 400 km | $3.84 \times 10^{8}$ |']
    source: {cite: nasa-moon}
    origin: later-data

  - id: sun-diameter
    kind: fact
    where: 'table: Sun diameter about 1.4 million km'
    value: 1.4e9
    shown: ['| about 1.4 million km | $1.4 \times 10^{9}$ |']
    source: {cite: nasa-sun}
    origin: later-data

  - id: sun-distance
    kind: fact
    where: 'table: Earth to Sun about 150 million km'
    value: 1.50e11
    shown: ['| about 150 million km | $1.50 \times 10^{11}$ |']
    source: {cite: nasa-sun}
    origin: later-data

  - id: proxima
    where: 'table: Proxima Centauri 4.24 light-years = 4.01 × 10¹⁶ m (NASA Sun facts page gives 4.24 ly)'
    inputs: {d: 4.24 ly}
    formula: d
    expected: 4.01e16 m
    shown: ['| 4.24 light-years | $4.01 \times 10^{16}$ |']
    source: {cite: nasa-sun}
    origin: later-data

  - id: milky-way
    where: 'table: the Milky Way disk spans more than 100 000 light-years = 9.5 × 10²⁰ m'
    inputs: {d: 100000 ly}
    formula: d
    expected: 9.5e20 m
    shown: ['| more than 100 000 light-years | $9.5 \times 10^{20}$ |']
    source: {cite: nasa-galaxies}
    origin: later-data

  - id: andromeda
    where: 'table: Andromeda 2.5 million light-years = 2.4 × 10²² m'
    inputs: {d: 2.5e6 ly}
    formula: d
    expected: 2.4e22 m
    shown: ['| 2.5 million light-years | $2.4 \times 10^{22}$ |']
    source: {cite: nasa-m31}
    origin: later-data

  - id: hubble-distance
    where: 'table and section "The expanding universe": c/H for H = 70 km/s/Mpc is 1.3 × 10²⁶ m'
    inputs: {H: 70 km/s/Mpc}
    formula: c / H
    expected: 1.3e26 m
    shown: ['| about 14 billion light-years | $1.3 \times 10^{26}$ |', '$c/H \approx 1.3 \times 10^{26}$ m']
    source: {cite: guth4, at: 'slide 1 (Hubble''s law; the value of H is the site''s round example value)'}
    origin: page-own

  - id: hubble-distance-ly
    where: 'table: c/H is about 14 billion light-years'
    inputs: {H: 70 km/s/Mpc, u: 1e9 ly}
    formula: c / H / u
    expected: '14'
    shown: ['about 14 billion light-years']
    source: {cite: guth4, at: 'slide 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: span
    where: 'section "A ladder of sizes" and quiz 1: 10²⁶/10⁻¹⁵ = 10⁴¹'
    inputs: {}
    formula: 26 - (-15)
    expected: '41'
    shown: ['$10^{26}/10^{-15} = 10^{41}$: forty-one powers of ten']
    source: {cite: mit, at: 'the page''s own arithmetic (not in the NASA overview)'}
    origin: page-own

  - id: star-gap
    where: 'same: the nearest star is about 30 million Sun diameters away'
    inputs: {}
    formula: 4.01e16 / 1.4e9
    expected: '3e7'
    shown: ['about 30 million times that distance away']
    source: {cite: nasa-sun, at: 'the page''s own ratio'}
    origin: page-own

  - id: andromeda-widths
    where: 'same: Andromeda is about 25 Milky Way widths away'
    inputs: {}
    formula: 2.5e6 / 1e5
    expected: '25'
    shown: ['about 25 Milky Way widths from us']
    source: {cite: nasa-m31, at: 'the page''s own ratio'}
    origin: page-own

  - id: light-year
    where: 'section "The light-year": 9.46 × 10¹⁵ m'
    inputs: {d: 1 ly}
    formula: d
    expected: 9.46e15 m
    shown: ['$9.46 \times 10^{15}$ m (lesson 0.2)']
    source: {cite: mit, at: 'the page''s own unit conversion (not in the NASA overview)'}
    origin: page-own

  - id: moonlight
    where: 'same: moonlight takes about 1.3 s'
    inputs: {d: 3.84e8 m, v: 3.00e8 m/s}
    formula: d / v
    expected: 1.3 s
    shown: ['m/s ≈ 1.3 s ago']
    source: {cite: nasa-moon, at: 'the page''s own calculation'}
    origin: page-own

  - id: universe-age
    kind: fact
    where: 'same: NASA puts the age at around 13.8 billion years'
    value: 13.8
    shown: ['The universe is around 13.8 billion years old']
    source: {cite: mit}
    origin: later-data

  - id: model-earth
    where: 'worked example "The solar system on a football field": Earth 9.1 × 10⁻³ m'
    inputs: {}
    formula: 1.28e7 / 1.4e9
    expected: '9.1e-3'
    shown: ['= 9.1 \times 10^{-3}$ m, about 9 mm']
    source: {cite: nasa-earth, at: 'the page''s own scale model'}
    origin: page-own

  - id: model-sun-distance
    where: 'same: Earth–Sun becomes about 107 m'
    inputs: {}
    formula: 1.50e11 / 1.4e9
    expected: '107'
    shown: ['\approx 107$ m, about the length of a football field']
    source: {cite: nasa-sun, at: 'the page''s own scale model'}
    origin: page-own

  - id: model-proxima
    where: 'same: Proxima becomes 2.9 × 10⁷ m, about 29 000 km'
    inputs: {}
    formula: 4.01e16 / 1.4e9
    expected: '2.9e7'
    shown: ['= 2.9 \times 10^{7}$ m, about 29 000 km']
    source: {cite: nasa-sun, at: 'the page''s own scale model'}
    origin: page-own

  - id: earth-circumference
    where: 'same: the Earth''s circumference is about 40 000 km'
    inputs: {}
    formula: pi * 12756
    expected: '40000'
    tolerance: 200
    shown: ['whose circumference is about 40 000 km']
    source: {cite: nasa-earth, at: 'π × the equatorial diameter (the page''s own calculation)'}
    origin: page-own

  - id: model-ratio
    where: 'same, check: 4.01 × 10¹⁶ / 1.50 × 10¹¹ ≈ 2.7 × 10⁵'
    inputs: {}
    formula: 4.01e16 / 1.50e11
    expected: '2.7e5'
    shown: ['\approx 2.7 \times 10^{5}$ times farther away than the Sun']
    source: {cite: nasa-sun, at: 'the page''s own check'}
    origin: page-own

  - id: hubble-time-s
    where: 'section "The expanding universe": 1/H ≈ 4.4 × 10¹⁷ s'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 4.4e17 s
    shown: ['\approx 4.4 \times 10^{17}\ \text{s}']
    source: {cite: guth4, at: 'slide 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: hubble-time-yr
    where: 'same: about 14 billion years'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 14e9 year
    shown: ['\approx 4.4 \times 10^{17}\ \text{s} \approx 14$ billion years']
    source: {cite: guth4, at: 'slide 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-model
    where: 'quiz 3: 1.50 × 10¹¹ / 1.4 × 10⁹ ≈ 107 m'
    inputs: {}
    formula: 1.50e11 / 1.4e9
    expected: '107'
    shown: ['1.4 \\times 10^{9} \\approx 107$ m']
    source: {cite: nasa-sun, at: 'the page''s own scale model'}
    origin: page-own

  - id: person
    kind: fact
    where: 'table: a person about 1.7 m tall (the page''s own round example)'
    value: 1.7
    shown: ['| about 1.7 m | $1.7 \times 10^{0}$ |']
    source: {cite: mit, at: 'the page''s own example'}
    origin: page-own

  - id: sunlight
    where: 'section "The light-year": sunlight left about 500 s, 8.3 minutes, ago'
    inputs: {d: 1.50e11 m, v: 3.00e8 m/s}
    formula: d / v
    expected: 500 s
    shown: ['Sunlight left the Sun about 500 s, or 8.3 minutes, ago']
    source: {cite: nasa-sun, at: 'the page''s own calculation'}
    origin: page-own

  - id: megaparsec
    where: 'section "The expanding universe": a megaparsec is about 3.26 million light-years'
    inputs: {D: 1 Mpc, u: 1e6 ly}
    formula: D / u
    expected: '3.26'
    shown: ['a megaparsec is about 3.26 million light-years']
    source: {cite: mit, at: 'the page''s own unit conversion (not in the NASA overview)'}
    origin: page-own

  - id: three-quarters
    where: 'scale model: 29 000 km is almost three quarters (0.73) of 40 000 km'
    inputs: {}
    formula: 2.9e7 / 4.0e7
    expected: '0.73'
    tolerance: 0.01
    shown: ['That is almost three quarters of the way around the real Earth']
    source: {cite: nasa-earth, at: 'the page''s own scale model'}
    origin: page-own

  - id: model-ratio-2
    where: 'scale model check: 2.9 × 10⁷ / 107 ≈ 2.7 × 10⁵'
    inputs: {}
    formula: 2.9e7 / 107
    expected: '2.7e5'
    shown: ['and $2.9 \times 10^{7}/107 \approx 2.7 \times 10^{5}$ as well']
    source: {cite: nasa-sun, at: 'the page''s own check'}
    origin: page-own
