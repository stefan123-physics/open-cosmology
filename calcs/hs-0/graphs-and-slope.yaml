# Calculations on content/year-0/hs-0/graphs-and-slope.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Mathematics Grade 10 6.2 and 8.3, Physical Sciences Grade 10 1.3; all numbers are the page's own.

page: content/year-0/hs-0/graphs-and-slope.mdx
calcs:
  - id: line-slope
    where: 'worked example "The equation of a line through two points": m = 12/4 = 3'
    inputs: {}
    formula: (19 - 7) / (6 - 2)
    expected: '3'
    shown: ['= \dfrac{12}{4} = 3$']
    source: {cite: reading1, at: 'Sec. 8.3, Gradient of a line (the numbers are the page''s own)'}
    origin: page-own

  - id: line-intercept
    where: 'same: c = 7 − 6 = 1'
    inputs: {}
    formula: 7 - 3 * 2
    expected: '1'
    shown: ['so $c = 7 - 6 = 1$']
    source: {cite: mit, at: 'Sec. 6.2, Functions of the form y = mx + c (the numbers are the page''s own)'}
    origin: page-own

  - id: line-check
    where: 'same, check: 3 · 6 + 1 = 19'
    inputs: {}
    formula: 3 * 6 + 1
    expected: '19'
    shown: ['$3 \cdot 6 + 1 = 19$']
    source: {cite: mit, at: 'Sec. 6.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-speed
    where: 'worked example "A cyclist''s speed from a graph": 60 m / 10 s = 6.0 m/s'
    inputs: {rise: 60 m, run: 10 s}
    formula: rise / run
    expected: 6.0 m/s
    shown: ['Slope $= 60\ \text{m} / 10\ \text{s} = 6.0$ m/s']
    source: {cite: reading2, at: 'Sec. 1.3, Rate, proportion and ratios (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-halfway
    where: 'same: at 5.0 s, 20 + 6.0 × 5.0 = 50 m'
    inputs: {x0: 20 m, v: 6.0 m/s, t: 5.0 s}
    formula: x0 + v * t
    expected: 50 m
    shown: ['$20 + 6.0 \times 5.0 = 50$ m']
    source: {cite: reading2, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: water-litre
    where: 'section "Direct proportion": one litre of water at 1.0 × 10³ kg/m³ has a mass of 1.0 kg'
    inputs: {rho: 1.0e3 kg/m**3, V: 1 L}
    formula: rho * V
    expected: 1.0 kg
    shown: ['has a mass of 1.0 kg']
    source: {cite: reading2, at: 'Sec. 1.3, Rate, proportion and ratios (the numbers are the page''s own)'}
    origin: page-own

  - id: water-2-5
    where: 'same: 2.5 L of water has a mass of 2.5 kg'
    inputs: {rho: 1.0e3 kg/m**3, V: 2.5 L}
    formula: rho * V
    expected: 2.5 kg
    shown: ['so 2.5 L of water has a mass of 2.5 kg']
    source: {cite: reading2, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-slope
    where: 'quiz 1: (12 − 4)/(5 − 1) = 2'
    inputs: {}
    formula: (12 - 4) / (5 - 1)
    expected: '2'
    shown: ['$(12 - 4)/(5 - 1) = 8/4 = 2$']
    source: {cite: reading1, at: 'Sec. 8.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-speed
    where: 'quiz 3: 30 m / 6 s = 5 m/s'
    inputs: {rise: 30 m, run: 6 s}
    formula: rise / run
    expected: 5 m/s
    shown: ['Slope = rise/run = 30 m / 6 s = 5 m/s']
    source: {cite: reading2, at: 'Sec. 1.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: hubble-plot-top
    where: 'cosmology plot: at 400 Mpc, v = 70 × 400 = 28 000 km/s, inside the plotted range of 30 000 km/s'
    inputs: {H: 70 km/s/Mpc, d: 400 Mpc}
    formula: H * d
    expected: 28000 km/s
    shown: ['range={[0, 30000]}']
    source: {cite: mit, at: 'the page''s own example (the source has no Hubble law; H = 70 is the site''s round example value)'}
    origin: page-own
