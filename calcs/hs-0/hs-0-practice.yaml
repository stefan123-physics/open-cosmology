    origin: page-own

  - id: p4-a
    kind: identity
    answer: p4-a
    where: 'Problem 4(a): v = (x − x0)/t, checked against a numerical solution of x0 + V t = x for V'
    formula: (x - x0)/t
    equals: solve('x0 + V*t - x', 'V', -1000, 1000)
    samples:
      x: [60, 10, 100, 37]
      x0: [15, 0, 9, 2]
      t: [9, 1, 20, 3.5]
    tolerance: 1e-9
    shown: ['$v = (x - x_0)/t$']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-b
    answer: p4-b
    where: 'Problem 4(b): (60 − 15)/9.0 = 5.0 m/s'
    inputs: {x: 60 m, x0: 15 m, t: 9.0 s, u: 1 m/s}
    formula: (x - x0) / t / u
    expected: '5'
    shown: ['$v = (60 - 15)/9.0 = 45/9.0 = 5.0$ m/s']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

