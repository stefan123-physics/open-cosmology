# Calculations on content/year-0/hs-0/hs-0-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8). All problems and numbers are our own.

page: content/year-0/hs-0/hs-0-practice.mdx
calcs:
  - id: p1-n
    answer: p1-n
    where: 'Problem 1: 1.0 × 10⁻² m / 8.0 × 10⁻⁶ m = 1250 cells'
    inputs: {L: 1.0 cm, w: 8.0e-6 m}
    formula: L / w
    expected: '1250'
    shown: ['so about 1250 cells']
    source: {cite: mit, at: 'Sec. 1.2, Scientific notation (our own problem)'}
    origin: page-own

  - id: p2-a
    answer: p2-a
    where: 'Problem 2(a): 12 L in 40 s = 3.0 × 10⁻⁴ m³/s'
    inputs: {V: 12 L, t: 40 s, u: 1 m**3/s}
    formula: V / t / u
    expected: '0.0003'
    shown: ['$12 \times 10^{-3} / 40 = 3.0 \times 10^{-4}$ m³/s']
    source: {cite: reading1, at: 'Sec. 1.3, How to change units (our own problem)'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b): 18 L/min'
    inputs: {V: 12 L, t: 40 s, u: 1 L/min}
    formula: V / t / u
    expected: '18'
    shown: ['= 18$ L/min']
    source: {cite: reading1, at: 'Sec. 1.3, How to change units (our own problem)'}
    origin: page-own

  - id: p3-v
    answer: p3-v
    where: 'Problem 3: 2 × 365 × 80 = 58 400 litres'
    inputs: {}
    formula: 2 * 365 * 80
    expected: '58400'
    shown: ['$2 \times 365 \times 80 = 58\,400$ litres']
