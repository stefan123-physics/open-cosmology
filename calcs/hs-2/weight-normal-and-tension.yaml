  - id: atw-a
    where: 'worked example "Two masses over a pulley": a = (3.0 − 2.0) × 9.81/(3.0 + 2.0) ≈ 1.96 m/s²'
    inputs: {m1: 3.0 kg, m2: 2.0 kg, ga: 9.81 m/s**2}
    formula: (m1 - m2) * ga / (m1 + m2)
    expected: 1.96 m/s**2
    shown: ['$a = (3.0 - 2.0) \times 9.81/(3.0 + 2.0) \approx 1.96$ m/s²']
    source: {cite: reading2, at: 'Sec. 8.6, Example 8.9, Eqs. (8.6.52) to (8.6.54) (m g − T = m a for each hanging block, same tension on both sides of a light pulley); the two-mass result is derived on the page (the numbers are the page''s own)'}
    origin: page-own

  - id: atw-T
    where: 'same: T = 2.0 × (9.81 + 1.96) ≈ 23.5 N'
    inputs: {m1: 3.0 kg, m2: 2.0 kg, ga: 9.81 m/s**2}
    formula: m2 * (ga + (m1 - m2) * ga / (m1 + m2))
    expected: 23.5 N
    shown: ['$T = m_2(g + a) = 2.0 \times (9.81 + 1.96) \approx 23.5$ N']
    source: {cite: reading2, at: 'Sec. 8.6, Example 8.9, Eqs. (8.6.52) to (8.6.54) (m g − T = m a for each hanging block, same tension on both sides of a light pulley); the two-mass result is derived on the page (the numbers are the page''s own)'}
