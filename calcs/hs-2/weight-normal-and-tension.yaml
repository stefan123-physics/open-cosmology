# Calculations on content/year-0/hs-2/weight-normal-and-tension.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.3 Newton's laws (mit), 2.2 Force (reading1), 2.4 Forces between masses (reading3);
# MIT 8.01SC course notes Ch. 8 (reading2); NASA Moon Fact Sheet (moon); NASA, What Is Microgravity? (microgravity).
# All example numbers are the page's own (none of Siyavula's or MIT's example numbers are reused).
# Note: g is written ga in the inputs (g alone would be the gram).

page: content/year-0/hs-2/weight-normal-and-tension.mdx
calcs:
  - id: g-field
    kind: fact
    where: 'section "Weight and the field strength g": g = 9.81 N/kg (standard gravity 9.806 65 rounded, as in lesson 1.7)'
    value: 9.81 N/kg
    shown: ['Near the Earth''s surface $g = 9.81$ N/kg']
    source: {cite: reading2, at: 'Sec. 8.2.3 (standard value of g, rounded)'}
    origin: mit

  - id: g-moon
    kind: fact
    where: 'same section: 1.62 N/kg on the Moon'
    value: 1.62 m/s**2
    shown: ['On the Moon it is 1.62 N/kg']
    source: {cite: moon, at: 'Bulk parameters, surface gravity'}
    origin: later-data

  - id: suitcase-earth
    where: 'same: 12 kg weighs 12 × 9.81 ≈ 118 N'
    inputs: {m: 12 kg, ga: 9.81 N/kg}
    formula: m * ga
    expected: 118 N
    shown: ['$12 \times 9.81 \approx 118$ N']
    source: {cite: reading3, at: 'Sec. 2.4, Weight and mass (F_g = m g) (the numbers are the page''s own)'}
    origin: page-own

  - id: suitcase-moon
    where: 'same: 12 × 1.62 ≈ 19.4 N on the Moon'
    inputs: {m: 12 kg, gm: 1.62 N/kg}
    formula: m * gm
    expected: 19.4 N
    shown: ['$12 \times 1.62 \approx 19.4$ N']
    source: {cite: reading3, at: 'Sec. 2.4, Weight and mass (F_g = m g) (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-weight
    where: 'section "The normal force": 6.0 × 9.81 ≈ 58.9 N'
    inputs: {m: 6.0 kg, ga: 9.81 N/kg}
    formula: m * ga
    expected: 58.9 N
    shown: ['$6.0 \times 9.81 \approx 58.9$ N']
    source: {cite: reading2, at: 'Sec. 8.3.1, Example 8.2 (the normal force found from the second law with zero vertical acceleration) (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-push
    where: 'same: pushed down with 25 N, 58.9 + 25 = 83.9 N'
    inputs: {m: 6.0 kg, ga: 9.81 N/kg, p: 25 N}
    formula: m * ga + p
    expected: 83.9 N
    shown: ['$58.9 + 25 = 83.9$ N']
    source: {cite: reading2, at: 'Sec. 8.3.1, Example 8.2 (the normal force found from the second law with zero vertical acceleration) (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-pull
    where: 'same: pulled up with 25 N, 58.9 − 25 = 33.9 N'
    inputs: {m: 6.0 kg, ga: 9.81 N/kg, p: 25 N}
    formula: m * ga - p
    expected: 33.9 N
    shown: ['$58.9 - 25 = 33.9$ N']
    source: {cite: reading2, at: 'Sec. 8.3.1, Example 8.2 (the normal force found from the second law with zero vertical acceleration) (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-liftoff
    where: 'same: a pull of 58.9 N leaves nothing for the floor'
    inputs: {m: 6.0 kg, ga: 9.81 N/kg}
    formula: m * ga
    expected: 58.9 N
    shown: ['**Pull up with 58.9 N.**']
    source: {cite: reading2, at: 'Sec. 8.3.1, Example 8.2 (the normal force found from the second law with zero vertical acceleration) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-weight
    where: 'worked example "Pulling a suitcase on wheels": F_g = 15 × 9.81 ≈ 147 N'
    inputs: {m: 15 kg, ga: 9.81 N/kg}
    formula: m * ga
    expected: 147 N
    shown: ['$F_g = 15 \times 9.81 \approx 147$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: man pulling a box (components of a pull at an angle) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-vert
    where: 'same: 60 sin 30° = 30 N'
    inputs: {f: 60 N}
    formula: f * sin(30 * pi / 180)
    expected: 30 N
    shown: ['$60 \sin 30^\circ = 30$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: man pulling a box (components of a pull at an angle) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-hor
    where: 'same: 60 cos 30° ≈ 52.0 N'
    inputs: {f: 60 N}
    formula: f * cos(30 * pi / 180)
    expected: 52.0 N
    shown: ['$60 \cos 30^\circ \approx 52.0$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: man pulling a box (components of a pull at an angle) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-normal
    where: 'same: F_N = 147 − 30 ≈ 117 N'
    inputs: {m: 15 kg, ga: 9.81 N/kg, f: 60 N}
    formula: m * ga - f * sin(30 * pi / 180)
    expected: 117 N
    shown: ['so $F_N \approx 117$ N']
    source: {cite: reading2, at: 'Sec. 8.3.1, Example 8.2 (the normal force found from the second law with zero vertical acceleration) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-acc
    where: 'same: a = 52.0/15 ≈ 3.46 m/s²'
    inputs: {m: 15 kg, f: 60 N}
    formula: f * cos(30 * pi / 180) / m
    expected: 3.46 m/s**2
    shown: ['$a = F_{\text{net}}/m = 52.0/15 \approx 3.46$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: man pulling a box (components of a pull at an angle) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-liftoff
    where: 'same, check: 147/sin 30° ≈ 294 N would lift it off'
    inputs: {m: 15 kg, ga: 9.81 N/kg}
    formula: m * ga / sin(30 * pi / 180)
    expected: 294 N
    shown: ['$147/\sin 30^\circ \approx 294$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: man pulling a box (components of a pull at an angle) (the numbers are the page''s own)'}
    origin: page-own

  - id: sc-diagram
    where: 'vector diagram caption: weight 147 N down, normal force 117 N up'
    inputs: {m: 15 kg, ga: 9.81 N/kg, f: 60 N}
    formula: m * ga - f * sin(30 * pi / 180)
    expected: 117 N
    shown: ['weight 147 N down, normal force 117 N up']
    source: {cite: reading2, at: 'Sec. 8.3.1, Example 8.2 (the normal force found from the second law with zero vertical acceleration) (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-steady
    where: 'worked example "Scales in a lift": 55 × 9.81 ≈ 540 N'
    inputs: {m: 55 kg, ga: 9.81 N/kg}
    formula: m * ga
    expected: 540 N
    shown: ['$F_N = m g = 55 \times 9.81 \approx 540$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets and Apparent weight (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-up
    where: 'same: 55 × (9.81 + 1.8) ≈ 639 N'
    inputs: {m: 55 kg, ga: 9.81 m/s**2, a: 1.8 m/s**2}
    formula: m * (ga + a)
    expected: 639 N
    shown: ['$F_N = 55 \times (9.81 + 1.8) \approx 639$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets and Apparent weight (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-up-kg
    where: 'same: reading 65.1 kg'
    inputs: {m: 55 kg, ga: 9.81 m/s**2, a: 1.8 m/s**2}
    formula: m * (ga + a) / ga
    expected: 65.1 kg
    shown: ['the scales show about 65.1 kg']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets and Apparent weight (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-down
    where: 'same: 55 × (9.81 − 1.8) ≈ 441 N'
    inputs: {m: 55 kg, ga: 9.81 m/s**2, a: 1.8 m/s**2}
    formula: m * (ga - a)
    expected: 441 N
    shown: ['$F_N = 55 \times (9.81 - 1.8) \approx 441$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets and Apparent weight (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-down-exact
    where: 'same: unrounded 440.55 N'
