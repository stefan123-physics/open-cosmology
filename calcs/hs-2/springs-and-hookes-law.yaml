# Calculations on content/year-0/hs-2/springs-and-hookes-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Chapter 8 (mit), Sec. 8.1.1 Hooke's law and Sec. 8.2.3 weight;
# Chapter 23 (reading1) for the oscillation preview. MIT's Sec. 8.1.1 has no worked numbers, so all
# numbers are the page's own; g = 9.81 m/s² as in lessons 1.7 and 2.1 (written ga: g alone is the gram).

page: content/year-0/hs-2/springs-and-hookes-law.mdx
calcs:
  - id: toy-extension
    where: 'worked example "A spring in a toy": x = 15.5 − 12.0 = 3.5 cm'
    inputs: {len: 15.5 cm, len0: 12.0 cm}
    formula: len - len0
    expected: 3.5 cm
    shown: ['$x = L - L_0 = 15.5 - 12.0 = 3.5$ cm', 'one and a half times 3.5 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Figure 8.1 (extension measured from the equilibrium length) (the numbers are the page''s own)'}
    origin: page-own

  - id: toy-k
    where: 'same: k = 7.0 N / 0.035 m = 200 N/m'
    inputs: {f: 7.0 N, x: 0.035 m}
    formula: f / x
    expected: 200 N/m
    shown: ['$k = F/x = 7.0/0.035 = 200$ N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: toy-per-cm
    where: 'same: 200 N/m is 2.0 N per centimetre'
    inputs: {k: 200 N/m, x: 1 cm}
    formula: k * x
    expected: 2.0 N
    shown: ['every centimetre of stretch needs 2.0 N']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: toy-5cm
    where: 'same: F = 200 N/m × 0.050 m = 10 N (also the marked point of the first graph)'
    inputs: {k: 200 N/m, x: 0.050 m}
    formula: k * x
    expected: 10 N
    shown: ['$F = kx = 200 \times 0.050 = 10$ N']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: soft-quarter
    where: 'first graph caption: the soft spring (50 N/m) needs a quarter of 10 N at 5.0 cm'
    inputs: {k: 50 N/m, x: 0.050 m, f: 10 N}
    formula: k * x / f
    expected: '0.25'
    shown: ['the soft spring (k = 50 N/m) only a quarter of that']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: fit-line
    where: 'graph "measured points": the best-fit line through the origin has slope 0.25 N/cm (least squares through the origin: Σ F x / Σ x²)'
    inputs: {x1: 2.1 cm, x2: 3.9 cm, x3: 6.2 cm, x4: 7.9 cm, x5: 10.1 cm, f1: 0.50 N, f2: 1.00 N, f3: 1.50 N, f4: 2.00 N, f5: 2.50 N}
    formula: (f1*x1 + f2*x2 + f3*x3 + f4*x4 + f5*x5) / (x1**2 + x2**2 + x3**2 + x4**2 + x5**2)
    expected: 0.25 N/cm
    shown: ['line of best fit F = (0.25 N/cm) × x']
    source: {cite: mit, at: 'Sec. 8.1.1, Figure 8.3 (k as the slope of the force–stretch graph) (the numbers are the page''s own)'}
    origin: page-own

  - id: fit-slope
    where: 'worked example "The slope of the best-fit line": 2.50 N / 10.0 cm = 0.250 N/cm'
    inputs: {f: 2.50 N, x: 10.0 cm}
    formula: f / x
    expected: 0.250 N/cm
    shown: ['$k = \dfrac{2.50 - 0}{10.0 - 0} = 0.250$ N/cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Figure 8.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: fit-slope-si
    where: 'same: 0.250 N/cm = 25.0 N/m'
    inputs: {k: 0.250 N/cm}
    formula: k
    expected: 25.0 N/m
    shown: ['so this is $0.250/0.01 = 25.0$ N/m', 'One centimetre is 0.01 m', 'The answer is about 25 N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1), k in N·m⁻¹ (the numbers are the page''s own)'}
    origin: page-own

  - id: single-point
    where: 'same, check: 2.00 N / 0.079 m = 25.3 N/m'
    inputs: {f: 2.00 N, x: 0.079 m}
    formula: f / x
    expected: 25.3 N/m
    shown: ['$2.00\ \text{N} / 0.079\ \text{m} = 25.3$ N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: balance-max
    where: 'section "The spring balance": 400 N/m × 0.10 m = 40 N'
    inputs: {k: 400 N/m, x: 0.10 m}
    formula: k * x
    expected: 40 N
    shown: ['$F = kx = 400 \times 0.10 = 40$ N']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: balance-step
    where: 'same: 1 N on a 400 N/m spring moves the pointer 2.5 mm'
    inputs: {f: 1 N, k: 400 N/m}
    formula: f / k
    expected: 2.5 mm
    shown: ['$1/400$ m $= 2.5$ mm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-weight
    where: 'worked example "A bird feeder on a spring": weight 0.25 × 9.81 = 2.45 N'
    inputs: {m: 0.25 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 2.45 N
    shown: ['The weight is $mg = 0.25 \times 9.81 = 2.45$ N', 'so $kx = 2.45$ N', 'its weight (2.45 N)', 'x: 0, y: -2.45', 'x: 0, y: 2.45']
    source: {cite: mit, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-x
    where: 'same: x = mg/k = 2.45/40 = 0.061 m'
    inputs: {m: 0.25 kg, ga: 9.81 m/s**2, k: 40 N/m}
    formula: m * ga / k
    expected: 0.061 m
    shown: ['$x = mg/k = 2.45/40 = 0.061$ m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) with the weight of Sec. 8.2.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-bird
    where: 'same: with the bird, x = 0.30 × 9.81/40 = 0.074 m'
    inputs: {m: 0.30 kg, ga: 9.81 m/s**2, k: 40 N/m}
    formula: m * ga / k
    expected: 0.074 m
    shown: ['$x = 0.30 \times 9.81/40 = 0.074$ m', 'about 7.4 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) with the weight of Sec. 8.2.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-diff
    where: 'same: the bird adds 1.2 cm of stretch'
    inputs: {mb: 0.050 kg, ga: 9.81 m/s**2, k: 40 N/m}
    formula: mb * ga / k
    expected: 1.2 cm
    shown: ['$0.050 \times 9.81/40 = 0.012$ m', 'pulls the feeder 1.2 cm further down']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-rounded-diff
    where: 'same: the rounded stretches differ by 7.4 − 6.1 = 1.3 cm'
    inputs: {x1: 6.1 cm, x2: 7.4 cm}
    formula: x2 - x1
    expected: 1.3 cm
    shown: ['from 7.4 cm gives 1.3 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-unrounded
    where: 'same: the unrounded stretches 6.13 and 7.36 cm differ by 1.2 cm'
    inputs: {m1: 0.25 kg, m2: 0.30 kg, ga: 9.81 m/s**2, k: 40 N/m}
    formula: m2 * ga / k - m1 * ga / k
    expected: 1.2 cm
    shown: ['6.13 and 7.36 cm, differ by 1.2 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-x-unrounded
    where: 'same: unrounded stretch without the bird, 6.13 cm'
    inputs: {m: 0.25 kg, ga: 9.81 m/s**2, k: 40 N/m}
    formula: m * ga / k
    expected: 6.13 cm
    shown: ['stretches, 6.13 and']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-bird-unrounded
    where: 'same: unrounded stretch with the bird, 7.36 cm'
    inputs: {m: 0.30 kg, ga: 9.81 m/s**2, k: 40 N/m}
    formula: m * ga / k
    expected: 7.36 cm
    shown: ['and 7.36 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: feeder-fifth
    where: 'same, check: a fifth of 6.1 cm is 1.2 cm'
    inputs: {x: 6.1 cm}
    formula: x / 5
    expected: 1.2 cm
    shown: ['a fifth of 6.1 cm is 1.2 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: parallel-k
    where: 'section "Springs in series and in parallel": k = 60 + 30 = 90 N/m'
    inputs: {k1: 60 N/m, k2: 30 N/m}
    formula: k1 + k2
    expected: 90 N/m
    shown: ['$k = k_1 + k_2 = 90$ N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) applied to each spring (the numbers are the page''s own)'}
    origin: page-own

  - id: parallel-x
    where: 'same: 3.0 N / 90 N/m = 0.033 m'
    inputs: {f: 3.0 N, k: 90 N/m}
    formula: f / k
    expected: 0.033 m
    shown: ['Under 3.0 N it stretches $3.0/90 = 0.033$ m', 'about 3.3 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: series-x
    where: 'same: in series the stretches add, 3.0/60 + 3.0/30 = 0.15 m'
    inputs: {f: 3.0 N, k1: 60 N/m, k2: 30 N/m}
    formula: f / k1 + f / k2
    expected: 0.15 m
    shown: ['$3.0/60 + 3.0/30 = 0.050 + 0.10 = 0.15$ m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) applied to each spring (the numbers are the page''s own)'}
    origin: page-own

  - id: series-k
    where: 'same: k = 3.0/0.15 = 20 N/m, equal to 1/(1/60 + 1/30)'
    inputs: {k1: 60 N/m, k2: 30 N/m}
    formula: 1 / (1 / k1 + 1 / k2)
    expected: 20 N/m
    shown: ['$k = 3.0/0.15 = 20$ N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) applied to each spring (the numbers are the page''s own)'}
    origin: page-own

  - id: release-force
    where: 'section "A first look at oscillations": F = 200 × 0.040 = 8.0 N'
    inputs: {k: 200 N/m, x: 0.040 m}
    formula: k * x
    expected: 8.0 N
    shown: ['$F = kx = 200 \times 0.040 = 8.0$ N']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: release-a
    where: 'same: a = 8.0/0.50 = 16 m/s²'
    inputs: {k: 200 N/m, x: 0.040 m, m: 0.50 kg}
    formula: k * x / m
    expected: 16 m/s**2
    shown: ['$a = F/m = 8.0/0.50 = 16$ m/s²']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-k
    where: 'quiz 1: k = 3.0 N / 0.060 m = 50 N/m'
    inputs: {f: 3.0 N, len: 26 cm, len0: 20 cm}
    formula: f / (len - len0)
    expected: 50 N/m
    shown: ['$k = F/x = 3.0/0.060 = 50$ N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-whole-length
    where: 'quiz 1, wrong choice: dividing by the whole length, 3.0/0.26 = 11.5 N/m'
    inputs: {f: 3.0 N, len: 0.26 m}
    formula: f / len
    expected: 11.5 N/m
    shown: ['(0.26 m) gives 11.5 N/m', '"11.5 N/m"']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-cm
    where: 'quiz 1, wrong choice: centimetres not converted, 3.0/6 = 0.50'
    inputs: {}
    formula: 3.0 / 6
    expected: '0.50'
    shown: ['centimetres into metres gives 0.50 N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-inverted
    where: 'quiz 1, wrong choice: x/F = 0.060/3.0 = 0.020'
    inputs: {}
    formula: 0.060 / 3.0
    expected: '0.020'
    shown: ['"0.020 N/m"']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz3-ratio
    where: 'quiz 3: 5.0 N is 2.5 times 2.0 N'
    inputs: {}
    formula: 5.0 / 2.0
    expected: '2.5'
    shown: ['$5.0/2.0 = 2.5$ times larger']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz3-x
    where: 'quiz 3: 2.5 × 4.0 cm = 10 cm'
    inputs: {x: 4.0 cm, f1: 2.0 N, f2: 5.0 N}
    formula: x * f2 / f1
    expected: 10 cm
    shown: ['$2.5 \\times 4.0 = 10$ cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz4-x
    where: 'quiz 4: x = 0.60 × 9.81/120 = 0.049 m'
    inputs: {m: 0.60 kg, ga: 9.81 m/s**2, k: 120 N/m}
    formula: m * ga / k
    expected: 0.049 m
    shown: ['$x = mg/k = 0.60 \\times 9.81/120 = 0.049$ m', 'about 4.9 cm (not 49 cm', '"4.9 cm"']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) with the weight of Sec. 8.2.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz4-no-g
    where: 'quiz 4, wrong choice: 0.60/120 = 0.0050 m = 0.50 cm'
    inputs: {}
    formula: 0.60 / 120 * 100
    expected: '0.50'
    shown: ['Forgetting $g$ gives 0.50 cm']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-series
    where: 'quiz 5: two 80 N/m springs in series give 40 N/m'
    inputs: {k: 80 N/m}
    formula: 1 / (1 / k + 1 / k)
    expected: 40 N/m
    shown: ['the spring constant is halved, 40 N/m']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) applied to each spring (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-parallel
    where: 'quiz 5: in parallel they would give 160 N/m'
    inputs: {k: 80 N/m}
    formula: k + k
    expected: 160 N/m
    shown: ['would share the load and give 160 N/m', '"160 N/m"']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) applied to each spring (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-ext
    where: 'quiz 1: 26 − 20 = 6 cm = 0.060 m'
    inputs: {len: 26 cm, len0: 20 cm}
    formula: len - len0
    expected: 0.060 m
    shown: ['$26 - 20 = 6$ cm $= 0.060$ m']
    source: {cite: mit, at: 'Sec. 8.1.1, Figure 8.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz4-slips
    where: 'quiz 4, wrong choices: 0.049 m misread as 49 cm (factor 10) or 4.9 m (factor 100)'
    inputs: {x: 0.049 m}
    formula: x * 100
    expected: 4.9 m
    shown: ['"4.9 m"', '"49 cm"', 'or 4.9 m: watch the unit']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-product
    where: 'quiz 5, wrong choice: 80 × 80 = 6400 (meaningless product)'
    inputs: {}
    formula: 80 * 80
    expected: '6400'
    shown: ['Multiplying the two constants (6400)', '"6400 N/m"']
    source: {cite: mit, at: 'Sec. 8.1.1, Eq. (8.1.1) (the numbers are the page''s own)'}
    origin: page-own
