# Calculations on content/year-0/hs-2/centripetal-force.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 9 (mit): Sec. 9.1 (Eqs. 9.1.2-9.1.4), Sec. 9.2 (Eq. 9.2.1), Example 9.6
# (Eqs. 9.3.19-9.3.21); Ch. 6 (reading1) Sec. 6.1; segment 11.2 transcript (reading3, banked turn, p. 3);
# Siyavula Gr 11 2.3 (reading4); NASA Earth Fact Sheet (earthfact).
# All example numbers are the page's own. MIT's Ch. 9 examples are symbolic or about the Moon and geosynchronous
# orbits (3.82e8 m, 4.22e7 m), and the site's 8.01 lesson uses a 0.80 m bucket; none of those are reused.
# g is written ga in the inputs (g alone is the gram).

page: content/year-0/hs-2/centripetal-force.mdx
calcs:
  # --- Quiz ---
  - id: quiz-string-tension
    where: 'quiz 2: T = m v²/r = 0.40 × 4.0²/0.80 = 8.0 N'
    inputs: {m: 0.40 kg, v: 4.0 m/s, r: 0.80 m}
    formula: m * v**2 / r
    expected: 8.0 N
    shown: ['$T = m v^2/r = 0.40 \\times 4.0^2/0.80 = 8.0$ N']
    quiz: 1
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-string-no-square
    where: 'quiz 2, distractor: m v/r = 0.40 × 4.0/0.80 = 2.0 (speed not squared)'
    inputs: {}
    formula: 0.40 * 4.0 / 0.80
    expected: '2.0'
    shown: ['Forgetting to square the speed gives 2.0 N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-string-times-r
    where: 'quiz 2, distractor: m v² r = 0.40 × 16 × 0.80 ≈ 5.1'
    inputs: {}
    formula: 0.40 * 4.0**2 * 0.80
    expected: '5.1'
    shown: ['multiplying by $r$ instead of dividing gives 5.1 N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-string-no-mass
    where: 'quiz 2, distractor: v²/r = 16/0.80 = 20 (mass left out)'
    inputs: {}
    formula: 4.0**2 / 0.80
    expected: '20'
    shown: ['leaving out the mass gives 20 (with the wrong unit)']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bend-four-r
    where: 'quiz 4: four times the radius gives √4 = 2 times the top speed'
    inputs: {}
    formula: sqrt(4)
    expected: '2'
    shown: ['$\\sqrt{4} = 2$, so twice as large']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-loop-min
    where: 'quiz 5: v = √(g r) = √(9.81 × 10) ≈ 9.9 m/s'
    inputs: {ga: 9.81 m/s**2, r: 10 m}
    formula: sqrt(ga * r)
    expected: 9.9 m/s
    shown: ['$v = \\sqrt{g r} = \\sqrt{9.81 \\times 10} \\approx 9.9$ m/s']
    quiz: 4
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) with F_N = 0 at the top (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-loop-no-g
    where: 'quiz 5, distractor: √10 ≈ 3.2 (g left out)'
    inputs: {}
    formula: sqrt(10)
    expected: '3.2'
    shown: ['Leaving out $g$ gives 3.2 m/s']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-loop-no-root
    where: 'quiz 5, distractor: g r = 98 (square root forgotten)'
    inputs: {}
    formula: 9.81 * 10
    expected: '98'
    shown: ['forgetting the square root gives 98']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-loop-2gr
    where: 'quiz 5, distractor: √(2 g r) ≈ 14 m/s'
    inputs: {ga: 9.81 m/s**2, r: 10 m}
    formula: sqrt(2 * ga * r)
    expected: 14 m/s
    shown: ['14 m/s is $\\sqrt{2 g r}$']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  # --- History ---
  - id: newton-1666
    kind: fact
    where: 'section "Newton''s second law on a circle": Newton and the Moon around 1666'
    value: '1666'
    shown: ['Newton reached this idea around 1666']
    source: {cite: reading1, at: 'Sec. 6.1 (In 1666, twenty years before the Principia, Newton realised the Moon is always falling)'}
    origin: mit

  # --- Worked example: a ball on a string ---
  - id: ball-tension
    where: 'worked example "A ball on a string": T = 0.25 × 3.0²/0.50 = 4.5 N'
    inputs: {m: 0.25 kg, v: 3.0 m/s, r: 0.50 m}
    formula: m * v**2 / r
    expected: 4.5 N
    shown: ['$T = \dfrac{0.25 \times 3.0^2}{0.50} = 4.5$ N']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.3 (tension in a whirled string supplies the inward force; the numbers are the page''s own)'}
    origin: page-own

  - id: ball-vmax
    where: 'same: v = √(20 × 0.50/0.25) = √40 ≈ 6.3 m/s'
    inputs: {F: 20 N, m: 0.25 kg, r: 0.50 m}
    formula: sqrt(F * r / m)
    expected: 6.3 m/s
    shown: ['$v = \sqrt{20 \times 0.50/0.25} = \sqrt{40} \approx 6.3$ m/s']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-omega
    where: 'same, check: ω = v/r = 3.0/0.50 = 6.0 rad/s'
    inputs: {v: 3.0 m/s, r: 0.50 m}
    formula: v / r
    expected: 6.0 1/s
    shown: ['$\omega = v/r = 3.0/0.50 = 6.0$ rad/s']
    source: {cite: reading1, at: 'Sec. 6.2.1, Eq. (6.2.15), v = rω (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-tension-omega
    where: 'same, check: m ω² r = 0.25 × 6.0² × 0.50 = 4.5 N'
    inputs: {m: 0.25 kg, w: 6.0 1/s, r: 0.50 m}
    formula: m * w**2 * r
    expected: 4.5 N
    shown: ['$m\omega^2 r = 0.25 \times 6.0^2 \times 0.50 = 4.5$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-double-speed
    where: 'same, check: doubling the speed needs four times the tension, 4 × 4.5 = 18 N, just below 20 N'
    inputs: {m: 0.25 kg, v: 6.0 m/s, r: 0.50 m}
    formula: m * v**2 / r
    expected: 18 N
    shown: ['would need four times the tension, 18 N, just below the limit']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example: how fast can a car take a bend? ---
  - id: bend-dry-square
    where: 'worked example "How fast can a car take a bend?": μ_s g r = 0.9 × 9.81 × 50 ≈ 441 m²/s²'
    inputs: {mu: 0.9, ga: 9.81 m/s**2, r: 50 m}
    formula: mu * ga * r
    expected: 441 m**2/s**2
    shown: ['$v_{\text{max}} = \sqrt{0.9 \times 9.81 \times 50} = \sqrt{441} \approx 21.0$ m/s']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eqs. (9.3.20) and (9.3.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: bend-dry
    where: 'same: v_max = √441 ≈ 21.0 m/s (also the point on the graph)'
    inputs: {mu: 0.9, ga: 9.81 m/s**2, r: 50 m}
    formula: sqrt(mu * ga * r)
    expected: 21.0 m/s
    shown: ['$v_{\text{max}} = \sqrt{0.9 \times 9.81 \times 50} = \sqrt{441} \approx 21.0$ m/s', 'points={[{ x: 50, y: 21.0, label: "bend" }]}']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: bend-dry-kmh
    where: 'same: 21.0 m/s is about 76 km/h'
    inputs: {v: 21.0 m/s}
    formula: v
    expected: 76 km/hour
    shown: ['about 76 km/h']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6 (the km/h conversion of lesson 1.2 and the numbers are the page''s own)'}
    origin: page-own

  - id: bend-wet
    where: 'same: v_max = √(0.5 × 9.81 × 50) = √245 ≈ 15.7 m/s'
    inputs: {mu: 0.5, ga: 9.81 m/s**2, r: 50 m}
    formula: sqrt(mu * ga * r)
    expected: 15.7 m/s
    shown: ['$v_{\text{max}} = \sqrt{0.5 \times 9.81 \times 50} = \sqrt{245} \approx 15.7$ m/s']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: bend-wet-square
    where: 'same: 0.5 × 9.81 × 50 ≈ 245 m²/s²'
    inputs: {mu: 0.5, ga: 9.81 m/s**2, r: 50 m}
    formula: mu * ga * r
    expected: 245 m**2/s**2
    shown: ['$v_{\text{max}} = \sqrt{0.5 \times 9.81 \times 50} = \sqrt{245} \approx 15.7$ m/s']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.20) (the numbers are the page''s own)'}
    origin: page-own

  - id: bend-wet-kmh
    where: 'same: 15.7 m/s is about 56 km/h'
    inputs: {mu: 0.5, ga: 9.81 m/s**2, r: 50 m}
    formula: sqrt(mu * ga * r)
    expected: 56 km/hour
    shown: ['about 56 km/h']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6 (the km/h conversion of lesson 1.2 and the numbers are the page''s own)'}
    origin: page-own

  - id: bend-force-needed
    where: 'same, check: 1000 × 21.0²/50 ≈ 8.8 × 10³ N needed'
    inputs: {m: 1000 kg, v: 21.0 m/s, r: 50 m}
    formula: m * v**2 / r
    expected: 8.8e3 N
    shown: ['$1000 \times 21.0^2/50 \approx 8.8 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: bend-friction-max
    where: 'same, check: 0.9 × 1000 × 9.81 ≈ 8.8 × 10³ N available'
    inputs: {mu: 0.9, m: 1000 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 8.8e3 N
    shown: ['$0.9 \times 1000 \times 9.81 \approx 8.8 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.19) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-dry-100
    where: 'graph: the dry curve √(0.9 × 9.81 × r) reaches about 29.7 m/s at r = 100 m, inside the range 0 to 35'
    inputs: {mu: 0.9, ga: 9.81 m/s**2, r: 100 m}
    formula: sqrt(mu * ga * r)
    expected: 29.7 m/s
    shown: ['{ expr: "sqrt(0.9 * 9.81 * r)", label: "dry" }']
    source: {cite: mit, at: 'Sec. 9.3, Example 9.6, Eq. (9.3.21) (the numbers are the page''s own)'}
    origin: page-own

  # --- Banked bend ---
  - id: banked-speed
    where: 'section "A car on a flat bend", banked bends: √(50 × 9.81 × tan 15°) ≈ 11.5 m/s'
    inputs: {r: 50 m, ga: 9.81 m/s**2, th: 15}
    formula: sqrt(r * ga * tan(th * pi / 180))
    expected: 11.5 m/s
    shown: ['$\sqrt{50 \times 9.81 \times \tan 15^\circ} \approx 11.5$ m/s']
    source: {cite: reading3, at: 'transcript p. 3, v = √(rg tan φ) (the numbers are the page''s own)'}
    origin: page-own

  - id: banked-kmh
    where: 'same: 11.5 m/s is about 41 km/h'
    inputs: {v: 11.5 m/s}
    formula: v
    expected: 41 km/hour
    shown: ['about 41 km/h']
    source: {cite: reading3, at: 'transcript p. 3 (the km/h conversion of lesson 1.2 and the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example: a roller-coaster loop ---
  - id: loop-min
    where: 'worked example "A roller-coaster loop": v = √(9.81 × 8.0) ≈ 8.9 m/s'
    inputs: {ga: 9.81 m/s**2, r: 8.0 m}
    formula: sqrt(ga * r)
    expected: 8.9 m/s
    shown: ['$v = \sqrt{g r} = \sqrt{9.81 \times 8.0} \approx 8.9$ m/s', 'more than the least speed of 8.9 m/s']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) with F_N = 0 at the top (the numbers are the page''s own)'}
    origin: page-own

  - id: loop-min-kmh
    where: 'same: 8.9 m/s is about 32 km/h'
    inputs: {ga: 9.81 m/s**2, r: 8.0 m}
    formula: sqrt(ga * r)
    expected: 32 km/hour
    shown: ['about 32 km/h']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the km/h conversion of lesson 1.2 and the numbers are the page''s own)'}
    origin: page-own

  - id: loop-needed
    where: 'same: m v²/r = 60 × 12²/8.0 = 1080 N'
    inputs: {m: 60 kg, v: 12 m/s, r: 8.0 m}
    formula: m * v**2 / r
    expected: 1080 N
    shown: ['$m v^2/r = 60 \times 12^2/8.0 = 1080$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: loop-weight
    where: 'same: m g = 60 × 9.81 ≈ 589 N'
    inputs: {m: 60 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 589 N
    shown: ['$m g = 60 \times 9.81 \approx 589$ N']
    source: {cite: reading4, at: 'Newton''s second law of motion (weight as a force in the second law; the numbers are the page''s own)'}
    origin: page-own

  - id: loop-seat
    where: 'same: F_N = 1080 − 589 ≈ 491 N'
    inputs: {m: 60 kg, v: 12 m/s, r: 8.0 m, ga: 9.81 m/s**2}
    formula: m * v**2 / r - m * ga
    expected: 491 N
    shown: ['$F_N = 1080 - 589 \approx 491$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2), applied at the top of a vertical circle (the numbers are the page''s own)'}
    origin: page-own

  - id: loop-seat-check
    where: 'same, check: F_N = m(v²/r − g) = 60 × (18 − 9.81) ≈ 491 N'
    inputs: {m: 60 kg, v: 12 m/s, r: 8.0 m, ga: 9.81 m/s**2}
    formula: m * (v**2 / r - ga)
    expected: 491 N
    shown: ['$F_N = m(v^2/r - g) = 60 \times (18 - 9.81) \approx 491$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: loop-v2-over-r
    where: 'same, check: v²/r = 12²/8.0 = 18 m/s²'
    inputs: {v: 12 m/s, r: 8.0 m}
    formula: v**2 / r
    expected: 18 m/s**2
    shown: ['$F_N = m(v^2/r - g) = 60 \times (18 - 9.81) \approx 491$ N']
    source: {cite: reading1, at: 'Sec. 6.4, Eq. (6.4.7) (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example: a swing and a hump ---
  - id: swing-needed
    where: 'worked example "A swing and a hump": m v²/r = 30 × 4.0²/2.5 = 192 N'
    inputs: {m: 30 kg, v: 4.0 m/s, r: 2.5 m}
    formula: m * v**2 / r
    expected: 192 N
    shown: ['$m v^2/r = 30 \times 4.0^2/2.5 = 192$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2), applied at the bottom of a vertical circle (the numbers are the page''s own)'}
    origin: page-own

  - id: swing-weight
    where: 'same: weight 30 × 9.81 ≈ 294 N'
    inputs: {m: 30 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 294 N
    shown: ['her weight: $30 \times 9.81 \approx 294$ N']
    source: {cite: reading4, at: 'Newton''s second law of motion (weight as a force in the second law; the numbers are the page''s own)'}
    origin: page-own

  - id: swing-seat
    where: 'same: F_N = m g + m v²/r = 294 + 192 ≈ 486 N'
    inputs: {m: 30 kg, v: 4.0 m/s, r: 2.5 m, ga: 9.81 m/s**2}
    formula: m * ga + m * v**2 / r
    expected: 486 N
    shown: ['$F_N = 294 + 192 \approx 486$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2), applied at the bottom of a vertical circle (the numbers are the page''s own)'}
    origin: page-own

  - id: swing-ratio
    where: 'same, check: 486/294 ≈ 1.65 times her weight'
    inputs: {v: 4.0 m/s, r: 2.5 m, ga: 9.81 m/s**2}
    formula: 1 + v**2 / (r * ga)
    expected: '1.65'
    shown: ['$486/294 \approx 1.65$']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: hump-limit
    where: 'same: the car leaves the road above v = √(9.81 × 40) ≈ 19.8 m/s'
    inputs: {ga: 9.81 m/s**2, r: 40 m}
    formula: sqrt(ga * r)
    expected: 19.8 m/s
    shown: ['$v = \sqrt{9.81 \times 40} \approx 19.8$ m/s']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) with F_N = 0 at the crest of a hump (the setting and numbers are the page''s own)'}
    origin: page-own

  - id: hump-limit-kmh
    where: 'same: 19.8 m/s is about 71 km/h'
    inputs: {ga: 9.81 m/s**2, r: 40 m}
    formula: sqrt(ga * r)
    expected: 71 km/hour
    shown: ['about 71 km/h']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the km/h conversion of lesson 1.2 and the numbers are the page''s own)'}
    origin: page-own

  - id: hump-normal
    where: 'same, check: F_N = 1200 × (9.81 − 15²/40) ≈ 5.0 × 10³ N'
    inputs: {m: 1200 kg, v: 15 m/s, r: 40 m, ga: 9.81 m/s**2}
    formula: m * (ga - v**2 / r)
    expected: 5.0e3 N
    shown: ['$F_N = 1200 \times (9.81 - 15^2/40) \approx 5.0 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2), applied at the crest of a hump (the numbers are the page''s own)'}
    origin: page-own

  - id: hump-fraction
    where: 'same, check: pressing less than half as hard as on a flat road (5022/11772 ≈ 0.43)'
    inputs: {v: 15 m/s, r: 40 m, ga: 9.81 m/s**2}
    formula: 1 - v**2 / (r * ga)
    expected: '0.43'
    shown: ['pressing less than half as hard as on a flat road']
    source: {cite: mit, at: 'Sec. 9.1, Eq. (9.1.2) (the numbers are the page''s own)'}
    origin: page-own

  # --- Satellites ---
  - id: earth-radius
    kind: fact
    where: 'worked example "An orbit skimming the Earth": the Earth''s mean radius 6371 km'
    value: 6371 km
    shown: ['The Earth''s mean radius is 6371 km (NASA, Earth Fact Sheet)']
    source: {cite: earthfact, at: 'Bulk parameters, volumetric mean radius 6371.000 km'}
    origin: later-data

  - id: orbit-speed
    where: 'same: v = √(9.81 × 6.371 × 10⁶) ≈ 7.91 × 10³ m/s, nearly 8 km/s (summary: 7.9 km/s)'
    inputs: {ga: 9.81 m/s**2, r: 6.371e6 m}
    formula: sqrt(ga * r)
    expected: 7.91e3 m/s
    shown: ['$r = 6.371 \times 10^{6}$ m, so $v = \sqrt{g r} = \sqrt{9.81 \times 6.371 \times 10^{6}} \approx 7.91 \times 10^{3}$ m/s, nearly 8 km/s', '$\sqrt{g r} \approx 7.9$ km/s']
    source: {cite: mit, at: 'Sec. 9.2, Eq. (9.2.1) and the text after it (gravity supplies the inward force; the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-time
    where: 'same: 2π × 6.371 × 10⁶/7.91 × 10³ ≈ 5.06 × 10³ s'
    inputs: {ga: 9.81 m/s**2, r: 6.371e6 m}
    formula: 2 * pi * r / sqrt(ga * r)
    expected: 5.06e3 s
    shown: ['$2\pi \times 6.371 \times 10^{6}/7.91 \times 10^{3} \approx 5.06 \times 10^{3}$ s']
    source: {cite: reading1, at: 'Sec. 6.4, Eq. (6.4.3) (one turn = circumference / speed; the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-minutes
    where: 'same: 5.06 × 10³ s is about 84 minutes'
    inputs: {ga: 9.81 m/s**2, r: 6.371e6 m}
    formula: 2 * pi * r / sqrt(ga * r)
    expected: 84 minute
    shown: ['about 84 minutes']
    source: {cite: reading1, at: 'Sec. 6.4, Eq. (6.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: orbit-accel-check
    where: 'same, check: v²/r = (7.91 × 10³)²/6.371 × 10⁶ ≈ 9.8 m/s²'
    inputs: {v: 7.91e3 m/s, r: 6.371e6 m}
    formula: v**2 / r
    expected: 9.8 m/s**2
    shown: ['$v^2/r = (7.91 \times 10^{3})^2/6.371 \times 10^{6} \approx 9.8$ m/s²']
    source: {cite: reading1, at: 'Sec. 6.4, Eq. (6.4.7) (the numbers are the page''s own)'}
    origin: page-own
