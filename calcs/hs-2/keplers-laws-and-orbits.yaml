# Calculations on content/year-0/hs-2/keplers-laws-and-orbits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 25 Celestial Mechanics (mit): Sec. 25.1 (the three laws), 25.4.1 (Eq. 25.4.15),
# 25.6.2-25.6.3 (Eqs. numbered 25.5.2-25.5.14), Example 25.1 (Eq. 25.6.2), App. 25B (25.B.7-8), 25C (25.C.5);
# Ch. 9 (reading1): Sec. 9.2.2 (Eq. 9.2.7), Example 9.1 (geosynchronous orbit, Eqs. 9.3.4-9.3.7);
# MacTutor biographies of Kepler and Brahe; NASA fact sheets (Earth, Mars, Jupiter); NASA ISS pages; NIST (G).
# Example numbers are the page's own. The geostationary radius (4.22e7 m) is quoted from MIT's Example 9.1, not
# recomputed as a worked example; the page's own worked example is an orbit that stays above one point of Mars.
# MIT's own numbers (Moon 3.82e8 m, 27.2 days; S0-2 965.8 au, 15.2 yr) are not reused.

page: content/year-0/hs-2/keplers-laws-and-orbits.mdx
calcs:
  # --- Quiz ---
  - id: quiz-asteroid-period
    where: 'quiz 2: T² = a³ = 4.0³ = 64, T = 8.0 years'
    inputs: {a_au: 4.0}
    formula: sqrt(a_au**3)
    expected: '8.0'
    shown: ['$T^2 = 4.0^3 = 64$, so $T = \\sqrt{64} = 8.0$ years']
    source: {cite: mit, at: 'Sec. 25.1, law III (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-asteroid-a-squared
    where: 'quiz 2, distractor: T = a² = 16'
    inputs: {}
    formula: 4.0**2
    expected: '16'
    shown: ['$T = a^2$ gives 16']
    source: {cite: mit, at: 'Sec. 25.1, law III (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-asteroid-no-root
    where: 'quiz 2, distractor: T² = 64 taken as T'
    inputs: {}
    formula: 4.0**3
    expected: '64'
    shown: ['forgetting the square root gives 64']
    source: {cite: mit, at: 'Sec. 25.1, law III (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-ratio
    where: 'quiz 3: v_p/v_a = r_a/r_p = 5.0/1.0 = 5'
    inputs: {}
    formula: 5.0 / 1.0
    expected: '5'
    shown: ['$v_p/v_a = r_a/r_p = 5.0/1.0 = 5$']
    source: {cite: mit, at: 'Sec. 25.7, Example 25.1, Eq. (25.6.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-root
    where: 'quiz 3, distractor: √5 ≈ 2.2'
    inputs: {}
    formula: sqrt(5)
    expected: '2.2'
    shown: ['The square root of 5, about 2.2']
    source: {cite: mit, at: 'Sec. 25.7, Example 25.1, Eq. (25.6.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-comet-square
    where: 'quiz 3, distractor: 5² = 25'
    inputs: {}
    formula: 5**2
    expected: '25'
    shown: ['its square, 25, come']
    source: {cite: mit, at: 'Sec. 25.7, Example 25.1, Eq. (25.6.2) (the wrong step and numbers are the page''s own)'}
    origin: page-own

  - id: quiz-four-radius-speed
    where: 'quiz 5: four times the radius gives 1/√4 = 1/2 of the speed'
    inputs: {}
    formula: 1 / sqrt(4)
    expected: '0.5'
    shown: ['$1/\\sqrt{4} = 1/2$ of the speed']
    source: {cite: mit, at: 'Sec. 25.4.1, Eq. (25.4.15) solved for v (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-four-radius-period
    where: 'quiz 5: T ∝ r^1.5, so √(4³) = 8 times as long'
    inputs: {}
    formula: sqrt(4**3)
    expected: '8'
    shown: ['$\\sqrt{4^3} = 8$ times as long']
    source: {cite: reading1, at: 'Sec. 9.2.2, Eq. (9.2.7) (the numbers are the page''s own)'}
    origin: page-own

