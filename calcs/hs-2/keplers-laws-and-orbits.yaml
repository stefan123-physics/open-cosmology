  # --- First law ---
  - id: ecc-earth
    kind: fact
    where: 'section "The first law": Earth eccentricity 0.0167'
    value: '0.0167'
    shown: ['The Earth''s eccentricity is 0.0167']
    source: {cite: earthfact, at: 'Orbital parameters, orbit eccentricity 0.0167'}
    origin: later-data

  - id: ecc-mars
    kind: fact
    where: 'same: Mars eccentricity 0.0935'
    value: '0.0935'
    shown: ['that of Mars 0.0935 (NASA']
    source: {cite: marsfact, at: 'Orbital parameters, orbit eccentricity 0.0935'}
    origin: later-data

  - id: mars-a
    kind: fact
    where: 'worked example "How far is Mars from the Sun?": a = 227.956 × 10⁶ km, e = 0.0935'
    value: 227.956e6 km
    shown: ['$227.956 \times 10^{6}$ km and an eccentricity of 0.0935']
    source: {cite: marsfact, at: 'Orbital parameters, semimajor axis 227.956 × 10⁶ km'}
    origin: later-data

  - id: mars-rp
    where: 'same: r_p = a(1 − e) ≈ 206.6 × 10⁶ km'
    inputs: {a_m: 227.956e6 km, ecc: 0.0935}
    formula: a_m * (1 - ecc)
    expected: 206.6e6 km
    shown: ['$r_p = a(1 - e) = 227.956 \times 10^{6} \times (1 - 0.0935) \approx 206.6 \times 10^{6}$ km']
    source: {cite: mit, at: 'Appendix 25B.2, Eq. (25.B.7)'}
    origin: page-own

  - id: mars-ra
    where: 'same: r_a = a(1 + e) ≈ 249.3 × 10⁶ km'
    inputs: {a_m: 227.956e6 km, ecc: 0.0935}
    formula: a_m * (1 + ecc)
    expected: 249.3e6 km
    shown: ['$r_a = a(1 + e) = 227.956 \times 10^{6} \times 1.0935 \approx 249.3 \times 10^{6}$ km']
    source: {cite: mit, at: 'Appendix 25B.2, Eq. (25.B.8)'}
    origin: page-own

  - id: mars-ratio
    where: 'same: r_a/r_p = 249.3/206.6 ≈ 1.21, about 21% further'
    inputs: {}
    formula: 249.3 / 206.6
    expected: '1.21'
    shown: ['$r_a/r_p = 249.3/206.6 \approx 1.21$: Mars is about 21% further']
    source: {cite: mit, at: 'Appendix 25B.2, Eqs. (25.B.7) and (25.B.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: mars-sum
    where: 'same, check: r_p + r_a = 455.9 × 10⁶ km = 2a'
    inputs: {}
    formula: 206.6 + 249.3
    expected: '455.9'
    shown: ['add up to $455.9 \times 10^{6}$ km']
    source: {cite: mit, at: 'Appendix 25B.2, Eq. (25.B.2) (2a = r_a + r_p)'}
    origin: page-own

  - id: mars-ratio-from-e
    where: 'same, check: (1 + e)/(1 − e) = 1.0935/0.9065 ≈ 1.21'
    inputs: {}
    formula: 1.0935 / 0.9065
    expected: '1.21'
    shown: ['$(1 + e)/(1 - e) = 1.0935/0.9065 \approx 1.21$']
    source: {cite: mit, at: 'Appendix 25B.2, Eqs. (25.B.7) and (25.B.8) (the numbers are the page''s own)'}
    origin: page-own

