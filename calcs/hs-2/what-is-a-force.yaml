# Calculations on content/year-0/hs-2/what-is-a-force.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.2 Force; MIT 8.01SC Course Notes Chapters 7 and 8.
# All numbers are the page's own except g (MIT 8.01SC Ch. 8, Sec. 8.2.3, rounded as in lesson 1.7).

page: content/year-0/hs-2/what-is-a-force.mdx
calcs:
  - id: g
    where: 'section "Weight": g = 9.81 m/s² (9.81 N/kg), the standard value 9.80665 m/s² rounded'
    inputs: {g0: 9.80665 m/s**2}
    formula: g0
    expected: 9.81 m/s**2
    shown: ['$g = 9.81$ m/s² if air resistance can be neglected']
    source: {cite: reading2, at: 'Sec. 8.2.3 (standard value of g)'}
    origin: mit

  - id: apple
    where: 'section "Weight": a 0.10 kg apple weighs 0.981 N, about 1 N'
    inputs: {m: 0.10 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 0.981 N
    shown: ['$F_g = 0.10 \times 9.81 = 0.981$ N, about 1 N']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: bottle
    where: 'section "The newton": a 1.5 kg bottle of water needs about 15 N'
    inputs: {m: 1.5 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 15 N
    shown: ['with a mass of 1.5 kg, takes about 15 N']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: potatoes
    where: 'section "Weight": 2.5 kg of potatoes weighs 24.5 N'
    inputs: {m: 2.5 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 24.5 N
    shown: ['$2.5 \times 9.81 = 24.5$ N']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: potatoes-rounded
    where: 'same: about 25 N to two significant figures'
    inputs: {m: 2.5 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 25 N
    shown: ['N, about 25 N.']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: sugar
    where: 'worked example "Reading a spring balance": 0.40 kg weighs 3.92 N'
    inputs: {m: 0.40 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 3.92 N
    shown: ['$F_g = m g = 0.40 \times 9.81 = 3.92$ N']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: sugar-rounded
    where: 'same: the balance reads about 3.9 N'
    inputs: {m: 0.40 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 3.9 N
    shown: ['The balance shows the size of that pull: about 3.9 N.']
    source: {cite: reading2, at: 'Sec. 8.1.1 and 8.2.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: half-kilogram
    where: 'same, check: half a kilogram weighs about 4.9 N'
    inputs: {m: 0.5 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 4.9 N
    shown: ['half a kilogram weighs about 4.9 N']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: book
    where: 'section "Free-body diagrams": a 1.2 kg book weighs 11.8 N'
    inputs: {m: 1.2 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 11.8 N
    shown: ['$1.2 \times 9.81 = 11.8$ N downwards']
    source: {cite: mit, at: '2.2, Force diagrams (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-weight
    where: 'same: a 25.0 kg crate weighs 245 N'
    inputs: {m: 25.0 kg, g: 9.81 N/kg}
    formula: m * g
    expected: 245 N
    shown: ['$25.0 \times 9.81 = 245$ N down']
    source: {cite: mit, at: '2.2, Force diagrams (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-vertical
    where: 'section "The resultant force": vertically +245 + (−245) = 0'
    inputs: {}
    formula: 245 + (-245)
    expected: '0'
    shown: ['$+245 + (-245) = 0$']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-horizontal
    where: 'same: horizontally +120 + (−80) = +40 N'
    inputs: {}
    formula: 120 + (-80)
    expected: '40'
    shown: ['$+120 + (-80) = +40$ N']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: tug
    where: 'worked example "A tug of war": +760 + (−820) = −60 N'
    inputs: {}
    formula: 760 + (-820)
    expected: '-60'
    shown: ['$F_\text{net} = +760 + (-820) = -60$ N']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: tug-check
    where: 'same, check: 820 − 760 = 60 N'
    inputs: {}
    formula: 820 - 760
    expected: '60'
    shown: ['$820 - 760 = 60$ N']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-1x
    where: 'worked example "A sledge pulled by two ropes": 150 cos 25° = 136 N'
    inputs: {}
    formula: 150 * cos(25 * pi / 180)
    expected: '136'
    shown: ['$150\cos 25° = 136$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-1y
    where: 'same: 150 sin 25° = 63.4 N'
    inputs: {}
    formula: 150 * sin(25 * pi / 180)
    expected: '63.4'
    shown: ['$150\sin 25° = 63.4$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-2x
    where: 'same: 120 cos 40° = 91.9 N'
    inputs: {}
    formula: 120 * cos(40 * pi / 180)
    expected: '91.9'
    shown: ['$120\cos 40° = 91.9$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-2y
    where: 'same: −120 sin 40° = −77.1 N'
    inputs: {}
    formula: -120 * sin(40 * pi / 180)
    expected: '-77.1'
    shown: ['$-120\sin 40° = -77.1$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-netx
    where: 'same: F_net,x = 136 + 91.9 = 228 N'
    inputs: {}
    formula: 150 * cos(25 * pi / 180) + 120 * cos(40 * pi / 180)
    expected: '228'
    shown: ['$F_{\text{net},x} = 136 + 91.9 = 228$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-nety
    where: 'same: F_net,y = 63.4 + (−77.1) = −13.7 N'
    inputs: {}
    formula: 150 * sin(25 * pi / 180) - 120 * sin(40 * pi / 180)
    expected: '-13.7'
    shown: ['$F_{\text{net},y} = 63.4 + (-77.1) = -13.7$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-net
    where: 'same: F_net = √(228² + 13.7²) = 228 N'
    inputs: {}
    formula: sqrt(228**2 + 13.7**2)
    expected: '228'
    shown: ['$F_\text{net} = \sqrt{228^{2} + 13.7^{2}} = 228$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-angle
    where: 'same: tan⁻¹(13.74/227.9) = 3.5° to the right of forward, from the unrounded components'
    inputs: {}
    formula: atan((120 * sin(40 * pi / 180) - 150 * sin(25 * pi / 180)) / (150 * cos(25 * pi / 180) + 120 * cos(40 * pi / 180))) * 180 / pi
    expected: '3.5'
    shown: ['$\tan^{-1}(13.74/227.9) = 3.5°$ to the right']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-balance-angle
    where: 'same: the balancing pull points 3.5° to the left of straight backwards, from the unrounded components'
    inputs: {}
    formula: atan((120 * sin(40 * pi / 180) - 150 * sin(25 * pi / 180)) / (150 * cos(25 * pi / 180) + 120 * cos(40 * pi / 180))) * 180 / pi
    expected: '3.5'
    shown: ['3.5° to the left of straight backwards']
    source: {cite: mit, at: '2.2, Finding the resultant force: balanced forces (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-angle-caption
    where: 'vector-diagram caption: the resultant points 3.5° to the right of forward'
    inputs: {}
    formula: atan((120 * sin(40 * pi / 180) - 150 * sin(25 * pi / 180)) / (150 * cos(25 * pi / 180) + 120 * cos(40 * pi / 180))) * 180 / pi
    expected: '3.5'
    shown: ['points 3.5° to the right of forward']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-angle-rounded
    where: 'worked example, rounding note: the rounded values 13.7/228 would give 3.4°'
    inputs: {}
    formula: atan(13.7 / 228) * 180 / pi
    expected: '3.4'
    shown: ['would give 3.4°']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-sum-sizes
    where: 'same, check: the two pulls added are 270 N'
    inputs: {}
    formula: 150 + 120
    expected: '270'
    shown: ['less than the two pulls added (270 N)']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-balance
    where: 'section "Balanced and unbalanced forces": the balancing pull is 228 N, 3.5° to the left of straight backwards (size from the unrounded components)'
    inputs: {}
    formula: sqrt((150 * cos(25 * pi / 180) + 120 * cos(40 * pi / 180))**2 + (150 * sin(25 * pi / 180) - 120 * sin(40 * pi / 180))**2)
    expected: '228'
    shown: ['pull back with 228 N, 3.5° to the left of straight backwards']
    source: {cite: mit, at: '2.2, Finding the resultant force: balanced forces (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-line
    where: 'quiz 3: 45 + (−18) + (−12) = +15 N'
    inputs: {}
    formula: 45 + (-18) + (-12)
    expected: '15'
    shown: ['$45 + (-18) + (-12) = +15$ N']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-line-sizes
    where: 'quiz 3: adding all three sizes gives 75 N (wrong choice)'
    inputs: {}
    formula: 45 + 18 + 12
    expected: '75'
    shown: ['Adding all three sizes (75 N)']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-right
    where: 'quiz 4: √(9.0² + 12²) = 15 N'
    inputs: {}
    formula: sqrt(9.0**2 + 12**2)
    expected: '15'
    shown: ['$\\sqrt{9.0^{2} + 12^{2}} = \\sqrt{225} = 15$ N']
    source: {cite: reading2, at: 'Sec. 8.4.1, Eq. (8.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-right-wrong-add
    where: 'quiz 4: forces along one line would add to 21 N'
    inputs: {}
    formula: 9.0 + 12
    expected: '21'
    shown: ['would add to 21 N']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-right-wrong-cancel
    where: 'quiz 4: or partly cancel to 3.0 N'
    inputs: {}
    formula: 12 - 9.0
    expected: '3.0'
    shown: ['partly cancel to 3.0 N']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-right-wrong-product
    where: 'quiz 4: 108 N is the product 9.0 × 12 (wrong choice)'
    inputs: {}
    formula: 9.0 * 12
    expected: '108'
    shown: ['"21 N", "108 N"']
    source: {cite: mit, at: '2.2, Finding the resultant force (the numbers are the page''s own)'}
    origin: page-own
