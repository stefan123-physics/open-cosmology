    inputs: {g: 9.81 m/s**2, R: 6.371e6 m, G: 6.674e-11 N*m**2/kg**2}
    formula: g * R**2 / G
    expected: 6e24 kg
    shown: ['about $6 \\times 10^{24}$ kg, once']
    source: {cite: mit, at: 'Newton''s law of universal gravitation (a₀ = G M/d² solved for the mass; the arithmetic is the page''s own)'}
    origin: page-own

