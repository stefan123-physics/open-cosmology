# Calculations on content/year-0/hs-2/newtons-law-of-gravitation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.4 Forces between masses (cite: mit); MIT 8.01SC Course Notes Ch. 9 (reading1)
# and Ch. 8 (reading2); NIST CODATA G; NASA Earth, Moon and Mars Fact Sheets; NASA "What Is Microgravity?"; Persson (arXiv:2501.11943).
# Siyavula's own numbers (80 kg and 65 kg at 10 m and 1 m, the Earth-Moon force, Jupiter, Mercury, Neptune, Zirgon, Beeble,
# Jojo, the 70 kg man) and MIT's (the Moon's period from G, 3.82 × 10⁸ m) are not reused. The planet values come from NASA.

page: content/year-0/hs-2/newtons-law-of-gravitation.mdx
calcs:
  # Quiz
  - id: quiz-half-distance
    where: 'quiz 1: halving the distance multiplies the force by 4'
    inputs: {r1: 1 m, r2: 0.5 m}
    formula: (r1 / r2)**2
    expected: '4'
    shown: ['Halving the distance multiplies the force by 2² = 4']
    source: {cite: mit, at: 'Newton''s law of universal gravitation (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-G
    kind: fact
    where: 'quiz 2 explanation: G = 6.674 × 10⁻¹¹ N m²/kg²'
    value: 6.674e-11 N*m**2/kg**2
    shown: ['G (6.674 × 10⁻¹¹ N m²/kg²) is the same everywhere']
    source: {cite: nistg, at: 'Numerical value 6.674 30 × 10⁻¹¹ m³ kg⁻¹ s⁻²'}
    origin: later-data

  - id: quiz-g-earth
    where: 'quiz 2 explanation: about 9.8 N/kg at the Earth''s surface'
    inputs: {G: 6.674e-11 N*m**2/kg**2, M: 5.9722e24 kg, R: 6371 km}
    formula: G * M / R**2
    expected: 9.8 N/kg
    shown: ['about 9.8 N/kg at the Earth''s surface, 1.62 N/kg on the Moon']
    source: {cite: earthfact, at: 'Bulk parameters, mass and volumetric mean radius (the arithmetic is the page''s own)'}
    origin: page-own

  - id: quiz-satellite
    where: 'quiz 3: 4 Earth radii from the centre, 900/16 ≈ 56 N'
    inputs: {F: 900 N, r1: 1 m, r2: 4 m}
    formula: F * (r1 / r2)**2
    expected: 56 N
    shown: ['900/16 ≈ 56 N']
    source: {cite: mit, at: 'Newton''s law of universal gravitation (distance from the centre; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-satellite-wrong
    where: 'quiz 3, distractor: using the height (3 radii) gives 900/9 = 100 N'
    inputs: {F: 900 N, r1: 1 m, r2: 3 m}
    formula: F * (r1 / r2)**2
    expected: 100 N
    shown: ['gives 900/9 = 100 N; that is the common mistake']
    source: {cite: mit, at: 'Newton''s law of universal gravitation (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-moon-weight
    where: 'quiz 4: 50 × 1.62 = 81 N'
    inputs: {m: 50 kg, g: 1.62 N/kg}
    formula: m * g
    expected: 81 N
    shown: ['50 × 1.62 = 81 N']
    source: {cite: moonfact, at: 'Bulk parameters, surface gravity 1.62 m/s² (the mass is the page''s own)'}
    origin: page-own

  - id: quiz-moon-test
    where: 'quiz 5: 60² = 3600'
    inputs: {n: 60}
    formula: n**2
    expected: '3600'
    shown: ['60² = 3600 times weaker gravity']
    source: {cite: reading1, at: 'Sec. 9.2.1 (inverse square of the distance; the numbers are the page''s own)'}
    origin: page-own

  # Flashcards
  - id: card-G
    kind: fact
    where: 'flashcard 2: G = 6.674 × 10⁻¹¹ N m²/kg²'
    value: 6.674e-11 N*m**2/kg**2
