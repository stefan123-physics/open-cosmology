    source: {cite: mit, at: 'Newton''s law of universal gravitation (G = 6,67 × 10⁻¹¹ N·m²·kg⁻²)'}
    origin: mit

  - id: students-force
    where: 'worked example "Two students on a bench": F = G × 60 × 75 / 0.50² ≈ 1.2 × 10⁻⁶ N'
    inputs: {G: 6.674e-11 N*m**2/kg**2, m1: 60 kg, m2: 75 kg, r: 0.50 m}
    formula: G * m1 * m2 / r**2
    expected: 1.2e-6 N
    shown: ['\dfrac{60 \times 75}{0.50^2} \approx 1.2 \times 10^{-6}\ \text{N}']
    source: {cite: mit, at: 'Newton''s law of universal gravitation (the numbers are the page''s own)'}
    origin: page-own

  - id: students-weight
    where: 'same: the lighter student''s weight 60 × 9.81 ≈ 589 N'
    inputs: {m: 60 kg, g: 9.81 m/s**2}
    formula: m * g
    expected: 589 N
    shown: ['$F_g = m g = 60 \times 9.81 \approx 589$ N']
    source: {cite: reading2, at: 'Sec. 8.2.3, Eq. (8.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: students-ratio
    where: 'same: the pull is about 2.0 × 10⁻⁹ times the weight'
    inputs: {G: 6.674e-11 N*m**2/kg**2, m1: 60 kg, m2: 75 kg, r: 0.50 m, g: 9.81 m/s**2}
    formula: (G * m1 * m2 / r**2) / (m1 * g)
    expected: 2.0e-9
    shown: ['about $2.0 \times 10^{-9}$ times that']
    source: {cite: mit, at: 'Newton''s law of universal gravitation (the numbers are the page''s own)'}
    origin: page-own

