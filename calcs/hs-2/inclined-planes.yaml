  # --- Worked example: a playground slide ---
  - id: slide-sin
    where: 'worked example "A playground slide": sin 35° ≈ 0.574'
    inputs: {}
    formula: sin(35 * pi / 180)
    expected: '0.574'
    shown: ['$a = g(\sin\theta - \mu_k\cos\theta) = 9.81 \times (\sin 35^\circ - 0.30 \cos 35^\circ) = 9.81 \times (0.574 - 0.246) \approx 3.22$ m/s²']
    source: {cite: mit, at: 'Object on an inclined plane (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-friction-term
    where: 'same: 0.30 cos 35° ≈ 0.246'
    inputs: {}
    formula: 0.30 * cos(35 * pi / 180)
    expected: '0.246'
    shown: ['(0.574 - 0.246)']
    source: {cite: reading1, at: 'Friction forces, f_k = μ_k N (the numbers are the page''s own)'}
    origin: page-own

  - id: slide-a
    where: 'same: a ≈ 3.22 m/s²'
    inputs: {ga: 9.81 m/s**2}
    formula: ga * (sin(35 * pi / 180) - 0.30 * cos(35 * pi / 180))
    expected: 3.22 m/s**2
    shown: ['\approx 3.22$ m/s², down the slide']
    source: {cite: mit, at: 'Object on an inclined plane, with f_k = μ_k N (the numbers are the page''s own)'}
    origin: page-own

