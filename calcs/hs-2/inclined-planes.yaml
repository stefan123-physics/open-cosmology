# Calculations on content/year-0/hs-2/inclined-planes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.3 Newton's laws, "Object on an inclined plane" and Worked examples
# 10, 14 and 15 (mit); 2.2 Force, "Resolving forces into components" and "Friction forces" (reading1); MIT 8.01SC
# course notes Ch. 8, Secs. 8.3, 8.3.2 and 8.4.1 (reading2).
# All example numbers are the page's own: Siyavula's 137 N at 37°, 456 N and 300 N at 67.8°, 287 N / 123.7 N, 98 N
# with ratio 7:4, 312 N at 35°, 130 N with μ_s = 0.47 and the 30 kg / 50 kg crates are not reused; MIT Ch. 8 has no
# numerical inclined-plane example (its Example 8.10, a block on a 45° wedge, is symbolic). g is written ga in the inputs (g alone is the gram); angles are in degrees and
# converted with pi/180.

page: content/year-0/hs-2/inclined-planes.mdx
