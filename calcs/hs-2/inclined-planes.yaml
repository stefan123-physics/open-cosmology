  # --- Formulas ---
  - id: components-pythagoras
    kind: identity
    where: 'section "Splitting the weight": the two components m g sin θ and m g cos θ make up the weight m g'
    formula: sqrt((m * ga * sin(th))**2 + (m * ga * cos(th))**2)
    equals: m * ga
    samples:
      m: [2.0, 0.4, 45, 7.3]
      ga: [9.81, 9.81, 1.62, 9.81]
      th: [0.3, 0.9, 1.2, 0.05]
    shown: ['tex="F_{g\parallel} = m\,g\,\sin\theta, \qquad F_{g\perp} = m\,g\,\cos\theta"']
    source: {cite: reading1, at: 'Resolving forces into components'}
    origin: page-own

  - id: rest-condition
    kind: identity
    where: 'section "Friction: when does an object stay put?": dividing m g sin θ ≤ μ_s m g cos θ by m g cos θ gives tan θ ≤ μ_s; the critical angle has μ_s = tan θ_c, independent of the mass'
    formula: (m * ga * sin(solve('tan(x) - mus', 'x', 0, 1.5))) / (m * ga * cos(solve('tan(x) - mus', 'x', 0, 1.5)))
    equals: mus
    samples:
      m: [0.4, 2.0, 45, 3.1]
      ga: [9.81, 9.81, 9.81, 1.62]
      mus: [0.51, 0.25, 0.8, 1.3]
    shown: ['tex="\mu_s = \tan\theta_c"']
    source: {cite: reading2, at: 'Sec. 8.3.2, Eq. (8.3.7) and the just-slipping condition'}
    origin: page-own

  - id: kinetic-slope
    kind: identity
    where: 'section "Sliding down with friction": (m g sin θ − μ_k m g cos θ)/m = g(sin θ − μ_k cos θ)'
    formula: (m * ga * sin(th) - muk * m * ga * cos(th)) / m
    equals: ga * (sin(th) - muk * cos(th))
    samples:
      m: [1.0, 30, 0.2, 75]
      ga: [9.81, 9.81, 9.81, 9.81]
      th: [0.61, 0.3, 1.0, 0.2]
      muk: [0.30, 0.25, 0.1, 0.5]
    shown: ['tex="a = g\,(\sin\theta - \mu_k\cos\theta)"']
    source: {cite: mit, at: 'Object on an inclined plane, with f_k = μ_k N (2.2 Force)'}
    origin: page-own

  - id: connected-formula
    kind: identity
    where: 'connected example: adding T − m1 g sin θ − μ_k m1 g cos θ = m1 a and m2 g − T = m2 a gives a = (m2 g − m1 g sin θ − μ_k m1 g cos θ)/(m1 + m2); checked against solving the two equations for a'
    formula: (m2 * ga - m1 * ga * sin(th) - muk * m1 * ga * cos(th)) / (m1 + m2)
    equals: solve('(m2 * ga - m2 * A) - m1 * ga * sin(th) - muk * m1 * ga * cos(th) - m1 * A', 'A', -50, 50)
    samples:
      m1: [2.0, 1.0, 5.0, 3.0]
      m2: [1.5, 4.0, 2.0, 0.5]
      ga: [9.81, 9.81, 9.81, 9.81]
      th: [0.5236, 0.3, 0.9, 0.1]
      muk: [0.20, 0.1, 0.3, 0.05]
    shown: ['tex="a = \frac{m_2\,g - m_1\,g\,\sin\theta - \mu_k\,m_1\,g\,\cos\theta}{m_1 + m_2}"']
    source: {cite: mit, at: 'Worked example 10 (method: second law for each object, same a and T, solved simultaneously)'}
    origin: page-own

  - id: connected-vertical-limit
    kind: identity
    where: 'connected example, check: for θ = 90° the formula becomes (m2 − m1) g/(m1 + m2), lesson 2.5'
    formula: (m2 * ga - m1 * ga * sin(pi / 2) - muk * m1 * ga * cos(pi / 2)) / (m1 + m2)
    equals: (m2 - m1) * ga / (m1 + m2)
    samples:
      m1: [2.0, 1.0, 5.0]
      m2: [1.5, 4.0, 2.0]
      ga: [9.81, 9.81, 9.81]
      muk: [0.2, 0.5, 0.9]
    shown: ['$(m_2 - m_1)\,g/(m_1 + m_2)$']
    source: {cite: mit, at: 'Worked example 10'}
    origin: page-own

  # --- Worked example: a trolley on a smooth ramp ---
  - id: trolley-weight
