# Calculations on content/year-0/hs-2/torque-and-balance.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Chapter 18 Static Equilibrium (mit) and Chapter 17 Two Dimensional
# Rotational Dynamics (reading1). No CC BY Siyavula section covers moments (docs/siyavula-licences.tsv).
# MIT's own numbers (Example 18.1: beam 1.0 m, 2.0 kg, 0.3 kg at 0.4 m, 0.6 kg at 0.2 m; Example 18.2: rod 2.0 m,
# 4.0 kg, cable at 30°, T = 39.2 N) are not reused: all numbers are the page's own. g = 9.81 m/s² (written ga).

page: content/year-0/hs-2/torque-and-balance.mdx
calcs:
  # Opening a door
  - id: door-torque
    where: 'worked example "Opening a door": τ = 15 N × 0.80 m = 12 N·m (also the marked maximum of the graph)'
    inputs: {f: 15 N, d: 0.80 m}
    formula: f * d
    expected: 12 N*m
    shown: ['$\tau = F d = 15 \times 0.80 = 12$ N·m', 'A push at right angles gives the largest torque, 12 N·m']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: door-near-hinge
    where: 'same: F = 12 N·m / 0.20 m = 60 N'
    inputs: {tau: 12 N*m, d: 0.20 m}
    formula: tau / d
    expected: 60 N
    shown: ['$F = \tau/d = 12/0.20 = 60$ N']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: door-check
    where: 'same, check: four times 15 N is 60 N'
    inputs: {f: 15 N}
    formula: 4 * f
    expected: 60 N
    shown: ['$4 \times 15 = 60$ N']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: door-30deg
    where: 'section "A force at an angle": 0.80 × 15 × sin 30° = 6.0 N·m (also the second point of the graph)'
    inputs: {r: 0.80 m, f: 15 N}
    formula: r * f * sin(30 * pi / 180)
    expected: 6.0 N*m
    shown: ['$0.80 \times 15 \times \sin 30^\circ = 6.0$ N·m', 'label: "6.0 N·m at 30°"']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.29) (the numbers are the page''s own)'}
    origin: page-own

  # Seesaw
  - id: seesaw-d
    where: 'worked example "Where to sit on a seesaw": d = 24 × 1.5 / 80 = 0.45 m'
    inputs: {m1: 24 kg, d1: 1.5 m, m2: 80 kg}
    formula: m1 * d1 / m2
    expected: 0.45 m
    shown: ['$d = 24 \times 1.5/80 = 0.45$ m']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) and Example 18.1(b) (the numbers are the page''s own)'}
    origin: page-own

  - id: seesaw-pivot
    where: 'same: pivot force (24 + 80 + 30) × 9.81 ≈ 1.31 × 10³ N'
    inputs: {m1: 24 kg, m2: 80 kg, mb: 30 kg, ga: 9.81 m/s**2}
    formula: (m1 + m2 + mb) * ga
    expected: 1.31e3 N
    shown: ['$(24 + 80 + 30) \times 9.81 = 134 \times 9.81 \approx 1.31 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 18.2, Example 18.1(a), Eq. (18.2.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: seesaw-torque-mila
    where: 'same, check: 24 × 9.81 × 1.5 ≈ 353 N·m'
    inputs: {m: 24 kg, ga: 9.81 m/s**2, d: 1.5 m}
    formula: m * ga * d
    expected: 353 N*m
    shown: ['$24 \times 9.81 \times 1.5 \approx 353$ N·m anticlockwise']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: seesaw-torque-father
    where: 'same, check: 80 × 9.81 × 0.45 ≈ 353 N·m'
    inputs: {m: 80 kg, ga: 9.81 m/s**2, d: 0.45 m}
    formula: m * ga * d
    expected: 353 N*m
    shown: ['$80 \times 9.81 \times 0.45 \approx 353$ N·m clockwise']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: seesaw-mass-ratio
    where: 'same, check: 80/24 ≈ 3.3'
    inputs: {m1: 24 kg, m2: 80 kg}
    formula: m2 / m1
    expected: '3.3'
    shown: ['$80/24 \approx 3.3$ times heavier']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: seesaw-distance-ratio
    where: 'same, check: 1.5/0.45 ≈ 3.3'
    inputs: {d1: 1.5 m, d2: 0.45 m}
    formula: d1 / d2
    expected: '3.3'
    shown: ['$1.5/0.45 \approx 3.3$ times closer']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  # Painter on a plank
  - id: plank-weight
    where: 'worked example "A painter on a plank": plank weight 20 × 9.81 = 196.2 N'
    inputs: {m: 20 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 196.2 N
    shown: ['$20 \times 9.81 = 196.2$ N']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.2 (weight at the centre of the rod) (the numbers are the page''s own)'}
    origin: page-own

  - id: painter-weight
    where: 'same: painter weight 70 × 9.81 = 686.7 N'
    inputs: {m: 70 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 686.7 N
    shown: ['$70 \times 9.81 = 686.7$ N']
    source: {cite: mit, at: 'Sec. 18.2, Eqs. (18.2.4)–(18.2.5) (normal force equals weight) (the numbers are the page''s own)'}
    origin: page-own

  - id: plank-torque-a
    where: 'same: clockwise torque about A, 196.2 × 2.0 + 686.7 × 1.0 = 1079 N·m'
    inputs: {wp: 196.2 N, wm: 686.7 N, dp: 2.0 m, dm: 1.0 m}
    formula: wp * dp + wm * dm
    expected: 1079 N*m
    shown: ['$196.2 \times 2.0 + 686.7 \times 1.0 = 1079$ N·m']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.2, torques about the pivot, Eq. (18.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: plank-fb
    where: 'same: F_B = 1079/4.0 ≈ 270 N (269.8 N unrounded)'
    inputs: {tau: 1079.1 N*m, len: 4.0 m}
    formula: tau / len
    expected: 269.8 N
    shown: ['$F_B = 1079/4.0 \approx 270$ N', '$F_A = 882.9 - 269.8 \approx 613$ N']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.2, Eq. (18.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: plank-total
    where: 'same: F_A + F_B = 196.2 + 686.7 = 882.9 N'
    inputs: {wp: 196.2 N, wm: 686.7 N}
    formula: wp + wm
    expected: 882.9 N
    shown: ['$F_A + F_B = 196.2 + 686.7 = 882.9$ N']
    source: {cite: mit, at: 'Sec. 18.1, Eq. (18.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: plank-fa
    where: 'same: F_A = 882.9 − 269.8 ≈ 613 N'
    inputs: {tot: 882.9 N, fb: 269.8 N}
    formula: tot - fb
    expected: 613 N
    shown: ['so $F_A = 882.9 - 269.8 \approx 613$ N', 'A carries more of the load']
    source: {cite: mit, at: 'Sec. 18.1, Eq. (18.1.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: plank-fa-check
    where: 'same, check: torques about B, F_A = (196.2 × 2.0 + 686.7 × 3.0)/4.0 ≈ 613 N'
    inputs: {wp: 196.2 N, wm: 686.7 N, dp: 2.0 m, dm: 3.0 m, len: 4.0 m}
    formula: (wp * dp + wm * dm) / len
    expected: 613 N
    shown: ['$F_A \times 4.0 = 196.2 \times 2.0 + 686.7 \times 3.0$, which gives $F_A \approx 613$ N again']
    source: {cite: mit, at: 'Appendix 18A (torques about any point) (the numbers are the page''s own)'}
    origin: page-own

  # Tipping
  - id: bookcase-ratio
    where: 'worked example "A bookcase and a crate": tan θ = 0.30/0.90 = 0.333'
    inputs: {b: 0.30 m, h: 0.90 m}
    formula: b / h
    expected: '0.333'
    shown: ['$\tan\theta = 0.30/0.90 = 0.333$']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3, Eqs. (18.4.14)–(18.4.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: bookcase-angle
    where: 'same: θ = tan⁻¹(0.333) ≈ 18°'
    inputs: {}
    formula: atan(0.30 / 0.90) * 180 / pi
    expected: '18'
    shown: ['and $\theta \approx 18^\circ$']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-angle
    where: 'same: tan θ = 0.30/0.30 = 1.0, θ = 45°'
    inputs: {}
    formula: atan(0.30 / 0.30) * 180 / pi
    expected: '45'
    shown: ['$\tan\theta = 1.0$, so $\theta = 45^\circ$']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the numbers are the page''s own)'}
    origin: page-own

  # Wheel nut
  - id: nut-short
    where: 'worked example "A stuck wheel nut": F = 120/0.20 = 600 N'
    inputs: {tau: 120 N*m, d: 0.20 m}
    formula: tau / d
    expected: 600 N
    shown: ['$F = \tau/d = 120/0.20 = 600$ N']
    source: {cite: mit, at: 'Sec. 18.2, lever law Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: nut-person
    where: 'same: 600 N is the weight of about 61 kg'
    inputs: {f: 600 N, ga: 9.81 m/s**2}
    formula: f / ga
    expected: 61 kg
    shown: ['about the weight of a 61 kg person']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.4) (weight m g) (the numbers are the page''s own)'}
    origin: page-own

  - id: nut-long
    where: 'same: F = 120/0.50 = 240 N'
    inputs: {tau: 120 N*m, d: 0.50 m}
    formula: tau / d
    expected: 240 N
    shown: ['$F = 120/0.50 = 240$ N']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: nut-ratio
    where: 'same, check: 0.50/0.20 = 2.5 and 600/2.5 = 240 N'
    inputs: {f: 600 N, d1: 0.20 m, d2: 0.50 m}
    formula: f * d1 / d2
    expected: 240 N
    shown: ['$600/2.5 = 240$ N', 'The brace is 2.5 times longer']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  # Quiz
  - id: quiz1-torque
    where: 'quiz 1: τ = 80 × 0.25 = 20 N·m'
    inputs: {f: 80 N, d: 0.25 m}
    formula: f * d
    expected: 20 N*m
    shown: ['$\\tau = F d = 80 \\times 0.25 = 20$ N·m']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-wrong-divide
    where: 'quiz 1, wrong choices: 80/0.25 = 320 and 0.25/80 = 0.0031'
    inputs: {f: 80, d: 0.25}
    formula: d / f
    expected: '0.0031'
    shown: ['the length by the force 0.0031', '"0.0031 N·m"']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz1-wrong-320
    where: 'quiz 1, wrong choice: 80/0.25 = 320'
    inputs: {f: 80, d: 0.25}
    formula: f / d
    expected: '320'
    shown: ['Dividing the force by the length gives 320', '"320 N·m"']
    source: {cite: reading1, at: 'Sec. 17.3.1, Eq. (17.2.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz2-d
    where: 'quiz 2: d = 30 × 2.0/40 = 1.5 m'
    inputs: {m1: 30 kg, d1: 2.0 m, m2: 40 kg}
    formula: m1 * d1 / m2
    expected: 1.5 m
    shown: ['so $d = 30 \\times 2.0/40 = 1.5$ m']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz2-wrong
    where: 'quiz 2, wrong choice: 40 × 2.0/30 = 2.7 m'
    inputs: {m1: 30 kg, d1: 2.0 m, m2: 40 kg}
    formula: m2 * d1 / m1
    expected: 2.7 m
    shown: ['Turning the ratio upside down gives 2.7 m', '"2.7 m"']
    source: {cite: mit, at: 'Sec. 18.2, Eq. (18.2.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-ratio
    where: 'quiz 5: tan θ = 0.20/0.50 = 0.40'
    inputs: {b: 0.20 m, h: 0.50 m}
    formula: b / h
    expected: '0.40'
    shown: ['$\\tan\\theta = 0.20/0.50 = 0.40$']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-angle
    where: 'quiz 5: θ = tan⁻¹(0.40) ≈ 22°'
    inputs: {}
    formula: atan(0.20 / 0.50) * 180 / pi
    expected: '22'
    shown: ['and $\\theta \\approx 22^\\circ$', '"About 22°"']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-wrong-width
    where: 'quiz 5, wrong choice: the whole width, tan⁻¹(0.40/0.50) ≈ 39°'
    inputs: {}
    formula: atan(0.40 / 0.50) * 180 / pi
    expected: '39'
    shown: ['Using the whole width gives 39°', '"About 39°"']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-wrong-inverse
    where: 'quiz 5, wrong choice: tan⁻¹(0.50/0.20) ≈ 68°'
    inputs: {}
    formula: atan(0.50 / 0.20) * 180 / pi
    expected: '68'
    shown: ['turning the ratio upside down gives 68°', '"About 68°"']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-half-width
    where: 'quiz 5: the box is 0.40 m wide, so its centre of gravity is half the width, 0.20 m, from the edge'
    inputs: {w: 0.40 m}
    formula: w / 2
    expected: 0.20 m
    shown: ['A uniform box is 0.40 m wide', 'half the width (0.20 m)']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3, Eq. (18.4.16), half the distance between the feet (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz5-wrong-45
    where: 'quiz 5, wrong choice 45°: the angle for a ratio of 1 (half-width equal to the height), not this box'
    inputs: {}
    formula: atan(0.50 / 0.50) * 180 / pi
    expected: '45'
    shown: ['"About 45°"']
    source: {cite: mit, at: 'Sec. 18.4, Example 18.3 (the distractor is the page''s own, not in the source)'}
    origin: page-own
