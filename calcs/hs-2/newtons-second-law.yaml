# Calculations on content/year-0/hs-2/newtons-second-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.3 Newton's laws (mit), 2.4 Forces between masses (reading2),
# 2.2 Force (reading3); MIT 8.01SC course notes Ch. 7 (reading1); NIST standard gravity; NASA Moon Fact Sheet.
# All example numbers are the page's own (none of Siyavula's or MIT's example numbers are reused).
# Note: g is written ga in the inputs (g alone would be the gram).

page: content/year-0/hs-2/newtons-second-law.mdx
calcs:
  - id: table-row1
    where: 'table in "Force, mass and acceleration": 4.0 N on 2.0 kg gives 2.0 m/s²'
    inputs: {f: 4.0 N, m: 2.0 kg}
    formula: f / m
    expected: 2.0 m/s**2
    shown: ['| 4.0 N | 2.0 kg | 2.0 m/s² |']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (a proportional to F and to 1/m) (the numbers are the page''s own)'}
    origin: page-own

  - id: table-row2
    where: 'same table: 8.0 N on 2.0 kg gives 4.0 m/s²'
    inputs: {f: 8.0 N, m: 2.0 kg}
    formula: f / m
    expected: 4.0 m/s**2
    shown: ['| 8.0 N | 2.0 kg | 4.0 m/s² |']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: table-row3
    where: 'same table: 4.0 N on 4.0 kg gives 1.0 m/s²'
    inputs: {f: 4.0 N, m: 4.0 kg}
    formula: f / m
    expected: 1.0 m/s**2
    shown: ['| 4.0 N | 4.0 kg | 1.0 m/s² |']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-2kg
    where: 'graph caption: 6 N on 2 kg gives 3 m/s²'
    inputs: {f: 6 N, m: 2 kg}
    formula: f / m
    expected: 3 m/s**2
    shown: ['a mass of 2 kg gets 3 m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-4kg
    where: 'same caption: 6 N on 4 kg gives 1.5 m/s²'
    inputs: {f: 6 N, m: 4 kg}
    formula: f / m
    expected: 1.5 m/s**2
    shown: ['a mass of 4 kg only 1.5 m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-net
    where: 'worked example "Pulling a sledge": 60 − 18 = 42 N'
    inputs: {p: 60 N, f: 18 N}
    formula: p - f
    expected: 42 N
    shown: ['The net force is $60 - 18 = 42$ N forwards']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 9: Newton''s second law: Box on a surface (method; the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-a
    where: 'same: a = 42/12 = 3.5 m/s²'
    inputs: {f: 42 N, m: 12 kg}
    formula: f / m
    expected: 3.5 m/s**2
    shown: ['$a = F_{\text{net}}/m = 42/12 = 3.5$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 9: Newton''s second law: Box on a surface (method; the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-vf
    where: 'same: v_f = 3.5 × 2.0 = 7.0 m/s'
    inputs: {a: 3.5 m/s**2, u: 2.0 s}
    formula: a * u
    expected: 7.0 m/s
    shown: ['$v_f = 3.5 \times 2.0 = 7.0$ m/s']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (acceleration then used in the equations of motion; the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-dx
    where: 'same: Δx = ½ × 3.5 × 2.0² = 7.0 m'
    inputs: {a: 3.5 m/s**2, u: 2.0 s}
    formula: a * u**2 / 2
    expected: 7.0 m
    shown: ['$\Delta x = \tfrac{1}{2} \times 3.5 \times 2.0^{2} = 7.0$ m']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: sledge-check
    where: 'same, check: average velocity ½(0 + 7.0) = 3.5 m/s, times 2.0 s = 7.0 m'
    inputs: {v: 7.0 m/s, u: 2.0 s}
    formula: v / 2 * u
    expected: 7.0 m
    shown: ['$\tfrac{1}{2}(0 + 7.0) = 3.5$ m/s, and $3.5 \times 2.0 = 7.0$ m, the same']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: car-a
    where: 'worked example "An emergency stop": a = −400/80 = −5.0 m/s²'
    inputs: {v: 20 m/s, d: 40 m}
    formula: -v**2 / (2 * d)
    expected: -5.0 m/s**2
    shown: ['$a = -400/80 = -5.0$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (force from a known acceleration; the numbers are the page''s own)'}
    origin: page-own

  - id: car-f
    where: 'same: F = 1500 × (−5.0) = −7.5 × 10³ N'
    inputs: {m: 1500 kg, a: -5.0 m/s**2}
    formula: m * a
    expected: -7.5e3 N
    shown: ['$F_{\text{net}} = m a = 1500 \times (-5.0) = -7.5 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: car-t
    where: 'same, check: Δt = 20/5.0 = 4.0 s'
    inputs: {v: 20 m/s, a: 5.0 m/s**2}
    formula: v / a
    expected: 4.0 s
    shown: ['$\Delta t = 20/5.0 = 4.0$ s']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: car-dx-check
    where: 'same, check: ½(20 + 0) × 4.0 = 40 m'
    inputs: {v: 20 m/s, u: 4.0 s}
    formula: v / 2 * u
    expected: 40 m
    shown: ['$\tfrac{1}{2}(20 + 0) \times 4.0 = 40$ m']
    source: {cite: mit, at: 'Sec. 2.3, Applying Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: g-standard
    kind: fact
    where: 'section "Weight: mass and gravity": g = 9.81 m/s² (standard gravity 9.806 65 m/s² rounded, as in lesson 1.7)'
    value: 9.81 m/s**2
    shown: ['the same acceleration, $g = 9.81$ m/s² downwards']
    source: {cite: nist-g, at: 'standard acceleration of gravity, 9.806 65 m/s² (exact), rounded to 9.81'}
    origin: later-data

  - id: g-per-kg
    where: 'same section: g = 9.81 N/kg is the same as 9.81 m/s²'
    inputs: {ga: 9.81 m/s**2}
    formula: ga
    expected: 9.81 N/kg
    shown: ['$g = 9.81$ N/kg']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the unit conversion is the page''s own)'}
    origin: page-own

  - id: g-moon
    kind: fact
    where: 'same section: surface gravity of the Moon 1.62 m/s²'
    value: 1.62 m/s**2
    shown: ['$g_{\text{Moon}} = 1.62$ m/s² (lesson 1.7)']
    source: {cite: moon, at: 'Bulk parameters, surface gravity'}
    origin: later-data

  - id: weight-earth
    where: 'same section: 60.0 kg weighs 60.0 × 9.81 ≈ 589 N'
    inputs: {m: 60.0 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 589 N
    shown: ['$60.0 \times 9.81 \approx 589$ N']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the numbers are the page''s own)'}
    origin: page-own

  - id: weight-moon
    where: 'same: 60.0 × 1.62 ≈ 97.2 N on the Moon'
    inputs: {m: 60.0 kg, gm: 1.62 m/s**2}
    formula: m * gm
    expected: 97.2 N
    shown: ['$60.0 \times 1.62 \approx 97.2$ N']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the numbers are the page''s own)'}
    origin: page-own

  - id: scales-moon
    where: 'same: scales on the Moon show 97.2 / 9.81 ≈ 9.91 kg'
    inputs: {w: 97.2 N, ga: 9.81 m/s**2}
    formula: w / ga
    expected: 9.91 kg
    shown: ['$97.2 / 9.81 \approx 9.91$ kg']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (a scale uses the weight to find the mass; the numbers are the page''s own)'}
    origin: page-own

  - id: bucket-weight
    where: 'worked example "Hauling up a bucket": m g = 8.0 × 9.81 ≈ 78 N'
    inputs: {m: 8.0 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 78 N
    shown: ['$m g = 8.0 \times 9.81 \approx 78$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets (vertical motion; the numbers are the page''s own)'}
    origin: page-own

  - id: bucket-rope
    where: 'same: F_rope = 8.0 × (9.81 + 1.5) ≈ 90 N'
    inputs: {m: 8.0 kg, ga: 9.81 m/s**2, a: 1.5 m/s**2}
    formula: m * (ga + a)
    expected: 90 N
    shown: ['$F_{\text{rope}} = m(g + a) = 8.0 \times (9.81 + 1.5) \approx 90$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets, Stage 2 (method; the numbers are the page''s own)'}
    origin: page-own

  - id: bucket-extra
    where: 'same: extra 8.0 × 1.5 = 12 N'
    inputs: {m: 8.0 kg, a: 1.5 m/s**2}
    formula: m * a
    expected: 12 N
    shown: ['$8.0 \times 1.5 = 12$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets (the numbers are the page''s own)'}
    origin: page-own

  - id: bucket-check
    where: 'same, check: 78 + 12 = 90 N'
    inputs: {m: 8.0 kg, ga: 9.81 m/s**2, a: 1.5 m/s**2}
    formula: m * ga + m * a
    expected: 90 N
    shown: ['$78 + 12 = 90$ N']
    source: {cite: mit, at: 'Sec. 2.3, Lifts and rockets (the numbers are the page''s own)'}
    origin: page-own

  - id: shot-weight
    where: 'section "What F = ma does not say": a 5.0 kg shot weighs about 49 N'
    inputs: {m: 5.0 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 49 N
    shown: ['a weight of about 49 N']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the numbers are the page''s own)'}
    origin: page-own

  - id: shot-a
    where: 'same: 49 / 5.0 ≈ 9.8 m/s²'
    inputs: {w: 49 N, m: 5.0 kg}
    formula: w / m
    expected: 9.8 m/s**2
    shown: ['$49/5.0 \approx 9.8$ m/s²']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the numbers are the page''s own)'}
    origin: page-own

  - id: puck-ax
    where: 'worked example "Two pushes on a puck": a_x = 3.0/0.50 = 6.0 m/s²'
    inputs: {f: 3.0 N, m: 0.50 kg}
    formula: f / m
    expected: 6.0 m/s**2
    shown: ['$a_x = 3.0/0.50 = 6.0$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (x- and y-directions separately; the numbers are the page''s own)'}
    origin: page-own

  - id: puck-ay
    where: 'same: a_y = 4.0/0.50 = 8.0 m/s²'
    inputs: {f: 4.0 N, m: 0.50 kg}
    formula: f / m
    expected: 8.0 m/s**2
    shown: ['$a_y = 4.0/0.50 = 8.0$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: puck-a
    where: 'same: a = √(6.0² + 8.0²) = 10 m/s²'
    inputs: {ax: 6.0 m/s**2, ay: 8.0 m/s**2}
    formula: sqrt(ax**2 + ay**2)
    expected: 10 m/s**2
    shown: ['$a = \sqrt{6.0^{2} + 8.0^{2}} = 10$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (overall resultant from the components; the numbers are the page''s own)'}
    origin: page-own

  - id: puck-angle
    where: 'same: tan⁻¹(8.0/6.0) ≈ 53° north of east'
    inputs: {}
    formula: atan(8.0 / 6.0) * 180 / pi
    expected: '53'
    shown: ['$\tan^{-1}(8.0/6.0) \approx 53^\circ$ north of east']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: puck-fnet
    where: 'same, check: net force √(3.0² + 4.0²) = 5.0 N'
    inputs: {f1: 3.0 N, f2: 4.0 N}
    formula: sqrt(f1**2 + f2**2)
    expected: 5.0 N
    shown: ['$\sqrt{3.0^{2} + 4.0^{2}} = 5.0$ N']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: puck-check
    where: 'same, check: 5.0/0.50 = 10 m/s²'
    inputs: {f: 5.0 N, m: 0.50 kg}
    formula: f / m
    expected: 10 m/s**2
    shown: ['$5.0/0.50 = 10$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: puck-diagram
    where: 'vector diagram caption: resultant 5.0 N at about 53°'
    inputs: {}
    formula: atan(4.0 / 3.0) * 180 / pi
    expected: '53'
    shown: ['is 5.0 N at about 53° north of east']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: boxes-mass
    where: 'worked example "Two boxes pushed together": 4.0 + 2.0 = 6.0 kg'
    inputs: {ma: 4.0 kg, mb: 2.0 kg}
    formula: ma + mb
    expected: 6.0 kg
    shown: ['$4.0 + 2.0 = 6.0$ kg']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 13: Newton''s second law: truck and trailer (connected objects; method; the numbers are the page''s own)'}
    origin: page-own

  - id: boxes-a
    where: 'same: a = 30/6.0 = 5.0 m/s²'
    inputs: {f: 30 N, m: 6.0 kg}
    formula: f / m
    expected: 5.0 m/s**2
    shown: ['$a = 30/6.0 = 5.0$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 11: box on a surface (Alternative Method), the whole system first (the numbers are the page''s own)'}
    origin: page-own

  - id: boxes-push
    where: 'same: A pushes B with 2.0 × 5.0 = 10 N'
    inputs: {m: 2.0 kg, a: 5.0 m/s**2}
    formula: m * a
    expected: 10 N
    shown: ['that push is $2.0 \times 5.0 = 10$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 11: box on a surface (Alternative Method), one crate on its own (the numbers are the page''s own)'}
    origin: page-own

  - id: boxes-check
    where: 'same, check: 30 − 10 = 20 N = 4.0 × 5.0'
    inputs: {f: 30 N, p: 10 N, m: 4.0 kg, a: 5.0 m/s**2}
    formula: (f - p) / (m * a)
    expected: '1'
    shown: ['$30 - 10 = 20$ N, and $4.0 \times 5.0 = 20$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 11: box on a surface (Alternative Method) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolley
    where: 'quiz 1: a = 12/3.0 = 4.0 m/s²'
    inputs: {f: 12 N, m: 3.0 kg}
    formula: f / m
    expected: 4.0 m/s**2
    shown: ['$a = F_{\\text{net}}/m = 12/3.0 = 4.0$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolley-times
    where: 'quiz 1, distractor: 12 × 3.0 = 36'
    inputs: {}
    formula: 12 * 3.0
    expected: '36'
    shown: ['Multiplying instead of dividing gives 36']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolley-inverse
    where: 'quiz 1, distractor: 3.0 / 12 = 0.25'
    inputs: {}
    formula: 3.0 / 12
    expected: '0.25'
    shown: ['dividing the wrong way round gives 0.25']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s second law of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sledge-component
    where: 'quiz 3: 40 cos 30° ≈ 34.6 N'
    inputs: {f: 40 N}
    formula: f * cos(30 * pi / 180)
    expected: 34.6 N
    shown: ['$40 \\cos 30^\\circ \\approx 34.6$ N']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: Newton''s second law: man pulling a box (horizontal component; method; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sledge
    where: 'quiz 3: a = 34.6/5.0 ≈ 6.9 m/s²'
    inputs: {f: 40 N, m: 5.0 kg}
    formula: f * cos(30 * pi / 180) / m
    expected: 6.9 m/s**2
    shown: ['$a = 34.6/5.0 \\approx 6.9$ m/s²']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12: Newton''s second law: man pulling a box (horizontal component; method; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sledge-whole
    where: 'quiz 3, distractor: 40/5.0 = 8.0'
    inputs: {}
    formula: 40 / 5.0
    expected: '8.0'
    shown: ['Using the whole 40 N gives 8.0']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sledge-sine
    where: 'quiz 3, distractor: 40 sin 30° / 5.0 = 4.0'
    inputs: {}
    formula: 40 * sin(30 * pi / 180) / 5.0
    expected: '4.0'
    shown: ['using the sine gives 4.0']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sledge-inverse
    where: 'quiz 3, distractor: 5.0 / 34.6 ≈ 0.14'
    inputs: {}
    formula: 5.0 / 34.6
    expected: '0.14'
    shown: ['dividing the mass by the horizontal force gives 0.14']
    source: {cite: mit, at: 'Sec. 2.3, Worked example 12 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-moon-weight
    where: 'quiz 4: 80 × 1.62 ≈ 130 N'
    inputs: {m: 80 kg, gm: 1.62 m/s**2}
    formula: m * gm
    expected: 130 N
    shown: ['$F_g = m g = 80 \\times 1.62 \\approx 130$ N']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-earth-weight
    where: 'quiz 4: 80 × 9.81 ≈ 785 N'
    inputs: {m: 80 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 785 N
    shown: ['$80 \\times 9.81 \\approx 785$ N']
    source: {cite: reading2, at: 'Sec. 2.4, Weight and mass (the numbers are the page''s own)'}
