# Calculations on content/year-0/hs-2/newtons-first-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.3 Newton's laws (first law, forces in equilibrium);
# MIT 8.01SC course notes Ch. 7 (Sec. 7.2) and Ch. 11 (Sec. 11.2.1); MacTutor biography of Galileo;
# NASA Science "Voyager 1: The Farthest Spacecraft"; 8.286 Lecture 5 transcript p. 13.
# All worked-example and quiz numbers are the page's own (Siyavula's seatbelt example uses 120 km/h; none of its numbers are reused).

page: content/year-0/hs-2/newtons-first-law.mdx
calcs:
  - id: crash-speed-kmh
    where: 'worked example "Why a passenger hits the dashboard": 15 m/s is 54 km/h'
    inputs: {v: 15 m/s}
    formula: v
    expected: 54 km/hour
    shown: ['15 m/s (54 km/h)']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law in action, Seat belts (plain unit conversion; the numbers are the page''s own)'}
    origin: page-own

  - id: car-average-velocity
    where: 'same: average velocity ½(15 + 0) = 7.5 m/s while the car slows steadily'
    inputs: {a: 15 m/s, b: 0 m/s}
    formula: (a + b) / 2
    expected: 7.5 m/s
    shown: ['\tfrac{1}{2}(15 + 0) = 7.5$ m/s']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law in action, Seat belts (constant-acceleration average from lesson 1.6; the numbers are the page''s own)'}
    origin: page-own

  - id: car-distance
    where: 'same: the car moves 7.5 × 0.10 = 0.75 m'
    inputs: {v: 7.5 m/s, t: 0.10 s}
    formula: v * t
    expected: 0.75 m
    shown: ['$7.5 \times 0.10 = 0.75$ m']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law in action, Seat belts (the numbers are the page''s own)'}
    origin: page-own

  - id: passenger-distance
    where: 'same: the passenger keeps 15 m/s and moves 15 × 0.10 = 1.5 m'
    inputs: {v: 15 m/s, t: 0.10 s}
    formula: v * t
    expected: 1.5 m
    shown: ['$15 \times 0.10 = 1.5$ m']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law in action, Seat belts (the numbers are the page''s own)'}
    origin: page-own

  - id: passenger-relative
    where: 'same: relative to the car the passenger moves 1.5 − 0.75 = 0.75 m forward'
    inputs: {a: 1.5 m, b: 0.75 m}
    formula: a - b
    expected: 0.75 m
    shown: ['$1.5 - 0.75 = 0.75$ m']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law in action, Seat belts (the numbers are the page''s own)'}
    origin: page-own

  - id: concrete-stop-time
    where: 'graph caption: starting at 8.0 m/s and losing 2.0 m/s every second, the puck stops after 4.0 s'
    inputs: {v: 8.0 m/s, a: 2.0 m/s**2}
    formula: v / a
    expected: 4.0 s
    shown: ['so the puck stops after 4.0 s']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law (friction slows the ball; the numbers are the page''s own)'}
    origin: page-own

  - id: puck-distance
    where: 'worked example "A puck that coasts": 8.0 m/s × 2.5 s = 20 m'
    inputs: {v: 8.0 m/s, t: 2.5 s}
    formula: v * t
    expected: 20 m
    shown: ['8.0\ \text{m/s} \times 2.5\ \text{s} = 20$ m']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law (the ice skater: little friction, keeps moving; the numbers are the page''s own)'}
    origin: page-own

  - id: puck-area
    where: 'same, check: area under the graph 8.0 × 2.5 = 20 m'
    inputs: {v: 8.0 m/s, t: 2.5 s}
    formula: v * t
    expected: 20 m
    shown: ['$8.0 \times 2.5 = 20$ m']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law (the numbers are the page''s own)'}
    origin: page-own

  - id: parachute-air
    where: 'worked example "A parachutist at constant speed": zero resultant, so the air pushes 780 N up'
    inputs: {w: 780 N}
    formula: w
    expected: 780 N
    shown: ['the air must push 780 N up']
    source: {cite: mit, at: 'Sec. 2.3, Forces in equilibrium (the numbers are the page''s own)'}
    origin: page-own

  - id: parachute-unbalanced
    where: 'same, check: with only 700 N of air resistance the resultant would be 780 − 700 = 80 N down'
    inputs: {w: 780 N, f: 700 N}
    formula: w - f
    expected: 80 N
    shown: ['$780 - 700 = 80$ N']
    source: {cite: mit, at: 'Sec. 2.2 and 2.3, resultant force and Forces in equilibrium (the numbers are the page''s own)'}
    origin: page-own

  - id: parachute-diagram-scale
    where: 'free-body diagram: 780 N drawn as 3.9 units (200 N per unit)'
    inputs: {w: 780 N, k: 200 N}
    formula: w / k
    expected: '3.9'
    shown: ['{ x: 0, y: 3.9, label']
    source: {cite: mit, at: 'Sec. 2.3, Forces in equilibrium (drawing scale; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-puck
    where: 'quiz question 2: 4.0 m/s × 6.0 s = 24 m'
    inputs: {v: 4.0 m/s, t: 6.0 s}
    formula: v * t
    expected: 24 m
    shown: ['$4.0 \\times 6.0 = 24$ m']
    source: {cite: mit, at: 'Sec. 2.3, Newton''s first law (the numbers are the page''s own)'}
    origin: page-own

  - id: principia-1687
    kind: fact
    where: 'section "Newton''s first law": the Principia was published in 1687'
    value: 1687
    shown: ['published in his *Principia* in 1687']
    source: {cite: reading1, at: 'Sec. 7.1, first paragraph'}
    origin: mit

  - id: de-motu
    kind: fact
    where: 'section "Does motion need a force?": De Motu, about 1590'
    value: 1590
    shown: ['*De Motu* (about 1590)']
    source: {cite: mactutor-galileo, at: 'biography text: De Motu "around 1590" (date from MacTutor, not from the MIT or Siyavula material)'}
    origin: page-own

  - id: inclined-planes
    kind: fact
    where: 'same: inclined-plane experiments around 1602 to 1604'
    value: 1602
    shown: ['around 1602 to 1604']
    source: {cite: mactutor-galileo, at: 'biography text: return to motion in 1602 and work on inclined planes over the next two years (date from MacTutor, not from the MIT or Siyavula material)'}
    origin: page-own

  - id: voyager-launch
    kind: fact
    where: 'section "Coasting through space": Voyager 1 launched in 1977'
    value: 1977
    shown: ['launched in 1977']
    source: {cite: voyager, at: 'launch date, 5 September 1977'}
    origin: later-data

  - id: voyager-interstellar
    kind: fact
    where: 'same: interstellar space in August 2012'
    value: 2012
    shown: ['in August 2012 became']
    source: {cite: voyager, at: 'crossed into interstellar space in August 2012'}
    origin: later-data

  - id: voyager-speed
    kind: fact
    where: 'same: 17.0 km/s relative to the Sun on 21 August 2024'
    value: 17.0 km/s
    shown: ['On 21 August 2024 it was moving at 17.0 km/s relative to the Sun']
    source: {cite: voyager, at: '17.0 km/second relative to the Sun, as of 21 August 2024'}
    origin: later-data

  - id: voyager-per-year
    where: 'same: at 17.0 km/s it covers about 5.4 × 10^8 km every year'
    inputs: {v: 17.0 km/s, T: 1 year}
    formula: v * T
    expected: 5.4e8 km
    shown: ['$5.4 \times 10^{8}$ km every year']
    source: {cite: voyager, at: 'speed 17.0 km/s times one year (the calculation is the page''s own)'}
    origin: page-own
