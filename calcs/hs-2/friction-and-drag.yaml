  # --- Worked example: getting a crate moving ---
  - id: crate-weight
    where: 'worked example "Getting a crate moving": F_N = 40 × 9.81 ≈ 392 N'
    inputs: {m: 40 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 392 N
    shown: ['$F_N = F_g = m g = 40 \times 9.81 \approx 392$ N']
    source: {cite: mit, at: 'Friction forces (normal force on a flat surface; the numbers are the page''s own)'}
    origin: page-own

  - id: crate-static-max
    where: 'same: μ_s F_N = 0.50 × 392 ≈ 196 N'
    inputs: {mu: 0.50, m: 40 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 196 N
    shown: ['$\mu_s F_N = 0.50 \times 392 \approx 196$ N', '150 N is less than 196 N', 'It is **not** 196 N', '220 N is more than 196 N', 'less than the 196 N needed to start it']
    source: {cite: mit, at: 'Friction forces, Worked example 2 (minimum push = maximum static friction; method; the numbers are the page''s own)'}
    origin: page-own

  - id: crate-static-150
    where: 'same: with a push of 150 N static friction is 150 N (net force zero)'
    inputs: {p: 150 N}
    formula: p
    expected: 150 N
    shown: ['Static friction is then exactly 150 N, backwards']
    source: {cite: mit, at: 'Friction forces (static friction equals the applied force up to its maximum; the numbers are the page''s own)'}
    origin: page-own

  - id: crate-kinetic
    where: 'same: F_f = 0.35 × 392 ≈ 137 N'
    inputs: {mu: 0.35, m: 40 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 137 N
    shown: ['$F_f = \mu_k F_N = 0.35 \times 392 \approx 137$ N']
    source: {cite: mit, at: 'Friction forces (f_k = μ_k N; the numbers are the page''s own)'}
    origin: page-own

  - id: crate-net
    where: 'same: F_net = 220 − 137 ≈ 83 N'
    inputs: {p: 220 N, mu: 0.35, m: 40 kg, ga: 9.81 m/s**2}
    formula: p - mu * m * ga
    expected: 83 N
    shown: ['$F_{\text{net}} = 220 - 137 \approx 83$ N']
    source: {cite: reading1, at: 'Sec. 8.3.2 (kinetic friction in Newton''s second law; the numbers are the page''s own)'}
    origin: page-own

  - id: crate-a
    where: 'same: a = 83/40 ≈ 2.1 m/s²'
    inputs: {p: 220 N, mu: 0.35, m: 40 kg, ga: 9.81 m/s**2}
    formula: (p - mu * m * ga) / m
    expected: 2.1 m/s**2
    shown: ['$a = F_{\text{net}}/m = 83/40 \approx 2.1$ m/s²']
    source: {cite: reading1, at: 'Sec. 8.3.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-keep-moving
    where: 'same, check: a push of 137 N keeps the crate sliding at constant speed'
    inputs: {mu: 0.35, m: 40 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 137 N
    shown: ['a push of only 137 N would keep the crate moving']
    source: {cite: mit, at: 'Friction forces (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-plot-static
    where: 'friction graph: static friction up to 196 N (curve "F <= 196" and caption)'
    inputs: {mu: 0.50, m: 40 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 196 N
    shown: ['At 196 N the crate breaks loose', 'expr: "F <= 196 ? F : NaN"']
    source: {cite: mit, at: 'Friction forces (the numbers are the page''s own)'}
    origin: page-own

  - id: crate-plot-kinetic
    where: 'same graph: kinetic friction 137 N (curve and caption)'
    inputs: {mu: 0.35, m: 40 kg, ga: 9.81 m/s**2}
    formula: mu * m * ga
    expected: 137 N
    shown: ['kinetic friction stays at 137 N, whatever the push', 'expr: "F > 196 ? 137 : NaN"']
    source: {cite: mit, at: 'Friction forces (the numbers are the page''s own)'}
    origin: page-own

  # --- Worked example: skidding to a stop ---
  - id: skid-a-dry
    where: 'worked example "Skidding to a stop": a = 0.70 × 9.81 ≈ 6.9 m/s²'
    inputs: {mu: 0.70, ga: 9.81 m/s**2}
    formula: mu * ga
    expected: 6.9 m/s**2
    shown: ['$a = 0.70 \times 9.81 \approx 6.9$ m/s²']
    source: {cite: mit, at: 'Friction forces (braking hard and skidding: kinetic friction; the numbers are the page''s own)'}
    origin: page-own

  - id: skid-a-wet
    where: 'same: a = 0.40 × 9.81 ≈ 3.9 m/s²'
    inputs: {mu: 0.40, ga: 9.81 m/s**2}
    formula: mu * ga
    expected: 3.9 m/s**2
    shown: ['$a = 0.40 \times 9.81 \approx 3.9$ m/s²']
    source: {cite: mit, at: 'Friction forces (the numbers are the page''s own)'}
    origin: page-own

  - id: skid-d-dry
    where: 'same: Δx = 20²/(2 × 6.87) ≈ 29 m'
    inputs: {v: 20 m/s, mu: 0.70, ga: 9.81 m/s**2}
    formula: v**2 / (2 * mu * ga)
    expected: 29 m
    shown: ['$\Delta x = 20^{2}/(2 \times 6.87) \approx 29$ m']
    source: {cite: reading1, at: 'Sec. 8.3.2 (kinetic friction independent of speed, so constant deceleration; the numbers are the page''s own)'}
    origin: page-own

  - id: skid-d-wet
    where: 'same: Δx = 20²/(2 × 3.92) ≈ 51 m'
    inputs: {v: 20 m/s, mu: 0.40, ga: 9.81 m/s**2}
    formula: v**2 / (2 * mu * ga)
    expected: 51 m
    shown: ['$\Delta x = 20^{2}/(2 \times 3.92) \approx 51$ m']
    source: {cite: reading1, at: 'Sec. 8.3.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: skid-t-dry
    where: 'same, check: the dry stop takes 20/6.87 ≈ 2.9 s'
    inputs: {v: 20 m/s, mu: 0.70, ga: 9.81 m/s**2}
    formula: v / (mu * ga)
    expected: 2.9 s
    shown: ['$20/6.87 \approx 2.9$ s']
    source: {cite: reading1, at: 'Sec. 8.3.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: skid-check-dry
    where: 'same, check: average speed 10 m/s × 2.91 s ≈ 29 m'
    inputs: {v: 10 m/s, u: 2.91 s}
    formula: v * u
    expected: 29 m
    shown: ['$10 \times 2.91 \approx 29$ m again']
    source: {cite: reading1, at: 'Sec. 8.3.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: skid-ratio
    where: 'same, check: 0.70/0.40 = 1.75, the ratio of the stopping distances'
    inputs: {}
    formula: 0.70 / 0.40
    expected: '1.75'
    shown: ['$0.70/0.40 = 1.75$']
    source: {cite: reading1, at: 'Sec. 8.3.2 (the numbers are the page''s own)'}
    origin: page-own

