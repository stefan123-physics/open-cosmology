# Calculations on content/year-0/hs-2/friction-and-drag.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.2 Force, "Friction forces" (mit); MIT 8.01SC course notes Ch. 8
# (reading1): Sec. 8.3.2 friction, Sec. 8.6 drag (Eq. 8.6.1, Table 8.1), Example 8.12 (Eqs. 8.6.111, 8.6.117).
# All example numbers are the page's own (Siyavula's 30 N / 0.34, 10 000 N / 0.78, pram 100 N, 32 N / 8 N and
# 130 N / 0.47 and MIT's Table 8.3 values are not reused). g is written ga in the inputs (g alone is the gram);
# times are written u (s alone is the second).

