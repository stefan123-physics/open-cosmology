  - id: car-speed-kmh
    where: 'same section: 30 m/s is 108 km/h'
    inputs: {v: 30 m/s}
    formula: v
    expected: 108 km/hour
    shown: ['at 30 m/s (108 km/h)']
    source: {cite: reading1, at: 'Sec. 8.6 (unit conversion; the numbers are the page''s own)'}
    origin: page-own

  - id: car-drag-30
    where: 'same section: ½ × 1.2 × 0.30 × 2.2 × 30² ≈ 360 N'
    inputs: {rho: 1.2 kg/m**3, cd: 0.30, a: 2.2 m**2, v: 30 m/s}
    formula: rho * cd * a * v**2 / 2
    expected: 360 N
    shown: ['$\tfrac{1}{2} \times 1.2 \times 0.30 \times 2.2 \times 30^{2} \approx 360$ N']
    source: {cite: reading1, at: 'Sec. 8.6, Eq. (8.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-drag-15
    where: 'same: at 15 m/s a quarter of that, about 89 N'
    inputs: {rho: 1.2 kg/m**3, cd: 0.30, a: 2.2 m**2, v: 15 m/s}
    formula: rho * cd * a * v**2 / 2
    expected: 89 N
    shown: ['a quarter of that, about 89 N']
    source: {cite: reading1, at: 'Sec. 8.6, Eq. (8.6.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: drag-units
    where: 'same section: ρ A v² has units kg/m³ × m² × m²/s² = N, so C_D is dimensionless'
    inputs: {rho: 1 kg/m**3, a: 1 m**2, v: 1 m/s}
    formula: rho * a * v**2
    expected: 1 N
    shown: ['$\text{kg/m}^{3} \times \text{m}^{2} \times \text{m}^{2}/\text{s}^{2} = \text{kg·m/s}^{2} = \text{N}$']
    source: {cite: reading1, at: 'Sec. 8.6 (C_D is a dimensionless number)'}
    origin: mit

  # --- Terminal velocity: the skydiver ---
  - id: sky-mg2
    where: 'worked example "A skydiver": 2 × 90 × 9.81 ≈ 1766 (N)'
    inputs: {m: 90 kg, ga: 9.81 m/s**2}
    formula: 2 * m * ga
    expected: 1766 N
    shown: ['\sqrt{1766/0.90} \approx 44$ m/s']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.111) (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-denominator
    where: 'same: ρ C_D A = 1.2 × 1.0 × 0.75 = 0.90 (kg/m)'
    inputs: {rho: 1.2 kg/m**3, cd: 1.0, a: 0.75 m**2}
    formula: rho * cd * a
    expected: 0.90 kg/m
    shown: ['(1.2 \times 1.0 \times 0.75)} = \sqrt{1766/0.90}']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12 (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-vt
    where: 'same: v_t = √(2 × 90 × 9.81/(1.2 × 1.0 × 0.75)) ≈ 44 m/s'
    inputs: {m: 90 kg, ga: 9.81 m/s**2, rho: 1.2 kg/m**3, cd: 1.0, a: 0.75 m**2}
    formula: sqrt(2 * m * ga / (rho * cd * a))
    expected: 44 m/s
    shown: ['$v_t = \sqrt{2 m g/(\rho C_D A)} = \sqrt{2 \times 90 \times 9.81/(1.2 \times 1.0 \times 0.75)}']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.111) (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-vt-kmh
    where: 'same: 44.3 m/s is about 160 km/h'
    inputs: {m: 90 kg, ga: 9.81 m/s**2, rho: 1.2 kg/m**3, cd: 1.0, a: 0.75 m**2}
    formula: sqrt(2 * m * ga / (rho * cd * a))
    expected: 160 km/hour
    shown: ['about 160 km/h']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12 (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-chute-denominator
    where: 'same: under the parachute ρ C_D A = 1.2 × 1.4 × 30 = 50.4 (kg/m)'
    inputs: {rho: 1.2 kg/m**3, cd: 1.4, a: 30 m**2}
    formula: rho * cd * a
    expected: 50.4 kg/m
    shown: ['$v_t = \sqrt{1766/(1.2 \times 1.4 \times 30)} = \sqrt{1766/50.4}']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12 (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-chute-vt
    where: 'same: v_t = √(1766/50.4) ≈ 5.9 m/s'
    inputs: {m: 90 kg, ga: 9.81 m/s**2, rho: 1.2 kg/m**3, cd: 1.4, a: 30 m**2}
    formula: sqrt(2 * m * ga / (rho * cd * a))
    expected: 5.9 m/s
    shown: ['\sqrt{1766/50.4} \approx 5.9$ m/s']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.111) (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-check-drag
    where: 'same, check: drag at 44.3 m/s is ½ × 1.2 × 1.0 × 0.75 × 44.3² ≈ 883 N'
    inputs: {rho: 1.2 kg/m**3, cd: 1.0, a: 0.75 m**2, v: 44.3 m/s}
    formula: rho * cd * a * v**2 / 2
    expected: 883 N
    shown: ['$\tfrac{1}{2} \times 1.2 \times 1.0 \times 0.75 \times 44.3^{2} \approx 883$ N']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12 (drag balances gravity at terminal velocity; the numbers are the page''s own)'}
    origin: page-own

  - id: sky-check-weight
    where: 'same, check: weight 90 × 9.81 ≈ 883 N'
    inputs: {m: 90 kg, ga: 9.81 m/s**2}
    formula: m * ga
    expected: 883 N
    shown: ['$90 \times 9.81 \approx 883$ N']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12 (the numbers are the page''s own)'}
    origin: page-own

  - id: sky-vt-units
    where: 'same, check: √(N/(kg/m³ × m²)) is m/s'
    inputs: {f: 1 N, rho: 1 kg/m**3, a: 1 m**2}
    formula: sqrt(f / (rho * a))
    expected: 1 m/s
    shown: ['= \sqrt{\text{m}^{2}/\text{s}^{2}} = $ m/s']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.111)'}
    origin: page-own

  - id: sky-timescale
    where: 'section "Terminal velocity": time scale v_t/g ≈ 4.5 s for the skydiver'
    inputs: {m: 90 kg, ga: 9.81 m/s**2, rho: 1.2 kg/m**3, cd: 1.0, a: 0.75 m**2}
    formula: sqrt(2 * m * ga / (rho * cd * a)) / ga
    expected: 4.5 s
    shown: ['about 4.5 s for the skydiver']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.117) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-v5
    where: 'graph caption: with v_t = 44 m/s, about 35 m/s after 5 s (v = v_t tanh(g t/v_t), written with exponentials)'
    inputs: {vt: 44 m/s, ga: 9.81 m/s**2, u: 5 s}
    formula: vt * (1 - exp(-2 * ga * u / vt)) / (1 + exp(-2 * ga * u / vt))
    expected: 35 m/s
    shown: ['she reaches about 35 m/s after 5 s', 'vt: { value: 44, min: 10, max: 60']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.117) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-v10
    where: 'same caption: 43 m/s after 10 s'
    inputs: {vt: 44 m/s, ga: 9.81 m/s**2, u: 10 s}
    formula: vt * (1 - exp(-2 * ga * u / vt)) / (1 + exp(-2 * ga * u / vt))
    expected: 43 m/s
    shown: ['and 43 m/s, about 98% of v_t, after 10 s']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.117) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-v10-fraction
    where: 'same caption: about 98% of v_t after 10 s'
    inputs: {vt: 44 m/s, ga: 9.81 m/s**2, u: 10 s}
    formula: 100 * (1 - exp(-2 * ga * u / vt)) / (1 + exp(-2 * ga * u / vt))
    expected: '98'
    shown: ['about 98% of v_t']
    source: {cite: reading1, at: 'Sec. 8.7, Example 8.12, Eq. (8.6.117) (the numbers are the page''s own)'}
    origin: page-own

