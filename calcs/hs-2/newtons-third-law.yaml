# Calculations on content/year-0/hs-2/newtons-third-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 2.3 Newton's laws (third law); MIT 8.01SC Course Notes Ch. 7, Sec. 7.3 and 7.4;
# NASA Moon and Earth Fact Sheets. All numbers are the page's own except the masses and orbit of the Moon and the Earth (NASA).
# Siyavula's third-law examples (book against a wall, seat belt, lift, fly on a windscreen, balloon rocket) are qualitative;
# MIT Sec. 7.4 is symbolic, so no source numbers could be reused.

page: content/year-0/hs-2/newtons-third-law.mdx
calcs:
  # Quiz
  - id: quiz-hammer
    where: 'quiz 1: the nail pushes back on the hammer with 500 N'
    inputs: {F: 500 N}
    formula: F
    expected: 500 N
    shown: ['the nail pushes back on the hammer with 500 N']
    quiz: 0
    source: {cite: reading1, at: 'Sec. 7.4, Eq. (7.4.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-skater-daan
    where: 'quiz 3: Daan gets 120/60 = 2.0 m/s²'
    inputs: {F: 120 N, m: 60 kg}
    formula: F / m
    expected: 2.0 m/s**2
    shown: ['Daan gets $120/60 = 2.0$ m/s²']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5), with Sec. 7.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-skater-lotte
    where: 'quiz 3: Lotte gets 120/40 = 3.0 m/s²'
    inputs: {F: 120 N, m: 40 kg}
    formula: F / m
    expected: 3.0 m/s**2
    shown: ['Lotte $120/40 = 3.0$ m/s²']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5), with Sec. 7.4 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-skater-wrong
    where: 'quiz 3, distractor: 120 N over the total mass 100 kg gives 1.2 m/s²'
    inputs: {F: 120 N, m1: 60 kg, m2: 40 kg}
    formula: F / (m1 + m2)
    expected: 1.2 m/s**2
    shown: ['the total mass, 100 kg, gives 1.2 m/s²']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5) (the numbers are the page''s own)'}
    origin: page-own

  # Worked example: two trolleys
  - id: trolley-force-on-a
    where: 'worked example "Two trolleys colliding": B pushes on A with 6.0 N'
    inputs: {F: 6.0 N}
    formula: F
    expected: 6.0 N
    shown: ['B pushes on A with 6.0 N']
    source: {cite: reading1, at: 'Sec. 7.4, Eq. (7.4.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-a-a
    where: 'same: a_A = 6.0 N / 0.50 kg = 12 m/s²'
    inputs: {F: 6.0 N, m: 0.50 kg}
    formula: F / m
    expected: 12 m/s**2
    shown: ['$a_A = \dfrac{6.0\ \text{N}}{0.50\ \text{kg}} = 12\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-a-b
    where: 'same: a_B = 6.0 N / 1.5 kg = 4.0 m/s²'
    inputs: {F: 6.0 N, m: 1.5 kg}
    formula: F / m
    expected: 4.0 m/s**2
    shown: ['$a_B = \dfrac{6.0\ \text{N}}{1.5\ \text{kg}} = 4.0\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: trolley-check
    where: 'same, check: B has three times the mass, 12/3 = 4.0 m/s²'
    inputs: {aA: 12 m/s**2, mA: 0.50 kg, mB: 1.5 kg}
    formula: aA * mA / mB
    expected: 4.0 m/s**2
    shown: ['$12/3 = 4.0$ m/s²']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5) with Sec. 7.4, Eq. (7.4.1) (the numbers are the page''s own)'}
    origin: page-own

  # Worked example: the Earth and the Moon
  - id: moon-a
    where: 'text before the worked example: the Moon''s centripetal acceleration about 2.7 × 10⁻³ m/s² (computed in Lesson 1.10)'
    inputs: {r: 384400 km, T: 27.3 day}
    formula: 4 * pi**2 * r / T**2
    expected: 2.7e-3 m/s**2
    shown: ['centripetal acceleration of about $2.7 \times 10^{-3}$ m/s² towards the Earth']
    source: {cite: moonfact, at: 'Orbital parameters, semimajor axis and revolution period (a = v²/r is the page''s own arithmetic, as in Lesson 1.10)'}
    origin: page-own

  - id: moon-mass
    kind: fact
    where: 'worked example "The Earth and the Moon": the Moon''s mass 7.35 × 10²² kg'
    value: 7.35e22 kg
    shown: ['The Moon has a mass of $7.35 \times 10^{22}$ kg']
    source: {cite: moonfact, at: 'Bulk parameters, mass 0.07346 × 10²⁴ kg'}
    origin: later-data

  - id: earth-mass
    kind: fact
    where: 'same: the Earth''s mass 5.97 × 10²⁴ kg'
    value: 5.97e24 kg
    shown: ['the Earth $5.97 \times 10^{24}$ kg (NASA fact sheets)']
    source: {cite: earthfact, at: 'Bulk parameters, mass 5.9722 × 10²⁴ kg'}
    origin: later-data

  - id: moon-force
    where: 'same: F = 7.35 × 10²² kg × 2.7 × 10⁻³ m/s² ≈ 2.0 × 10²⁰ N'
    inputs: {m: 7.35e22 kg, a: 2.7e-3 m/s**2}
    formula: m * a
    expected: 2.0e20 N
    shown: ['2.7 \times 10^{-3}\ \text{m/s}^2 \approx 2.0 \times 10^{20}$ N, towards the Earth']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5), with the NASA Moon Fact Sheet mass (the arithmetic is the page''s own)'}
    origin: page-own

  - id: earth-force
    where: 'same: the Moon pulls the Earth with the same 2.0 × 10²⁰ N'
    inputs: {F: 2.0e20 N}
    formula: F
    expected: 2.0e20 N
    shown: ['the Moon pulls the Earth with the same $2.0 \times 10^{20}$ N']
    source: {cite: reading1, at: 'Sec. 7.4, Eq. (7.4.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: moon-force-unrounded
    where: 'same, step "The Earth''s acceleration": the force before rounding, 7.35 × 10²² kg × 2.7 × 10⁻³ m/s² = 1.98 × 10²⁰ N'
    inputs: {m: 7.35e22 kg, a: 2.7e-3 m/s**2}
    formula: m * a
    expected: 1.98e20 N
    shown: ['the force before rounding, 1.98 × 10²⁰ N']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5), with the NASA Moon Fact Sheet mass (the arithmetic is the page''s own)'}
    origin: page-own

  - id: earth-a
    where: 'same: a_Earth = force / 5.97 × 10²⁴ kg ≈ 3.3 × 10⁻⁵ m/s² (computed from the unrounded force)'
    inputs: {m: 7.35e22 kg, a: 2.7e-3 m/s**2, M: 5.97e24 kg}
    formula: m * a / M
    expected: 3.3e-5 m/s**2
    shown: ['{5.97 \times 10^{24}\ \text{kg}} \approx 3.3 \times 10^{-5}$ m/s²']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5), with the NASA Earth Fact Sheet mass (the arithmetic is the page''s own)'}
    origin: page-own

  - id: mass-ratio
    where: 'same, check: the Earth is about 81 times as massive as the Moon'
    inputs: {M: 5.97e24 kg, m: 7.35e22 kg}
    formula: M / m
    expected: '81'
    shown: ['The Earth is about 81 times as massive as the Moon']
    source: {cite: moonfact, at: 'Bulk parameters, mass (the ratio is the page''s own arithmetic)'}
    origin: page-own

  - id: earth-a-check
    where: 'same, check: 2.7 × 10⁻³ / 81 ≈ 3.3 × 10⁻⁵ m/s²'
    inputs: {a: 2.7e-3 m/s**2}
    formula: a / 81
    expected: 3.3e-5 m/s**2
    shown: ['$2.7 \times 10^{-3}/81 \approx 3.3 \times 10^{-5}$ m/s²']
    source: {cite: reading1, at: 'Sec. 7.3, Eq. (7.3.5) with Sec. 7.4, Eq. (7.4.1) (the numbers are the page''s own)'}
    origin: page-own

  - id: moon-force-correction
    where: 'same, check: taking the Earth''s motion into account changes the force by only about 1 % (fraction m/(M + m) of the Moon''s acceleration)'
    inputs: {M: 5.97e24 kg, m: 7.35e22 kg}
    formula: 100 * m / (M + m)
    expected: '1'
    shown: ['changes the force by only about 1 %']
    source: {cite: reading1, at: 'Sec. 7.4, Eq. (7.4.1) (the two-body correction is the page''s own arithmetic, not in the source)'}
    origin: page-own
