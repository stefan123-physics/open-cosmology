# Calculations on content/year-0/hs-2/towards-the-universe-weighing-with-orbits.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Gr 11 2.4 (law of universal gravitation, G = 6.67 × 10⁻¹¹); MIT 8.01SC Course Notes Ch. 9 (Eq. 9.2.7);
# MIT 8.902 Lecture 1 notes (eqs. 22–23); NASA fact sheets (Earth, Sun, Jupiter, Jovian satellites); NASA Science "Sun: Facts"
# and "Dark Matter"; NIST CODATA (G). All worked examples use the page's own numbers or rounded NASA values; the sources'
# own examples (Siyavula: 80 kg and 65 kg people, Earth–Moon; MIT: the Moon's period; Ferreras page: Io) are not reused.

page: content/year-0/hs-2/towards-the-universe-weighing-with-orbits.mdx
calcs:
  # Section "An orbit is a scale"
  - id: G-school
    kind: fact
    where: 'section "An orbit is a scale": G = 6.67 × 10⁻¹¹ N m²/kg² (Siyavula value)'
    value: 6.67e-11
    shown: ['$G = 6.67 \times 10^{-11}$ N m²/kg², the value the Siyavula page gives']
    source: {cite: mit, at: 'Newton''s law of universal gravitation'}
    origin: mit

  - id: G-codata
    kind: fact
    where: 'same: CODATA lists 6.674 30 × 10⁻¹¹'
    value: 6.67430e-11
    shown: ['$6.674\,30 \times 10^{-11}$']
    source: {cite: nist-G, at: 'CODATA recommended value of G'}
    origin: later-data

  # Worked example "The Earth's orbit weighs the Sun"
  - id: earth-r-rounded
    where: 'worked example: Earth–Sun distance 1.50 × 10¹¹ m (NASA 149.598 × 10⁶ km, rounded)'
    inputs: {d: 149.598e6 km}
    formula: d
    expected: 1.50e11 m
    shown: ['The Earth circles the Sun at a distance of $1.50 \times 10^{11}$ m']
    source: {cite: earthfact, at: 'semimajor axis 149.598 × 10⁶ km'}
    origin: later-data

  - id: year-seconds
    where: 'same: one year is 3.156 × 10⁷ s (NASA sidereal period 365.256 days)'
    inputs: {u: 365.256 day}
    formula: u
    expected: 3.156e7 s
    shown: ['takes one year ($3.156 \times 10^{7}$ s) for one orbit']
    source: {cite: earthfact, at: 'sidereal orbit period 365.256 days (the conversion is the page''s own)'}
    origin: page-own

  - id: earth-r-cubed
    where: 'same: (1.50 × 10¹¹ m)³ = 3.375 × 10³³ m³'
    inputs: {r: 1.50e11 m}
    formula: r**3
    expected: 3.375e33 m**3
    shown: ['= 3.375 \times 10^{33}$ m³']
    source: {cite: reading1, at: 'Sec. 9.2.2, Eq. (9.2.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: year-squared
    where: 'same: (3.156 × 10⁷ s)² = 9.960 × 10¹⁴ s²'
    inputs: {T: 3.156e7 s}
    formula: T**2
    expected: 9.960e14 s**2
    shown: ['= 9.960 \times 10^{14}$ s²']
    source: {cite: reading1, at: 'Sec. 9.2.2, Eq. (9.2.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: sun-mass
    where: 'same: M = 4π² r³/(G T²) = 2.01 × 10³⁰ kg'
    inputs: {r: 1.50e11 m, T: 3.156e7 s, Gc: 6.67e-11 N*m**2/kg**2}
    formula: 4 * pi**2 * r**3 / (Gc * T**2)
    expected: 2.01e30 kg
    shown: ['= 2.01 \times 10^{30}$ kg.']
    source: {cite: reading1, at: 'Sec. 9.2.2, Eq. (9.2.7) solved for the central mass (the numbers are the page''s own)'}
    origin: page-own

  - id: sun-mass-nasa
    kind: fact
    where: 'same: NASA Sun Fact Sheet lists 1.9884 × 10³⁰ kg'
    value: 1.9884e30
    shown: ['lists $1.9884 \times 10^{30}$ kg']
    source: {cite: sunfact, at: 'mass 1 988 400 × 10²⁴ kg'}
    origin: later-data

  - id: sun-mass-within-1pc
    where: 'same: our value lands within 1% of NASA''s'
    inputs: {r: 1.50e11 m, T: 3.156e7 s, Gc: 6.67e-11 N*m**2/kg**2, Ms: 1.9884e30 kg}
    formula: 100 * (4 * pi**2 * r**3 / (Gc * T**2) / Ms - 1)
    expected: '0.86'
    tolerance: 0.1
    shown: ['lands within 1%: the Sun']
    source: {cite: sunfact, at: 'the page''s own comparison'}
    origin: page-own

  - id: sun-over-earth
    where: 'same: the Sun is about 330 000 times heavier than the Earth (NASA 1.9884 × 10³⁰ / 5.9722 × 10²⁴)'
    inputs: {Ms: 1.9884e30 kg, Me: 5.9722e24 kg}
    formula: Ms / Me
    expected: '330000'
    tolerance: '1%'
    shown: ['about 330 000 times heavier than the Earth']
    source: {cite: earthfact, at: 'Bulk parameters: mass 5.9722 × 10²⁴ kg (the ratio is the page''s own)'}
    origin: page-own

  - id: earth-speed
    where: 'same, check: v = 2πr/T = 2.99 × 10⁴ m/s'
    inputs: {r: 1.50e11 m, T: 3.156e7 s}
    formula: 2 * pi * r / T
    expected: 2.99e4 m/s
    shown: ['/ 3.156 \times 10^{7} = 2.99 \times 10^{4}$ m/s']
    source: {cite: reading1, at: 'Sec. 9.2.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: earth-speed-nasa
    kind: fact
    where: 'same: NASA Earth Fact Sheet mean orbital velocity 29.78 km/s'
    value: 29.78
    shown: ['close to the 29.78 km/s of the NASA']
    source: {cite: earthfact, at: 'mean orbital velocity 29.78 km/s'}
    origin: later-data

  - id: sun-mass-speed-route
    where: 'same, check: M = v² r/G with v = 2.99 × 10⁴ m/s gives 2.0 × 10³⁰ kg'
    inputs: {v: 2.99e4 m/s, r: 1.50e11 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: v**2 * r / Gc
    expected: 2.0e30 kg
    shown: ['gives $2.0 \times 10^{30}$ kg again']
    source: {cite: reading2, at: 'eq. (22), p. 10, solved for M (the numbers are the page''s own)'}
    origin: page-own

  # Worked example "Ganymede weighs Jupiter"
  - id: ganymede-r
    where: 'worked example: Ganymede at 1.07 × 10⁹ m (NASA 1070.4 × 10³ km, rounded)'
    inputs: {d: 1070.4e3 km}
    formula: d
    expected: 1.07e9 m
    shown: ['orbits at $1.07 \times 10^{9}$ m from Jupiter''s centre']
    source: {cite: jovsat, at: 'Ganymede: semimajor axis 1070.4 × 10³ km'}
    origin: later-data

  - id: ganymede-T-days
    where: 'same: 7.15 days per orbit (NASA 7.154553 days, rounded)'
    inputs: {u: 7.154553 day}
    formula: u
    expected: 7.15 day
    shown: ['takes 7.15 days per orbit']
    source: {cite: jovsat, at: 'Ganymede: orbital period 7.154553 days'}
    origin: later-data

  - id: ganymede-T
    where: 'same: 7.15 × 24 × 3600 s = 6.18 × 10⁵ s'
    inputs: {u: 7.15 day}
    formula: u
    expected: 6.18e5 s
    shown: ['$T = 7.15 \times 24 \times 3600\ \text{s} = 6.18 \times 10^{5}$ s']
    source: {cite: jovsat, at: 'the conversion is the page''s own'}
    origin: page-own

  - id: jupiter-mass
    where: 'same: M = 4π² r³/(G T²) = 1.90 × 10²⁷ kg'
    inputs: {r: 1.07e9 m, T: 6.18e5 s, Gc: 6.67e-11 N*m**2/kg**2}
    formula: 4 * pi**2 * r**3 / (Gc * T**2)
    expected: 1.90e27 kg
    shown: ['= 1.90 \times 10^{27}$ kg.']
    source: {cite: reading1, at: 'Sec. 9.2.2, Eq. (9.2.7) solved for the central mass (the numbers are the page''s own)'}
    origin: page-own

  - id: jupiter-mass-nasa
    kind: fact
    where: 'same: NASA Jupiter Fact Sheet 1898.13 × 10²⁴ kg'
    value: 1898.13e24
    shown: ['lists $1898.13 \times 10^{24}$ kg']
    source: {cite: jupfact, at: 'mass 1898.13 × 10²⁴ kg'}
    origin: later-data

  - id: sun-over-jupiter
    where: 'same: Jupiter is about 1050 times lighter than the Sun'
    inputs: {Ms: 1.9884e30 kg, Mj: 1898.13e24 kg}
    formula: Ms / Mj
    expected: '1050'
    tolerance: '1%'
    shown: ['still about 1050 times lighter than the Sun']
    source: {cite: jupfact, at: 'the ratio is the page''s own (Sun Fact Sheet and Jupiter Fact Sheet)'}
    origin: page-own

  - id: ganymede-speed
    where: 'same, check: v = √(GM/r) ≈ 1.09 × 10⁴ m/s, about 11 km/s'
    inputs: {M: 1.90e27 kg, r: 1.07e9 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: sqrt(Gc * M / r)
    expected: 1.09e4 m/s
    shown: ['\approx 1.09 \times 10^{4}$ m/s, about 11 km/s']
    source: {cite: reading2, at: 'eq. (22), p. 10 (the numbers are the page''s own)'}
    origin: page-own

  # Section "Weighing the Milky Way"
  - id: sun-galactic-speed
    kind: fact
    where: 'section "Weighing the Milky Way": average speed about 720 000 km/h'
    value: 720000
    shown: ['at an average speed of about 720 000 km/h and takes']
    source: {cite: sunfacts, at: 'Orbit and Rotation'}
    origin: later-data

  - id: sun-galactic-period
    kind: fact
    where: 'same: about 230 million years per trip'
    value: 230e6
    shown: ['takes about 230 million years per trip']
    source: {cite: sunfacts, at: 'Orbit and Rotation'}
    origin: later-data

  - id: galaxy-speed-si
    where: 'worked example "The Sun''s orbit weighs the Galaxy": 720 000 km/h = 2.0 × 10⁵ m/s'
    inputs: {v: 720000 km/hour}
    formula: v
    expected: 2.0e5 m/s
    shown: ['\text{m} / 3600\ \text{s} = 2.0 \times 10^{5}$ m/s, or 200 km/s']
    source: {cite: sunfacts, at: 'Orbit and Rotation (the conversion is the page''s own)'}
    origin: page-own

  - id: galaxy-radius
    where: 'same: r = vT/(2π) = 2.3 × 10²⁰ m'
    inputs: {v: 2.0e5 m/s, T: 230e6 year}
    formula: v * T / (2 * pi)
    expected: 2.3e20 m
    shown: ['{2\pi} = 2.3 \times 10^{20}$ m']
    source: {cite: reading1, at: 'Sec. 9.2.1, v = 2πr/T (the numbers are the page''s own)'}
    origin: page-own

  - id: galaxy-radius-ly
    where: 'same: 2.3 × 10²⁰ m / 9.46 × 10¹⁵ m ≈ 24 000 light-years'
    inputs: {d: 2.3e20 m, L: 9.46e15 m}
    formula: d / L
    expected: '24000'
    tolerance: '2%'
    shown: ['\approx 24\,000$ light-years']
    source: {cite: sunfacts, at: 'the page''s own conversion'}
    origin: page-own

  - id: galaxy-mass
    where: 'same: M = v² r/G = 1.4 × 10⁴¹ kg'
    inputs: {v: 2.0e5 m/s, r: 2.3e20 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: v**2 * r / Gc
    expected: 1.4e41 kg
    shown: ['= 1.4 \times 10^{41}$ kg. Divided']
    source: {cite: reading2, at: 'eq. (22), p. 10, solved for M (the numbers are the page''s own)'}
    origin: page-own

  - id: galaxy-sun-masses
    where: 'same: 1.4 × 10⁴¹ / 1.99 × 10³⁰ ≈ 7 × 10¹⁰ Sun masses, roughly 10¹¹'
    inputs: {v: 2.0e5 m/s, r: 2.3e20 m, Gc: 6.67e-11 N*m**2/kg**2, Ms: 1.99e30 kg}
    formula: v**2 * r / Gc / Ms
    expected: '7e10'
    tolerance: '2%'
    shown: ['about $7 \times 10^{10}$ Sun masses']
    source: {cite: sunfact, at: 'the page''s own comparison'}
    origin: page-own

  - id: galaxy-accel
    where: 'same, check: v²/r ≈ 1.7 × 10⁻¹⁰ m/s²'
    inputs: {v: 2.0e5 m/s, r: 2.31e20 m}
    formula: v**2 / r
    expected: 1.7e-10 m/s**2
    shown: ['about $1.7 \times 10^{-10}$ m/s², the same']
    source: {cite: reading1, at: 'Sec. 9.2.1 (the numbers are the page''s own)'}
    origin: page-own

  # Section "Rotation curves"
  - id: kepler-quarter-speed
    where: 'section "Rotation curves": four times farther out, half the speed'
    inputs: {}
    formula: 1 / sqrt(4)
    expected: '0.5'
    shown: ['Four times farther out, half the speed.']
    source: {cite: reading2, at: 'eq. (22), p. 10 (v_c ∝ r^(−1/2))'}
    origin: page-own

  - id: plot-sun-point
    where: 'plot: the Sun at 24 thousand light-years and 200 km/s, on both curves (200 √(24/24) = 200)'
    inputs: {}
    formula: 200 * sqrt(24 / 24)
    expected: '200'
    shown: ['{ x: 24, y: 200, label: "Sun" }']
    source: {cite: sunfacts, at: 'the page''s own values from the Milky Way example'}
    origin: page-own

  # Worked example "How much is missing?"
  - id: cloud-kepler
    where: 'worked example "How much is missing?" (a): 220/2 = 110 km/s'
    inputs: {v: 220 km/s, r1: 20000 ly, r2: 80000 ly}
    formula: v * sqrt(r1 / r2)
    expected: 110 km/s
    shown: ['$220/2 = 110$ km/s']
    source: {cite: reading2, at: 'eq. (22), p. 10 (the numbers are the page''s own)'}
    origin: page-own

  - id: cloud-radius
    where: 'same (c): 80 000 × 9.46 × 10¹⁵ m = 7.57 × 10²⁰ m'
    inputs: {L: 9.46e15 m}
    formula: 80000 * L
    expected: 7.57e20 m
    shown: ['= 7.57 \times 10^{20}$ m and']
    source: {cite: reading2, at: 'the page''s own conversion'}
    origin: page-own

  - id: cloud-mass
    where: 'same (c): M = (2.2 × 10⁵)² × 7.57 × 10²⁰ / 6.67 × 10⁻¹¹ = 5.5 × 10⁴¹ kg'
    inputs: {v: 2.2e5 m/s, r: 7.57e20 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: v**2 * r / Gc
    expected: 5.5e41 kg
    shown: ['= 5.5 \times 10^{41}$ kg, about']
    source: {cite: reading2, at: 'eq. (22), p. 10, solved for M (the numbers are the page''s own)'}
    origin: page-own

  - id: cloud-sun-masses
    where: 'same (c): about 2.8 × 10¹¹ Sun masses'
    inputs: {v: 2.2e5 m/s, r: 7.57e20 m, Gc: 6.67e-11 N*m**2/kg**2, Ms: 1.99e30 kg}
    formula: v**2 * r / Gc / Ms
    expected: '2.8e11'
    shown: ['about $2.8 \times 10^{11}$ Sun masses']
    source: {cite: sunfact, at: 'the page''s own comparison'}
    origin: page-own

  - id: star-radius
    where: 'same, check: 20 000 light-years is 1.89 × 10²⁰ m'
    inputs: {L: 9.46e15 m}
    formula: 20000 * L
    expected: 1.89e20 m
    shown: ['\times 1.89 \times 10^{20}']
    source: {cite: reading2, at: 'the page''s own conversion'}
    origin: page-own

  - id: star-mass
    where: 'same, check: mass inside the star''s orbit 1.4 × 10⁴¹ kg; four times that is 5.5 × 10⁴¹ kg'
    inputs: {v: 2.2e5 m/s, r: 1.89e20 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: v**2 * r / Gc
    expected: 1.4e41 kg
    shown: ['= 1.4 \times 10^{41}$ kg, and four times']
    source: {cite: reading2, at: 'eq. (22), p. 10, solved for M (the numbers are the page''s own)'}
    origin: page-own

  - id: star-mass-times-4
    where: 'same, check: four times the star''s value'
    inputs: {v: 2.2e5 m/s, r: 1.89e20 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: 4 * v**2 * r / Gc
    expected: 5.5e41 kg
    shown: ['four times that is $5.5 \times 10^{41}$ kg']
    source: {cite: reading2, at: 'the page''s own check'}
    origin: page-own

  # Dark matter history
  - id: zwicky-year
    kind: fact
    where: 'section "Dark matter": Zwicky, Coma Cluster, 1933'
    value: 1933
    shown: ['In 1933 the Swiss-born astronomer Fritz Zwicky']
    source: {cite: nasa-dm, at: 'history of dark matter: the paragraph on Fritz Zwicky and the Coma Cluster'}
    origin: later-data

  - id: rubin-decade
    kind: fact
    where: 'same: Vera Rubin, 1970s'
    value: 1970
    shown: ['In the 1970s the American astronomer Vera Rubin']
    source: {cite: nasa-dm, at: 'history of dark matter: the paragraph on Vera Rubin and spiral galaxies'}
    origin: later-data

  # Quiz, flashcards, summary
  - id: quiz-planet-mass
    where: 'quiz 2: M = (1.0 × 10³)² × 3.0 × 10⁸ / 6.67 × 10⁻¹¹ = 4.5 × 10²⁴ kg'
    inputs: {v: 1.0 km/s, r: 3.0e8 m, Gc: 6.67e-11 N*m**2/kg**2}
    formula: v**2 * r / Gc
    expected: 4.5e24 kg
    shown: ['/ 6.67 \\times 10^{-11} = 4.5 \\times 10^{24}$ kg, a little']
    source: {cite: reading2, at: 'eq. (22), p. 10, solved for M (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-planet-mass-kms
    where: 'quiz 2, distractor: with v left in km/s, 4.5 × 10¹⁸ (a million times too small)'
    inputs: {}
    formula: 1.0**2 * 3.0e8 / 6.67e-11
    expected: '4.5e18'
    shown: ['"$4.5 \\times 10^{18}$ kg"']
    source: {cite: reading2, at: 'the page''s own distractor'}
    origin: page-own

  - id: quiz-planet-times-G
    where: 'quiz 2, distractor: multiplying by G, (1.0 × 10³)² × 3.0 × 10⁸ × 6.67 × 10⁻¹¹ = 2.0 × 10⁴'
    inputs: {}
    formula: (1.0e3)**2 * 3.0e8 * 6.67e-11
    expected: '2.0e4'
    shown: ['"$2.0 \\times 10^{4}$ kg"']
    source: {cite: reading2, at: 'the page''s own distractor'}
    origin: page-own

  - id: quiz-planet-over-r
    where: 'quiz 2, distractor: dividing by r, (1.0 × 10³)² / (3.0 × 10⁸ × 6.67 × 10⁻¹¹) = 5.0 × 10⁷'
    inputs: {}
    formula: (1.0e3)**2 / (3.0e8 * 6.67e-11)
    expected: '5.0e7'
    shown: ['"$5.0 \\times 10^{7}$ kg"']
    source: {cite: reading2, at: 'the page''s own distractor'}
    origin: page-own

  - id: quiz-period-twice
    where: 'quiz 3: same r, twice the period, so M ∝ 1/T² gives a quarter of the mass'
    inputs: {}
    formula: 1 / 2**2
    expected: '0.25'
    shown: ['twice the period gives a quarter of the mass']
    source: {cite: reading1, at: 'Sec. 9.2.2, Eq. (9.2.7), p. 9-6 (the numbers are the page''s own)'}
    origin: page-own
