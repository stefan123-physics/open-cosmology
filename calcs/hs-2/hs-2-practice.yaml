  # Problem 1: adding forces with components
  - id: p1-F1x
    where: 'Problem 1(a): 2400 cos 30° = 2078 N'
    inputs: {}
    formula: 2400 * cos(30 * pi / 180)
    expected: '2078'
    shown: ['$F_{1,x} = 2400 \cos 30^{\circ} = 2078$ N']
    source: {cite: reading1, at: '2.2, Resolving forces into components (our own numbers)'}
    origin: page-own

  - id: p1-F2x
    where: 'Problem 1(a): 1800 cos 20° = 1691 N'
    inputs: {}
    formula: 1800 * cos(20 * pi / 180)
    expected: '1691'
    shown: ['$F_{2,x} = 1800 \cos 20^{\circ} = 1691$ N']
    source: {cite: reading1, at: '2.2, Resolving forces into components (our own numbers)'}
    origin: page-own

  - id: p1-a
    answer: p1-a
    where: 'Problem 1(a): 2078 + 1691 = 3770 N east'
    inputs: {F1: 2400 N, F2: 1800 N, u: 1 N}
    formula: (F1 * cos(30 * pi / 180) + F2 * cos(20 * pi / 180)) / u
    expected: '3770'
    shown: ['$F_{\text{net},x} = 2078 + 1691 = 3770$ N']
    source: {cite: reading1, at: '2.2, Resultant force (components added; our own problem)'}
    origin: page-own

  - id: p1-sum
    where: 'Problem 1(a), check: 2400 + 1800 = 4200 N'
    inputs: {}
    formula: 2400 + 1800
    expected: '4200'
    shown: ['$2400 + 1800 = 4200$ N']
    source: {cite: reading1, at: '2.2, Resultant force (our own solution)'}
    origin: page-own

  - id: p1-F1y
    where: 'Problem 1(b): 2400 sin 30° = +1200 N'
    inputs: {}
    formula: 2400 * sin(30 * pi / 180)
    expected: '1200'
    shown: ['$F_{1,y} = 2400 \sin 30^{\circ} = +1200$ N']
    source: {cite: reading1, at: '2.2, Resolving forces into components (our own numbers)'}
    origin: page-own

  - id: p1-F2y
    where: 'Problem 1(b): −1800 sin 20° = −615.6 N'
    inputs: {}
    formula: -1800 * sin(20 * pi / 180)
    expected: '-615.6'
    shown: ['$F_{2,y} = -1800 \sin 20^{\circ} = -615.6$ N']
    source: {cite: reading1, at: '2.2, Resolving forces into components (our own numbers)'}
    origin: page-own

  - id: p1-y
    where: 'Problem 1(b): 1200 − 615.6 = 584.4 N'
    inputs: {}
    formula: 2400 * sin(30 * pi / 180) - 1800 * sin(20 * pi / 180)
    expected: '584.4'
    shown: ['$F_{\text{net},y} = 1200 - 615.6 = 584.4$ N']
    source: {cite: reading1, at: '2.2, Resultant force (our own solution)'}
    origin: page-own

  - id: p1-b-unrounded
    where: 'Problem 1(b): √(3770² + 584.4²) = 3815 N'
    inputs: {}
    formula: sqrt(3770**2 + 584.4**2)
    expected: '3815'
    shown: ['$F_\text{net} = \sqrt{3770^{2} + 584.4^{2}} = 3815$ N']
    source: {cite: reading1, at: '2.2, Resultant force (our own solution)'}
    origin: page-own

  - id: p1-b
    answer: p1-b
    where: 'Problem 1(b): size of the resultant about 3810 N'
    inputs: {F1: 2400 N, F2: 1800 N, u: 1 N}
    formula: sqrt((F1 * cos(30 * pi / 180) + F2 * cos(20 * pi / 180))**2 + (F1 * sin(30 * pi / 180) - F2 * sin(20 * pi / 180))**2) / u
    expected: '3810'
    shown: ['or about 3810 N']
    source: {cite: reading1, at: '2.2, Resultant force (our own problem)'}
    origin: page-own

  - id: p1-tan
    where: 'Problem 1(c): tan θ = 584.4/3770 = 0.155'
    inputs: {}
    formula: 584.4 / 3770
    expected: '0.155'
    shown: ['$\tan\theta = 584.4/3770 = 0.155$']
    source: {cite: reading1, at: '2.2, Resultant force (direction of the resultant; our own solution)'}
    origin: page-own

  - id: p1-c
    answer: p1-c
    where: 'Problem 1(c): θ = 8.8° north of east'
    inputs: {}
    formula: atan((2400 * sin(30 * pi / 180) - 1800 * sin(20 * pi / 180)) / (2400 * cos(30 * pi / 180) + 1800 * cos(20 * pi / 180))) * 180 / pi
    expected: '8.8'
    shown: ['so $\theta = 8.8^{\circ}$ north of east']
    source: {cite: reading1, at: '2.2, Resultant force (our own problem)'}
    origin: page-own

  # Problem 2: Newton's first law
  - id: p2-weight
    where: 'Problem 2(b): 450 × 9.81 = 4414.5 N'
    inputs: {}
    formula: 450 * 9.81
    expected: '4414.5'
    tolerance: 1e-6
    shown: ['$F_g = m\,g = 450 \times 9.81 = 4414.5$ N']
    source: {cite: reading2, at: '2.4, Weight and mass (our own numbers)'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b): lift = 4414.5 + 300 = 4714.5 N, about 4.71 × 10³ N'
    inputs: {m: 450 kg, g: 9.81 m/s**2, Fd: 300 N, u: 1 N}
    formula: (m * g + Fd) / u
    expected: '4710'
    shown: ['$= 4414.5 + 300 = 4714.5$ N, about $4.71 \times 10^{3}$ N']
    source: {cite: mit, at: '2.3, Newton''s first law; Forces in equilibrium (our own problem)'}
    origin: page-own

  - id: p2-sink
    where: 'Problem 2(b), check: sinking, lift 4414.5 − 300 N'
    inputs: {}
    formula: 4414.5 - 300
    expected: '4114.5'
    tolerance: 1e-6
    shown: ['the lift would be $4414.5 - 300$ N instead']
    source: {cite: mit, at: '2.3, Forces in equilibrium (our own solution)'}
    origin: page-own

  - id: p2-percent
    where: 'Problem 2(b), check: 300/4414.5 ≈ 7 % more than the weight'
    inputs: {}
    formula: 100 * 300 / 4414.5
    expected: '7'
    shown: ['the lift is only about 7% more than the weight']
    source: {cite: mit, at: '2.3, Forces in equilibrium (our own solution)'}
    origin: page-own

  # Problem 3: Newton's second law
  - id: p3-net
    where: 'Problem 3(a): 210 − 58 = 152 N'
    inputs: {}
    formula: 210 - 58
    expected: '152'
    shown: ['$F_\text{net} = 210 - 58 = 152$ N']
    source: {cite: mit, at: '2.3, Newton''s second law of motion (our own numbers)'}
    origin: page-own

  - id: p3-a
    answer: p3-a
    where: 'Problem 3(a): a = 152/95 = 1.6 m/s²'
    inputs: {FA: 210 N, Ff: 58 N, m: 95 kg, u: 1 m/s**2}
    formula: (FA - Ff) / m / u
    expected: '1.6'
    shown: ['$a = F_\text{net}/m = 152/95 = 1.6$ m/s²']
    source: {cite: mit, at: '2.3, Newton''s second law of motion (our own problem)'}
    origin: page-own

  - id: p3-wrong
    where: 'Problem 3(a), check: 210/95 = 2.2 m/s² (resistance left out)'
    inputs: {}
    formula: 210 / 95
    expected: '2.2'
    shown: ['Using the 210 N alone would give 2.2 m/s²']
    source: {cite: mit, at: '2.3, Newton''s second law of motion (our own solution)'}
    origin: page-own

  - id: p3-b
    answer: p3-b
    where: 'Problem 3(b): v = 1.6 × 4.5 = 7.2 m/s'
    inputs: {a: 1.6 m/s**2, t: 4.5 s, u: 1 m/s}
    formula: a * t / u
    expected: '7.2'
    shown: ['$v_f = v_i + a\,\Delta t = 0 + 1.6 \times 4.5 = 7.2$ m/s']
    source: {cite: mit, at: '2.3, Newton''s second law of motion, with the equations of motion of Block 1 (our own problem)'}
    origin: page-own

  - id: p3-kmh
    where: 'Problem 3(b), check: 7.2 × 3.6 = 25.9 km/h'
    inputs: {v: 7.2 m/s, u: 1 km/hour}
    formula: v / u
    expected: '25.9'
    shown: ['That is $7.2 \times 3.6 = 25.9$ km/h']
    source: {cite: mit, at: '2.3, Newton''s second law of motion (our own solution)'}
    origin: page-own

  - id: p3-c
    answer: p3-c
    where: 'Problem 3(c): ½ × 1.6 × 4.5² = 16.2 m'
    inputs: {a: 1.6 m/s**2, t: 4.5 s, u: 1 m}
    formula: 0.5 * a * t**2 / u
    expected: '16.2'
    shown: ['\times 1.6 \times 4.5^{2} = 16.2$ m']
    source: {cite: mit, at: '2.3, Newton''s second law of motion, with the equations of motion of Block 1 (our own problem)'}
    origin: page-own

  - id: p3-c-avg
    where: 'Problem 3(c), check: ½(0 + 7.2) = 3.6 m/s'
    inputs: {}
    formula: 0.5 * (0 + 7.2)
    expected: '3.6'
    shown: ['\tfrac12(0 + 7.2) = 3.6$ m/s']
    source: {cite: mit, at: '2.3 (our own solution)'}
    origin: page-own

  - id: p3-c-check
    where: 'Problem 3(c), check: 3.6 × 4.5 = 16.2 m'
    inputs: {}
    formula: 3.6 * 4.5
    expected: '16.2'
    shown: ['$3.6 \times 4.5 = 16.2$ m']
    source: {cite: mit, at: '2.3 (our own solution)'}
    origin: page-own

