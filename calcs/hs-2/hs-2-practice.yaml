  - id: p5-c
    kind: identity
    answer: p5-c
    where: 'Problem 5(c): T = 2 m1 m2 g/(m1 + m2), checked against a numerical solution of m1 g − X = m1 (X − m2 g)/m2 for the tension X'
    formula: 2 * m1 * m2 * g / (m1 + m2)
    equals: solve('m1*g - X - m1*(X - m2*g)/m2', 'X', 0, 1000)
    samples:
      m1: [0.70, 0.5, 5, 2.3]
      m2: [0.45, 0.1, 4, 3.1]
      g: [9.81, 1, 20, 3.7]
    tolerance: 1e-9
    shown: ['= \dfrac{2\,m_1 m_2\,g}{m_1 + m_2}$']
    source: {cite: reading4, at: 'Sec. 8.6, Example 8.9, Eqs. (8.6.52) to (8.6.54), the two equations combined (our own solution)'}
    origin: page-own

  # Problem 6: friction and drag
  - id: p6-N
    where: 'Problem 6(a): F_N = 32 × 9.81 = 313.9 N'
    inputs: {}
    formula: 32 * 9.81
    expected: '313.9'
    shown: ['$F_N = m\,g = 32 \times 9.81 = 313.9$ N']
