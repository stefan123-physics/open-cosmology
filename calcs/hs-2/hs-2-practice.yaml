  - id: p6-a
    answer: p6-a
    where: 'Problem 6(a): μ_s F_N = 0.45 × 313.9 = 141 N'
    inputs: {mus: 0.45, m: 32 kg, g: 9.81 m/s**2, u: 1 N}
    formula: mus * m * g / u
    expected: '141'
    shown: ['$\mu_s F_N = 0.45 \times 313.9 = 141$ N']
    source: {cite: reading1, at: '2.2, Friction forces (maximum static friction; our own problem)'}
    origin: page-own

  - id: p6-small
    kind: fact
    where: 'Problem 6(a), check: a push of 100 N is matched by 100 N of static friction (the page''s own example push)'
    value: '100'
    shown: ['A push of 100 N would not move it: static friction would then be exactly 100 N, not 141 N']
    source: {cite: reading1, at: '2.2, Friction forces (static friction matches the applied force; our own example)'}
    origin: page-own

  - id: p6-Ff
    where: 'Problem 6(b): F_f = 0.32 × 313.9 = 100.5 N'
    inputs: {}
    formula: 0.32 * 32 * 9.81
    expected: '100.5'
    shown: ['$F_f = \mu_k F_N = 0.32 \times 313.9 = 100.5$ N']
    source: {cite: reading1, at: '2.2, Friction forces (kinetic friction; our own numbers)'}
    origin: page-own

  - id: p6-b
    answer: p6-b
    where: 'Problem 6(b): a = (141 − 100.5)/32 = 1.27 m/s² (the push of (a) rounded to 141 N)'
    inputs: {P: 141 N, muk: 0.32, m: 32 kg, g: 9.81 m/s**2, u: 1 m/s**2}
    formula: (P - muk * m * g) / m / u
    expected: '1.27'
    shown: ['$a = \dfrac{141 - 100.5}{32} = 1.27$ m/s²']
    source: {cite: mit, at: '2.3, Newton''s second law of motion, with kinetic friction of 2.2 (our own problem)'}
    origin: page-own

  - id: p6-b-check
    where: 'Problem 6(b), check: with the unrounded push, (0.45 − 0.32) × 9.81 = 0.13 × 9.81 = 1.28 m/s²'
