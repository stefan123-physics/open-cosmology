  # Problem 5: tension and a pulley
  - id: p5-a
    answer: p5-a
    where: 'Problem 5(a): a = 0.25 × 9.81/1.15 = 2.13 m/s²'
    inputs: {m1: 0.70 kg, m2: 0.45 kg, g: 9.81 m/s**2, u: 1 m/s**2}
    formula: (m1 - m2) * g / (m1 + m2) / u
    expected: '2.13'
    shown: ['so $a = \dfrac{0.25 \times 9.81}{1.15} = 2.13$ m/s²']
    source: {cite: reading4, at: 'Sec. 8.6, Example 8.9 (second law for each hanging block, same tension on both sides; our own problem)'}
    origin: page-own

  - id: p5-b
    answer: p5-b
    where: 'Problem 5(b): T = 0.45 × (9.81 + 2.133) = 5.37 N'
    inputs: {m1: 0.70 kg, m2: 0.45 kg, g: 9.81 m/s**2, u: 1 N}
    formula: m2 * (g + (m1 - m2) * g / (m1 + m2)) / u
    expected: '5.37'
    shown: ['$T = m_2\,(g + a) = 0.45 \times (9.81 + 2.133) = 5.37$ N']
    source: {cite: reading4, at: 'Sec. 8.6, Example 8.9 (our own problem)'}
    origin: page-own

  - id: p5-b-check
    where: 'Problem 5(b), check: T = 0.70 × (9.81 − 2.133) = 5.37 N'
    inputs: {}
    formula: 0.70 * (9.81 - 2.133)
    expected: '5.37'
    shown: ['$T = m_1\,(g - a) = 0.70 \times (9.81 - 2.133) = 5.37$ N as well']
    source: {cite: reading4, at: 'Sec. 8.6, Example 8.9 (our own solution)'}
    origin: page-own

  - id: p5-w2
    where: 'Problem 5(b), check: 0.45 × 9.81 = 4.41 N'
    inputs: {}
    formula: 0.45 * 9.81
    expected: '4.41'
    shown: ['$0.45 \times 9.81 = 4.41$ N']
    source: {cite: reading2, at: '2.4, Weight and mass (our own solution)'}
    origin: page-own

  - id: p5-w1
    where: 'Problem 5(b), check: 0.70 × 9.81 = 6.87 N'
    inputs: {}
    formula: 0.70 * 9.81
    expected: '6.87'
    shown: ['$0.70 \times 9.81 = 6.87$ N']
    source: {cite: reading2, at: '2.4, Weight and mass (our own solution)'}
