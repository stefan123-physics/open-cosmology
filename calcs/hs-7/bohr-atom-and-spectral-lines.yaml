# Calculations on content/year-0/hs-7/bohr-atom-and-spectral-lines.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 6: h = 6.63e-34 J s, c = 3.00e8 m/s, 1 eV = 1.6e-19 J (passed as k so that pint's exact eV is not used).

page: content/year-0/hs-7/bohr-atom-and-spectral-lines.mdx
calcs:
  - id: energy-scale
    kind: fact
    where: 'section "The energy levels of hydrogen": the energy scale e²/a₀ of the hydrogen atom in MIT 8.04'
    value: 27.2 eV
    shown: ['half of the energy scale $27.2\ \text{eV}$ of the hydrogen atom']
    source: {cite: reading2, at: 'p. 4, eq. (2.4)'}
    origin: mit

  - id: ground-state-13-6
    where: 'formula "Energy levels of hydrogen": e²/(2a₀) = 27.2 eV / 2 = 13.6 eV'
    inputs: {Es: 27.2 eV}
    formula: Es / 2
    expected: 13.6 eV
    shown: ['tex="E_n = -\frac{13.6\ \text{eV}}{n^2}, \qquad n = 1, 2, 3, \dots"', 'where $13.6\ \text{eV}$ is half of the energy scale']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: mit

  - id: ionisation-energy-fact
    kind: fact
    where: 'section "Absorption and ionisation": the ionisation energy of hydrogen, as quoted in MIT 8.901 Problem Set 2'
    value: 13.6 eV
    shown: ['**$13.6\ \text{eV}$** (the value an MIT astrophysics problem set also quotes']
    source: {cite: ps8901, at: 'Problem 2'}
    origin: mit

  - id: electronvolt
    kind: fact
    where: 'section "The energy levels of hydrogen": the electronvolt in joules (lesson 7.2, Block 6 rounding)'
    value: 1.6e-19 J
    shown: ['$1\ \text{eV} = 1.6 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.3 (E = hf, energies in J)'}
    origin: page-own

  - id: level-1
    where: 'table of levels: n = 1'
    inputs: {E0: 13.6 eV, n: 1}
    formula: -E0 / n**2
    expected: -13.6 eV
    shown: ['| $n = 1$ (ground state) | $-13.6\ \text{eV}$ |']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: level-2
    where: 'table of levels and red-line example: n = 2'
    inputs: {E0: 13.6 eV, n: 2}
    formula: -E0 / n**2
    expected: -3.40 eV
    shown: ['$-13.6/4 = -3.40\ \text{eV}$', '$E_2 = -13.6/4 = -3.40\ \text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: level-3
    where: 'table of levels and red-line example: n = 3'
    inputs: {E0: 13.6 eV, n: 3}
    formula: -E0 / n**2
    expected: -1.51 eV
    shown: ['$-13.6/9 = -1.51\ \text{eV}$', '$E_3 = -13.6/9 = -1.51\ \text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: level-4
    where: 'table of levels and quiz 1 (answer 0, −0.85 eV; the quiz tag is on quiz-1-level-4, by magnitude): n = 4'
    inputs: {E0: 13.6 eV, n: 4}
    formula: -E0 / n**2
    expected: -0.85 eV
    shown: ['$-13.6/16 = -0.85\ \text{eV}$', '$E_4 = -13.6\\ \\text{eV}/4^2 = -13.6/16 = -0.85\\ \\text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: quiz-1-level-4
    where: 'quiz 1 (answer 0, −0.85 eV): the size of the n = 4 level, tagged by magnitude because the checker reads choices without their sign'
    inputs: {E0: 13.6 eV, n: 4}
    formula: E0 / n**2
    expected: 0.85 eV
    shown: ['["$-0.85\\ \\text{eV}$",']
    quiz: 1
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: quiz-1-wrong-n
    where: 'quiz 1 explanation: dividing by n = 4 instead of n² gives −3.40 eV'
    inputs: {E0: 13.6 eV}
    formula: -E0 / 4
    expected: -3.40 eV
    shown: ['Dividing by 4 instead of 16 gives $-3.40\\ \\text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: level-5
    where: 'table of levels: n = 5'
    inputs: {E0: 13.6 eV, n: 5}
    formula: -E0 / n**2
    expected: -0.54 eV
    shown: ['$-13.6/25 = -0.54\ \text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: level-6
    where: 'table of levels: n = 6'
    inputs: {E0: 13.6 eV, n: 6}
    formula: -E0 / n**2
    expected: -0.38 eV
    shown: ['$-13.6/36 = -0.38\ \text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: gap-1-2
    where: 'energy-level diagram text, Lyman series and absorption example: E₂ − E₁'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1 - 1/4)
    expected: 10.2 eV
    shown: ['($10.2\ \text{eV}$)', 'at least $10.2\ \text{eV}$', '$E_2 - E_1 = -3.40 - (-13.6) = 10.2\ \text{eV}$', '$10.2\ \text{eV}$ matches the gap to $n = 2$']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: gap-1-3
    where: 'absorption example: E₃ − E₁'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1 - 1/9)
    expected: 12.09 eV
    shown: ['$E_3 - E_1 = 12.09\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: gap-1-4
    where: 'absorption example: E₄ − E₁'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1 - 1/16)
    expected: 12.75 eV
    shown: ['$E_4 - E_1 = -0.85 - (-13.6) = 12.75\ \text{eV}$', '$12.75\ \text{eV}$ lifts the electron to $n = 4$']
    source: {cite: mit, at: 'Sec. 12.3, Absorption spectra'}
    origin: page-own

  - id: ionised-kinetic
    where: 'absorption example: a 15.0 eV photon frees the electron, which keeps the rest as kinetic energy'
    inputs: {Eph: 15.0 eV, Eion: 13.6 eV}
    formula: Eph - Eion
    expected: 1.4 eV
    shown: ['$15.0 - 13.6 = 1.4\ \text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: lines-from-n4
    where: 'absorption example, step "Afterwards": number of different jumps among levels 1 to 4'
    inputs: {N: 4}
    formula: N * (N - 1) / 2
    expected: 6
    shown: ['the gas can now emit $6$ different lines']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: h-alpha-energy
    where: 'worked example "The red line of hydrogen", step "Photon energy", and the plot caption'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1/4 - 1/9)
    expected: 1.89 eV
    shown: ['$hf = E_3 - E_2 = -1.51 - (-3.40) = 1.89\ \text{eV}$', 'From level 3 to level 2 it is 1.89 eV', '| $3 \to 2$ | $1.89\ \text{eV}$ |', 'less than the red Balmer photon (1.89 eV)']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: h-alpha-joules
    where: 'worked example, step "Photon energy": 1.89 eV in joules'
    inputs: {E: 1.89 eV, k: 1.6e-19 J/eV}
    formula: E * k
    expected: 3.02e-19 J
    shown: ['$1.89 \times 1.6 \times 10^{-19} = 3.02 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.3'}
    origin: page-own

  - id: h-alpha-frequency
    where: 'worked example, step "Frequency and wavelength": f = E/h'
    inputs: {E: 3.02e-19 J, h: 6.63e-34 J*s}
    formula: E / h
    expected: 4.56e14 1/s
    shown: ['$f = E/h = (3.02 \times 10^{-19})/(6.63 \times 10^{-34}) = 4.56 \times 10^{14}\ \text{Hz}$']
    source: {cite: mit, at: 'Sec. 12.3 (E = hf)'}
    origin: page-own

  - id: h-alpha-wavelength
    where: 'worked example, step "Frequency and wavelength": λ = c/f'
    inputs: {c: 3.00e8 m/s, f: 4.56e14 1/s}
    formula: c / f
    expected: 6.58e-7 m
    shown: ['$\lambda = c/f = (3.00 \times 10^{8})/(4.56 \times 10^{14}) = 6.58 \times 10^{-7}\ \text{m} = 658\ \text{nm}$', '$658\ \text{nm}$ is red light']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: balmer-4-energy
    where: 'Balmer table: jump 4 → 2'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1/4 - 1/16)
    expected: 2.55 eV
    shown: ['| $4 \to 2$ | $2.55\ \text{eV}$ |']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: balmer-4-wavelength
    where: 'Balmer table: computed λ for 4 → 2'
    inputs: {E0: 13.6 eV, k: 1.6e-19 J/eV, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / (E0 * k * (1/4 - 1/16))
    expected: 488 nm
    tolerance: '0.2%'
    shown: ['| $4 \to 2$ | $2.55\ \text{eV}$ | $488\ \text{nm}$ |']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: balmer-3-wavelength
    where: 'Balmer table: computed λ for 3 → 2 (same as the worked example)'
    inputs: {E0: 13.6 eV, k: 1.6e-19 J/eV, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / (E0 * k * (1/4 - 1/9))
    expected: 658 nm
    shown: ['| $3 \to 2$ | $1.89\ \text{eV}$ | $658\ \text{nm}$ |']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: balmer-5-energy
    where: 'Balmer table: jump 5 → 2'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1/4 - 1/25)
    expected: 2.86 eV
    shown: ['| $5 \to 2$ | $2.86\ \text{eV}$ |']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: balmer-5-wavelength
    where: 'Balmer table: computed λ for 5 → 2'
    inputs: {E0: 13.6 eV, k: 1.6e-19 J/eV, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / (E0 * k * (1/4 - 1/25))
    expected: 435 nm
    shown: ['| $5 \to 2$ | $2.86\ \text{eV}$ | $435\ \text{nm}$ |']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: balmer-6-energy
    where: 'Balmer table: jump 6 → 2'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1/4 - 1/36)
    expected: 3.02 eV
    shown: ['| $6 \to 2$ | $3.02\ \text{eV}$ |']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: balmer-6-wavelength
    where: 'Balmer table: computed λ for 6 → 2'
    inputs: {E0: 13.6 eV, k: 1.6e-19 J/eV, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / (E0 * k * (1/4 - 1/36))
    expected: 411 nm
    shown: ['| $6 \to 2$ | $3.02\ \text{eV}$ | $411\ \text{nm}$ |']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: balmer-measured-656
    kind: fact
    where: 'Balmer table, red-line example and summary: measured H-alpha wavelength'
    value: 656 nm
    shown: ['| $656\ \text{nm}$ | red |', 'The measured wavelength is $656\ \text{nm}$', 'at $656\ \text{nm}$ in the red']
    source: {cite: reading3, at: 'slide 17'}
    origin: mit

  - id: balmer-measured-486
    kind: fact
    where: 'Balmer table: measured wavelength of the 4 → 2 line'
    value: 486 nm
    shown: ['| $486\ \text{nm}$ | blue-green |']
    source: {cite: reading3, at: 'slide 17'}
    origin: mit

  - id: balmer-measured-434
    kind: fact
    where: 'Balmer table: measured wavelength of the 5 → 2 line'
    value: 434 nm
    shown: ['| $434\ \text{nm}$ | blue-violet |']
    source: {cite: reading3, at: 'slide 17'}
    origin: mit

  - id: balmer-measured-410
    kind: fact
    where: 'Balmer table: measured wavelength of the 6 → 2 line'
    value: 410 nm
    shown: ['| $410\ \text{nm}$ | violet |']
    source: {cite: reading3, at: 'slide 17'}
    origin: mit

  - id: balmer-range
    where: 'list of series: Balmer photon energies run from 1.89 eV (3 → 2) up to 3.40 eV (free → 2), "about 1.9 to 3.4 eV"'
    inputs: {E0: 13.6 eV}
    formula: E0 / 4
    expected: 3.4 eV
    shown: ['about $1.9$ to $3.4\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: balmer-limit-energy
    where: 'Balmer series limit: jump from "free" (E = 0) to n = 2'
    inputs: {E0: 13.6 eV}
    formula: E0 / 4
    expected: 3.40 eV
    shown: ['with $3.40\ \text{eV}$ and a wavelength']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: balmer-limit-wavelength
    where: 'Balmer series limit wavelength'
    inputs: {E: 3.40 eV, k: 1.6e-19 J/eV, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / (E * k)
    expected: 366 nm
    shown: ['a wavelength of about $366\ \text{nm}$']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: ionisation-joules
    where: 'worked example "The photon that ionises hydrogen", step "Energy in joules"'
    inputs: {E: 13.6 eV, k: 1.6e-19 J/eV}
    formula: E * k
    expected: 2.176e-18 J
    shown: ['$E = 13.6 \times 1.6 \times 10^{-19} = 2.176 \times 10^{-18}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.3'}
    origin: page-own

  - id: ionisation-wavelength
    where: 'worked example, step "Wavelength", and flashcard and summary: λ = hc/E for 13.6 eV'
    inputs: {E: 2.176e-18 J, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / E
    expected: 91.4 nm
    shown: ['$\lambda = hc/E = (6.63 \times 10^{-34} \times 3.00 \times 10^{8})/(2.176 \times 10^{-18}) = 9.14 \times 10^{-8}\ \text{m} = 91.4\ \text{nm}$', 'a wavelength of at most $91.4\ \text{nm}$', 'A photon needs a wavelength of $91.4\\ \\text{nm}$ or shorter']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: quiz-2-energy
    where: 'quiz 2: photon energy of the jump 4 → 3 (two choices show 0.66 eV, so no quiz tag)'
    inputs: {E0: 13.6 eV}
    formula: E0 * (1/9 - 1/16)
    expected: 0.66 eV
    shown: ['$hf = E_4 - E_3 = -0.85 - (-1.51) = 0.66\\ \\text{eV}$']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: quiz-2-wavelength
    where: 'quiz 2 explanation: wavelength of the 4 → 3 photon (infrared)'
    inputs: {E0: 13.6 eV, k: 1.6e-19 J/eV, h: 6.63e-34 J*s, c: 3.00e8 m/s}
    formula: h * c / (E0 * k * (1/9 - 1/16))
    expected: 1.88e-6 m
    shown: ['$\\lambda = hc/E \\approx 1.88 \\times 10^{-6}\\ \\text{m}$']
    source: {cite: mit, at: 'Sec. 12.3, worked example (E = hc/λ)'}
    origin: page-own

  - id: quiz-3-ionise-n2
    where: 'quiz 3: energy to ionise from n = 2'
    inputs: {E0: 13.6 eV, n: 2}
    formula: E0 / n**2
    expected: 3.40 eV
    shown: ['$0 - (-3.40) = 3.40\\ \\text{eV}$']
    quiz: 3
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: quiz-3-wrong-double
    where: 'quiz 3 wrong choice 6.80 eV: 13.6/2 (dividing by n instead of n²)'
    inputs: {E0: 13.6 eV}
    formula: E0 / 2
    expected: 6.80 eV
    shown: ['$6.80\\ \\text{eV}$']
    source: {cite: reading2, at: 'p. 7, eq. (2.31)'}
    origin: page-own
