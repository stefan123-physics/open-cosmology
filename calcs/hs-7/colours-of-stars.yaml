    formula: b / T
    expected: 2.8e-7 m
    tolerance: '2%'
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/10\,500 = 2.8 \times 10^{-7}\ \text{m} = 280\ \text{nm}$']
    source: {cite: reading3, at: 'slide 22'}
    origin: page-own

  - id: sun-temperature
