  - id: sun-peak
    where: 'worked example "Why the Sun is not green": Wien''s law at 5772 K'
    inputs: {b: 2.9e-3 m*K, T: 5772 K}
    formula: b / T
    expected: 5.0e-7 m
    tolerance: '1%'
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/5772 = 5.0 \times 10^{-7}\ \text{m} = 500\ \text{nm}$', 'peaks near 500 nm']
    source: {cite: reading3, at: 'slide 22'}
    origin: page-own

  - id: sun-radius
    kind: fact
    where: 'worked example "The power of the Sun": radius 695 700 km rounded to 6.96 × 10⁸ m'
    value: 6.96e8 m
    tolerance: '0.1%'
    shown: ['The Sun has a radius of $6.96 \times 10^{8}\ \text{m}$', 'radius 6.96 × 10⁸ m']
    source: {cite: nasa-sun-factsheet, at: 'radius, luminosity, effective temperature'}
    origin: later-data

  - id: sun-area
    where: 'same, step "Surface area": 4πR²'
    inputs: {R: 6.96e8 m}
    formula: 4 * pi * R**2
    expected: 6.09e18 m**2
    tolerance: '0.2%'
    shown: ['$4\pi R^2 = 4\pi \times (6.96 \times 10^{8})^2 = 6.09 \times 10^{18}\ \text{m}^2$']
    source: {cite: reading2, at: 'p. 50'}
    origin: page-own

  - id: sun-flux
    where: 'same, step "Power per square metre": σT⁴ at 5772 K'
    inputs: {sigma: 5.67e-8 W/m**2/K**4, T: 5772 K}
    formula: sigma * T**4
    expected: 6.29e7 W/m**2
    tolerance: '0.2%'
    shown: ['$\sigma T^4 = 5.67 \times 10^{-8} \times 5772^4 = 6.29 \times 10^{7}\ \text{W/m}^2$', 'about 63 megawatts']
    source: {cite: reading3, at: 'slide 15'}
    origin: page-own

  - id: sun-luminosity
    where: 'same, step "Luminosity": L = 4πR²σT⁴'
    inputs: {R: 6.96e8 m, sigma: 5.67e-8 W/m**2/K**4, T: 5772 K}
    formula: 4 * pi * R**2 * sigma * T**4
    expected: 3.83e26 W
    tolerance: '0.2%'
    shown: ['$L = 6.09 \times 10^{18} \times 6.29 \times 10^{7} = 3.83 \times 10^{26}\ \text{W}$', 'this gives $3.83 \times 10^{26}\ \text{W}$', 'The Sun''s is about $3.8 \\times 10^{26}\\ \\text{W}$']
    source: {cite: reading2, at: 'p. 50'}
    origin: page-own

  - id: sun-luminosity-measured
    kind: fact
    where: 'same: the measured luminosity, 382.8 × 10²⁴ J/s'
    value: 3.828e26 W
    shown: ['the measured value, $3.828 \times 10^{26}\ \text{W}$']
    source: {cite: nasa-sun-factsheet, at: 'radius, luminosity, effective temperature'}
    origin: later-data

  - id: luminosity-ratio
    kind: identity
    where: 'formula "Comparing two stars": dividing 4πR₁²σT₁⁴ by 4πR₂²σT₂⁴'
    formula: (4 * pi * R1**2 * 5.67e-8 * T1**4) / (4 * pi * R2**2 * 5.67e-8 * T2**4)
    equals: (R1 / R2)**2 * (T1 / T2)**4
    samples: {R1: [1.2e9, 6.96e8], R2: [6.0e6, 3.0e8], T1: [10500, 3600], T2: [25200, 5772]}
    tolerance: 1e-12
    shown: ['tex="\frac{L_1}{L_2} = \left(\frac{R_1}{R_2}\right)^2 \left(\frac{T_1}{T_2}\right)^4"']
    source: {cite: reading2, at: 'p. 50, eq. (226)'}
    origin: page-own

