# Calculations on content/year-0/hs-7/colours-of-stars.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 6/7: Wien constant 2.9e-3 m K, sigma = 5.67e-8 W m^-2 K^-4.
# Star data from NASA pages (references nasa-sun-facts, nasa-sun-factsheet, nasa-betelgeuse, nasa-sirius), read 2026-11-20.

page: content/year-0/hs-7/colours-of-stars.mdx
calcs:
  - id: wien-constant
    kind: fact
    where: 'formula "Wien''s displacement law" (recap of lesson 7.2)'
    value: 2.9e-3 m*K
    shown: ['tex="\lambda_{\max}\,T = 2.9 \times 10^{-3}\ \text{m K}"', '$\lambda_{\max} T = 2.9 \times 10^{-3}\ \text{m K}$']
    source: {cite: reading3, at: 'slide 22'}
    origin: mit

  - id: sigma
    kind: fact
    where: 'section "Stars glow like black bodies": the Stefan–Boltzmann constant'
    value: 5.67e-8 W/m**2/K**4
    shown: ['$\sigma = 5.67 \times 10^{-8}\ \text{W m}^{-2}\,\text{K}^{-4}$']
    source: {cite: reading3, at: 'slide 15'}
    origin: mit

  - id: plot-spectrum-peak
    where: 'first plot: the curve (λ/λ_max)^(−5)(e^4.965 − 1)/(e^(4.965 λ_max/λ) − 1) equals 1 at λ = λ_max = 2.9e6 nm K / T'
    inputs: {T: 5800}
    formula: (2.9e6 / T / (2.9e6 / T))**(-5) * (exp(4.965) - 1) / (exp(4.965) - 1)
    expected: '1'
    shown: ['scaled so that every curve has its peak at 1', 'The peak sits at λ = 2.9 × 10⁻³ m K / T']
    source: {cite: reading3, at: 'slide 22'}
    origin: page-own

  - id: plot-peak-shape
    kind: identity
    where: 'first plot: x = 4.965 is where x⁵/(eˣ − 1) (Planck per unit wavelength, x = hc/(λkT)) has its maximum: 5(1 − e^(−x)) = x'
    formula: 5 * (1 - exp(-x))
    equals: x
    samples: {x: [4.965114]}
    tolerance: 1e-5
    shown: ['computed from Planck''s radiation formula']
    source: {cite: reading3, at: 'slide 22'}
    origin: page-own

  - id: betelgeuse-celsius
    kind: fact
    where: 'worked example "Betelgeuse and Sirius": surface a little over 3300 °C'
    value: 3300
    shown: ['a little over $3300\ ^\circ\text{C}$']
    source: {cite: nasa-betelgeuse, at: 'surface temperature and size'}
    origin: later-data

  - id: betelgeuse-kelvin
    where: 'same: 3300 °C + 273 = 3573 K, "about 3600 K"'
    inputs: {t: 3300 K, z: 273 K}
    formula: t + z
    expected: 3600 K
    tolerance: '1%'
    shown: ['so about $3600\ \text{K}$', 'Betelgeuse (red, so class M), about 3600 K', '(Betelgeuse, about 3600 K)', 'about 3600 K for Betelgeuse', 'Betelgeuse about 3600 K']
    source: {cite: nasa-betelgeuse, at: 'surface temperature and size'}
    origin: page-own

  - id: sirius-a-temperature
    kind: fact
    where: 'worked examples: Sirius A surface about 10 500 K'
    value: 10500 K
    shown: ['The surface of Sirius is about $10\,500\ \text{K}$', 'Sirius A (white, so class A), about 10 500 K', 'Sirius, about 10 500 K', 'a little below the 10 500 K of this lesson']
    source: {cite: nasa-sirius, at: 'temperatures and diameters of Sirius A and B'}
    origin: later-data

  - id: betelgeuse-peak
    where: 'worked example "Betelgeuse and Sirius", step "Betelgeuse": Wien''s law at 3600 K'
    inputs: {b: 2.9e-3 m*K, T: 3600 K}
    formula: b / T
    expected: 8.1e-7 m
    tolerance: '1%'
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/3600 = 8.1 \times 10^{-7}\ \text{m} = 810\ \text{nm}$']
    source: {cite: reading3, at: 'slide 22'}
    origin: page-own

  - id: sirius-peak
    where: 'same, step "Sirius": Wien''s law at 10 500 K'
