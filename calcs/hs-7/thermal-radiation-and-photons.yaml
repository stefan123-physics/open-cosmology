# Calculations on content/year-0/hs-7/thermal-radiation-and-photons.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 6/7: h = 6.63e-34 J s, c = 3.00e8 m/s, k_B = 1.38e-23 J/K, 1 eV = 1.6e-19 J,
# Wien constant 2.9e-3 m K, sigma = 5.67e-8 W m^-2 K^-4.

page: content/year-0/hs-7/thermal-radiation-and-photons.mdx
calcs:
  - id: wien-constant
    where: 'formula "Wien''s displacement law": the peak of Planck''s formula per unit wavelength lies at hc/(λkT) = 4.965, so λ_max T = hc/(4.965 k)'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, k: 1.38e-23 J/K}
    formula: h * c / (4.965 * k)
    expected: 2.9e-3 m*K
    tolerance: '1%'
    shown: ['tex="\lambda_{\max}\,T = 2.9 \times 10^{-3}\ \text{m K}"']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: wien-peak-equation
    kind: identity
    where: 'Wien''s law: x = 4.965 solves 5(1 − e^(−x)) = x, the condition for the maximum of x⁵/(eˣ − 1) (Planck''s formula per unit wavelength)'
    formula: 5 * (1 - exp(-x))
    equals: x
    samples: {x: [4.965114]}
    tolerance: 1e-5
    shown: ['the same formula per unit of wavelength gives this constant']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: sigma
    kind: fact
    where: 'formula "Stefan–Boltzmann law": the constant (MIT slide: 56.7 × 10⁻⁹ W/m²K⁴)'
    value: 5.67e-8 W/m**2/K**4
    shown: ['tex="P = \sigma A T^4, \qquad \sigma = 5.67 \times 10^{-8}\ \text{W m}^{-2}\,\text{K}^{-4}"', '$\\sigma = 5.67 \\times 10^{-8}\\ \\text{W m}^{-2}\\,\\text{K}^{-4}$']
    source: {cite: mit, at: 'slide 15'}
    origin: mit

  - id: planck-constant
    kind: fact
    where: 'formula "Planck''s constant"'
    value: 6.63e-34 J*s
    shown: ['tex="h = 6.63 \times 10^{-34}\ \text{J s}"', '$h = 6.63 \times 10^{-34}\ \text{J s}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: mit

  - id: electronvolt
    kind: fact
    where: 'section "The energy of a photon": the electronvolt, rounded as in Block 6'
    value: 1.6e-19 J
    tolerance: '1%'
    shown: ['$1\ \text{eV} = 1.6 \times 10^{-19}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: mit

  - id: boltzmann-constant
    kind: fact
    where: 'plot caption: Boltzmann''s constant used in Planck''s formula'
    value: 1.38e-23 J/K
    tolerance: '1%'
    shown: ['Boltzmann''s constant 1.38 × 10⁻²³ J/K']
    source: {cite: mit, at: 'slide 22'}
    origin: mit

  - id: plot-normalisation
    where: 'plot caption: the curves are scaled so that the 6000 K curve peaks at 1 (peak at 2.903e6/6000 = 484 nm; e^4.965 − 1 = 142.3)'
    inputs: {lam: 484, T: 6000}
    formula: 142.3 * (484 / lam)**5 / (exp(14413000 / (lam * T)) - 1)
    expected: '1'
    tolerance: '1%'
    shown: ['a black body at 6000 K has its peak at 1']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: plot-hc-over-k
    where: 'plot formula: hc/k in nm K, the 14413000 in exp(14413000/(λT))'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, k: 1.38e-23 J/K}
    formula: h * c / k
    expected: 14413000 nm*K
    tolerance: '0.1%'
    shown: ['exp(14413000/(lam*T))']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: plot-peak-3500
    where: 'section "The shape of the spectrum": at 3500 K the peak is at 829 nm, beyond the red end (700 nm), so most radiation is infrared'
    inputs: {b: 2.9e-3 m*K, T: 3500 K}
    formula: b / T
    expected: 8.3e-7 m
    tolerance: '2%'
    shown: ['At 3500 K most of the radiation is infrared']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: plot-peak-7000
    where: 'section "The shape of the spectrum": at 7000 K the peak is at 414 nm, inside 400–700 nm'
    inputs: {b: 2.9e-3 m*K, T: 7000 K}
    formula: b / T
    expected: 4.14e-7 m
    tolerance: '1%'
    shown: ['at 7000 K the peak is in the visible band']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: skin-kelvin
    where: 'worked example "Why a thermal camera works in the infrared", step "Temperature in kelvin"'
    inputs: {t: 34}
    formula: t + 273
    expected: '307'
    shown: ['$T = 34 + 273 = 307\ \text{K}$']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: skin-peak
    where: 'worked example, step "Use Wien''s law"'
    inputs: {b: 2.9e-3 m*K, T: 307 K}
    formula: b / T
    expected: 9.4e-6 m
    tolerance: '1%'
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/307 = 9.4 \times 10^{-6}\ \text{m}$', 'about 9 micrometres']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: skin-vs-red
    where: 'worked example: 9.4 μm over the longest visible wavelength, 700 nm (lesson 5.8)'
    inputs: {lam: 9.4e-6 m, red: 700e-9 m}
    formula: lam / red
    expected: '13.4'
    tolerance: '2%'
    shown: ['more than ten times the longest wavelength we can see']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: bulb-peak
    where: 'worked example "The glowing wire of a light bulb", step "Use Wien''s law"'
    inputs: {b: 2.9e-3 m*K, T: 2900 K}
    formula: b / T
    expected: 1.0e-6 m
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/2900 = 1.0 \times 10^{-6}\ \text{m} = 1000\ \text{nm}$']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: plate-T4
    where: 'worked example "A hot plate", step "Fourth power first"'
    inputs: {T: 600 K}
    formula: T**4
    expected: 1.296e11 K**4
    shown: ['$T^4 = 600^4 = 1.296 \times 10^{11}\ \text{K}^4$']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: plate-power
    where: 'worked example, step "Use the Stefan–Boltzmann law"'
    inputs: {sigma: 5.67e-8 W/m**2/K**4, A: 0.020 m**2, T: 600 K}
    formula: sigma * A * T**4
    expected: 147 W
    tolerance: '0.5%'
    shown: ['$P = \sigma A T^4 = 5.67 \times 10^{-8} \times 0.020 \times 1.296 \times 10^{11} = 147\ \text{W}$']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: plate-peak
    where: 'worked example: Wien''s law for the plate at 600 K gives 4.8 μm, "about 5 micrometres"'
    inputs: {b: 2.9e-3 m*K, T: 600 K}
    formula: b / T
    expected: 5e-6 m
    tolerance: '5%'
    shown: ['puts its peak at about 5 micrometres']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: double-temperature
    kind: identity
    where: 'section "The Stefan–Boltzmann law": doubling T multiplies σAT⁴ by 16'
    formula: sigma * A * (2 * T)**4
    equals: 16 * sigma * A * T**4
    samples: {sigma: [5.67e-8, 5.67e-8], A: [0.02, 1.0], T: [600.0, 2.7]}
    tolerance: 1e-12
    shown: ['Double the temperature and the power grows $2^4 = 16$ times']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: quiz-double-temperature
    where: 'quiz 2: 2⁴'
    inputs: {n: 2}
    formula: n**4
    expected: '16'
    shown: ['multiplies $P$ by $2^4 = 16$']
    quiz: 2
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: green-photon-energy
    where: 'worked example "A green laser pointer", step "Energy of one photon"'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, lam: 532 nm}
    formula: h * c / lam
    expected: 3.74e-19 J
    tolerance: '0.1%'
    shown: ['$E = hc/\lambda = (6.63 \times 10^{-34} \times 3.00 \times 10^{8})/(532 \times 10^{-9}) = 3.74 \times 10^{-19}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: green-photon-ev
    where: 'worked example, step "In electronvolts"'
    inputs: {E: 3.74e-19 J, eV: 1.6e-19 J}
    formula: E / eV
    expected: '2.34'
    tolerance: '0.2%'
    shown: ['$E = (3.74 \times 10^{-19})/(1.6 \times 10^{-19}) = 2.34\ \text{eV}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: green-photons-per-second
    where: 'worked example, step "Photons per second"'
    inputs: {P: 1.0e-3 W, E: 3.74e-19 J}
    formula: P / E
    expected: 2.7e15 1/s
    tolerance: '1%'
    shown: ['$(1.0 \times 10^{-3})/(3.74 \times 10^{-19}) = 2.7 \times 10^{15}$ photons per second']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: fm-photon-energy
    where: 'worked example "A radio photon", step "Use E = hf"'
    inputs: {h: 6.63e-34 J*s, f: 100 MHz}
    formula: h * f
    expected: 6.63e-26 J
    shown: ['$E = hf = 6.63 \times 10^{-34} \times 1.00 \times 10^{8} = 6.63 \times 10^{-26}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: fm-photon-ev
    where: 'worked example: the radio photon in electronvolts'
    inputs: {E: 6.63e-26 J, eV: 1.6e-19 J}
    formula: E / eV
    expected: '4.1e-7'
    tolerance: '2%'
    shown: ['or $4.1 \times 10^{-7}\ \text{eV}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: fm-vs-visible
    where: 'worked example: a green photon (2.34 eV) over a radio photon (4.1e-7 eV), "millions of times"'
    inputs: {a: 2.34, b: 4.1e-7}
    formula: a / b
    expected: '5.7e6'
    tolerance: '2%'
    shown: ['millions of times less than a photon of visible light']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: quiz-plate-temperature
    where: 'quiz 1: T = 2.9e-3 / 4.1e-6'
    inputs: {b: 2.9e-3 m*K, lam: 4.1e-6 m}
    formula: b / lam
    expected: 710 K
    tolerance: '0.5%'
    shown: ['$T = (2.9 \\times 10^{-3})/(4.1 \\times 10^{-6}) = 710\\ \\text{K}$']
    quiz: 1
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: quiz-plate-celsius
    where: 'quiz 1: 707 K in degrees Celsius'
    inputs: {T: 707.3}
    formula: T - 273
    expected: '430'
    tolerance: '1.5%'
    shown: ['about 430 °C']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: quiz-ir-photon-joule
    where: 'quiz 3: E = hc/λ for 1500 nm'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, lam: 1.5e-6 m}
    formula: h * c / lam
    expected: 1.3e-19 J
    tolerance: '2%'
    shown: ['$E = hc/\\lambda = (6.63 \\times 10^{-34} \\times 3.00 \\times 10^{8})/(1.5 \\times 10^{-6}) = 1.3 \\times 10^{-19}\\ \\text{J}$']
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: quiz-ir-photon-ev
    where: 'quiz 3: the same energy in eV'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, lam: 1.5e-6 m, eV: 1.6e-19 J}
    formula: h * c / lam / eV
    expected: '0.83'
    tolerance: '0.5%'
    shown: ['gives $0.83\\ \\text{eV}$']
    quiz: 3
    source: {cite: reading1, at: 'Sec. 11.5'}
    origin: page-own

  - id: cmb-temperature
    kind: fact
    where: 'cosmology callout: the temperature of the cosmic microwave background, rounded (calcs/values.yaml T_CMB 2.7)'
    value: 2.7 K
    shown: ['at a temperature of about $2.7\ \text{K}$']
    source: {cite: guth18, at: 'pp. 11–12'}
    origin: mit

  - id: cmb-peak
    where: 'cosmology callout: Wien''s law for 2.7 K'
    inputs: {b: 2.9e-3 m*K, T: 2.7 K}
    formula: b / T
    expected: 1.1e-3 m
    tolerance: '3%'
    shown: ['$(2.9 \times 10^{-3})/2.7 = 1.1 \times 10^{-3}\ \text{m}$', 'about a millimetre']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own
