# Calculations on content/year-0/hs-7/photoelectric-effect.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-7/photoelectric-effect.mdx
calcs:
  - id: quiz-threshold-wavelength
    where: 'quiz 1: λ0 = hc/W0 for W0 = 4.5 eV'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, W: 4.5 V, e: 1.6e-19 C}
    formula: h * c / (W * e)
    expected: 276 nm
    shown: ['$\\lambda_0 = c/f_0 = hc/W_0 = (6.63 \\times 10^{-34} \\times 3.00 \\times 10^{8})/(4.5 \\times 1.6 \\times 10^{-19}) = 2.76 \\times 10^{-7}\\ \\text{m} = 276\\ \\text{nm}$']
    quiz: 1
    source: {cite: reading1, at: 'p. 2, eq. (1.2)'}
    origin: page-own

  - id: quiz-stopping-voltage
    where: 'quiz 2: E_k,max = 5.0 − 2.8 eV, so V_s = 2.2 V'
    inputs: {E: 5.0 V, W: 2.8 V}
    formula: E - W
    expected: 2.2 V
    shown: ['$E_{k,\\max} = 5.0 - 2.8 = 2.2\\ \\text{eV}$', 'takes a voltage of $2.2\\ \\text{V}$']
    quiz: 2
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: quiz-slope-is-h
    kind: identity
    where: 'quiz 3: the slope of E_k,max = hf − W0 is h, whatever W0'
    formula: (h * f2 - W) - (h * f1 - W)
    equals: h * (f2 - f1)
    samples: {h: [6.63e-34, 6.63e-34], f1: [6.0e14, 9.0e14], f2: [8.0e14, 1.5e15], W: [3.6e-19, 6.1e-19]}
    tolerance: 1e-9
    shown: ['the slope is Planck''s constant for every metal']
    source: {cite: mit, at: 'Sec. 12.2, Using the photoelectric effect equation'}
    origin: page-own

  - id: wave-power-on-atom
    where: 'worked example "How long would a wave make you wait?", step 1: P = I × A'
    inputs: {I: 1.0e-3 W/m**2, A: 1e-19 m**2}
    formula: I * A
    expected: 1e-22 W
    shown: ['$1.0 \times 10^{-3} \times 1 \times 10^{-19} = 1 \times 10^{-22}\ \text{W}$']
    source: {cite: mit, at: 'Sec. 12.2, History and expectations as to the photoelectric effect'}
    origin: page-own

  - id: wave-wait-time
    where: 'same example, step 2: t = W0 / P'
    inputs: {W: 3.6e-19 J, P: 1e-22 W}
    formula: W / P
    expected: 3.6e3 s
    shown: ['$t = 3.6 \times 10^{-19} / 1 \times 10^{-22} = 3.6 \times 10^{3}\ \text{s}$']
    source: {cite: mit, at: 'Sec. 12.2, History and expectations as to the photoelectric effect'}
    origin: page-own

  - id: wave-wait-hour
    where: 'same example: "about an hour"'
    inputs: {t: 3.6e3 s}
    formula: t
    expected: 1 hour
    tolerance: '1%'
    shown: ['about an hour']
    source: {cite: mit, at: 'Sec. 12.2, History and expectations as to the photoelectric effect'}
    origin: page-own

  - id: planck-constant
    kind: fact
    where: 'Planck''s constant as used on the page (Block 7 convention)'
    value: 6.63e-34 J*s
    tolerance: '0.1%'
    shown: ['$h = 6.63 \times 10^{-34}\ \text{J s}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: example-threshold-frequency
    where: 'worked example "The threshold of a metal", step "Threshold frequency": f0 = W0/h'
    inputs: {W: 3.6e-19 J, h: 6.63e-34 J*s}
    formula: W / h
    expected: 5.43e14 1/s
    shown: ['$f_0 = W_0/h = 3.6 \times 10^{-19} / 6.63 \times 10^{-34} = 5.43 \times 10^{14}\ \text{Hz}$']
    source: {cite: reading1, at: 'p. 2, eq. (1.2)'}
    origin: page-own

  - id: example-threshold-wavelength
    where: 'same example, step "Longest wavelength": λ0 = c/f0'
    inputs: {c: 3.00e8 m/s, f0: 5.43e14 1/s}
    formula: c / f0
    expected: 552 nm
    shown: ['$\lambda_0 = c/f_0 = 3.00 \times 10^{8} / 5.43 \times 10^{14} = 5.52 \times 10^{-7}\ \text{m} = 552\ \text{nm}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: violet-frequency
    where: 'worked example "How fast are the electrons?", step 1: f = c/λ for 400 nm'
    inputs: {c: 3.00e8 m/s, lam: 4.00e-7 m}
    formula: c / lam
    expected: 7.5e14 1/s
    shown: ['$f = c/\lambda = 3.00 \times 10^{8} / 4.00 \times 10^{-7} = 7.5 \times 10^{14}\ \text{Hz}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: violet-photon-energy
    where: 'same step: hf'
    inputs: {h: 6.63e-34 J*s, f: 7.5e14 1/s}
    formula: h * f
    expected: 4.97e-19 J
    shown: ['$hf = 6.63 \times 10^{-34} \times 7.5 \times 10^{14} = 4.97 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: violet-ekmax
    where: 'step "What is left for the electron": E_k,max = hf − W0'
    inputs: {E: 4.97e-19 J, W: 3.6e-19 J}
    formula: E - W
    expected: 1.37e-19 J
    shown: ['$E_{k,\max} = hf - W_0 = 4.97 \times 10^{-19} - 3.6 \times 10^{-19} = 1.37 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: violet-speed
    where: 'step "Speed": v = sqrt(2 E_k / m_e)'
    inputs: {E: 1.37e-19 J, m_e: 9.11e-31 kg}
    formula: sqrt(2 * E / m_e)
    expected: 5.5e5 m/s
    shown: ['$v = \sqrt{2 \times 1.37 \times 10^{-19} / 9.11 \times 10^{-31}} = 5.5 \times 10^{5}\ \text{m/s}$', 'about 550 kilometres per second']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: work-function-ev
    where: 'section "Energies in electronvolts": 3.6e-19 J in eV'
    inputs: {W: 3.6e-19 J, e: 1.6e-19 C}
    formula: W / e
    expected: 2.25 V
    shown: ['$3.6 \times 10^{-19} / 1.6 \times 10^{-19} = 2.25\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy'}
    origin: page-own

  - id: violet-photon-ev
    where: 'section "Energies in electronvolts": 4.97e-19 J in eV'
    inputs: {E: 4.97e-19 J, e: 1.6e-19 C}
    formula: E / e
    expected: 3.1 V
    shown: ['$4.97 \times 10^{-19} / 1.6 \times 10^{-19} = 3.1\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy'}
    origin: page-own

  - id: violet-stopping-voltage
    where: 'section "Measuring the energy": V_s = E_k,max / e for the violet light'
    inputs: {E: 1.37e-19 J, e: 1.6e-19 C}
    formula: E / e
    expected: 0.86 V
    shown: ['$V_s = 1.37 \times 10^{-19} / 1.6 \times 10^{-19} = 0.86\ \text{V}$', 'if $V_s = 0.86\ \text{V}$, then $E_{k,\max} = 0.86\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy (E = q × V); applied here by this page to the stopping voltage, eV_s = E_k,max'}
    origin: page-own

  - id: uv-photon-energy
    where: 'worked example "Finding the work function from a measurement", step "Photon energy": hf'
    inputs: {h: 6.63e-34 J*s, f: 1.5e15 1/s}
    formula: h * f
    expected: 9.95e-19 J
    shown: ['$hf = 6.63 \times 10^{-34} \times 1.5 \times 10^{15} = 9.95 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: uv-photon-ev
    where: 'same step: in eV'
    inputs: {E: 9.95e-19 J, e: 1.6e-19 C}
    formula: E / e
    expected: 6.22 V
    shown: ['$9.95 \times 10^{-19}/1.6 \times 10^{-19} = 6.22\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy'}
    origin: page-own

  - id: uv-ekmax
    where: 'step "Kinetic energy from the stopping voltage": eV_s'
    inputs: {e: 1.6e-19 C, V: 2.4 V}
    formula: e * V
    expected: 3.84e-19 J
    shown: ['$E_{k,\max} = eV_s = 1.6 \times 10^{-19} \times 2.4 = 3.84 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy (E = q × V); applied here by this page to the stopping voltage, eV_s = E_k,max'}
    origin: page-own

  - id: uv-work-function
    where: 'step "Work function and threshold": W0 = hf − E_k,max'
    inputs: {E: 9.95e-19 J, K: 3.84e-19 J}
    formula: E - K
    expected: 6.1e-19 J
    shown: ['$W_0 = hf - E_{k,\max} = 9.95 \times 10^{-19} - 3.84 \times 10^{-19} = 6.1 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: uv-work-function-ev
    where: 'same step: "about 3.8 eV"'
    inputs: {W: 6.11e-19 J, e: 1.6e-19 C}
    formula: W / e
    expected: 3.8 V
    shown: ['about $3.8\ \text{eV}$']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy'}
    origin: page-own

  - id: uv-threshold
    where: 'same step: f0 = W0/h'
    inputs: {W: 6.1e-19 J, h: 6.63e-34 J*s}
    formula: W / h
    expected: 9.2e14 1/s
    shown: ['$f_0 = W_0/h = 6.1 \times 10^{-19} / 6.63 \times 10^{-34} = 9.2 \times 10^{14}\ \text{Hz}$']
    source: {cite: reading1, at: 'p. 2, eq. (1.2)'}
    origin: page-own

  - id: plot-slope
    where: 'plot caption: slope h in eV per 10^14 Hz (h / e × 10^14 Hz)'
    inputs: {h: 6.63e-34 J*s, e: 1.6e-19 C, df: 1e14 1/s}
    formula: h * df / e
    expected: 0.414 V
    shown: ['the slope is 0.414 eV for every 10¹⁴ Hz', 'expr: "0.414*f - W >= 0 ? 0.414*f - W : NaN"']
    source: {cite: mit, at: 'Sec. 12.2, Using the photoelectric effect equation'}
    origin: page-own

  - id: plot-default-work-function
    kind: fact
    where: 'plot: the slider starts at W0 = 2.25 eV, the metal of the worked examples'
    value: 2.25 V
    shown: ['W: { value: 2.25, min: 1.5, max: 5.5, step: 0.05, label: "W_0" }']
    source: {cite: mit, at: 'Sec. 12.2, Units of energy'}
    origin: page-own

  - id: millikan-1915
    kind: fact
    where: 'Millikan measured h from the slope to better than 1% (1915)'
    value: 1915
    shown: ['In 1915 Robert Millikan', 'to better than one per cent']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit
