# Calculations on content/year-0/hs-7/the-nucleus.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Block 6/7 constants: e = 1.6 × 10⁻¹⁹ C, m_p = 1.67 × 10⁻²⁷ kg, c = 3.00 × 10⁸ m/s, k = 9.0 × 10⁹ N m²/C², 1 eV = 1.6 × 10⁻¹⁹ J.
# Masses in u are written as plain numbers (u = 1.66 × 10⁻²⁷ kg, Siyavula 4.3).

page: content/year-0/hs-7/the-nucleus.mdx
calcs:
  - id: neutron-mass
    kind: fact
    where: 'section "Protons and neutrons" and the table: the neutron mass'
    value: 1.675e-27 kg
    shown: ['Its mass is $1.675 \times 10^{-27}\ \text{kg}$', '| neutron | $0$ | $1.675 \times 10^{-27}$ | in the nucleus |']
    source: {cite: mit, at: 'The neutron (1,6749 × 10⁻²⁷ kg)'}
    origin: mit

  - id: neutron-heavier
    where: 'section "Protons and neutrons": the neutron is about 0.1% heavier than the proton (Siyavula masses 1.6749 and 1.6726 × 10⁻²⁷ kg)'
    inputs: {}
    formula: (1.6749 - 1.6726) / 1.6726 * 100
    expected: '0.14'
    tolerance: '5%'
    shown: ['about 0.1% more than the proton''s']
    source: {cite: mit, at: 'Table 4.2'}
    origin: page-own

  - id: proton-electron-ratio
    where: 'section "Protons and neutrons": a proton is about 1800 times as heavy as an electron'
    inputs: {mp: 1.67e-27 kg, me: 9.11e-31 kg}
    formula: mp / me
    expected: '1833'
    tolerance: '2%'
    shown: ['about 1800 times the mass of an electron']
    source: {cite: mit, at: 'Table 4.2'}
    origin: page-own

  - id: gold-neutrons
    where: 'worked example "Inside a gold nucleus": N = A − Z'
    inputs: {}
    formula: 197 - 79
    expected: '118'
    shown: ['$N = A - Z = 197 - 79 = 118$ neutrons']
    source: {cite: reading4, at: 'Sec. 1.1.1'}
    origin: page-own

  - id: quiz-c14-neutrons
    where: 'quiz 0 and section "Isotopes": carbon-14 has 14 − 6 = 8 neutrons'
    inputs: {}
    formula: 14 - 6
    expected: '8'
    shown: ['$N = A - Z = 14 - 6 = 8$ neutrons', 'carbon-14, with 6 protons and 8 neutrons']
    source: {cite: reading4, at: 'Sec. 1.1.1'}
    origin: page-own

  - id: u238-neutrons
    where: 'worked example "Two isotopes of uranium": neutrons in uranium-238'
    inputs: {}
    formula: 238 - 92
    expected: '146'
    shown: ['Uranium-238: $N = 238 - 92 = 146$', 'uranium-238 has 146 neutrons to 92 protons']
    source: {cite: reading4, at: 'Sec. 1.1.1'}
    origin: page-own

  - id: u235-neutrons
    where: 'worked example "Two isotopes of uranium": neutrons in uranium-235'
    inputs: {}
    formula: 235 - 92
    expected: '143'
    shown: ['Uranium-235: $N = 235 - 92 = 143$']
    source: {cite: reading4, at: 'Sec. 1.1.1'}
    origin: page-own

  - id: u-isotope-mass-difference
    where: 'worked example "Two isotopes of uranium": three nucleons of about one proton mass'
    inputs: {mp: 1.67e-27 kg}
    formula: 3 * mp
    expected: 5.0e-27 kg
    tolerance: '1%'
    shown: ['$3 \times 1.67 \times 10^{-27} = 5.0 \times 10^{-27}\ \text{kg}$']
    source: {cite: mit, at: 'Table 4.2'}
    origin: page-own

  - id: u-isotope-mass-fraction
    where: 'worked example "Two isotopes of uranium": 3 of 238 nucleons'
    inputs: {}
    formula: 3 / 238 * 100
    expected: '1.3'
    tolerance: '5%'
    shown: ['about 1.3% of the whole nucleus']
    source: {cite: reading4, at: 'Sec. 1.1.1'}
    origin: page-own

  - id: radius-oxygen
    where: 'graph: point for oxygen-16, R = 1.2 × 16^(1/3) fm'
    inputs: {R0: 1.2 fm}
    formula: R0 * 16**(1/3)
    expected: 3.02 fm
    shown: ['{ x: 16, y: 3.02, label: "oxygen-16" }']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: radius-gold
    where: 'graph: point for gold-197'
    inputs: {R0: 1.2 fm}
    formula: R0 * 197**(1/3)
    expected: 6.98 fm
    shown: ['{ x: 197, y: 6.98, label: "gold-197" }']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: radius-uranium
    where: 'graph point and worked example "The density of a uranium nucleus", step "Radius"'
    inputs: {R0: 1.2 fm}
    formula: R0 * 238**(1/3)
    expected: 7.44 fm
    shown: ['{ x: 238, y: 7.44, label: "uranium-238" }', '$R = 1.2 \times 238^{1/3} = 1.2 \times 6.20 = 7.44\ \text{fm} = 7.44 \times 10^{-15}\ \text{m}$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: cube-root-238
    where: 'worked example, step "Radius": 238^(1/3)'
    inputs: {}
    formula: 238**(1/3)
    expected: '6.20'
    shown: ['1.2 \times 6.20 = 7.44']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: caption-ratios
    where: 'graph caption: uranium-238 has about 15 times the nucleons of oxygen-16, radius about 2.5 times'
    inputs: {}
    formula: (238 / 16)**(1/3)
    expected: '2.46'
    tolerance: '2%'
    shown: ['A nucleus with 15 times as many nucleons as oxygen-16 is only about 2.5 times as wide.']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: caption-15-times
    where: 'graph caption: 238/16 is about 15'
    inputs: {}
    formula: 238 / 16
    expected: '15'
    tolerance: '1%'
    shown: ['with 15 times as many nucleons as oxygen-16']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: quiz-radius-8
    kind: identity
    quiz: 2
    where: 'quiz 2: 8 times as many nucleons doubles R = R₀A^(1/3)'
    formula: R0 * (8 * A)**(1/3)
    equals: 2 * R0 * A**(1/3)
    samples: {R0: [1.2, 1.25], A: [4.0, 27.0]}
    tolerance: 1e-12
    shown: ['$8^{1/3} = 2$, so the radius doubles']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: volume-proportional-to-A
    kind: identity
    where: 'section "The size of a nucleus": R³ = R₀³A'
    formula: (R0 * A**(1/3))**3
    equals: R0**3 * A
    samples: {R0: [1.2, 1.25], A: [16.0, 238.0]}
    tolerance: 1e-9
    shown: ['$R^3 = R_0^3A$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: density-formula
    kind: identity
    where: 'formula "Density of nuclear matter": A cancels'
    formula: A * m / (4 / 3 * pi * R0**3 * A)
    equals: 3 * m / (4 * pi * R0**3)
    samples: {A: [4.0, 238.0], m: [1.67e-27, 1.67e-27], R0: [1.2e-15, 1.25e-15]}
    tolerance: 1e-12
    shown: ['\rho = \frac{A\,m_p}{\tfrac43\pi R_0^3 A} = \frac{3\,m_p}{4\pi R_0^3}']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: u238-mass
    where: 'worked example "The density of a uranium nucleus", step "Mass and volume": m = 238 m_p'
    inputs: {mp: 1.67e-27 kg}
    formula: 238 * mp
    expected: 3.97e-25 kg
    shown: ['$m = 238 \times 1.67 \times 10^{-27} = 3.97 \times 10^{-25}\ \text{kg}$']
    source: {cite: mit, at: 'Table 4.2'}
    origin: page-own

  - id: u238-volume
    where: 'worked example, step "Mass and volume": V = 4/3 π R³'
    inputs: {R: 7.44e-15 m}
    formula: 4 / 3 * pi * R**3
    expected: 1.73e-42 m**3
    shown: ['$V = \tfrac43\pi R^3 = \tfrac43\pi (7.44 \times 10^{-15})^3 = 1.73 \times 10^{-42}\ \text{m}^3$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: u238-density
    where: 'worked example, step "Density"'
    inputs: {m: 3.97e-25 kg, V: 1.73e-42 m**3}
    formula: m / V
    expected: 2.3e17 kg/m**3
    shown: ['$\rho = m/V = 3.97 \times 10^{-25}/1.73 \times 10^{-42} = 2.3 \times 10^{17}\ \text{kg/m}^3$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: nuclear-density-general
    where: 'worked example, step "Density", and the next worked example: 3m_p/(4πR₀³) for any nucleus'
    inputs: {mp: 1.67e-27 kg, R0: 1.2e-15 m}
    formula: 3 * mp / (4 * pi * R0**3)
    expected: 2.3e17 kg/m**3
    shown: ['the same as $3m_p/(4\pi R_0^3)$ gives for any nucleus', 'to the density of a nucleus, $2.3 \times 10^{17}\ \text{kg/m}^3$', 'about $2 \times 10^{17}\ \text{kg/m}^3$', 'about $2 \\times 10^{17}\\ \\text{kg/m}^3$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: density-vs-water
    where: 'worked example, step "Density": ratio to water'
    inputs: {rho: 2.3e17 kg/m**3, w: 1000 kg/m**3}
    formula: rho / w
    expected: '2.3e14'
    shown: ['That is $2.3 \times 10^{14}$ times the density of water.', 'some $10^{14}$ times that of water', 'a hundred million million times denser than water']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: proton-density-71
    kind: fact
    where: 'text after the uranium example: lesson 7.1 found about 7 × 10¹⁷ kg/m³ for one proton (calcs/hs-7/discovering-the-atom.yaml)'
    value: 7e17 kg/m**3
    shown: ['Lesson 7.1 found about $7 \times 10^{17}\ \text{kg/m}^3$ for a single proton']
    source: {cite: nistMp, at: 'via lesson 7.1 (proton radius 0.84 fm)'}
    origin: page-own

  - id: earth-mass
    kind: fact
    where: 'worked example "The Earth as nuclear matter": the Earth''s mass'
    value: 5.97e24 kg
    shown: ['The Earth has a mass of $5.97 \times 10^{24}\ \text{kg}$ (NASA, Earth Fact Sheet)']
    source: {cite: earthfact, at: 'Bulk parameters'}
    origin: later-data

  - id: earth-volume
    where: 'worked example "The Earth as nuclear matter", step "Volume"'
    inputs: {m: 5.97e24 kg, rho: 2.3e17 kg/m**3}
    formula: m / rho
    expected: 2.6e7 m**3
    shown: ['$V = m/\rho = 5.97 \times 10^{24}/2.3 \times 10^{17} = 2.6 \times 10^{7}\ \text{m}^3$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: earth-3v-4pi
    where: 'worked example, step "Radius": 3V/(4π)'
    inputs: {V: 2.6e7 m**3}
    formula: 3 * V / (4 * pi)
    expected: 6.2e6 m**3
    shown: ['(6.2 \times 10^{6})^{1/3}']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: earth-radius
    where: 'worked example, step "Radius"'
    inputs: {m: 5.97e24 kg, rho: 2.3e17 kg/m**3}
    formula: (3 * m / (4 * pi * rho))**(1/3)
    expected: 180 m
    tolerance: '3%'
    shown: ['(6.2 \times 10^{6})^{1/3} = 180\ \text{m}$']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: earth-diameter
    where: 'worked example, step "Radius": a ball about 370 metres across'
    inputs: {m: 5.97e24 kg, rho: 2.3e17 kg/m**3}
    formula: 2 * (3 * m / (4 * pi * rho))**(1/3)
    expected: 370 m
    tolerance: '3%'
    shown: ['a ball about 370 metres across']
    source: {cite: reading4, at: 'Sec. 1.1.3'}
    origin: page-own

  - id: proton-coulomb-force
    where: 'worked example "Two protons in a nucleus", step "Electric repulsion"; quiz 3 and the summary'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C, r: 1.0e-15 m}
    formula: k * e**2 / r**2
    expected: 230 N
    tolerance: '0.5%'
    shown: ['$F = ke^2/r^2 = 9.0 \times 10^{9} \times (1.6 \times 10^{-19})^2/(1.0 \times 10^{-15})^2 = 230\ \text{N}$', 'repel each other with about $230\\ \\text{N}$', 'the electric repulsion of 230 N between two protons', 'repel with about $230\ \text{N}$']
    source: {cite: mit, at: 'proton charge, Table 4.2; Coulomb''s law from lesson 6.2'}
    origin: page-own

  - id: suitcase
    where: 'worked example "Two protons in a nucleus": 230 N is about the weight of 23 kg'
    inputs: {F: 230 N, g: 9.81 m/s**2}
    formula: F / g
    expected: 23 kg
    tolerance: '3%'
    shown: ['about the weight of a 23 kg suitcase']
    source: {cite: mit, at: 'weight W = mg (Block 2)'}
    origin: page-own

  - id: proton-acceleration
    where: 'worked example, step "Electric repulsion": a = F/m_p'
    inputs: {F: 230 N, mp: 1.67e-27 kg}
    formula: F / mp
    expected: 1.4e29 m/s**2
    shown: ['about $1.4 \times 10^{29}\ \text{m/s}^2$']
    source: {cite: mit, at: 'Newton''s second law (Block 2)'}
    origin: page-own

  - id: proton-gravity
    where: 'worked example, step "Gravitational attraction"'
    inputs: {G: 6.67e-11 N*m**2/kg**2, mp: 1.67e-27 kg, r: 1.0e-15 m}
    formula: G * mp**2 / r**2
    expected: 1.9e-34 N
    shown: ['$F_g = Gm_p^2/r^2 = 6.67 \times 10^{-11} \times (1.67 \times 10^{-27})^2/(1.0 \times 10^{-15})^2 = 1.9 \times 10^{-34}\ \text{N}$']
    source: {cite: mit, at: 'Newton''s law of gravitation (lesson 2.11)'}
    origin: page-own

  - id: electric-over-gravity
    where: 'worked example, step "Gravitational attraction": ratio about 10³⁶'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C, G: 6.67e-11 N*m**2/kg**2, mp: 1.67e-27 kg}
    formula: k * e**2 / (G * mp**2)
    expected: '1.2e36'
    tolerance: '5%'
    shown: ['The electric repulsion is about $10^{36}$ times larger']
    source: {cite: mit, at: 'lessons 2.11 and 6.2'}
    origin: page-own

  - id: quiz-force-2fm
    quiz: 3
    where: 'quiz 3: two protons 2.0 fm apart'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C, r: 2.0e-15 m}
    formula: k * e**2 / r**2
    expected: 58 N
    tolerance: '1%'
    shown: ['$230/4 \\approx 58\\ \\text{N}$']
    source: {cite: mit, at: 'Coulomb''s law from lesson 6.2'}
    origin: page-own

  - id: amu
