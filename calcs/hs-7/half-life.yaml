  - id: quiz-activity-ratio
    where: 'quiz 1: same N, half-lives 10 and 40 min: A_P/A_Q = 40/10 = 4'
    inputs: {tP: 10 min, tQ: 40 min}
    formula: (log(2) / tP) / (log(2) / tQ)
    expected: 4
