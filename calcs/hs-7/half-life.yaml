    expected: 20
    quiz: 0
    shown: ['$30/6.0 = 5$ half-lives', '$640 \\to 320 \\to 160 \\to 80 \\to 40 \\to 20\\ \\text{MBq}$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: quiz-tc99m-linear
    where: 'quiz 0, wrong choice: 640/5 = 128'
    inputs: {}
    formula: 640 / 5
    expected: 128
