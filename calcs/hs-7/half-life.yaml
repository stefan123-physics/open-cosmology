# Calculations on content/year-0/hs-7/half-life.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Half-lives: carbon-14 5730 years (MIT 22.01 Lecture 8, p. 11); uranium-238, potassium-40, technetium-99m from the IAEA LiveChart of Nuclides (read 2026-11-20).

page: content/year-0/hs-7/half-life.mdx
calcs:
  - id: decay-law-forms-agree
    kind: identity
    where: 'sections "The half-life" and "The exponential form": N₀(½)^(t/t½) equals N₀ e^(−λt) with λ = ln 2/t½'
    formula: N0 * 0.5**(t / th)
    equals: N0 * exp(-(log(2) / th) * t)
    samples: {N0: [1000.0, 6.4e9, 1.0], t: [0.0, 20.0, 9953.0], th: [5.0, 8.0, 5730.0]}
    tolerance: 1e-12
    shown: ['tex="N = N_0\left(\tfrac{1}{2}\right)^{t/t_{1/2}}"', 'tex="N = N_0\,e^{-\lambda t}"']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: mit

  - id: lambda-half-life
    kind: identity
    where: 'formula "Decay constant and half-life": e^(−λ t½) = ½ when λ = ln 2/t½; ln 2 ≈ 0.693'
    formula: exp(-(log(2) / th) * th)
    equals: 0.5
    samples: {th: [1.0, 480.0, 5730.0]}
    tolerance: 1e-12
    shown: ['tex="\lambda = \frac{\ln 2}{t_{1/2}} \approx \frac{0.693}{t_{1/2}}"']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: mit

  - id: ln2
    where: 'formula "Decay constant and half-life": ln 2 ≈ 0.693'
    inputs: {}
    formula: log(2)
    expected: 0.693
    tolerance: '0.1%'
    shown: ['\approx \frac{0.693}{t_{1/2}}']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: mit

  - id: time-from-fraction
    kind: identity
    where: 'formula "Time from the fraction left": (½)^x = N/N₀ gives x = log(N/N₀)/log(½), with any base of logarithm'
    formula: 0.5**(log10(f) / log10(0.5))
    equals: f
    samples: {f: [0.30, 0.75, 0.25, 0.9]}
    tolerance: 1e-12
    shown: ['tex="\frac{t}{t_{1/2}} = \frac{\log\left(N/N_0\right)}{\log\left(\tfrac{1}{2}\right)}"']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: table-fractions
    where: 'table in "The half-life": after 4 half-lives (½)^4 = 1/16'
    inputs: {}
    formula: 0.5**4
    expected: 0.0625
    shown: ['$\tfrac1{16} N_0$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex1-half-lives
    where: 'worked example "A short-lived sample", step "Whole half-lives": 40/8.0 = 5 half-lives'
    inputs: {t: 40 min, th: 8.0 min}
    formula: t / th
    expected: 5
    shown: ['$40/8.0 = 5$ half-lives']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex1-after-40
    where: 'same step: N = 6.4e9 × (½)^5 = 6.4e9/32 = 2.0e8'
    inputs: {N0: 6.4e9}
    formula: N0 * 0.5**5
    expected: 2.0e8
    tolerance: '1%'
    shown: ['$N = 6.4 \times 10^{9} \times \left(\tfrac12\right)^{5} = 6.4 \times 10^{9} / 32 = 2.0 \times 10^{8}$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex1-2p5
    where: 'worked example "A short-lived sample", step "Part of a half-life": 20/8.0 = 2.5, (½)^2.5 = 0.177'
    inputs: {t: 20 min, th: 8.0 min}
    formula: 0.5**(t / th)
    expected: 0.177
    tolerance: '0.5%'
    shown: ['$20/8.0 = 2.5$ half-lives', '$\left(\tfrac12\right)^{2.5} = 0.177$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex1-after-20
    where: 'same step: N = 0.177 × 6.4e9 = 1.1e9'
    inputs: {N0: 6.4e9}
    formula: N0 * 0.5**2.5
    expected: 1.1e9
    tolerance: '5%'
    shown: ['$N = 0.177 \times 6.4 \times 10^{9} = 1.1 \times 10^{9}$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex1-bracket-2
    where: 'same step: 1.6e9 left after two half-lives'
    inputs: {N0: 6.4e9}
    formula: N0 * 0.5**2
    expected: 1.6e9
    shown: ['the $1.6 \times 10^{9}$ left after two half-lives']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex1-bracket-3
    where: 'same step: 8.0e8 left after three'
    inputs: {N0: 6.4e9}
    formula: N0 * 0.5**3
    expected: 8.0e8
    shown: ['the $8.0 \times 10^{8}$ left after three']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: plot-half
    where: 'plot caption: one half-life after the start the curve 1000 (½)^(t/t½) crosses N = 500'
    inputs: {N0: 1000, th: 5}
    formula: N0 * 0.5**(th / th)
    expected: 500
    shown: ['where the curve crosses the dashed line N = 500', 'from 1000 to 500, from 500 to 250']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex2-seconds
    where: 'worked example "How active is the sample?", step "Decay constant": 8.0 × 60 = 480 s'
    inputs: {th: 8.0 min}
    formula: th
    expected: 480 s
    shown: ['$t_{1/2} = 8.0 \times 60 = 480\ \text{s}$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex2-lambda
    where: 'same step: λ = 0.693/480 s = 1.44e-3 per second'
    inputs: {th: 480 s}
    formula: log(2) / th
    expected: 1.44e-3 1/s
    tolerance: '0.5%'
    shown: ['$\lambda = 0.693 / 480\ \text{s} = 1.44 \times 10^{-3}\ \text{s}^{-1}$', 'about 1.4 in 1000']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: ex2-activity
    where: 'step "Activity": A₀ = 1.44e-3 /s × 6.4e9 = 9.2e6 Bq'
    inputs: {lam: 1.44e-3 1/s, N0: 6.4e9}
    formula: lam * N0
    expected: 9.2e6 1/s
    tolerance: '1%'
    shown: ['$A_0 = \lambda N_0 = 1.44 \times 10^{-3}\ \text{s}^{-1} \times 6.4 \times 10^{9} = 9.2 \times 10^{6}\ \text{Bq}$', 'about nine million decays per second']
    source: {cite: reading1, at: 'transcript p. 23'}
    origin: page-own

  - id: ex2-later
    where: 'step "Later": 9.2e6/32 = 2.9e5 Bq'
    inputs: {A0: 9.2e6 1/s}
    formula: A0 / 32
    expected: 2.9e5 1/s
    tolerance: '1%'
    shown: ['$9.2 \times 10^{6} / 32 = 2.9 \times 10^{5}\ \text{Bq}$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: carbon14-half-life
    kind: fact
    where: 'section "Carbon-14 dating", quiz 2 and summary: half-life of carbon-14 5730 years'
    value: 5730 year
    shown: ['half-life of **5730 years**', '**Carbon-14** (half-life 5730 years)', 'Carbon-14 (half-life 5730 years) dates wood', 'halves every 5730 years']
    source: {cite: reading2, at: 'transcript p. 11'}
    origin: mit

  - id: carbon14-iaea
    kind: fact
    where: 'section "Carbon-14 dating": newer value close to 5700 years'
    value: 5700 year
    shown: ['closer to 5700 years (IAEA)']
    source: {cite: iaea, at: 'carbon-14 ground state'}
    origin: later-data

  - id: charcoal-half-lives
    where: 'worked example "Charcoal from an old fireplace", step "Number of half-lives": log 0.30/log 0.5 = 1.737'
    inputs: {f: 0.30}
    formula: log10(f) / log10(0.5)
    expected: 1.737
    tolerance: '0.05%'
    shown: ['\dfrac{\log 0.30}{\log 0.5} = 1.737']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: charcoal-age
    where: 'same example, step "Time": 1.737 × 5730 years ≈ 9950 years, roughly ten thousand'
    inputs: {x: 1.737, th: 5730 year}
    formula: x * th
    expected: 9950 year
    tolerance: '0.1%'
    shown: ['$t = 1.737 \times 5730$ years $\approx 9950$ years', 'roughly ten thousand years ago']
    source: {cite: reading2, at: 'transcript p. 11'}
    origin: page-own

  - id: charcoal-check
    where: 'same example: after two half-lives 25% would be left'
    inputs: {}
    formula: 0.5**2
    expected: 0.25
    shown: ['after two half-lives 25% would be left']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: u238-half-life
    kind: fact
    where: 'section "Dating rocks and the age of the Earth": uranium-238 half-life about 4.47e9 years (IAEA: 4.468e9)'
    value: 4.47e9 year
    shown: ['half-life of about $4.47 \times 10^{9}$ years (IAEA)', '**Uranium-238** (about 4.5 billion years)']
    source: {cite: iaea, at: 'uranium-238 ground state'}
    origin: later-data

  - id: k40-half-life
    kind: fact
    where: 'same section: potassium-40 half-life about 1.25e9 years (IAEA: 1.248e9)'
    value: 1.25e9 year
    shown: ['half-life of about $1.25 \times 10^{9}$ years (IAEA)', '**potassium-40** (about 1.25 billion years)', 'potassium-40, about 1.25 billion years']
    source: {cite: iaea, at: 'potassium-40 ground state'}
    origin: later-data

  - id: crystal-fraction
    where: 'worked example "An old crystal", step "Fraction left": 3 of 4 = 0.75'
    inputs: {}
    formula: 3 / (3 + 1)
    expected: 0.75
    shown: ['$N/N_0 = 3/4 = 0.75$']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: crystal-half-lives
    where: 'same example, step "Age": log 0.75/log 0.5 = 0.415'
    inputs: {f: 0.75}
    formula: log10(f) / log10(0.5)
    expected: 0.415
    tolerance: '0.05%'
    shown: ['\dfrac{\log 0.75}{\log 0.5} = 0.415']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: crystal-age
    where: 'same step: 0.415 × 4.47e9 years = 1.86e9 years, about 1.9 billion'
    inputs: {x: 0.415, th: 4.47e9 year}
    formula: x * th
    expected: 1.86e9 year
    tolerance: '0.5%'
    shown: ['$t = 0.415 \times 4.47 \times 10^{9}$ years $= 1.86 \times 10^{9}$ years, about 1.9 billion years']
    source: {cite: iaea, at: 'uranium-238 ground state'}
    origin: page-own

  - id: earth-age
    kind: fact
    where: 'section "Dating rocks and the age of the Earth", summary and callout: the Earth about 4.5 billion years old'
    value: 4.5e9 year
    shown: ['an age of about **4.5 billion years** (NASA, *Facts About Earth*)', 'The Earth is about 4.5 billion years old.', 'an age of about 4.5 billion years, so any model']
    source: {cite: nasaEarth, at: 'Formation'}
    origin: later-data

  - id: earth-uranium-left
    where: 'same section: 4.5e9 years is almost exactly one uranium-238 half-life, so about half the uranium-238 is left'
    inputs: {t: 4.5e9 year, th: 4.47e9 year}
    formula: 0.5**(t / th)
    expected: 0.5
    tolerance: '1%'
    shown: ['about half of the uranium-238 the Earth was born with is still here']
    source: {cite: iaea, at: 'uranium-238 ground state'}
    origin: page-own

  - id: tc99m-half-life
    kind: fact
    where: 'section "Short half-lives in medicine", quiz 0 and summary: technetium-99m half-life about 6 hours (IAEA: 6.007 h)'
    value: 6.0 hour
    shown: ['Its half-life is about **6 hours** (IAEA)', 'technetium-99m (half-life about 6 hours)', 'the measured value is six hours']
    source: {cite: iaea, at: 'technetium-99m level'}
    origin: later-data

  - id: tc99m-gamma
    kind: fact
    where: 'same section: 140 keV gamma rays'
    value: 140 keV
    shown: ['$140\ \text{keV}$ gamma rays']
    source: {cite: reading2, at: 'transcript p. 12'}
    origin: mit

  - id: tc99m-two-days
    where: 'same section: two days = 48 h = 8 half-lives, (½)^8 = 1/256, less than half a percent'
    inputs: {t: 48 hour, th: 6.0 hour}
    formula: 0.5**(t / th)
    expected: 0.00390625
    tolerance: '1e-6'
    shown: ['After two days, which is 8 half-lives, only $\left(\tfrac12\right)^{8} = \tfrac1{256}$ of it is left, less than half a percent']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: page-own

  - id: quiz-tc99m
    where: 'quiz 0: 640 MBq, half-life 6.0 h, after 30 h: 5 half-lives, 20 MBq'
    inputs: {A0: 640, t: 30 hour, th: 6.0 hour}
