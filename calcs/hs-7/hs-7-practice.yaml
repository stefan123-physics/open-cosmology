  - id: hs7p-p4-c-32
    where: 'Problem 4(c), check: wavelength 3 → 2 in nm'
    inputs: {hc: 1.989e-25, eV: 1.6e-19}
    formula: hc / ((13.6/4 - 13.6/9) * eV) * 1e9
    expected: '658'
    tolerance: '0.2%'
    shown: ['$658$ ($3 \to 2$)', 'the red line at $658\ \text{nm}$', 'lie between $366$ and $658\ \text{nm}$']
    source: {cite: mit, at: 'Sec. 12.3'}
    origin: page-own

  - id: hs7p-p4-c-21
    where: 'Problem 4(c), check: wavelength 2 → 1 in nm'
    inputs: {hc: 1.989e-25, eV: 1.6e-19}
    formula: hc / ((13.6 - 13.6/4) * eV) * 1e9
    expected: '122'
    tolerance: '0.2%'
    shown: ['$122$ ($2 \to 1$)']
    source: {cite: mit, at: 'Sec. 12.3'}
    origin: page-own

  - id: hs7p-p4-c-31
    where: 'Problem 4(c), check: wavelength 3 → 1 in nm'
    inputs: {hc: 1.989e-25, eV: 1.6e-19}
    formula: hc / ((13.6 - 13.6/9) * eV) * 1e9
    expected: '103'
    tolerance: '0.3%'
    shown: ['$103$ ($3 \to 1$)']
    source: {cite: mit, at: 'Sec. 12.3'}
    origin: page-own

  - id: hs7p-p4-d-identity
    kind: identity
    answer: p4-d
    where: 'Problem 4(d), answer box: 13.6(1/4 − 1/n²) against E_n − E_2 with E_n = −13.6/n²'
    formula: 13.6*(1/4 - 1/n**2)
    equals: (-13.6/n**2) - (-13.6/2**2)
    samples:
      n: [3, 4, 5, 20]
