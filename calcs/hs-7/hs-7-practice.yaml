# Calculations on content/year-0/hs-7/hs-7-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Block 7 constants: e = 1.6e-19 C (1 eV = 1.6e-19 J), k = 9.0e9 N m²/C², h = 6.63e-34 J s, c = 3.00e8 m/s,
# m_p = 1.67e-27 kg, 1 u = 1.66e-27 kg, Wien 2.9e-3 m K, σ = 5.67e-8 W m⁻² K⁻⁴.
# Inputs are plain SI numbers (no units), as in calcs/hs-6/hs-6-practice.yaml.

page: content/year-0/hs-7/hs-7-practice.mdx
calcs:
  # ---------------------------------------------------------------- Problem 1
  - id: hs7p-p1-a
    answer: p1-a
    where: 'Problem 1(a), answer box: 4.0 MeV in joules'
    inputs: {E: 4.0e6, eV: 1.6e-19}
    formula: E * eV
    expected: '6.4e-13'
    shown: ['$E_k = 4.0 \times 10^{6} \times 1.6 \times 10^{-19} = 6.4 \times 10^{-13}\ \text{J}$']
    source: {cite: siy122, at: 'Sec. 12.2, Units of energy'}
    origin: page-own

  - id: hs7p-p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: closest approach r = kQq/E_k for Z = 29, an alpha particle and 4.0 MeV'
    inputs: {k: 9.0e9, Z: 29, e: 1.6e-19, E: 6.4e-13}
    formula: k * (Z*e) * (2*e) / E
    expected: '2.09e-14'
    tolerance: '0.5%'
    shown: ['(2 \times 1.6 \times 10^{-19})/(6.4 \times 10^{-13}) = 2.09 \times 10^{-14}\ \text{m}$']
    source: {cite: reading1, at: 'Eq. (3.3.5) with conservation of energy (our own step)'}
    origin: page-own

  - id: hs7p-p1-b-kqq
    where: 'Problem 1(b), check: kQq for Z = 29 and an alpha particle, with Ze = 4.64e-18 C'
    inputs: {k: 9.0e9, Z: 29, e: 1.6e-19}
    formula: k * (Z*e) * (2*e)
    expected: '1.34e-26'
    tolerance: '0.5%'
    shown: ['$kQq = 9.0 \times 10^9 \times 4.64 \times 10^{-18} \times 3.2 \times 10^{-19} = 1.34 \times 10^{-26}\ \text{J m}$']
    source: {cite: reading1, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: hs7p-p1-b-Ze
    where: 'Problem 1(b), check: charge of the copper nucleus 29e'
    inputs: {Z: 29, e: 1.6e-19}
    formula: Z * e
    expected: '4.64e-18'
    shown: ['4.64 \times 10^{-18}']
    source: {cite: reading1, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: hs7p-p1-b-back
    where: 'Problem 1(b), check: U = kQq/r at the closest point equals E_k'
    inputs: {kqq: 1.34e-26, r: 2.09e-14}
    formula: kqq / r
    expected: '6.4e-13'
    tolerance: '1%'
    shown: ['$U = 1.34 \times 10^{-26}/(2.09 \times 10^{-14}) = 6.4 \times 10^{-13}\ \text{J}$']
    source: {cite: reading1, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: hs7p-p1-b-atom
    where: 'Problem 1(b), check: atom size 1e-10 m divided by the closest distance, "about 5000 times"'
    inputs: {atom: 1.0e-10, r: 2.088e-14}
    formula: atom / r
    expected: '5000'
    tolerance: '5%'
    shown: ['The distance is about $5000$ times smaller than an atom']
    source: {cite: reading1, at: 'Eq. (3.3.5) (our own comparison)'}
    origin: page-own

  - id: hs7p-p1-c-identity
    kind: identity
    answer: p1-c
    where: 'Problem 1(c), answer box: r = 2kZe²/E_k against kQq/E_k with Q = Ze and q = 2e'
    formula: 2*k*Z*e**2/E
    equals: k*(Z*e)*(2*e)/E
    samples:
      k: [9.0e9, 1, 3, 8.99e9]
      Z: [29, 79, 1, 13]
      e: [1.6e-19, 1, 2, 1.6e-19]
      E: [6.4e-13, 1, 5, 1.28e-12]
    tolerance: 1e-12
    shown: ['= \frac{2kZe^2}{E_k}']
    source: {cite: reading1, at: 'Eq. (3.3.5) with conservation of energy (our own step)'}
    origin: page-own

  - id: hs7p-p1-d-ratio
    where: 'Problem 1(d): gold against copper, 79/29'
    inputs: {Zg: 79, Zc: 29}
    formula: Zg / Zc
    expected: '2.72'
    shown: ['Gold has $79/29 = 2.72$ times the charge of copper', '"Grows about 2.7 times"']
    source: {cite: reading1, at: 'Eq. (3.3.5) (our own step)'}
    origin: page-own

  - id: hs7p-p1-d-gold
    where: 'Problem 1(d): closest approach to gold, 2kZe²/E_k with Z = 79'
    inputs: {k: 9.0e9, Z: 79, e: 1.6e-19, E: 6.4e-13}
    formula: 2*k*Z*e**2/E
    expected: '5.69e-14'
    tolerance: '0.5%'
    shown: ['at $5.69 \times 10^{-14}\ \text{m}$']
    source: {cite: reading1, at: 'Eq. (3.3.5) (our own step)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 2
  - id: hs7p-p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: Wien peak at 1450 K, in μm'
    inputs: {b: 2.9e-3, T: 1450}
    formula: b / T * 1e6
    expected: '2.0'
    shown: ['$\lambda_{\max} = 2.9 \times 10^{-3}/1450 = 2.0 \times 10^{-6}\ \text{m} = 2.0\ \text{μm}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: hs7p-p2-a-red
    where: 'Problem 2(a), check: 700 nm in μm'
    inputs: {l: 700e-9}
    formula: l * 1e6
    expected: '0.7'
    shown: ['($700\ \text{nm} = 0.7\ \text{μm}$)']
    source: {cite: wien, at: 'Problem 1(c) (unit conversion)'}
    origin: page-own

  - id: hs7p-p2-b-T4
    where: 'Problem 2(b): 1450⁴'
    inputs: {T: 1450}
    formula: T**4
    expected: '4.42e12'
    shown: ['5.67 \times 10^{-8} \times 4.42 \times 10^{12}']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: hs7p-p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: σT⁴ for 1.00 m² at 1450 K, in kW'
    inputs: {s: 5.67e-8, A: 1.00, T: 1450}
    formula: s * A * T**4 / 1000
    expected: '251'
    tolerance: '0.5%'
    shown: ['= 2.51 \times 10^{5}\ \text{W} = 251\ \text{kW}$', 'A quarter of a megawatt from one square metre']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: hs7p-p2-c-J
    where: 'Problem 2(c): photon energy hc/λ at 2.0 μm, in joules'
    inputs: {h: 6.63e-34, c: 3.00e8, l: 2.0e-6}
    formula: h * c / l
    expected: '9.95e-20'
    tolerance: '0.2%'
    shown: ['$E = 6.63 \times 10^{-34} \times 3.00 \times 10^{8}/(2.0 \times 10^{-6}) = 9.95 \times 10^{-20}\ \text{J}$']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: page-own

  - id: hs7p-p2-c
    answer: p2-c
    where: 'Problem 2(c), answer box: the same photon in eV'
    inputs: {h: 6.63e-34, c: 3.00e8, l: 2.0e-6, eV: 1.6e-19}
    formula: h * c / l / eV
    expected: '0.622'
    tolerance: '0.2%'
    shown: ['and $9.95 \times 10^{-20}/(1.6 \times 10^{-19}) = 0.622\ \text{eV}$']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: page-own

  - id: hs7p-p2-c-red
    where: 'Problem 2(c), check: a 700 nm photon in eV, "almost three times as much"'
    inputs: {h: 6.63e-34, c: 3.00e8, l: 700e-9, eV: 1.6e-19}
    formula: h * c / l / eV
    expected: '1.78'
    tolerance: '0.5%'
    shown: ['A red photon of $700\ \text{nm}$ carries $1.78\ \text{eV}$, almost three times as much']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: page-own

  - id: hs7p-p2-c-red-ratio
    where: 'Problem 2(c), check: 1.78/0.622, "almost three times"'
    inputs: {a: 1.776, b: 0.6216}
    formula: a / b
    expected: '2.86'
    tolerance: '1%'
    shown: ['almost three times as much']
    source: {cite: siy115, at: 'Sec. 11.5 (our own comparison)'}
    origin: page-own

  - id: hs7p-p2-d
    where: 'Problem 2(d): σT⁴ at 725 K, in kW per m², and the factor 1/16'
    inputs: {s: 5.67e-8, T: 725}
    formula: s * T**4 / 1000
    expected: '15.7'
    tolerance: '0.5%'
    shown: ['$5.67 \times 10^{-8} \times 725^4 = 15.7\ \text{kW}$ per square metre']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: hs7p-p2-d-factor
    where: 'Problem 2(d): (1/2)⁴ = 1/16, and 251/16 = 15.7'
    inputs: {P: 250.64}
    formula: P * (1/2)**4
    expected: '15.7'
    tolerance: '0.5%'
    shown: ['$(1/2)^4 = 1/16$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 3
  - id: hs7p-p3-a
    answer: p3-a
    where: 'Problem 3(a), answer box: frequency of 450 nm light'
    inputs: {c: 3.00e8, l: 450e-9}
    formula: c / l
    expected: '6.67e14'
    shown: ['$f = c/\lambda = 3.00 \times 10^{8}/(450 \times 10^{-9}) = 6.67 \times 10^{14}\ \text{Hz}$']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: page-own

  - id: hs7p-p3-a-300
    where: 'Problem 3(a): frequency of 300 nm light'
    inputs: {c: 3.00e8, l: 300e-9}
    formula: c / l
    expected: '1.00e15'
    shown: ['$f = 3.00 \times 10^{8}/(300 \times 10^{-9}) = 1.00 \times 10^{15}\ \text{Hz}$']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: page-own

  - id: hs7p-p3-a-check
    where: 'Problem 3(a), check: 450/300 = 1.5 and 6.67e14 × 1.5'
    inputs: {f: 6.667e14, a: 450, b: 300}
    formula: f * a / b
    expected: '1.00e15'
    shown: ['by the factor $450/300 = 1.5$: $6.67 \times 10^{14} \times 1.5 = 1.00 \times 10^{15}\ \text{Hz}$']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: page-own

  - id: hs7p-p3-b-dV
    where: 'Problem 3(b): 1.84 − 0.46'
    inputs: {V1: 1.84, V2: 0.46}
    formula: V1 - V2
    expected: '1.38'
    shown: ['1.6 \times 10^{-19} \times 1.38/(3.33 \times 10^{14})']
    source: {cite: siy122, at: 'Sec. 12.2 (our own step)'}
    origin: page-own

  - id: hs7p-p3-b-df
    where: 'Problem 3(b): f1 − f2'
    inputs: {c: 3.00e8, l1: 300e-9, l2: 450e-9}
    formula: c/l1 - c/l2
    expected: '3.33e14'
    shown: ['(1.00 \times 10^{15} - 6.67 \times 10^{14})']
    source: {cite: siy122, at: 'Sec. 12.2 (our own step)'}
    origin: page-own

  - id: hs7p-p3-b
    answer: p3-b
    where: 'Problem 3(b), answer box: h = e(V1 − V2)/(f1 − f2)'
    inputs: {e: 1.6e-19, V1: 1.84, V2: 0.46, c: 3.00e8, l1: 300e-9, l2: 450e-9}
    formula: e * (V1 - V2) / (c/l1 - c/l2)
    expected: '6.62e-34'
    tolerance: '0.2%'
    shown: ['= 6.62 \times 10^{-34}\ \text{J s}$']
    source: {cite: siy122, at: 'Sec. 12.2, hf = W₀ + E_k,max written for two frequencies (our own step)'}
    origin: page-own

  - id: hs7p-p3-b-identity
    kind: identity
    where: 'Problem 3(b): subtracting hf = W0 + eVs for two frequencies gives h = e(V1 − V2)/(f1 − f2); checked by building V from h and W0'
    formula: e*((h*f1 - W)/e - (h*f2 - W)/e)/(f1 - f2)
    equals: h
    samples:
      e: [1.6e-19, 1, 2, 1.6e-19]
      h: [6.63e-34, 1, 3, 6.6e-34]
      f1: [1.0e15, 5, 7, 2e15]
      f2: [6.67e14, 2, 1, 1e15]
      W: [3.68e-19, 1, 0.5, 2e-19]
    tolerance: 1e-9
    shown: ['h = \frac{e\,(V_1 - V_2)}{f_1 - f_2}']
    source: {cite: siy122, at: 'Sec. 12.2 (our own step)'}
    origin: page-own

  - id: hs7p-p3-b-accepted
    kind: fact
    where: 'Problem 3(b), check: the accepted h'
    value: 6.63e-34
    shown: ['the accepted $6.63 \times 10^{-34}\ \text{J s}$']
    source: {cite: siy115, at: 'Sec. 11.5'}
    origin: mit

  - id: hs7p-p3-c-hf1
    where: 'Problem 3(c): hf for 300 nm with the measured h, in J and eV'
    inputs: {h: 6.62e-34, f: 1.00e15, eV: 1.6e-19}
    formula: h * f / eV
    expected: '4.14'
    tolerance: '0.3%'
    shown: ['$hf = 6.62 \times 10^{-34} \times 1.00 \times 10^{15} = 6.62 \times 10^{-19}\ \text{J} = 4.14\ \text{eV}$']
    source: {cite: siy122, at: 'Sec. 12.2'}
    origin: page-own

  - id: hs7p-p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: W0 = hf − eVs for 300 nm, in eV, with the measured h'
    inputs: {e: 1.6e-19, V1: 1.84, V2: 0.46, c: 3.00e8, l1: 300e-9, l2: 450e-9}
    formula: (e*(V1 - V2)/(c/l1 - c/l2)) * (c/l1) / e - V1
    expected: '2.30'
    tolerance: '0.2%'
    shown: ['so $W_0 = hf - eV_s = 4.14 - 1.84 = 2.30\ \text{eV}$']
    source: {cite: siy122, at: 'Sec. 12.2, Implications of Einstein''s model'}
    origin: page-own

  - id: hs7p-p3-c-hf2
    where: 'Problem 3(c), check: hf for 450 nm with the measured h, in J and eV'
    inputs: {h: 6.624e-34, f: 6.6667e14, eV: 1.6e-19}
    formula: h * f / eV
    expected: '2.76'
    tolerance: '0.3%'
    shown: ['$hf = 6.62 \times 10^{-34} \times 6.67 \times 10^{14} = 4.42 \times 10^{-19}\ \text{J} = 2.76\ \text{eV}$']
    source: {cite: siy122, at: 'Sec. 12.2'}
    origin: page-own

  - id: hs7p-p3-c-check
    where: 'Problem 3(c), check: 2.76 − 0.46'
    inputs: {E: 2.76, V: 0.46}
    formula: E - V
    expected: '2.30'
    shown: ['and $2.76 - 0.46 = 2.30\ \text{eV}$']
    source: {cite: siy122, at: 'Sec. 12.2'}
    origin: page-own

  - id: hs7p-p3-d
    answer: p3-d
    where: 'Problem 3(d), answer box: threshold wavelength hc/W0 with W0 = 2.30 eV, in nm'
    inputs: {h: 6.63e-34, c: 3.00e8, W: 2.30, eV: 1.6e-19}
    formula: h * c / (W * eV) * 1e9
    expected: '540'
    tolerance: '0.5%'
    shown: ['= 5.40 \times 10^{-7}\ \text{m} = 540\ \text{nm}$']
    source: {cite: siy115, at: 'Sec. 11.5, E = hc/λ with E = W₀'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 4
  - id: hs7p-p4-a
    answer: p4-a
    where: 'Problem 4(a), answer box: number of pairs of four levels, 4 × 3/2 = 3 + 2 + 1'
    inputs: {n: 4}
    formula: n * (n - 1) / 2
    expected: '6'
    shown: ['That is $3 + 2 + 1 = 6$ jumps', 'four levels make $4 \times 3/2 = 6$ pairs']
    source: {cite: reading3, at: 'p. 7, eq. (2.31) (our own counting)'}
    origin: page-own

  - id: hs7p-p4-b-E4
    where: 'Problem 4(b): E4 = −13.6/16'
    inputs: {n: 4}
    formula: -13.6 / n**2
    expected: '-0.85'
    shown: ['$E_4 = -13.6/16 = -0.85\ \text{eV}$']
    source: {cite: reading3, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: hs7p-p4-b-E2
    where: 'Problem 4(b): E2 = −13.6/4'
    inputs: {n: 2}
    formula: -13.6 / n**2
    expected: '-3.40'
    shown: ['$E_2 = -13.6/4 = -3.40\ \text{eV}$']
    source: {cite: reading3, at: 'p. 7, eq. (2.31)'}
    origin: page-own

  - id: hs7p-p4-b-E
    where: 'Problem 4(b): photon energy 4 → 2 in eV and J'
    inputs: {eV: 1.6e-19}
    formula: (13.6/4 - 13.6/16) * eV
    expected: '4.08e-19'
    shown: ['$-0.85 - (-3.40) = 2.55\ \text{eV} = 2.55 \times 1.6 \times 10^{-19} = 4.08 \times 10^{-19}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: hs7p-p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: wavelength of the 4 → 2 photon, in nm'
    inputs: {h: 6.63e-34, c: 3.00e8, eV: 1.6e-19}
    formula: h * c / ((13.6/4 - 13.6/16) * eV) * 1e9
    expected: '488'
    tolerance: '0.2%'
    shown: ['= 4.88 \times 10^{-7}\ \text{m} = 488\ \text{nm}$']
    source: {cite: mit, at: 'Sec. 12.3, worked example: E = hc/λ'}
    origin: page-own

  - id: hs7p-p4-b-measured
    kind: fact
    where: 'Problem 4(b), check: the measured blue-green hydrogen line (lesson 7.5, NIST air wavelength 4861.3 Å)'
    value: 486.1
    shown: ['hydrogen''s line measured at $486.1\ \text{nm}$ (lesson 7.5)']
    source: {cite: mit, at: 'Sec. 12.3 (value as in lesson 7.5, from the NIST hydrogen table)'}
    origin: later-data

  - id: hs7p-p4-b-diff
    where: 'Problem 4(b), check: 487.5 against 486.1, "within 0.3%"'
    inputs: {a: 487.5, b: 486.1}
    formula: (a - b) / b * 100
    expected: '0.29'
    tolerance: '2%'
    shown: ['lands within 0.3% of it']
    source: {cite: mit, at: 'Sec. 12.3 (our own comparison)'}
    origin: page-own

  - id: hs7p-p4-c-E
    where: 'Problem 4(c): photon energy 4 → 1, in eV and J'
    inputs: {eV: 1.6e-19}
    formula: (13.6 - 13.6/16) * eV
    expected: '2.04e-18'
    shown: ['$-0.85 - (-13.6) = 12.75\ \text{eV} = 2.04 \times 10^{-18}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 12.3, Emission spectra'}
    origin: page-own

  - id: hs7p-p4-c
    answer: p4-c
    where: 'Problem 4(c), answer box: wavelength of the 4 → 1 photon, in nm'
    inputs: {h: 6.63e-34, c: 3.00e8, eV: 1.6e-19}
    formula: h * c / ((13.6 - 13.6/16) * eV) * 1e9
    expected: '97.5'
    tolerance: '0.2%'
    shown: ['= 9.75 \times 10^{-8}\ \text{m} = 97.5\ \text{nm}$']
    source: {cite: mit, at: 'Sec. 12.3, worked example: E = hc/λ'}
    origin: page-own

  - id: hs7p-p4-c-43
    where: 'Problem 4(c), check: wavelength 4 → 3 in nm'
    inputs: {hc: 1.989e-25, eV: 1.6e-19}
    formula: hc / ((13.6/9 - 13.6/16) * eV) * 1e9
    expected: '1880'
    tolerance: '0.2%'
    shown: ['$1880$ ($4 \to 3$)']
