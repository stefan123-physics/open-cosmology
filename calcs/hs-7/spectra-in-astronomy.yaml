  - id: helium-sodium-gap
    where: 'helium section and worked example "What is the glowing cloud made of?", step "Sodium?": distance from the helium line to the nearer sodium line'
    inputs: {na: 589.0 nm, he: 587.6 nm}
    formula: na - he
    expected: 1.4 nm
    shown: ['about $1.4\ \text{nm}$ away from the nearer of the two', '$589.0 - 587.6 = 1.4\ \text{nm}$ away']
    source: {cite: nistHe, at: '5875.61 Å, with nistNa 5889.95 Å'}
    origin: page-own

  - id: z-equals-ratio
    kind: identity
    where: 'section "Motion": Δλ/λ_em equals the redshift z = (λ_obs − λ_em)/λ_em of lesson 5.13, and v = c Δλ/λ_em is the same formula solved for v'
    formula: c * ((lo - le) / le)
    equals: c * (lo / le - 1)
    samples: {c: [300000.0, 300000.0, 300000.0], lo: [589.12, 588.88, 502.1], le: [589.0, 589.0, 501.6]}
    tolerance: 1e-9
    shown: ['tex="v = c\,\frac{\Delta\lambda}{\lambda_\text{em}}"']
    source: {cite: mit3, at: 'pp. 2–5, 15–19'}
    origin: mit

  - id: slider-fraction
    where: 'section "Motion": 9000 km/s as a fraction of c'
    inputs: {v: 9000 km/s, c: 3.00e5 km/s}
    formula: v / c
    expected: 0.03
    shown: ['even at $9000\ \text{km/s}$, $3$ % of the speed of light']
    source: {cite: mit3, at: 'pp. 15–19'}
    origin: page-own

  - id: slider-h-alpha-shift
    where: 'section "Motion": shift of the red hydrogen line at 9000 km/s'
    inputs: {v: 9000 km/s, c: 3.00e5 km/s, le: 656.3 nm}
    formula: le * v / c
    expected: 20 nm
    tolerance: '3%'
    shown: ['the red hydrogen line moves only about $20\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 4–5'}
    origin: page-own

  - id: binary-shift-1
    where: 'worked example "A star with an invisible partner", step "First night"'
    inputs: {lo: 589.12 nm, le: 589.0 nm}
    formula: lo - le
    expected: 0.12 nm
    shown: ['$\Delta\lambda = 589.12 - 589.0 = +0.12\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: binary-v-1
    where: 'worked example, step "First night": v = c Δλ/λ_em'
    inputs: {c: 3.00e5 km/s, dl: 0.12 nm, le: 589.0 nm}
    formula: c * dl / le
    expected: 61 km/s
    shown: ['\times 0.12/589.0 = +61\ \text{km/s}$', 'moves away from us at $61\ \text{km/s}$', '$61\ \text{km/s}$ away and then $61\ \text{km/s}$ towards us']
    source: {cite: mit3, at: 'pp. 4–5 and 15–19'}
    origin: page-own

  - id: binary-shift-2
    where: 'worked example, step "A few nights later"'
    inputs: {lo: 588.88 nm, le: 589.0 nm}
    formula: lo - le
    expected: -0.12 nm
    shown: ['$\Delta\lambda = 588.88 - 589.0 = -0.12\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: binary-v-2
    where: 'worked example, step "A few nights later"'
    inputs: {c: 3.00e5 km/s, dl: -0.12 nm, le: 589.0 nm}
    formula: c * dl / le
    expected: -61 km/s
    shown: ['so $v = -61\ \text{km/s}$']
    source: {cite: mit3, at: 'pp. 4–5 and 15–19'}
    origin: page-own

  - id: binary-d1-shift
    where: 'worked example, step "Check with the other sodium line": same fractional shift of the 589.6 nm line'
    inputs: {l1: 589.6 nm, dl: 0.12 nm, le: 589.0 nm}
    formula: l1 * dl / le
    expected: 0.12 nm
    shown: ['$589.6 \times 0.12/589.0 = 0.12\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 4–5'}
    origin: page-own

  - id: binary-d1-observed
    where: 'worked example, step "Check with the other sodium line": observed position'
    inputs: {l1: 589.6 nm, dl: 0.12 nm, le: 589.0 nm}
    formula: l1 * (1 + dl / le)
    expected: 589.72 nm
    shown: ['found at $589.72\ \text{nm}$ on the first night']
    source: {cite: mit3, at: 'pp. 4–5'}
    origin: page-own

  - id: binary-middle
    where: 'worked example, step "Interpretation": middle of the swing'
    inputs: {a: 589.12 nm, b: 588.88 nm}
    formula: (a + b) / 2
    expected: 589.00 nm
    shown: ['$(589.12 + 588.88)/2 = 589.00\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: quiz-3-shift
    where: 'quiz 3 explanation: Δλ'
    inputs: {lo: 502.1 nm, le: 501.6 nm}
    formula: lo - le
    expected: 0.5 nm
    shown: ['$\\Delta\\lambda = 502.1 - 501.6 = 0.5\\ \\text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: quiz-3-speed
    where: 'quiz 3: speed of the star (two choices show 299 km/s, so no quiz tag)'
    inputs: {c: 3.00e5 km/s, dl: 0.5 nm, le: 501.6 nm}
    formula: c * dl / le
    expected: 299 km/s
    shown: ['3.00 \\times 10^{5} \\times 0.5/501.6 = 299\\ \\text{km/s}$', '"About $299\\ \\text{km/s}$, away from us"']
    source: {cite: mit3, at: 'pp. 4–5 and 15–19'}
    origin: page-own

  - id: quiz-3-wrong-no-divide
    where: 'quiz 3 wrong choice: c times 0.5, forgetting to divide by λ_em'
    inputs: {c: 3.00e5 km/s}
    formula: c * 0.5
    expected: 1.5e5 km/s
    shown: ['"About $1.5 \\times 10^{5}\\ \\text{km/s}$, away from us"', 'gives $1.5 \\times 10^{5}$ km/s, half the speed of light']
    source: {cite: mit3, at: 'pp. 4–5'}
    origin: page-own
