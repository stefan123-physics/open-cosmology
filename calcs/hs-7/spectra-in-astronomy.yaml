# Calculations on content/year-0/hs-7/spectra-in-astronomy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 6: c = 3.00e8 m/s = 3.00e5 km/s. Laboratory wavelengths: NIST air wavelengths, rounded to 0.1 nm.

page: content/year-0/hs-7/spectra-in-astronomy.mdx
calcs:
  - id: c-km-s
    kind: fact
    where: 'worked example "A star with an invisible partner" and quiz 3: the speed of light in km/s (lesson 5.13)'
    value: 3.00e5 km/s
    shown: ['$v = c\,\Delta\lambda/\lambda_\text{em} = 3.00 \times 10^{5}\ \text{km/s} \times 0.12/589.0 = +61\ \text{km/s}$']
    source: {cite: mit3, at: 'pp. 15–19 (c)'}
    origin: page-own

  - id: h-410
