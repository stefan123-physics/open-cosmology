# Calculations on content/year-0/hs-7/towards-the-universe-reading-starlight.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 6/7: c = 3.00e8 m/s, Wien constant 2.9e-3 m K, sigma = 5.67e-8 W m^-2 K^-4.

page: content/year-0/hs-7/towards-the-universe-reading-starlight.mdx
calcs:
  - id: wien-constant
    kind: fact
    where: 'table "One beam, many messages": Wien''s law (recap of lessons 7.2 and 7.6)'
    value: 2.9e-3 m*K
    shown: ['$\lambda_{\max}T = 2.9 \times 10^{-3}\ \text{m K}$']
    source: {cite: mit8902l8, at: 'recap of lesson 7.6'}
    origin: mit

  - id: flux-identity
    kind: identity
    where: 'formula "Flux at a distance d": the same power crosses every sphere, F(r1)·4πr1² = F(r2)·4πr2² = L'
    formula: (L / (4 * pi * d**2)) * 4 * pi * d**2
    equals: L
    samples: {L: [2.262e27, 3.8e26], d: [3.0e17, 1.5e11]}
    tolerance: 1e-9
    shown: ['tex="F = \frac{L}{4\pi d^2}"']
    source: {cite: mit, at: 'eqs. (3)–(4), p. 4'}
    origin: mit

  - id: radius-identity
    kind: identity
    where: 'formula "Radius of a star": R = sqrt(L/(4πσT⁴)) inverts L = 4πR²σT⁴'
    formula: sqrt((4 * pi * R**2 * s * T**4) / (4 * pi * s * T**4))
    equals: R
    samples: {R: [3.5e9, 6.96e8], s: [5.67e-8, 5.67e-8], T: [4000, 5772]}
    tolerance: 1e-9
    shown: ['tex="R = \sqrt{\frac{L}{4\pi\sigma T^4}}"']
    source: {cite: mit8902l8, at: 'p. 50'}
    origin: page-own

  - id: ex1-temperature
    where: 'worked example "A whole star", step "Temperature": Wien''s law at 725 nm'
    inputs: {b: 2.9e-3 m*K, lam: 725e-9 m}
    formula: b / lam
    expected: 4.0e3 K
    tolerance: '1%'
    shown: ['$T = \dfrac{2.9 \times 10^{-3}}{725 \times 10^{-9}} = 4.0 \times 10^{3}\ \text{K}$']
    source: {cite: mit8902l8, at: 'recap of lesson 7.6'}
    origin: page-own

  - id: ex1-shift
    where: 'worked example "A whole star", step "Motion": Δλ = 656.19 − 656.3'
    inputs: {lo: 656.19 nm, le: 656.3 nm}
    formula: lo - le
    expected: -0.11 nm
    tolerance: '1%'
    shown: ['$\Delta\lambda = 656.19 - 656.3 = -0.11\ \text{nm}$']
    source: {cite: mit, at: 'eq. (24), p. 11'}
    origin: page-own

  - id: ex1-speed
    where: 'worked example "A whole star", step "Motion": v = c Δλ/λ_em'
    inputs: {c: 3.00e5 km/s, dl: -0.11 nm, le: 656.3 nm}
    formula: c * dl / le
    expected: -50 km/s
    tolerance: '2%'
    shown: ['\dfrac{-0.11}{656.3} = -50\ \text{km/s}$', 'comes towards us at about $50\ \text{km/s}$']
    source: {cite: mit, at: 'eq. (26), p. 11'}
    origin: page-own

  - id: ex1-light-years
    where: 'worked example "A whole star": 3.0e17 m in light-years (1 ly = 9.46e15 m)'
    inputs: {d: 3.0e17 m, ly: 9.46e15 m}
    formula: d / ly
    expected: '32'
    tolerance: '2%'
    shown: ['about 32 light-years']
    source: {cite: mit, at: 'conversion with 1 light-year = 9.46e15 m (lesson 1.11)'}
    origin: page-own

  - id: ex1-luminosity
    where: 'worked example "A whole star", step "Luminosity": L = 4πd²F'
    inputs: {d: 3.0e17 m, F: 2.0e-9 W/m**2}
    formula: 4 * pi * d**2 * F
    expected: 2.3e27 W
    tolerance: '2%'
    shown: ['\times 2.0 \times 10^{-9} = 2.3 \times 10^{27}\ \text{W}$']
    source: {cite: mit, at: 'eqs. (3)–(4), p. 4'}
    origin: page-own

  - id: sun-luminosity
    kind: fact
    where: 'worked example "A whole star": the Sun''s luminosity 382.8e24 W, rounded'
    value: 3.8e26 W
    shown: ['the Sun''s $3.8 \times 10^{26}\ \text{W}$']
    source: {cite: nasaSun, at: 'luminosity 382.8 × 10²⁴ J/s'}
    origin: later-data

  - id: ex1-luminosity-ratio
    where: 'worked example "A whole star": L / L_Sun, "about 6 times"'
    inputs: {d: 3.0e17 m, F: 2.0e-9 W/m**2, Ls: 3.828e26 W}
    formula: 4 * pi * d**2 * F / Ls
    expected: '6'
    tolerance: '5%'
    shown: ['about 6 times the Sun''s']
    source: {cite: nasaSun, at: 'luminosity'}
    origin: page-own

  - id: ex1-sigma-t4
    where: 'worked example "A whole star", step "Radius": σT⁴ at 4000 K'
    inputs: {s: 5.67e-8 W/m**2/K**4, T: 4000 K}
    formula: s * T**4
    expected: 1.45e7 W/m**2
    tolerance: '1%'
    shown: ['$\sigma T^4 = 5.67 \times 10^{-8} \times 4000^4 = 1.45 \times 10^{7}\ \text{W/m}^2$']
    source: {cite: mit8902l8, at: 'p. 50'}
    origin: page-own

  - id: ex1-radius
    where: 'worked example "A whole star", step "Radius": R = sqrt(L/(4πσT⁴)) with the unrounded L'
    inputs: {d: 3.0e17 m, F: 2.0e-9 W/m**2, s: 5.67e-8 W/m**2/K**4, T: 4000 K}
    formula: sqrt(4 * pi * d**2 * F / (4 * pi * s * T**4))
    expected: 3.5e9 m
    tolerance: '2%'
    shown: ['= 3.5 \times 10^{9}\ \text{m}$']
    source: {cite: mit8902l8, at: 'p. 50'}
    origin: page-own

  - id: sun-radius
    kind: fact
    where: 'worked example "A whole star": the Sun''s radius 695 700 km, rounded'
    value: 6.96e8 m
    shown: ['($6.96 \times 10^{8}\ \text{m}$)']
    source: {cite: nasaSun, at: 'volumetric mean radius 695 700 km'}
    origin: later-data

  - id: ex1-radius-ratio
    where: 'worked example "A whole star": R / R_Sun, "about 5 times"'
    inputs: {d: 3.0e17 m, F: 2.0e-9 W/m**2, s: 5.67e-8 W/m**2/K**4, T: 4000 K, Rs: 6.96e8 m}
    formula: sqrt(4 * pi * d**2 * F / (4 * pi * s * T**4)) / Rs
    expected: '5'
    tolerance: '3%'
    shown: ['about 5 times the radius of the Sun']
    source: {cite: nasaSun, at: 'radius'}
    origin: page-own

  - id: h0
    kind: fact
    where: 'section "The galaxies'' redshift" and worked example: H₀ = 70 km/s/Mpc, the round value of lesson 5.13'
    value: 70 km/s/Mpc
    shown: ['$H_0$ close to $70\ \text{km/s/Mpc}$', '$H_0 = 70\ \text{km/s/Mpc}$']
    source: {cite: siyavula63, at: 'Hubble''s law'}
    origin: later-data

  - id: mpc-ly
    kind: fact
    where: 'section "The galaxies'' redshift": 1 Mpc ≈ 3.3 million light-years'
    value: 3.3e6
    shown: ['one megaparsec is about 3.3 million light-years']
    source: {cite: siyavula63, at: '1 Mpc ≈ 3.3 million light years'}
    origin: mit

  - id: ex2-z
    where: 'worked example "A galaxy from two hydrogen lines", step "The redshift"'
    inputs: {lo: 501.9 nm, le: 486.1 nm}
    formula: (lo - le) / le
    expected: '0.0325'
    tolerance: '0.5%'
    shown: ['= \dfrac{15.8}{486.1} = 0.0325$']
    source: {cite: mit, at: 'eq. (24), p. 11'}
    origin: page-own

  - id: ex2-speed
    where: 'worked example, step "The speed": v ≈ cz'
    inputs: {c: 3.00e5 km/s, z: 0.0325}
    formula: c * z
    expected: 9750 km/s
    tolerance: '0.5%'
    shown: ['= 9750\ \text{km/s}$']
    source: {cite: mit, at: 'eq. (26), p. 11'}
    origin: page-own

  - id: ex2-check-line
    where: 'worked example, step "Check with the other line": 656.3 × 1.0325'
    inputs: {le: 656.3 nm, z: 0.0325}
    formula: le * (1 + z)
    expected: 677.6 nm
    tolerance: '0.02%'
    shown: ['$656.3 \times 1.0325 = 677.6\ \text{nm}$']
    source: {cite: mit, at: 'eq. (24), p. 11'}
    origin: page-own

  - id: ex2-distance
    where: 'worked example, step "The distance": d = v/H₀'
    inputs: {v: 9750, H: 70}
    formula: v / H
    expected: '139'
    tolerance: '0.5%'
    shown: ['= 139\ \text{Mpc}$']
    source: {cite: mit, at: 'eqs. (25)–(26), p. 11'}
    origin: page-own

  - id: ex2-light-years
    where: 'worked example, step "The distance": 139 Mpc × 3.3 million light-years'
    inputs: {d: 139, m: 3.3e6}
    formula: d * m
    expected: '4.6e8'
    tolerance: '1%'
    shown: ['about 460 million light-years', 'roughly 460 million years ago']
    source: {cite: siyavula63, at: '1 Mpc ≈ 3.3 million light years'}
    origin: page-own

  - id: t-cmb
    kind: fact
    where: 'section "The oldest light", flashcard and Summary: T_CMB = 2.725 K (COBE FIRAS)'
    value: 2.725 K
    shown: ['a temperature of $2.725\ \text{K}$', 'a black body at $2.725\ \text{K}$', 'a $2.725\ \text{K}$ black body']
    source: {cite: firas, at: '2.725 ± 0.002 K'}
    origin: later-data

  - id: t-decoupling
    kind: fact
    where: 'section "The oldest light": decoupling at about 3000 K, about 380 000 years after the Big Bang'
    value: 3000 K
    shown: ['at about $3000\ \text{K}$, some 380 000 years after the Big Bang']
    source: {cite: reading2, at: 'p. 19'}
    origin: mit

  - id: cmb-redshift
    where: 'section "The oldest light": 1 + z = 3000/2.725'
    inputs: {Td: 3000 K, T0: 2.725 K}
    formula: Td / T0
    expected: '1100'
    tolerance: '0.5%'
    shown: ['$1 + z = 3000/2.725 = 1100$', 'by a factor $1 + z \approx 1100$ since']
    source: {cite: reading2, at: 'pp. 18–19'}
    origin: page-own

  - id: cmb-redshift-quiz
    where: 'quiz 4 explanation: 3000/2.725 = 1100'
    inputs: {Td: 3000 K, T0: 2.725 K}
    formula: Td / T0
    expected: '1100'
    tolerance: '0.5%'
    shown: ['$3000/2.725 = 1100$, the same factor']
    source: {cite: reading2, at: 'pp. 18–19'}
    origin: page-own
    quiz: 3

  - id: cmb-peak-then
    where: 'section "The oldest light": Wien peak at 3000 K'
    inputs: {b: 2.9e-3 m*K, T: 3000 K}
    formula: b / T
    expected: 970 nm
    tolerance: '0.5%'
    shown: ['$(2.9 \times 10^{-3})/3000 = 970\ \text{nm}$']
    source: {cite: mit8902l8, at: 'recap of lesson 7.6'}
    origin: page-own

  - id: cmb-peak-now
    where: 'section "The oldest light": the 3000 K peak stretched by 3000/2.725, "near 1.06 mm"'
    inputs: {b: 2.9e-3 m*K, Td: 3000 K, T0: 2.725 K}
    formula: (b / Td) * (Td / T0)
    expected: 1.06 mm
    tolerance: '0.5%'
    shown: ['it now lies near $1.06\ \text{mm}$']
    source: {cite: reading2, at: 'p. 18'}
    origin: page-own

  - id: cmb-peak-identity
    kind: identity
    where: 'section "The oldest light": stretching the peak by T_then/T_now gives Wien''s peak for T_now'
    formula: (b / Tt) * (Tt / Tn)
    equals: b / Tn
    samples: {b: [2.9e-3, 2.9e-3], Tt: [3000, 4000], Tn: [2.725, 2.7]}
    tolerance: 1e-9
    shown: ['exactly where Wien''s law puts the peak']
    source: {cite: reading2, at: 'p. 18'}
    origin: page-own

  - id: plot-z1
    where: 'plot caption: background temperature when light with z = 1 set out'
    inputs: {T0: 2.725 K, z: 1}
    formula: T0 * (1 + z)
    expected: 5.5 K
    tolerance: '1%'
    shown: ['about 5.5 K']
    source: {cite: reading2, at: 'p. 18'}
    origin: page-own

  - id: plot-point
    where: 'plot point "light released" at z = 1100: 2.725 × 1101 ≈ 3000 K'
    inputs: {T0: 2.725 K, z: 1100}
    formula: T0 * (1 + z)
    expected: 3000 K
    tolerance: '0.1%'
    shown: ['{ x: 1100, y: 3000, label: "light released" }']
    source: {cite: reading2, at: 'p. 19'}
    origin: page-own

  - id: helium-fraction
    kind: fact
    where: 'section "Hydrogen and helium everywhere": three quarters hydrogen, one quarter helium by mass'
    value: '0.25'
    shown: ['universe is about three quarters hydrogen and one quarter helium by mass, with only']
    source: {cite: nasaAsk, at: 'answer 010902a'}
    origin: later-data

  - id: h-per-he
    where: 'section "Hydrogen and helium everywhere" and quiz 5: hydrogen atoms per helium atom, 75/(25/4)'
    inputs: {h: 75, he: 25, m: 4}
    formula: h / (he / m)
    expected: '12'
    shown: ['about 12 hydrogen atoms for every helium atom', '$75/(25/4) = 12$ hydrogen atoms']
    source: {cite: nasaAsk, at: 'answer 010902a'}
    origin: page-own
    quiz: 4

  - id: quiz1-temperature
    where: 'quiz 1: Wien''s law at 580 nm'
    inputs: {b: 2.9e-3 m*K, lam: 580e-9 m}
    formula: b / lam
    expected: 5.0e3 K
    tolerance: '0.5%'
    shown: ['= 5.0 \\times 10^{3}\\ \\text{K}$, a little cooler']
    source: {cite: mit8902l8, at: 'recap of lesson 7.6'}
    origin: page-own
    quiz: 0

  - id: quiz2-z
    where: 'quiz 2: z = 26.2/656.3'
    inputs: {lo: 682.5 nm, le: 656.3 nm}
    formula: (lo - le) / le
    expected: '0.040'
    tolerance: '0.5%'
    shown: ['= 26.2/656.3 = 0.040$']
    source: {cite: mit, at: 'eq. (24), p. 11'}
    origin: page-own

  - id: quiz2-speed
    where: 'quiz 2: v ≈ cz with the unrounded z, "about 12 000 km/s"'
    inputs: {c: 3.00e5 km/s, lo: 682.5 nm, le: 656.3 nm}
    formula: c * (lo - le) / le
    expected: 12000 km/s
    tolerance: '0.5%'
    shown: ['About $12\\,000\\ \\text{km/s}$', '= 12\\,000\\ \\text{km/s}$']
    source: {cite: mit, at: 'eq. (26), p. 11'}
    origin: page-own

  - id: quiz3-radius
    where: 'quiz 3: same flux and temperature, 3 times the distance: L ∝ d², R ∝ sqrt(L) ∝ d'
    inputs: {k: 3}
    formula: sqrt(k**2)
    expected: '3'
    shown: ['B has three times the radius of A']
    source: {cite: mit, at: 'eqs. (3)–(4), p. 4'}
    origin: page-own
