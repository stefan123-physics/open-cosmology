# Calculations on content/year-0/hs-7/radiation-and-health.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Block 6/7 constants; doses in mGy, mSv and μSv are written as plain numbers in those units.

page: content/year-0/hs-7/radiation-and-health.mdx
calcs:
  - id: ionisation-ratio
    where: 'section "Why ionising radiation harms cells": a 5 MeV alpha particle against the 13.6 eV ionisation energy of hydrogen'
    inputs: {}
    formula: 5.0e6 / 13.6
    expected: '3.7e5'
    tolerance: '1%'
    shown: ['one of $5$ MeV has some $370\,000$ times that energy']
    source: {cite: reading1, at: 'p. 9 (alphas of a few MeV)'}
    origin: page-own

  - id: we-gamma-dose
    where: 'worked example "Dose from a beam of gamma rays": D = E/m'
    inputs: {E: 0.012 J, m: 60 kg}
    formula: E / m
    expected: 2.0e-4 J/kg
    tolerance: '1%'
    shown: ['$D = E/m = 0.012/60 = 2.0 \times 10^{-4}\ \text{J/kg}$', 'That is $2.0 \times 10^{-4}$ Gy, or $0.20$ mGy']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: we-gamma-chest
    where: 'worked example "Dose from a beam of gamma rays": 0.20 mGy (= 0.20 mSv for gamma rays) is about twice a chest X-ray of 0.1 mSv'
    inputs: {}
    formula: 0.20 / 0.1
    expected: '2'
    tolerance: '1%'
    shown: ['it is about twice the dose of a chest X-ray']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: ld50
    kind: fact
    where: 'worked example "Not a matter of heat" and section "How harmful is a dose?": about half die after 3.5 Gy without treatment'
    value: 3.5 Gy
    shown: ['A whole-body dose of about $3.5$ Gy', 'Around $3.5$ Gy, about half of the people die without treatment']
    source: {cite: reading4, at: 'p. 9'}
    origin: mit

  - id: ld50-energy
    where: 'worked example "Not a matter of heat": E = D m'
    inputs: {D: 3.5 J/kg, m: 60 kg}
    formula: D * m
    expected: 210 J
    tolerance: '1%'
    shown: ['$E = D\,m = 3.5 \times 60 = 210\ \text{J}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ld50-lamp
    where: 'worked example "Not a matter of heat": time for a 60 W lamp to use 210 J'
    inputs: {E: 210 J, P: 60 W}
    formula: E / P
    expected: 3.5 s
    tolerance: '1%'
    shown: ['the energy a $60\ \text{W}$ lamp uses in three and a half seconds']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ld50-warming
    where: 'worked example "Not a matter of heat": temperature rise of 60 kg of water from 210 J'
    inputs: {E: 210 J, m: 60 kg, cw: 4180 J/(kg*K)}
    formula: E / (m * cw)
    expected: 8.4e-4 K
    tolerance: '1%'
    shown: ['$210/(60 \times 4180) = 8.4 \times 10^{-4}$ K, less than a thousandth of a degree']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: weighting-alpha
    kind: fact
    where: 'table of weighting factors, worked example and summary: w_R = 20 for alpha particles'
    value: '20'
    shown: ['| alpha particles | 20 |', '$20$ for alpha particles']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: weighting-gamma-beta
    kind: fact
    where: 'table of weighting factors: w_R = 1 for X-rays, gamma rays and beta particles'
    value: '1'
    shown: ['| X-rays and gamma rays | 1 |', '| beta particles (electrons and positrons) | 1 |']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: we-alpha-lung
    where: 'worked example "Alpha against gamma": H = 20 × 0.50 mGy'
    inputs: {}
    formula: 20 * 0.50
    expected: '10'
    tolerance: '1%'
    shown: ['$H = w_R\,D = 20 \times 0.50 = 10$ mSv']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: we-gamma-lung
    where: 'worked example "Alpha against gamma": H = 1 × 0.50 mGy'
    inputs: {}
    formula: 1 * 0.50
    expected: '0.50'
    tolerance: '1%'
    shown: ['$H = 1 \times 0.50 = 0.50$ mSv']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: k40-body
    kind: fact
    where: 'section "Radiation all around us": potassium-40 decays per second in a human body'
    value: '4400'
    shown: ['enough potassium-40 for about 4400 decays a second']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: c14-body
    kind: fact
    where: 'section "Radiation all around us": carbon-14 decays per second in a human body'
    value: '3700'
    shown: ['enough carbon-14 for about 3700']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: chest-xray
    kind: fact
    where: 'table, section "Radiation in medicine": a chest X-ray, about 0.1 mSv'
    value: '0.1'
    shown: ['| a chest X-ray | about $0.1$ mSv (reading 2, p. 12) |', 'A chest X-ray gives about $0.1$ mSv.']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: ct-scan
    kind: fact
    where: 'table, section "Radiation in medicine": a CT scan, about 10 mSv'
    value: '10'
    shown: ['| a CT scan | about $10$ mSv (reading 2, p. 12) |', 'about $10$ mSv for a scan of the body']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: worker-limit
    kind: fact
    where: 'table and worked example "A long flight": occupational limit 50 mSv a year'
    value: '50'
    shown: ['| limit for people who work with radiation, per year | $50$ mSv (reading 2, p. 3) |', 'well below the $50$ mSv limit for radiation workers']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: astronaut-doses
    kind: fact
    where: 'table, callout and summary: astronauts receive effective doses of 50 to 2000 mSv'
    value: '2000'
    shown: ['| an astronaut''s mission | $50$ to $2000$ mSv (NASA) |', 'doses of $50$ to $2000$ mSv (NASA, Why Space Radiation Matters)', 'receive $50$ to $2000$ mSv from space radiation']
    source: {cite: nasaSpace, at: 'How much Space Radiation are Astronauts Exposed to?'}
    origin: later-data

  - id: dose-rate-ground
    kind: fact
    where: 'worked example "A long flight": about 0.03 μSv per hour on the ground'
    value: '0.03'
    shown: ['about $0.03$ μSv per hour']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: dose-rate-flight
    kind: fact
    where: 'worked example "A long flight": about 3.7 μSv per hour on a long-distance flight'
    value: '3.7'
    shown: ['it is about $3.7$ μSv per hour (reading 2, p. 13)']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: flight-dose
    where: 'worked example "A long flight": 10 h at 3.7 μSv per hour'
    inputs: {}
    formula: 10 * 3.7
    expected: '37'
    tolerance: '1%'
    shown: ['$10 \times 3.7 = 37$ μSv, or $0.037$ mSv']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: flight-vs-chest
    where: 'worked example "A long flight": 0.037 mSv against a 0.1 mSv chest X-ray'
    inputs: {}
    formula: 0.037 / 0.1
    expected: '0.37'
    tolerance: '1%'
    shown: ['about a third of a chest X-ray']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: ground-dose
    where: 'worked example "A long flight": 10 h at 0.03 μSv per hour'
    inputs: {}
    formula: 10 * 0.03
    expected: '0.3'
    tolerance: '1%'
    shown: ['$10 \times 0.03 = 0.3$ μSv']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: flight-ratio
    where: 'worked example "A long flight": 3.7/0.03, "a little more than 100" in the lecture'
    inputs: {}
    formula: 3.7 / 0.03
    expected: '120'
    tolerance: '5%'
    shown: ['$3.7/0.03 \approx 120$ times as much per hour']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: pilot-dose
    where: 'worked example "A long flight": 800 h a year at 3.7 μSv per hour'
    inputs: {}
    formula: 800 * 3.7
    expected: '2960'
    tolerance: '1%'
    shown: ['$800 \times 3.7 = 2960$ μSv, about $3.0$ mSv a year']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: plot-near
    where: 'plot: dose rate 10/x² μSv per hour at 0.5 m'
    inputs: {}
    formula: 10 / 0.5**2
    expected: '40'
    tolerance: '1%'
    shown: ['{ x: 0.5, y: 40, label: "40 at 0.5 m" }']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: plot-far
    where: 'plot: dose rate 10/x² μSv per hour at 2 m'
    inputs: {}
    formula: 10 / 2**2
    expected: '2.5'
    tolerance: '1%'
    shown: ['{ x: 2, y: 2.5, label: "2.5 at 2 m" }']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: plot-sixteen
    where: 'plot caption: four times as far lowers the dose rate (2/0.5)² = 16 times'
    inputs: {}
    formula: (2 / 0.5)**2
    expected: '16'
    shown: ['four times as far, lowers the dose rate sixteen times']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: tech-close
    where: 'worked example "Stepping back": 3.0 h at 40 μSv per hour'
    inputs: {}
    formula: 40 * 3.0
    expected: '120'
    tolerance: '1%'
    shown: ['$40 \times 3.0 = 120$ μSv']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: tech-rate-far
    where: 'worked example "Stepping back": dose rate at 2.0 m, (2.0/0.50)² = 16 times smaller'
    inputs: {}
    formula: 40 / (2.0 / 0.50)**2
    expected: '2.5'
    tolerance: '1%'
    shown: ['$4^2 = 16$ times smaller: $40/16 = 2.5$ μSv per hour']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: tech-far
    where: 'worked example "Stepping back": 3.0 h at 2.5 μSv per hour'
    inputs: {}
    formula: 2.5 * 3.0
    expected: '7.5'
    tolerance: '1%'
    shown: ['$2.5 \times 3.0 = 7.5$ μSv', 'The dose drops from $120$ to $7.5$ μSv']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own

  - id: astro-low
    where: 'worked example "Years of background in one mission": 50 mSv at 2 mSv a year'
    inputs: {}
    formula: 50 / 2
    expected: '25'
    shown: ['$50/2 = 25$ years of background']
    source: {cite: nasaSpace, at: 'How much Space Radiation are Astronauts Exposed to?'}
    origin: page-own

  - id: astro-high
    where: 'worked example "Years of background in one mission": 2000 mSv at 2 mSv a year'
    inputs: {}
    formula: 2000 / 2
    expected: '1000'
    shown: ['$2000/2 = 1000$ years']
    source: {cite: nasaSpace, at: 'How much Space Radiation are Astronauts Exposed to?'}
    origin: page-own

  - id: astro-chest
    where: 'worked example "Years of background in one mission": 2000 mSv in chest X-rays of 0.1 mSv (NASA: about 10 per mSv)'
    inputs: {}
    formula: 2000 / 0.1
    expected: '20000'
    tolerance: '1%'
    shown: ['the largest dose is $20\,000$ chest X-rays of $0.1$ mSv']
    source: {cite: nasaSpace, at: '1 mSv is about 10 chest X-rays'}
    origin: page-own

  - id: quiz-dose
    quiz: 0
    where: 'quiz 0: D = 0.030 J / 1.5 kg'
    inputs: {E: 0.030 J, m: 1.5 kg}
    formula: E / m
    expected: 0.020 J/kg
    tolerance: '1%'
    shown: ['$D = E/m = 0.030/1.5 = 0.020\\ \\text{J/kg}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: quiz-dose-wrong-multiply
    where: 'quiz 0, wrong choice: E × m'
    inputs: {}
    formula: 0.030 * 1.5
    expected: '0.045'
    tolerance: '1%'
    shown: ['Multiplying instead of dividing gives $0.045$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: quiz-dose-wrong-invert
    where: 'quiz 0, wrong choice: m / E'
    inputs: {}
    formula: 1.5 / 0.030
    expected: '50'
    tolerance: '1%'
    shown: ['dividing the wrong way round gives $50$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: quiz-alpha
    quiz: 1
    where: 'quiz 1: H = 20 × 0.2 mGy'
    inputs: {}
    formula: 20 * 0.2
    expected: '4'
    tolerance: '1%'
    shown: ['$H = 20 \\times 0.2 = 4$ mSv']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: quiz-distance
    quiz: 2
    where: 'quiz 2: three times as far, 3² = 9 times the area'
    inputs: {}
    formula: 3**2
    expected: '9'
    shown: ['the same radiation covers $3^2 = 9$ times the area']
    source: {cite: reading6, at: 'p. 1'}
    origin: page-own
