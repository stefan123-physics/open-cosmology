# Calculations on content/year-0/hs-7/discovering-the-atom.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Block 6/7 constants: e = 1.6 × 10⁻¹⁹ C, m_e = 9.11 × 10⁻³¹ kg, m_p = 1.67 × 10⁻²⁷ kg, k = 9.0 × 10⁹ N m²/C², 1 eV = 1.6 × 10⁻¹⁹ J.

page: content/year-0/hs-7/discovering-the-atom.mdx
calcs:
  - id: thomson-speed
    where: 'worked example "Weighing the electron", step 1: v = E/B'
    inputs: {E: 2.0e4 V/m, B: 1.0e-3 T}
    formula: E / B
    expected: 2.0e7 m/s
    shown: ['$v = E/B = (2.0 \times 10^{4})/(1.0 \times 10^{-3}) = 2.0 \times 10^{7}\ \text{m/s}$']
    source: {cite: reading2, at: 'Eq. (8.6.3)'}
    origin: page-own

  - id: thomson-speed-fraction-c
    where: 'worked example, step 1: 2.0 × 10⁷ m/s is about 7% of c'
    inputs: {v: 2.0e7 m/s, c: 3.00e8 m/s}
    formula: v / c
    expected: 0.067
    tolerance: '5%'
    shown: ['about 7% of the speed of light']
    source: {cite: reading2, at: 'Eq. (8.6.3)'}
    origin: page-own

  - id: thomson-e-over-m
    where: 'worked example, step 2: e/m = v/(rB) with r = 11.4 cm'
    inputs: {v: 2.0e7 m/s, r: 0.114 m, B: 1.0e-3 T}
    formula: v / (r * B)
    expected: 1.75e11 C/kg
    tolerance: '0.5%'
    shown: ['$e/m_e = v/(rB) = (2.0 \times 10^{7})/(0.114 \times 1.0 \times 10^{-3}) = 1.75 \times 10^{11}\ \text{C/kg}$']
    source: {cite: reading2, at: 'Eqs. (8.5.2) and (8.6.3)'}
    origin: page-own

  - id: thomson-radius-check
    where: 'worked example: the 11.4 cm radius is what r = m_e v/(eB) gives for the Block 6 constants'
    inputs: {m: 9.11e-31 kg, v: 2.0e7 m/s, e: 1.6e-19 C, B: 1.0e-3 T}
    formula: m * v / (e * B)
    expected: 0.114 m
    tolerance: '0.5%'
    shown: ['bends into a circle of radius $11.4\ \text{cm}$']
    source: {cite: reading2, at: 'Eq. (8.5.2)'}
    origin: page-own

  - id: e-over-me
    where: 'summary and flashcard: e/m_e = 1.6 × 10⁻¹⁹/9.11 × 10⁻³¹ ≈ 1.76 × 10¹¹ C/kg'
    inputs: {e: 1.6e-19 C, m: 9.11e-31 kg}
    formula: e / m
    expected: 1.76e11 C/kg
    tolerance: '0.5%'
    shown: ['$e/m_e \approx 1.76 \times 10^{11}\ \text{C/kg}$', 'about $1.76 \\times 10^{11}\\ \\text{C/kg}$']
    source: {cite: reading2, at: 'Sec. 8.6.1, after Eq. (8.6.4)'}
    origin: page-own

  - id: e-over-mp
    where: 'worked example, step 3: e/m_p for a hydrogen ion'
    inputs: {e: 1.6e-19 C, m: 1.67e-27 kg}
    formula: e / m
    expected: 9.6e7 C/kg
    tolerance: '0.5%'
    shown: ['$e/m_p = 1.6 \times 10^{-19}/1.67 \times 10^{-27} = 9.6 \times 10^{7}\ \text{C/kg}$']
    source: {cite: reading1, at: 'Sec. 4.3, mass of a hydrogen atom'}
    origin: page-own

  - id: ratio-1800
    where: 'worked example, step 3, flashcard and summary: the electron''s e/m is about 1800 times a hydrogen ion''s (1.75 × 10¹¹/9.6 × 10⁷ = 1830)'
    inputs: {a: 1.75e11, b: 9.58e7}
    formula: a / b
    expected: 1800
    tolerance: '3%'
    shown: ['The electron''s ratio is about 1800 times larger', 'some 1800 times that of a hydrogen ion', 'about 1800 times that of a hydrogen ion']
    source: {cite: reading2, at: 'Sec. 8.6.1'}
    origin: page-own

  - id: me-value
    kind: fact
    where: 'text: the electron mass, the Block 6 value'
    value: 9.11e-31 kg
    shown: ['$m_e = 9.11 \times 10^{-31}\ \text{kg}$']
    source: {cite: nistMe, at: 'electron mass'}
    origin: later-data

  - id: alpha-over-electron
    where: 'section "Rutherford''s gold-foil experiment": an alpha particle (about 4 m_p) is more than 7000 times as heavy as an electron'
    inputs: {mp: 1.67e-27 kg, me: 9.11e-31 kg}
    formula: 4 * mp / me
    expected: 7330
    tolerance: '1%'
    shown: ['more than 7000 times as heavy as an electron']
    source: {cite: reading1, at: 'Sec. 4.3'}
    origin: page-own

  - id: alpha-energy-joules
    where: 'worked example "An alpha particle against a gold nucleus", step 1: 5.0 MeV in joules'
    inputs: {E: 5.0e6, eV: 1.6e-19 J}
    formula: E * eV
    expected: 8.0e-13 J
    shown: ['$E_k = 5.0 \times 10^{6} \times 1.6 \times 10^{-19} = 8.0 \times 10^{-13}\ \text{J}$']
    source: {cite: reading3, at: 'Eq. (3.1.12)'}
    origin: page-own

  - id: kQq-gold
    where: 'worked example, step 2: kQq for gold (79e) and an alpha particle (2e)'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C}
    formula: k * 79 * 2 * e**2
    expected: 3.64e-26 J*m
    tolerance: '0.5%'
    shown: ['$kQq = 9.0 \times 10^{9} \times 79 \times 2 \times (1.6 \times 10^{-19})^2 = 3.64 \times 10^{-26}\ \text{J m}$']
    source: {cite: reading3, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: closest-approach-gold
    where: 'worked example, step 2, quiz 2 and summary: r = kQq/E_k for 5.0 MeV on gold'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C, E: 8.0e-13 J}
    formula: k * 79 * 2 * e**2 / E
    expected: 4.5e-14 m
    tolerance: '1.5%'
    shown: ['$r = 3.64 \times 10^{-26}/8.0 \times 10^{-13} = 4.5 \times 10^{-14}\ \text{m}$', 'stops $4.5 \\times 10^{-14}\\ \\text{m}$ from it', 'turns back $4.5 \times 10^{-14}\ \text{m}$ from a gold nucleus']
    source: {cite: reading3, at: 'Eq. (3.3.5) with conservation of energy'}
    origin: page-own

  - id: nucleus-vs-atom
    where: 'worked example, step 3: an atom''s radius, about 0.5 × 10⁻¹⁰ m, is more than a thousand times the nuclear radius bound 4.5 × 10⁻¹⁴ m'
    inputs: {a: 0.5e-10 m, r: 4.5e-14 m}
    formula: a / r
    expected: 1110
    tolerance: '1%'
    shown: ['more than a thousand times less than the radius of an atom', 'about $0.5 \times 10^{-10}\ \text{m}$, half of the width $10^{-10}\ \text{m}$']
    source: {cite: reading3, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: plot-coefficient
    where: 'plot caption: r in units of 10⁻¹⁴ m is 0.288 × (charge number)/(energy in MeV), from k·2e²/(1 MeV)'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C, MeV: 1.6e-13 J, u: 1e-14 m}
    formula: k * 2 * e**2 / MeV / u
    expected: 0.288
    tolerance: '0.1%'
    shown: ['r = 0.288 × (charge number of the nucleus)/(energy in MeV)']
    source: {cite: reading3, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: plot-point
    where: 'plot point: 5.0 MeV on gold at 4.55 (× 10⁻¹⁴ m)'
    inputs: {Z: 79, E: 5.0}
    formula: 0.288 * Z / E
    expected: 4.55
    tolerance: '0.5%'
    shown: ['points={[{ x: 5, y: 4.55, label: "5.0 MeV on gold" }]}']
    source: {cite: reading3, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: quiz-closest-8mev
    where: 'quiz 2: r scales as 1/E_k, 8.0 MeV on gold'
    inputs: {r: 4.5e-14 m}
    formula: r * 5.0 / 8.0
    expected: 2.8e-14 m
    tolerance: '1%'
    shown: ['$r = 4.5 \\times 10^{-14} \\times 5.0/8.0 = 2.8 \\times 10^{-14}\\ \\text{m}$']
    quiz: 2
    source: {cite: reading3, at: 'Eq. (3.3.5) with conservation of energy'}
    origin: page-own

  - id: quiz-closest-wrong-square
    where: 'quiz 2: the 1/E_k² mistake gives 1.8 × 10⁻¹⁴ m; the inverted ratio 7.3 × 10⁻¹⁴ m'
    inputs: {r: 4.5e-14 m}
    formula: r * (5.0 / 8.0)**2
    expected: 1.8e-14 m
    tolerance: '3%'
    shown: ['"$1.8 \\times 10^{-14}\\ \\text{m}$"']
    source: {cite: reading3, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: bohr-radius
    kind: fact
    where: 'section "How empty is an atom?": the Bohr radius, so a hydrogen atom is 2a₀ = 1.06 × 10⁻¹⁰ m across'
    value: 5.29177210544e-11 m
    shown: ['about $1.06 \times 10^{-10}\ \text{m}$ across']
    source: {cite: nistA0, at: 'CODATA 2022'}
    origin: later-data

  - id: hydrogen-diameter
    where: 'section "How empty is an atom?": hydrogen atom diameter 2a₀'
    inputs: {a0: 5.29177210544e-11 m}
    formula: 2 * a0
    expected: 1.06e-10 m
    tolerance: '0.5%'
    shown: ['$1.06 \times 10^{-10}/1.68 \times 10^{-15} = 6.3 \times 10^{4}$']
    source: {cite: nistA0, at: 'CODATA 2022'}
    origin: page-own

  - id: proton-diameter
    where: 'section "How empty is an atom?": proton diameter 2r_p'
    inputs: {rp: 8.4075e-16 m}
    formula: 2 * rp
    expected: 1.68e-15 m
    tolerance: '0.5%'
    shown: ['about $1.68 \times 10^{-15}\ \text{m}$ across', 'about $0.84 \times 10^{-15}\ \text{m}$']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: diameter-ratio
    where: 'worked example "The emptiness of a hydrogen atom", step 1 (and flashcard "some 60 000 times")'
    inputs: {a: 1.06e-10 m, b: 1.68e-15 m}
    formula: a / b
    expected: 6.3e4
    tolerance: '0.5%'
    shown: ['the atom is about 63 000 times wider than its nucleus', 'some 60 000 times smaller']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: volume-fraction
    where: 'worked example, step 2, flashcard and summary: (1/6.3 × 10⁴)³'
    inputs: {x: 6.3e4}
    formula: 1 / x**3
    expected: 4e-15
    tolerance: '2%'
    shown: ['$1/(6.3 \times 10^{4})^3 = 4 \times 10^{-15}$', 'only about $4 \\times 10^{-15}$ of the atom''s volume', 'only about $4 \times 10^{-15}$ of the volume']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: scaled-atom
    where: 'worked example, step 3: a 1 cm nucleus gives an atom 6.3 × 10⁴ cm = 630 m across'
    inputs: {x: 6.3e4, d: 0.01 m}
    formula: x * d
    expected: 630 m
    shown: ['$6.3 \times 10^{4}\ \text{cm} = 630\ \text{m}$']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: proton-volume
    where: 'text: volume of a proton of radius 0.84 × 10⁻¹⁵ m'
    inputs: {r: 0.84e-15 m}
    formula: 4 / 3 * pi * r**3
    expected: 2.5e-45 m**3
    tolerance: '1%'
    shown: ['$\tfrac43\pi (0.84 \times 10^{-15})^3 = 2.5 \times 10^{-45}\ \text{m}^3$']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: nuclear-density
    where: 'text, quiz 3 and summary: density of a proton, m_p/V'
    inputs: {m: 1.67e-27 kg, V: 2.48e-45 m**3}
    formula: m / V
    expected: 7e17 kg/m**3
    tolerance: '5%'
    shown: ['$1.67 \times 10^{-27}/2.5 \times 10^{-45} = 7 \times 10^{17}\ \text{kg/m}^3$', 'about $7 \\times 10^{17}\\ \\text{kg/m}^3$', 'about $7 \times 10^{17}\ \text{kg/m}^3$']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: density-vs-water
    where: 'text: 7 × 10¹⁷ kg/m³ is some 7 × 10¹⁴ times the density of water (1000 kg/m³)'
    inputs: {rho: 6.7e17 kg/m**3, w: 1000 kg/m**3}
    formula: rho / w
    expected: 7e14
    tolerance: '5%'
    shown: ['some $7 \times 10^{14}$ times the density of water']
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: quiz-teaspoon
    where: 'quiz 3: mass of 5.0 cm³ of matter at the proton''s density, 7 × 10¹⁷ kg/m³'
    inputs: {rho: 7e17 kg/m**3, V: 5.0e-6 m**3}
    formula: rho * V
    expected: 3.5e12 kg
    tolerance: '0.5%'
    shown: ['$7 \\times 10^{17} \\times 5.0 \\times 10^{-6} = 3.5 \\times 10^{12}\\ \\text{kg}$']
    quiz: 3
    source: {cite: nistRp, at: 'CODATA 2022'}
    origin: page-own

  - id: decoupling-time
    kind: fact
    where: 'callout "When the universe had no atoms": neutral atoms formed about 380 000 years after the Big Bang'
    value: 380000
    shown: ['about 380 000, as the university course works out in 8.286 Lecture 17']
    source: {cite: mit8286, at: 'p. 19'}
    origin: mit
