# Calculations on content/year-0/hs-4/conduction-and-convection.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-4/conduction-and-convection.mdx
calcs:
  - id: k-copper
    kind: fact
    where: 'table of thermal conductivities, flashcard 2 and summary: copper 390 W/(m K)'
    value: 390 W/m/K
    shown: ['| copper | 390 |', 'Copper about $390\\ \\text{W/(m K)}$', 'about $390\ \text{W/(m K)}$ for copper']
    source: {cite: reading1, at: 'Table 2.1'}
    origin: mit

  - id: k-air
    kind: fact
    where: 'table, sections "Why trapped air insulates", summary and quiz 2: still air 0.026 W/(m K)'
    value: 0.026 W/m/K
    shown: ['| air (still) | 0.026 |', 'Still air is one of the poorest conductors there is, $0.026\ \text{W/(m K)}$', 'about $0.026\\ \\text{W/(m K)}$']
    source: {cite: reading1, at: 'Table 2.1'}
    origin: mit

  - id: k-glass
    kind: fact
    where: 'table and window example: glass 0.87 W/(m K)'
    value: 0.87 W/m/K
    shown: ['| glass | 0.87 |', 'A single pane of glass ($k = 0.87\ \text{W/(m K)}$)']
    source: {cite: reading2, at: 'Table 2.1 (glass 0.5 BTU/(hr ft °F) = 0.87 W/(m K))'}
    origin: mit

  - id: k-concrete
    kind: fact
    where: 'table and wall example: concrete 1.4 W/(m K)'
    value: 1.4 W/m/K
    shown: ['| concrete | 1.4 |', 'concrete $0.15\ \text{m}$ thick ($k = 1.4\ \text{W/(m K)}$)']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: k-glassfibre
    kind: fact
    where: 'table, wall example and plot: glass fibre 0.043 W/(m K)'
    value: 0.043 W/m/K
    shown: ['| glass fibre insulation | 0.043 |', 'glass fibre $0.080\ \text{m}$ thick ($k = 0.043\ \text{W/(m K)}$)']
    source: {cite: mit, at: 'slide 11 (fiberglass insulation 0.043)'}
    origin: mit

  - id: copper-over-air
    where: 'section "The conduction law": copper conducts about 15 000 times better than still air'
    inputs: {kcu: 390 W/m/K, kair: 0.026 W/m/K}
    formula: kcu / kair
    expected: '15000'
    tolerance: '2%'
    shown: ['Copper conducts about 15 000 times better than still air']
    source: {cite: reading1, at: 'Table 2.1'}
    origin: page-own

  - id: glass-over-glassfibre
    where: 'section "Why trapped air insulates": glass conducts twenty times better than glass fibre'
    inputs: {kg: 0.87 W/m/K, kf: 0.043 W/m/K}
    formula: kg / kf
    expected: '20'
    tolerance: '3%'
    shown: ['which conducts twenty times better']
    source: {cite: reading2, at: 'Table 2.1'}
    origin: page-own

  - id: window-area
    where: 'window example: A = 1.5 m × 1.2 m'
    inputs: {w: 1.5 m, h: 1.2 m}
    formula: w * h
    expected: 1.8 m**2
    shown: ['$A = 1.5 \times 1.2 = 1.8\ \text{m}^2$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: window-flow
    where: 'window example (a): P = kAΔT/d through the glass'
    inputs: {k: 0.87 W/m/K, A: 1.8 m**2, dT: 0.50 K, d: 0.0040 m}
    formula: k * A * dT / d
    expected: 196 W
    tolerance: '0.5%'
    shown: ['$P = kA\,\Delta T/d = 0.87 \times 1.8 \times 0.50/0.0040 = 196\ \text{W}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: window-flow-20K
    where: 'window example (b): the whole 20 K across the glass'
    inputs: {k: 0.87 W/m/K, A: 1.8 m**2, dT: 20 K, d: 0.0040 m}
    formula: k * A * dT / d
    expected: 7.8e3 W
    shown: ['$P = 0.87 \times 1.8 \times 20/0.0040 = 7.8 \times 10^{3}\ \text{W}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: wall-bare
    where: 'wall example (a): bare concrete wall'
    inputs: {k: 1.4 W/m/K, A: 12 m**2, dT: 18 K, d: 0.15 m}
    formula: k * A * dT / d
    expected: 2.0e3 W
    shown: ['$P = kA\,\Delta T/d = 1.4 \times 12 \times 18/0.15 = 2.0 \times 10^{3}\ \text{W}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: wall-bare-day
    where: 'wall example (a): energy per day'
    inputs: {P: 2.0 kW, t: 24 hour}
    formula: P * t
    expected: 48 kW*hour
    shown: ['$2.0\ \text{kW} \times 24\ \text{h} = 48\ \text{kWh}$']
    source: {cite: mit, at: 'slide 11 (energy per day = power × 24 h)'}
    origin: page-own

  - id: wall-R1
    where: 'wall example: resistance of the concrete'
    inputs: {d: 0.15 m, k: 1.4 W/m/K, A: 12 m**2}
    formula: d / (k * A)
    expected: 8.9e-3 K/W
    shown: ['$R_1 = 0.15/(1.4 \times 12) = 8.9 \times 10^{-3}\ \text{K/W}$']
    source: {cite: reading1, at: 'Eq. (2.19)'}
    origin: page-own

  - id: wall-R2
    where: 'wall example: resistance of the glass fibre'
    inputs: {d: 0.080 m, k: 0.043 W/m/K, A: 12 m**2}
    formula: d / (k * A)
    expected: 0.155 K/W
    shown: ['$R_2 = 0.080/(0.043 \times 12) = 0.155\ \text{K/W}$']
    source: {cite: reading1, at: 'Eq. (2.19)'}
    origin: page-own

  - id: wall-Rsum
    where: 'wall example: R1 + R2'
    inputs: {d1: 0.15 m, k1: 1.4 W/m/K, d2: 0.080 m, k2: 0.043 W/m/K, A: 12 m**2}
    formula: d1 / (k1 * A) + d2 / (k2 * A)
    expected: 0.164 K/W
    shown: ['Together $R_1 + R_2 = 0.164\ \text{K/W}$']
    source: {cite: reading1, at: 'Eq. (2.20)'}
    origin: page-own

  - id: wall-insulated
    where: 'wall example (b): P = ΔT/(R1 + R2)'
    inputs: {dT: 18 K, d1: 0.15 m, k1: 1.4 W/m/K, d2: 0.080 m, k2: 0.043 W/m/K, A: 12 m**2}
    formula: dT / (d1 / (k1 * A) + d2 / (k2 * A))
    expected: 110 W
    shown: ['$P = \Delta T/(R_1 + R_2) = 18/0.164 = 110\ \text{W}$']
    source: {cite: reading1, at: 'Eq. (2.20)'}
    origin: page-own

  - id: wall-ratio
    where: 'wall example (b): about 18 times less'
    inputs: {dT: 18 K, d1: 0.15 m, k1: 1.4 W/m/K, d2: 0.080 m, k2: 0.043 W/m/K, A: 12 m**2}
    formula: (k1 * A * dT / d1) / (dT / (d1 / (k1 * A) + d2 / (k2 * A)))
    expected: '18'
    tolerance: '3%'
    shown: ['about 18 times less than before']
    source: {cite: reading1, at: 'Eq. (2.20)'}
    origin: page-own

  - id: wall-insulated-day
    where: 'wall example (b): energy per day'
    inputs: {P: 110 W, t: 24 hour}
    formula: P * t
    expected: 2.6 kW*hour
    shown: ['or $2.6\ \text{kWh}$ a day']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: wall-drop-concrete
    where: 'wall example: temperature drop across the concrete'
    inputs: {P: 110 W, R1: 8.9e-3 K/W}
    formula: P * R1
    expected: 0.98 K
    shown: ['$P R_1 = 110 \times 8.9 \times 10^{-3} = 0.98\ \text{K}$']
    source: {cite: reading1, at: 'Sec. 2.2, temperature drop across each slab'}
    origin: page-own

  - id: wall-drop-fibre
    where: 'wall example: temperature drop across the glass fibre'
    inputs: {dT: 18 K, d1: 0.15 m, k1: 1.4 W/m/K, d2: 0.080 m, k2: 0.043 W/m/K, A: 12 m**2}
    formula: dT * (d2 / (k2 * A)) / (d1 / (k1 * A) + d2 / (k2 * A))
    expected: 17.0 K
    shown: ['$P R_2 = 110 \times 0.155 = 17.0\ \text{K}$']
    source: {cite: reading1, at: 'Sec. 2.2, temperature drop across each slab'}
    origin: page-own

  - id: plot-wood
    where: 'plot caption: wood, ΔT = 20 K, d = 5.0 cm, A = 1 m²'
    inputs: {k: 0.16 W/m/K, A: 1 m**2, dT: 20 K, d: 0.050 m}
    formula: k * A * dT / d
    expected: 64 W
    shown: ['wood passes 64 W']
    source: {cite: mit, at: 'slides 10 and 11'}
    origin: page-own

  - id: plot-glassfibre
    where: 'plot caption: glass fibre, ΔT = 20 K, d = 5.0 cm, A = 1 m²'
    inputs: {k: 0.043 W/m/K, A: 1 m**2, dT: 20 K, d: 0.050 m}
    formula: k * A * dT / d
    expected: 17 W
    tolerance: '2%'
    shown: ['glass fibre 17 W']
    source: {cite: mit, at: 'slides 10 and 11'}
    origin: page-own

  - id: conduction-thickness-identity
    kind: identity
    where: 'thermal resistance: P = ΔT/R with R = d/(kA) is the conduction law'
    formula: dT / (d / (k * A))
    equals: k * A * dT / d
    samples: {dT: [1.0, 18.0, 20.0], d: [0.004, 0.15, 0.08], k: [0.87, 1.4, 0.043], A: [1.8, 12.0, 1.0]}
    tolerance: 1e-12
    shown: ['R = \frac{d}{k A}, \qquad P = \frac{\Delta T}{R}']
    source: {cite: reading1, at: 'Eq. (2.19)'}
    origin: mit

  - id: air-warm-density
    where: 'rising-air example: ρ2 = ρ1 T1/T2'
    inputs: {rho1: 1.20 kg/m**3, T1: 293 K, T2: 308 K}
    formula: rho1 * T1 / T2
    expected: 1.14 kg/m**3
    shown: ['$\rho_2 = \rho_1 T_1/T_2 = 1.20 \times 293/308 = 1.14\ \text{kg/m}^3$']
    source: {cite: reading4, at: 'Charles''s law'}
    origin: page-own

  - id: air-warm-less
    where: 'rising-air example: about 5% less dense'
    inputs: {T1: 293 K, T2: 308 K}
    formula: 1 - T1 / T2
    expected: '0.049'
    tolerance: '3%'
    shown: ['about 5% less than the air around it']
    source: {cite: reading4, at: 'Charles''s law'}
    origin: page-own

  - id: air-mass-difference
    where: 'rising-air example: mass difference per cubic metre'
    inputs: {rho1: 1.20 kg/m**3, T1: 293 K, T2: 308 K, V: 1 m**3}
    formula: (rho1 - rho1 * T1 / T2) * V
    expected: 0.058 kg
    tolerance: '1%'
    shown: ['$1.20 - 1.1416 = 0.058\ \text{kg}$']
    source: {cite: reading4, at: 'Charles''s law'}
    origin: page-own

  - id: air-net-force
    where: 'rising-air example: net upward force per cubic metre'
    inputs: {m: 0.0584 kg, g: 9.81 m/s**2}
    formula: m * g
    expected: 0.57 N
    shown: ['$0.058 \times 9.81 = 0.57\ \text{N}$']
    source: {cite: reading4, at: 'Charles''s law, with Archimedes from lesson 4.1'}
    origin: page-own

  - id: quiz-pan
    where: 'quiz 0: aluminium pan bottom'
    inputs: {k: 200 W/m/K, A: 0.020 m**2, dT: 4.0 K, d: 0.0040 m}
    formula: k * A * dT / d
    expected: 4.0e3 W
    shown: ['$P = kA\\,\\Delta T/d = 200 \\times 0.020 \\times 4.0/0.0040 = 4.0 \\times 10^{3}\\ \\text{W}$']
    quiz: 0
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: quiz-pan-no-d
    where: 'quiz 0 explanation: leaving out d'
    inputs: {k: 200 W/m/K, A: 0.020 m**2, dT: 4.0 K}
    formula: k * A * dT
    expected: 16 W*m
    shown: ['Leaving out $d$ gives $16\\ \\text{W}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: quiz-pan-no-A
    where: 'quiz 0 explanation: leaving out A'
    inputs: {k: 200 W/m/K, dT: 4.0 K, d: 0.0040 m}
    formula: k * dT / d
    expected: 2.0e5 W/m**2
    shown: ['leaving out $A$ gives $2.0 \\times 10^{5}\\ \\text{W}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: quiz-pan-times-d
    where: 'quiz 0 explanation: multiplying by d'
    inputs: {k: 200 W/m/K, A: 0.020 m**2, dT: 4.0 K, d: 0.0040 m}
    formula: k * A * dT * d
    expected: 0.064 W*m**2
    shown: ['multiplying by $d$ instead of dividing gives $0.064\\ \\text{W}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: quiz-loft
    where: 'quiz 1: doubling the thickness halves the flow'
    inputs: {P: 300 W, d1: 0.10 m, d2: 0.20 m}
    formula: P * d1 / d2
    expected: 150 W
    shown: ['$300/2 = 150\\ \\text{W}$']
    quiz: 1
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: steel-over-wood
    where: 'quiz 4: steel (about 50) hundreds of times wood (0.16)'
    inputs: {ks: 50 W/m/K, kw: 0.16 W/m/K}
    formula: ks / kw
    expected: '310'
    tolerance: '2%'
    shown: ['is hundreds of times that of wood']
    source: {cite: reading1, at: 'Table 2.1 (steel 50); slide 11 of the main source (hard wood 0.16)'}
    origin: page-own
