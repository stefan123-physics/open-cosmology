  - id: fridge-kitchen-gain
    where: 'worked example "Why a fridge needs a plug" (a): kitchen gains 1500/298 = 5.03 J/K'
    inputs: {Q: 1500 J, Th: 298 K}
    formula: Q / Th
    expected: 5.03 J/K
    shown: ['+ 5.03 = -0.56']
    source: {cite: nasa-2law, at: 'ΔS = ΔQ/T'}
    origin: page-own

  - id: fridge-no-work-total
    where: 'worked example "Why a fridge needs a plug" (a): total −0.56 J/K'
    inputs: {Q: 1500 J, Tc: 268 K, Th: 298 K}
    formula: -Q / Tc + Q / Th
    expected: -0.56 J/K
    shown: ['= -0.56\ \text{J/K}$. The total entropy would decrease']
    source: {cite: nasa-2law, at: 'total entropy change'}
    origin: page-own

  - id: fridge-min-heat-out
    where: 'worked example "Why a fridge needs a plug" (b): Q_h ≥ 1500 × 298/268 = 1668 J'
    inputs: {Q: 1500 J, Tc: 268 K, Th: 298 K}
    formula: Q * Th / Tc
    expected: 1668 J
    shown: ['$Q_h \geq 1500 \times 298/268 = 1668\ \text{J}$']
    source: {cite: reading2, at: 'slide 10 (combining the first and second laws)'}
    origin: page-own

  - id: fridge-min-work
    where: 'worked example "Why a fridge needs a plug" (b): W ≥ 1668 − 1500 = 168 J'
    inputs: {Q: 1500 J, Tc: 268 K, Th: 298 K}
