# Calculations on content/year-0/hs-4/entropy-and-the-second-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 4: k_B = 1.38e-23 J/K, N_A = 6.02e23 /mol, 0 °C = 273 K, L_f(ice) = 3.34e5 J/kg (lesson 4.6).
# Slide numbers of the 8.21 slides are the numbers printed on each slide ("8 / 16"); the PDF page is one more,
# because the PDF starts with an OCW cover page. 8.044 slides: "8.044 L8B2" = slide 2.
# All worked-example and quiz numbers are the page's own; the sources give the formulas and, on 8.21 Lecture 8
# slide 12, the table of Carnot and real efficiencies (T- = 300 K; coal steam plant T+ 800 K, Carnot 62%, real 40%;
# car (Otto) engine T+ 2300 K, Carnot 87%, real 25%), which the page quotes.

page: content/year-0/hs-4/entropy-and-the-second-law.mdx
calcs:
  # Counting arrangements
  - id: four-molecules-arrangements
    where: 'section "Counting arrangements": 2 × 2 × 2 × 2 = 16 arrangements of four molecules'
    inputs: {}
    formula: 2**4
    expected: '16'
    shown: ['$2 \times 2 \times 2 \times 2 = 16$']
    source: {cite: mit, at: 'slide 8 (each particle has two places: 2^N states)'}
    origin: page-own

  - id: four-molecules-two-left
    where: 'table of four molecules: 6 arrangements with two on the left (4 choose 2)'
    inputs: {}
    formula: (4 * 3) / (2 * 1)
    expected: '6'
    shown: ['| 2 | 6 | 6/16 |', 'The even split can be made in 6 ways']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: four-molecules-three-left
    where: 'table of four molecules: 4 arrangements with three on the left (and, by symmetry, with one on the left)'
    inputs: {}
    formula: (4 * 3 * 2) / (3 * 2 * 1)
    expected: '4'
    shown: ['| 3 | 4 | 4/16 |', '| 1 | 4 | 4/16 |']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: four-molecules-total
    where: 'table of four molecules: the counts 1 + 4 + 6 + 4 + 1 add up to all 16 arrangements'
    inputs: {}
    formula: 1 + 4 + 6 + 4 + 1
    expected: '16'
    shown: ['| 4 | 1 (ABCD) | 1/16 |', '| 0 | 1 | 1/16 |']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: half-n1
    where: 'table (1/2)^N, N = 1'
    inputs: {}
    formula: 0.5**1
    expected: '0.5'
    shown: ['| 1 | 0.5 |']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: half-n4
    where: 'table (1/2)^N, N = 4; quiz 3 (1/16)'
    inputs: {}
    formula: 0.5**4
    expected: '0.0625'
    shown: ['| 4 | 0.0625 |', '$(1/2)^4 = 1/16$', '$1/16$ for 4 particles']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: half-n10
    where: 'table (1/2)^N, N = 10: 9.8 × 10⁻⁴, about 1 in 1000; flashcard 3'
    inputs: {}
    formula: 0.5**10
    expected: '9.8e-4'
    shown: ['| 10 | $9.8 \times 10^{-4}$, about 1 in 1000 |', 'about 1 in 1000 for 10']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: half-n10-one-in
    where: 'table and flashcard 3: (1/2)^10 is 1/1024, about 1 in 1000'
    inputs: {}
    formula: 2**10
    expected: '1000'
    tolerance: '3%'
    shown: ['about 1 in 1000 |']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: half-n100
    where: 'table (1/2)^N, N = 100; flashcard 3'
    inputs: {}
    formula: 0.5**100
    expected: '7.9e-31'
    shown: ['| 100 | $7.9 \times 10^{-31}$ |', '$7.9 \\times 10^{-31}$ for 100']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: litre-of-air
    where: 'section "Counting arrangements": a litre of air holds about 2.5 × 10²² molecules (N = pV/(k_B T) at 20 °C, as lesson 4.3)'
    inputs: {p: 1.01e5 Pa, V: 1.0e-3 m**3, kB: 1.38e-23 J/K, T: 293 K}
    formula: p * V / (kB * T)
    expected: '2.5e22'
    shown: ['A litre of air holds about $2.5 \times 10^{22}$ molecules']
    source: {cite: reading3, at: 'slide 2 (counting); the number of molecules from pV = N k_B T, lesson 4.3'}
    origin: page-own

  # Entropy as counting
  - id: kB-value
    kind: fact
    where: 'section "Entropy": Boltzmann''s constant 1.38 × 10⁻²³ J/K (lesson 4.3, NIST 1.380 649 × 10⁻²³ J/K rounded)'
    value: 1.38e-23 J/K
    shown: ['Here $k_B = 1.38 \times 10^{-23}\ \text{J/K}$ is Boltzmann''s constant']
    source: {ref: 'NIST CODATA, Boltzmann constant 1.380 649 × 10⁻²³ J/K (exact), as quoted in lesson 4.3'}
    origin: later-data

  - id: NA-value
    kind: fact
    where: 'section "Entropy": one mole is 6.02 × 10²³ molecules (lesson 4.3)'
    value: 6.02e23
    shown: ['For one mole, $N = 6.02 \times 10^{23}$']
    source: {ref: 'NIST CODATA, Avogadro constant 6.022 140 76 × 10²³ per mole (exact), as quoted in lesson 4.3'}
    origin: later-data

  - id: log-adds
    kind: identity
    where: 'section "Entropy": ln(Ω₁Ω₂) = ln Ω₁ + ln Ω₂, so entropies add'
    formula: log(O1 * O2)
    equals: log(O1) + log(O2)
    samples: {O1: [2.0, 16.0, 1.0e6], O2: [3.0, 6.0, 1.0e9]}
    tolerance: 1e-12
    shown: ['$\ln(\Omega_1\Omega_2) = \ln \Omega_1 + \ln \Omega_2$']
    source: {cite: reading3, at: 'slide 2 (entropy is extensive)'}
    origin: mit

  - id: doubling-entropy-identity
    kind: identity
    where: 'section "Entropy": ΔS = k_B ln 2^N = N k_B ln 2 when a gas doubles its volume'
    formula: kB * log(2**N)
    equals: N * kB * log(2)
    samples: {kB: [1.0, 1.38e-23, 1.0], N: [1.0, 4.0, 100.0]}
    tolerance: 1e-12
    shown: ['$\Delta S = k_B \ln 2^N = N k_B \ln 2$']
    source: {cite: mit, at: 'slide 8 (S = N k_B ln 2)'}
    origin: mit

  - id: ln2
    where: 'section "Entropy": ln 2 = 0.693'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['\times 0.693 = 5.76']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: doubling-entropy-mole
    where: 'section "Entropy": doubling the volume of one mole raises its entropy by N_A k_B ln 2 = 5.76 J/K'
    inputs: {NA: 6.02e23, kB: 1.38e-23 J/K}
    formula: NA * kB * log(2)
    expected: 5.76 J/K
    shown: ['$6.02 \times 10^{23} \times 1.38 \times 10^{-23} \times 0.693 = 5.76\ \text{J/K}$']
    source: {cite: mit, at: 'slide 8 (S = N k_B ln 2)'}
    origin: page-own

  # Melting ice
  - id: ice-latent-heat
    kind: fact
    where: 'worked example "Melting ice": L_f = 3.34 × 10⁵ J/kg, as in lesson 4.6'
    value: 3.34e5 J/kg
    shown: ['$L_\text{f} = 3.34 \times 10^{5}\ \text{J/kg}$ (lesson 4.6)']
    source: {ref: 'lesson 4.6 (phase-changes): NIST Chemistry WebBook, enthalpy of fusion of water 6008 J/mol over 0.018 kg/mol'}
    origin: later-data

  - id: ice-heat
    where: 'worked example "Melting ice": Q = m L_f'
    inputs: {m: 0.50 kg, Lf: 3.34e5 J/kg}
    formula: m * Lf
    expected: 1.67e5 J
    shown: ['$Q = m L_\text{f} = 0.50 \times 3.34 \times 10^{5} = 1.67 \times 10^{5}\ \text{J}$']
    source: {cite: reading3, at: 'slide 8 (heat added at the temperature of a bath)'}
    origin: page-own

  - id: zero-celsius
    where: 'worked example "Melting ice": 0 °C = 273 K'
    inputs: {}
    formula: 0 + 273
    expected: '273'
    shown: ['$0\ {}^{\circ}\text{C} = 273\ \text{K}$ while the ice melts']
    source: {cite: reading3, at: 'slide 8'}
    origin: page-own

  - id: ice-entropy
    where: 'worked example "Melting ice": ΔS = Q/T'
    inputs: {m: 0.50 kg, Lf: 3.34e5 J/kg, T: 273 K}
    formula: m * Lf / T
    expected: 612 J/K
    shown: ['$\Delta S = Q/T = 1.67 \times 10^{5}/273 = 612\ \text{J/K}$']
    source: {cite: reading3, at: 'slide 8 (dS = đQ/T)'}
    origin: page-own

  # Heat flow hot to cold
  - id: blocks-hot
    where: 'worked example "Two blocks, two directions": hot block'
    inputs: {Q: 1200 J, Th: 400 K}
    formula: -Q / Th
    expected: -3.0 J/K
    shown: ['$\Delta S_h = -1200/400 = -3.0\ \text{J/K}$']
    source: {cite: nasa-2law, at: 'ΔS_h = −Q/T_h'}
    origin: page-own

  - id: blocks-cold
    where: 'worked example "Two blocks, two directions": cold block'
    inputs: {Q: 1200 J, Tc: 300 K}
    formula: Q / Tc
    expected: 4.0 J/K
    shown: ['$\Delta S_c = +1200/300 = +4.0\ \text{J/K}$']
    source: {cite: nasa-2law, at: 'ΔS_c = Q/T_c'}
    origin: page-own

  - id: blocks-total
    where: 'worked example "Two blocks, two directions": total, +1.0 J/K (and −1.0 J/K for the reverse)'
    inputs: {Q: 1200 J, Th: 400 K, Tc: 300 K}
    formula: -Q / Th + Q / Tc
    expected: 1.0 J/K
    shown: ['$\Delta S_\text{total} = -3.0 + 4.0 = +1.0\ \text{J/K}$', 'the total would be $-1.0\ \text{J/K}$']
    source: {cite: nasa-2law, at: 'total entropy change, positive'}
    origin: page-own

  - id: quiz-entropy-hot
    where: 'quiz 1 explanation: the hot block loses 600/500 = 1.2 J/K'
    inputs: {Q: 600 J, Th: 500 K}
    formula: Q / Th
    expected: 1.2 J/K
    shown: ['$600/500 = 1.2\\ \\text{J/K}$']
    source: {cite: nasa-2law, at: 'ΔS_h = −Q/T_h'}
    origin: page-own

  - id: quiz-entropy-cold
    where: 'quiz 1 explanation: the cold block gains 600/300 = 2.0 J/K'
    inputs: {Q: 600 J, Tc: 300 K}
    formula: Q / Tc
    expected: 2.0 J/K
    shown: ['$600/300 = 2.0\\ \\text{J/K}$']
    source: {cite: nasa-2law, at: 'ΔS_c = Q/T_c'}
    origin: page-own

  - id: quiz-entropy-total
    where: 'quiz 1: total change +0.8 J/K (answer), −0.8 J/K (wrong sign)'
    inputs: {Q: 600 J, Th: 500 K, Tc: 300 K}
    formula: Q / Tc - Q / Th
    expected: 0.8 J/K
    shown: ['$2.0 - 1.2 = 0.8\\ \\text{J/K}$', '["$+0.8\\ \\text{J/K}$", "$-0.8\\ \\text{J/K}$"']
    source: {cite: nasa-2law, at: 'total entropy change'}
    origin: page-own

  - id: quiz-entropy-sum-distractor
    where: 'quiz 1 distractor: adding the two amounts gives 3.2 J/K'
    inputs: {Q: 600 J, Th: 500 K, Tc: 300 K}
    formula: Q / Tc + Q / Th
    expected: 3.2 J/K
    shown: ['Adding the two amounts instead of subtracting gives $3.2\\ \\text{J/K}$']
    source: {cite: nasa-2law, at: 'total entropy change'}
    origin: page-own

  # Heat engines
  - id: engine-balance-identity
    kind: identity
    where: 'formula "Efficiency of a heat engine": W/Q_h = 1 − Q_c/Q_h when W = Q_h − Q_c'
    formula: (Qh - Qc) / Qh
    equals: 1 - Qc / Qh
    samples: {Qh: [2000.0, 5000.0, 2.5], Qc: [1300.0, 3500.0, 1.5]}
    tolerance: 1e-12
    shown: ['\eta = \frac{W}{Q_h} = 1 - \frac{Q_c}{Q_h}']
    source: {cite: reading4, at: 'slide 10'}
    origin: mit

  - id: engine-heat-out
    where: 'worked example "An engine''s energy flows": Q_c = Q_h − W'
    inputs: {Qh: 2000 J, W: 700 J}
    formula: Qh - W
    expected: 1300 J
    shown: ['$Q_c = Q_h - W = 2000 - 700 = 1300\ \text{J}$']
    source: {cite: reading4, at: 'slide 10'}
    origin: page-own

  - id: engine-efficiency
    where: 'worked example "An engine''s energy flows": η = 700/2000 = 0.35 = 35%, checked with 1 − 1300/2000'
    inputs: {Qh: 2000 J, W: 700 J}
    formula: W / Qh
    expected: '0.35'
    shown: ['$\eta = W/Q_h = 700/2000 = 0.35$, or 35%', '$1 - Q_c/Q_h = 1 - 1300/2000 = 0.35$']
    source: {cite: reading4, at: 'slides 8 and 10'}
    origin: page-own

  - id: quiz-engine-work
    where: 'quiz 4: W = 5000 − 3500 = 1500 J'
    inputs: {Qh: 5000 J, Qc: 3500 J}
    formula: Qh - Qc
    expected: 1500 J
    shown: ['$W = Q_h - Q_c = 5000 - 3500 = 1500\\ \\text{J}$']
    source: {cite: reading4, at: 'slide 10'}
    origin: page-own

  - id: quiz-engine-efficiency
    where: 'quiz 4: η = 1500/5000 = 0.30, 30%'
    inputs: {Qh: 5000 J, Qc: 3500 J}
    formula: (Qh - Qc) / Qh
    expected: '0.30'
    shown: ['$\\eta = W/Q_h = 1500/5000 = 0.30$, that is 30%']
    source: {cite: reading4, at: 'slides 8 and 10'}
    origin: page-own

  - id: quiz-engine-distractor
    where: 'quiz 4 distractor: dividing by Q_c gives 1500/3500 = 43%'
    inputs: {Qh: 5000 J, Qc: 3500 J}
    formula: 100 * (Qh - Qc) / Qc
    expected: '43'
    shown: ['Dividing by $Q_c$ instead gives 43%']
    source: {cite: reading4, at: 'slide 10'}
    origin: page-own

  # Carnot limit
  - id: carnot-identity
    kind: identity
    where: 'section "The Carnot limit": with Q_c/T_c = Q_h/T_h, the efficiency 1 − Q_c/Q_h becomes 1 − T_c/T_h'
    formula: 1 - (Qh * Tc / Th) / Qh
    equals: 1 - Tc / Th
    samples: {Qh: [2000.0, 1.0], Tc: [300.0, 268.0], Th: [800.0, 2300.0]}
    tolerance: 1e-12
    shown: ['\eta_\text{max} = 1 - \frac{T_c}{T_h}']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: fridge-min-work-identity
    kind: identity
    where: 'worked example "Why a fridge needs a plug": with Q_h = Q_c T_h/T_c the total entropy change is zero'
    formula: -Qc / Tc + (Qc * Th / Tc) / Th
    equals: 0 * Qc
    samples: {Qc: [1500.0, 2.0], Tc: [268.0, 273.0], Th: [298.0, 308.0]}
    tolerance: 1e-9
    shown: ['$Q_h/298 \geq 1500/268$']
    source: {cite: reading2, at: 'slide 10 (Q_L/T_L − Q_H/T_H ≤ 0 with Q_H = Q_L + W)'}
    origin: mit

  - id: plot-600
    where: 'Plot caption: with T_c = 300 K, a hot side of 600 K allows 50%'
    inputs: {Tc: 300 K, Th: 600 K}
    formula: 100 * (1 - Tc / Th)
    expected: '50'
    shown: ['a hot side of 600 K allows 50%']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: plot-800
    where: 'Plot caption: 800 K allows 62.5%'
    inputs: {Tc: 300 K, Th: 800 K}
    formula: 100 * (1 - Tc / Th)
    expected: '62.5'
    shown: ['800 K allows 62.5%']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: plot-2300
    where: 'Plot caption: 2300 K allows 87%'
    inputs: {Tc: 300 K, Th: 2300 K}
    formula: 100 * (1 - Tc / Th)
    expected: '87'
    shown: ['2300 K allows 87%']
    source: {cite: mit, at: 'slide 12 (auto engine: T+ 2300 K, Carnot 87%)'}
    origin: page-own

  - id: station-temperatures
    kind: fact
    where: 'worked example "A power station": steam about 800 K, cooling water about 300 K (8.21 table: coal steam plant T+ 800 K, T- 300 K)'
    value: 800 K
    shown: ['makes steam at about $800\ \text{K}$, and its cooling water is at about $300\ \text{K}$']
    source: {cite: mit, at: 'slide 12'}
    origin: mit

  - id: station-carnot
    where: 'worked example "A power station" (a); summary; flashcard 6'
    inputs: {Tc: 300 K, Th: 800 K}
    formula: 1 - Tc / Th
    expected: '0.625'
    shown: ['$\eta_\text{max} = 1 - 300/800 = 0.625$, or 62.5%', '62.5% for a power station between 800 K and 300 K', 'cooling water at 300 K: at most 62.5%']
    source: {cite: mit, at: 'slide 12 (Carnot 62%)'}
    origin: page-own

  - id: station-carnot-waste
    where: 'worked example "A power station" (a): a perfect engine throws away 37.5%'
    inputs: {Tc: 300 K, Th: 800 K}
    formula: 100 * Tc / Th
    expected: '37.5'
    shown: ['would have to throw away 37.5% of the heat']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: station-real-efficiency
    kind: fact
    where: 'worked example "A power station" (b); summary: real coal stations about 40%'
    value: '0.40'
    shown: ['In practice such stations reach about 40%', 'which in practice reaches about 40%']
    source: {cite: mit, at: 'slide 12 (steam turbine coal plant, real 40%)'}
    origin: mit

  - id: station-heat-in
    where: 'worked example "A power station" (b): heat per second 1.0 GW / 0.40'
    inputs: {P: 1.0 GW, eta: 0.40}
    formula: P / eta
    expected: 2.5 GW
    shown: ['$1.0/0.40 = 2.5\ \text{GW}$']
    source: {cite: reading4, at: 'slide 8 (efficiency = work out / heat in)'}
    origin: page-own

  - id: station-heat-out
    where: 'worked example "A power station" (b): heat to the cooling water 2.5 − 1.0 GW'
    inputs: {P: 1.0 GW, eta: 0.40}
    formula: P / eta - P
    expected: 1.5 GW
    shown: ['$2.5 - 1.0 = 1.5\ \text{GW}$']
    source: {cite: reading4, at: 'slide 10'}
    origin: page-own

  - id: car-carnot
    where: 'paragraph after the power station: car engine, Carnot limit 1 − 300/2300 = 87%'
    inputs: {Tc: 300 K, Th: 2300 K}
    formula: 1 - Tc / Th
    expected: '0.87'
    shown: ['$1 - 300/2300 = 0.87$, or 87%']
    source: {cite: mit, at: 'slide 12 (auto engine, T+ 2300 K, Carnot 87%)'}
    origin: mit

  - id: car-gas-temperature
    kind: fact
    where: 'paragraph after the power station: burning gases about 2300 K'
    value: 2300 K
    shown: ['about $2300\ \text{K}$ when the fuel burns']
    source: {cite: mit, at: 'slide 12 (auto engine, Otto cycle, T+ 2300 K)'}
    origin: mit

  - id: car-real-efficiency
    kind: fact
    where: 'paragraph after the power station: a real petrol engine about 25%'
    value: '0.25'
    shown: ['A real petrol engine reaches only about 25%']
    source: {cite: mit, at: 'slide 12 (auto engine, real 25%)'}
    origin: mit

  - id: quiz-carnot-kelvin
    where: 'quiz 2: 527 °C = 800 K, 27 °C = 300 K, η_max = 0.625 = 62.5%'
    inputs: {}
    formula: 1 - (27 + 273) / (527 + 273)
    expected: '0.625'
    shown: ['$T_h = 800\\ \\text{K}$ and $T_c = 300\\ \\text{K}$, so $\\eta_\\text{max} = 1 - 300/800 = 0.625$, that is 62.5%', 'choices: ["62.5%"']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: quiz-carnot-celsius
    where: 'quiz 2 distractor: using degrees Celsius, 1 − 27/527 = 0.949'
    inputs: {}
    formula: 1 - 27 / 527
    expected: '0.949'
    shown: ['$1 - 27/527 = 0.949$, or 94.9%']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: quiz-carnot-ratio
    where: 'quiz 2 distractor: the ratio T_c/T_h = 37.5%'
    inputs: {}
    formula: 100 * 300 / 800
    expected: '37.5'
    shown: ['and 37.5% is the ratio $T_c/T_h$ itself']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  # Refrigerator and heat pump
  - id: freezer-kelvin
    where: 'worked example "Why a fridge needs a plug": −5 °C = 268 K'
    inputs: {}
    formula: -5 + 273
    expected: '268'
    shown: ['$268\ \text{K}$ ($-5\ {}^{\circ}\text{C}$)']
    source: {cite: reading2, at: 'slide 13 (refrigerator example in kelvin)'}
    origin: page-own

  - id: kitchen-kelvin
    where: 'worked example "Why a fridge needs a plug": 25 °C = 298 K'
    inputs: {}
    formula: 25 + 273
    expected: '298'
    shown: ['$298\ \text{K}$ ($25\ {}^{\circ}\text{C}$)']
    source: {cite: reading2, at: 'slide 13'}
    origin: page-own

  - id: fridge-freezer-loss
    where: 'worked example "Why a fridge needs a plug" (a): freezer loses 1500/268 = 5.60 J/K'
    inputs: {Q: 1500 J, Tc: 268 K}
    formula: Q / Tc
    expected: 5.60 J/K
    shown: ['$\Delta S = -1500/268 + 1500/298 = -5.60 + 5.03 = -0.56\ \text{J/K}$']
    source: {cite: nasa-2law, at: 'ΔS = ΔQ/T'}
