# Calculations on content/year-0/hs-4/towards-the-universe-cooling.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# First law with Q = 0, U = (3/2)NkT and T V^(gamma-1) = constant with gamma = 5/3: MIT 8.044 Lecture 6 slides 8, 18-23 (as in lesson 4.8).
# T proportional to 1/a, decoupling at about 3000 K, recombination at about 4000 K, 380 000 years: 8.286 Lecture 17 pp. 17-19.
# T_CMB = 2.725 K (calcs/values.yaml, Guth 2013 value, so origin mit), cited to NASA COBE FIRAS as in lessons 7.11 and 8.15.

page: content/year-0/hs-4/towards-the-universe-cooling.mdx
calcs:
  - id: first-law-adiabatic
    kind: identity
    where: 'formula "An adiabatic change": with Q = 0 the first law Delta U = Q + W gives Delta U = W'
    formula: 0 + W
    equals: W
    samples: {W: [-280.0, 6.0]}
    tolerance: 1e-12
    shown: ['tex="Q = 0 \quad\Rightarrow\quad \Delta U = W"']
    source: {cite: mit, at: 'slides 8, 20 and 23'}
    origin: mit

  - id: internal-energy-monatomic
    kind: identity
    where: 'section "Why an expanding gas cools": U = (3/2) N k_B T, N times the average (3/2) k_B T per atom (lesson 4.8)'
    formula: N * (1.5 * kB * T)
    equals: 1.5 * N * kB * T
    samples: {N: [6.02e22, 2.5e25], kB: [1.38e-23, 1.38e-23], T: [75.0, 300.0]}
    tolerance: 1e-12
    shown: ['the internal energy is $U = \tfrac32 N k_B T$ (lesson 4.8)']
    source: {cite: mit, at: 'slide 18'}
    origin: mit

  - id: adiabat-rearranged
    kind: identity
    where: 'formula "Temperature after an adiabatic change": T2 = T1 (V1/V2)^(2/3) keeps T V^(2/3) the same'
    formula: T1 * (V1 / V2)**(2/3) * V2**(2/3)
    equals: T1 * V1**(2/3)
    samples: {T1: [300.0, 280.0, 400.0], V1: [2.0, 1.0, 0.5], V2: [16.0, 0.125, 13.5]}
    tolerance: 1e-12
    shown: ['tex="T_2 = T_1 \left(\frac{V_1}{V_2}\right)^{2/3}"']
    source: {cite: mit, at: 'slides 21-22'}
    origin: mit

  - id: double-volume
    where: 'section "How much colder?": double the volume, 2^(-2/3) = 0.63'
    inputs: {}
    formula: 2**(-2/3)
    expected: 0.63
    tolerance: '1%'
    shown: ['$2^{-2/3} = 0.63$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: eight-volume
    where: 'section "How much colder?" and flashcard 2, summary: eight times the volume gives a quarter of the temperature'
    inputs: {}
    formula: 8**(-2/3)
    expected: 0.25
    tolerance: '0.001%'
    shown: ['$8^{-2/3} = 1/4$', 'Eight times the volume gives a quarter of the absolute temperature; an eighth', 'eight times the volume gives a quarter of the absolute temperature. Air']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: air-exponent
    where: 'section "How much colder?" and summary: for air T V^(gamma - 1) = T V^0.4'
    inputs: {g: 1.4}
    formula: g - 1
    expected: 0.4
    tolerance: '0.001%'
    shown: ['$T V^{0.4}$ stays constant (NASA Glenn', '$T V^{0.4} = \text{constant}$']
    source: {cite: glenn, at: 'T2/T1 = (p2/p1)^((gamma - 1)/gamma) with p2/p1 = (v1/v2)^gamma'}
    origin: page-own

  - id: bounce-identity
    kind: identity
    where: 'section "The molecules'' view": arriving at v - u relative to the piston, leaving at v - u relative to it, so v - 2u in the cylinder'
    formula: (v - u) - u
    equals: v - 2*u
    samples: {v: [500.0, 300.0], u: [10.0, 2.0]}
    tolerance: 1e-12
    shown: ['comes back with speed $v - 2u$']
    source: {cite: mit, at: 'slide 23 (W negative for an expansion against a slowly moving piston); the collision picture is the page''s own'}
    origin: page-own

  - id: bounce-number
    where: 'section "The molecules'' view": 500 m/s off a piston receding at 10 m/s'
    inputs: {v: 500 m/s, u: 10 m/s}
    formula: v - 2*u
    expected: 480 m/s
    tolerance: '0.001%'
    shown: ['comes back at $480\ \text{m/s}$']
    source: {cite: mit, at: 'slide 23'}
    origin: page-own

  - id: we1-factor
    where: 'worked example "Helium pushing a piston", step "The new temperature": volume factor'
    inputs: {}
    formula: 16.0 / 2.0
    expected: 8
    tolerance: '0.001%'
    shown: ['$16.0/2.0 = 8$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: we1-T2
    where: 'worked example "Helium pushing a piston", step "The new temperature"; plot point 75 K'
    inputs: {T1: 300 K, V1: 2.0 L, V2: 16.0 L}
    formula: T1 * (V1 / V2)**(2/3)
    expected: 75 K
    tolerance: '0.001%'
    shown: ['$T_2 = 300 \times (2.0/16.0)^{2/3} = 300 \times \tfrac14 = 75\ \text{K}$', 'the helium is at 75 K']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: we1-celsius-start
    where: 'worked example "Helium pushing a piston": 300 K in degrees Celsius'
    inputs: {}
    formula: 300 - 273
    expected: 27
    tolerance: '0.001%'
    shown: ['from $27\ ^\circ\text{C}$']
    source: {cite: mit, at: 'slide 18 (absolute temperature); the conversion is lesson 4.2'}
    origin: page-own

  - id: we1-celsius-end
    where: 'worked example "Helium pushing a piston": 75 K in degrees Celsius'
    inputs: {}
    formula: 75 - 273
    expected: -198
    tolerance: '0.001%'
    shown: ['to $-198\ ^\circ\text{C}$']
    source: {cite: mit, at: 'slide 18; the conversion is lesson 4.2'}
    origin: page-own

  - id: we1-check-before
    where: 'worked example "Helium pushing a piston", step "Check the rule": T1 V1^(2/3), volumes in litres'
    inputs: {}
    formula: 300 * 2.0**(2/3)
    expected: 476
    tolerance: '0.2%'
    shown: ['$T_1 V_1^{2/3} = 300 \times 2.0^{2/3} = 476$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: we1-check-after
    where: 'worked example "Helium pushing a piston", step "Check the rule": T2 V2^(2/3), volumes in litres'
    inputs: {}
    formula: 75 * 16.0**(2/3)
    expected: 476
    tolerance: '0.2%'
    shown: ['$T_2 V_2^{2/3} = 75 \times 16.0^{2/3} = 476$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: we1-work
    where: 'worked example "Helium pushing a piston", step "The work": Delta U = (3/2) n R Delta T'
    inputs: {n: 0.10 mol, R: 8.31 J/(mol*K), T1: 300 K, T2: 75 K}
    formula: 1.5 * n * R * (T2 - T1)
    expected: -280 J
    tolerance: '0.5%'
    shown: ['$\Delta U = \tfrac32 \times 0.10 \times 8.31 \times (75 - 300) = -280\ \text{J}$', 'the gas did $280\ \text{J}$ of work on the piston']
    source: {cite: mit, at: 'slide 18 (U = (3/2)NkT) with N k_B = nR (lesson 4.3)'}
    origin: page-own

  - id: plot-light-at-8
    where: 'plot caption: black-body light expanded adiabatically to 8 times the volume from 300 K (T V^(1/3) constant)'
    inputs: {}
    formula: 300 * 8**(-1/3)
    expected: 150
    tolerance: '0.001%'
    shown: ['the light at 150 K']
    source: {cite: reading1, at: 'p. 18 (T proportional to 1/a), with V proportional to a^3'}
    origin: page-own

  - id: light-tv-third
    kind: identity
    where: 'section "The universe": T = c/a and V = V0 a^3 give T V^(1/3) = c V0^(1/3), constant'
    formula: (c / a) * (V0 * a**3)**(1/3)
    equals: c * V0**(1/3)
    samples: {c: [2.725, 300.0], a: [0.5, 0.001], V0: [1.0, 8.0]}
    tolerance: 1e-9
    shown: ['so $T \propto 1/a$ means $T V^{1/3}$ stays constant']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: atoms-one-over-a-squared
    kind: identity
    where: 'section "The universe" and flashcard 5: T proportional to V^(-2/3) with V = V0 a^3 gives T proportional to 1/a^2'
    formula: c * (V0 * a**3)**(-2/3)
    equals: c * V0**(-2/3) / a**2
    samples: {c: [300.0, 2.725], a: [0.5, 2.0], V0: [1.0, 8.0]}
    tolerance: 1e-9
    shown: ['which with $V \propto a^3$ gives $T \propto 1/a^2$ (our own step)', '($T \\propto V^{-2/3} \\propto 1/a^2$, since the volume grows as $a^3$)']
    source: {cite: mit, at: 'slides 21-22, with V proportional to a^3'}
    origin: page-own

  - id: doubling-quarter
    where: 'flashcard 5: the universe doubles in size, a gas of atoms left alone ends at a quarter of its temperature'
    inputs: {}
    formula: 1 / 2**2
    expected: 0.25
    tolerance: '0.001%'
    shown: ['Atoms that exchange no heat with anything: a quarter']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: t-cmb
    kind: fact
    where: 'section "The light we still see": the temperature today, COBE FIRAS 2.725 +- 0.002 K, the value Guth uses in 8.286 (calcs/values.yaml: Guth 2013) (also summary, worked example, quiz 4, flashcard 3)'
    value: 2.725 K
    shown: ['Today the universe is filled with light at a temperature of $2.725\ \text{K}$, measured by NASA''s COBE satellite']
    source: {cite: firas, at: '2.725 +- 0.002 K'}
    origin: mit

  - id: decoupling-temperature
    kind: fact
    where: 'section "The light we still see": decoupling at about 3000 K (Guth)'
    value: 3000 K
    shown: ['and by about $3000\ \text{K}$ so few free electrons were left']
    source: {cite: reading1, at: 'pp. 18-19'}
    origin: mit

  - id: recombination-temperature
    kind: fact
    where: 'section "The light we still see": half the hydrogen neutral by about 4000 K (Guth)'
    value: 4000 K
    shown: ['by about $4000\ \text{K}$ half of the hydrogen']
    source: {cite: reading1, at: 'pp. 18-19'}
    origin: mit

  - id: decoupling-time
    kind: fact
    where: 'section "The light we still see" and flashcard 4: decoupling about 380 000 years after the start (Guth''s estimate)'
    value: 380000 yr
    shown: ['it came about 380 000 years after the start', 'some 380 000 years after the start']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  - id: age
    kind: fact
    where: 'introduction: expanding and cooling for 13.8 billion years (Guth uses 13.8; the transcript says "trillion" for billion)'
    value: 13.8e9 yr
    shown: ['expanding and cooling for 13.8 billion years']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  - id: one-second-temperature
    kind: fact
    where: 'leadsTo and callout: about ten billion kelvin one second after the start, from T = 9.98e9 K / sqrt(t in s)'
    value: 1.0e10 K
    shown: ['from about ten billion kelvin, one second after the start', 'down from about ten billion kelvin at one second']
    source: {cite: reading1, at: 'p. 17 (9.98 x 10^9 K divided by the square root of t in seconds)'}
    origin: mit

  - id: we2-decoupling
    where: 'worked example "Running the cooling backwards", step (a); plot point; quiz 5 and summary: 1100 times 2.725 K'
    inputs: {Tnow: 2.725 K}
    formula: 1100 * Tnow
    expected: 2997.5 K
    tolerance: '0.001%'
    shown: ['$T_\text{then} = 1100 \times 2.725\ \text{K} = 2997.5\ \text{K}$, about $3000\ \text{K}$']
    source: {cite: reading1, at: 'p. 18 (T proportional to 1/a)'}
    origin: page-own

  - id: we2-boiling
    where: 'worked example "Running the cooling backwards", step (b): 1 + z = 373/2.725'
    inputs: {}
    formula: 373 / 2.725
    expected: 137
    tolerance: '0.5%'
    shown: ['$1 + z = T_\text{then}/T_\text{now} = 373/2.725 = 137$', 'was then 137 times smaller than today']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: deuterium-temperature
    where: 'section "The light we still see": nuclei can form once T falls to about 0.1 MeV (PDG), about a billion kelvin'
    inputs: {E: 0.1 MeV, kB: 1.380649e-23 J/K}
    formula: E / kB
    expected: 1.0e9 K
    tolerance: '20%'
    shown: ['At about a billion kelvin ($10^{9}\ \text{K}$)']
    source: {cite: pdg, at: 'Sec. 24.2 (T about 0.1 MeV)'}
    origin: page-own

  - id: nuclei-size
    where: 'section "The light we still see": 1 + z at 10^9 K'
    inputs: {}
    formula: 1.0e9 / 2.725
    expected: 3.7e8
    tolerance: '1%'
    shown: ['$10^{9}/2.725 = 3.7 \times 10^{8}$']
    source: {cite: reading1, at: 'p. 18 (T proportional to 1/a, which holds after the electron-positron pairs have gone)'}
    origin: page-own

  - id: first-three-minutes
    kind: fact
    where: 'section "The light we still see": the first nuclei formed a few minutes after the start'
    value: 3 min
    shown: ['a few minutes after the start, protons and neutrons']
    source: {cite: pdg, at: 'Sec. 24.1 (by the end of the first three minutes)'}
    origin: later-data

  - id: quiz1-27-times
    where: 'quiz 2 (index 1): helium at 400 K expanded to 27 times its volume'
    inputs: {}
    formula: 400 * 27**(-2/3)
    expected: 44.4
    tolerance: '0.5%'
    shown: ['400 \\times (1/27)^{2/3} = 400/9 = 44\\ \\text{K}$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: quiz1-distractor-third
    where: 'quiz 2 (index 1) distractor: the power 1/3 instead of 2/3'
    inputs: {}
    formula: 400 / 27**(1/3)
    expected: 133
    tolerance: '0.5%'
    shown: ['About $133\\ \\text{K}$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: quiz1-distractor-27
    where: 'quiz 2 (index 1) distractor: dividing by 27'
    inputs: {}
    formula: 400 / 27
    expected: 15
    tolerance: '2%'
    shown: ['About $15\\ \\text{K}$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: quiz2-compress
    where: 'quiz 3 (index 2): argon at 280 K squeezed to an eighth of its volume'
    inputs: {}
    formula: 280 * 8**(2/3)
    expected: 1120
    tolerance: '0.001%'
    shown: ['280 \\times 8^{2/3} = 280 \\times 4 = 1120\\ \\text{K}$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: quiz2-distractor-expand
    where: 'quiz 3 (index 2) distractor: expansion to 8 times the volume'
    inputs: {}
    formula: 280 * 8**(-2/3)
    expected: 70
    tolerance: '0.001%'
    shown: ['["$1120\\ \\text{K}$", "$70\\ \\text{K}$", "$2240\\ \\text{K}$"']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own

  - id: quiz3-500
    where: 'quiz 4 (index 3): T at 1 + z = 500'
    inputs: {Tnow: 2.725 K}
    formula: 500 * Tnow
    expected: 1362.5 K
    tolerance: '0.001%'
    shown: ['$2.725 \\times 500 = 1362.5\\ \\text{K}$, about $1360\\ \\text{K}$']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: quiz3-distractor-divide
    where: 'quiz 4 (index 3) distractor: dividing by 500'
    inputs: {}
    formula: 2.725 / 500
    expected: 0.0055
    tolerance: '2%'
    shown: ['"About $0.0055\\ \\text{K}$"']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: quiz3-distractor-squared
    where: 'quiz 4 (index 3) distractor: multiplying by 500 squared'
    inputs: {}
    formula: 2.725 * 500**2
    expected: 6.8e5
    tolerance: '1%'
    shown: ['"About $6.8 \\times 10^{5}\\ \\text{K}$"']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: decoupling-stretch
    where: 'summary, section "The light we still see", flashcard 4: from about 3000 K to 2.725 K the universe grew about 1100 times'
    inputs: {Tdec: 3000 K, Tnow: 2.725 K}
    formula: Tdec / Tnow
    expected: 1100
    tolerance: '0.5%'
    shown: ['When the universe was about 1100 times smaller it was about $3000\ \text{K}$: atoms formed', 'cooling as the universe grew, about 1100 times, until', '(about 1100 times smaller than now, some 380 000 years']
    source: {cite: reading1, at: 'pp. 18-19 (3000 K; T proportional to 1/a)'}
    origin: page-own

  - id: quiz2-distractor-times-8
    where: 'quiz 3 (index 2) distractor: multiplying by 8 instead of 8^(2/3)'
    inputs: {}
    formula: 280 * 8
    expected: 2240
    tolerance: '0.001%'
    shown: ['$2240\\ \\text{K}$ multiplies by 8 instead of $8^{2/3}$']
    source: {cite: mit, at: 'slides 21-22'}
    origin: page-own
