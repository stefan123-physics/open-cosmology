# Calculations on content/year-0/hs-4/heat-and-specific-heat.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 4: c_water = 4180 J/(kg K) (as lessons 6.8, 7.x and 8.x use).
# Table of specific heats: NIST Chemistry WebBook (read 2026-11-20), Shomate equation Cp = A + B t + C t^2 + D t^3 + E/t^2
# with t = T/1000 at T = 298.15 K (Chase 1998), divided by the molar mass; ethanol from the tabulated Cp,liquid.
# Sources: Siyavula Gr 11, 4.2 (mit: definition of specific heat); MIT 8.044 Lecture 6 slides (reading1).
# All worked-example and quiz numbers are the page's own (Siyavula 4.2 has no worked examples; lessons 4.2, 6.8 and 8.x
# use 0.30 kg + 0.30 kg at 70/10 °C, 1.8 kW / 1.0 kg / 20 to 100 °C, and 1.5 kg / 20 to 70 °C: not reused).

page: content/year-0/hs-4/heat-and-specific-heat.mdx
calcs:
  # NIST table
  - id: nist-water-molar
    where: 'references nist-water: Cp of liquid water at 298.15 K from the Shomate equation'
    inputs: {a0: -203.6060, a1: 1523.290, a2: -3196.413, a3: 2474.455, a4: 3.855326, tk: 0.29815}
    formula: a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2
    expected: '75.4'
    tolerance: '0.1%'
    shown: ['75.4 J/(mol K) at 298.15 K']
    source: {cite: nist-water, at: 'Liquid Phase Heat Capacity (Shomate Equation)'}
    origin: later-data

  - id: nist-water-per-kg
    where: 'table note: NIST gives 4184 for water at 25 °C'
    inputs: {a0: -203.6060, a1: 1523.290, a2: -3196.413, a3: 2474.455, a4: 3.855326, tk: 0.29815, M: 0.0180153}
    formula: (a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2) / M
    expected: '4184'
    tolerance: '0.05%'
    shown: ['NIST gives 4184 for water at 25 °C']
    source: {cite: nist-water, at: 'Liquid Phase Heat Capacity (Shomate Equation)'}
    origin: later-data

  - id: c-water-used
    where: 'table row and everywhere: c_water = 4180 J/(kg K), NIST 4184 rounded'
    inputs: {a0: -203.6060, a1: 1523.290, a2: -3196.413, a3: 2474.455, a4: 3.855326, tk: 0.29815, M: 0.0180153}
    formula: (a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2) / M
    expected: '4180'
    tolerance: '0.2%'
    shown: ['| Water (liquid) | 4180 |', 'Water has $c = 4180\ \text{J/(kg K)}$']
    source: {cite: nist-water, at: 'Liquid Phase Heat Capacity (Shomate Equation)'}
    origin: page-own

  - id: nist-ethanol
    where: 'table row: ethanol, 112.4 J/(mol K) / 0.04607 kg/mol'
    inputs: {cp: 112.4, M: 0.04607}
    formula: cp / M
    expected: '2440'
    tolerance: '0.1%'
    shown: ['| Ethanol (alcohol) | 2440 |']
    source: {cite: nist-ethanol, at: 'C_p,liquid at 298.15 K'}
    origin: later-data

  - id: nist-aluminium-molar
    where: 'references nist-aluminium: Cp of solid aluminium at 298.15 K'
    inputs: {a0: 28.08920, a1: -5.414849, a2: 8.560423, a3: 3.427370, a4: -0.277375, tk: 0.29815}
    formula: a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2
    expected: '24.2'
    tolerance: '0.2%'
    shown: ['24.2 J/(mol K) at 298.15 K']
    source: {cite: nist-aluminium, at: 'Solid Phase Heat Capacity (Shomate Equation)'}
    origin: later-data

  - id: nist-aluminium
    where: 'table row: aluminium, 897 J/(kg K) rounded to 900'
    inputs: {a0: 28.08920, a1: -5.414849, a2: 8.560423, a3: 3.427370, a4: -0.277375, tk: 0.29815, M: 0.0269815}
    formula: (a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2) / M
    expected: '900'
    tolerance: '0.5%'
    shown: ['| Aluminium | 900 |']
    source: {cite: nist-aluminium, at: 'Solid Phase Heat Capacity (Shomate Equation)'}
    origin: later-data

  - id: nist-iron-molar
    where: 'references nist-iron: Cp of solid iron at 298.15 K'
    inputs: {a0: 18.42868, a1: 24.64301, a2: -8.913720, a3: 9.664706, a4: -0.012643, tk: 0.29815}
    formula: a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2
    expected: '25.1'
    tolerance: '0.2%'
    shown: ['25.1 J/(mol K) at 298.15 K']
    source: {cite: nist-iron, at: 'Solid Phase Heat Capacity (Shomate Equation), 298 to 700 K'}
    origin: later-data

  - id: nist-iron
    where: 'table row: iron, 449 J/(kg K) rounded to 450'
    inputs: {a0: 18.42868, a1: 24.64301, a2: -8.913720, a3: 9.664706, a4: -0.012643, tk: 0.29815, M: 0.055845}
    formula: (a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2) / M
    expected: '450'
    tolerance: '0.5%'
    shown: ['| Iron | 450 |', 'That is very close to iron, $450\ \text{J/(kg K)}$.', 'metals such as iron (450)']
    source: {cite: nist-iron, at: 'Solid Phase Heat Capacity (Shomate Equation), 298 to 700 K'}
    origin: later-data

  - id: nist-copper-molar
    where: 'references nist-copper: Cp of solid copper at 298.15 K'
    inputs: {a0: 17.72891, a1: 28.09870, a2: -31.25289, a3: 13.97243, a4: 0.068611, tk: 0.29815}
    formula: a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2
    expected: '24.5'
    tolerance: '0.2%'
    shown: ['24.5 J/(mol K) at 298.15 K']
    source: {cite: nist-copper, at: 'Solid Phase Heat Capacity (Shomate Equation), 298 to 1358 K'}
    origin: later-data

  - id: nist-copper
    where: 'table row: copper, 385 J/(kg K)'
    inputs: {a0: 17.72891, a1: 28.09870, a2: -31.25289, a3: 13.97243, a4: 0.068611, tk: 0.29815, M: 0.063546}
    formula: (a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2) / M
    expected: '385'
    tolerance: '0.2%'
    shown: ['| Copper | 385 |', 'copper (385)']
    source: {cite: nist-copper, at: 'Solid Phase Heat Capacity (Shomate Equation), 298 to 1358 K'}
    origin: later-data

  - id: nist-lead-molar
    where: 'references nist-lead: Cp of solid lead at 298.15 K'
    inputs: {a0: 25.01450, a1: 5.441836, a2: 4.061367, a3: -1.236214, a4: -0.010657, tk: 0.29815}
    formula: a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2
    expected: '26.8'
    tolerance: '0.3%'
    shown: ['26.8 J/(mol K) at 298.15 K']
    source: {cite: nist-lead, at: 'Solid Phase Heat Capacity (Shomate Equation), 298 to 600.6 K'}
    origin: later-data

  - id: nist-lead
    where: 'table row: lead, 130 J/(kg K)'
    inputs: {a0: 25.01450, a1: 5.441836, a2: 4.061367, a3: -1.236214, a4: -0.010657, tk: 0.29815, M: 0.2072}
    formula: (a0 + a1*tk + a2*tk**2 + a3*tk**3 + a4/tk**2) / M
    expected: '130'
    tolerance: '0.5%'
    shown: ['| Lead | 130 |']
    source: {cite: nist-lead, at: 'Solid Phase Heat Capacity (Shomate Equation), 298 to 600.6 K'}
    origin: later-data

  # Worked example "The same energy, three materials"
  - id: three-aluminium
    where: 'worked example "The same energy, three materials": aluminium'
    inputs: {Q: 5000 J, m: 0.50 kg, c: 900 J/(kg*K)}
    formula: Q / (m * c)
    expected: 11.1 K
    shown: ['$\Delta T = 5000/(0.50 \times 900) = 11.1\ \text{K}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: three-copper
    where: 'worked example "The same energy, three materials": copper'
    inputs: {Q: 5000 J, m: 0.50 kg, c: 385 J/(kg*K)}
    formula: Q / (m * c)
    expected: 26 K
    shown: ['$\Delta T = 5000/(0.50 \times 385) = 26\ \text{K}$', 'warms the copper by 26 degrees']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: three-water
    where: 'worked example "The same energy, three materials": water'
    inputs: {Q: 5000 J, m: 0.50 kg, c: 4180 J/(kg*K)}
    formula: Q / (m * c)
    expected: 2.4 K
    shown: ['$\Delta T = 5000/(0.50 \times 4180) = 2.4\ \text{K}$', 'warms the water by less than 3']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  # Plot caption
  - id: plot-3kw
    where: 'plot caption: 0.75 kg from 15 °C to 100 °C with 3.0 kW'
    inputs: {m: 0.75 kg, c: 4180 J/(kg*K), dT: 85 K, P: 3000 W}
    formula: m * c * dT / P
    expected: 89 s
    shown: ['the 3.0 kW heater brings the water to 100 °C in 89 s']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: plot-1kw
    where: 'plot caption: 0.75 kg from 15 °C to 100 °C with 1.0 kW'
    inputs: {m: 0.75 kg, c: 4180 J/(kg*K), dT: 85 K, P: 1000 W}
    formula: m * c * dT / P
    expected: 266 s
    shown: ['the 1.0 kW heater in 266 s']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  # Worked example "A kettle"
  - id: kettle-dT
    where: 'worked example "A kettle": 14 °C to 100 °C'
    inputs: {}
    formula: 100 - 14
    expected: '86'
    shown: ['$\Delta T = 100 - 14 = 86\ \text{K}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: kettle-Q
    where: 'worked example "A kettle", step (a)'
    inputs: {m: 0.60 kg, c: 4180 J/(kg*K), dT: 86 K}
    formula: m * c * dT
    expected: 2.16e5 J
    shown: ['$Q = mc\Delta T = 0.60 \times 4180 \times 86 = 2.16 \times 10^{5}\ \text{J}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: kettle-time
    where: 'worked example "A kettle", step (b)'
    inputs: {m: 0.60 kg, c: 4180 J/(kg*K), dT: 86 K, P: 2400 W}
    formula: m * c * dT / P
    expected: 90 s
    shown: ['$\Delta t = Q/P = 2.16 \times 10^{5}/2400 = 90\ \text{s}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  # Worked example "Which metal is it?"
  - id: metal-Q
    where: 'worked example "Which metal is it?", step "Energy in"'
    inputs: {P: 50 W, t: 240 s}
    formula: P * t
    expected: 1.2e4 J
    shown: ['$Q = P\,\Delta t = 50 \times 240 = 1.2 \times 10^{4}\ \text{J}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: metal-dT
    where: 'worked example "Which metal is it?": 18.0 to 51.5 °C'
    inputs: {}
    formula: 51.5 - 18.0
    expected: '33.5'
    shown: ['$\Delta T = 51.5 - 18.0 = 33.5\ \text{K}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: metal-c
    where: 'worked example "Which metal is it?", step "Specific heat"'
    inputs: {P: 50 W, t: 240 s, m: 0.80 kg, dT: 33.5 K}
    formula: P * t / (m * dT)
    expected: 448 J/(kg*K)
    shown: ['$c = Q/(m\Delta T) = 1.2 \times 10^{4}/(0.80 \times 33.5) = 448\ \text{J/(kg K)}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  # Mixing
  - id: mix-water-final
    where: 'worked example "Unequal amounts of water"'
    inputs: {m1: 0.20, t1: 85, m2: 0.50, t2: 15}
    formula: (m1 * t1 + m2 * t2) / (m1 + m2)
    expected: '35'
    shown: ['$\theta = (0.20 \times 85 + 0.50 \times 15)/(0.20 + 0.50) = 24.5/0.70 = 35\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: mix-water-lost
    where: 'worked example "Unequal amounts of water", step "Check": heat lost'
    inputs: {m: 0.20 kg, c: 4180 J/(kg*K), dT: 50 K}
    formula: m * c * dT
    expected: 4.18e4 J
    shown: ['$0.20 \times 4180 \times (85 - 35) = 4.18 \times 10^{4}\ \text{J}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: mix-water-gained
    where: 'worked example "Unequal amounts of water", step "Check": heat gained'
    inputs: {m: 0.50 kg, c: 4180 J/(kg*K), dT: 20 K}
    formula: m * c * dT
    expected: 4.18e4 J
    shown: ['$0.50 \times 4180 \times (35 - 15) = 4.18 \times 10^{4}\ \text{J}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: mix-formula
    kind: identity
    where: 'formula "Final temperature of a mixture" solves heat lost = heat gained'
    formula: m1 * c1 * (t1 - (m1*c1*t1 + m2*c2*t2)/(m1*c1 + m2*c2))
    equals: m2 * c2 * ((m1*c1*t1 + m2*c2*t2)/(m1*c1 + m2*c2) - t2)
    samples: {m1: [0.3, 0.2, 1.0], c1: [385, 4180, 900], t1: [95, 85, 60], m2: [0.25, 0.5, 2.0], c2: [4180, 4180, 2440], t2: [20, 15, 10]}
    tolerance: 1e-9
    shown: ['tex="\theta = \frac{m_1 c_1 \theta_1 + m_2 c_2 \theta_2}{m_1 c_1 + m_2 c_2}"']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: calorimeter-hot
    where: 'worked example "A calorimeter that takes its share": heat capacity of the hot water'
    inputs: {m: 0.10 kg, c: 4180 J/(kg*K)}
    formula: m * c
    expected: 418 J/K
    shown: ['$418\,(70 - \theta) = 707\,(\theta - 18)$']
    source: {cite: reading3, at: 'slide 6'}
    origin: page-own

  - id: calorimeter-cold
    where: 'worked example "A calorimeter that takes its share": heat capacity of cup plus cold water'
    inputs: {C: 80 J/K, m: 0.15 kg, c: 4180 J/(kg*K)}
    formula: C + m * c
    expected: 707 J/K
    shown: ['$418\,(70 - \theta) = 707\,(\theta - 18)$']
    source: {cite: reading3, at: 'slide 6'}
    origin: page-own

  - id: calorimeter-numerator
    where: 'worked example "A calorimeter that takes its share", step "Final temperature": numerator'
    inputs: {}
    formula: 418 * 70 + 707 * 18
    expected: '41986'
    shown: ['$\theta = (418 \times 70 + 707 \times 18)/(418 + 707) = 41\,986/1125 = 37.3\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: calorimeter-final
    where: 'worked example "A calorimeter that takes its share", step "Final temperature"'
    inputs: {m1: 0.10, t1: 70, m2: 0.15, t2: 18, C: 80, c: 4180}
    formula: (m1*c*t1 + (C + m2*c)*t2) / (m1*c + C + m2*c)
    expected: '37.3'
    shown: ['$\theta = (418 \times 70 + 707 \times 18)/(418 + 707) = 41\,986/1125 = 37.3\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: calorimeter-no-cup
    where: 'worked example "A calorimeter that takes its share": without the cup'
    inputs: {m1: 0.10, t1: 70, m2: 0.15, t2: 18}
    formula: (m1*t1 + m2*t2) / (m1 + m2)
    expected: '38.8'
    shown: ['Without the cup the answer would be $38.8\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: copper-C1
    where: 'worked example "Hot copper in cold water": heat capacity of the copper'
    inputs: {m: 0.30 kg, c: 385 J/(kg*K)}
    formula: m * c
    expected: 115.5 J/K
    shown: ['$m_1 c_1 = 0.30 \times 385 = 115.5\ \text{J/K}$']
    source: {cite: reading1, at: 'slide 10'}
    origin: page-own

  - id: copper-C2
    where: 'worked example "Hot copper in cold water": heat capacity of the water'
    inputs: {m: 0.25 kg, c: 4180 J/(kg*K)}
    formula: m * c
    expected: 1045 J/K
    shown: ['$m_2 c_2 = 0.25 \times 4180 = 1045\ \text{J/K}$']
    source: {cite: reading1, at: 'slide 10'}
    origin: page-own

  - id: copper-ratio
    where: 'worked example "Hot copper in cold water": about nine times as much'
    inputs: {}
    formula: 1045 / 115.5
    expected: '9'
    tolerance: '2%'
    shown: ['about nine times as much']
    source: {cite: reading1, at: 'slide 10'}
    origin: page-own

  - id: copper-numerator
    where: 'worked example "Hot copper in cold water": numerator'
    inputs: {}
    formula: 115.5 * 95 + 1045 * 20
    expected: '31873'
    tolerance: '0.01%'
    shown: ['$\theta = (115.5 \times 95 + 1045 \times 20)/(115.5 + 1045) = 31\,873/1160.5 = 27.5\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: copper-final
    where: 'worked example "Hot copper in cold water": final temperature'
    inputs: {}
    formula: (115.5 * 95 + 1045 * 20) / (115.5 + 1045)
    expected: '27.5'
    shown: ['= 27.5\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: copper-drops
    where: 'worked example "Hot copper in cold water": copper cools by 67.5, water warms by 7.5'
    inputs: {}
    formula: 95 - 27.5
    expected: '67.5'
    shown: ['The copper cools by $67.5$ degrees']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: copper-rises
    where: 'worked example "Hot copper in cold water": water warms by 7.5'
    inputs: {}
    formula: 27.5 - 20
    expected: '7.5'
    shown: ['the water warms by only $7.5$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own

  - id: climate-iron-water
    where: 'section "Why water softens the climate": energy that warms 1 kg of iron by 9 degrees warms 1 kg of water by 1'
    inputs: {}
    formula: 4180 / 450
    expected: '9'
    tolerance: '5%'
    shown: ['warms a kilogram of iron by 9 degrees warms a kilogram of water by only 1']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  # Quiz
  - id: quiz-Q
    quiz: 0
    where: 'quiz 0: Q = mcΔT for 2.5 kg by 12 K'
    inputs: {m: 2.5 kg, c: 4180 J/(kg*K), dT: 12 K}
    formula: m * c * dT
    expected: 1.25e5 J
    shown: ['$Q = mc\\Delta T = 2.5 \\times 4180 \\times 12 = 1.25 \\times 10^{5}\\ \\text{J}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: quiz-Q-no-dT
    where: 'quiz 0 distractor: without the temperature rise'
    inputs: {m: 2.5 kg, c: 4180 J/(kg*K), dT: 1 K}
    formula: m * c * dT
    expected: 1.05e4 J
    tolerance: '1%'
    shown: ['$1.05 \\times 10^{4}\\ \\text{J}$ (the energy for one degree)']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: quiz-Q-no-m
    where: 'quiz 0 distractor: without the mass'
    inputs: {}
    formula: 4180 * 12
    expected: 5.02e4
    shown: ['leaving out the mass gives $5.02 \\times 10^{4}\\ \\text{J}$']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: quiz-copper-water
    where: 'quiz 1: ratio of temperature rises of copper and water'
    inputs: {}
    formula: 4180 / 385
    expected: '10.9'
    shown: ['by a factor $4180/385 = 10.9$, about 11']
    source: {cite: mit, at: '4.2 (ESBMT)'}
    origin: page-own

  - id: quiz-mix
    quiz: 2
    where: 'quiz 2: 0.10 kg at 90 °C into 0.30 kg at 30 °C'
    inputs: {}
    formula: (0.10 * 90 + 0.30 * 30) / (0.10 + 0.30)
    expected: '45'
    shown: ['$\\theta = 18/0.40 = 45\\ {}^{\\circ}\\text{C}$']
    source: {cite: reading1, at: 'slide 8'}
    origin: page-own
