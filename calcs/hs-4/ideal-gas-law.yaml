# Calculations on content/year-0/hs-4/ideal-gas-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 4: R = 8.31 J/(mol K), N_A = 6.02e23 /mol, k_B = 1.38e-23 J/K, g = 9.81 m/s^2,
# atmospheric pressure 1.01e5 Pa, 0 °C = 273 K, water density 1000 kg/m^3.

page: content/year-0/hs-4/ideal-gas-law.mdx
calcs:
  # Quiz
  - id: quiz-boyle-half-volume
    kind: identity
    where: 'quiz 0: half the volume at constant T doubles the pressure (pV constant)'
    formula: p * V / (V / 2)
    equals: 2 * p
    samples: {p: [1.0e5, 3.0e5], V: [0.01, 2.0]}
    tolerance: 1e-12
    shown: ['half the volume means twice the pressure']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  - id: quiz-kelvin-27
    where: 'quiz 1: 27 °C in kelvin'
    inputs: {}
    formula: 27 + 273
    expected: '300'
    shown: ['$27\\ ^\\circ\\text{C} = 300\\ \\text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: quiz-kelvin-327
    where: 'quiz 1: 327 °C in kelvin'
    inputs: {}
    formula: 327 + 273
    expected: '600'
    shown: ['$327\\ ^\\circ\\text{C} = 600\\ \\text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: quiz-pressure-doubles
    where: 'quiz 1: p2/p1 = T2/T1 at constant volume'
    inputs: {}
    formula: (327 + 273) / (27 + 273)
    expected: '2'
    shown: ['so the pressure doubles']
    source: {cite: mit, at: 'Sec. 7.2, Pressure-temperature relation'}
    origin: page-own

  - id: quiz-celsius-ratio
    where: 'quiz 1: the wrong factor from dividing Celsius temperatures'
    inputs: {}
    formula: 327 / 27
    expected: '12'
    shown: ['the wrong factor of about 12', 'about 12 times as large']
    source: {cite: mit, at: 'Sec. 7.2, Pressure-temperature relation'}
    origin: page-own

  - id: quiz-moles
    where: 'quiz 2: n = pV/(RT)'
    inputs: {p: 1.00e5 Pa, V: 0.0249 m**3, R: 8.31 J/(mol*K), T: 300 K}
    formula: p * V / (R * T)
    expected: 1.0 mol
    shown: ['$n = pV/(RT) = 1.00 \\times 10^5 \\times 0.0249/(8.31 \\times 300) = 1.0\\ \\text{mol}$']
    quiz: 2
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: quiz-moles-litres
    where: 'quiz 2, distractor: the volume in litres gives about 1000 mol'
    inputs: {p: 1.00e5, V: 24.9, R: 8.31, T: 300}
    formula: p * V / (R * T)
    expected: '1000'
    shown: ['gives 1000 mol']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: quiz-moles-celsius
    where: 'quiz 2, distractor: 27 instead of 300 K gives about 11 mol'
    inputs: {p: 1.00e5, V: 0.0249, R: 8.31, T: 27}
    formula: p * V / (R * T)
    expected: '11'
    shown: ['gives 11 mol']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: quiz-molecules
    where: 'quiz 4: N = pV/(k_B T) in 1.0 m³ at 273 K and 1.01e5 Pa'
    inputs: {p: 1.01e5 Pa, V: 1.0 m**3, k: 1.38e-23 J/K, T: 273 K}
    formula: p * V / (k * T)
    expected: '2.68e25'
    shown: ['1.01 \\times 10^5 \\times 1.0/(1.38 \\times 10^{-23} \\times 273) = 2.68 \\times 10^{25}$']
    quiz: 4
    source: {cite: greytak, at: 'p. 2'}
    origin: page-own

  - id: quiz-molecules-moles
    where: 'quiz 4: the number of moles pV/(RT) and N = n N_A'
    inputs: {p: 1.01e5 Pa, V: 1.0 m**3, R: 8.31 J/(mol*K), T: 273 K}
    formula: p * V / (R * T)
    expected: 44.5 mol
    shown: ['The number 44.5 is the number of moles']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: quiz-molecules-via-moles
    where: 'quiz 4: 44.5 moles times N_A gives the same number of molecules'
    inputs: {n: 44.5, NA: 6.02e23}
    formula: n * NA
    expected: '2.68e25'
    shown: ['44.5 moles times $6.02 \\times 10^{23}$ gives the same answer']
    source: {cite: nist-na, at: 'Avogadro constant'}
    origin: page-own

  # Bubble rising in a lake
  - id: bubble-water-pressure
    where: 'worked example "A bubble rising in a lake": pressure of 10.0 m of water'
    inputs: {rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 10.0 m}
    formula: rho * g * h
    expected: 9.81e4 Pa
    shown: ['$1000 \times 9.81 \times 10.0 = 9.81 \times 10^4\ \text{Pa}$']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  - id: bubble-total-pressure
    where: 'worked example "A bubble rising in a lake": total pressure at the depth of the diver'
    inputs: {p0: 1.01e5 Pa, dp: 9.81e4 Pa}
    formula: p0 + dp
    expected: 1.99e5 Pa
    shown: ['$1.01 \times 10^5 + 9.81 \times 10^4 = 1.99 \times 10^5\ \text{Pa}$']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  - id: bubble-volume
    where: 'worked example "A bubble rising in a lake": V2 = p1 V1/p2'
    inputs: {p1: 1.99e5 Pa, V1: 2.0 cm**3, p2: 1.01e5 Pa}
    formula: p1 * V1 / p2
    expected: 3.9 cm**3
    shown: ['$V_2 = p_1V_1/p_2 = 1.99 \times 10^5 \times 2.0/(1.01 \times 10^5) = 3.9\ \text{cm}^3$']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  # Balloon in the freezer
  - id: freezer-T1
    where: 'worked example "A balloon in the freezer": 22 °C in kelvin'
    inputs: {}
    formula: 22 + 273
    expected: '295'
    shown: ['$T_1 = 22 + 273 = 295\ \text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: freezer-T2
    where: 'worked example "A balloon in the freezer": −18 °C in kelvin'
    inputs: {}
    formula: -18 + 273
    expected: '255'
    shown: ['$T_2 = -18 + 273 = 255\ \text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: freezer-volume
    where: 'worked example "A balloon in the freezer": V2 = V1 T2/T1'
    inputs: {V1: 3.0 L, T1: 295 K, T2: 255 K}
    formula: V1 * T2 / T1
    expected: 2.6 L
    shown: ['$V_2 = V_1T_2/T_1 = 3.0 \times 255/295 = 2.6\ \text{L}$']
    source: {cite: mit, at: 'Sec. 7.2, Charles'' law'}
    origin: page-own

  - id: freezer-shrink
    where: 'worked example "A balloon in the freezer": the balloon shrinks by about 14%'
    inputs: {}
    formula: (1 - 255 / 295) * 100
    expected: '14'
    shown: ['The balloon shrinks by about 14%.']
    source: {cite: mit, at: 'Sec. 7.2, Charles'' law'}
    origin: page-own

  # Spray can
  - id: can-T1
    where: 'worked example "A spray can in a hot car": 20 °C in kelvin'
    inputs: {}
    formula: 20 + 273
    expected: '293'
    shown: ['$T_1 = 20 + 273 = 293\ \text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: can-T2
    where: 'worked example "A spray can in a hot car": 60 °C in kelvin'
    inputs: {}
    formula: 60 + 273
    expected: '333'
    shown: ['$T_2 = 60 + 273 = 333\ \text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: can-pressure
    where: 'worked example "A spray can in a hot car": p2 = p1 T2/T1'
    inputs: {p1: 3.0e5 Pa, T1: 293 K, T2: 333 K}
    formula: p1 * T2 / T1
    expected: 3.4e5 Pa
    shown: ['$p_2 = p_1T_2/T_1 = 3.0 \times 10^5 \times 333/293 = 3.4 \times 10^5\ \text{Pa}$']
    source: {cite: mit, at: 'Sec. 7.2, Pressure-temperature relation'}
    origin: page-own

  - id: can-increase
    where: 'worked example "A spray can in a hot car": about 14% more'
    inputs: {}
    formula: (333 / 293 - 1) * 100
    expected: '14'
    shown: ['about 14% more']
    source: {cite: mit, at: 'Sec. 7.2, Pressure-temperature relation'}
    origin: page-own

  # Weather balloon
  - id: atm-temperature-10km
    where: 'worked example "A weather balloon": NASA troposphere model, T = 15.04 − 0.00649 h at h = 10 000 m (−49.9 °C)'
    inputs: {}
    formula: 15.04 - 0.00649 * 10000
    expected: '-50'
    tolerance: '1%'
    shown: ['a temperature of $-50\ ^\circ\text{C}$']
    source: {cite: nasa-atm, at: 'troposphere curve fit'}
    origin: page-own

  - id: atm-pressure-10km
    where: 'worked example "A weather balloon": NASA troposphere model, p = 101.29 [(T + 273.1)/288.08]^5.256 kPa at h = 10 000 m'
    inputs: {}
    formula: 101.29 * ((15.04 - 0.00649 * 10000 + 273.1) / 288.08)**5.256
    expected: '26.5'
    shown: ['a pressure of $26.5\ \text{kPa}$']
    source: {cite: nasa-atm, at: 'troposphere curve fit'}
    origin: page-own

  - id: balloon-T1
    where: 'worked example "A weather balloon": 15 °C in kelvin'
    inputs: {}
    formula: 15 + 273
    expected: '288'
    shown: ['$T_1 = 15 + 273 = 288\ \text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: balloon-T2
    where: 'worked example "A weather balloon": −50 °C in kelvin'
    inputs: {}
    formula: -50 + 273
    expected: '223'
    shown: ['$T_2 = -50 + 273 = 223\ \text{K}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1'}
    origin: page-own

  - id: balloon-volume
    where: 'worked example "A weather balloon": V2 = V1 (p1/p2)(T2/T1)'
    inputs: {V1: 4.0 m**3, p1: 101 kPa, p2: 26.5 kPa, T1: 288 K, T2: 223 K}
    formula: V1 * (p1 / p2) * (T2 / T1)
    expected: 11.8 m**3
    shown: ['4.0 \times \frac{101}{26.5} \times \frac{223}{288} = 11.8\ \text{m}^3$']
    source: {cite: mit, at: 'Sec. 7.2, The general gas equation'}
    origin: page-own

  - id: balloon-pressure-ratio
    where: 'worked example "A weather balloon", step "Check": the pressure ratio alone'
    inputs: {}
    formula: 101 / 26.5
    expected: '3.8'
    shown: ['$101/26.5 = 3.8$ times larger']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  # Constants
  - id: avogadro
    kind: fact
    where: 'formula "Avogadro''s number and the mole", flashcard and summary'
    value: 6.02e23 1/mol
    tolerance: '0.1%'
    shown: ['tex="N_A = 6.02 \times 10^{23}\ \text{mol}^{-1}', '**Avogadro''s number**, $6.02 \times 10^{23}$.', 'the Avogadro constant is $N_A = 6.02 \\times 10^{23}\\ \\text{mol}^{-1}$', 'One mole is $6.02 \\times 10^{23}$ particles', 'so the Avogadro constant is $N_A = 6.02 \times 10^{23}\ \text{mol}^{-1}$', 'N_A = 6.02 × 10²³ particles per mole']
    source: {cite: nist-na, at: 'Avogadro constant'}
    origin: mit

  - id: avogadro-exact
    kind: fact
    where: 'section "Counting the gas: the mole": the exact value'
    value: 6.02214076e23 1/mol
    shown: ['$6.022\,140\,76 \times 10^{23}$ per mole']
    source: {cite: nist-na, at: 'Avogadro constant'}
    origin: mit

  - id: gas-constant
    kind: fact
    where: 'section "The ideal gas law": R (Siyavula 8.314 J/(K mol), rounded)'
    value: 8.31 J/(mol*K)
    tolerance: '0.1%'
    shown: ['$pV/T = 8.31\ \text{J/(mol K)}$', 'R = 8.31\ \text{J mol}^{-1}\,\text{K}^{-1}', 'with $R = 8.31\\ \\text{J/(mol K)}$','with $R = 8.31\ \text{J/(mol K)}$', 'R = 8.31 J/(mol K)']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: mit

  - id: boltzmann-constant
    kind: fact
    where: 'section "Per molecule: Boltzmann''s constant", formula, flashcard and summary'
    value: 1.38e-23 J/K
    tolerance: '0.1%'
    shown: ['**Boltzmann''s constant** $k_B = 1.38 \times 10^{-23}\ \text{J/K}$ (the value NIST lists, rounded to three figures)', 'with $k_B = 1.38 \times 10^{-23}\ \text{J/K}$ and','k_B = 1.38 \times 10^{-23}\ \text{J/K}"', '$k_B = 1.38 \\times 10^{-23}\\ \\text{J/K}$']
    source: {cite: nist-k, at: 'Boltzmann constant'}
    origin: mit

  - id: r-from-na-kb
    where: 'section "Per molecule: Boltzmann''s constant": R = N_A k_B'
    inputs: {NA: 6.02e23 1/mol, k: 1.38e-23 J/K}
    formula: NA * k
    expected: 8.31 J/(mol*K)
    shown: ['$6.02 \times 10^{23} \times 1.38 \times 10^{-23} = 8.31$']
    source: {cite: greytak, at: 'p. 2'}
    origin: page-own

  # One mole
  - id: molar-volume
    where: 'worked example "How much gas is in one mole?": V = nRT/p at 0 °C and 1.01e5 Pa'
    inputs: {n: 1 mol, R: 8.31 J/(mol*K), T: 273 K, p: 1.01e5 Pa}
    formula: n * R * T / p
    expected: 0.0225 m**3
    shown: ['$V = nRT/p = 1 \times 8.31 \times 273/(1.01 \times 10^5) = 0.0225\ \text{m}^3 = 22.5\ \text{L}$', 'One mole fills about $22.5\ \text{L}$','the point marks 22.5 L at 101 kPa']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: molar-volume-cube
    where: 'worked example "How much gas is in one mole?": side of a cube of 0.0225 m³'
    inputs: {V: 0.0225 m**3}
    formula: V**(1/3)
    expected: 0.28 m
    shown: ['a box about 28 cm on each side']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: molar-volume-exact
    where: 'worked example "How much gas is in one mole?": with R = 8.314, 273.15 K and 101 325 Pa'
    inputs: {n: 1 mol, R: 8.314 J/(mol*K), T: 273.15 K, p: 101325 Pa}
    formula: n * R * T / p
    expected: 22.4 L
    shown: ['it comes out at $22.4\ \text{L}$']
    source: {cite: mit, at: 'Sec. 7.2, Table 7.1 and The ideal gas equation'}
    origin: page-own

  # Helium cylinder
  - id: helium-moles
    where: 'worked example "A helium cylinder": n = pV/(RT)'
    inputs: {p: 1.50e7 Pa, V: 0.0100 m**3, R: 8.31 J/(mol*K), T: 293 K}
    formula: p * V / (R * T)
    expected: 61.6 mol
    shown: ['$n = pV/(RT) = 1.50 \times 10^7 \times 0.0100/(8.31 \times 293) = 61.6\ \text{mol}$']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  - id: helium-atoms
    where: 'worked example "A helium cylinder": N = n N_A'
    inputs: {n: 61.6 mol, NA: 6.02e23 1/mol}
    formula: n * NA
    expected: '3.71e25'
    shown: ['$N = nN_A = 61.6 \times 6.02 \times 10^{23} = 3.71 \times 10^{25}$ atoms']
    source: {cite: nist-na, at: 'Avogadro constant'}
    origin: page-own

  - id: helium-expanded
    where: 'worked example "A helium cylinder": volume at 1.01e5 Pa by Boyle''s law'
    inputs: {V1: 10.0 L, p1: 1.50e7 Pa, p2: 1.01e5 Pa}
    formula: V1 * p1 / p2
    expected: 1485 L
    shown: ['$10.0 \times 1.50 \times 10^7/(1.01 \times 10^5) = 1485\ \text{L}$']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  - id: helium-balloons
    where: 'worked example "A helium cylinder": number of 5.0 L balloons'
    inputs: {}
    formula: (1485 - 10.0) / 5.0
    expected: '295'
    shown: ['$1475/5.0 = 295$ balloons']
    source: {cite: mit, at: 'Sec. 7.2, Boyle''s law'}
    origin: page-own

  # Plot
  - id: plot-isotherm-units
    kind: identity
    where: 'plot: p in kPa = 8.31 T / V with V in litres, for n = 1 mol'
    formula: 1 * 8.31 * T / (VL * 1e-3) / 1e3
    equals: 8.31 * T / VL
    samples: {T: [100.0, 273.0, 600.0], VL: [5.0, 22.5, 50.0]}
    tolerance: 1e-12
    shown: ['this is p = 8.31 T/V']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation'}
    origin: page-own

  # Earth and Mars
  - id: mars-pressure
    kind: fact
    where: 'worked example "The air on Earth and on Mars": Mars surface pressure 6.36 mb at mean radius (4.0 to 8.7 mb with the season)'
    value: 636 Pa
    shown: ['a surface pressure of $636\ \text{Pa}$ (at the planet''s mean radius; it changes with the seasons)']
    source: {cite: nasa-mars, at: 'surface pressure 6.36 mb at mean radius'}
    origin: later-data

  - id: mars-temperature
    kind: fact
    where: 'worked example "The air on Earth and on Mars": Mars average temperature'
    value: 214 K
    shown: ['an average temperature of about $214\ \text{K}$']
    source: {cite: nasa-mars, at: 'average temperature'}
    origin: later-data

  - id: earth-number-density
    where: 'worked example "The air on Earth and on Mars", step "Earth": N/V = p/(k_B T)'
    inputs: {p: 1.01e5 Pa, k: 1.38e-23 J/K, T: 293 K}
    formula: p / (k * T)
    expected: 2.50e25 1/m**3
    shown: ['$N/V = p/(k_BT) = 1.01 \times 10^5/(1.38 \times 10^{-23} \times 293) = 2.50 \times 10^{25}$ molecules per m³']
    source: {cite: greytak, at: 'p. 2'}
    origin: page-own

  - id: mars-number-density
    where: 'worked example "The air on Earth and on Mars", step "Mars"'
    inputs: {p: 636 Pa, k: 1.38e-23 J/K, T: 214 K}
    formula: p / (k * T)
    expected: 2.15e23 1/m**3
    shown: ['$N/V = 636/(1.38 \times 10^{-23} \times 214) = 2.15 \times 10^{23}$ molecules per m³']
    source: {cite: greytak, at: 'p. 2'}
    origin: page-own

  - id: earth-mars-ratio
    where: 'worked example "The air on Earth and on Mars", step "Compare"'
    inputs: {}
    formula: 2.50e25 / 2.15e23
    expected: '116'
    shown: ['$2.50 \times 10^{25}/(2.15 \times 10^{23}) = 116$']
    source: {cite: greytak, at: 'p. 2'}
    origin: page-own

  # Real gases
  - id: volume-per-molecule
    where: 'section "When is a real gas ideal?": volume per molecule at sea level'
    inputs: {nv: 2.50e25 1/m**3}
    formula: 1 / nv
    expected: 4.0e-26 m**3
    shown: ['$1/(2.50 \times 10^{25}) = 4.0 \times 10^{-26}\ \text{m}^3$']
    source: {cite: reading1, at: 'Ideal gases and non-ideal gas behaviour'}
    origin: page-own

  - id: molecule-spacing
    where: 'section "When is a real gas ideal?": side of the cube per molecule'
    inputs: {v: 4.0e-26 m**3}
    formula: v**(1/3)
    expected: 3.4e-9 m
    shown: ['a cube $3.4 \times 10^{-9}\ \text{m}$ (3.4 nm) on each side']
    source: {cite: reading1, at: 'Ideal gases and non-ideal gas behaviour'}
    origin: page-own

  - id: bohr-radius
    kind: fact
    where: 'section "When is a real gas ideal?": radius of a hydrogen atom, as in lesson 0.11 (Bohr radius 5.29e-11 m)'
    value: 0.053 nm
    tolerance: '1%'
    shown: ['A hydrogen atom has a radius of about $0.053\ \text{nm}$ (lesson 0.11)']
    source: {cite: nist-a0, at: 'Bohr radius'}
    origin: later-data

  - id: hydrogen-width
    where: 'section "When is a real gas ideal?": width of a hydrogen atom, twice its radius'
    inputs: {a0: 0.053 nm}
    formula: 2 * a0
    expected: 0.106 nm
    shown: ['so it is about $0.106\ \text{nm}$ across']
    source: {cite: nist-a0, at: 'Bohr radius'}
    origin: page-own

  - id: spacing-over-atom
    where: 'section "When is a real gas ideal?": room per molecule against the width of a hydrogen atom'
    inputs: {}
    formula: 3.4 / 0.106
    expected: '32'
    shown: ['more than thirty times as wide as a hydrogen atom ($3.4/0.106 = 32$)']
    source: {cite: reading1, at: 'Ideal gases and non-ideal gas behaviour'}
    origin: page-own
