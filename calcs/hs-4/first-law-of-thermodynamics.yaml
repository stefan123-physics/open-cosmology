# Calculations on content/year-0/hs-4/first-law-of-thermodynamics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 4: R = 8.31 J/(mol K), 0 °C = 273 K.
# Sources: MIT 8.044 Lecture 6 slides (mit), 8.044 Lecture 5 slides (reading1), 8.21 Lecture 4 slides (reading2),
# NASA Glenn Earth Atmosphere Model (nasa-atm). All worked-example and quiz numbers are the page's own.
# Monatomic ideal gas throughout: U = (3/2) n R T = (3/2) p V; adiabat p V^(5/3) = constant, T V^(2/3) = constant.

page: content/year-0/hs-4/first-law-of-thermodynamics.mdx
calcs:
  # Identities behind the derivations
  - id: U-from-pV
    kind: identity
    where: 'section "Internal energy": (3/2) n R T = (3/2) p V because pV = nRT'
    formula: 3/2 * n * R * (p * V / (n * R))
    equals: 3/2 * p * V
    samples: {n: [0.4, 2.0], R: [8.31, 8.314], p: [1.0e5, 2.5e5], V: [0.001, 0.02]}
    tolerance: 1e-12
    shown: ['the internal energy can also be written as $U = \tfrac32 pV$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: work-piston
    kind: identity
    where: 'section "Work done by a gas": F Δx = p A Δx = p ΔV with ΔV = A Δx'
    formula: (p * A) * dx
    equals: p * (A * dx)
    samples: {p: [1.0e5, 3.0e5], A: [0.001, 0.05], dx: [0.01, 0.3]}
    tolerance: 1e-12
    shown: ['But $A\,\Delta x$ is just the increase in volume $\Delta V$']
    source: {cite: reading2, at: 'slide 15'}
    origin: mit

  - id: cp-over-cv-monatomic
    where: 'section "Constant volume", quiz 4 and summary: constant pressure needs 5/3 times the heat of constant volume'
    inputs: {}
    formula: (3/2 + 1) / (3/2)
    expected: '1.6667'
    shown: ['warming at constant pressure takes $5/3$ times as much heat', 'for helium $5/3$ times as much', 'a monatomic gas then needs $5/3$ times as much heat']
    source: {cite: mit, at: 'slide 19: C_P = (5/2)Nk, C_V = (3/2)Nk, C_P/C_V = 5/3'}
    origin: mit

  - id: adiabat-T-exponent
    kind: identity
    where: 'formula "Adiabatic path of a monatomic ideal gas": pV^(5/3) constant and pV = nRT give TV^(2/3) constant'
    formula: (p * V / (n * R)) * V**(2/3)
    equals: p * V**(5/3) / (n * R)
    samples: {p: [1.0e5, 2.5e5], V: [0.005, 0.04], n: [1.0, 2.0], R: [8.31, 8.31]}
    tolerance: 1e-12
    shown: ['TV^{2/3} = \text{constant}']
    source: {cite: mit, at: 'slides 21 and 22'}
    origin: mit

  # Worked example: a helium balloon
  - id: balloon-T
    where: 'worked example "A helium balloon": 20 °C in kelvin'
    inputs: {}
    formula: 20 + 273
    expected: '293'
    shown: ['$T = 20 + 273 = 293\ \text{K}$, so']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: balloon-U
    where: 'worked example "A helium balloon": U = (3/2) n R T'
    inputs: {n: 0.40 mol, R: 8.31 J/(mol*K), T: 293 K}
    formula: 1.5 * n * R * T
    expected: 1.46e3 J
    shown: ['$U = \tfrac32 nRT = 1.5 \times 0.40 \times 8.31 \times 293 = 1.46 \times 10^3\ \text{J}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: balloon-dU
    where: 'worked example "A helium balloon": ΔU for a 10 K rise'
    inputs: {n: 0.40 mol, R: 8.31 J/(mol*K), dT: 10 K}
    formula: 1.5 * n * R * dT
    expected: 49.9 J
    shown: ['$\Delta U = \tfrac32 nR\,\Delta T = 1.5 \times 0.40 \times 8.31 \times 10 = 49.9\ \text{J}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  # Worked example: keeping the books
  - id: books-a
    where: 'worked example "Keeping the books" (a): Q = +450 J, W = -120 J'
    inputs: {Q: 450 J, W: -120 J}
    formula: Q + W
    expected: 330 J
    shown: ['So $\Delta U = 450 - 120 = 330\ \text{J}$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: books-b
    where: 'worked example "Keeping the books" (b): Q = -200 J, W = +80 J'
    inputs: {Q: -200 J, W: 80 J}
    formula: Q + W
    expected: -120 J
    shown: ['So $\Delta U = -200 + 80 = -120\ \text{J}$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  # Worked example: heating helium under a piston
  - id: piston-W
    where: 'worked example "Heating helium under a piston": W_by = p ΔV'
    inputs: {p: 2.0e5 Pa, dV: 1.0e-3 m**3}
    formula: p * dV
    expected: 200 J
    shown: ['$W_{\text{by}} = p\,\Delta V = 2.0 \times 10^5 \times 1.0 \times 10^{-3} = 200\ \text{J}$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: piston-dV
    where: 'worked example "Heating helium under a piston": 2.5 L − 1.5 L'
    inputs: {V1: 1.5 L, V2: 2.5 L}
    formula: V2 - V1
    expected: 1.0e-3 m**3
    shown: ['$\Delta V = 1.0\ \text{L} = 1.0 \times 10^{-3}\ \text{m}^3$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: piston-dU
    where: 'worked example "Heating helium under a piston": ΔU = (3/2) p ΔV; also the constant-volume comparison'
    inputs: {p: 2.0e5 Pa, dV: 1.0e-3 m**3}
    formula: 1.5 * p * dV
    expected: 300 J
    shown: ['$\Delta U = \tfrac32 p\,\Delta V = 1.5 \times 200 = 300\ \text{J}$', '$\Delta U$ is again $300\ \text{J}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: piston-Q
    where: 'worked example "Heating helium under a piston": Q = ΔU − W with W = −200 J; also "instead of 500 J"'
    inputs: {p: 2.0e5 Pa, dV: 1.0e-3 m**3}
    formula: 1.5 * p * dV + p * dV
    expected: 500 J
    shown: ['$Q = \Delta U - W = 300 - (-200) = 500\ \text{J}$', 'instead of $500\ \text{J}$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: piston-T2
    where: 'worked example "Heating helium under a piston": Charles''s law; also the constant-volume comparison'
    inputs: {T1: 300 K}
    formula: T1 * 2.5 / 1.5
    expected: 500 K
    shown: ['$T_2 = 300 \times 2.5/1.5 = 500\ \text{K}$', 'from $300\ \text{K}$ to $500\ \text{K}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: piston-T2-check-dU
    kind: identity
    where: 'constant-volume comparison: (3/2) n R ΔT with n = pV1/(R T1) and ΔT = 200 K equals the 300 J of the piston example'
    formula: 1.5 * (p * V1 / (R * T1)) * R * (T1 * V2 / V1 - T1)
    equals: 1.5 * p * (V2 - V1)
    samples: {p: [2.0e5, 2.0e5], V1: [0.0015, 0.0015], V2: [0.0025, 0.0025], R: [8.31, 8.31], T1: [300, 300]}
    tolerance: 1e-12
    shown: ['(the same gas and the same temperature rise)']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  # Worked example: a quick squeeze
  - id: squeeze-dT
    where: 'worked example "A quick squeeze": ΔT = 2ΔU/(3nR)'
    inputs: {dU: 6.0 J, n: 0.0050 mol, R: 8.31 J/(mol*K)}
    formula: 2 * dU / (3 * n * R)
    expected: 96 K
    shown: ['\dfrac{2 \times 6.0}{3 \times 0.0050 \times 8.31} = 96\ \text{K}$']
    source: {cite: mit, at: 'slides 5 and 18'}
    origin: page-own

  - id: squeeze-T2
    where: 'worked example "A quick squeeze": 293 K + 96 K'
    inputs: {T1: 293 K, dU: 6.0 J, n: 0.0050 mol, R: 8.31 J/(mol*K)}
    formula: T1 + 2 * dU / (3 * n * R)
    expected: 389 K
    tolerance: '0.2%'
    shown: ['to about $389\ \text{K}$']
    source: {cite: mit, at: 'slides 5 and 18'}
    origin: page-own

  # Rising air: NASA atmosphere model
  - id: lapse-rate
    where: 'section "Rising air cools": NASA troposphere fit T = 15.04 − 0.00649 h, per kilometre'
    inputs: {slope: 0.00649 K/m, h: 1000 m}
    formula: slope * h
    expected: 6.5 K
    shown: ['by about $6.5\ ^\circ\text{C}$ for every kilometre']
    source: {cite: nasa-atm, at: 'troposphere curve fit'}
    origin: later-data

  # Plot and worked example: three ways to double the volume (n = 1.00 mol, 300 K, 10.0 L -> 20.0 L)
  - id: three-p1-Pa
    where: 'worked example "Three ways to double the volume": the start pressure'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), T: 300 K, V: 0.0100 m**3}
    formula: n * R * T / V
    expected: 2.49e5 Pa
    shown: ['$p_1 = nRT/V = 1.00 \times 8.31 \times 300/0.0100 = 2.49 \times 10^5\ \text{Pa}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: three-p1-kPa
    where: 'plot text, caption and worked example: the start pressure in kPa (249 and 249.3)'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), T: 300 K, V: 10 L}
    formula: n * R * T / V
    expected: 249.3 kPa
    tolerance: '0.1%'
    shown: ['so at $249\ \text{kPa}$', 'or $249\ \text{kPa}$', 'from 10 L and 300 K (249 kPa)', 'constant pressure p = 249.3 kPa', '{ x: 10, y: 249.3, label: "start" }', 'no heat p = 249.3 × (10/V)^(5/3)']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: three-isobar-W
    where: 'worked example (a): W_by = p ΔV at constant pressure'
    inputs: {p: 2.493e5 Pa, dV: 0.0100 m**3}
    formula: p * dV
    expected: 2.49e3 J
    shown: ['$W_{\text{by}} = p\,\Delta V = 2.493 \times 10^5 \times 0.0100 = 2.49 \times 10^3\ \text{J}$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: three-isobar-T2
    where: 'worked example (a): volume doubles at constant pressure, so T doubles'
    inputs: {T: 300 K}
    formula: 2 * T
    expected: 600 K
    shown: ['the temperature doubles too, to $600\ \text{K}$', 'The gas ends at $600\ \text{K}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: three-isobar-dU
    where: 'worked example (a): ΔU = (3/2) n R ΔT with ΔT = 300 K'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), dT: 300 K}
    formula: 1.5 * n * R * dT
    expected: 3.74e3 J
    shown: ['$\Delta U = \tfrac32 nR\,\Delta T = 1.5 \times 8.31 \times 300 = 3.74 \times 10^3\ \text{J}$']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: three-isobar-Q
    where: 'worked example (a): Q = ΔU + W_by = (5/2) n R ΔT'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), dT: 300 K, p: 2.493e5 Pa, dV: 0.0100 m**3}
    formula: 1.5 * n * R * dT + p * dV
    expected: 6.23e3 J
    shown: ['$Q = \Delta U + W_{\text{by}} = 6.23 \times 10^3\ \text{J}$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: ln2
    where: 'worked example (b): ln 2'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['8.31 \times 300 \times 0.693 =']
    source: {cite: reading1, at: 'slide 20'}
    origin: page-own

  - id: three-isotherm-W
    where: 'worked example (b): W_by = n R T ln(V2/V1) = Q'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), T: 300 K}
    formula: n * R * T * log(2)
    expected: 1.73e3 J
    shown: ['W_{\text{by}} = nRT\ln 2 = 8.31 \times 300 \times 0.693 = 1.73 \times 10^3\ \text{J}$', '$Q = 1.73 \times 10^3\ \text{J}$']
    source: {cite: reading1, at: 'slide 20'}
    origin: page-own

  - id: three-adiabat-T2
    where: 'worked example (c) and "Compare": T2 = 300 (1/2)^(2/3)'
    inputs: {T: 300 K}
    formula: T * 0.5**(2/3)
    expected: 189 K
    shown: ['$T_2 = 300 \times (1/2)^{2/3} = 189\ \text{K}$', 'or $189\ \text{K}$']
    source: {cite: mit, at: 'slides 21 and 22'}
    origin: page-own

  - id: three-adiabat-dU
    where: 'worked example (c): ΔU = (3/2) n R (189 − 300) = −W_by'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), T1: 300 K, T2: 189 K}
    formula: 1.5 * n * R * (T2 - T1)
    expected: -1.38e3 J
    shown: ['1.5 \times 8.31 \times (189 - 300) = -1.38 \times 10^3\ \text{J}$', 'so the gas does $W_{\text{by}} = 1.38 \times 10^3\ \text{J}$ of work']
    source: {cite: mit, at: 'slides 5 and 18'}
    origin: page-own

  - id: three-adiabat-dU-exact
    where: 'worked example (c): the same with the unrounded T2 (188.99 K) still rounds to 1.38e3 J'
    inputs: {n: 1.00 mol, R: 8.31 J/(mol*K), T: 300 K}
    formula: 1.5 * n * R * (T * 0.5**(2/3) - T)
    expected: -1.38e3 J
    shown: ['= -1.38 \times 10^3\ \text{J}$, so']
    source: {cite: mit, at: 'slides 21 and 22'}
    origin: page-own

  # Cosmology callout
  - id: cmb-temperature
    kind: fact
    where: 'cosmology callout: the microwave background today (as in lesson 4.2)'
    value: 2.7 K
    tolerance: '2%'
    shown: ['down to the $2.7\ \text{K}$ of the microwave background']
    source: {cite: mit, at: 'quoted from lesson 4.2'}
    origin: page-own

  # Quiz
  - id: quiz-first-law
    quiz: 0
    where: 'quiz 0: Q = 300 J, W = -100 J'
    inputs: {Q: 300 J, W: -100 J}
    formula: Q + W
    expected: 200 J
    shown: ['$\\Delta U = Q + W = 300 - 100 = 200\\ \\text{J}$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: quiz-first-law-wrong
    where: 'quiz 0 distractor: adding the two numbers'
    inputs: {Q: 300 J, W: 100 J}
    formula: Q + W
    expected: 400 J
    shown: ['Adding the two numbers (400 J)']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: quiz-isotherm
    quiz: 2
    where: 'quiz 2: ΔU = 0, so the gas does as much work as the heat it takes in'
    inputs: {Q: 250 J}
    formula: Q
    expected: 250 J
    shown: ['the gas does $250\\ \\text{J}$ of work']
    source: {cite: mit, at: 'slides 8, 16 and 17'}
    origin: page-own

  - id: quiz-pdV
    quiz: 3
    where: 'quiz 3: W_by = p ΔV with ΔV = 2.0 L'
    inputs: {p: 1.5e5 Pa, dV: 2.0 L}
    formula: p * dV
    expected: 300 J
    shown: ['$W_{\\text{by}} = p\\Delta V = 1.5 \\times 10^5 \\times 2.0 \\times 10^{-3} = 300\\ \\text{J}$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: quiz-pdV-litres
    where: 'quiz 3 distractor: volume left in litres'
    inputs: {}
    formula: 1.5e5 * 2.0
    expected: '3.0e5'
    shown: ['cubic metres gives $3.0 \\times 10^5\\ \\text{J}$']
    source: {cite: reading2, at: 'slide 15'}
    origin: page-own

  - id: dry-bubble-rate
    where: 'section "Rising air cools": a dry bubble cools by close to 10 °C per km (g/c_p)'
    inputs: {g: 9.81 m/s^2, cp: 1010 J/(kg*K), h: 1000 m}
    formula: g * h / cp
    expected: 10 K
    tolerance: '5%'
    shown: ['cools by close to $10\ ^\circ\text{C}$ for every kilometre it climbs']
    source: {cite: reading2, at: 'slide 6'}
    origin: page-own
