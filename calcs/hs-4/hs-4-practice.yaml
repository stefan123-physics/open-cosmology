  # Problem 1: a fishing float and a diver's camera
  - id: hs4p-p1-a
    answer: p1-a
    where: 'Problem 1(a): ρ = 0.36/1.5e-3 = 240 kg/m³'
    inputs: {}
    formula: 0.36 / 1.5e-3
    expected: '240'
    shown: ['$\rho = 0.36/(1.5 \times 10^{-3}) = 240\ \text{kg/m}^3$']
    source: {cite: nasadensity, at: 'density as mass divided by volume (our own problem)'}
    origin: page-own

  - id: hs4p-p1-a-slip
    where: 'Problem 1(a), check: V/m = 1.5e-3/0.36 = 4.2 × 10⁻³'
    inputs: {}
    formula: 1.5e-3 / 0.36
    expected: '4.2e-3'
    shown: ['would give $4.2 \times 10^{-3}$']
    source: {cite: nasadensity, at: 'the slip is our own'}
    origin: page-own

  - id: hs4p-p1-b
    answer: p1-b
    where: 'Problem 1(b): fraction under water ρ/ρ_fluid = 240/1025 = 0.234'
    inputs: {}
    formula: (0.36 / 1.5e-3) / 1025
    expected: '0.234'
    shown: ['$\rho/\rho_\text{fluid} = 240/1025 = 0.234$']
    source: {cite: reading1, at: 'p. 116, Example: the Archimedes principle (our own problem)'}
    origin: page-own

  - id: hs4p-p1-b-fresh
    where: 'Problem 1(b), check: in fresh water 240/1000 = 0.240'
    inputs: {}
    formula: 240 / 1000
    expected: '0.240'
    shown: ['it would be $0.240$']
    source: {cite: reading1, at: 'our own check'}
    origin: page-own

  - id: hs4p-p1-rhogh
    where: 'Problem 1(c): ρgh = 1025 × 9.81 × 18 = 1.81 × 10⁵ Pa'
    inputs: {}
    formula: 1025 * 9.81 * 18
    expected: '1.81e5'
    shown: ['The water adds $\rho g h = 1025 \times 9.81 \times 18 = 1.81 \times 10^{5}\ \text{Pa}$', 'the water''s part, $\rho g h = 1.81 \times 10^{5}\ \text{Pa}$']
    source: {cite: reading1, at: 'Eq. (6.53) (our own numbers)'}
    origin: page-own

  - id: hs4p-p1-c
    answer: p1-c
    where: 'Problem 1(c): p = 1.01e5 + 1.81e5 = 2.82 × 10⁵ Pa'
    inputs: {}
    formula: 1.01e5 + 1025 * 9.81 * 18
    expected: '2.82e5'
    shown: ['$p = 1.01 \times 10^{5} + 1.81 \times 10^{5} = 2.82 \times 10^{5}\ \text{Pa}$', 'The water pushes in with $2.82 \times 10^{5}\ \text{Pa}$']
    source: {cite: reading1, at: 'Eq. (6.53), P(z) = P₀ − ρgz (our own problem)'}
    origin: page-own

  - id: hs4p-p1-c-atm
    where: 'Problem 1(c), check: 2.82e5/1.01e5 = 2.8 atmospheres'
    inputs: {}
    formula: (1.01e5 + 1025 * 9.81 * 18) / 1.01e5
    expected: '2.8'
    shown: ['That is about $2.8$ atmospheres']
    source: {cite: reading1, at: 'our own check'}
    origin: page-own

  - id: hs4p-p1-d
    answer: p1-d
    where: 'Problem 1(d): F = ρgh × A = 1.81e5 × 0.0050 = 905 N'
    inputs: {}
    formula: 1025 * 9.81 * 18 * 0.0050
    expected: '905'
    shown: ['$F = 1.81 \times 10^{5} \times 0.0050 = 905\ \text{N}$']
    source: {cite: nasapressure, at: 'pressure force = pressure × area (our own problem)'}
    origin: page-own

  - id: hs4p-p1-d-kg
    where: 'Problem 1(d), check: 905/9.81 = 92 kg'
    inputs: {}
    formula: 1025 * 9.81 * 18 * 0.0050 / 9.81
    expected: '92'
    shown: ['the weight of about $92\ \text{kg}$']
    source: {cite: nasapressure, at: 'our own check'}
    origin: page-own

  - id: hs4p-p1-d-slip
    where: 'Problem 1(d), check: total pressure 2.82e5 × 0.0050 = 1.41 × 10³ N'
    inputs: {}
    formula: (1.01e5 + 1025 * 9.81 * 18) * 0.0050
    expected: '1.41e3'
    shown: ['would give $1.41 \times 10^{3}\ \text{N}$']
    source: {cite: nasapressure, at: 'the slip is our own'}
    origin: page-own

  # Problem 2: liquid nitrogen and a pizza oven
