# Calculations on content/year-0/hs-4/hs-4-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8). All problems and numbers are our own.
# Constants as in the Block 4 lessons: g = 9.81 m/s², R = 8.31 J/(mol K), k_B = 1.38e-23 J/K, N_A = 6.02e23 /mol, 1 u = 1.66e-27 kg,
# c_water = 4180 J/(kg K), c_ice = 2100 J/(kg K), L_f = 3.34e5 J/kg, L_v = 2.26e6 J/kg.

page: content/year-0/hs-4/hs-4-practice.mdx
calcs:
  # Introduction
  - id: hs4p-intro-points
    where: 'Introduction: 10 × 10 = 100 points (Problem 11 optional)'
    inputs: {}
    formula: 10 * 10
    expected: '100'
    shown: ['Problems 1 to 10 count 10 points each, 100 in all']
    source: {cite: mit, at: 'the page''s own scoring'}
    origin: page-own

  - id: hs4p-intro-g
    kind: fact
    where: 'Introduction: g = 9.81 m/s² (standard gravity 9.806 65 m/s² rounded, as in the lessons)'
    value: '9.81'
    shown: ['take $g = 9.81\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Eq. (6.53), ρgz (g = 9.81 m/s² as in lesson 4.1)'}
    origin: page-own

  - id: hs4p-intro-R
    kind: fact
    where: 'Introduction: R = 8.31 J/(mol K) (as in lesson 4.3)'
    value: '8.31'
    shown: ['$R = 8.31\ \text{J/(mol K)}$']
    source: {cite: mit, at: 'Sec. 7.2, The ideal gas equation (R = 8.31 J/(mol K), as in lesson 4.3)'}
    origin: page-own

  - id: hs4p-intro-R-check
    where: 'Introduction: R = N_A k_B = 6.022 140 76e23 × 1.380 649e-23 = 8.31 J/(mol K)'
    inputs: {}
    formula: 6.02214076e23 * 1.380649e-23
    expected: '8.31'
    shown: ['$R = 8.31\ \text{J/(mol K)}$']
    source: {cite: nist-k, at: 'Boltzmann constant times the Avogadro constant (both exact)'}
    origin: page-own

  - id: hs4p-intro-kB
    kind: fact
    where: 'Introduction: k_B = 1.38 × 10⁻²³ J/K (NIST 1.380 649 × 10⁻²³ J/K, rounded as in lessons 4.3 and 4.4)'
    value: '1.38e-23'
    shown: ['$k_B = 1.38 \times 10^{-23}\ \text{J/K}$']
    source: {cite: nist-k, at: 'Boltzmann constant, 1.380 649 × 10⁻²³ J/K (exact)'}
    origin: page-own

  - id: hs4p-intro-NA
    kind: fact
    where: 'Introduction: N_A = 6.02 × 10²³ per mole (NIST 6.022 140 76 × 10²³, rounded as in lesson 4.3)'
    value: '6.02e23'
    shown: ['$N_A = 6.02 \times 10^{23}\ \text{mol}^{-1}$']
    source: {cite: nist-na, at: 'Avogadro constant, 6.022 140 76 × 10²³ per mole (exact)'}
    origin: page-own

  - id: hs4p-intro-u
    kind: fact
    where: 'Introduction: 1 u = 1.66 × 10⁻²⁷ kg (NIST 1.660 539 × 10⁻²⁷ kg, rounded as in lesson 4.4)'
    value: '1.66e-27'
    shown: ['$1\ \text{u} = 1.66 \times 10^{-27}\ \text{kg}$']
    source: {cite: nist-u, at: 'unified atomic mass unit'}
    origin: page-own

  - id: hs4p-intro-cwater
    kind: fact
    where: 'Introduction: c_water = 4180 J/(kg K) (MIT 8.21: 4.18 J/(g K); as in lesson 4.5)'
    value: '4180'
    shown: ['$c_\text{water} = 4180\ \text{J/(kg K)}$']
