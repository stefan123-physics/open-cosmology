# Calculations on content/year-0/hs-4/phase-changes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-4/phase-changes.mdx
calcs:
  - id: molar-mass-water
    where: 'section "Latent heat: Q = mL": mass of a mole of water, 6.02e23 molecules of 18 u each'
    inputs: {NA: 6.02e23, A: 18, u: 1.66e-27 kg}
    formula: NA * A * u
    expected: 0.0180 kg
    tolerance: '0.5%'
    shown: ['$6.02 \times 10^{23} \times 18 \times 1.66 \times 10^{-27} = 0.0180\ \text{kg}$']
    source: {cite: reading4, at: 'p. 97 (data per mole of water)'}
    origin: page-own

  - id: atomic-masses
    kind: fact
    where: 'section "Latent heat: Q = mL": hydrogen 1 u and oxygen 16 u, giving 2 x 1 + 16 = 18 u for H2O'
    value: 18
    shown: ['(hydrogen $1\ \text{u}$, oxygen $16\ \text{u}$; lesson 4.4)']
    source: {cite: mit, at: 'not in the source: atomic masses as in lesson 4.4 (H2 2 u, O2 32 u)'}
    origin: page-own

  - id: recombination-range
    kind: fact
    where: 'cosmology callout: recombination happened gradually, from about 4000 K (half the hydrogen neutral) to about 3000 K (decoupling)'
    value: 3000 K
    shown: ['from about $4000\ \text{K}$ to about $3000\ \text{K}$']
    source: {cite: mit, at: 'not in the source: values from lesson 8.15 (cosmic-microwave-background, calcs entry t-decoupling, MIT 8.286 pp. 18-19)'}
    origin: page-own

  - id: latent-fusion
    where: 'formula "Latent heat of fusion of water": 6008 J/mol divided by 0.0180 kg/mol'
    inputs: {H: 6008 J/mol, M: 0.0180 kg/mol}
    formula: H / M
    expected: 3.34e5 J/kg
    tolerance: '0.5%'
    shown: ['tex="L_\text{f} = \frac{6008\ \text{J/mol}}{0.0180\ \text{kg/mol}} = 3.34 \times 10^{5}\ \text{J/kg}"']
    source: {cite: reading4, at: 'p. 97, data table: molar enthalpy of melting 6008 J/mol'}
    origin: page-own

  - id: latent-vaporisation
    where: 'formula "Latent heat of vaporisation of water": 40 650 J/mol divided by 0.0180 kg/mol'
    inputs: {H: 40650 J/mol, M: 0.0180 kg/mol}
    formula: H / M
    expected: 2.26e6 J/kg
    tolerance: '0.5%'
    shown: ['tex="L_\text{v} = \frac{40\,650\ \text{J/mol}}{0.0180\ \text{kg/mol}} = 2.26 \times 10^{6}\ \text{J/kg}"']
    source: {cite: reading2, at: 'Sec. 4.2, "High heat of vaporisation": 40,65 kJ/mol'}
    origin: page-own

  - id: specific-heat-ice
    where: 'section "Latent heat: Q = mL": c_ice from 38.0 J/(mol K); used as 2100 J/(kg K) in the worked example and the graph'
    inputs: {C: 38.0 J/(mol*K), M: 0.0180 kg/mol}
    formula: C / M
    expected: 2.1e3 J/(kg*K)
    tolerance: '1%'
    shown: ['$c_\text{ice} = 38.0/0.0180 = 2.1 \times 10^{3}\ \text{J/(kg K)}$', '$c_\text{ice} = 2100\ \text{J/(kg K)}$']
    source: {cite: reading4, at: 'p. 97, data table: molar heat capacity of ice 38.0 J/(mol K)'}
    origin: page-own

  - id: boil-over-melt
    where: 'section "Latent heat: Q = mL": L_v / L_f'
    inputs: {Lv: 2.26e6 J/kg, Lf: 3.34e5 J/kg}
    formula: Lv / Lf
    expected: '6.8'
    tolerance: '1%'
    shown: ['$2.26 \times 10^{6}/(3.34 \times 10^{5}) = 6.8$']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: warm-water-0-100
    where: 'section "Latent heat: Q = mL" and quiz 2: heat to warm 1 kg of water from 0 to 100 °C'
    inputs: {m: 1 kg, c: 4180 J/(kg*K), dT: 100 K}
    formula: m * c * dT
    expected: 4.18e5 J
    shown: ['$4180 \times 100 = 4.18 \times 10^{5}\ \text{J}$', '$1 \\times 4180 \\times 100 = 4.18 \\times 10^{5}\\ \\text{J}$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: quiz-boil-ratio
    where: 'quiz 2 and section "Latent heat: Q = mL" ("more than five times"): boiling 1 kg against warming it from 0 to 100 °C'
    inputs: {Lv: 2.26e6 J/kg, c: 4180 J/(kg*K), dT: 100 K}
    formula: Lv / (c * dT)
    expected: '5.4'
    tolerance: '1%'
    shown: ['$2.26 \\times 10^{6}/(4.18 \\times 10^{5}) = 5.4$', 'About 5.4 times as much', 'more than five times the heat']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own
    quiz: 2

  - id: ex1-warm-ice
    where: 'worked example "A quarter of a kilogram of ice becomes steam", step "Warm the ice to 0 °C"'
    inputs: {m: 0.250 kg, c: 2100 J/(kg*K), dT: 15 K}
    formula: m * c * dT
    expected: 7.88e3 J
    tolerance: '0.5%'
    shown: ['$Q_1 = mc_\text{ice}\Delta T = 0.250 \times 2100 \times 15 = 7.88 \times 10^{3}\ \text{J}$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: ex1-melt
    where: 'worked example, step "Melt the ice"'
    inputs: {m: 0.250 kg, Lf: 3.34e5 J/kg}
    formula: m * Lf
    expected: 8.35e4 J
    shown: ['$Q_2 = mL_\text{f} = 0.250 \times 3.34 \times 10^{5} = 8.35 \times 10^{4}\ \text{J}$']
    source: {cite: reading3, at: 'p. 8'}
    origin: page-own

  - id: ex1-warm-water
    where: 'worked example, step "Warm the water to 100 °C"'
    inputs: {m: 0.250 kg, c: 4180 J/(kg*K), dT: 100 K}
    formula: m * c * dT
    expected: 1.045e5 J
    shown: ['$Q_3 = mc_\text{water}\Delta T = 0.250 \times 4180 \times 100 = 1.045 \times 10^{5}\ \text{J}$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: ex1-boil
    where: 'worked example, step "Boil the water"'
    inputs: {m: 0.250 kg, Lv: 2.26e6 J/kg}
    formula: m * Lv
    expected: 5.65e5 J
    shown: ['$Q_4 = mL_\text{v} = 0.250 \times 2.26 \times 10^{6} = 5.65 \times 10^{5}\ \text{J}$']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: ex1-total
    where: 'worked example, step "Add up", and the Summary'
    inputs: {m: 0.250 kg, ci: 2100 J/(kg*K), cw: 4180 J/(kg*K), Lf: 3.34e5 J/kg, Lv: 2.26e6 J/kg, d1: 15 K, d2: 100 K}
    formula: m * (ci * d1 + Lf + cw * d2 + Lv)
    expected: 7.61e5 J
    tolerance: '0.5%'
    shown: ['$Q = Q_1 + Q_2 + Q_3 + Q_4 = 7.61 \times 10^{5}\ \text{J}$', 'takes $7.61 \times 10^{5}\ \text{J}$']
    source: {cite: reading3, at: 'pp. 4-5'}
    origin: page-own

  - id: ex1-boil-share
    where: 'worked example, step "Add up": boiling is 74% of the total ("three quarters" in the Summary)'
    inputs: {Q4: 5.65e5 J, Q: 760875 J}
    formula: 100 * Q4 / Q
    expected: '74'
    tolerance: '1%'
    shown: ['Boiling alone is 74% of it.', 'three quarters of it for the boiling']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: ex1-time
    where: 'worked example, step "Add up": whole job on a 1.5 kW hotplate'
    inputs: {Q: 7.61e5 J, P: 1500 W}
    formula: Q / P
    expected: 507 s
    tolerance: '0.5%'
    shown: ['$7.61 \times 10^{5}/1500 = 507\ \text{s}$', 'about eight and a half minutes']
    source: {cite: reading3, at: 'pp. 4-5'}
    origin: page-own

  - id: ex1-boil-time
    where: 'worked example, step "Add up": boiling stage on the hotplate'
    inputs: {Q: 5.65e5 J, P: 1500 W}
    formula: Q / P
    expected: 377 s
    tolerance: '0.5%'
    shown: ['$5.65 \times 10^{5}/1500 = 377\ \text{s}$']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: graph-melted
    where: 'Plot caption: for m = 0.25 kg the ice has melted after 91 kJ (Q1 + Q2)'
    inputs: {m: 0.25 kg, ci: 2100 J/(kg*K), Lf: 3.34e5 J/kg, d1: 15 K}
    formula: m * (ci * d1 + Lf)
    expected: 91 kJ
    tolerance: '1%'
    shown: ['melted after 91 kJ']
    source: {cite: reading3, at: 'p. 8'}
    origin: page-own

  - id: graph-boiled
    where: 'Plot caption: all boiled away after 761 kJ; the expression breakpoints 31.5m, 365.5m, 783.5m, 3043.5m (kJ) give 760.9 kJ for m = 0.25 kg'
    inputs: {m: 0.25}
    formula: 3043.5 * m
    expected: '761'
    tolerance: '0.5%'
    shown: ['boiled away after 761 kJ']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: slope-ratio
    where: 'section "From ice to steam": the ice part of the curve is about twice as steep as the water part (slope 1/(mc))'
    inputs: {cw: 4180, ci: 2100}
    formula: cw / ci
    expected: '2'
    tolerance: '1%'
    shown: ['about twice as steep as the water part']
    source: {cite: reading4, at: 'p. 97'}
    origin: page-own

  - id: energy-per-molecule
    where: 'section "Evaporation cools": energy to evaporate one molecule'
    inputs: {H: 40650 J, NA: 6.02e23}
    formula: H / NA
    expected: 6.75e-20 J
    tolerance: '0.5%'
    shown: ['$40\,650/(6.02 \times 10^{23}) = 6.75 \times 10^{-20}\ \text{J}$']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: boiling-kelvin
    where: 'section "Evaporation cools": 100 °C is 373 K'
    inputs: {t: 100}
    formula: t + 273
    expected: '373'
    shown: ['$373\ \text{K}$']
    source: {cite: reading1, at: 'Sec. 3.2'}
    origin: page-own

  - id: average-ke-373
    where: 'section "Evaporation cools": (3/2)k_BT at 373 K'
    inputs: {kB: 1.38e-23 J/K, T: 373 K}
    formula: 1.5 * kB * T
    expected: 7.72e-21 J
    tolerance: '0.5%'
    shown: ['$\tfrac32 k_BT = 1.5 \times 1.38 \times 10^{-23} \times 373 = 7.72 \times 10^{-21}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 3.2'}
    origin: page-own

  - id: escape-over-average
    where: 'section "Evaporation cools": escaping takes almost nine times the average energy'
    inputs: {E1: 6.75e-20 J, E2: 7.72e-21 J}
    formula: E1 / E2
    expected: '8.7'
    tolerance: '2%'
    shown: ['almost nine times the average energy']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: sweat-heat
    where: 'worked example "Cooling by sweat", step "Heat carried away"'
    inputs: {m: 0.80 kg, Lv: 2.26e6 J/kg}
    formula: m * Lv
    expected: 1.81e6 J
    tolerance: '0.5%'
    shown: ['$Q = mL_\text{v} = 0.80 \times 2.26 \times 10^{6} = 1.81 \times 10^{6}\ \text{J}$']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: sweat-power
    where: 'worked example "Cooling by sweat", step "Rate", and the Summary (about 500 W)'
    inputs: {Q: 1.81e6 J, t: 3600 s}
    formula: Q / t
    expected: 502 W
    tolerance: '1%'
    shown: ['$1.81 \times 10^{6}/3600 = 502\ \text{W}$', 'about $500\ \text{W}$']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: sweat-warming
    where: 'worked example "Cooling by sweat", step "Without sweating"'
    inputs: {Q: 1.81e6 J, m: 75 kg, c: 4180 J/(kg*K)}
    formula: Q / (m * c)
    expected: 5.8 K
    tolerance: '1%'
    shown: ['$\Delta T = Q/(mc) = 1.81 \times 10^{6}/(75 \times 4180) = 5.8\ \text{K}$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: drink-heat
    where: 'worked example "How much ice cools a drink?", step "Heat the lemonade must lose"'
    inputs: {m: 0.30 kg, c: 4180 J/(kg*K), dT: 25 K}
    formula: m * c * dT
    expected: 3.14e4 J
    tolerance: '0.5%'
    shown: ['$Q = mc_\text{water}\Delta T = 0.30 \times 4180 \times 25 = 3.14 \times 10^{4}\ \text{J}$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: drink-ice
    where: 'worked example "How much ice cools a drink?", step "Ice that this heat melts"'
    inputs: {Q: 31350 J, Lf: 3.34e5 J/kg}
    formula: Q / Lf
    expected: 0.094 kg
    tolerance: '1%'
    shown: ['$m_\text{ice} = Q/L_\text{f} = 3.14 \times 10^{4}/(3.34 \times 10^{5}) = 0.094\ \text{kg}$', '$94\ \text{g}$']
    source: {cite: reading4, at: 'p. 97'}
    origin: page-own

  - id: quiz-melt
    where: 'quiz 0: heat to melt 0.40 kg of ice at 0 °C'
    inputs: {m: 0.40 kg, Lf: 3.34e5 J/kg}
    formula: m * Lf
    expected: 1.34e5 J
    tolerance: '0.5%'
    shown: ['$Q = mL_\\text{f} = 0.40 \\times 3.34 \\times 10^{5} = 1.34 \\times 10^{5}\\ \\text{J}$']
    source: {cite: reading4, at: 'p. 97'}
    origin: page-own
    quiz: 0

  - id: quiz-melt-wrong-lv
    where: 'quiz 0, distractor: using L_v instead of L_f'
    inputs: {m: 0.40 kg, Lv: 2.26e6 J/kg}
    formula: m * Lv
    expected: 9.04e5 J
    shown: ['($9.04 \\times 10^{5}\\ \\text{J}$ uses the latent heat of boiling']
    source: {cite: reading2, at: 'Sec. 4.2'}
    origin: page-own

  - id: quiz-melt-wrong-divide
    where: 'quiz 0, distractor: dividing L_f by the mass'
    inputs: {m: 0.40 kg, Lf: 3.34e5 J/kg}
    formula: Lf / m
    expected: 8.35e5 J/kg**2
    shown: ['$8.35 \\times 10^{5}\\ \\text{J}$ divides by the mass']
    source: {cite: reading4, at: 'p. 97'}
    origin: page-own

  - id: quiz-melt-wrong-c
    where: 'quiz 0, distractor: m times c_water (1672 J)'
    inputs: {m: 0.40, c: 4180}
    formula: m * c
    expected: '1.67e3'
    tolerance: '0.5%'
    shown: ['$1.67 \\times 10^{3}\\ \\text{J}$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own
