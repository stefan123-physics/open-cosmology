# Calculations on content/year-0/hs-4/temperature.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 11, 7.1 (mit) and 7.2 (reading1, Table 7.1: K = °C + 273); NIST SI Units – Temperature (nist: 0 °C = 273.15 K);
# NASA Sun: Facts (nasa-sun); NASA LAMBDA COBE FIRAS overview (firas: 2.725 K, as in lessons 7.11, 8.13 and 8.15; calcs/values.yaml).
# All worked-example and quiz numbers are the page's own (Siyavula's examples use 20, 32, 8 and 25 °C and 298 and 340 K; not reused).

page: content/year-0/hs-4/temperature.mdx
calcs:
  - id: zero-celsius
    kind: fact
    where: 'formula "Celsius to kelvin": 0 °C is 273.15 K'
    value: 273.15 K
    shown: ['tex="T = \theta + 273.15"', '$0\ {}^{\circ}\text{C}$ is $273.15\ \text{K}$']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: later-data

  - id: plot-freezing
    where: 'plot point "water freezes": θ = 0 °C'
    inputs: {theta: 0}
    formula: theta + 273.15
    expected: 273.15
    shown: ['{ x: 0, y: 273.15, label: "water freezes" }']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: page-own

  - id: plot-boiling
    where: 'plot point "water boils": θ = 100 °C'
    inputs: {theta: 100}
    formula: theta + 273.15
    expected: 373.15
    shown: ['{ x: 100, y: 373.15, label: "water boils" }']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: page-own

  - id: absolute-zero
    where: 'plot caption and section "Absolute zero": T = 0 at θ = −273.15 °C'
    inputs: {T: 0}
    formula: T - 273.15
    expected: -273.15
    shown: ['It reaches T = 0 at θ = −273.15 °C, absolute zero.', '$0\ \text{K}$, or $-273.15\ {}^{\circ}\text{C}$']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: page-own

  - id: ke-ratio-600
    where: 'section "Absolute zero": 600 K is twice 300 K'
    inputs: {T1: 300, T2: 600}
    formula: T2 / T1
    expected: 2
    shown: ['a gas at $600\ \text{K}$ has particles with twice the average kinetic energy of the same gas at $300\ \text{K}$']
    source: {cite: mit, at: 'temperature is a measure of the average kinetic energy (proportionality: lesson 4.4)'}
    origin: page-own

  - id: freezer
    where: 'worked example "Converting temperatures", step "Freezer": −18 °C'
    inputs: {theta: -18}
    formula: theta + 273
    expected: 255
    shown: ['$T = \theta + 273 = -18 + 273 = 255\ \text{K}$']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own

  - id: fever
    where: 'worked example "Converting temperatures", step "Fever": 39.5 °C'
    inputs: {theta: 39.5}
    formula: theta + 273.15
    expected: 312.65
    shown: ['$T = 39.5 + 273.15 = 312.65\ \text{K}$, which is $312.7\ \text{K}$']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: page-own

  - id: cold-gas
    where: 'worked example "Converting temperatures", step "Cold gas": 90 K'
    inputs: {T: 90}
    formula: T - 273
    expected: -183
    shown: ['$\theta = T - 273 = 90 - 273 = -183\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own

  - id: rise-60
    where: 'worked example "Changes and ratios", step "The rise": 15 °C to 75 °C'
    inputs: {a: 15, b: 75}
    formula: (b + 273) - (a + 273)
    expected: 60
    shown: ['$\Delta\theta = 75 - 15 = 60\ {}^{\circ}\text{C}$, so $\Delta T = 60\ \text{K}$', '$348 - 288 = 60\ \text{K}$']
    source: {cite: nist, at: 'one Celsius degree is an interval of 1 K'}
    origin: page-own

  - id: ratio-75-15
    where: 'worked example "Changes and ratios", step "The ratio": 348/288'
    inputs: {a: 15, b: 75}
    formula: (b + 273) / (a + 273)
    expected: 1.21
    tolerance: '0.5%'
    shown: ['$15 + 273 = 288\ \text{K}$ and $75 + 273 = 348\ \text{K}$', '$348/288 = 1.21$', 'rises by about 21%']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own

  - id: sun-surface-celsius
    kind: fact
    where: 'worked example "The Sun and the sky": photosphere about 5500 °C (NASA)'
    value: 5500
    shown: ['about $5500\ {}^{\circ}\text{C}$']
    source: {cite: nasa-sun, at: 'photosphere'}
    origin: later-data

  - id: sun-core-celsius
    kind: fact
    where: 'worked example "The Sun and the sky": core above 15 million °C (NASA)'
    value: 1.5e7
    shown: ['more than $1.5 \times 10^{7}\ {}^{\circ}\text{C}$, 15 million degrees (NASA, *Sun: Facts*)']
    source: {cite: nasa-sun, at: 'core: temperatures top 15 million °C'}
    origin: later-data

  - id: sun-surface-kelvin
    where: 'worked example "The Sun and the sky", step "Converting": 5500 °C in kelvin'
    inputs: {theta: 5500}
    formula: theta + 273.15
    expected: 5773
    tolerance: '0.01%'
    shown: ['$T = 5500 + 273.15 = 5773\ \text{K}$, about $5800\ \text{K}$']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: page-own

  - id: t-cmb
    kind: fact
    where: 'worked example "The Sun and the sky" and the cosmology callout: 2.725 K (COBE FIRAS, as lessons 8.13 and 8.15)'
    value: 2.725 K
    shown: ['has a temperature of $2.725\ \text{K}$ (NASA, COBE FIRAS overview)', 'at $2.725\ \text{K}$, fills all of space']
    source: {cite: firas, at: '2.725 ± 0.002 K'}
    origin: later-data

  - id: cmb-celsius
    where: 'worked example "The Sun and the sky", step "Converting": 2.725 K in °C'
    inputs: {T: 2.725}
    formula: T - 273.15
    expected: -270.4
    tolerance: '0.05%'
    shown: ['$\theta = 2.725 - 273.15 = -270.4\ {}^{\circ}\text{C}$']
    source: {cite: nist, at: 'SI Units – Temperature'}
    origin: page-own

  - id: core-shift
    where: 'worked example "The Sun and the sky", step "The core": 273 against 15 000 000, in percent'
    inputs: {core: 15000000}
    formula: 273 / core * 100
    expected: 0.0018
    tolerance: '2%'
    shown: ['Adding 273 to 15 000 000 changes it by less than 0.002%']
    source: {cite: nasa-sun, at: 'core above 15 million °C'}
    origin: page-own

  - id: sun-cmb-ratio
    where: 'worked example "The Sun and the sky", step "The ratio"'
    inputs: {Ts: 5773.15, Tc: 2.725}
    formula: Ts / Tc
    expected: 2119
    tolerance: '0.05%'
    shown: ['$5773/2.725 = 2119$, so about 2100 times']
    source: {cite: firas, at: '2.725 K, with the surface temperature above'}
    origin: page-own

  - id: mix-celsius
    where: 'worked example "Mixing hot and cold water", step "Equal amounts"'
    inputs: {a: 70, b: 10}
    formula: (a + b) / 2
    expected: 40
    shown: ['$\theta = (70 + 10)/2 = 40\ {}^{\circ}\text{C}$']
    source: {cite: reading5, at: 'p. 3 (thermal equilibrium); equal masses of the same substance'}
    origin: page-own

  - id: mix-kelvin
    where: 'worked example "Mixing hot and cold water", step "Check in kelvin"'
    inputs: {a: 343, b: 283}
    formula: (a + b) / 2 - 273
    expected: 40
    shown: ['$343\ \text{K}$ and $283\ \text{K}$ meet at $(343 + 283)/2 = 313\ \text{K}$, which is $313 - 273 = 40\ {}^{\circ}\text{C}$']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own

  - id: quiz-ice
    where: 'quiz 0: −25 °C in kelvin'
    inputs: {theta: -25}
    formula: theta + 273
    expected: 248
    shown: ['$T = \\theta + 273 = -25 + 273 = 248\\ \\text{K}$']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own

  - id: quiz-kettle
    where: 'quiz 1: rise from 12 °C to 47 °C'
    inputs: {a: 12, b: 47}
    formula: (b + 273) - (a + 273)
    expected: 35
    quiz: 1
    shown: ['a rise of $47 - 12 = 35\\ {}^{\\circ}\\text{C}$ is a rise of $35\\ \\text{K}$', '$(47 + 273) - (12 + 273) = 35$']
    source: {cite: nist, at: 'one Celsius degree is an interval of 1 K'}
    origin: page-own

  - id: quiz-air-ratio
    where: 'quiz 4: 7 °C to 27 °C, ratio in kelvin'
    inputs: {a: 7, b: 27}
    formula: (b + 273) / (a + 273)
    expected: 1.07
    tolerance: '0.5%'
    quiz: 4
    shown: ['from $280\\ \\text{K}$ to $300\\ \\text{K}$, a factor $300/280 = 1.07$: only 7% more']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own

  - id: quiz-air-wrong
    where: 'quiz 4: the meaningless Celsius ratio 27/7'
    inputs: {a: 7, b: 27}
    formula: b / a
    expected: 3.9
    tolerance: '2%'
    shown: ['$27/7 = 3.9$']
    source: {cite: reading1, at: 'Table 7.1'}
    origin: page-own
