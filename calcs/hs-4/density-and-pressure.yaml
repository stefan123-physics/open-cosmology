# Calculations on content/year-0/hs-4/density-and-pressure.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-4/density-and-pressure.mdx
calcs:
  - id: quiz-statue-density
    where: 'quiz 0: ρ = 0.50 kg / 2.0 × 10⁻⁴ m³'
    inputs: {m: 0.50 kg, V: 2.0e-4 m**3}
    formula: m / V
    expected: 2.5e3 kg/m**3
    shown: ['$\\rho = m/V = 0.50/(2.0 \\times 10^{-4}) = 2.5 \\times 10^{3}\\ \\text{kg/m}^3$']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: quiz-statue-wrong-product
    where: 'quiz 0 explanation: the wrong product m V'
    inputs: {m: 0.50, V: 2.0e-4}
    formula: m * V
    expected: '1.0e-4'
    shown: ['Multiplying $m$ by $V$ gives $1.0 \\times 10^{-4}$']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: quiz-statue-wrong-ratio
    where: 'quiz 0 explanation: the wrong ratio V/m'
    inputs: {m: 0.50, V: 2.0e-4}
    formula: V / m
    expected: '4.0e-4'
    shown: ['dividing $V$ by $m$ gives $4.0 \\times 10^{-4}$']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: quiz-box-area
    where: 'quiz 1: area 0.20 m × 0.10 m'
    inputs: {a: 0.20 m, b: 0.10 m}
    formula: a * b
    expected: 0.020 m**2
    shown: ['$A = 0.20 \\times 0.10 = 0.020\\ \\text{m}^2$']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: quiz-box-pressure
    where: 'quiz 1: p = 30 N / 0.020 m²'
    inputs: {F: 30 N, a: 0.20 m, b: 0.10 m}
    formula: F / (a * b)
    expected: 1.5e3 Pa
    shown: ['$p = F/A = 30/0.020 = 1.5 \\times 10^{3}\\ \\text{Pa}$']
    quiz: 1
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: quiz-box-wrong
    where: 'quiz 1 explanation: F × A = 0.60 and A/F = 6.7 × 10⁻⁴'
    inputs: {F: 30, A: 0.020}
    formula: F * A
    expected: '0.60'
    shown: ['Multiplying force and area gives $0.60$']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: quiz-box-wrong-2
    where: 'quiz 1 explanation: A/F'
    inputs: {F: 30, A: 0.020}
    formula: A / F
    expected: '6.7e-4'
    shown: ['dividing the area by the force gives $6.7 \\times 10^{-4}$']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: quiz-lake-water
    where: 'quiz 2: ρgh at 25 m in fresh water'
    inputs: {rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 25 m}
    formula: rho * g * h
    expected: 2.45e5 Pa
    shown: ['$\\rho g h = 1000 \\times 9.81 \\times 25 = 2.45 \\times 10^{5}\\ \\text{Pa}$']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: quiz-lake-total
    where: 'quiz 2: p = p₀ + ρgh at 25 m'
    inputs: {p0: 1.01e5 Pa, rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 25 m}
    formula: p0 + rho * g * h
    expected: 3.5e5 Pa
    tolerance: '2%'
    shown: ['$p = 1.01 \\times 10^{5} + 2.45 \\times 10^{5} = 3.5 \\times 10^{5}\\ \\text{Pa}$']
    quiz: 2
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: quiz-lake-atm
    where: 'quiz 2 explanation: 3.5 × 10⁵ Pa is about three and a half atmospheres'
    inputs: {p0: 1.01e5 Pa, rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 25 m, atm: 101325 Pa}
    formula: (p0 + rho * g * h) / atm
    expected: '3.5'
    tolerance: '3%'
    shown: ['about three and a half atmospheres']
    source: {cite: reading2, at: 'Table 7.1: 1 atm = 101 325 Pa'}
    origin: page-own

  - id: quiz-lake-no-g
    where: 'quiz 2 explanation: leaving out g gives 1.3 × 10⁵'
    inputs: {p0: 1.01e5, rho: 1000, h: 25}
    formula: p0 + rho * h
    expected: '1.3e5'
    tolerance: '4%'
    shown: ['leaving out $g$ gives $1.3 \\times 10^{5}$']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: water-density
    kind: fact
    where: 'section "Density" and flashcard 0: water 1000 kg/m³'
    value: 1000 kg/m**3
    shown: ['the same density, $1000\ \text{kg/m}^3$']
    source: {cite: nasadensity, at: 'density as mass per volume (the value of water is the standard one, used from lesson 0.2 on)'}
    origin: page-own

  - id: air-density
    where: 'section "Density": air near the ground about 1.2 kg/m³, from the NASA model at sea level (ρ = p/[0.2869 (T + 273.1)], p = 101.29 kPa, T = 15.04 °C)'
    inputs: {p: 101.29, T: 15.04}
    formula: p / (0.2869 * (T + 273.1))
    expected: '1.2'
    tolerance: '3%'
    shown: ['air near the ground has about $1.2\ \text{kg/m}^3$ (lesson 2.6; NASA, Earth Fact Sheet)']
    source: {cite: nasaatmos, at: 'troposphere curve fits and ρ = p/[0.2869 (T + 273.1)] at h = 0'}
    origin: later-data

  - id: air-density-factsheet
    kind: fact
    where: 'section "Density": air near the ground about 1.2 kg/m³, the Earth Fact Sheet''s surface density 1.217 kg/m³ rounded'
    value: 1.217 kg/m**3
    shown: ['air near the ground has about $1.2\ \text{kg/m}^3$ (lesson 2.6; NASA, Earth Fact Sheet)']
    source: {cite: earthfact, at: 'Terrestrial atmosphere: surface density 1.217 kg/m³'}
    origin: later-data

  - id: earth-density
    kind: fact
    where: 'section "Density": the Earth''s mean density'
    value: 5513 kg/m**3
    shown: ['average density of $5513\ \text{kg/m}^3$ (NASA, Earth Fact Sheet)']
    source: {cite: earthfact, at: 'Bulk parameters: mean density 5513 kg/m³'}
    origin: later-data

  - id: earth-over-water
    where: 'section "Density": five and a half times that of water'
    inputs: {rho_e: 5513 kg/m**3, rho_w: 1000 kg/m**3}
    formula: rho_e / rho_w
    expected: '5.5'
    tolerance: '1%'
    shown: ['five and a half times that of water']
    source: {cite: earthfact, at: 'mean density 5513 kg/m³'}
    origin: page-own

  - id: water-over-air
    where: 'section "Density": air more than 800 times less dense than water (1000/1.2 = 833; 1000/1.217 = 822)'
    inputs: {rho_w: 1000 kg/m**3, rho_a: 1.2 kg/m**3}
    formula: rho_w / rho_a
    expected: '833'
    tolerance: '1%'
    shown: ['more than 800 times']
    source: {cite: reading3, at: 'Table 3.1'}
    origin: page-own

  - id: slab-volume
    where: 'worked example "A paving slab and the air in a classroom", step "Volume of the slab"'
    inputs: {a: 0.40 m, b: 0.30 m, c: 0.050 m}
    formula: a * b * c
    expected: 6.0e-3 m**3
    shown: ['$V = 0.40 \times 0.30 \times 0.050 = 6.0 \times 10^{-3}\ \text{m}^3$']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: slab-density
    where: 'same, step "Density of the concrete"'
    inputs: {m: 14.4 kg, a: 0.40 m, b: 0.30 m, c: 0.050 m}
    formula: m / (a * b * c)
    expected: 2.4e3 kg/m**3
    shown: ['$\rho = m/V = 14.4/(6.0 \times 10^{-3}) = 2.4 \times 10^{3}\ \text{kg/m}^3$', 'about 2.4 times the density of water']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: room-volume
    where: 'same, step "Mass of the air": volume of the room'
    inputs: {l: 8.0 m, w: 6.0 m, h: 3.0 m}
    formula: l * w * h
    expected: 144 m**3
    shown: ['$8.0 \times 6.0 \times 3.0 = 144\ \text{m}^3$']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: room-air-mass
    where: 'same, step "Mass of the air": m = ρV'
    inputs: {rho: 1.2 kg/m**3, V: 144 m**3}
    formula: rho * V
    expected: 170 kg
    tolerance: '2%'
    shown: ['$m = \rho V = 1.2 \times 144 \approx 170\ \text{kg}$']
    source: {cite: nasadensity, at: 'definition of density'}
    origin: page-own

  - id: paper-pressure
    where: 'section "Pressure": a sheet of ordinary printer paper (80 g/m²) presses with about 0.8 Pa, a little less than 1 Pa'
    inputs: {sigma: 0.080 kg/m**2, g: 9.81 m/s**2}
    formula: sigma * g
    expected: 0.8 Pa
    tolerance: '3%'
    shown: ['presses with a little less than that (about $0.8\ \text{Pa}$)']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: car-weight
    where: 'worked example "A car on its tyres", step "The force"'
    inputs: {m: 1200 kg, g: 9.81 m/s**2}
    formula: m * g
    expected: 1.18e4 N
    shown: ['$F = mg = 1200 \times 9.81 = 1.18 \times 10^{4}\ \text{N}$']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: car-area
    where: 'same, step "The area"'
    inputs: {a: 0.015 m**2}
    formula: 4 * a
    expected: 0.060 m**2
    shown: ['$A = 4 \times 0.015 = 0.060\ \text{m}^2$']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: car-pressure
    where: 'same, step "The pressure"'
    inputs: {m: 1200 kg, g: 9.81 m/s**2, a: 0.015 m**2}
    formula: m * g / (4 * a)
    expected: 2.0e5 Pa
    shown: ['$p = F/A = 1.18 \times 10^{4}/0.060 = 2.0 \times 10^{5}\ \text{Pa}$', '$200\ \text{kPa}$']
    source: {cite: nasapressure, at: 'pressure = force / area'}
    origin: page-own

  - id: atm-pressure
    kind: fact
    where: 'formula "Air pressure at sea level" and flashcard 1'
    value: 1.01e5 Pa
    shown: ['p_0 \approx 1.01 \times 10^{5}\ \text{Pa}']
    source: {cite: reading2, at: 'Table 7.1: 1 atm = 101 325 Pa'}
    origin: page-own

  - id: atm-hpa
    where: 'section "The pressure of the atmosphere": about 1013 hPa'
    inputs: {p: 101325 Pa}
    formula: p
    expected: 1013 hPa
    tolerance: '0.1%'
    shown: ['about $1013\ \text{hPa}$']
    source: {cite: reading2, at: 'Table 7.1'}
    origin: page-own

  - id: bar-pascal
    where: 'section "The pressure of the atmosphere": 1 bar = 10⁵ Pa'
    inputs: {b: 1 bar, u: 1 Pa}
    formula: b / u
    expected: '1e5'
    tolerance: '1e-9'
    shown: ['$1\ \text{bar} = 10^{5}\ \text{Pa}$']
    source: {cite: reading2, at: 'Table 7.1 (SI unit of pressure, the pascal; the bar is the standard definition)'}
    origin: page-own

  - id: air-column-mass
    where: 'same section: mass of the air above each square metre, p₀/g'
    inputs: {p0: 1.01e5 Pa, g: 9.81 m/s**2, A: 1 m**2}
    formula: p0 * A / g
    expected: 1.03e4 kg
    shown: ['$1.01 \times 10^{5}/9.81 = 1.03 \times 10^{4}\ \text{kg}$', 'about ten tonnes']
    source: {cite: nasaatmos, at: 'air pressure related to the weight of the air above'}
    origin: page-own

  - id: half-pressure-height
    where: 'caption of the atmosphere plot: half the sea-level pressure at about 5.5 km (NASA curve fit solved for p = 101.29/2 kPa)'
    inputs: {k: 1 km}
    formula: (288.14 - 288.08 * 0.5**(1 / 5.256)) / 6.49 * k
    expected: 5.5 km
    tolerance: '1%'
    shown: ['At about 5.5 km the pressure is half that at sea level']
    source: {cite: nasaatmos, at: 'troposphere curve fits'}
    origin: page-own

  - id: atmos-fit-sea-level
    where: 'atmosphere plot: the curve starts at 101.29 kPa at h = 0 (288.14 − 6.49 h is T + 273.1 with T = 15.04 − 6.49 h)'
    inputs: {h: 0}
    formula: 101.29 * ((288.14 - 6.49 * h) / 288.08)**5.256
    expected: '101.3'
    tolerance: '0.1%'
    shown: ['p = 101.29 [(T + 273.1)/288.08]^5.256 kPa with T = 15.04 − 6.49 h °C (h in km)']
    source: {cite: nasaatmos, at: 'troposphere curve fits'}
    origin: page-own

  - id: ten-metres-water
    where: 'section "Pressure in a liquid": every 10 m of water adds 9.8 × 10⁴ Pa'
    inputs: {rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 10 m}
    formula: rho * g * h
    expected: 9.8e4 Pa
    shown: ['$1000 \times 9.81 \times 10 = 9.8 \times 10^{4}\ \text{Pa}$']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: column-weight-identity
    kind: identity
    where: 'section "Pressure in a liquid": the weight ρAhg of a column of area A, divided by A, is ρgh'
    formula: rho * A * h * g / A
    equals: rho * g * h
    samples: {rho: [1000.0, 800.0, 13600.0], A: [0.01, 2.0, 0.5], h: [3.0, 12.0, 0.76], g: [9.81, 9.81, 1.62]}
    tolerance: 1e-12
    shown: ['$\rho A h g/A = \rho g h$']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: mit

  - id: diver-water
    where: 'worked example "A diver in a lake", step "The water''s part"'
    inputs: {rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 12 m}
    formula: rho * g * h
    expected: 1.18e5 Pa
    shown: ['$\rho g h = 1000 \times 9.81 \times 12 = 1.18 \times 10^{5}\ \text{Pa}$']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: diver-total
    where: 'same, step "Add the air"'
    inputs: {p0: 1.01e5 Pa, rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 12 m}
    formula: p0 + rho * g * h
    expected: 2.19e5 Pa
    shown: ['$p = 1.01 \times 10^{5} + 1.18 \times 10^{5} = 2.19 \times 10^{5}\ \text{Pa}$']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: diver-ratio
    where: 'same: a little more than twice the pressure at the surface'
    inputs: {p0: 1.01e5 Pa, rho: 1000 kg/m**3, g: 9.81 m/s**2, h: 12 m}
    formula: (p0 + rho * g * h) / p0
    expected: '2.17'
    tolerance: '1%'
    shown: ['a little more than twice the pressure at the surface']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: depth-plot-doubling
    where: 'caption of the depth plot: for water the pressure doubles at about 10 m'
    inputs: {p0: 1.01e5 Pa, rho: 1000 kg/m**3, g: 9.81 m/s**2}
    formula: p0 / (rho * g)
    expected: 10 m
    tolerance: '5%'
    shown: ['For water (ρ = 1000 kg/m³) the pressure doubles at about 10 m']
    source: {cite: mit, at: 'Eq. (6.53)'}
    origin: page-own

  - id: block-weight
    where: 'worked example "A wooden block in water", step "The forces when it is under water": weight'
    inputs: {rho: 600 kg/m**3, V: 2.0e-3 m**3, g: 9.81 m/s**2}
    formula: rho * V * g
    expected: 11.8 N
    shown: ['$F_g = 600 \times 2.0 \times 10^{-3} \times 9.81 = 11.8\ \text{N}$']
    source: {cite: mit, at: 'p. 116, Archimedes principle'}
    origin: page-own

  - id: block-buoyancy
    where: 'same: buoyant force when fully under water'
    inputs: {rho: 1000 kg/m**3, V: 2.0e-3 m**3, g: 9.81 m/s**2}
    formula: rho * V * g
    expected: 19.6 N
    shown: ['$F_B = 1000 \times 2.0 \times 10^{-3} \times 9.81 = 19.6\ \text{N}$']
    source: {cite: mit, at: 'p. 116, Archimedes principle'}
    origin: page-own

  - id: block-mass
    where: 'same, step "Floating at rest": mass of the block'
    inputs: {rho: 600 kg/m**3, V: 2.0e-3 m**3}
    formula: rho * V
    expected: 1.2 kg
    shown: ['$600 \times 2.0 \times 10^{-3} = 1.2\ \text{kg}$']
    source: {cite: mit, at: 'p. 116, Archimedes principle'}
    origin: page-own

  - id: block-displaced-volume
    where: 'same: volume of 1.2 kg of water'
    inputs: {m: 1.2 kg, rho: 1000 kg/m**3}
    formula: m / rho
    expected: 1.2e-3 m**3
    shown: ['a volume of $1.2 \times 10^{-3}\ \text{m}^3$']
    source: {cite: mit, at: 'p. 116, Archimedes principle'}
    origin: page-own

  - id: block-fraction
    where: 'same: fraction under water 1.2/2.0 = 600/1000 = 60%'
    inputs: {rho: 600 kg/m**3, rho_f: 1000 kg/m**3}
    formula: rho / rho_f
    expected: '0.60'
    shown: ['$1.2/2.0 = 0.60$, or 60% of the block, the same as $600/1000$']
    source: {cite: mit, at: 'p. 116, Archimedes principle'}
    origin: page-own

  - id: float-fraction-identity
    kind: identity
    where: 'floating: the volume under water ρV/ρ_fluid is the fraction ρ/ρ_fluid of V'
    formula: (rho * V / rho_f) / V
    equals: rho / rho_f
    samples: {rho: [600.0, 917.0, 300.0], rho_f: [1000.0, 1025.0, 1000.0], V: [0.002, 1.5, 0.3]}
    tolerance: 1e-12
    shown: ['a floating object has the fraction $\rho/\rho_\text{fluid}$ of its volume under the surface']
    source: {cite: mit, at: 'p. 116, Archimedes principle'}
    origin: page-own

  - id: litre-cubic-metre
    where: 'section "Try it": 1 L = 10⁻³ m³'
    inputs: {v: 1 L, u: 1 m**3}
    formula: v / u
    expected: '1e-3'
    tolerance: '1e-9'
    shown: ['$1\ \text{L} = 10^{-3}\ \text{m}^3$']
    source: {cite: nasadensity, at: 'density as mass per volume (the litre is the standard definition)'}
    origin: page-own

  - id: water-kg-per-litre
    where: 'section "Try it": water 1.00 kg/L, the same as 1000 kg/m³'
    inputs: {rho: 1000 kg/m**3, u: 1 kg/L}
    formula: rho / u
    expected: '1.00'
    tolerance: '1e-9'
    shown: ['$1.00\ \text{kg/L}$, the same as $1000\ \text{kg/m}^3$']
    source: {cite: nasadensity, at: 'density as mass per volume'}
    origin: page-own
