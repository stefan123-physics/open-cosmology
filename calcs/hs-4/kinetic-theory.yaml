# Calculations on content/year-0/hs-4/kinetic-theory.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-4/kinetic-theory.mdx
calcs:
  - id: pressure-from-impacts
    kind: identity
    where: 'formula "Pressure of a gas from molecular impacts": with ⟨v²⟩ = 3k_BT/m, Nm⟨v²⟩/(3V) equals Nk_BT/V'
    formula: N * m * (3 * kB * T / m) / (3 * V)
    equals: N * kB * T / V
    samples: {N: [1.0e20, 2.5e25, 3.7e25], m: [4.65e-26, 3.32e-27, 6.6e-26], kB: [1.38e-23, 1.38e-23, 1.38e-23], T: [100.0, 293.0, 5772.0], V: [1.0e-3, 1.0, 0.01]}
    tolerance: 1e-12
    shown: ['tex="p = \frac{N m \langle v^2\rangle}{3V}"']
    source: {cite: nasakinetic, at: 'molecules give momentum to the walls; the box derivation is this page''s own (8.044 L13 slides 5 and 8 give the same formula another way)'}
    origin: page-own

  - id: wall-momentum
    kind: identity
    where: 'formula "Momentum given to the wall in one hit": the molecule goes from +mv_x to −mv_x, so −Δ(mv_x) = 2mv_x'
    formula: -((-m * vx) - (m * vx))
    equals: 2 * m * vx
    samples: {m: [4.65e-26, 3.32e-27], vx: [300.0, 1500.0]}
    tolerance: 1e-12
    shown: ['tex="-\Delta(mv_x) = 2mv_x"']
    source: {cite: momentum, at: 'Change in momentum (ESCJ9), Case 1 (Δp = p_f − p_i)'}
    origin: page-own

  - id: earth-escape
    kind: fact
    where: 'worked example "Hydrogen atoms at the surface of the Sun", step "Can it escape?": escape speed of the Earth (lesson 3.11)'
    value: 11.2 km/s
    tolerance: '0.5%'
    shown: ['the $11.2\ \text{km/s}$ needed to escape from the Earth']
    source: {cite: earthfact, at: 'Bulk parameters: escape velocity 11.186 km/s'}
    origin: later-data

  - id: atomic-mass-unit
    kind: fact
    where: 'section "How fast are the molecules?": the atomic mass unit'
    value: 1.66e-27 kg
    tolerance: '0.1%'
    shown: ['$1\ \text{u} = 1.66 \times 10^{-27}\ \text{kg}$ (NIST)']
    source: {cite: nist-u, at: 'unified atomic mass unit 1.660 539e-27 kg'}
    origin: later-data

  - id: one-molecule-force
    kind: identity
    where: 'section "Pressure from molecular impacts": F = 2mv_x/(2L/v_x) = mv_x²/L'
    formula: 2 * m * vx / (2 * L / vx)
    equals: m * vx**2 / L
    samples: {m: [4.65e-26, 3.32e-27], vx: [300.0, 1500.0], L: [0.1, 2.0]}
    tolerance: 1e-12
    shown: ['$F = 2mv_x/(2L/v_x) = mv_x^2/L$']
    source: {cite: momentum, at: 'Change in momentum (ESCJ9), Case 1'}
    origin: page-own

  - id: average-ke-identity
    kind: identity
    where: 'formula "Average kinetic energy of a molecule": ½m⟨v²⟩ with ⟨v²⟩ = 3k_BT/m is (3/2)k_BT'
    formula: 0.5 * m * (3 * kB * T / m)
    equals: 1.5 * kB * T
    samples: {m: [4.65e-26, 1.67e-27], kB: [1.38e-23, 1.38e-23], T: [293.0, 5772.0]}
    tolerance: 1e-12
    shown: ['tex="E_{k,\text{avg}} = \tfrac{3}{2}\,k_B T"']
    source: {cite: reading2, at: 'slide 5'}
    origin: mit

  - id: molecules-per-m3
    where: 'intro and worked example "The energy of one molecule of air", step "Is that a lot?": N/V = p/(k_BT) at 293 K'
    inputs: {p: 1.01e5 Pa, kB: 1.38e-23 J/K, T: 293 K}
    formula: p / (kB * T)
    expected: 2.5e25 1/m**3
    tolerance: '2%'
    shown: ['about $2.5 \times 10^{25}$ molecules in every cubic metre', 'about $2.5 \times 10^{25}$ molecules ($N/V = p/(k_BT)$)']
    source: {cite: reading2, at: 'slide 8'}
    origin: page-own

  - id: room-temperature
    where: 'worked example "The energy of one molecule of air", step "Temperature in kelvin"'
    inputs: {t: 20}
    formula: t + 273
    expected: '293'
    shown: ['$T = 20 + 273 = 293\ \text{K}$']
    source: {cite: reading2, at: 'slide 8'}
    origin: page-own

  - id: room-average-ke
    where: 'worked example "The energy of one molecule of air", step "Average kinetic energy"'
    inputs: {kB: 1.38e-23 J/K, T: 293 K}
    formula: 1.5 * kB * T
    expected: 6.07e-21 J
    shown: ['$E_{k,\text{avg}} = \tfrac32 k_B T = 1.5 \times 1.38 \times 10^{-23} \times 293 = 6.07 \times 10^{-21}\ \text{J}$']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: raindrop-ratio
    where: 'worked example, step "Is that a lot?": a 0.1 g raindrop at 1 m/s has about 10^16 times more kinetic energy'
    inputs: {m: 1.0e-4 kg, v: 1 m/s, E: 6.07e-21 J}
    formula: 0.5 * m * v**2 / E
    expected: '1e16'
    tolerance: '25%'
    shown: ['about $10^{16}$ times more kinetic energy']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: cubic-metre-ke
    where: 'worked example, step "Is that a lot?": (3/2)pV for 1 m³ of air'
    inputs: {p: 1.01e5 Pa, V: 1 m**3}
    formula: 1.5 * p * V
    expected: 1.5e5 J
    tolerance: '2%'
    shown: ['$\tfrac32 pV = 1.5 \times 1.01 \times 10^5 \times 1 = 1.5 \times 10^5\ \text{J}$']
    source: {cite: reading2, at: 'slide 8: E = (3/2)NkT = (3/2)PV'}
    origin: page-own

  - id: nitrogen-share
    kind: fact
    where: 'worked example "Nitrogen at room temperature": air is 78% nitrogen'
    value: '78.08'
    shown: ['(78%, NASA Earth Fact Sheet)']
    source: {cite: earthfact, at: 'Terrestrial atmosphere'}
    origin: later-data

  - id: nitrogen-mass
    where: 'worked example "Nitrogen at room temperature", step "Mass of one molecule"; Plot and caption'
    inputs: {u: 1.66e-27 kg}
    formula: 28 * u
    expected: 4.65e-26 kg
    shown: ['$m = 28 \times 1.66 \times 10^{-27} = 4.65 \times 10^{-26}\ \text{kg}$', '(m = 4.65 × 10⁻²⁶ kg)']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: nitrogen-v2
    where: 'worked example "Nitrogen at room temperature", step "Rms speed": 3k_BT/m'
    inputs: {kB: 1.38e-23 J/K, T: 293 K, m: 4.65e-26 kg}
    formula: 3 * kB * T / m
    expected: 2.61e5 m**2/s**2
    shown: ['\sqrt{2.61 \times 10^{5}}']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: nitrogen-vrms
    where: 'worked example "Nitrogen at room temperature", step "Rms speed"; summary, flashcard, frontmatter summary'
    inputs: {kB: 1.38e-23 J/K, T: 293 K, m: 4.65e-26 kg}
    formula: sqrt(3 * kB * T / m)
    expected: 511 m/s
    shown: ['= 511\ \text{m/s}$', 'about $511\ \text{m/s}$ for nitrogen at room temperature', 'about $511\\ \\text{m/s}$ for nitrogen at room temperature', '511 m/s for the nitrogen in a room at 20 °C']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: nitrogen-vs-sound
    where: 'worked example "Nitrogen at room temperature", step "Compare": 511/343'
    inputs: {v: 511 m/s, s: 343 m/s}
    formula: v / s
    expected: '1.5'
    tolerance: '2%'
    shown: ['That is about 1.5 times the speed of sound in air, $343\ \text{m/s}$']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: hydrogen-mass
    where: 'worked example "Hydrogen in the same room", step "Rms speed": mass of H₂'
    inputs: {u: 1.66e-27 kg}
    formula: 2 * u
    expected: 3.32e-27 kg
    shown: ['$m = 2 \times 1.66 \times 10^{-27} = 3.32 \times 10^{-27}\ \text{kg}$']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: hydrogen-vrms
    where: 'worked example "Hydrogen in the same room", step "Rms speed"'
    inputs: {kB: 1.38e-23 J/K, T: 293 K, m: 3.32e-27 kg}
    formula: sqrt(3 * kB * T / m)
    expected: 1.91e3 m/s
    shown: ['$v_{\text{rms}} = \sqrt{3 \times 1.38 \times 10^{-23} \times 293/(3.32 \times 10^{-27})} = 1.91 \times 10^3\ \text{m/s}$']
    source: {cite: reading2, at: 'slide 5'}
    origin: page-own

  - id: hydrogen-ratio
    where: 'worked example "Hydrogen in the same room", step "Check with a ratio": √(28/2)'
    inputs: {}
    formula: sqrt(28 / 2)
    expected: '3.74'
    shown: ['$\sqrt{28/2} = \sqrt{14} = 3.74$']
    source: {cite: reading2, at: 'slide 5'}
