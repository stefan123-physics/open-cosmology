  - id: peak-ratio
    where: 'section "A spread of speeds": most likely speed √(2k_BT/m) divided by v_rms = √(2/3); summary and flashcard'
    inputs: {}
    formula: sqrt(2 / 3)
    expected: '0.82'
    shown: ['$\sqrt{2/3} = 0.82$', 'a peak at $0.82\,v_{\text{rms}}$', 'the peak lies at $0.82\\,v_{\\text{rms}}$']
    source: {cite: reading3, at: 'p. 9, point ⑥ (the peak of v² e^(−mv²/2k_BT) is the page''s own step)'}
    origin: page-own

  - id: peak-of-maxwell
    kind: identity
    where: 'section "A spread of speeds": v² e^(−mv²/2k_BT) has its maximum at √(2k_BT/m); in x = v/√(k_BT/m) the curve is x² e^(−x²/2), whose slope is zero at x = √2'
    formula: deriv('x**2 * exp(-x**2 / 2)', 'x', sqrt(2) * a, 1) + 1
    equals: 1 + 0 * a
    samples: {a: [1.0]}
    tolerance: 1e-9
    shown: ['lies at $\sqrt{2k_BT/m}$']
    source: {cite: reading3, at: 'p. 9, point ⑥'}
    origin: page-own

  - id: nitrogen-peak
    where: 'section "A spread of speeds": most likely speed of nitrogen at 293 K'
    inputs: {kB: 1.38e-23 J/K, T: 293 K, m: 4.65e-26 kg}
    formula: sqrt(2 * kB * T / m)
    expected: 417 m/s
    shown: ['at about $417\ \text{m/s}$']
    source: {cite: reading3, at: 'p. 9, point ⑥'}
    origin: page-own

  - id: maxwell-normalised
    where: 'Plot caption: the area under f(v) = 4π (m/2πk_BT)^(3/2) v² exp(−mv²/2k_BT) is 1; in x = v/√(k_BT/m) the integrand is 4π (1/2π)^(3/2) x² e^(−x²/2)'
    inputs: {}
    formula: integrate('4 * pi * (1 / (2 * pi))**1.5 * x**2 * exp(-x**2 / 2)', 'x', 0, 20)
    expected: '1'
    tolerance: '0.01%'
    shown: ['the area under every curve is 1']
    source: {cite: reading3, at: 'p. 9, point ⑥ (normalising factor: the page''s own step)'}
    origin: page-own

