# Calculations on content/year-3/8.044/zero-point-energy-fluctuations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 21, with the page's own example.

page: content/year-3/8.044/zero-point-energy-fluctuations.mdx
calcs:
  - id: aliasing
    kind: identity
    where: 'slides 3b–3d: sin(k x) at lattice points x = m a is the same for k and k + 2π/a (a = L/10, k = 4π/L, L = 1)'
    formula: sin((4*pi + 20*pi)*m/10)
    equals: sin(4*pi*m/10)
    samples: {m: [1.0, 9.0]}
    tolerance: 1e-9
    shown: ['the waves with $k = 4\pi/L$, $24\pi/L$ and $44\pi/L$ all move the atoms identically']
    source: {cite: mit, at: 'slides 3b–3d'}
    origin: mit

  - id: oscillator-dlnZ
    kind: identity
    where: '(1/Z1) dZ1/dV with ω = ω0 (V/V0)^(−γ) equals (γ/V)⟨E⟩/kT (ħ = k = 1, closed-form Z1, finite difference)'
    formula: ((log(exp(-0.5*w*(1 + 1e-6)**(-g)/T)/(1 - exp(-w*(1 + 1e-6)**(-g)/T)))) - (log(exp(-0.5*w*(1 - 1e-6)**(-g)/T)/(1 - exp(-w*(1 - 1e-6)**(-g)/T)))))/2e-6
    equals: g*(0.5*w + w/(exp(w/T) - 1))/T
    samples: {w: [0.5, 2.0], T: [0.5, 2.0], g: [1.0, 3.0]}
    tolerance: 1e-4
    shown: ['\frac{1}{Z_1}\left(\frac{\partial Z_1}{\partial V}\right)_T = \frac{\gamma}{V}\frac{\langle E\rangle}{kT}']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: li-ratio
    where: 'slide 9: √(7/6)'
    inputs: {}
    formula: sqrt(7/6)
    expected: '1.08'
    tolerance: 0.005
    shown: ['= \sqrt{\frac76} = 1.08']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: li-spacing
    kind: fact
    where: 'slide 9: observed lattice spacing difference of lithium-6 and lithium-7 at T = 0'
    value: '0.07%'
    shown: ['about 0.07% larger than lithium-7 crystals']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: ideal-gas-fluct
    kind: identity
    where: 'kT κ_T/V with κ_T = 1/P and PV = N kT equals 1/N'
    formula: T*(1/(N*T/V))/V
    equals: 1/N
    samples: {T: [1.0, 3.0], N: [10.0, 1000.0], V: [1.0, 5.0]}
    tolerance: 1e-12
    shown: ['For an ideal gas $\kappa_T = 1/P$ and this is $1/\langle N\rangle$, very small']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-a-N
    where: 'example (a): 101 325 × 1e-18/(1.380649e-23 × 273.15)'
    inputs: {}
    formula: 101325*1e-18/(1.380649e-23*273.15)
    expected: '2.69e7'
    tolerance: 0.005e7
    shown: ['\approx 2.69 \times 10^7$']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-a-rms
    where: 'example (a): 1/√N'
    inputs: {}
    formula: 1/sqrt(101325*1e-18/(1.380649e-23*273.15))
    expected: '1.93e-4'
    tolerance: 0.005e-4
    shown: ['$1/\sqrt N \approx 1.93 \times 10^{-4}$']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-b-N
    where: 'example (b): N in 1 cm³'
    inputs: {}
    formula: 101325*1e-6/(1.380649e-23*273.15)
    expected: '2.69e19'
    tolerance: 0.005e19
    shown: ['$N \approx 2.69 \times 10^{19}$']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-b-rms
    where: 'example (b): 1/√N for 1 cm³'
    inputs: {}
    formula: 1/sqrt(101325*1e-6/(1.380649e-23*273.15))
    expected: '1.93e-10'
    tolerance: 0.005e-10
    shown: ['$1/\sqrt N \approx 1.93 \times 10^{-10}$']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-c
    where: 'example (c): (1e-2/1.93e-4)²'
    inputs: {}
    formula: (1e-2/1.93e-4)**2
    expected: '2.7e3'
    tolerance: 0.05e3
    shown: ['\approx 2.7 \times 10^3$ times']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own
