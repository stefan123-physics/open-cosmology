# Calculations on content/year-3/8.044/functions-of-a-random-variable.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 3 and probability notes, Chapter 3, with the page's own example.

page: content/year-3/8.044/functions-of-a-random-variable.mdx
calcs:
  - id: intensity-norm
    where: '∫ e^{−I/2}/√(2πI) dI = 1 (a = σ = 1)'
    inputs: {}
    formula: 'integrate("exp(-u**2/2)*2/sqrt(2*pi)", "u", 0, 40)'
    expected: '1'
    tolerance: 1e-6
    shown: ['\exp\left(-\frac{I}{2a\sigma^2}\right), \quad I > 0']
    source: {cite: reading1, at: 'p. 38'}
    origin: mit

  - id: oscillator-norm
    where: '∫ 1/(π√(1 − x²)) dx over (−1, 1) = 1'
    inputs: {}
    formula: 2/pi*asin(1)
    expected: '1'
    tolerance: 1e-12
    shown: ['p_x(\eta) = \frac{1}{\pi\sqrt{x_0^2 - \eta^2}}']
    source: {cite: reading1, at: 'p. 41'}
    origin: mit

  - id: two-zeta-3
    where: '2 ζ(3) = 2 × 1.2020569'
    inputs: {}
    formula: 2*1.2020569
    expected: '2.404'
    tolerance: 0.0005
    shown: ['(the slide writes the constant as $2\zeta(3) = 2.404$']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: blackbody-norm
    where: '∫ x²/(eˣ − 1) dx = 2ζ(3) ≈ 2.404'
    inputs: {}
    formula: 'integrate("x**2/(exp(x) - 1)", "x", 1e-9, 80)'
    expected: '2.404'
    tolerance: 0.001
    shown: ['$p(\nu) = \frac{1}{2.404}\frac{1}{\nu_0}']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: max-variance
    where: 'max of two uniforms: 1/2 − (2/3)²'
    inputs: {}
    formula: 1/2 - (2/3)**2
    expected: '0.05556'
    tolerance: 0.00001
    shown: ['$\text{Var}(z) = \frac1{18}$']
    source: {cite: mit, at: 'slide 12'}
    origin: mit

  - id: max-sd
    where: 'max of two uniforms: √(1/18)'
    inputs: {}
    formula: sqrt(1/18)
    expected: '0.24'
    tolerance: 0.005
    shown: ['standard deviation is about 0.24']
    source: {cite: mit, at: 'slide 12'}
    origin: mit

  - id: vz-norm
    where: 'desorbing atom: ∫ (v/σ²) e^{−v²/2σ²} dv = 1 (σ = 1.3)'
    inputs: {}
    formula: 'integrate("(v/1.69)*exp(-v**2/(2*1.69))", "v", 0, 40)'
    expected: '1'
    tolerance: 1e-6
    shown: ['p(v_z) = \frac{v_z}{\sigma^2}\exp']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: v-norm
    where: 'desorbing atom: ∫ v³ e^{−v²/2σ²}/(2σ⁴) dv = 1 (σ = 1.3)'
    inputs: {}
    formula: 'integrate("v**3*exp(-v**2/(2*1.69))/(2*1.69**2)", "v", 0, 40)'
    expected: '1'
    tolerance: 1e-6
    shown: ['$p(v) = \frac{1}{2\sigma^4}v^3e^{-v^2/(2\sigma^2)}$']
    source: {cite: mit, at: 'slide 13'}
    origin: mit

  - id: ex-kinetic-mean
    where: 'example (a): ∫ K e^{−K}/√(πK) dK = 1/2 (kT = 1)'
    inputs: {}
    formula: 'integrate("2*u**2*exp(-u**2)/sqrt(pi)", "u", 0, 40)'
    expected: '0.5'
    tolerance: 1e-6
    shown: ['= \frac12kT$, one half']
    source: {cite: reading1, at: 'p. 36'}
    origin: page-own

  - id: ex-cosine
    where: 'example (b): 1 − (2/π) arcsin 0.9'
    inputs: {}
    formula: 1 - 2/pi*asin(0.9)
    expected: '0.287'
    tolerance: 0.0005
    shown: ['= 0.287$: more than a quarter']
    source: {cite: reading1, at: 'p. 41'}
    origin: page-own

  - id: ex-arcsin
    where: 'example (b): (2/π) arcsin 0.9'
    inputs: {}
    formula: 2/pi*asin(0.9)
    expected: '0.713'
    tolerance: 0.0005
    shown: ['\approx 1 - 0.713']
    source: {cite: reading1, at: 'p. 40'}
    origin: page-own

  - id: ex-min-mean
    where: 'example (c): ∫ 2η(1 − η) dη'
    inputs: {}
    formula: 'integrate("2*u*(1 - u)", "u", 0, 1)'
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['= \frac13$; with the larger']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own
