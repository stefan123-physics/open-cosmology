# Calculations on content/year-3/8.044/microcanonical-ensemble.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 7 and notes on the microcanonical ensemble, with the page's own example.

page: content/year-3/8.044/microcanonical-ensemble.mdx
calcs:
  - id: shell-fraction
    where: 'plot: 1 − (1 − 0.02)^300'
    inputs: {}
    formula: 1 - (1 - 0.02)**300
    expected: '0.998'
    tolerance: 0.001
    shown: ['within a few per cent of the surface']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: sphere-3d
    where: 'example (a): π^1.5/Γ(2.5)'
    inputs: {}
    formula: pi**1.5/1.32934
    expected: '4.189'
    tolerance: 0.001
    shown: ['\approx 4.189R^3 = \frac43\pi R^3$']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: pi-1-5
    where: 'example (a): π^1.5'
    inputs: {}
    formula: pi**1.5
    expected: '5.568'
    tolerance: 0.001
    shown: ['\approx 5.568R^3/1.329']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: four-thirds-pi
    where: 'example (a): 4π/3'
    inputs: {}
    formula: 4*pi/3
    expected: '4.189'
    tolerance: 0.001
    shown: ['= \frac43\pi R^3$.']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: stirling
    where: 'example (b): 100 ln 100 − 100'
    inputs: {}
    formula: 100*log(100) - 100
    expected: '360.52'
    tolerance: 0.005
    shown: ['$100\ln 100 - 100 \approx 360.52$']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: ln100fact
    where: 'example (b): ln 100! from the full Stirling series (error below 1e-7)'
    inputs: {}
    formula: 100*log(100) - 100 + 0.5*log(2*pi*100) + 1/1200
    expected: '363.74'
    tolerance: 0.005
    shown: ['(exactly $363.74$)']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: ex-eps
    where: 'example (c): 3740/(3 × 6.022e23) J'
    inputs: {}
    formula: 3740/(3*6.022e23)
    expected: '2.07e-21'
    tolerance: 0.005e-21
    shown: ['\approx 2.07 \times 10^{-21}$ J']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-p2
    where: 'example (c): 2 × 6.646e-27 × 2.070e-21'
    inputs: {}
    formula: 2*6.646e-27*3740/(3*6.022e23)
    expected: '2.75e-47'
    tolerance: 0.005e-47
    shown: ['\approx 2.75 \times 10^{-47}$']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-prms
    where: 'example (c): √2.751e-47 kg m/s'
    inputs: {}
    formula: sqrt(2*6.646e-27*3740/(3*6.022e23))
    expected: '5.2e-24'
    tolerance: 0.05e-24
    shown: ['\approx 5.2 \times 10^{-24}$ kg m/s']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-vrms
    where: 'example (c): p_rms/m in m/s'
    inputs: {}
    formula: sqrt(2*6.646e-27*3740/(3*6.022e23))/6.646e-27
    expected: '790'
    tolerance: 2
    shown: ['\approx 790$ m/s']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own
