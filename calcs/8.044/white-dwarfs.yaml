# Calculations on content/year-3/8.044/white-dwarfs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 20, with the page's own example.

page: content/year-3/8.044/white-dwarfs.mdx
calcs:
  - id: radius-condition
    kind: identity
    where: 'minimum of K/R² − g/R lies at R0 = 2K/g, with K = (3/5)(9π/2)^(2/3) ħ² M^(5/3)/(me mα^(5/3)), g = (3/5)GM²; so M R0³ = 8(9π/2)² ħ⁶/(G³ me³ mα⁵)'
    formula: M*(2*(0.6*(9*pi/2)**(2/3)*hb**2*M**(5/3)/(me*ma**(5/3)))/(0.6*G*M**2))**3
    equals: 8*(9*pi/2)**2*hb**6/(G**3*me**3*ma**5)
    samples: {M: [1.0, 5.0], hb: [0.5, 2.0], me: [0.5, 2.0], ma: [1.0, 3.0], G: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['MR_0^3 = 8\left(\frac{9\pi}{2}\right)^2\frac{\hbar^6}{G^3m_e^3m_\alpha^5}']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: MR3-value
    where: 'slide 7: 8(9π/2)² ħ⁶/(G³ me³ mα⁵) in kg m³ (slide: 0.74e51)'
    inputs: {}
    formula: 8*(9*pi/2)**2*1.054572e-34**6/(6.674e-11**3*9.109e-31**3*6.6447e-27**5)
    expected: '0.74e51'
    tolerance: 0.02e51
    shown: ['\approx 0.74 \times 10^{51}\ \text{kg m}^3']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: sirius-R
    where: 'slide 8: (0.756e51/2.1e30)^(1/3) m'
    inputs: {}
    formula: (8*(9*pi/2)**2*1.054572e-34**6/(6.674e-11**3*9.109e-31**3*6.6447e-27**5)/2.1e30)**(1/3)
    expected: '7.1e6'
    tolerance: 0.05e6
    shown: ['the model gives $R_0 \approx 7.1 \times 10^6$ m']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: sirius-observed
    kind: fact
    where: 'slide 8: observed radius of Sirius B'
    value: '5.6e6 m'
    shown: ['against an observed $5.6 \times 10^6$ m']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: sirius-eF-K
    where: 'slide 9: 4.7e-7 erg / k in K'
    inputs: {}
    formula: 4.7e-7/1.380649e-16
    expected: '3.4e9'
    tolerance: 0.05e9
    shown: ['a Fermi temperature of about $3.4 \times 10^9$ K, show']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: mec2
    where: 'slide 9: m_e c² in erg'
    inputs: {}
    formula: 9.109e-28*2.998e10**2
    expected: '8.2e-7'
    tolerance: 0.05e-7
    shown: ['$m_ec^2 = 8.2 \times 10^{-7}$ erg']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: rel-energy
    where: 'slide 12: E/N = (1/4)/(1/3) for D ∝ ε²'
    inputs: {}
    formula: integrate('x**3', 'x', 0, 1)/integrate('x**2', 'x', 0, 1)
    expected: '0.75'
    tolerance: 1e-6
    shown: ['$E = \frac14a\epsilon_F^4 = \frac34N\epsilon_F$']
    source: {cite: mit, at: 'slide 12'}
    origin: mit

  - id: rel-EK
    kind: identity
    where: '(3/4) N_e cħ (3π² N_e/V)^(1/3) with N_e = 2M/mα, V = (4/3)πR³ equals (3/2)(9π/2)^(1/3) cħ M^(4/3)/(mα^(4/3) R)'
    formula: 0.75*(2*M/ma)*ch*(3*pi**2*(2*M/ma)/(4/3*pi*R**3))**(1/3)
    equals: 1.5*(9*pi/2)**(1/3)*ch*M**(4/3)/(ma**(4/3)*R)
    samples: {M: [1.0, 5.0], ma: [0.5, 2.0], ch: [0.5, 2.0], R: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['E_K = \frac34N_e\epsilon_F = \frac32\left(\frac{9\pi}{2}\right)^{1/3}']
    source: {cite: mit, at: 'slide 14'}
    origin: mit

  - id: chandrasekhar
    where: 'slide 17: 0.20 × 0.25 × (hc/G mp²)^(3/2) mp in solar masses (slide: 1.4)'
    inputs: {}
    formula: 0.20*0.25*(6.62607e-34*2.998e8/(6.674e-11*1.6726e-27**2))**1.5*1.6726e-27/1.989e30
    expected: '1.4'
    tolerance: 0.1
    shown: ['For $Z/A = 0.5$ (helium, carbon or oxygen) it is about $1.4M_\odot$']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: ex-a
    where: 'example (a): (0.74e51/1.989e30)^(1/3) m'
    inputs: {}
    formula: (0.74e51/1.989e30)**(1/3)
    expected: '7.19e6'
    tolerance: 0.005e6
    shown: ['\approx 7.19 \times 10^6$ m']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: ex-b
    where: 'example (b): M/((4/3)π R0³) kg/m³'
    inputs: {}
    formula: 1.989e30/(4/3*pi*0.74e51/1.989e30)
    expected: '1.28e9'
    tolerance: 0.005e9
    shown: ['\approx 1.28 \times 10^9$ kg/m³']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-c
    where: 'example (c): 2ρ/mα m⁻³'
    inputs: {}
    formula: 2*1.989e30/(4/3*pi*0.74e51/1.989e30)/6.645e-27
    expected: '3.84e35'
    tolerance: 0.005e35
    shown: ['\approx 3.84 \times 10^{35}$ m⁻³']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-d
    where: 'example (d): 2^(1/3)'
    inputs: {}
    formula: 2**(1/3)
    expected: '1.26'
    tolerance: 0.005
    shown: ['$2^{1/3} \approx 1.26$']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own
