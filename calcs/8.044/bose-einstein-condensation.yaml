# Calculations on content/year-3/8.044/bose-einstein-condensation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 22, with the page's own example.

page: content/year-3/8.044/bose-einstein-condensation.mdx
calcs:
  - id: bose-integral
    where: 'slide 7: ∫ x^(1/2)/(eˣ − 1) dx = (√π/2) ζ(3/2) = 2.3152'
    inputs: {}
    formula: integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 60)
    expected: '2.3152'
    tolerance: 0.0005
    shown: ['using $\int_0^\infty x^{1/2}/(e^x - 1)\,dx = \frac{\sqrt\pi}{2}\zeta(3/2)$']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: zeta-3-2
    where: 'slide 8: ζ(3/2) = 2.3152/(√π/2)'
    inputs: {}
    formula: integrate('sqrt(x)/(exp(x) - 1)', 'x', 1e-12, 60)/(sqrt(pi)/2)
    expected: '2.612'
    tolerance: 0.0005
    shown: ['$\zeta(3/2) = 2.612\ldots$']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: condensate-half
    where: 'quiz 3: 1 − (1/2)^(3/2)'
    inputs: {}
    formula: 1 - 0.5**1.5
    expected: '0.65'
    tolerance: 0.005
    shown: ['$N_0/N = 1 - (T/T_c)^{3/2} = 1 - 0.354 \\approx 0.65$']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-a-pref
    where: 'example (a): h²/(2π m k) K m²'
    inputs: {}
    formula: 6.62607e-34**2/(2*pi*1.443e-25*1.380649e-23)
    expected: '3.51e-20'
    tolerance: 0.005e-20
    shown: ['$h^2/(2\pi mk) \approx 3.51 \times 10^{-20}$ K m²']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-a-dens
    where: 'example (a): (1e20/2.612)^(2/3) m⁻²'
    inputs: {}
    formula: (1e20/2.612)**(2/3)
    expected: '1.14e13'
    tolerance: 0.005e13
    shown: ['$(n/2.612)^{2/3} \approx 1.14 \times 10^{13}$ m⁻²']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-a
    where: 'example (a): T_c for rubidium-87 at 1e20 m⁻³'
    inputs: {}
    formula: 6.62607e-34**2/(2*pi*1.443e-25*1.380649e-23)*(1e20/2.612)**(2/3)
    expected: '3.98e-7'
    tolerance: 0.005e-7
    shown: ['$T_c \approx 3.98 \times 10^{-7}$ K']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-b
    where: 'example (b): 1 − (100/398)^(3/2)'
    inputs: {}
    formula: 1 - (100/398)**1.5
    expected: '0.87'
    tolerance: 0.005
    shown: ['$1 - (100/398)^{3/2} \approx 0.87$']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-c-lam
    where: 'example (c): h/√(2π m k T_c) m'
    inputs: {}
    formula: 6.62607e-34/sqrt(2*pi*1.443e-25*1.380649e-23*6.62607e-34**2/(2*pi*1.443e-25*1.380649e-23)*(1e20/2.612)**(2/3))
    expected: '2.97e-7'
    tolerance: 0.005e-7
    shown: ['$\lambda(T_c) \approx 2.97 \times 10^{-7}$ m']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-c-spacing
    where: 'example (c): (1e20)^(−1/3) m'
    inputs: {}
    formula: 1e20**(-1/3)
    expected: '2.15e-7'
    tolerance: 0.005e-7
    shown: ['$n^{-1/3} \approx 2.15 \times 10^{-7}$ m']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-d-n
    where: 'example (d): 145/6.6465e-27 m⁻³'
    inputs: {}
    formula: 145/6.6465e-27
    expected: '2.18e28'
    tolerance: 0.005e28
    shown: ['$n = 145/6.6465 \times 10^{-27} \approx 2.18 \times 10^{28}$ m⁻³']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-d
    where: 'example (d): ideal-gas T_c for liquid helium-4 density'
    inputs: {}
    formula: 6.62607e-34**2/(2*pi*6.6465e-27*1.380649e-23)*(145/6.6465e-27/2.612)**(2/3)
    expected: '3.1'
    tolerance: 0.05
    shown: ['gives $T_c \approx 3.1$ K']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: he-lambda
    kind: fact
    where: 'example (d): superfluid transition of liquid helium-4 (standard value)'
    value: '2.17 K'
    shown: ['the 2.17 K at which liquid helium-4 actually becomes superfluid']
    source: {ref: 'standard measured lambda-point temperature of helium-4 at saturated vapour pressure'}
    origin: later-data
