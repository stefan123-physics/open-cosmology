# Calculations on content/year-3/8.044/thermodynamic-variables.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 5 and notes on thermodynamic systems, with the page's own example.

page: content/year-3/8.044/thermodynamic-variables.mdx
calcs:
  - id: isothermal-work
    kind: identity
    where: '−∫ NkT/V dV from V1 to V2 = NkT ln(V1/V2) (numerical, NkT = 1)'
    formula: -(log(b) - log(a))
    equals: log(a/b)
    samples: {a: [1.0, 3.0], b: [0.5, 1.2]}
    tolerance: 1e-12
    shown: ['= NkT\ln\frac{V_1}{V_2} = P_1V_1\ln\frac{V_1}{V_2}']
    source: {cite: mit, at: 'slide 20'}
    origin: mit

  - id: triple-product
    kind: identity
    where: '(−NkT/V²)(Nk/P)(V/Nk) = −1 with P = NkT/V'
    formula: (-(n*T)/V**2)*(n/((n*T)/V))*(V/n)
    equals: -1 + 0*V
    samples: {n: [1.0, 2.5], T: [300.0, 10.0], V: [0.02, 1.5]}
    tolerance: 1e-12
    shown: ['= -\frac{NkT}{PV} = -1$']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: plot-isotherm-work
    where: 'plot: ∫ 1/V dV from 0.5 to 1 = ln 2 (in P1V1)'
    inputs: {}
    formula: 'integrate("1/V", "V", 0.5, 1)'
    expected: '0.693'
    tolerance: 0.0005
    shown: ['P₁V₁ln 2 along the isotherm']
    source: {cite: mit, at: 'slide 20'}
    origin: page-own

  - id: ex-P1V1
    where: 'example (a): 1.013e5 Pa × 1.00e-3 m³'
    inputs: {}
    formula: 1.013e5*1.00e-3
    expected: '101.3'
    tolerance: 0.05
    shown: ['$P_1V_1 = 101.3$ J']
    source: {cite: mit, at: 'slide 20'}
    origin: page-own

  - id: ex-isothermal
    where: 'example (a): 101.3 ln 2 J'
    inputs: {}
    formula: 101.3*log(2)
    expected: '70.2'
    tolerance: 0.05
    shown: ['\ln 2 \approx 70.2$ J']
    source: {cite: mit, at: 'slide 20'}
    origin: page-own

  - id: ex-low
    where: 'example (a): 1 atm (1.01325e5 Pa) × 0.5e-3 m³'
    inputs: {}
    formula: 1.01325e5*0.5e-3
    expected: '50.7'
    tolerance: 0.05
    shown: ['\approx 50.7$ J']
    source: {cite: mit, at: 'slide 20'}
    origin: page-own

  - id: ex-high
    where: 'example (a): 2 × 1.013e5 × 0.5e-3 J'
    inputs: {}
    formula: 2*1.01325e5*0.5e-3
    expected: '101.3'
    tolerance: 0.05
    shown: ['first, $W \approx 101.3$ J']
    source: {cite: mit, at: 'slide 20'}
    origin: page-own
