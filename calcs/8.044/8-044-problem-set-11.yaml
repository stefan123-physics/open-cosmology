  # ---- Problem 5 (MIT's round numbers: hbar = 1e-27 erg s, k_B = 1e-16 erg/K, m* = 1e-23 g, W/k_B = 0.5 K, n4 = 2e22 cm^-3)

  - id: p5-n
    kind: identity
    answer: p5-n
    where: 'Problem 5(a), answer box and formula "Largest density of helium-3 dissolved in helium-4 at T = 0": the number of states per volume, two for each wavevector, inside the sphere of radius √(2m*W)/ħ'
    formula: >-
      (2*m*W/hbar**2)**(3/2)/(3*pi**2)
    equals: >-
      2/(2*pi)**3*4/3*pi*(sqrt(2*m*W)/hbar)**3
    samples:
      m: [0.5, 2, 1, 1.3, 0.8]
      W: [0.6, 1.9, 1, 0.7, 1.4]
      hbar: [0.5, 2, 1, 1.4, 0.7]
    tolerance: 1e-12
    shown: ['n_3 = \frac{1}{3\pi^2}\left(\frac{2m^*W}{\hbar^2}\right)^{3/2}"']
    source: {cite: reading1, at: 'Problem 5(a), p. 8'}
    origin: mit

  - id: p5-n-fermi
    kind: identity
    where: 'Problem 5(a), check: at that density the Fermi energy of the dissolved atoms is W (numerical root)'
    formula: >-
      (2*m*W/hbar**2)**(3/2)/(3*pi**2)
    equals: >-
      solve('hbar**2*(3*pi**2*u)**(2/3)/(2*m) - W', 'u', 0, 1000)
    samples:
      m: [0.5, 2, 1, 1.3, 0.8]
      W: [0.6, 1.9, 1, 0.7, 1.4]
      hbar: [0.5, 2, 1, 1.4, 0.7]
    tolerance: 1e-7
    shown: ['W = \frac{\hbar^2}{2m^*}\left(3\pi^2n_3\right)^{2/3}']
    source: {cite: reading1, at: 'Problem 5(a), p. 8'}
    origin: mit

