  # ---- Problem 6

  - id: p6-solid
    kind: identity
    answer: p6-solid
    where: 'Problem 6(b), answer box and formula "Entropy of the solid helium-3 in region II": N times the entropy −k_B Σ p ln p of one spin with two equally likely states'
    formula: >-
      N*kB*log(2)
    equals: >-
      -N*kB*(0.5*log(0.5) + 0.5*log(0.5))
    samples:
      N: [1, 10, 4, 3, 7]
      kB: [0.5, 2, 1, 1.3, 0.8]
    tolerance: 1e-12
    shown: ['S = k_B\ln 2^N = Nk_B\ln 2']
    source: {cite: reading1, at: 'Problem 6(b), p. 9'}
    origin: mit

  - id: p6-slope
    kind: identity
    answer: p6-slope
    where: 'Problem 6(d), answer box and formula "Slope of the melting curve of helium-3 in region II": (entropy of the liquid, zero, minus that of the solid) over the volume difference N v0'
    formula: >-
      -kB*log(2)/v0
    equals: >-
      (0 - (-N*kB*(0.5*log(0.5) + 0.5*log(0.5))))/(N*v0)
    samples:
      N: [2, 10, 4, 3, 7]
      kB: [0.5, 2, 1, 1.3, 0.8]
      v0: [0.7, 1.9, 1, 0.6, 1.5]
    tolerance: 1e-12
    shown: ['= -\frac{k_B\ln 2}{v_0}']
    source: {cite: reading1, at: 'Problem 6(d), p. 9'}
    origin: mit

  - id: p6-figure
    kind: fact
