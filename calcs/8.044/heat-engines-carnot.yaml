# Calculations on content/year-3/8.044/heat-engines-carnot.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 11, with the page's own example.

page: content/year-3/8.044/heat-engines-carnot.mdx
calcs:
  - id: rod-dEdL
    kind: identity
    where: 'T(∂S/∂L)_T + F = −bT(L − L0) + (a + bT)(L − L0) equals a(L − L0)'
    formula: -b*T*(L - L0) + (a + b*T)*(L - L0)
    equals: a*(L - L0)
    samples: {a: [0.5, 3.0], b: [0.01, 0.1], T: [200.0, 400.0], L: [1.0, 2.0], L0: [0.5, 1.0]}
    tolerance: 1e-9
    shown: ['= -bT(L - L_0) + (a + bT)(L - L_0) = a(L - L_0)$']
    source: {cite: mit, at: 'slide 2'}
    origin: mit

  - id: rod-energy
    kind: identity
    where: 'dE/dT of (A/4)T⁴ + (a/2)(L − L0)² equals AT³ (finite difference)'
    formula: ((A/4*(T + 1e-4)**4 + a/2*(L - L0)**2) - (A/4*(T - 1e-4)**4 + a/2*(L - L0)**2))/2e-4
    equals: A*T**3
    samples: {A: [1e-6, 1e-5], a: [0.5, 3.0], T: [100.0, 300.0], L: [1.0, 2.0], L0: [0.5, 1.0]}
    tolerance: 1e-6
    shown: ['E(T, L) = \frac A4T^4 + \frac a2(L - L_0)^2 + c_1']
    source: {cite: mit, at: 'slide 3'}
    origin: mit

  - id: rod-entropy
    kind: identity
    where: 'dS/dL of (A/3)T³ − (b/2)(L − L0)² equals −b(L − L0) (finite difference)'
    formula: ((A/3*T**3 - b/2*(L + 1e-6 - L0)**2) - (A/3*T**3 - b/2*(L - 1e-6 - L0)**2))/2e-6
    equals: -b*(L - L0)
    samples: {A: [1e-6, 1e-5], b: [0.01, 0.1], T: [100.0, 300.0], L: [1.0, 2.0], L0: [0.5, 1.0]}
    tolerance: 1e-6
    shown: ['S(T, L) = \frac A3T^3 - \frac b2(L - L_0)^2 + c_2']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: chain-alpha
    kind: identity
    where: '(1/L)(∂L/∂T)_F for L = N l tanh(lF/kT) at small F tends to −1/T (k = 1, F = 1e-4)'
    formula: (N*l*tanh(l*1e-4/(T + 1e-3)) - N*l*tanh(l*1e-4/(T - 1e-3)))/2e-3/(N*l*tanh(l*1e-4/T))
    equals: -1/T
    samples: {N: [10.0, 100.0], l: [0.5, 2.0], T: [1.0, 5.0]}
    tolerance: 1e-5
    shown: ['for small extensions its expansion coefficient at fixed tension is $-1/T$']
    source: {cite: mit, at: 'slide 5'}
    origin: mit

  - id: carnot-volume-ratio
    where: 'plot: hot isotherm expands V by 2^(3/2) so that Nk ln(V2/V1) = (3/2)Nk ln 2'
    inputs: {}
    formula: 2**1.5
    expected: '2.8284'
    tolerance: 0.0001
    shown: ['expands the volume by 2^(3/2)']
    source: {cite: mit, at: 'slide 11b'}
    origin: mit

  - id: carnot-adiabat-end
    where: 'plot: adiabat from V = 2^(3/2) at T = 1.5 to T = 1 ends at 2^(3/2) × 1.5^(3/2)'
    inputs: {}
    formula: 2**1.5*1.5**1.5
    expected: '5.1962'
    tolerance: 0.0001
    shown: ['x <= 5.1962 ? 3/x^(5/3)']
    source: {cite: mit, at: 'slide 11b'}
    origin: page-own

  - id: carnot-adiabat-start
    where: 'plot: adiabat from V = 1 at T = 1.5 to T = 1 ends at 1.5^(3/2)'
    inputs: {}
    formula: 1.5**1.5
    expected: '1.8371'
    tolerance: 0.0001
    shown: ['x <= 1.8371 ? 1.5/x^(5/3)']
    source: {cite: mit, at: 'slide 11b'}
    origin: page-own

  - id: quiz-eta
    where: 'quiz 3: 1 − 300/600'
    inputs: {}
    formula: 1 - 300/600
    expected: '0.5'
    tolerance: 1e-9
    shown: ['1 - 300/600 = 0.5']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-a
    where: 'example (a): 1 − 300/800'
    inputs: {}
    formula: 1 - 300/800
    expected: '0.625'
    tolerance: 1e-9
    shown: ['$1 - 300/800 = 0.625$']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-b-in
    where: 'example (b): 1.0/0.40 GW'
    inputs: {}
    formula: 1.0/0.40
    expected: '2.5'
    tolerance: 1e-9
    shown: ['$|Q_H| = 1.0/0.40 = 2.5$ GW']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: ex-b-out
    where: 'example (b): 2.5 − 1.0 GW'
    inputs: {}
    formula: 2.5 - 1.0
    expected: '1.5'
    tolerance: 1e-9
    shown: ['$|Q_C| = 2.5 - 1.0 = 1.5$ GW']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: ex-c-hot
    where: 'example (c): 2.5e9/800 W/K'
    inputs: {}
    formula: 2.5e9/800
    expected: '3.125e6'
    tolerance: 1
    shown: ['2.5 \times 10^9/800 = 3.125 \times 10^6$ W/K']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-c-cold
    where: 'example (c): 1.5e9/300 W/K'
    inputs: {}
    formula: 1.5e9/300
    expected: '5.0e6'
    tolerance: 1
    shown: ['1.5 \times 10^9/300 = 5.0 \times 10^6$ W/K']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-c
    where: 'example (c): net entropy growth W/K'
    inputs: {}
    formula: 1.5e9/300 - 2.5e9/800
    expected: '1.875e6'
    tolerance: 1
    shown: ['about $1.875 \times 10^6$ W/K']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-d-dS
    where: 'example (d): 1.5 × 8.314 × ln 2 J/K'
    inputs: {}
    formula: 1.5*8.314*log(2)
    expected: '8.644'
    tolerance: 0.0005
    shown: ['\approx 8.644$ J/K']
    source: {cite: mit, at: 'slide 11b'}
    origin: page-own

  - id: ex-d-QH
    where: 'example (d): 450 × ΔS J'
    inputs: {}
    formula: 450*1.5*8.314*log(2)
    expected: '3890'
    tolerance: 0.5
    shown: ['\approx 3890$ J']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-d-W
    where: 'example (d): 150 × ΔS J'
    inputs: {}
    formula: 150*1.5*8.314*log(2)
    expected: '1297'
    tolerance: 0.5
    shown: ['\approx 1297$ J']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own
