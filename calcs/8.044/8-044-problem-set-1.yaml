# Calculations on content/year-3/8.044/8-044-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions for this set and the page follows them; every answer is checked here by a route that is
# independent of the algebra on the page. Problem 1: numerical integrals, with the delta function as a narrow rectangle.
# Problem 2: numerical integrals (x = b tan(theta) for the whole line) and a numerical root. Problem 3: numerical
# derivatives of the motion and the share of a period spent per unit length. Problem 4: the equations solved and the
# moments recomputed. Problem 5: the density built from the real and imaginary parts of MIT's wavefunction, and
# numerical integrals over it. Problem 6: the sums written out term by term.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.044/8-044-problem-set-1.mdx
calcs:
  # ---- Problem 1: p(x) = (0.8/l) e^(-x/l) + 0.2 delta(x - d). In these checks the delta function is a narrow

  # rectangle of width w and height 0.2/w centred on d (the lesson's picture of a delta function), and every

  # average is a numerical integral over the exponential part plus one over the rectangle.

  - id: p1-jump
    kind: value
    where: 'Problem 1(a), choice box: the area of the narrow rectangle that stands for the delta function, which is the height of the jump of P'
    inputs: {w: 0.001, d: 1.5}
    formula: |-
      integrate('0.2/w', 'u', d - w/2, d + w/2)
    expected: '0.2'
    tolerance: 1e-9
    shown: ['id="p1-jump"']
    source: {cite: reading1, at: 'Problem 1(a), p. 1'}
    origin: mit

  - id: p1-cum
    kind: identity
    answer: p1-cum
    where: 'Problem 1(a), answer box (our addition): P(x) beyond the grain boundary, as the numerical area under the density up to x'
    formula: |-
      1 - 0.8*exp(-x/l)
    equals: |-
      integrate('0.8/l*exp(-u/l)', 'u', 0, x) + integrate('0.2/w', 'u', d - w/2, d + w/2)
    samples:
      x: [3.5, 1.0, 2.5, 4.0, 1.3]
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
      w: [0.001, 0.001, 0.001, 0.001, 0.001]
    tolerance: 1e-9
    shown: ['id="p1-cum"', '<Formula label="Cumulative function of the depth"']
    source: {cite: reading1, at: 'Problem 1(a), p. 1 (the formula is our addition)'}
    origin: page-own

  - id: p1-cum-below
    kind: value
    where: 'Problem 1(a), graph: P just below the jump for d = 1.5 l'
    formula: |-
      0.8*(1 - exp(-1.5))
    expected: '0.6215'
    shown: ['y: 0.6215', 'here from 0.6215 to 0.8215']
    source: {cite: reading1, at: 'Problem 1(a), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-cum-above
    kind: value
    where: 'Problem 1(a), graph: P just above the jump for d = 1.5 l'
    formula: |-
      1 - 0.8*exp(-1.5)
    expected: '0.8215'
    shown: ['y: 0.8215']
    source: {cite: reading1, at: 'Problem 1(a), p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-mean
    kind: identity
    answer: p1-mean
    where: 'Problem 1(b), answer box: the mean depth by numerical integration'
    formula: |-
      0.8*l + 0.2*d
    equals: |-
      integrate('u*0.8/l*exp(-u/l)', 'u', 0, 60*l) + integrate('u*0.2/w', 'u', d - w/2, d + w/2)
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
      w: [0.001, 0.001, 0.001, 0.001, 0.001]
    tolerance: 1e-8
    shown: ['id="p1-mean"', '<Formula label="Mean depth"']
    source: {cite: reading1, at: 'Problem 1(b), p. 1'}
    origin: mit

  - id: p1-meansq
    kind: identity
    where: 'Problem 1(c): the mean square of the depth by numerical integration'
    formula: |-
      1.6*l**2 + 0.2*d**2
    equals: |-
      integrate('u**2*0.8/l*exp(-u/l)', 'u', 0, 60*l) + integrate('u**2*0.2/w', 'u', d - w/2, d + w/2)
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
      w: [0.001, 0.001, 0.001, 0.001, 0.001]
    tolerance: 1e-6
    shown: ['<Formula label="Mean square of the depth"']
    source: {cite: reading1, at: 'Problem 1(c), p. 1'}
    origin: mit

  - id: p1-var
    kind: identity
    answer: p1-var
    where: 'Problem 1(c), answer box: the variance as the numerical average of (x - mean)^2, with the mean itself found numerically'
    formula: |-
      0.96*l**2 - 0.32*l*d + 0.16*d**2
    equals: |-
      integrate('(u - (integrate("v*0.8/l*exp(-v/l)", "v", 0, 60*l) + 0.2*d))**2*0.8/l*exp(-u/l)', 'u', 0, 60*l) + integrate('(u - (integrate("v*0.8/l*exp(-v/l)", "v", 0, 60*l) + 0.2*d))**2*0.2/w', 'u', d - w/2, d + w/2)
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
      w: [0.001, 0.001, 0.001, 0.001, 0.001]
    tolerance: 1e-6
    shown: ['id="p1-var"', '<Formula label="Variance of the depth"']
    source: {cite: reading1, at: 'Problem 1(c), p. 1 (the sign of the last term corrected)'}
    origin: page-own

  - id: p1-var-square
    kind: identity
    where: 'Problem 1(c): the square of the mean, written out'
    formula: |-
      0.64*l**2 + 0.32*l*d + 0.04*d**2
    equals: |-
      (0.8*l + 0.2*d)**2
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
    tolerance: 1e-12
    shown: ['0.64\,l^2 + 0.32\,l\,d + 0.04\,d^2']
    source: {cite: reading1, at: 'Problem 1(c), p. 1'}
    origin: mit

  - id: p1-var-slip
    kind: fact
    where: 'Problem 1(c): MIT''s solutions print the last term of the variance with a minus sign; the page corrects it'
    shown: ['prints the final term as $-0.16\,d^2$']
    source: {cite: reading1, at: 'Problem 1(c), p. 1, last line'}
    origin: slip

  - id: p1-var-lastterm
    kind: value
    where: 'Problem 1(c): the coefficient of d^2, from the line above the slip'
    formula: |-
      0.2 - 0.04
    expected: '0.16'
    tolerance: 1e-12
    shown: ['gives $0.2\,d^2 - 0.04\,d^2 = +0.16\,d^2$']
    source: {cite: reading1, at: 'Problem 1(c), p. 1'}
    origin: page-own

  - id: p1-var-groups
    kind: identity
    where: 'Problem 1(c), second route (our addition): variance inside the two groups plus the spread of the group means'
    formula: |-
      0.8*l**2 + 0.8*0.2*(l - d)**2
    equals: |-
      0.8*(l**2 + (l - (0.8*l + 0.2*d))**2) + 0.2*(d - (0.8*l + 0.2*d))**2
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
    tolerance: 1e-12
    shown: ['<Formula label="Variance from the two groups"']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own check)'}
    origin: page-own

  - id: p1-var-exp
    kind: identity
    where: 'Problem 1(c), second route: the variance of the exponential group alone is l^2 (numerically)'
    formula: |-
      l**2
    equals: |-
      integrate('(u - l)**2/l*exp(-u/l)', 'u', 0, 60*l)
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
    tolerance: 1e-8
    shown: ['the variance $2l^2 - l^2 = l^2$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own check)'}
    origin: page-own

  - id: p1-var-l0
    kind: limit
    where: 'Problem 1(c), check: for l -> 0 the variance tends to 0.16 d^2'
    inputs: {d: 1.3}
    formula: |-
      0.96*l**2 - 0.32*l*d + 0.16*d**2
    limit: |-
      0.16*d**2
    vary: {l: [1, 0.1, 0.01, 0.001]}
    tolerance: 0.01
    shown: ['the variance becomes $0.16\,d^2$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own check)'}
    origin: page-own

  - id: p1-var-twopoint
    kind: value
    where: 'Problem 1(c), check: the variance of a variable that is 0 with probability 0.8 and d with probability 0.2, in units of d^2'
    formula: |-
      0.8*(0 - 0.2)**2 + 0.2*(1 - 0.2)**2
    expected: '0.16'
    tolerance: 1e-12
    shown: ['that of a variable that is $0$ with probability 0.8']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own check)'}
    origin: page-own

  - id: p1-imp
    kind: identity
    answer: p1-imp
    where: 'Problem 1(d), answer box: the average of exp(-x/s) by numerical integration'
    formula: |-
      0.8/(1 + l/s) + 0.2*exp(-d/s)
    equals: |-
      integrate('exp(-u/s)*0.8/l*exp(-u/l)', 'u', 0, 60*l) + integrate('exp(-u/s)*0.2/w', 'u', d - w/2, d + w/2)
    samples:
      l: [0.5, 0.8, 1.1, 1.6, 2.0]
      d: [3.0, 0.7, 1.9, 2.4, 1.2]
      w: [0.001, 0.001, 0.001, 0.001, 0.001]
      s: [0.5, 2.5, 1.2, 3.0, 0.9]
    tolerance: 1e-6
    shown: ['id="p1-imp"', '<Formula label="Average contribution to the surface impedance"']
    source: {cite: reading1, at: 'Problem 1(d), p. 2'}
    origin: mit

  - id: p1-imp-large
    kind: limit
    where: 'Problem 1(d), check: for a very large skin depth the average tends to 1'
    inputs: {l: 1.1, d: 1.9}
    formula: |-
      0.8/(1 + l/s) + 0.2*exp(-d/s)
    limit: |-
      1
    vary: {s: [10, 100, 1000, 10000]}
    tolerance: 0.001
    shown: ['the average tends to $0.8 + 0.2 = 1$']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own check)'}
    origin: page-own

  - id: p1-imp-wrong
    kind: limit
    where: 'Problem 1(d), hint of the third listed mistake: with s/l in place of l/s the average would tend to 0.2 for a large skin depth'
    inputs: {l: 1.1, d: 1.9}
    formula: |-
      0.8/(1 + s/l) + 0.2*exp(-d/s)
    limit: |-
      0.2
    vary: {s: [10, 100, 1000, 10000]}
    tolerance: 0.01
    shown: ['This form gives 0.2.']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own hint)'}
    origin: page-own

  - id: p1-imp-small
    kind: limit
    where: 'Problem 1(d), check: for s much smaller than l the first term tends to 0.8 s/l'
    inputs: {l: 1.0}
    formula: |-
      0.8/(1 + l/s)
    limit: |-
      0.8*s/l
    vary: {s: [0.1, 0.01, 0.001]}
    tolerance: 0.01
    shown: ['the first term becomes about $0.8\,s/l$']
    source: {cite: reading1, at: 'Problem 1(d), p. 2'}
    origin: mit

  - id: p1-imp-deep
    kind: limit
    where: 'Problem 1(d), check: for s much smaller than d the term of the grain boundary dies out (compared with the first term)'
    inputs: {l: 1.0, d: 1.5}
    formula: |-
      0.8/(1 + l/s) + 0.2*exp(-d/s)
    limit: |-
      0.8/(1 + l/s)
    vary: {s: [0.5, 0.2, 0.1, 0.05]}
    tolerance: 1e-6
    shown: ['the second term dies out']
    source: {cite: reading1, at: 'Problem 1(d), p. 2'}
    origin: mit

  # ---- Problem 2: the Lorentzian p(x) = a/(b^2 + x^2). Integrals over the whole line use x = b tan(theta), which maps

  # the line onto -pi/2 < theta < pi/2; quad never evaluates the end points.

  - id: p2-a
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box: a from the numerical area under 1/(b^2 + x^2), with x = b tan(theta)'
    formula: |-
      b/pi
    equals: |-
      1/integrate('(b/cos(th)**2)/(b**2 + (b*tan(th))**2)', 'th', -pi/2, pi/2)
    samples:
      b: [0.5, 0.9, 1.4, 2.2, 3.0]
    tolerance: 1e-9
    shown: ['id="p2-a"', '<Formula label="Normalization of the Lorentzian"']
    source: {cite: reading1, at: 'Problem 2(a), p. 3'}
    origin: mit

  - id: p2-a-half
    kind: identity
    where: 'Problem 2(a), hint of the first listed mistake: with a = b/(2 pi) the area is one half'
    formula: |-
      0.5 + 0*b
    equals: |-
      integrate('(b/(2*pi))*(b/cos(th)**2)/(b**2 + (b*tan(th))**2)', 'th', -pi/2, pi/2)
    samples:
      b: [0.5, 0.9, 1.4, 2.2, 3.0]
    tolerance: 1e-9
    shown: ['With that value the area under p is one half.']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own hint)'}
    origin: page-own

  - id: p2-max
    kind: value
    where: 'Problem 2(d), graph: the maximum of the density in units of 1/b'
    formula: |-
      1/pi
    expected: '0.318'
    shown: ['about 0.318/b']
    source: {cite: reading1, at: 'Problem 2(d), p. 3 (our own numbers)'}
    origin: page-own

  - id: p2-halfmax
    kind: value
    where: 'Problem 2(d), graph: half of the maximum in units of 1/b'
    formula: |-
      1/(2*pi)
    expected: '0.1592'
    shown: ['about 0.159/b', '{ x: -1, y: 0.1592', '{ x: 1, y: 0.1592']
    source: {cite: reading1, at: 'Problem 2(d), p. 3 (our own numbers)'}
    origin: page-own

  - id: p2-cum
    kind: identity
    answer: p2-cum
    where: 'Problem 2(b), answer box: P(x) as one half (by symmetry) plus the numerical integral of the density from 0 to x'
    formula: |-
      1/2 + atan(x/b)/pi
    equals: |-
      0.5 + integrate('(b/pi)/(b**2 + u**2)', 'u', 0, x)
    samples:
      x: [-3.0, -0.8, 0.4, 1.7, 3.0]
      b: [0.5, 0.9, 1.4, 2.2, 3.0]
    tolerance: 1e-9
    shown: ['id="p2-cum"', '<Formula label="Cumulative function of the Lorentzian"']
    source: {cite: reading1, at: 'Problem 2(b), p. 3'}
    origin: mit

  - id: p2-cum-slope
    kind: identity
    where: 'Problem 2(b), check: the derivative of P is the density'
    formula: |-
      (b/pi)/(b**2 + x**2)
    equals: |-
      deriv('1/2 + atan(u/b)/pi', 'u', x)
    samples:
      x: [-3.0, -0.8, 0.4, 1.7, 3.0]
      b: [0.5, 0.9, 1.4, 2.2, 3.0]
    tolerance: 1e-6
    shown: ['$P \to 0$ as $x \to -\infty$ and $P \to 1$ as $x \to \infty$']
    source: {cite: reading1, at: 'Problem 2(b), p. 3'}
    origin: page-own

  - id: p2-cum-2b
    kind: value
    where: 'Problem 2(b), graph and check: P at x = 2b'
    formula: |-
      1/2 + atan(2)/pi
    expected: '0.85'
    shown: ['at x = 2b it has reached only 0.85', '\arctan 2 = 0.85$']
    source: {cite: reading1, at: 'Problem 2(b), p. 3 (our own number)'}
    origin: page-own

  - id: p2-cum-2b-rest
    kind: value
    where: 'Problem 2(b), check: the probability beyond x = 2b, in percent'
    formula: |-
      100*(1/2 - atan(2)/pi)
    expected: '15'
    tolerance: 0.5
    shown: ['so 15 percent of the probability']
    source: {cite: reading1, at: 'Problem 2(b), p. 3 (our own number)'}
    origin: page-own

  - id: p2-mean
    kind: value
    where: 'Problem 2(c), choice box: the integral of x p(x) between symmetric limits is zero'
    inputs: {b: 1.3, L: 50}
    formula: |-
      integrate('u*(b/pi)/(b**2 + u**2)', 'u', -L, L)
    expected: '0'
    tolerance: 1e-9
    shown: ['id="p2-mean"', '<Formula label="Mean of the Lorentzian"']
    source: {cite: reading1, at: 'Problem 2(c), p. 3'}
    origin: mit

  - id: p2-mean-asym
    kind: limit
    where: 'Problem 2(c), remark (our addition): with the limits -L and 2L the integral of x p(x) tends to (b/pi) ln 2'
    inputs: {b: 1.3}
    formula: |-
      integrate('u*(b/pi)/(b**2 + u**2)', 'u', -L, 2*L)
    limit: |-
      b*log(2)/pi
    vary: {L: [10, 100, 1000]}
    tolerance: 1e-4
    shown: ['tends to $\frac{b}{\pi}\ln 2$ instead']
    source: {cite: mit, at: 'Problem 2(c), p. 2 (our own remark)'}
    origin: page-own

  - id: p2-mean-tail
    kind: limit
    where: 'Problem 2(c), remark (our addition): at large x the integrand x p(x) falls off as b/(pi x)'
    inputs: {b: 1.3}
    formula: |-
      x*(b/pi)/(b**2 + x**2)
    limit: |-
      b/(pi*x)
    vary: {x: [10, 100, 1000]}
    tolerance: 1e-4
    shown: ['falls off only as $\frac{b}{\pi x}$']
    source: {cite: mit, at: 'Problem 2(c), p. 2 (our own remark)'}
    origin: page-own

  - id: p2-half
    kind: identity
    answer: p2-half
    where: 'Problem 2(d), answer box: the point where the density is half of its maximum, solved numerically'
    formula: |-
      b
    equals: |-
      solve('(b/pi)/(b**2 + u**2) - 0.5*(b/pi)/b**2', 'u', 0.01*b, 20*b)
    samples:
      b: [0.5, 0.9, 1.4, 2.2, 3.0]
    tolerance: 1e-8
    shown: ['id="p2-half"', '<Formula label="Half-width at half-height of the Lorentzian"']
    source: {cite: reading1, at: 'Problem 2(d), p. 3'}
    origin: mit

  - id: p2-half-mistake1
    kind: value
    where: 'Problem 2(d), hint of a listed mistake: the density at x = b/2 over its maximum'
    formula: |-
      1/(1 + 0.5**2)
    expected: '0.8'
    tolerance: 1e-12
    shown: ['which is four fifths of its maximum']
    source: {cite: mit, at: 'Problem 2(d), p. 2 (our own hint)'}
    origin: page-own

  - id: p2-half-mistake2
    kind: value
    where: 'Problem 2(d), hint of a listed mistake: the density at x = sqrt(2) b over its maximum'
    formula: |-
      1/(1 + sqrt(2)**2)
    expected: '0.333333'
    shown: ['one third of its maximum']
    source: {cite: mit, at: 'Problem 2(d), p. 2 (our own hint)'}
    origin: page-own

  - id: p2-var
    kind: limit
    where: 'Problem 2(e), choice box: far from the centre the integrand x^2 p(x) tends to the constant b/pi, so the mean square diverges'
    inputs: {b: 1.3}
    formula: |-
      x**2*(b/pi)/(b**2 + x**2)
    limit: |-
      b/pi
    vary: {x: [10, 100, 1000, 10000]}
    tolerance: 1e-6
    shown: ['id="p2-var"', '<Formula label="Mean square of the Lorentzian"']
    source: {cite: reading1, at: 'Problem 2(e), p. 3'}
    origin: mit

  - id: p2-cut
    kind: identity
    answer: p2-cut
    where: 'Problem 2(e), answer box (our addition): the integral of x^2 p(x) from -L to L, numerically'
    formula: |-
      (2*b/pi)*(L - b*atan(L/b))
    equals: |-
      integrate('u**2*(b/pi)/(b**2 + u**2)', 'u', -L, L)
    samples:
      b: [0.5, 0.9, 1.4, 2.0, 1.1]
      L: [1, 3, 5, 8, 10]
    tolerance: 1e-9
    shown: ['id="p2-cut"', '<Formula label="Mean square of the Lorentzian with a cut-off"']
    source: {cite: mit, at: 'Problem 2(e), p. 2 (our own addition)'}
    origin: page-own

  - id: p2-cut-large
    kind: limit
    where: 'Problem 2(e) (our addition): for L much larger than b the cut-off integral is close to 2bL/pi'
    inputs: {b: 1.3}
    formula: |-
      (2*b/pi)*(L - b*atan(L/b))
    limit: |-
      2*b*L/pi
    vary: {L: [10, 100, 1000, 10000, 100000]}
    tolerance: 1e-4
    shown: ['this is close to $\frac{2bL}{\pi}$']
    source: {cite: mit, at: 'Problem 2(e), p. 2 (our own addition)'}
    origin: page-own

  # ---- Problem 3: x = x0 sin(omega t + phi) with unknown phase

  - id: p3-speed
    kind: identity
    where: 'Problem 3(a), answer box: the speed at the position x(t0), from the numerical derivative of the motion at an arbitrary time and phase'
    formula: |-
      omega*sqrt(x0**2 - (x0*sin(omega*t0 + ph))**2)
    equals: |-
      abs(deriv('x0*sin(omega*u + ph)', 'u', t0))
    samples:
      omega: [0.5, 0.9, 1.3, 1.7, 2.0]
      x0: [2.0, 2.3, 2.6, 2.8, 3.0]
      t0: [0.3, 1.1, 2.4, 3.9, 5.2]
      ph: [0.2, 1.4, 2.9, 4.1, 5.5]
    tolerance: 1e-6
    shown: ['id="p3-speed"', '<Formula label="Speed of the oscillator at the position x"']
    source: {cite: reading1, at: 'Problem 3(a), p. 4'}
    origin: mit

  - id: p3-speed-box
    kind: identity
    answer: p3-speed
    where: 'Problem 3(a), answer box: the same speed from the conservation of energy per unit mass, omega^2 x0^2/2 = v^2/2 + omega^2 x^2/2, solved numerically for v'
    formula: |-
      omega*sqrt(x0**2 - x**2)
    equals: |-
      solve('v**2/2 + omega**2*x**2/2 - omega**2*x0**2/2', 'v', 0.0001, 10)
    samples:
      omega: [0.5, 0.9, 1.3, 1.7, 2.0]
      x0: [2.0, 2.3, 2.6, 2.8, 3.0]
