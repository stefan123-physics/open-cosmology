# Calculations on content/year-3/8.044/free-fermi-gas.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 19, with the page's own example.

page: content/year-3/8.044/free-fermi-gas.mdx
calcs:
  - id: dos-energy
    kind: identity
    where: 'd/dE of (4/3)π k(E)³ V/(2π)³ with k = √(2mE)/ħ equals (V/4π²)(2m/ħ²)^(3/2) E^(1/2) (ħ = 1)'
    formula: ((4/3)*pi*(2*m*(E + 1e-6))**1.5*V/(2*pi)**3 - (4/3)*pi*(2*m*(E - 1e-6))**1.5*V/(2*pi)**3)/2e-6
    equals: V/(4*pi**2)*(2*m)**1.5*E**0.5
    samples: {m: [0.5, 2.0], E: [0.5, 3.0], V: [1.0, 5.0]}
    tolerance: 1e-5
    shown: ['D_{\text{states}}(E) = (2S + 1)\frac{V}{4\pi^2}\left(\frac{2m}{\hbar^2}\right)^{3/2}E^{1/2}']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: mean-energy
    where: 'slide 7: U/N = (2/5)/(2/3) = 3/5'
    inputs: {}
    formula: integrate('x**1.5', 'x', 0, 1)/integrate('x**0.5', 'x', 0, 1)
    expected: '0.6'
    tolerance: 1e-6
    shown: ['= \frac25a\epsilon_F^{5/2} = \frac35N\epsilon_F']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: pressure-T0
    kind: identity
    where: '−d/dV of (3/5) N c V^(−2/3) equals (2/5)(N/V) c V^(−2/3)'
    formula: -((0.6*N*c*(V + 1e-6)**(-2/3)) - (0.6*N*c*(V - 1e-6)**(-2/3)))/2e-6
    equals: 0.4*(N/V)*c*V**(-2/3)
    samples: {N: [1.0, 10.0], c: [0.5, 2.0], V: [0.5, 3.0]}
    tolerance: 1e-5
    shown: ['P = \frac25\frac NVE_F \propto \left(\frac NV\right)^{5/3}']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: cu-kF
    where: 'slide 8: (3π² × 8.45e22 cm⁻³)^(1/3) in cm⁻¹'
    inputs: {}
    formula: (3*pi**2*8.45e22)**(1/3)
    expected: '1.36e8'
    tolerance: 0.005e8
    shown: ['$k_F = 1.36 \times 10^8$ cm⁻¹']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: cu-vF
    where: 'slide 8: ħ k_F/m in cm/s'
    inputs: {}
    formula: 1.054572e-34*(3*pi**2*8.45e28)**(1/3)/9.109e-31*100
    expected: '1.57e8'
    tolerance: 0.005e8
    shown: ['$v_F = 1.57 \times 10^8$ cm/s']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: cu-TF
    where: 'slide 8: E_F/k for copper in K (slide: 81 000)'
    inputs: {}
    formula: (1.054572e-34*(3*pi**2*8.45e28)**(1/3))**2/(2*9.109e-31)/1.380649e-23
    expected: '81000'
    tolerance: 800
    shown: ['$E_F/k \approx 81\,000$ K']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: cu-vF-c
    where: 'v_F/c for copper, in per cent'
    inputs: {}
    formula: 1.57e6/2.998e8*100
    expected: '0.5'
    tolerance: 0.05
    shown: ['about half a percent of the speed of light']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: k-KT
    where: 'slide 10: 1.5/(1.40e22 × 3.39e-12) in cm³/erg'
    inputs: {}
    formula: 1.5/(1.40e22*3.39e-12)
    expected: '31.6e-12'
    tolerance: 0.05e-12
    shown: ['$K_T \approx 31.6 \times 10^{-12}$ cm³/erg']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: k-EF
    where: 'slide 10: 3.39e-12 erg / k in K'
    inputs: {}
    formula: 3.39e-12/1.380649e-16
    expected: '2.46e4'
    tolerance: 0.005e4
    shown: ['($E_F/k = 2.46 \times 10^4$ K)']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: k-measured
    kind: fact
    where: 'slide 10: measured compressibility of potassium'
    value: '31e-12'
    shown: ['against a measured value of about $31 \times 10^{-12}$']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: semiconductor-mu
    kind: identity
    where: 'solving me^(3/2) e^(−(G − μ)/T) = mh^(3/2) e^(−μ/T) gives μ = G/2 − (3/4)T ln(me/mh)'
    formula: me**1.5*exp(-(G - (G/2 - 0.75*T*log(me/mh)))/T)
    equals: mh**1.5*exp(-(G/2 - 0.75*T*log(me/mh))/T)
    samples: {me: [0.1, 1.0], mh: [0.2, 2.0], G: [5.0, 20.0], T: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['\mu = \frac{\epsilon_G}{2} - \frac34kT\ln\frac{m_e}{m_h}']
    source: {cite: mit, at: 'slide 24'}
    origin: mit

  - id: ex-kF
    where: 'example (a): (3π² × 2.65e28)^(1/3) m⁻¹'
    inputs: {}
    formula: (3*pi**2*2.65e28)**(1/3)
    expected: '9.22e9'
    tolerance: 0.005e9
    shown: ['\approx 9.22 \times 10^9$ m⁻¹']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-EF-J
    where: 'example (a): ħ²k_F²/2m J'
    inputs: {}
    formula: (1.054572e-34*(3*pi**2*2.65e28)**(1/3))**2/(2*9.109e-31)
    expected: '5.19e-19'
    tolerance: 0.005e-19
    shown: ['\approx 5.19 \times 10^{-19}$ J']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-EF-eV
    where: 'example (a): E_F in eV'
    inputs: {}
    formula: (1.054572e-34*(3*pi**2*2.65e28)**(1/3))**2/(2*9.109e-31)/1.602177e-19
    expected: '3.24'
    tolerance: 0.005
    shown: ['\approx 3.24$ eV']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-TF
    where: 'example (a): E_F/k K'
    inputs: {}
    formula: (1.054572e-34*(3*pi**2*2.65e28)**(1/3))**2/(2*9.109e-31)/1.380649e-23
    expected: '37600'
    tolerance: 50
    shown: ['$E_F/k \approx 37\,600$ K']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-vF
    where: 'example (b): ħ k_F/m m/s'
    inputs: {}
    formula: 1.054572e-34*(3*pi**2*2.65e28)**(1/3)/9.109e-31
    expected: '1.07e6'
    tolerance: 0.005e6
    shown: ['\approx 1.07 \times 10^6$ m/s']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-C
    where: 'example (c): (π²/3)(300/37 600)'
    inputs: {}
    formula: pi**2/3*300/37600
    expected: '0.026'
    tolerance: 0.0005
    shown: ['\approx 0.026$']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-P
    where: 'example (d): (2/5)(N/V)E_F Pa'
    inputs: {}
    formula: 0.4*2.65e28*(1.054572e-34*(3*pi**2*2.65e28)**(1/3))**2/(2*9.109e-31)
    expected: '5.5e9'
    tolerance: 0.05e9
    shown: ['\approx 5.5 \times 10^9$ Pa']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-P-atm
    where: 'example (d): 5.5e9 Pa in atmospheres'
    inputs: {}
    formula: 5.5e9/101325
    expected: '54000'
    tolerance: 5000
    shown: ['about fifty thousand atmospheres']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own
