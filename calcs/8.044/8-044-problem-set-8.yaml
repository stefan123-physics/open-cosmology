# Calculations on content/year-3/8.044/8-044-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions to this set and the page follows them. Every answer is checked here by a route that does
# not use the algebra of the page: numerical Gaussian and radial integrals for the partition functions, numerical
# derivatives of the free energy for the entropies, sums over states written out term by term, a numerical root for
# the adiabat of the trap, and the exact tail integral (complementary error function) for Problem 5.
# Problem 5 is in cgs units with charges in esu, as on MIT's sheet; its numbers are entered as plain numbers.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.044/8-044-problem-set-8.mdx
calcs:
  # ---- Problem 1

  - id: p1-joint
    kind: identity
    answer: p1-joint
    where: 'Problem 1(a), answer box and formula "Joint density of the angles and angular momenta of a grain": the Boltzmann factor divided by its integral over the six variables, the three Gaussian integrals done numerically'
    formula: >-
      exp(-L1**2/(2*I1*k*T) - L2**2/(2*I2*k*T) - L3**2/(2*I3*k*T))/((2*pi)**3*(2*pi*k*T)**(3/2)*sqrt(I1*I2*I3))
    equals: >-
      exp(-L1**2/(2*I1*k*T) - L2**2/(2*I2*k*T) - L3**2/(2*I3*k*T))/((2*pi)**3*integrate('exp(-x**2/(2*I1*k*T))', 'x', -12*sqrt(I1*k*T), 12*sqrt(I1*k*T))*integrate('exp(-x**2/(2*I2*k*T))', 'x', -12*sqrt(I2*k*T), 12*sqrt(I2*k*T))*integrate('exp(-x**2/(2*I3*k*T))', 'x', -12*sqrt(I3*k*T), 12*sqrt(I3*k*T)))
    samples:
      L1: [-1.5, 0.3, 1.2, 0.7, -0.4]
      L2: [0.5, -1.1, 1.2, 0.2, -1.4]
      L3: [0.1, 0.4, -0.3, 0.2, -0.5]
      I1: [0.5, 2, 1, 1.3, 0.8]
      I2: [0.7, 1.9, 1, 0.6, 1.5]
      I3: [0.5, 0.6, 0.8, 0.7, 0.9]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-8
    shown: ['p(\theta_1, \theta_2, \theta_3, L_1, L_2, L_3) = \left(\frac{1}{2\pi}\right)^3\frac{e^{-L_1^2/2I_1kT}}{\sqrt{2\pi I_1kT}}']
    source: {cite: reading1, at: 'Problem 1(a), p. 1'}
    origin: mit

  - id: p1-joint-normalized
    where: 'Problem 1(a), check: the joint density integrated over the six variables (the angles give (2π)³)'
    inputs: {I1: 0.7, I2: 1.3, I3: 0.2, k: 1.1, T: 0.9}
    formula: >-
      (2*pi)**3*integrate('exp(-x**2/(2*I1*k*T))', 'x', -12*sqrt(I1*k*T), 12*sqrt(I1*k*T))*integrate('exp(-x**2/(2*I2*k*T))', 'x', -12*sqrt(I2*k*T), 12*sqrt(I2*k*T))*integrate('exp(-x**2/(2*I3*k*T))', 'x', -12*sqrt(I3*k*T), 12*sqrt(I3*k*T))/((2*pi)**3*(2*pi*k*T)**(3/2)*sqrt(I1*I2*I3))
    expected: '1'
    tolerance: 1e-8
    shown: ['so the product integrates to 1 over all six']
    source: {cite: reading1, at: 'Problem 1(a), p. 1 (the check is ours)'}
    origin: page-own

  - id: p1-l1
    kind: identity
    answer: p1-l1
    where: 'Problem 1(b), answer box and formula "Mean squares of the angular momentum components": a numerical integral of L² over its Gaussian density'
    formula: >-
      I1*k*T
    equals: >-
      integrate('x**2*exp(-x**2/(2*I1*k*T))/sqrt(2*pi*I1*k*T)', 'x', -12*sqrt(I1*k*T), 12*sqrt(I1*k*T))
    samples:
      I1: [0.5, 2, 1, 1.3, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-8
    shown: ['\langle L_1^2\rangle = \langle L_2^2\rangle = I_1kT']
    source: {cite: reading1, at: 'Problem 1(b), p. 1'}
    origin: mit

  - id: p1-ratio
    answer: p1-ratio
    where: 'Problem 1(b), answer box (our addition): root mean square of L3 over that of the perpendicular part, for I3 = I1/400, from numerical integrals of the mean squares'
    inputs: {I1: 2, I3: 0.005, k: 1.3, T: 0.8}
    formula: >-
      sqrt(integrate('x**2*exp(-x**2/(2*I3*k*T))/sqrt(2*pi*I3*k*T)', 'x', -12*sqrt(I3*k*T), 12*sqrt(I3*k*T))/(2*integrate('x**2*exp(-x**2/(2*I1*k*T))/sqrt(2*pi*I1*k*T)', 'x', -12*sqrt(I1*k*T), 12*sqrt(I1*k*T))))
    expected: '0.0354'
    shown: ['= \sqrt{1/800} = 0.0354$']
    source: {cite: reading1, at: 'Problem 1(b), p. 1 (the mean squares are MIT''s; the example is ours)'}
    origin: page-own

  - id: p1-z
    kind: identity
    answer: p1-z
    where: 'Problem 1(c), answer box and formula "Rotational partition function of one grain": (2π)³ from the angles times three numerical Gaussian integrals, over h³'
    formula: >-
      (2*pi)**(9/2)*sqrt(I1*I2*I3)*(k*T)**(3/2)/h**3
    equals: >-
      (2*pi)**3*integrate('exp(-x**2/(2*I1*k*T))', 'x', -12*sqrt(I1*k*T), 12*sqrt(I1*k*T))*integrate('exp(-x**2/(2*I2*k*T))', 'x', -12*sqrt(I2*k*T), 12*sqrt(I2*k*T))*integrate('exp(-x**2/(2*I3*k*T))', 'x', -12*sqrt(I3*k*T), 12*sqrt(I3*k*T))/h**3
    samples:
      I1: [0.5, 2, 1, 1.3, 0.8]
      I2: [0.7, 1.9, 1, 0.6, 1.5]
      I3: [0.5, 0.6, 0.8, 0.7, 0.9]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
      h: [0.5, 2, 1, 1.4, 0.7]
    tolerance: 1e-8
    shown: ['= \frac{(2\pi)^{9/2}\sqrt{I_1I_2I_3}\,(kT)^{3/2}}{h^3}']
    source: {cite: reading1, at: 'Problem 1(c), p. 1 (MIT prints it without h³)'}
    origin: mit

  - id: p1-s
    kind: identity
    answer: p1-s
    where: 'Problem 1(c), answer box and formula "Rotational entropy of the dust cloud": minus the numerical temperature derivative of F = −NkT ln Z1, with Z1 growing as T^(3/2)'
    formula: >-
      N*k*log(Z1) + 3*N*k/2
    equals: >-
      -deriv('-N*k*x*log(Z1*(x/T)**(3/2))', 'x', T)
    samples:
      N: [1, 5, 2, 3, 4]
      k: [0.5, 2, 1, 1.3, 0.8]
      Z1: [2, 50, 10, 25, 5]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-7
    shown: ['= Nk\ln Z_1 + NkT\,\frac{1}{Z_1}\,\frac32\,\frac{Z_1}{T} = Nk\ln Z_1 + \frac32Nk']
    source: {cite: reading1, at: 'Problem 1(c), p. 1'}
    origin: mit

  - id: p1-energy
    kind: identity
    where: 'Problem 1(c), check: E = F + TS with the F and S of the solution'
    formula: >-
      3*N*k*T/2
    equals: >-
      -N*k*T*log(Z1) + T*(-deriv('-N*k*x*log(Z1*(x/T)**(3/2))', 'x', T))
    samples:
      N: [1, 5, 2, 3, 4]
      k: [0.5, 2, 1, 1.3, 0.8]
      Z1: [2, 50, 10, 25, 5]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-7
    shown: ['E = F + TS = \frac32NkT$: half']
    source: {cite: reading1, at: 'Problem 1(c), p. 1 (the check is ours)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-z
    kind: identity
    answer: p2-z
    where: 'Problem 2(a), answer box and formula "Partition function of one adsorbed atom": the sum over sites, one term per kind of site times the number of such sites'
    formula: >-
      M*(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))
    equals: >-
      (M/100)*exp(0) + (14*M/100)*exp(-D/(k*T)) + (85*M/100)*exp(-3*D/(2*k*T))
    samples:
      M: [100, 1000, 500, 250, 800]
      D: [0.5, 2, 1, 1.3, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.3, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['= 0.01M + 0.14M\,e^{-\Delta/kT} + 0.85M\,e^{-1.5\Delta/kT}']
    source: {cite: reading1, at: 'Problem 2(a), p. 2'}
    origin: mit

  - id: p2-z-high
    kind: limit
    where: 'Problem 2(a), check: at high temperature Z1 tends to the number of sites (Δ = k = 1, M = 500)'
    inputs: {M: 500, D: 1, k: 1}
    formula: >-
      M*(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))
    limit: >-
      M
    vary: {T: [1, 10, 100, 1000, 10000, 100000]}
    tolerance: 1e-4
    shown: ['$Z_1 \to M$, the number of states']
    source: {cite: reading1, at: 'Problem 2(a), p. 2 (the check is ours)'}
    origin: page-own

  - id: p2-z-low
    kind: limit
    where: 'Problem 2(a), check: at low temperature Z1 tends to the number of corner sites (Δ = k = 1, M = 500)'
    inputs: {M: 500, D: 1, k: 1}
    formula: >-
      M*(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))
    limit: >-
      0.01*M
    vary: {T: [0.2, 0.1, 0.05, 0.03]}
    tolerance: 1e-6
    shown: ['$Z_1 \to 0.01M$']
    source: {cite: reading1, at: 'Problem 2(a), p. 2 (the check is ours)'}
    origin: page-own

  - id: p2-ratio
    kind: identity
    answer: p2-ratio
    where: 'Problem 2(b), answer box and formula "Ratio of atoms on face sites to atoms on corner sites": the two probabilities, each a number of sites times a Boltzmann factor over Z1'
    formula: >-
      85*exp(-1.5*D/(k*T))
    equals: >-
      (0.85*M*exp(-1.5*D/(k*T))/(M*(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))))/(0.01*M/(M*(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))))
    samples:
      M: [100, 1000, 500, 250, 800]
      D: [0.5, 2, 1, 1.3, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.3, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['= \frac{0.85M\,e^{-1.5\Delta/kT}}{0.01M} = 85\,e^{-1.5\Delta/kT}']
    source: {cite: reading1, at: 'Problem 2(b), p. 2'}
    origin: mit

  - id: p2-equal
    answer: p2-equal
    where: 'Problem 2(b), answer box (our addition): kT/Δ at which face and corner sites hold equal numbers, as a numerical root'
    inputs: {}
    formula: >-
      solve('85*exp(-1.5/x) - 1', 'x', 0.1, 1)
    expected: '0.338'
    shown: ['= 1.5/\ln 85 = 0.338$']
    source: {cite: reading1, at: 'Problem 2(b), p. 2 (the ratio is MIT''s; the number is ours)'}
    origin: page-own

  - id: p2-ratio-high
    where: 'Problem 2(b) and 2(d), checks: the ratio of the numbers of face and corner sites'
    inputs: {}
    formula: >-
      0.85/0.01
    expected: '85'
    shown: ['tends to 85, which is $0.85/0.01$']
    source: {cite: reading1, at: 'Problem 2(b), p. 2'}
    origin: page-own

  - id: p2-c
    kind: limit
    answer: p2-c
    where: 'Problem 2(c), answer box and formula "Heat capacity of the adsorbed atoms at low temperature": approaches the numerical temperature derivative of the energy from the full partition function (all three kinds of site) as T falls (N = k = Δ = 1)'
    inputs: {N: 1, k: 1, D: 1}
    formula: >-
      14*N*k*(D/(k*T))**2*exp(-D/(k*T))
    limit: >-
      deriv('N*(0.14*D*exp(-D/(k*x)) + 0.85*1.5*D*exp(-1.5*D/(k*x)))/(0.01 + 0.14*exp(-D/(k*x)) + 0.85*exp(-1.5*D/(k*x)))', 'x', T)
    vary: {T: [0.2, 0.1, 0.07, 0.05]}
    tolerance: 1e-3
    shown: ['= 14N\Delta\,\frac{\Delta}{kT^2}\,e^{-\Delta/kT} = 14Nk\left(\frac{\Delta}{kT}\right)^2e^{-\Delta/kT}']
    source: {cite: reading1, at: 'Problem 2(c), p. 2'}
    origin: mit

  - id: p2-c-005
    where: 'Problem 2(c), check: how far the leading term lies below the full heat capacity at kT = 0.05Δ, in percent'
    inputs: {N: 1, k: 1, D: 1, T: 0.05}
    formula: >-
      100*(1 - 14*N*k*(D/(k*T))**2*exp(-D/(k*T))/deriv('N*(0.14*D*exp(-D/(k*x)) + 0.85*1.5*D*exp(-1.5*D/(k*x)))/(0.01 + 0.14*exp(-D/(k*x)) + 0.85*exp(-1.5*D/(k*x)))', 'x', T))
    expected: '0.06'
    shown: ['the leading term is 0.06% below the full result']
    source: {cite: reading1, at: 'Problem 2(c), p. 2 (the comparison is ours)'}
    origin: page-own

  - id: p2-c-01
    where: 'Problem 2(c), check: the same at kT = 0.1Δ, in percent'
    inputs: {N: 1, k: 1, D: 1, T: 0.1}
    formula: >-
      100*(1 - 14*N*k*(D/(k*T))**2*exp(-D/(k*T))/deriv('N*(0.14*D*exp(-D/(k*x)) + 0.85*1.5*D*exp(-1.5*D/(k*x)))/(0.01 + 0.14*exp(-D/(k*x)) + 0.85*exp(-1.5*D/(k*x)))', 'x', T))
    expected: '8'
    shown: ['it is already 8% below']
    source: {cite: reading1, at: 'Problem 2(c), p. 2 (the comparison is ours)'}
    origin: page-own

  - id: p2-six
    where: 'Problem 2(c), check: face sites per edge site'
    inputs: {}
    formula: >-
      0.85/0.14
    expected: '6'
    shown: ['there are six times as many of them as edge sites']
    source: {cite: mit, at: 'Problem 2, p. 2 (the remark is ours)'}
    origin: page-own

  - id: p2-face
    answer: p2-face
    where: 'Problem 2(d), answer box: the probability of a face site from the full partition function at kT = 10⁶ Δ'
    inputs: {D: 1, k: 1, T: 1000000}
    formula: >-
      0.85*exp(-1.5*D/(k*T))/(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))
    expected: '0.85'
    tolerance: 1e-5
    shown: ['$0.85M$ of them are face sites: $p_{\text{face}} = 0.85$']
    source: {cite: reading1, at: 'Problem 2(d), p. 2'}
    origin: mit

  - id: p2-s
    kind: limit
    answer: p2-s
    where: 'Problem 2(e), answer box and formula "Entropy of the adsorbed atoms at high temperature": the limit of S = Nk ln Z1 + E/T from the full partition function (N = 3, k = Δ = 1, M = 500)'
    inputs: {N: 3, k: 1, D: 1, M: 500}
    formula: >-
      N*k*log(M)
    limit: >-
      N*k*log(M*(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))) + N*(0.14*D*exp(-D/(k*T)) + 0.85*1.5*D*exp(-1.5*D/(k*T)))/(0.01 + 0.14*exp(-D/(k*T)) + 0.85*exp(-1.5*D/(k*T)))/T
    vary: {T: [1, 10, 100, 1000, 10000]}
    tolerance: 1e-6
    shown: ['\lim_{T \to \infty}S = Nk\ln M" cite="reading1"']
    source: {cite: reading1, at: 'Problem 2(e), p. 2'}
    origin: mit

  - id: p2-s-counting
    kind: identity
    where: 'Problem 2(e), remark: the limit with the partition function divided by N!, using Stirling''s formula ln N! = N ln N − N'
    formula: >-
      N*k*log(M/N) + N*k
    equals: >-
      N*k*log(M) - k*(N*log(N) - N)
    samples:
      N: [10, 50, 200, 30, 400]
      k: [0.5, 2, 1, 1.3, 0.8]
      M: [1000, 5000, 100000, 2500, 80000]
    tolerance: 1e-12
    shown: ['becomes $Nk\ln(M/N) + Nk$']
    source: {cite: reading1, at: 'Problem 2(e), p. 2 (the remark is ours)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-prefactor
    kind: identity
    answer: p3-prefactor
    where: 'Problem 3(a), answer box and formula "Prefactor and exponents for the trapped atom": the numerical momentum and radial integrals over h³, divided by T^(9/2) a^(−3)'
    formula: >-
      8*pi*k**3*(2*pi*m*k/h**2)**(3/2)
    equals: >-
      (integrate('exp(-p**2/(2*m*k*T))', 'p', -12*sqrt(m*k*T), 12*sqrt(m*k*T))/h)**3*4*pi*integrate('r**2*exp(-a*r/(k*T))', 'r', 0, 80*k*T/a)/(T**(9/2)*a**(-3))
    samples:
      k: [0.5, 2, 1, 1.3, 0.8]
      m: [0.5, 2, 1, 1.6, 0.6]
      h: [0.5, 2, 1, 1.4, 0.7]
      T: [0.6, 1.9, 1, 0.7, 1.4]
      a: [0.4, 1.5, 1, 2.2, 0.9]
    tolerance: 1e-8
    shown: ['A = 8\pi k^3\left(\frac{2\pi mk}{h^2}\right)^{3/2}, \qquad']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3-alpha
    answer: p3-alpha
    where: 'Problem 3(a), answer box: the power of T, as the numerical logarithmic derivative of the momentum and radial integrals (m = k = h = a = 1, T = 1.3)'
    inputs: {T: 1.3}
    formula: >-
      T*deriv("log(x**(3/2)*integrate('r**2*exp(-r/x)', 'r', 0, 80*x))", 'x', T)
    expected: '4.5'
    tolerance: 1e-5
    shown: ['\alpha = \frac92']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3-eta
    answer: p3-eta
    where: 'Problem 3(a), answer box: minus the power of a, as the numerical logarithmic derivative of the radial integral (kT = 1, a = 0.7)'
    inputs: {a: 0.7}
    formula: >-
      -a*deriv("log(integrate('r**2*exp(-x*r)', 'r', 0, 80/x))", 'x', a)
    expected: '3'
    tolerance: 1e-5
    shown: ['\eta = 3" cite']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3-radial
    where: 'Problem 3(a), step: the integral of y² e^(−y) from zero to infinity'
    inputs: {}
    formula: >-
      integrate('y**2*exp(-y)', 'y', 0, 80)
    expected: '2'
    tolerance: 1e-8
    shown: ['\int_0^\infty y^2e^{-y}\,dy = 2\left(kT/a\right)^3$']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3-s
    kind: identity
    answer: p3-s
    where: 'Problem 3(b), answer box and formula "Entropy of the trapped gas": minus the numerical temperature derivative of F = −NkT ln(Z1/N) − NkT, with Z1 growing as T^(9/2)'
    formula: >-
      N*k*log(Z1/N) + 11*N*k/2
    equals: >-
      -deriv('-N*k*x*log(Z1*(x/T)**(9/2)/N) - N*k*x', 'x', T)
    samples:
      N: [1, 5, 2, 3, 4]
      k: [0.5, 2, 1, 1.3, 0.8]
      Z1: [20, 200, 50, 120, 80]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-7
    shown: ['= Nk\ln\frac{Z_1}{N} + Nk + \frac92Nk = Nk\ln\frac{Z_1}{N} + \frac{11}{2}Nk']
    source: {cite: reading1, at: 'Problem 3(b), p. 3'}
    origin: mit

  - id: p3-energy
    kind: identity
    where: 'Problem 3(b), check: E = F + TS with the F and S of the solution'
    formula: >-
      9*N*k*T/2
    equals: >-
      (-N*k*T*log(Z1/N) - N*k*T) + T*(-deriv('-N*k*x*log(Z1*(x/T)**(9/2)/N) - N*k*x', 'x', T))
    samples:
      N: [1, 5, 2, 3, 4]
      k: [0.5, 2, 1, 1.3, 0.8]
      Z1: [20, 200, 50, 120, 80]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-7
    shown: ['E = F + TS = \frac92NkT$']
    source: {cite: reading1, at: 'Problem 3(b), p. 3 (the check is ours)'}
    origin: page-own

  - id: p3-potential
    where: 'Problem 3(b), check: the mean potential energy ar over the density r² e^(−ar/kT), in units of kT'
    inputs: {}
    formula: >-
      integrate('y**3*exp(-y)', 'y', 0, 90)/integrate('y**2*exp(-y)', 'y', 0, 90)
    expected: '3'
    tolerance: 1e-8
    shown: ['e^{-ar/kT}$ is $3kT$']
    source: {cite: reading1, at: 'Problem 3(b), p. 3 (the check is ours)'}
    origin: page-own

  - id: p3-t
    kind: identity
    answer: p3-t
    where: 'Problem 3(c), answer box and formula "Cooling a trapped gas by opening the trap": the temperature at which T^(9/2)/a³ has its starting value, as a numerical root'
    formula: >-
      T0*(a/a0)**(2/3)
    equals: >-
      solve('x**(9/2)/a**3 - T0**(9/2)/a0**3', 'x', 0.01*T0, 100*T0)
    samples:
      T0: [0.5, 2, 1, 1.3, 0.8]
      a: [0.2, 2, 1, 0.7, 1.4]
      a0: [1, 3, 2, 1.5, 2.5]
    tolerance: 1e-8
    shown: ['T = T_0\left(\frac{a}{a_0}\right)^{2/3}']
    source: {cite: reading1, at: 'Problem 3(c), p. 4'}
