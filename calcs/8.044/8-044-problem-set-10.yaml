# Calculations on content/year-3/8.044/8-044-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes solutions to this set and the page follows them. Every answer is checked here by a route that does
# not use the algebra of the page: sums over states written out term by term, the symmetrized square of the
# one-particle partition function, numerical temperature derivatives of ln Z, a numerical maximum of the Raman
# envelope, Stirling's approximation as an integral of the logarithm, a numerical root for the equal chemical
# potentials, and numerical derivatives of the ideal-gas μ, S, P and V for the Maxwell relations.
# The choice boxes (p1-f0, p1-b0, p1-contrast, p3-which, p3-mixed, p6-a to p6-d) have no number to recompute; the four
# Maxwell relations behind p6-a to p6-d are tested on the monatomic ideal gas at the end of this file.

page: content/year-3/8.044/8-044-problem-set-10.mdx
calcs:
  # ---- Problem 1

  - id: p1-nf
    answer: p1-nf
    where: 'Problem 1(a), answer box: the number of ways to choose 2 different single-particle states out of 3'
    inputs: {}
    formula: >-
      3*2/2
    expected: '3'
    shown: ['is $3 \times 2/2 = 3$']
    source: {cite: reading1, at: 'Problem 1(a), p. 1'}
    origin: mit

  - id: p1-nb
    answer: p1-nb
    where: 'Problem 1(b), answer box: the three pairs of different states plus the three double occupations'
    inputs: {}
    formula: >-
      3*2/2 + 3
    expected: '6'
    shown: ['with a double occupation make 6']
    source: {cite: reading1, at: 'Problem 1(b), p. 1'}
    origin: mit

  - id: p1-distinguishable
    where: 'Problem 1(b), check: the number of states of two distinguishable particles on three levels'
    inputs: {}
    formula: >-
      3*3
    expected: '9'
    shown: ['would have $3 \times 3 = 9$ states']
    source: {cite: reading1, at: 'Problem 1(b), p. 1 (the check is ours)'}
    origin: page-own

  - id: p1-zf
    kind: identity
    answer: p1-zf
    where: 'Problem 1(c), answer box and formula "Partition function of two fermions on three levels": half the square of the one-particle sum minus half the one-particle sum at T/2 (the antisymmetrized pair)'
    formula: >-
      exp(-e2/(k*T)) + exp(-e3/(k*T)) + exp(-(e2 + e3)/(k*T))
    equals: >-
      ((1 + exp(-e2/(k*T)) + exp(-e3/(k*T)))**2 - (1 + exp(-2*e2/(k*T)) + exp(-2*e3/(k*T))))/2
    samples:
      e2: [0.5, 1.5, 1, 1.2, 0.8]
      e3: [2, 3, 2.5, 2.2, 2.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['tex="Z_F = e^{-\epsilon_2/kT} + e^{-\epsilon_3/kT} + e^{-(\epsilon_2 + \epsilon_3)/kT}"']
    source: {cite: reading1, at: 'Problem 1(c), p. 1'}
    origin: mit

  - id: p1-zb
    kind: identity
    answer: p1-zb
    where: 'Problem 1(c), answer box and formula "Partition function of two bosons on three levels": half the square of the one-particle sum plus half the one-particle sum at T/2 (the symmetrized pair)'
    formula: >-
      1 + exp(-e2/(k*T)) + exp(-e3/(k*T)) + exp(-2*e2/(k*T)) + exp(-(e2 + e3)/(k*T)) + exp(-2*e3/(k*T))
    equals: >-
      ((1 + exp(-e2/(k*T)) + exp(-e3/(k*T)))**2 + (1 + exp(-2*e2/(k*T)) + exp(-2*e3/(k*T))))/2
    samples:
      e2: [0.5, 1.5, 1, 1.2, 0.8]
      e3: [2, 3, 2.5, 2.2, 2.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['tex="Z_B = 1 + e^{-\epsilon_2/kT} + e^{-\epsilon_3/kT} + e^{-2\epsilon_2/kT} + e^{-(\epsilon_2 + \epsilon_3)/kT} + e^{-2\epsilon_3/kT}"']
    source: {cite: reading1, at: 'Problem 1(c), p. 1'}
    origin: mit

  - id: p1-zf-high
    kind: limit
    where: 'Problem 1(c), check: at high temperature Z_F tends to its number of states (ε2 = 1, ε3 = 2, k = 1)'
    inputs: {e2: 1, e3: 2, k: 1}
    formula: >-
      exp(-e2/(k*T)) + exp(-e3/(k*T)) + exp(-(e2 + e3)/(k*T))
    limit: >-
      3
    vary: {T: [10, 100, 1000, 10000, 100000, 1000000]}
    tolerance: 1e-4
    shown: ['$Z_F \to 3$ and']
    source: {cite: reading1, at: 'Problem 1(c), p. 1 (the check is ours)'}
    origin: page-own

  - id: p1-zb-high
    kind: limit
    where: 'Problem 1(c), check: at high temperature Z_B tends to its number of states (ε2 = 1, ε3 = 2, k = 1)'
    inputs: {e2: 1, e3: 2, k: 1}
    formula: >-
      1 + exp(-e2/(k*T)) + exp(-e3/(k*T)) + exp(-2*e2/(k*T)) + exp(-(e2 + e3)/(k*T)) + exp(-2*e3/(k*T))
    limit: >-
      6
    vary: {T: [10, 100, 1000, 10000, 100000, 1000000]}
    tolerance: 1e-4
    shown: ['and $Z_B \to 6$']
    source: {cite: reading1, at: 'Problem 1(c), p. 1 (the check is ours)'}
    origin: page-own

  - id: p1-uf
    kind: identity
    answer: p1-uf
    where: 'Problem 1(d), answer box and formula "Energy of two fermions at low temperature": kT² times the numerical temperature derivative of the logarithm of the two-term partition function'
    formula: >-
      (e2*exp(-e2/(k*T)) + e3*exp(-e3/(k*T)))/(exp(-e2/(k*T)) + exp(-e3/(k*T)))
    equals: >-
      k*T**2*deriv('log(exp(-e2/(k*x)) + exp(-e3/(k*x)))', 'x', T)
    samples:
      e2: [0.5, 1.5, 1, 1.2, 0.8]
      e3: [2, 3, 2.5, 2.2, 2.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-7
    shown: ['U_F \approx \frac{\epsilon_2e^{-\epsilon_2/kT} + \epsilon_3e^{-\epsilon_3/kT}}{e^{-\epsilon_2/kT} + e^{-\epsilon_3/kT}}']
    source: {cite: reading1, at: 'Problem 1(d), p. 1'}
    origin: mit

  - id: p1-ub
    kind: identity
    answer: p1-ub
    where: 'Problem 1(d), answer box and formula "Energy of two bosons at low temperature": kT² times the numerical temperature derivative of the logarithm of the two-term partition function'
    formula: >-
      e2*exp(-e2/(k*T))/(1 + exp(-e2/(k*T)))
    equals: >-
      k*T**2*deriv('log(1 + exp(-e2/(k*x)))', 'x', T)
    samples:
      e2: [0.5, 1.5, 1, 1.2, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-7
    shown: ['U_B \approx \frac{\epsilon_2e^{-\epsilon_2/kT}}{1 + e^{-\epsilon_2/kT}}']
    source: {cite: reading1, at: 'Problem 1(d), p. 2'}
    origin: mit

  - id: p1-gf
    kind: identity
    answer: p1-gf
    where: 'Problem 1(d), answer box: the gap of the fermions, read off the two-term energy U as −kT ln[(U − ε2)/(ε3 − U)], the logarithm of the ratio of the two probabilities'
    formula: >-
      e3 - e2
    equals: >-
      -k*T*log(((e2*exp(-e2/(k*T)) + e3*exp(-e3/(k*T)))/(exp(-e2/(k*T)) + exp(-e3/(k*T))) - e2)/(e3 - (e2*exp(-e2/(k*T)) + e3*exp(-e3/(k*T)))/(exp(-e2/(k*T)) + exp(-e3/(k*T)))))
    samples:
      e2: [0.5, 1.5, 1, 1.2, 0.8]
      e3: [2, 3, 2.5, 2.2, 2.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-9
    shown: ['with the gap $\Delta = \epsilon_3 - \epsilon_2$ (MIT']
    source: {cite: reading1, at: 'Problem 1(d), p. 2'}
    origin: mit

  - id: p1-gb
    kind: identity
    answer: p1-gb
    where: 'Problem 1(d), answer box: the gap of the bosons, read off the two-term energy U as −kT ln[U/(ε2 − U)]'
    formula: >-
      e2
    equals: >-
      -k*T*log((e2*exp(-e2/(k*T))/(1 + exp(-e2/(k*T))))/(e2 - e2*exp(-e2/(k*T))/(1 + exp(-e2/(k*T)))))
    samples:
      e2: [0.5, 1.5, 1, 1.2, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-9
    shown: ['and the gap is $\Delta = \epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 2'}
    origin: mit

  - id: p1-num-f-full
    where: 'Problem 1(d), check (ours): energy of the fermions from all three states, in units of ε2, for ε3 = 2ε2 and kT = 0.2 ε2'
    inputs: {}
    formula: >-
      (exp(-5) + 2*exp(-10) + 3*exp(-15))/(exp(-5) + exp(-10) + exp(-15))
    expected: '1.006783'
    shown: ['$U_F = 1.006783\,\epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 1 (the numbers are ours)'}
    origin: page-own

  - id: p1-num-f-two
    where: 'Problem 1(d), check (ours): energy of the fermions from the two leading terms, same values'
    inputs: {}
    formula: >-
      (exp(-5) + 2*exp(-10))/(exp(-5) + exp(-10))
    expected: '1.006693'
    shown: ['the two leading terms give $1.006693\,\epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 1 (the numbers are ours)'}
    origin: page-own

  - id: p1-num-f-expanded
    where: 'Problem 1(d), check (ours): the expanded form ε2 + (ε3 − ε2) exp(−(ε3 − ε2)/kT), same values'
    inputs: {}
    formula: >-
      1 + (2 - 1)*exp(-(2 - 1)/0.2)
    expected: '1.006738'
    shown: ['and the expanded form $1.006738\,\epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 1 (the numbers are ours)'}
    origin: page-own

  - id: p1-num-b-full
    where: 'Problem 1(d), check (ours): energy of the bosons from all six states, in units of ε2, for ε3 = 2ε2 and kT = 0.2 ε2'
    inputs: {}
    formula: >-
      (0 + exp(-5) + 2*exp(-10) + 2*exp(-10) + 3*exp(-15) + 4*exp(-20))/(1 + exp(-5) + exp(-10) + exp(-10) + exp(-15) + exp(-20))
    expected: '0.006874'
    shown: ['$U_B = 0.006874\,\epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 2 (the numbers are ours)'}
    origin: page-own

  - id: p1-num-b-two
    where: 'Problem 1(d), check (ours): energy of the bosons from the two leading terms, same values'
    inputs: {}
    formula: >-
      exp(-5)/(1 + exp(-5))
    expected: '0.006693'
    shown: ['the two leading terms give $0.006693\,\epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 2 (the numbers are ours)'}
    origin: page-own

  - id: p1-num-b-expanded
    where: 'Problem 1(d), check (ours): the expanded form ε2 exp(−ε2/kT), same values'
    inputs: {}
    formula: >-
      exp(-1/0.2)
    expected: '0.006738'
    shown: ['and the expanded form $0.006738\,\epsilon_2$']
    source: {cite: reading1, at: 'Problem 1(d), p. 2 (the numbers are ours)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-e
    kind: identity
    answer: p2-e
    where: 'Problem 2(a), answer box and formula "Energies of N bosons on two levels": the sum of occupation number times level energy over the two levels'
    formula: >-
      n*D
    equals: >-
      (N - n)*0 + n*D
    samples:
      n: [0, 1, 2, 3, 5]
      D: [0.5, 2, 1, 1.3, 0.8]
      N: [5, 6, 7, 8, 9]
    tolerance: 1e-12
    shown: ['tex="E_n = n\Delta, \qquad n = 0, 1, 2, \dots, N"']
    source: {cite: reading1, at: 'Problem 2(a), p. 2'}
    origin: mit

  - id: p2-count
    kind: identity
    answer: p2-count
    where: 'Problem 2(a), answer box: the number of states as the value of the partition function when every Boltzmann factor is (almost) 1, Δ/kT = 10⁻⁶'
    formula: >-
      N + 1
    equals: >-
      (1 - exp(-(N + 1)*0.000001))/(1 - exp(-0.000001))
    samples:
      N: [1, 2, 3, 5, 8]
    tolerance: 1e-5
    shown: ['That makes $N + 1$ states']
    source: {cite: reading1, at: 'Problem 2(a), p. 2'}
    origin: mit

  - id: p2-z
    kind: identity
    answer: p2-z
    where: 'Problem 2(b), answer box and formula "Partition function of N bosons on two levels": the five terms of the sum written out for N = 4'
    formula: >-
      (1 - exp(-(N + 1)*D/(k*T)))/(1 - exp(-D/(k*T)))
    equals: >-
      1 + exp(-D/(k*T)) + exp(-2*D/(k*T)) + exp(-3*D/(k*T)) + exp(-4*D/(k*T))
    samples:
      N: [4, 4, 4, 4, 4]
      D: [0.5, 2, 1, 1.3, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['= \frac{1 - e^{-(N + 1)\Delta/kT}}{1 - e^{-\Delta/kT}}" cite']
    source: {cite: reading1, at: 'Problem 2(b), p. 2'}
    origin: mit

  - id: p2-z-n7
    kind: identity
    where: 'Problem 2(b), second check of the closed form: the eight terms of the sum written out for N = 7'
    formula: >-
      (1 - exp(-(N + 1)*D/(k*T)))/(1 - exp(-D/(k*T)))
    equals: >-
      1 + exp(-D/(k*T)) + exp(-2*D/(k*T)) + exp(-3*D/(k*T)) + exp(-4*D/(k*T)) + exp(-5*D/(k*T)) + exp(-6*D/(k*T)) + exp(-7*D/(k*T))
    samples:
      N: [7, 7, 7]
      D: [0.5, 2, 1]
      k: [0.5, 2, 1]
      T: [0.6, 1.9, 1]
    tolerance: 1e-12
    shown: ['Z(N, T) = \sum_{n = 0}^{N}e^{-n\Delta/kT}']
    source: {cite: reading1, at: 'Problem 2(b), p. 2'}
    origin: mit

  - id: p2-z-one
    kind: identity
    where: 'Problem 2(b), check: for N = 1 the closed form is 1 + x, one particle with two states'
    formula: >-
      (1 - x**2)/(1 - x)
    equals: >-
      1 + x
    samples:
      x: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['$\left(1 - x^2\right)/(1 - x) = 1 + x$']
    source: {cite: reading1, at: 'Problem 2(b), p. 2 (the check is ours)'}
    origin: page-own

  - id: p2-p
    kind: identity
    answer: p2-p
    where: 'Problem 2(c), answer box and formula "Probability of n excited bosons": the Boltzmann factor over the five-term sum for N = 4'
    formula: >-
      exp(-n*D/(k*T))*(1 - exp(-D/(k*T)))/(1 - exp(-(N + 1)*D/(k*T)))
    equals: >-
      exp(-n*D/(k*T))/(1 + exp(-D/(k*T)) + exp(-2*D/(k*T)) + exp(-3*D/(k*T)) + exp(-4*D/(k*T)))
    samples:
      n: [0, 1, 2, 3, 4]
      N: [4, 4, 4, 4, 4]
      D: [0.5, 2, 1, 1.3, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['= \frac{1 - e^{-\Delta/kT}}{1 - e^{-(N + 1)\Delta/kT}}\;e^{-n\Delta/kT}']
    source: {cite: reading1, at: 'Problem 2(c), p. 3'}
    origin: mit

  - id: p2-p0
    answer: p2-p0
    where: 'Problem 2(c), answer box (our addition): p(0) for N = 3 and exp(−Δ/kT) = 1/2, from the four Boltzmann factors'
    inputs: {}
    formula: >-
      1/(1 + 1/2 + 1/4 + 1/8)
    expected: '0.533'
    shown: ['so $p(0) = \frac{8}{15} = 0.533$']
    source: {cite: reading1, at: 'Problem 2(c), p. 3 (the formula is MIT''s; the example is ours)'}
    origin: page-own

  - id: p2-p0-closed
    where: 'Problem 2(c), check: the same probability from the closed form'
    inputs: {}
    formula: >-
      (1 - 1/2)/(1 - (1/2)**4)
    expected: '0.5333'
    tolerance: 0.0001
    shown: ['= \frac12 \times \frac{16}{15} = \frac{8}{15}$']
    source: {cite: reading1, at: 'Problem 2(c), p. 3 (the check is ours)'}
    origin: page-own

  - id: p2-zd
    kind: identity
    answer: p2-zd
    where: 'Problem 2(d), answer box and formula "Partition function of N distinguishable two-level particles": the sum over n with the binomial numbers of states 1, 4, 6, 4, 1 for N = 4'
    formula: >-
      (1 + exp(-D/(k*T)))**N
    equals: >-
      1 + 4*exp(-D/(k*T)) + 6*exp(-2*D/(k*T)) + 4*exp(-3*D/(k*T)) + exp(-4*D/(k*T))
    samples:
      N: [4, 4, 4, 4, 4]
      D: [0.5, 2, 1, 1.3, 0.8]
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
    tolerance: 1e-12
    shown: ['tex="Z_d(N, T) = \left(1 + e^{-\Delta/kT}\right)^N"']
    source: {cite: reading1, at: 'Problem 2(d), p. 3'}
    origin: mit

  - id: p2-zd-n2
    where: 'Problem 2(d), check (our numbers): Z_d for N = 2 and exp(−Δ/kT) = 1/2, from its four states'
    inputs: {}
    formula: >-
      1 + 1/2 + 1/2 + 1/4
    expected: '2.25'
    shown: ['$Z_d = 2.25$']
    source: {cite: reading1, at: 'Problem 2(d), p. 3 (the numbers are ours)'}
    origin: page-own

  - id: p2-z-n2
    where: 'Problem 2(d), check (our numbers): the boson Z for N = 2 and exp(−Δ/kT) = 1/2, from its three states'
    inputs: {}
    formula: >-
      1 + 1/2 + 1/4
    expected: '1.75'
    shown: ['and $Z = 1.75$']
    source: {cite: reading1, at: 'Problem 2(d), p. 3 (the numbers are ours)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-sym
    answer: p3-sym
    where: 'Problem 3(a), answer box (our addition): symmetric combinations of two objects with 4 states each'
    inputs: {}
    formula: >-
      4*5/2
    expected: '10'
    shown: ['number $4 \times 5/2 = 10$']
    source: {cite: reading1, at: 'Problem 3(a), p. 3 (MIT counts by total spin; this count is ours)'}
    origin: page-own

  - id: p3-sym-mit
    where: 'Problem 3(a), formula "Symmetric and antisymmetric states of two spins 3/2": the states with total spin 3 and 1'
    inputs: {}
    formula: >-
      (2*3 + 1) + (2*1 + 1)
    expected: '10'
    shown: ['(2 \cdot 3 + 1) + (2 \cdot 1 + 1) = 10']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
