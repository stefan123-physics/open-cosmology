  - id: p3-ratio
    answer: p3-ratio
    where: 'Problem 3(a), answer box and formula "Ratio of the two series of Raman lines of chlorine": antisymmetric over symmetric spin states, counted as combinations'
    inputs: {}
    formula: >-
      (4*3/2)/(4*5/2)
    expected: '0.6'
    shown: ['= \frac{6}{10} = \frac35 = 0.60']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3-ratio-general
    where: 'Problem 3(a), check: I/(I + 1) for I = 3/2'
    inputs: {}
    formula: >-
      (3/2)/(3/2 + 1)
    expected: '0.6'
    shown: ['which is $\frac35$ for $I = \frac32$']
    source: {cite: reading1, at: 'Problem 3(a), p. 3 (the general form is ours)'}
    origin: page-own

  - id: p3-peak
    kind: identity
    answer: p3-peak
    where: 'Problem 3(b), answer box and formula "Rotational level at the peak of the Raman spectrum": the zero of the numerical derivative of the envelope (2L + 1) exp(−L(L + 1)Θ/T), found by a root search'
    formula: >-
      2*T/Theta
    equals: >-
      (2*solve('deriv("(2*y + 1)*exp(-y*(y + 1)*Theta/T)", "y", x)', 'x', 0.01, 3*sqrt(T/Theta)) + 1)**2
    samples:
      T: [300, 300, 300, 100, 400]
      Theta: [2.9, 0.35, 15, 3, 0.3]
    tolerance: 1e-5
    shown: ['tex="(2L + 1)^2 = \frac{2T}{\Theta_R}, \qquad L \approx \sqrt{\frac{T}{2\Theta_R}}"']
    source: {cite: reading1, at: 'Problem 3(b), p. 3'}
    origin: mit

  - id: p3-lesson-example
    where: 'Problem 3(b), check: the peak for the worked example of the lesson (Θ_R = 15.0 K at 300 K)'
    inputs: {}
    formula: >-
      sqrt(300/(2*15.0)) - 1/2
    expected: '2.7'
    shown: ['$\sqrt{10} - \frac12 = 2.7$']
    source: {cite: reading1, at: 'Problem 3(b), p. 3 (the check is ours)'}
    origin: page-own

