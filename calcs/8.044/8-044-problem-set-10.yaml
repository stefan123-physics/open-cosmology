  - id: p3-anti-mit
    where: 'Problem 3(a), same formula: the states with total spin 2 and 0'
    inputs: {}
    formula: >-
      (2*2 + 1) + (2*0 + 1)
    expected: '6'
    shown: ['(2 \cdot 2 + 1) + (2 \cdot 0 + 1) = 6']
    source: {cite: reading1, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3-anti
    where: 'Problem 3(a), check: antisymmetric combinations of two objects with 4 states each'
    inputs: {}
    formula: >-
      4*3/2
    expected: '6'
    shown: ['the antisymmetric ones $4 \times 3/2 = 6$']
    source: {cite: reading1, at: 'Problem 3(a), p. 3 (the check is ours)'}
    origin: page-own

  - id: p3-total
    where: 'Problem 3(a): the number of states of two spins 3/2'
    inputs: {}
    formula: >-
      (2*3/2 + 1)**2
    expected: '16'
    shown: ['have $4 \times 4 = 16$ states']
    source: {cite: reading1, at: 'Problem 3(d), p. 4'}
