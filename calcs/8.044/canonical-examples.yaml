# Calculations on content/year-3/8.044/canonical-examples.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 13, with the page's own example.

page: content/year-3/8.044/canonical-examples.mdx
calcs:
  - id: gaussian-integral
    where: 'slide 6: ∫ exp(−p²/2mkT) dp = √(2πmkT) per component (m k T = 1)'
    inputs: {}
    formula: integrate('exp(-p**2/2)', 'p', -40, 40)
    expected: '2.5066'
    tolerance: 0.0001
    shown: ['\lambda \equiv \frac{h}{\sqrt{2\pi mkT}}']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: gas-entropy
    kind: identity
    where: '−dF/dT for F = −NT ln(V/(N c T^(−3/2))) − NT equals N ln(V/(N c T^(−3/2))) + 5N/2 (k = 1, finite difference)'
    formula: -((-N*(T + 1e-6)*log(V/(N*c*(T + 1e-6)**(-1.5))) - N*(T + 1e-6)) - (-N*(T - 1e-6)*log(V/(N*c*(T - 1e-6)**(-1.5))) - N*(T - 1e-6)))/2e-6
    equals: N*log(V/(N*c*T**(-1.5))) + 2.5*N
    samples: {N: [1.0, 5.0], V: [1.0, 10.0], c: [0.1, 1.0], T: [1.0, 4.0]}
    tolerance: 1e-4
    shown: ['= Nk\ln\frac{V}{N\lambda^3} + \frac52Nk']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: oscillator-Z1
    where: 'slide 10: ∫∫ exp(−p²/2m − Kx²/2) dp dx = 2π√(m/K) (kT = 1, m = 2, K = 3)'
    inputs: {}
    formula: integrate('exp(-p**2/4)', 'p', -40, 40)*integrate('exp(-3*x**2/2)', 'x', -40, 40)
    expected: '5.1302'
    tolerance: 0.0005
    shown: ['Z_1 = \frac{2\pi}{h}\sqrt{\frac mK}\,kT']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: impurity-C
    kind: identity
    where: 'd/dT of g e^(−1/T)/(1 + g e^(−1/T)) (ε = k = 1) equals the plotted C/Nk'
    formula: (g*exp(-1/(T + 1e-6))/(1 + g*exp(-1/(T + 1e-6))) - g*exp(-1/(T - 1e-6))/(1 + g*exp(-1/(T - 1e-6))))/2e-6
    equals: g*(1/T)**2*exp(-1/T)/(1 + g*exp(-1/T))**2
    samples: {g: [1.0, 5.0], T: [0.2, 2.5]}
    tolerance: 1e-5
    shown: ['C/Nk = g(ε/kT)² e^(−ε/kT)/(1 + g e^(−ε/kT))²']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: impurity-peak-g1
    where: 'plot caption: for g = 1 the peak is at kT/ε where x tanh(x/2) = 2 (x = ε/kT)'
    inputs: {}
    formula: 1/solve('x*(exp(x) - 1)/(exp(x) + 1) - 2', 'x', 1, 4)
    expected: '0.417'
    tolerance: 0.001
    shown: ['a taller peak that moves to lower temperature']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: impurity-peak-g5
    where: 'plot caption: for g = 5 the peak of C/Nk lies at a lower kT/ε (zero of dC/dt)'
    inputs: {}
    formula: solve("deriv('5*(1/u)**2*exp(-1/u)/(1 + 5*exp(-1/u))**2', 'u', t)", 't', 0.2, 0.6)
    expected: '0.32'
    tolerance: 0.005
    shown: ['Move g from 1 to 5']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: impurity-pressure
    kind: identity
    where: 'P = −(∂F/∂ε)(∂ε/∂V) with F = −NT ln(1 + g e^(−ε/T)), ε = e0 (V/V0)^(−γ), equals γU/V (finite difference in V, k = 1)'
    formula: -((-N*T*log(1 + g*exp(-e0*((V + 1e-6)/V0)**(-q)/T))) - (-N*T*log(1 + g*exp(-e0*((V - 1e-6)/V0)**(-q)/T))))/2e-6
    equals: q*(N*e0*(V/V0)**(-q)*g*exp(-e0*(V/V0)**(-q)/T)/(1 + g*exp(-e0*(V/V0)**(-q)/T)))/V
    samples: {N: [1.0, 5.0], T: [0.5, 2.0], g: [1.0, 4.0], e0: [0.5, 2.0], V: [0.5, 2.0], V0: [1.0, 1.5], q: [0.5, 3.0]}
    tolerance: 1e-4
    shown: ['= \gamma\,\frac UV']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: ex-a-prod
    where: 'example (a): 2π m k T'
    inputs: {}
    formula: 2*pi*6.6465e-27*1.380649e-23*300
    expected: '1.730e-46'
    tolerance: 0.001e-46
    shown: ['$2\pi mkT \approx 1.730 \times 10^{-46}$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-a
    where: 'example (a): λ = h/√(2πmkT) m'
    inputs: {}
    formula: 6.62607e-34/sqrt(2*pi*6.6465e-27*1.380649e-23*300)
    expected: '5.04e-11'
    tolerance: 0.005e-11
    shown: ['\approx 5.04 \times 10^{-11}$ m']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-b-n
    where: 'example (b): P/kT m⁻³'
    inputs: {}
    formula: 101325/(1.380649e-23*300)
    expected: '2.446e25'
    tolerance: 0.001e25
    shown: ['$n = P/kT \approx 2.446 \times 10^{25}$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-b
    where: 'example (b): n λ³'
    inputs: {}
    formula: 101325/(1.380649e-23*300)*(6.62607e-34/sqrt(2*pi*6.6465e-27*1.380649e-23*300))**3
    expected: '3.13e-6'
    tolerance: 0.005e-6
    shown: ['$n\lambda^3 \approx 3.13 \times 10^{-6}$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-c-ln
    where: 'example (c): ln(1/nλ³)'
    inputs: {}
    formula: -log(101325/(1.380649e-23*300)*(6.62607e-34/sqrt(2*pi*6.6465e-27*1.380649e-23*300))**3)
    expected: '12.68'
    tolerance: 0.005
    shown: ['\approx 12.68 + 2.50 = 15.18$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-c
    where: 'example (c): (ln(1/nλ³) + 5/2) × 8.314 J/K per mole'
    inputs: {}
    formula: (-log(101325/(1.380649e-23*300)*(6.62607e-34/sqrt(2*pi*6.6465e-27*1.380649e-23*300))**3) + 2.5)*8.314
    expected: '126.2'
    tolerance: 0.05
    shown: ['\approx 126.2$ J/K per mole']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-d-num
    where: 'example (d): 2 e^(−1)'
    inputs: {}
    formula: 2*exp(-1)
    expected: '0.736'
    tolerance: 0.0005
    shown: ['\approx 0.736/1.736 \approx 0.424$']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-d
    where: 'example (d): 2e^(−1)/(1 + 2e^(−1))'
    inputs: {}
    formula: 2*exp(-1)/(1 + 2*exp(-1))
    expected: '0.424'
    tolerance: 0.0005
    shown: ['occupied 42% of the time']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-d-g1
    where: 'example (d): g = 1 gives 1/(e + 1)'
    inputs: {}
    formula: 1/(e + 1)
    expected: '0.27'
    tolerance: 0.005
    shown: ['against 27% for $g = 1$']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own
