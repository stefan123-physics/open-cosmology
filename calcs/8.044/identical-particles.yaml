# Calculations on content/year-3/8.044/identical-particles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 17, with the page's own example.

page: content/year-3/8.044/identical-particles.mdx
calcs:
  - id: ex-a-dist
    where: 'example (a): 3 × 3 ordered products'
    inputs: {}
    formula: 3*3
    expected: '9'
    tolerance: 0
    shown: ['$3 \times 3 = 9$ ordered products']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-a-bose
    where: 'example (a): 3 doubly occupied + C(3,2) = 3 pairs'
    inputs: {}
    formula: 3 + 3*2/2
    expected: '6'
    tolerance: 0
    shown: ['$6$ in all']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-b
    where: 'example (b): lithium-7 constituents 3 + 4 + 3'
    inputs: {}
    formula: 3 + 4 + 3
    expected: '10'
    tolerance: 0
    shown: ['3 protons, 4 neutrons and 3 electrons make 10 spin-½ constituents']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-c-fermi
    where: 'example (c): 2·1 + 2·4 + 1·9 (units ε₁)'
    inputs: {}
    formula: 2*1 + 2*4 + 1*9
    expected: '19'
    tolerance: 0
    shown: ['$E = 2(1) + 2(4) + 1(9) = 19\epsilon_1$']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-c-bose
    where: 'example (c): 5 bosons in n = 1 (units ε₁)'
    inputs: {}
    formula: 5*1
    expected: '5'
    tolerance: 0
    shown: ['$E = 5\epsilon_1$']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-c-ratio
    where: 'example (c): 19/5'
    inputs: {}
    formula: 19/5
    expected: '3.8'
    tolerance: 0.2
    shown: ['almost four times less']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own
