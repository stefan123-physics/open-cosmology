    formula: >-
      k*T/(2*pi)
    equals: >-
      (2*R*k*T/pi)/(R + R)**2*R
    samples:
      k: [0.5, 2, 1, 1.3, 0.8]
      T: [0.6, 1.9, 1, 0.7, 1.4]
      R: [0.5, 2, 1, 1.4, 3]
    tolerance: 1e-9
