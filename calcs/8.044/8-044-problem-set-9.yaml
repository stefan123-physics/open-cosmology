  - id: p5-spectrum
    kind: identity
    answer: p5-spectrum
    where: 'Problem 5(c), answer box and formula "Noise spectrum of the voltage on the capacitor": the source spectrum times the divider ratio of the impedance sizes, (1/ωC)² over R² + (1/ωC)²'
    formula: >-
      2*R*k*T/(pi*(1 + (omega*R*C)**2))
    equals: >-
      (2*R*k*T/pi)*(1/(omega*C))**2/(R**2 + (1/(omega*C))**2)
    samples:
