  # ---- Problem 5

  - id: p5-power
    kind: identity
    answer: p5-power
    where: 'Problem 5(a), answer box and formula "Power dissipated in the matched line by the noise source": the mean square current through two resistors R in series, times R'
    formula: >-
      vN2/(4*R)
    equals: >-
      (vN2/(R + R)**2)*R
    samples:
      vN2: [0.5, 3, 1, 1.7, 2.2]
      R: [0.5, 2, 1, 1.4, 3]
    tolerance: 1e-9
    shown: ['= \frac{\langle v_{\text{line}}^2\rangle}{R} = \frac{1}{4R}\,\langle v_N^2(\omega)\rangle']
    source: {cite: reading1, at: 'Problem 5(a), p. 5'}
    origin: mit

  - id: p5-source
    kind: identity
