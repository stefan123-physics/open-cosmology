  - id: p5-total
    kind: identity
    answer: p5-total
    where: 'Problem 5(c), second answer box and formula "Mean square noise voltage on the capacitor from the spectrum": the integral of the spectrum over all ω, done numerically after the substitution ω = tan(q)/RC'
    formula: >-
