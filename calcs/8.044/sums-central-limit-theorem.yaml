# Calculations on content/year-3/8.044/sums-central-limit-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 4 and probability notes, Chapter 4, with the page's own example.

page: content/year-3/8.044/sums-central-limit-theorem.mdx
calcs:
  - id: unpolarized
    where: 'convolution of two intensity densities (σ = 1): ∫_0^I e^{−u/2}e^{−(I−u)/2}/(2π√(u(I−u))) du = e^{−I/2}/2 at I = 1.3'
    inputs: {}
    formula: '(1/(2*pi))*exp(-1.3/2)*integrate("1/sqrt((1.3/2)**2 - w**2)", "w", -0.649999, 0.649999)'
    expected: '0.2611'
    tolerance: 0.002
    shown: ['$p(I_T) = \frac{1}{2\sigma}e^{-I_T/(2\sigma)}$']
    source: {cite: reading1, at: 'p. 54'}
    origin: mit

  - id: four-uniform-variance
    where: '4 × a²/3 with a = 1'
    inputs: {}
    formula: 4*(1/3)
    expected: '1.333'
    tolerance: 0.001
    shown: ['the Gaussian of variance $4a^2/3$']
    source: {cite: reading1, at: 'p. 62'}
    origin: mit

  - id: gamma-norm
    where: 'plot: ∫ S^{n−1} e^{−S}/Γ(n) dS = 1 for n = 5'
    inputs: {}
    formula: 'integrate("S**4*exp(-S)/24", "S", 0, 80)'
    expected: '1'
    tolerance: 1e-6
    shown: ['by n ≈ 20 they are close']
    source: {cite: reading1, at: 'p. 63'}
    origin: mit

  - id: die-variance
    where: 'example (a): variance of one die, (1 + 4 + … + 36)/6 − 3.5²'
    inputs: {}
    formula: (1 + 4 + 9 + 16 + 25 + 36)/6 - 3.5**2
    expected: '2.917'
    tolerance: 0.001
    shown: ['$\frac{35}{12} \approx 2.92$']
    source: {cite: reading1, at: 'p. 48'}
    origin: page-own

  - id: dice-variance
    where: 'example (a): 10 × 35/12'
    inputs: {}
    formula: 10*35/12
    expected: '29.2'
    tolerance: 0.05
    shown: ['variance about 29.2']
    source: {cite: reading1, at: 'p. 48'}
    origin: page-own

  - id: dice-sd
    where: 'example (a): √(350/12)'
    inputs: {}
    formula: sqrt(350/12)
    expected: '5.40'
    tolerance: 0.005
    shown: ['standard deviation about 5.40']
    source: {cite: reading1, at: 'p. 48'}
    origin: page-own

  - id: dice-z
    where: 'example (a): 9.5/5.40'
    inputs: {}
    formula: 9.5/sqrt(350/12)
    expected: '1.76'
    tolerance: 0.005
    shown: ['$9.5/5.40 \approx 1.76$']
    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  - id: dice-tail
    where: 'example (a): Gaussian tail above 1.759 σ'
    inputs: {}
    formula: erfc(9.5/sqrt(350/12)/sqrt(2))/2
    expected: '0.039'
    tolerance: 0.0005
    shown: ['the Gaussian gives about 0.039']
    source: {cite: reading1, at: 'p. 60'}
    origin: page-own

  - id: light-burst
    where: 'example (b): e^{−2}'
    inputs: {}
    formula: exp(-2)
    expected: '0.135'
    tolerance: 0.0005
    shown: ['= e^{-2} \approx 0.135$']
    source: {cite: reading1, at: 'p. 54'}
    origin: page-own

  - id: maser-sd
    where: 'example (c): √25 τ'
    inputs: {}
    formula: sqrt(25)
    expected: '5'
    tolerance: 1e-12
    shown: ['so the standard deviation is $5\tau$']
    source: {cite: reading1, at: 'p. 48'}
    origin: page-own
