# Calculations on content/year-3/8.044/canonical-ensemble.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 12 and notes on the canonical ensemble, with the page's own example.

page: content/year-3/8.044/canonical-ensemble.mdx
calcs:
  - id: fridge-cop
    kind: identity
    where: '|Q_C|/(|Q_H| − |Q_C|) with |Q_C|/|Q_H| = T_C/T_H equals T_C/(T_H − T_C)'
    formula: (Q*TC/TH)/(Q - Q*TC/TH)
    equals: TC/(TH - TC)
    samples: {Q: [1.0, 10.0], TC: [100.0, 280.0], TH: [300.0, 600.0]}
    tolerance: 1e-9
    shown: ['\frac{|Q_C|}{W} = \frac{T_C}{T_H - T_C}']
    source: {cite: mit, at: 'slide 1'}
    origin: mit

  - id: heat-pump-cop
    kind: identity
    where: '|Q_H|/(|Q_H| − |Q_C|) with |Q_C|/|Q_H| = T_C/T_H equals T_H/(T_H − T_C)'
    formula: Q/(Q - Q*TC/TH)
    equals: TH/(TH - TC)
    samples: {Q: [1.0, 10.0], TC: [100.0, 280.0], TH: [300.0, 600.0]}
    tolerance: 1e-9
    shown: ['\frac{|Q_H|}{W} = \frac{T_H}{T_H - T_C}']
    source: {cite: mit, at: 'slide 3'}
    origin: mit

  - id: slide4-TC
    where: 'slide 4: 55 °F in kelvin'
    inputs: {}
    formula: (55 - 32)*5/9 + 273.15
    expected: '286'
    tolerance: 0.5
    shown: ['surface at 286 K (55 °F']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: slide4-TH
    where: 'slide 4: 70 °F in kelvin'
    inputs: {}
    formula: (70 - 32)*5/9 + 273.15
    expected: '294'
    tolerance: 0.5
    shown: ['heating a room to 294 K (70 °F)']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: slide4-cop
    where: 'slide 4: 294/8'
    inputs: {}
    formula: 294/(294 - 286)
    expected: '37'
    tolerance: 0.5
    shown: ['$|Q_H|/W = 294/8 \approx 37$']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: ex-a
    where: 'example (a): 255/45'
    inputs: {}
    formula: 255/(300 - 255)
    expected: '5.67'
    tolerance: 0.005
    shown: ['$T_C/(T_H - T_C) = 255/45 \approx 5.67$']
    source: {cite: mit, at: 'slide 1'}
    origin: page-own

  - id: ex-b
    where: 'example (b): 293/23'
    inputs: {}
    formula: 293/(293 - 270)
    expected: '12.7'
    tolerance: 0.05
    shown: ['$T_H/(T_H - T_C) = 293/23 \approx 12.7$']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-c-Z
    where: 'example (c): 1 + e^(−1)'
    inputs: {}
    formula: 1 + exp(-1)
    expected: '1.368'
    tolerance: 0.0005
    shown: ['$Z = 1 + e^{-\epsilon/kT} = 1 + e^{-1} \approx 1.368$']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-c-p
    where: 'example (c): e^(−1)/(1 + e^(−1)) = 1/(e + 1)'
    inputs: {}
    formula: exp(-1)/(1 + exp(-1))
    expected: '0.269'
    tolerance: 0.0005
    shown: ['$e^{-1}/Z = 1/(e + 1) \approx 0.269$']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-c-F
    where: 'example (c): −ln(1 + e^(−1))'
    inputs: {}
    formula: -log(1 + exp(-1))
    expected: '-0.313'
    tolerance: 0.0005
    shown: ['$F/kT = -\ln Z \approx -0.313$']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own
