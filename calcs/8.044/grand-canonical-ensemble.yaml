# Calculations on content/year-3/8.044/grand-canonical-ensemble.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 18, with the page's own example.

page: content/year-3/8.044/grand-canonical-ensemble.mdx
calcs:
  - id: ideal-gas-mu
    kind: identity
    where: 'dF/dN for F = −T(N ln Z1 − N ln N + N) equals −T ln(Z1/N) (k = 1, finite difference)'
    formula: ((-T*((N + 1e-6)*log(Z1) - (N + 1e-6)*log(N + 1e-6) + N + 1e-6)) - (-T*((N - 1e-6)*log(Z1) - (N - 1e-6)*log(N - 1e-6) + N - 1e-6)))/2e-6
    equals: -T*log(Z1/N)
    samples: {T: [0.5, 3.0], N: [5.0, 50.0], Z1: [100.0, 1000.0]}
    tolerance: 1e-5
    shown: ['= -kT\ln\frac{V}{N\lambda^3} = kT\ln\left(n\lambda^3\right)']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: adsorption-equilibrium
    kind: identity
    where: 'with σ = λ n e^(ε0/T), −ε0 + T ln(σλ²) equals T ln(nλ³) (k = 1)'
    formula: -e0 + T*log(lam*n*exp(e0/T)*lam**2)
    equals: T*log(n*lam**3)
    samples: {e0: [0.1, 2.0], T: [0.5, 3.0], lam: [0.1, 1.0], n: [0.01, 0.5]}
    tolerance: 1e-9
    shown: ['\sigma = \lambda\,n\,e^{\epsilon_0/kT}']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: occupation-FD
    kind: identity
    where: 'd/dμ of T ln(1 + e^((μ − ε)/T)) equals 1/(e^((ε − μ)/T) + 1)'
    formula: (T*log(1 + exp((m + 1e-6 - x)/T)) - T*log(1 + exp((m - 1e-6 - x)/T)))/2e-6
    equals: 1/(exp((x - m)/T) + 1)
    samples: {T: [0.5, 2.0], m: [-1.0, 1.0], x: [-2.0, 2.0]}
    tolerance: 1e-5
    shown: ['\langle n_\alpha\rangle = \frac{1}{e^{(\epsilon_\alpha - \mu)/kT} \pm 1}']
    source: {cite: mit, at: 'slide 27'}
    origin: mit

  - id: occupation-BE
    kind: identity
    where: 'd/dμ of −T ln(1 − e^((μ − ε)/T)) equals 1/(e^((ε − μ)/T) − 1) for ε > μ'
    formula: (-T*log(1 - exp((m + 1e-6 - x)/T)) + T*log(1 - exp((m - 1e-6 - x)/T)))/2e-6
    equals: 1/(exp((x - m)/T) - 1)
    samples: {T: [0.5, 2.0], m: [-2.0, -1.0], x: [0.0, 2.0]}
    tolerance: 1e-4
    shown: ['\ln\Xi_{\text{BE}} = -\sum_\alpha\ln\left(1 - e^{(\mu - \epsilon_\alpha)/kT}\right)']
    source: {cite: mit, at: 'slide 26'}
    origin: mit

  - id: ex-a-kT
    where: 'example (a): k × 300 K in eV'
    inputs: {}
    formula: 1.380649e-23*300/1.602177e-19
    expected: '0.02585'
    tolerance: 0.000005
    shown: ['$kT \approx 0.02585$ eV']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-a-ratio
    where: 'example (a): 0.1 eV/kT'
    inputs: {}
    formula: 0.1*1.602177e-19/(1.380649e-23*300)
    expected: '3.868'
    tolerance: 0.0005
    shown: ['$\epsilon_0/kT \approx 3.868$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-a-boltz
    where: 'example (a): e^(ε0/kT)'
    inputs: {}
    formula: exp(0.1*1.602177e-19/(1.380649e-23*300))
    expected: '47.9'
    tolerance: 0.05
    shown: ['$e^{\epsilon_0/kT} \approx 47.9$']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-a-lambda
    where: 'example (a): h/√(2π m k T) m'
    inputs: {}
    formula: 6.62607e-34/sqrt(2*pi*4.65e-26*1.380649e-23*300)
    expected: '1.905e-11'
    tolerance: 0.001e-11
    shown: ['\approx 1.905 \times 10^{-11}$ m']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-a-n
    where: 'example (a): 100 Pa/kT m⁻³'
    inputs: {}
    formula: 100/(1.380649e-23*300)
    expected: '2.414e22'
    tolerance: 0.001e22
    shown: ['$n = P/kT \approx 2.414 \times 10^{22}$']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-a-sigma
    where: 'example (a): λ n e^(ε0/kT) m⁻²'
    inputs: {}
    formula: 6.62607e-34/sqrt(2*pi*4.65e-26*1.380649e-23*300)*100/(1.380649e-23*300)*exp(0.1*1.602177e-19/(1.380649e-23*300))
    expected: '2.2e13'
    tolerance: 0.05e13
    shown: ['\approx 2.2 \times 10^{13}$ m⁻²']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-b-fd
    where: 'example (b): 1/(e + 1)'
    inputs: {}
    formula: 1/(e + 1)
    expected: '0.269'
    tolerance: 0.0005
    shown: ['Fermi–Dirac $1/(e + 1) \approx 0.269$']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own

  - id: ex-b-be
    where: 'example (b): 1/(e − 1)'
    inputs: {}
    formula: 1/(e - 1)
    expected: '0.582'
    tolerance: 0.0005
    shown: ['Bose–Einstein $1/(e - 1) \approx 0.582$']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own

  - id: ex-b-cl
    where: 'example (b): e^(−1)'
    inputs: {}
    formula: exp(-1)
    expected: '0.368'
    tolerance: 0.0005
    shown: ['classical $e^{-1} \approx 0.368$']
    source: {cite: mit, at: 'slide 27'}
    origin: page-own
