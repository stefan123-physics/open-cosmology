# Calculations on content/year-3/8.044/thermal-radiation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 15, with the page's own example.

page: content/year-3/8.044/thermal-radiation.mdx
calcs:
  - id: flux-quarter
    where: 'slide 8: ∫ cosθ sinθ dθ (0 to π/2) × (1/2) = 1/4'
    inputs: {}
    formula: 0.5*integrate('cos(t)*sin(t)', 't', 0, pi/2)
    expected: '0.25'
    tolerance: 1e-6
    shown: ['\text{energy flux onto } dA = \frac14\,c\,u(\omega, T)']
    source: {cite: mit, at: 'slide 8'}
    origin: mit

  - id: pressure-third
    where: 'slide 10: 2 × (1/2) ∫ cos²θ sinθ dθ (0 to π/2) = 1/3'
    inputs: {}
    formula: integrate('cos(t)**2*sin(t)', 't', 0, pi/2)
    expected: '0.3333'
    tolerance: 1e-4
    shown: ['P(T) = \frac13\int_0^\infty u(\omega, T)\,d\omega']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: h-over-k
    where: 'slide 2: h/k in K s'
    inputs: {}
    formula: 6.62607e-34/1.380649e-23
    expected: '5e-11'
    tolerance: 0.3e-11
    shown: ['$h/k \approx 5 \times 10^{-11}$ K s']
    source: {cite: mit, at: 'slide 2'}
    origin: mit

  - id: microwave-T
    where: 'slide 3: h × 1e10 Hz/(2.82k), the factor the slide table uses'
    inputs: {}
    formula: 6.62607e-34*1e10/(2.82*1.380649e-23)
    expected: '0.17'
    tolerance: 0.01
    shown: ['go with about 0.17 K']
    source: {cite: mit, at: 'slide 3'}
    origin: mit

  - id: mode-count
    kind: identity
    where: '2 × (1/8) × (4/3)π (Lω/πc)³ equals L³ω³/(3π²c³)'
    formula: 2*(1/8)*(4/3)*pi*(L*w/(pi*c))**3
    equals: L**3*w**3/(3*pi**2*c**3)
    samples: {L: [0.5, 2.0], w: [1.0, 10.0], c: [1.0, 3.0]}
    tolerance: 1e-9
    shown: ['= L^3\omega^3/3\pi^2c^3$']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: planck-peak
    where: 'slide 22: maximum of x³/(eˣ − 1) where 3(1 − e^(−x)) = x'
    inputs: {}
    formula: solve('3*(1 - exp(-x)) - x', 'x', 1, 5)
    expected: '2.82'
    tolerance: 0.005
    shown: ['puts the maximum at $\hbar\omega/kT \approx 2.82$']
    source: {cite: mit, at: 'slide 22'}
    origin: mit

  - id: plot-peak-y
    where: 'plot point: x³/(eˣ − 1) at x = 2.8214'
    inputs: {}
    formula: 2.8214**3/(exp(2.8214) - 1)
    expected: '1.4214'
    tolerance: 0.0005
    shown: ['{ x: 2.8214, y: 1.4214, label: "peak" }']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: log-integral
    where: 'slide 24: ∫ x² ln(1 − e^(−x)) dx from 0 to ∞ = −π⁴/45'
    inputs: {}
    formula: integrate('x**2*log(1 - exp(-x))', 'x', 1e-9, 60)
    expected: '-2.1646'
    tolerance: 0.0005
    shown: ['\int_0^\infty x^2\ln(1 - e^{-x})\,dx = -\pi^4/45']
    source: {cite: mit, at: 'slide 24'}
    origin: mit

  - id: energy-from-F
    kind: identity
    where: 'E = F + TS with F = −(π²/45)T⁴V and S = −dF/dT equals (π²/15)T⁴V (k = ħ = c = 1)'
    formula: -(pi**2/45)*T**4*V + T*(4*pi**2/45)*T**3*V
    equals: (pi**2/15)*T**4*V
    samples: {T: [0.5, 3.0], V: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['E = F + TS = \frac{\pi^2}{15}\frac{(kT)^4}{(\hbar c)^3}V']
    source: {cite: mit, at: 'slide 25'}
    origin: mit

  - id: ex-a-sigma
    where: 'example (a): π² k⁴/(60 ħ³ c²)'
    inputs: {}
    formula: pi**2*1.380649e-23**4/(60*1.054572e-34**3*2.99792e8**2)
    expected: '5.670e-8'
    tolerance: 0.001e-8
    shown: ['\approx 5.670 \times 10^{-8}$ W m⁻² K⁻⁴']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-b
    where: 'example (b): σ × 300⁴ W'
    inputs: {}
    formula: 5.670e-8*300**4
    expected: '459'
    tolerance: 0.5
    shown: ['\approx 459$ W']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-c-flux
    where: 'example (c): σ × 5772⁴ W/m²'
    inputs: {}
    formula: 5.670e-8*5772**4
    expected: '6.29e7'
    tolerance: 0.005e7
    shown: ['\approx 6.29 \times 10^7$ W/m²']
    source: {cite: mit, at: 'slide 15'}
    origin: page-own

  - id: ex-c-peak
    where: 'example (c): 2.82 k × 5772/h Hz'
    inputs: {}
    formula: 2.82*1.380649e-23*5772/6.62607e-34
    expected: '3.39e14'
    tolerance: 0.005e14
    shown: ['\approx 3.39 \times 10^{14}$ Hz']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: cmb-u
    where: 'callout: (π²/15)(k × 2.725)⁴/(ħc)³ J/m³'
    inputs: {}
    formula: pi**2/15*(1.380649e-23*2.725)**4/(1.054572e-34*2.99792e8)**3
    expected: '4.17e-14'
    tolerance: 0.005e-14
    shown: ['about $4.17 \times 10^{-14}$ J/m³ today']
    source: {cite: mit, at: 'slide 25'}
    origin: page-own
