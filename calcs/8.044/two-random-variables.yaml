# Calculations on content/year-3/8.044/two-random-variables.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 2 and probability notes, Chapter 2, with the page's own example.

page: content/year-3/8.044/two-random-variables.mdx
calcs:
  - id: disk-marginal
    where: 'uniform disk: ∫ (1/π) dy over |y| ≤ √(1 − x²) at x = 0.6 equals (2/π)√(1 − 0.36)'
    inputs: {}
    formula: (1/pi)*2*sqrt(1 - 0.6**2)
    expected: '0.5093'
    tolerance: 0.0001
    shown: ['$p(x) = \frac{2}{\pi}\sqrt{1 - x^2}$']
    source: {cite: reading1, at: 'p. 22'}
    origin: mit

  - id: disk-marginal-norm
    where: '∫ (2/π)√(1 − x²) dx over (−1, 1) = 1'
    inputs: {}
    formula: '(2/pi)*integrate("sqrt(1 - x**2)", "x", -1, 1)'
    expected: '1'
    tolerance: 1e-6
    shown: ['for $|x| \le 1$, and the same form for $y$']
    source: {cite: reading1, at: 'p. 23'}
    origin: mit

  - id: poisson-recursion
    kind: identity
    where: 'd/dL [(rL)ⁿ e^{−rL}/n!] = r p(n − 1) − r p(n), checked for n = 3 by finite difference'
    formula: (((r*(L + 1e-6))**3*exp(-r*(L + 1e-6)) - (r*(L - 1e-6))**3*exp(-r*(L - 1e-6)))/6)/2e-6
    equals: r*(r*L)**2*exp(-r*L)/2 - r*(r*L)**3*exp(-r*L)/6
    samples: {r: [0.5, 2.0], L: [1.0, 3.0]}
    tolerance: 1e-6
    shown: ['+ r\,p(n; L) = r\,p(n - 1; L)']
    source: {cite: reading1, at: 'p. 27'}
    origin: mit

  - id: conditional-gaussian
    kind: identity
    where: 'p(v1, v2)/p(v1) equals the Gaussian with mean ρv1 and variance σ²(1 − ρ²) (σ = 1)'
    formula: (exp(-(a**2 - 2*q*a*b + b**2)/(2*(1 - q**2)))/(2*pi*sqrt(1 - q**2)))/(exp(-a**2/2)/sqrt(2*pi))
    equals: exp(-(b - q*a)**2/(2*(1 - q**2)))/sqrt(2*pi*(1 - q**2))
    samples: {a: [0.4, 1.5], b: [-0.3, 1.1], q: [0.2, 0.8]}
    tolerance: 1e-12
    shown: ['\exp\left(-\frac{\left(v_2 - \rho v_1\right)^2}']
    source: {cite: reading1, at: 'p. 31'}
    origin: mit

  - id: resonance-half-period
    where: 'half a period of 500 Hz, in ms'
    inputs: {}
    formula: 1000/(2*500)
    expected: '1'
    tolerance: 1e-12
    shown: ['half a period (1 ms) later']
    source: {cite: reading1, at: 'p. 34'}
    origin: mit

  - id: ex-triangle-norm
    where: 'example (a): ∫∫ 2 over the triangle = 1'
    inputs: {}
    formula: 'integrate("2*x", "x", 0, 1)'
    expected: '1'
    tolerance: 1e-9
    shown: ['$p(x, y) = 2$ there']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: ex-mean-x
    where: 'example (b): ∫ 2x² dx'
    inputs: {}
    formula: 'integrate("2*x**2", "x", 0, 1)'
    expected: '0.6667'
    tolerance: 0.0001
    shown: ['$\langle x\rangle = \int_0^12x^2dx = \frac23$']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: ex-mean-y
    where: 'example (b): ∫ 2y(1 − y) dy'
    inputs: {}
    formula: 'integrate("2*y*(1 - y)", "y", 0, 1)'
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['= \frac13$, and']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: ex-mean-xy
    where: 'example (b): ∫ x³ dx'
    inputs: {}
    formula: 'integrate("x**3", "x", 0, 1)'
    expected: '0.25'
    tolerance: 1e-9
    shown: ['= \int_0^1x^3dx = \frac14$']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: ex-cov
    where: 'example (b): 1/4 − 2/9'
    inputs: {}
    formula: 1/4 - 2/9
    expected: '0.02778'
    tolerance: 0.00001
    shown: ['\frac14 - \frac29 = \frac{1}{36}$']
    source: {cite: reading1, at: 'p. 33'}
    origin: page-own

  - id: ex-cond-mean
    where: 'example (c): 0.8 × 1.5 mV'
    inputs: {}
    formula: 0.8*1.5
    expected: '1.2'
    tolerance: 1e-9
    shown: ['$\rho v_1 = 0.8 \times 1.5 = 1.2$ mV']
    source: {cite: reading1, at: 'p. 31'}
    origin: page-own

  - id: ex-cond-sd
    where: 'example (c): 1.0 √(1 − 0.64) mV'
    inputs: {}
    formula: 1.0*sqrt(1 - 0.8**2)
    expected: '0.6'
    tolerance: 1e-9
    shown: ['$\sigma\sqrt{1 - \rho^2} = 0.6$ mV']
    source: {cite: reading1, at: 'p. 31'}
    origin: page-own
