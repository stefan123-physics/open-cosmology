# Calculations on content/year-3/8.044/maxwell-relations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 10 and the note on Maxwell relations, with the page's own example.

page: content/year-3/8.044/maxwell-relations.mdx
calcs:
  - id: ideal-gas-cp-cv
    kind: identity
    where: 'TVα²/κ_T with α = 1/T, κ_T = 1/P and P = NkT/V equals Nk (k = 1)'
    formula: T*V*(1/T)**2/(1/(N*T/V))
    equals: N
    samples: {T: [100.0, 600.0], V: [0.5, 3.0], N: [1.0, 10.0]}
    tolerance: 1e-9
    shown: ['$C_P - C_V = PV/T = Nk$']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: entropy-monatomic
    kind: identity
    where: '(3/2)N ln(T/T0) + N ln(V/V0) equals N ln[(V/V0)(T/T0)^(3/2)] (k = 1)'
    formula: 1.5*N*log(T/T0) + N*log(V/V0)
    equals: N*log((V/V0)*(T/T0)**1.5)
    samples: {N: [1.0, 5.0], T: [100.0, 600.0], T0: [100.0, 600.0], V: [0.5, 3.0], V0: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['$S(T, V) - S(T_0, V_0) = Nk\ln[(V/V_0)(T/T_0)^{3/2}]$']
    source: {cite: mit, at: 'slide 9'}
    origin: mit

  - id: vdw-energy-eq
    kind: identity
    where: 'T (∂P/∂T)_V − P for P = RT/(V − b) − a/V² equals a/V² (finite difference in T)'
    formula: T*(((R*(T + 1e-4)/(V - b) - a/V**2) - (R*(T - 1e-4)/(V - b) - a/V**2))/2e-4) - (R*T/(V - b) - a/V**2)
    equals: a/V**2
    samples: {R: [8.314, 8.314], T: [200.0, 500.0], V: [0.01, 0.05], b: [1e-5, 4e-5], a: [0.1, 0.4]}
    tolerance: 1e-4
    shown: ['$(\partial U/\partial V)_T = a/V^2$']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-a-inv1
    where: 'example (a): 1/0.0224'
    inputs: {}
    formula: 1/0.0224
    expected: '44.64'
    tolerance: 0.005
    shown: ['(44.64 - 22.32)']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-a-inv2
    where: 'example (a): 1/0.0448'
    inputs: {}
    formula: 1/0.0448
    expected: '22.32'
    tolerance: 0.005
    shown: ['(44.64 - 22.32)']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-a
    where: 'example (a): 0.137 × (1/0.0224 − 1/0.0448) J'
    inputs: {}
    formula: 0.137*(1/0.0224 - 1/0.0448)
    expected: '3.06'
    tolerance: 0.005
    shown: ['\approx 3.06$ J']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-b
    where: 'example (b): 293 × 1.805e-5 × (2.07e-4)² / 4.59e-10 J/K'
    inputs: {}
    formula: 293*1.805e-5*(2.07e-4)**2/4.59e-10
    expected: '0.494'
    tolerance: 0.0005
    shown: ['\approx 0.494$ J/K per mole']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-b-percent
    where: 'example (b): 0.494/75 is under 1%'
    inputs: {}
    formula: 0.494/75*100
    expected: '0.66'
    tolerance: 0.34
    shown: ['under 1% of water']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-c
    where: 'example (c): 2.5 × 8.314 × ln 2 J/K'
    inputs: {}
    formula: 2.5*8.314*log(2)
    expected: '14.41'
    tolerance: 0.005
    shown: ['\approx 14.41$ J/K']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own
