# Calculations on content/year-3/8.044/entropy-temperature-second-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 8 and notes on the microcanonical ensemble, with the page's own example.

page: content/year-3/8.044/entropy-temperature-second-law.mdx
calcs:
  - id: ideal-gas-dSdE
    kind: identity
    where: 'd/dE of kN ln[V(4πemE/3N)^(3/2)] equals (3/2)Nk/E (finite difference, k = 1)'
    formula: (N*log(V*(4*pi*e*m*(E + 1e-6)/(3*N))**1.5) - N*log(V*(4*pi*e*m*(E - 1e-6)/(3*N))**1.5))/2e-6
    equals: 1.5*N/E
    samples: {N: [1.0, 5.0], V: [0.5, 3.0], m: [0.2, 2.0], E: [1.0, 4.0]}
    tolerance: 1e-5
    shown: ['\frac1T = \left(\frac{\partial S}{\partial E}\right)_{N,V} = \frac{\frac32Nk}{E}']
    source: {cite: mit, at: 'slide 10'}
    origin: mit

  - id: adiabat-from-S
    kind: identity
    where: 'S = N ln[V (2π e m T)^(3/2)] (k = 1): with VT^(3/2) fixed, S does not change'
    formula: N*log(V*(2*pi*e*m*T)**1.5)
    equals: N*log((V/8)*(2*pi*e*m*T*8**(2/3))**1.5)
    samples: {N: [1.0, 5.0], V: [0.5, 3.0], m: [0.2, 2.0], T: [1.0, 4.0]}
    tolerance: 1e-9
    shown: ['VT^{3/2} = \text{constant}']
    source: {cite: mit, at: 'slide 11'}
    origin: mit

  - id: ex-T1
    where: 'example (a): 2 × 2000/(3 × 8.314) K'
    inputs: {}
    formula: 2*2000/(3*8.314)
    expected: '160.4'
    tolerance: 0.05
    shown: ['\approx 160.4$ K']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: ex-T2
    where: 'example (a): 2 × 1000/(3 × 2 × 8.314) K'
    inputs: {}
    formula: 2*1000/(3*2*8.314)
    expected: '40.1'
    tolerance: 0.05
    shown: ['\approx 40.1$ K']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: ex-Tf
    where: 'example (b): 2 × 1000/(3 × 8.314) K'
    inputs: {}
    formula: 2*1000/(3*8.314)
    expected: '80.2'
    tolerance: 0.05
    shown: ['\approx 80.2$ K']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: ex-dS1
    where: 'example (c): 1.5 × 8.314 × ln(1/2) J/K'
    inputs: {}
    formula: 1.5*8.314*log(0.5)
    expected: '-8.64'
    tolerance: 0.005
    shown: ['$12.47 \ln\frac12 \approx -8.64$ J/K']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-dS2
    where: 'example (c): 3 × 8.314 × ln 2 J/K'
    inputs: {}
    formula: 3*8.314*log(2)
    expected: '17.29'
    tolerance: 0.005
    shown: ['$24.94\ln 2 \approx +17.29$ J/K']
    source: {cite: mit, at: 'slide 9'}
    origin: page-own

  - id: ex-dS
    where: 'example (c): total entropy change J/K'
    inputs: {}
    formula: 1.5*8.314*log(0.5) + 3*8.314*log(2)
    expected: '8.64'
    tolerance: 0.005
    shown: ['Total $\Delta S \approx +8.64$ J/K']
    source: {cite: mit, at: 'slide 7'}
    origin: page-own

  - id: ex-adiabat
    where: 'example (d): 300 × 8^(2/3) K'
    inputs: {}
    formula: 300*8**(2/3)
    expected: '1200'
    tolerance: 0.01
    shown: ['$T_2 = 300 \times 8^{2/3} = 1200$ K']
    source: {cite: mit, at: 'slide 11'}
    origin: page-own

  - id: plot-peak
    where: 'plot: the maximum of x^n (1 − x)^(2n) lies at x = 1/3'
    inputs: {}
    formula: solve('1/x - 2/(1 - x)', 'x', 0.1, 0.9)
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['The peak sits at E₁/E = 1/3']
    source: {cite: mit, at: 'slide 5'}
    origin: page-own
