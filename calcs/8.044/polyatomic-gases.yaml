# Calculations on content/year-3/8.044/polyatomic-gases.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 14, with the page's own example.

page: content/year-3/8.044/polyatomic-gases.mdx
calcs:
  - id: H2-rot-temp
    where: 'slide 3: h × 3.65e12 Hz / k in K'
    inputs: {}
    formula: 6.62607e-34*3.65e12/1.380649e-23
    expected: '175'
    tolerance: 0.5
    shown: ['$h\nu/k \approx 175$ K']
    source: {cite: mit, at: 'slide 3'}
    origin: mit

  - id: H2-vib-temp
    where: 'slide 3: h × 1.32e14 Hz / k in K (slide: 6320 K)'
    inputs: {}
    formula: 6.62607e-34*1.32e14/1.380649e-23
    expected: '6320'
    tolerance: 20
    shown: ['to about 6320 K (6335 K by direct calculation)']
    source: {cite: mit, at: 'slide 3'}
    origin: mit

  - id: mean-n
    kind: identity
    where: 'closed form: b/(1 − b) with b = e^(−x) equals 1/(e^x − 1)'
    formula: (1 - exp(-x))*exp(-x)/(1 - exp(-x))**2
    equals: 1/(exp(x) - 1)
    samples: {x: [0.2, 5.0]}
    tolerance: 1e-9
    shown: ['= \frac{b}{1 - b} = \frac{1}{e^{\hbar\omega/kT} - 1}']
    source: {cite: mit, at: 'slide 6'}
    origin: mit

  - id: vib-C
    kind: identity
    where: 'd/dT of ħω(1/(e^(ħω/kT) − 1) + 1/2) with ħω = k = 1 equals x² e^x/(e^x − 1)², x = 1/T'
    formula: ((1/(exp(1/(T + 1e-6)) - 1)) - (1/(exp(1/(T - 1e-6)) - 1)))/2e-6
    equals: (1/T)**2*exp(1/T)/(exp(1/T) - 1)**2
    samples: {T: [0.2, 3.0]}
    tolerance: 1e-5
    shown: ['C_V = N\frac{\partial\langle\epsilon\rangle}{\partial T}']
    source: {cite: mit, at: 'slide 9a'}
    origin: mit

  - id: rot-C-low
    kind: identity
    where: 'd/dT of 6Θ e^(−2Θ/T) (k = 1) equals 3(2Θ/T)² e^(−2Θ/T)'
    formula: (6*th*exp(-2*th/(T + 1e-6)) - 6*th*exp(-2*th/(T - 1e-6)))/2e-6
    equals: 3*(2*th/T)**2*exp(-2*th/T)
    samples: {th: [1.0, 3.0], T: [0.5, 2.0]}
    tolerance: 1e-5
    shown: ['C_{\text{rot}} \approx 3Nk\left(\frac{2\Theta_R}{T}\right)^2e^{-2\Theta_R/T}']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: rot-Z-high
    where: 'slide 18a: ∫ (2l + 1) e^(−l(l+1)Θ/T) dl from 0 to ∞ equals T/Θ (T/Θ = 50)'
    inputs: {}
    formula: integrate('(2*l + 1)*exp(-l*(l + 1)/50)', 'l', 0, 200)
    expected: '50'
    tolerance: 0.01
    shown: ['so $Z_R \approx T/\Theta_R$']
    source: {cite: mit, at: 'slide 18a'}
    origin: mit

  - id: ex-a-x
    where: 'example (a): 4000/300'
    inputs: {}
    formula: 4000/300
    expected: '13.33'
    tolerance: 0.005
    shown: ['$\hbar\omega/kT = 13.33$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-a
    where: 'example (a): 1/(e^(40/3) − 1)'
    inputs: {}
    formula: 1/(exp(40/3) - 1)
    expected: '1.62e-6'
    tolerance: 0.005e-6
    shown: ['\approx 1.62 \times 10^{-6}$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: ex-b
    where: 'example (b): x² e^x/(e^x − 1)² at x = 40/3'
    inputs: {}
    formula: (40/3)**2*exp(40/3)/(exp(40/3) - 1)**2
    expected: '2.9e-4'
    tolerance: 0.05e-4
    shown: ['\approx 2.9 \times 10^{-4}$']
    source: {cite: mit, at: 'slide 9a'}
    origin: page-own

  - id: ex-c
    where: 'example (c): (3/2 + 1) × 8.314 J/K per mole'
    inputs: {}
    formula: 2.5*8.314
    expected: '20.8'
    tolerance: 0.05
    shown: ['\approx 20.8$ J/K per mole']
    source: {cite: mit, at: 'slide 19a'}
    origin: page-own

  - id: ex-d-spacing
    where: 'example (d): 4kΘ_R/h Hz'
    inputs: {}
    formula: 4*1.380649e-23*15/6.62607e-34
    expected: '1.250e12'
    tolerance: 0.001e12
    shown: ['\approx 1.250 \times 10^{12}$ Hz']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-d-l2
    where: 'example (d): 5 e^(−6/20)'
    inputs: {}
    formula: 5*exp(-6/20)
    expected: '3.70'
    tolerance: 0.005
    shown: ['$l = 2$ gives 3.70']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-d-l3
    where: 'example (d): 7 e^(−12/20)'
    inputs: {}
    formula: 7*exp(-12/20)
    expected: '3.84'
    tolerance: 0.005
    shown: ['$l = 3$ gives 3.84']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-d-l4
    where: 'example (d): 9 e^(−20/20)'
    inputs: {}
    formula: 9*exp(-1)
    expected: '3.31'
    tolerance: 0.005
    shown: ['$l = 4$ gives 3.31']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-c-ratio
    where: 'example (c): T/Θ_R = 300/15'
    inputs: {}
    formula: 300/15
    expected: '20'
    tolerance: 1e-9
    shown: ['$T/\Theta_R = 20$']
    source: {cite: mit, at: 'slide 18a'}
    origin: page-own
