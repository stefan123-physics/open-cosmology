# Calculations on content/year-3/8.044/one-random-variable.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 1 and probability notes, Chapter 1, with the page's own example.

page: content/year-3/8.044/one-random-variable.mdx
calcs:
  - id: exponential-norm
    where: '∫ e^{−t/τ}/τ dt = 1 (τ = 1.7)'
    inputs: {}
    formula: 'integrate("exp(-t/1.7)/1.7", "t", 0, 200)'
    expected: '1'
    tolerance: 1e-6
    shown: ['which is normalized and has the cumulative']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: exponential-at-tau
    where: 'plot: P(τ) = 1 − 1/e'
    inputs: {}
    formula: 1 - exp(-1)
    expected: '0.63'
    tolerance: 0.005
    shown: ['reaching 1 − 1/e ≈ 0.63 at t = τ']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: stars-norm
    where: '1/3 + 1/2 + 1/6 = 1'
    inputs: {}
    formula: 1/3 + 1/2 + 1/6
    expected: '1'
    tolerance: 1e-12
    shown: ['with illustrative probabilities $\frac13$, $\frac12$, $\frac16$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: gaussian-variance
    where: 'variance of a Gaussian with σ = 0.8: ∫ x² p dx'
    inputs: {}
    formula: '(1/sqrt(2*pi*0.64))*integrate("x**2*exp(-x**2/(2*0.64))", "x", -20, 20)'
    expected: '0.64'
    tolerance: 1e-6
    shown: ['and $\text{Var}(x) = \sigma^2$']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: poisson-variance
    where: 'Poisson with mean 0.5: Σ n² p(n) − 0.5² (terms to n = 14)'
    inputs: {}
    formula: exp(-0.5)*(1*0.5**1/1 + 4*0.5**2/2 + 9*0.5**3/6 + 16*0.5**4/24 + 25*0.5**5/120 + 36*0.5**6/720 + 49*0.5**7/5040 + 64*0.5**8/40320 + 81*0.5**9/362880 + 100*0.5**10/3628800 + 121*0.5**11/39916800 + 144*0.5**12/479001600 + 169*0.5**13/6227020800 + 196*0.5**14/87178291200) - 0.25
    expected: '0.5'
    tolerance: 1e-9
    shown: ['\text{Var}(n) = \langle n\rangle, \qquad']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: quiz-variance
    where: 'quiz 2: √(13 − 9)'
    inputs: {}
    formula: sqrt(13 - 3**2)
    expected: '2'
    tolerance: 1e-12
    shown: ['= 13 - 9 = 4$, so the standard deviation is 2']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: quiz-narrow
    where: 'quiz 1: a peak of width 0.1 and area 1 has height 10'
    inputs: {}
    formula: 1/0.1
    expected: '10'
    tolerance: 1e-12
    shown: ['a narrow peak of width 0.1 must reach a height near 10']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-wait
    where: 'example (a): 1 − e^{−0.5}'
    inputs: {}
    formula: 1 - exp(-0.5)
    expected: '0.393'
    tolerance: 0.0005
    shown: ['$P(1\ \text{s}) = 1 - e^{-0.5} \approx 0.393$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-p0
    where: 'example (b): e^{−2.5}'
    inputs: {}
    formula: exp(-2.5)
    expected: '0.082'
    tolerance: 0.0005
    shown: ['$p(0) = e^{-2.5} \approx 0.082$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-p2
    where: 'example (b): 2.5²/2 e^{−2.5}'
    inputs: {}
    formula: 2.5**2/2*exp(-2.5)
    expected: '0.257'
    tolerance: 0.0005
    shown: ['e^{-2.5} \approx 0.257$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-atleast1
    where: 'example (b): 1 − e^{−2.5}'
    inputs: {}
    formula: 1 - exp(-2.5)
    expected: '0.918'
    tolerance: 0.0005
    shown: ['$1 - p(0) \approx 0.918$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-sd
    where: 'example (b): √2.5'
    inputs: {}
    formula: sqrt(2.5)
    expected: '1.6'
    tolerance: 0.05
    shown: ['standard deviation is about 1.6 counts']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: ex-one-sigma
    where: 'example (c): 1 − erfc(1/√2)'
    inputs: {}
    formula: 1 - erfc(1/sqrt(2))
    expected: '0.683'
    tolerance: 0.0005
    shown: ['\approx 0.683$: about two thirds']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: angle-density-norm
    where: '∫ 2 sinθ cosθ dθ over (0, π/2) = 1'
    inputs: {}
    formula: 'integrate("2*sin(t)*cos(t)", "t", 0, pi/2)'
    expected: '1'
    tolerance: 1e-6
    shown: ['$p(\theta) = 2\sin\theta\cos\theta$ on']
    source: {cite: mit, at: 'slide 5'}
    origin: mit

  - id: mean-path
    where: '⟨L⟩/d = ∫ (1/cosθ) 2 sinθ cosθ dθ = 2'
    inputs: {}
    formula: 'integrate("2*sin(t)", "t", 0, pi/2)'
    expected: '2'
    tolerance: 1e-6
    shown: ['2\sin\theta\cos\theta\,d\theta = 2d$']
    source: {cite: mit, at: 'slide 12'}
    origin: mit

  - id: geometric-norm
    kind: identity
    where: 'Σ f(1 − f)ⁿ = 1 (closed form f/(1 − (1 − f)))'
    formula: f/(1 - (1 - f))
    equals: 1 + 0*f
    samples: {f: [0.1, 0.5]}
    tolerance: 1e-12
    shown: ['\left(1 - \frac{A_H}{A_T}\right)^n, \qquad']
    source: {cite: mit, at: 'slide 7'}
    origin: mit
