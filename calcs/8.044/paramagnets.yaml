# Calculations on content/year-3/8.044/paramagnets.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 16, with the page's own example.

page: content/year-3/8.044/paramagnets.mdx
calcs:
  - id: Z1-sum
    kind: identity
    where: 'Σ e^(ηm) for J = 3/2 (m = 3/2, 1/2, −1/2, −3/2) equals sinh(2η)/sinh(η/2)'
    formula: exp(1.5*x) + exp(0.5*x) + exp(-0.5*x) + exp(-1.5*x)
    equals: sinh(2*x)/sinh(x/2)
    samples: {x: [0.1, 3.0]}
    tolerance: 1e-9
    shown: ['\frac{\sinh\left[(J + \frac12)\eta\right]}{\sinh\left[\frac12\eta\right]}']
    source: {cite: mit, at: 'slide 2b'}
    origin: mit

  - id: brillouin-from-Z
    kind: identity
    where: '(1/J) d ln Z1/dη equals B_J(η) for J = 3/2 (finite difference)'
    formula: (log(sinh(2*(x + 1e-6))/sinh((x + 1e-6)/2)) - log(sinh(2*(x - 1e-6))/sinh((x - 1e-6)/2)))/2e-6/1.5
    equals: (2/tanh(2*x) - 0.5/tanh(x/2))/1.5
    samples: {x: [0.1, 3.0]}
    tolerance: 1e-5
    shown: ['B_J(\eta) = \frac1J\left[\left(J + \frac12\right)\text{coth}']
    source: {cite: mit, at: 'slide 3'}
    origin: mit

  - id: brillouin-small
    where: 'slide 4: B_J(η)/η as η → 0 equals (J + 1)/3 (J = 3/2, η = 1e-3)'
    inputs: {}
    formula: (2/tanh(2*1e-3) - 0.5/tanh(1e-3/2))/1.5/1e-3
    expected: '0.8333'
    tolerance: 0.0005
    shown: ['M \approx N\frac{(g\mu_B)^2J(J + 1)}{3}\frac{H}{kT}']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: half-is-tanh
    kind: identity
    where: 'B_1/2(η) = 2 coth(η) − coth(η/2) equals tanh(η/2)'
    formula: 2/tanh(x) - 1/tanh(x/2)
    equals: tanh(x/2)
    samples: {x: [0.1, 4.0]}
    tolerance: 1e-9
    shown: ['$B_{1/2}(\eta) = \tanh(\eta/2)$']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: entropy-low-T
    where: 'slide 20: S/Nk = ln Z1 − ηJ B_J → 0 at large η (J = 3/2, η = 30)'
    inputs: {}
    formula: log(sinh(2*30)/sinh(15)) - 30*1.5*(2/tanh(60) - 0.5/tanh(15))/1.5
    expected: '0'
    tolerance: 1e-6
    shown: ['and the extra term cancels the growth at low temperature, giving $S \to 0$']
    source: {cite: mit, at: 'slide 20'}
    origin: mit

  - id: entropy-high-T
    where: 'slide 18: S/Nk → ln(2J + 1) at small η (J = 3/2, η = 1e-4)'
    inputs: {}
    formula: log(sinh(2*1e-4)/sinh(0.5e-4)) - 1e-4*(2/tanh(2e-4) - 0.5/tanh(0.5e-4))
    expected: '1.3863'
    tolerance: 0.0001
    shown: ['By counting, the entropy should go from $Nk\ln(2J + 1)$']
    source: {cite: mit, at: 'slide 18'}
    origin: mit

  - id: ex-a-1K
    where: 'example (a): 2 × 9.274e-24/(1.380649e-23 × 1)'
    inputs: {}
    formula: 2*9.274e-24/1.380649e-23
    expected: '1.343'
    tolerance: 0.0005
    shown: ['about 1.343 at 1 K']
    source: {cite: mit, at: 'slide 2b'}
    origin: page-own

  - id: ex-a-300K
    where: 'example (a): 2 × 9.274e-24/(1.380649e-23 × 300)'
    inputs: {}
    formula: 2*9.274e-24/(1.380649e-23*300)
    expected: '4.48e-3'
    tolerance: 0.005e-3
    shown: ['$4.48 \times 10^{-3}$ at 300 K']
    source: {cite: mit, at: 'slide 2b'}
    origin: page-own

  - id: ex-b-1K
    where: 'example (b): tanh(η/2) at 1 K'
    inputs: {}
    formula: tanh(9.274e-24/1.380649e-23)
    expected: '0.586'
    tolerance: 0.0005
    shown: ['At 1 K this is about 0.586']
    source: {cite: mit, at: 'slide 3'}
    origin: page-own

  - id: ex-b-curie
    where: 'example (b): η/2 at 1 K'
    inputs: {}
    formula: 9.274e-24/1.380649e-23
    expected: '0.672'
    tolerance: 0.0005
    shown: ['would give 0.672']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-b-300K
    where: 'example (b): tanh(η/2) at 300 K'
    inputs: {}
    formula: tanh(9.274e-24/(1.380649e-23*300))
    expected: '2.24e-3'
    tolerance: 0.005e-3
    shown: ['At 300 K both give $2.24 \times 10^{-3}$']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: ex-c
    where: 'example (c): 1 K × 0.01 T/1 T'
    inputs: {}
    formula: 1*0.01/1
    expected: '0.01'
    tolerance: 1e-9
    shown: ['$T_{\text{final}} = 1 \times 0.01/1 = 0.01$ K']
    source: {cite: mit, at: 'slide 24'}
    origin: page-own

  - id: ex-d
    where: 'example (d): R ln 2'
    inputs: {}
    formula: 8.314*log(2)
    expected: '5.76'
    tolerance: 0.005
    shown: ['$Nk\ln(2J + 1) = R\ln 2 \approx 5.76$ J/K per mole']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own
