  # ---- Problem 6

  - id: p6-density-from-caps
    kind: identity
    answer: p6-pr
    where: 'Problem 6, answer box and formula "Density of the perpendicular distance for a shell": the numerical derivative of the area of the two caps, integrated numerically, over the area of the sphere'
    formula: r/(R*sqrt(R**2 - r**2))
    equals: >-
      deriv("0.5*(integrate('sin(t)', 't', 0, asin(x/R)) + integrate('sin(t)', 't', pi - asin(x/R), pi))", "x", r)
    samples:
      r: [0.1, 0.9, 0.5, 1.2, 1.7]
      R: [1, 1, 2, 1.5, 1.9]
    tolerance: 1e-6
    shown: ['= \frac{r_\perp}{R\sqrt{R^2 - r_\perp^2}} \quad\text{for } 0 \le r_\perp \le R']
    source: {cite: reading1, at: 'Problem 6, p. 10'}
    origin: mit

  - id: p6-rim
    answer: p6-rim
    where: 'Problem 6, answer box: the fraction of the atoms at more than 0.9 R from the line of sight, from the areas of the two caps'
    inputs: {q: 0.9}
    formula: 1 - 0.5*(integrate('sin(t)', 't', 0, asin(q)) + integrate('sin(t)', 't', pi - asin(q), pi))
    expected: '0.436'
