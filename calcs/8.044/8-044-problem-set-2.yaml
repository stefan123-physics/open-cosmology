      solve("deriv('2*y**2/(sqrt(2*pi)*sigma**3)*exp(-y**2/(2*sigma**2))', 'y', q)", "q", 0.5*sigma, 3*sigma)
    samples: {sigma: [0.5, 2, 1, 1.3, 0.8]}
    tolerance: 1e-6
