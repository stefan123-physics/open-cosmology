# Calculations on content/year-3/8.044/entropy-thermodynamic-variable.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 9, notes on the microcanonical ensemble and on interstitial atoms, with the page's own example.

page: content/year-3/8.044/entropy-thermodynamic-variable.mdx
calcs:
  - id: ideal-gas-dSdV
    kind: identity
    where: 'd/dV of kN ln[V(4πemE/3N)^(3/2)] equals kN/V (finite difference, k = 1)'
    formula: (N*log((V + 1e-6)*(4*pi*e*m*E/(3*N))**1.5) - N*log((V - 1e-6)*(4*pi*e*m*E/(3*N))**1.5))/2e-6
    equals: N/V
    samples: {N: [1.0, 5.0], V: [0.5, 3.0], m: [0.2, 2.0], E: [1.0, 4.0]}
    tolerance: 1e-5
    shown: ['= \frac{kN}{V} = \frac PT \quad\Longrightarrow\quad PV = NkT']
    source: {cite: mit, at: 'slide 7'}
    origin: mit

  - id: two-level-dSdE
    kind: identity
    where: 'with Stirling, d/dN1 of [N ln N − N1 ln N1 − (N − N1) ln(N − N1)] equals ln(N/N1 − 1) (k = 1)'
    formula: ((N*log(N) - (L + 1e-6)*log(L + 1e-6) - (N - L - 1e-6)*log(N - L - 1e-6)) - (N*log(N) - (L - 1e-6)*log(L - 1e-6) - (N - L + 1e-6)*log(N - L + 1e-6)))/2e-6
    equals: log(N/L - 1)
    samples: {N: [10.0, 50.0], L: [1.0, 9.0]}
    tolerance: 1e-5
    shown: ['\frac k\epsilon\ln\left(\frac N{N_1} - 1\right)']
    source: {cite: mit, at: 'slide 12'}
    origin: mit

  - id: two-level-C
    kind: identity
    where: 'd/dT of N/(e^(1/T) + 1) (ε = k = 1) equals (1/T)² e^(1/T)/(e^(1/T) + 1)² per member'
    formula: (1/(exp(1/(T + 1e-6)) + 1) - 1/(exp(1/(T - 1e-6)) + 1))/2e-6
    equals: (1/T)**2*exp(1/T)/(exp(1/T) + 1)**2
    samples: {T: [0.2, 4.0]}
    tolerance: 1e-5
    shown: ['C \equiv \frac{\partial E}{\partial T} = Nk\left(\frac{\epsilon}{kT}\right)^2']
    source: {cite: mit, at: 'slide 14'}
    origin: mit

  - id: dinner-5
    where: 'slide 8b: 5!'
    inputs: {}
    formula: 5*4*3*2*1
    expected: '120'
    tolerance: 0
    shown: ['$5! = 120$']
    source: {cite: mit, at: 'slide 8b'}
    origin: mit

  - id: dinner-60
    where: 'slide 8b: 5!/2!'
    inputs: {}
    formula: 5*4*3
    expected: '60'
    tolerance: 0
    shown: ['$5!/2! = 60$']
    source: {cite: mit, at: 'slide 8b'}
    origin: mit

  - id: dinner-10
    where: 'slide 8b: 5!/(3! 2!)'
    inputs: {}
    formula: 120/(6*2)
    expected: '10'
    tolerance: 0
    shown: ['$5!/(3!\,2!) = 10$']
    source: {cite: mit, at: 'slide 8b'}
    origin: mit

  - id: C-peak-position
    where: 'plot caption and flashcard: peak of C/Nk where x tanh(x/2) = 2, x = ε/kT; kT/ε = 1/x'
    inputs: {}
    formula: 1/solve('x*(exp(x) - 1)/(exp(x) + 1) - 2', 'x', 1, 4)
    expected: '0.42'
    tolerance: 0.005
    shown: ['near kT ≈ 0.42ε before', '$kT \\approx 0.42\\epsilon$']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: C-peak-value
    where: 'plot caption: x² e^x/(e^x + 1)² at its maximum, x = ε/kT = 2.3994 (C-peak-position)'
    inputs: {}
    formula: 2.3994**2*exp(2.3994)/(exp(2.3994) + 1)**2
    expected: '0.44'
    tolerance: 0.005
    shown: ['peaks at about 0.44']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-a100
    where: 'example (a): 1/(e + 1)'
    inputs: {}
    formula: 1/(e + 1)
    expected: '0.269'
    tolerance: 0.0005
    shown: ['$N_1/N = 1/(e + 1) \approx 0.269$']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-a50
    where: 'example (a): 1/(e² + 1)'
    inputs: {}
    formula: 1/(e**2 + 1)
    expected: '0.119'
    tolerance: 0.0005
    shown: ['$N_1/N = 1/(e^2 + 1) \approx 0.119$']
    source: {cite: mit, at: 'slide 13'}
    origin: page-own

  - id: ex-b-den
    where: 'example (b): (e + 1)²'
    inputs: {}
    formula: (e + 1)**2
    expected: '13.83'
    tolerance: 0.005
    shown: ['2.718/13.83']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-b
    where: 'example (b): e/(e + 1)²'
    inputs: {}
    formula: e/(e + 1)**2
    expected: '0.197'
    tolerance: 0.0005
    shown: ['\approx 0.197$']
    source: {cite: mit, at: 'slide 14'}
    origin: page-own

  - id: ex-c-ln
    where: 'example (c): ln(1/3)'
    inputs: {}
    formula: log(1/3)
    expected: '-1.099'
    tolerance: 0.0005
    shown: ['= \ln\frac13 \approx -1.099$']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-c-T
    where: 'example (c): 100/ln(1/3) K'
    inputs: {}
    formula: 100/log(1/3)
    expected: '-91.0'
    tolerance: 0.05
    shown: ['\approx -91.0$ K']
    source: {cite: mit, at: 'slide 12'}
    origin: page-own

  - id: ex-d-kT
    where: 'example (d): 8.617e-5 × 1000 eV'
    inputs: {}
    formula: 8.617e-5*1000
    expected: '0.08617'
    tolerance: 0.000005
    shown: ['$kT = 0.08617$ eV']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: ex-d-ratio
    where: 'example (d): 1/(2 × 0.08617)'
    inputs: {}
    formula: 1/(2*0.08617)
    expected: '5.80'
    tolerance: 0.005
    shown: ['$\epsilon/2kT \approx 5.80$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: ex-d
    where: 'example (d): exp(−1/(2 × 0.08617))'
    inputs: {}
    formula: exp(-1/(2*0.08617))
    expected: '3.0e-3'
    tolerance: 0.05e-3
    shown: ['\approx 3.0 \times 10^{-3}$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
