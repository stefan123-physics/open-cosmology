# Calculations on content/year-3/8.044/first-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.044 (Spring 2013, Greytak) slides for Lecture 6, with the page's own example.

page: content/year-3/8.044/first-law.mdx
calcs:
  - id: vdw-dPdV
    kind: identity
    where: 'd/dV of NkT/(V − Nb) − aN²/V² equals −NkT/(V − Nb)² + 2aN²/V³ (finite difference, Nk = N = 1)'
    formula: ((T/(V + 1e-6 - b) - a/(V + 1e-6)**2) - (T/(V - 1e-6 - b) - a/(V - 1e-6)**2))/2e-6
    equals: -T/(V - b)**2 + 2*a/V**3
    samples: {T: [1.0, 3.0], V: [2.0, 5.0], b: [0.1, 0.5], a: [0.3, 1.0]}
    tolerance: 1e-5
    shown: ['P = \frac{NkT}{V - Nb} - \frac{aN^2}{V^2}']
    source: {cite: mit, at: 'slide 4'}
    origin: mit

  - id: gamma-monatomic
    where: '(5/2)/(3/2)'
    inputs: {}
    formula: 2.5/1.5
    expected: '1.6667'
    tolerance: 0.0001
    shown: ['$\gamma \equiv C_P/C_V = \frac53$']
    source: {cite: mit, at: 'slide 19'}
    origin: mit

  - id: adiabat-slope
    kind: identity
    where: 'slope of PV^γ = c is −γP/V (finite difference)'
    formula: ((c*(V + 1e-6)**(-g)) - (c*(V - 1e-6)**(-g)))/2e-6
    equals: -g*(c*V**(-g))/V
    samples: {c: [1.0, 2.0], V: [0.7, 1.5], g: [1.6667, 1.4]}
    tolerance: 1e-6
    shown: ['$dP/dV = -\gamma P/V$ against $-P/V$']
    source: {cite: mit, at: 'slide 22'}
    origin: mit

  - id: quiz-temp-ratio
    where: 'quiz 3 and example (b): 2^(2/3)'
    inputs: {}
    formula: 2**(2/3)
    expected: '1.59'
    tolerance: 0.005
    shown: ['$2^{2/3} \\approx 1.59$']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: quiz-pressure-ratio
    where: 'quiz 3: 2^(5/3)'
    inputs: {}
    formula: 2**(5/3)
    expected: '3.17'
    tolerance: 0.005
    shown: ['$2^{5/3} \\approx 3.17$']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: ex-CV
    where: 'example (a): 1.5 × 8.314'
    inputs: {}
    formula: 1.5*8.314
    expected: '12.5'
    tolerance: 0.05
    shown: ['$C_V = \frac32R \approx 12.5$ J/K']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: ex-CP
    where: 'example (a): 2.5 × 8.314'
    inputs: {}
    formula: 2.5*8.314
    expected: '20.8'
    tolerance: 0.05
    shown: ['$C_P = \frac52R \approx 20.8$ J/K']
    source: {cite: mit, at: 'slide 19'}
    origin: page-own

  - id: ex-U
    where: 'example (a): 1.5 × 8.314 × 300 J, in kJ'
    inputs: {}
    formula: 1.5*8.314*300/1000
    expected: '3.74'
    tolerance: 0.005
    shown: ['$U = \frac32RT \approx 3.74$ kJ']
    source: {cite: mit, at: 'slide 18'}
    origin: page-own

  - id: ex-T2
    where: 'example (b): 300 × 2^(2/3) K'
    inputs: {}
    formula: 300*2**(2/3)
    expected: '476'
    tolerance: 0.5
    shown: ['$T_2 = 300 \times 2^{2/3} \approx 476$ K']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own

  - id: ex-P-ratio
    where: 'example (b): 2^(5/3)'
    inputs: {}
    formula: 2**(5/3)
    expected: '3.17'
    tolerance: 0.005
    shown: ['$P_2/P_1 = 2^{5/3} \approx 3.17$']
    source: {cite: mit, at: 'slide 22'}
    origin: page-own

  - id: ex-work
    where: 'example (b): 12.471 × (476.2 − 300) J, in kJ'
    inputs: {}
    formula: 1.5*8.314*(300*2**(2/3) - 300)/1000
    expected: '2.20'
    tolerance: 0.005
    shown: ['\approx 12.47 \times 176.2 \approx 2.20$ kJ']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: ex-alpha
    where: 'example (c): 1/300 per K'
    inputs: {}
    formula: 1/300
    expected: '3.33e-3'
    tolerance: 0.005e-3
    shown: ['\approx 3.33 \times 10^{-3}\ \text{K}^{-1}$']
    source: {cite: mit, at: 'slide 21'}
    origin: page-own
