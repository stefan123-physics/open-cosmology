# Calculations on content/year-1/18.02/double-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 16 transcript and the Week 7 lecture summary, with the page's own numbers.

page: content/year-1/18.02/double-integrals.mdx
calcs:
  - id: square-inner
    kind: identity
    where: 'formula "Over the unit square": inner integral ∫₀¹ (1 − x² − y²) dy = 2/3 − x²'
    formula: integrate('1 - x**2 - y**2', 'y', 0, 1)
    equals: 2 / 3 - x**2
    samples: {x: [0.0, 0.5, 0.9]}
    tolerance: 1e-6
    shown: ['\int_0^1 \left(\frac23 - x^2\right)dx']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: square-total
    where: 'same: outer integral = 1/3'
    inputs: {}
    formula: integrate('2/3 - x**2', 'x', 0, 1)
    expected: '0.3333'
    shown: ['= \frac13" cite="reading2" at="p. 2"']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: quarter-disc-inner
    kind: identity
    where: 'formula "Over the quarter disc": inner integral up to √(1 − x²) = (2/3)(1 − x²)^(3/2)'
    formula: integrate('1 - x**2 - y**2', 'y', 0, sqrt(1 - x**2))
    equals: 2 / 3 * (1 - x**2)**1.5
    samples: {x: [0.0, 0.4, 0.8]}
    tolerance: 1e-6
    shown: ['\int_0^1 \frac23\,(1 - x^2)^{3/2}\,dx']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: quarter-disc-total
    where: 'same: outer integral = π/8'
    inputs: {}
    formula: integrate('2/3*(1 - x**2)**(3/2)', 'x', 0, 1)
    expected: '0.3927'
    tolerance: '0.1%'
    shown: ['= \frac{\pi}{8}" cite']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: mit

  - id: exchanged
    where: 'formula "The exchanged integral": ∫₀¹ (eʸ − y eʸ) dy = e − 2'
    inputs: {}
    formula: integrate('exp(y) - y*exp(y)', 'y', 0, 1)
    expected: '0.7183'
    tolerance: '0.1%'
    shown: ['\Big[2e^y - ye^y\Big]_0^1 = e - 2']
    source: {cite: reading1, at: 'Lecture 16, p. 2'}
    origin: mit

  - id: exchanged-check
    where: 'same: e − 2 ≈ 0.718'
    inputs: {}
    formula: e - 2
    expected: '0.7183'
    shown: ['$\int_0^1\int_x^{\sqrt x} \frac{e^y}{y}\,dy\,dx = e - 2$']
    source: {cite: reading1, at: 'Lecture 16, p. 2'}
    origin: mit

  - id: quiz-1
    where: 'quiz 1: ∫₀¹ 2y dy = 1'
    inputs: {}
    formula: integrate('2*y', 'y', 0, 1)
    expected: '1'
    shown: ['Outer: $\\int_0^1 2y\\,dy = 1$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: triangle-dydx
    where: 'worked example: ∫₀² x³/2 dx = 2'
    inputs: {}
    formula: integrate('x**3/2', 'x', 0, 2)
    expected: '2'
    shown: ['$\int_0^2 \frac{x^3}{2}\,dx = \frac{2^4}{8} = 2$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: triangle-dxdy
    where: 'same: ∫₀² (2y − y³/2) dy = 4 − 2 = 2'
    inputs: {}
    formula: integrate('2*y - y**3/2', 'y', 0, 2)
    expected: '2'
    shown: ['= 4 - 2 = 2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
