page: content/year-1/18.02/flux.mdx
calcs:
  - id: circle-flux
    where: 'formula "Flux out of a circle": ∮ (x, y) · n ds around radius a = 2πa² (a = 1.5)'
    inputs: {}
    formula: integrate('(1.5*cos(th))*(1.5*cos(th)) + (1.5*sin(th))*(1.5*sin(th))', 'th', 0, 2 * pi)
    expected: '14.137'
    shown: ['= a \times 2\pi a = 2\pi a^2']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: circle-flux-green
    where: 'section "Green''s theorem for flux": div (x, y) = 2, flux = 2 × πa² (a = 1.5)'
    inputs: {}
    formula: 2 * pi * 1.5**2
    expected: '14.137'
    shown: ['so the flux out of the disc is']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: quiz-2
    where: 'quiz 2: div (3x, −y) = 2'
    inputs: {}
    formula: 3 + (-1)
    expected: '2'
    shown: ['$P_x + Q_y = 3 + (-1) = 2$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): ∫₀¹ dt = 1'
    inputs: {}
    formula: integrate('1', 't', 0, 1)
    expected: '1'
    shown: ['$\int -Q\,dx + P\,dy = \int_0^1 dt = 1$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): ∫₀¹∫₀¹ (2x + 2y) dx dy = 2'
    inputs: {}
    formula: integrate('2*x', 'x', 0, 1) + integrate('2*y', 'y', 0, 1)
    expected: '2'
    shown: ['\int_0^1\int_0^1 (2x + 2y)\,dx\,dy = 1 + 1 = 2$']
    source: {cite: reading1, at: 'Lecture 23, p. 4'}
    origin: page-own
