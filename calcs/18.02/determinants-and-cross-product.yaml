# Calculations on content/year-1/18.02/determinants-and-cross-product.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 2 transcript and the Week 1 lecture summary, with the page's own numbers.

page: content/year-1/18.02/determinants-and-cross-product.mdx
calcs:
  - id: rotation-identity
    kind: identity
    where: 'formula "Turning a sine into a cosine": ⟨−a₂, a₁⟩ · ⟨b₁, b₂⟩ = a₁b₂ − a₂b₁'
    formula: (-a2) * b1 + a1 * b2
    equals: a1 * b2 - a2 * b1
    samples: {a1: [3.0, -1.5], a2: [1.0, 2.0], b1: [1.0, 4.0], b2: [2.0, -0.5]}
    tolerance: 1e-9
    shown: ['= a_1b_2 - a_2b_1" cite="reading2" at="p. 5" />']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: triple-product
    kind: identity
    where: 'formula "The triple product": A · (B × C) equals the first-row expansion of det(A, B, C)'
    formula: a1 * (b2 * c3 - b3 * c2) + a2 * (b3 * c1 - b1 * c3) + a3 * (b1 * c2 - b2 * c1)
    equals: a1 * (b2 * c3 - b3 * c2) - a2 * (b1 * c3 - b3 * c1) + a3 * (b1 * c2 - b2 * c1)
    samples: {a1: [1.0, 2.0], a2: [0.0, -1.0], a3: [2.0, 3.0], b1: [0.0, 1.5], b2: [3.0, 0.5], b3: [1.0, -2.0], c1: [1.0, 4.0], c2: [1.0, -3.0], c3: [1.0, 0.5]}
    tolerance: 1e-9
    shown: ['\vec A \cdot (\vec B \times \vec C) = \det(\vec A, \vec B, \vec C)" cite']
    source: {cite: reading2, at: 'p. 15'}
    origin: mit

  - id: quiz-1
    where: 'quiz 1: det of ⟨2, 1⟩, ⟨1, 3⟩ = 5'
    inputs: {}
    formula: 2 * 3 - 1 * 1
    expected: '5'
    shown: ['$2 \\cdot 3 - 1 \\cdot 1 = 5$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: example-a
    where: 'worked example (a): det = 3 × 2 − 1 × 1 = 5'
    inputs: {}
    formula: 3 * 2 - 1 * 1
    expected: '5'
    shown: ['= 3 \cdot 2 - 1 \cdot 1 = 5$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: example-a-triangle
    where: 'same: triangle area 5/2 = 2.5'
    inputs: {}
    formula: (3 * 2 - 1 * 1) / 2
    expected: '2.5'
    shown: ['the triangle $5/2 = 2.5$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: example-b-i
    where: 'worked example (b): i coefficient of P × Q = −6'
    inputs: {}
    formula: 0 * 1 - 2 * 3
    expected: '-6'
    shown: ['$0 \cdot 1 - 2 \cdot 3 = -6$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-j
    where: 'same: j coefficient = −1'
    inputs: {}
    formula: -(1 * 1 - 2 * 0)
    expected: '-1'
    shown: ['$-(1 \cdot 1 - 2 \cdot 0) = -1$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-k
    where: 'same: k coefficient = 3'
    inputs: {}
    formula: 1 * 3 - 0 * 0
    expected: '3'
    shown: ['$1 \cdot 3 - 0 \cdot 0 = 3$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-perp-p
    where: 'same: P · (P × Q) = 0'
    inputs: {}
    formula: 1 * (-6) + 0 * (-1) + 2 * 3
    expected: '0'
    tolerance: '1e-12'
    shown: ['= -6 + 0 + 6 = 0$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-perp-q
    where: 'same: Q · (P × Q) = 0'
    inputs: {}
    formula: 0 * (-6) + 3 * (-1) + 1 * 3
    expected: '0'
    tolerance: '1e-12'
    shown: ['= 0 - 3 + 3 = 0$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-area
    where: 'same: |P × Q| = √46 ≈ 6.78'
    inputs: {}
    formula: sqrt(36 + 1 + 9)
    expected: '6.78'
    shown: ['= \sqrt{46} \approx 6.78$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-c-triple
    where: 'worked example (c): P · (Q × R) = 2 + 0 − 6 = −4'
    inputs: {}
    formula: 1 * (3 * 1 - 1 * 1) + 0 * (-(0 * 1 - 1 * 1)) + 2 * (0 * 1 - 3 * 1)
    expected: '-4'
    shown: ['= 2 + 0 - 6 = -4$']
    source: {cite: reading2, at: 'p. 15'}
    origin: page-own

  - id: example-c-det
    where: 'same: det by expansion 1(3 − 1) − 0 + 2(0 − 3) = −4'
    inputs: {}
    formula: 1 * (3 - 1) - 0 + 2 * (0 - 3)
    expected: '-4'
    shown: ['$1(3 - 1) - 0 + 2(0 - 3) = -4$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own
