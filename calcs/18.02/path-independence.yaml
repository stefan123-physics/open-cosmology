# Calculations on content/year-1/18.02/path-independence.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 20 transcript and the Week 8 lecture summary, with the page's own numbers.

page: content/year-1/18.02/path-independence.mdx
calcs:
  - id: arc
    where: 'formula "The arc": ∫₀^{π/4} cos 2θ dθ = 1/2'
    inputs: {}
    formula: integrate('cos(th)**2 - sin(th)**2', 'th', 0, pi / 4)
    expected: '0.5'
    shown: ['\left[\tfrac12\sin 2\theta\right]_0^{\pi/4} = \frac12']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: diagonal
    where: 'section "A line integral in three pieces": along −C₃, ∫₀^{1/√2} 2t dt = 1/2'
    inputs: {}
    formula: integrate('2*t', 't', 0, 1 / sqrt(2))
    expected: '0.5'
    shown: ['which gives $\int 2t\,dt = \frac12$']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: potential-arc
    where: 'section "The fundamental theorem": f = xy rises from 0 to 1/2 along C₂'
    inputs: {}
    formula: (1 / sqrt(2)) * (1 / sqrt(2)) - 1 * 0
    expected: '0.5'
    shown: ['Along $C_2$ the potential rises from 0 to $\frac12$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: circle-work
    where: 'formula "Not conservative": work of ⟨−y, x⟩ around the unit circle = 2π'
    inputs: {}
    formula: integrate('sin(th)**2 + cos(th)**2', 'th', 0, 2 * pi)
    expected: '6.2832'
    shown: ['= \oint_C 1\,ds = 2\pi \ne 0']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: half-circle
    where: 'same: upper half circle from (1, 0) to (−1, 0) gives π'
    inputs: {}
    formula: integrate('sin(th)**2 + cos(th)**2', 'th', 0, pi)
    expected: '3.1416'
    shown: ['the upper half circle gives $\pi$, the lower one $-\pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: quiz-1
    where: 'quiz 1: f = x² + y, f(1, 2) − f(0, 0) = 3'
    inputs: {}
    formula: 1**2 + 2 - 0
    expected: '3'
    shown: ['$f(1, 2) - f(0, 0) = 1 + 2 - 0 = 3$']
    source: {cite: reading1, at: 'Lecture 20, p. 4'}
    origin: page-own

  - id: example-endpoints
    where: 'worked example (b): f(2, 3) − f(0, 0) = 4 · 3 = 12'
    inputs: {}
    formula: 2**2 * 3 - 0
    expected: '12'
    shown: ['$f(2, 3) - f(0, 0) = 4 \cdot 3 - 0 = 12$']
    source: {cite: reading1, at: 'Lecture 20, p. 4'}
    origin: page-own

  - id: example-segment
    where: 'same: along x = 2t, y = 3t the integrand is 36t² and the work 12'
    inputs: {}
    formula: integrate('2*(2*t)*(3*t)*2 + (2*t)**2*3', 't', 0, 1)
    expected: '12'
    shown: ['$\int_0^1 36t^2\,dt = 12$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
