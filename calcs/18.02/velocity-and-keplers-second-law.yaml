# Calculations on content/year-1/18.02/velocity-and-keplers-second-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 6 transcript and the Week 3 lecture summary, with the page's own numbers.

page: content/year-1/18.02/velocity-and-keplers-second-law.mdx
calcs:
  - id: cycloid-speed
    kind: identity
    where: 'formula "Speed of the cycloid": (1 − cos t)² + sin² t = 2 − 2 cos t'
    formula: (1 - cos(t))**2 + sin(t)**2
    equals: 2 - 2 * cos(t)
    samples: {t: [0.3, 1.0, 2.5, 4.0]}
    tolerance: 1e-9
    shown: ['= \sqrt{2 - 2\cos t}" cite']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: cycloid-top-speed
    where: 'same: speed at t = π is √4 = 2'
    inputs: {}
    formula: sqrt(2 - 2 * cos(pi))
    expected: '2'
    shown: ['$\sqrt 4 = 2$']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: arch-length
    where: 'section "Arc length": one arch has length 8 (radius 1)'
    inputs: {}
    formula: integrate('sqrt(2 - 2*cos(t))', 't', 0, 2*pi)
    expected: '8'
    tolerance: '0.1%'
    shown: ['the arch has length 8 times the radius']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: half-angle
    kind: identity
    where: 'same: 2 − 2 cos t = (2 sin(t/2))²'
    formula: 2 - 2 * cos(t)
    equals: (2 * sin(t / 2))**2
    samples: {t: [0.5, 2.0, 5.0]}
    tolerance: 1e-9
    shown: ['the integrand is $2\sin(t/2)$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: quiz-1-speed
    where: 'quiz 1: |⟨2, 3⟩| = √13'
    inputs: {}
    formula: sqrt(2**2 + 3**2)
    expected: '3.606'
    shown: ['Its length $\\sqrt{13}$ is the speed']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: circle-speed
    where: 'worked example (a): speed of ⟨2 cos 3t, 2 sin 3t⟩ is 6'
    inputs: {}
    formula: sqrt(36 * sin(3 * 0.7)**2 + 36 * cos(3 * 0.7)**2)
    expected: '6'
    shown: ['= 6$, constant']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: circle-accel
    kind: identity
    where: 'same: a = −9 r (x component −18 cos 3t = −9 × 2 cos 3t)'
    formula: -18 * cos(3 * t)
    equals: -9 * (2 * cos(3 * t))
    samples: {t: [0.2, 1.1]}
    tolerance: 1e-9
    shown: ['= -9\,\vec r$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: circle-rxv
    where: 'same: (r × v)_z = 2 cos 3t · 6 cos 3t − 2 sin 3t · (−6 sin 3t) = 12'
    inputs: {}
    formula: 2 * cos(3 * 0.4) * 6 * cos(3 * 0.4) - 2 * sin(3 * 0.4) * (-6 * sin(3 * 0.4))
    expected: '12'
    shown: ['= \langle 0, 0, 12\rangle$, constant']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: circle-area-rate
    where: 'same: area swept at 12/2 = 6 per unit time'
    inputs: {}
    formula: 12 / 2
    expected: '6'
    shown: ['$12/2 = 6$ square units']
    source: {cite: reading1, at: 'Lecture 6, p. 1'}
    origin: page-own

  - id: quarter-speed
    where: 'worked example (b): speed at t = π/2 is √2 ≈ 1.414'
    inputs: {}
    formula: sqrt(2 - 2 * cos(pi / 2))
    expected: '1.414'
    shown: ['speed $\sqrt 2 \approx 1.414$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own
