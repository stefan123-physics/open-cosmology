# Calculations on content/year-1/18.02/triple-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 25 transcript and the Week 10 lecture summary, with the page's own numbers.

page: content/year-1/18.02/triple-integrals.mdx
calcs:
  - id: shadow-radius
    where: 'section "Example": shadow x² + y² ≤ 2, radius √2'
    inputs: {}
    formula: sqrt(4 / 2)
    expected: '1.4142'
    shown: ['a disc of radius $\sqrt 2$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: paraboloid-volume
    where: 'section "Cylindrical coordinates": V = 2π ∫₀^√2 (4 − 2r²) r dr = 4π'
    inputs: {}
    formula: 2 * pi * integrate('(4 - 2*r**2)*r', 'r', 0, sqrt(2))
    expected: '12.566'
    shown: ['= 4\pi$.)']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: cone-inertia
    kind: identity
    where: 'formula "Moment of inertia of a cone": 2π ∫₀^b (z/a)⁴/4 dz = πb⁵/(10a⁴)'
    formula: 2 * pi * integrate('(z/1.5)**4/4', 'z', 0, b)
    equals: pi * b**5 / (10 * 1.5**4)
    samples: {b: [1.0, 2.0]}
    tolerance: 1e-6
    shown: ['= \frac{\pi b^5}{10\,a^4}" cite']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: cylinder-mass
    where: 'worked example: M = π · 2 = 2π'
    inputs: {}
    formula: pi * integrate('z', 'z', 0, 2)
    expected: '6.2832'
    shown: ['= \pi \cdot 2 = 2\pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: cylinder-zbar
    where: 'same: z̄ = (8π/3)/(2π) = 4/3 ≈ 1.33'
    inputs: {}
    formula: pi * integrate('z**2', 'z', 0, 2) / (2 * pi)
    expected: '1.33'
    shown: ['= \frac43 \approx 1.33$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: cylinder-inertia
    where: 'same: I_z = (1/4) · 2π · 2 = π'
    inputs: {}
    formula: integrate('r**3', 'r', 0, 1) * 2 * pi * integrate('z', 'z', 0, 2)
    expected: '3.1416'
    shown: ['= \frac14 \cdot 2\pi \cdot 2 = \pi$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ball-mass
    kind: identity
    where: 'cosmology note: ∫∫∫ ρ dV over a ball = (4π/3)R³ρ (spherical shells)'
    formula: integrate('4*pi*s**2', 's', 0, R)
    equals: 4 * pi / 3 * R**3
    samples: {R: [1.0, 2.5]}
    tolerance: 1e-6
    shown: ['= \frac{4\pi}{3}R^3\rho$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
