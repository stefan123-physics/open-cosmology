# Calculations on content/year-1/18.02/partial-derivatives.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 8 transcript and the Week 4 lecture summary, with the page's own numbers.

page: content/year-1/18.02/partial-derivatives.mdx
calcs:
  - id: level-minus-1
    where: 'section "Contour plots": level −1 of 1 − (x² + y²) is a circle of radius √2 ≈ 1.4'
    inputs: {}
    formula: sqrt(1 - (-1))
    expected: '1.4'
    shown: ['radius $\sqrt 2 \approx 1.4$']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: level-minus-2
    where: 'same: level −2 has radius √3 ≈ 1.7'
    inputs: {}
    formula: sqrt(1 - (-2))
    expected: '1.7'
    shown: ['radius $\sqrt 3 \approx 1.7$']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: level-minus-3
    where: 'same: level −3 has radius 2'
    inputs: {}
    formula: sqrt(1 - (-3))
    expected: '2'
    shown: ['the level $-3$ radius 2']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: lecture-fx
    kind: identity
    where: 'formula "An example": ∂/∂x (x³y + y²) = 3x²y (checked by a difference quotient)'
    formula: ((x + 1e-6)**3 * y + y**2 - (x**3 * y + y**2)) / 1e-6
    equals: 3 * x**2 * y
    samples: {x: [0.5, 1.3], y: [2.0, -0.7]}
    tolerance: 1e-4
    shown: ['f_x = 3x^2 y, \qquad f_y = x^3 + 2y']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: lecture-fy
    kind: identity
    where: 'same: ∂/∂y (x³y + y²) = x³ + 2y'
    formula: (x**3 * (y + 1e-6) + (y + 1e-6)**2 - (x**3 * y + y**2)) / 1e-6
    equals: x**3 + 2 * y
    samples: {x: [0.5, 1.3], y: [2.0, -0.7]}
    tolerance: 1e-4
    shown: ['with derivative 0; in $f_y$, $x^3$ is the constant factor']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: slice-slope
    kind: identity
    where: 'second plot: slope of z = 0.75 − x² at x₀ is −2x₀ = ∂f/∂x of 1 − x² − y²'
    formula: ((0.75 - (x0 + 1e-6)**2) - (0.75 - x0**2)) / 1e-6
    equals: -2 * x0
    samples: {x0: [0.4, -0.6]}
    tolerance: 1e-4
    shown: ['slope ∂f/∂x = −2x₀']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-fx
    where: 'worked example (a): f_x = 2xy = 4 at (1, 2)'
    inputs: {}
    formula: 2 * 1 * 2
    expected: '4'
    shown: ['$2 \cdot 1 \cdot 2 = 4$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-fy
    where: 'same: f_y = x² + 6y = 13'
    inputs: {}
    formula: 1**2 + 6 * 2
    expected: '13'
    shown: ['$1 + 12 = 13$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-f
    where: 'same: f(1, 2) = 2 + 12 = 14'
    inputs: {}
    formula: 1**2 * 2 + 3 * 2**2
    expected: '14'
    shown: ['$f(1, 2) = 2 + 12 = 14$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-estimate
    where: 'worked example (b): f(1.1, 2) ≈ 14 + 4 × 0.1 = 14.4'
    inputs: {}
    formula: 14 + 4 * 0.1
    expected: '14.4'
    shown: ['$f(1.1, 2) \approx 14.4$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-exact
    where: 'same: exact f(1.1, 2) = 1.21 × 2 + 12 = 14.42'
    inputs: {}
    formula: 1.1**2 * 2 + 3 * 2**2
    expected: '14.42'
    shown: ['$f(1.1, 2) = 1.21 \times 2 + 12 = 14.42$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
