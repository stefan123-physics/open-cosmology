# Calculations on content/year-1/18.02/flux-through-surfaces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 27 transcript and the Week 11 lecture summary, with the page's own numbers.

page: content/year-1/18.02/flux-through-surfaces.mdx
calcs:
  - id: radial-flux
    kind: identity
    where: 'formula "Flux of the radial field": a × 4πa² = 4πa³'
    formula: a * 4 * pi * a**2
    equals: 4 * pi * a**3
    samples: {a: [1.0, 2.5]}
    tolerance: 1e-9
    shown: ['= a \cdot 4\pi a^2 = 4\pi a^3']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: zk-flux
    where: 'formula "Flux of z k through the sphere": 2π a³ · (2/3) = (4/3)πa³ (a = 1.5)'
    inputs: {}
    formula: 2 * pi * integrate('1.5**3 * cos(p)**2 * sin(p)', 'p', 0, pi)
    expected: '14.137'
    shown: ['\right]_0^{\pi} = \frac43\pi a^3']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: cylinder-flux
    where: 'worked example (a): 2π · 1 · 2 = 4π ≈ 12.6'
    inputs: {}
    formula: 2 * pi * 1 * 2
    expected: '12.6'
    shown: ['$2\pi \cdot 1 \cdot 2 = 4\pi \approx 12.6$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: hemisphere-flux
    where: 'worked example (b): ∫∫ cos φ sin φ dφ dθ over the upper hemisphere = π'
    inputs: {}
    formula: 2 * pi * integrate('cos(p)*sin(p)', 'p', 0, pi / 2)
    expected: '3.1416'
    shown: ['= 2\pi \cdot \frac12 = \pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: disc-flux
    where: 'worked example (c): 2 × π = 2π'
    inputs: {}
    formula: 2 * pi
    expected: '6.2832'
    shown: ['$2 \times \pi = 2\pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: gauss
    kind: identity
    where: 'cosmology note: (GM/a²) · 4πa² = 4πGM for every a'
    formula: G * M / a**2 * 4 * pi * a**2
    equals: 4 * pi * G * M
    samples: {G: [1.0, 2.0], M: [3.0, 0.5], a: [0.7, 4.0]}
    tolerance: 1e-9
    shown: ['\cdot 4\pi a^2 = -4\pi GM$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own
