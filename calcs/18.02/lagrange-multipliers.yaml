# Calculations on content/year-1/18.02/lagrange-multipliers.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 13 transcript and the Week 5 lecture summary, with the page's own numbers.

page: content/year-1/18.02/lagrange-multipliers.mdx
calcs:
  - id: lambda-determinant
    where: 'section "Solving the equations": det [[2, −λ], [λ, −2]] = −4 + λ² = 0 at λ = 2'
    inputs: {}
    formula: 2 * (-2) - (-2) * 2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$-4 + \lambda^2 = 0$, so $\lambda = \pm 2$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: hyperbola-minimum
    where: 'same: at (√3, √3), f = 6 and xy = 3'
    inputs: {}
    formula: sqrt(3)**2 + sqrt(3)**2
    expected: '6'
    shown: ['At both points $f = 6$']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: hyperbola-lambda
    where: 'same: ∇f = 2∇g at (√3, √3): f_x = 2x = 2√3, λ g_x = 2y = 2√3'
    inputs: {}
    formula: (2 * sqrt(3)) / sqrt(3)
    expected: '2'
    shown: ['and on the picture $\nabla f$ is indeed twice $\nabla g$']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: pyramid-derivative
    kind: identity
    where: 'formula "The solution": ∂f/∂u₁ = ½a₁ u₁/√(u₁² + h²), and ∂g/∂u₁ = ½a₁'
    formula: (0.5 * a * sqrt((u + 1e-6)**2 + h**2) - 0.5 * a * sqrt((u - 1e-6)**2 + h**2)) / 2e-6
    equals: 0.5 * a * u / sqrt(u**2 + h**2)
    samples: {a: [3.0, 5.0], u: [0.4, 1.2], h: [2.0, 0.7]}
    tolerance: 1e-6
    shown: ['= \lambda \quad\Longrightarrow\quad u_1 = u_2 = u_3']
    source: {cite: reading2, at: 'pp. 14–15'}
    origin: mit

  - id: example-a-lambda
    where: 'worked example (a): λ/2 + 2λ + 2λ = 9 gives λ = 2'
    inputs: {}
    formula: 9 / (0.5 + 2 + 2)
    expected: '2'
    shown: ['so $\lambda = 2$ and the point is $(1, 2, 2)$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: example-a-distance
    where: 'same: distance √(1 + 4 + 4) = 3'
    inputs: {}
    formula: sqrt(1 + 4 + 4)
    expected: '3'
    shown: ['at distance $\sqrt{1 + 4 + 4} = 3$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-a-on-plane
    where: 'same: (1, 2, 2) satisfies x + 2y + 2z = 9'
    inputs: {}
    formula: 1 + 2 * 2 + 2 * 2
    expected: '9'
    shown: ['the plane $x + 2y + 2z = 9$ closest to the origin']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-b-max
    where: 'worked example (b): (2, 2) on x² + y² = 8 gives xy = 4'
    inputs: {}
    formula: 2 * 2
    expected: '4'
    shown: ['points $(2, 2)$ and $(-2, -2)$ with $f = 4$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-circle
    where: 'same: 2x² = 8 gives x = 2'
    inputs: {}
    formula: sqrt(8 / 2)
    expected: '2'
    shown: ['$2x^2 = 8$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-min
    where: 'same: (2, −2) gives xy = −4'
    inputs: {}
    formula: 2 * (-2)
    expected: '-4'
    shown: ['points $(2, -2)$ and $(-2, 2)$ with $f = -4$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own
