# Calculations on content/year-1/18.02/gradient-fields-and-curl.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 21 transcript and the Week 9 lecture summary, with the page's own numbers.

page: content/year-1/18.02/gradient-fields-and-curl.mdx
calcs:
  - id: c1-integral
    kind: identity
    where: 'formula "The two pieces": ∫₀^{x₁} 4x² dx = (4/3)x₁³'
    formula: integrate('4*x**2', 'x', 0, x1)
    equals: 4 / 3 * x1**3
    samples: {x1: [1.0, 2.5, -1.5]}
    tolerance: 1e-6
    shown: ['\int_{C_1} = \int_0^{x_1} 4x^2\,dx = \tfrac43 x_1^3']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: c2-integral
    kind: identity
    where: 'same: ∫₀^{y₁} (3y² + 4x₁²) dy = y₁³ + 4x₁²y₁'
    formula: integrate('3*y**2 + 4*1.7**2', 'y', 0, y1)
    equals: y1**3 + 4 * 1.7**2 * y1
    samples: {y1: [0.5, 2.0]}
    tolerance: 1e-6
    shown: ['\int_0^{y_1} (3y^2 + 4x_1^2)\,dy = y_1^3 + 4x_1^2 y_1']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: potential-gradient
    kind: identity
    where: 'formula "The potential": ∂/∂x of (4/3)x³ + 4x²y + y³ = 4x² + 8xy'
    formula: ((4 / 3 * (x + 1e-6)**3 + 4 * (x + 1e-6)**2 * y + y**3) - (4 / 3 * (x - 1e-6)**3 + 4 * (x - 1e-6)**2 * y + y**3)) / 2e-6
    equals: 4 * x**2 + 8 * x * y
    samples: {x: [0.5, -1.2], y: [1.5, 0.3]}
    tolerance: 1e-5
    shown: ['f(x, y) = \tfrac43 x^3 + 4x^2y + y^3']
    source: {cite: reading1, at: 'Lecture 21, p. 1'}
    origin: mit

  - id: rotation-curl
    where: 'section "Curl": curl ⟨−y, x⟩ = 1 − (−1) = 2'
    inputs: {}
    formula: 1 - (-1)
    expected: '2'
    shown: ['has curl $1 - (-1) = 2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: quiz-3
    where: 'quiz 3: curl ⟨−3y, 3x⟩ = 3 − (−3) = 6'
    inputs: {}
    formula: 3 - (-3)
    expected: '6'
    shown: ['$N_x - M_y = 3 - (-3) = 6$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-b-c1
    where: 'worked example (b): along the x-axis ∫₀¹ 3 dx = 3'
    inputs: {}
    formula: integrate('3', 'x', 0, 1)
    expected: '3'
    shown: ['$\int_0^1 3\,dx = 3$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-b-c2
    where: 'same: up ∫₀² (1 + 4y) dy = 10'
    inputs: {}
    formula: integrate('1 + 4*y', 'y', 0, 2)
    expected: '10'
    shown: ['$\int_0^2 (1 + 4y)\,dy = 2 + 8 = 10$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-b-f
    where: 'same: f(1, 2) = 1·2 + 3 + 2·4 = 13'
    inputs: {}
    formula: 1**2 * 2 + 3 * 1 + 2 * 2**2
    expected: '13'
    shown: ['$f(1, 2) = 2 + 3 + 8 = 13$']
    source: {cite: reading1, at: 'Lecture 21, p. 1'}
    origin: page-own
