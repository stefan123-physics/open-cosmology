# Calculations on content/year-1/18.02/18-02-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# the slope of a least-squares line as covariance over variance and its intercept from the point of the averages,
# the area of an inscribed triangle from its three sides, numerical derivatives for the critical point, the second
# derivatives and the entries of the two chain-rule matrices, and the given w_r, w_θ recovered from the answer of 3(d).

