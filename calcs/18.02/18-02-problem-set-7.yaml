# Calculations on content/year-1/18.02/18-02-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# the integral of Problem 1 by numerical integration over x from 0 to infinity, the average distance of Problem 2 by a
# numerical integral, the parallel axis theorem of Problem 3 on a rectangle and on the lesson's disc, the area formula
# of Problem 4 against Heron's formula with the three chords as sides, the average area by a numerical double integral
# of the product form over both halves of the square, the pieces of Problem 5 against numerical partial derivatives and
# the inverse map, its value by numerical double integrals in both coordinate systems and in both orders, and the area
# of the ellipse of Problem 6 from the determinant of its quadratic form.

page: content/year-1/18.02/18-02-problem-set-7.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the six problems of Part B (3 + 2 + 4 + 5 + 5 + 4)'
    inputs: {}
    formula: 3 + 2 + 4 + 5 + 5 + 4
    expected: '23'
    shown: ['six problems (23 points)']
    source: {cite: mit, at: 'Part B, pp. 1–2'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['15 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

  # ---- Problem 1

  - id: p1-a
    kind: identity
    answer: p1-a
    where: 'Problem 1(a), answer box: the integral of e^(−xy) over y from 1 to a, against numerical integration'
    formula: (exp(-x) - exp(-a*x))/x
    equals: integrate('exp(-x*y)', 'y', 1, a)
    samples: {x: [1.5, 2, 3, 0.7], a: [1.5, 2.5, 4, 0.5]}
    tolerance: 1e-9
    shown: ['\right]_{y=1}^{y=a} = \frac{e^{-x} - e^{-ax}}{x}']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b-inner
    kind: identity
    where: 'Problem 1(b): the inner integral of e^(−xy) over x from 0 to infinity is 1/y, against numerical integration'
    formula: 1/y
    equals: integrate('exp(-x*y)', 'x', 0, inf)
    samples: {y: [1, 1.7, 3, 0.5]}
    tolerance: 1e-8
    shown: ['= 0 + \frac{1}{y} = \frac{1}{y}']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b
    kind: identity
    answer: p1-b
    where: 'Problem 1(b), answer box: ln a, against numerical integration of (e^(−x) − e^(−ax))/x from 0 to infinity (also for a < 1)'
    formula: log(a)
    equals: integrate('(exp(-x) - exp(-a*x))/x', 'x', 0, inf)
    samples: {a: [1.5, 2, 4, 0.5]}
    tolerance: 1e-8
    shown: ['= \ln a - \ln 1 = \ln a']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-ln2
    where: 'Problem 1(b), check: ln 2'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['the result is $\ln 2 = 0.693$']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-numeric
    where: 'Problem 1(b), check: the integral for a = 2 by numerical integration'
    inputs: {}
    formula: integrate('(exp(-x) - exp(-2*x))/x', 'x', 0, inf)
    expected: '0.693'
    shown: ['finds the same $0.693$']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-small-x
    kind: identity
    where: 'Problem 1(b), check: near x = 0 the quotient is close to a − 1 (taken at x = 0.000001)'
    formula: a - 1
    equals: (exp(-x) - exp(-a*x))/x
    samples: {a: [2, 3, 0.5], x: [0.000001, 0.000001, 0.000001]}
    tolerance: 1e-4
    shown: ['\approx a - 1$, a finite number']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-average
    kind: identity
    where: 'Problem 2: the average distance 2a/3, against a numerical integral of r · r over r, times 2π, divided by πa²'
    formula: 2*a/3
    equals: 2*pi*integrate('r*r', 'r', 0, a) / (pi*a**2)
    samples: {a: [1, 2.5, 0.4]}
    tolerance: 1e-9
    shown: ['\cdot \frac{2\pi a^3}{3} = \frac{2a}{3}']
    source: {cite: mit, at: 'Part B, Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-half
    kind: identity
    where: 'Problem 2, check: without the factor r the average of r along a radius is a/2'
    formula: a/2
    equals: integrate('r', 'r', 0, a) / a
    samples: {a: [1, 2.5, 0.4]}
    tolerance: 1e-9
    shown: ['would have been $a/2$']
    source: {cite: mit, at: 'Part B, Problem 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-mass
    where: 'Problem 3, our example: the mass of the rectangle 0 ≤ x ≤ 3, 0 ≤ y ≤ 2 with density 1'
    inputs: {}
    formula: 3 * 2
    expected: '6'
    shown: ['$M = 6$']
    source: {cite: mit, at: 'Part B, Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-xbar
    where: 'Problem 3, our example: the x-coordinate of the centre of mass, (1/M) ∫∫ x dA'
    inputs: {}
    formula: 2 * integrate('x', 'x', 0, 3) / 6
    expected: '1.5'
    shown: ['by symmetry $\bar x = 1.5$']
    source: {cite: mit, at: 'Part B, Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-i
    where: 'Problem 3, our example: the moment of inertia about the y-axis'
    inputs: {}
    formula: 2 * integrate('x**2', 'x', 0, 3)
    expected: '18'
    shown: ['x^2\,dx\,dy = 2 \cdot 9 = 18$']
    source: {cite: mit, at: 'Part B, Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-ibar
    where: 'Problem 3, our example: the moment of inertia about the line x = 1.5'
    inputs: {}
    formula: 2 * integrate('(x - 1.5)**2', 'x', 0, 3)
    expected: '4.5'
    shown: ['(x - 1.5)^2\,dx\,dy = 2 \cdot 2.25 = 4.5$']
    source: {cite: mit, at: 'Part B, Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-mx2
    where: 'Problem 3, our example: M times the square of x̄'
    inputs: {}
    formula: 6 * 1.5**2
    expected: '13.5'
    shown: ['$M\bar x^2 = 6 \cdot 2.25 = 13.5$']
    source: {cite: mit, at: 'Part B, Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-sum
    where: 'Problem 3, our example: the two sides of the theorem agree'
    inputs: {}
    formula: 2 * integrate('(x - 1.5)**2', 'x', 0, 3) + 6 * 1.5**2
    expected: '18'
    shown: ['Indeed $4.5 + 13.5 = 18$']
    source: {cite: mit, at: 'Part B, Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-disc
    kind: identity
    where: 'Problem 3: the disc about a rim point by the theorem, πa⁴/2 + πa² · a², against the lesson''s integral of 4a⁴cos⁴θ from −π/2 to π/2'
    formula: pi*a**4/2 + pi*a**2 * a**2
    equals: integrate('4*a**4*cos(t)**4', 't', -pi/2, pi/2)
    samples: {a: [1, 1.7, 0.6]}
    tolerance: 1e-9
    shown: ['$\pi a^4/2 + \pi a^2 \cdot a^2 = 3\pi a^4/2$']
    source: {cite: reading1, at: 'Lecture 17, p. 3 (the disc about a point of its circumference)'}
    origin: page-own

  # ---- Problem 4(a)

  - id: p4-given
    kind: fact
    where: 'Problem 4: MIT''s recalled maximum, the equilateral triangle with side √3 and area 3√3/4'
    shown: ['with sides of length $\sqrt 3$ and area $3\sqrt 3/4$']
    source: {cite: mit, at: 'Part B, Problem 4, p. 2'}
    origin: mit

  - id: p4-a
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box: the area, against Heron''s formula with the three chords 2 sin(θ₁/2), 2 sin((θ₂ − θ₁)/2), 2 sin(θ₂/2) as sides'
    formula: (sin(t1) + sin(t2 - t1) - sin(t2))/2
    equals: sqrt((2*sin(t1/2) + 2*sin((t2 - t1)/2) + 2*sin(t2/2)) * (-2*sin(t1/2) + 2*sin((t2 - t1)/2) + 2*sin(t2/2)) * (2*sin(t1/2) - 2*sin((t2 - t1)/2) + 2*sin(t2/2)) * (2*sin(t1/2) + 2*sin((t2 - t1)/2) - 2*sin(t2/2))) / 4
    samples: {t1: [0.3, 1.2, 2.0, 0.9, 0.75], t2: [3.3, 4.5, 2.6, 6.0, 3.9]}
    tolerance: 1e-9
    shown: ['\text{Area} = \tfrac12\left(\sin\theta_1 + \sin(\theta_2 - \theta_1) - \sin\theta_2\right) \qquad']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-a-det
    kind: identity
    where: 'Problem 4(a): the determinant of the two sides, multiplied out'
    formula: (cos(t1) - 1)*sin(t2) - sin(t1)*(cos(t2) - 1)
    equals: sin(t1) + sin(t2 - t1) - sin(t2)
    samples: {t1: [0.3, 1.2, 2.0, 0.9, 5.1], t2: [3.3, 4.5, 2.6, 6.0, 1.4]}
    tolerance: 1e-9
    shown: ['- \sin\theta_1(\cos\theta_2 - 1) = \sin\theta_1 + \sin(\theta_2 - \theta_1) - \sin\theta_2']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-a-product
    kind: identity
    where: 'Problem 4(a): the product form of the determinant'
    formula: sin(t1) + sin(t2 - t1) - sin(t2)
    equals: 4*sin(t1/2)*sin((t2 - t1)/2)*sin(t2/2)
    samples: {t1: [0.3, 1.2, 2.0, 0.9, 5.1], t2: [3.3, 4.5, 2.6, 6.0, 1.4]}
    tolerance: 1e-9
    shown: ['= 4\,\sin\frac{\theta_1}{2}\,\sin\frac{\theta_2 - \theta_1}{2}\,\sin\frac{\theta_2}{2}']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-a-check-right
    where: 'Problem 4(a), check: the triangle (1, 0), (0, 1), (−1, 0), half of base 2 times height 1'
    inputs: {}
    formula: (sin(pi/2) + sin(pi - pi/2) - sin(pi))/2
    expected: '1'
    shown: ['The formula gives $\tfrac12(1 + 1 - 0) = 1$']
    source: {cite: mit, at: 'Part B, Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-a-check-equilateral
    where: 'Problem 4(a), check: the equilateral triangle, θ₁ = 2π/3 and θ₂ = 4π/3'
    inputs: {}
    formula: (sin(2*pi/3) + sin(4*pi/3 - 2*pi/3) - sin(4*pi/3))/2
    expected: '1.299'
    shown: ['= \tfrac{3\sqrt 3}{4} = 1.299$, the maximum that MIT quotes']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-a-hint-true
    where: 'Problem 4(a), hint of a listed mistake: the triangle (1, 0), (0, 1), (0, −1) has area 1'
    inputs: {}
    formula: (sin(pi/2) + sin(3*pi/2 - pi/2) - sin(3*pi/2))/2
    expected: '1'
    shown: ['a triangle with base 2 and height 1, so its area is 1. Your formula gives 0.']
    source: {cite: mit, at: 'Part B, Problem 4 (our own numbers)'}
    origin: page-own

  # ---- Problem 4(b)

  - id: p4-b-square
    where: 'Problem 4(b): the area of the square, (2π)², in units of π²'
    inputs: {}
    formula: (2*pi)**2 / pi**2
    expected: '4'
    shown: ['Its area is $(2\pi)^2 = 4\pi^2$']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-inner
    kind: identity
    where: 'Problem 4(b): the inner integral over θ₁ from 0 to θ₂, against numerical integration'
    formula: 2 - 2*cos(t2) - t2*sin(t2)
    equals: integrate('sin(t1) + sin(t2 - t1) - sin(t2)', 't1', 0, t2)
    samples: {t2: [0.4, 1.9, 3.3, 5.1, 6.2]}
    tolerance: 1e-9
    shown: ['d\theta_1 = 2 - 2\cos\theta_2 - \theta_2\sin\theta_2']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-outer
    where: 'Problem 4(b): the outer integral, in units of π, by numerical integration'
    inputs: {}
    formula: integrate('2 - 2*cos(t) - t*sin(t)', 't', 0, 2*pi) / pi
    expected: '6.000'
    shown: ['= 4\pi - 0 - (-2\pi) = 6\pi']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-average
    answer: p4-b-average
    where: 'Problem 4(b), answer box: the average area, by a numerical double integral of the product form 2 sin(θ₁/2) sin((θ₂ − θ₁)/2) sin(θ₂/2) over the half θ₁ < θ₂ of the square, doubled, divided by 4π²'
    inputs: {}
    formula: 2 * integrate('integrate("2*sin(t1/2)*sin((t2 - t1)/2)*sin(t2/2)", "t1", 0, t2)', 't2', 0, 2*pi) / (4*pi**2)
    expected: '0.477'
    shown: ['= \frac{3}{2\pi} = 0.477']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-average-exact
    where: 'Problem 4(b): 3/(2π)'
    inputs: {}
    formula: 3 / (2*pi)
    expected: '0.477'
    shown: ['The average, $0.477$, lies between']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-other-half
    where: 'Problem 4(b), check: the half θ₁ > θ₂ of the square gives the same integral as the half θ₁ < θ₂ (both in units of π), with the product form and its sign changed'
    inputs: {}
    formula: integrate('integrate("-2*sin(t1/2)*sin((t2 - t1)/2)*sin(t2/2)", "t1", t2, 2*pi)', 't2', 0, 2*pi) / pi
    expected: '3.000'
    shown: ['So the two halves contribute equally']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-second-route
    where: 'Problem 4(b), check: the average by the product form over both halves of the square'
    inputs: {}
    formula: (integrate('integrate("2*sin(t1/2)*sin((t2 - t1)/2)*sin(t2/2)", "t1", 0, t2)', 't2', 0, 2*pi) + integrate('integrate("-2*sin(t1/2)*sin((t2 - t1)/2)*sin(t2/2)", "t1", t2, 2*pi)', 't2', 0, 2*pi)) / (4*pi**2)
    expected: '0.477'
    shown: ['finds $0.477$ again']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-max
    where: 'Problem 4(b): the maximum area 3√3/4'
    inputs: {}
    formula: 3*sqrt(3)/4
    expected: '1.299'
    shown: ['The maximum is $3\sqrt 3/4 = 1.299$']
    source: {cite: mit, at: 'Part B, Problem 4, p. 2'}
    origin: mit

  - id: p4-b-max-again
    where: 'Problem 4(b), check: the maximum area again'
    inputs: {}
    formula: 3*sqrt(3)/4
    expected: '1.299'
    shown: ['and the maximum $1.299$, as an average must']
    source: {cite: mit, at: 'Part B, Problem 4, p. 2'}
    origin: mit

  - id: p4-b-ratio
    answer: p4-b-ratio
    where: 'Problem 4(b), answer box: the maximum area divided by the average area'
    inputs: {}
    formula: (3*sqrt(3)/4) / (3/(2*pi))
    expected: '2.72'
    shown: ['= \frac{\pi\sqrt 3}{2} = 2.72']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-ratio-rounded
    where: 'Problem 4(b): the same ratio to two digits'
    inputs: {}
    formula: pi*sqrt(3)/2
    expected: '2.7'
    shown: ['about $2.7$ times as large']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-percent
    where: 'Problem 4(b): the average as a percentage of the maximum'
    inputs: {}
    formula: (3/(2*pi)) / (3*sqrt(3)/4) * 100
    expected: '37'
    shown: ['about 37% of the largest possible area']
    source: {cite: mit, at: 'Part B, Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-b-disc-area
    where: 'Problem 4(b), comparison: the area of the unit disc'
    inputs: {}
    formula: pi
    expected: '3.142'
    shown: ['has area $\pi = 3.142$']
    source: {cite: mit, at: 'Part B, Problem 4 (our own numbers)'}
    origin: page-own

  - id: p4-b-disc-percent
    where: 'Problem 4(b), comparison: the average triangle as a percentage of the unit disc, 3/(2π²)'
    inputs: {}
    formula: (3/(2*pi)) / pi * 100
    expected: '15'
    shown: ['covers $3/(2\pi^2)$ of it, about 15%']
    source: {cite: mit, at: 'Part B, Problem 4 (our own numbers)'}
    origin: page-own

  # ---- Problem 5

  - id: p5-jacobian
    kind: identity
    answer: p5-jacobian
    where: 'Problem 5, answer box: the Jacobian 2v, against numerical partial derivatives of u = xy and v = y/x at the point x = 1.3, y = 1.3v'
    formula: 2*v
    equals: deriv('t*(v*1.3)', 't', 1.3) * deriv('t/1.3', 't', v*1.3) - deriv('1.3*t', 't', v*1.3) * deriv('(v*1.3)/t', 't', 1.3)
    samples: {v: [0.1, 0.25, 0.4, 0.9]}
    tolerance: 1e-6
    shown: ['= \frac{y}{x} + \frac{y}{x} = \frac{2y}{x} = 2v']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-g
    kind: identity
    answer: p5-g
    where: 'Problem 5, answer box: g(u, v), against (x² + y²)/(2v) at the point x = √(u/v), y = √(uv) of the inverse map'
    formula: u/(2*v**2) + u/2
    equals: (sqrt(u/v)**2 + sqrt(u*v)**2) / (2 * (sqrt(u*v)/sqrt(u/v)))
    samples: {u: [0.2, 0.6, 1, 0.45], v: [0.1, 0.25, 0.4, 0.3]}
    tolerance: 1e-9
    shown: ['\frac{1}{2v} = \frac{u}{2v^2} + \frac{u}{2}']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-inverse
    kind: identity
    where: 'Problem 5: the inverse map x = √(u/v), y = √(uv) gives back u = xy (and v = y/x in the next entry)'
    formula: sqrt(u/v) * sqrt(u*v)
    equals: u
    samples: {u: [0.2, 0.6, 1, 0.45], v: [0.1, 0.25, 0.4, 0.3]}
    tolerance: 1e-9
    shown: ['$x = \sqrt{u/v}$ and $y = \sqrt{uv}$']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-inverse-v
    kind: identity
    where: 'Problem 5: the inverse map gives back v = y/x, so uv = y² and u/v = x²'
    formula: sqrt(u*v) / sqrt(u/v)
    equals: v
    samples: {u: [0.2, 0.6, 1, 0.45], v: [0.1, 0.25, 0.4, 0.3]}
    tolerance: 1e-9
    shown: ['gives $uv = y^2$ and $u/v = x^2$']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-inner-lower
    kind: identity
    answer: p5-inner-lower
    where: 'Problem 5, answer box: the lower limit of v, against v = y/x at the point of the line x = 2 where xy = u (y = u/2)'
    formula: u/4
    equals: (u/2) / 2
    samples: {u: [0.2, 0.6, 1]}
    tolerance: 1e-12
    shown: ['$u = 2y$ and $v = y/2$, so it is the line $v = u/4$']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-inner-upper
    kind: identity
    answer: p5-inner-upper
    where: 'Problem 5, answer box: the upper limit of v, against v = y/x at the point of the line x = 1 where xy = u (y = u)'
    formula: u
    equals: (u/1) / 1
    samples: {u: [0.2, 0.6, 0.9]}
    tolerance: 1e-12
    shown: ['$u = y$ and $v = y$, so it is the line $v = u$']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-outer-lower
    answer: p5-outer-lower
    where: 'Problem 5, answer box: the lower limit of u, the value of u = xy on the x-axis (taken at x = 1.5, y = 0)'
    inputs: {}
    formula: 1.5 * 0
    expected: '0'
    shown: ['$y = 0$, so $u = 0$ and $v = 0$']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-outer-upper
    answer: p5-outer-upper
    where: 'Problem 5, answer box: the upper limit of u, the value of u = xy on the hyperbola (taken at x = 1.6, y = 1/1.6)'
    inputs: {}
    formula: 1.6 * (1/1.6)
    expected: '1'
    shown: ['The hyperbola $xy = 1$ is $u = 1$.']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-corner
    where: 'Problem 5: the corner (2, 1/2) of R goes to u = 1, v = 1/4 (the entry checks v)'
    inputs: {}
    formula: 0.5 / 2
    expected: '0.25'
    shown: ['$(0, 0)$, $(1, 1)$ and $(1, \tfrac14)$']
    source: {cite: mit, at: 'Part B, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-inner-integral
    kind: identity
    where: 'Problem 5, our addition: the inner integral over v from u/4 to u, against numerical integration'
    formula: 3/2 + 3*u**2/8
    equals: integrate('u/(2*v**2) + u/2', 'v', u/4, u)
    samples: {u: [0.1, 0.5, 1]}
    tolerance: 1e-9
    shown: ['- \left(-2 + \frac{u^2}{8}\right) = \frac32 + \frac{3u^2}{8}']
