# Calculations on content/year-1/18.02/differentials-and-chain-rule.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 11 transcript and the Week 5 lecture summary, with the page's own numbers.

page: content/year-1/18.02/differentials-and-chain-rule.mdx
calcs:
  - id: arcsin-derivative
    kind: identity
    where: 'formula "Derivative of the inverse sine": d(arcsin x)/dx = 1/√(1 − x²)'
    formula: (asin(x + 1e-7) - asin(x - 1e-7)) / 2e-7
    equals: 1 / sqrt(1 - x**2)
    samples: {x: [0.2, -0.5, 0.8]}
    tolerance: 1e-5
    shown: ['= \frac{1}{\sqrt{1 - x^2}}" cite']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: lecture-chain-example
    kind: identity
    where: 'section "Why the chain rule holds": d/dt (t² eᵗ + sin t) = 2t eᵗ + t² eᵗ + cos t'
    formula: ((t + 1e-6)**2 * exp(t + 1e-6) + sin(t + 1e-6) - (t - 1e-6)**2 * exp(t - 1e-6) - sin(t - 1e-6)) / 2e-6
    equals: 2 * t * exp(t) + t**2 * exp(t) + cos(t)
    samples: {t: [0.0, 0.7, 1.5]}
    tolerance: 1e-5
    shown: ['= 2te^t + t^2e^t + \cos t$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: quotient-rule
    kind: identity
    where: 'section "Product and quotient rules": (1/v)u′ − (u/v²)v′ = (u′v − uv′)/v²'
    formula: (1 / v) * du - (u / v**2) * dv
    equals: (du * v - u * dv) / v**2
    samples: {u: [1.0, -2.0], v: [3.0, 0.5], du: [0.4, 2.0], dv: [-1.0, 1.5]}
    tolerance: 1e-9
    shown: ['which over the common denominator $v^2$ is the usual quotient rule']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: mit

  - id: example-a-chain
    where: 'worked example (a): dw/dt at π/4 by the chain rule ≈ 0.354'
    inputs: {}
    formula: sin(pi / 4)**2 * (-sin(pi / 4)) + 2 * cos(pi / 4) * sin(pi / 4) * cos(pi / 4)
    expected: '0.354'
    shown: ['= -0.3536 + 0.7071 \approx 0.354$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-a-substitution
    where: 'same, by substitution: −sin³ t + 2 sin t cos² t at π/4 ≈ 0.354'
    inputs: {}
    formula: -sin(pi / 4)**3 + 2 * sin(pi / 4) * cos(pi / 4)**2
    expected: '0.354'
    shown: ['At $t = \pi/4$: $-0.3536 + 0.7071 \approx 0.354$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-a-root
    where: 'same: x = y = √2/2 ≈ 0.7071'
    inputs: {}
    formula: sqrt(2) / 2
    expected: '0.7071'
    shown: ['$x = y = \sqrt2/2 \approx 0.7071$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-b-polar
    kind: identity
    where: 'worked example (b): cos θ · 2r cos θ + sin θ · 2r sin θ = 2r'
    formula: cos(th) * 2 * r * cos(th) + sin(th) * 2 * r * sin(th)
    equals: 2 * r
    samples: {r: [1.0, 2.5], th: [0.3, 2.0]}
    tolerance: 1e-9
    shown: ['\sin\theta \cdot 2r\sin\theta = 2r$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: matter-density-rate
    kind: identity
    where: 'cosmology note: for ρ = C a⁻³, (dρ/da)(da/dt) = −3Hρ with H = ȧ/a'
    formula: (-3 * C * a**(-4)) * adot
    equals: -3 * (adot / a) * (C * a**(-3))
    samples: {C: [1.0, 2.0], a: [0.5, 1.3], adot: [0.7, 0.2]}
    tolerance: 1e-9
    shown: ['= -3\frac{\rho}{a}\,\dot a = -3H\rho$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
