# Calculations on content/year-1/18.02/matrices.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 3 transcript and the Week 2 lecture summary, with the page's own numbers.

page: content/year-1/18.02/matrices.mdx
calcs:
  - id: product-entry
    where: 'section "Multiplying matrices": row 1, 2, 3, 4 times column 0, 3, 0, 2 = 14'
    inputs: {}
    formula: 1 * 0 + 2 * 3 + 3 * 0 + 4 * 2
    expected: '14'
    shown: ['$0 + 6 + 0 + 8 = 14$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: top-left-minor
    where: 'cofactor method: top-left minor 4 × 2 − 5 × 1 = 3'
    inputs: {}
    formula: 4 * 2 - 5 * 1
    expected: '3'
    shown: ['$4 \cdot 2 - 5 \cdot 1 = 3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: det-a
    where: 'lecture example: det A = 3'
    inputs: {}
    formula: 2 * (4 * 2 - 5 * 1) - 3 * (2 * 2 - 5 * 1) + 3 * (2 * 1 - 4 * 1)
    expected: '3'
    shown: ['$\det A = 3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: inverse-a-row1-col1
    where: 'formula "The lecture''s inverse": row 1 of A times column 1 of adj(A) = det A = 3'
    inputs: {}
    formula: 2 * 3 + 3 * 1 + 3 * (-2)
    expected: '3'
    shown: ['A^{-1} = \frac{1}{3}\begin{bmatrix} 3 & -3 & 3 \\ 1 & 1 & -4 \\ -2 & 1 & 2 \end{bmatrix}']
    source: {cite: reading1, at: 'Lecture 3, p. 2'}
    origin: mit

  - id: inverse-a-row3-col3
    where: 'same: row 3 of A times column 3 of adj(A) = 3'
    inputs: {}
    formula: 1 * 3 + 1 * (-4) + 2 * 2
    expected: '3'
    shown: ['It gives the old coordinates']
    source: {cite: reading1, at: 'Lecture 3, p. 2'}
    origin: mit

  - id: inverse-a-offdiag
    where: 'same: row 2 of A times column 1 of adj(A) = 0'
    inputs: {}
    formula: 2 * 3 + 4 * 1 + 5 * (-2)
    expected: '0'
    tolerance: '1e-12'
    shown: ['divided by the determinant']
    source: {cite: reading1, at: 'Lecture 3, p. 2'}
    origin: mit

  - id: rotation-squared
    where: 'R² = −I: top-left entry of R² is 0·0 + (−1)·1 = −1, top-right 0·(−1) + (−1)·0 = 0'
    inputs: {}
    formula: 0 * 0 + (-1) * 1
    expected: '-1'
    shown: ['easy: $R^2 = -I$']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: plane-normal-x
    where: 'worked example (a): N = ⟨6, 3, 2⟩, x component 2·3 − 0·0'
    inputs: {}
    formula: 2 * 3 - 0 * 0
    expected: '6'
    shown: ['= \langle 6, 3, 2\rangle$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: plane-normal-y
    where: 'same: y component −((−1)·3 − 0·(−1)) = 3'
    inputs: {}
    formula: -((-1) * 3 - 0 * (-1))
    expected: '3'
    shown: ['-((-1) \cdot 3 - 0 \cdot (-1))']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: plane-normal-z
    where: 'same: z component (−1)·0 − 2·(−1) = 2'
    inputs: {}
    formula: (-1) * 0 - 2 * (-1)
    expected: '2'
    shown: ['(-1) \cdot 0 - 2 \cdot (-1)\rangle']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: plane-check-p2
    where: 'same: P₂ = (0, 2, 0) gives 6x + 3y + 2z = 6'
    inputs: {}
    formula: 6 * 0 + 3 * 2 + 2 * 0
    expected: '6'
    shown: ['$P_2$ gives $3 \cdot 2 = 6$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: plane-check-p3
    where: 'same: P₃ = (0, 0, 3) gives 6'
    inputs: {}
    formula: 6 * 0 + 3 * 0 + 2 * 3
    expected: '6'
    shown: ['$P_3$ gives $2 \cdot 3 = 6$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: det-m
    where: 'worked example (b): det M = 1·1 − 2·(−1) + 0 = 3'
    inputs: {}
    formula: 1 * (1 * 1 - 1 * 0) - 2 * (0 * 1 - 1 * 1) + 0 * (0 * 0 - 1 * 1)
    expected: '3'
    shown: ['$\det M = 1 \cdot 1 - 2 \cdot (-1) + 0 = 3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: m-adj-check-1
    where: 'same: row 1 of M times column 1 of adj(M) = 3'
    inputs: {}
    formula: 1 * 1 + 2 * 1 + 0 * (-1)
    expected: '3'
    shown: ['$1 + 2 + 0 = 3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: m-adj-check-2
    where: 'same: row 1 of M times column 2 of adj(M) = 0'
    inputs: {}
    formula: 1 * (-2) + 2 * 1 + 0 * 2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$-2 + 2 + 0 = 0$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: solution-x3
    where: 'same: X = ⟨1, 1, 2⟩; third entry (−1 + 2 + 1) × 3 / 3 = 2'
    inputs: {}
    formula: (-1 + 2 + 1) * 3 / 3
    expected: '2'
    shown: ['$X = \langle 1, 1, 2\rangle$']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: page-own

  - id: solution-check
    where: 'same: M⟨1, 1, 2⟩ first entry 1 + 2 = 3'
    inputs: {}
    formula: 1 * 1 + 2 * 1 + 0 * 2
    expected: '3'
    shown: ['\langle 1 + 2,\ 1 + 2,\ 1 + 2\rangle = \langle 3, 3, 3\rangle$']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: page-own
