# Calculations on content/year-1/18.02/18-02-problem-set-6.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# the constrained derivative of Problem 1 against direct substitution for linear functions and for one other pair (g = x²y, f = xy² + xz),
# the derivative of Problem 2(a) against the numerical derivative after solving the relation for y,
# and the slope of Problem 2(b) by elimination, by the cross product of the two gradients, and by putting a
# small step along the tangent back into both equations.

page: content/year-1/18.02/18-02-problem-set-6.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the two problems of Part B (4 + 4)'
    inputs: {}
    formula: 4 + 4
    expected: '8'
    shown: ['two longer problems (8 points)']
    source: {cite: mit, at: 'Part B, p. 1'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['8 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

  # ---- Problem 1

  - id: p1-b
    kind: identity
    answer: p1-b
    where: 'Problem 1(b), answer box: f_x − f_y g_x / g_y, against the numerical derivative for linear functions with these formal derivatives, f = fx·x + fy·y + fz·z and g = gx·x + gy·y = 1, after substituting y = (1 − gx·u)/gy, at z = 0.3'
    formula: fx - fy*gx/gy
    equals: deriv('fx*u + fy*(1 - gx*u)/gy + fz*0.3', 'u', 0.5)
    samples: {fx: [1.0, 1.7, -0.6, 2.0, 0.3], fy: [1.0, 1.4, 2.2, -1.5, 0.8], fz: [1.0, -2.0, 0.5, 1.5, 3.0], gx: [1.0, 1.9, -0.7, 1.2, 2.5], gy: [3.0, 3.6, -1.1, 0.4, 4.0]}
    tolerance: 1e-6
    shown: ['expr="fx - fy*gx/gy"']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-b-example-subst
    kind: identity
    where: 'Problem 1(b), check: f_x − f_y g_x / g_y for g = x²y and f = xy² + xz, against the numerical derivative of w after substituting y = c/u² with c = x²y'
    formula: (y**2 + z) - (2*x*y) * (2*x*y) / (x**2)
    equals: deriv('u * (x**2 * y / u**2)**2 + u * z', 'u', x)
    samples: {x: [0.7, 1.2, 1.9, 2.4, 1.1], y: [0.5, 0.7, -1.3, 2.0, 0.3], z: [0.5, -0.4, 1.6, 0.2, 3.0]}
    tolerance: 1e-6
    shown: ['\left(\frac{\partial w}{\partial x}\right)_z = f_x - \frac{f_y\,g_x}{g_y}']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-b-example
    kind: identity
    where: 'Problem 1(b), check: for g = x²y and f = xy² + xz the formula simplifies to z − 3y²'
    formula: (y**2 + z) - (2*x*y) * (2*x*y) / (x**2)
    equals: z - 3*y**2
    samples: {x: [0.7, 1.2, 1.9, 2.4, 1.1], y: [0.5, 0.7, -1.3, 2.0, 0.3], z: [0.5, -0.4, 1.6, 0.2, 3.0]}
    tolerance: 1e-9
    shown: ['$y^2 + z - (2xy)(2xy)/x^2 = z - 3y^2$']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-b-example-direct
    kind: identity
    where: 'Problem 1(b), check: the direct derivative −3c²/x⁴ + z with c = x²y, against z − 3y²'
    formula: -3 * (x**2 * y)**2 / x**4 + z
    equals: z - 3*y**2
    samples: {x: [0.7, 1.2, 1.9, 2.4, 1.1], y: [0.5, 0.7, -1.3, 2.0, 0.3], z: [0.5, -0.4, 1.6, 0.2, 3.0]}
    tolerance: 1e-9
    shown: ['is $-3c^2/x^4 + z = z - 3y^2$']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-b-lecture-form
    kind: identity
    where: 'Problem 1(b), check: the lecture''s (∂f/∂z)_y = −f_x g_z/g_x + f_z for g = x + yz² and f = x²z + y, against the numerical derivative after substituting x = c − y u² with c = x + yz²'
    formula: -(2*x*z) * (2*y*z) / 1 + x**2
    equals: deriv('(x + y*z**2 - y*u**2)**2 * u + y', 'u', z)
    samples: {x: [0.7, 1.2, 1.9, 2.4, 1.1], y: [0.5, 0.7, -1.3, 2.0, 0.3], z: [0.5, -0.4, 1.6, 0.2, 3.0]}
    tolerance: 1e-5
    shown: ['\left(\frac{\partial f}{\partial z}\right)_y = -\frac{f_x\,g_z}{g_x} + f_z']
    source: {cite: reading1, at: 'Lecture 15, p. 2'}
    origin: mit

  # ---- Problem 2(a)

  - id: p2-a
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box: x³y + x³ tan(x + y), against the numerical derivative with respect to t of w = x³ t (arcsin t − x) at t = sin(x + y)'
    formula: x**3 * y + x**3 * tan(x + y)
    equals: deriv('x**3 * u * (asin(u) - x)', 'u', sin(x + y))
    samples: {x: [0.4, 0.5, 0.6, 0.8, 1.0, -0.3], y: [0.2, 0.6, 0.35, 0.5, 0.0, 0.9]}
    tolerance: 1e-6
    shown: ['expr="x^3*y + x^3*tan(x + y)"']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-t-form
    kind: identity
    where: 'Problem 2(a): the form with t, x³y + x³t/cos(x + y), against the form with the tangent'
    formula: x**3 * y + x**3 * sin(x + y) / cos(x + y)
    equals: x**3 * y + x**3 * tan(x + y)
    samples: {x: [0.4, 0.5, 0.6, 0.8, 1.0, -0.3], y: [0.2, 0.6, 0.35, 0.5, 0.0, 0.9]}
    tolerance: 1e-9
    shown: ['x^3 y + \frac{x^3\,t}{\cos(x + y)} = x^3 y + x^3\tan(x + y)']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-substitution
    kind: identity
    where: 'Problem 2(a), check: the derivative by substitution, x³(arcsin t − x) + x³t/√(1 − t²) at t = sin(x + y), against the answer'
    formula: x**3 * (asin(sin(x + y)) - x) + x**3 * sin(x + y) / sqrt(1 - sin(x + y)**2)
    equals: x**3 * y + x**3 * tan(x + y)
    samples: {x: [0.4, 0.5, 0.6, 0.8, 1.0, -0.3], y: [0.2, 0.6, 0.35, 0.5, 0.0, 0.9]}
    tolerance: 1e-9
    shown: ['x^3(\arcsin t - x) + \frac{x^3\,t}{\sqrt{1 - t^2}}']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-number
    where: 'Problem 2(a), check: the answer at x = 1, y = 0'
    inputs: {}
    formula: 1**3 * 0 + 1**3 * tan(1 + 0)
    expected: '1.557'
    shown: ['both forms give $0 + \tan 1 = 1.557$']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-number-substitution
    where: 'Problem 2(a), check: the substitution form at x = 1, t = sin 1'
    inputs: {}
    formula: 1**3 * (asin(sin(1)) - 1) + 1**3 * sin(1) / sqrt(1 - sin(1)**2)
    expected: '1.557'
    shown: ['both forms give $0 + \tan 1 = 1.557$']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  # ---- Problem 2(b)

  - id: p2-b-point-1
    where: 'Problem 2(b): the first equation at (1, 1, 2)'
    inputs: {}
    formula: 1**5 + 1*2
    expected: '3'
    shown: ['$x^5 + yz = 1 + 2 = 3$']
    source: {cite: mit, at: 'Part B, Problem 2(b), p. 1'}
    origin: mit

  - id: p2-b-point-2
    where: 'Problem 2(b): the second equation at (1, 1, 2)'
    inputs: {}
    formula: 1*1**2 + 1*2**2 + 2*1**2
    expected: '7'
    shown: ['$xy^2 + yz^2 + zx^2 = 1 + 4 + 2 = 7$']
    source: {cite: mit, at: 'Part B, Problem 2(b), p. 1'}
    origin: mit

  - id: p2-b-g1-x
    where: 'Problem 2(b): coefficient of dx in the first relation, 5x⁴ at x = 1, by numerical derivative'
    inputs: {}
    formula: deriv('u**5 + 1*2', 'u', 1)
    expected: '5.000'
    shown: ['5\,dx + 2\,dy + dz = 0']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-g2-x
    where: 'Problem 2(b): coefficient of dx in the second relation, y² + 2xz at (1, 1, 2), by numerical derivative'
    inputs: {}
    formula: deriv('u*1**2 + 1*2**2 + 2*u**2', 'u', 1)
    expected: '5.000'
    shown: ['$1 + 4 = 5$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-g2-y
    where: 'Problem 2(b): coefficient of dy in the second relation, 2xy + z² at (1, 1, 2), by numerical derivative'
    inputs: {}
    formula: deriv('1*u**2 + u*2**2 + 2*1**2', 'u', 1)
    expected: '6.000'
    shown: ['$2 + 4 = 6$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-g2-z
    where: 'Problem 2(b): coefficient of dz in the second relation, 2yz + x² at (1, 1, 2), by numerical derivative'
    inputs: {}
    formula: deriv('1*1**2 + 1*u**2 + u*1**2', 'u', 2)
    expected: '5.000'
    shown: ['$4 + 1 = 5$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-elim-dx
    where: 'Problem 2(b): coefficient of dx after removing dz, 5 − 5·5'
    inputs: {}
    formula: 5 - 5*5
    expected: '-20'
    shown: ['$-20\,dx - 4\,dy = 0$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-elim-dy
    where: 'Problem 2(b): coefficient of dy after removing dz, 6 − 5·2'
    inputs: {}
    formula: 6 - 5*2
    expected: '-4'
    shown: ['$-20\,dx - 4\,dy = 0$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: dx/dy = −(6 − 5·2)/(5 − 5·5)'
    inputs: {}
    formula: -(6 - 5*2) / (5 - 5*5)
    expected: '-0.2'
    shown: ['\frac{dx}{dy} = -\frac15 = -0.2']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-dz
    where: 'Problem 2(b): dz/dy = −5 (dx/dy) − 2'
    inputs: {}
    formula: -5 * (-1/5) - 2
    expected: '-1'
    shown: ['so $dz/dy = -1$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-step-1
    where: 'Problem 2(b), check: the first equation at the stepped point (0.998, 1.01, 1.99)'
    inputs: {}
    formula: 0.998**5 + 1.01*1.99
    expected: '2.99994'
    shown: ['gives $x^5 + yz = 2.99994$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-step-2
    where: 'Problem 2(b), check: the second equation at the stepped point (0.998, 1.01, 1.99)'
    inputs: {}
    formula: 0.998*1.01**2 + 1.01*1.99**2 + 1.99*0.998**2
    expected: '6.99981'
    shown: ['$xy^2 + yz^2 + zx^2 = 6.99981$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-step-miss
    where: 'Problem 2(b), check: the larger of the two misses, 7 − 6.99981, is within 0.0002'
    inputs: {}
    formula: 7 - (0.998*1.01**2 + 1.01*1.99**2 + 1.99*0.998**2)
    expected: '0.0002'
    shown: ['Both equations still hold to within $0.0002$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-cross-x
    where: 'Problem 2(b), check: x component of ⟨5, 2, 1⟩ × ⟨5, 6, 5⟩'
    inputs: {}
    formula: 2*5 - 1*6
    expected: '4'
    shown: ['= \langle 4, -20, 20\rangle']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-cross-y
    where: 'Problem 2(b), check: y component of ⟨5, 2, 1⟩ × ⟨5, 6, 5⟩'
    inputs: {}
    formula: 1*5 - 5*5
    expected: '-20'
    shown: ['= \langle 4, -20, 20\rangle']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-cross-z
    where: 'Problem 2(b), check: z component of ⟨5, 2, 1⟩ × ⟨5, 6, 5⟩'
    inputs: {}
    formula: 5*6 - 2*5
    expected: '20'
    shown: ['= \langle 4, -20, 20\rangle']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-cross-slope
    where: 'Problem 2(b), check: dx/dy from the cross product, 4/(−20)'
    inputs: {}
    formula: (2*5 - 1*6) / (1*5 - 5*5)
    expected: '-0.2'
    shown: ['is $4/(-20) = -0.2$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-cross-dz
    where: 'Problem 2(b), check: dz/dy from the cross product, 20/(−20)'
    inputs: {}
    formula: (5*6 - 2*5) / (1*5 - 5*5)
    expected: '-1'
    shown: ['is $20/(-20) = -1$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own
