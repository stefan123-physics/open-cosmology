    where: 'Problem 1(a): the parameter s = 2/(2 − x0) at the screen, against a numerical solve'
    formula: 2/(2 - x0)
    equals: solve('2 + s*(x0 - 2)', 's', 0, 1)
    samples: {x0: [-1.5, -1, -0.5, -0.2]}
    tolerance: 1e-8
    shown: ['which gives $s = 2/(2 - x_0)$']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b-lambda
