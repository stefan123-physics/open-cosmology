    formula: 2*((1 - t)*p0 + t*p1)/((1 - t)*d0 + t*d1)
    equals: (1 - t*d1/((1 - t)*d0 + t*d1))*2*p0/d0 + (t*d1/((1 - t)*d0 + t*d1))*2*p1/d1
    samples: {t: [0, 0.25, 0.5, 0.8, 1], p0: [-3, 1, 0.4, -2, 5], p1: [4, 6, -1.5, 0.7, 2], d0: [3, 2.2, 5, 0.9, 4], d1: [4, 6, 1.5, 3.1, 4]}
    tolerance: 1e-9
    shown: ['\lambda = \frac{t\,d_1}{(1 - t)\,d_0 + t\,d_1}']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

