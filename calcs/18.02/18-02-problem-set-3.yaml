# Calculations on content/year-1/18.02/18-02-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# a numerical solve of the line of sight for the screen formulas, the line through the eye parallel to the flight
# and a numerical limit for the vanishing point, the picture of the fence for the hidden part, numerical
# derivatives for every partial derivative, and a numerical solve of the two equations for the critical points.

page: content/year-1/18.02/18-02-problem-set-3.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the three problems of Part B (8 + 4 + 7)'
    inputs: {}
    formula: 8 + 4 + 7
    expected: '19'
    shown: ['three longer problems (19 points)']
    source: {cite: mit, at: 'Part B, pp. 1–2'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['10 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

  # ---- Problem 1

  - id: p1-eye
    kind: fact
    where: 'Problem 1: MIT''s position of the eye'
    shown: ['tex="E = (2, 0, 0)"']
    source: {cite: mit, at: 'Part B, Problem 1, p. 1'}
    origin: mit

  - id: p1-a-y
    kind: identity
    answer: p1-a-y
    where: 'Problem 1(a), answer box: the y coordinate on the screen, against y0 times the parameter s at which the line of sight x = 2 + s(x0 − 2) reaches x = 0, solved numerically'
    formula: 2*y0/(2 - x0)
    equals: y0 * solve('2 + s*(x0 - 2)', 's', 0, 1)
    samples: {x0: [-1.5, -1, -0.5, -0.2], y0: [0.5, 1, 2, 3]}
    tolerance: 1e-8
    shown: ['y = \frac{2\,y_0}{2 - x_0}']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-z
    kind: identity
    answer: p1-a-z
    where: 'Problem 1(a), answer box: the z coordinate on the screen, against z0 times the parameter s at which the line of sight reaches x = 0, solved numerically'
    formula: 2*z0/(2 - x0)
    equals: z0 * solve('2 + s*(x0 - 2)', 's', 0, 1)
    samples: {x0: [-1.5, -1, -0.5, -0.2], z0: [0.5, 1, 2, 3]}
    tolerance: 1e-8
    shown: ['z = \frac{2\,z_0}{2 - x_0}']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-parameter
