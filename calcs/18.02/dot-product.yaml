# Calculations on content/year-1/18.02/dot-product.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 1 transcript and the Week 1 lecture summary, with the page's own numbers.

page: content/year-1/18.02/dot-product.mdx
calcs:
  - id: length-321
    where: 'section "Vectors" and quiz 1: |⟨3, 2, 1⟩| = √14'
    inputs: {}
    formula: 3**2 + 2**2 + 1**2
    expected: '14'
    shown: ['$|\vec A|^2 = |\vec B|^2 + 1 = 14$']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: law-of-cosines
    kind: identity
    where: 'formula "The law of cosines in vector form": |A − B|² = |A|² + |B|² − 2 A·B'
    formula: (a1 - b1)**2 + (a2 - b2)**2 + (a3 - b3)**2
    equals: (a1**2 + a2**2 + a3**2) + (b1**2 + b2**2 + b3**2) - 2 * (a1 * b1 + a2 * b2 + a3 * b3)
    samples: {a1: [1.0, -2.0], a2: [3.0, 0.5], a3: [0.0, 4.0], b1: [2.0, 1.0], b2: [-1.0, 2.0], b3: [5.0, -3.0]}
    tolerance: 1e-9
    shown: ['= |\vec A|^2 + |\vec B|^2 - 2\,\vec A \cdot \vec B']
    source: {cite: reading2, at: 'pp. 7–8'}
    origin: mit

  - id: angle-pqr
    where: 'formula "An angle in space": cos θ = 1/√10, θ ≈ 71.6° (lecture: about 71.5°)'
    inputs: {}
    formula: acos(1 / sqrt(10)) * 180 / pi
    expected: '71.6'
    shown: ['\qquad \theta \approx 71.6°']
    source: {cite: reading2, at: 'pp. 9–10'}
    origin: mit

  - id: quiz-2
    where: 'quiz 2: ⟨1, −2, 3⟩ · ⟨4, 1, −1⟩ = −1'
    inputs: {}
    formula: 1 * 4 + (-2) * 1 + 3 * (-1)
    expected: '-1'
    shown: ['= 4 - 2 - 3 = -1$: a number']
    source: {cite: reading2, at: 'pp. 5–6'}
    origin: page-own

  - id: example-a
    where: 'worked example (a): |⟨2, −1, 2⟩| = 3, |⟨1, 1, 0⟩| = √2 ≈ 1.414'
    inputs: {}
    formula: sqrt(4 + 1 + 4)
    expected: '3'
    shown: ['$|\vec A| = \sqrt{4 + 1 + 4} = 3$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-a-b
    where: 'same: √2 ≈ 1.414'
    inputs: {}
    formula: sqrt(2)
    expected: '1.414'
    shown: ['$|\vec B| = \sqrt 2 \approx 1.414$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b-cos
    where: 'worked example (b): cos θ = 1/(3√2) ≈ 0.236'
    inputs: {}
    formula: 1 / (3 * sqrt(2))
    expected: '0.236'
    shown: ['\approx 0.236$ and']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: example-b-angle
    where: 'same: θ ≈ 76.4°'
    inputs: {}
    formula: acos(1 / (3 * sqrt(2))) * 180 / pi
    expected: '76.4'
    shown: ['$\theta \approx 76.4°$']
    source: {cite: reading2, at: 'p. 10'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): ⟨1, 2, 0⟩ · ⟨2, −1, 2⟩ = 0'
    inputs: {}
    formula: 1 * 2 + 2 * (-1) + 0 * 2
    expected: '0'
    tolerance: '1e-12'
    shown: ['\langle 2, -1, 2\rangle = 0$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own
