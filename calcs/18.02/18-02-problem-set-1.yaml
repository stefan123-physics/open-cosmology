  - id: p3-fourth-face-x
    kind: identity
    where: 'Problem 3, formula "The vector of the fourth face": the x component of (B − A) × (C − A) against that of B × C + A × B + C × A'
    formula: (b2 - a2)*(c3 - a3) - (b3 - a3)*(c2 - a2)
    equals: (b2*c3 - b3*c2) + (a2*b3 - a3*b2) + (c2*a3 - c3*a2)
