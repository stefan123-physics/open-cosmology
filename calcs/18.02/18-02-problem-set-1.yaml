# Calculations on content/year-1/18.02/18-02-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# the law of cosines for the bond angle, the formula for an equilateral triangle for the area, Cramer's rule and
# the product A(NM) = I for the inverse matrix, and the equations put back in for the diet.

page: content/year-1/18.02/18-02-problem-set-1.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the five problems of Part B (5 + 3 + 3 + 9 + 7)'
    inputs: {}
    formula: 5 + 3 + 3 + 9 + 7
    expected: '27'
    shown: ['five longer problems (27 points)']
    source: {cite: mit, at: 'Part B, pp. 2–4'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['15 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

  # ---- Problem 1

  - id: p1-a-edge
    answer: p1-a-edge
    where: 'Problem 1(a), answer box: the length of the edge from (1, 1, 1) to (1, −1, −1)'
    inputs: {}
    formula: sqrt(0**2 + (-2)**2 + (-2)**2)
    expected: '2.828'
    shown: ['= \sqrt 8 = 2\sqrt 2 = 2.828']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-edge-02
    where: 'Problem 1(a): the edge from P0 to P2 has the same length, from the coordinates'
    inputs: {}
    formula: sqrt((-1 - (1))**2 + (1 - (1))**2 + (-1 - (1))**2)
    expected: '2.828'
    shown: ['its length is $\sqrt{4 + 4} = 2\sqrt 2$ every time']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-edge-03
