    equals: c1*(a2*b3 - a3*b2) + c2*(a3*b1 - a1*b3) + c3*(a1*b2 - a2*b1)
    samples: {a1: [1, 0.3, -2, 1.5], a2: [0, 1.1, 0.7, -0.4], a3: [0, -0.6, 1.3, 2.2], b1: [0, 2.1, 0.5, -1.2], b2: [2, 0.4, -1.8, 0.9], b3: [0, 1.7, 0.2, 1.4], c1: [0, -0.9, 1.6, 0.8], c2: [0, 0.8, 2.4, -2.1], c3: [3, 2.5, -0.3, 0.6]}
    tolerance: 1e-9
