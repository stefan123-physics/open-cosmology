  # ---- Problem 3

  - id: p3-cyclic
    kind: identity
    where: 'Problem 3: A · (B × C) = B · (C × A), by components, at four sets of vectors'
    formula: a1*(b2*c3 - b3*c2) + a2*(b3*c1 - b1*c3) + a3*(b1*c2 - b2*c1)
    equals: b1*(c2*a3 - c3*a2) + b2*(c3*a1 - c1*a3) + b3*(c1*a2 - c2*a1)
    samples: {a1: [1, 0.3, -2, 1.5], a2: [0, 1.1, 0.7, -0.4], a3: [0, -0.6, 1.3, 2.2], b1: [0, 2.1, 0.5, -1.2], b2: [2, 0.4, -1.8, 0.9], b3: [0, 1.7, 0.2, 1.4], c1: [0, -0.9, 1.6, 0.8], c2: [0, 0.8, 2.4, -2.1], c3: [3, 2.5, -0.3, 0.6]}
    tolerance: 1e-9
    shown: ['= \det(\vec A, \vec B, \vec C) > 0']
    source: {cite: mit, at: 'Part B, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-cyclic-2
    kind: identity
