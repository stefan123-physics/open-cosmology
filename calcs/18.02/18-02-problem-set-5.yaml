  - id: p1-a-fx
    where: 'Problem 1(a): f_x at (1/2, 1), from the formula on the page'
    inputs: {x: 0.5, y: 1}
    formula: (3*x**2 - y**2 - 8*x + 3 + 2*x*y)
    expected: '-0.25'
    shown: ['f_x = \tfrac34 - 1 - 4 + 3 + 1 = -\tfrac14']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-fx-numeric
    where: 'Problem 1(a), independent route: f_x at (1/2, 1) by numerical differentiation of f'
    inputs: {}
    formula: deriv('q**3 - q*1**2 - 4*q**2 + 3*q + q**2*1', 'q', 0.5)
    expected: '-0.25'
    shown: ['f_x = 3x^2 - y^2 - 8x + 3 + 2xy']
    source: {cite: mit, at: 'Part B, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-fy
