# Calculations on content/year-1/18.02/18-02-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# numerical differentiation of f and g for the gradients, the cosine and sine of each angle, the difference quotient
# of the experiment, the linear approximation put back in, the Lagrange equations solved numerically one by one, and
# a direct minimisation of the distance on the surface (with y = −z) for the closest point.

page: content/year-1/18.02/18-02-problem-set-5.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the three problems of Part B (8 + 5 + 6)'
    inputs: {}
    formula: 8 + 5 + 6
    expected: '19'
    shown: ['three longer problems (19 points)']
    source: {cite: mit, at: 'Part B, pp. 1–2'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['8 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

