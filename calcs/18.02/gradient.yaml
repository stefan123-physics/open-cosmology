# Calculations on content/year-1/18.02/gradient.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 12 transcript and the Week 5 lecture summary, with the page's own numbers.

page: content/year-1/18.02/gradient.mdx
calcs:
  - id: hyperboloid-plane
    where: 'formula "Tangent plane to the hyperboloid": 4·2 + 2·1 − 2·1 = 8'
    inputs: {}
    formula: 4 * 2 + 2 * 1 - 2 * 1
    expected: '8'
    shown: ['$4x + 2y - 2z = 8 + 2 - 2$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: hyperboloid-point
    where: 'same: (2, 1, 1) is on x² + y² − z² = 4'
    inputs: {}
    formula: 2**2 + 1**2 - 1**2
    expected: '4'
    shown: ['the hyperboloid $x^2 + y^2 - z^2 = 4$ at $(2, 1, 1)$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: quiz-2
    where: 'quiz 2: |⟨3, 4⟩| = 5'
    inputs: {}
    formula: sqrt(9 + 16)
    expected: '5'
    shown: ['$|\\nabla w| = \\sqrt{9 + 16} = 5$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-a-line
    where: 'worked example (a): 2 + 4 = 6 for the tangent line 2x + 4y = 6'
    inputs: {}
    formula: 2 * 1 + 4 * 1
    expected: '6'
    shown: ['$2x + 4y = 2 + 4 = 6$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-b-unit
    where: 'worked example (b): (3/5)² + (4/5)² = 1'
    inputs: {}
    formula: (3 / 5)**2 + (4 / 5)**2
    expected: '1'
    shown: ['$(3/5)^2 + (4/5)^2 = 1$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b
    where: 'same: ⟨2, 4⟩ · ⟨3/5, 4/5⟩ = 22/5 = 4.4'
    inputs: {}
    formula: 2 * 3 / 5 + 4 * 4 / 5
    expected: '4.4'
    shown: ['$dw/ds = \langle 2, 4\rangle \cdot \langle 3/5, 4/5\rangle = 6/5 + 16/5 = 22/5 = 4.4$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-c-max
    where: 'worked example (c): |∇w| = √20 ≈ 4.47'
    inputs: {}
    formula: sqrt(4 + 16)
    expected: '4.47'
    shown: ['$|\nabla w| = \sqrt{4 + 16} = \sqrt{20} \approx 4.47$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-c-cos
    where: 'same: cos θ = 4.4/4.47 ≈ 0.98'
    inputs: {}
    formula: 4.4 / sqrt(20)
    expected: '0.98'
    shown: ['$\cos\theta = 4.4/4.47 \approx 0.98$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-c-level
    where: 'same: ⟨2, 4⟩ · ⟨2, −1⟩ = 0'
    inputs: {}
    formula: 2 * 2 + 4 * (-1)
    expected: '0'
    tolerance: '1e-12'
    shown: ['The rate is zero along $\pm\langle 2, -1\rangle/\sqrt 5$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: quiz-4
    where: 'quiz 4: (1, 2, 2) is on x² + y² + z² = 9'
    inputs: {}
    formula: 1 + 4 + 4
    expected: '9'
    shown: ['$x^2 + y^2 + z^2 = 9$ at $(1, 2, 2)$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
