# Calculations on content/year-1/18.02/18-02-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# the distance between the lines by three routes (the step A to C along the normal, the difference of the two d values,
# and the length of the segment between the closest points), the two times by putting them back into both conditions,
# the parametric equations against the two pegs placed by their rotation angles, and the velocity and acceleration
# against numerical derivatives.

page: content/year-1/18.02/18-02-problem-set-2.mdx
calcs:
