    expected: '2'
    shown: ['so its angular velocity is $2$ radians per second']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-x
    kind: identity
    answer: p2-a-x
    where: 'Problem 2(a), answer box: x(t), against half the sum of the x-coordinates of the two pegs placed by their rotation angles'
    formula: sin(t) + sin(2*t)/2
    equals: (2*cos(pi/2 - t) + cos(2*t - pi/2)) / 2
    samples: {t: [0.2, 0.45, 0.7, 1.9, 3.3, 5.1]}
    tolerance: 1e-9
    shown: ['x(t) = \sin t + \tfrac12\sin 2t']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-y
    kind: identity
    answer: p2-a-y
    where: 'Problem 2(a), answer box: y(t), against half the sum of the y-coordinates of the two pegs placed by their rotation angles'
    formula: cos(t) - cos(2*t)/2 - 1/2
    equals: ((-2 + 2*sin(pi/2 - t)) + (1 + sin(2*t - pi/2))) / 2
    samples: {t: [0.2, 0.45, 0.7, 1.9, 3.3, 5.1]}
    tolerance: 1e-9
    shown: ['y(t) = \cos t - \tfrac12\cos 2t - \tfrac12']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

