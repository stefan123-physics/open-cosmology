  # ---- Problem 1(b)

  - id: p1-b-cond-ab
    kind: identity
    where: 'Problem 1(b), formula "The two conditions": P1P2 · AB from the coordinates of the two moving points, against 11 − 11 t1 − 15 t2'
    formula: ((1 - t2) - (2 + t1))*1 + ((1 + 4*t2) - (4 - 3*t1))*(-3) + ((3 - 2*t2) - t1)*1
    equals: 11 - 11*t1 - 15*t2
    samples: {t1: [0, 1, -4, 0.7, 2.3], t2: [0, 1, 3.6667, -1.4, 0.5]}
    tolerance: 1e-9
    shown: ['11 - 11t_1 - 15t_2 = 0']
    source: {cite: mit, at: 'Part B, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-cond-cd
