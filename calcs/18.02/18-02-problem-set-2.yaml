  # ---- Problem 2(a)

  - id: p2-a-rim-speed
    where: 'Problem 2(a): the speed of the rim of the large gear, radius 2 times angular velocity 1'
    inputs: {}
    formula: 2 * 1
    expected: '2'
    shown: ['moves with speed $2 \times 1 = 2$']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-small-omega
    where: 'Problem 2(a): the angular velocity of the small gear, rim speed 2 over radius 1'
    inputs: {}
