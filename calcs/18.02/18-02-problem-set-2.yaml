    formula: -sin(t) + sin(2*t)
    equals: deriv('cos(u) - cos(2*u)/2 - 1/2', 'u', t)
    samples: {t: [0.2, 0.45, 0.7, 1.9, 3.3, 5.1]}
    tolerance: 1e-6
