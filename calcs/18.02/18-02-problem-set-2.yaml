  # ---- Problem 2(b)

  - id: p2-b-vx
    kind: identity
    answer: p2-b-vx
    where: 'Problem 2(b), answer box: the x-component of the velocity, against the numerical derivative of x(t)'
    formula: cos(t) + cos(2*t)
    equals: deriv('sin(u) + sin(2*u)/2', 'u', t)
    samples: {t: [0.2, 0.45, 0.7, 1.9, 3.3, 5.1]}
    tolerance: 1e-6
    shown: ['\vec v(t) = \langle \cos t + \cos 2t,']
