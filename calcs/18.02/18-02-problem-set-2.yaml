    where: 'Introduction: the points of the two problems of Part B (6 + 6)'
    inputs: {}
    formula: 6 + 6
    expected: '12'
    shown: ['two longer problems (12 points)']
    source: {cite: mit, at: 'Part B, p. 1'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['15 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

