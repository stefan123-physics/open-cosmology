# Calculations on content/year-1/18.02/change-of-variables.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 18 transcript and the Week 8 lecture summary, with the page's own numbers.

page: content/year-1/18.02/change-of-variables.mdx
calcs:
  - id: linear-factor
    where: 'formula "The scale factor of a linear change": det [[3, 1], [−2, 1]] = 5'
    inputs: {}
    formula: 3 * 1 - 1 * (-2)
    expected: '5'
    shown: ['= 3 + 2 = 5 =']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: corner-11
    where: 'same: (1, 1) goes to (u, v) = (1, 2)'
    inputs: {}
    formula: 3 * 1 - 2 * 1
    expected: '1'
    shown: ['go to $(0, 0)$, $(3, 1)$, $(-2, 1)$, $(1, 2)$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: polar-jacobian
    kind: identity
    where: 'formula "Jacobian of polar coordinates": cos θ · r cos θ − (−r sin θ) sin θ = r'
    formula: cos(th) * r * cos(th) - (-r * sin(th)) * sin(th)
    equals: r
    samples: {r: [0.5, 2.0], th: [0.3, 2.4]}
    tolerance: 1e-9
    shown: ['= r\cos^2\theta + r\sin^2\theta = r']
    source: {cite: reading1, at: 'Lecture 18, p. 1'}
    origin: mit

  - id: example-new
    where: 'formula "The new integral": ∫₀¹ v(1 − v) dv = 1/6'
    inputs: {}
    formula: integrate('v*(1 - v)', 'v', 0, 1)
    expected: '0.16667'
    shown: ['= \int_0^1 v(1 - v)\,dv = \frac16']
    source: {cite: reading1, at: 'Lecture 18, p. 2'}
    origin: mit

  - id: example-direct
    where: 'same: directly ∫₀¹∫₀¹ x²y dx dy = (1/3)(1/2) = 1/6'
    inputs: {}
    formula: integrate('x**2', 'x', 0, 1) * integrate('y', 'y', 0, 1)
    expected: '0.16667'
    shown: ['\int_0^1\int_0^1 x^2y\,dx\,dy = \int_0^1\int_v^1']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: quiz-1
    where: 'quiz 1: det [[2, 0], [0, 3]] = 6'
    inputs: {}
    formula: 2 * 3 - 0
    expected: '6'
    shown: ['\\end{bmatrix} = 6$, so areas are multiplied by 6']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: tilted-jacobian
    where: 'worked example (a): det [[1, 1], [1, −1]] = −2'
    inputs: {}
    formula: 1 * (-1) - 1 * 1
    expected: '-2'
    shown: ['\end{vmatrix} = -2$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: tilted-integral
    where: 'same: ½ · (8/3) · 2 = 8/3 ≈ 2.67'
    inputs: {}
    formula: 0.5 * integrate('u**2', 'u', 0, 2) * 2
    expected: '2.67'
    shown: ['= \frac12 \cdot \frac83 \cdot 2 = \frac83 \approx 2.67$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: ellipse
    where: 'worked example (b): π · 3 · 2 = 6π ≈ 18.85'
    inputs: {}
    formula: pi * 3 * 2
    expected: '18.85'
    shown: ['$\pi ab = 6\pi \approx 18.85$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own
