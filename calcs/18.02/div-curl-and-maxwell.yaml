# Calculations on content/year-1/18.02/div-curl-and-maxwell.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 33 transcript and the Week 14 lecture summary, with the page's own numbers.

page: content/year-1/18.02/div-curl-and-maxwell.mdx
calcs:
  - id: rotation-curl
    kind: identity
    where: 'formula "Curl of a rotation": third component of curl ω⟨−y, x, 0⟩ is ∂(ωx)/∂x − ∂(−ωy)/∂y = 2ω'
    formula: ((w * (x + 1e-6)) - (w * (x - 1e-6))) / 2e-6 - ((-w * (y + 1e-6)) - (-w * (y - 1e-6))) / 2e-6
    equals: 2 * w
    samples: {w: [0.5, 3.0], x: [0.2, -1.0], y: [1.5, 0.4]}
    tolerance: 1e-5
    shown: ['\nabla \times \vec v = 2\omega\,\hat k']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: gauss-flux
    where: 'worked example (a): flux q/ε₀ for q = 1 nC'
    inputs: {q: 1e-9, eps0: 8.854e-12}
    formula: q / eps0
    expected: '113'
    tolerance: '0.5%'
    shown: ['\approx 113$ volt metres']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: loop-area
    where: 'worked example (b): area π (0.1)² of the loop'
    inputs: {}
    formula: pi * 0.1**2
    expected: '0.0314'
    tolerance: '0.5%'
    shown: ['\pi (0.1)^2 \approx 0.0314$ square metres']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: induced-voltage
    where: 'worked example (b): rate of change of flux 0.0314 × 0.5 ≈ 0.0157 Wb/s = 15.7 mV'
    inputs: {}
    formula: pi * 0.1**2 * 0.5
    expected: '0.0157'
    tolerance: '0.5%'
    shown: ['0.0314 \times 0.5 \approx 0.0157$ webers per second', 'about 15.7 millivolts']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: speed-of-light
    where: 'cosmology callout: 1/√(ε₀μ₀) ≈ 3.00 × 10⁸ m/s'
    inputs: {eps0: 8.854e-12, mu0: 1.2566e-6}
    formula: 1 / sqrt(eps0 * mu0)
    expected: '3.00e8'
    tolerance: '0.5%'
    shown: ['\approx 3.00 \times 10^8$ m/s']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
