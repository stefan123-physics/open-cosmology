# Calculations on content/year-1/18.02/polar-double-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 17 transcript and the Week 7 lecture summary, with the page's own numbers.

page: content/year-1/18.02/polar-double-integrals.mdx
calcs:
  - id: quarter-disc
    where: 'formula "The quarter disc in polar coordinates": (1/4)(π/2) = π/8'
    inputs: {}
    formula: integrate('(1 - r**2)*r', 'r', 0, 1) * pi / 2
    expected: '0.3927'
    tolerance: '0.1%'
    shown: ['\int_0^{\pi/2}\frac14\,d\theta = \frac{\pi}{8}']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: disc-centre
    kind: identity
    where: 'formula "Disc about its centre": 2π a⁴/4 = πa⁴/2'
    formula: 2 * pi * integrate('r**3', 'r', 0, a)
    equals: pi * a**4 / 2
    samples: {a: [1.0, 2.5]}
    tolerance: 1e-6
    shown: ['= 2\pi\,\frac{a^4}{4} = \frac{\pi a^4}{2}']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: disc-rim
    kind: identity
    where: 'formula "Disc about a point on its rim": ∫ 4a⁴cos⁴θ dθ over [−π/2, π/2] = 3πa⁴/2'
    formula: 4 * a**4 * integrate('cos(t)**4', 't', -pi / 2, pi / 2)
    equals: 3 * pi * a**4 / 2
    samples: {a: [1.0, 2.0]}
    tolerance: 1e-6
    shown: ['= \frac{3\pi a^4}{2}']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: mit

  - id: rim-ratio
    where: 'same: three times the moment about the centre'
    inputs: {}
    formula: (3 * pi / 2) / (pi / 2)
    expected: '3'
    shown: ['It is **three times** harder']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: quiz-2
    where: 'quiz 2: area of disc of radius 3 = 9π'
    inputs: {}
    formula: integrate('r', 'r', 0, 3) * 2 * pi / pi
    expected: '9'
    shown: ['$\\frac92 \\cdot 2\\pi = 9\\pi$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: half-disc-moment
    where: 'worked example (a): ∫∫ y dA over the half disc = 16/3'
    inputs: {}
    formula: integrate('r**2', 'r', 0, 2) * integrate('sin(t)', 't', 0, pi)
    expected: '5.333'
    shown: ['= \frac{16}{3}$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: half-disc-centroid
    where: 'same: ȳ = 8/(3π) ≈ 0.849'
    inputs: {}
    formula: (16 / 3) / (2 * pi)
    expected: '0.849'
    shown: ['= \frac{8}{3\pi} \approx 0.849$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: nonuniform-mass
    where: 'worked example (b): M = 2π/3 ≈ 2.09'
    inputs: {}
    formula: 2 * pi * integrate('r**2', 'r', 0, 1)
    expected: '2.09'
    shown: ['= \frac{2\pi}{3} \approx 2.09$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: nonuniform-inertia
    where: 'same: I₀ = 2π/5 ≈ 1.26'
    inputs: {}
    formula: 2 * pi * integrate('r**4', 'r', 0, 1)
    expected: '1.26'
    shown: ['= \frac{2\pi}{5} \approx 1.26$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: uniform-same-mass
    where: 'same: uniform disc of mass 2π/3 has I₀ = (2/3)(π/2) = π/3 ≈ 1.05'
    inputs: {}
    formula: (2 / 3) * pi / 2
    expected: '1.05'
    shown: ['= \frac{\pi}{3} \approx 1.05$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
