# Calculations on content/year-1/18.02/divergence-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 28 transcript and the Week 11 lecture summary, with the page's own numbers.

page: content/year-1/18.02/divergence-theorem.mdx
calcs:
  - id: graph-cross
    kind: identity
    where: 'formula "Flux element for a graph": ⟨1, 0, fx⟩ × ⟨0, 1, fy⟩ = ⟨−fx, −fy, 1⟩ (x component: 0·fy − fx·1)'
    formula: 0 * fy - fx * 1
    equals: -fx
    samples: {fx: [0.3, -2.0], fy: [1.5, 0.7]}
    tolerance: 1e-9
    shown: ['= \langle -f_x, -f_y, 1\rangle\,\Delta x\,\Delta y']
    source: {cite: reading1, at: 'Lecture 28, p. 3'}
    origin: mit

  - id: paraboloid-flux
    where: 'formula "Flux through the paraboloid": ∫₀^{2π}∫₀¹ r³ dr dθ = π/2'
    inputs: {}
    formula: 2 * pi * integrate('r**3', 'r', 0, 1)
    expected: '1.5708'
    shown: ['\int_0^{2\pi}\int_0^1 r^2\,r\,dr\,d\theta = \frac{\pi}{2}']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: sphere-volume
    where: 'section "The divergence theorem": flux of z k out of the sphere = volume (a = 1.5)'
    inputs: {}
    formula: 4 / 3 * pi * 1.5**3
    expected: '14.137'
    shown: ['so the flux is the volume, $\frac43\pi a^3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: cube-flux
    where: 'worked example (a): div ⟨x, y, z⟩ = 3, times volume 1'
    inputs: {}
    formula: 3 * 1
    expected: '3'
    shown: ['$\operatorname{div}\vec F = 3$, times the volume 1, gives 3']
    source: {cite: reading1, at: 'Lecture 28, p. 4'}
    origin: page-own

  - id: paraboloid-area
    where: 'worked example (c): 2π(5√5 − 1)/12 ≈ 5.33'
    inputs: {}
    formula: 2 * pi * integrate('sqrt(4*r**2 + 1)*r', 'r', 0, 1)
    expected: '5.33'
    shown: ['= 2\pi \cdot \frac{5\sqrt5 - 1}{12} \approx 5.33$']
    source: {cite: reading1, at: 'Lecture 28, p. 3'}
    origin: page-own

  - id: paraboloid-area-closed
    where: 'same: the closed form 2π(5√5 − 1)/12'
    inputs: {}
    formula: 2 * pi * (5 * sqrt(5) - 1) / 12
    expected: '5.33'
    shown: ['= 2\pi \cdot \frac{5\sqrt5 - 1}{12}']
    source: {cite: reading1, at: 'Lecture 28, p. 3'}
    origin: page-own

  - id: radial-flux-sphere
    where: 'section "The divergence theorem": ⟨x, y, z⟩ with divergence 3 gives 3 × (4/3)πa³ = 4πa³ (a = 1.5)'
    inputs: {}
    formula: 3 * 4 / 3 * pi * 1.5**3
    expected: '42.41'
    shown: ['gave three times the volume, $4\pi a^3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: shadow-flux
    where: 'worked example (b): flux of k through the paraboloid = area of the unit disc, π'
    inputs: {}
    formula: pi * 1**2
    expected: '3.1416'
    shown: ['so the flux is the area of the shadow, $\pi$']
    source: {cite: reading1, at: 'Lecture 28, p. 3'}
    origin: page-own
