# Calculations on content/year-1/18.02/greens-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 22 transcript and the Week 9 lecture summary, with the page's own numbers.

page: content/year-1/18.02/greens-theorem.mdx
calcs:
  - id: shifted-disc
    where: 'section "An example": ∫∫ x dA over the unit disc centred at (2, 0) = area × x̄ = 2π'
    inputs: {}
    formula: pi * 2
    expected: '6.2832'
    shown: ['that gives $2\pi$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: shifted-disc-direct
    where: 'same, directly: ∫₀^{2π}∫₀¹ (2 + r cos θ) r dr dθ = 2π'
    inputs: {}
    formula: 2 * pi * integrate('2*r', 'r', 0, 1)
    expected: '6.2832'
    shown: ['$\int\int_R x\,dA$ is the area times $\bar x$']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: example-a-green
    where: 'worked example (a): ∫∫ 3r² r dr dθ over the unit disc = 3π/2 ≈ 4.71'
    inputs: {}
    formula: 2 * pi * integrate('3*r**3', 'r', 0, 1)
    expected: '4.71'
    shown: ['= 3 \cdot \frac14 \cdot 2\pi = \frac{3\pi}{2} \approx 4.71$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: example-a-direct
    where: 'same, directly: ∫₀^{2π} (sin⁴θ + cos⁴θ) dθ = 3π/2'
    inputs: {}
    formula: integrate('sin(th)**4 + cos(th)**4', 'th', 0, 2 * pi)
    expected: '4.712'
    shown: ['= 2\pi \cdot \frac34 = \frac{3\pi}{2}$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): ∮ x dy for x = 3 cos t, y = 2 sin t = 6π ≈ 18.85'
    inputs: {}
    formula: integrate('3*cos(t)*2*cos(t)', 't', 0, 2 * pi)
    expected: '18.85'
    shown: ['= 6\pi \approx 18.85$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: quiz-2
    where: 'quiz 2: curl of ⟨−y, x⟩ is 1 − (−1) = 2'
    inputs: {}
    formula: 1 - (-1)
    expected: '2'
    shown: ['$N_x - M_y = 1 - (-1) = 2$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own
