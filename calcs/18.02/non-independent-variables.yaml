# Calculations on content/year-1/18.02/non-independent-variables.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 14 transcript and the Week 6 lecture summary, with the page's own numbers.

page: content/year-1/18.02/non-independent-variables.mdx
calcs:
  - id: lecture-point
    where: 'section "Rates of change": (2, 3, 1) satisfies x² + yz + z³ = 8'
    inputs: {}
    formula: 2**2 + 3 * 1 + 1**3
    expected: '8'
    shown: ['(indeed $4 + 3 + 1 = 8$)']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: lecture-dz-dx
    where: 'formula "Two partial derivatives": ∂z/∂x = −4/6 = −2/3 (checked by implicit differentiation, −2x/(y + 3z²))'
    inputs: {}
    formula: -2 * 2 / (3 + 3 * 1**2)
    expected: '-0.6667'
    shown: ['\frac{\partial z}{\partial x} = -\frac46 = -\frac23']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: lecture-dz-dy
    where: 'same: ∂z/∂y = −z/(y + 3z²) = −1/6'
    inputs: {}
    formula: -1 / (3 + 3 * 1**2)
    expected: '-0.1667'
    shown: ['\frac{\partial z}{\partial y} = -\frac16']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: triangle-differentials
    kind: identity
    where: 'formula "By differentials": ½ab(sin²θ/cos θ + cos θ) = ½ab sec θ'
    formula: 0.5 * a * b * (sin(th)**2 / cos(th) + cos(th))
    equals: 0.5 * a * b / cos(th)
    samples: {a: [3.0, 1.5], b: [5.0, 2.0], th: [0.4, 1.1]}
    tolerance: 1e-9
    shown: ['= \tfrac12 ab\sec\theta" cite']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: triangle-substitution
    kind: identity
    where: 'formula "By substitution": d/dθ (½a² tan θ) = ½a² sec²θ, and with b = a sec θ it equals ½ab sec θ'
    formula: (0.5 * a**2 * tan(th + 1e-6) - 0.5 * a**2 * tan(th - 1e-6)) / 2e-6
    equals: 0.5 * a * (a / cos(th)) / cos(th)
    samples: {a: [3.0, 1.5], th: [0.4, 1.1]}
    tolerance: 1e-5
    shown: ['= \tfrac12 a^2\sec^2\theta" cite']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: quiz-1
    where: 'quiz 1 and worked example (a): on x² + y² + z² = 9 at (1, 2, 2), (∂z/∂x)_y = −x/z = −1/2'
    inputs: {}
    formula: -1 / 2
    expected: '-0.5'
    shown: ['$(\partial z/\partial x)_y = -2/4 = -1/2$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: example-b-hyp
    where: 'worked example (b): b = 3 sec(π/4) = 3√2 ≈ 4.24'
    inputs: {}
    formula: 3 / cos(pi / 4)
    expected: '4.24'
    shown: ['$b = a\sec\theta = 3\sqrt2 \approx 4.24$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b-free
    where: 'same: ½ab cos θ = 4.5'
    inputs: {}
    formula: 0.5 * 3 * (3 / cos(pi / 4)) * cos(pi / 4)
    expected: '4.5'
    shown: ['\frac{\sqrt2}{2} = 4.5$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: example-b-a-fixed
    where: 'same: ½a² sec²θ = 9'
    inputs: {}
    formula: 0.5 * 9 / cos(pi / 4)**2
    expected: '9'
    shown: ['$\frac12 a^2\sec^2\theta = \frac12 \cdot 9 \cdot 2 = 9$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b-b-fixed
    where: 'same: ½b² cos 2θ = 0 at π/4'
    inputs: {}
    formula: 0.5 * 18 * cos(2 * pi / 4)
    expected: '0'
    tolerance: '1e-9'
    shown: ['$(\partial A/\partial\theta)_b = \frac12 b^2\cos 2\theta = 0$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
