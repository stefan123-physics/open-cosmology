# Calculations on content/year-1/18.02/planes-and-linear-systems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 4 transcript and the Week 2 lecture summary, with the page's own numbers.

page: content/year-1/18.02/planes-and-linear-systems.mdx
calcs:
  - id: plane-through-p0
    where: 'formula "Plane through a point": (x − 2) + 5(y − 1) + 10(z + 1) = 0 ⇔ x + 5y + 10z = −3'
    inputs: {}
    formula: 2 + 5 * 1 + 10 * (-1)
    expected: '-3'
    shown: ['$2 + 5 \cdot 1 + 10 \cdot (-1) = -3$']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: plane-identity
    kind: identity
    where: 'same: the expanded form equals x + 5y + 10z + 3'
    formula: (x - 2) + 5 * (y - 1) + 10 * (z + 1)
    equals: x + 5 * y + 10 * z + 3
    samples: {x: [0.0, 1.5], y: [2.0, -1.0], z: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['x + 5y + 10z = -3" cite']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: v-dot-n
    where: 'formula "Parallel to the plane": ⟨1, 2, −1⟩ · ⟨1, 1, 3⟩ = 0'
    inputs: {}
    formula: 1 * 1 + 2 * 1 + (-1) * 3
    expected: '0'
    tolerance: '1e-12'
    shown: ['= 1 + 2 - 3 = 0" cite']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: lecture-system-x
    where: 'section "Three planes": 7 − 4x = 3 gives x = 1, point (1, 1, 0)'
    inputs: {}
    formula: (7 - 3) / 4
    expected: '1'
    shown: ['$7 - 4x = 3$, so $x = 1$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: lecture-system-check
    where: 'same: (1, 1, 0) satisfies x + 2y + 3z = 3'
    inputs: {}
    formula: 1 + 2 * 1 + 3 * 0
    expected: '3'
    shown: ['the point is $(1, 1, 0)$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: quiz-2
    where: 'quiz 2: ⟨1, 1, 1⟩ · ⟨1, −2, 1⟩ = 0'
    inputs: {}
    formula: 1 - 2 + 1
    expected: '0'
    tolerance: '1e-12'
    shown: ['= 1 - 2 + 1 = 0$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: example-a
    where: 'worked example (a): d = 2 − 2 + 12 = 12'
    inputs: {}
    formula: 2 * 1 - 2 + 4 * 3
    expected: '12'
    shown: ['$d = 2 - 2 + 12 = 12$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: example-b-det
    where: 'worked example (b): det A = 1(−1 − 0) − 1(1 − 0) + 1(0 + 2) = 0'
    inputs: {}
    formula: 1 * ((-1) * 1 - 0 * 0) - 1 * (1 * 1 - 0 * 2) + 1 * (1 * 0 - (-1) * 2)
    expected: '0'
    tolerance: '1e-12'
    shown: ['$\det A = 1(-1 - 0) - 1(1 - 0) + 1(0 + 2) = 0$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b-cross-z
    where: 'same: N₁ × N₂ = ⟨1, 1, −2⟩, z component 1·(−1) − 1·1'
    inputs: {}
    formula: 1 * (-1) - 1 * 1
    expected: '-2'
    shown: ['= \langle 1, 1, -2\rangle$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-b-check-3
    where: 'same: third equation 2·1 + (−2) = 0'
    inputs: {}
    formula: 2 * 1 + (-2)
    expected: '0'
    tolerance: '1e-12'
    shown: ['$2 - 2 = 0$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): first + second gives 2x + z = 2, not 3'
    inputs: {}
    formula: 1 + 1
    expected: '2'
    shown: ['$2x + z = 1 + 1 = 2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
