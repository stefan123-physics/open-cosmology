# Calculations on content/year-1/18.02/second-derivative-test.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 10 transcript and the Week 4 lecture summary, with the page's own numbers.

page: content/year-1/18.02/second-derivative-test.mdx
calcs:
  - id: completed-square
    kind: identity
    where: 'formula "Completing the square": ax² + bxy + cy² = (1/4a)(4a²(x + b/2a y)² + (4ac − b²)y²)'
    formula: a * x**2 + b * x * y + c * y**2
    equals: (4 * a**2 * (x + b / (2 * a) * y)**2 + (4 * a * c - b**2) * y**2) / (4 * a)
    samples: {a: [1.0, -2.0, 0.5], b: [3.0, 1.0, -4.0], c: [2.0, 5.0, -1.0], x: [0.7, -1.3, 2.0], y: [1.1, 0.4, -0.6]}
    tolerance: 1e-9
    shown: ['(4ac - b^2)\,y^2\right)" cite']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: mit

  - id: lecture-ac-b2
    where: 'formula "Second derivatives at (1, 1)": A = 2, B = 1, C = 2, AC − B² = 3'
    inputs: {}
    formula: (2 / (1**3 * 1)) * (2 / (1 * 1**3)) - (1 / (1**2 * 1**2))**2
    expected: '3'
    shown: ['A = 2,\ B = 1,\ C = 2,\ \ AC - B^2 = 3 > 0']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: lecture-minimum-value
    where: 'same: f(1, 1) = 1 + 1 + 1 = 3'
    inputs: {}
    formula: 1 + 1 + 1 / (1 * 1)
    expected: '3'
    shown: ['$f(1, 1) = 3$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: lecture-fxx
    kind: identity
    where: 'same: f_xx of x + y + 1/(xy) is 2/(x³y) (second difference quotient)'
    formula: ((x + 1e-4) + y + 1 / ((x + 1e-4) * y) - 2 * (x + y + 1 / (x * y)) + (x - 1e-4) + y + 1 / ((x - 1e-4) * y)) / 1e-8
    equals: 2 / (x**3 * y)
    samples: {x: [1.0, 1.5], y: [1.0, 0.8]}
    tolerance: 1e-3
    shown: ['f_{xx} = \frac{2}{x^3y}']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: quiz-1
    where: 'quiz 1: 4ac − b² = 4 − 16 = −12 for x² + 4xy + y²'
    inputs: {}
    formula: 4 * 1 * 1 - 4**2
    expected: '-12'
    shown: ['$4ac - b^2 = 4 - 16 = -12 < 0$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: quiz-2
    where: 'quiz 2: AC − B² = (−3)(−2) − 1 = 5'
    inputs: {}
    formula: (-3) * (-2) - 1**2
    expected: '5'
    shown: ['$AC - B^2 = 6 - 1 = 5 > 0$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-min
    where: 'worked example: at (1, 0), AC − B² = 6 × 2 − 0 = 12, f = −2'
    inputs: {}
    formula: 6 * 1 * 2 - 0
    expected: '12'
    shown: ['$AC - B^2 = 12 > 0$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-min-value
    where: 'same: f(1, 0) = 1 − 3 = −2'
    inputs: {}
    formula: 1**3 - 3 * 1 + 0
    expected: '-2'
    shown: ['$f(1, 0) = 1 - 3 = -2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-saddle
    where: 'same: at (−1, 0), AC − B² = −12'
    inputs: {}
    formula: 6 * (-1) * 2 - 0
    expected: '-12'
    shown: ['$AC - B^2 = -12 < 0$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-saddle-value
    where: 'same: f(−1, 0) = −1 + 3 = 2'
    inputs: {}
    formula: (-1)**3 - 3 * (-1) + 0
    expected: '2'
    shown: ['$f(-1, 0) = -1 + 3 = 2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
