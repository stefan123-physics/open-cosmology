# Calculations on content/year-1/18.02/spherical-coordinates.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 26 transcript and the Week 11 lecture summary, with the page's own numbers.

page: content/year-1/18.02/spherical-coordinates.mdx
calcs:
  - id: cap-volume
    where: 'formula "Volume of the cap": 2π[(1 − 1/√2)/3 − 1/(12√2)] = 2π/3 − 5π/(6√2) ≈ 0.243'
    inputs: {}
    formula: 2 * pi * integrate('(1 - (1/(sqrt(2)*cos(p)))**3) / 3 * sin(p)', 'p', 0, pi / 4)
    expected: '0.2432'
    tolerance: '0.1%'
    shown: ['= \frac{2\pi}{3} - \frac{5\pi}{6\sqrt2}" cite']
    source: {cite: reading2, at: 'pp. 10–11'}
    origin: mit

  - id: cap-closed-form
    where: 'same: 2π/3 − 5π/(6√2) equals the cap formula πh²(3 − h)/3 with h = 1 − 1/√2'
    inputs: {}
    formula: 2 * pi / 3 - 5 * pi / (6 * sqrt(2)) - pi * (1 - 1 / sqrt(2))**2 * (3 - (1 - 1 / sqrt(2))) / 3
    expected: '0'
    tolerance: '1e-9'
    shown: ['The cap of the unit ball above $z = 1/\sqrt2$ has volume']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: newton-theorem
    where: 'formula "Newton''s theorem": ∫₀^{π/2} (2a cos φ) cos φ sin φ dφ × 2π = (4/3)πa (a = 1.7)'
    inputs: {}
    formula: 2 * pi * integrate('2*1.7*cos(p)*cos(p)*sin(p)', 'p', 0, pi / 2) / (4 / 3 * pi * 1.7)
    expected: '1'
    shown: ['= \tfrac43\pi G\,m\,\delta\,a = \frac{G\,M\,m}{a^2}']
    source: {cite: reading1, at: 'Lecture 26, p. 2'}
    origin: mit

  - id: quiz-3
    where: 'quiz 3: ρ = √(9 + 16) = 5'
    inputs: {}
    formula: sqrt(9 + 16)
    expected: '5'
    shown: ['= \\sqrt{9 + 16} = 5$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: average-distance
    where: 'worked example (a): (π)/(4π/3) = 3/4'
    inputs: {}
    formula: integrate('r**3', 'r', 0, 1) * 2 * 2 * pi / (4 / 3 * pi)
    expected: '0.75'
    shown: ['the average distance is $\frac34$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: cone-volume
    where: 'worked example (b): (1/3)(1 − 1/√2) · 2π ≈ 0.613'
    inputs: {}
    formula: (1 / 3) * (1 - 1 / sqrt(2)) * 2 * pi
    expected: '0.613'
    shown: ['\cdot 2\pi \approx 0.613$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: lower-cone
    where: 'same: 0.613 − 0.243 = 0.370 = (1/3)π r² h with r = h = 1/√2'
    inputs: {}
    formula: pi / 3 * (1 / sqrt(2))**3
    expected: '0.370'
    shown: ['$0.613 - 0.243 = 0.370$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
