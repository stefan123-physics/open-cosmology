# Calculations on content/year-1/18.02/18-02-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# OpenCourseWare has no solutions for Part B of this set, so every answer is checked here by an independent route:
# the equality of Problem 1 for a sample curve by numerical integration of both sides, the gradient and the curl of
# Problem 2 against numerical derivatives, its line integrals by numerical integration along other paths (a straight
# segment, a broken line), and the derivatives and potentials of Problem 3 against numerical derivatives and a
# numerical line integral along a ray. Where a formula is typed with r, the samples are Pythagorean triples
# (x, y, r) so that r = sqrt(x² + y²) holds.

page: content/year-1/18.02/18-02-problem-set-8.mdx
calcs:
  # ---- Introduction

  - id: intro-points
    where: 'Introduction: the points of the three problems of Part B (3 + 8 + 4)'
    inputs: {}
    formula: 3 + 8 + 4
    expected: '15'
    shown: ['three longer problems (15 points)']
    source: {cite: mit, at: 'Part B, pp. 1–2'}
    origin: mit

  - id: intro-part-a-points
    kind: fact
    where: 'Last section: the points of MIT''s Part A'
    shown: ['12 points at MIT']
    source: {cite: mit, at: 'Part A, p. 1'}
    origin: mit

  - id: p2-points
    where: 'Problem 2: MIT''s points for parts (a) to (e), 1 + 2 + 2 + 1 + 2'
    inputs: {}
    formula: 1 + 2 + 2 + 1 + 2
    expected: '8'
    shown: ['title="The polar angle as a potential" points={8}']
    source: {cite: mit, at: 'Part B, Problem 2, p. 1'}
    origin: mit

  # ---- Problem 1

  - id: p1-general
    kind: identity
    where: 'Problem 1, formula "The moment of inertia as an integral over x": for the sample curve f(x) = 1 + x²/2 from x = a to x = b, the line integral (left) against the double integral of x² + y² over the region under the curve (right)'
    formula: integrate('x**2*(1 + x**2/2) + (1 + x**2/2)**3/3', 'x', a, b)
    equals: integrate("integrate('x**2 + y**2', 'y', 0, 1 + x**2/2)", 'x', a, b)
    samples: {a: [0, -1, 0.5], b: [1, 2, 3]}
    tolerance: 1e-8
    shown: ['I_0 = \int_{x_1}^{x_2} \left(x^2 f(x) + \tfrac13 f(x)^3\right)dx = \int_C']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-inner
    kind: identity
    where: 'Problem 1, formula "The inner integral": x² h + h³/3 against the numerical integral of x² + y² over y from 0 to h'
    formula: x**2*h + h**3/3
    equals: integrate('x**2 + y**2', 'y', 0, h)
    samples: {x: [0, 1, -2, 0.7], h: [1, 0.5, 3, 2.2]}
    tolerance: 1e-9
    shown: ['= \left[x^2 y + \tfrac13 y^3\right]_0^{f(x)} = x^2 f(x) + \tfrac13 f(x)^3']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-check-line
    where: 'Problem 1, check: the line integral for f(x) = 1 from 0 to 1'
    inputs: {}
    formula: integrate('x**2 + 1/3', 'x', 0, 1)
    expected: '0.667'
    shown: ['\left(x^2 + \tfrac13\right)dx = \tfrac13 + \tfrac13 = \tfrac23$']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-check-square
    where: 'Problem 1, check: the moment of inertia of the unit square about its corner, as a double integral'
    inputs: {}
    formula: integrate("integrate('x**2 + y**2', 'y', 0, 1)", 'x', 0, 1)
    expected: '0.667'
    shown: ['(x^2 + y^2)\,dy\,dx = \tfrac13 + \tfrac13 = \tfrac23$ as well']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-check-two-thirds
    where: 'Problem 1, check: 1/3 + 1/3'
    inputs: {}
    formula: 1/3 + 1/3 - 2/3
    expected: '0.000'
    shown: ['\left(x^2 + \tfrac13\right)dx = \tfrac13 + \tfrac13 = \tfrac23$']
    source: {cite: mit, at: 'Part B, Problem 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2(a)

  - id: p2-a-theta-x
    kind: identity
    where: 'Problem 2(a): the partial derivative of tan⁻¹(y/x) with respect to x, against a numerical derivative (points with x > 0)'
    formula: -y/(x**2 + y**2)
    equals: deriv('atan(y/u)', 'u', x)
    samples: {x: [1, 0.5, 2, 3], y: [0.4, 1, -2, 0.7]}
    tolerance: 1e-6
    shown: ['\left(-\frac{y}{x^2}\right) = \frac{-y}{x^2 + y^2}" cite']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-theta-y
    kind: identity
    where: 'Problem 2(a): the partial derivative of tan⁻¹(y/x) with respect to y, against a numerical derivative (points with x > 0)'
    formula: x/(x**2 + y**2)
    equals: deriv('atan(u/x)', 'u', y)
    samples: {x: [1, 0.5, 2, 3], y: [0.4, 1, -2, 0.7]}
    tolerance: 1e-6
    shown: ['\frac{1}{x} = \frac{x}{x^2 + y^2}" cite']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-size
    kind: identity
    where: 'Problem 2(a), check: the size of the field is 1/r'
    formula: sqrt((-y/(x**2 + y**2))**2 + (x/(x**2 + y**2))**2)
    equals: 1/sqrt(x**2 + y**2)
    samples: {x: [1, 0.5, -2, 3], y: [0.4, 1, -2, -0.7]}
    tolerance: 1e-9
    shown: ['$\sqrt{y^2 + x^2}/(x^2 + y^2) = 1/r$']
    source: {cite: mit, at: 'Part B, Problem 2(a) (our own solution)'}
    origin: page-own

  # ---- Problem 2(b)

  # The straight segment from A = (r1 cos θ1, r1 sin θ1) to B = (r2 cos θ2, r2 sin θ2) stays in x > 0. With the
  # parameter q from 0 to 1, −y dx + x dy = (xA yB − yA xB) dq, divided by x² + y² at the moving point.
  - id: p2-b
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box: θ2 − θ1, against the numerical line integral of the field along the straight segment from A to B'
    formula: theta2 - theta1
    equals: integrate('(r1*cos(theta1)*r2*sin(theta2) - r1*sin(theta1)*r2*cos(theta2)) / ((r1*cos(theta1) + q*(r2*cos(theta2) - r1*cos(theta1)))**2 + (r1*sin(theta1) + q*(r2*sin(theta2) - r1*sin(theta1)))**2)', 'q', 0, 1)
    samples: {r1: [1.2, 2, 1.5, 0.7], theta1: [-1.2, -0.7, -0.2, 0.4], r2: [2.5, 4, 3, 1.9], theta2: [0.3, 1.3, 0.8, -1.0]}
    tolerance: 1e-7
    shown: ['= \theta(B) - \theta(A) = \theta_2 - \theta_1" cite']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-ray
    where: 'Problem 2(b), check: the field is perpendicular to the ray, (−y)(x) + (x)(y), at the sample point (1.3, −0.4)'
    inputs: {x: 1.3, y: -0.4}
    formula: (-y)*x + x*y
    expected: '0'
    shown: ['$(-y)(x) + (x)(y) = 0$']
    source: {cite: mit, at: 'Part B, Problem 2(b) (our own solution)'}
    origin: page-own

  # ---- Problem 2(c)

  - id: p2-c1
    answer: p2-c1
    where: 'Problem 2(c), answer box: the line integral along the upper half circle, with x = cos t, y = sin t and the full field (−y dx + x dy)/(x² + y²)'
    inputs: {}
    formula: integrate('((-sin(t))*(-sin(t)) + cos(t)*cos(t)) / (cos(t)**2 + sin(t)**2)', 't', 0, pi)
    expected: '3.142'
    shown: ['= \int_0^{\pi} dt = \pi = 3.142" cite']
    source: {cite: mit, at: 'Part B, Problem 2(c) (our own solution)'}
    origin: page-own

  # Another path with the same end points that stays in the upper half-plane, where the polar angle is a potential:
  # (1, 0) → (1, 1) → (−1, 1) → (−1, 0). The three pieces are the integrals of 1/(1 + q²) over [0, 1], [−1, 1], [0, 1].
  - id: p2-c1-broken-line
    where: 'Problem 2(c), check of the upper half circle: the same line integral along the broken line (1, 0) → (1, 1) → (−1, 1) → (−1, 0)'
    inputs: {}
    formula: integrate('1/(1 + q**2)', 'q', 0, 1) + integrate('1/(q**2 + 1)', 'q', -1, 1) + integrate('1/(1 + q**2)', 'q', 0, 1)
    expected: '3.142'
    shown: ['= \int_0^{\pi} dt = \pi = 3.142" cite']
    source: {cite: mit, at: 'Part B, Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-c2
    answer: p2-c2
    where: 'Problem 2(c), answer box: the line integral along the lower half circle, with x = cos t, y = −sin t and the full field'
    inputs: {}
    formula: integrate('(sin(t)*(-sin(t)) + cos(t)*(-cos(t))) / (cos(t)**2 + sin(t)**2)', 't', 0, pi)
    expected: '-3.142'
    shown: ['= -\int_0^{\pi} dt = -\pi = -3.142" cite']
    source: {cite: mit, at: 'Part B, Problem 2(c) (our own solution)'}
    origin: page-own

  # The mirror image of the broken line above: (1, 0) → (1, −1) → (−1, −1) → (−1, 0).
  - id: p2-c2-broken-line
    where: 'Problem 2(c), check of the lower half circle: the same line integral along the broken line (1, 0) → (1, −1) → (−1, −1) → (−1, 0)'
    inputs: {}
    formula: -integrate('1/(1 + q**2)', 'q', -1, 0) - integrate('1/(q**2 + 1)', 'q', -1, 1) - integrate('1/(1 + q**2)', 'q', -1, 0)
    expected: '-3.142'
    shown: ['= -\int_0^{\pi} dt = -\pi = -3.142" cite']
    source: {cite: mit, at: 'Part B, Problem 2(c) (our own solution)'}
    origin: page-own

  # ---- Problem 2(d)

  - id: p2-d-nx
    kind: identity
    where: 'Problem 2(d): N_x against a numerical derivative, also at points with x < 0'
    formula: (y**2 - x**2)/(x**2 + y**2)**2
    equals: deriv('u/(u**2 + y**2)', 'u', x)
    samples: {x: [1, -1, 0.5, -2], y: [0.3, 2, -1, 0.7]}
    tolerance: 1e-6
    shown: ['= \frac{(x^2 + y^2) - x \cdot 2x}{(x^2 + y^2)^2}']
    source: {cite: mit, at: 'Part B, Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-d-my
    kind: identity
    where: 'Problem 2(d): M_y against a numerical derivative, also at points with x < 0'
    formula: (y**2 - x**2)/(x**2 + y**2)**2
    equals: deriv('-u/(x**2 + u**2)', 'u', y)
    samples: {x: [1, -1, 0.5, -2], y: [0.3, 2, -1, 0.7]}
    tolerance: 1e-6
    shown: ['= \frac{-(x^2 + y^2) + y \cdot 2y}{(x^2 + y^2)^2}']
    source: {cite: mit, at: 'Part B, Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-d-point
    where: 'Problem 2(d), check: (y² − x²)/(x² + y²)² at the point (−1, 2)'
    inputs: {}
    formula: (2**2 - (-1)**2) / ((-1)**2 + 2**2)**2
    expected: '0.12'
    shown: ['both formulas give $(4 - 1)/(1 + 4)^2 = 3/25$']
    source: {cite: mit, at: 'Part B, Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-d-point-fraction
    where: 'Problem 2(d), check: 3/25 as a decimal, to compare with the entry above'
    inputs: {}
    formula: 3/25
    expected: '0.12'
    shown: ['both formulas give $(4 - 1)/(1 + 4)^2 = 3/25$']
    source: {cite: mit, at: 'Part B, Problem 2(d) (our own solution)'}
    origin: page-own

  # ---- Problem 2(e)

  - id: p2-e-loop
    where: 'Problem 2(e): the numerical line integral once around the unit circle, counterclockwise, minus 2π'
    inputs: {}
    formula: integrate('((-sin(t))*(-sin(t)) + cos(t)*cos(t)) / (cos(t)**2 + sin(t)**2)', 't', 0, 2*pi) - 2*pi
    expected: '0.000'
    shown: ['= \pi - (-\pi) = 2\pi \neq 0']
    source: {cite: mit, at: 'Part B, Problem 2(e) (our own solution)'}
    origin: page-own

  # ---- Problem 3(a)

  - id: p3-a-rx
    kind: identity
    answer: p3-a-rx
    where: 'Problem 3(a), answer box: r_x = x/r, against the numerical derivative of sqrt(x² + y²); the samples are triples with r = sqrt(x² + y²)'
    formula: x/r
    equals: deriv('sqrt(u**2 + y**2)', 'u', x)
    samples: {x: [3, 5, 8, 0.6], y: [4, 12, 15, 0.8], r: [5, 13, 17, 1]}
    tolerance: 1e-6
    shown: ['r_x = \frac{x}{r}, \qquad r_y = \frac{y}{r}']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-ry
    kind: identity
    where: 'Problem 3(a): r_y = y/r, against the numerical derivative of sqrt(x² + y²)'
    formula: y/r
    equals: deriv('sqrt(x**2 + u**2)', 'u', y)
    samples: {x: [3, 5, 8, 0.6], y: [4, 12, 15, 0.8], r: [5, 13, 17, 1]}
    tolerance: 1e-6
    shown: ['r_x = \frac{x}{r}, \qquad r_y = \frac{y}{r}']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-nx
    kind: identity
    answer: p3-a-nx
    where: 'Problem 3(a), answer box: N_x, against the numerical derivative of N = (x² + y²)^(n/2) y with respect to x'
    formula: n*x*y*r**(n-2)
    equals: deriv('sqrt(u**2 + y**2)**n * y', 'u', x)
    samples: {x: [3, 5, 8, 0.6], y: [4, 12, 15, 0.8], r: [5, 13, 17, 1], n: [2, 3, -1.5, -2]}
    tolerance: 1e-6
    shown: ['\frac{x}{r}\cdot y = n\,x\,y\,r^{n-2}" cite']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-my
    kind: identity
    where: 'Problem 3(a): M_y, against the numerical derivative of M = (x² + y²)^(n/2) x with respect to y'
    formula: n*x*y*r**(n-2)
    equals: deriv('sqrt(x**2 + u**2)**n * x', 'u', y)
    samples: {x: [3, 5, 8, 0.6], y: [4, 12, 15, 0.8], r: [5, 13, 17, 1], n: [2, 3, -1.5, -2]}
    tolerance: 1e-6
    shown: ['\frac{y}{r}\cdot x = n\,x\,y\,r^{n-2}" cite']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-curl
    where: 'Problem 3(a): the curl N_x − M_y by numerical derivatives at the point (0.6, 0.8) with n = −1.5'
    inputs: {x: 0.6, y: 0.8, n: -1.5}
    formula: deriv('sqrt(u**2 + y**2)**n * y', 'u', x) - deriv('sqrt(x**2 + u**2)**n * x', 'u', y)
    expected: '0.000'
    shown: ['= n\,x\,y\,r^{n-2} - n\,x\,y\,r^{n-2} = 0" cite']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-curl-2
    where: 'Problem 3(a): the curl N_x − M_y by numerical derivatives at the point (−1.1, 0.4) with n = 2.5'
    inputs: {x: -1.1, y: 0.4, n: 2.5}
    formula: deriv('sqrt(u**2 + y**2)**n * y', 'u', x) - deriv('sqrt(x**2 + u**2)**n * x', 'u', y)
    expected: '0.000'
    shown: ['= n\,x\,y\,r^{n-2} - n\,x\,y\,r^{n-2} = 0" cite']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-check-n2-nx
    kind: identity
    where: 'Problem 3(a), check with n = 2: N_x = 2xy from N = x² y + y³'
    formula: 2*x*y
    equals: deriv('u**2*y + y**3', 'u', x)
    samples: {x: [1, -2, 0.5], y: [3, 0.7, -1]}
    tolerance: 1e-6
    shown: ['Directly, $N_x = 2xy$ and $M_y = 2xy$']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-check-n2-my
    kind: identity
    where: 'Problem 3(a), check with n = 2: M_y = 2xy from M = x³ + x y²'
    formula: 2*x*y
    equals: deriv('x**3 + x*u**2', 'u', y)
    samples: {x: [1, -2, 0.5], y: [3, 0.7, -1]}
    tolerance: 1e-6
    shown: ['Directly, $N_x = 2xy$ and $M_y = 2xy$']
    source: {cite: mit, at: 'Part B, Problem 3(a) (our own solution)'}
    origin: page-own

  # ---- Problem 3(b)

  # Along a ray the field points along the path and has size q^(n+1) at distance q, so the work from distance 1 to
  # distance r is the integral of q^(n+1); the potential without a constant term is that work plus 1/(n + 2).
  - id: p3-b-g
    kind: identity
    answer: p3-b-g
    where: 'Problem 3(b), answer box: the potential for n ≠ −2, against the numerical line integral of the field along a ray from distance 1 to distance r, plus the constant 1/(n + 2)'
    formula: r**(n+2)/(n+2)
    equals: integrate('q**(n + 1)', 'q', 1, r) + 1/(n + 2)
    samples: {r: [0.5, 2, 1.5, 3, 0.8], n: [0, 1, -1, -3, 2.5]}
    tolerance: 1e-7
    shown: ['g(r) = \frac{r^{n+2}}{n+2} \;(+\,c)']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-g-gradient
    kind: identity
    where: 'Problem 3(b): the x-component r^n x of the field, against the numerical x-derivative of (x² + y²)^((n+2)/2)/(n + 2); samples with r = sqrt(x² + y²)'
    formula: r**n * x
    equals: deriv('sqrt(u**2 + y**2)**(n + 2)/(n + 2)', 'u', x)
    samples: {x: [3, 5, 8, 0.6], y: [4, 12, 15, 0.8], r: [5, 13, 17, 1], n: [2, 0.5, -1.5, -3]}
    tolerance: 1e-6
    shown: ['g(r) = \frac{r^{n+2}}{n+2} \;(+\,c)']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-n
    answer: p3-b-n
    where: 'Problem 3(b), answer box: the value of n at which the denominator n + 2 of the general potential is zero'
    inputs: {}
    formula: solve('q + 2', 'q', -5, 5)
    expected: '-2'
    shown: ['When $n = -2$, the formula would divide by zero']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-log
    kind: identity
    answer: p3-b-log
    where: 'Problem 3(b), answer box: the potential for n = −2 that is zero at r = 1, against the numerical line integral of the field (size 1/q) along a ray from distance 1 to distance r'
    formula: log(r)
    equals: integrate('1/q', 'q', 1, r)
    samples: {r: [2, 3, 4, 0.5]}
    tolerance: 1e-7
    shown: ['g(r) = \ln r \;(+\,c)']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-log-gradient
    kind: identity
    where: 'Problem 3(b), check: the x-derivative of ½ ln(x² + y²) is x/(x² + y²)'
    formula: x/(x**2 + y**2)
    equals: deriv('log(u**2 + y**2)/2', 'u', x)
    samples: {x: [1, -2, 0.5], y: [3, 0.7, -1]}
    tolerance: 1e-6
    shown: ['$g_x = x/(x^2 + y^2) = r^{-2}x$']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-n0-gradient
    kind: identity
    where: 'Problem 3(b), check with n = 0: the x-derivative of (x² + y²)/2 is x'
    formula: x
    equals: deriv('(u**2 + y**2)/2', 'u', x)
    samples: {x: [1, -2, 0.5], y: [3, 0.7, -1]}
    tolerance: 1e-6
    shown: ['$g = r^2/2 = (x^2 + y^2)/2$']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-ray-work
    kind: identity
    where: 'Problem 3(b), check: the work along a ray from distance 1 to distance r, (r^(n+2) − 1)/(n + 2), against numerical integration'
    formula: (r**(n + 2) - 1)/(n + 2)
    equals: integrate('q**(n + 1)', 'q', 1, r)
    samples: {r: [0.5, 2, 1.5, 3, 0.8], n: [0, 1, -1, -3, 2.5]}
    tolerance: 1e-7
    shown: ['= \left(r^{n+2} - 1\right)/(n+2)$']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-near-special
    where: 'Problem 3(b), check: (r^(n+2) − 1)/(n + 2) for r = 2 and n = −1.999'
    inputs: {}
    formula: (2**(-1.999 + 2) - 1) / (-1.999 + 2)
    expected: '0.6934'
    shown: ['it gives $0.6934$']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-ln2
    where: 'Problem 3(b), check: ln 2'
    inputs: {}
    formula: log(2)
    expected: '0.6931'
    shown: ['close to $\ln 2 = 0.6931$']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-n3
    kind: identity
    where: 'Problem 3(b), remark: for n = −3 the general potential is −1/r'
    formula: r**(-3 + 2)/(-3 + 2)
    equals: -1/r
    samples: {r: [0.5, 2, 3]}
    tolerance: 1e-9
    shown: ['the potential is $g = -1/r$']
    source: {cite: mit, at: 'Part B, Problem 3(b) (our own solution)'}
    origin: page-own

