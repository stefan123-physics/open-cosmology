# Calculations on content/year-1/18.02/vector-fields-and-line-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 19 transcript and the Week 8 lecture summary, with the page's own numbers.

page: content/year-1/18.02/vector-fields-and-line-integrals.mdx
calcs:
  - id: parabola-work
    where: 'formula "The example": ∫₀¹ (−t² + 2t²) dt = 1/3'
    inputs: {}
    formula: integrate('-t**2 + 2*t**2', 't', 0, 1)
    expected: '0.3333'
    shown: ['<Formula label="The example" tex=']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: parabola-sin-param
    where: 'same, with x = sin θ, y = sin² θ, 0 ≤ θ ≤ π/2: still 1/3'
    inputs: {}
    formula: integrate('-sin(th)**2*cos(th) + sin(th)*2*sin(th)*cos(th)', 'th', 0, pi / 2)
    expected: '0.3333'
    shown: ['gives $\frac13$ again']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: mit

  - id: circle-rotation
    where: 'section "The geometric approach": ∮ −y dx + x dy on the circle of radius a = 2πa² (a = 1.5)'
    inputs: {}
    formula: integrate('(1.5*sin(th))**2 + (1.5*cos(th))**2', 'th', 0, 2 * pi)
    expected: '14.137'
    shown: ['the work is $a \times 2\pi a = 2\pi a^2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: quiz-2
    where: 'quiz 2: ∫₀¹ 2t dt = 1'
    inputs: {}
    formula: integrate('2*t', 't', 0, 1)
    expected: '1'
    shown: ['$\\int_0^1 2t\\,dt = 1$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-a
    where: 'worked example (a): segment from (1, 0) to (0, 1), work = 1'
    inputs: {}
    formula: integrate('t*1 + (1 - t)*1', 't', 0, 1)
    expected: '1'
    shown: ['= \int_0^1 1\,dt = 1$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): quarter circle, work = π/2 ≈ 1.571'
    inputs: {}
    formula: integrate('sin(th)**2 + cos(th)**2', 'th', 0, pi / 2)
    expected: '1.571'
    shown: ['the work is the arc length, $\pi/2 \approx 1.571$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-c-segment
    where: 'worked example (c): G = ⟨y, x⟩ on the segment, work = 2'
    inputs: {}
    formula: integrate('4*t', 't', 0, 1)
    expected: '2'
    shown: ['work $\int_0^1 4t\,dt = 2$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-c-parabola
    where: 'same, on the parabola x = 2t, y = t²: integrand t²·2 + 2t·2t = 6t², work = 2'
    inputs: {}
    formula: integrate('t**2*2 + 2*t*2*t', 't', 0, 1)
    expected: '2'
    shown: ['work $\int_0^1 6t^2\,dt = 2$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: other-path
    where: 'section "Work and the line integral": along the x-axis (work 0) then x = 1, y from 0 to 1 (integrand 1): work 1'
    inputs: {}
    formula: 0 + integrate('1', 'y', 0, 1)
    expected: '1'
    shown: ['so that route gives work 1']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
