# Calculations on content/year-1/18.02/critical-points-and-least-squares.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 9 transcript and the Week 4 lecture summary, with the page's own numbers.

page: content/year-1/18.02/critical-points-and-least-squares.mdx
calcs:
  - id: quiz-1
    where: 'quiz 1: Δf ≈ 3(0.1) − 2(0.2) = −0.1'
    inputs: {}
    formula: 3 * 0.1 - 2 * 0.2
    expected: '-0.1'
    shown: ['= 0.3 - 0.4 = -0.1$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: lecture-fx
    kind: identity
    where: 'section "An example": f_x of x² − 2xy + 3y² + 2x − 2y is 2x − 2y + 2'
    formula: (((x + 1e-6)**2 - 2 * (x + 1e-6) * y + 3 * y**2 + 2 * (x + 1e-6) - 2 * y) - (x**2 - 2 * x * y + 3 * y**2 + 2 * x - 2 * y)) / 1e-6
    equals: 2 * x - 2 * y + 2
    samples: {x: [0.5, -1.2], y: [2.0, 0.3]}
    tolerance: 1e-4
    shown: ['$f_x = 2x - 2y + 2$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: lecture-critical
    where: 'same: the critical point (−1, 0) makes f_y = −2x + 6y − 2 zero'
    inputs: {}
    formula: -2 * (-1) + 6 * 0 - 2
    expected: '0'
    tolerance: '1e-12'
    shown: ['The only critical point is $(-1, 0)$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: completed-square
    kind: identity
    where: 'formula "Completing the square": x² − 2xy + 3y² + 2x − 2y = (x − y + 1)² + 2y² − 1'
    formula: x**2 - 2 * x * y + 3 * y**2 + 2 * x - 2 * y
    equals: (x - y + 1)**2 + 2 * y**2 - 1
    samples: {x: [0.0, 1.5, -2.0], y: [1.0, -0.5, 3.0]}
    tolerance: 1e-9
    shown: ['= (x - y + 1)^2 + 2y^2 - 1 \ \ge\ -1']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: minimum-value
    where: 'same: f(−1, 0) = −1'
    inputs: {}
    formula: (-1)**2 - 0 + 0 + 2 * (-1) - 0
    expected: '-1'
    shown: ['so $f \ge -1$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: tangent-estimate
    where: 'worked example (a): z = 2 + 0.4 − 0.1 = 2.3'
    inputs: {}
    formula: 2 + 4 * 0.1 + 1 * (-0.1)
    expected: '2.3'
    shown: ['$z = 2 + 0.4 - 0.1 = 2.3$']
    source: {cite: reading1, at: 'Lecture 9, p. 1'}
    origin: page-own

  - id: tangent-exact
    where: 'same: f(1.1, 1.9) = 1.21 × 1.9 = 2.299'
    inputs: {}
    formula: 1.1**2 * 1.9
    expected: '2.299'
    shown: ['$f(1.1, 1.9) = 1.21 \times 1.9 = 2.299$']
    source: {cite: reading1, at: 'Lecture 9, p. 1'}
    origin: page-own

  - id: sum-x2
    where: 'worked example (b): Σx² = 14'
    inputs: {}
    formula: 0 + 1 + 4 + 9
    expected: '14'
    shown: ['$\sum x_i^2 = 0 + 1 + 4 + 9 = 14$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: sum-xy
    where: 'same: Σxy = 29'
    inputs: {}
    formula: 0 * 1 + 1 * 3 + 2 * 4 + 3 * 6
    expected: '29'
    shown: ['$\sum x_iy_i = 0 + 3 + 8 + 18 = 29$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: slope-a
    where: 'same: a = 8/5 = 1.6 from 14a + 6b = 29, 6a + 4b = 14'
    inputs: {}
    formula: (29 * 4 - 6 * 14) / (14 * 4 - 6 * 6)
    expected: '1.6'
    shown: ['$5a = 8$, $a = 1.6$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: intercept-b
    where: 'same: b = 1.1'
    inputs: {}
    formula: (14 * 14 - 6 * 29) / (14 * 4 - 6 * 6)
    expected: '1.1'
    shown: ['and $b = 1.1$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: total-deviation
    where: 'same: D = 0.2'
    inputs: {}
    formula: (1 - 1.1)**2 + (3 - 2.7)**2 + (4 - 4.3)**2 + (6 - 5.9)**2
    expected: '0.2'
    shown: ['$D = 0.01 + 0.09 + 0.09 + 0.01 = 0.2$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
