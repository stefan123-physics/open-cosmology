# Calculations on content/year-1/18.02/parametric-equations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 5 transcript and the Week 2 lecture summary, with the page's own numbers.

page: content/year-1/18.02/parametric-equations.mdx
calcs:
  - id: q0-value
    where: 'section "Where a line meets a plane": at Q₀ = (−1, 2, 2), x + 2y + 4z = 11'
    inputs: {}
    formula: -1 + 2 * 2 + 4 * 2
    expected: '11'
    shown: ['$x + 2y + 4z = -1 + 4 + 8 = 11$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: q1-value
    where: 'same: at Q₁ = (1, 3, −1), x + 2y + 4z = 3'
    inputs: {}
    formula: 1 + 2 * 3 + 4 * (-1)
    expected: '3'
    shown: ['$1 + 6 - 4 = 3$']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: mit

  - id: substitution
    kind: identity
    where: 'formula "Substituting the line": (−1 + 2t) + 2(2 + t) + 4(2 − 3t) = 11 − 8t'
    formula: (-1 + 2 * t) + 2 * (2 + t) + 4 * (2 - 3 * t)
    equals: 11 - 8 * t
    samples: {t: [0.0, 0.5, 2.0, -1.5]}
    tolerance: 1e-9
    shown: ['= 11 - 8t" cite']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: crossing-t
    where: 'same: 11 − 8t = 7 gives t = 1/2'
    inputs: {}
    formula: (11 - 7) / 8
    expected: '0.5'
    shown: ['$11 - 8t = 7$, that is $t = 1/2$']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: crossing-point-y
    where: 'same: Q(1/2) = (0, 5/2, 1/2); y = 2 + 1/2'
    inputs: {}
    formula: 2 + 0.5
    expected: '2.5'
    shown: ['$Q(1/2) = (0, 5/2, 1/2)$']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: coefficient-of-t
    where: 'same: coefficient of t = ⟨1, 2, 4⟩ · ⟨2, 1, −3⟩ = −8'
    inputs: {}
    formula: 1 * 2 + 2 * 1 + 4 * (-3)
    expected: '-8'
    shown: ['$1 \cdot 2 + 2 \cdot 1 + 4 \cdot (-3) = -8$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: example-a-t
    where: 'worked example (a): 7 + 2t = 10 at t = 3/2'
    inputs: {}
    formula: (10 - 7) / 2
    expected: '1.5'
    shown: ['which equals 10 at $t = 3/2$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: example-a-point
    where: 'same: the point (3, −2, 9/2) satisfies x + y + 2z = 10'
    inputs: {}
    formula: 3 + (-2) + 2 * 4.5
    expected: '10'
    shown: ['the point $(3, -2, 9/2)$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: example-a-q1
    where: 'same: at Q₁ = (2, −1, 4) the value is 9'
    inputs: {}
    formula: 2 + (-1) + 2 * 4
    expected: '9'
    shown: ['at $Q_1$ it is 9']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: example-a-coefficient
    where: 'same: coefficient 2 = ⟨1, 1, 2⟩ · ⟨2, −2, 1⟩'
    inputs: {}
    formula: 1 * 2 + 1 * (-2) + 2 * 1
    expected: '2'
    shown: ['= 2 - 2 + 2$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: example-b-quarter-x
    where: 'worked example (b): quarter turn, x = 0.35(π/2 − 1) ≈ 0.20 m'
    inputs: {a: 0.35 m}
    formula: a * (pi / 2 - 1)
    expected: 0.20 m
    tolerance: '1%'
    shown: ['$x = 0.35(\pi/2 - 1) \approx 0.20$ m']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-half-x
    where: 'same: half a turn, x = 0.35π ≈ 1.10 m'
    inputs: {a: 0.35 m}
    formula: a * pi
    expected: 1.10 m
    shown: ['$x = 0.35\pi \approx 1.10$ m']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b-half-y
    where: 'same: y = 2 × 0.35 = 0.70 m'
    inputs: {a: 0.35 m}
    formula: 2 * a
    expected: 0.70 m
    shown: ['$y = 2 \times 0.35 = 0.70$ m']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-c-x
    where: 'worked example (c): x = 0.1 − sin 0.1 ≈ 0.000167'
    inputs: {}
    formula: 0.1 - sin(0.1)
    expected: '0.000167'
    tolerance: '1%'
    shown: ['$x = 0.1 - \sin 0.1 \approx 0.000167$']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: example-c-y
    where: 'same: y = 1 − cos 0.1 ≈ 0.00500'
    inputs: {}
    formula: 1 - cos(0.1)
    expected: '0.00500'
    tolerance: '1%'
    shown: ['$y = 1 - \cos 0.1 \approx 0.00500$']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: example-c-ratio
    where: 'same: y/x ≈ 30.0'
    inputs: {}
    formula: (1 - cos(0.1)) / (0.1 - sin(0.1))
    expected: '30.0'
    shown: ['so $y/x \approx 30.0$']
    source: {cite: reading2, at: 'p. 13'}
    origin: page-own

  - id: plot-top
    where: 'plot caption: after half a turn the height is 2a'
    inputs: {}
    formula: 1 - cos(pi)
    expected: '2'
    shown: ['at height 2a']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: plot-full-turn
    where: 'plot caption: θ = 2π = 6.28…'
    inputs: {}
    formula: 2 * pi
    expected: '6.28'
    tolerance: '0.1%'
    shown: ['(θ = 2π = 6.28…)']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own
