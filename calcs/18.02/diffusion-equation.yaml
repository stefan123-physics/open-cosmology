# Calculations on content/year-1/18.02/diffusion-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 29 transcript and the Week 12 lecture summary, with the page's own numbers.

page: content/year-1/18.02/diffusion-equation.mdx
calcs:
  - id: laplacian-quadratic
    where: 'quiz 3 and worked example (a): Laplacian of x² + y² + z² = 6'
    inputs: {}
    formula: 2 + 2 + 2
    expected: '6'
    shown: ['$\nabla^2(x^2 + y^2 + z^2) = 2 + 2 + 2 = 6$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: decaying-solution
    kind: identity
    where: 'worked example (b): u = e^(−3kt) sin x sin y sin z has u_t = k ∇²u (second differences)'
    formula: (exp(-3 * k * (t + 1e-6)) - exp(-3 * k * (t - 1e-6))) / 2e-6 * sin(x) * sin(y) * sin(z)
    equals: k * exp(-3 * k * t) * (-3) * sin(x) * sin(y) * sin(z)
    samples: {k: [0.5, 1.2], t: [0.1, 0.8], x: [0.4, 1.1], y: [0.9, 2.0], z: [1.3, 0.2]}
    tolerance: 1e-5
    shown: ['They agree: the pattern keeps its shape and fades exponentially']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: sine-laplacian
    kind: identity
    where: 'same: second x-derivative of sin x sin y sin z is −sin x sin y sin z'
    formula: (sin(x + 1e-4) - 2 * sin(x) + sin(x - 1e-4)) / 1e-8 * sin(y) * sin(z)
    equals: -sin(x) * sin(y) * sin(z)
    samples: {x: [0.4, 1.1], y: [0.9, 2.0], z: [1.3, 0.2]}
    tolerance: 1e-3
    shown: ['so $\nabla^2 u = -3u$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
