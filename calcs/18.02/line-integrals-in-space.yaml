# Calculations on content/year-1/18.02/line-integrals-in-space.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 30 transcript and the Week 13 lecture summary, with the page's own numbers.

page: content/year-1/18.02/line-integrals-in-space.mdx
calcs:
  - id: twisted-curve
    where: 'formula "Along the twisted curve": ∫₀¹ 6t⁵ dt = 1'
    inputs: {}
    formula: integrate('t**3*3*t**2 + t**4*2*t + t**5', 't', 0, 1)
    expected: '1'
    shown: ['\int_0^1 6t^5\,dt = 1']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: potential-xyz
    where: 'section "The fundamental theorem": f(1, 1, 1) − f(0, 0, 0) = 1 for f = xyz'
    inputs: {}
    formula: 1 * 1 * 1 - 0
    expected: '1'
    shown: ['For $f = xyz$, $f(1, 1, 1) - f(0, 0, 0) = 1$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: lecture-potential
    kind: identity
    where: 'formula "The potential": ∂/∂z of x²y + yz³ − z⁴ = 3yz² − 4z³'
    formula: ((x**2 * y + y * (z + 1e-6)**3 - (z + 1e-6)**4) - (x**2 * y + y * (z - 1e-6)**3 - (z - 1e-6)**4)) / 2e-6
    equals: 3 * y * z**2 - 4 * z**3
    samples: {x: [0.5, 1.2], y: [2.0, -0.7], z: [0.3, 1.1]}
    tolerance: 1e-5
    shown: ['f(x, y, z) = x^2y + yz^3 - z^4 + c']
    source: {cite: reading1, at: 'Lecture 30, p. 1'}
    origin: mit

  - id: example-work
    where: 'worked example (b): f(1, 2, 3) = 1·3 + 2·9 = 21'
    inputs: {}
    formula: 1**2 * 3 + 2 * 3**2
    expected: '21'
    shown: ['= 1 \cdot 3 + 2 \cdot 9 = 21$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: quiz-3
    where: 'quiz 3: xyz at (2, 1, 3) = 6'
    inputs: {}
    formula: 2 * 1 * 3
    expected: '6'
    shown: ['$f(2, 1, 3) - f(0, 0, 0) = 6$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: earth-curl
    where: 'closing note: 2 × 7.29 × 10⁻⁵ ≈ 1.46 × 10⁻⁴ per second'
    inputs: {}
    formula: 2 * 7.29e-5
    expected: '1.46e-4'
    tolerance: '1%'
    shown: ['about $1.46 \times 10^{-4}$ per second']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: earth-omega
    where: 'closing note: Earth''s angular velocity 2π / (one sidereal day, 86164 s) ≈ 7.29 × 10⁻⁵ rad/s'
    inputs: {}
    formula: 2 * pi / 86164
    expected: '7.29e-5'
    tolerance: '1%'
    shown: ['$\Omega \approx 7.29 \times 10^{-5}$ rad/s']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
