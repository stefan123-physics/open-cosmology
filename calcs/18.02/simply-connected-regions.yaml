# Calculations on content/year-1/18.02/simply-connected-regions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 24 transcript and the Week 10 lecture summary, with the page's own numbers.

page: content/year-1/18.02/simply-connected-regions.mdx
calcs:
  - id: unit-circle
    where: 'formula "The field with a hole": work around the unit circle = 2π'
    inputs: {}
    formula: integrate('(sin(t)*sin(t) + cos(t)*cos(t)) / (cos(t)**2 + sin(t)**2)', 't', 0, 2 * pi)
    expected: '6.2832'
    shown: ['\oint_{\text{unit circle}} \vec F \cdot d\vec r = 2\pi']
    source: {cite: reading1, at: 'Lecture 24, p. 1'}
    origin: mit

  - id: ellipse
    where: 'worked example (c): ∫₀^{2π} 2 dt / (4 cos² t + sin² t) = 2π'
    inputs: {}
    formula: integrate('2 / (4*cos(t)**2 + sin(t)**2)', 't', 0, 2 * pi)
    expected: '6.2832'
    shown: ['\frac{2\,dt}{4\cos^2 t + \sin^2 t} = 2\pi$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: off-origin-circle
    where: 'worked example (b): circle of radius 3 about (5, 0): work 0'
    inputs: {}
    formula: integrate('(-(3*sin(t))*(-3*sin(t)) + (5 + 3*cos(t))*(3*cos(t))) / ((5 + 3*cos(t))**2 + (3*sin(t))**2)', 't', 0, 2 * pi)
    expected: '0'
    tolerance: '1e-6'
    shown: ['so the work is 0']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own
