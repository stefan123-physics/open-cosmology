# Calculations on content/year-1/18.02/stokes-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.02 (Fall 2007) Lecture 31 transcript and the Week 13 lecture summary, with the page's own numbers.

page: content/year-1/18.02/stokes-theorem.mdx
calcs:
  - id: circle-work
    where: 'formula "The work around the circle": ∫₀^{2π} cos²θ dθ = π'
    inputs: {}
    formula: integrate('cos(th)**2', 'th', 0, 2 * pi)
    expected: '3.1416'
    shown: ['\int_0^{2\pi} \cos^2\theta\,d\theta = \pi']
    source: {cite: reading1, at: 'Lecture 31, p. 3'}
    origin: mit

  - id: paraboloid-flux
    where: 'formula "The flux of the curl": ∫∫ (2x + 2y + 1) over the unit disc = π'
    inputs: {}
    formula: integrate('integrate("(2*x + 2*y + 1)", "y", -sqrt(1 - x**2), sqrt(1 - x**2))', 'x', -1, 1)
    expected: '3.1416'
    shown: ['\int\int_{\text{unit disc}} 1\,dx\,dy = \pi']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: example-direct
    where: 'worked example: work of ⟨−y, x, z⟩ around the unit circle = 2π'
    inputs: {}
    formula: integrate('sin(th)**2 + cos(th)**2', 'th', 0, 2 * pi)
    expected: '6.2832'
    shown: ['so the work is the circumference, $2\pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-disc
    where: 'same: curl ⟨0, 0, 2⟩ through the disc, 2π'
    inputs: {}
    formula: 2 * pi
    expected: '6.2832'
    shown: ['$2 \times \pi = 2\pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: example-hemisphere
    where: 'same: ∫∫ 2 cos φ sin φ dφ dθ over the upper hemisphere = 2π'
    inputs: {}
    formula: 2 * pi * integrate('2*cos(p)*sin(p)', 'p', 0, pi / 2)
    expected: '6.2832'
    shown: ['d\varphi\,d\theta = 2\pi$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
