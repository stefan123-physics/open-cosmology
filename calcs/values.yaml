# Value registry (docs/CALC_TESTS_PLAN.md §7, item 4). Checked by `npm run content:check` (lib/values.ts);
# list every quoted value with `npm run scan -- --values`.
#
# Pages quote the same quantities with several values on purpose. Every value a page may quote is listed here
# with its role. A value that is not listed fails the content check: either it is a slip, or it is a new value
# that needs a role here. A listed value that no page quotes any more gives a warning.
#
# Roles:  Guth 2013   the value Guth quoted in 8.286 (Fall 2013); pages keep it, with later values marked as such
#         later       a measurement after 2013, marked on the page as a later development
#         example     a round or chosen value for a worked example, quiz or plot
#         computed    a result the page calculates (checked in calcs/<course>/<slug>.yaml)
#         historical  a value from the history of the subject
#
# `find`: JavaScript regular expressions; the named group `v` is the value as written. `range`: only values whose
# first number lies in [lo, hi] are checked (ages and temperatures are quoted for many other things too).

quantities:
  - id: H0
    name: Hubble constant (km/s/Mpc)
    find:
      - '(?<![\w.^_{])(?<v>\d+(?:\.\d+)?(?:\s*(?:–|-|to)\s*\d+(?:\.\d+)?)?)(?:\s*\\pm\s*[\d.]+)?(?:\$|\\{1,2}[ ,;!]|\s|~)*(?:\\{1,2}text\{)?km/s/Mpc'
      - '(?<![\w.^_{])(?<v>\d+(?:\.\d+)?)(?:\s*\\pm\s*[\d.]+)?(?:\\[ ,;!]|\s)*\\tfrac\{\\text\{km/s\}\}\{\\text\{Mpc\}\}'
    values:
      '56': 'computed: H_vac = √0.7 H₀ (cosmological-constant)'
      '57.3': 'historical: the value as read in the transcript, corrected on the page (horizon-problem)'
      '66': 'Guth 2013: the value with which Guth matched the curve of Riess et al. 2004, whose zero point is arbitrary (8.286 Problem Set 8)'
      '67': 'later: CMB-based H₀ in the Hubble tension, rounded; also Guth 2013 (h₀ = 0.67, Planck 2013) in towards-the-universe-expanding-ball'
      '67–70': 'example: the range of modern values (age-with-vacuum-energy)'
      '67–68': 'later: CMB-based range in the Hubble tension, NASA Science *Hubble Constant and Tension* (updated 2025-08-04) (towards-the-universe-open-questions)'
      '67.3': 'Guth 2013: Planck 2013, as quoted in 8.286'
      '67.4': 'later: Planck 2018'
      '67.7': 'later: Planck 2018 (67.66), rounded, in worked examples (horizon-problem, vacuum-energy-puzzle)'
      '68': 'example: a round Planck-like value (age-with-vacuum-energy)'
      '70': 'example: the round value for worked examples and quizzes; also Guth''s "just under 70" (age-with-vacuum-energy)'
      '70–76': 'later: space-telescope distance-ladder range in the Hubble tension, NASA Science *Hubble Constant and Tension* (updated 2025-08-04) (towards-the-universe-open-questions)'
      '73': 'later: local distance ladder (SH0ES) in the Hubble tension'
      '97.8': 'computed: 1/(10¹⁰ yr) expressed in km/s/Mpc (a unit conversion, not a measurement)'
      '100': 'example: the unit for h (H₀ = 100 h km/s/Mpc), and a quiz distractor'
      '123': 'computed: H(z = 1) for Ω_m = 0.3, Ω_Λ = 0.7, H₀ = 70 (frw-metric-expansion)'
      '500': 'historical: Hubble 1929'
      '550': 'historical: Hubble 1929 as given on the 8.033 slides (evidence-for-the-big-bang)'
      '575–625': 'historical: Lemaître 1927'

  - id: age
    name: age of the universe (billion years)
    range: [12.5, 15]
    find:
      - '(?<![\w.^_{])(?<v>\d+(?:\.\d+)?(?:\s*(?:–|-|to)\s*\d+(?:\.\d+)?)?)(?:\s*(?:\\pm|±)\s*[\d.]+)?(?:\*\*|\$|\\{1,2}[ ,;!]|\s|~)*(?:\\{1,2}text\{)?billion years'
    values:
      '13–14': 'historical: the traditional "13 to 14 billion years" (inflation-overview)'
      '13.7': 'computed: flat ΛCDM age for H₀ = 68, Ω_m = 0.31 (age-with-vacuum-energy); also its quiz answer'
      '13.7–13.8': 'Guth 2013: the range quoted for the vacuum-energy model'
      '13.732': 'computed: the numerical age with radiation included (age-with-vacuum-energy)'
      '13.74': 'computed: the analytic flat age in the worked example (age-with-vacuum-energy)'
      '13.79': 'later: Planck 2018, 13.79 ± 0.02'
      '13.8': 'Guth 2013: Planck 2013, rounded (the site''s standard figure)'
      '13.80': 'computed: the flat formula with Planck 2018 values'
      '13.82': 'Guth 2013: Planck 2013, 13.82 ± 0.05, as quoted in 8.286 (inflation-overview)'
      '13.5': 'computed: flat age for Ω_m = 0.3, Ω_Λ = 0.7, h = 0.70, the 2005 values on the 8.033 slides (frw-metric-expansion)'
      '13.9': 'historical: the result as Guth quotes it (the page notes the 2013 Planck value)'
      '14': 'computed: the Hubble time 1/H for H = 70, "about 14 billion years" (not the age)'
      '14.0': 'computed: the Hubble time 9.778/h Gyr for h = 0.70 (not the age; frw-metric-expansion)'
      '14.2': 'computed: flat age for Ω_m = 0.25, Ω_Λ = 0.75, h = 0.7, the 2006 values on the 8.033 slides (expanding-universe-history)'
      '14.38': 'computed: the Hubble time 1/H₀ for H₀ = 68 (not the age)'
      '14.5': 'computed: the Hubble time 1/H for H = 67.3 or 67.4 (not the age)'

  - id: T_CMB
    name: CMB temperature today (K)
    range: [2.5, 2.8]
    find:
      - '(?<![\w.^_{])(?<v>\d\.\d+)(?:\s*(?:\\pm|±)\s*[\d.]+)?(?:\$|\\{1,2}[ ,;!]|\s|~)*(?:\\{1,2}text\{|\\{1,2}mathrm\{)?K(?![a-zA-Z])'
    values:
      '2.7': 'Guth 2013: the rounded value used in quick estimates'
      '2.725': 'Guth 2013: the value used for calculations in 8.286'
      '2.7255': 'later: Fixsen 2009 to four decimals, used in some worked examples'
      '2.72548': 'later: Fixsen 2009, 2.72548 ± 0.00057 K'
      '2.726': 'historical: the black-body curve shown on the lecture slide (cmb-spectrum)'
      '2.73': 'example: the rounded value the 8.902 Lecture 12 notes use for the recombination redshift (inflation-scalar-field)'
      '2.76': 'computed: not a CMB value; the ideal-Bose-gas T_c of helium-4 at the density in the 8.08 Chapter VII notes (ideal-bose-gas-condensation)'
      '2.8': 'computed: not a CMB value; the same helium-4 T_c, rounded (ideal-bose-gas-condensation)'

  - id: Omega_m
    name: matter density parameter Ω_m
    find:
      - '(?<!/\s*)\\Omega_(?:m|\{m\}|\\text\{m\}|\{\\text\{m\}\}|\{m,0\}|\{\\text\{m\},0\})(?:,0)?\s*(?:=|\\approx|≈)\s*(?<v>\d+(?:\.\d+)?)(?!\s*\\times)'
      - '(?<!/\s*)Ω_m(?:,0)?\s*(?:=|≈)\s*(?<v>\d+(?:\.\d+)?)(?!\s*×)'
    values:
      '0.2': 'example: the open matter-only model compared with the supernova data'
      '0.24': 'historical: the High-Z team''s 1998 best fit'
      '0.25': 'historical: the 2006 value listed on the 8.033 cosmology slides (expanding-universe-history)'
      '0.27': 'historical: a WMAP-era value, used to show the 13.7 Gyr age of that time (expanding-universe-history)'
      '0.3': 'example: the round present-day value'
      '0.30': 'Guth 2013: his rounded value for the radiation–matter estimate'
      '0.30991': 'computed: matter with the radiation taken out, to keep the model flat'
      '0.31': 'example: a Planck-like value (age-with-vacuum-energy, luminosity-and-redshift)'
      '0.315': 'later: Planck 2018; also Guth 2013: the Planck 2013 best fit as listed in 8.286 Problem Sets 8 and 10'
      '1': 'example: the matter-only (Einstein–de Sitter) case'

  - id: Omega_vac
    name: vacuum-energy density parameter Ω_vac / Ω_Λ
    find:
      - '\\Omega_(?:\\Lambda|\{\\Lambda\}|\\text\{vac\}|\{\\text\{vac\}\}|\{\\text\{vac\},0\}|\{\\Lambda,0\})(?:,0)?\s*(?:=|\\approx|≈)\s*(?<v>\d+(?:\.\d+)?)(?!\s*[−-])'
      - 'Ω_(?:Λ|vac)(?:,0)?\s*(?:=|≈)\s*(?<v>\d+(?:\.\d+)?)(?!\s*[−-])'
    values:
      '0': 'example: the no-vacuum-energy case'
      '0.6': 'example: an open model with Ω_m = 0.3, the alternative MIT allows in 8.286 Problem Set 8'
      '0.685': 'Guth 2013: Planck 2013, as quoted in 8.286 Problem Set 8 (with Ω_m = 0.315)'
      '0.69': 'later: Planck 2018 (0.689), rounded, so that Ω_m + Ω_vac = 1'
      '0.6847': 'later: Planck 2018 (TT,TE,EE+lowE+lensing, eq. 15), as quoted in the 8.902 Lecture 10 notes (friedmann-equations-density-parameters)'
      '0.7': 'example: the round present-day value'
      '0.70': 'example: with Ω_m = 0.31, a slightly closed model (luminosity-and-redshift)'
      '0.75': 'historical: the 2006 value listed on the 8.033 cosmology slides (expanding-universe-history)'
      '0.761': 'historical: WMAP3 + SDSS luminous red galaxies (2006), as on the 8.033 slides (cosmology-roundup-mysteries)'
      '0.76': 'historical: the High-Z team''s 1998 best fit'
      '1': 'example: flat models written as Ω_m + Ω_vac = 1'

  - id: n_s
    name: scalar spectral index n_s
    find:
      - 'n_s\s*(?:=|\\approx|≈)\s*(?<v>\d+(?:\.\d+)?)'
    values:
      '0.965': 'later: Planck 2018, 0.965 ± 0.004'
      '0.953': 'historical: WMAP3 + SDSS luminous red galaxies (2006), as on the 8.033 slides (cosmology-roundup-mysteries)'

  - id: sigma_8
    name: σ₈
    find:
      - '\\sigma_8\s*(?:=|\\approx|≈)\s*(?<v>\d+(?:\.\d+)?)'
      - 'σ_?8\s*(?:=|≈)\s*(?<v>\d+(?:\.\d+)?)'
    values:
      '0.756': 'historical: the early WMAP + SDSS value quoted in the 8.902 notes'
      '0.811': 'later: Planck 2018, 0.811 ± 0.006'

  - id: h0
    name: dimensionless Hubble constant h₀ (H₀ / 100 km/s/Mpc)
    find:
      - 'h_(?:0|\{0\})\s*(?:=|\\approx|≈)\s*(?<v>0\.\d+)'
      - '(?<![\w\\])h\s*(?:\\approx|≈)\s*(?<v>0\.\d+)'
    values:
      '0.67': 'Guth 2013: the Planck value Guth uses'
      '0.674': 'later: Planck 2018'
      '0.7': 'example: the round value in the 8.902 notes (h ≈ 0.7)'
      '0.70': 'historical: the 2005 value listed on the 8.033 cosmology slides (frw-metric-expansion)'
      '0.72': 'historical: the older value another author used, as Guth notes (matter-radiation-equality)'
