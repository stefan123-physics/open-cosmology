# Calculations on content/year-2/18.06/projection-matrices-least-squares.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 16 transcript, with the page's own example.

page: content/year-2/18.06/projection-matrices-least-squares.mdx
calcs:
  - id: ata
    where: 'AᵀA entries 3, 6, 14 and Aᵀb = (5, 11): squared deviations from the dot products'
    inputs: {}
    formula: (3 - 3)**2 + (6 - (1+2+3))**2 + (14 - (1+4+9))**2 + (5 - (1+2+2))**2 + (11 - (1+4+6))**2
    expected: '0'
    tolerance: 1e-12
    shown: ['3C + 6D = 5, \quad 6C + 14D = 11']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: mit

  - id: D
    where: 'solve 3C + 6D = 5, 6C + 14D = 11: D = (3·11 − 6·5)/(3·14 − 6·6)'
    inputs: {}
    formula: (3*11 - 6*5)/(3*14 - 6*6)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['so $D = \frac{1}{2}$']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: C
    where: 'C = (5·14 − 6·11)/(3·14 − 6·6)'
    inputs: {}
    formula: (5*14 - 6*11)/(3*14 - 6*6)
    expected: '0.666667'
    tolerance: 1e-6
    shown: ['gives $C = \frac{2}{3}$']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: p3
    where: 'p₃ = 2/3 + 3/2 = 13/6'
    inputs: {}
    formula: 2/3 + 3/2
    expected: '2.166667'
    tolerance: 1e-6
    shown: ['\frac{5}{3}, \frac{13}{6})$']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: pe
    where: 'pᵀe = (7/6)(−1/6) + (5/3)(1/3) + (13/6)(−1/6) = (−7 + 20 − 13)/36'
    inputs: {}
    formula: (7/6)*(-1/6) + (5/3)*(1/3) + (13/6)*(-1/6)
    expected: '0'
    tolerance: 1e-12
    shown: ['$p^Te = -\frac{7}{36} + \frac{20}{36} - \frac{13}{36} = 0$']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: e-col2
    where: 'e·(1, 2, 3) in sixths: −1 + 4 − 3'
    inputs: {}
    formula: -1 + 4 - 3
    expected: '0'
    tolerance: 1e-12
    shown: ['$-1 + 4 - 3 = 0$ (in sixths)']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: ex-C
    where: 'example: C = (12·14 − 6·23)/20'
    inputs: {}
    formula: (12*14 - 6*23)/(4*14 - 6*6)
    expected: '1.5'
    tolerance: 1e-12
    shown: ['= \frac{30}{20} = 1.5$']
    source: {cite: reading1, at: 'pp. 9–11'}
    origin: page-own

  - id: ex-D
    where: 'example: D = (4·23 − 6·12)/20'
    inputs: {}
    formula: (4*23 - 6*12)/(4*14 - 6*6)
    expected: '1'
    tolerance: 1e-12
    shown: ['/20 = 1$. The best line']
    source: {cite: reading1, at: 'pp. 9–11'}
    origin: page-own

  - id: ex-atb
    where: 'example: Aᵀb = (1+3+4+4, 0+3+8+12)'
    inputs: {}
    formula: (1+3+4+4)*100 + (0+3+8+12)
    expected: '1223'
    shown: ['$A^Tb = (12, 23)$']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: page-own

  - id: ex-err
    where: 'example: total squared error 4 × 0.5²'
    inputs: {}
    formula: 4 * 0.5**2
    expected: '1'
    tolerance: 1e-12
    shown: ['$4 \times 0.25 = 1$']
    source: {cite: reading1, at: 'pp. 5–7'}
    origin: page-own
