# Calculations on content/year-2/18.06/orthogonal-matrices-gram-schmidt.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 17 transcript, with the page's own example.

page: content/year-2/18.06/orthogonal-matrices-gram-schmidt.mdx
calcs:
  - id: rect-ortho
    where: '(1, 2, 2)·(−2, −1, 2) = 0 and |(1, 2, 2)|² = 9'
    inputs: {}
    formula: (1*(-2) + 2*(-1) + 2*2)**2 + (1 + 4 + 4 - 9)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$(1, 2, 2)/3$ and $(-2, -1, 2)/3$ are orthonormal']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: mit

  - id: third-col
    where: '(2, −2, 1) is perpendicular to (1, 2, 2) and (−2, −1, 2), length 3 (inferred third column)'
    inputs: {}
    formula: (2 - 4 + 2)**2 + (-4 + 2 + 2)**2 + (4 + 4 + 1 - 9)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['for instance $(2, -2, 1)/3$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: hadamard
    where: '4 × 4 Hadamard: column 2 · column 4 = 1·1 + (−1)(−1) + 1·(−1) + (−1)·1'
    inputs: {}
    formula: 1*1 + (-1)*(-1) + 1*(-1) + (-1)*1
    expected: '0'
    tolerance: 1e-12
    shown: ['\frac{1}{2}\begin{pmatrix} 1 & 1 & 1 & 1']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: gs-B
    where: 'B = (1, 0, 2) − (3/3)(1, 1, 1) = (0, −1, 1), and Aᵀ B = 0'
    inputs: {}
    formula: (1 - 1)**2 + (0 - 1 + 1)**2 + (2 - 1 - 1)**2 + (0 - 1 + 1)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['so $B = (1, 0, 2) - (1, 1, 1) = (0, -1, 1)$']
    source: {cite: reading1, at: 'pp. 19–20'}
    origin: mit

  - id: R22
    where: 'R entry a₂ᵀq₂ = (1, 0, 2)·(0, −1, 1)/√2 = √2'
    inputs: {}
    formula: (0 + 0 + 2)/sqrt(2)
    expected: '1.414214'
    tolerance: 1e-6
    shown: ['(completed here; Strang only sketches its entries)']
    source: {cite: reading1, at: 'pp. 23–24'}
    origin: page-own

  - id: ex-C
    where: 'example: C = (1, 2, 3) − 2(1, 0, 1) − (2/3)(½, 1, −½) = (−4/3, 4/3, 4/3); squared differences'
    inputs: {}
    formula: (1 - 2 - 1/3 + 4/3)**2 + (2 - 0 - 2/3 - 4/3)**2 + (3 - 2 + 1/3 - 4/3)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['= (-\frac{4}{3}, \frac{4}{3}, \frac{4}{3})$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: page-own

  - id: ex-BC
    where: 'example: BᵀC = −2/3 + 4/3 − 2/3'
    inputs: {}
    formula: 0.5*(-4/3) + 1*(4/3) + (-0.5)*(4/3)
    expected: '0'
    tolerance: 1e-12
    shown: ['$B^TC = -\frac{2}{3} + \frac{4}{3} - \frac{2}{3} = 0$']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  - id: ex-recon
    where: 'example (b): first component of (1, 0, 1) + (1/3)(1, 2, −1) + (2/3)(1, −1, −1)'
    inputs: {}
    formula: 1 + 1/3 + 2/3
    expected: '2'
    tolerance: 1e-12
    shown: ['\frac{2}{3}(1, -1, -1) = (2, 0, 0)$']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own
