# Calculations on content/year-2/18.06/differential-equations-exp-at.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 23 transcript, with the page's own example.

page: content/year-2/18.06/differential-equations-exp-at.mdx
calcs:
  - id: char
    kind: identity
    where: 'det of (−1 − λ, 2; 1, −2 − λ) = λ² + 3λ'
    formula: (-1 - l)*(-2 - l) - 2*1
    equals: l**2 + 3*l
    samples: {l: [-1.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['\det(A - \lambda I) = \lambda^2 + 3\lambda = \lambda(\lambda + 3)']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: x2-check
    where: 'A(1, −1) = (−1 − 2, 1 + 2) = −3(1, −1): first component'
    inputs: {}
    formula: -1*1 + 2*(-1)
    expected: '-3'
    shown: ['$x_2 = (1, -1)$, in the nullspace of $A + 3I$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: mit

  - id: c-values
    where: 'c₁(2, 1) + c₂(1, −1) = (1, 0) with c₁ = c₂ = 1/3: first component 2/3 + 1/3'
    inputs: {}
    formula: 2/3 + 1/3
    expected: '1'
    tolerance: 1e-12
    shown: ['so $c_1 = c_2 = \frac13$']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: mit

  - id: c-values-second
    where: 'second component 1/3 − 1/3'
    inputs: {}
    formula: 1/3 - 1/3
    expected: '0'
    tolerance: 1e-12
    shown: ['so $c_1 = c_2 = \frac13$']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: mit

  - id: complex-size
    where: '|e^((−3 + 6i)t)| = e^(−3t)·√(cos²6t + sin²6t) = e^(−3t), at t = 0.4'
    inputs: {}
    formula: exp(-3*0.4)*sqrt(cos(6*0.4)**2 + sin(6*0.4)**2) - exp(-3*0.4)
    expected: '0'
    tolerance: 1e-12
    shown: ['= e^{-3t}, \qquad e^{6it} = \cos 6t + i\sin 6t']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: mit

  - id: exp-series
    kind: identity
    where: 'first column of e^(At) = S e^(Λt) S⁻¹ for Strang''s A is ((2 + e^(−3t))/3, (1 − e^(−3t))/3); its derivative equals A times it (row 1)'
    formula: -exp(-3*t)
    equals: -1*(2 + exp(-3*t))/3 + 2*(1 - exp(-3*t))/3
    samples: {t: [0.0, 0.5, 2.0]}
    tolerance: 1e-12
    shown: ['e^{At} = S\left(I + \Lambda t']
    source: {cite: reading1, at: 'pp. 19–20'}
    origin: page-own

  - id: geometric
    kind: identity
    where: 'geometric series: (1 − x)(1 + x + x² + x³) = 1 − x⁴, so the partial sums tend to 1/(1 − x) for |x| < 1'
    formula: (1 - x)*(1 + x + x**2 + x**3)
    equals: 1 - x**4
    samples: {x: [0.3, -0.5, 2.0]}
    tolerance: 1e-12
    shown: ['$1 + x + x^2 + \cdots = 1/(1 - x)$']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: ex-c
    where: 'example: 3c₁ + c₂ = 0, c₁ − c₂ = 4 → c₁ = 1, c₂ = −3; check 3·1 + (−3)'
    inputs: {}
    formula: 3*1 + (-3)
    expected: '0'
    shown: ['so $c_1 = 1$, $c_2 = -3$']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: page-own

  - id: ex-solution
    kind: identity
    where: 'example: u(t) = (3 − 3e^(−4t), 1 + 3e^(−4t)) solves u₁′ = −u₁ + 3u₂'
    formula: 12*exp(-4*t)
    equals: -(3 - 3*exp(-4*t)) + 3*(1 + 3*exp(-4*t))
    samples: {t: [0.0, 0.3, 1.2]}
    tolerance: 1e-12
    shown: ['(3 - 3e^{-4t},\ 1 + 3e^{-4t})']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-solution-second
    kind: identity
    where: 'example: u₂′ = u₁ − 3u₂'
    formula: -12*exp(-4*t)
    equals: (3 - 3*exp(-4*t)) - 3*(1 + 3*exp(-4*t))
    samples: {t: [0.0, 0.3, 1.2]}
    tolerance: 1e-12
    shown: ['(3 - 3e^{-4t},\ 1 + 3e^{-4t})']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-b-det
    where: 'example: det B = (−2)(1) − (1)(−3)'
    inputs: {}
    formula: (-2)*1 - 1*(-3)
    expected: '1'
    shown: ['determinant $-2 + 3 = 1 > 0$']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-b-roots
    where: 'example: roots (−1 ± i√3)/2 of λ² + λ + 1 have product (1/2)² + (√3/2)² = 1 = det B (and sum −1 = trace)'
    inputs: {}
    formula: 0.5**2 + (sqrt(3)/2)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['$(-1 \pm i\sqrt3)/2$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: ex-c-det
    where: 'example: det C = (−4)(1) − (1)(2)'
    inputs: {}
    formula: (-4)*1 - 1*2
    expected: '-6'
    shown: ['determinant $-4 - 2 = -6 < 0$']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-c-root
    where: 'example: positive root of λ² + 3λ − 6, (−3 + √33)/2'
    inputs: {}
    formula: (-3 + sqrt(33))/2
    expected: '1.37'
    tolerance: 0.005
    shown: ['$(-3 + \sqrt{33})/2 \approx 1.37$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: x2-check-second
    where: 'A(1, −1) second component: 1·1 + (−2)(−1) = 3 = −3·(−1)'
    inputs: {}
    formula: 1*1 + (-2)*(-1)
    expected: '3'
    shown: ['$x_2 = (1, -1)$, in the nullspace of $A + 3I$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: mit

  - id: ex-c-second
    where: 'example: second equation c₁ − c₂ = 1 − (−3)'
    inputs: {}
    formula: 1 - (-3)
    expected: '4'
    shown: ['so $c_1 = 1$, $c_2 = -3$']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: page-own
