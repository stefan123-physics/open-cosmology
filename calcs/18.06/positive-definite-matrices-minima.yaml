# Calculations on content/year-2/18.06/positive-definite-matrices-minima.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 27 transcript, with the page's own example.

page: content/year-2/18.06/positive-definite-matrices-minima.mdx
calcs:
  - id: det-19
    where: 'c = 19: det 2·19 − 36'
    inputs: {}
    formula: 2*19 - 6*6
    expected: '2'
    shown: ['with $c = 19$ the determinant is $38 - 36 = 2$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: semidef-eig
    where: 'c = 18: det 0, so eigenvalues 0 and trace 2 + 18'
    inputs: {}
    formula: (2*18 - 36) + (2 + 18)
    expected: '20'
    shown: ['so one eigenvalue is $0$ and the trace gives the other, $20$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: form-18
    kind: identity
    where: '(x₁, x₂)(2 6; 6 18)(x₁, x₂)ᵀ = 2x₁² + 12x₁x₂ + 18x₂²'
    formula: x*(2*x + 6*y) + y*(6*x + 18*y)
    equals: 2*x**2 + 12*x*y + 18*y**2
    samples: {x: [1.0, -0.5], y: [2.0, 0.3]}
    tolerance: 1e-12
    shown: ['= 2x_1^2 + 12x_1x_2 + 18x_2^2']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: det-7
    where: 'c = 7: det 14 − 36'
    inputs: {}
    formula: 2*7 - 36
    expected: '-22'
    shown: ['The determinant is $14 - 36 = -22$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: pivot-7
    where: 'c = 7: second pivot −22/2'
    inputs: {}
    formula: (2*7 - 36)/2
    expected: '-11'
    shown: ['so the pivots are $2$ and $-11$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: saddle-value
    where: 'c = 7, x = (1, −1): 2 − 12 + 7'
    inputs: {}
    formula: 2*1 + 12*1*(-1) + 7*1
    expected: '-3'
    shown: ['the form is $2 - 12 + 7 = -3 < 0$']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: det-20
    where: 'c = 20: det 40 − 36'
    inputs: {}
    formula: 2*20 - 36
    expected: '4'
    shown: ['The determinant is $40 - 36 = 4 = \lambda_1\lambda_2$']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: complete-square
    kind: identity
    where: '2x² + 12xy + 20y² = 2(x + 3y)² + 2y²'
    formula: 2*x**2 + 12*x*y + 20*y**2
    equals: 2*(x + 3*y)**2 + 2*y**2
    samples: {x: [1.0, -0.5], y: [2.0, 0.3]}
    tolerance: 1e-12
    shown: ['tex="2x^2 + 12xy + 20y^2 = 2(x + 3y)^2 + 2y^2"']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: mit

  - id: second-pivot-20
    where: 'elimination: 20 − 3·6'
    inputs: {}
    formula: 20 - 3*6
    expected: '2'
    shown: ['and $20 - 3 \cdot 6 = 2$']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: sd-det3
    where: 'det of the 3 × 3 second-difference matrix: 2(4 − 1) − (−1)(−2 − 0) + 0'
    inputs: {}
    formula: 2*(2*2 - (-1)*(-1)) - (-1)*((-1)*2 - (-1)*0) + 0
    expected: '4'
    shown: ['\text{determinants } 2, 3, 4']
    source: {cite: reading1, at: 'pp. 15–16'}
    origin: mit

  - id: sd-eig-trace
    where: 'eigenvalues 2 − √2, 2, 2 + √2 add to the trace 6'
    inputs: {}
    formula: (2 - sqrt(2)) + 2 + (2 + sqrt(2))
    expected: '6'
    tolerance: 1e-12
    shown: ['they add to the trace $6$']
    source: {cite: reading1, at: 'pp. 16–17'}
    origin: mit

  - id: sd-eig-det
    where: 'and multiply to 2(4 − 2) = 4'
    inputs: {}
    formula: (2 - sqrt(2))*2*(2 + sqrt(2))
    expected: '4'
    tolerance: 1e-12
    shown: ['and multiply to $2(4 - 2) = 4$, the determinant']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: sd-eig-char
    where: 'det(A − (2 − √2)I) = 0 for the second-difference matrix: (−λ+2)³ − 2(2 − λ) at λ = 2 − √2'
    inputs: {}
    formula: (sqrt(2))**3 - 2*sqrt(2)
    expected: '0'
    tolerance: 1e-12
    shown: ['\lambda = 2 - \sqrt2,\ 2,\ 2 + \sqrt2']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: sd-form
    kind: identity
    where: 'xᵀAx for the second-difference matrix'
    formula: x*(2*x - y) + y*(-x + 2*y - z) + z*(-y + 2*z)
    equals: 2*x**2 + 2*y**2 + 2*z**2 - 2*x*y - 2*y*z
    samples: {x: [1.0, -0.5], y: [2.0, 0.3], z: [0.7, -1.1]}
    tolerance: 1e-12
    shown: ['= 2x_1^2 + 2x_2^2 + 2x_3^2 - 2x_1x_2 - 2x_2x_3']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: ex-threshold
    where: 'example: 3c − 16 > 0, c > 16/3'
    inputs: {}
    formula: 16/3
    expected: '5.333'
    tolerance: 0.001
    shown: ['requires $c > 16/3$']
    source: {cite: reading1, at: 'pp. 2–3'}
    origin: page-own

  - id: ex-square
    kind: identity
    where: 'example: 3x² + 8xy + 6y² = 3(x + 4y/3)² + (2/3)y²'
    formula: 3*x**2 + 8*x*y + 6*y**2
    equals: 3*(x + 4*y/3)**2 + (2/3)*y**2
    samples: {x: [1.0, -0.5], y: [2.0, 0.3]}
    tolerance: 1e-12
    shown: ['= 3\left(x + \tfrac43y\right)^2 + \tfrac23y^2']
    source: {cite: reading1, at: 'pp. 11–13'}
    origin: page-own

  - id: ex-eig-big
    where: 'example: (9 + √73)/2'
    inputs: {}
    formula: (9 + sqrt(73))/2
    expected: '8.77'
    tolerance: 0.005
    shown: ['\approx 8.77$ and $0.228$']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: page-own

  - id: ex-eig-small
    where: 'example: (9 − √73)/2'
    inputs: {}
    formula: (9 - sqrt(73))/2
    expected: '0.228'
    tolerance: 0.0005
    shown: ['\approx 8.77$ and $0.228$']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: page-own

  - id: ex-b-det2
    where: 'example (b): 4·3 − 2·2'
    inputs: {}
    formula: 4*3 - 2*2
    expected: '8'
    shown: ['$12 - 4 = 8$']
    source: {cite: reading1, at: 'pp. 15–16'}
    origin: page-own

  - id: ex-b-det3
    where: 'example (b): det B = 4(3·2 − 1·1) − 2(2·2 − 1·0) + 0'
    inputs: {}
    formula: 4*(3*2 - 1*1) - 2*(2*2 - 1*0)
    expected: '12'
    shown: ['$\det B = 4(6 - 1) - 2(4 - 0) = 12$']
    source: {cite: reading1, at: 'pp. 15–16'}
    origin: page-own

  - id: ex-b-pivot3
    where: 'example (b): third pivot 12/8'
    inputs: {}
    formula: 12/8
    expected: '1.5'
    tolerance: 1e-12
    shown: ['$12/8 = \frac32$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-b-form
    kind: identity
    where: 'example (b): xᵀBx'
    formula: x*(4*x + 2*y) + y*(2*x + 3*y + z) + z*(y + 2*z)
    equals: 4*x**2 + 3*y**2 + 2*z**2 + 4*x*y + 2*y*z
    samples: {x: [1.0, -0.5], y: [2.0, 0.3], z: [0.7, -1.1]}
    tolerance: 1e-12
    shown: ['x^TBx = 4x_1^2 + 3x_2^2 + 2x_3^2 + 4x_1x_2 + 2x_2x_3']
    source: {cite: reading1, at: 'p. 17'}
    origin: page-own

  - id: sd-pivots
    where: 'pivots 2, 3/2, 4/3 are the ratios of the determinants 2, 3, 4; product 4'
    inputs: {}
    formula: 2*(3/2)*(4/3)
    expected: '4'
    tolerance: 1e-12
    shown: ['\text{pivots } 2, \tfrac32, \tfrac43']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: ex-pivot-product
    where: 'example: pivots 3 and 2/3 multiply to the determinant 18 − 16'
    inputs: {}
    formula: 3*(2/3) - (18 - 16)
    expected: '0'
    tolerance: 1e-12
    shown: ['Pivots $3$ and $\frac23$, product $2 = 18 - 16$']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own
