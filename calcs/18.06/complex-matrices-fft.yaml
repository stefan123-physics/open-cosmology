# Calculations on content/year-2/18.06/complex-matrices-fft.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 26 transcript, with the page's own example.
# Complex arithmetic is written out in real and imaginary parts (the formula evaluator is real-valued).

page: content/year-2/18.06/complex-matrices-fft.mdx
calcs:
  - id: one-i-length
    where: 'z = (1, i): z̄ᵀz = 1 + (−i)(i) = 1 + 1; (−i)(i) = −i² = 1'
    inputs: {}
    formula: 1*1 + 1
    expected: '2'
    shown: ['$1 \cdot 1 + (-i)(i) = 1 + 1 = 2$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: one-i-ztz
    where: 'z = (1, i): zᵀz = 1 + i² = 1 − 1'
    inputs: {}
    formula: 1 + (-1)
    expected: '0'
    shown: ['For $z = (1, i)$ it gives $1 + i^2 = 0$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: w6-angle
    where: 'n = 6: W at 360°/6'
    inputs: {}
    formula: 360/6
    expected: '60'
    shown: ['For $n = 6$, $W$ is at $60°$']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: w4-is-i
    where: 'n = 4: e^(iπ/2) = cos(π/2) + i sin(π/2): real part 0, imaginary part 1'
    inputs: {}
    formula: cos(pi/2) + 10*sin(pi/2)
    expected: '10'
    tolerance: 1e-12
    shown: ['For $n = 4$, $W = e^{i\pi/2} = i$']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: f4-cols-1-3
    where: 'columns 1 and 3 of F4 (from 0): conj(1, i, −1, −i)·(1, −i, −1, i) = 1 + (−i)(−i) + 1 + (i)(i) = 1 − 1 + 1 − 1'
    inputs: {}
    formula: 1 + (-1) + 1 + (-1)
    expected: '0'
    shown: ['With the conjugate, the $i$ and $-i$ change sign and the sum is zero']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: f4-col-length
    where: 'each column of F4 has length squared 1 + 1 + 1 + 1'
    inputs: {}
    formula: 1 + 1 + 1 + 1
    expected: '4'
    shown: ['Each column has length squared $1 + 1 + 1 + 1 = 4$']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: w64-squared
    where: 'W₆₄² = W₃₂: angle 2·2π/64 = 2π/32'
    inputs: {}
    formula: 2*(2*pi/64) - 2*pi/32
    expected: '0'
    tolerance: 1e-12
    shown: ['W_{64}^2 = W_{32}']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: fft-levels
    where: 'log₂ 64 = 6 steps'
    inputs: {}
    formula: log(64)/log(2)
    expected: '6'
    tolerance: 1e-12
    shown: ['takes six steps, $\log_2 64$']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: fft-1024
    where: '½·1024·log₂ 1024 = 5·1024'
    inputs: {}
    formula: 0.5*1024*log(1024)/log(2)
    expected: '5120'
    tolerance: 1e-9
    shown: ['$\frac12 \cdot 1024 \cdot 10 = 5 \cdot 1024$']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  - id: fft-ratio
    where: '1024² / (5·1024) ≈ 205, "a factor of about 200"'
    inputs: {}
    formula: 1024**2/(5*1024)
    expected: '204.8'
    tolerance: 1e-9
    shown: ['That is a reduction by a factor of about 200']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  - id: ex-length
    where: 'example: |2 − i|² + |1 + 3i|² = (4 + 1) + (1 + 9)'
    inputs: {}
    formula: (2**2 + 1**2) + (1**2 + 3**2)
    expected: '15'
    shown: ['= (4 + 1) + (1 + 9) = 15$']
    source: {cite: reading1, at: 'pp. 3–5'}
    origin: page-own

  - id: ex-ztz-real
    where: 'example: real part of (2 − i)² + (1 + 3i)² = (4 − 1) + (1 − 9)'
    inputs: {}
    formula: (4 - 1) + (1 - 9)
    expected: '-5'
    shown: ['= (3 - 4i) + (-8 + 6i) = -5 + 2i$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-ztz-imag
    where: 'example: imaginary part 2·2·(−1) + 2·1·3 = −4 + 6'
    inputs: {}
    formula: 2*2*(-1) + 2*1*3
    expected: '2'
    shown: ['= (3 - 4i) + (-8 + 6i) = -5 + 2i$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-herm-det
    where: 'example: det B = 1·5 − (2 + i)(2 − i) = 5 − (4 + 1)'
    inputs: {}
    formula: 1*5 - (2**2 + 1**2)
    expected: '0'
    shown: ['determinant $5 - (2 + i)(2 - i) = 5 - 5 = 0$']
    source: {cite: reading1, at: 'pp. 5–6'}
    origin: page-own

  - id: ex-n2
    where: 'example: 4096²'
    inputs: {}
    formula: 4096**2
    expected: '16777216'
    shown: ['$n^2 = 16\,777\,216$']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: ex-fft
    where: 'example: ½·4096·12'
    inputs: {}
    formula: 0.5*4096*12
    expected: '24576'
    shown: ['= \frac12 \cdot 4096 \cdot 12 = 24\,576$']
    source: {cite: reading1, at: 'pp. 18–19'}
    origin: page-own

  - id: ex-ratio
    where: 'example: 16 777 216 / 24 576 ≈ 683'
    inputs: {}
    formula: 4096**2/(0.5*4096*12)
    expected: '683'
    tolerance: 0.5
    shown: ['The FFT is about $683$ times faster']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own
