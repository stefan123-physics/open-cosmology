# Calculations on content/year-2/18.06/left-right-inverses-pseudoinverse.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 33 transcript, with the page's own example.

page: content/year-2/18.06/left-right-inverses-pseudoinverse.mdx
calcs:
  - id: ex-ata
    where: 'example (a): AᵀA = (1 + 1, 1; 1, 1 + 1), det 4 − 1 = 3'
    inputs: {}
    formula: (1 + 1)*(1 + 1) - 1*1
    expected: '3'
    shown: ['$A^TA = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-left-11
    where: 'example (a): left inverse row 1 = (2·1 − 1·0, 2·1 − 1·1, 2·0 − 1·1)/3; times column 1 of A, (1, 1, 0)'
    inputs: {}
    formula: ((2*1 - 0)*1 + (2*1 - 1*1)*1 + (0 - 1*1)*0)/3
    expected: '1'
    tolerance: 1e-12
    shown: ['gives $(2 + 1)/3 = 1$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-left-12
    where: 'example (a): row 1 (2, 1, −1)/3 times column 2 of A, (0, 1, 1)'
    inputs: {}
    formula: (2*0 + 1*1 + (-1)*1)/3
    expected: '0'
    tolerance: 1e-12
    shown: ['and $(1 - 1)/3 = 0$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-left-21
    where: 'example (a): row 2 (−1, 1, 2)/3 times column 1, (1, 1, 0)'
    inputs: {}
    formula: ((-1)*1 + 1*1 + 2*0)/3
    expected: '0'
    tolerance: 1e-12
    shown: ['row 2 gives $(-1 + 1)/3 = 0$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-left-22
    where: 'example (a): row 2 times column 2, (0, 1, 1)'
    inputs: {}
    formula: ((-1)*0 + 1*1 + 2*1)/3
    expected: '1'
    tolerance: 1e-12
    shown: ['and $(1 + 2)/3 = 1$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-sigma
    where: 'example (b): σ₁ = |(1, 2, 0)|·|(1, 2)| = √5·√5'
    inputs: {}
    formula: sqrt(1 + 4 + 0)*sqrt(1 + 4)
    expected: '5'
    tolerance: 1e-12
    shown: ['with $\sigma_1 = \sqrt5 \cdot \sqrt5 = 5$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-bplus-b
    where: 'example (b): B⁺B entry (1, 1) = (1·1 + 2·2 + 0·0)/25'
    inputs: {}
    formula: (1*1 + 2*2 + 0*0)/25
    expected: '0.2'
    tolerance: 1e-12
    shown: ['= \begin{pmatrix} 0.2 & 0.4 \\ 0.4 & 0.8 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-bplus-b-22
    where: 'example (b): B⁺B entry (2, 2) = (2·2 + 4·4)/25'
    inputs: {}
    formula: (2*2 + 4*4)/25
    expected: '0.8'
    tolerance: 1e-12
    shown: ['\frac{1}{25}\begin{pmatrix} 5 & 10 \\ 10 & 20 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-projection
    where: 'example (b): (B⁺B)² = B⁺B: entry (1, 1) 0.2·0.2 + 0.4·0.4'
    inputs: {}
    formula: 0.2*0.2 + 0.4*0.4
    expected: '0.2'
    tolerance: 1e-12
    shown: ['the projection onto the row space, the line through $(1, 2)$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-bplus-b-12
    where: 'example (b): B⁺B entry (1, 2) = (1·2 + 2·4 + 0·0)/25'
    inputs: {}
    formula: (1*2 + 2*4 + 0*0)/25
    expected: '0.4'
    tolerance: 1e-12
    shown: ['= \begin{pmatrix} 0.2 & 0.4 \\ 0.4 & 0.8 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-bplus-entry
    where: 'example (b): B⁺ entry (2, 2) = (1/σ₁)·(2/√5)(2/√5) = 4/25'
    inputs: {}
    formula: (1/5)*(2/sqrt(5))*(2/sqrt(5)) - 4/25
    expected: '0'
    tolerance: 1e-12
    shown: ['\frac{1}{25}\begin{pmatrix} 1 & 2 & 0 \\ 2 & 4 & 0 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own
