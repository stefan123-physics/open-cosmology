# Calculations on content/year-2/18.06/solving-ax-b-complete-solution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 8 transcript, with the page's own example.

page: content/year-2/18.06/solving-ax-b-complete-solution.mdx
calcs:
  - id: b3-only
    where: 'with b1 = 1 and b2 = 5 the only allowed b3 is b1 + b2'
    inputs: {}
    formula: 1 + 5
    expected: '6'
    shown: ['only $b_3 = 6$ works']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: reduced-rhs
    where: 'for b = (1, 5, 6): b2 − 2b1 = 3 and b3 − b2 − b1 = 0'
    inputs: {}
    formula: (5 - 2*1)*10 + (6 - 5 - 1)
    expected: '30'
    shown: ['the right side becomes $(1, 3, 0)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: xp-check
    where: 'A x_p = (1, 5, 6) for x_p = (−2, 0, 3/2, 0): squared errors of −2+3, −4+9, −6+12'
    inputs: {}
    formula: (-2 + 2*1.5 - 1)**2 + (-4 + 6*1.5 - 5)**2 + (-6 + 8*1.5 - 6)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$-2 + 3 = 1$, $-4 + 9 = 5$, $-6 + 12 = 6$']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: col-rank-b
    where: 'full column rank example: column sum (1+3, 2+1, 6+1, 5+1) = (4, 3, 7, 6); sum of squared differences'
    inputs: {}
    formula: (1+3-4)**2 + (2+1-3)**2 + (6+1-7)**2 + (5+1-6)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['But $b = (4, 3, 7, 6)$, the sum of the two columns']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: ex-row3
    where: 'example: 2(row 2) − 3(row 1) = row 3 of B: (4−3, 12−9, 2−0, 14−6) = (1, 3, 2, 8)'
    inputs: {}
    formula: (4-3-1)**2 + (12-9-3)**2 + (2-0-2)**2 + (14-6-8)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['Indeed row 3 of $B$ is $2(\text{row } 2) - 3(\text{row } 1)$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-condition
    where: 'example: b = (1, 4, 5) satisfies b3 = 2b2 − 3b1'
    inputs: {}
    formula: 2*4 - 3*1
    expected: '5'
    shown: ['$2 \cdot 4 - 3 = 5$']
    source: {cite: reading1, at: 'pp. 2–3'}
    origin: page-own

  - id: ex-xp
    where: 'example: B(1, 0, 2, 0) = (1, 4, 5): squared errors'
    inputs: {}
    formula: (1 - 1)**2 + (2 + 2 - 4)**2 + (1 + 4 - 5)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$B x_p = (1, 2 + 2, 1 + 4) = (1, 4, 5)$']
    source: {cite: reading1, at: 'pp. 5–6'}
    origin: page-own
