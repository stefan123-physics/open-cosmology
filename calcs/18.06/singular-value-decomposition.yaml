page: content/year-2/18.06/singular-value-decomposition.mdx
calcs:
  - id: ata-11
    where: 'AᵀA for (4 4; −3 3): entry (1, 1) = 16 + 9'
    inputs: {}
    formula: 4*4 + (-3)*(-3)
    expected: '25'
    shown: ['= \begin{pmatrix} 25 & 7 \\ 7 & 25 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: ata-12
    where: 'entry (1, 2) = 16 − 9'
    inputs: {}
    formula: 4*4 + (-3)*3
    expected: '7'
    shown: ['= \begin{pmatrix} 25 & 7 \\ 7 & 25 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: eig-32
    where: '(25 7; 7 25)(1, 1) = (32, 32)'
    inputs: {}
    formula: 25 + 7
    expected: '32'
    shown: ['with $A^TA(1, 1) = (32, 32)$']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: eig-18
    where: '(25 7; 7 25)(1, −1) = 18(1, −1)'
    inputs: {}
    formula: 25 - 7
    expected: '18'
    shown: ['with eigenvalue $18$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: aat
    where: 'AAᵀ entries: (4, 4)·(4, 4) = 32, (4, 4)·(−3, 3) = 0, (−3, 3)·(−3, 3) = 18; sum'
    inputs: {}
    formula: (4*4 + 4*4) + (4*(-3) + 4*3) + ((-3)*(-3) + 3*3)
    expected: '50'
    shown: ['AA^T = \begin{pmatrix} 32 & 0 \\ 0 & 18 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: row1
    where: 'first row: √32/√2 = 4'
    inputs: {}
    formula: sqrt(32)/sqrt(2)
    expected: '4'
    tolerance: 1e-12
    shown: ['$\sqrt{32}/\sqrt2 = 4$']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: sign-fix
    where: 'u₂ = Av₂/σ₂: second component of A(1, −1)/√2 is (−3 − 3)/√2; divided by √18 gives −1'
    inputs: {}
    formula: ((-3)*1 + 3*(-1))/sqrt(2)/sqrt(18)
    expected: '-1'
    tolerance: 1e-12
    shown: ['= (0, -6/\sqrt2)/\sqrt{18} = (0, -1)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: sign-fix-first
    where: 'first component of Av₂: 4·1 + 4·(−1) = 0'
    inputs: {}
    formula: 4*1 + 4*(-1)
    expected: '0'
    shown: ['= (0, -6/\sqrt2)/\sqrt{18} = (0, -1)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: r1-ata
    where: 'rank one: AᵀA = (16 + 64, 12 + 48; 12 + 48, 9 + 36)'
    inputs: {}
    formula: (16 + 64)*1000000 + (12 + 48)*1000 + (9 + 36)
    expected: '80060045'
    shown: ['A^TA = \begin{pmatrix} 80 & 60 \\ 60 & 45 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: r1-eig
    where: 'nonzero eigenvalue = trace 80 + 45 (the other is 0; det 80·45 − 60² = 0)'
    inputs: {}
    formula: 80 + 45 + (80*45 - 60**2)
    expected: '125'
    shown: ['\lambda = 125,\ 0']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: r1-five
    where: '√125/√5 = 5'
    inputs: {}
    formula: sqrt(125)/sqrt(5)
    expected: '5'
    tolerance: 1e-12
    shown: ['$\sqrt{125}/\sqrt5 = 5$']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: r1-entry
    where: 'A entry (2, 1) = 5·(2)(0.8)'
    inputs: {}
    formula: 5*2*0.8
    expected: '8'
    tolerance: 1e-12
    shown: ['gives back whole numbers: $A$']
    source: {cite: reading1, at: 'p. 16'}
