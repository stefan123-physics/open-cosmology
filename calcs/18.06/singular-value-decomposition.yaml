  - id: ex-ata
    where: 'example: AᵀA = (26 18; 18 74): 25 + 1, 25 − 7, 25 + 49'
    inputs: {}
    formula: (25 + 1)*10000 + (25 - 7)*100 + (25 + 49)
    expected: '261874'
    shown: ['= \begin{pmatrix} 26 & 18 \\ 18 & 74 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-char
    kind: identity
    where: 'example: λ² − 100λ + 1600 = (λ − 80)(λ − 20); det 26·74 − 18²'
    formula: l**2 - (26 + 74)*l + (26*74 - 18**2)
    equals: (l - 80)*(l - 20)
    samples: {l: [0.0, 10.0, 50.0]}
    tolerance: 1e-9
    shown: ['determinant $1924 - 324 = 1600$']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: page-own

  - id: ex-v1
    where: 'example: (26 18; 18 74)(1, 3) = (80, 240) = 80(1, 3)'
    inputs: {}
    formula: 26*1 + 18*3
    expected: '80'
    shown: ['gives $v_1 = (1, 3)/\sqrt{10}$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-u1
    where: 'example: Av₁ = (5 + 15, −1 + 21)/√10; u₁ first component 20/(√10·4√5) = 1/√2'
    inputs: {}
    formula: 20/(sqrt(10)*4*sqrt(5)) - 1/sqrt(2)
    expected: '0'
    tolerance: 1e-12
    shown: ['so $u_1 = (20, 20)/(\sqrt{10} \cdot 4\sqrt5) = (1, 1)/\sqrt2$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: ex-u2
    where: 'example: Av₂ = (15 − 5, −3 − 7)/√10 = (10, −10)/√10'
    inputs: {}
    formula: (5*3 + 5*(-1))*100 + ((-1)*3 + 7*(-1))
    expected: '990'
    shown: ['$Av_2 = (10, -10)/\sqrt{10}$']
    source: {cite: reading1, at: 'pp. 3–4'}
