  - id: p4-b-mid
    where: 'Problem 4(b): the root between 0 and 1.5'
    inputs: {}
    formula: solve('l**3 - 2*l**2 - l + 2', 'l', 0, 1.5)
    expected: '1'
    tolerance: '1e-9'
    shown: ['The eigenvalues are $2$, $1$ and $-1$']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-b-low
    where: 'Problem 4(b): the root below 0'
    inputs: {}
    formula: solve('l**3 - 2*l**2 - l + 2', 'l', -3, 0)
    expected: '-1'
    tolerance: '1e-9'
    shown: ['The eigenvalues are $2$, $1$ and $-1$']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-c
    answer: p4-c
    where: 'Problem 4(c), answer box: y = e^(−t) has y(0) = 1 and y′(0) = −1; its second derivative at 0'
    inputs: {}
    formula: deriv('deriv("exp(-r)", "r", s)', 's', 0)
    expected: '1'
    tolerance: '1e-4'
    shown: ['So $y = e^{-t}$ and $y''''(0) = 1$.']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  - id: p4-c-ode
    kind: identity
    where: 'Problem 4(c): y = e^(−t) solves y⁽³⁾ − 2y″ − y′ + 2y = 0, written with its derivatives −e^(−t), e^(−t), −e^(−t)'
    formula: -exp(-t) - 2*exp(-t) - (-exp(-t)) + 2*exp(-t)
    equals: 0*t
    samples: {t: [0, 1, 2]}
    tolerance: 1e-12
    shown: ['So $y = e^{-t}$']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
