  - id: p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: the root of λ³ − 2λ² − λ + 2 above 1.5'
    inputs: {}
    formula: solve('l**3 - 2*l**2 - l + 2', 'l', 1.5, 5)
    expected: '2'
    tolerance: '1e-9'
