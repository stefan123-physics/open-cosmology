# Calculations on content/year-2/18.06/18-06-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution: eigenvalues as numerical roots of det(A − λI) written
# out from the entries (solve), constants by Cramer's rule, solutions put back into their differential equations
# (deriv), Markov steady states checked row by row, and Fourier coefficients by numerical integration.
# All values were also recomputed with NumPy and SciPy (numpy.linalg.eigvals, scipy.linalg.expm, matrix powers,
# scipy.integrate.quad) when the page was written.

page: content/year-2/18.06/18-06-problem-set-8.mdx
calcs:
  - id: intro-points
    where: 'How to answer: the points of the seven problems (16 + 16 + 14 + 12 + 16 + 14 + 12)'
    inputs: {}
    formula: 16 + 16 + 14 + 12 + 16 + 14 + 12
    expected: '100'
    tolerance: '1e-12'
    shown: ['the points here (100 in all)']
    source: {cite: mit, at: 'our own points'}
    origin: page-own

  # ---- Problem 1

  - id: p1-a-big
    answer: p1-a-big
    where: 'Problem 1(a), answer box: the root of det(A − λI) = (−3 − λ)(−2 − λ) − 1·2 between −2 and 0'
    inputs: {}
    formula: solve('(-3 - l)*(-2 - l) - 2', 'l', -2, 0)
    expected: '-1'
    tolerance: '1e-9'
    shown: ['\lambda_1 = -1,\ \lambda_2 = -4']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-small
    answer: p1-a-small
    where: 'Problem 1(a), answer box: the root of det(A − λI) between −6 and −2.5'
    inputs: {}
    formula: solve('(-3 - l)*(-2 - l) - 2', 'l', -6, -2.5)
    expected: '-4'
    tolerance: '1e-9'
    shown: ['\lambda_1 = -1,\ \lambda_2 = -4']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-det
    where: 'Problem 1(a): the determinant (−3)(−2) − (1)(2)'
    inputs: {}
    formula: (-3)*(-2) - 1*2
    expected: '4'
    tolerance: '1e-12'
    shown: ['the determinant is $(-3)(-2) - (1)(2) = 4$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b-x1
    where: 'Problem 1(b): A x₁ = −x₁ for x₁ = (1, 2), first component −3·1 + 1·2'
    inputs: {}
    formula: -3*1 + 1*2
    expected: '-1'
    tolerance: '1e-12'
    shown: ['so $x_1 = (1, 2)$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-x1-second
    where: 'Problem 1(b): A x₁ = −x₁ for x₁ = (1, 2), second component 2·1 − 2·2'
    inputs: {}
    formula: 2*1 - 2*2
    expected: '-2'
    tolerance: '1e-12'
    shown: ['so $x_1 = (1, 2)$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-x2
    where: 'Problem 1(b): A x₂ = −4x₂ for x₂ = (1, −1), first component −3 − 1'
    inputs: {}
    formula: -3*1 + 1*(-1)
    expected: '-4'
    tolerance: '1e-12'
    shown: ['so $x_2 = (1, -1)$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-c2
    answer: p1-b-c2
    where: 'Problem 1(b), answer box: c₂ by Cramer''s rule from c₁(1, 2) + c₂(1, −1) = (3, 0): det(1, 3; 2, 0)/det(1, 1; 2, −1)'
    inputs: {}
    formula: (1*0 - 3*2) / (1*(-1) - 1*2)
    expected: '2'
    tolerance: '1e-12'
    shown: ['so $c_1 = 1$ and $c_2 = 2$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-c1
    where: 'Problem 1(b): c₁ by Cramer''s rule, det(3, 1; 0, −1)/det(1, 1; 2, −1)'
    inputs: {}
    formula: (3*(-1) - 1*0) / (1*(-1) - 1*2)
    expected: '1'
    tolerance: '1e-12'
    shown: ['so $c_1 = 1$ and $c_2 = 2$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-u2
    kind: identity
    answer: p1-b-u2
    where: 'Problem 1(b), answer box: u₂ against the solution of the scalar equation u₂″ + 5u₂′ + 4u₂ = 0 (which u₂ obeys, since trace −5 and det 4) with u₂(0) = 0 and u₂′(0) = 2u₁(0) − 2u₂(0) = 6: u₂ = 6(e^(λ₁t) − e^(λ₂t))/(λ₁ − λ₂), the λ''s found numerically'
    formula: 2*exp(-t) - 2*exp(-4*t)
    equals: 6*(exp(solve('(-3 - l)*(-2 - l) - 2', 'l', -2, 0)*t) - exp(solve('(-3 - l)*(-2 - l) - 2', 'l', -6, -2.5)*t)) / (solve('(-3 - l)*(-2 - l) - 2', 'l', -2, 0) - solve('(-3 - l)*(-2 - l) - 2', 'l', -6, -2.5))
    samples: {t: [0.05, 0.5, 1.5, 4]}
    tolerance: 1e-6
    shown: ['So $u_2(t) = 2e^{-t} - 2e^{-4t}$.']
    source: {cite: reading1, at: 'p. 5 (the general solution; the numbers are our own)'}
    origin: page-own

  - id: p1-b-u2-ode
    kind: identity
    where: 'Problem 1(b), check: u₂ = 2e^(−t) − 2e^(−4t) solves du₂/dt = 2u₁ − 2u₂ with u₁ = e^(−t) + 2e^(−4t)'
    formula: deriv('2*exp(-s) - 2*exp(-4*s)', 's', t)
    equals: 2*(exp(-t) + 2*exp(-4*t)) - 2*(2*exp(-t) - 2*exp(-4*t))
    samples: {t: [0.05, 0.5, 1.5, 4]}
    tolerance: 1e-6
    shown: ['should equal $2u_1 - 2u_2 = 2e^{-t} + 4e^{-4t} - 4e^{-t} + 4e^{-4t} = -2e^{-t} + 8e^{-4t}$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-u1
    kind: identity
    where: 'Problem 1(b): u₁ = e^(−t) + 2e^(−4t) solves du₁/dt = −3u₁ + u₂'
    formula: deriv('exp(-s) + 2*exp(-4*s)', 's', t)
    equals: -3*(exp(-t) + 2*exp(-4*t)) + (2*exp(-t) - 2*exp(-4*t))
    samples: {t: [0.05, 0.5, 1.5, 4]}
    tolerance: 1e-6
    shown: ['e^{-t} + 2e^{-4t} \\ 2e^{-t} - 2e^{-4t}']
    source: {cite: reading1, at: 'p. 5 (the general solution; the numbers are our own)'}
    origin: page-own

  - id: p1-b-start
    where: 'Problem 1(b), check: u₂(0) = 2 − 2'
    inputs: {}
    formula: 2*exp(0) - 2*exp(0)
    expected: '0'
    tolerance: '1e-12'
    shown: ['$u = (1 + 2, 2 - 2) = (3, 0)$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-c-t
    answer: p1-c-t
    where: 'Problem 1(c), answer box: the zero of du₂/dt = −2e^(−t) + 8e^(−4t) between 0.1 and 1'
    inputs: {}
    formula: solve('-2*exp(-x) + 8*exp(-4*x)', 'x', 0.1, 1)
    expected: '0.4621'
    shown: ['t^* = \frac{\ln 4}{3} \approx 0.4621', 'near t = 0.46']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-max
    answer: p1-c-max
    where: 'Problem 1(c), answer box: u₂ at the zero of its derivative'
    inputs: {}
    formula: 2*exp(-solve('-2*exp(-x) + 8*exp(-4*x)', 'x', 0.1, 1)) - 2*exp(-4*solve('-2*exp(-x) + 8*exp(-4*x)', 'x', 0.1, 1))
    expected: '0.9449'
    shown: ['\frac32 \cdot 4^{-1/3} \approx 0.9449']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-closed
    where: 'Problem 1(c): the closed form (3/2)·4^(−1/3)'
    inputs: {}
    formula: 1.5 * 4**(-1/3)
    expected: '0.9449'
    shown: ['\frac32 \cdot 4^{-1/3} \approx 0.9449']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-d-total
    kind: identity
    where: 'Problem 1(d), check: u₁ + u₂ = 3e^(−t)'
    formula: (exp(-t) + 2*exp(-4*t)) + (2*exp(-t) - 2*exp(-4*t))
    equals: 3*exp(-t)
    samples: {t: [0, 0.7, 2]}
    tolerance: 1e-12
    shown: ['$(e^{-t} + 2e^{-4t}) + (2e^{-t} - 2e^{-4t}) = 3e^{-t}$']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: the a at which det A = (−2)(−3) − a·1 is zero'
    inputs: {}
    formula: solve('(-2)*(-3) - x*1', 'x', 0, 10)
    expected: '6'
    tolerance: '1e-9'
    shown: ['So the system is stable for $a < 6$.']
    source: {cite: reading1, at: 'pp. 12–13'}
    origin: page-own

  - id: p2-b
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box: the larger eigenvalue against a numerical root of det(A − λI) = (−2 − λ)(−3 − λ) − a, searched above the midpoint −5/2'
    formula: (-5 + sqrt(1 + 4*a))/2
    equals: solve('(-2 - l)*(-3 - l) - a', 'l', -2.5, 5)
    samples: {a: [0, 0.5, 2, 5]}
    tolerance: 1e-6
    shown: ['= \frac{-5 \pm \sqrt{1 + 4a}}{2}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-c-re
    answer: p2-c-re
    where: 'Problem 2(c), answer box: real part of the eigenvalues, half the trace (−2 − 3)/2'
    inputs: {}
    formula: (-2 + -3)/2
    expected: '-2.5'
    tolerance: '1e-12'
    shown: ['$\lambda = (-5 \pm 5i)/2 = -2.5 \pm 2.5i$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-c-im
    answer: p2-c-im
    where: 'Problem 2(c), answer box: imaginary part sqrt(det − (trace/2)²) with det = 6 + 6.5'
    inputs: {}
    formula: sqrt((6 + 6.5) - 2.5**2)
    expected: '2.5'
    tolerance: '1e-12'
    shown: ['$\lambda = (-5 \pm 5i)/2 = -2.5 \pm 2.5i$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-c-disc
    where: 'Problem 2(c): 1 + 4a at a = −6.5'
    inputs: {}
    formula: 1 + 4*(-6.5)
    expected: '-25'
    tolerance: '1e-12'
    shown: ['$1 + 4a = 1 - 26 = -25$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-c-det
    where: 'Problem 2(c), check: det A = 6 − a at a = −6.5, and the product (−2.5)² + 2.5² of the conjugate eigenvalues'
    inputs: {}
    formula: 6 - (-6.5)
    expected: '12.5'
    tolerance: '1e-12'
    shown: ['$(-2.5)^2 + 2.5^2 = 12.5$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-c-prod
    where: 'Problem 2(c), check: (−2.5)² + 2.5²'
    inputs: {}
    formula: (-2.5)**2 + 2.5**2
    expected: '12.5'
    tolerance: '1e-12'
    shown: ['$(-2.5)^2 + 2.5^2 = 12.5$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-d-check
    kind: identity
    where: 'Problem 2(d), check: u = (cos 3t, sin 3t) solves du₁/dt = −3u₂'
    formula: deriv('cos(3*s)', 's', t)
    equals: -3*sin(3*t)
    samples: {t: [0.2, 1, 2.5]}
    tolerance: 1e-6
    shown: ['$u(t) = (\cos 3t, \sin 3t)$ is a solution']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-a
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box: the (1, 2) entry against Sylvester''s formula e^(At) = (e^(λ₁t)(A − λ₂I) − e^(λ₂t)(A − λ₁I))/(λ₁ − λ₂), whose (1, 2) entry is (e^(2t)·(−2) − e^(3t)·(−2))/(2 − 3), with no S at all'
    formula: 2*exp(2*t) - 2*exp(3*t)
    equals: (exp(2*t)*(-2) - exp(3*t)*(-2)) / (2 - 3)
    samples: {t: [0.1, 0.4, 1]}
    tolerance: 1e-9
    shown: ['The $(1, 2)$ entry is $2e^{2t} - 2e^{3t}$.']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-ode
    kind: identity
    where: 'Problem 3(a): the (1, 2) entry E₁₂ and the (2, 2) entry E₂₂ = 2e^(2t) − e^(3t) satisfy the first row of dE/dt = AE, dE₁₂/dt = 4E₁₂ − 2E₂₂'
    formula: deriv('2*exp(2*s) - 2*exp(3*s)', 's', t)
    equals: 4*(2*exp(2*t) - 2*exp(3*t)) - 2*(2*exp(2*t) - exp(3*t))
    samples: {t: [0.1, 0.4, 1]}
    tolerance: 1e-6
    shown: ['-e^{2t} + e^{3t} & 2e^{2t} - e^{3t}']
    source: {cite: reading1, at: 'pp. 19–21 (the formula; the numbers are our own)'}
    origin: page-own

  - id: p3-a-e11
    kind: identity
    where: 'Problem 3(a): the (1, 1) entry E₁₁ = −e^(2t) + 2e^(3t) and the (2, 1) entry E₂₁ = −e^(2t) + e^(3t) satisfy the first row of dE/dt = AE in the first column, dE₁₁/dt = 4E₁₁ − 2E₂₁ (and E₁₁(0) = 1, an independent route to the 3(c) value)'
    formula: deriv('-exp(2*s) + 2*exp(3*s)', 's', t)
    equals: 4*(-exp(2*t) + 2*exp(3*t)) - 2*(-exp(2*t) + exp(3*t))
    samples: {t: [0.1, 0.5, 1]}
    tolerance: 1e-6
    shown: ['-e^{2t} + 2e^{3t} & 2e^{2t} - 2e^{3t}']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-e21
    kind: identity
    where: 'Problem 3(a): the second row of dE/dt = AE in the first column, dE₂₁/dt = E₁₁ + E₂₁'
    formula: deriv('-exp(2*s) + exp(3*s)', 's', t)
    equals: (-exp(2*t) + 2*exp(3*t)) + (-exp(2*t) + exp(3*t))
    samples: {t: [0.1, 0.5, 1]}
    tolerance: 1e-6
    shown: ['-e^{2t} + e^{3t} & 2e^{2t} - e^{3t}']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-sinv
    where: 'Problem 3(a): det S = 1·1 − 2·1'
    inputs: {}
    formula: 1*1 - 2*1
    expected: '-1'
    tolerance: '1e-12'
    shown: ['S^{-1} = \frac{1}{-1}']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: the (1, 1) entry −e^(2t) + 2e^(3t) at t = 0.5 (checked against scipy.linalg.expm when written)'
    inputs: {}
    formula: -exp(2*0.5) + 2*exp(3*0.5)
    expected: '6.2451'
    shown: ['-e^{1} + 2e^{1.5} \approx -2.7183 + 8.9634 = 6.2451']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-e1
    where: 'Problem 3(c): e'
    inputs: {}
    formula: exp(1)
    expected: '2.7183'
    shown: ['-2.7183 + 8.9634']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-e15
    where: 'Problem 3(c): 2e^1.5'
    inputs: {}
    formula: 2*exp(1.5)
    expected: '8.9634'
    shown: ['-2.7183 + 8.9634']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-22
    where: 'Problem 3(c), check: the (2, 2) entry 2e − e^1.5'
    inputs: {}
    formula: 2*exp(1) - exp(1.5)
    expected: '0.9549'
    shown: ['$6.2451 + (2e - e^{1.5}) = 6.2451 + 0.9549 = 7.2000$']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-trace
    where: 'Problem 3(c), check: the trace e + e^1.5 of e^(At) at t = 0.5'
    inputs: {}
    formula: exp(1) + exp(1.5)
    expected: '7.2000'
    shown: ['$e + e^{1.5} = 2.7183 + 4.4817 = 7.2000$']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-e15b
    where: 'Problem 3(c), check: e^1.5'
    inputs: {}
    formula: exp(1.5)
    expected: '4.4817'
    shown: ['2.7183 + 4.4817 = 7.2000']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-d-geo
    answer: p3-d-geo
    where: 'Problem 3(d), answer box: the t at which the larger eigenvalue of At reaches 1; the larger root of λ² − 5λ + 6 is found numerically'
    inputs: {}
    formula: 1 / solve('l**2 - 5*l + 6', 'l', 2.5, 4)
    expected: '0.3333'
    shown: ['$0 < t < \frac13 \approx 0.3333$']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own

  # ---- Problem 4

  - id: p4-a-11
    answer: p4-a-11
    where: 'Problem 4(a), answer box: the coefficient of y″ in y⁽³⁾ = 2y″ + y′ − 2y, read off at y″ = 1, y′ = y = 0'
    inputs: {}
    formula: 2*1 + 0 - 2*0
    expected: '2'
    tolerance: '1e-12'
    shown: ['So $c_{11} = 2$ and $c_{13} = -2$.']
    source: {cite: reading1, at: 'p. 23 (the method; the third-order matrix is our own)'}
    origin: page-own

  - id: p4-a-13
    answer: p4-a-13
    where: 'Problem 4(a), answer box: the coefficient of y, read off at y = 1, y″ = y′ = 0'
    inputs: {}
    formula: 2*0 + 0 - 2*1
    expected: '-2'
    tolerance: '1e-12'
    shown: ['So $c_{11} = 2$ and $c_{13} = -2$.']
    source: {cite: reading1, at: 'p. 23 (the method; the third-order matrix is our own)'}
    origin: page-own

  - id: p4-b-det
    kind: identity
    where: 'Problem 4(b): the expansion along the first row equals −(λ³ − 2λ² − λ + 2)'
    formula: (2 - l)*l**2 - 1*(-l) + (-2)*1
    equals: -(l**3 - 2*l**2 - l + 2)
    samples: {l: [-1.5, 0.3, 2.7]}
    tolerance: 1e-12
    shown: ['= -\lambda^3 + 2\lambda^2 + \lambda - 2']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
