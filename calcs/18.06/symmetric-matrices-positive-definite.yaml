# Calculations on content/year-2/18.06/symmetric-matrices-positive-definite.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 25 transcript, with the page's own example.

page: content/year-2/18.06/symmetric-matrices-positive-definite.mdx
calcs:
  - id: conj-product
    kind: identity
    where: '(a − ib)(a + ib) = a² + b²: real part (the imaginary parts ab − ab cancel)'
    formula: a*a - (-b)*b
    equals: a**2 + b**2
    samples: {a: [1.0, -2.0], b: [0.5, 3.0]}
    tolerance: 1e-12
    shown: ['(a - ib)(a + ib) = a^2 + b^2']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: det-5232
    where: 'det of (5 2; 2 3) = 15 − 4'
    inputs: {}
    formula: 5*3 - 2*2
    expected: '11'
    shown: ['sub-determinants 5 and 11']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: pivot2
    where: 'second pivot 3 − (2/5)·2 = 11/5'
    inputs: {}
    formula: 3 - (2/5)*2 - 11/5
    expected: '0'
    tolerance: 1e-12
    shown: ['The second pivot is $\det A/5 = 11/5$']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: eig-5232
    kind: identity
    where: 'λ² − 8λ + 11 has roots 4 ± √5 (checked through (λ − 4)² − 5)'
    formula: l**2 - 8*l + 11
    equals: (l - 4)**2 - 5
    samples: {l: [0.0, 1.5, 6.0]}
    tolerance: 1e-12
    shown: ['\lambda^2 - 8\lambda + 11 = 0,\ \lambda = 4 \pm \sqrt5']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: eig-small
    where: 'smaller eigenvalue 4 − √5'
    inputs: {}
    formula: 4 - sqrt(5)
    expected: '1.76'
    tolerance: 0.005
    shown: ['as $4 - \sqrt5 \approx 1.76$ shows']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: diag-det
    where: 'det of (−1 0; 0 −3)'
    inputs: {}
    formula: (-1)*(-3) - 0
    expected: '3'
    shown: ['has determinant $3$, yet its pivots']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: ex-det
    where: 'example: det of (6 2; 2 9) = 54 − 4'
    inputs: {}
    formula: 6*9 - 2*2
    expected: '50'
    shown: ['determinant $54 - 4 = 50$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-char
    kind: identity
    where: 'example: λ² − 15λ + 50 = (λ − 10)(λ − 5)'
    formula: l**2 - 15*l + 50
    equals: (l - 10)*(l - 5)
    samples: {l: [0.0, 2.0, 7.0]}
    tolerance: 1e-12
    shown: ['\lambda^2 - 15\lambda + 50 = (\lambda - 10)(\lambda - 5)']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-perp
    where: 'example: (1, 2)·(2, −1)'
    inputs: {}
    formula: 1*2 + 2*(-1)
    expected: '0'
    shown: ['They are perpendicular; normalised']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-sum-11
    where: 'example: entry (1, 1) of 10q₁q₁ᵀ + 5q₂q₂ᵀ = 10·1/5 + 5·4/5'
    inputs: {}
    formula: 10*1/5 + 5*4/5
    expected: '6'
    tolerance: 1e-12
    shown: ['Their sum is $\begin{pmatrix} 6 & 2 \\ 2 & 9 \end{pmatrix} = A$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: ex-sum-12
    where: 'example: entry (1, 2): 10·2/5 + 5·(−2)/5'
    inputs: {}
    formula: 10*2/5 + 5*(-2)/5
    expected: '2'
    tolerance: 1e-12
    shown: ['$5q_2q_2^T = \begin{pmatrix} 4 & -2 \\ -2 & 1 \end{pmatrix}$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: ex-sum-22
    where: 'example: entry (2, 2): 10·4/5 + 5·1/5'
    inputs: {}
    formula: 10*4/5 + 5*1/5
    expected: '9'
    tolerance: 1e-12
    shown: ['= \begin{pmatrix} 2 & 4 \\ 4 & 8 \end{pmatrix}$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: ex-pivot2
    where: 'example: second pivot 9 − (2/6)·2 = 50/6 = 25/3'
    inputs: {}
    formula: 9 - (2/6)*2 - 25/3
    expected: '0'
    tolerance: 1e-12
    shown: ['The pivots are $6$ and $50/6 = 25/3$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-c-pivot
    where: 'example (b): second pivot 1 − 3·3'
    inputs: {}
    formula: 1 - 3*3
    expected: '-8'
    shown: ['second $1 - 3 \cdot 3 = -8$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-c-char
    kind: identity
    where: 'example (b): (1 − λ)² − 9 = λ² − 2λ − 8 = (λ − 4)(λ + 2)'
    formula: (1 - l)**2 - 9
    equals: (l - 4)*(l + 2)
    samples: {l: [0.0, 1.0, 5.0]}
    tolerance: 1e-12
    shown: ['\lambda^2 - 2\lambda - 8 = (\lambda - 4)(\lambda + 2)']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: conj-imag
    kind: identity
    where: '(a − ib)(a + ib): the imaginary parts a·b and −b·a cancel'
    formula: a*b + (-b)*a
    equals: 0*a
    samples: {a: [1.0, -2.0], b: [0.5, 3.0]}
    tolerance: 1e-12
    shown: ['The imaginary parts $iab$ and $-iab$ cancel']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit
