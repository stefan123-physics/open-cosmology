# Calculations on content/year-2/18.06/change-of-basis-compression.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 31 transcript, with the page's own example.

page: content/year-2/18.06/change-of-basis-compression.mdx
calcs:
  - id: pixels
    where: '512 = 2⁹, so a 512 × 512 image has 2¹⁸ pixels'
    inputs: {}
    formula: 512**2 - 2**18
    expected: '0'
    shown: ['$512 \times 512 = 2^9 \times 2^9$']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: gray-levels
    where: '0 to 255 is 256 = 2⁸ values'
    inputs: {}
    formula: 255 + 1 - 2**8
    expected: '0'
    shown: ['which is $2^8$ values: 8 bits']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: block
    where: '8 × 8 block = 64 pixels'
    inputs: {}
    formula: 8*8
    expected: '64'
    shown: ['in 64-dimensional space']
    source: {cite: reading1, at: 'pp. 5–6'}
    origin: mit

  - id: ratio
    where: '64 coefficients down to 3: about 21 to 1'
    inputs: {}
    formula: 64/3
    expected: '21.3'
    tolerance: 0.05
    shown: ['the compression is about 21 to 1']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: haar-orth
    where: 'w₁·w₂ = 4·1 + 4·(−1)'
    inputs: {}
    formula: 4*1 + 4*(-1)
    expected: '0'
    shown: ['the first two have dot product $4 - 4 = 0$']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: haar-lengths
    where: 'lengths √8, √4, √2 of the wavelets with 8, 4, 2 nonzero entries'
    inputs: {}
    formula: sqrt(8)**2 + sqrt(4)**2 + sqrt(2)**2
    expected: '14'
    tolerance: 1e-12
    shown: ['($\sqrt8$, $\sqrt4$, $\sqrt2$)']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: ex-c1
    where: 'example: c₁ = (7 + 5 + 2 + 2)/4'
    inputs: {}
    formula: (7 + 5 + 2 + 2)/4
    expected: '4'
    shown: ['$c_1 = 16/4 = 4$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: page-own

  - id: ex-c2
    where: 'example: c₂ = (7 + 5 − 2 − 2)/4'
    inputs: {}
    formula: (7 + 5 - 2 - 2)/4
    expected: '2'
    shown: ['$c_2 = (12 - 4)/4 = 2$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: page-own

  - id: ex-c3
    where: 'example: c₃ = (7 − 5)/2'
    inputs: {}
    formula: (7 - 5)/2
    expected: '1'
    shown: ['$c_3 = (7 - 5)/2 = 1$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: page-own

  - id: ex-c4
    where: 'example: c₄ = (2 − 2)/2'
    inputs: {}
    formula: (2 - 2)/2
    expected: '0'
    shown: ['$c_4 = (2 - 2)/2 = 0$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: page-own

  - id: ex-rebuild-1
    where: 'example: first component of 4w₁ + 2w₂ + w₃ = 4 + 2 + 1'
    inputs: {}
    formula: 4 + 2 + 1
    expected: '7'
    shown: ['= (7, 5, 2, 2)$.']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-rebuild-2
    where: 'example: second component 4 + 2 − 1'
    inputs: {}
    formula: 4 + 2 - 1
    expected: '5'
    shown: ['= (7, 5, 2, 2)$.']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-compressed
    where: 'example: 4w₁ + 2w₂ = (6, 6, 2, 2); first component'
    inputs: {}
    formula: 4 + 2
    expected: '6'
    shown: ['$\hat P = 4w_1 + 2w_2 = (6, 6, 2, 2)$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-error
    where: 'example: P − P̂ first component 7 − 6 = c₃·1'
    inputs: {}
    formula: 7 - 6
    expected: '1'
    shown: ['the error $(1, -1, 0, 0)$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-proj
    where: 'example: MAM⁻¹ entry (1, 1) = ½·1·1·1'
    inputs: {}
    formula: 0.5*1*1*1
    expected: '0.5'
    tolerance: 1e-12
    shown: ['= \frac12\begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}$, the familiar']
    source: {cite: reading1, at: 'p. 17'}
    origin: page-own
