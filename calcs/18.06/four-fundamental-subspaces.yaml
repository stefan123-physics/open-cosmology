# Calculations on content/year-2/18.06/four-fundamental-subspaces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 10 transcript, with the page's own example.

page: content/year-2/18.06/four-fundamental-subspaces.mdx
calcs:
  - id: ea-row1
    where: 'row 1 of EA: −(1, 2, 3, 1) + 2(1, 1, 2, 1) = (1, 0, 1, 1); squared differences'
    inputs: {}
    formula: (-1 + 2 - 1)**2 + (-2 + 2 - 0)**2 + (-3 + 4 - 1)**2 + (-1 + 2 - 1)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['basis } (1, 0, 1, 1)']
    source: {cite: reading1, at: 'pp. 19–20'}
    origin: mit

  - id: ea-row2
    where: 'row 2 of EA: (1, 2, 3, 1) − (1, 1, 2, 1) = (0, 1, 1, 0); squared differences'
    inputs: {}
    formula: (1 - 1 - 0)**2 + (2 - 1 - 1)**2 + (3 - 2 - 1)**2 + (1 - 1 - 0)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['(0, 1, 1, 0)" cite']
    source: {cite: reading1, at: 'pp. 19–20'}
    origin: mit

  - id: left-null
    where: 'y = (−1, 0, 1): −row 1 + row 3 of A = 0; squared entries'
    inputs: {}
    formula: (-1 + 1)**2 + (-2 + 2)**2 + (-3 + 3)**2 + (-1 + 1)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['so $y = (-1, 0, 1)$ is a basis']
    source: {cite: reading1, at: 'p. 20'}
    origin: mit

  - id: left-null-dim
    where: 'dim N(Aᵀ) = m − r = 3 − 2'
    inputs: {}
    formula: 3 - 2
    expected: '1'
    shown: ['Here $m - r = 3 - 2 = 1$']
    source: {cite: reading1, at: 'p. 20'}
    origin: mit

  - id: ex-left-null
    where: 'example: −(1, 2, 0, 1) − (2, 4, 1, 4) + (3, 6, 1, 5) = 0; squared entries'
    inputs: {}
    formula: (-1 - 2 + 3)**2 + (-2 - 4 + 6)**2 + (0 - 1 + 1)**2 + (-1 - 4 + 5)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$-1(1, 2, 0, 1) - (2, 4, 1, 4) + (3, 6, 1, 5) = (0, 0, 0, 0)$']
    source: {cite: reading1, at: 'pp. 19–21'}
    origin: page-own

  - id: ex-null
    where: 'example: B(−1, 0, −2, 1) = 0, rows −1+0+0+1, −2+0−2+4, −3+0−2+5'
    inputs: {}
    formula: (-1 + 0 + 0 + 1)**2 + (-2 + 0 - 2 + 4)**2 + (-3 + 0 - 2 + 5)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$(-2, 1, 0, 0)$ and $(-1, 0, -2, 1)$']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: page-own

  - id: ex-E-row3
    where: 'example: last row of E = (−3, 0, 1) − (−2, 1, 0); first entry'
    inputs: {}
    formula: -3 - (-2)
    expected: '-1'
    shown: ['$(-3, 0, 1) - (-2, 1, 0) = (-1, -1, 1)$']
    source: {cite: reading1, at: 'pp. 17–20'}
    origin: page-own

  - id: ex-counts
    where: 'example: dimensions in Rⁿ add to n = 4, in Rᵐ to m = 3'
    inputs: {}
    formula: (2 + 2)*10 + (2 + 1)
    expected: '43'
    shown: ['$2 + 2 = 4 = n$ and $2 + 1 = 3 = m$']
    source: {cite: reading1, at: 'p. 21'}
    origin: page-own
