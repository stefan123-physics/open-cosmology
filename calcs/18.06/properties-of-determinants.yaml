# Calculations on content/year-2/18.06/properties-of-determinants.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 18 transcript, with the page's own example.

page: content/year-2/18.06/properties-of-determinants.mdx
calcs:
  - id: two-by-two
    where: 'a(d − (c/a)b) = ad − bc, sampled'
    kind: identity
    formula: a*(d - (c/a)*b)
    equals: a*d - b*c
    samples: {a: [2.0, -1.5], b: [3.0, 0.7], c: [5.0, 2.2], d: [7.0, -4.0]}
    tolerance: 1e-9
    shown: ['= ad - bc" cite']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: diag-inverse
    where: 'diag(2, 3) has determinant 6, its inverse 1/6'
    inputs: {}
    formula: (2*3) * ((1/2)*(1/3))
    expected: '1'
    tolerance: 1e-12
    shown: ['determinants 6 and $\frac{1}{6}$']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: box
    where: 'doubling the sides of a box in 3D multiplies its volume by 2³'
    inputs: {}
    formula: 2**3
    expected: '8'
    shown: ['multiplies its volume by 8']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: quiz-16
    where: 'quiz: 2⁴'
    inputs: {}
    formula: 2**4
    expected: '16'
    shown: ['$2^4 = 16$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: page-own

  - id: ex-det
    where: 'example: product of pivots 2·3·3 equals the 3 × 3 cofactor formula'
    inputs: {}
    formula: 2*(5*1 - 7*2) - 1*(4*1 - 7*(-2)) + 3*(4*2 - 5*(-2))
    expected: '18'
    shown: ['pivots 2, 3, 3: $\det A = 18$']
    source: {cite: reading1, at: 'pp. 10–12'}
    origin: page-own

  - id: ex-row3
    where: 'example: (0, 3, 4) − (0, 3, 1) = (0, 0, 3); third pivot'
    inputs: {}
    formula: (1 + 3) - (7 - 2*3)
    expected: '3'
    shown: ['Then row 3 minus row 2: $(0, 0, 3)$']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: page-own

  - id: ex-2A
    where: 'example: det 2A = 2³ · 18'
    inputs: {}
    formula: 2**3 * 18
    expected: '144'
    shown: ['$\det 2A = 2^3 \cdot 18 = 144$']
    source: {cite: reading1, at: 'p. 17'}
    origin: page-own
