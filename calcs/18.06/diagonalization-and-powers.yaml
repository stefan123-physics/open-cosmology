# Calculations on content/year-2/18.06/diagonalization-and-powers.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 22 transcript, with the page's own example and the completion of the Fibonacci formula.

page: content/year-2/18.06/diagonalization-and-powers.mdx
calcs:
  - id: triangular-char
    kind: identity
    where: 'det of (2 − λ, 1; 0, 2 − λ) = (2 − λ)²'
    formula: (2 - l)*(2 - l) - 1*0
    equals: (2 - l)**2
    samples: {l: [-1.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['\det(A - \lambda I) = (2 - \lambda)^2']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: fib-char
    kind: identity
    where: 'det of (1 − λ, 1; 1, −λ) = λ² − λ − 1'
    formula: (1 - l)*(-l) - 1*1
    equals: l**2 - l - 1
    samples: {l: [-1.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['\lambda^2 - \lambda - 1 = 0']
    source: {cite: reading1, at: 'p. 20'}
    origin: mit

  - id: fib-lambda1
    where: 'λ₁ = (1 + √5)/2'
    inputs: {}
    formula: (1 + sqrt(5))/2
    expected: '1.618'
    tolerance: 0.0005
    shown: ['\approx 1.618']
    source: {cite: reading1, at: 'p. 21'}
    origin: mit

  - id: fib-lambda2
    where: 'λ₂ = (1 − √5)/2'
    inputs: {}
    formula: (1 - sqrt(5))/2
    expected: '-0.618'
    tolerance: 0.0005
    shown: ['\approx -0.618']
    source: {cite: reading1, at: 'p. 21'}
    origin: mit

  - id: fib-sum-product
    where: 'λ₁ + λ₂ = 1 (trace) and λ₁λ₂ = −1 (determinant): sum minus product'
    inputs: {}
    formula: ((1 + sqrt(5))/2 + (1 - sqrt(5))/2) - ((1 + sqrt(5))/2)*((1 - sqrt(5))/2)
    expected: '2'
    tolerance: 1e-12
    shown: ['They add to the trace $1$ and multiply to the determinant $-1$']
    source: {cite: reading1, at: 'pp. 20–21'}
    origin: mit

  - id: fib-c1
    where: '(1, 0) = (x₁ − x₂)/(λ₁ − λ₂), with λ₁ − λ₂ = √5: c₁ = 1/√5'
    inputs: {}
    formula: 1/((1 + sqrt(5))/2 - (1 - sqrt(5))/2) - 1/sqrt(5)
    expected: '0'
    tolerance: 1e-12
    shown: ['so $c_1 = 1/\sqrt5$']
    source: {cite: reading1, at: 'p. 24'}
    origin: page-own

  - id: fib-100
    where: 'F₁₀₀ = (λ₁¹⁰⁰ − λ₂¹⁰⁰)/√5 (exact value 354 224 848 179 261 915 075)'
    inputs: {}
    formula: (((1 + sqrt(5))/2)**100 - ((1 - sqrt(5))/2)**100)/sqrt(5)
    expected: '3.54e20'
    tolerance: 0.005e20
    shown: ['F_{100} \approx 3.54 \times 10^{20}']
    source: {cite: reading1, at: 'p. 22'}
    origin: page-own

  - id: fib-small-term
    where: '(−0.618)¹⁰⁰ is practically nothing'
    inputs: {}
    formula: ((1 - sqrt(5))/2)**100
    expected: '1.26e-21'
    tolerance: 0.01e-21
    shown: ['about $(-0.618)^{100}$, is practically nothing']
    source: {cite: reading1, at: 'p. 23'}
    origin: mit

  - id: ex-det
    where: 'example: det of (4 1; 2 3) = 12 − 2'
    inputs: {}
    formula: 4*3 - 1*2
    expected: '10'
    shown: ['determinant $12 - 2 = 10$']
    source: {cite: reading1, at: 'p. 20'}
    origin: page-own

  - id: ex-char
    kind: identity
    where: 'example: λ² − 7λ + 10 = (λ − 5)(λ − 2)'
    formula: l**2 - 7*l + 10
    equals: (l - 5)*(l - 2)
    samples: {l: [-1.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['\lambda^2 - 7\lambda + 10 = (\lambda - 5)(\lambda - 2)']
    source: {cite: reading1, at: 'p. 20'}
    origin: page-own

  - id: ex-c
    where: 'example: c₁ + c₂ = 3, c₁ − 2c₂ = 0 → c₂ = 1, c₁ = 2; check c₁ + c₂'
    inputs: {}
    formula: 2*1 + 1*1
    expected: '3'
    shown: ['so $c_2 = 1$ and $c_1 = 2$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-u1-first
    where: 'example: u₁ first component directly from A(3, 0): 4·3 + 1·0 (the formula gives 2·5 + 2, entry ex-u1-formula)'
    inputs: {}
    formula: 4*3 + 1*0
    expected: '12'
    shown: ['$(10 + 2, 10 - 4) = (12, 6)$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-u1-second
    where: 'example: u₁ second component, 2·5 − 2·2 and 2·3 + 3·0'
    inputs: {}
    formula: 2*5 - 2*2
    expected: '6'
    shown: ['directly $Au_0 = (12, 6)$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-u2-first
    where: 'example: u₂ first component, 2·25 + 4 = 4·12 + 1·6'
    inputs: {}
    formula: 4*12 + 1*6
    expected: '54'
    shown: ['$(50 + 4, 50 - 8) = (54, 42)$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-u2-formula
    where: 'example: u₂ from the formula, first component 2·5² + 2²'
    inputs: {}
    formula: 2*5**2 + 2**2
    expected: '54'
    shown: ['$(50 + 4, 50 - 8) = (54, 42)$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-u2-second
    where: 'example: u₂ second component, 2·5² − 2·2² = 2·12 + 3·6'
    inputs: {}
    formula: 2*12 + 3*6
    expected: '42'
    shown: ['$A(12, 6) = (48 + 6, 24 + 18) = (54, 42)$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-u1-formula
    where: 'example: u₁ first component from the formula, 2·5 + 2'
    inputs: {}
    formula: 2*5 + 2
    expected: '12'
    shown: ['$(10 + 2, 10 - 4) = (12, 6)$']
    source: {cite: reading1, at: 'pp. 14–15'}
    origin: page-own

  - id: ex-u1-direct-second
    where: 'example: u₁ second component directly from A(3, 0): 2·3 + 3·0'
    inputs: {}
    formula: 2*3 + 3*0
    expected: '6'
    shown: ['directly $Au_0 = (12, 6)$']
    source: {cite: reading1, at: 'pp. 14–15'}
    origin: page-own

  - id: ex-u2-formula-second
    where: 'example: u₂ second component from the formula, 2·5² − 2·2²'
    inputs: {}
    formula: 2*5**2 - 2*2**2
    expected: '42'
    shown: ['$(50 + 4, 50 - 8) = (54, 42)$']
    source: {cite: reading1, at: 'pp. 14–15'}
    origin: page-own
