# Calculations on content/year-2/18.06/cramers-rule-inverse-volume.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 20 transcript, with the page's own example.

page: content/year-2/18.06/cramers-rule-inverse-volume.mdx
calcs:
  - id: inv-2x2
    where: 'A times (1/(ad − bc))(d −b; −c a) gives I: entry (1, 2), a(−b) + b·a over ad − bc, plus entry (1, 1), sampled'
    kind: identity
    formula: (a*(-b) + b*a)/(a*d - b*c) + (a*d + b*(-c))/(a*d - b*c)
    equals: 1 + 0*a
    samples: {a: [2.0, -1.5], b: [3.0, 0.7], c: [5.0, 2.2], d: [7.0, -4.0]}
    tolerance: 1e-12
    shown: ['\frac{1}{ad - bc}\begin{pmatrix} d & -b']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: offdiag
    where: 'row (a, b) times cofactors of the copied row: a·b + b·(−a) = 0'
    kind: identity
    formula: a*b + b*(-a)
    equals: 0*a
    samples: {a: [2.0, -1.5], b: [3.0, 0.7]}
    tolerance: 1e-12
    shown: ['$a \cdot b + b \cdot (-a) = 0$']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: mit

  - id: ex-det
    where: 'example: det A = 3·5 − 2·4'
    inputs: {}
    formula: 3*5 - 2*4
    expected: '7'
    shown: ['$\det A = 15 - 8 = 7$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-x1
    where: 'example: x1 = (8·5 − 2·13)/7'
    inputs: {}
    formula: (8*5 - 2*13)/7
    expected: '2'
    tolerance: 1e-12
    shown: ['= (40 - 26)/7 = 2$']
    source: {cite: reading1, at: 'pp. 11–13'}
    origin: page-own

  - id: ex-x2
    where: 'example: x2 = (3·13 − 8·4)/7'
    inputs: {}
    formula: (3*13 - 8*4)/7
    expected: '1'
    tolerance: 1e-12
    shown: ['= (39 - 32)/7 = 1$']
    source: {cite: reading1, at: 'pp. 11–13'}
    origin: page-own

  - id: ex-area
    where: 'example: ½ det of (1 1 1; 4 2 1; 2 5 1)'
    inputs: {}
    formula: 0.5*(1*(2*1 - 1*5) - 1*(4*1 - 1*2) + 1*(4*5 - 2*2))
    expected: '5.5'
    tolerance: 1e-12
    shown: ['so the area is $5.5$']
    source: {cite: reading1, at: 'p. 24'}
    origin: page-own

  - id: ex-area-shift
    where: 'example: sides (3, 1), (1, 4): ½(12 − 1)'
    inputs: {}
    formula: 0.5*(3*4 - 1*1)
    expected: '5.5'
    tolerance: 1e-12
    shown: ['give $\frac{1}{2}(12 - 1) = 5.5$']
    source: {cite: reading1, at: 'pp. 22–23'}
    origin: page-own
