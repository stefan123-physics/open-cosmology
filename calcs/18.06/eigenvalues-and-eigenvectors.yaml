# Calculations on content/year-2/18.06/eigenvalues-and-eigenvectors.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 21 transcript, with the page's own example.

page: content/year-2/18.06/eigenvalues-and-eigenvectors.mdx
calcs:
  - id: swap-minus
    where: 'swap permutation times (−1, 1) gives (1, −1) = −1·(−1, 1): first component 0·(−1) + 1·1'
    inputs: {}
    formula: 0*(-1) + 1*1
    expected: '1'
    shown: ['comes out as $(1, -1)$, minus itself']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: char-3131
    kind: identity
    where: '(3 − λ)² − 1 = λ² − 6λ + 8 = (λ − 4)(λ − 2)'
    formula: (3 - l)**2 - 1
    equals: (l - 4)*(l - 2)
    samples: {l: [-1.0, 0.5, 2.0, 7.0]}
    tolerance: 1e-9
    shown: ['(3 - \lambda)^2 - 1 = \lambda^2 - 6\lambda + 8 = 0']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: product-3131
    where: 'product of the eigenvalues 4·2 = det = 9 − 1'
    inputs: {}
    formula: 3*3 - 1*1
    expected: '8'
    shown: ['$4 \cdot 2 = 8$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: two-by-two
    kind: identity
    where: 'det(A − λI) = λ² − (a + d)λ + (ad − bc) for any 2 × 2'
    formula: (a - l)*(d - l) - b*c
    equals: l**2 - (a + d)*l + (a*d - b*c)
    samples: {a: [2.0, -1.5], b: [3.0, 0.7], c: [5.0, 2.2], d: [7.0, -4.0], l: [0.3, 2.0]}
    tolerance: 1e-9
    shown: ['\lambda^2 - (\operatorname{trace})\,\lambda + \det A = 0']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: rotation
    kind: identity
    where: 'det of (−λ, −1; 1, −λ) = λ² + 1'
    formula: (-l)*(-l) - (-1)*1
    equals: l**2 + 1
    samples: {l: [-2.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['= \lambda^2 + 1 = 0']
    source: {cite: reading1, at: 'p. 22'}
    origin: mit

  - id: ex-trace-det
    where: 'example: det of (5 2; 2 2) = 10 − 4'
    inputs: {}
    formula: 5*2 - 2*2
    expected: '6'
    shown: ['determinant $10 - 4 = 6$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-char
    kind: identity
    where: 'example: λ² − 7λ + 6 = (λ − 6)(λ − 1)'
    formula: l**2 - 7*l + 6
    equals: (l - 6)*(l - 1)
    samples: {l: [-1.0, 0.5, 2.0]}
    tolerance: 1e-9
    shown: ['\lambda^2 - 7\lambda + 6 = (\lambda - 6)(\lambda - 1) = 0']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-x1
    where: 'example: A(2, 1) = (5·2 + 2·1, 2·2 + 2·1) = (12, 6); first component'
    inputs: {}
    formula: 5*2 + 2*1
    expected: '12'
    shown: ['$Ax_1 = (12, 6) = 6x_1$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-x1-second
    where: 'example: second component of A(2, 1) = 2·2 + 2·1 = 6 = 6·1'
    inputs: {}
    formula: 2*2 + 2*1
    expected: '6'
    shown: ['$Ax_1 = (12, 6) = 6x_1$']
    source: {cite: reading1, at: 'p. 15'}
    origin: page-own

  - id: ex-x2
    where: 'example: A(1, −2) = (5 − 4, 2 − 4) = (1, −2); second component (the first is 5 − 4 = 1)'
    inputs: {}
    formula: 2*1 + 2*(-2)
    expected: '-2'
    shown: ['and $Ax_2 = (1, -2)$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-perp
    where: 'example: (2, 1)·(1, −2)'
    inputs: {}
    formula: 2*1 + 1*(-2)
    expected: '0'
    shown: ['$2 \cdot 1 + 1 \cdot (-2) = 0$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b-x2
    where: 'example: B(2, 1) = (1·2 + 4·1, 3·1) = (6, 3) = 3(2, 1); first component'
    inputs: {}
    formula: 1*2 + 4*1
    expected: '6'
    shown: ['$Bx_2 = (6, 3) = 3x_2$']
    source: {cite: reading1, at: 'pp. 24–25'}
    origin: page-own

  - id: ex-b-dot
    where: 'example: (1, 0)·(2, 1)'
    inputs: {}
    formula: 1*2 + 0*1
    expected: '2'
    shown: ['$x_1 \cdot x_2 = 2$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: quiz-trace-7-det-10
    kind: identity
    where: 'quiz: λ² − 7λ + 10 = (λ − 2)(λ − 5), so the eigenvalues are 2 and 5'
    formula: l**2 - 7*l + 10
    equals: (l - 2)*(l - 5)
    samples: {l: [-1.0, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['so they are 2 and 5']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-b-trace-det
    where: 'example (b): trace 1 + 3 = 4 = sum of eigenvalues, det 1·3 − 4·0 = 3 = product'
    inputs: {}
    formula: (1 + 3) - (1*3 - 4*0)
    expected: '1'
    shown: ['(sum $4$ = trace, product $3$ = det)']
    source: {cite: reading1, at: 'pp. 8, 20'}
    origin: page-own
