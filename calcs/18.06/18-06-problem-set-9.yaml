  - id: p3-d-low
    where: 'Problem 3(d): 3 − √23 ≈ −1.80'
    inputs: {}
    formula: 3 - sqrt(23)
    expected: '-1.80'
    shown: ['Numerically $\lambda \approx -1.80$, $4$ and $7.80$.']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-high
    where: 'Problem 3(d): 3 + √23 ≈ 7.80'
    inputs: {}
    formula: 3 + sqrt(23)
    expected: '7.80'
    shown: ['two of them, $4$ and $7.80$, are above $3$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-vec
    where: 'Problem 3(d): S(−1, 1, 3) = (−4, 4, 12)'
    inputs: {}
    formula: (2*(-1) + 4*1 + (-2)*3 + 4)**2 + (4*(-1) + 5*1 + 1*3 - 4)**2 + ((-2)*(-1) + 1*1 + 3*3 - 12)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$S(-1, 1, 3) = (-4, 4, 12)$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-check
    where: 'Problem 3(d), check: 4·(9 − 23) = −56'
    inputs: {}
    formula: 4*(9 - 23)
    expected: '-56'
    shown: ['their product is $4 \cdot (9 - 23) = -56$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  # ---- Problem 4  T = (3 b 0; b 3 b; 0 b 3)

  - id: p4-a
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box: det T against the rule of Sarrus'
    formula: 27 - 6*b**2
    equals: 3*3*3 + b*b*0 + 0*b*b - 0*3*0 - b*b*3 - 3*b*b
    samples: {b: [0.2, 1, 2, 2.5, 3]}
    tolerance: 1e-9
    shown: ['\det T = 3(9 - b^2) - b(3b - 0) + 0 = 27 - 6b^2']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: the positive root of 27 − 6b², found numerically'
    inputs: {}
    formula: solve('27 - 6*bb**2', 'bb', 0.5, 3)
    expected: '2.1213'
    tolerance: '0.0001'
    shown: ['b < \sqrt{\tfrac92} = \frac{3}{\sqrt2} \approx 2.12']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-b-check1
    where: 'Problem 4(b), check: at b = 1 the determinants 3, 9 − 1 = 8, 27 − 6 = 21 (sum of squared differences)'
    inputs: {}
    formula: (9 - 1 - 8)**2 + (27 - 6*1 - 21)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['At $b = 1$: the determinants are $3$, $8$ and $27 - 6 = 21$, all positive.']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-b-check2
    where: 'Problem 4(b), check: det T at b = 2.5'
    inputs: {}
    formula: 27 - 6*2.5**2
    expected: '-10.5'
    shown: ['$\det T = 27 - 37.5 = -10.5 < 0$']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-c
    kind: identity
    answer: p4-c
    where: 'Problem 4(c), answer box: the smallest eigenvalue against a numerical root of det(T − λI) = (3 − λ)³ − 2b²(3 − λ) below 3'
    formula: 3 - sqrt(2)*b
    equals: solve('(3 - lam)**3 - 2*b**2*(3 - lam)', 'lam', 3 - 5*b, 3 - 0.01*b)
    samples: {b: [0.2, 0.7, 1, 2, 3]}
    tolerance: 1e-6
    shown: ['The smallest, for $b > 0$, is $3 - \sqrt2\,b$']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  - id: p4-c-check
    kind: identity
    where: 'Problem 4(c), check: product of the eigenvalues 3(9 − 2b²) equals det T = 27 − 6b²'
    formula: (3 + sqrt(2)*b)*3*(3 - sqrt(2)*b)
    equals: 27 - 6*b**2
    samples: {b: [0.2, 1, 2, 3]}
    tolerance: 1e-9
    shown: ['The product is $3(9 - 2b^2) = 27 - 6b^2$']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  - id: p4-d
    answer: p4-d
    where: 'Problem 4(d), answer box: third pivot for b = 2 by elimination, 3 − (6/5)·2 after the second row (0, 5/3, 2)'
    inputs: {}
    formula: 3 - (2/(3 - 2*2/3))*2
    expected: '0.6'
    tolerance: '1e-9'
    shown: ['the pivots are $3$, $\frac53$ and $\frac35 = 0.6$']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  - id: p4-d-ratio
    where: 'Problem 4(d): ratio of the determinants 27 − 24 and 9 − 4 at b = 2'
    inputs: {}
    formula: (27 - 6*2**2)/(9 - 2**2)
    expected: '0.6'
    tolerance: '1e-12'
    shown: ['For $b = 2$ the determinants are $3$, $5$ and $3$']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  # ---- Problem 5  f = 4x² + 12xy + c y²

  - id: p5-a
    answer: p5-a
    where: 'Problem 5(a), answer box: root of the determinant 4c − 36'
    inputs: {}
    formula: solve('4*cc - 36', 'cc', 0, 20)
