# Calculations on content/year-2/18.06/18-06-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution where one exists: eigenvalues as numerical roots of the
# characteristic polynomial (solve), determinants by the rule of Sarrus instead of cofactors, pivots as ratios of
# upper-left determinants, matrix powers by direct multiplication.
# All values were also recomputed with NumPy and SymPy (numpy.linalg.eigvalsh, sympy elimination) when the page was written.

page: content/year-2/18.06/18-06-problem-set-9.mdx
calcs:
  - id: intro-points
    where: 'How to answer: the points of the seven problems (14 + 12 + 16 + 16 + 14 + 14 + 14)'
    inputs: {}
    formula: 14 + 12 + 16 + 16 + 14 + 14 + 14
    expected: '100'
    shown: ['the points here (100 in all)']
    source: {cite: mit, at: 'our own points'}
    origin: page-own

  - id: intro-example
    where: 'How to answer: the typing example 1/4 = 0.25'
    inputs: {}
    formula: 1/4
    expected: '0.25'
    tolerance: '1e-12'
    shown: ['write $0.25$, not $1/4$']
    source: {cite: mit, at: 'our own instructions'}
    origin: page-own

  - id: lecture-example
    where: 'What you need: Lecture 27 completing the square, 2(x + 3y)² + 2y² at (x, y) = (1, 1) against 2 + 12 + 20'
    inputs: {}
    formula: 2*(1 + 3)**2 + 2 - (2 + 12 + 20)
    expected: '0'
    tolerance: '1e-12'
    shown: ['2x^2 + 12xy + 20y^2 = 2(x + 3y)^2 + 2y^2']
    source: {cite: reading2, at: 'pp. 11–12'}
    origin: mit

  # ---- Problem 1  A = (5 4; 4 -1)

  - id: p1-a-big
    answer: p1-a-big
    where: 'Problem 1(a), answer box: larger root of λ² − 4λ − 21, found numerically'
    inputs: {}
    formula: solve('lam**2 - 4*lam - 21', 'lam', 2, 20)
    expected: '7'
    tolerance: '1e-9'
    shown: ['So the eigenvalues are $7$ and $-3$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-small
    answer: p1-a-small
    where: 'Problem 1(a), answer box: smaller root of λ² − 4λ − 21, found numerically'
    inputs: {}
    formula: solve('lam**2 - 4*lam - 21', 'lam', -20, 2)
    expected: '-3'
    tolerance: '1e-9'
    shown: ['\lambda^2 - 4\lambda - 21 = (\lambda - 7)(\lambda + 3) = 0']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-det
    where: 'Problem 1(a): det A = 5·(−1) − 4·4'
    inputs: {}
    formula: 5*(-1) - 4*4
    expected: '-21'
    shown: ['the determinant is $-5 - 16 = -21$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: p12 = (first component)(second component) of q1 = (2, 1)/√5'
    inputs: {}
    formula: (2/sqrt(5))*(1/sqrt(5))
    expected: '0.4'
    tolerance: '1e-9'
    shown: ['So $p_{12} = 2/5 = 0.4$.']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-eig
    where: 'Problem 1(b): (2, 1) is an eigenvector for 7: first row 5·2 + 4·1 − 7·2 and second row 4·2 − 1 − 7·1, squared and added'
    inputs: {}
    formula: (5*2 + 4*1 - 7*2)**2 + (4*2 - 1 - 7*1)**2 + (5*1 + 4*(-2) + 3*1)**2 + (4*1 + (-1)*(-2) + 3*(-2))**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['They are perpendicular, $2 - 2 = 0$. Both have length $\sqrt5$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-sum
    where: 'Problem 1(b): entries of 7P1 − 3P2 = ((28 − 3)/5, (14 + 6)/5; (7 − 12)/5): 5, 4, −1'
    inputs: {}
    formula: ((28 - 3)/5 - 5)**2 + ((14 + 6)/5 - 4)**2 + ((7 - 12)/5 + 1)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['7P_1 - 3P_2 = \frac15\begin{pmatrix} 28 - 3 & 14 + 6 \\ 14 + 6 & 7 - 12 \end{pmatrix}']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-check
    where: 'Problem 1(b), check: (1, 2) entry of P1² = (4·2 + 2·1)/25'
    inputs: {}
    formula: (4*2 + 2*1)/25
    expected: '0.4'
    tolerance: '1e-12'
    shown: ['\frac{1}{25}(4 \cdot 2 + 2 \cdot 1) = \frac{10}{25} = \frac25']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-c
    answer: p1-c
    where: 'Problem 1(c), answer box: (A³)12 by direct multiplication, A² = (41 16; 16 17), row 1 of A² times column 2 of A'
    inputs: {}
    formula: (5*5 + 4*4)*4 + (5*4 + 4*(-1))*(-1)
    expected: '148'
    tolerance: '1e-9'
    shown: ['$41 \cdot 4 + 16 \cdot (-1) = 148$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-spectral
    where: 'Problem 1(c): 343·(2/5) + (−27)(−2/5), with the two terms'
    inputs: {}
    formula: 7**3*2/5 + (-3)**3*(-2/5)
    expected: '148'
    tolerance: '1e-9'
    shown: ['343 \cdot \tfrac25 + (-27)\cdot\left(-\tfrac25\right) = 137.2 + 10.8 = 148']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-terms
    where: 'Problem 1(c): the two terms 343·0.4 = 137.2 and 27·0.4 = 10.8 (difference checked)'
    inputs: {}
    formula: (343*0.4 - 137.2)**2 + (27*0.4 - 10.8)**2
    expected: '0'
    tolerance: '1e-9'
    shown: ['137.2 + 10.8 = 148']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-A2
    where: 'Problem 1(c), check: A² entries 25 + 16 = 41, 20 − 4 = 16, 16 + 1 = 17'
    inputs: {}
    formula: (5*5 + 4*4 - 41)**2 + (5*4 + 4*(-1) - 16)**2 + (4*4 + (-1)*(-1) - 17)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$A^2 = \begin{pmatrix} 41 & 16 \\ 16 & 17 \end{pmatrix}$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-d-pivot
    answer: p1-d-pivot
    where: 'Problem 1(d), answer box: second pivot = det A / first pivot'
    inputs: {}
    formula: (5*(-1) - 4*4)/5
    expected: '-4.2'
    tolerance: '1e-9'
    shown: ['-\frac{21}{5} = -4.2$']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1-d-elim
    where: 'Problem 1(d): −1 − (4/5)·4 = −1 − 16/5'
    inputs: {}
    formula: -1 - (4/5)*4
    expected: '-4.2'
    tolerance: '1e-12'
    shown: ['$-1 - \frac45 \cdot 4 = -1 - \frac{16}{5}']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1-d-check
    where: 'Problem 1(d), check: 5·(−4.2) = −21 = 7·(−3)'
    inputs: {}
    formula: 5*(-4.2) - 7*(-3)
    expected: '0'
    tolerance: '1e-12'
    shown: ['$5 \cdot (-4.2) = -21 = \det A = 7 \cdot (-3)$']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-a
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box: Δ against (larger root − smaller root)² of λ² − (a + c)λ + (ac − b²), roots found numerically'
    formula: (a - c)**2 + 4*b**2
    equals: (solve('lam**2 - (a + c)*lam + (a*c - b**2)', 'lam', (a + c)/2, (a + c)/2 + 20) - solve('lam**2 - (a + c)*lam + (a*c - b**2)', 'lam', (a + c)/2 - 20, (a + c)/2))**2
    samples: {a: [-3, -1, 0, 2, 3], b: [0.5, 1, 2, 3, 0.7], c: [3, -2, 1, -3, 0]}
    tolerance: 1e-6
    shown: ['= (a - c)^2 + 4b^2']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-b-check
    where: 'Problem 2(b), check: Δ for (0 1; −1 0), trace 0 and determinant 1'
    inputs: {}
    formula: 0**2 - 4*(0*0 - 1*(-1))
    expected: '-4'
    shown: ['so $\Delta = -4 < 0$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-d
    answer: p2-d
    where: 'Problem 2(d), answer box: |cos θ| for u = (2, 1), v = (2, −1)'
    inputs: {}
    formula: abs(2*2 + 1*(-1))/(sqrt(2**2 + 1**2)*sqrt(2**2 + (-1)**2))
    expected: '0.6'
    tolerance: '1e-9'
    shown: ['\frac{4 - 1}{\sqrt5\,\sqrt5} = \frac35 = 0.6']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-d-eig
    where: 'Problem 2(d): eigenvalues of B as roots of λ² − 2λ − 3, product checked as det B = 1 − 4'
    inputs: {}
    formula: solve('lam**2 - 2*lam - 3', 'lam', 1, 10) * solve('lam**2 - 2*lam - 3', 'lam', -10, 1)
    expected: '-3'
    tolerance: '1e-9'
    shown: ['$\lambda^2 - 2\lambda - 3 = (\lambda - 3)(\lambda + 1)$, real eigenvalues $3$ and $-1$']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2-d-angle
    where: 'Problem 2(d): the angle arccos 0.6 in degrees, about 53'
    inputs: {}
    formula: acos(0.6)*180/pi
    expected: '53'
    shown: ['The angle is about $53°$, not $90°$.']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # ---- Problem 3  S = (2 4 -2; 4 5 1; -2 1 3)

  - id: p3-a-2
    answer: p3-a-2
    where: 'Problem 3(a), answer box: second pivot = (2×2 upper-left determinant)/(first pivot)'
    inputs: {}
    formula: (2*5 - 4*4)/2
    expected: '-3'
    tolerance: '1e-9'
    shown: ['The second pivot is $-3$.']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-3
    answer: p3-a-3
    where: 'Problem 3(a), answer box: third pivot = det S (Sarrus) / (2×2 upper-left determinant)'
    inputs: {}
    formula: (2*5*3 + 4*1*(-2) + (-2)*4*1 - (-2)*5*(-2) - 2*1*1 - 4*4*3)/(2*5 - 4*4)
    expected: '9.3333'
    tolerance: '0.0001'
    shown: ['1 + \tfrac{25}{3} = \tfrac{28}{3} \approx 9.33']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-b-count
    answer: p3-b-count
    where: 'Problem 3(b), answer box: number of positive roots of λ³ − 10λ² + 10λ + 56, as (3 + sum of the signs of the three roots)/2, one root found in each bracket'
    inputs: {}
    formula: (3 + (solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 0, 5))/abs(solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 0, 5)) + (solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 5, 10))/abs(solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 5, 10)) + (solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', -10, 0))/abs(solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', -10, 0)))/2
    expected: '2'
    tolerance: '1e-9'
    shown: ['so two eigenvalues are positive and one is negative']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: p3-b-prod
    answer: p3-b-prod
    where: 'Problem 3(b), answer box: det S by the rule of Sarrus'
    inputs: {}
    formula: 2*5*3 + 4*1*(-2) + (-2)*4*1 - (-2)*5*(-2) - 2*1*1 - 4*4*3
    expected: '-56'
    tolerance: '1e-9'
    shown: ['\det S = 2 \cdot (-3) \cdot \tfrac{28}{3} = -56']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-check
    where: 'Problem 3(b), check: cofactors along row 1, 2(15 − 1) − 4(12 + 2) − 2(4 + 10)'
    inputs: {}
    formula: 2*(15 - 1) - 4*(12 + 2) + (-2)*(4 + 10)
    expected: '-56'
    shown: ['$2(15 - 1) - 4(12 + 2) + (-2)(4 + 10) = 28 - 56 - 28 = -56$']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: roots of the characteristic polynomial above 3, as (3 + sum of the signs of root − 3)/2'
    inputs: {}
    formula: (3 + (solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 0, 5) - 3)/abs(solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 0, 5) - 3) + (solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 5, 10) - 3)/abs(solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', 5, 10) - 3) + (solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', -10, 0) - 3)/abs(solve('lam**3 - 10*lam**2 + 10*lam + 56', 'lam', -10, 0) - 3))/2
    expected: '2'
    tolerance: '1e-9'
    shown: ['and $S$ has two eigenvalues greater than $3$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: p3-c-pivots
    where: 'Problem 3(c): pivots of S − 3I: second 2 − 4·(−4) = 18, third 4 − 49/18 = 23/18 (as 0 − 2·(−2) − (−7)²/18)'
    inputs: {}
    formula: (2 + 4*4 - 18)**2 + ((0 - 2*(-2)) - (-7)**2/18 - 23/18)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['The second pivot is $18$, and the third is $4 - \frac{49}{18} = \frac{23}{18}$.']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-c-check
    where: 'Problem 3(c), check: det(S − 3I) by Sarrus against −1·18·23/18 = −23 and the cofactor sum 1 − 8 − 16'
    inputs: {}
    formula: (-1)*2*0 + 4*1*(-2) + (-2)*4*1 - (-2)*2*(-2) - (-1)*1*1 - 4*4*0
    expected: '-23'
    shown: ['$-1(0 - 1) - 4(0 + 2) + (-2)(4 + 4) = 1 - 8 - 16 = -23$']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  - id: p3-d-pivots
    where: 'Problem 3(d), statement: pivots of S + 2I are 4, 3, 1: as ratios of its upper-left determinants 4, 4·7 − 16 = 12, and det(S + 2I) = 12 (Sarrus), sum of squared differences'
    inputs: {}
    formula: (4*7 - 16)/4 - 3 + ((4*7*5 + 4*1*(-2) + (-2)*4*1 - (-2)*7*(-2) - 4*1*1 - 4*4*5)/(4*7 - 16) - 1)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['Elimination on $S + 2I$ gives the pivots $4$, $3$ and $1$.']
    source: {cite: mit, at: 'Problem 3(d) (our own problem)'}
    origin: page-own

  - id: p3-d-E
    where: 'Problem 3(d): E = sum of the diagonal 2×2 determinants (10 − 16) + (6 − 4) + (15 − 1)'
    inputs: {}
    formula: (2*5 - 4*4) + (2*3 - (-2)*(-2)) + (5*3 - 1*1)
    expected: '10'
    shown: ['$E = (10 - 16) + (6 - 4) + (15 - 1) = 10$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-root4
    where: 'Problem 3(d): λ = 4 is a root of λ³ − 10λ² + 10λ + 56, and the factor λ² − 6λ − 14 has roots 3 ± √23'
    inputs: {}
    formula: (4**3 - 10*4**2 + 10*4 + 56)**2 + ((3 + sqrt(23))**2 - 6*(3 + sqrt(23)) - 14)**2
    expected: '0'
    tolerance: '1e-9'
    shown: ['(\lambda - 4)(\lambda^2 - 6\lambda - 14) = 0, \qquad \lambda = 4,\ 3 \pm \sqrt{23}']
