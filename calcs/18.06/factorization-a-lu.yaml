# Calculations on content/year-2/18.06/factorization-a-lu.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 4 transcript, with the page's own example.

page: content/year-2/18.06/factorization-a-lu.mdx
calcs:
  - id: second-pivot-2x2
    where: 'E21 A: row 2 of A minus 4 times row 1, entry (2, 2): 7 − 4·1 = 3'
    inputs: {}
    formula: 7 - 4*1
    expected: '3'
    shown: ['with first pivot 2 and multiplier 4']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: forward-product-10
    where: 'entry (3, 1) of E32 E21: (−5)(−2) = 10'
    inputs: {}
    formula: (-5)*(-2)
    expected: '10'
    shown: ['(a 10 from multipliers 2 and 5)']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: mit

  - id: op-count
    where: 'sum of squares 1² + … + n² over n³/3 tends to 1 (n = 1000)'
    inputs: {}
    formula: (1000*1001*2001/6) / (1000**3/3)
    expected: '1.0015'
    tolerance: 0.001
    shown: ['Elimination costs about $\frac13n^3$ operations; each']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: mit

  - id: perms-3
    where: 'number of 3 × 3 permutation matrices: 3! = 6'
    inputs: {}
    formula: 3*2*1
    expected: '6'
    shown: ['For $3 \times 3$ there are six']
    source: {cite: reading1, at: 'pp. 20–22'}
    origin: mit

  - id: perms-4
    where: 'number of 4 × 4 permutation matrices: 4! = 24'
    inputs: {}
    formula: 4*3*2*1
    expected: '24'
    shown: ['$4! = 24$']
    source: {cite: reading1, at: 'p. 23'}
    origin: mit

  - id: ex-row2
    where: 'example (a): row 2 minus 2 times row 1: (6, 4, 5) − 2(3, 1, 2) = (0, 2, 1); entry 4 − 2 = 2'
    inputs: {}
    formula: 4 - 2*1
    expected: '2'
    shown: ['row 2 becomes $(0, 2, 1)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-row3
    where: 'example (a): row 3 plus row 1: (−3, 3, 4) + (3, 1, 2) = (0, 4, 6); entry 4 + 2 = 6'
    inputs: {}
    formula: 4 + 2
    expected: '6'
    shown: ['row 3 becomes $(0, 4, 6)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-pivot3
    where: 'example (a): (0, 4, 6) − 2(0, 2, 1): third pivot 6 − 2 = 4'
    inputs: {}
    formula: 6 - 2*1
    expected: '4'
    shown: ['row 3 becomes $(0, 0, 4)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-det
    where: 'example (a): det by cofactors equals the product of pivots 3·2·4'
    inputs: {}
    formula: 3*(4*4 - 5*3) - 1*(6*4 - 5*(-3)) + 2*(6*3 - 4*(-3))
    expected: '24'
    shown: ['$3\cdot2\cdot4 = 24$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-cost
    where: 'example (b): n³/3 for n = 1000'
    inputs: {}
    formula: 1000**3/3
    expected: '3.3e8'
    tolerance: 5e6
    shown: ['$\frac13(1000)^3 \approx 3.3 \times 10^8$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: page-own
