calcs:
  - id: second-row
    where: 'row 2 minus 3 times row 1: 8 − 6 = 2'
    inputs: {}
    formula: 8 - 3*2
    expected: '2'
    shown: ['leaves $(0, 2, -2)$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: third-pivot
    where: 'row 3 minus 2 times new row 2: 1 − 2(−2) = 5'
    inputs: {}
    formula: 1 - 2*(-2)
    expected: '5'
    shown: ['the **third pivot**, 5']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: determinant
    where: 'product of pivots 1·2·5 equals det A by cofactors: 1(8 − 4) − 2(3 − 0) + 1(12 − 0)'
    inputs: {}
    formula: 1*(8*1 - 1*4) - 2*(3*1 - 1*0) + 1*(3*4 - 8*0)
    expected: '10'
    shown: ['their product is the **determinant**, 10']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: c-third
    where: 'right side: 2 − 2·6 = −10'
    inputs: {}
    formula: 2 - 2*6
    expected: '-10'
    shown: ['$c = (2, 6, -10)$']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: solution-check
    where: 'x = 2, y = 1, z = −2 in the second original equation: 6 + 8 − 2'
    inputs: {}
    formula: 3*2 + 8*1 + (-2)
    expected: '12'
    shown: ['gives $x = 2$ (p. 9)']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: entry-check
    where: 'row 2 of E21 times column 3 of A: −3·1 + 1·1 + 0·1'
    inputs: {}
    formula: -3*1 + 1*1 + 0*1
    expected: '-2'
    shown: ['gives $-3 + 1 + 0 = -2$']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: ex-det
    where: 'example: det by cofactors equals the product of pivots 1·3·7'
    inputs: {}
    formula: 1*(5*4 - 3*2) - 1*(2*4 - 3*(-1)) + 2*(2*2 - 5*(-1))
    expected: '21'
    shown: ['so the determinant is 21']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-check
    where: 'example: third equation −1 + 2 + 4 = 5 at (1, 1, 1)'
    inputs: {}
