# Calculations on content/year-2/18.06/similar-matrices-jordan-form.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 28 transcript, with the page's own example.

page: content/year-2/18.06/similar-matrices-jordan-form.mdx
calcs:
  - id: b-11
    where: 'M⁻¹AM entry (1, 1): row (1, −4) of M⁻¹ times column (2, 1) of AM'
    inputs: {}
    formula: 1*2 + (-4)*1
    expected: '-2'
    shown: ['= \begin{pmatrix} -2 & -15 \\ 1 & 6 \end{pmatrix} = B']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: b-12
    where: 'entry (1, 2): AM column 2 = A(4, 1) = (9, 6); (1, −4)·(9, 6) = 9 − 24'
    inputs: {}
    formula: 1*(2*4 + 1*1) + (-4)*(1*4 + 2*1)
    expected: '-15'
    shown: ['= \begin{pmatrix} -2 & -15 \\ 1 & 6 \end{pmatrix} = B']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: b-22
    where: 'entry (2, 2): (0, 1)·(9, 6)'
    inputs: {}
    formula: 0*9 + 1*(1*4 + 2*1)
    expected: '6'
    shown: ['= \begin{pmatrix} -2 & -15 \\ 1 & 6 \end{pmatrix} = B']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: b-det
    where: 'det B = (−2)(6) − (−15)(1)'
    inputs: {}
    formula: (-2)*6 - (-15)*1
    expected: '3'
    shown: ['its determinant $-12 + 15 = 3$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: b-trace
    where: 'trace B = −2 + 6'
    inputs: {}
    formula: -2 + 6
    expected: '4'
    shown: ['its trace is $-2 + 6 = 4$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: member-1
    where: '(5 1; −1 3): trace 8, det 15 + 1 = 16'
    inputs: {}
    formula: (5*3 - 1*(-1)) + (5 + 3)
    expected: '24'
    shown: ['\begin{pmatrix} 5 & 1 \\ -1 & 3 \end{pmatrix}, \qquad']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: member-2
    where: '(4 0; 17 4): det 16 − 0'
    inputs: {}
    formula: 4*4 - 0*17
    expected: '16'
    shown: ['\begin{pmatrix} 4 & 0 \\ 17 & 4 \end{pmatrix}" cite']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: nullity
    where: '4 × 4 matrices of rank 2: nullspace dimension 4 − 2'
    inputs: {}
    formula: 4 - 2
    expected: '2'
    shown: ['has dimension $4 - 2 = 2$']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: ex-am
    where: 'example: AM column 2 = A(1, 1) = (5 + 2, 1 + 4) = (7, 5)'
    inputs: {}
    formula: (5*1 + 2*1)*10 + (1*1 + 4*1)
    expected: '75'
    shown: ['$AM = \begin{pmatrix} 5 & 7 \\ 1 & 5 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-b
    where: 'example: B = M⁻¹AM, first row (5 − 1, 7 − 5) = (4, 2)'
    inputs: {}
    formula: (5 - 1)*10 + (7 - 5)
    expected: '42'
    shown: ['so $B = \begin{pmatrix} 4 & 2 \\ 1 & 5 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-dets
    where: 'example: det A = 20 − 2 and det B = 20 − 2'
    inputs: {}
    formula: (5*4 - 2*1) + (4*5 - 2*1)
    expected: '36'
    shown: ['Both have trace 9 and determinant 18']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-eigs
    kind: identity
    where: 'example: λ² − 9λ + 18 = (λ − 6)(λ − 3)'
    formula: l**2 - 9*l + 18
    equals: (l - 6)*(l - 3)
    samples: {l: [0.0, 2.0, 7.0]}
    tolerance: 1e-12
    shown: ['so eigenvalues 6 and 3']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: ex-eigvec
    where: 'example: B(1, 1) = (4 + 2, 1 + 5) = 6(1, 1): first component'
    inputs: {}
    formula: 4*1 + 2*1
    expected: '6'
    shown: ['and indeed $B(1, 1) = (6, 6)$']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-c-det
    where: 'example (b): det C = 24 + 1'
    inputs: {}
    formula: 6*4 - 1*(-1)
    expected: '25'
    shown: ['determinant $24 + 1 = 25$']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own

  - id: ex-ata-11
    where: 'example (c): 1 + 4 + 9'
    inputs: {}
    formula: 1**2 + 2**2 + 3**2
    expected: '14'
    shown: ['\begin{pmatrix} 14 & 13 \\ 13 & 21 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-ata-12
    where: 'example (c): (1, 2, 3)·(2, 4, 1)'
    inputs: {}
    formula: 1*2 + 2*4 + 3*1
    expected: '13'
    shown: ['\begin{pmatrix} 14 & 13 \\ 13 & 21 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-ata-det
    where: 'example (c): 14·21 − 13²'
    inputs: {}
    formula: 14*21 - 13**2
    expected: '125'
    shown: ['determinant $294 - 169 = 125 > 0$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-ata-22
    where: 'example (c): (2, 4, 1)·(2, 4, 1)'
    inputs: {}
    formula: 2**2 + 4**2 + 1**2
    expected: '21'
    shown: ['\begin{pmatrix} 14 & 13 \\ 13 & 21 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-b-row2
    where: 'example: B second row = (0, 1)·AM = (1, 5)'
    inputs: {}
    formula: 0*5 + 1*1 + (0*7 + 1*5)*10
    expected: '51'
    shown: ['so $B = \begin{pmatrix} 4 & 2 \\ 1 & 5 \end{pmatrix}$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-minv-x
    where: 'example: M⁻¹(2, 1) = (2 − 1, 1): first component'
    inputs: {}
    formula: 1*2 + (-1)*1
    expected: '1'
    shown: ['then $M^{-1}x = (1, 1)$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: ex-c-trace
    where: 'example (b): trace C = 6 + 4'
    inputs: {}
    formula: 6 + 4
    expected: '10'
    shown: ['$C$ has trace 10']
    source: {cite: reading1, at: 'p. 16'}
    origin: page-own
