# Calculations on content/year-2/18.06/solving-ax-0-special-solutions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 7 transcript, with the page's own example.

page: content/year-2/18.06/solving-ax-0-special-solutions.mdx
calcs:
  - id: special-1
    where: 'A(−2, 1, 0, 0) = 0: sum of squares of the rows −2+2, −4+4, −6+6'
    inputs: {}
    formula: (-2 + 2)**2 + (-4 + 4)**2 + (-6 + 6)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['then $x_3 = 0$ and $x_1 = -2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: special-2
    where: 'A(2, 0, −2, 1) = 0: rows 2−4+2, 4−12+8, 6−16+10'
    inputs: {}
    formula: (2 - 4 + 2)**2 + (4 - 12 + 8)**2 + (6 - 16 + 10)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['then $x_3 = -2$ and $x_1 = 2$']
    source: {cite: reading1, at: 'pp. 6–7'}
    origin: mit

  - id: free-count
    where: 'n − r = 4 − 2 free variables'
    inputs: {}
    formula: 4 - 2
    expected: '2'
    shown: ['Here $4 - 2 = 2$']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: transpose-null
    where: 'Aᵀ(−1, −1, 1) = 0: rows −1−2+3, −2−4+6, −2−6+8, −2−8+10'
    inputs: {}
    formula: (-1 - 2 + 3)**2 + (-2 - 4 + 6)**2 + (-2 - 6 + 8)**2 + (-2 - 8 + 10)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['gives $x_1 = -1$']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: transpose-free
    where: 'one free column for the transpose: 3 − 2'
    inputs: {}
    formula: 3 - 2
    expected: '1'
    shown: ['There is $3 - 2 = 1$ free column']
    source: {cite: reading1, at: 'p. 16'}
    origin: mit

  - id: ex-special-1
    where: 'example: B(−3, 1, 0, 0) = 0, rows −3+3, −6+6, −3+3'
    inputs: {}
    formula: (-3 + 3)**2 + (-6 + 6)**2 + (-3 + 3)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['giving $(-3, 1, 0, 0)$']
    source: {cite: reading1, at: 'pp. 4–7'}
    origin: page-own

  - id: ex-special-2
    where: 'example: B(−2, 0, −3, 1) = 0, rows −2+0+0+2, −4+0−3+7, −2+0−6+8'
    inputs: {}
    formula: (-2 + 0 + 0 + 2)**2 + (-4 + 0 - 3 + 7)**2 + (-2 + 0 - 6 + 8)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$-2 + 0 - 6 + 8 = 0$']
    source: {cite: reading1, at: 'pp. 4–7'}
    origin: page-own

  - id: ex-count
    where: '3 × 5 matrix: at least 5 − 3 free variables'
    inputs: {}
    formula: 5 - 3
    expected: '2'
    shown: ['at least $5 - 3 = 2$ free variables']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own
