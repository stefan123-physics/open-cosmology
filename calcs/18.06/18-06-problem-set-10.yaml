  - id: p2-a-y1im
    answer: p2-a-y1im
    where: 'Problem 2(a), answer box: imaginary part of row 1 times x, 0·1 + 1·2 + 0·0 + (−1)·(−1)'
    inputs: {}
    formula: 0*1 + 1*2 + 0*0 + (-1)*(-1)
    expected: '3'
    shown: ['In row 1, the last term is $(-i)(-1) = +i$']
    source: {cite: reading1, at: 'pp. 11–12'}
