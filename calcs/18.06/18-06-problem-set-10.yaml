    inputs: {}
    formula: 1*1 + 0*2 + (-1)*0 + 0*(-1)
    expected: '1'
    shown: ['= \begin{pmatrix} 2 \\ 1 + 3i \\ 0 \\ 1 - 3i \end{pmatrix}" cite="reading1"']
    source: {cite: reading1, at: 'pp. 11–12'}
