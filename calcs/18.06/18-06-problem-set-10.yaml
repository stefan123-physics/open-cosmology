# Calculations on content/year-2/18.06/18-06-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution: complex products written out in real and imaginary
# parts, eigenvalues put back into the characteristic polynomial, the formula boxes against a numerical root of the
# characteristic polynomial (solve), and singular values through trace and determinant of AᵀA and through |det A|.
# All values were also recomputed with NumPy (numpy.linalg.eigvals, svd, matrix_rank) when the page was written.

page: content/year-2/18.06/18-06-problem-set-10.mdx
calcs:
  - id: intro-points
    where: 'How to answer: the points of the seven problems (14 + 16 + 12 + 14 + 16 + 16 + 12)'
    inputs: {}
    formula: 14 + 16 + 12 + 14 + 16 + 16 + 12
    expected: '100'
    shown: ['the points here (100 in all)']
    source: {cite: mit, at: 'our own points'}
    origin: page-own

  # ---- Problem 1

  - id: p1-a-len
    answer: p1-a-len
    where: 'Problem 1(a), answer box: |1 + 2i|² + |2 − i|²'
    inputs: {}
    formula: (1**2 + 2**2) + (2**2 + 1**2)
    expected: '10'
    shown: ['\|z\|^2 = z^Hz = 5 + 5 = 10']
    source: {cite: reading1, at: 'pp. 3–5'}
    origin: page-own

  - id: p1-a-re
    answer: p1-a-re
    where: 'Problem 1(a), answer box: real part of (−i)(1 + 2i) + (2 − i); (p + qi)(r + si) has real part pr − qs'
    inputs: {}
    formula: (0*1 - (-1)*2) + 2
    expected: '4'
    shown: ['(-i + 2) + (2 - i) = 4 - 2i']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: p1-a-im
    answer: p1-a-im
    where: 'Problem 1(a), answer box: imaginary part of (−i)(1 + 2i) + (2 − i); imaginary part ps + qr'
    inputs: {}
    formula: (0*2 + (-1)*1) + (-1)
    expected: '-2'
    shown: ['The real part is $4$, the imaginary part $-2$.']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: p1-a-yTz
    where: 'Problem 1(a), check: y^T z = i(1 + 2i) + (2 − i), real part (0·1 − 1·2) + 2 and imaginary part (0·2 + 1·1) − 1, squared and added'
    inputs: {}
    formula: ((0*1 - 1*2) + 2)**2 + ((0*2 + 1*1) - 1)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['y^Tz = i(1 + 2i) + (2 - i) = (i - 2) + (2 - i) = 0']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b-big
    kind: identity
    answer: p1-b-big
    where: 'Problem 1(b), answer box: the larger eigenvalue against a numerical root of λ² − (a + 2)λ + (2a − 2), searched above the midpoint (a + 2)/2'
    formula: (a + 2 + sqrt((a - 2)**2 + 8))/2
    equals: solve('lam**2 - (a + 2)*lam + (2*a - 2)', 'lam', (a + 2)/2 + 0.5, 20)
    samples: {a: [-3, -1, 0.5, 3, 6]}
    tolerance: 1e-6
    shown: ['\frac{a + 2 \pm \sqrt{(a - 2)^2 + 8}}{2}" cite']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-det
    where: 'Problem 1(b): the off-diagonal product (1 − i)(1 + i) = 1·1 − (−1)(1) (real part; the imaginary part 1·1 + (−1)·1 is 0)'
    inputs: {}
    formula: 1*1 - (-1)*1
    expected: '2'
    shown: ['the determinant is $2a - (1 - i)(1 + i) = 2a - 2$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-small
    answer: p1-b-small
    where: 'Problem 1(b), answer box: the smaller eigenvalue for a = 3, (5 − √9)/2'
    inputs: {}
    formula: (3 + 2 - sqrt((3 - 2)**2 + 8))/2
    expected: '1'
    shown: ['$(5 \pm \sqrt{1 + 8})/2 = (5 \pm 3)/2$, so the eigenvalues are $4$ and $1$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-small-check
    where: 'Problem 1(b), check: λ = 1 is a root of λ² − 5λ + 4 (a = 3)'
    inputs: {}
    formula: 1**2 - 5*1 + 4
    expected: '0'
    tolerance: '1e-12'
    shown: ['$4 \cdot 1 = 4 = 2 \cdot 3 - 2$ is the determinant']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-pd
    where: 'Problem 1(b), choice box (a > 1): the determinant 2a − 2 vanishes at a = 1'
    inputs: {}
    formula: solve('2*a - 2', 'a', 0, 3)
    expected: '1'
    tolerance: '1e-9'
    shown: ['So $A$ is positive definite exactly for $a > 1$.']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-check
    where: 'Problem 1(b), check: det(A − 4I) for a = 3, (−1)(−2) − (1 − i)(1 + i)'
    inputs: {}
    formula: (-1)*(-2) - 2
    expected: '0'
    tolerance: '1e-12'
    shown: ['has determinant $2 - 2 = 0$, as it should']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-c-check
    where: 'Problem 1(c), check: x^H A x for A = (0 1; −1 0), x = (1, i): Ax = (i, −1), so 1·i + (−i)(−1), imaginary part'
    inputs: {}
    formula: 1 + 1
    expected: '2'
    shown: ['its $x^HAx$ for $x = (1, i)$ is $2i$, not real']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  # ---- Problem 2  (rows of F4: (1,1,1,1), (1,i,−1,−i), (1,−1,1,−1), (1,−i,−1,i); x = (1, 2, 0, −1))

  - id: p2-a-y0
    answer: p2-a-y0
    where: 'Problem 2(a), answer box: row 0 of F4 times x'
    inputs: {}
    formula: 1 + 2 + 0 - 1
    expected: '2'
