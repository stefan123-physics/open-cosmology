  - id: p2-a-y3im
    answer: p2-a-y3im
    where: 'Problem 2(a), answer box: imaginary part of row 3 times x, 0·1 + (−1)·2 + 0·0 + 1·(−1)'
    inputs: {}
    formula: 0*1 + (-1)*2 + 0*0 + 1*(-1)
    expected: '-3'
    shown: ['in row 3 it is $i \cdot (-1) = -i$']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: |y|² = 2² + (1² + 3²) + 0² + (1² + 3²), checked against 4·|x|²'
    inputs: {}
    formula: 4*(1**2 + 2**2 + 0**2 + (-1)**2)
    expected: '24'
    shown: ['4 + 10 + 0 + 10 = 24']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: p2-b-x
    where: 'Problem 2(b): |x|² and the ratio'
    inputs: {}
    formula: 1 + 4 + 0 + 1
    expected: '6'
    shown: ['$\|x\|^2 = 1 + 4 + 0 + 1 = 6$, and $24 = 4 \cdot 6$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-c
    where: 'Problem 2(c), choice box x = (1, 0, −1, 0): forward check, the four components of F4 x minus (0, 2, 0, 2), squared and added (rows of F4 times (1, 0, −1, 0): 1 − 1, 1 + 1, 1 − 1, 1 + 1)'
    inputs: {}
    formula: (1 - 1 - 0)**2 + (1 + 1 - 2)**2 + (1 - 1 - 0)**2 + (1 + 1 - 2)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$(1, 1, 1, 1) - (1, -1, 1, -1) = (0, 2, 0, 2)$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: p2-c-len
    where: 'Problem 2(c), check: |(0, 2, 0, 2)|² = 4·|(1, 0, −1, 0)|²'
    inputs: {}
    formula: 4*(1 + 0 + 1 + 0)
    expected: '8'
    shown: ['$\|(0, 2, 0, 2)\|^2 = 8 = 4 \cdot 2$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

