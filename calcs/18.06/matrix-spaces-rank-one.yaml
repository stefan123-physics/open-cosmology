# Calculations on content/year-2/18.06/matrix-spaces-rank-one.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 11 transcript, with the page's own example.

page: content/year-2/18.06/matrix-spaces-rank-one.mdx
calcs:
  - id: dim-sym
    where: 'symmetric 3 × 3: 3 diagonal + 3 above the diagonal'
    inputs: {}
    formula: 3 + 3
    expected: '6'
    shown: ['\text{dim}\, S = 6']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: dim-formula
    where: 'dim S + dim U = dim(S ∩ U) + dim(S + U): both sides'
    inputs: {}
    formula: (6 + 6) - (3 + 9)
    expected: '0'
    tolerance: 1e-12
    shown: ['qquad 6 + 6 = 3 + 9']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: ode-cos
    where: 'y = cos x solves y″ + y = 0: −cos x + cos x at x = 0.7'
    kind: identity
    formula: -cos(x) + cos(x)
    equals: 0*x
    samples: {x: [0.7, 2.0]}
    tolerance: 1e-12
    shown: ['y = c_1\cos x + c_2\sin x']
    source: {cite: reading1, at: 'pp. 7–8'}
    origin: mit

  - id: rank-one
    where: '(1, 2)(1, 4, 5) gives second row (2, 8, 10); last entry'
    inputs: {}
    formula: 2*5
    expected: '10'
    shown: ['second row $(2, 8, 10)$']
    source: {cite: reading1, at: 'pp. 10–11'}
    origin: mit

  - id: dim-S4
    where: 'dim N(A) = n − r = 4 − 1 for A = (1 1 1 1)'
    inputs: {}
    formula: 4 - 1
    expected: '3'
    shown: ['$\text{dim}\, S = n - r = 4 - 1 = 3$']
    source: {cite: reading1, at: 'pp. 14–15'}
    origin: mit

  - id: ex-sum-dim
    where: 'example: dim(T + S) = 3 + 3 − 2'
    inputs: {}
    formula: 3 + 3 - 2
    expected: '4'
    shown: ['$\text{dim}(T + S) = 3 + 3 - 2 = 4$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-rank-one
    where: 'example: u vᵀ with u = (1, −2, 3), v = (2, −1, 3); squared differences from the matrix rows'
    inputs: {}
    formula: (1*2-2)**2 + (1*(-1)+1)**2 + (1*3-3)**2 + (-2*2+4)**2 + (-2*(-1)-2)**2 + (-2*3+6)**2 + (3*2-6)**2 + (3*(-1)+3)**2 + (3*3-9)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$u = (1, -2, 3)$ and $v = (2, -1, 3)$']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own
