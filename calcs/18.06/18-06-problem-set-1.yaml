# Calculations on content/year-2/18.06/18-06-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution where one exists: 2 × 2 systems by Cramer's rule
# (ratios of 2 × 2 cross products), 3 × 3 solutions by putting them back into every equation, elimination entries
# by multiplying the elimination matrices back, the singular parameters as roots of the last pivot (solve), and
# matrix products entry by entry as sums over k. All values were also recomputed with NumPy (numpy.linalg.solve,
# det, matrix products of the elimination, permutation and block matrices) when the page was written.

page: content/year-2/18.06/18-06-problem-set-1.mdx
calcs:
  - id: intro-points
    where: 'How to answer: the points of the six problems (16 + 14 + 20 + 16 + 18 + 16)'
    inputs: {}
    formula: 16 + 14 + 20 + 16 + 18 + 16
    expected: '100'
    shown: ['The points here (100 in all)']
    source: {cite: mit, at: 'our own points'}
    origin: page-own

  - id: need-columns
    where: 'What you need: (2 5; 1 3)(1, 2) by columns, first component 1·2 + 2·5 and second 1·1 + 2·3, as 100·first + second'
    inputs: {}
    formula: 100*(1*2 + 2*5) + (1*1 + 2*3)
    expected: '1207'
    shown: ['2\begin{pmatrix} 5 \\ 3 \end{pmatrix} = \begin{pmatrix} 12 \\ 7 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  # ---- Problem 1: 2x + 3y = 4, x − y = −3

  - id: p1-a-x
    answer: p1-a-x
    where: 'Problem 1(a), answer box: x by Cramer''s rule, (4·(−1) − 3·(−3)) / (2·(−1) − 3·1)'
    inputs: {}
    formula: (4*(-1) - 3*(-3))/(2*(-1) - 3*1)
    expected: '-1'
    shown: ['$2x + 6 = 4$ gives $x = -1$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-y
    answer: p1-a-y
    where: 'Problem 1(a), answer box: y by Cramer''s rule, (2·(−3) − 4·1) / (2·(−1) − 3·1)'
    inputs: {}
    formula: (2*(-3) - 4*1)/(2*(-1) - 3*1)
    expected: '2'
    shown: ['so $-\frac52y = -5$ and $y = 2$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-check
    where: 'Problem 1(a), check: the residuals of both equations at (−1, 2), squared and added'
    inputs: {}
    formula: (2*(-1) + 3*2 - 4)**2 + ((-1) - 2 + 3)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$2(-1) + 3(2) = 4$ and $-1 - 2 = -3$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b-1
    answer: p1-b-1
    where: 'Problem 1(b), answer box: row 1 (2, 3) times (2, 1)'
    inputs: {}
    formula: 2*2 + 3*1
    expected: '7'
    shown: ['$(2, 3)\cdot(2, 1) = 7$']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: p1-b-2
    answer: p1-b-2
    where: 'Problem 1(b), answer box: row 2 (1, −1) times (2, 1)'
    inputs: {}
    formula: 1*2 + (-1)*1
    expected: '1'
    shown: ['$(1, -1)\cdot(2, 1) = 1$']
    source: {cite: reading1, at: 'p. 19'}
    origin: page-own

  - id: p1-c-a
    answer: p1-c-a
    where: 'Problem 1(c), answer box: the a that makes the cross product 2a − 3·1 of the columns (2, 1) and (3, a) zero'
    inputs: {}
    formula: solve('2*aa - 3*1', 'aa', 0, 5)
    expected: '1.5'
    tolerance: '1e-9'
    shown: ['$a = \frac32 = 1.5$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-pic
    where: 'Problem 1(c), choice box (parallel lines): for a = 1.5 the second equation times 2 has right side −6, not 4'
    inputs: {}
    formula: 2*(-3)
    expected: '-6'
    shown: ['Twice the second is $2x + 3y = -6$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-d
    kind: identity
    answer: p1-d
    where: 'Problem 1(d), answer box: y against a numerical root of the substituted second equation (4 − 3y)/2 + a·y = −3 (x from the first equation)'
    formula: -10/(2*a - 3)
    equals: solve('(4 - 3*yy)/2 + a*yy + 3', 'yy', 0.5, 50)
    samples: {a: [-1, -0.5, 0, 0.5, 1]}
    tolerance: 1e-6
    shown: ['y = \frac{-5}{a - \frac32} = -\frac{10}{2a - 3}']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1-d-check
    where: 'Problem 1(d), check: the formula at a = −1 gives the y of part (a)'
    inputs: {}
    formula: -10/(2*(-1) - 3)
    expected: '2'
    shown: ['For $a = -1$: $y = -10/(-5) = 2$']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1-d-mistake1
    where: 'Problem 1(d), listed mistake −2/(2a − 3): at a = −1 it gives 0.4, not 2 (it differs from the answer by 8/(2a − 3), never zero)'
    inputs: {}
    formula: -2/(2*(-1) - 3)
    expected: '0.4'
    shown: ['the new right side is −3 − ½ · 4 = −5, not −1']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1-d-mistake2
    where: 'Problem 1(d), listed mistake 10/(2a − 3): at a = −1 it gives −2'
    inputs: {}
    formula: 10/(2*(-1) - 3)
    expected: '-2'
    shown: ['for a = −1 this gives y = −2']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  # ---- Problem 2: columns (1, 0, 1), (2, 1, 0), (0, 1, 3)

  - id: p2-a-1
