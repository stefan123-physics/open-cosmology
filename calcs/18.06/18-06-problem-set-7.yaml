# Calculations on content/year-2/18.06/18-06-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution where one exists: 3 × 3 determinants by the rule of Sarrus
# instead of cofactors, an inverse entry by Cramer's rule, eigenvalues as numerical roots (solve), an eigenvector by a
# cross product, a matrix power by repeated multiplication, closed forms by the recurrence they must satisfy.
# All values were also recomputed with NumPy and SymPy (numpy.linalg.eigvals, sympy det, cofactor, adjugate) when the page was written.

