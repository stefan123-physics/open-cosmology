# Calculations on content/year-2/18.06/column-space-and-nullspace.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 6 transcript, with the page's own example.

page: content/year-2/18.06/column-space-and-nullspace.mdx
calcs:
  - id: null-vector
    where: 'A(1, 1, −1) = 0: sum of squares of the four rows 1+1−2, 2+1−3, 3+1−4, 4+1−5'
    inputs: {}
    formula: (1+1-2)**2 + (2+1-3)**2 + (3+1-4)**2 + (4+1-5)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['So is $(1, 1, -1)$']
    source: {cite: reading1, at: 'p. 17'}
    origin: mit

  - id: second-solution
    where: 'A(0, −1, 1) = (1, 2, 3, 4): rows −1+2, −1+3, −1+4, −1+5; sum of squared errors'
    inputs: {}
    formula: (-1+2-1)**2 + (-1+3-2)**2 + (-1+4-3)**2 + (-1+5-4)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['$(1, 0, 0)$ and also $(0, -1, 1)$']
    source: {cite: reading1, at: 'pp. 21–22'}
    origin: mit

  - id: ex-null
    where: 'example (a): B(2, −1, −1) = 0, rows 2−1−1, 0−1+1, 4−0−4, 2−3+1; sum of squares'
    inputs: {}
    formula: (2-1-1)**2 + (0-1+1)**2 + (4-0-4)**2 + (2-3+1)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['So $x = (2, -1, -1)$ gives $Bx = 0$']
    source: {cite: reading1, at: 'pp. 17–20'}
    origin: page-own

  - id: ex-col3
    where: 'example (a): 2(1, 0, 2, 1) − (1, 1, 0, 3) = (1, −1, 4, −1); third entry'
    inputs: {}
    formula: 2*2 - 0
    expected: '4'
    shown: ['$2(1, 0, 2, 1) - (1, 1, 0, 3) = (1, -1, 4, -1)$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: page-own

  - id: ex-particular
    where: 'example (b): 2(1, 0, 2, 1) + (1, 1, 0, 3) = (3, 1, 4, 5); last entry'
    inputs: {}
    formula: 2*1 + 3
    expected: '5'
    shown: ['$(3, 1, 4, 5) = 2(1, 0, 2, 1) + (1, 1, 0, 3)$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own
