  # ---- Problem 7

  - id: p7-b-s
    answer: p7-b-s
    where: 'Problem 7(b), answer box: b is in C(A) when it is perpendicular to the cross product (1, 0, 2) × (0, 1, −1) = (−2, 1, 1): −2·2 + 1·3 + s = 0'
    inputs: {}
    formula: solve('-2*2 + 1*3 + s', 's', -10, 10)
