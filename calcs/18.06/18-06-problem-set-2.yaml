  - id: p5-b-total
    where: 'Problem 5(b), check: 10 involutions + 8 three-cycles + 6 four-cycles = 4!'
    inputs: {}
    formula: 10 + 4*2 + 3*2*1
    expected: '24'
    shown: ['$10 + 8 + 6 = 24$']
