# Calculations on content/year-2/18.06/18-06-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution: inverse entries by cofactors (the page itself uses no
# determinants), products of matrices written out entry by entry, solutions put back into Ax = b, the formula boxes
# against a numerical solve or the explicit matrix product, and counts by listing cases.
# All matrices were also checked with NumPy (numpy.linalg.inv, products L @ U and P @ A) when the page was written.

page: content/year-2/18.06/18-06-problem-set-2.mdx
calcs:
  - id: intro-points
    where: 'How to answer: the points of the seven problems (18 + 14 + 20 + 10 + 16 + 10 + 12)'
    inputs: {}
    formula: 18 + 14 + 20 + 10 + 16 + 10 + 12
    expected: '100'
    shown: ['the points here (100 in all)']
    source: {cite: mit, at: 'our own points'}
    origin: page-own

  # ---- Problem 1  (A = (1 1 0; 2 3 1; 1 2 2); its determinant 1(6 − 2) − 1(4 − 1) + 0 = 1)

  - id: p1-det
    where: 'Problem 1, calcs only: det A by the first row, so that the cofactor checks below divide by 1'
    inputs: {}
    formula: 1*(3*2 - 1*2) - 1*(2*2 - 1*1) + 0
    expected: '1'
    shown: ['The pivots are $1$, $1$ and $1$.']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-11
    answer: p1-a-11
    where: 'Problem 1(a), answer box: (A⁻¹)₁₁ = cofactor C₁₁ / det A = (3·2 − 1·2)/1'
    inputs: {}
    formula: (3*2 - 1*2)/1
    expected: '4'
    shown: ['The $(1, 1)$ entry is $4$, the $(1, 2)$ entry $-2$ and the $(2, 3)$ entry $-1$.']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-12
    answer: p1-a-12
    where: 'Problem 1(a), answer box: (A⁻¹)₁₂ = cofactor C₂₁ / det A = −(1·2 − 0·2)/1'
    inputs: {}
    formula: -(1*2 - 0*2)/1
    expected: '-2'
    shown: ['A^{-1} = \begin{pmatrix} 4 & -2 & 1 \\ -3 & 2 & -1 \\ 1 & -1 & 1 \end{pmatrix}" cite="mit"']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-23
    answer: p1-a-23
    where: 'Problem 1(a), answer box: (A⁻¹)₂₃ = cofactor C₃₂ / det A = −(1·1 − 0·2)/1'
    inputs: {}
    formula: -(1*1 - 0*2)/1
    expected: '-1'
    shown: ['Subtract row 3 from row 2, then row 2 from row 1:']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-a-check
    where: 'Problem 1(a), check: entry (2, 2) of A·A⁻¹, row (2, 3, 1) times column (−2, 2, −1)'
    inputs: {}
    formula: 2*(-2) + 3*2 + 1*(-1)
    expected: '1'
    shown: ['Row 2: $8 - 9 + 1 = 0$, $-4 + 6 - 1 = 1$, $2 - 3 + 1 = 0$.']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: x₂ by Cramer''s rule, det of A with column 2 replaced by b = (1, 0, 2): (1 1 0; 2 0 1; 1 2 2)'
    inputs: {}
    formula: (1*(0*2 - 1*2) - 1*(2*2 - 1*1) + 0)/1
    expected: '-5'
    shown: ['= \begin{pmatrix} 6 \\ -5 \\ 3 \end{pmatrix}']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-b-check
    where: 'Problem 1(b), check: row 2 of A times x = (6, −5, 3)'
    inputs: {}
    formula: 2*6 + 3*(-5) + 1*3
    expected: '0'
    tolerance: '1e-12'
    shown: ['$Ax = (6 - 5,\; 12 - 15 + 3,\; 6 - 10 + 6) = (1, 0, 2) = b$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-c-t
    answer: p1-c-t
    where: 'Problem 1(c), answer box: B is singular when its columns are parallel, 1·5 − t·2 = 0'
    inputs: {}
    formula: solve('1*5 - t*2', 't', 0, 5)
    expected: '2.5'
    tolerance: '1e-9'
    shown: ['The second pivot $5 - 2t$ is zero for $t = 2.5$.']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-11
    kind: identity
    answer: p1-c-11
    where: 'Problem 1(c), answer box: the first component x1 of the solution of Bx = (1, 0); the second row gives x2 = −2x1/5, so x1 is the root of x1(1 − 2t/5) − 1'
    formula: 5/(5 - 2*t)
    equals: solve('x1*(1 - 2*t/5) - 1', 'x1', 0.5, 10)
    samples: {t: [0.5, 0.9, 1.3, 1.7, 2]}
    tolerance: 1e-6
    shown: ['The $(1, 1)$ entry is $5/(5 - 2t)$.']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1-c-check
    where: 'Problem 1(c), check: for t = 2, (1, 2)·(5, −2), row 1 of B times column 1 of the inverse'
    inputs: {}
    formula: 1*5 + 2*(-2)
    expected: '1'
    shown: ['row 1 of $B$ times its columns gives $5 - 4 = 1$ and $-2 + 2 = 0$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  # ---- Problem 2  (A = (2 1; 1 1), B = (1 0; 3 1); AB = (5 1; 4 1), BA = (2 1; 7 4))

  - id: p2-a-21
    answer: p2-a-21
    where: 'Problem 2(a), answer box: (AB)⁻¹ by the 2 × 2 cofactor rule on AB = (5 1; 4 1), det 5 − 4 = 1: entry (2, 1) is −4/1'
    inputs: {}
    formula: -4/(5*1 - 1*4)
    expected: '-4'
    shown: ['The $(2, 1)$ entry is $-4$ and the $(2, 2)$ entry $5$.']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-22
    answer: p2-a-22
    where: 'Problem 2(a), answer box: entry (2, 2) of (AB)⁻¹ is 5/det(AB)'
    inputs: {}
    formula: 5/(5*1 - 1*4)
    expected: '5'
    shown: ['= \begin{pmatrix} 1 & -1 \\ -4 & 5 \end{pmatrix}" cite="reading2"']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: p2-a-check
    where: 'Problem 2(a), check: entry (2, 2) of AB times (AB)⁻¹, (4, 1)·(−1, 5)'
    inputs: {}
    formula: 4*(-1) + 1*5
    expected: '1'
    shown: ['$\begin{pmatrix} 5 - 4 & -5 + 5 \\ 4 - 4 & -4 + 5 \end{pmatrix} = I$']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-b-11
    answer: p2-b-11
    where: 'Problem 2(b), answer box: (BA)⁻¹ by cofactors on BA = (2 1; 7 4), det 8 − 7 = 1: entry (1, 1) is 4/1'
    inputs: {}
    formula: 4/(2*4 - 1*7)
    expected: '4'
    shown: ['= \begin{pmatrix} 4 & -1 \\ -7 & 2 \end{pmatrix}" cite="reading2"']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: p2-b-21
    answer: p2-b-21
    where: 'Problem 2(b), answer box: entry (2, 1) of (BA)⁻¹ is −7/det(BA)'
    inputs: {}
    formula: -7/(2*4 - 1*7)
    expected: '-7'
    shown: ['$\begin{pmatrix} 8 - 7 & -2 + 2 \\ 28 - 28 & -7 + 8 \end{pmatrix} = I$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  # ---- Problem 3  (A = (2 1 1; 4 5 3; −2 5 5) = LU, L = (1 0 0; 2 1 0; −1 2 1), U = (2 1 1; 0 3 1; 0 0 4))

  - id: p3-a-l31
    answer: p3-a-l31
    where: 'Problem 3(a), answer box: ℓ₃₁ = a₃₁ / first pivot = −2/2'
    inputs: {}
    formula: -2/2
    expected: '-1'
    shown: ['$\ell_{31} = -2/2 = -1$']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-l32
    answer: p3-a-l32
    where: 'Problem 3(a), answer box: ℓ₃₂ = (5 − ℓ₃₁·1)/(5 − ℓ₂₁·1), the new (3, 2) entry over the second pivot'
    inputs: {}
    formula: (5 - (-1)*1)/(5 - 2*1)
    expected: '2'
    shown: ['$\ell_{32} = 6/3 = 2$']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-piv
    answer: p3-a-piv
    where: 'Problem 3(a), answer box: third pivot = det A / (2·3), det A by the first row'
    inputs: {}
    formula: (2*(5*5 - 3*5) - 1*(4*5 - 3*(-2)) + 1*(4*5 - 5*(-2)))/(2*3)
    expected: '4'
    shown: ['The pivots are $2$, $3$ and $4$.']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-check
    where: 'Problem 3(a), check: entry (3, 3) of LU, (−1, 2, 1)·(1, 1, 4)'
    inputs: {}
    formula: (-1)*1 + 2*1 + 1*4
    expected: '5'
    shown: ['$-(2, 1, 1) + 2(0, 3, 1) + (0, 0, 4) = (-2, 5, 5)$']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-b-num
    answer: p3-b-num
    where: 'Problem 3(b), answer box: (3, 1) entry of E = L⁻¹ by cofactors of L (det L = 1): cofactor of (1, 3) in L, 2·2 − 1·(−1)'
    inputs: {}
    formula: (2*2 - 1*(-1))/1
    expected: '5'
    shown: ['for this $A$ it is $2 \cdot 2 - (-1) = 5$']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-gen
    kind: identity
    answer: p3-b-gen
    where: 'Problem 3(b), answer box: the (3, 1) entry of E₃₂E₃₁E₂₁ as a matrix product, row 3 of E₃₂ = (0, −ℓ₃₂, 1) times column 1 of E₃₁E₂₁ = (1, −ℓ₂₁, −ℓ₃₁)'
    formula: l21*l32 - l31
    equals: 0*1 + (-l32)*(-l21) + 1*(-l31)
    samples: {l21: [0.5, 1, 2, 2.5, 3], l31: [3, 0.5, -1, 1.5, 2], l32: [1, 3, 2, 0.5, 2.5]}
    tolerance: 1e-9
    shown: ['The $(3, 1)$ entry is $\ell_{21}\ell_{32} - \ell_{31}$']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-b-check
    where: 'Problem 3(b), check: entry (3, 1) of EL, (5, −2, 1)·(1, 2, −1)'
    inputs: {}
    formula: 5*1 + (-2)*2 + 1*(-1)
    expected: '0'
    tolerance: '1e-12'
    shown: ['$5 - 4 - 1 = 0$']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: (2, 3) entry of U over the second pivot, 1/3'
    inputs: {}
    formula: 1/3
    expected: '0.3333'
    shown: ['The $(2, 3)$ entry of $U''$ is $1/3 \approx 0.3333$.']
    source: {cite: reading2, at: 'pp. 6–7'}
    origin: page-own

  - id: p3-d-c3
    answer: p3-d-c3
    where: 'Problem 3(d), answer box: c = Ux for the solution x = (1, −1, 2) of Ax = b, third component 4·2'
    inputs: {}
    formula: 0*1 + 0*(-1) + 4*2
    expected: '8'
    shown: ['$c_3 = 3 - (-1) \cdot 3 - 2 \cdot (-1) = 3 + 3 + 2 = 8$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-x2
    answer: p3-d-x2
    where: 'Problem 3(d), answer box: x₂ by Cramer''s rule, det of A with column 2 replaced by b = (3, 5, 3), divided by det A = 24'
    inputs: {}
    formula: (2*(5*5 - 3*3) - 3*(4*5 - 3*(-2)) + 1*(4*3 - 5*(-2)))/24
    expected: '-1'
    shown: ['$3x_2 + x_3 = -1$ gives $x_2 = -1$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-check
    where: 'Problem 3(d), check: row 3 of A times x = (1, −1, 2)'
    inputs: {}
    formula: (-2)*1 + 5*(-1) + 5*2
    expected: '3'
    shown: ['$Ax = (2 - 1 + 2,\; 4 - 5 + 6,\; -2 - 5 + 10) = (3, 5, 3) = b$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  - id: p3-d-Eb
    where: 'Problem 3(d), check: third component of Eb, row (5, −2, 1) times (3, 5, 3)'
    inputs: {}
    formula: 5*3 - 2*5 + 3
    expected: '8'
    shown: ['whose third component is $5 \cdot 3 - 2 \cdot 5 + 3 = 8$']
    source: {cite: mit, at: 'Problem 3(d) (our own solution)'}
    origin: page-own

  # ---- Problem 4

  - id: p4-a-sum
    where: 'Problem 4(a): the exact count 1² + 2² + … + 100² by the formula n(n + 1)(2n + 1)/6'
    inputs: {}
    formula: 100*101*201/6
    expected: '338350'
    tolerance: '0.5'
    shown: ['= \frac{100 \cdot 101 \cdot 201}{6} = 338\,350']
    source: {cite: reading2, at: 'pp. 17–18'}
    origin: page-own

  - id: p4-a
    answer: p4-a
    where: 'Problem 4(a), answer box: the excess over n³/3 for n = 100 as ½n² + ⅙n (the other terms of the sum formula), independent of the subtraction on the page'
    inputs: {}
    formula: 100**2/2 + 100/6
    expected: '5017'
    tolerance: '0.5'
    shown: ['The difference is $5016.7$, about $5017$ operations.']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-a-direct
    where: 'Problem 4(a), check: the same excess by subtraction, 338350 − 100³/3'
    inputs: {}
    formula: 338350 - 100**3/3
    expected: '5016.7'
    shown: ['$\frac12 \cdot 100^2 + \frac16 \cdot 100 = 5000 + 16.7$']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-a-percent
    where: 'Problem 4(a), check: the excess as a percentage of the count'
    inputs: {}
    formula: 100*(5016.67/338350)
    expected: '1.5'
    tolerance: '0.05'
    shown: ['the extra is only $1.5$ per cent of the count']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4-b-t
    answer: p4-b-t
    where: 'Problem 4(b), answer box: seconds to factor, (3000³/3) / 10⁹'
    inputs: {}
    formula: (3000**3/3)/1e9
    expected: '9'
    shown: ['$\frac13 \cdot 2.7 \times 10^{10} = 9 \times 10^9$ operations, so $9$ seconds.']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-b-k
    answer: p4-b-k
    where: 'Problem 4(b), answer box: right-hand sides in one factorization time, total time over the time of one right-hand side (3000²/10⁹ s)'
    inputs: {}
    formula: ((3000**3/3)/1e9) / (3000**2/1e9)
    expected: '1000'
    tolerance: '0.5'
    shown: ['= \frac{n}{3} = \frac{3000}{3} = 1000']
    source: {cite: reading2, at: 'pp. 18–19'}
    origin: page-own

  - id: p4-b-rhs
    where: 'Problem 4(b): time of one right-hand side, 3000² / 10⁹ s'
    inputs: {}
    formula: 3000**2/1e9
    expected: '0.009'
    shown: ['Each right-hand side takes $9 \times 10^6$ operations, $0.009$ seconds.']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4-c
    where: 'Problem 4(c), choice box (8): time for n = 6000 over time for n = 3000'
    inputs: {}
    formula: (6000**3/3)/(3000**3/3)
    expected: '8'
    shown: ['$72$ seconds: $8$ times the $9$ seconds of part (b)']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  - id: p4-c-time
    where: 'Problem 4(c), check: seconds for n = 6000'
    inputs: {}
    formula: (6000**3/3)/1e9
    expected: '72'
    shown: ['$\frac13 \cdot 6000^3 = 7.2 \times 10^{10}$ operations']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  # ---- Problem 5  (A = (1 2 1; 2 4 3; 3 7 5); P exchanges rows 2 and 3)

  - id: p5-a-zero
    where: 'Problem 5(a): the (2, 2) entry after clearing column 1, 4 − 2·2'
    inputs: {}
    formula: 4 - 2*2
    expected: '0'
    tolerance: '1e-12'
    shown: ['Row 2 minus $2$ times row 1 is $(0, 0, 1)$']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-a-l21
    answer: p5-a-l21
    where: 'Problem 5(a), answer box: ℓ₂₁ of PA, whose second row is the third row (3, 7, 5) of A: 3/1'
    inputs: {}
    formula: 3/1
    expected: '3'
    shown: ['The $(2, 1)$ entry of $L$ is $3$, and the $(2, 3)$ entry of $U$ is $2$.']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
