# Calculations on content/year-2/18.06/linear-transformations-matrices.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 30 transcript, with the page's own example.

page: content/year-2/18.06/linear-transformations-matrices.mdx
calcs:
  - id: proj-45
    where: 'P = aaᵀ/aᵀa for a = (1, 1): entry (1, 1) = 1·1/(1 + 1)'
    inputs: {}
    formula: 1*1/(1**2 + 1**2)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['P = \begin{pmatrix} \tfrac12 & \tfrac12 \\ \tfrac12 & \tfrac12 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: proj-idempotent
    where: 'P² = P: entry (1, 1) of P², ½·½ + ½·½'
    inputs: {}
    formula: 0.5*0.5 + 0.5*0.5
    expected: '0.5'
    tolerance: 1e-12
    shown: ['though symmetric with $P^2 = P$']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: derivative-matrix
    kind: identity
    where: '(0 1 0; 0 0 2)(c₁, c₂, c₃): second output 2c₃ is the coefficient of x in the derivative'
    formula: 0*a + 0*b + 2*c
    equals: 2*c
    samples: {a: [1.0, -2.0], b: [0.5, 3.0], c: [1.5, -0.7]}
    tolerance: 1e-12
    shown: ['\begin{pmatrix} c_2 \\ 2c_3 \end{pmatrix}']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: mit

  - id: zero-fixed
    where: 'T(0) = 3T(0) forces T(0) = 0: (3 − 1)T(0) = 0'
    inputs: {}
    formula: 0/(3 - 1)
    expected: '0'
    shown: ['$T(0) = 3T(0)$, so']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ex-deriv
    where: 'example: first output of A(4, −1, 5, 2): the coefficient of x, −1'
    inputs: {}
    formula: 0*4 + 1*(-1) + 0*5 + 0*2
    expected: '-1'
    shown: ['$A(4, -1, 5, 2) = (-1, 10, 6)$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: page-own

  - id: ex-deriv-2
    where: 'example: second output 2·5'
    inputs: {}
    formula: 0*4 + 0*(-1) + 2*5 + 0*2
    expected: '10'
    shown: ['$A(4, -1, 5, 2) = (-1, 10, 6)$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: page-own

  - id: ex-deriv-3
    where: 'example: third output 3·2'
    inputs: {}
    formula: 0*4 + 0*(-1) + 0*5 + 3*2
    expected: '6'
    shown: ['$A(4, -1, 5, 2) = (-1, 10, 6)$']
    source: {cite: reading1, at: 'pp. 17–18'}
    origin: page-own

  - id: ex-deriv-check
    kind: identity
    where: 'example: d/dx of 4 − x + 5x² + 2x³ equals −1 + 10x + 6x²'
    formula: deriv('4 - t + 5*t**2 + 2*t**3', 't', x)
    equals: -1 + 10*x + 6*x**2
    samples: {x: [0.0, 0.7, -1.3]}
    tolerance: 1e-6
    shown: ['that is $p''(x) = -1 + 10x + 6x^2$']
    source: {cite: reading1, at: 'pp. 16–17'}
    origin: page-own
