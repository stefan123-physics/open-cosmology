# Calculations on content/year-2/18.06/orthogonal-vectors-and-subspaces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 14 transcript, with the page's own example.

page: content/year-2/18.06/orthogonal-vectors-and-subspaces.mdx
calcs:
  - id: len-123
    where: 'length squared of (1, 2, 3)'
    inputs: {}
    formula: 1 + 4 + 9
    expected: '14'
    shown: ['for $x = (1, 2, 3)$ it is $1 + 4 + 9 = 14$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: pyth-check
    where: 'x = (1, 2, 3), y = (2, −1, 0): xᵀy = 0 and 14 + 5 = |(3, 1, 3)|² = 19'
    inputs: {}
    formula: (1*2 + 2*(-1) + 3*0)**2 + ((1+4+9) + (4+1+0) - (9+1+9))**2
    expected: '0'
    tolerance: 1e-12
    shown: ['indeed $14 + 5 = 19$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: mit

  - id: null-dim
    where: 'nullspace of the rank-one 2 × 3 matrix: 3 − 1'
    inputs: {}
    formula: 3 - 1
    expected: '2'
    shown: ['its nullspace has dimension $3 - 1 = 2$']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: ata-22
    where: 'AᵀA entry (2, 2) for columns (1, 1, 1), (1, 2, 5): 1 + 4 + 25'
    inputs: {}
    formula: 1 + 4 + 25
    expected: '30'
    shown: ['8 & 30']
    source: {cite: reading1, at: 'p. 22'}
    origin: mit

  - id: ata-rank1
    where: 'second column (3, 3, 3): AᵀA = (3 9; 9 27), determinant 3·27 − 9·9'
    inputs: {}
    formula: 3*27 - 9*9
    expected: '0'
    tolerance: 1e-12
    shown: ['giving $A^TA$ with entries 3, 9, 9 and 27']
    source: {cite: reading1, at: 'pp. 22–23'}
    origin: mit

  - id: ex-null
    where: 'example (a): (−2, 0, 1)·(1, −1, 2) = 0'
    inputs: {}
    formula: -2*1 + 0*(-1) + 1*2
    expected: '0'
    tolerance: 1e-12
    shown: ['$-2 + 0 + 2 = 0$']
    source: {cite: reading1, at: 'pp. 10–12'}
    origin: page-own

  - id: ex-pyth
    where: 'example (b): |x|² = 9, |y|² = 2, |(3, 1, 1)|² = 11'
    inputs: {}
    formula: (9 + 1 + 1) - ((4 + 1 + 4) + (1 + 0 + 1))
    expected: '0'
    tolerance: 1e-12
    shown: ['$\|x + y\|^2 = 11 = 9 + 2$']
    source: {cite: reading1, at: 'pp. 3–6'}
    origin: page-own

  - id: ex-ata
    where: 'example (c): AᵀA = (3 4; 4 10), determinant'
    inputs: {}
    formula: 3*10 - 4*4
    expected: '14'
    shown: ['with determinant $30 - 16 = 14 \ne 0$']
    source: {cite: reading1, at: 'pp. 21–23'}
    origin: page-own
