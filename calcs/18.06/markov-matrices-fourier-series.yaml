# Calculations on content/year-2/18.06/markov-matrices-fourier-series.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 24 transcript, with the page's own example.

page: content/year-2/18.06/markov-matrices-fourier-series.mdx
calcs:
  - id: x1-row3
    where: 'Strang''s 3 × 3: row 3 of A − I times (0.6, 33, 0.7): 0.7·0.6 + 0·33 − 0.6·0.7'
    inputs: {}
    formula: 0.7*0.6 + 0*33 - 0.6*0.7
    expected: '0'
    tolerance: 1e-12
    shown: ['make the last row zero ($0.42 - 0.42$)']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: x1-row1
    where: 'row 1 of A − I: −0.9·0.6 + 0.01·33 + 0.3·0.7'
    inputs: {}
    formula: -0.9*0.6 + 0.01*33 + 0.3*0.7
    expected: '0'
    tolerance: 1e-12
    shown: ['$-0.54 + 0.21 + 0.01y = 0$, needs $y = 33$']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: x1-row2
    where: 'row 2 of A − I: 0.2·0.6 − 0.01·33 + 0.3·0.7'
    inputs: {}
    formula: 0.2*0.6 - 0.01*33 + 0.3*0.7
    expected: '0'
    tolerance: 1e-12
    shown: ['0.6 \\ 33 \\ 0.7']
    source: {cite: reading1, at: 'pp. 8–9'}
    origin: mit

  - id: pop-step1
    where: 'A(0, 1000): first component 0.9·0 + 0.2·1000'
    inputs: {}
    formula: 0.9*0 + 0.2*1000
    expected: '200'
    tolerance: 1e-9
    shown: ['After one step the populations are $200$ and $800$']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: pop-det
    where: 'det = 0.72 − 0.02 = 0.7 = product of eigenvalues 1·0.7'
    inputs: {}
    formula: 0.9*0.8 - 0.2*0.1
    expected: '0.7'
    tolerance: 1e-12
    shown: ['the determinant $0.72 - 0.02 = 0.7$ agrees']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: pop-x2
    where: '(A − 0.7I)(−1, 1): first row 0.2·(−1) + 0.2·1'
    inputs: {}
    formula: (0.9 - 0.7)*(-1) + 0.2*1
    expected: '0'
    tolerance: 1e-12
    shown: ['$A - 0.7I$ gives $x_2 = (-1, 1)$']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: pop-u0
    where: 'u₀ check, first component: (1000/3)·2 − 2000/3 = 0'
    inputs: {}
    formula: (1000/3)*2 - 2000/3
    expected: '0'
    tolerance: 1e-9
    shown: ['\frac{1000}{3}\,1^k']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: pop-u0-second
    where: 'u₀ check, second component: 1000/3 + 2000/3 = 1000'
    inputs: {}
    formula: 1000/3 + 2000/3
    expected: '1000'
    tolerance: 1e-9
    shown: ['\frac{2000}{3}\,(0.7)^k']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: pop-steady
    where: 'steady state 2000/3 in California'
    inputs: {}
    formula: 2000/3
    expected: '667'
    tolerance: 0.5
    shown: ['$\frac{2000}{3} \approx 667$']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: sin-cos
    where: '∫₀^(2π) sin x cos x dx = [½ sin²x]₀^(2π) = 0'
    inputs: {}
    formula: integrate("sin(x)*cos(x)", "x", 0, 2*pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['= \left[\tfrac12\sin^2x\right]_0^{2\pi} = 0']
    source: {cite: reading1, at: 'p. 20'}
    origin: mit

  - id: cos-squared
    where: '∫₀^(2π) cos²x dx = π'
    inputs: {}
    formula: integrate("cos(x)**2", "x", 0, 2*pi)
    expected: '3.14159265'
    tolerance: 1e-7
    shown: ['= a_1\int_0^{2\pi}\cos^2x\,dx = \pi a_1']
    source: {cite: reading1, at: 'p. 21'}
    origin: mit

  - id: ex-c1
    where: 'example: 3c₁ + c₂ = 700 and 4c₁ − c₂ = 0 add to 7c₁ = 700'
    inputs: {}
    formula: 700/7
    expected: '100'
    shown: ['$7c_1 = 700$, so $c_1 = 100$ and $c_2 = 400$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-c2
    where: 'example: c₂ = 4c₁ = 400; check 3·100 + 400 = 700'
    inputs: {}
    formula: 3*100 + 400
    expected: '700'
    shown: ['$7c_1 = 700$, so $c_1 = 100$ and $c_2 = 400$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-x1
    where: 'example: (A − I)(3, 4) first row −0.4·3 + 0.3·4'
    inputs: {}
    formula: -0.4*3 + 0.3*4
    expected: '0'
    tolerance: 1e-12
    shown: ['gives $x_1 = (3, 4)$']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-u1
    where: 'example: A(700, 0) = (0.6·700, 0.4·700); formula 300 + 400·0.3 = 420'
    inputs: {}
    formula: 0.6*700 - (300 + 400*0.3) + 420
    expected: '420'
    tolerance: 1e-9
    shown: ['$u_1 = (300 + 120, 400 - 120) = (420, 280)$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-u1-second
    where: 'example: second component 0.4·700 = 280 = 400 − 120'
    inputs: {}
    formula: 0.4*700
    expected: '280'
    tolerance: 1e-9
    shown: ['and directly $A(700, 0) = (420, 280)$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: ex-fourier-a1
    where: 'example: a₁ = (1/π)∫₀^(2π) (1 + cos x)² cos x dx'
    inputs: {}
    formula: integrate("(1 + cos(x))**2*cos(x)", "x", 0, 2*pi)/pi
    expected: '2'
    tolerance: 1e-9
    shown: ['so $a_1 = 2\pi/\pi = 2$']
    source: {cite: reading1, at: 'p. 21'}
    origin: page-own

  - id: ex-fourier-identity
    kind: identity
    where: 'example: (1 + cos x)² = 3/2 + 2 cos x + ½ cos 2x'
    formula: (1 + cos(x))**2
    equals: 1.5 + 2*cos(x) + 0.5*cos(2*x)
    samples: {x: [0.0, 0.7, 2.5, 4.0]}
    tolerance: 1e-12
    shown: ['= \frac32 + 2\cos x + \frac12\cos 2x']
    source: {cite: reading1, at: 'p. 18'}
    origin: page-own
