# Calculations on content/year-2/18.06/determinant-formulas-cofactors.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.06 (Spring 2010) Lecture 19 transcript, with the page's own example.

page: content/year-2/18.06/determinant-formulas-cofactors.mdx
calcs:
  - id: pieces
    where: 'splitting each of 3 rows into 3 pieces: 3³'
    inputs: {}
    formula: 3**3
    expected: '27'
    shown: ['$3^3 = 27$ pieces']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: terms-5
    where: 'quiz: 5! terms'
    inputs: {}
    formula: 5*4*3*2*1
    expected: '120'
    shown: ['$5! = 120$']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: tri-A3
    where: 'tridiagonal ones: |A3| = |A2| − |A1| = 0 − 1'
    inputs: {}
    formula: 0 - 1
    expected: '-1'
    shown: ['and $|A_3| = -1$']
    source: {cite: reading1, at: 'pp. 24–25'}
    origin: mit

  - id: tri-period
    where: 'period 6: 61 = 6·10 + 1, so |A61| = |A1| (sequence 1, 0, −1, −1, 0, 1 repeats)'
    inputs: {}
    formula: 61 - 6*10
    expected: '1'
    shown: ['$|A_{61}| = |A_1| = 1$']
    source: {cite: reading1, at: 'p. 28'}
    origin: mit

  - id: ex-big
    where: 'example (a): 2·3·4 + 1·1·1 by the big formula equals the cofactor expansion'
    inputs: {}
    formula: 2*(3*4 - 0*1) - 0*(1*4 - 0*0) + 1*(1*1 - 3*0)
    expected: '25'
    shown: ['$\det = 25$']
    source: {cite: reading1, at: 'pp. 9–11'}
    origin: page-own

  - id: ex-T4
    where: 'example (b): T(n) = 4T(n−1) − T(n−2), T(1) = 4, T(2) = 15: T(3) = 56, T(4) = 209'
    inputs: {}
    formula: 4*(4*15 - 4) - 15
    expected: '209'
    shown: ['$|T_4| = 224 - 15 = 209$']
    source: {cite: reading1, at: 'pp. 26–27'}
    origin: page-own

  - id: ex-T3
    where: 'example (b): T(3) = 4·15 − 4'
    inputs: {}
    formula: 4*15 - 4
    expected: '56'
    shown: ['$|T_3| = 60 - 4 = 56$']
    source: {cite: reading1, at: 'pp. 26–27'}
    origin: page-own
