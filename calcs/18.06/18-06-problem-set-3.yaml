    origin: page-own

  - id: p4-d-fail
    where: 'Problem 4(d), check: 7b1 − 3b2 + b3 for b = (1, 3, 0)'
    inputs: {}
    formula: 7*1 - 3*3 + 0
    expected: '-2'
    shown: ['For $b = (1, 3, 0)$: $7 - 9 + 0 = -2 \neq 0$']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  # ---- Problem 5  (rows (1, 1, 2), (1, 2, −1), (3, 4, q))

  - id: p5-a-piv
    kind: identity
    answer: p5-a-piv
    where: 'Problem 5(a), answer box: the third pivot against the expanded determinant of A divided by the first two pivots (1·1)'
    formula: q - 3
    equals: (1*(2*q - (-1)*4) - 1*(1*q - (-1)*3) + 2*(1*4 - 2*3))/(1*1)
    samples: {q: [-5, 0, 3, 5.5, 10]}
    tolerance: 1e-9
    shown: ['Then row 3 minus row 2 gives $(0, 0, q - 3)$']
    source: {cite: reading2, at: 'pp. 2–4'}
    origin: page-own

  - id: p5-a-q
    answer: p5-a-q
    where: 'Problem 5(a), answer box: q for which row 3 = 2·row 1 + row 2, from the third entries 2·2 + (−1)'
    inputs: {}
    formula: 2*2 + (-1)
    expected: '3'
    shown: ['At $q = 3$ the third row of $A$ is $(3, 4, 3) = 2(1, 1, 2) + (1, 2, -1)$']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: p5-b-1
    where: 'Problem 5(b), choice box (infinitely many): b3 − b2 − 2b1 for b = (1, 1, 3)'
