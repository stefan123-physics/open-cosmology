    expected: '0'
    tolerance: '1e-12'
    shown: ['For $(1, 1, 3)$: $3 - 1 - 2 = 0$']
    source: {cite: reading3, at: 'pp. 2–4'}
    origin: page-own

  - id: p5-b-2
    where: 'Problem 5(b), choice box (no solution): b3 − b2 − 2b1 for b = (1, 1, 1)'
    inputs: {}
    formula: 1 - 1 - 2*1
    expected: '-2'
    shown: ['For $(1, 1, 1)$: $1 - 1 - 2 = -2 \neq 0$']
    source: {cite: reading3, at: 'pp. 2–4'}
    origin: page-own

  - id: p5-b-x1
    answer: p5-b-x1
    where: 'Problem 5(b), answer box: x1 for q = 5, b = (1, 1, 1), by Cramer on the 3 × 3 system (det A = q − 3 = 2; det with column 1 replaced by b)'
    inputs: {}
    formula: (1*(2*5 - (-1)*4) - 1*(1*5 - (-1)*1) + 2*(1*4 - 2*1))/2
    expected: '6'
    shown: ['$x_1 + x_2 + 2x_3 = 1$ gives $x_1 = 1 + 3 + 2 = 6$']
    source: {cite: reading3, at: 'pp. 17–18'}
    origin: page-own

  - id: p5-b-check
    where: 'Problem 5(b), check: A(6, −3, −1) − (1, 1, 1) for q = 5, squared and added'
    inputs: {}
    formula: (6 - 3 - 2 - 1)**2 + (6 - 6 + 1 - 1)**2 + (18 - 12 - 5 - 1)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$A(6, -3, -1) = (6 - 3 - 2,\; 6 - 6 + 1,\; 18 - 12 - 5) = (1, 1, 1)$']
    source: {cite: reading3, at: 'pp. 17–18'}
    origin: page-own

