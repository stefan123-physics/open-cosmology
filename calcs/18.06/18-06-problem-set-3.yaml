# Calculations on content/year-2/18.06/18-06-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Every problem on this page is our own (MIT's 18.06 problem sets are textbook exercise numbers), so every answer is
# checked here by a route independent of the page's solution: vectors multiplied back into the original matrix
# (A·x = b, A·s = 0 row by row), dependences checked on every row, the formula boxes against a numerical root of the
# elimination residual (solve) or against the expanded 3 × 3 determinant, and ranks through the pivots of a second
# elimination order. All matrices were also row reduced with exact fractions and their ranks found with
# numpy.linalg.matrix_rank when the page was written.

page: content/year-2/18.06/18-06-problem-set-3.mdx
calcs:
  - id: intro-points
    where: 'How to answer: the points of the six problems (14 + 16 + 20 + 20 + 16 + 14)'
    inputs: {}
    formula: 14 + 16 + 20 + 20 + 16 + 14
    expected: '100'
    shown: ['the points here (100 in all)']
    source: {cite: reading1, at: 'our own points'}
    origin: page-own

  # ---- Problem 1  (P: x1 + 2x2 − x3 = 0)

  - id: p1-a-5
    where: 'Problem 1(a), choice box S5 (yes): (2, 1, −1) satisfies x1 = 2x2 and x2 = −x3; residuals squared and added'
    inputs: {}
    formula: (2 - 2*1)**2 + (1 - (-(-1)))**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['It is the line of multiples of $(2, 1, -1)$.']
    source: {cite: reading1, at: 'pp. 5–6'}
    origin: page-own

  - id: p1-a-2
    where: 'Problem 1(a), choice box S2 (no): the sum (1, 1, 0) of (1, 0, 0) and (0, 1, 0) has x1·x2 = 1'
    inputs: {}
    formula: (1 + 0)*(0 + 1)
    expected: '1'
    shown: ['but not their sum $(1, 1, 0)$, since $1 \cdot 1 \neq 0$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: p1-b-1
    where: 'Problem 1(b), choice box (the whole line L1): (1, 1, 3) put into x1 + 2x2 − x3'
    inputs: {}
    formula: 1 + 2*1 - 3
    expected: '0'
    tolerance: '1e-12'
    shown: ['For $(1, 1, 3)$: $1 + 2 \cdot 1 - 3 = 0$']
    source: {cite: reading1, at: 'pp. 4–6'}
    origin: page-own

  - id: p1-b-2
    where: 'Problem 1(b), choice box (only the zero vector): (1, 2, 1) put into x1 + 2x2 − x3'
    inputs: {}
    formula: 1 + 2*2 - 1
    expected: '4'
    shown: ['For $(1, 2, 1)$: $1 + 2 \cdot 2 - 1 = 4$']
    source: {cite: reading1, at: 'pp. 4–6'}
    origin: page-own

  - id: p1-c-sum
    where: 'Problem 1(c): v + w = (2, 2, 2) put into x1 + 2x2 − x3'
    inputs: {}
    formula: 2 + 2*2 - 2
    expected: '4'
    shown: ['It is not in $P$: $2 + 4 - 2 = 4 \neq 0$.']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  # ---- Problem 2  (columns (1, 0, 2, 1), (2, 1, 1, −1), (−3, −2, 0, 3))

  - id: p2-a-null
    where: 'Problem 2(a): A(1, −2, −1), the four rows, squared and added'
    inputs: {}
    formula: (1 - 4 + 3)**2 + (0 - 2 + 2)**2 + (2 - 2 + 0)**2 + (1 + 2 - 3)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['1 - 4 + 3 \\ 0 - 2 + 2 \\ 2 - 2 + 0 \\ 1 + 2 - 3']
    source: {cite: reading1, at: 'pp. 16–18'}
    origin: page-own

  - id: p2-a-x2
    answer: p2-a-x2
    where: 'Problem 2(a), answer box: row 2 of column 3 = c·(column 1) + d·(column 2) reads −2 = c·0 + d·1; the nullspace vector (c, d, −1) with c = 1 has second component d'
    inputs: {}
    formula: solve('0*1 + d*1 - (-2)', 'd', -10, 10)
    expected: '-2'
    tolerance: '1e-9'
    shown: ['needs $d = -2$']
    source: {cite: reading1, at: 'pp. 16–18'}
    origin: page-own

  - id: p2-a-x3
    answer: p2-a-x3
    where: 'Problem 2(a), answer box: row 1 of the dependence, c·1 + (−2)·2 = −3, gives c; the vector (c, d, −1) scaled to first component 1 has third component −1/c'
    inputs: {}
    formula: -1/solve('c*1 + (-2)*2 - (-3)', 'c', -10, 10)
    expected: '-1'
    tolerance: '1e-9'
    shown: ['so $c = 1$']
    source: {cite: reading1, at: 'pp. 16–18'}
    origin: page-own

  - id: p2-a-rows34
    where: 'Problem 2(a), check: c·column 1 + d·column 2 against column 3 in rows 3 and 4 (c = 1, d = −2), differences squared and added'
    inputs: {}
    formula: (1*2 + (-2)*1 - 0)**2 + (1*1 + (-2)*(-1) - 3)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$(1, 0, 2, 1) - 2(2, 1, 1, -1) = (-3, -2, 0, 3)$']
    source: {cite: reading1, at: 'pp. 13–15'}
    origin: page-own

  - id: p2-b
    where: 'Problem 2(b), choice box (3, 1, 3, 0): x1·column 1 + x2·column 2 with x2 = 1, x1 = 3 − 2·1, minus b, squared and added'
    inputs: {}
    formula: (1*1 + 2*1 - 3)**2 + (0*1 + 1*1 - 1)**2 + (2*1 + 1*1 - 3)**2 + (1*1 + (-1)*1 - 0)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$A(1, 1, 0) = (1 + 2, 0 + 1, 2 + 1, 1 - 1) = (3, 1, 3, 0)$']
    source: {cite: reading1, at: 'pp. 12–13'}
    origin: page-own

  - id: p2-b-wrong3
    where: 'Problem 2(b): the vector (2, 0, 4, 3) fails in row 4: x1 = 2, x2 = 0 give 1·2 + (−1)·0'
    inputs: {}
    formula: 1*2 + (-1)*0
    expected: '2'
    shown: ['but row 4 gives $2 \neq 3$']
    source: {cite: reading1, at: 'pp. 12–13'}
    origin: page-own

  - id: p2-c-x1
    answer: p2-c-x1
    where: 'Problem 2(c), answer box: x = (1, 1, 0) + c(1, −2, −1) with x3 = −c = 2, first component'
    inputs: {}
    formula: 1 + (-2)*1
    expected: '-1'
    shown: ['$x = (1 - 2, 1 + 4, 0 + 2) = (-1, 5, 2)$']
    source: {cite: reading3, at: 'pp. 6–8'}
    origin: page-own

  - id: p2-c-x2
    answer: p2-c-x2
    where: 'Problem 2(c), answer box: second component 1 + c·(−2) with c = −2'
    inputs: {}
    formula: 1 + (-2)*(-2)
    expected: '5'
    shown: ['The third component is $-c$, so $x_3 = 2$ needs $c = -2$']
    source: {cite: reading3, at: 'pp. 6–8'}
    origin: page-own

  - id: p2-c-check
    where: 'Problem 2(c), check: A(−1, 5, 2) − (3, 1, 3, 0), the four rows, squared and added'
    inputs: {}
    formula: (-1 + 10 - 6 - 3)**2 + (0 + 5 - 4 - 1)**2 + (-2 + 5 + 0 - 3)**2 + (-1 - 5 + 6 - 0)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['$A(-1, 5, 2) = (-1 + 10 - 6,\; 0 + 5 - 4,\; -2 + 5 + 0,\; -1 - 5 + 6) = (3, 1, 3, 0)$']
    source: {cite: reading3, at: 'pp. 6–8'}
    origin: page-own

  # ---- Problem 3  (rows (1, 2, 1, 1, 2), (3, 6, 5, 7, 4), (2, 4, 0, −2, 6))

  - id: p3-a-piv
    answer: p3-a-piv
    where: 'Problem 3(a), answer box: entry (2, 3) after row 2 − 3·row 1, that is 5 − 3·1'
    inputs: {}
    formula: 5 - 3*1
    expected: '2'
    shown: ['Column 2 has no pivot, so move to column 3: the second pivot is $2$.']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: p3-a-rank
    answer: p3-a-rank
    where: 'Problem 3(a), answer box: rank 2; route: row 3 equals 5·row 1 − row 2 in all five entries (differences squared and added are 0), so only two independent rows remain, and rows 1 and 2 are not multiples (entries 1 and 2 of row 2 over row 1 are 3 and 3, entry 3 is 5)'
    inputs: {}
    formula: 2 + ((5*1 - 3 - 2)**2 + (5*2 - 6 - 4)**2 + (5*1 - 5 - 0)**2 + (5*1 - 7 + 2)**2 + (5*2 - 4 - 6)**2)
    expected: '2'
    shown: ['There are two pivots, so $r = 2$.']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: p3-a-third
    where: 'Problem 3(a): entry (3, 3) after row 3 − 2·row 1, that is 0 − 2·1'
    inputs: {}
    formula: 0 - 2*1
    expected: '-2'
    shown: ['$(0, 0, 2, 4, -2)$ and $(0, 0, -2, -4, 2)$']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: p3-b-41
    answer: p3-b-41
    where: 'Problem 3(b), answer box: x1 of the special solution for x4; route: row 3 of A (not used on the page) times (x1, 0, −2, 1, 0), 2·x1 + 0·(−2) + (−2)·1 = 0'
    inputs: {}
    formula: solve('2*x1 + 0*(-2) + (-2)*1', 'x1', -10, 10)
    expected: '1'
    tolerance: '1e-9'
    shown: ['$x_1 - 2 + 1 = 0$, so $x_1 = 1$']
    source: {cite: reading2, at: 'pp. 5–8'}
    origin: page-own

  - id: p3-b-43
    answer: p3-b-43
    where: 'Problem 3(b), answer box: x3 of the special solution for x4; route: row 2 of A times (1, 0, x3, 1, 0), 3·1 + 5·x3 + 7·1 = 0'
    inputs: {}
    formula: solve('3*1 + 5*x3 + 7*1', 'x3', -10, 10)
    expected: '-2'
    tolerance: '1e-9'
    shown: ['$2x_3 + 4 = 0$, so $x_3 = -2$']
    source: {cite: reading2, at: 'pp. 5–8'}
    origin: page-own

  - id: p3-b-51
    answer: p3-b-51
    where: 'Problem 3(b), answer box: x1 of the special solution for x5; route: row 3 of A times (x1, 0, 1, 0, 1), 2·x1 + 0·1 + 6·1 = 0'
    inputs: {}
    formula: solve('2*x1 + 0*1 + 6*1', 'x1', -10, 10)
    expected: '-3'
    tolerance: '1e-9'
    shown: ['$x_1 + 1 + 2 = 0$, so $x_1 = -3$']
    source: {cite: reading2, at: 'pp. 5–8'}
    origin: page-own

  - id: p3-b-53
    answer: p3-b-53
    where: 'Problem 3(b), answer box: x3 of the special solution for x5; route: row 2 of A times (−3, 0, x3, 0, 1), 3·(−3) + 5·x3 + 4·1 = 0'
    inputs: {}
    formula: solve('3*(-3) + 5*x3 + 4*1', 'x3', -10, 10)
    expected: '1'
    tolerance: '1e-9'
    shown: ['$2x_3 - 2 = 0$, so $x_3 = 1$']
    source: {cite: reading2, at: 'pp. 5–8'}
    origin: page-own

  - id: p3-b-check4
    where: 'Problem 3(b), check: A(1, 0, −2, 1, 0), three rows, squared and added'
    inputs: {}
    formula: (1 - 2 + 1)**2 + (3 - 10 + 7)**2 + (2 + 0 - 2)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['For $(1, 0, -2, 1, 0)$: $1 - 2 + 1 = 0$, $3 - 10 + 7 = 0$, $2 + 0 - 2 = 0$.']
    source: {cite: reading2, at: 'pp. 5–8'}
    origin: page-own

  - id: p3-b-check5
    where: 'Problem 3(b), check: A(−3, 0, 1, 0, 1), three rows, squared and added'
    inputs: {}
    formula: (-3 + 1 + 2)**2 + (-9 + 5 + 4)**2 + (-6 + 0 + 6)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['For $(-3, 0, 1, 0, 1)$: $-3 + 1 + 2 = 0$, $-9 + 5 + 4 = 0$, $-6 + 0 + 6 = 0$.']
    source: {cite: reading2, at: 'pp. 5–8'}
    origin: page-own

  - id: p3-c-row1
    where: 'Problem 3(c): row 1 of R = row 1 of U minus the halved row 2, entries 4 and 5: 1 − 2 and 2 − (−1)'
    inputs: {}
    formula: (1 - 2) + (2 - (-1))
    expected: '2'
    shown: ['Subtract it from row 1: $(1, 2, 0, -1, 3)$.']
    source: {cite: reading2, at: 'p. 10'}
    origin: page-own

  - id: p3-c-row3
    where: 'Problem 3(a), check: 5·row 1 − row 2 against row 3, the five entries, differences squared and added'
    inputs: {}
    formula: (5 - 3 - 2)**2 + (10 - 6 - 4)**2 + (5 - 5 - 0)**2 + (5 - 7 + 2)**2 + (10 - 4 - 6)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['(5 - 3, 10 - 6, 5 - 5, 5 - 7, 10 - 4) = (2, 4, 0, -2, 6)']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: p3-d-wide
    answer: p3-d-wide
    where: 'Problem 3(d), answer box: n − (largest rank); the rank is at most m = 4 (and at most n = 7), so n − r ≥ 7 − 4'
    inputs: {}
    formula: 7 - 4
    expected: '3'
    shown: ['so there are at least $7 - 4 = 3$ free variables']
    source: {cite: reading3, at: 'pp. 10–11'}
    origin: page-own

  - id: p3-d-tall
    answer: p3-d-tall
    where: 'Problem 3(d), answer box: n − (largest rank); the rank is at most n = 4 (and at most m = 7), and 4 is reached, so n − r ≥ 4 − 4'
    inputs: {}
    formula: 4 - 4
    expected: '0'
    tolerance: '1e-12'
    shown: ['Then there are $4 - 4 = 0$ free variables']
    source: {cite: reading3, at: 'pp. 10–11'}
    origin: page-own

  # ---- Problem 4  (rows (1, −1, 2, 0), (2, −2, 5, 1), (−1, 1, 1, 3))

  - id: p4-a
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box: b3 against a numerical root of the elimination residual (b3 + b1) − 3(b2 − 2b1)'
    formula: 3*b2 - 7*b1
    equals: solve('(b3 + b1) - 3*(b2 - 2*b1)', 'b3', -100, 100)
    samples: {b1: [1, 1.5, 2.5, 3, 4], b2: [-4, -1, -2.5, -3.3, -1.7]}
    tolerance: 1e-6
    shown: ['So $Ax = b$ is solvable exactly when $b_3 = 3b_2 - 7b_1$']
    source: {cite: reading3, at: 'pp. 2–3'}
    origin: page-own

  - id: p4-a-columns
    where: 'Problem 4(a), check: each column (b1, b2, b3) of A satisfies 3b2 − 7b1 − b3 = 0 (columns 1, 3, 4), squared and added'
    inputs: {}
    formula: (3*2 - 7*1 - (-1))**2 + (3*5 - 7*2 - 1)**2 + (3*1 - 7*0 - 3)**2
    expected: '0'
    tolerance: '1e-12'
    shown: ['Column 1: $3 \cdot 2 - 7 \cdot 1 = -1$, its third entry.']
    source: {cite: reading3, at: 'pp. 3–4'}
    origin: page-own

  - id: p4-b-x1
