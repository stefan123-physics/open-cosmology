# Calculations on content/year-3/8.05/8-05-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 builds the expectation values from the two amplitudes of the state and the numbers from the components of
# the two unit vectors; Problem 2 uses the exact rotation about z; Problem 3 uses the determinant and the
# characteristic equation of the matrix, the eigenvector solved from its first row, and numerical derivatives;
# Problem 4 solves the characteristic equation numerically and checks that the three amplitudes satisfy the
# Schrödinger equation (numerical time derivatives) and that the probabilities add up to one; Problem 5 turns the
# classical spin vector (first about x, then about z); Problem 6 uses the determinant of the rotation matrix and
# the coefficients of the product states.

page: content/year-3/8.05/8-05-problem-set-9.mdx
calcs:
  # ---- Introduction

  - id: points-mit
    where: 'How to answer: MIT''s points, 10 + 10 + 15 + 15 + 5 + 10'
    formula: |-
      10 + 10 + 15 + 15 + 5 + 10
    expected: '65'
    shown: ['65 points in all']
    source: {cite: mit, at: 'Problems 1 to 6, pp. 1–3'}
    origin: mit

  # ---- Problem 1: the spin vector in the state along n

  - id: p1-sx
    kind: identity
    answer: p1-sx
    where: 'Problem 1(a), answer box: ⟨S_x⟩ from the two amplitudes cos(θ₀/2) and sin(θ₀/2)e^(iφ₀): (ħ/2) times twice the real part of their product'
    formula: |-
      hbar/2*sin(th)*cos(ph)
    equals: |-
      hbar/2*2*cos(th/2)*sin(th/2)*cos(ph)
    samples:
      hbar: [0.5, 0.9, 1.3, 1.7, 2.0]
      th: [0.3, 0.6, 0.9, 1.2, 1.4]
      ph: [1.2, 0.9, 0.7, 0.5, 0.3]
    tolerance: 1e-12
    shown: ['id="p1-sx"', '<Formula label="The expectation value of the x component"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-sy
    kind: identity
    where: 'Problem 1(a): ⟨S_y⟩ from the amplitudes: (ħ/2) times twice the imaginary part of their product'
    formula: |-
      hbar/2*sin(th)*sin(ph)
    equals: |-
      hbar/2*2*cos(th/2)*sin(th/2)*sin(ph)
    samples:
      hbar: [0.5, 0.9, 1.3, 1.7, 2.0]
      th: [0.3, 0.6, 0.9, 1.2, 1.4]
      ph: [1.2, 0.9, 0.7, 0.5, 0.3]
    tolerance: 1e-12
    shown: ['<Formula label="The expectation value of the y component"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-sz
    kind: identity
    answer: p1-sz
    where: 'Problem 1(a), answer box: ⟨S_z⟩ as +ħ/2 times the probability of up plus −ħ/2 times the probability of down'
    formula: |-
      hbar/2*cos(th)
    equals: |-
      hbar/2*cos(th/2)**2 - hbar/2*sin(th/2)**2
    samples:
      hbar: [0.5, 0.9, 1.3, 1.7, 2.0]
      th: [0.3, 0.6, 0.9, 1.2, 1.4]
    tolerance: 1e-12
    shown: ['id="p1-sz"', '<Formula label="The expectation value of the z component"']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-length
    kind: identity
    where: 'Problem 1(a), check: the length of the vector of expectation values is ħ/2 for every direction'
    formula: |-
      sqrt((hbar/2*sin(th)*cos(ph))**2 + (hbar/2*sin(th)*sin(ph))**2 + (hbar/2*cos(th))**2)
    equals: |-
      hbar/2
    samples:
      hbar: [0.5, 0.9, 1.3, 1.7, 2.0]
      th: [0.3, 0.6, 0.9, 1.2, 1.4]
      ph: [1.2, 0.9, 0.7, 0.5, 0.3]
    tolerance: 1e-12
    shown: ['The length of the vector is $\frac{\hbar}{2}$ for every direction.']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nx
    where: 'Problem 1(b): x component of n for θ₀ = 50°, φ₀ = 20°'
    formula: |-
      sin(50*pi/180)*cos(20*pi/180)
    expected: '0.720'
    tolerance: 0.0005
    shown: ['$\vec n = (0.720,\ 0.262,\ 0.643)$']
    source: {cite: reading1, at: 'eq. (4.67)'}
    origin: page-own

  - id: p1-ny
    where: 'Problem 1(b): y component of n for θ₀ = 50°, φ₀ = 20°'
    formula: |-
      sin(50*pi/180)*sin(20*pi/180)
    expected: '0.262'
    tolerance: 0.0005
    shown: ['$\vec n = (0.720,\ 0.262,\ 0.643)$']
    source: {cite: reading1, at: 'eq. (4.67)'}
    origin: page-own

  - id: p1-nz
    where: 'Problem 1(b): z component of n for θ₀ = 50°'
    formula: |-
      cos(50*pi/180)
    expected: '0.643'
    tolerance: 0.0005
    shown: ['$\vec n = (0.720,\ 0.262,\ 0.643)$']
    source: {cite: reading1, at: 'eq. (4.67)'}
    origin: page-own

  - id: p1-npx
    where: 'Problem 1(b): x component of n′ for the polar angle 80° and the azimuthal angle 80°'
    formula: |-
      sin(80*pi/180)*cos(80*pi/180)
    expected: '0.171'
    tolerance: 0.0005
    shown: ['$\vec n'' = (0.171,\ 0.970,\ 0.174)$']
    source: {cite: reading1, at: 'eq. (4.67)'}
    origin: page-own

  - id: p1-npy
    where: 'Problem 1(b): y component of n′'
    formula: |-
      sin(80*pi/180)*sin(80*pi/180)
    expected: '0.970'
    tolerance: 0.0005
    shown: ['$\vec n'' = (0.171,\ 0.970,\ 0.174)$']
    source: {cite: reading1, at: 'eq. (4.67)'}
    origin: page-own

  - id: p1-npz
    where: 'Problem 1(b): z component of n′'
    formula: |-
      cos(80*pi/180)
    expected: '0.174'
    tolerance: 0.0005
    shown: ['$\vec n'' = (0.171,\ 0.970,\ 0.174)$']
    source: {cite: reading1, at: 'eq. (4.67)'}
    origin: page-own

  - id: p1-prod-x
    where: 'Problem 1(b): the product of the x components'
    formula: |-
      sin(50*pi/180)*cos(20*pi/180)*sin(80*pi/180)*cos(80*pi/180)
    expected: '0.123'
    tolerance: 0.0005
    shown: ['= 0.123 + 0.254 + 0.112 = 0.489$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-prod-y
    where: 'Problem 1(b): the product of the y components'
    formula: |-
      sin(50*pi/180)*sin(20*pi/180)*sin(80*pi/180)*sin(80*pi/180)
    expected: '0.254'
    tolerance: 0.0005
    shown: ['= 0.123 + 0.254 + 0.112 = 0.489$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-prod-z
    where: 'Problem 1(b): the product of the z components'
    formula: |-
      cos(50*pi/180)*cos(80*pi/180)
    expected: '0.112'
    tolerance: 0.0005
    shown: ['= 0.123 + 0.254 + 0.112 = 0.489$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-dot
    where: 'Problem 1(b): n · n′ from the angles, sin θ₀ sin θ′ cos(φ₀ − φ′) + cos θ₀ cos θ′'
    formula: |-
      sin(50*pi/180)*sin(80*pi/180)*cos((20 - 80)*pi/180) + cos(50*pi/180)*cos(80*pi/180)
    expected: '0.489'
    tolerance: 0.0005
    shown: ['= 0.123 + 0.254 + 0.112 = 0.489$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-num
    answer: p1-num
    where: 'Problem 1(b), answer box: ⟨S · n′⟩ in units of ħ, half the dot product of the two unit vectors, from their components'
    formula: |-
      (sin(50*pi/180)*cos(20*pi/180)*sin(80*pi/180)*cos(80*pi/180) + sin(50*pi/180)*sin(20*pi/180)*sin(80*pi/180)*sin(80*pi/180) + cos(50*pi/180)*cos(80*pi/180))/2
    expected: '0.244'
    tolerance: 0.0005
    shown: ['id="p1-num"', '= 0.244\,\hbar$']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own numbers)'}
    origin: page-own

  - id: p1-half-angle
    kind: identity
    where: 'Problem 1(b), check: +ħ/2 with probability cos²(γ/2) and −ħ/2 with probability sin²(γ/2) average to (ħ/2) cos γ'
    formula: |-
      hbar/2*(cos(gam/2)**2 - sin(gam/2)**2)
    equals: |-
      hbar/2*cos(gam)
    samples:
      hbar: [0.5, 0.9, 1.3, 1.7, 2.0]
      gam: [0.2, 0.9, 1.6, 2.3, 3.0]
    tolerance: 1e-12
    shown: ['= \frac{\hbar}{2}\cos\gamma$ for two directions an angle $\gamma$ apart']
    source: {cite: mit, at: 'Problem 1, p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: an infinitesimal rotation

  - id: p2-sy
    answer: p2-sy
    where: 'Problem 2(b), answer box: ⟨S_y⟩ in units of ħ after an exact turn of the x axis through 0.0200 rad about z, (1/2) sin ε'
    formula: |-
      sin(0.0200)/2
    expected: '0.0100'
    tolerance: 0.00001
    shown: ['id="p2-sy"', '= \frac{\hbar}{2}\sin(0.0200) = 0.0100\,\hbar$ to three figures']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-sy-first
    where: 'Problem 2(b): the first-order value, (1/2) × 0.0200'
    formula: |-
      0.0200/2
    expected: '0.0100'
    tolerance: 1e-12
    shown: ['= \frac{\hbar}{2}\times 0.0200 = 0.0100\,\hbar$']
    source: {cite: mit, at: 'Problem 2(b), p. 1 (our own numbers)'}
    origin: page-own

  - id: p2-first-order
    where: 'Problem 2(a), check: the first-order part of S_x cos α − S_y sin α has the coefficient −1 in front of S_y (derivative of −sin α at 0)'
    formula: |-
      deriv('-sin(u)', 'u', 0)
    expected: '-1'
    tolerance: 1e-8
    shown: ['its first-order part is $S_x - \alpha\,S_y$']
    source: {cite: mit, at: 'Problem 2(a), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 3: ammonia in an electric field

  - id: p3-k
    kind: identity
    answer: p3-k
    where: 'Problem 3(a), answer box: K from the determinant of H, det H = −K² for a traceless Hermitian 2 × 2 matrix'
    formula: |-
      sqrt(D**2 + (mu*F)**2)
    equals: |-
      sqrt(-((mu*F)*(-mu*F) - (-D)*(-D)))
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      mu: [1.5, 1.2, 1.0, 0.8, 0.5]
      F: [0.3, 0.5, 0.8, 1.0, 1.2]
    tolerance: 1e-12
    shown: ['id="p3-k"', '<Formula label="The constant and the direction for ammonia"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-cos
    kind: identity
    answer: p3-cos
    where: 'Problem 3(a), answer box: cos θ for a vector in the xz-plane with the components (Δ, −μF): θ = π − arctan(Δ/μF)'
    formula: |-
      -mu*F/sqrt(D**2 + (mu*F)**2)
    equals: |-
      cos(pi - atan(D/(mu*F)))
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      mu: [1.5, 1.2, 1.0, 0.8, 0.5]
      F: [0.3, 0.5, 0.8, 1.0, 1.2]
    tolerance: 1e-12
    shown: ['id="p3-cos"', '<Formula label="The polar angle for ammonia"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-sin
    kind: identity
    where: 'Problem 3(a): sin θ for the same vector'
    formula: |-
      D/sqrt(D**2 + (mu*F)**2)
    equals: |-
      sin(pi - atan(D/(mu*F)))
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      mu: [1.5, 1.2, 1.0, 0.8, 0.5]
      F: [0.3, 0.5, 0.8, 1.0, 1.2]
    tolerance: 1e-12
    shown: ['<Formula label="The polar angle for ammonia"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eg
    kind: identity
    answer: p3-eg
    where: 'Problem 3(b), answer box: the lower root of the characteristic equation λ² − Δ² − μ²F² = 0, found numerically'
    formula: |-
      -sqrt(D**2 + (mu*F)**2)
    equals: |-
      solve('x**2 - D**2 - (mu*F)**2', 'x', -100, 0)
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      mu: [1.5, 1.2, 1.0, 0.8, 0.5]
      F: [0.3, 0.5, 0.8, 1.0, 1.2]
    tolerance: 1e-9
    shown: ['id="p3-eg"', '<Formula label="The two energies of ammonia in a field"']
    source: {cite: reading2, at: 'eq. (5.3), with the constant energy set to zero'}
    origin: page-own

  - id: p3-amp
    kind: identity
    answer: p3-amp
    where: 'Problem 3(b), answer box: the first component of the normalized eigenvector solved from the first row of (H + K)v = 0, v ∝ (sin θ, 1 − cos θ), with μF = −K cos θ and Δ = K sin θ'
    formula: |-
      cos(th/2)
    equals: |-
      sin(th)/sqrt(sin(th)**2 + (1 - cos(th))**2)
    samples:
      th: [1.7, 2.0, 2.3, 2.7, 3.0]
    tolerance: 1e-12
    shown: ['id="p3-amp"', '<Formula label="Ground and excited state of ammonia in a field"']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eig-top
    kind: identity
    where: 'Problem 3(b), check: the top entry, cos θ cos(θ/2) + sin θ sin(θ/2) = cos(θ/2)'
    formula: |-
      cos(th)*cos(th/2) + sin(th)*sin(th/2)
    equals: |-
      cos(th/2)
    samples:
      th: [1.7, 2.0, 2.3, 2.7, 3.0]
    tolerance: 1e-12
    shown: ['= -K\cos\frac{\theta}{2}$, and the bottom entry']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eig-bottom
    kind: identity
    where: 'Problem 3(b), check: the bottom entry, sin θ cos(θ/2) − cos θ sin(θ/2) = sin(θ/2)'
    formula: |-
      sin(th)*cos(th/2) - cos(th)*sin(th/2)
    equals: |-
      sin(th/2)
    samples:
      th: [1.7, 2.0, 2.3, 2.7, 3.0]
    tolerance: 1e-12
    shown: ['= -K\sin\frac{\theta}{2}$. So the column is an eigenvector']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-down-weak
    where: 'Problem 3(c), check: the probability of nitrogen down in the ground state without a field, sin²(π/4)'
    formula: |-
      sin(pi/4)**2
    expected: '0.5'
    tolerance: 1e-12
    shown: ['which rises from $\frac{1}{2}$ to 1']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-down-strong
    where: 'Problem 3(c), check: the same probability in a strong field, sin²(π/2)'
    formula: |-
      sin(pi/2)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['which rises from $\frac{1}{2}$ to 1']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-shift
    kind: identity
    answer: p3-shift
    where: 'Problem 3(d), answer box: the second-order term of √(Δ² + μ²F²) in the field, from its numerical second derivative at F = 0'
    formula: |-
      (mu*F)**2/(2*D)
    equals: |-
      F**2/2*deriv('sqrt(D**2 + (mu*x)**2)', 'x', 0, 2)
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      mu: [1.5, 1.2, 1.0, 0.8, 0.5]
      F: [0.3, 0.5, 0.8, 1.0, 1.2]
    tolerance: 1e-6
    shown: ['id="p3-shift"', '<Formula label="The energies for weak and strong fields"']
    source: {cite: reading2, at: 'eq. (5.4), with the constant energy set to zero'}
    origin: page-own

  - id: p3-exact-at-one
    where: 'Problem 3(d), check: the exact ground energy at μF = Δ, in units of Δ'
    formula: |-
      -sqrt(1 + 1)
    expected: '-1.414'
    tolerance: 0.0005
    shown: ['$-\sqrt{2}\,\Delta = -1.414\,\Delta$']
    source: {cite: mit, at: 'Problem 3(d), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-weak-at-one
    where: 'Problem 3(d), check: the weak-field formula at μF = Δ, in units of Δ'
    formula: |-
      -(1 + 1/2)
    expected: '-1.5'
    tolerance: 1e-12
    shown: ['the weak-field formula gives $-1.5\,\Delta$']
    source: {cite: mit, at: 'Problem 3(d), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-weak-error
    where: 'Problem 3(d), check: the relative error of the weak-field formula at μF = Δ, in per cent'
    formula: |-
      (1.5 - sqrt(2))/sqrt(2)*100
    expected: '6'
    tolerance: 0.5
    shown: ['already off by 6 per cent there']
    source: {cite: mit, at: 'Problem 3(d), p. 2 (our own numbers)'}
    origin: page-own

  - id: p3-pup
    kind: identity
    answer: p3-pup
    where: 'Problem 3(e), answer box: the probability (1 + n_z)/2 for a spin direction with the z component −cos(2Δt/ħ)'
    formula: |-
      sin(D*t/hbar)**2
    equals: |-
      (1 - cos(2*D*t/hbar))/2
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      t: [0.1, 0.25, 0.4, 0.55, 0.7]
      hbar: [2.0, 1.7, 1.4, 1.1, 0.8]
    tolerance: 1e-12
    shown: ['id="p3-pup"', '<Formula label="The probability of nitrogen up without a field"']
    source: {cite: mit, at: 'Problem 3(e), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-first-motion
    kind: identity
    where: 'Problem 3(e): the y component of the direction (0, −sin(2Δt/ħ), −cos(2Δt/ħ)) starts with the slope −2Δ/ħ, the y component of ω × (−z) for ω = −(2Δ/ħ) x'
    formula: |-
      deriv('-sin(2*D*s/hbar)', 's', 0)
    equals: |-
      -2*D/hbar
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      hbar: [2.0, 1.7, 1.4, 1.1, 0.8]
    tolerance: 1e-7
    shown: ['<Formula label="The direction of the ammonia state without a field"']
    source: {cite: mit, at: 'Problem 3(e), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-period
    kind: identity
    where: 'Problem 3(e): the time for a full turn of the spin direction, 2π divided by the angular speed 2Δ/ħ'
    formula: |-
      2*pi/(2*D/hbar)
    equals: |-
      pi*hbar/D
    samples:
      D: [0.5, 0.9, 1.3, 1.7, 2.0]
      hbar: [2.0, 1.7, 1.4, 1.1, 0.8]
    tolerance: 1e-12
    shown: ['with the period $\frac{\pi\hbar}{\Delta}$']
    source: {cite: mit, at: 'Problem 3(e), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 4: three states

  - id: p4-low
    kind: identity
    answer: p4-low
    where: 'Problem 4(a), answer box: the lowest root of the characteristic equation; the factor (E_O − λ)(E_C − λ) − 2Δ² of the 3 × 3 determinant is solved numerically below E_O'
    formula: |-
      (EO + EC)/2 - sqrt((EO - EC)**2/4 + 2*D**2)
    equals: |-
      solve('(EO - x)*(EC - x) - 2*D**2', 'x', -100, EO)
    samples:
      EO: [1.0, 1.2, 1.5, 1.8, 2.0]
      EC: [4.0, 3.5, 3.0, 2.8, 2.5]
      D: [0.5, 0.8, 1.0, 1.3, 1.5]
    tolerance: 1e-9
    shown: ['id="p4-low"', '<Formula label="The energy levels of the carbon dioxide ion"']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-high
    kind: identity
    where: 'Problem 4(a): the highest root of the same factor, solved numerically above E_C'
    formula: |-
      (EO + EC)/2 + sqrt((EO - EC)**2/4 + 2*D**2)
    equals: |-
      solve('(EO - x)*(EC - x) - 2*D**2', 'x', EC, 100)
    samples:
      EO: [1.0, 1.2, 1.5, 1.8, 2.0]
      EC: [4.0, 3.5, 3.0, 2.8, 2.5]
      D: [0.5, 0.8, 1.0, 1.3, 1.5]
    tolerance: 1e-9
    shown: ['<Formula label="The energy levels of the carbon dioxide ion"']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-trace
    kind: identity
    where: 'Problem 4(a), check: the three energies add up to the trace 2E_O + E_C'
    formula: |-
      EO + ((EO + EC)/2 + sqrt((EO - EC)**2/4 + 2*D**2)) + ((EO + EC)/2 - sqrt((EO - EC)**2/4 + 2*D**2))
    equals: |-
      2*EO + EC
    samples:
      EO: [1.0, 1.2, 1.5, 1.8, 2.0]
      EC: [4.0, 3.5, 3.0, 2.8, 2.5]
      D: [0.5, 0.8, 1.0, 1.3, 1.5]
    tolerance: 1e-12
    shown: ['The three energies add up to $2E_O + E_C$, the trace of the matrix.']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-split
    kind: identity
    answer: p4-split
