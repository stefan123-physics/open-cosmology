  # ---- Problem 5: NMR at resonance

  - id: p5-theta
    kind: identity
    answer: p5-theta
    where: 'Problem 5(a), answer box: the polar angle from the sizes of the two amplitudes, θ = 2 arctan(sin(γB₁t/2)/cos(γB₁t/2))'
    formula: |-
      g*B1*t
    equals: |-
      2*atan(sin(g*B1*t/2)/cos(g*B1*t/2))
    samples:
      g: [0.5, 0.8, 1.0, 1.3, 1.5]
      B1: [0.8, 0.6, 0.5, 0.3, 0.2]
      t: [0.2, 0.5, 0.8, 1.2, 1.5]
    tolerance: 1e-12
    shown: ['id="p5-theta"', '<Formula label="The direction of the spin in NMR at resonance"']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-phi
    kind: identity
    answer: p5-phi
    where: 'Problem 5(a), answer box: the classical picture. The vector (0, sin θ, cos θ) of the rotating frame, turned about z through −ω₀t, has x ∝ sin ω₀t and y ∝ cos ω₀t, so φ = arctan(cos ω₀t / sin ω₀t) while ω₀t is below π/2'
    formula: |-
      pi/2 - g*B0*t
    equals: |-
      atan(cos(g*B0*t)/sin(g*B0*t))
    samples:
      g: [0.5, 0.8, 1.0, 1.3, 1.5]
      B0: [2.0, 1.5, 1.0, 0.7, 0.5]
      t: [0.2, 0.5, 0.8, 1.2, 1.5]
    tolerance: 1e-12
    shown: ['id="p5-phi"', '<Formula label="The direction of the spin in NMR at resonance"']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-spiral
    kind: identity
    answer: p5-spiral
    where: 'Problem 5(b), answer box: φ at the time t = θ/(γB₁)'
