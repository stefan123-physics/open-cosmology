# Calculations on content/year-3/8.05/adjoints-hermitian-operators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 8 transcript and Zwiebach's notes chapter 3, with the page's own example.
# Complex numbers are checked through their real and imaginary parts.

page: content/year-3/8.05/adjoints-hermitian-operators.mdx
calcs:
  - id: functional-example
    kind: identity
    where: 'lecture example: 3v1 − v2 + 7v3 equals the dot product of (3, −1, 7) with v'
    formula: 3*v1 - v2 + 7*v3
    equals: 3*v1 + (-1)*v2 + 7*v3
    samples: {v1: [0.5, -2.0], v2: [1.0, 3.0], v3: [-1.5, 0.25]}
    tolerance: 1e-12
    shown: ['u = (3, -1, 7)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: polarisation-real-part
    kind: identity
    where: 'eq. (7.25) checked with real numbers: (u+v)A(u+v) − (u−v)A(u−v) = 2uAv + 2vAu, with A = [[p, q], [r, s]] and u = (u1, 0), v = (0, v2)'
    formula: (p*u1**2 + (q + r)*u1*v2 + s*v2**2) - (p*u1**2 - (q + r)*u1*v2 + s*v2**2)
    equals: 2*q*u1*v2 + 2*r*u1*v2
    samples: {p: [1.0, -2.0], q: [0.5, 3.0], r: [-1.0, 2.0], s: [4.0, 0.3], u1: [1.0, -0.5], v2: [2.0, 0.7]}
    tolerance: 1e-9
    shown: ['$2(u, Tv) + 2(v, Tu)$']
    source: {cite: reading2, at: 'eq. (7.25)'}
    origin: mit

  - id: quiz-functional
    where: 'quiz 1: u2* = −i, so u2 = conj(−i) = i; imaginary part of u2'
    inputs: {}
    formula: -(-1)
    expected: '1'
    tolerance: 0
    shown: ['giving $u = (2, i)$']
    source: {cite: reading2, at: 'eq. (6.5)'}
    origin: page-own

  - id: ex-adjoint-entry
    where: 'example (a): conj(2i·conj(u1)) = −2i·u1; imaginary coefficient −2'
    inputs: {}
    formula: -(2)
    expected: '-2'
    tolerance: 0
    shown: ['namely $-2iu_1 + 3u_2$']
    source: {cite: reading2, at: 'eq. (6.22)'}
    origin: page-own

  - id: ex-Hv-first
    where: 'example (b): 2 + (1 − i)i = 2 + i + 1: real part 3, imaginary part 1'
    inputs: {}
    formula: 2 + 1
    expected: '3'
    tolerance: 0
    shown: ['$Hv = (2 + (1 - i)i,\; (1 + i) + 3i) = (3 + i,\; 1 + 4i)$']
    source: {cite: reading2, at: 'eq. (7.28)'}
    origin: page-own

  - id: ex-expectation
    where: 'example (b): 1·(3 + i) + (−i)(1 + 4i) = 3 + i − i + 4; real part 3 + 4, imaginary part 1 − 1 = 0'
    inputs: {}
    formula: 3 + 4
    expected: '7'
    tolerance: 0
    shown: ['$(v, Hv) = 1 \cdot (3 + i) + (-i)(1 + 4i) = 3 + i - i + 4 = 7$']
    source: {cite: reading2, at: 'eq. (7.28)'}
    origin: page-own

  - id: ex-expectation-imag
    where: 'example (b): imaginary part of (v, Hv): 1 − 1'
    inputs: {}
    formula: 1 - 1
    expected: '0'
    tolerance: 0
    shown: ['a real number, as it must be for a Hermitian operator']
    source: {cite: reading2, at: 'eq. (7.28)'}
    origin: page-own
