    expected: '5350'
    tolerance: 1e-12
    shown: ['\pi/5350']
    source: {cite: reading2, at: 'eq. (6.40)'}
    origin: page-own

  - id: ex-turns
    where: 'example (b): f0 × T, turns about z during the pulse'
    inputs: {}
    formula: (2.675e8*2.0/(2*pi))*(pi/(2*2675))
    expected: '5.0e4'
    tolerance: '1%'
    shown: ['\approx 5.0 \times 10^{4}$ times']
    source: {cite: reading2, at: 'p. 20'}
    origin: page-own

  - id: ex-delta-b
    where: 'example (c): 0.010 T/m × 0.0005 m'
    inputs: {}
    formula: 0.010*0.0005
    expected: '5e-6'
    tolerance: 1e-9
    shown: ['= 5 \times 10^{-6}$ T']
    source: {cite: reading2, at: 'p. 21'}
    origin: page-own

  - id: ex-delta-f
    where: 'example (c): γ ΔB / 2π in Hz'
    inputs: {}
    formula: 2.675e8*5e-6/(2*pi)
    expected: '213'
    tolerance: 0.5
    shown: ['\approx 213$ Hz']
    source: {cite: reading2, at: 'p. 21'}
    origin: page-own

  - id: ex-three-spins
    where: 'example (d): 2 × 2 × 2'
    inputs: {}
    formula: 2*2*2
    expected: '8'
    tolerance: 1e-12
    shown: ['2 \times 2 \times 2 = 8']
    source: {cite: reading3, at: 'eq. (1.6)'}
    origin: page-own

  - id: ex-three-spins-list
    where: 'example (d): 2 + 2 + 2'
    inputs: {}
    formula: 2 + 2 + 2
    expected: '6'
    tolerance: 1e-12
    shown: ['2 + 2 + 2 = 6']
