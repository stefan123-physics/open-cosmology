# Calculations on content/year-3/8.05/nmr-tensor-products.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 18 transcript and Zwiebach's notes chapters 7 and 8, with the page's own example.

page: content/year-3/8.05/nmr-tensor-products.mdx
calcs:
  - id: commutator-cancels
    kind: identity
    where: 'dM/dt, coefficient of S_y: the commutator gives (−iω/ħ)(iħ cos ωt) = ω cos ωt, the middle term −ω cos ωt; they cancel (the S_x coefficients cancel the same way)'
    formula: (om/hb)*hb*cos(om*tt) - om*cos(om*tt)
    equals: 0
    samples: {om: [1.3, 2.7], tt: [0.4, 1.9], hb: [0.7, 1.1]}
    tolerance: 1e-12
    shown: ['\frac{dM}{dt} = 0']
    source: {cite: reading2, at: 'eq. (6.30)'}
    origin: mit

  - id: effective-field-z
    kind: identity
    where: 'H_R: (ω − γB0) S_z = −γ B0 (1 − ω/ω0) S_z with ω0 = γB0'
    formula: om - gam*b0
    equals: -gam*b0*(1 - om/(gam*b0))
    samples: {om: [0.5, 3.0], gam: [1.5, 2.2], b0: [0.8, 2.0]}
    tolerance: 1e-12
    shown: ['B_0\left(1 - \frac{\omega}{\omega_0}\right)\hat z']
    source: {cite: reading2, at: 'eqs. (6.32)–(6.33)'}
    origin: mit

  - id: no-rf-limit
    kind: identity
    where: 'B1 = 0: phases ω t + γ B0 (1 − ω/ω0) t add up to ω0 t'
    formula: om*tt + gam*b0*(1 - om/(gam*b0))*tt
    equals: gam*b0*tt
    samples: {om: [0.5, 3.0], gam: [1.5, 2.2], b0: [0.8, 2.0], tt: [0.3, 1.7]}
    tolerance: 1e-12
    shown: ['e^{i\omega_0tS_z/\hbar}']
    source: {cite: reading2, at: 'notes p. 19, exercise'}
    origin: page-own

  - id: scanner-field
    kind: fact
    where: 'typical MRI field about 2 T, 20,000 gauss'
    value: '2 T'
    shown: ['about 2 tesla (20,000 gauss)']
    source: {cite: reading2, at: 'p. 21'}
    origin: mit

  - id: tesla-gauss
    where: '2 T in gauss'
    inputs: {}
    formula: 2*1e4
    expected: '20000'
    tolerance: 1e-9
    shown: ['20,000 gauss']
    source: {cite: reading2, at: 'p. 21'}
    origin: mit

  - id: helium-boiling
    kind: fact
    where: 'liquid helium boils at about 4.2 K at atmospheric pressure (correcting the lecture''s 3 kelvin)'
    value: '4.2 K'
    shown: ['about 4.2 kelvin']
    source: {cite: reading1, at: 'p. 13 (lecture says 3 kelvin); standard value 4.22 K'}
    origin: page-own

  - id: nobel-nmr
    kind: fact
    where: 'Purcell and Bloch, Nobel Prize 1952'
    value: 1952
    shown: ['1952 Nobel Prize']
    source: {cite: reading2, at: 'p. 20'}
    origin: mit

  - id: first-human-mri
    kind: fact
    where: 'first human MRI studies 1977'
    value: 1977
    shown: ['came in 1977']
    source: {cite: reading2, at: 'p. 20'}
    origin: mit

  - id: resolution
    kind: fact
    where: 'MRI resolution about half a millimetre'
    value: '0.5 mm'
    shown: ['about half a millimetre']
    source: {cite: reading2, at: 'p. 21'}
    origin: mit

  - id: dims-4-10
    where: 'dimension of a 4-dim space tensor a 10-dim space'
    inputs: {}
    formula: 4*10
    expected: '40'
    tolerance: 1e-12
    shown: ['40-dimensional tensor product']
    source: {cite: reading1, at: 'p. 20'}
    origin: mit

  - id: dims-sum
    where: 'not 14 = 4 + 10'
    inputs: {}
    formula: 4 + 10
    expected: '14'
    tolerance: 1e-12
    shown: ['not 14']
    source: {cite: reading1, at: 'p. 20'}
    origin: page-own

  - id: two-spins-dim
    where: 'two spin-1/2: 2 × 2'
    inputs: {}
    formula: 2*2
    expected: '4'
    tolerance: 1e-12
    shown: ['4-dimensional complex vector space']
    source: {cite: reading3, at: 'eq. (1.14)'}
    origin: mit

  - id: sz-total-up-up
    where: 'S_z total on ++: ħ/2 + ħ/2 = ħ (in units of ħ)'
    inputs: {}
    formula: 1/2 + 1/2
    expected: '1'
    tolerance: 1e-12
    shown: ['\hbar\left(\alpha_1']
    source: {cite: reading3, at: 'eq. (1.18)'}
    origin: mit

  - id: sz-total-mixed
    where: 'S_z total on +− and −+: ħ/2 − ħ/2 = 0, so the mixed terms cancel'
    inputs: {}
    formula: 1/2 - 1/2
    expected: '0'
    tolerance: 1e-12
    shown: ['the mixed terms cancel']
    source: {cite: reading3, at: 'eq. (1.19)'}
    origin: mit

  - id: ex-omega0
    where: 'example (a): ω0 = γ B0 = 2.675e8 × 2.0 rad/s'
    inputs: {}
    formula: 2.675e8*2.0
    expected: '5.350e8'
    tolerance: 1e-9
    shown: ['5.350 \times 10^{8}$ rad/s']
