# Calculations on content/year-3/8.05/photon-states-spin-precession.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 16 transcript and Zwiebach's notes chapters 6–7, with the page's own example.

page: content/year-3/8.05/photon-states-spin-precession.mdx
calcs:
  - id: mode-energy
    kind: identity
    where: 'energy of the mode: (1/2)(ε0 · (2/ε0V) ω² q² · V/2 + (2/ε0V)·ε0 p² · V/2) = (1/2)(p² + ω² q²), using the box average 1/2 of sin² and cos²'
    formula: 0.5*(eps*(2/(eps*V))*w**2*q**2*V/2 + eps*(2/(eps*V))*p**2*V/2)
    equals: 0.5*(p**2 + w**2*q**2)
    samples: {eps: [1.0, 8.85], V: [1.0, 3.0], w: [0.5, 2.0], q: [0.3, 1.2], p: [0.4, 2.0]}
    tolerance: 1e-9
    shown: ['E = \frac{1}{2}\left(p^2 + \omega^2q^2\right)']
    source: {cite: reading2, at: 'eq. (5.39)'}
    origin: mit

  - id: field-unit
    kind: identity
    where: 'E0 from sqrt(2/ε0V) ω sqrt(hbar/2ω) = sqrt(hbar ω/ε0V)'
    formula: sqrt(2/(eps*V))*w*sqrt(hbar/(2*w))
    equals: sqrt(hbar*w/(eps*V))
    samples: {eps: [1.0, 8.85], V: [1.0, 3.0], w: [0.5, 2.0], hbar: [1.0, 0.3]}
    tolerance: 1e-12
    shown: ['E_0 = \sqrt{\frac{\hbar\omega}{\epsilon_0V}}']
    source: {cite: reading2, at: 'eq. (5.46)'}
    origin: mit

  - id: precession-phase
    kind: identity
    where: 'factoring e^{iγBt/2} from e^{−iγBt/2} leaves e^{−iγBt}: phases add, (−γBt/2) − (γBt/2) = −γBt'
    formula: -g*B*t/2 - g*B*t/2
    equals: -g*B*t
    samples: {g: [0.5, 2.0], B: [0.3, 1.5], t: [0.2, 1.1]}
    tolerance: 1e-12
    shown: ['e^{i(\phi_0 - \gamma Bt)}\chi_{z-}']
    source: {cite: reading3, at: 'eq. (2.15)'}
    origin: mit

  - id: ex-g
    where: 'example (a): |g| = sqrt(1 + 1 + 1)'
    inputs: {}
    formula: sqrt(3)
    expected: '1.732'
    tolerance: 0.0005
    shown: ['$g = \sqrt{3}\,\varepsilon$']
    source: {cite: reading3, at: 'eq. (3.30)'}
    origin: page-own

  - id: ex-e-plus
    where: 'example (a): 2 + sqrt(3)'
    inputs: {}
    formula: 2 + sqrt(3)
    expected: '3.73'
    tolerance: 0.005
    shown: ['about $3.73\varepsilon$']
    source: {cite: reading3, at: 'eq. (3.34)'}
    origin: page-own

  - id: ex-e-minus
    where: 'example (a): 2 − sqrt(3)'
    inputs: {}
    formula: 2 - sqrt(3)
    expected: '0.27'
    tolerance: 0.005
    shown: ['and $0.27\varepsilon$']
    source: {cite: reading3, at: 'eq. (3.34)'}
    origin: page-own

  - id: ex-splitting
    where: 'example (a): 2 sqrt(3)'
    inputs: {}
    formula: 2*sqrt(3)
    expected: '3.46'
    tolerance: 0.005
    shown: ['splitting $2\sqrt{3}\,\varepsilon \approx 3.46\varepsilon$']
    source: {cite: reading3, at: 'eq. (3.34)'}
    origin: page-own

  - id: ex-photons
    where: 'example (b): |α| = 20/2, mean number |α|²'
    inputs: {}
    formula: (20/2)**2
    expected: '100'
    tolerance: 0
    shown: ['on average $|\alpha|^2 = 100$ photons']
    source: {cite: reading2, at: 'eq. (5.51)'}
    origin: page-own

  - id: ex-relative-spread
    where: 'example (b): ΔN/<N> = 10/100'
    inputs: {}
    formula: 10/100*100
    expected: '10'
    tolerance: 0
    shown: ['a 10% uncertainty in the number']
    source: {cite: reading2, at: 'eq. (4.99)'}
    origin: page-own
