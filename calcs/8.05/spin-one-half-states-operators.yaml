# Calculations on content/year-3/8.05/spin-one-half-states-operators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013, Zwiebach) Lecture 4 transcript and notes chapter 2, with the page's own example.

page: content/year-3/8.05/spin-one-half-states-operators.mdx
calcs:
  - id: half-angle
    kind: identity
    where: '(1 − cos θ)/sin θ equals tan(θ/2)'
    formula: (1 - cos(t))/sin(t)
    equals: tan(t/2)
    samples: {t: [0.2, 3.0]}
    tolerance: 1e-12
    shown: ['= e^{i\phi}\tan\frac{\theta}{2}\,c_1$']
    source: {cite: reading2, at: 'eq. (4.78)'}
    origin: mit

  - id: n-plus-eigen
    kind: identity
    where: 'first row of S_n χ_{n+} (φ = 0, ħ/2 = 1): cos θ cos(θ/2) + sin θ sin(θ/2) equals cos(θ/2)'
    formula: cos(t)*cos(t/2) + sin(t)*sin(t/2)
    equals: cos(t/2)
    samples: {t: [0.1, 3.0]}
    tolerance: 1e-12
    shown: ['\chi_{n+} = \cos\frac{\theta}{2}\,\chi_{z+} + \sin\frac{\theta}{2}\,e^{i\phi}\,\chi_{z-}, \qquad']
    source: {cite: reading2, at: 'eq. (4.81)'}
    origin: mit

  - id: ex-a-c1
    where: 'example (a): cos 30°'
    inputs: {}
    formula: cos(pi/6)
    expected: '0.866'
    tolerance: 0.0005
    shown: ['\approx 0.866\,\chi_{z+} + 0.5\,\chi_{z-}$']
    source: {cite: reading2, at: 'eq. (4.81)'}
    origin: page-own

  - id: ex-b-plus
    where: 'example (b): cos² 30°'
    inputs: {}
    formula: cos(pi/6)**2
    expected: '0.75'
    tolerance: 1e-9
    shown: ['$P(z+) = \cos^230° = 0.75$']
    source: {cite: reading2, at: 'eq. (4.81)'}
    origin: page-own

  - id: ex-b-minus
    where: 'example (b): sin² 30°'
    inputs: {}
    formula: sin(pi/6)**2
    expected: '0.25'
    tolerance: 1e-9
    shown: ['$P(z-) = \sin^230° = 0.25$']
    source: {cite: reading2, at: 'eq. (4.81)'}
    origin: page-own

  - id: ex-c
    where: 'example (c): (0.75 − 0.25)/2 in units of ħ'
    inputs: {}
    formula: (0.75 - 0.25)/2
    expected: '0.25'
    tolerance: 1e-9
    shown: ['(0.75 - 0.25) = 0.25\hbar']
    source: {cite: reading2, at: 'eq. (2.13)'}
    origin: page-own

  - id: ex-d-amp
    where: 'example (d): (cos 30° + sin 30°)/√2'
    inputs: {}
    formula: (cos(pi/6) + sin(pi/6))/sqrt(2)
    expected: '0.966'
    tolerance: 0.0005
    shown: ['(0.866 + 0.5) \approx 0.966$']
    source: {cite: reading2, at: 'eq. (2.32)'}
    origin: page-own

  - id: ex-d-prob
    where: 'example (d): square of the amplitude, equal to cos² 15°'
    inputs: {}
    formula: ((cos(pi/6) + sin(pi/6))/sqrt(2))**2
    expected: '0.933'
    tolerance: 0.0005
    shown: ['$P(x+) \approx 0.933 = \cos^2 15°$']
    source: {cite: reading2, at: 'eq. (2.32)'}
    origin: page-own
