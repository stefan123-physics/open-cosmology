  # ---- Problem 6: hyperfine levels in a magnetic field

  - id: p6-diag
    kind: identity
    answer: p6-diag
    where: 'Problem 6(a), answer box: the entry for |↑↓⟩ from the eigenvalues of S_ez (+ħ/2) and S_pz (−ħ/2): (2ε/ħ)(ħ/2) + (4ε′/ħ²)(ħ/2)(−ħ/2)'
    formula: |-
      eps - epp
    equals: |-
      2*eps*(1/2) + 4*epp*(1/2)*(-1/2)
    samples:
      eps: [0.5, 0.9, 1.3, 1.7, 2.0]
      epp: [2.0, 1.6, 1.2, 0.8, 0.5]
    tolerance: 1e-12
    shown: ['id="p6-diag"', '<Formula label="The Hamiltonian in the uncoupled basis"']
    source: {cite: mit, at: 'Problem 6(a), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-off
    kind: identity
    answer: p6-off
    where: 'Problem 6(a), answer box: the flip entry, (4ε′/ħ²) times ½ times the two ladder factors ħ each'
    formula: |-
      2*epp
    equals: |-
      4*epp*(1/2)*1*1
    samples:
      epp: [0.5, 0.8, 1.2, 1.6, 2.0]
    tolerance: 1e-12
    shown: ['id="p6-off"']
    source: {cite: reading2, at: 'eqs. (2.20) and (2.21)'}
    origin: page-own

  - id: p6-low
    kind: identity
    answer: p6-low
    where: 'Problem 6(a), answer box: the negative root of the characteristic equation of the 2 × 2 block, found numerically'
    formula: |-
      -epp - sqrt(eps**2 + 4*epp**2)
    equals: |-
      solve('(eps - epp - x)*(-eps - epp - x) - 4*epp**2', 'x', -100, 0)
    samples:
      eps: [0.5, 0.9, 1.3, 1.7, 2.0]
      epp: [2.0, 1.6, 1.2, 0.8, 0.5]
    tolerance: 1e-8
    shown: ['id="p6-low"', '<Formula label="The four energies of the hyperfine levels in a field"']
    source: {cite: mit, at: 'Problem 6(a), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-coupled-block
    kind: identity
    where: 'Problem 6(b): the coupled block with the diagonal ε′, −3ε′ and the off-diagonal ε has the same lower eigenvalue (root of its characteristic equation, numerically)'
    formula: |-
      -epp - sqrt(eps**2 + 4*epp**2)
    equals: |-
      solve('(epp - x)*(-3*epp - x) - eps**2', 'x', -100, -1.5)
    samples:
      eps: [0.5, 0.9, 1.3, 1.7, 2.0]
      epp: [2.0, 1.6, 1.2, 0.8, 0.5]
    tolerance: 1e-8
    shown: ['the same $E_2$ and $E_4$ as in part (a)']
    source: {cite: mit, at: 'Problem 6(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-mixel
    kind: identity
    answer: p6-mixel
    where: 'Problem 6(b), answer box: ⟨1,0|(2ε/ħ)S_ez|0,0⟩ from the two halves of the states: (2ε)(1/√2)(1/√2)(½ + ½)'
    formula: |-
      eps
    equals: |-
      2*eps*(1/sqrt(2))*(1/sqrt(2))*(1/2 + 1/2)
    samples:
      eps: [0.5, 0.9, 1.3, 1.7, 2.0]
    tolerance: 1e-12
    shown: ['id="p6-mixel"', '<Formula label="The Hamiltonian in the coupled basis"']
    source: {cite: mit, at: 'Problem 6(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-trace
    where: 'Problem 6(a), check: the four energies add up to zero (ε = 0.7, ε′ = 1)'
    formula: |-
      (1 + 0.7) + (-1 + sqrt(0.7**2 + 4)) + (1 - 0.7) + (-1 - sqrt(0.7**2 + 4))
    expected: '0'
    tolerance: 1e-12
    shown: ['The four energies add up to zero']
    source: {cite: mit, at: 'Problem 6(a), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-mix
    kind: identity
    answer: p6-mix
    where: 'Problem 6(d), answer box: the first-order mixing against the exact ratio (ρ − 2ε′)/ε of the eigenvector, at very weak fields where the next term (of order ε³) is below the tolerance'
    formula: |-
      eps/(4*epp)
    equals: |-
      (sqrt(eps**2 + 4*epp**2) - 2*epp)/eps
    samples:
      eps: [0.0005, 0.001, 0.002, 0.003, 0.004]
      epp: [2.0, 1.6, 1.2, 0.8, 1.0]
    tolerance: 1e-5
    shown: ['id="p6-mix"', '<Formula label="The eigenstates to first order in the field"']
    source: {cite: mit, at: 'Problem 6(d), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-rho-first
    where: 'Problem 6(d): ρ = √(ε² + 4ε′²) has no term of first order in ε (slope at ε = 0, with ε′ = 1)'
    formula: |-
      deriv('sqrt(s**2 + 4)', 's', 0)
    expected: '0'
    tolerance: 1e-7
    shown: ['with no term of first order']
    source: {cite: mit, at: 'Problem 6(d), p. 5 (our own solution)'}
    origin: page-own
