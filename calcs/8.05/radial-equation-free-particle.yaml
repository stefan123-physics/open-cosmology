# Calculations on content/year-3/8.05/radial-equation-free-particle.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 22 transcript and Zwiebach's notes chapter 9, with the page's own example.

page: content/year-3/8.05/radial-equation-free-particle.mdx
calcs:
  - id: power-roots
    kind: identity
    where: 's(s − 1) = l(l + 1) is solved by s = −l (and s = l + 1)'
    formula: (-ll)*(-ll - 1)
    equals: ll*(ll + 1)
    samples: {ll: [0, 1, 2, 3]}
    tolerance: 1e-12
    shown: ['so $s = l + 1$ or $s = -l$ (transcript']
    source: {cite: reading2, at: 'eq. (4.20)'}
    origin: mit

  - id: power-roots-upper
    kind: identity
    where: 's = l + 1 solves s(s − 1) = l(l + 1)'
    formula: (ll + 1)*(ll + 1 - 1)
    equals: ll*(ll + 1)
    samples: {ll: [0, 1, 2, 3]}
    tolerance: 1e-12
    shown: ['u_{El} \simeq c\,r^{l+1}']
    source: {cite: reading2, at: 'eq. (4.22)'}
    origin: mit

  - id: solid-angle
    where: 'total solid angle: ∫ sin θ dθ dφ = 2 × 2π = 4π'
    inputs: {}
    formula: 2*2*pi
    expected: '12.566'
    tolerance: 0.001
    shown: ['\int_{-1}^{1}d(\cos\theta)\int_0^{2\pi}d\phi']
    source: {cite: reading2, at: 'eq. (3.13)'}
    origin: page-own

  - id: multiplet-sizes
    where: '2l + 1 for l = 1, 2, 3: 3, 5, 7 (checked as their sum with l = 0)'
    inputs: {}
    formula: 1 + 3 + 5 + 7
    expected: '16'
    tolerance: 1e-12
    shown: ['$1 + 3 + 5 + 7 = 16$']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: hbar2-over-2me
    where: 'ħ²/2m_e in eV Å² from CODATA: ħc = 1973.27 eV Å, m_e c² = 510998.95 eV'
    inputs: {}
    formula: 1973.26980**2/(2*510998.950)
    expected: '3.81'
    tolerance: 0.005
    shown: ['$\hbar^2/2m_e = 3.81$ eV Å²']
    source: {cite: reading2, at: 'eq. (4.10)'}
    origin: page-own

  - id: ex-b-l1-square
    where: 'example (b): 3.81 × 2 / 13.6, in Å²'
    inputs: {}
    formula: 3.81*2/13.6
    expected: '0.560'
    tolerance: 0.0005
    shown: ['$r = \sqrt{0.560} \approx 0.75$ Å']
    source: {cite: reading2, at: 'eq. (4.10)'}
    origin: page-own

  - id: ex-b-l1
    where: 'example (b): √(3.81 × 2 / 13.6) Å'
    inputs: {}
    formula: sqrt(3.81*2/13.6)
    expected: '0.75'
    tolerance: 0.005
    shown: ['$r = \sqrt{0.560} \approx 0.75$ Å']
    source: {cite: reading2, at: 'eq. (4.10)'}
    origin: page-own

  - id: ex-b-l2-square
    where: 'example (b): 3.81 × 6 / 13.6, in Å²'
    inputs: {}
    formula: 3.81*6/13.6
    expected: '1.68'
    tolerance: 0.005
    shown: ['$r = \sqrt{1.68} \approx 1.30$ Å']
    source: {cite: reading2, at: 'eq. (4.10)'}
    origin: page-own

  - id: ex-b-l2
    where: 'example (b): √(3.81 × 6 / 13.6) Å'
    inputs: {}
    formula: sqrt(3.81*6/13.6)
    expected: '1.30'
    tolerance: 0.005
    shown: ['$r = \sqrt{1.68} \approx 1.30$ Å']
    source: {cite: reading2, at: 'eq. (4.10)'}
    origin: page-own

  - id: ex-b-bohr
    kind: fact
    where: 'Bohr radius 0.53 Å, for comparison'
    value: '0.529 Å'
    shown: ['of the order of the Bohr radius, 0.53 Å']
    source: {cite: reading2, at: 'eq. (7.76)'}
    origin: mit

  - id: ex-c-sin-small
    where: 'example (c): sin(0.1)/0.1'
    inputs: {}
    formula: sin(0.1)/0.1
    expected: '0.998334'
    tolerance: 0.0000005
    shown: ['$\sin(0.1)/0.1 = 0.998334$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-cos-small
    where: 'example (c): cos(0.1)'
    inputs: {}
    formula: cos(0.1)
    expected: '0.995004'
    tolerance: 0.0000005
    shown: ['$\cos(0.1) = 0.995004$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-rho-j1-small
    where: 'example (c): ρ j1(ρ) at ρ = 0.1'
    inputs: {}
    formula: sin(0.1)/0.1 - cos(0.1)
    expected: '0.003330'
    tolerance: 0.0000005
    shown: ['so $\rho\,j_1 = 0.003330$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-approx-small
    where: 'example (c): ρ²/3 at ρ = 0.1'
    inputs: {}
    formula: 0.1**2/3
    expected: '0.003333'
    tolerance: 0.0000005
    shown: ['$\rho^2/3 = 0.003333$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-agreement
    where: 'example (c): relative difference between ρ j1 and ρ²/3 at 0.1, in %'
    inputs: {}
    formula: (0.1**2/3 - (sin(0.1)/0.1 - cos(0.1)))/(0.1**2/3)*100
    expected: '0.1'
    tolerance: 0.05
    shown: ['agreement to 0.1%']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-sin-large
    where: 'example (c): sin(20)/20'
    inputs: {}
    formula: sin(20)/20
    expected: '0.0456'
    tolerance: 0.00005
    shown: ['$\sin(20)/20 = 0.0456$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-cos-large
    where: 'example (c): cos 20'
    inputs: {}
    formula: cos(20)
    expected: '0.4081'
    tolerance: 0.00005
    shown: ['$\cos 20 = 0.4081$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-rho-j1-large
    where: 'example (c): ρ j1(ρ) at ρ = 20'
    inputs: {}
    formula: sin(20)/20 - cos(20)
    expected: '-0.3624'
    tolerance: 0.00005
    shown: ['so $\rho\,j_1 = -0.3624$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own

  - id: ex-c-asymptote
    where: 'example (c): sin(20 − π/2) = −cos 20'
    inputs: {}
    formula: sin(20 - pi/2)
    expected: '-0.4081'
    tolerance: 0.00005
    shown: ['$\sin(20 - \pi/2) = -\cos 20 = -0.4081$']
    source: {cite: reading2, at: 'eq. (5.34)'}
    origin: page-own
