# Calculations on content/year-3/8.05/angular-momentum-algebra.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 21 transcript and Zwiebach's notes chapter 9, with the page's own example.

page: content/year-3/8.05/angular-momentum-algebra.mdx
calcs:
  - id: spin-half-s-squared
    where: 'S² for spin ½: 3 × (½)² in units of ħ², = j(j + 1) at j = ½'
    inputs: {}
    formula: 3*(1/2)**2
    expected: '0.75'
    tolerance: 1e-12
    shown: ['\vec S^2 = \frac{3}{4}\hbar^2\,1']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ladder-norm
    kind: identity
    where: 'squared norm of J±|j,m⟩ / ħ²: j(j+1) − m² ∓ m = j(j+1) − m(m ± 1) (checked for the upper sign)'
    formula: jj*(jj + 1) - mm**2 - mm
    equals: jj*(jj + 1) - mm*(mm + 1)
    samples: {jj: [0.5, 2.0, 3.5], mm: [-1.5, 0.5, 2.0]}
    tolerance: 1e-12
    shown: ['tex="J_\pm|j, m\rangle = \hbar\sqrt{j(j+1) - m(m\pm 1)}\;|j, m\pm 1\rangle"']
    source: {cite: reading2, at: 'eqs. (2.26)–(2.29)'}
    origin: mit

  - id: raising-bound
    kind: identity
    where: 'm(m + 1) = j(j + 1) at m = j and at m = −j − 1'
    formula: (-jj - 1)*(-jj - 1 + 1)
    equals: jj*(jj + 1)
    samples: {jj: [0.5, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['which means $-j-1 \le m \le j$']
    source: {cite: reading2, at: 'eq. (2.31)'}
    origin: mit

  - id: lowering-bound
    kind: identity
    where: 'm(m − 1) = j(j + 1) at m = −j and at m = j + 1'
    formula: (jj + 1)*(jj + 1 - 1)
    equals: jj*(jj + 1)
    samples: {jj: [0.5, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['which means $-j \le m \le j+1$']
    source: {cite: reading2, at: 'eq. (2.34)'}
    origin: mit

  - id: oscillator-commutator
    kind: identity
    where: '[J+, J−] = ħ²(N_R − N_L) = 2ħ J_z with J_z = (ħ/2)(N_R − N_L): checked on eigenvalues'
    formula: hb**2*(nr - nl)
    equals: 2*hb*(hb/2)*(nr - nl)
    samples: {hb: [0.7, 1.3], nr: [3, 1], nl: [0, 2]}
    tolerance: 1e-12
    shown: ['[J_+, J_-] = \hbar^2(N_R - N_L)$ must equal $2\hbar J_z$']
    source: {cite: reading1, at: 'pp. 25–26'}
    origin: page-own

  - id: ex-a-jj
    where: 'example (a): j(j + 1) for j = 3/2'
    inputs: {}
    formula: 1.5*2.5
    expected: '3.75'
    tolerance: 1e-12
    shown: ['$j(j+1) = \frac{15}{4}$']
    source: {cite: reading2, at: 'eq. (2.29)'}
    origin: page-own

  - id: ex-a-m-minus-3-2
    where: 'example (a): m = −3/2: 15/4 − (−3/2)(−1/2)'
    inputs: {}
    formula: 3.75 - (-1.5)*(-0.5)
    expected: '3'
    tolerance: 1e-12
    shown: ['For $m = -\frac{3}{2}$: $\frac{15}{4} - \frac{3}{4} = 3$']
    source: {cite: reading2, at: 'eq. (2.29)'}
    origin: page-own

  - id: ex-a-m-minus-1-2
    where: 'example (a): m = −1/2: 15/4 − (−1/2)(1/2)'
    inputs: {}
    formula: 3.75 - (-0.5)*(0.5)
    expected: '4'
    tolerance: 1e-12
    shown: ['$\frac{15}{4} + \frac{1}{4} = 4$']
    source: {cite: reading2, at: 'eq. (2.29)'}
    origin: page-own

  - id: ex-a-m-plus-1-2
    where: 'example (a): m = 1/2: 15/4 − (1/2)(3/2)'
    inputs: {}
    formula: 3.75 - 0.5*1.5
    expected: '3'
    tolerance: 1e-12
    shown: ['For $m = \frac{1}{2}$: $\frac{15}{4} - \frac{3}{4} = 3$']
    source: {cite: reading2, at: 'eq. (2.29)'}
    origin: page-own

  - id: ex-a-top
    where: 'example (a): m = 3/2: 15/4 − (3/2)(5/2) = 0'
    inputs: {}
    formula: 3.75 - 1.5*2.5
    expected: '0'
    tolerance: 1e-12
    shown: ['$\frac{15}{4} - \frac{15}{4} = 0$']
    source: {cite: reading2, at: 'eq. (2.32)'}
    origin: page-own

  - id: ex-b-length
    where: 'example (b): √6'
    inputs: {}
    formula: sqrt(6)
    expected: '2.449'
    tolerance: 0.0005
    shown: ['$\hbar\sqrt{6} \approx 2.449\,\hbar$']
    source: {cite: reading2, at: 'eq. (2.42)'}
    origin: page-own

  - id: ex-b-cos
    where: 'example (b): 2/√6'
    inputs: {}
    formula: 2/sqrt(6)
    expected: '0.816'
    tolerance: 0.0005
    shown: ['$\cos\alpha = 2/\sqrt{6} \approx 0.816$']
    source: {cite: reading2, at: 'eq. (2.42)'}
    origin: page-own

  - id: ex-b-angle
    where: 'example (b): arccos(2/√6) in degrees'
    inputs: {}
    formula: acos(2/sqrt(6))*180/pi
    expected: '35.3'
    tolerance: 0.05
    shown: ['$\alpha \approx 35.3°$']
    source: {cite: reading2, at: 'eq. (2.42)'}
    origin: page-own

  - id: ex-c-energy
    where: 'example (c): E = ħω(n + 1) for n = 4, in units of ħω'
    inputs: {}
    formula: 4 + 1
    expected: '5'
    tolerance: 1e-12
    shown: ['$E = \hbar\omega(4 + 1) = 5\hbar\omega$']
    source: {cite: reading1, at: 'p. 26'}
    origin: page-own

  - id: ex-c-j
    where: 'example (c): 2j + 1 = 5 gives j = 2'
    inputs: {}
    formula: (5 - 1)/2
    expected: '2'
    tolerance: 1e-12
    shown: ['$5$ states, so $j = 2$']
    source: {cite: reading2, at: 'eq. (2.37)'}
    origin: page-own
