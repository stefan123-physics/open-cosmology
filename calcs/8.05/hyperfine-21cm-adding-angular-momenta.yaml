# Calculations on content/year-3/8.05/hyperfine-21cm-adding-angular-momenta.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 25 transcript and Zwiebach's notes chapter 10, with the page's own example.

page: content/year-3/8.05/hyperfine-21cm-adding-angular-momenta.mdx
calcs:
  - id: gp
    kind: fact
    where: 'proton g factor, about 5.6 as quoted in the lecture'
    value: '5.6'
    shown: ['\qquad g_p \approx 5.6" cite']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: hf-constant
    kind: identity
    where: '(8π/3)(g_p e²/(2 m_e m_p c²))(1/(π a0³)) ħ² with a0 = ħ²/(m_e e²) equals (4/3) g_p (m_e/m_p) (e²/ħc)⁴ m_e c²'
    formula: (8*pi/3)*(gp*ee2/(2*me*mp*cc**2))*(1/(pi*(hb**2/(me*ee2))**3))*hb**2
    equals: (4/3)*gp*(me/mp)*(ee2/(hb*cc))**4*me*cc**2
    samples: {gp: [5.6, 2.0], ee2: [0.6, 1.3], me: [0.8, 1.1], mp: [3.0, 7.0], cc: [2.0, 2.5], hb: [0.9, 1.2]}
    tolerance: 1e-10
    shown: ['\Delta E_{\text{HF}} = \frac{4}{3}\,g_p\,\frac{m_e}{m_p}\,\alpha^4\,m_ec^2']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: angular-average
    where: 'average of r̂_z² over the sphere: ∫cos²θ dΩ / 4π = 1/3'
    inputs: {}
    formula: integrate('cos(t)**2*sin(t)', 't', 0, pi)/2
    expected: '0.33333'
    tolerance: 0.00001
    shown: ['average to $\frac{1}{3}\delta_{ij}$']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: triplet
    where: '½(1·2 − 3/2), the triplet value of S_e·S_p/ħ²'
    inputs: {}
    formula: 0.5*(2 - 1.5)
    expected: '0.25'
    tolerance: 1e-12
    shown: ['\ \ \frac{1}{4}\,\Delta E_{\text{HF}}, & j = 1']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit

  - id: singlet
    where: '½(0 − 3/2), the singlet value'
    inputs: {}
    formula: 0.5*(0 - 1.5)
    expected: '-0.75'
    tolerance: 1e-12
    shown: ['-\frac{3}{4}\,\Delta E_{\text{HF}}, & j = 0']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: hf-quoted
    kind: fact
    where: 'ΔE_HF ≈ 5.9e-6 eV as quoted'
    value: '5.9e-6 eV'
    shown: ['Numerically $\Delta E_{\text{HF}} \approx 5.9 \times 10^{-6}$ eV']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: proton-mass-ratio
    kind: fact
    where: 'm_p/m_e ≈ 1836'
    value: 1836
    shown: ['about 1836 electron masses']
    source: {cite: reading1, at: 'p. 12 (the lecture says about 2000)'}
    origin: page-own

  - id: line-21cm
    kind: fact
    where: '21.1 cm, 1420 MHz as quoted'
    value: '21.1 cm'
    shown: ['\lambda = \frac{hc}{\Delta E_{\text{HF}}} \approx 21.1\ \text{cm}']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: cmb-kt
    where: 'kT at 2.7 K in meV'
    inputs: {}
    formula: 8.617333e-5*2.7*1000
    expected: '0.23'
    tolerance: 0.005
    shown: ['$kT \approx 0.2$ meV']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: lifetime
    kind: fact
    where: 'lifetime of about 1e7 years, as quoted'
    value: '1e7 yr'
    shown: ['a lifetime of about $10^7$ years']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: first-observed
    kind: fact
    where: 'first observed around 1951'
    value: 1951
    shown: ['first observed around 1951']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: counting-identity
    where: 'sum over j = j1 − j2 … j1 + j2 of (2j + 1) minus (2j1 + 1)(2j2 + 1): checked for j1 = 2, j2 = 3/2'
    inputs: {}
    formula: ((2*0.5 + 1) + (2*1.5 + 1) + (2*2.5 + 1) + (2*3.5 + 1)) - (2*2 + 1)*(2*1.5 + 1)
    expected: '0'
    tolerance: 1e-12
    shown: ['equals $(2j_1 + 1)(2j_2 + 1)$, the number of product states']
    source: {cite: reading1, at: 'p. 18'}
    origin: mit

  - id: top-state
    kind: identity
    where: 'j1(j1+1) + j2(j2+1) + 2 j1 j2 = (j1 + j2)(j1 + j2 + 1)'
    formula: j1*(j1 + 1) + j2*(j2 + 1) + 2*j1*j2
    equals: (j1 + j2)*(j1 + j2 + 1)
    samples: {j1: [0.5, 2.0, 3.5], j2: [0.5, 1.0, 1.5]}
    tolerance: 1e-12
    shown: ['= \hbar^2(j_1 + j_2)(j_1 + j_2 + 1)$']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  - id: ex-a-alpha4
    where: 'example (a): 510999 / 137.036⁴ eV'
    inputs: {}
    formula: 510999/137.036**4
    expected: '1.449e-3'
    tolerance: '0.05%'
    shown: ['\approx 1.449 \times 10^{-3}$ eV']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-a-factor
    where: 'example (a): (4/3) × 5.586 / 1836.15'
    inputs: {}
    formula: (4/3)*5.586/1836.15
    expected: '4.056e-3'
    tolerance: '0.05%'
    shown: ['= 4.056 \times 10^{-3}$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-a-dehf
    where: 'example (a): ΔE_HF in eV'
    inputs: {}
    formula: (4/3)*5.586/1836.15*510999/137.036**4
    expected: '5.88e-6'
    tolerance: '0.1%'
    shown: ['$\Delta E_{\text{HF}} \approx 5.88 \times 10^{-6}$ eV']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: ex-a-lambda
    where: 'example (a): hc/ΔE_HF in m'
    inputs: {}
    formula: 1.23984e-6/((4/3)*5.586/1836.15*510999/137.036**4)
    expected: '0.211'
    tolerance: 0.0005
    shown: ['\approx 0.211$ m']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-a-nu
    where: 'example (a): c/λ in GHz'
    inputs: {}
    formula: 2.99792458e8*((4/3)*5.586/1836.15*510999/137.036**4)/1.23984e-6/1e9
    expected: '1.42'
    tolerance: 0.005
    shown: ['$\nu = c/\lambda \approx 1.42$ GHz']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-a-agreement
    where: 'example (a): relative difference from 1420.405 MHz, in %'
    inputs: {}
    formula: abs(2.99792458e8*((4/3)*5.586/1836.15*510999/137.036**4)/1.23984e-6/1e6 - 1420.405)/1420.405*100
    expected: '0.06'
    tolerance: 0.04
    shown: ['within 0.1% of the measured 1420.4 MHz']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b-shift
    where: 'example (b): 1420.4 MHz × 200/299792'
    inputs: {}
    formula: 1420.4*200/299792
    expected: '0.948'
    tolerance: 0.0005
    shown: ['\approx 0.948$ MHz']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-b-both
    where: 'example (b): difference between the two sides, 2 × 0.948 MHz'
    inputs: {}
    formula: 2*1420.4*200/299792
    expected: '1.9'
    tolerance: 0.05
    shown: ['differ by about 1.9 MHz']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-c-count
    where: 'example (c): 8 + 6 + 4 + 2 = 5 × 4'
    inputs: {}
    formula: 8 + 6 + 4 + 2 - 5*4
    expected: '0'
    tolerance: 1e-12
    shown: ['with $8 + 6 + 4 + 2 = 20$ states, equal to $5 \times 4 = 20$']
    source: {cite: reading2, at: 'eq. (6.13)'}
    origin: page-own
