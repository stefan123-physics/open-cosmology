  # The example: a = (1, i), b = (i, 2). With λ = x + iy, a − λb = (1 + y − ix, −2x + i(1 − 2y)), so
  # f = 5x² + (1 + y)² + (1 − 2y)²: smallest at x = 0 and at the root of 2(1 + y) − 4(1 − 2y).
  - id: p4-example
    answer: p4-example
    where: 'Problem 4(b), answer box (our example): f minimised over the real and imaginary parts of λ, the root in y found numerically'
    formula: |-
      (1 + solve('2*(1 + s) - 4*(1 - 2*s)', 's', -5, 5))**2 + (1 - 2*solve('2*(1 + s) - 4*(1 - 2*s)', 's', -5, 5))**2
    expected: '1.8'
    tolerance: 1e-9
    shown: ['id="p4-example"', 'with norm squared $1.44 + 0.36 = 1.8$']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own example)'}
    origin: page-own

