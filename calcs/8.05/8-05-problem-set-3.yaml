# Calculations on content/year-3/8.05/8-05-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1(a) gets the angles from the expectation values of the Pauli matrices instead of the ratio of the
# coefficients; Problem 1(b) and Problem 2 use (1 + cos γ)/2 against the squared modulus built from real and imaginary
# parts; Problem 3 compares with the power series itself and with rotating the state instead of the operator;
# Problem 4 solves f′ = 0 numerically and uses explicit components; Problem 6 solves T u_k = Σ T_ik u_i by Cramer's
# rule instead of multiplying the three matrices. Complex numbers are written out in real and imaginary parts.

page: content/year-3/8.05/8-05-problem-set-3.mdx
calcs:
  # ---- Problem 1(a): the state (1 + i)|+> − (1 + i sqrt 3)|−>

  - id: p1-theta
    answer: p1-theta
    where: 'Problem 1(a), answer box: the polar angle from the expectation value of sigma_z, cos θ = (|c1|² − |c2|²)/(|c1|² + |c2|²)'
    formula: |-
      acos(((1**2 + 1**2) - (1**2 + sqrt(3)**2))/((1**2 + 1**2) + (1**2 + sqrt(3)**2)))*180/pi
    expected: '109.5'
    shown: ['id="p1-theta"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-theta-tan
    where: 'Problem 1(a), solution: the polar angle from the modulus of the ratio of the coefficients, tan(θ/2) = 2/sqrt 2'
    formula: |-
      2*atan(sqrt(1**2 + sqrt(3)**2)/sqrt(1**2 + 1**2))*180/pi
    expected: '109.5'
    shown: ['2\arctan\sqrt2 \approx 109.5°']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-phi
    answer: p1-phi
    where: 'Problem 1(a), answer box: the azimuthal angle from the expectation values, tan φ = n_y/n_x in the third quadrant; 2 c1* c2 = −2(1 + sqrt 3) − 2i(sqrt 3 − 1)'
    formula: |-
      180 + atan((sqrt(3) - 1)/(1 + sqrt(3)))*180/pi
    expected: '195'
    tolerance: 1e-9
    shown: ['id="p1-phi"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-phi-phases
    where: 'Problem 1(a), solution: the azimuthal angle as the sum of the phases, π + π/3 − π/4, with the phases from atan'
    formula: |-
      (pi + atan(sqrt(3)/1) - atan(1/1))*180/pi
    expected: '195'
    tolerance: 1e-9
    shown: ['\phi = \frac{13\pi}{12} = 195°']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-norm
    where: 'Problem 1(a), check: the norm squared |c1|² + |c2|²'
    formula: |-
      (1**2 + 1**2) + (1**2 + sqrt(3)**2)
    expected: '6'
    tolerance: 1e-9
    shown: ['|c_1|^2 + |c_2|^2 = 2 + 4 = 6']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nx
    where: 'Problem 1(a): n_x = sin θ cos φ with the two angles of the solution, against −(1 + sqrt 3)/3 = −0.911'
    formula: |-
      sin(2*atan(sqrt(2)))*cos(13*pi/12)
    expected: '-0.911'
    shown: ['\vec n \approx (-0.911, -0.244, -0.333)$: below']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-ny
    where: 'Problem 1(a): n_y = sin θ sin φ with the two angles of the solution, against −(sqrt 3 − 1)/3 = −0.244'
    formula: |-
      sin(2*atan(sqrt(2)))*sin(13*pi/12)
    expected: '-0.244'
    shown: ['That is $(-0.911, -0.244, -0.333)$ again']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nz
    where: 'Problem 1(a): n_z = cos θ = (1 − tan²(θ/2))/(1 + tan²(θ/2)) with tan(θ/2) = sqrt 2'
    formula: |-
      (1 - sqrt(2)**2)/(1 + sqrt(2)**2)
    expected: '-0.333'
    shown: ['= -\frac13$, the direction is']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nxy-exact
    kind: identity
    where: 'Problem 1(a), check: the exact components −(1 + sqrt 3)/3 and −(sqrt 3 − 1)/3 against sin θ cos φ and sin θ sin φ, combined as n_x + q n_y for any q'
    formula: |-
      -(1 + sqrt(3))/3 - q*(sqrt(3) - 1)/3
    equals: |-
      sin(acos(-1/3))*(cos(13*pi/12) + q*sin(13*pi/12))
    samples:
      q: [0, 1, -2, 0.5, 3]
    tolerance: 1e-12
    shown: ['<Formula label="The direction from expectation values"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-length
    where: 'Problem 1(a), check: the length squared of the direction found from the expectation values'
    formula: |-
      ((1 + sqrt(3))/3)**2 + ((sqrt(3) - 1)/3)**2 + (1/3)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['again, and its length is 1.']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 1(b): three magnets. Each chance is (1 + cos of the angle between the two directions)/2 (Problem 2).

  - id: p1-plus
    kind: identity
    answer: p1-plus
    where: 'Problem 1(b), answer box: two steps with the angle θ between the directions, each with chance (1 + cos θ)/2'
    formula: |-
      cos(theta/2)**4
    equals: |-
      ((1 + cos(theta))/2)*((1 + cos(theta))/2)
    samples:
      theta: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['id="p1-plus"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-minus
    kind: identity
    answer: p1-minus
    where: 'Problem 1(b), answer box: pass with chance (1 + cos θ)/2, then found down, at the angle π − θ from n, with chance (1 + cos(π − θ))/2'
    formula: |-
      cos(theta/2)**2*sin(theta/2)**2
    equals: |-
      ((1 + cos(theta))/2)*((1 + cos(pi - theta))/2)
    samples:
      theta: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['id="p1-minus"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-minus-quarter
    kind: identity
    where: 'Problem 1(b), solution: cos²(θ/2) sin²(θ/2) = sin²θ/4'
    formula: |-
      cos(theta/2)**2*sin(theta/2)**2
    equals: |-
      sin(theta)**2/4
    samples:
      theta: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['<Formula label="The three fractions"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lost
    kind: identity
    answer: p1-lost
    where: 'Problem 1(b), answer box: what is left of all atoms after the two fractions that reach the third magnet'
    formula: |-
      sin(theta/2)**2
    equals: |-
      1 - ((1 + cos(theta))/2)**2 - ((1 + cos(theta))/2)*((1 - cos(theta))/2)
    samples:
      theta: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['id="p1-lost"', 'They add up to 1']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-right-angle-plus
    where: 'Problem 1(b), check: the fraction found up at θ = π/2'
    formula: |-
      cos(pi/4)**4
    expected: '0.25'
    tolerance: 1e-12
    shown: ['the fractions are $\frac14$, $\frac14$ and $\frac12$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-right-angle-minus
    where: 'Problem 1(b), check: the fraction found down at θ = π/2'
    formula: |-
      cos(pi/4)**2*sin(pi/4)**2
    expected: '0.25'
    tolerance: 1e-12
    shown: ['A quarter of the atoms now come out down']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-right-angle-lost
    where: 'Problem 1(b), check: the fraction lost at θ = π/2'
    formula: |-
      sin(pi/4)**2
    expected: '0.5'
    tolerance: 1e-12
    shown: ['so half the atoms are lost']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-pi
    where: 'Problem 1(b), check: the fraction lost at θ = π'
    formula: |-
      sin(pi/2)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['the fractions are $0$, $0$ and $1$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: the overlap of two spin states

  - id: p2-angles
    kind: identity
    answer: p2-angles
    where: 'Problem 2, answer box: against the squared modulus of the overlap, real part squared plus imaginary part squared, with half angles'
    formula: |-
      (1 + cos(t)*cos(tp) + sin(t)*sin(tp)*cos(d))/2
    equals: |-
      (cos(tp/2)*cos(t/2) + sin(tp/2)*sin(t/2)*cos(d))**2 + (sin(tp/2)*sin(t/2)*sin(d))**2
    samples:
      t: [0.3, 1.1, 2.0, 2.8, 1.6]
      tp: [2.5, 0.4, 1.3, 2.1, 0.9]
      d: [0.3, 2.8, 1.2, 0.7, 2.0]
    tolerance: 1e-12
    shown: ['id="p2-angles"', '<Formula label="The squared modulus with whole angles"']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own solution)'}
    origin: page-own

  - id: p2-dot
    kind: identity
    where: 'Problem 2, solution: the dot product of the two unit vectors from their components, with φ′ = φ − d'
    formula: |-
      sin(t)*cos(p)*sin(tp)*cos(p - d) + sin(t)*sin(p)*sin(tp)*sin(p - d) + cos(t)*cos(tp)
    equals: |-
      sin(t)*sin(tp)*cos(d) + cos(t)*cos(tp)
    samples:
      t: [0.3, 1.1, 2.0, 2.8, 1.6]
      tp: [2.5, 0.4, 1.3, 2.1, 0.9]
      d: [0.3, 2.8, 1.2, 0.7, 2.0]
      p: [0.0, 1.0, 2.5, 4.0, 5.5]
    tolerance: 1e-12
    shown: ['<Formula label="The angle between the two directions"']
    source: {cite: reading1, at: 'eq. (4.67), used for both directions'}
    origin: page-own

  - id: p2-half-angle
    kind: identity
    where: 'Problem 2, solution: (1 + cos γ)/2 = cos²(γ/2)'
    formula: |-
      (1 + cos(g))/2
    equals: |-
      cos(g/2)**2
    samples:
      g: [0.0, 0.7, 1.5708, 2.4, 3.0]
    tolerance: 1e-12
    shown: ['<Formula label="The result of Problem 2"']
    source: {cite: mit, at: 'Problem 2, p. 1'}
    origin: mit

  - id: p2-example
    answer: p2-example
    where: 'Problem 2, answer box (our example): the squared modulus of the overlap, real and imaginary parts, for θ = 60°, φ = 0°, θ′ = 120°, φ′ = 90°'
    formula: |-
      (cos(pi/3)*cos(pi/6) + sin(pi/3)*sin(pi/6)*cos(-pi/2))**2 + (sin(pi/3)*sin(pi/6)*sin(-pi/2))**2
    expected: '0.375'
    tolerance: 1e-12
    shown: ['id="p2-example"', 'with squared modulus $0.375$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own example)'}
    origin: page-own

  - id: p2-example-cos
    where: 'Problem 2, example: cos γ from the angles'
    formula: |-
      sin(pi/3)*sin(2*pi/3)*cos(-pi/2) + cos(pi/3)*cos(2*pi/3)
    expected: '-0.25'
    tolerance: 1e-12
    shown: ['\cos 60°\cos 120° = 0 - 0.25$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own example)'}
    origin: page-own

  - id: p2-example-gamma
    where: 'Problem 2, example: the angle between the two directions'
    formula: |-
      acos(sin(pi/3)*sin(2*pi/3)*cos(-pi/2) + cos(pi/3)*cos(2*pi/3))*180/pi
    expected: '104.5'
    shown: ['so $\gamma \approx 104.5°$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own example)'}
    origin: page-own

  - id: p2-example-half
    where: 'Problem 2, example: the overlap squared from cos γ'
    formula: |-
      (1 + sin(pi/3)*sin(2*pi/3)*cos(-pi/2) + cos(pi/3)*cos(2*pi/3))/2
    expected: '0.375'
    tolerance: 1e-12
    shown: ['$\frac12(1 - 0.25) = 0.375$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own example)'}
    origin: page-own

  - id: p2-example-amplitude
    where: 'Problem 2, example: the common size of the real and the imaginary part of the overlap'
    formula: |-
      cos(pi/3)*cos(pi/6)
    expected: '0.433'
    shown: ['e^{-i\pi/2} = 0.433\,(1 - i)$']
    source: {cite: mit, at: 'Problem 2, p. 1 (our own example)'}
    origin: page-own

  # ---- Problem 3: the rotation operator

  - id: p3-square
    kind: identity
    where: 'Problem 3(a): (n·σ)² = I. The diagonal element of the square of ((nz, nx − i ny), (nx + i ny, −nz)) for a unit vector with angles t, p'
    formula: |-
      cos(t)**2 + (sin(t)*cos(p))**2 + (sin(t)*sin(p))**2
    equals: |-
      1
    samples:
      t: [0.3, 1.1, 2.0, 2.8, 1.6]
      p: [0.0, 1.0, 2.5, 4.0, 5.5]
    tolerance: 1e-12
    shown: ['<Formula label="The square of the spin matrix along n"', 'id="p3-series"']
    source: {cite: reading1, at: 'eqs. (3.60) and (3.62)'}
    origin: mit

  - id: p3-unitary
    kind: identity
    where: 'Problem 3(a): the coefficient of I in R†R'
    formula: |-
      cos(alpha/2)**2 + sin(alpha/2)**2
    equals: |-
      1
    samples:
      alpha: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['<Formula label="The adjoint times the operator"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-full-turn
    where: 'Problem 3(a), check: the coefficient of I at α = 2π'
    formula: |-
      cos(2*pi/2)
    expected: '-1'
    tolerance: 1e-12
    shown: ['For $\alpha = 2\pi$ it is $-I$, not $I$']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  # Rotating the state instead of the operator: a spin with real amplitudes (cos(β/2), sin(β/2)) has <Sz> and <Sx>
  # proportional to cos β and sin β. Its expectation value of R Sz R† is <Sz> in the state R†ψ, whose amplitudes are
  # (c p + s q, −s p + c q) with c = cos(α/2), s = sin(α/2), because −iσ₂ is the real matrix ((0, −1), (1, 0)).
  - id: p3-rot
    kind: identity
    answer: p3-rot
    where: 'Problem 3(b), answer box: the expectation value in a spin state in the xz-plane, computed by rotating the state back instead of the operator'
    formula: |-
      Sz*cos(alpha) + Sx*sin(alpha)
    equals: |-
      sqrt(Sx**2 + Sz**2)*((cos(alpha/2)*cos(atan(Sx/Sz)/2) + sin(alpha/2)*sin(atan(Sx/Sz)/2))**2 - (-sin(alpha/2)*cos(atan(Sx/Sz)/2) + cos(alpha/2)*sin(atan(Sx/Sz)/2))**2)
    samples:
      Sx: [0.5, 1.2, 2.0, 0.8, 1.7]
      Sz: [2.0, 0.6, 1.1, 1.9, 0.5]
      alpha: [0.3, 2.8, 1.2, 0.7, 2.0]
    tolerance: 1e-12
    shown: ['id="p3-rot"', '<Formula label="The rotated spin operator"']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-rot-special
    where: 'Problem 3(b), check: at α = π the coefficient of Sz is −1'
    formula: |-
      cos(pi)
    expected: '-1'
    tolerance: 1e-12
    shown: ['and for $\alpha = \pi$ it is $-\hat S_z$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-up
    kind: identity
    answer: p3-up
    where: 'Problem 3(c), answer box: against the even part of the exponential series itself, six terms'
    formula: |-
      cos(alpha/2)
    equals: |-
      1 - (alpha/2)**2/2 + (alpha/2)**4/24 - (alpha/2)**6/720 + (alpha/2)**8/40320 - (alpha/2)**10/3628800
    samples:
      alpha: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-6
    shown: ['id="p3-up"', '<Formula label="The exponential series, even and odd powers"']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-down
    kind: identity
    answer: p3-down
    where: 'Problem 3(c), answer box: against the odd part of the exponential series itself, six terms; (−i)(i) = +1 gives the sign'
    formula: |-
      sin(alpha/2)
    equals: |-
      (alpha/2) - (alpha/2)**3/6 + (alpha/2)**5/120 - (alpha/2)**7/5040 + (alpha/2)**9/362880 - (alpha/2)**11/39916800
    samples:
      alpha: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-6
    shown: ['id="p3-down"', '<Formula label="The rotated state"']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eigen-up
    kind: identity
    where: 'Problem 3(c), choice box: (σ₃ cos α + σ₁ sin α) acting on (cos(α/2), sin(α/2)), upper component'
    formula: |-
      cos(alpha)*cos(alpha/2) + sin(alpha)*sin(alpha/2)
    equals: |-
      cos(alpha/2)
    samples:
      alpha: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['id="p3-op"']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eigen-down
    kind: identity
    where: 'Problem 3(c): (σ₃ cos α + σ₁ sin α) acting on (cos(α/2), sin(α/2)), lower component'
    formula: |-
      sin(alpha)*cos(alpha/2) - cos(alpha)*sin(alpha/2)
    equals: |-
      sin(alpha/2)
    samples:
      alpha: [0.3, 0.9, 1.5708, 2.2, 2.8]
    tolerance: 1e-12
    shown: ['<Formula label="The operator with this eigenstate"']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-x-state
    where: 'Problem 3(c), check: both amplitudes at α = π/2 are 1/sqrt 2'
    formula: |-
      cos(pi/4)*sqrt(2)
    expected: '1'
    tolerance: 1e-12
    shown: ['$\alpha = \pi/2$ gives $\frac{1}{\sqrt2}']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 4: Schwarz and triangle inequalities

  - id: p4-lam
    kind: identity
    answer: p4-lam
    where: 'Problem 4(a), answer box: the root of f′(λ) = −2 a·b + 2λ b·b, found numerically'
    formula: |-
      ab/bb
    equals: |-
      solve('-2*ab + 2*s*bb', 's', -100, 100)
    samples:
      ab: [0.5, 1.4, 3.0, 2.2, 0.9]
      bb: [3.0, 0.5, 1.6, 2.4, 0.8]
    tolerance: 1e-9
    shown: ['id="p4-lam"', '<Formula label="The quadratic function"']
    source: {cite: mit, at: 'Problem 4(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p4-fmin
    kind: identity
    answer: p4-fmin
    where: 'Problem 4(a), answer box: f at the numerically found root of f′'
    formula: |-
      aa - ab**2/bb
    equals: |-
      aa - 2*solve('-2*ab + 2*s*bb', 's', -100, 100)*ab + solve('-2*ab + 2*s*bb', 's', -100, 100)**2*bb
    samples:
      aa: [2.0, 3.0, 1.1, 0.7, 2.6]
      ab: [0.5, 1.4, 3.0, 2.2, 0.9]
      bb: [3.0, 0.5, 1.6, 2.4, 0.8]
    tolerance: 1e-8
    shown: ['id="p4-fmin"', '<Formula label="The smallest value"']
    source: {cite: mit, at: 'Problem 4(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p4-perpendicular
    kind: identity
    where: 'Problem 4(a), check and choice box: for vectors of the plane with components (p, q) and (r, s0), the smallest value of f is the squared part of a perpendicular to b, which vanishes only for parallel vectors'
    formula: |-
      (p**2 + q**2) - (p*r + q*s0)**2/(r**2 + s0**2)
    equals: |-
      (p*s0 - q*r)**2/(r**2 + s0**2)
    samples:
      p: [1.0, -2.0, 0.5, 3.0, 1.5]
      q: [2.0, 1.0, -1.5, 0.2, 1.5]
      r: [0.5, 1.0, 2.0, -1.0, 3.0]
      s0: [1.5, -0.5, 1.0, 2.0, 3.0]
    tolerance: 1e-12
    shown: ['id="p4-sat"']
    source: {cite: reading2, at: 'eqs. (4.63) to (4.65)'}
    origin: page-own

  - id: p4-square
    kind: identity
    where: 'Problem 4(b), completing the square: with λ = x + iy and <b|a> = r + i s0, the four terms of f against <b|b> |λ − <b|a>/<b|b>|² + <a|a> − |<a|b>|²/<b|b>'
    formula: |-
      aa - 2*(x*r + y*s0) + (x**2 + y**2)*bb
    equals: |-
      bb*((x - r/bb)**2 + (y - s0/bb)**2) + aa - (r**2 + s0**2)/bb
    samples:
      aa: [2.0, 3.0, 1.1, 0.7, 2.6]
      bb: [3.0, 0.5, 1.6, 2.4, 0.8]
      r: [0.5, 1.0, 2.0, -1.0, 3.0]
