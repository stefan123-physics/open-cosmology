  # ---- Problem 6: u1 = v1 + 2 v2, u2 = v1 + 3 v2, T(v) = ((2, 1), (0, 3)).
  # A combination α u1 + β u2 = (X, Y) in v components has, by Cramer's rule with determinant 1·3 − 1·2 = 1,
  # α = (3X − Y)/1 and β = (Y − 2X)/1.

  - id: p6-det-a
    where: 'Problem 6(a), example: the determinant of the matrix of A'
    formula: |-
      1*3 - 1*2
    expected: '1'
    tolerance: 1e-12
    shown: ['The determinant of $A$ is $3 - 2 = 1$']
    source: {cite: mit, at: 'Problem 6(a), p. 4 (our own example)'}
    origin: page-own

  - id: p6-b21
    answer: p6-b21
    where: 'Problem 6(a), answer box (our example): v1 = (1, 0) as α u1 + β u2, β by Cramer''s rule'
    formula: |-
      (1*0 - 2*1)/(1*3 - 1*2)
    expected: '-2'
    tolerance: 1e-12
    shown: ['id="p6-b21"', 'so $B_{21} = -2$']
    source: {cite: mit, at: 'Problem 6(a), p. 4 (our own example)'}
    origin: page-own

  - id: p6-b11
    where: 'Problem 6(a), example: v1 = (1, 0) as α u1 + β u2, α by Cramer''s rule'
