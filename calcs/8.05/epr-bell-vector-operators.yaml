# Calculations on content/year-3/8.05/epr-bell-vector-operators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 20 transcript and Zwiebach's notes chapters 8 and 9, with the page's own example.

page: content/year-3/8.05/epr-bell-vector-operators.mdx
calcs:
  - id: eta-mass
    kind: fact
    where: 'rest mass of the neutral eta meson, as quoted in the notes'
    value: '547 MeV'
    shown: ['(rest mass 547 MeV)']
    source: {cite: reading2, at: 'p. 16'}
    origin: mit

  - id: half-angle-identity
    kind: identity
    where: 'cos²((π − θ)/2) = sin²(θ/2)'
    formula: cos((pi - th)/2)**2
    equals: sin(th/2)**2
    samples: {th: [0.3, 1.2, 2.5]}
    tolerance: 1e-12
    shown: ['= \frac{1}{2}\sin^2\frac{\theta_{ab}}{2}" cite']
    source: {cite: reading2, at: 'eqs. (5.7)–(5.8)'}
    origin: mit

  - id: opposite-axes
    where: 'P(a, −a) = ½ sin²(π/2)'
    inputs: {}
    formula: 0.5*sin(pi/2)**2
    expected: '0.5'
    tolerance: 1e-12
    shown: ['$\theta_{ab} = \pi$ and $P = \frac{1}{2}$']
    source: {cite: reading2, at: 'p. 17'}
    origin: mit

  - id: z-x
    where: 'P(z, x) = ½ sin² 45°'
    inputs: {}
    formula: 0.5*sin(pi/4)**2
    expected: '0.25'
    tolerance: 1e-12
    shown: ['$P = \frac{1}{2}\sin^2 45° = \frac{1}{4}$']
    source: {cite: reading2, at: 'eq. (5.9)'}
    origin: mit

  - id: epr-two-axes-zz
    where: 'EPR two-axis model: P(z+, z−) from two of four equally common types'
    inputs: {}
    formula: 2*0.25
    expected: '0.5'
    tolerance: 1e-12
    shown: ['Then $P(z+, z-) = \frac{1}{2}$']
    source: {cite: reading2, at: 'p. 18'}
    origin: mit

  - id: epr-two-axes-zx
    where: 'EPR two-axis model: P(z+, x+) from one of four types'
    inputs: {}
    formula: 0.25
    expected: '0.25'
    tolerance: 1e-12
    shown: ['and $P(z+, x+) = \frac{1}{4}$, exactly']
    source: {cite: reading2, at: 'p. 18'}
    origin: mit

  - id: bell-counting
    kind: identity
    where: 'N3 + N4 ≤ N3 + N4 + N2 + N7 for non-negative populations; checked as the difference equals N2 + N7'
    formula: (n3 + n4 + n2 + n7) - (n3 + n4)
    equals: n2 + n7
    samples: {n2: [0, 5], n3: [2, 7], n4: [1, 3], n7: [4, 0]}
    tolerance: 1e-12
    shown: ['Since $N_3 + N_4 \le N_3 + N_4 + N_2 + N_7$']
    source: {cite: reading2, at: 'eq. (5.11)'}
    origin: mit

  - id: double-angle
    kind: identity
    where: 'sin²θ = 4 sin²(θ/2) cos²(θ/2), so ½ sin²θ ≤ sin²(θ/2) is 2cos²(θ/2) ≤ 1'
    formula: sin(th)**2
    equals: 4*sin(th/2)**2*cos(th/2)**2
    samples: {th: [0.2, 1.1, 2.9]}
    tolerance: 1e-12
    shown: ['$2\cos^2\frac{\theta}{2} \le 1$, so it fails']
    source: {cite: reading2, at: 'p. 19'}
    origin: page-own

  - id: equality-at-right-angle
    where: 'θ = π/2: ½ sin²(π/2) − sin²(π/4) = 0'
    inputs: {}
    formula: 0.5*sin(pi/2)**2 - sin(pi/4)**2
    expected: '0'
    tolerance: 1e-12
    shown: ['is an equality at $\pi/2$ (and trivially']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: aspect-years
    kind: fact
    where: 'Aspect and others, Bell-test experiments around 1980 to 1982'
    value: '1980–1982'
    shown: ['around 1980 to 1982']
    source: {cite: reading1, at: 'p. 15'}
    origin: mit

  - id: r-dot-p
    where: 'sum over three directions of [x_i, p_i] = iħ: 3, in units of iħ'
    inputs: {}
    formula: 1 + 1 + 1
    expected: '3'
    tolerance: 1e-12
    shown: ['\vec r\cdot\vec p = \vec p\cdot\vec r + 3i\hbar" cite']
    source: {cite: reading3, at: 'eq. (1.16)'}
    origin: mit

  - id: ex-a
    where: 'example (a): ½ sin² 30°'
    inputs: {}
    formula: 0.5*sin(pi/6)**2
    expected: '0.125'
    tolerance: 1e-12
    shown: ['= \frac{1}{8} = 0.125$']
    source: {cite: reading2, at: 'eq. (5.8)'}
    origin: page-own

  - id: ex-b-30-left
    where: 'example (b), θ = 30°: ½ sin² 30°'
    inputs: {}
    formula: 0.5*sin(pi/6)**2
    expected: '0.125'
    tolerance: 1e-12
    shown: ['The left side is $\frac{1}{2}\sin^2 30° = 0.125$']
    source: {cite: reading2, at: 'eq. (5.15)'}
    origin: page-own

  - id: ex-b-30-right
    where: 'example (b), θ = 30°: sin² 15°'
    inputs: {}
    formula: sin(pi/12)**2
    expected: '0.0670'
    tolerance: 0.00005
    shown: ['$\sin^2 15° \approx 0.0670$']
    source: {cite: reading2, at: 'eq. (5.15)'}
    origin: page-own

  - id: ex-b-30-ratio
    where: 'example (b): 0.125 / sin² 15°, "nearly twice"'
    inputs: {}
    formula: 0.125/sin(pi/12)**2
    expected: '1.87'
    tolerance: 0.005
    shown: ['nearly twice what local realism allows']
    source: {cite: reading2, at: 'eq. (5.15)'}
    origin: page-own

  - id: ex-b-120-left
    where: 'example (b), θ = 120°: ½ sin² 120°'
    inputs: {}
    formula: 0.5*sin(2*pi/3)**2
    expected: '0.375'
    tolerance: 1e-12
    shown: ['= \frac{1}{2}\cdot\frac{3}{4} = 0.375$']
    source: {cite: reading2, at: 'eq. (5.15)'}
    origin: page-own

  - id: ex-b-120-right
    where: 'example (b), θ = 120°: sin² 60°'
    inputs: {}
    formula: sin(pi/3)**2
    expected: '0.75'
    tolerance: 1e-12
    shown: ['$\sin^2 60° = 0.75$']
    source: {cite: reading2, at: 'eq. (5.15)'}
    origin: page-own

  - id: ex-c
    where: 'example (c): equal populations, (N3 + N4)/N = 2/8'
    inputs: {}
    formula: 2/8
    expected: '0.25'
    tolerance: 1e-12
    shown: ['= \frac{2}{8} = 0.25$']
    source: {cite: reading2, at: 'eq. (5.10)'}
    origin: page-own
