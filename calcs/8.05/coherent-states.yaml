# Calculations on content/year-3/8.05/coherent-states.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 14 transcript and Zwiebach's notes chapter 6, with the page's own example.

page: content/year-3/8.05/coherent-states.mdx
calcs:
  - id: width-constant
    kind: identity
    where: 'Δx² = (x0² + hbar/2mω)cos² + (m hbar ω/2)/(m²ω²) sin² − x0² cos² = hbar/2mω'
    formula: (x0**2 + hbar/(2*m*w))*cos(w*t)**2 + (m*hbar*w/2)/(m**2*w**2)*sin(w*t)**2 - x0**2*cos(w*t)**2
    equals: hbar/(2*m*w)
    samples: {x0: [0.5, 3.0], hbar: [1.0, 0.3], m: [1.0, 2.5], w: [0.7, 1.9], t: [0.3, 1.4]}
    tolerance: 1e-9
    shown: ['(\Delta x)^2(t) = \frac{\hbar}{2m\omega}, \qquad']
    source: {cite: reading2, at: 'eq. (4.38)'}
    origin: mit

  - id: min-uncertainty
    kind: identity
    where: 'sqrt(hbar/2mω) · sqrt(m hbar ω/2) = hbar/2'
    formula: sqrt(hbar/(2*m*w))*sqrt(m*hbar*w/2)
    equals: hbar/2
    samples: {hbar: [1.0, 0.3], m: [1.0, 2.5], w: [0.7, 1.9]}
    tolerance: 1e-12
    shown: ['\Delta x\,\Delta p = \frac{\hbar}{2}" cite']
    source: {cite: reading2, at: 'eq. (4.42)'}
    origin: mit

  - id: poisson-normalised
    where: 'sum of e^{−λ} λ^n/n! = e^{−λ} e^{λ}, for λ = 5'
    inputs: {}
    formula: exp(-5)*exp(5)
    expected: '1'
    tolerance: 1e-9
    shown: ['The probabilities sum to $e^{-\lambda}e^\lambda = 1$']
    source: {cite: reading2, at: 'eq. (4.60)'}
    origin: mit

  - id: poisson-mean
    where: 'mean of the Poisson distribution, e^{−λ} λ d/dλ e^{λ}, for λ = 5'
    inputs: {}
    formula: exp(-5)*5*deriv('exp(s)', 's', 5)
    expected: '5'
    tolerance: 1e-9
    shown: ['the mean level is $\langle n\rangle = \lambda$']
    source: {cite: reading2, at: 'eq. (4.61)'}
    origin: mit

  - id: ex-mean-n
    where: 'example: |1 + 2i|^2'
    inputs: {}
    formula: 1**2 + 2**2
    expected: '5'
    tolerance: 0
    shown: ['$\langle\hat N\rangle = |\alpha|^2 = 1 + 4 = 5$']
    source: {cite: reading2, at: 'eq. (4.96)'}
    origin: page-own

  - id: ex-spread-n
    where: 'example: sqrt(5)'
    inputs: {}
    formula: sqrt(5)
    expected: '2.24'
    tolerance: 0.005
    shown: ['$\Delta N = \sqrt{5} \approx 2.24$']
    source: {cite: reading2, at: 'eq. (4.99)'}
    origin: page-own

  - id: ex-ground-prob
    where: 'example: e^{−5}'
    inputs: {}
    formula: exp(-5)
    expected: '0.0067'
    tolerance: 0.00005
    shown: ['the ground state has probability $e^{-5} \approx 0.0067$']
    source: {cite: reading2, at: 'eq. (4.94)'}
    origin: page-own

  - id: ex-rotation-re
    where: 'example: (1 + 2i)(−i) = 2 − i; real part 1·0 − 2·(−1) = 2 (imaginary part 1·(−1) + 2·0 = −1)'
    inputs: {}
    formula: 1*0 - 2*(-1)
    expected: '2'
    tolerance: 0
    shown: ['$\alpha e^{-i\pi/2} = (1 + 2i)(-i) = 2 - i$']
    source: {cite: reading2, at: 'eq. (4.93)'}
    origin: page-own

  - id: ex-turning-angle
    where: 'example: turning point at ωt = arg α = arctan 2, in degrees'
    inputs: {}
    formula: atan(2)*180/pi
    expected: '63.4'
    tolerance: 0.05
    shown: ['$\omega t = \arctan 2 \approx 63.4°$']
    source: {cite: reading2, at: 'eq. (4.93)'}
    origin: page-own

  - id: ex-amplitude
    where: 'example: amplitude sqrt(2)|α| d0 = sqrt(10) d0'
    inputs: {}
    formula: sqrt(2)*sqrt(5)
    expected: '3.16'
    tolerance: 0.005
    shown: ['\sqrt{10}\,d_0 \approx 3.16\,d_0']
    source: {cite: reading2, at: 'eq. (4.80)'}
    origin: page-own

  - id: mean-level-thousand
    where: 'λ = x0²/2d0² for x0 = 1000 d0'
    inputs: {}
    formula: 1000**2/2
    expected: '500000'
    tolerance: 0
    shown: ['occupies levels around half a million']
    source: {cite: reading2, at: 'eq. (4.61)'}
    origin: page-own
