# Calculations on content/year-3/8.05/ground-state-bounds-spectral-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 11 transcript and Zwiebach's notes chapter 5, with the page's own example.

page: content/year-3/8.05/ground-state-bounds-spectral-theorem.mdx
calcs:
  - id: quartic-min-location
    kind: identity
    where: 'A/x^2 + B x^4 has zero derivative at x^2 = 2^(-1/3) (A/B)^(1/3) (checked: derivative in X = x^2 of A/X + B X^2 vanishes there)'
    formula: -A/(2**(-1/3)*(A/B)**(1/3))**2 + 2*B*(2**(-1/3)*(A/B)**(1/3))
    equals: 0
    samples: {A: [0.3, 2.0], B: [0.5, 4.0]}
    tolerance: 1e-9
    shown: ['$x^2 = 2^{-1/3}(A/B)^{1/3}$']
    source: {cite: reading2, at: 'eq. (4.60)'}
    origin: mit

  - id: quartic-min-value
    kind: identity
    where: 'value at the minimum: A/X + B X^2 = 2^(1/3) (3/2) A^(2/3) B^(1/3)'
    formula: A/(2**(-1/3)*(A/B)**(1/3)) + B*(2**(-1/3)*(A/B)**(1/3))**2
    equals: 2**(1/3)*1.5*A**(2/3)*B**(1/3)
    samples: {A: [0.3, 2.0], B: [0.5, 4.0]}
    tolerance: 1e-9
    shown: ['$2^{1/3}\cdot\frac{3}{2}\,A^{2/3}B^{1/3}$']
    source: {cite: reading2, at: 'eq. (4.60)'}
    origin: mit

  - id: quartic-coefficient
    where: '2^(1/3) × 3/8'
    inputs: {}
    formula: 2**(1/3)*3/8
    expected: '0.4724'
    tolerance: 0.0001
    shown: ['\approx 0.4724\left(']
    source: {cite: reading2, at: 'eq. (4.61)'}
    origin: mit

  - id: quartic-from-A
    kind: identity
    where: 'with A = hbar^2/8m and B = alpha: 2^(1/3)(3/2) A^(2/3) B^(1/3) = 2^(1/3)(3/8)(hbar^2 sqrt(alpha)/m)^(2/3)'
    formula: 2**(1/3)*1.5*(hbar**2/(8*m))**(2/3)*alpha**(1/3)
    equals: 2**(1/3)*3/8*(hbar**2*sqrt(alpha)/m)**(2/3)
    samples: {hbar: [1.0, 0.6], m: [1.0, 2.5], alpha: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['2^{1/3}\,\frac{3}{8}\left(\frac{\hbar^2\sqrt{\alpha}}{m}\right)^{2/3}']
    source: {cite: reading2, at: 'eq. (4.61)'}
    origin: mit

  - id: quartic-exact
    kind: fact
    where: 'numerical ground-state coefficient for alpha x^4'
    value: 0.668
    shown: ['The numerical answer has $0.668$']
    source: {cite: reading2, at: 'p. 10'}
    origin: mit

  - id: ex-x8-min
    kind: identity
    where: 'example (a): at X^5 = a/(4 gamma), a/X + gamma X^4 = (5/4) a/X'
    formula: a/(a/(4*g))**(1/5) + g*(a/(4*g))**(4/5)
    equals: 1.25*a/(a/(4*g))**(1/5)
    samples: {a: [0.2, 1.5], g: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['$f_{\text{min}} = \frac{5}{4}\,\frac{a}{X}']
    source: {cite: reading2, at: 'eq. (4.59)'}
    origin: page-own

  - id: ex-x8-coefficient
    kind: identity
    where: 'example (a): (5/4) 4^(1/5) a^(4/5) gamma^(1/5) with a = hbar^2/8m equals (5/16)(hbar^8 gamma/m^4)^(1/5)'
    formula: 1.25*4**(1/5)*(hbar**2/(8*m))**(4/5)*g**(1/5)
    equals: 5/16*(hbar**8*g/m**4)**(1/5)
    samples: {hbar: [1.0, 0.6], m: [1.0, 2.5], g: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['\frac{5}{16}\left(\frac{\hbar^8\gamma}{m^4}\right)^{1/5}']
    source: {cite: reading2, at: 'eq. (4.59)'}
    origin: page-own

  - id: ex-x8-decimal
    where: 'example (a): 5/16'
    inputs: {}
    formula: 5/16
    expected: '0.3125'
    tolerance: 1e-12
    shown: ['a coefficient of $0.3125$']
    source: {cite: reading2, at: 'eq. (4.59)'}
    origin: page-own

  - id: ex-power-of-two
    where: 'example (a): 4^(1/5)/8^(4/5)'
    inputs: {}
    formula: 4**(1/5)/8**(4/5)
    expected: '0.25'
    tolerance: 1e-12
    shown: ['$4^{1/5}/8^{4/5} = 2^{2/5 - 12/5} = 1/4$']
    source: {cite: reading2, at: 'eq. (4.59)'}
    origin: page-own

  - id: ex-normal
    where: 'example (b): (N†N)_11 = 1·1 + (−1)(−1) = 2, equal to (N N†)_11 = 1 + 1'
    inputs: {}
    formula: (1*1 + (-1)*(-1)) - (1*1 + 1*1)
    expected: '0'
    tolerance: 0
    shown: ['$N^\dagger N = NN^\dagger = 2I$']
    source: {cite: reading2, at: 'eq. (6.69)'}
    origin: page-own

  - id: ex-orthogonal
    where: 'example (b): (1, i)·(1, −i) with conjugation: 1 + (−i)(−i) = 1 − 1'
    inputs: {}
    formula: 1 - 1
    expected: '0'
    tolerance: 0
    shown: ['$1 \cdot 1 + (-i)(-i) = 1 - 1 = 0$']
    source: {cite: reading2, at: 'eq. (6.74)'}
    origin: page-own
