# Calculations on content/year-3/8.05/oscillator-unitary-time-evolution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 12 transcript and Zwiebach's notes chapter 6, with the page's own example.

page: content/year-3/8.05/oscillator-unitary-time-evolution.mdx
calcs:
  - id: factorisation
    kind: identity
    where: 'cross terms of (x − ip/mω)(x + ip/mω): (i/mω)[x, p] = (i/mω)(i hbar) = −hbar/(mω); so (1/2)mω^2 V†V = H − (1/2)mω^2 · hbar/(mω) = H − hbar ω/2'
    formula: 0.5*m*w**2*(hbar/(m*w))
    equals: hbar*w/2
    samples: {m: [1.0, 2.5], w: [0.5, 3.0], hbar: [1.0, 0.3]}
    tolerance: 1e-12
    shown: ['V^\dagger V + \frac{1}{2}\hbar\omega, \qquad V']
    source: {cite: reading2, at: 'eqs. (1.10)–(1.12)'}
    origin: mit

  - id: lowering-ladder
    where: 'non-integer example: 2.5 − 3 = −0.5, the number reached after three lowerings'
    inputs: {}
    formula: 2.5 - 3
    expected: '-0.5'
    tolerance: 0
    shown: ['a state at −0.5 with positive norm']
    source: {cite: reading1, at: 'p. 12'}
    origin: mit

  - id: ex-mean-x
    kind: identity
    where: 'example (a): <x> in chi = sqrt(hbar/2mω)(1/2 + 1/2)'
    formula: sqrt(hbar/(2*m*w))*(0.5 + 0.5)
    equals: sqrt(hbar/(2*m*w))
    samples: {m: [1.0, 2.5], w: [0.5, 3.0], hbar: [1.0, 0.3]}
    tolerance: 1e-12
    shown: ['= \sqrt{\frac{\hbar}{2m\omega}}$: unlike']
    source: {cite: reading2, at: 'eq. (1.18)'}
    origin: page-own

  - id: ex-x2
    kind: identity
    where: 'example (a): <x^2> in chi = (hbar/2mω)(2·(1/2) + 1)'
    formula: hbar/(2*m*w)*(2*0.5 + 1)
    equals: hbar/(m*w)
    samples: {m: [1.0, 2.5], w: [0.5, 3.0], hbar: [1.0, 0.3]}
    tolerance: 1e-12
    shown: ['\frac{\hbar}{2m\omega}(1 + 1) = \frac{\hbar}{m\omega}$']
    source: {cite: reading2, at: 'eq. (1.18)'}
    origin: page-own

  - id: ex-dx2
    kind: identity
    where: 'example (a): (Δx)^2 = hbar/mω − (sqrt(hbar/2mω))^2'
    formula: hbar/(m*w) - (sqrt(hbar/(2*m*w)))**2
    equals: hbar/(2*m*w)
    samples: {m: [1.0, 2.5], w: [0.5, 3.0], hbar: [1.0, 0.3]}
    tolerance: 1e-12
    shown: ['$(\Delta x)^2 = \frac{\hbar}{m\omega} - \frac{\hbar}{2m\omega} = \frac{\hbar}{2m\omega}$']
    source: {cite: reading2, at: 'eq. (1.18)'}
    origin: page-own

  - id: ex-H-from-U
    kind: identity
    where: 'example (b): d/dt e^{−iω1 t} = −iω1 e^{−iω1 t}, checked on the real part: d/dt cos(ω1 t) = −ω1 sin(ω1 t); times i hbar and e^{iω1 t} this gives hbar ω1'
    formula: deriv('cos(w1*s)', 's', t)
    equals: -w1*sin(w1*t)
    samples: {w1: [0.5, 2.0], t: [0.3, 1.7]}
    tolerance: 1e-6
    shown: ['\begin{pmatrix}\hbar\omega_1 & 0\\ 0 & \hbar\omega_2\end{pmatrix}']
    source: {cite: reading2, at: 'eq. (2.26)'}
    origin: page-own
