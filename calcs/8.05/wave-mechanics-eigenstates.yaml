# Calculations on content/year-3/8.05/wave-mechanics-eigenstates.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013, Zwiebach) Lecture 1 transcript and notes chapter 1, with the page's own example.

page: content/year-3/8.05/wave-mechanics-eigenstates.mdx
calcs:
  - id: box-orthonormal
    where: 'orthonormality check: ∫₀¹ 2 sin(πx) sin(2πx) dx = 0 for the box states (a = 1)'
    inputs: {}
    formula: integrate('2*sin(pi*x)*sin(2*pi*x)', 'x', 0, 1)
    expected: '0'
    tolerance: 1e-9
    shown: ['\int_{-\infty}^{\infty}\psi_m^*(x)\,\psi_n(x)\,dx = \delta_{mn}']
    source: {cite: reading2, at: 'eq. (2.16)'}
    origin: page-own

  - id: expectation-H
    kind: identity
    where: 'Σ|b_n|²E_n for b = (3, 4i)/5 and E = (1, 4)E₁ equals (9 + 64)/25 E₁'
    formula: (0.6**2*E1 + 0.8**2*4*E1)
    equals: 73/25*E1
    samples: {E1: [0.1, 2.0]}
    tolerance: 1e-12
    shown: ['\langle\hat H\rangle = \sum_n|b_n|^2E_n']
    source: {cite: reading2, at: 'eq. (2.28)'}
    origin: page-own

  - id: ex-a-E1-J
    where: 'example (a): π²ħ²/(2 m a²) J'
    inputs: {}
    formula: pi**2*1.054572e-34**2/(2*9.109e-31*1e-9**2)
    expected: '6.025e-20'
    tolerance: 0.005e-20
    shown: ['\approx 6.025 \times 10^{-20}$ J']
    source: {cite: reading2, at: 'eq. (2.10)'}
    origin: page-own

  - id: ex-a-E1-eV
    where: 'example (a): E₁ in eV'
    inputs: {}
    formula: pi**2*1.054572e-34**2/(2*9.109e-31*1e-9**2)/1.602177e-19
    expected: '0.376'
    tolerance: 0.0005
    shown: ['$\approx 0.376$ eV, and']
    source: {cite: reading2, at: 'eq. (2.10)'}
    origin: page-own

  - id: ex-a-E2
    where: 'example (a): 4 E₁ in eV'
    inputs: {}
    formula: 4*pi**2*1.054572e-34**2/(2*9.109e-31*1e-9**2)/1.602177e-19
    expected: '1.504'
    tolerance: 0.0005
    shown: ['$E_2 = 4E_1 \approx 1.504$ eV']
    source: {cite: reading2, at: 'eq. (2.10)'}
    origin: page-own

  - id: ex-b-H
    where: 'example (b): (E₁ + E₂)/2 in eV'
    inputs: {}
    formula: 2.5*pi**2*1.054572e-34**2/(2*9.109e-31*1e-9**2)/1.602177e-19
    expected: '0.940'
    tolerance: 0.0005
    shown: ['\frac12E_2 \approx 0.940$ eV']
    source: {cite: reading2, at: 'eq. (2.28)'}
    origin: page-own

  - id: ex-b-gap
    where: 'example (b): E₂ − E₁ in eV'
    inputs: {}
    formula: 3*pi**2*1.054572e-34**2/(2*9.109e-31*1e-9**2)/1.602177e-19
    expected: '1.128'
    tolerance: 0.0005
    shown: ['4.136 \times 10^{-15}/1.128']
    source: {cite: reading2, at: 'eq. (2.20)'}
    origin: page-own

  - id: ex-b-period
    where: 'example (b): h/(E₂ − E₁) s'
    inputs: {}
    formula: 4.135667e-15/(3*pi**2*1.054572e-34**2/(2*9.109e-31*1e-9**2)/1.602177e-19)
    expected: '3.67e-15'
    tolerance: 0.005e-15
    shown: ['\approx 3.67 \times 10^{-15}$ s']
    source: {cite: reading2, at: 'eq. (2.20)'}
    origin: page-own

  - id: ex-c
    where: 'example (c): 2.92 E₁ in eV'
    inputs: {}
