# Calculations on content/year-3/8.05/hermitian-unitary-position-states.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 9 transcript and Zwiebach's notes chapters 3–5, with the page's own example.

page: content/year-3/8.05/hermitian-unitary-position-states.mdx
calcs:
  - id: momentum-derivative
    kind: identity
    where: 'p (x, p) = (hbar/i) d/dx (x, p): the derivative of exp(i p x/hbar) brings down i p/hbar (checked on the real part: d/dx cos(p x/hbar) = −(p/hbar) sin(p x/hbar))'
    formula: deriv('cos(p*s/hbar)', 's', x)
    equals: -(p/hbar)*sin(p*x/hbar)
    samples: {p: [0.7, 2.0], x: [0.3, 1.5], hbar: [1.0, 0.5]}
    tolerance: 1e-6
    shown: ['= \frac{\hbar}{i}\frac{d}{dx}\,\psi(x)']
    source: {cite: reading3, at: 'eq. (3.109)'}
    origin: mit

  - id: ex-normalisation
    where: 'example: (3/5)^2 + (4/5)^2'
    inputs: {}
    formula: (3/5)**2 + (4/5)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['$(\psi, \psi) = 9/25 + 16/25 = 1$']
    source: {cite: reading4, at: 'eq. (1.1)'}
    origin: page-own

  - id: ex-expectation
    where: 'example: <A> = (3/5)^2 − (4/5)^2'
    inputs: {}
    formula: (3/5)**2 - (4/5)**2
    expected: '-0.28'
    tolerance: 1e-12
    shown: ['$\langle A\rangle = 9/25 - 16/25 = -7/25$']
    source: {cite: reading4, at: 'eq. (1.1)'}
    origin: page-own

  - id: ex-uncertainty-squared
    where: 'example: 1 − (7/25)^2 = 576/625'
    inputs: {}
    formula: 1 - (7/25)**2
    expected: '0.9216'
    tolerance: 1e-12
    shown: ['$(\Delta A)^2 = 1 - 49/625 = 576/625$']
    source: {cite: reading4, at: 'eq. (1.9)'}
    origin: page-own

  - id: ex-uncertainty
    where: 'example: sqrt(576/625) = 24/25'
    inputs: {}
    formula: sqrt(576/625)
    expected: '0.96'
    tolerance: 1e-12
    shown: ['$\Delta A = 24/25$']
    source: {cite: reading4, at: 'eq. (1.9)'}
    origin: page-own

  - id: ex-psi-perp-1
    where: 'example: first component of A psi − <A> psi: 3/5 − (−7/25)(3/5) = 96/125'
    inputs: {}
    formula: 3/5 + (7/25)*(3/5) - 96/125
    expected: '0'
    tolerance: 1e-12
    shown: ['$\psi_\perp = A\psi - \langle A\rangle\psi = (96/125, -72/125)$']
    source: {cite: reading4, at: 'eq. (1.13)'}
    origin: page-own

  - id: ex-psi-perp-2
    where: 'example: second component: −4/5 − (−7/25)(4/5) = −72/125'
    inputs: {}
    formula: -4/5 + (7/25)*(4/5) + 72/125
    expected: '0'
    tolerance: 1e-12
    shown: ['$\langle A\rangle\psi = (-21/125, -28/125)$']
    source: {cite: reading4, at: 'eq. (1.13)'}
    origin: page-own

  - id: ex-orthogonal
    where: 'example: (psi, psi_perp) = (3·96 − 4·72)/625'
    inputs: {}
    formula: (3*96 - 4*72)/625
    expected: '0'
    tolerance: 0
    shown: ['$(3 \times 96 - 4 \times 72)/625 = 0$']
    source: {cite: reading4, at: 'eq. (1.13)'}
    origin: page-own

  - id: ex-perp-length
    where: 'example: (96^2 + 72^2)/125^2 = 14400/15625, and sqrt = 120/125'
    inputs: {}
    formula: sqrt((96**2 + 72**2)/125**2)
    expected: '0.96'
    tolerance: 1e-12
    shown: ['$(9216 + 5184)/15625 = 14400/15625$', '$\sqrt{14400}/125 = 120/125 = 24/25$']
    source: {cite: reading4, at: 'eq. (1.13)'}
    origin: page-own
