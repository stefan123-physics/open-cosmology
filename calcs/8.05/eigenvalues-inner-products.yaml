# Calculations on content/year-3/8.05/eigenvalues-inner-products.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 7 transcript and Zwiebach's notes chapter 3, with the page's own example.

page: content/year-3/8.05/eigenvalues-inner-products.mdx
calcs:
  - id: components-orthonormal
    kind: identity
    where: 'sum_i a_i delta_ki = a_k (checked for k = 2 in three dimensions)'
    formula: a1*0 + a2*1 + a3*0
    equals: a2
    samples: {a1: [0.3, -2.0], a2: [1.5, 4.0], a3: [-0.7, 2.5]}
    tolerance: 1e-12
    shown: ['= a_k']
    source: {cite: reading2, at: 'eq. (5.78)'}
    origin: mit

  - id: gs-e1-v2
    where: 'example (a): (e1, v2) = (1·1 + 1·0 + 0·1)/sqrt(2)'
    inputs: {}
    formula: (1*1 + 1*0 + 0*1)/sqrt(2)
    expected: '0.70710678'
    tolerance: 1e-8
    shown: ['$(e_1, v_2) = 1/\sqrt{2}$']
    source: {cite: reading2, at: 'eq. (5.80)'}
    origin: page-own

  - id: gs-residual-norm2
    where: 'example (a): |(1/2, −1/2, 1)|^2'
    inputs: {}
    formula: 0.5**2 + (-0.5)**2 + 1**2
    expected: '1.5'
    tolerance: 1e-12
    shown: ['= \tfrac{3}{2}$']
    source: {cite: reading2, at: 'eq. (5.80)'}
    origin: page-own

  - id: gs-e2-normalised
    where: 'example (a): e2 = (1/2, −1/2, 1)/sqrt(3/2) has first component 1/sqrt(6)'
    inputs: {}
    formula: 0.5/sqrt(1.5) - 1/sqrt(6)
    expected: '0'
    tolerance: 1e-12
    shown: ['$e_2 = (1, -1, 2)/\sqrt{6}$']
    source: {cite: reading2, at: 'eq. (5.80)'}
    origin: page-own

  - id: gs-orthogonal
    where: 'example (a): e1 · e2 = (1 − 1 + 0)/sqrt(12)'
    inputs: {}
    formula: (1*1 + 1*(-1) + 0*2)/sqrt(12)
    expected: '0'
    tolerance: 1e-12
    shown: ['$e_1 \cdot e_2 = (1 - 1 + 0)/\sqrt{12} = 0$']
    source: {cite: reading2, at: 'eq. (5.80)'}
    origin: page-own

  - id: gs-e2-unit
    where: 'example (a): |e2|^2 = (1 + 1 + 4)/6'
    inputs: {}
    formula: (1 + 1 + 4)/6
    expected: '1'
    tolerance: 1e-12
    shown: ['$|e_2|^2 = (1 + 1 + 4)/6 = 1$']
    source: {cite: reading2, at: 'eq. (5.80)'}
    origin: page-own

  - id: complex-orthogonal
    where: 'example (b): (a, b) = conj(1)·i + conj(i)·1 = i − i, imaginary part 1 − 1'
    inputs: {}
    formula: 1 - 1
    expected: '0'
    tolerance: 0
    shown: ['$(a, b) = 1^* \cdot i + i^* \cdot 1 = i - i = 0$']
    source: {cite: reading2, at: 'eq. (4.68)'}
    origin: page-own

  - id: complex-norm
    where: 'example (b) and quiz 1: (a, a) = 1·1 + (−i)(i) = 1 + 1'
    inputs: {}
    formula: 1 + 1
    expected: '2'
    tolerance: 0
    shown: ['$(a, a) = 1 + (-i)(i) = 2$']
    source: {cite: reading2, at: 'eq. (4.68)'}
    origin: page-own

  - id: no-conjugate-length
    where: 'example (b): 1 + i^2 without conjugation'
    inputs: {}
    formula: 1 + (-1)
    expected: '0'
    tolerance: 0
    shown: ['would give $1 + i^2 = 0$']
    source: {cite: reading2, at: 'eq. (4.67)'}
    origin: page-own

  - id: quiz-max-eigenvalues
    kind: fact
    where: 'quiz 3: at most n = 4 distinct eigenvalues on a 4-dimensional space'
    value: 4
    shown: ['a 4-dimensional space has at most 4 linearly independent vectors']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit
