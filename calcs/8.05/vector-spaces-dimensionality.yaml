# Calculations on content/year-3/8.05/vector-spaces-dimensionality.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013, Zwiebach) Lecture 5 transcript and notes chapters 2–3, with the page's own example.

page: content/year-3/8.05/vector-spaces-dimensionality.mdx
calcs:
  - id: course-number
    kind: fact
    where: 'MIT linear algebra course that uses Axler (transcript p. 8)'
    value: '18.700'
    shown: ['the text of MIT''s 18.700']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: pauli-product-real
    kind: identity
    where: '(v·σ)² for v = (a, b, d): entry (1,1) of the matrix square, d² + (a − ib)(a + ib), equals |v|² as eq. (3.60) predicts'
    formula: d**2 + (a**2 + b**2)
    equals: a**2 + b**2 + d**2
    samples: {a: [0.5, 2.0], b: [0.5, 2.0], d: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['(\vec a\cdot\vec\sigma)(\vec b\cdot\vec\sigma) = (\vec a\cdot\vec b)\,1 + i\,(\vec a\times\vec b)\cdot\vec\sigma']
    source: {cite: reading2, at: 'eq. (3.60)'}
    origin: mit

  - id: ex-eigen
    where: 'example (b): eigenvalue 1 + 3 of M, root of λ² − 2λ − 8 = 0 (trace 2, det −8)'
    inputs: {}
    formula: solve('x**2 - 2*x - 8', 'x', 0, 10)
    expected: '4'
    tolerance: 1e-9
    shown: ['$M$ has eigenvalues $4$ and $-2$']
    source: {cite: reading2, at: 'eq. (3.61)'}
    origin: page-own

  - id: hermitian-det
    kind: identity
    where: 'det of ((c + d, a − ib), (a + ib, c − d)) equals c² − (a² + b² + d²), the product of the eigenvalues c ± |v|'
    formula: (c + d)*(c - d) - (a**2 + b**2)
    equals: (c + sqrt(a**2 + b**2 + d**2))*(c - sqrt(a**2 + b**2 + d**2))
    samples: {a: [0.5, 2.0], b: [0.5, 2.0], c: [-1.0, 1.0], d: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['= c\,1 + a\,\sigma_1 + b\,\sigma_2 + d\,\sigma_3, \qquad a, b, c, d\ \text{real}']
    source: {cite: reading1, at: 'pp. 21–22'}
    origin: mit

  - id: ex-norm
    where: 'example (b): |v|² for v = (1, 2, 2)'
    inputs: {}
    formula: 1**2 + 2**2 + 2**2
    expected: '9'
    tolerance: 0
    shown: ['= |\vec v|^2\,1 = 9\cdot1$']
    source: {cite: reading2, at: 'eq. (3.61)'}
    origin: page-own

  - id: ex-det
    where: 'example (c): det M = 3 × (−1) − (1 + 4)'
    inputs: {}
    formula: 3*(-1) - (1**2 + 2**2)
    expected: '-8'
    tolerance: 0
    shown: ['$\det M = -3 - (1 + 4) = -8 = 4 \times (-2)$']
    source: {cite: reading3, at: 'eqs. (1.9), (1.10)'}
    origin: page-own
