# Calculations on content/year-3/8.05/ammonia-maser-nmr.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 17 transcript and Zwiebach's notes chapter 7, with the page's own example.

page: content/year-3/8.05/ammonia-maser-nmr.mdx
calcs:
  - id: splitting
    kind: fact
    where: 'ammonia splitting 2Δ'
    value: '0.9872e-4 eV'
    shown: ['2\Delta = 0.9872 \times 10^{-4}\ \text{eV}']
    source: {cite: reading2, at: 'eq. (4.45)'}
    origin: mit

  - id: frequency
    where: 'ν = 2Δ/h = 0.9872e-4 eV / 4.1357e-15 eV s, in GHz'
    inputs: {}
    formula: 0.9872e-4/4.135667e-15/1e9
    expected: '23.870'
    tolerance: 0.005
    shown: ['\nu = 23.870\ \text{GHz}']
    source: {cite: reading2, at: 'eq. (4.46)'}
    origin: mit

  - id: wavelength
    where: 'λ = c/ν in cm'
    inputs: {}
    formula: 2.99792458e10/23.870e9
    expected: '1.2559'
    tolerance: 0.0005
    shown: ['\lambda = 1.2559\ \text{cm}']
    source: {cite: reading2, at: 'eq. (4.47)'}
    origin: mit

  - id: flip-probability
    kind: identity
    where: 'up state: amplitudes (1/2)(e^{iΔt/ħ} + e^{−iΔt/ħ}) = cos(Δt/ħ); checked as cos² + sin² = 1'
    formula: cos(x)**2 + sin(x)**2
    equals: 1
    samples: {x: [0.3, 2.1]}
    tolerance: 1e-12
    shown: ['P_{\text{up}}(t) = \cos^2\frac{\Delta t}{\hbar}']
    source: {cite: reading2, at: 'eq. (4.51)'}
    origin: mit

  - id: weak-field-expansion
    kind: identity
    where: 'weak field: (Δ + v²/2Δ)² = Δ² + v² + v⁴/4Δ², so Δ + v²/2Δ matches sqrt(Δ² + v²) up to order v⁴'
    formula: (gap + shift**2/(2*gap))**2
    equals: gap**2 + shift**2 + shift**4/(4*gap**2)
    samples: {gap: [1.0, 2.0], shift: [0.01, 0.02]}
    tolerance: 1e-12
    shown: ['\Delta + \frac{\mu^2F^2}{2\Delta}']
    source: {cite: reading2, at: 'eq. (5.4)'}
    origin: mit

  - id: ex-exact-root
    where: 'example (a): sqrt(4.936² + 1²), in units of 1e-5 eV'
    inputs: {}
    formula: sqrt(4.936**2 + 1)
    expected: '5.036'
    tolerance: 0.0005
    shown: ['$\sqrt{(4.936)^2 + 1^2} \times 10^{-5} = 5.036 \times 10^{-5}$ eV']
    source: {cite: reading2, at: 'eq. (5.3)'}
    origin: page-own

  - id: ex-exact-shift
    where: 'example (a): exact rise in eV'
    inputs: {}
    formula: (sqrt(4.936**2 + 1) - 4.936)*1e-5
    expected: '1.00e-6'
    tolerance: '1%'
    shown: ['\approx 1.00 \times 10^{-6}$ eV. The']
    source: {cite: reading2, at: 'eq. (5.3)'}
    origin: page-own

  - id: ex-approx-shift
    where: 'example (a): (1e-5)²/(9.872e-5)'
    inputs: {}
    formula: (1e-5)**2/9.872e-5
    expected: '1.01e-6'
    tolerance: '0.5%'
    shown: ['\approx 1.01 \times 10^{-6}$ eV, within']
    source: {cite: reading2, at: 'eq. (5.4)'}
    origin: page-own

  - id: ex-time
    where: 'example (b): T = π ħ/(2 μF0)'
    inputs: {}
    formula: pi*6.582e-16/(2*1.0e-11)
    expected: '1.03e-4'
    tolerance: '1%'
    shown: ['\approx 1.03 \times 10^{-4}$ s']
    source: {cite: reading2, at: 'eq. (5.21)'}
    origin: page-own

  - id: ex-length
    where: 'example (b): 400 m/s × T'
    inputs: {}
    formula: 400*pi*6.582e-16/(2*1.0e-11)
    expected: '0.041'
    tolerance: '2%'
    shown: ['\approx 0.041$ m']
    source: {cite: reading2, at: 'eq. (5.21)'}
    origin: page-own

  - id: maser-year
    kind: fact
    where: 'first ammonia maser, Columbia, 1953'
    value: 1953
    shown: ['Townes, Gordon and Zeiger, 1953']
    source: {cite: reading2, at: 'p. 16'}
    origin: mit
