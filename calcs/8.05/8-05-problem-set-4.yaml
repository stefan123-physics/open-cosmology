# Calculations on content/year-3/8.05/8-05-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 lets the commutator act on a test wavefunction and differentiates numerically; Problem 2 integrates the
# mean position of a translated Gaussian and sums the Taylor series of a translated cubic; Problem 3 multiplies the
# matrices directly; Problem 4 uses the other ordering of the identity and the differential equation that the
# exponential obeys; Problem 5 writes the complex constants in real and imaginary parts; Problem 7 repeats the
# Gram-Schmidt integrals numerically and checks that what the projections leave over is orthogonal to the subspace.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.05/8-05-problem-set-4.mdx
calcs:
  # ---- Introduction

  - id: points-mit
    where: 'Introduction: MIT''s points, 10 + 10 + 10 + 10 + 5 + 5 + 15 over its seven problems'
    formula: |-
      10 + 10 + 10 + 10 + 5 + 5 + 15
    expected: '65'
    shown: ['5 of MIT''s 65 points']
    source: {cite: mit, at: 'Problems 1 to 7, pp. 1–4'}
    origin: page-own

  # ---- Problem 1: commutators. The test wavefunction is exp(-(y - 1)²/3); (f ψ)′ − f ψ′ divided by ψ must be f′.

  - id: p1-c-cube
    kind: identity
    where: 'Problem 1(c), n = 3: [q³, p]/(iħ) acting on the test wavefunction, ((y³ψ)′ − y³ψ′)/ψ, equals 3q²'
    formula: |-
      3*x**2
    equals: |-
      (deriv('y**3*exp(-(y - 1)**2/3)', 'y', x) - x**3*deriv('exp(-(y - 1)**2/3)', 'y', x))/exp(-(x - 1)**2/3)
    samples:
      x: [-1.2, 0.4, 1.1, -0.3, 0.8]
    tolerance: 1e-6
    shown: ['<Formula label="Commutator of a power of q with p"']
    source: {cite: mit, at: 'Problem 1(c), p. 1'}
    origin: page-own

  - id: p1-g
    kind: identity
    answer: p1-g
    where: 'Problem 1(e), answer box: g = ((fψ)′ − fψ′)/ψ for f = exp(−kx²), by numerical differentiation on the test wavefunction'
    formula: |-
      -2*k*x*exp(-k*x**2)
    equals: |-
      (deriv('exp(-k*y**2)*exp(-(y - 1)**2/3)', 'y', x) - exp(-k*x**2)*deriv('exp(-(y - 1)**2/3)', 'y', x))/exp(-(x - 1)**2/3)
    samples:
      k: [0.5, 0.8, 1.2, 1.6, 2.0]
      x: [0.3, 0.6, 0.9, 1.2, 1.5]
    tolerance: 1e-6
    shown: ['id="p1-g"', 'so $g(x) = -2kx\,e^{-kx^2}$']
    source: {cite: mit, at: 'Problem 1(e), p. 1 (our own addition)'}
    origin: page-own

  # ---- Problem 2: translations

  - id: p2-mean
    kind: identity
    answer: p2-mean
    where: 'Problem 2(c), answer box: the mean position of the wavefunction ψ(y − a) for a Gaussian ψ centred on x0, integrated numerically'
    formula: |-
      x0 + a
    equals: |-
      integrate('y*exp(-(y - a - x0)**2)', 'y', -30, 30)/sqrt(pi)
    samples:
      x0: [-2, -1, 0.5, 1.2, 2]
      a: [0.5, 1.1, 1.7, 2.4, 3]
    tolerance: 1e-7
    shown: ['id="p2-mean"', '<Formula label="Mean position after the translation"']
    source: {cite: mit, at: 'Problem 2(c), p. 2 (our own addition)'}
    origin: page-own

  - id: p2-taylor
    kind: identity
    where: 'Problem 2(c): the series of exp(−a d/dy) on the cubic y³ (it stops after four terms) gives (y − a)³'
    formula: |-
      (y0 - a)**3
    equals: |-
      y0**3 - a*deriv('y**3', 'y', y0) + a**2/2*deriv('y**3', 'y', y0, 2) - a**3
    samples:
      y0: [-1.2, 0.4, 1.1, -0.3, 0.8]
      a: [0.5, 1.1, 1.7, 2.4, 3]
    tolerance: 1e-4
    shown: ['<Formula label="The exponential of a derivative is a Taylor series"']
    source: {cite: mit, at: 'Problem 2(c), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3: the Hadamard lemma for A = [[0, s], [0, 0]], B = [[0, 0], [1, 0]]

  - id: p3-entry
    kind: identity
    answer: p3-entry
    where: 'Problem 3(b), answer box: the top-right entry of (I + A) B (I − A) by direct matrix multiplication (row 1 of (I + A)B is (s, 0))'
    formula: |-
      -s**2
    equals: |-
      (1*0 + s*1)*(-s) + (1*0 + s*0)*1
    samples:
      s: [0.5, 0.9, 1.3, 1.7, 2.0]
    tolerance: 1e-12
    shown: ['id="p3-entry"', '<Formula label="The same matrix by direct multiplication"']
    source: {cite: mit, at: 'Problem 3, p. 2 (our own addition)'}
    origin: page-own

  - id: p3-double
    kind: identity
    where: 'Problem 3(b): the top-right entry of [A, [A, B]] = A·(s diag(1, −1)) − (s diag(1, −1))·A'
    formula: |-
      -2*s**2
    equals: |-
      s*(-s) - s*s
    samples:
      s: [0.5, 0.9, 1.3, 1.7, 2.0]
    tolerance: 1e-12
    shown: ['<Formula label="The commutators of the two matrices"']
    source: {cite: mit, at: 'Problem 3, p. 2 (our own addition)'}
    origin: page-own

  - id: p3-series
    kind: identity
    where: 'Problem 3(b): the top-right entry from the series, B + [A, B] + [A, [A, B]]/2'
    formula: |-
      -s**2
    equals: |-
      0 + 0 + (-2*s**2)/2
    samples:
      s: [0.5, 0.9, 1.3, 1.7, 2.0]
    tolerance: 1e-12
    shown: ['<Formula label="The lemma for the two matrices"']
    source: {cite: mit, at: 'Problem 3, p. 2 (our own addition)'}
    origin: page-own

  # ---- Problem 4: A = s d/dx, B = kx

  - id: p4-c
    kind: identity
    where: 'Problem 4(c): the commutator [A, B] acting on the test wavefunction, (s (k y ψ)′ − k y s ψ′)/ψ, is the number sk'
    formula: |-
      s*k
    equals: |-
      (s*deriv('k*y*exp(-(y - 1)**2/3)', 'y', x) - k*x*s*deriv('exp(-(y - 1)**2/3)', 'y', x))/exp(-(x - 1)**2/3)
    samples:
      s: [0.3, 0.6, 0.9, 1.2, 1.5]
      k: [1.5, 0.3, 1.1, 0.7, 0.5]
      x: [-1, -0.4, 0.2, 0.6, 1]
    tolerance: 1e-6
    shown: ['so $c = sk$']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own addition)'}
    origin: page-own

  - id: p4-act
    kind: identity
    answer: p4-act
    where: 'Problem 4(c), answer box: the other ordering, exp(A) exp(B) exp(−c/2) on 1, with exp(A) the translation x → x + s'
    formula: |-
      exp(k*x + s*k/2)
    equals: |-
      exp(k*(x + s))*exp(-s*k/2)
    samples:
      k: [1.5, 0.3, 1.1, 0.7, 0.5]
      x: [-1, -0.4, 0.2, 0.6, 1]
      s: [0.3, 0.6, 0.9, 1.2, 1.5]
    tolerance: 1e-12
    shown: ['id="p4-act"', '<Formula label="The exponential of the sum acting on 1"']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own addition)'}
    origin: page-own

  - id: p4-pde
    kind: identity
    where: 'Problem 4(c), check: u(t, x) = exp(kxt + skt²/2) obeys ∂u/∂t = s ∂u/∂x + kx u (numerical derivatives)'
    formula: |-
      deriv('exp(k*x*tt + s*k*tt**2/2)', 'tt', t0)
    equals: |-
      s*deriv('exp(k*y*t0 + s*k*t0**2/2)', 'y', x) + k*x*exp(k*x*t0 + s*k*t0**2/2)
    samples:
      k: [1.5, 0.3, 1.1, 0.7, 0.5]
      x: [-1, -0.4, 0.2, 0.6, 1]
      s: [0.3, 0.6, 0.9, 1.2, 1.5]
      t0: [0.2, 0.5, 0.8, 1.0, 1.0]
    tolerance: 1e-6
    shown: ['$u(t, x) = e^{kxt + skt^2/2}$']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own addition)'}
    origin: page-own

  - id: p4-swap
    kind: identity
    where: 'Problem 4(c), choice box: for the example, exp(A) exp(B) 1 divided by exp(B) exp(A) 1 is exp(c) with c = sk'
    formula: |-
      exp(s*k)
    equals: |-
      exp(k*(x + s))/exp(k*x)
    samples:
      k: [1.5, 0.3, 1.1, 0.7, 0.5]
      x: [-1, -0.4, 0.2, 0.6, 1]
      s: [0.3, 0.6, 0.9, 1.2, 1.5]
    tolerance: 1e-12
    shown: ['id="p4-swap"', '$e^A\,e^B = e^B\,e^A\,e^{c}$']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own addition)'}
    origin: page-own

  # ---- Problem 5: a = ar + i ai, b = br + i bi. b* a has real part br ar + bi ai and imaginary part br ai − bi ar.

  - id: p5-num
    answer: p5-num
    where: 'Problem 5(a), answer box: ⟨φ|ψ⟩ = b*a − a*b = 2i Im(b*a) for a = 1 + i, b = 2; the number that multiplies i'
    inputs: {ar: 1, ai: 1, br: 2, bi: 0}
    formula: |-
      2*(br*ai - bi*ar)
    expected: '4'
    tolerance: 1e-12
    shown: ['id="p5-num"', '$\langle\phi|\psi\rangle = 4i$']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own addition)'}
    origin: page-own

  - id: p5-z-re
    where: 'Problem 5(a): the real part of z = b*a for a = 1 + i, b = 2'
    inputs: {ar: 1, ai: 1, br: 2, bi: 0}
    formula: |-
      br*ar + bi*ai
    expected: '2'
    tolerance: 1e-12
    shown: ['$z = 2 + 2i$']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own addition)'}
    origin: page-own

  - id: p5-z-im
    where: 'Problem 5(a): the imaginary part of z = b*a for a = 1 + i, b = 2'
    inputs: {ar: 1, ai: 1, br: 2, bi: 0}
    formula: |-
      br*ai - bi*ar
    expected: '2'
    tolerance: 1e-12
    shown: ['b^*a - a^*b = 2(1 + i) - (1 - i)\,2 = 4i']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own addition)'}
    origin: page-own

  - id: p5-conj
    where: 'Problem 5(a), check: ⟨ψ|φ⟩ = a*b − b*a = −2i Im(b*a); the number that multiplies i'
    inputs: {ar: 1, ai: 1, br: 2, bi: 0}
    formula: |-
      -2*(br*ai - bi*ar)
    expected: '-4'
    tolerance: 1e-12
    shown: ['$\langle\psi|\phi\rangle = -4i$']
    source: {cite: mit, at: 'Problem 5(a), p. 3 (our own addition)'}
    origin: page-own

  - id: p5-a12
    kind: identity
    answer: p5-a12
    where: 'Problem 5(c), answer box: A₁₂ = b·(−b*) with b = mb e^(iθ), written in real and imaginary parts'
    formula: |-
      -mb**2
    equals: |-
      -((mb*cos(th))**2 + (mb*sin(th))**2)
    samples:
      mb: [0.5, 0.9, 1.3, 1.7, 2.0]
      th: [0.3, 1.1, 2.0, 2.9, 4.0]
    tolerance: 1e-12
    shown: ['id="p5-a12"', '<Formula label="The matrix of the ket-bra operator"']
    source: {cite: mit, at: 'Problem 5(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-tr
    kind: identity
    answer: p5-tr
    where: 'Problem 5(d), answer box: the trace from the diagonal of the matrix of Q, (|a|² + |b|²) + (|b|² + |a|²) + |a|²'
    formula: |-
      3*ma**2 + 2*mb**2
    equals: |-
      (ma**2 + mb**2) + (mb**2 + ma**2) + ma**2
    samples:
      ma: [0.5, 0.9, 1.3, 1.7, 2.0]
      mb: [2.0, 0.6, 1.1, 0.8, 1.5]
    tolerance: 1e-12
    shown: ['id="p5-tr"', '<Formula label="Trace of Q"']
    source: {cite: mit, at: 'Problem 5(d), p. 3 (our own addition)'}
    origin: page-own

  # ---- Problem 7: Gram-Schmidt on (1, x, …, x⁵) over −π ≤ x ≤ π, and the projections of sin and cos

  - id: p7-norm-1
    where: 'Problem 7(b): |1|² = 2π, numerically, minus 2π'
    formula: |-
      integrate('1 + 0*y', 'y', -pi, pi) - 2*pi
    expected: '0'
    tolerance: 1e-9
    shown: ['$|1|^2 = 2\pi$, so']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-norm-x
    where: 'Problem 7(b): |x|² = 2π³/3, numerically, minus 2π³/3'
    formula: |-
      integrate('y**2', 'y', -pi, pi) - 2*pi**3/3
    expected: '0'
    tolerance: 1e-9
    shown: ['|x|^2 = \int_{-\pi}^{\pi}x^2\,dx = \frac{2\pi^3}{3}']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-comp-x2
    where: 'Problem 7(b): the component of x² along e₁, (e₁, x²) e₁ = π²/3, numerically, minus π²/3'
    formula: |-
      integrate('y**2', 'y', -pi, pi)/(2*pi) - pi**2/3
    expected: '0'
    tolerance: 1e-9
    shown: ['= \frac{1}{2\pi}\cdot\frac{2\pi^3}{3} = \frac{\pi^2}{3}$']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-norm-e3
    where: 'Problem 7(b): the squared norm of x² − π²/3, 8π⁵/45, numerically, minus 8π⁵/45'
    formula: |-
      integrate('(y**2 - pi**2/3)**2', 'y', -pi, pi) - 8*pi**5/45
    expected: '0'
    tolerance: 1e-9
    shown: ['dx = \frac{8\pi^5}{45}$']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-e2
    kind: identity
    answer: p7-e2
    where: 'Problem 7(b), answer box: x divided by its norm, with the norm integrated numerically'
    formula: |-
      sqrt(3/(2*pi**3))*x
    equals: |-
      x/sqrt(integrate('y**2', 'y', -pi, pi))
    samples:
      x: [0.5, 1.1, 1.7, 2.4, 3.0]
    tolerance: 1e-9
    shown: ['id="p7-e2"']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-e3
    kind: identity
    answer: p7-e3
    where: 'Problem 7(b), answer box: Gram-Schmidt for x², with the component along e₁ and the norm integrated numerically'
    formula: |-
      sqrt(45/(8*pi**5))*(x**2 - pi**2/3)
    equals: |-
      (x**2 - integrate('y**2', 'y', -pi, pi)/(2*pi))/sqrt(integrate('(y**2 - pi**2/3)**2', 'y', -pi, pi))
    samples:
      x: [0.5, 1.1, 1.7, 2.4, 3.0]
    tolerance: 1e-9
    shown: ['id="p7-e3"', '<Formula label="The first three orthonormal functions"']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-norm-e4
    where: 'Problem 7(b): the norm squared of e4, numerically'
    formula: |-
      integrate('(sqrt(175/(8*pi**7))*(y**3 - 3*pi**2*y/5))**2', 'y', -pi, pi)
    expected: '1'
    tolerance: 1e-9
    shown: ['<Formula label="The last three orthonormal functions"']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-norm-e5
    where: 'Problem 7(b): the norm squared of e5, numerically'
    formula: |-
      integrate('(sqrt(11025/(128*pi**9))*(y**4 - 6*pi**2*y**2/7 + 3*pi**4/35))**2', 'y', -pi, pi)
    expected: '1'
    tolerance: 1e-9
    shown: ['e_5 = \sqrt']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-norm-e6
    where: 'Problem 7(b): the norm squared of e6, numerically'
    formula: |-
      integrate('(sqrt(43659/(128*pi**11))*(y**5 - 10*pi**2*y**3/9 + 5*pi**4*y/21))**2', 'y', -pi, pi)
    expected: '1'
    tolerance: 1e-9
    shown: ['e_6 = \sqrt']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-orth-13
    where: 'Problem 7(b), check: (e1, e3) = 0, numerically (pairs of one even and one odd function vanish by symmetry)'
    formula: |-
      integrate('(1/sqrt(2*pi))*(sqrt(45/(8*pi**5))*(y**2 - pi**2/3))', 'y', -pi, pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['$(e_1, e_3) \propto']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-orth-15
    where: 'Problem 7(b), check: (e1, e5) = 0, numerically (pairs of one even and one odd function vanish by symmetry)'
    formula: |-
      integrate('(1/sqrt(2*pi))*(sqrt(11025/(128*pi**9))*(y**4 - 6*pi**2*y**2/7 + 3*pi**4/35))', 'y', -pi, pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['$35y^4 - 30y^2 + 3$']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-orth-35
    where: 'Problem 7(b), check: (e3, e5) = 0, numerically (pairs of one even and one odd function vanish by symmetry)'
    formula: |-
      integrate('(sqrt(45/(8*pi**5))*(y**2 - pi**2/3))*(sqrt(11025/(128*pi**9))*(y**4 - 6*pi**2*y**2/7 + 3*pi**4/35))', 'y', -pi, pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['$3y^2 - 1$']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-orth-24
    where: 'Problem 7(b), check: (e2, e4) = 0, numerically (pairs of one even and one odd function vanish by symmetry)'
    formula: |-
      integrate('(sqrt(3/(2*pi**3))*y)*(sqrt(175/(8*pi**7))*(y**3 - 3*pi**2*y/5))', 'y', -pi, pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['$5y^3 - 3y$']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-orth-26
    where: 'Problem 7(b), check: (e2, e6) = 0, numerically (pairs of one even and one odd function vanish by symmetry)'
    formula: |-
      integrate('(sqrt(3/(2*pi**3))*y)*(sqrt(43659/(128*pi**11))*(y**5 - 10*pi**2*y**3/9 + 5*pi**4*y/21))', 'y', -pi, pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['$63y^5 - 70y^3 + 15y$']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-orth-46
    where: 'Problem 7(b), check: (e4, e6) = 0, numerically (pairs of one even and one odd function vanish by symmetry)'
    formula: |-
      integrate('(sqrt(175/(8*pi**7))*(y**3 - 3*pi**2*y/5))*(sqrt(43659/(128*pi**11))*(y**5 - 10*pi**2*y**3/9 + 5*pi**4*y/21))', 'y', -pi, pi)
    expected: '0'
    tolerance: 1e-9
    shown: ['Each $e_j$ has norm 1 and is orthogonal to the others']
    source: {cite: mit, at: 'Problem 7(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-int-s1
    where: 'Problem 7(c): the integral of y*sin(y) over the interval, numerically, minus its exact value 2*pi'
    formula: |-
      integrate('y*sin(y)', 'y', -pi, pi) - (2*pi)
    expected: '0'
    tolerance: 1e-8
    shown: ['\int_{-\pi}^{\pi}x\sin x\,dx = 2\pi']
    source: {cite: mit, at: 'Problem 7(c), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-int-s3
    where: 'Problem 7(c): the integral of y**3*sin(y) over the interval, numerically, minus its exact value 2*pi**3 - 12*pi'
    formula: |-
      integrate('y**3*sin(y)', 'y', -pi, pi) - (2*pi**3 - 12*pi)
    expected: '0'
    tolerance: 1e-8
    shown: ['x^3\sin x\,dx = 2\pi^3 - 12\pi']
    source: {cite: mit, at: 'Problem 7(c), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-int-s5
    where: 'Problem 7(c): the integral of y**5*sin(y) over the interval, numerically, minus its exact value 2*pi**5 - 40*pi**3 + 240*pi'
    formula: |-
      integrate('y**5*sin(y)', 'y', -pi, pi) - (2*pi**5 - 40*pi**3 + 240*pi)
    expected: '0'
    tolerance: 1e-8
    shown: ['x^5\sin x\,dx = 2\pi^5 - 40\pi^3 + 240\pi']
    source: {cite: mit, at: 'Problem 7(c), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-int-c0
    where: 'Problem 7(c): the integral of cos(y) over the interval, numerically, minus its exact value 0'
    formula: |-
      integrate('cos(y)', 'y', -pi, pi) - (0)
    expected: '0'
    tolerance: 1e-8
    shown: ['\int_{-\pi}^{\pi}\cos x\,dx = 0']
    source: {cite: mit, at: 'Problem 7(c), p. 4 (our own solution)'}
    origin: page-own

  - id: p7-int-c2
    where: 'Problem 7(c): the integral of y**2*cos(y) over the interval, numerically, minus its exact value -4*pi'
    formula: |-
      integrate('y**2*cos(y)', 'y', -pi, pi) - (-4*pi)
    expected: '0'
