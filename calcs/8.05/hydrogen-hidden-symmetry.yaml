# Calculations on content/year-3/8.05/hydrogen-hidden-symmetry.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 26 transcript and Zwiebach's notes chapter 10, with the page's own example.

page: content/year-3/8.05/hydrogen-hidden-symmetry.mdx
calcs:
  - id: level-counts
    where: 'level 3: 1 + 3 + 5 = 9 = n²'
    inputs: {}
    formula: 1 + 3 + 5
    expected: '9'
    tolerance: 1e-12
    shown: ['level 3 has $1 + 3 + 5 = 9$']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: energy-substitution
    kind: identity
    where: 'with H = −me⁴/(2ħ²ν²), −2H/(me⁴) = 1/(ħ²ν²)'
    formula: -2*(-mm*ee4/(2*hb**2*nu**2))/(mm*ee4)
    equals: 1/(hb**2*nu**2)
    samples: {mm: [0.9, 1.4], ee4: [0.5, 2.0], hb: [0.8, 1.2], nu: [1.0, 2.5]}
    tolerance: 1e-12
    shown: ['Then $-\frac{2H}{me^4} = \frac{1}{\hbar^2\nu^2}$']
    source: {cite: reading2, at: 'eq. (7.30)'}
    origin: mit

  - id: r-squared-rearranged
    kind: identity
    where: 'R² = 1 − (L² + ħ²)/(ħ²ν²) is the same as L² + ħ²ν²R² = ħ²(ν² − 1)'
    formula: ll2 + hb**2*nu**2*(1 - (ll2 + hb**2)/(hb**2*nu**2))
    equals: hb**2*(nu**2 - 1)
    samples: {ll2: [0.0, 2.0, 6.0], hb: [1.0, 0.7, 1.3], nu: [1.0, 3.0, 2.0]}
    tolerance: 1e-12
    shown: ['\vec L^2 + \hbar^2\nu^2\vec R^2 = \hbar^2\left(\nu^2 - 1\right)']
    source: {cite: reading2, at: 'eq. (7.32)'}
    origin: mit

  - id: nu-from-j
    kind: identity
    where: '1 + 4j(j + 1) = (2j + 1)²'
    formula: 1 + 4*jj*(jj + 1)
    equals: (2*jj + 1)**2
    samples: {jj: [0, 0.5, 1, 1.5, 2]}
    tolerance: 1e-12
    shown: ['\nu^2 = 1 + 4j(j+1) = (2j+1)^2 \quad\Longrightarrow']
    source: {cite: reading2, at: 'eq. (7.41)'}
    origin: mit

  - id: j1-squared
    kind: identity
    where: '¼(ν² − 1) = j(j + 1) when ν = 2j + 1'
    formula: ((2*jj + 1)**2 - 1)/4
    equals: jj*(jj + 1)
    samples: {jj: [0, 0.5, 1, 1.5, 2]}
    tolerance: 1e-12
    shown: ['= \frac{1}{4}\hbar^2\left(\nu^2 - 1\right) = \hbar^2\,j(j+1)']
    source: {cite: reading2, at: 'eq. (7.40)'}
    origin: mit

  - id: ex-a-j
    where: 'example (a): j = (n − 1)/2 for n = 4'
    inputs: {}
    formula: (4 - 1)/2
    expected: '1.5'
    tolerance: 1e-12
    shown: ['$j = \frac{n - 1}{2} = \frac{3}{2}$']
    source: {cite: reading2, at: 'eq. (7.42)'}
    origin: page-own

  - id: ex-a-check
    where: 'example (a): ¼(16 − 1) − (3/2)(5/2)'
    inputs: {}
    formula: (16 - 1)/4 - 1.5*2.5
    expected: '0'
    tolerance: 1e-12
    shown: ['$\frac{1}{4}(16 - 1) = \frac{15}{4}$']
    source: {cite: reading2, at: 'eq. (7.40)'}
    origin: page-own

  - id: ex-a-states
    where: 'example (a): 7 + 5 + 3 + 1'
    inputs: {}
    formula: 7 + 5 + 3 + 1
    expected: '16'
    tolerance: 1e-12
    shown: ['$7 + 5 + 3 + 1 = 16 = 4^2$ states']
    source: {cite: reading2, at: 'eq. (7.46)'}
    origin: page-own

  - id: ex-a-energy
    where: 'example (a): −13.6/16 eV'
    inputs: {}
    formula: -13.6/16
    expected: '-0.85'
    tolerance: 1e-12
    shown: ['$E = -13.6/16 = -0.85$ eV']
    source: {cite: reading2, at: 'eq. (7.1)'}
    origin: page-own

  - id: ex-b-ground
    where: 'example (b): R² = (ν² − 1 − L²/ħ²)/ν² with ν = 1, l = 0'
    inputs: {}
    formula: (1 - 1 - 0)/1
    expected: '0'
    tolerance: 1e-12
    shown: ['$\vec R^2 = (1 - 1 - 0)/1 = 0$']
    source: {cite: reading2, at: 'eq. (7.32)'}
    origin: page-own

  - id: ex-b-n2-l1
    where: 'example (b): ν = 2, L²/ħ² = 2'
    inputs: {}
    formula: (4 - 1 - 2)/4
    expected: '0.25'
    tolerance: 1e-12
    shown: ['$\vec R^2 = (4 - 1 - 2)/4 = \frac{1}{4}$']
    source: {cite: reading2, at: 'eq. (7.32)'}
    origin: page-own

  - id: ex-b-n2-l0
    where: 'example (b): ν = 2, l = 0'
    inputs: {}
    formula: (4 - 1 - 0)/4
    expected: '0.75'
    tolerance: 1e-12
    shown: ['for $n = 2$, $l = 0$ it is $\frac{3}{4}$']
    source: {cite: reading2, at: 'eq. (7.32)'}
    origin: page-own
