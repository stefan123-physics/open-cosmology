# Calculations on content/year-3/8.05/one-d-spectrum-variational.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013, Zwiebach) Lecture 2 transcript and notes chapter 1, with the page's own example.

page: content/year-3/8.05/one-d-spectrum-variational.mdx
calcs:
  - id: gauss-norm
    where: 'transcript p. 21: ∫ e^(−β²x²) dx = √π/β (β = 1.7)'
    inputs: {}
    formula: integrate('exp(-1.7**2*x**2)', 'x', -20, 20)
    expected: '1.04263'
    tolerance: 0.0001
    shown: ['with $\int\psi^2dx = \sqrt\pi/\beta$']
    source: {cite: reading2, at: 'eq. (5.23)'}
    origin: mit

  - id: F-beta
    kind: identity
    where: '[(ħ²/2m)∫(ψ′)² − α ψ(0)²] / ∫ψ² for ψ = e^(−β²x²/2) equals β²ħ²/4m − βα/√π (ħ = m = 1, numerical integrals)'
    formula: (0.5*integrate('(b**2*x*exp(-b**2*x**2/2))**2', 'x', -30, 30) - a)/integrate('exp(-b**2*x**2)', 'x', -30, 30)
    equals: b**2/4 - b*a/sqrt(pi)
    samples: {b: [0.5, 2.0], a: [0.5, 2.0]}
    tolerance: 1e-6
    shown: ['F(\beta) = \frac{\beta^2\hbar^2}{4m} - \frac{\beta\alpha}{\sqrt\pi}']
    source: {cite: reading2, at: 'eq. (5.24)'}
    origin: mit

  - id: F-min
    kind: identity
    where: 'F at β = 2mα/(√π ħ²) equals −mα²/(πħ²) (ħ = m = 1)'
    formula: (2*a/sqrt(pi))**2/4 - (2*a/sqrt(pi))*a/sqrt(pi)
    equals: -a**2/pi
    samples: {a: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['E_{\text{gs}} \le F_{\text{min}} = -\frac{m\alpha^2}{\pi\hbar^2}']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: mit

  - id: two-over-pi
    where: 'transcript p. 22: 2/π'
    inputs: {}
    formula: 2/pi
    expected: '0.64'
    tolerance: 0.005
    shown: ['The bound, about $0.64E_{\text{gs}}$']
    source: {cite: reading1, at: 'p. 22'}
    origin: mit

  - id: ex-num
    where: 'example (a): ∫₀¹ (1 − 2x)² dx = 1/3 (a = 1)'
    inputs: {}
    formula: integrate('(1 - 2*x)**2', 'x', 0, 1)
    expected: '0.33333'
    tolerance: 1e-5
    shown: ['\frac{\hbar^2}{2m}\cdot\frac{a^3}{3}']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own

  - id: ex-den
    where: 'example (a): ∫₀¹ x²(1 − x)² dx = 1/30 (a = 1)'
    inputs: {}
    formula: integrate('x**2*(1 - x)**2', 'x', 0, 1)
    expected: '0.033333'
    tolerance: 1e-6
    shown: ['\int_0^a\psi^2dx = \frac{a^5}{30}']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own

  - id: ex-exact
    where: 'example (a): π²/2'
    inputs: {}
    formula: pi**2/2
    expected: '4.935'
    tolerance: 0.0005
    shown: ['\approx 4.935\frac{\hbar^2}{ma^2}']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own

  - id: ex-percent
    where: 'example (a): (5/4.9348 − 1) × 100'
    inputs: {}
    formula: (5/(pi**2/2) - 1)*100
    expected: '1.3'
    tolerance: 0.05
    shown: ['only 1.3% above']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own

  - id: ex-scale
    where: 'example (b): ħ²/(m a²) in eV for an electron, a = 1 nm'
    inputs: {}
    formula: 1.054572e-34**2/(9.109e-31*1e-18)/1.602177e-19
    expected: '7.62e-2'
    tolerance: 0.005e-2
    shown: ['$\hbar^2/(ma^2) \approx 7.62 \times 10^{-2}$ eV']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own

  - id: ex-bound
    where: 'example (b): 5 × 0.0762 eV'
    inputs: {}
    formula: 5*0.0762
    expected: '0.381'
    tolerance: 0.0005
    shown: ['$F \approx 5 \times 0.0762 \approx 0.381$ eV']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own

  - id: ex-exact-eV
    where: 'example (b): 4.935 × 0.0762 eV'
    inputs: {}
    formula: 4.935*0.0762
    expected: '0.376'
    tolerance: 0.0005
    shown: ['$4.935 \times 0.0762 \approx 0.376$ eV']
    source: {cite: reading2, at: 'eq. (5.20)'}
    origin: page-own
