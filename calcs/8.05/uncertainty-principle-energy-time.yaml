# Calculations on content/year-3/8.05/uncertainty-principle-energy-time.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 10 transcript and Zwiebach's notes chapter 5, with the page's own example.

page: content/year-3/8.05/uncertainty-principle-energy-time.mdx
calcs:
  - id: sx-uncertainty
    kind: identity
    where: 'Delta S_x in z+: sqrt((hbar/2)^2 − 0) = hbar/2'
    formula: sqrt((hbar/2)**2 - 0)
    equals: hbar/2
    samples: {hbar: [1.0, 0.3]}
    tolerance: 1e-12
    shown: ['\Delta S_x = \frac{\hbar}{2}']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: waves-in-pulse
    kind: identity
    where: 'N = omega T/2pi, so Delta N = 1 gives Delta omega T = 2 pi'
    formula: (1*2*pi/T)*T
    equals: 2*pi
    samples: {T: [0.5, 3.0]}
    tolerance: 1e-12
    shown: ['$\Delta\omega\,T \approx 2\pi$']
    source: {cite: reading2, at: 'eqs. (3.33)–(3.34)'}
    origin: mit

  - id: hyperfine-splitting
    kind: fact
    where: 'hyperfine splitting of the hydrogen ground state'
    value: '5.88e-6 eV'
    shown: ['$5.88 \times 10^{-6}$ eV']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: hyperfine-wavelength
    where: '21 cm wavelength from the splitting: lambda = h c/E = 1239.84 eV nm / 5.88e-6 eV, in cm'
    inputs: {}
    formula: 1239.84e-9/5.88e-6*100
    expected: '21.1'
    tolerance: 0.05
    shown: ['wavelength 21.1 cm']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: hyperfine-frequency
    kind: fact
    where: 'hyperfine frequency, quoted in the notes to eleven significant digits as 1420.405751786 MHz'
    value: '1420 MHz'
    shown: ['frequency about 1420 MHz']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: hyperfine-lifetime-seconds
    where: '11 million years at pi × 1e7 s per year'
    inputs: {}
    formula: 11e6*pi*1e7
    expected: '3.46e14'
    tolerance: '2%'
    shown: ['about $3.5 \times 10^{14}$ s']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: hyperfine-width
    where: 'hbar/tau in eV: 6.582e-16 eV s / 3.4e14 s'
    inputs: {}
    formula: 6.582e-16/3.4e14
    expected: '1.94e-30'
    tolerance: '2%'
    shown: ['$\hbar/\tau \approx 2 \times 10^{-30}$ eV']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: hyperfine-relative-width
    where: 'Delta E / E = 1.94e-30 / 5.88e-6'
    inputs: {}
    formula: (6.582e-16/3.4e14)/5.88e-6
    expected: '3.3e-25'
    tolerance: '2%'
    shown: ['a fraction of about $3 \times 10^{-25}$ of the photon energy']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: ex-spin-bound
    kind: identity
    where: 'example (a): (1/2i)<[Sx, Sy]> = (hbar/2)<Sz> = (hbar/2)(hbar/2), equal to Delta Sx Delta Sy'
    formula: (hbar/2)*(hbar/2)
    equals: hbar**2/4
    samples: {hbar: [1.0, 0.7]}
    tolerance: 1e-12
    shown: ['$\Delta S_x\,\Delta S_y = \frac{\hbar}{2} \cdot \frac{\hbar}{2} = \hbar^2/4$']
    source: {cite: reading2, at: 'eq. (2.17)'}
    origin: page-own

  - id: ex-line-width
    where: 'example (b): hbar/(2 tau) with tau = 2.0 ns'
    inputs: {}
    formula: 6.58e-16/(2*2.0e-9)
    expected: '1.645e-7'
    tolerance: '2%'
    shown: ['$\Delta E \approx 6.58 \times 10^{-16}/(2 \times 2.0 \times 10^{-9}) \approx 1.6 \times 10^{-7}$ eV']
    source: {cite: reading2, at: 'eq. (3.43)'}
    origin: page-own

  - id: ex-line-fraction
    where: 'example (b): 1.645e-7 eV / 2.0 eV'
    inputs: {}
    formula: 6.58e-16/(2*2.0e-9)/2.0
    expected: '8.2e-8'
    tolerance: '2%'
    shown: ['a fraction $1.6 \times 10^{-7}/2.0 \approx 8 \times 10^{-8}$']
    source: {cite: reading2, at: 'eq. (3.43)'}
    origin: page-own

  - id: ex-ratio-to-21cm
    where: 'example (b): 8.2e-8 / 3.3e-25, about 1e17'
    inputs: {}
    formula: log10((6.58e-16/(2*2.0e-9)/2.0)/((6.582e-16/3.4e14)/5.88e-6))
    expected: '17.4'
    tolerance: '2%'
    shown: ['about $10^{17}$ times the relative width of the 21 cm line']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own
