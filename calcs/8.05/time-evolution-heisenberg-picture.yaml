# Calculations on content/year-3/8.05/time-evolution-heisenberg-picture.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 13 transcript and Zwiebach's notes chapter 6, with the page's own example.

page: content/year-3/8.05/time-evolution-heisenberg-picture.mdx
calcs:
  - id: oscillator-solution
    kind: identity
    where: 'x_H = x cos ωt + (p/mω) sin ωt satisfies d²x_H/dt² = −ω² x_H (checked with numbers x, p in place of the operators)'
    formula: deriv('x*cos(w*s) + p/(m*w)*sin(w*s)', 's', t, 2)
    equals: -w**2*(x*cos(w*t) + p/(m*w)*sin(w*t))
    samples: {x: [0.5, -1.2], p: [0.8, 2.0], m: [1.0, 2.5], w: [0.7, 1.9], t: [0.3, 1.4]}
    tolerance: 1e-4
    shown: ['\hat x_H(t) = \hat x\cos\omega t + \frac{\hat p}{m\omega}\sin\omega t, \qquad']
    source: {cite: reading2, at: 'eq. (3.44)'}
    origin: mit

  - id: oscillator-momentum
    kind: identity
    where: 'p_H = m dx_H/dt = p cos ωt − mω x sin ωt'
    formula: m*deriv('x*cos(w*s) + p/(m*w)*sin(w*s)', 's', t)
    equals: p*cos(w*t) - m*w*x*sin(w*t)
    samples: {x: [0.5, -1.2], p: [0.8, 2.0], m: [1.0, 2.5], w: [0.7, 1.9], t: [0.3, 1.4]}
    tolerance: 1e-6
    shown: ['\hat p_H(t) = \hat p\cos\omega t - m\omega\,\hat x\sin\omega t']
    source: {cite: reading2, at: 'eq. (3.44)'}
    origin: mit

  - id: hamiltonian-unchanged
    kind: identity
    where: 'H_H with x_H, p_H inserted equals H_S (numbers in place of operators, so p x + x p = 2 p x)'
    formula: (p*cos(w*t) - m*w*x*sin(w*t))**2/(2*m) + 0.5*m*w**2*(x*cos(w*t) + p/(m*w)*sin(w*t))**2
    equals: p**2/(2*m) + 0.5*m*w**2*x**2
    samples: {x: [0.5, -1.2], p: [0.8, 2.0], m: [1.0, 2.5], w: [0.7, 1.9], t: [0.3, 1.4]}
    tolerance: 1e-9
    shown: ['returns exactly $H_S$']
    source: {cite: reading1, at: 'pp. 20–21'}
    origin: mit

  - id: ex-force-x
    kind: identity
    where: 'example (a): x_H = x + p t/m + F t²/2m has second derivative F/m'
    formula: deriv('x + p*s/m + F*s**2/(2*m)', 's', t, 2)
    equals: F/m
    samples: {x: [0.5, -1.2], p: [0.8, 2.0], m: [1.0, 2.5], F: [0.4, -1.5], t: [0.3, 1.4]}
    tolerance: 1e-4
    shown: ['$\hat x_H(t) = \hat x + \frac{\hat p}{m}t + \frac{F}{2m}t^2$']
    source: {cite: reading2, at: 'eq. (3.23)'}
    origin: page-own

  - id: ex-spin-angle
    kind: identity
    where: 'example (b): integral of ω0 e^{−t/τ} from 0 to t equals ω0 τ (1 − e^{−t/τ})'
    formula: integrate('w0*exp(-s/tau)', 's', 0, t)
    equals: w0*tau*(1 - exp(-t/tau))
    samples: {w0: [1.0, 3.0], tau: [0.5, 2.0], t: [0.4, 3.0]}
    tolerance: 1e-6
    shown: ['$\int_0^t\omega_0e^{-t''/\tau}dt'' = \omega_0\tau(1 - e^{-t/\tau})$']
    source: {cite: reading2, at: 'eq. (2.46)'}
    origin: page-own
