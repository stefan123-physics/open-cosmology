# Calculations on content/year-3/8.05/linear-operators-matrices.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 6 transcript (Aram Harrow) and Zwiebach's notes chapter 3, with the page's own example.

page: content/year-3/8.05/linear-operators-matrices.mdx
calcs:
  - id: commutator-polynomials
    kind: identity
    where: '[d/dx, x] on x^n: (n + 1)x^n − n x^n equals x^n (checked as numbers at x)'
    formula: (n + 1)*x**n - n*x**n
    equals: x**n
    samples: {n: [1.0, 6.0], x: [0.5, 2.0]}
    tolerance: 1e-9
    shown: ['[T, S] = I']
    source: {cite: reading2, at: 'eq. (2.17)'}
    origin: mit

  - id: quiz-rank
    where: 'quiz 2: 5 − 2'
    inputs: {}
    formula: 5 - 2
    expected: '3'
    tolerance: 0
    shown: ['so the range has dimension $5 - 2 = 3$']
    source: {cite: reading2, at: 'eq. (2.20)'}
    origin: page-own

  - id: ex-rank-nullity
    where: 'example (a): 1 + 2 for D on polynomials of degree ≤ 2'
    inputs: {}
    formula: 1 + 2
    expected: '3'
    tolerance: 0
    shown: ['(dimension 2): $1 + 2 = 3$']
    source: {cite: reading2, at: 'eq. (2.20)'}
    origin: page-own

  - id: rotation-eigen
    kind: identity
    where: 'example (b): R(1, −i) = i(1, −i); first component check, R row 1 · (1, −i) = −(−i) = i'
    formula: -1*(-1)*s
    equals: s
    samples: {s: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['so $\lambda = i$ with eigenvector $(1, -i)$']
    source: {cite: reading2, at: 'eq. (3.50)'}
    origin: page-own

  - id: rotation-det
    where: 'example (b): det R = 0·0 − (−1)(1)'
    inputs: {}
    formula: 0*0 - (-1)*1
    expected: '1'
    tolerance: 0
    shown: ['determinant $1 = i \times (-i)$']
    source: {cite: reading2, at: 'eq. (2.48)'}
    origin: page-own
