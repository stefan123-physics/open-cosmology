# Calculations on content/year-3/8.05/spin-orbit-adding-angular-momentum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 24 transcript and Zwiebach's notes chapter 10, with the page's own example.

page: content/year-3/8.05/spin-orbit-adding-angular-momentum.mdx
calcs:
  - id: alpha-squared-ratio
    kind: identity
    where: 'ħ²/(m²c²a0²) with a0 = ħ²/(m e²) equals (e²/ħc)²'
    formula: hb**2/(mm**2*cc**2*(hb**2/(mm*ee2))**2)
    equals: (ee2/(hb*cc))**2
    samples: {hb: [1.1, 0.7], mm: [0.9, 1.3], cc: [2.0, 3.0], ee2: [0.5, 1.7]}
    tolerance: 1e-12
    shown: ['= \left(\frac{e^2}{\hbar c}\right)^2 = \alpha^2']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: one-part-in
    where: '137² ≈ 19,000 (the lecture: about 1 over 19,000)'
    inputs: {}
    formula: 137**2
    expected: '18769'
    tolerance: 1e-9
    shown: ['about one part in 19,000']
    source: {cite: reading1, at: 'p. 13'}
    origin: mit

  - id: states-count
    where: '3 × 2 = 4 + 2'
    inputs: {}
    formula: 4 + 2
    expected: '6'
    tolerance: 1e-12
    shown: ['3\times 2 = 4 + 2']
    source: {cite: reading1, at: 'p. 20'}
    origin: mit

  - id: lowering-left
    where: 'J− on |3/2, 3/2⟩: √(j(j+1) − m(m−1)) = √(15/4 − 3/4) = √3'
    inputs: {}
    formula: sqrt(3.75 - 1.5*0.5)
    expected: '1.7320508'
    tolerance: 1e-6
    shown: ['= \hbar\sqrt{3}\,|\frac{3}{2}, \frac{1}{2}\rangle$']
    source: {cite: reading1, at: 'p. 21'}
    origin: mit

  - id: lowering-L
    where: 'L− on |1, 1⟩: √(2 − 0) = √2'
    inputs: {}
    formula: sqrt(1*2 - 1*0)
    expected: '1.4142136'
    tolerance: 1e-6
    shown: ['$L_-$ gives $\hbar\sqrt{2}\,|1, 0\rangle']
    source: {cite: reading1, at: 'p. 21'}
    origin: mit

  - id: lowering-S
    where: 'S− on |1/2, 1/2⟩: √(3/4 − (1/2)(−1/2)) = 1'
    inputs: {}
    formula: sqrt(0.75 - 0.5*(-0.5))
    expected: '1'
    tolerance: 1e-12
    shown: ['$S_-$ gives $\hbar\,|1, 1\rangle']
    source: {cite: reading1, at: 'p. 21'}
    origin: mit

  - id: cg-coefficient
    where: '√2/√3 = √(2/3), the coefficient of |1,0⟩|1/2,1/2⟩'
    inputs: {}
    formula: sqrt(2)/sqrt(3) - sqrt(2/3)
    expected: '0'
    tolerance: 1e-12
    shown: ['\left|\tfrac{3}{2}, \tfrac{1}{2}\right\rangle = \sqrt{\tfrac{2}{3}}\,|1, 0\rangle']
    source: {cite: reading1, at: 'p. 22'}
    origin: mit

  - id: cg-orthogonal
    where: '⟨3/2,1/2|1/2,1/2⟩ = √(2/3)(−√(1/3)) + √(1/3)√(2/3) = 0'
    inputs: {}
    formula: sqrt(2/3)*(-sqrt(1/3)) + sqrt(1/3)*sqrt(2/3)
    expected: '0'
    tolerance: 1e-12
    shown: ['\left|\tfrac{1}{2}, \tfrac{1}{2}\right\rangle = -\sqrt{\tfrac{1}{3}}']
    source: {cite: reading1, at: 'p. 23'}
    origin: mit

  - id: ls-quartet
    where: 'L·S/ħ² for j = 3/2, l = 1, s = 1/2: ½(15/4 − 2 − 3/4)'
    inputs: {}
    formula: 0.5*(3.75 - 2 - 0.75)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['\ \ \frac{\hbar^2}{2}, & j = \frac{3}{2}']
    source: {cite: reading1, at: 'p. 23'}
    origin: mit

  - id: ls-doublet
    where: 'L·S/ħ² for j = 1/2: ½(3/4 − 2 − 3/4)'
    inputs: {}
    formula: 0.5*(0.75 - 2 - 0.75)
    expected: '-1'
    tolerance: 1e-12
    shown: ['-\hbar^2, & j = \frac{1}{2}']
    source: {cite: reading1, at: 'p. 23'}
    origin: mit

  - id: ex-a-count
    where: 'example (a): 5 × 2 = 6 + 4'
    inputs: {}
    formula: 6 + 4
    expected: '10'
    tolerance: 1e-12
    shown: ['$5 \times 2 = 6 + 4$']
    source: {cite: reading1, at: 'p. 20'}
    origin: page-own

  - id: ex-a-sum
    where: 'example (a): l(l+1) + s(s+1) = 6 + 3/4'
    inputs: {}
    formula: 6 + 0.75
    expected: '6.75'
    tolerance: 1e-12
    shown: ['$l(l+1) + s(s+1) = 6 + \frac{3}{4} = \frac{27}{4}$']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: ex-a-five-halves
    where: 'example (a): ½(35/4 − 27/4)'
    inputs: {}
    formula: 0.5*(35/4 - 27/4)
    expected: '1'
    tolerance: 1e-12
    shown: ['$\frac{1}{2}(\frac{35}{4} - \frac{27}{4}) = 1$']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: ex-a-three-halves
    where: 'example (a): ½(15/4 − 27/4)'
    inputs: {}
    formula: 0.5*(15/4 - 27/4)
    expected: '-1.5'
    tolerance: 1e-12
    shown: ['$\frac{1}{2}(\frac{15}{4} - \frac{27}{4}) = -\frac{3}{2}$']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: ex-a-trace
    where: 'example (a): 6 × 1 + 4 × (−3/2)'
    inputs: {}
    formula: 6*1 + 4*(-1.5)
    expected: '0'
    tolerance: 1e-12
    shown: ['$6 \times 1 + 4 \times (-\frac{3}{2}) = 0$']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: ex-b-alpha2-inverse
    where: 'example (b): 137.036²'
    inputs: {}
    formula: 137.036**2
    expected: '18779'
    tolerance: 0.5
    shown: ['$\alpha^2 = 1/18{,}779']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b-alpha2
    where: 'example (b): 1/137.036²'
    inputs: {}
    formula: 1/137.036**2
    expected: '5.33e-5'
    tolerance: '0.1%'
    shown: ['\approx 5.33 \times 10^{-5}$']
    source: {cite: reading1, at: 'p. 12'}
    origin: page-own

  - id: ex-b-scale
    where: 'example (b): 13.6 eV / 137.036²'
    inputs: {}
    formula: 13.6/137.036**2
    expected: '7.2e-4'
    tolerance: '1%'
    shown: ['\approx 7.2 \times 10^{-4}$ eV']
    source: {cite: reading1, at: 'p. 13'}
    origin: page-own

  - id: ex-c-sz
    where: 'example (c): (2/3)(1/2) + (1/3)(−1/2), in units of ħ'
    inputs: {}
    formula: (2/3)*0.5 + (1/3)*(-0.5)
    expected: '0.16667'
    tolerance: 0.00001
    shown: ['= \frac{\hbar}{6}$']
    source: {cite: reading1, at: 'p. 22'}
    origin: page-own

  - id: ex-c-lz
    where: 'example (c): (2/3)(0) + (1/3)(1), in units of ħ'
    inputs: {}
    formula: (2/3)*0 + (1/3)*1
    expected: '0.33333'
    tolerance: 0.00001
    shown: ['= \frac{\hbar}{3}$']
    source: {cite: reading1, at: 'p. 22'}
    origin: page-own
