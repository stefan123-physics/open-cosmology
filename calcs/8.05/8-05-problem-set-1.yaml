# Calculations on content/year-3/8.05/8-05-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates the wavefunction numerically, with numerical derivatives; Problem 3 replaces a delta function by a
# narrow square well, and solves the jump conditions numerically from numerical slopes; Problem 4 solves the exact
# equations of the finite well; Problems 5 and 6 compute <p> and the current from the real and imaginary parts of
# test wavefunctions. Problem 2 is a proof without numbers and has no entry.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.05/8-05-problem-set-1.mdx
calcs:
  # ---- Problem 1: psi = N x exp(-alpha x²/2). Every expectation value is recomputed by numerical integration, with
  # derivatives taken numerically, so nothing here uses the Gaussian integrals of the page.

  - id: p1-n
    kind: identity
    answer: p1-n
    where: 'Problem 1(a), answer box: N from the numerical integral of x² exp(-alpha x²)'
    formula: |-
      sqrt(2)*alpha**(3/4)/pi**(1/4)
    equals: |-
      1/sqrt(integrate('y**2*exp(-alpha*y**2)', 'y', -12, 12))
    samples:
      alpha: [0.5, 1, 1.7, 2.4, 3]
    tolerance: 1e-8
    shown: ['id="p1-n"', '<Formula label="Normalization of the wavefunction"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-x
    where: 'Problem 1(a), answer box: <x> for alpha = 1.3 by numerical integration over an interval that is not symmetric'
    formula: |-
      integrate('y*y**2*exp(-1.3*y**2)', 'y', -9, 11)/integrate('y**2*exp(-1.3*y**2)', 'y', -9, 11)
    expected: '0'
    tolerance: 1e-9
    shown: ['id="p1-x"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-x2
    kind: identity
    answer: p1-x2
    where: 'Problem 1(a), answer box: <x²> as a ratio of two numerical integrals'
    formula: |-
      3/(2*alpha)
    equals: |-
      integrate('y**4*exp(-alpha*y**2)', 'y', -12, 12)/integrate('y**2*exp(-alpha*y**2)', 'y', -12, 12)
    samples:
      alpha: [0.5, 1, 1.7, 2.4, 3]
    tolerance: 1e-8
    shown: ['id="p1-x2"', '<Formula label="Mean square position"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-p
    where: 'Problem 1(b), answer box: the integral of psi psi′ for alpha = 1.3 (it is <p> times i/ħ), slope taken numerically'
    formula: |-
      integrate("y*exp(-0.65*y**2)*deriv('s*exp(-0.65*s**2)', 's', y)", 'y', -9, 11)
    expected: '0'
    tolerance: 1e-8
    shown: ['id="p1-p"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-p2
    kind: identity
    answer: p1-p2
    where: 'Problem 1(b), answer box: <p²> = -ħ² ∫psi psi″ / ∫psi², with a numerical second derivative (the page integrates (psi′)² instead)'
    formula: |-
      3*hbar**2*alpha/2
    equals: |-
      -hbar**2*integrate("y*exp(-alpha*y**2/2)*deriv('s*exp(-alpha*s**2/2)', 's', y, 2)", 'y', -12, 12)/integrate('y**2*exp(-alpha*y**2)', 'y', -12, 12)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      alpha: [0.5, 1, 1.7, 2.4, 3]
    tolerance: 1e-5
    shown: ['id="p1-p2"', '<Formula label="Value of the mean square momentum"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-uncertainty
    where: 'Problem 1(b), check: Delta x Delta p in units of ħ, for alpha = 1.3'
    formula: |-
      sqrt(3/(2*1.3))*sqrt(3*1.3/2)
    expected: '1.5'
    shown: ['= \frac32\hbar$, above the least possible value']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-eig
    where: 'Problem 1(c), choice box: psi′/psi is not a constant (so psi is no momentum eigenstate): for alpha = 1 it is 1.5 at x = 0.5 and 0 at x = 1'
    formula: |-
      deriv('s*exp(-s**2/2)', 's', 0.5)/(0.5*exp(-0.125)) - deriv('s*exp(-s**2/2)', 's', 1.0)/(1.0*exp(-0.5))
    expected: '1.5'
    tolerance: 1e-6
    shown: ['id="p1-eig"', '<Formula label="The momentum operator on the wavefunction"']
    source: {cite: reading1, at: 'eq. (6.36)'}
    origin: page-own

  - id: p1-h
    kind: identity
    answer: p1-h
    where: 'Problem 1(d), answer box: <H> for V = 0 as (ħ²/2m) ∫(psi′)² / ∫psi², slope taken numerically'
    formula: |-
      3*hbar**2*alpha/(4*m)
    equals: |-
      hbar**2/(2*m)*integrate("deriv('s*exp(-alpha*s**2/2)', 's', y)**2", 'y', -12, 12)/integrate('y**2*exp(-alpha*y**2)', 'y', -12, 12)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      alpha: [0.5, 1, 1.7, 2.4, 3]
      m: [1, 0.5, 2, 1.5, 0.7]
    tolerance: 1e-5
    shown: ['id="p1-h"', '<Formula label="Mean energy of the free particle"']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-e
    kind: limit
    answer: p1-e
    where: 'Problem 1(e), answer box: E = -(ħ²/2m) psi″/psi where V = 0, that is as x0 → 0 (numerical second derivative; uses only V(0) = 0)'
    inputs: {hbar: 1.3, m: 0.7, alpha: 1.9}
    formula: |-
      3*hbar**2*alpha/(2*m)
    limit: |-
      -hbar**2/(2*m)*deriv('s*exp(-alpha*s**2/2)', 's', x0, 2)/(x0*exp(-alpha*x0**2/2))
    vary: {x0: [0.4, 0.2, 0.1, 0.05]}
    tolerance: 2e-3
    shown: ['id="p1-e"', '<Formula label="Energy and potential"']
    source: {cite: mit, at: 'Problem 1(e), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-v
    kind: identity
    answer: p1-v
    where: 'Problem 1(e), answer box: V(x) = E + (ħ²/2m) psi″/psi at sample points, with a numerical second derivative'
    formula: |-
      hbar**2*alpha**2*x**2/(2*m)
    equals: |-
      3*hbar**2*alpha/(2*m) + hbar**2/(2*m)*deriv('s*exp(-alpha*s**2/2)', 's', x, 2)/(x*exp(-alpha*x**2/2))
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      alpha: [0.5, 1, 1.7, 2.4, 3]
      m: [1, 0.5, 2, 1.5, 0.7]
      x: [0.5, 2.0, 0.9, 1.3, 1.7]
    tolerance: 1e-5
    shown: ['id="p1-v"', '<Formula label="The Schrödinger equation for the given wavefunction"']
    source: {cite: reading1, at: 'eq. (2.10)'}
    origin: page-own

  - id: p1-gs
    where: 'Problem 1(e), choice box: the nodeless Gaussian exp(-alpha x²/2) solves the same equation with the lower energy ħ²alpha/(2m): -(1/2) psi″/psi + alpha² x²/2 at x = 0.7 for alpha = 1.9, ħ = m = 1'
    formula: |-
      -0.5*deriv('exp(-1.9*s**2/2)', 's', 0.7, 2)/exp(-1.9*0.7**2/2) + 1.9**2*0.7**2/2
    expected: '0.95'
    tolerance: 1e-5
    shown: ['id="p1-gs"', 'with energy $\hbar^2\alpha/(2m)$']
    source: {cite: mit, at: 'Problem 1(e), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-virial
    kind: identity
    where: 'Problem 1(e), check: the potential part (ħ²alpha²/2m) <x²> equals the kinetic part 3ħ²alpha/(4m)'
    formula: |-
      hb**2*alpha**2/(2*mm)*3/(2*alpha)
    equals: |-
      3*hb**2*alpha/(4*mm)
    samples:
      hb: [0.5, 1, 1.5, 2, 0.8]
      alpha: [0.5, 1, 1.7, 2.4, 3]
      mm: [1, 0.5, 2, 1.5, 0.7]
    tolerance: 1e-12
    shown: ['\frac{\hbar^2\alpha^2}{2m}\cdot\frac{3}{2\alpha}$']
    source: {cite: mit, at: 'Problem 1(e), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 3: three delta functions. In units of a, with g = 2 m V0 a²/ħ² and eta = kappa a.

  - id: p3-jump
    kind: limit
    answer: p3-jump
    where: 'Problem 3(a), answer box: the delta function replaced by a square well of width w and depth V0 a/w; a wave that enters it flat (cos) at energy -0.3 leaves with psi′/psi = -q tan(q w), which must approach the jump as w → 0'
    inputs: {m: 0.7, V0: 1.3, a: 1.9, hbar: 1.1}
    formula: |-
      -2*m*V0*a/hbar**2
    limit: |-
      -sqrt(2*m*(V0*a/w - 0.3))/hbar*tan(sqrt(2*m*(V0*a/w - 0.3))/hbar*w)
    vary: {w: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-3
    shown: ['id="p3-jump"', '<Formula label="Jump of the slope at each delta function"']
    source: {cite: reading3, at: 'notes p. 3, eqs. (1.13)–(1.14)'}
    origin: page-own

  - id: p3-eta1
    where: 'Problem 3(c): the first (even, nodeless) state for g = 4, from the condition for the even states'
    formula: |-
      solve('16*sinh(s) - 4*s*(exp(s) + 2*cosh(s)) + 2*s**2*exp(s)', 's', 2, 3)
    expected: '2.295'
    shown: ['two solutions, $\eta = 2.295$', 'id="p3-count"']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eta3
    where: 'Problem 3(c): the third (even, two nodes) state for g = 4'
    formula: |-
      solve('16*sinh(s) - 4*s*(exp(s) + 2*cosh(s)) + 2*s**2*exp(s)', 's', 1, 1.6)
    expected: '1.300'
    shown: ['and $\eta = 1.300$, and the odd state']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-eta2
    where: 'Problem 3(c) and (d): the odd state for g = 4, from 2 eta = g (1 - exp(-2 eta))'
    formula: |-
      solve('2*s - 4*(1 - exp(-2*s))', 's', 1, 3)
    expected: '1.960'
    shown: ['has $\eta = 1.960$ in between', 'gives $\eta = 1.960$, the value used']
    source: {cite: mit, at: 'Problem 3(d), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-even-jump1
    where: 'Problem 3(c), check of the condition for the even states by another route: for g = 4 and eta = 2.2952526, with beta = -g/(2 eta) from the jump at 0, the numerical slopes on both sides of x = a differ by -g psi(a)'
    formula: |-
      (deriv('(cosh(2.2952526) - 4/(2*2.2952526)*sinh(2.2952526))*exp(-2.2952526*(y - 1))', 'y', 1) - deriv('cosh(2.2952526*y) - 4/(2*2.2952526)*sinh(2.2952526*y)', 'y', 1))/(cosh(2.2952526) - 4/(2*2.2952526)*sinh(2.2952526))
    expected: '-4.0000'
    tolerance: 1e-4
    shown: ['<Formula label="Condition for the even bound states"']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-even-jump3
    where: 'Problem 3(c), the same check for the third state, eta = 1.2996382'
    formula: |-
      (deriv('(cosh(1.2996382) - 4/(2*1.2996382)*sinh(1.2996382))*exp(-1.2996382*(y - 1))', 'y', 1) - deriv('cosh(1.2996382*y) - 4/(2*1.2996382)*sinh(1.2996382*y)', 'y', 1))/(cosh(1.2996382) - 4/(2*1.2996382)*sinh(1.2996382))
    expected: '-4.0000'
    tolerance: 1e-4
    shown: ['with 0, 1 and 2 nodes, as the node theorem demands']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-beta1
    where: 'Problem 3(c), graph: beta = -g/(2 eta) of the first state for g = 4 (size)'
    formula: |-
      4/(2*2.2952526)
    expected: '0.8714'
    shown: ['0.8714*sinh(2.2953*abs(x))']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-beta3
    where: 'Problem 3(c), graph: beta of the third state for g = 4 (size)'
    formula: |-
      4/(2*1.2996382)
    expected: '1.5389'
    tolerance: 0.0002
    shown: ['1.5389*sinh(1.2996*abs(x))']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-a
    where: 'Problem 3(b), choice box 3, and graph: the first state at x = a is not zero (g = 4)'
    formula: |-
      cosh(2.2952526) - 4/(2*2.2952526)*sinh(2.2952526)
    expected: '0.7327'
    shown: ['id="p3-a"', '0.7327*exp(-2.2953*(abs(x) - 1))']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-out
    where: 'Problem 3(b), choice box 1, and graph: the third state at x = a is not zero either; outside it is this value times a decaying exponential, which has no node'
    formula: |-
      cosh(1.2996382) - 4/(2*1.2996382)*sinh(1.2996382)
    expected: '-0.6422'
    shown: ['id="p3-out"', '-0.6422*exp(-1.2996*(abs(x) - 1))']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-in
    where: 'Problem 3(b), choice box 2, and graph: the one node of the third state between 0 and a, for g = 4'
    formula: |-
      solve('cosh(1.2996382*s) - 4/(2*1.2996382)*sinh(1.2996382*s)', 's', 0, 1)
    expected: '0.596'
    shown: ['id="p3-in"', 'at x = ±0.596a']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-0
    where: 'Problem 3(b), choice box 4, and graph: the odd state sinh(eta x) for g = 4 is scaled by its value at x = a'
    formula: |-
      sinh(1.9603)
    expected: '3.4805'
    tolerance: 0.0002
    shown: ['id="p3-0"', 'sinh(1.9603*x)/3.4805']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-e1
    where: 'Problem 3(c), check: energy of the first state for g = 4, -eta²/g in units of V0 (size)'
    formula: |-
      2.2952526**2/4
    expected: '1.317'
    shown: ['$-1.317\,V_0$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-e2
    where: 'Problem 3(c), check: energy of the odd state for g = 4 (size)'
    formula: |-
      1.9603452**2/4
    expected: '0.961'
    shown: ['$-0.961\,V_0$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-e3
    where: 'Problem 3(c), check: energy of the third state for g = 4 (size)'
    formula: |-
      1.2996382**2/4
    expected: '0.422'
    shown: ['$-0.422\,V_0$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-threshold3
    kind: limit
    where: 'Problem 3(c), check: the condition for the even states solved for g (larger root) tends to 3 as eta → 0'
    formula: |-
      3
    limit: |-
      eta*((exp(eta) + 2*cosh(eta)) + sqrt((9*cosh(eta) + 7*sinh(eta))*exp(-eta)))/(2*sinh(eta))
    vary: {eta: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.01
    shown: ['and $g \to 3$: the first state']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-threshold0
    kind: limit
    where: 'Problem 3(c), check: the smaller root tends to 0 as eta → 0'
    formula: |-
      eta*((exp(eta) + 2*cosh(eta)) - sqrt((9*cosh(eta) + 7*sinh(eta))*exp(-eta)))/(2*sinh(eta))
    limit: |-
      0
    vary: {eta: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.01
    shown: ['the two thresholds $g \to 0$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-g8-1
    where: 'Problem 3(c), check: first state for g = 8'
    formula: |-
      solve('64*sinh(s) - 8*s*(exp(s) + 2*cosh(s)) + 2*s**2*exp(s)', 's', 4.0, 6)
    expected: '4.095'
    shown: ['they are 4.095, 3.999 and 3.885']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-g8-2
    where: 'Problem 3(c), check: odd state for g = 8'
    formula: |-
      solve('2*s - 8*(1 - exp(-2*s))', 's', 3, 5)
    expected: '3.999'
    shown: ['which is the bound state of a single delta function of strength $V_0a$: three wells']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-g8-3
    where: 'Problem 3(c), check: third state for g = 8'
    formula: |-
      solve('64*sinh(s) - 8*s*(exp(s) + 2*cosh(s)) + 2*s**2*exp(s)', 's', 3, 4.0)
    expected: '3.885'
    shown: ['For large $g$ all three values of $\eta$ approach $g/2$']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-odd
    kind: identity
    answer: p3-odd
    where: 'Problem 3(d), answer box: g solved numerically from the jump condition at x = a, with the slopes of sinh(eta x) inside and of the decaying exponential outside taken numerically'
    formula: |-
      2*eta/(1 - exp(-2*eta))
    equals: |-
      solve("deriv('sinh(eta)*exp(-eta*(y - 1))', 'y', 1) - deriv('sinh(eta*y)', 'y', 1) + s*sinh(eta)", 's', 0.5, 50)
    samples:
      eta: [0.3, 0.9, 1.5, 2.2, 3.0]
    tolerance: 1e-6
    shown: ['id="p3-odd"', '<Formula label="Condition for the odd bound state"']
    source: {cite: mit, at: 'Problem 3(d), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-vmin
    kind: limit
    answer: p3-vmin
    where: 'Problem 3(d), answer box: V0 = (ħ²/2ma²) g, with g from the numerical jump condition, as the state becomes unbound (eta → 0)'
    inputs: {hbar: 1.3, m: 0.7, a: 1.9}
    formula: |-
      hbar**2/(2*m*a**2)
    limit: |-
      hbar**2/(2*m*a**2)*solve("deriv('sinh(eta)*exp(-eta*(y - 1))', 'y', 1) - deriv('sinh(eta*y)', 'y', 1) + s*sinh(eta)", 's', 0.5, 50)
    vary: {eta: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.02
    shown: ['id="p3-vmin"', '<Formula label="Threshold for the odd bound state"']
    source: {cite: mit, at: 'Problem 3(d), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 4: the finite square well, xi = k a, eta = kappa a, xi² + eta² = z0².

  - id: p4-n
    kind: identity
    answer: p4-n
    where: 'Problem 4(a), answer box: the width 2a divided by half the shortest wavelength, pi/k with k = sqrt(2 m V0)/ħ, in physical quantities; the z0 samples are a sqrt(2 m V0)/ħ of the other samples'
    formula: |-
      2*z0/pi
    equals: |-
      2*a/(pi/(sqrt(2*mm*V0)/hb))
    samples:
      z0: [5, 8, 12, 15, 40]
      a: [1, 2, 1.5, 3, 2]
      mm: [0.5, 2, 1, 0.5, 1]
      V0: [25, 4, 8, 100, 50]
      hb: [1, 1, 0.5, 2, 0.5]
    tolerance: 1e-12
    shown: ['id="p4-n"', '<Formula label="Number of bound states of a deep well"']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-top
    where: 'Problem 4(a), choice box: for z0 = 20 the 13th state exists: the even branch between 6 pi and 6.5 pi has a solution'
    formula: |-
      solve('s*tan(s) - sqrt(20**2 - s**2)', 's', 6*pi + 0.001, 19.99)
    expected: '19.14'
    shown: ['id="p4-exact"', '$\xi = 19.14$']
    source: {cite: reading2, at: 'notes p. 8, eq. (2.34)'}
    origin: page-own

  - id: p4-12th
    where: 'Problem 4(a), choice box: the 12th state (odd branch between 5.5 pi and 6 pi) exists too'
    formula: |-
      solve('-s/tan(s) - sqrt(20**2 - s**2)', 's', 5.5*pi + 0.001, 6*pi - 0.001)
    expected: '17.76'
    shown: ['so 6 odd states']
    source: {cite: reading2, at: 'notes p. 8, eq. (2.36)'}
    origin: page-own

  - id: p4-no14
    where: 'Problem 4(a), choice box: a 14th state would need xi above 6.5 pi, but xi cannot exceed z0 = 20'
    formula: |-
      6.5*pi
    expected: '20.42'
    shown: ['$\frac{13}{2}\pi = 20.42$']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-11half
    where: 'Problem 4(a): 5.5 pi'
    formula: |-
      5.5*pi
    expected: '17.28'
    shown: ['$\frac{11}{2}\pi = 17.28$']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-even-count
    where: 'Problem 4(a): 20/pi'
    formula: |-
      20/pi
    expected: '6.37'
    shown: ['$20/\pi = 6.37$']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-estimate
    where: 'Problem 4(a): the estimate for z0 = 20'
    formula: |-
      2*20/pi
    expected: '12.73'
    shown: ['$2 \times 20/\pi = 12.73$']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-nodes
    where: 'Problem 4(a), check: cos(xi x/a) with xi = 19.1433 has zeros at odd multiples of pi/2; 2 xi/pi = 12.19 lies between 11 and 13, so 12 of them are inside the well'
    formula: |-
      2*solve('s*tan(s) - sqrt(20**2 - s**2)', 's', 6*pi + 0.001, 19.99)/pi
    expected: '12.19'
    shown: ['has 12 nodes inside the well']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-e
    kind: limit
    answer: p4-e
    where: 'Problem 4(b), answer box: -V0 eta²/z0² with xi solved numerically from the exact equations, as z0 → 0'
    inputs: {V0: 1.7}
    formula: |-
      -V0*z0**2
    limit: |-
      -V0*(z0**2 - solve('s*tan(s) - sqrt(z0**2 - s**2)', 's', 0, z0)**2)/z0**2
    vary: {z0: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 1e-3
    shown: ['id="p4-e"', '<Formula label="Energy of the bound state of a shallow well"']
    source: {cite: reading2, at: 'notes p. 7, eq. (2.29)'}
    origin: page-own

  - id: p4-delta
    kind: identity
    where: 'Problem 4(b), check: the delta function of strength 2 a V0 gives the same energy'
    formula: |-
      -mm*(2*a*V0)**2/(2*hb**2)
    equals: |-
      -V0*(a*sqrt(2*mm*V0)/hb)**2
    samples:
      a: [1, 2, 1.5, 3, 2]
      mm: [0.5, 2, 1, 0.5, 1]
      V0: [0.2, 0.4, 0.8, 0.1, 0.5]
      hb: [1, 1, 0.5, 2, 0.5]
    tolerance: 1e-12
    shown: ['$-m\left(2aV_0\right)^2/(2\hbar^2) = -2ma^2V_0^2/\hbar^2$']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-exact01
    where: 'Problem 4(b), check: exact |E|/V0 for z0 = 0.1'
    formula: |-
      (0.1**2 - solve('s*tan(s) - sqrt(0.1**2 - s**2)', 's', 0, 0.1)**2)/0.1**2
    expected: '0.009869'
    shown: ['$|E|/V_0 = 0.009869$']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-diff01
    where: 'Problem 4(b), check: the difference from z0² = 0.01 in per cent'
    formula: |-
      (0.01 - (0.1**2 - solve('s*tan(s) - sqrt(0.1**2 - s**2)', 's', 0, 0.1)**2)/0.1**2)/0.01*100
    expected: '1.3'
    shown: ['a difference of 1.3%']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-next01
    where: 'Problem 4(b), check: the expansion with its next term for z0 = 0.1'
    formula: |-
