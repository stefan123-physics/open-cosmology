  # ---- Problem 5: <p>/ħ = ∫(u v′ - v u′) dx for psi = u + i v. Test functions: phi1 = exp(-y²), phi2 = exp(-(y - 0.6)²);
  # the identity for the numerator does not need a normalized psi.

  - id: p5-f
    kind: identity
    answer: p5-f
    where: 'Problem 5(b), answer box: the numerical <p>/ħ from the real and imaginary parts of psi, divided by the numerical integral of phi1 phi2′'
    formula: |-
      2*sin(alpha)
    equals: |-
      integrate("(exp(-y**2) + cos(alpha)*exp(-(y - 0.6)**2))*deriv('sin(alpha)*exp(-(s - 0.6)**2)', 's', y) - sin(alpha)*exp(-(y - 0.6)**2)*deriv('exp(-s**2) + cos(alpha)*exp(-(s - 0.6)**2)', 's', y)", 'y', -8, 8)/integrate("exp(-y**2)*deriv('exp(-(s - 0.6)**2)', 's', y)", 'y', -8, 8)
    samples:
      alpha: [0.3, 0.9, 1.5, 2.1, 2.8]
    tolerance: 1e-5
    shown: ['id="p5-f"', '<Formula label="Mean momentum from the interference of two real functions"']
    source: {cite: mit, at: 'Problem 5(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-zero
    where: 'Problem 5(b), choice box: for alpha = pi the numerical <p>/ħ vanishes although the integral of phi1 phi2′ does not'
    formula: |-
      integrate("(exp(-y**2) + cos(pi)*exp(-(y - 0.6)**2))*deriv('sin(pi)*exp(-(s - 0.6)**2)', 's', y) - sin(pi)*exp(-(y - 0.6)**2)*deriv('exp(-s**2) + cos(pi)*exp(-(s - 0.6)**2)', 's', y)", 'y', -8, 8)
    expected: '0'
    tolerance: 1e-8
    shown: ['id="p5-zero"']
    source: {cite: mit, at: 'Problem 5(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-zero-not
    where: 'Problem 5(b), choice box: for alpha = pi/2 it does not vanish: it is twice the integral of phi1 phi2′ (ratio 2)'
    formula: |-
      integrate("(exp(-y**2) + cos((pi/2))*exp(-(y - 0.6)**2))*deriv('sin((pi/2))*exp(-(s - 0.6)**2)', 's', y) - sin((pi/2))*exp(-(y - 0.6)**2)*deriv('exp(-s**2) + cos((pi/2))*exp(-(s - 0.6)**2)', 's', y)", 'y', -8, 8)/integrate("exp(-y**2)*deriv('exp(-(s - 0.6)**2)', 's', y)", 'y', -8, 8)
    expected: '2.0000'
    tolerance: 1e-4
    shown: ['The largest effect is at $\alpha = \pm\frac{\pi}{2}$']
    source: {cite: mit, at: 'Problem 5(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-k
    kind: identity
    answer: p5-k
    where: 'Problem 5(c), answer box: numerical <p> for psi = exp(i k x) exp(-x²/2), from its real and imaginary parts, divided by the norm'
    formula: |-
      hbar*k
    equals: |-
      hbar*integrate("cos(k*y)*exp(-y**2/2)*deriv('sin(k*s)*exp(-s**2/2)', 's', y) - sin(k*y)*exp(-y**2/2)*deriv('cos(k*s)*exp(-s**2/2)', 's', y)", 'y', -9, 9)/integrate('exp(-y**2)', 'y', -9, 9)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [2, 1.5, 1, 0.5, 1.2]
    tolerance: 1e-5
    shown: ['id="p5-k"', '<Formula label="Mean momentum of a boosted real wavefunction"']
    source: {cite: mit, at: 'Problem 5(c), p. 3 (our own solution)'}
    origin: page-own

  # ---- Problem 6: the current is J = (ħ/m)(u v′ - v u′) for a wavefunction u + i v.

  - id: p6-units
    kind: units
    where: 'Problem 6(a), choice box: ħ/m times one over length squared is one over time'
    terms: ['hbar/(1*kilogram)/(1*meter)**2', '1/second']
    unit: '1/second'
    shown: ['id="p6-units"']
    source: {cite: mit, at: 'Problem 6(a), p. 4 (our own solution)'}
    origin: page-own

  # rho = (phi0² + phi1² + 2 phi0 phi1 cos t)/2 with phi0 = pi^(-1/4) exp(-y²/2) and phi1 = sqrt(2) y phi0.
  - id: p6-dp
    where: 'Problem 6(b), choice box and check: d/dt of the integral of rho from 0.3 to 1.2 at t = 0.7, for the equal sum of the two lowest oscillator states (ħ = m = omega = 1), both steps numerical'
    formula: |-
      deriv("integrate('0.5*(exp(-y**2) + 2*y**2*exp(-y**2) + 2*sqrt(2)*y*exp(-y**2)*cos(tt))/sqrt(pi)', 'y', 0.3, 1.2)", 'tt', 0.7)
    expected: '-0.1740'
    shown: ['id="p6-dp"', 'gives $-0.1740$']
    source: {cite: mit, at: 'Problem 6(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p6-dp-current
    where: 'Problem 6(b), check: J(0.3) - J(1.2) at t = 0.7 from the real and imaginary parts of the same wavefunction (phases t/2 = 0.35 and 3t/2 = 1.05)'
    formula: |-
      ((exp(-0.3**2/2)*cos(0.35) + sqrt(2)*0.3*exp(-0.3**2/2)*cos(1.05))/sqrt(2*sqrt(pi))*deriv('(-(exp(-s**2/2)*sin(0.35) + sqrt(2)*s*exp(-s**2/2)*sin(1.05))/sqrt(2*sqrt(pi)))', 's', 0.3) - (-(exp(-0.3**2/2)*sin(0.35) + sqrt(2)*0.3*exp(-0.3**2/2)*sin(1.05))/sqrt(2*sqrt(pi)))*deriv('(exp(-s**2/2)*cos(0.35) + sqrt(2)*s*exp(-s**2/2)*cos(1.05))/sqrt(2*sqrt(pi))', 's', 0.3)) - ((exp(-1.2**2/2)*cos(0.35) + sqrt(2)*1.2*exp(-1.2**2/2)*cos(1.05))/sqrt(2*sqrt(pi))*deriv('(-(exp(-s**2/2)*sin(0.35) + sqrt(2)*s*exp(-s**2/2)*sin(1.05))/sqrt(2*sqrt(pi)))', 's', 1.2) - (-(exp(-1.2**2/2)*sin(0.35) + sqrt(2)*1.2*exp(-1.2**2/2)*sin(1.05))/sqrt(2*sqrt(pi)))*deriv('(exp(-s**2/2)*cos(0.35) + sqrt(2)*s*exp(-s**2/2)*cos(1.05))/sqrt(2*sqrt(pi))', 's', 1.2))
    expected: '-0.1740'
    shown: ['computed from the wavefunction gives the same number']
    source: {cite: mit, at: 'Problem 6(b), p. 4 (our own solution)'}
    origin: page-own

  - id: p6-j
    kind: identity
    answer: p6-j
    where: 'Problem 6(c), answer box: J from the real and imaginary parts of phi exp(i da x) at a sample point x0 (constant phi and constant slope da of the phase)'
    formula: |-
      hbar*phi**2*da/m
    equals: |-
      hbar/m*(phi*cos(da*x0)*deriv('phi*sin(da*y)', 'y', x0) - phi*sin(da*x0)*deriv('phi*cos(da*y)', 'y', x0))
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      phi: [2, 1.5, 1, 0.5, 1.2]
      da: [0.6, 1.1, 1.9, 0.8, 1.4]
      m: [1, 0.5, 2, 1.5, 0.7]
      x0: [0.4, -0.7, 1.3, 2.1, 0.9]
    tolerance: 1e-6
    shown: ['id="p6-j"']
    source: {cite: mit, at: 'Problem 6(c), p. 4 (our own solution)'}
    origin: page-own

  - id: p6-ratio
    where: 'Problem 6(c): J/rho for a phase that is not linear, alpha(x) = 0.7 x + 0.2 x², with phi = exp(-x²/2), at x = 0.8 in units of ħ/m: alpha′(0.8) = 1.02'
    formula: |-
      (exp(-0.8**2/2)*cos((0.7*0.8 + 0.2*0.8**2))*deriv('exp(-y**2/2)*sin((0.7*y + 0.2*y**2))', 'y', 0.8) - exp(-0.8**2/2)*sin((0.7*0.8 + 0.2*0.8**2))*deriv('exp(-y**2/2)*cos((0.7*y + 0.2*y**2))', 'y', 0.8))/exp(-0.8**2)
    expected: '1.0200'
    tolerance: 1e-5
    shown: ['<Formula label="Current of a wavefunction with a position-dependent phase"']
    source: {cite: mit, at: 'Problem 6(c), p. 4 (our own solution)'}
    origin: page-own

  - id: p6-jd
    kind: identity
    answer: p6-jd
    where: 'Problem 6(d), answer box: J at a sample point x0 from the real and imaginary parts of A exp(ipx/ħ) + B exp(-ipx/ħ), with A = sqrt(A2) and B = sqrt(B2) exp(i dl)'
    formula: |-
      p*(A2 - B2)/m
    equals: |-
      hb/m*((sqrt(A2)*cos(p*x0/hb) + sqrt(B2)*cos(dl - p*x0/hb))*deriv('sqrt(A2)*sin(p*y/hb) + sqrt(B2)*sin(dl - p*y/hb)', 'y', x0) - (sqrt(A2)*sin(p*x0/hb) + sqrt(B2)*sin(dl - p*x0/hb))*deriv('sqrt(A2)*cos(p*y/hb) + sqrt(B2)*cos(dl - p*y/hb)', 'y', x0))
    samples:
      p: [2, 1.5, 1, 0.5, 1.2]
      A2: [0.5, 2, 1.1, 1.6, 0.8]
      B2: [1.4, 0.6, 1.9, 0.5, 1.2]
      m: [1, 0.5, 2, 1.5, 0.7]
      hb: [0.5, 1, 1.5, 2, 0.8]
      x0: [0.4, -0.7, 1.3, 2.1, 0.9]
      dl: [0.3, 1.2, 2.5, 4.0, 5.5]
    tolerance: 1e-6
    shown: ['id="p6-jd"', '<Formula label="Current of two opposite plane waves"']
    source: {cite: mit, at: 'Problem 6(d), p. 4 (our own solution)'}
    origin: page-own

  - id: p6-cross
    where: 'Problem 6(d), choice box: the current is the same at two different points, x = 0.2 and x = 1.1 (A = 1.1, B = 0.6 exp(0.9 i), p/ħ = 1.3, ħ = m = 1)'
    formula: |-
      ((1.1*cos(1.3*0.2) + 0.6*cos(0.9 - 1.3*0.2))*deriv('1.1*sin(1.3*y) + 0.6*sin(0.9 - 1.3*y)', 'y', 0.2) - (1.1*sin(1.3*0.2) + 0.6*sin(0.9 - 1.3*0.2))*deriv('1.1*cos(1.3*y) + 0.6*cos(0.9 - 1.3*y)', 'y', 0.2)) - ((1.1*cos(1.3*1.1) + 0.6*cos(0.9 - 1.3*1.1))*deriv('1.1*sin(1.3*y) + 0.6*sin(0.9 - 1.3*y)', 'y', 1.1) - (1.1*sin(1.3*1.1) + 0.6*sin(0.9 - 1.3*1.1))*deriv('1.1*cos(1.3*y) + 0.6*cos(0.9 - 1.3*y)', 'y', 1.1))
    expected: '0'
    tolerance: 1e-8
    shown: ['id="p6-cross"']
    source: {cite: mit, at: 'Problem 6(d), p. 4 (our own solution)'}
    origin: page-own

  - id: p6-cross-rho
    where: 'Problem 6(d), check: the density does differ between the same two points (the standing pattern)'
    formula: |-
      (1.1*cos(1.3*0.2) + 0.6*cos(0.9 - 1.3*0.2))**2 + (1.1*sin(1.3*0.2) + 0.6*sin(0.9 - 1.3*0.2))**2 - (1.1*cos(1.3*1.1) + 0.6*cos(0.9 - 1.3*1.1))**2 - (1.1*sin(1.3*1.1) + 0.6*sin(0.9 - 1.3*1.1))**2
    expected: '1.73'
    shown: ['a standing pattern that does not move']
    source: {cite: mit, at: 'Problem 6(d), p. 4 (our own solution)'}
    origin: page-own
