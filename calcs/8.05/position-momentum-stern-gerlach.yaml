# Calculations on content/year-3/8.05/position-momentum-stern-gerlach.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013, Zwiebach) Lecture 3 transcript and notes chapters 1–2, with the page's own example.

page: content/year-3/8.05/position-momentum-stern-gerlach.mdx
calcs:
  - id: ring-ratio
    kind: identity
    where: 'μ/L for a ring: (Q v/2πR)(πR²)/(M v R) equals Q/2M'
    formula: (Q*v/(2*pi*R))*(pi*R**2)/(M*v*R)
    equals: Q/(2*M)
    samples: {Q: [0.5, 3.0], v: [1.0, 10.0], R: [0.1, 2.0], M: [0.5, 5.0]}
    tolerance: 1e-12
    shown: ['\vec\mu = \frac{Q}{2M}\vec L']
    source: {cite: reading3, at: 'eq. (1.7)'}
    origin: mit

  - id: bohr-magneton
    where: 'μ_B = eħ/2m_e in J/T'
    inputs: {}
    formula: 1.602177e-19*1.054572e-34/(2*9.109e-31)
    expected: '9.27e-24'
    tolerance: 0.005e-24
    shown: ['\mu_B = \frac{e\hbar}{2m_e} \approx 9.27 \times 10^{-24}\ \text{J/T}']
    source: {cite: reading3, at: 'eq. (1.11)'}
    origin: mit

  - id: commutator
    kind: identity
    where: '(x p̂ − p̂ x)ψ for ψ = e^(−x²) with p̂ = −i d/dx (ħ = 1): real/imag check via (x ψ′ − (x ψ)′) = −ψ'
    formula: x*(-2*x*exp(-x**2)) - (exp(-x**2) + x*(-2*x*exp(-x**2)))
    equals: -exp(-x**2)
    samples: {x: [-2.0, 2.0]}
    tolerance: 1e-12
    shown: ['so $[\hat x, \hat p]\psi = i\hbar\psi$']
    source: {cite: reading2, at: 'eq. (6.37)'}
    origin: mit

  - id: ex-force
    where: 'example (a): 9.274e-24 × 1000 N'
    inputs: {}
    formula: 9.274e-24*1000
    expected: '9.27e-21'
    tolerance: 0.005e-21
    shown: ['\approx 9.27 \times 10^{-21}$ N']
    source: {cite: reading3, at: 'eq. (1.15)'}
    origin: page-own

  - id: ex-acc
    where: 'example (a): F/m m/s²'
    inputs: {}
    formula: 9.274e-21/1.79e-25
    expected: '5.18e4'
    tolerance: 0.005e4
    shown: ['$a = F/m \approx 5.18 \times 10^4$ m/s²']
    source: {cite: reading3, at: 'eq. (1.15)'}
    origin: page-own

  - id: ex-g
    where: 'example (a): a/9.81'
    inputs: {}
    formula: 9.274e-21/1.79e-25/9.81
    expected: '5000'
    tolerance: 400
    shown: ['about five thousand times gravity']
    source: {cite: reading3, at: 'eq. (1.15)'}
    origin: page-own

  - id: ex-time
    where: 'example (b): 0.035/550 s'
    inputs: {}
    formula: 0.035/550
    expected: '6.36e-5'
    tolerance: 0.005e-5
    shown: ['$0.035/550 \approx 6.36 \times 10^{-5}$ s']
    source: {cite: reading3, at: 'eq. (1.15)'}
    origin: page-own

  - id: ex-defl
    where: 'example (b): ½ a t² m'
    inputs: {}
    formula: 0.5*9.274e-21/1.79e-25*(0.035/550)**2
    expected: '1.05e-4'
    tolerance: 0.005e-4
    shown: ['$\frac12at^2 \approx 1.05 \times 10^{-4}$ m']
    source: {cite: reading3, at: 'eq. (1.15)'}
    origin: page-own

  - id: ex-sep
    where: 'example (b): separation in mm'
    inputs: {}
    formula: 2*0.5*9.274e-21/1.79e-25*(0.035/550)**2*1000
    expected: '0.21'
    tolerance: 0.005
    shown: ['the two are about 0.21 mm apart']
    source: {cite: reading1, at: 'p. 20'}
    origin: page-own

  - id: ex-proton
    kind: fact
    where: 'example (c): proton-to-electron mass ratio'
    value: '1836'
    shown: ['($m_p/m_e = 1836$)']
    source: {ref: 'CODATA proton-to-electron mass ratio, 1836.15'}
    origin: later-data
