# Calculations on content/year-3/8.05/squeezed-states.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.05 (Fall 2013) Lecture 15 transcript and Zwiebach's notes chapter 6, with the page's own example.

page: content/year-3/8.05/squeezed-states.mdx
calcs:
  - id: number-spread
    kind: identity
    where: '(ΔN)² = |α|²(1 + |α|²) − |α|⁴ = |α|²'
    formula: sqrt(r**2*(1 + r**2) - r**4)
    equals: r
    samples: {r: [0.5, 3.0]}
    tolerance: 1e-9
    shown: ['\Delta N = |\alpha|" cite']
    source: {cite: reading2, at: 'eq. (4.98)'}
    origin: mit

  - id: squeeze-product
    kind: identity
    where: 'e^{−γ} sqrt(hbar/2m2ω2) × e^{γ} sqrt(hbar m2ω2/2) = hbar/2'
    formula: exp(-g)*sqrt(hbar/(2*m*w))*exp(g)*sqrt(hbar*m*w/2)
    equals: hbar/2
    samples: {g: [0.3, 1.5], hbar: [1.0, 0.4], m: [1.0, 2.5], w: [0.6, 2.0]}
    tolerance: 1e-12
    shown: ['Their product is still $\hbar/2$']
    source: {cite: reading2, at: 'eq. (5.5)'}
    origin: mit

  - id: bogoliubov-commutator
    kind: identity
    where: '[a1, a1†] = cosh²γ − sinh²γ = 1 when [a2, a2†] = 1'
    formula: cosh(g)**2 - sinh(g)**2
    equals: 1
    samples: {g: [0.3, 1.5]}
    tolerance: 1e-9
    shown: ['a_1 = a_2\cosh\gamma + a_2^\dagger\sinh\gamma, \qquad']
    source: {cite: reading2, at: 'eq. (5.9)'}
    origin: mit

  - id: ex-gamma
    where: 'example: e^γ = sqrt(4)'
    inputs: {}
    formula: sqrt(4)
    expected: '2'
    tolerance: 0
    shown: ['$e^{\gamma} = \sqrt{m\omega_1/m\omega_2} = \sqrt{4} = 2$']
    source: {cite: reading2, at: 'eq. (5.6)'}
    origin: page-own

  - id: ex-cosh
    where: 'example: cosh(ln 2)'
    inputs: {}
    formula: cosh(log(2))
    expected: '1.25'
    tolerance: 1e-12
    shown: ['$\cosh\gamma = (2 + \frac{1}{2})/2 = \frac{5}{4}$']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: page-own

  - id: ex-tanh
    where: 'example: tanh(ln 2)'
    inputs: {}
    formula: tanh(log(2))
    expected: '0.6'
    tolerance: 1e-12
    shown: ['$\tanh\gamma = (2 - \frac{1}{2})/(2 + \frac{1}{2}) = \frac{3}{5}$']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: page-own

  - id: ex-p0
    where: 'example: P(0) = 1/cosh γ'
    inputs: {}
    formula: 1/cosh(log(2))
    expected: '0.8'
    tolerance: 1e-12
    shown: ['the probability of the new ground state is $\frac{4}{5} = 0.8$']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: page-own

  - id: ex-p2
    where: 'example: P(2) = (4/5)(3√2/10)²'
    inputs: {}
    formula: 0.8*(0.5*tanh(log(2))*sqrt(2))**2
    expected: '0.144'
    tolerance: 1e-12
    shown: ['$\frac{4}{5} \times \frac{18}{100} = 0.144$']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: page-own

  - id: ex-p4
    where: 'example: P(4) = (4/5)((1/2)(3/10)² √24)²'
    inputs: {}
    formula: 0.8*(0.5*(0.5*tanh(log(2)))**2*sqrt(24))**2
    expected: '0.039'
    tolerance: 0.0005
    shown: ['$\frac{4}{5} \times \frac{81 \times 24}{40000} \approx 0.039$']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: page-own

  - id: ex-total
    where: 'example: 0.8 + 0.144 + 0.0389 ≈ 0.98'
    inputs: {}
    formula: 0.8 + 0.144 + 0.8*(0.5*(0.5*tanh(log(2)))**2*sqrt(24))**2
    expected: '0.98'
    tolerance: 0.005
    shown: ['about 98% of the probability']
    source: {cite: reading2, at: 'eq. (5.26)'}
    origin: page-own

  - id: geo600-squeezing
    kind: fact
    where: 'later development: squeezed light in GEO600 from 2010'
    value: 2010
    shown: ['GEO600 detector from 2010']
    source: {ref: 'LIGO Scientific Collaboration, Nature Physics 7, 962 (2011): squeezed light in GEO600'}
    origin: later-data

  - id: ligo-squeezing
    kind: fact
    where: 'later development: squeezed light in the LIGO detectors from the O3 run (2019)'
    value: 2019
    shown: ['from their 2019 observing run']
    source: {ref: 'Tse et al., Phys. Rev. Lett. 123, 231107 (2019): quantum-enhanced Advanced LIGO'}
    origin: later-data
