# Calculations on content/year-0/hs-1/position-time-graphs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.5 and 21.6; MIT 8.01SC Course Notes Chapter 4, Sec. 4.3. All numbers are the page's own.

page: content/year-0/hs-1/position-time-graphs.mdx
calcs:
  - id: cyclist-rise
    where: 'worked example "A cyclist on a straight road": rise 110 − 20 = 90 m'
    inputs: {}
    formula: 110 - 20
    expected: '90'
    shown: ['$\Delta x = 110\ \text{m} - 20\ \text{m} = 90$ m']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-velocity
    where: 'same: v = 90 m / 15 s = 6.0 m/s'
    inputs: {dx: 90 m, dt: 15 s}
    formula: dx / dt
    expected: 6.0 m/s
    shown: ['$v = \dfrac{90\ \text{m}}{15\ \text{s}} = 6.0$ m/s']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-kmh
    where: 'same, check: 6.0 m/s × 3.6 ≈ 22 km/h'
    inputs: {v: 6.0, k: 3.6}
    formula: v * k
    expected: '22'
    shown: ['$6.0 \times 3.6 \approx 22$ km/h']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: walk-out
    where: 'worked example "Reading the walk": 60 m in 40 s = 1.5 m/s'
    inputs: {dx: 60 m, dt: 40 s}
    formula: dx / dt
    expected: 1.5 m/s
    shown: ['{40\ \text{s} - 0} = 1.5$ m/s']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: walk-back
    where: 'same: (0 − 60 m)/(100 s − 70 s) = −2.0 m/s'
    inputs: {dx: -60 m, dt: 30 s}
    formula: dx / dt
    expected: -2.0 m/s
    shown: ['= -2.0$ m/s. The minus sign says she walks back']
    source: {cite: mit, at: '21.6, Motion at constant velocity: a negative velocity, back towards the origin (the numbers are the page''s own)'}
    origin: page-own

  - id: walk-distance
    where: 'same: distance 60 + 60 = 120 m'
    inputs: {}
    formula: 60 + 60
    expected: '120'
    shown: ['$60 + 60 = 120$ m']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the return walk); adding the two legs to a distance is the page''s own, following lesson 1.1, not in this section; the numbers are the page''s own'}
    origin: page-own

  - id: walk-check-out
    where: 'same, check: 1.5 × 40 = 60 m'
    inputs: {v: 1.5 m/s, dt: 40 s}
    formula: v * dt
    expected: 60 m
    shown: ['$1.5 \times 40 = 60$ m out']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: walk-check-back
    where: 'same, check: −2.0 × 30 = −60 m'
    inputs: {v: -2.0 m/s, dt: 30 s}
    formula: v * dt
    expected: -60 m
    shown: ['$-2.0 \times 30 = -60$ m back']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x2
    where: 'worked example "A car braking": x(2.0) = 32 m'
    inputs: {t: 2.0}
    formula: 20 * t - 2.0 * t**2
    expected: '32'
    shown: ['$x(2.0) = 20 \times 2.0 - 2.0 \times 2.0^{2} = 32$ m']
    source: {cite: reading2, at: 'Sec. 4.3.3, Instantaneous velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: car-tangent-slope
    where: 'same: the slope of the tangent at t = 2.0 s is 12 m/s'
    inputs: {}
    formula: deriv('20*u - 2.0*u**2', 'u', 2.0)
    expected: '12'
    shown: ['{4.0 - 0} = 12$ m/s']
    source: {cite: reading2, at: 'Sec. 4.3.3, Eq. (4.3.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-tangent-at-0
    where: 'same: the tangent passes through (0, 8 m)'
    inputs: {}
    formula: 32 - 12 * 2.0
    expected: '8'
    shown: ['$(0, 8\ \text{m})$']
    source: {cite: reading2, at: 'Sec. 4.3.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: car-tangent-at-4
    where: 'same: the tangent passes through (4.0 s, 56 m)'
    inputs: {}
    formula: 32 + 12 * 2.0
    expected: '56'
    shown: ['$(4.0\ \text{s}, 56\ \text{m})$']
    source: {cite: reading2, at: 'Sec. 4.3.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x19
    where: 'same, check: x(1.9) = 30.78 m'
    inputs: {t: 1.9}
    formula: 20 * t - 2.0 * t**2
    expected: '30.78'
    shown: ['$x(1.9) = 30.78$ m']
    source: {cite: reading1, at: '21.5, Instantaneous velocity: a very small time interval (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x21
    where: 'same, check: x(2.1) = 33.18 m'
    inputs: {t: 2.1}
    formula: 20 * t - 2.0 * t**2
    expected: '33.18'
    shown: ['$x(2.1) = 33.18$ m']
    source: {cite: reading1, at: '21.5, Instantaneous velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: car-short-interval
    where: 'same, check: 2.40 m / 0.20 s = 12.0 m/s'
    inputs: {}
    formula: ((20 * 2.1 - 2.0 * 2.1**2) - (20 * 1.9 - 2.0 * 1.9**2)) / (2.1 - 1.9)
    expected: '12.0'
    shown: ['$\dfrac{2.40}{0.20} = 12.0$ m/s']
    source: {cite: reading1, at: '21.5, Instantaneous velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: car-stops
    where: 'Plot caption: the car stops at 5.0 s, 50 m from where it started braking'
    inputs: {t: 5.0}
    formula: 20 * t - 2.0 * t**2
    expected: '50'
    shown: ['when the car stops 50 m from where it started braking']
    source: {cite: reading2, at: 'Sec. 4.3.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: car-stops-time
    where: 'worked example and caption: the tangent is horizontal (the car stops) at t = 5.0 s'
    inputs: {}
    formula: solve('20 - 4.0*u', 'u', 0, 10)
    expected: '5.0'
    shown: ['until it stops at $t = 5.0$ s']
    source: {cite: reading2, at: 'Sec. 4.3.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x1
    where: 'section "Average velocity": x(1.0) = 18 m'
    inputs: {t: 1.0}
    formula: 20 * t - 2.0 * t**2
    expected: '18'
    shown: ['$x(1.0) = 18$ m']
    source: {cite: reading2, at: 'Sec. 4.3.1, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x4
    where: 'same: x(4.0) = 48 m'
    inputs: {t: 4.0}
    formula: 20 * t - 2.0 * t**2
    expected: '48'
    shown: ['$x(4.0) = 48$ m']
    source: {cite: reading2, at: 'Sec. 4.3.1, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: car-average
    where: 'same: (48 − 18)/(4.0 − 1.0) = 10 m/s'
    inputs: {}
    formula: (48 - 18) / (4.0 - 1.0)
    expected: '10'
    shown: ['{4.0 - 1.0} = 10$ m/s']
    source: {cite: reading2, at: 'Sec. 4.3.3, Eq. (4.3.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-mean-value-time
    where: 'same: the tangent is parallel to the secant at t = 2.5 s'
    inputs: {}
    formula: solve('20 - 4.0*u - 10', 'u', 1, 4)
    expected: '2.5'
    shown: ['(here $t = 2.5$ s)']
    source: {cite: reading2, at: 'Sec. 4.3.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-rise
    where: 'worked example "A lift": 2.0 × 6.0 = 12 m'
    inputs: {v: 2.0 m/s, dt: 6.0 s}
    formula: v * dt
    expected: 12 m
    shown: ['$2.0 \times 6.0 = 12$ m']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-top-time
    where: 'same: the line reaches 12 m at t = 11 s'
    inputs: {}
    formula: 5.0 + 6.0
    expected: '11'
    shown: ['climbs to 12 m at $t = 11$ s']
    source: {cite: mit, at: '21.6, Worked examples (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-down-time
    where: 'same: 12 / 3.0 = 4.0 s'
    inputs: {dx: 12 m, v: 3.0 m/s}
    formula: dx / v
    expected: 4.0 s
    shown: ['$12 / 3.0 = 4.0$ s']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-end-time
    where: 'same: back at 0 at t = 19 s (5.0 + 6.0 + 4.0 + 4.0)'
    inputs: {}
    formula: 5.0 + 6.0 + 4.0 + 12 / 3.0
    expected: '19'
    shown: ['falls to 0 at $t = 19$ s']
    source: {cite: mit, at: '21.6, Worked examples (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-negative-slope
    where: 'quiz 2: (0 − 45)/(15 − 0) = −3.0 m/s'
    inputs: {}
    formula: (0 - 45) / (15 - 0)
    expected: '-3.0'
    shown: ['$(0 - 45)/(15 - 0) = -3.0$ m/s']
    source: {cite: mit, at: '21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-secant
    where: 'quiz 5: (36 − 4.0)/(5.0 − 1.0) = 8.0 m/s'
    inputs: {}
    formula: (36 - 4.0) / (5.0 - 1.0)
    expected: '8.0'
    shown: ['$(36 - 4.0)/(5.0 - 1.0) = 32/4.0 = 8.0$ m/s']
    source: {cite: reading2, at: 'Sec. 4.3.3, Eq. (4.3.4) (the numbers are the page''s own)'}
    origin: page-own
