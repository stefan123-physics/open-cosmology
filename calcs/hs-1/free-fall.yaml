# Calculations on content/year-0/hs-1/free-fall.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 12, 3.2 Vertical projectile motion; MIT 8.01SC course notes Ch. 4 and 5;
# NASA Moon Fact Sheet and Apollo 15 Hammer-Feather Drop.
# All example numbers are the page's own (none of Siyavula's or MIT's example numbers are reused).
# Note: g is written ga in the inputs (g alone would be the gram).

page: content/year-0/hs-1/free-fall.mdx
calcs:
  - id: g-standard
    kind: fact
    where: 'section "What free fall means": the standard acceleration of gravity, 9.806 65 m/s²'
    value: 9.80665 m/s**2
    shown: ['a standard value, 9.806 65 m/s²']
    source: {cite: nist-g, at: 'standard acceleration of gravity g_n = 9.806 65 m s⁻² (exact)'}
    origin: mit

  - id: g-earth
    where: 'section "What free fall means": g = 9.81 m/s², the standard value rounded to three figures'
    inputs: {gn: 9.80665 m/s**2}
    formula: gn
    expected: 9.81 m/s**2
    shown: ['tex="g = 9.81\ \text{m/s}^2"']
    source: {cite: nist-g, at: 'standard acceleration of gravity, 9.806 65 m/s² (the rounding to 9.81 is the page''s own; Siyavula ESCJX uses 9,8)'}
    origin: page-own

  - id: table-05
    where: 'table, row 0.5 s: speed g t and distance ½ g t²'
    inputs: {ga: 9.81 m/s**2, t: 0.5 s}
    formula: ga * t
    expected: 4.91 m/s
    shown: ['| 0.5 s | 4.91 m/s | 1.23 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-05-d
    where: 'table, row 0.5 s: distance'
    inputs: {ga: 9.81 m/s**2, t: 0.5 s}
    formula: ga * t**2 / 2
    expected: 1.23 m
    shown: ['| 1.23 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-10
    where: 'table, row 1.0 s: speed'
    inputs: {ga: 9.81 m/s**2, t: 1.0 s}
    formula: ga * t
    expected: 9.81 m/s
    shown: ['| 1.0 s | 9.81 m/s | 4.91 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-10-d
    where: 'table, row 1.0 s: distance'
    inputs: {ga: 9.81 m/s**2, t: 1.0 s}
    formula: ga * t**2 / 2
    expected: 4.91 m
    shown: ['| 4.91 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-15
    where: 'table, row 1.5 s: speed'
    inputs: {ga: 9.81 m/s**2, t: 1.5 s}
    formula: ga * t
    expected: 14.7 m/s
    shown: ['| 1.5 s | 14.7 m/s | 11.0 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-15-d
    where: 'table, row 1.5 s: distance'
    inputs: {ga: 9.81 m/s**2, t: 1.5 s}
    formula: ga * t**2 / 2
    expected: 11.0 m
    shown: ['| 11.0 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-20
    where: 'table, row 2.0 s: speed'
    inputs: {ga: 9.81 m/s**2, t: 2.0 s}
    formula: ga * t
    expected: 19.6 m/s
    shown: ['| 2.0 s | 19.6 m/s |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-20-d
    where: 'table, row 2.0 s: distance'
    inputs: {ga: 9.81 m/s**2, t: 2.0 s}
    formula: ga * t**2 / 2
    expected: 19.6 m
    shown: ['19.6 m/s | 19.6 m |']
    source: {cite: mit, at: 'Sec. 3.2, Graphs of vertical projectile motion, Cases 2 and 3 (the numbers are the page''s own)'}
    origin: page-own

  - id: table-step
    where: 'after the table: each half second adds 4.9 m/s'
    inputs: {ga: 9.81 m/s**2, t: 0.5 s}
    formula: ga * t
    expected: 4.9 m/s
    shown: ['adds the same 4.9 m/s to the speed']
    source: {cite: mit, at: 'Sec. 3.2, Motion in a gravitational field (the numbers are the page''s own)'}
    origin: page-own

  - id: well-depth
    where: 'worked example "How deep is the well?": ½ × 9.81 × 2.5² ≈ 30.7 m'
    inputs: {ga: 9.81 m/s**2, t: 2.5 s}
    formula: ga * t**2 / 2
    expected: 30.7 m
    shown: ['$\Delta x = \tfrac{1}{2} \times 9.81 \times 2.5^{2} \approx 30.7$ m, so about 31 m']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: well-speed
    where: 'same: v_f = 9.81 × 2.5 ≈ 24.5 m/s'
    inputs: {ga: 9.81 m/s**2, t: 2.5 s}
    formula: ga * t
    expected: 24.5 m/s
    shown: ['$v_f = 0 + 9.81 \times 2.5 \approx 24.5$ m/s, about 25 m/s']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: well-kmh
    where: 'same: 24.5 m/s is roughly 88 km/h'
    inputs: {v: 24.5 m/s}
    formula: v
    expected: 88 km/hour
    shown: ['(roughly 88 km/h)']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: well-check
    where: 'same, check: ½(0 + 24.5) × 2.5 ≈ 31 m'
    inputs: {v: 24.5 m/s, t: 2.5 s}
    formula: v / 2 * t
    expected: 31 m
    shown: ['$\Delta x = \tfrac{1}{2}(0 + 24.5) \times 2.5 \approx 31$ m']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: throw-ttop
    where: 'worked example "A ball thrown straight up": 15 / 9.81 ≈ 1.53 s'
    inputs: {v: 15 m/s, ga: 9.81 m/s**2}
    formula: v / ga
    expected: 1.53 s
    shown: ['$\Delta t = \dfrac{15}{9.81} \approx 1.53$ s']
    source: {cite: reading2, at: 'Sec. 5.2, Eq. (5.1.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: throw-height
    where: 'same: 15² / (2 × 9.81) ≈ 11.5 m'
    inputs: {v: 15 m/s, ga: 9.81 m/s**2}
    formula: v**2 / (2 * ga)
    expected: 11.5 m
    shown: ['$\Delta x = \dfrac{15^{2}}{2 \times 9.81} \approx 11.5$ m above the hand']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion, Textbook Exercise 3.1 (method; the numbers are the page''s own)'}
    origin: page-own

  - id: throw-flight
    where: 'same: back after 2 × 1.53 ≈ 3.06 s'
    inputs: {v: 15 m/s, ga: 9.81 m/s**2}
    formula: 2 * v / ga
    expected: 3.06 s
    shown: ['$2 \times 1.53 \approx 3.06$ s']
    source: {cite: mit, at: 'Sec. 3.2, time symmetry (the numbers are the page''s own)'}
    origin: page-own

  - id: throw-return-v
    where: 'same, check: 15 − 9.81 × 3.06 ≈ −15 m/s'
    inputs: {v: 15 m/s, ga: 9.81 m/s**2, t: 3.06 s}
    formula: v - ga * t
    expected: -15 m/s
    shown: ['$v_f = 15 - 9.81 \times 3.06 \approx -15$ m/s']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: throw-check
    where: 'same, check: ½(15 + 0) × 1.53 ≈ 11.5 m'
    inputs: {v: 15 m/s, t: 1.53 s}
    formula: v / 2 * t
    expected: 11.5 m
    shown: ['$\tfrac{1}{2}(15 + 0) \times 1.53 \approx 11.5$ m']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-top
    where: 'height graph caption and point: top after 1.53 s at 11.5 m'
    inputs: {v: 15 m/s, ga: 9.81 m/s**2}
    formula: v**2 / (2 * ga)
    expected: 11.47 m
    shown: ['{ x: 1.53, y: 11.47, label: "top" }']
    source: {cite: reading2, at: 'Sec. 5.2, Eqs. (5.1.21) to (5.1.23) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-top-caption
    where: 'height graph caption: zero slope at the top, after 1.53 s at 11.5 m'
    inputs: {v: 15 m/s, ga: 9.81 m/s**2}
    formula: v**2 / (2 * ga)
    expected: 11.5 m
    shown: ['after 1.53 s at 11.5 m']
    source: {cite: reading2, at: 'Sec. 5.2, Eqs. (5.1.21) to (5.1.23) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-half-g
    where: 'cliff example standard form (and the height graph expressions): ½ × 9.81 = 4.905'
    inputs: {ga: 9.81}
    formula: ga / 2
    expected: '4.905'
    shown: ['$-25 = 8.0\,\Delta t - 4.905\,\Delta t^{2}$']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-discriminant
    where: 'worked example "A stone thrown up from a cliff": 8.0² + 4 × 4.905 × 25 = 554.5'
    inputs: {}
    formula: 8.0**2 + 4 * 4.905 * 25
    expected: '554.5'
    shown: ['\dfrac{8.0 \pm \sqrt{554.5}}{9.81}']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY); quadratic equations (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-sqrt
    where: 'same: √554.5 ≈ 23.5'
    inputs: {}
    formula: sqrt(554.5)
    expected: '23.5'
    shown: ['With $\sqrt{554.5} \approx 23.5$']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-time
    where: 'same: the positive root, about 3.2 s'
    inputs: {}
    formula: solve('4.905*x**2 - 8.0*x - 25', 'x', 0, 10)
    expected: '3.2'
    shown: ['$\Delta t \approx 3.2$ s or']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-time-neg
    where: 'same: the negative root, about −1.6 s'
    inputs: {}
    formula: solve('4.905*x**2 - 8.0*x - 25', 'x', -5, 0)
    expected: '-1.6'
    shown: ['$\Delta t \approx -1.6$ s']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-vf
    where: 'same: 8.0 − 9.81 × 3.216 ≈ −23.5 m/s'
    inputs: {v: 8.0 m/s, ga: 9.81 m/s**2, t: 3.216 s}
    formula: v - ga * t
    expected: -23.5 m/s
    shown: ['$v_f = 8.0 - 9.81 \times 3.216 \approx -23.5$ m/s']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-unrounded-t
    where: 'same: the unrounded time 3.216 s'
    inputs: {}
    formula: (8.0 + sqrt(554.5)) / 9.81
    expected: '3.216'
    shown: ['With the unrounded time']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-check-v2
    where: 'same, check: 8.0² − 2 × 9.81 × (−25) = 554.5'
    inputs: {}
    formula: 8.0**2 - 2 * 9.81 * (-25)
    expected: '554.5'
    shown: ['$v_f^{2} = 8.0^{2} - 2 \times 9.81 \times (-25) = 554.5$']
    source: {cite: mit, at: 'Sec. 3.2, Equations of motion (ESCJY) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-edge
    where: 'same, check: back at the edge after 2 × 8.0 / 9.81 ≈ 1.63 s'
    inputs: {v: 8.0 m/s, ga: 9.81 m/s**2}
    formula: 2 * v / ga
    expected: 1.63 s
    shown: ['$2 \times 8.0 / 9.81 \approx 1.63$ s']
    source: {cite: mit, at: 'Sec. 3.2, time symmetry (the numbers are the page''s own)'}
    origin: page-own

  - id: hammer-mass
