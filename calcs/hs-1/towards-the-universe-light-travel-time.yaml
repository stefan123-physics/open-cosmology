# Calculations on content/year-0/hs-1/towards-the-universe-light-travel-time.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: NASA Science "Cosmic History" (universe overview: 13.8 billion years, CMB at about 380 000 years), NASA Space Place
# "What Is a Light-Year?", NASA "Space Communications: 7 Things You Need to Know" (Mars 35 and 250 million miles),
# NASA Moon, Sun and Mars fact pages, NIST CODATA (c exact), Siyavula Gr 10 21.6 (constant velocity), MIT 8.286 Lecture 8.

page: content/year-0/hs-1/towards-the-universe-light-travel-time.mdx
calcs:
  - id: c-exact
    kind: fact
    where: 'section "Light has a finite, constant speed": c = 299 792 458 m/s exactly'
    value: 299792458
    shown: ['$c = 299\,792\,458$ m/s,']
    source: {cite: nist-c}
    origin: later-data

  - id: c-rounded
    where: 'same: 3.00 × 10⁸ m/s to three significant figures'
    inputs: {v: 299792458 m/s}
    formula: v
    expected: 3.00e8 m/s
    shown: ['that is $c = 3.00 \times 10^{8}$ m/s']
    source: {cite: nist-c, at: 'the page''s own rounding'}
    origin: page-own

  - id: around-earth
    where: 'same: 300 000 km per second is more than seven times around the Earth (circumference about 40 000 km)'
    inputs: {v: 3.00e8 m/s, u: 1 s, L: 40000 km}
    formula: v * u / L
    expected: '7.5'
    tolerance: 0.1
    shown: ['more than seven times around the Earth in one second']
    source: {cite: nist-c, at: 'the page''s own comparison'}
    origin: page-own

  - id: light-second
    where: 'table: light-second 3.00 × 10⁸ m'
    inputs: {c0: 3.00e8 m/s, u: 1 s}
    formula: c0 * u
    expected: 3.00e8 m
    shown: ['| light-second | 1 s | $3.00 \times 10^{8}$ m |']
    source: {cite: reading1, at: 'opening paragraphs (definition in words; the numbers are the page''s own)'}
    origin: page-own

  - id: light-minute
    where: 'table: light-minute 1.80 × 10¹⁰ m'
    inputs: {c0: 3.00e8 m/s, u: 60 s}
    formula: c0 * u
    expected: 1.80e10 m
    shown: ['| light-minute | 60 s | $1.80 \times 10^{10}$ m |']
    source: {cite: reading1, at: 'opening paragraphs (the numbers are the page''s own)'}
    origin: page-own

  - id: light-hour
    where: 'table: light-hour 1.08 × 10¹² m'
    inputs: {c0: 3.00e8 m/s, u: 3600 s}
    formula: c0 * u
    expected: 1.08e12 m
    shown: ['| light-hour | 3600 s | $1.08 \times 10^{12}$ m |']
    source: {cite: reading1, at: 'opening paragraphs (the numbers are the page''s own)'}
    origin: page-own

  - id: light-year-table
    where: 'table and formula "The light-year": 2.998 × 10⁸ m/s × 3.156 × 10⁷ s = 9.46 × 10¹⁵ m'
    inputs: {c0: 2.998e8 m/s, u: 3.156e7 s}
    formula: c0 * u
    expected: 9.46e15 m
    shown: ['| light-year | 1 year | $9.46 \times 10^{15}$ m |']
    source: {cite: reading1, at: 'opening paragraphs (the numbers are the page''s own)'}
    origin: page-own

  - id: seconds-per-year
    where: 'section "Light-seconds…": 365.25 × 24 × 3600 = 3.156 × 10⁷ s'
    inputs: {u: 365.25 day}
    formula: u
    expected: 3.156e7 s
    shown: ['$365.25 \times 24 \times 3600 = 3.156 \times 10^{7}$ s']
    source: {cite: reading1, at: 'opening paragraphs (the numbers are the page''s own)'}
    origin: page-own

  - id: light-year-exact
    where: 'same: one light-year (exact c, Julian year) is 9.46 × 10¹⁵ m'
    inputs: {d: 1 ly}
    formula: d
    expected: 9.46e15 m
    shown: ['which gives $9.46 \times 10^{15}$ m, close to ten thousand billion kilometres']
    source: {cite: reading1, at: 'opening paragraphs (the page''s own conversion)'}
    origin: page-own

  - id: moon-distance
    kind: fact
    where: 'section "Signal delays": the Moon is on average 384 400 km away'
    value: 384400
    shown: ['The Moon is on average 384 400 km away']
    source: {cite: nasa-moon}
    origin: later-data

  - id: moon-delay
    where: 'same: 3.844 × 10⁸ m / 3.00 × 10⁸ m/s = 1.28 s'
    inputs: {d: 3.844e8 m, c0: 3.00e8 m/s}
    formula: d / c0
    expected: 1.28 s
    shown: ['m/s $= 1.28$ s to cover that']
    source: {cite: nasa-moon, at: 'Size and Distance (the calculation is the page''s own)'}
    origin: page-own

  - id: moon-round-trip
    where: 'same: there and back 2 × 1.28 ≈ 2.6 s'
    inputs: {d: 3.844e8 m, c0: 3.00e8 m/s}
    formula: 2 * d / c0
    expected: 2.6 s
    shown: ['$2 \times 1.28 \approx 2.6$ s after the question']
    source: {cite: nasa-moon, at: 'Size and Distance (the calculation is the page''s own)'}
    origin: page-own

  - id: sun-delay
    where: 'same: 1.50 × 10¹¹ m / 3.00 × 10⁸ m/s = 500 s'
    inputs: {d: 1.50e11 m, c0: 3.00e8 m/s}
    formula: d / c0
    expected: 500 s
    shown: ['\text{m/s} = 500$ s to reach us, about 8.3 minutes']
    source: {cite: nasa-sun, at: 'Earth–Sun distance about 150 million km (the calculation is the page''s own)'}
    origin: page-own

  - id: sun-delay-min
    where: 'same: 500 s is about 8.3 minutes (also NASA Space Place: about 8.3 minutes)'
    inputs: {d: 1.50e11 m, c0: 3.00e8 m/s}
    formula: d / c0
    expected: 8.3 min
    shown: ['The Sun is 8.3 light-minutes away']
    source: {cite: reading1, at: 'Looking Back in Time'}
    origin: page-own

  - id: mars-closest-km
