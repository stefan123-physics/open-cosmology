  - id: rover-delay
    where: 'worked example "A message to a Mars rover": 1.80 × 10¹¹ m / 3.00 × 10⁸ m/s = 600 s = 10.0 minutes'
    inputs: {d: 180e6 km, c0: 3.00e8 m/s}
