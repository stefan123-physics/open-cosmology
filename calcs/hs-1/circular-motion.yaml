# Calculations on content/year-0/hs-1/circular-motion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 6 (Sec. 6.1, 6.2, 6.2.1, 6.4, 6.4.1); NASA Moon Fact Sheet; NASA Science, Sun: Facts.
# All numbers are the page's own except the Moon's orbit (NASA Moon Fact Sheet) and the Sun's galactic orbit (NASA Sun: Facts).
# MIT's Chapter 6 examples are symbolic, so no source numbers could be reused.

page: content/year-0/hs-1/circular-motion.mdx
calcs:
  # Quiz
  - id: quiz-merry-go-round-f
    where: 'quiz 2: f = 1/8.0 = 0.125 Hz'
    inputs: {T: 8.0 s}
    formula: 1 / T
    expected: 0.125 Hz
    shown: ['$f = 1/T = 1/8.0 = 0.125$ Hz']
    quiz: 1
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-merry-go-round-omega
    where: 'quiz 2, distractor: 2π/8.0 ≈ 0.785 rad/s'
    inputs: {T: 8.0 s}
    formula: 2 * pi / T
    expected: 0.785 1/s
    shown: ['0.785 is the angular speed $2\\pi/8.0$ in rad/s']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-wheel-v
    where: 'quiz 3: v = ωr = 8.0 × 0.35 = 2.8 m/s'
    inputs: {w: 8.0 1/s, r: 0.35 m}
    formula: w * r
    expected: 2.8 m/s
    shown: ['$v = \\omega r = 8.0 \\times 0.35 = 2.8$ m/s']
    quiz: 2
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-wheel-wrong-1
    where: 'quiz 3, distractor: 8.0 / 0.35 ≈ 23'
    inputs: {}
    formula: 8.0 / 0.35
    expected: '23'
    shown: ['Dividing instead of multiplying gives 23 m/s or 0.044 m/s']
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-wheel-wrong-add
    where: 'quiz 3, distractor: 8.0 + 0.35 ≈ 8.4 (adding instead of multiplying)'
    inputs: {}
    formula: 8.0 + 0.35
    expected: '8.4'
    tolerance: 0.06
    shown: ['$8.0 + 0.35 \\approx 8.4$']
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the wrong step and numbers are the page''s own, not in the source)'}
    origin: page-own

  - id: quiz-wheel-wrong-2
    where: 'quiz 3, distractor: 0.35 / 8.0 ≈ 0.044'
    inputs: {}
    formula: 0.35 / 8.0
    expected: '0.044'
    shown: ['choices: ["0.044 m/s", "2.8 m/s", "8.4 m/s", "23 m/s"]']
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-double-speed
    where: 'quiz 4: twice the speed, 2² = 4 times the acceleration'
    inputs: {}
    formula: 2**2
    expected: '4'
    shown: ['$2^2 = 4$ times the acceleration']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.7) (the numbers are the page''s own)'}
    origin: page-own

  # Period and frequency
  - id: drum-intro-T
    where: 'section "Period and frequency": f = 20 Hz gives T = 1/20 = 0.050 s'
    inputs: {f: 20 Hz}
    formula: 1 / f
    expected: 0.050 s
    shown: ['$T = 1/20 = 0.050$ s']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: rpm-to-hz
    where: 'section "Period and frequency": rpm to hertz, divide by 60 (1200 rpm / 60 = 20 Hz, as for the drum)'
    inputs: {rpm: 1200}
    formula: rpm / 60
    expected: '20'
    shown: ['divide by 60 to get hertz']
    source: {cite: mit, at: 'Sec. 6.4, SI unit of frequency (the numbers are the page''s own)'}
    origin: page-own

  # Clock
  - id: clock-T
    where: 'worked example "The minute hand of a clock": T = 60 min = 3600 s'
    inputs: {T: 60 minute}
    formula: T
    expected: 3600 s
    shown: ['$T = 60$ min $= 3600$ s']
    source: {cite: mit, at: 'Sec. 6.4, period (the numbers are the page''s own)'}
    origin: page-own

  - id: clock-omega
    where: 'same: ω = 2π/3600 s ≈ 1.75 × 10⁻³ rad/s'
    inputs: {T: 3600 s}
    formula: 2 * pi / T
    expected: 1.75e-3 1/s
    shown: ['\approx 1.75 \times 10^{-3}$ rad/s.']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: clock-v
    where: 'same: v = ωr ≈ 2.6 × 10⁻⁴ m/s'
    inputs: {w: 1.75e-3 1/s, r: 0.15 m}
    formula: w * r
    expected: 2.6e-4 m/s
    shown: ['0.15\ \text{m} \approx 2.6 \times 10^{-4}$ m/s, about a quarter of a millimetre per second']
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: clock-circumference
    where: 'same, check: 2π × 0.15 ≈ 0.94 m'
    inputs: {r: 0.15 m}
    formula: 2 * pi * r
    expected: 0.94 m
    shown: ['$2\pi \times 0.15 \approx 0.94$ m']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.3) (the numbers are the page''s own)'}
    origin: page-own

  - id: clock-v-check
    where: 'same, check: 0.94 m / 3600 s ≈ 2.6 × 10⁻⁴ m/s'
    inputs: {r: 0.15 m, T: 3600 s}
    formula: 2 * pi * r / T
    expected: 2.6e-4 m/s
    shown: ['$0.94\ \text{m} / 3600\ \text{s} \approx 2.6 \times 10^{-4}$ m/s, the same']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.4) (the numbers are the page''s own)'}
    origin: page-own

  # Diagram
  - id: diagram-angle
    where: 'second vector diagram: v₂ = (−1.5, 2.6) is v₁ = (0, 3) turned by 30° = 0.52 rad'
    inputs: {}
    formula: atan(1.5 / 2.6) * 180 / pi
    expected: '30'
    tolerance: 0.02
    shown: ['gone round by 30° (0.52 rad) between them']
    source: {cite: mit, at: 'Sec. 6.4.1, Figure 6.5 (the numbers are the page''s own)'}
    origin: page-own

  - id: diagram-angle-rad
    where: 'same: 30° = 0.52 rad'
    inputs: {}
    formula: 30 * pi / 180
    expected: '0.52'
    shown: ['(0.52 rad)']
    source: {cite: mit, at: 'Sec. 6.2.1, radians (the numbers are the page''s own)'}
    origin: page-own

  # Roundabout
  - id: car-v
    where: 'worked example "A car on a roundabout": 36 km/h = 10 m/s'
    inputs: {v: 36 km/hour}
    formula: v
    expected: 10 m/s
    shown: ['$36\ \text{km/h} = 36/3.6 = 10$ m/s']
    source: {cite: mit, at: 'not in the source: the km/h to m/s conversion (divide by 3.6) is the page''s own, taught in lesson 1.2'}
    origin: page-own

  - id: car-T
    where: 'same: T = 2π × 20/10 ≈ 12.6 s'
    inputs: {r: 20 m, v: 10 m/s}
    formula: 2 * pi * r / v
    expected: 12.6 s
    shown: ['{10\ \text{m/s}} \approx 12.6$ s']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-omega
    where: 'same: ω = v/r = 10/20 = 0.50 rad/s'
    inputs: {r: 20 m, v: 10 m/s}
    formula: v / r
    expected: 0.50 1/s
    shown: ['{20\ \text{m}} = 0.50$ rad/s']
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-a
    where: 'same: a = v²/r = 100/20 = 5.0 m/s²'
    inputs: {r: 20 m, v: 10 m/s}
    formula: v**2 / r
    expected: 5.0 m/s**2
    shown: ['{20\ \text{m}} = 5.0\ \text{m/s}^2$']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-a-omega
    where: 'same, check: ω²r = 0.50² × 20 = 5.0 m/s²'
    inputs: {w: 0.50 1/s, r: 20 m}
    formula: w**2 * r
    expected: 5.0 m/s**2
    shown: ['$\omega^2 r = 0.50^2 \times 20 = 5.0$ m/s²']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-half-g
    where: 'same, check: 5.0 m/s² is about half of g (9.81 m/s²)'
    inputs: {a: 5.0 m/s**2, g: 9.81 m/s**2}
    formula: a / g
    expected: '0.51'
    shown: ['about half of $g$']
    source: {cite: mit, at: 'Sec. 6.4 (the numbers are the page''s own; g = 9.81 m/s² from lesson 1.7)'}
    origin: page-own

  - id: car-fast
    where: 'after the example: 20²/20 = 20 m/s², four times as much'
    inputs: {v: 20 m/s, r: 20 m}
    formula: v**2 / r
    expected: 20 m/s**2
    shown: ['$20^2/20 = 20$ m/s², four times as much']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.7) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-point
    where: 'Plot: the point (10, 5) lies on a = v²/20'
    inputs: {}
    formula: 10**2 / 20
    expected: '5'
    shown: ['points={[{ x: 10, y: 5, label: "car" }]}']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.7) (the numbers are the page''s own)'}
    origin: page-own

  # Washing machine
  - id: drum-f
    where: 'worked example "A washing-machine drum": f = 1200/60 = 20 Hz'
    inputs: {n: 1200 1/minute}
    formula: n
    expected: 20 Hz
    shown: ['$f = 1200/60 = 20$ Hz']
    source: {cite: mit, at: 'Sec. 6.4, frequency (the numbers are the page''s own)'}
    origin: page-own

  - id: drum-T
    where: 'same: T = 1/20 = 0.050 s per turn'
    inputs: {f: 20 Hz}
    formula: 1 / f
    expected: 0.050 s
    shown: ['$T = 1/f = 1/20 = 0.050$ s per turn']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: drum-omega
    where: 'same: ω = 2π × 20 ≈ 126 rad/s'
    inputs: {f: 20 Hz}
    formula: 2 * pi * f
    expected: 126 1/s
    shown: ['$\omega = 2\pi f = 2\pi \times 20 \approx 126$ rad/s']
    source: {cite: mit, at: 'Sec. 6.4, ω = 2πf (the numbers are the page''s own)'}
    origin: page-own

  - id: drum-v
    where: 'same: v = ωr ≈ 126 × 0.25 ≈ 31 m/s'
    inputs: {f: 20 Hz, r: 0.25 m}
    formula: 2 * pi * f * r
    expected: 31 m/s
    shown: ['$v = \omega r \approx 126 \times 0.25 \approx 31$ m/s']
    source: {cite: mit, at: 'Sec. 6.2.1, Eq. (6.2.15) (the numbers are the page''s own)'}
    origin: page-own

  - id: drum-a
    where: 'same: a = ω²r ≈ 3.9 × 10³ m/s²'
    inputs: {f: 20 Hz, r: 0.25 m}
    formula: (2 * pi * f)**2 * r
    expected: 3.9e3 m/s**2
    shown: ['$a = \omega^2 r \approx 126^2 \times 0.25 \approx 3.9 \times 10^{3}$ m/s²']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: drum-a-period
    where: 'same, check: 4π²r/T² ≈ 3.9 × 10³ m/s²'
    inputs: {r: 0.25 m, T: 0.050 s}
    formula: 4 * pi**2 * r / T**2
    expected: 3.9e3 m/s**2
    shown: ['$4\pi^2 r/T^2 = 4\pi^2 \times 0.25/0.050^2 \approx 3.9 \times 10^{3}$ m/s²']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.9) (the numbers are the page''s own)'}
    origin: page-own

  - id: drum-in-g
    where: 'same: about 400 times g'
    inputs: {a: 3948 m/s**2, g: 9.81 m/s**2}
    formula: a / g
    expected: '400'
    tolerance: 3
    shown: ['That is about 400 times $g$']
    source: {cite: mit, at: 'Sec. 6.4 (the numbers are the page''s own)'}
    origin: page-own

  # Force
  - id: car-force
    where: 'section "The force needed to go round": 1200 kg × 5.0 m/s² = 6.0 × 10³ N'
    inputs: {m: 1200 kg, a: 5.0 m/s**2}
    formula: m * a
    expected: 6.0e3 N
    shown: ['$1200 \times 5.0 = 6.0 \times 10^{3}$ N']
    source: {cite: mit, at: 'Sec. 6.1, Eq. (6.1.1) (the numbers are the page''s own)'}
    origin: page-own

  # Moon
  - id: moon-r
    kind: fact
    where: 'section "The Moon''s orbit": average distance 384 400 km'
    value: 384400 km
    shown: ['average distance from the Earth is 384 400 km']
    source: {cite: moonfact, at: 'Orbital parameters, semimajor axis 0.3844 × 10⁶ km'}
    origin: later-data

  - id: moon-r-m
    where: 'worked example: 384 400 km = 3.844 × 10⁸ m'
    inputs: {r: 384400 km}
    formula: r
    expected: 3.844e8 m
    shown: ['radius $3.844 \times 10^{8}$ m with a period']
    source: {cite: moonfact, at: 'Orbital parameters, semimajor axis'}
    origin: later-data

  - id: moon-T
    kind: fact
    where: 'section "The Moon''s orbit": period 27.3 days (NASA gives 27.3217 days)'
    value: 27.3 day
    shown: ['it goes round once in 27.3 days']
    source: {cite: moonfact, at: 'Orbital parameters, revolution period 27.3217 days'}
    origin: later-data

  - id: moon-T-s
    where: 'worked example: T = 27.3 × 24 × 3600 s ≈ 2.36 × 10⁶ s'
    inputs: {T: 27.3 day}
    formula: T
    expected: 2.36e6 s
    shown: ['$T = 27.3 \times 24 \times 3600\ \text{s} \approx 2.36 \times 10^{6}$ s']
    source: {cite: moonfact, at: 'Orbital parameters, revolution period (conversion is the page''s own)'}
    origin: later-data

  - id: moon-v
    where: 'worked example: v = 2πr/T ≈ 1.02 × 10³ m/s'
    inputs: {r: 384400 km, T: 27.3 day}
    formula: 2 * pi * r / T
    expected: 1.02e3 m/s
    shown: ['\approx 1.02 \times 10^{3}$ m/s, about a kilometre per second']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.4), with the NASA Moon Fact Sheet values (the arithmetic is the page''s own)'}
    origin: page-own

  - id: moon-a
    where: 'worked example: a = v²/r ≈ 2.7 × 10⁻³ m/s²'
    inputs: {r: 384400 km, T: 27.3 day}
    formula: (2 * pi * r / T)**2 / r
    expected: 2.7e-3 m/s**2
    shown: ['{3.844 \times 10^{8}} \approx 2.7 \times 10^{-3}$ m/s², towards the Earth']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.7), with the NASA Moon Fact Sheet values (the arithmetic is the page''s own)'}
    origin: page-own

  - id: moon-a-period
    where: 'same, check: 4π²r/T² ≈ 2.7 × 10⁻³ m/s²'
    inputs: {r: 384400 km, T: 27.3 day}
    formula: 4 * pi**2 * r / T**2
    expected: 2.7e-3 m/s**2
    shown: ['$4\pi^2 r/T^2 \approx 2.7 \times 10^{-3}$ m/s²']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.9), with the NASA Moon Fact Sheet values (the arithmetic is the page''s own)'}
    origin: page-own

  - id: moon-v-nasa
    kind: fact
    where: 'same, check: NASA mean orbital velocity 1.022 km/s'
    value: 1.02 km/s
    shown: ['mean orbital velocity of about 1.02 km/s']
    source: {cite: moonfact, at: 'Orbital parameters, mean orbital velocity 1.022 km/s'}
    origin: later-data

  - id: moon-vs-g
    where: 'the Moon''s acceleration is about 3600 times smaller than g'
    inputs: {r: 384400 km, T: 27.3 day, g: 9.81 m/s**2}
    formula: g / (4 * pi**2 * r / T**2)
    expected: '3600'
    tolerance: 10
    shown: ['about 3600 times smaller than $g$']
    source: {cite: mit, at: 'Sec. 6.1 (Newton and the falling Moon); the arithmetic on the NASA values is the page''s own'}
    origin: page-own

  - id: newton-1666
    kind: fact
    where: 'Newton realised the Moon is always falling around 1666'
    value: '1666'
    shown: ['Newton realised this around 1666']
    source: {cite: mit, at: 'Sec. 6.1, Introduction'}
    origin: mit

  # Cosmology callout
  - id: sun-v-kmh
    kind: fact
    where: 'callout: the Sun orbits the Milky Way centre at about 720 000 km/h'
    value: 720000 km/hour
    shown: ['average speed of about 720 000 km/h']
    source: {cite: sunfacts, at: 'average velocity 720,000 kilometers per hour'}
    origin: later-data

  - id: sun-T
    kind: fact
    where: 'callout: about 230 million years per orbit'
    value: 230e6 year
    shown: ['takes about 230 million years for one orbit']
    source: {cite: sunfacts, at: 'about 230 million years for one complete trip around the Milky Way'}
    origin: later-data

  - id: sun-v
    where: 'callout: 720 000 km/h = 2.0 × 10⁵ m/s'
    inputs: {v: 720000 km/hour}
    formula: v
    expected: 2.0e5 m/s
    shown: ['That speed is $2.0 \times 10^{5}$ m/s']
    source: {cite: sunfacts, at: 'average velocity (conversion is the page''s own)'}
    origin: later-data

  - id: sun-r
    where: 'callout: r = vT/(2π) ≈ 2.3 × 10²⁰ m'
    inputs: {v: 720000 km/hour, T: 230e6 year}
    formula: v * T / (2 * pi)
    expected: 2.3e20 m
    shown: ['comes out at about $2.3 \times 10^{20}$ m']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.4) solved for r, with the NASA Sun: Facts values (the arithmetic is the page''s own)'}
    origin: page-own

  - id: sun-a
    where: 'callout: a = v²/r ≈ 1.7 × 10⁻¹⁰ m/s²'
    inputs: {v: 720000 km/hour, T: 230e6 year}
    formula: v**2 / (v * T / (2 * pi))
    expected: 1.7e-10 m/s**2
    shown: ['at only about $1.7 \times 10^{-10}$ m/s²']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.7), with the NASA Sun: Facts values (the arithmetic is the page''s own)'}
    origin: page-own
  - id: roundabout-30
    kind: fact
    where: 'quiz 1 and section "Steady speed, changing velocity": a car at a steady 30 km/h (illustration)'
    value: 30 km/hour
    shown: ['at a steady 30 km/h. Is it accelerating', 'speedometer fixed at 30 km/h']
    source: {cite: mit, at: 'Sec. 6.1, Introduction: constant speed on a circle still means a changing velocity (the number is the page''s own)'}
    origin: page-own

  - id: quiz-merry-go-round-wrong
    where: 'quiz 2, distractor: 10/8.0 = 1.25 Hz (a slip of the decimal point)'
    inputs: {}
    formula: 10 / 8.0
    expected: '1.25'
    shown: ['"1.25 Hz"']
    source: {cite: mit, at: 'Sec. 6.4, Eq. (6.4.5) (the numbers are the page''s own)'}
    origin: page-own
