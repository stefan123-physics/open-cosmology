    origin: page-own

  - id: cliff-spacing
    where: 'cliff plot caption: marks 6.0 m apart sideways (12 m/s × 0.5 s)'
    inputs: {v: 12 m/s, u: 0.5 s}
    formula: v * u
    expected: 6.0 m
    shown: ['equally spaced sideways (6.0 m each)']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
