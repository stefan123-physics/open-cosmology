  - id: roof-half-g
    where: 'same: ½ × 9.81 = 4.905 in the quadratic equation'
    inputs: {}
    formula: 9.81 / 2
    expected: '4.905'
    tolerance: 1e-9
    shown: ['$4.905\,t^{2} - 9.64\,t - 12 = 0$']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1, Eq. (5.1.16) with a launch height (the numbers are the page''s own)'}
    origin: page-own

  - id: roof-root
    where: 'same: √(9.64² + 4 × 4.905 × 12) = 18.1'
    inputs: {}
    formula: sqrt(9.64**2 + 4 * 4.905 * 12)
    expected: '18.1'
    shown: ['= \dfrac{9.64 \pm 18.1}{9.81}']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1 (quadratic in t, solved as in lesson 0.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: roof-t
    where: 'same: positive root t = 2.83 s'
    inputs: {v: 15 m/s, th: 40, g: 9.81 m/s**2, h: 12 m}
    formula: (v*sin(th*pi/180) + sqrt((v*sin(th*pi/180))**2 + 2*g*h)) / g
    expected: 2.83 s
    shown: ['The positive root is $t = 2.83$ s']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1 (time of landing from a quadratic in t) (the numbers are the page''s own)'}
    origin: page-own

  - id: roof-t-neg
    where: 'same: negative root −0.86 s, before the throw'
    inputs: {v: 15 m/s, th: 40, g: 9.81 m/s**2, h: 12 m}
    formula: (v*sin(th*pi/180) - sqrt((v*sin(th*pi/180))**2 + 2*g*h)) / g
    expected: -0.86 s
    shown: ['the other, $-0.86$ s, lies before the throw']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1 (quadratic in t) (the numbers are the page''s own)'}
