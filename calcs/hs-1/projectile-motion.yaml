  - id: earth-radius
    kind: fact
    where: 'cosmology callout (behind the 8 km/s): the Earth''s mean radius 6371 km'
    value: 6371 km
    shown: ['at about 8 km/s (ignoring the air)']
    source: {cite: nasa-earth, at: 'Bulk parameters, volumetric mean radius 6371.000 km'}
    origin: later-data

  - id: orbit-speed-check
    where: 'cosmology callout: Newton''s cannonball circles the Earth at about 8 km/s; low-orbit speed √(g R_E) with R_E = 6371 km is 7.9 km/s'
    inputs: {g: 9.81 m/s**2, r: 6371 km}
    formula: sqrt(g * r)
    expected: 8 km/s
    tolerance: 2%
    shown: ['at about 8 km/s (ignoring the air)']
    source: {cite: nasa-earth, at: 'Bulk parameters, volumetric mean radius 6371.000 km; the speed √(gR) is the page''s own calculation (not in the source; MIT Ch. 5 models uniform gravity only)'}
    origin: page-own

  - id: quiz-complement
