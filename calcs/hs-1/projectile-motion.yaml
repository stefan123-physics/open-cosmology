# Calculations on content/year-0/hs-1/projectile-motion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: MIT 8.01SC Course Notes Ch. 5 (Sec. 5.2, 5.2.1); Siyavula Physical Sciences Gr 12, 3.2; Siyavula Mathematics Gr 12, 4.3.
# All numbers are the page's own (none of MIT's or Siyavula's example numbers are reused).

page: content/year-0/hs-1/projectile-motion.mdx
calcs:
  - id: g-site
    kind: fact
    where: 'section "Two motions at once": g = 9.81 m/s² (the site''s value from lesson 1.7 on)'
    value: 9.81 m/s**2
    shown: ['with acceleration $g = 9.81$ m/s² downwards']
    source: {cite: reading1, at: '3.2, Motion in a gravitational field gives 9.8 m/s²; 9.81 is the site''s convention'}
    origin: page-own

  # Quiz
  - id: quiz-marble-time
    where: 'quiz 2: fall time from 0.80 m, √(2 × 0.80 / 9.81) ≈ 0.40 s'
    inputs: {h: 0.80 m, g: 9.81 m/s**2}
    formula: sqrt(2 * h / g)
    expected: 0.40 s
    shown: ['$\\sqrt{2 \\times 0.80 / 9.81} \\approx 0.40$ s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-kick-vx
    where: 'quiz 3: 25 cos 30° ≈ 21.7 m/s'
    inputs: {v: 25 m/s, th: 30}
    formula: v * cos(th * pi / 180)
    expected: 21.7 m/s
    shown: ['$25 \\cos 30^{\\circ} \\approx 21.7$ m/s']
    quiz: 2
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-kick-vy
    where: 'quiz 3 explanation: 25 sin 30° = 12.5 m/s'
    inputs: {v: 25 m/s, th: 30}
    formula: v * sin(th * pi / 180)
    expected: 12.5 m/s
    shown: ['$25 \\sin 30^{\\circ} = 12.5$ m/s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-same-range
    where: 'quiz 4: sin 50° = sin 130°, so 25° and 65° give the same range'
    inputs: {}
    formula: sin(50 * pi / 180) - sin(130 * pi / 180)
    expected: '0'
    tolerance: 1e-12
    shown: ['$\\sin 50^{\\circ} = \\sin 130^{\\circ}$']
    source: {cite: reading2, at: '4.3, Derivation of sin 2α (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-double-speed
    where: 'quiz 5: twice the launch speed, four times the range'
    inputs: {}
    formula: 2**2
    expected: '4'
    shown: ['so it lands four times as far away."']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  # Range section
  - id: best-angle
    where: 'section "Time of flight and range": sin 2θ = 1 at 2θ = 90°, so θ = 45°'
    inputs: {}
    formula: sin(2 * 45 * pi / 180)
    expected: '1'
    tolerance: 1e-12
    shown: ['equal to 1, when $2\theta = 90^{\circ}$']
    source: {cite: reading2, at: '4.3, Derivation of sin 2α (the numbers are the page''s own)'}
    origin: page-own

  - id: complementary-angles
    where: 'same: 30° and 60° give 2θ = 60° and 120°, with the same sine'
    inputs: {}
    formula: sin(60 * pi / 180) - sin(120 * pi / 180)
    expected: '0'
    tolerance: 1e-12
    shown: ['their values of $2\theta$, 60° and 120°, have the same sine']
    source: {cite: reading2, at: '4.3, Derivation of sin 2α (the numbers are the page''s own)'}
    origin: page-own

  # Worked example: a free kick (18 m/s at 35°)
  - id: kick-vx
    where: 'worked example "A free kick": v_x = 18 cos 35° = 14.7 m/s'
    inputs: {v: 18 m/s, th: 35}
    formula: v * cos(th * pi / 180)
    expected: 14.7 m/s
    shown: ['$v_x = 18\cos 35^{\circ} = 14.7$ m/s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-vy
    where: 'same: v_y = 18 sin 35° = 10.3 m/s'
    inputs: {v: 18 m/s, th: 35}
    formula: v * sin(th * pi / 180)
    expected: 10.3 m/s
    shown: ['$v_y = 18\sin 35^{\circ} = 10.3$ m/s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.6) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-ttop
    where: 'same: t_top = 10.3 / 9.81 = 1.05 s'
    inputs: {v: 18 m/s, th: 35, g: 9.81 m/s**2}
    formula: v * sin(th * pi / 180) / g
    expected: 1.05 s
    shown: ['$t_{\text{top}} = 10.3 / 9.81 = 1.05$ s']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1, Eq. (5.1.21) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-ymax
    where: 'same: y_max = 10.32² / (2 × 9.81) = 5.43 m'
    inputs: {v: 18 m/s, th: 35, g: 9.81 m/s**2}
    formula: (v * sin(th * pi / 180))**2 / (2 * g)
    expected: 5.43 m
    shown: ['\dfrac{10.32^{2}}{2 \times 9.81} = 5.43$ m']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1, Eq. (5.1.23) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-tflight
    where: 'same: t_flight = 2 × 1.052 = 2.10 s'
    inputs: {v: 18 m/s, th: 35, g: 9.81 m/s**2}
    formula: 2 * v * sin(th * pi / 180) / g
    expected: 2.10 s
    shown: ['$t_{\text{flight}} = 2 \times 1.052 = 2.10$ s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) with y = 0 (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-range
    where: 'same: R = 14.74 × 2.105 = 31.0 m; plot caption "lands 31.0 m away"'
    inputs: {v: 18 m/s, th: 35, g: 9.81 m/s**2}
    formula: v * cos(th * pi / 180) * 2 * v * sin(th * pi / 180) / g
    expected: 31.0 m
    shown: ['$R = 14.74 \times 2.105 = 31.0$ m', 'which lands 31.0 m away']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-range-formula
    where: 'same, check: R = 18² sin 70° / 9.81 = 324 × 0.940 / 9.81 = 31.0 m'
    inputs: {v: 18 m/s, g: 9.81 m/s**2}
    formula: v**2 * sin(70 * pi / 180) / g
    expected: 31.0 m
    shown: ['\dfrac{324 \times 0.940}{9.81} = 31.0$ m, the same']
    source: {cite: reading2, at: '4.3, Derivation of sin 2α, with the range formula derived on the page (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-sin70
    where: 'same: sin 70° = 0.940'
    inputs: {}
    formula: sin(70 * pi / 180)
    expected: '0.940'
    shown: ['{9.81} = \dfrac{324 \times 0.940}']
    source: {cite: reading2, at: '4.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-vy-15
    where: 'paragraph after the example: v_y = 10.32 − 9.81 × 1.5 = −4.39 m/s'
    inputs: {v: 18 m/s, th: 35, g: 9.81 m/s**2, u: 1.5 s}
    formula: v * sin(th * pi / 180) - g * u
    expected: -4.39 m/s
    shown: ['$v_y = 10.32 - 9.81 \times 1.5 = -4.39$ m/s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.17) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-y-15
    where: 'same: y = 10.32 × 1.5 − ½ × 9.81 × 1.5² = 4.45 m'
    inputs: {v: 18 m/s, th: 35, g: 9.81 m/s**2, u: 1.5 s}
    formula: v * sin(th * pi / 180) * u - g * u**2 / 2
    expected: 4.45 m
    shown: ['\tfrac{1}{2} \times 9.81 \times 1.5^{2} = 4.45$ m']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: kick-x-15
    where: 'same: x = 14.74 × 1.5 = 22.1 m'
    inputs: {v: 18 m/s, th: 35, u: 1.5 s}
    formula: v * cos(th * pi / 180) * u
    expected: 22.1 m
    shown: ['$x = 14.74 \times 1.5 = 22.1$ m']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  # Plot of three throws at 15 m/s
  - id: plot-v2g
    where: 'plot of three throws: the constant 22.9358 = 15² / 9.81 in the curve expressions'
    inputs: {}
    formula: 15**2 / 9.81
    expected: '22.9358'
    tolerance: 1e-4
    shown: ['{ x: "22.9358*s"']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-2v2g
    where: 'same: 45.8716 = 2 × 15² / 9.81 in the height expressions'
    inputs: {}
    formula: 2 * 15**2 / 9.81
    expected: '45.8716'
    tolerance: 1e-4
    shown: ['y: "45.8716*sin(45*pi/180)^2*(s - s^2)"']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-range-30
    where: 'caption: at 30° and 60°, 15 m/s, the range is 19.9 m'
    inputs: {v: 15 m/s, g: 9.81 m/s**2}
    formula: v**2 * sin(60 * pi / 180) / g
    expected: 19.9 m
    shown: ['both land 19.9 m away']
    source: {cite: reading2, at: '4.3, with the range formula derived on the page (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-height-60
    where: 'caption: the 60° throw reaches 8.6 m'
    inputs: {v: 15 m/s, g: 9.81 m/s**2}
    formula: (v * sin(60 * pi / 180))**2 / (2 * g)
    expected: 8.6 m
    shown: ['(8.6 m against 2.9 m)']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1, Eq. (5.1.23) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-height-30
    where: 'caption: the 30° throw reaches 2.9 m'
    inputs: {v: 15 m/s, g: 9.81 m/s**2}
    formula: (v * sin(30 * pi / 180))**2 / (2 * g)
    expected: 2.9 m
    shown: ['(8.6 m against 2.9 m)']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1, Eq. (5.1.23) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-height-ratio
    where: 'caption: three times as high (sin²60° / sin²30° = 3)'
    inputs: {}
    formula: sin(60 * pi / 180)**2 / sin(30 * pi / 180)**2
    expected: '3'
    tolerance: 1e-9
    shown: ['the 60° throw goes three times as high']
    source: {cite: mit, at: 'Sec. 5.2, Example 5.1, Eq. (5.1.23) (the numbers are the page''s own)'}
    origin: page-own

  - id: plot-range-45
    where: 'caption: the 45° throw goes 22.9 m'
    inputs: {v: 15 m/s, g: 9.81 m/s**2}
    formula: v**2 / g
    expected: 22.9 m
    shown: ['The 45° throw goes furthest, 22.9 m.']
    source: {cite: reading2, at: '4.3, with the range formula derived on the page (the numbers are the page''s own)'}
    origin: page-own

  # Worked example: a stone from a cliff (12 m/s, 20 m)
  - id: cliff-t
    where: 'worked example "A stone from a cliff": t = √(2 × 20 / 9.81) = 2.02 s'
    inputs: {h: 20 m, g: 9.81 m/s**2}
    formula: sqrt(2 * h / g)
    expected: 2.02 s
    shown: ['$t = \sqrt{2 \times 20 / 9.81} = 2.02$ s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) with θ = 0 (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-x
    where: 'same: x = 12 × 2.019 = 24.2 m'
    inputs: {v: 12 m/s, h: 20 m, g: 9.81 m/s**2}
    formula: v * sqrt(2 * h / g)
    expected: 24.2 m
    shown: ['$x = 12 \times 2.019 = 24.2$ m']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-vy
    where: 'same: v_y = 9.81 × 2.019 = 19.8 m/s'
    inputs: {h: 20 m, g: 9.81 m/s**2}
    formula: g * sqrt(2 * h / g)
    expected: 19.8 m/s
    shown: ['$9.81 \times 2.019 = 19.8$ m/s downwards']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.17) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-speed
    where: 'same: speed √(12² + 19.81²) = 23.2 m/s'
    inputs: {v: 12 m/s, h: 20 m, g: 9.81 m/s**2}
    formula: sqrt(v**2 + 2 * g * h)
    expected: 23.2 m/s
    shown: ['$\sqrt{12^{2} + 19.81^{2}} = 23.2$ m/s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.17) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-angle
    where: 'same: tan⁻¹(19.81 / 12) = 58.8° below the horizontal'
    inputs: {}
    formula: atan(19.81 / 12) * 180 / pi
    expected: '58.8'
    shown: ['$\tan^{-1}(19.81 / 12) = 58.8^{\circ}$']
    source: {cite: mit, at: 'Sec. 5.2.1, Eq. (5.1.30) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-check
    where: 'same, check: √(2 × 9.81 × 20) = 19.8 m/s'
    inputs: {h: 20 m, g: 9.81 m/s**2}
    formula: sqrt(2 * g * h)
    expected: 19.8 m/s
    shown: ['$v_y = \sqrt{2 \times 9.81 \times 20} = 19.8$ m/s']
    source: {cite: reading1, at: '3.2, Equations of motion (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-plot-a
    where: 'cliff plot: 9.81 x² / (2 × 144), with 144 = 12²'
    inputs: {}
    formula: 12**2
    expected: '144'
    shown: ['{ expr: "20 - 9.81*x^2/(2*144)", label: "stone" }']
    source: {cite: mit, at: 'Sec. 5.2.1, Eq. (5.1.33) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-p05
    where: 'cliff plot point at 0.5 s: x = 6, y = 20 − 4.905 × 0.25 = 18.7738'
    inputs: {}
    formula: 20 - 9.81 * 0.5**2 / 2
    expected: '18.7738'
    tolerance: 1e-4
    shown: ['{ x: 6, y: 18.7738, label: "0.5 s" }']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-p10
    where: 'cliff plot point at 1.0 s: x = 12, y = 15.095'
    inputs: {}
    formula: 20 - 9.81 * 1.0**2 / 2
    expected: '15.095'
    tolerance: 1e-4
    shown: ['{ x: 12, y: 15.095, label: "1.0 s" }']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-p15
    where: 'cliff plot point at 1.5 s: x = 18, y = 8.9638'
    inputs: {}
    formula: 20 - 9.81 * 1.5**2 / 2
    expected: '8.9638'
    tolerance: 1e-4
    shown: ['{ x: 18, y: 8.9638, label: "1.5 s" }']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.16) (the numbers are the page''s own)'}
    origin: page-own

  - id: cliff-p20
    where: 'cliff plot point at 2.0 s: x = 24, y = 0.38'
    inputs: {}
    formula: 20 - 9.81 * 2.0**2 / 2
    expected: '0.38'
    tolerance: 1e-9
    shown: ['{ x: 24, y: 0.38, label: "2.0 s" }']
