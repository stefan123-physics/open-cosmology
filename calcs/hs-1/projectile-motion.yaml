  # Worked example: a stone from a roof (15 m/s at 40°, 12 m up)
  - id: roof-vx
    where: 'worked example "A stone from a roof": v_x = 15 cos 40° = 11.5 m/s'
    inputs: {v: 15 m/s, th: 40}
    formula: v * cos(th * pi / 180)
    expected: 11.5 m/s
    shown: ['$v_x = 15\cos 40^{\circ} = 11.5$ m/s']
    source: {cite: mit, at: 'Sec. 5.2, Eq. (5.1.5) (the numbers are the page''s own)'}
    origin: page-own

  - id: roof-vy
    where: 'same: v_y = 15 sin 40° = 9.64 m/s'
    inputs: {v: 15 m/s, th: 40}
    formula: v * sin(th * pi / 180)
    expected: 9.64 m/s
    shown: ['$v_y = 15\sin 40^{\circ} = 9.64$ m/s']
