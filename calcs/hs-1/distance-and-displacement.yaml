# Calculations on content/year-0/hs-1/distance-and-displacement.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.2 Reference frame, and Grade 11, 1.2 Resultant of perpendicular vectors.
# All numbers are the page's own.

page: content/year-0/hs-1/distance-and-displacement.mdx
calcs:
  - id: library-park-gap
    where: 'section "Position needs a reference point": library at +150 m, park at −60 m, 210 m apart'
    inputs: {xl: 150 m, xp: -60 m}
    formula: xl - xp
    expected: 210 m
    shown: ['are still 210 m apart']
    source: {cite: mit, at: 'Sec. 21.2, Position (the numbers are the page''s own)'}
    origin: page-own

  - id: park-from-library
    where: 'same: with the library as origin, the park is at −210 m'
    inputs: {xl: 150 m, xp: -60 m}
    formula: xp - xl
    expected: -210 m
    shown: ['the park at $x = -210$ m']
    source: {cite: mit, at: 'Sec. 21.2, Position (the numbers are the page''s own)'}
    origin: page-own

  - id: round-trip-distance
    where: 'section "Displacement": bus stop to library and back, 150 m out and 150 m back = 300 m'
    inputs: {d: 150 m}
    formula: 2 * d
    expected: 300 m
    shown: ['a distance of 300 m, but zero displacement']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: mila-distance
    where: 'worked example "A walk with a turn-back": 350 m + 120 m = 470 m'
    inputs: {a: 350 m, b: 120 m}
    formula: a + b
    expected: 470 m
    shown: ['$350\ \text{m} + 120\ \text{m} = 470\ \text{m}$', 'than the distance, 470 m, because']
    source: {cite: mit, at: 'Sec. 21.2, Illustration of distance and displacement (the numbers are the page''s own)'}
    origin: page-own

  - id: mila-final-position
    where: 'same: x_f = +350 − 120 = +230 m'
    inputs: {a: 350 m, b: 120 m}
    formula: a - b
    expected: 230 m
    shown: ['$x_f = +350 - 120 = +230$ m', '+230\ \text{m} - 0 = +230\ \text{m}$: she ends up 230 m east', 'The size of the displacement, 230 m, is smaller']
    source: {cite: mit, at: 'Sec. 21.2, Illustration of distance and displacement (the numbers are the page''s own)'}
    origin: page-own

  - id: mila-displacement-other-origin
    where: 'same, step "Check with another origin": −120 − (−350) = +230 m'
    inputs: {xi: -350 m, xf: -120 m}
    formula: xf - xi
    expected: 230 m
    shown: ['$\Delta x = -120 - (-350) = +230$ m']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: half-lap-distance
    where: 'worked example "Laps of a circular path": π × 35.0 m = 110 m'
    inputs: {R: 35.0 m}
    formula: pi * R
    expected: 110 m
    shown: ['$\pi R = \pi \times 35.0\ \text{m} = 110\ \text{m}$', 'less than the distance (110 m)']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: half-lap-displacement
    where: 'same: the diameter 2R = 70.0 m'
    inputs: {R: 35.0 m}
    formula: 2 * R
    expected: 70.0 m
    shown: ['$2R = 70.0\ \text{m}$', 'the displacement (70.0 m)']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: full-lap-distance
    where: 'same: one full lap, 2πr = 220 m'
    inputs: {R: 35.0 m}
    formula: 2 * pi * R
    expected: 220 m
    shown: ['$2\pi R = 220\ \text{m}$', 'Every extra lap adds 220 m']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: noor-distance
    where: 'worked example "A walk across town": 0.90 km + 0.40 km = 1.3 km'
    inputs: {a: 0.90 km, b: 0.40 km}
    formula: a + b
    expected: 1.3 km
    shown: ['$0.90\ \text{km} + 0.40\ \text{km} = 1.3\ \text{km}$']
    source: {cite: reading2, at: 'Sec. 1.2, The resultant vector (the numbers are the page''s own)'}
    origin: page-own

  - id: noor-displacement
    where: 'same: sqrt(0.90² + 0.40²) = 0.98 km'
    inputs: {a: 0.90 km, b: 0.40 km}
    formula: sqrt(a**2 + b**2)
    expected: 0.98 km
    shown: ['= 0.98\ \text{km}$, and']
    source: {cite: reading2, at: 'Sec. 1.2, Algebraic methods, Worked example 10 (the numbers are the page''s own)'}
    origin: page-own

  - id: noor-angle
    where: 'same: tan θ = 0.40/0.90 gives θ = 24° north of east'
    inputs: {}
    formula: atan(0.40 / 0.90) * 180 / pi
    expected: '24'
    shown: ['$\theta = 24°$ north of east']
    source: {cite: reading2, at: 'Sec. 1.2, Algebraic methods, Worked example 11 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-car-distance
    where: 'quiz 1: 8.0 km + 3.0 km = 11 km'
    inputs: {a: 8.0 km, b: 3.0 km}
    formula: a + b
    expected: 11 km
    shown: ['$8.0 + 3.0 = 11$ km']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-car-displacement
    where: 'quiz 1: +8.0 + (−3.0) = +5.0 km'
    inputs: {a: 8.0 km, b: -3.0 km}
    formula: a + b
    expected: 5.0 km
    shown: ['$+8.0 + (-3.0) = +5.0$ km', 'so 5.0 km north of the start']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-displacement-negative
    where: 'quiz 2: −2.5 − (+4.0) = −6.5 m'
    inputs: {xi: 4.0 m, xf: -2.5 m}
    formula: xf - xi
    expected: -6.5 m
    shown: ['$\\Delta x = x_f - x_i = -2.5 - (+4.0) = -6.5$ m', 'it moved 6.5 m in the negative direction']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-pool
    where: 'quiz 4: 4 × 25 m = 100 m'
    inputs: {L: 25 m}
    formula: 4 * L
    expected: 100 m
    shown: ['$4 \\times 25 = 100$ m']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: mila-west-positive
    where: 'section "Signs in one dimension": with west positive, Δx = −230 m'
    inputs: {d: 230 m}
    formula: -d
    expected: -230 m
    shown: ['$\Delta x = -230$ m. That still means 230 m east']
    source: {cite: mit, at: 'Sec. 21.2, Displacement and distance (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-sign-flip
    where: 'quiz 5: +40 m with east positive is −40 m with west positive'
    inputs: {d: 40 m}
    formula: -d
    expected: -40 m
    shown: ['$-40$ m with west positive still means 40 m east']
    source: {cite: mit, at: 'Sec. 21.2, Position (the numbers are the page''s own)'}
    origin: page-own

  - id: park-position
    where: 'section "Position needs a reference point": a park 60 m west of the bus stop is at x = −60 m'
    inputs: {d: 60 m}
    formula: -d
    expected: -60 m
    shown: ['a park 60 m west of it is at $x = -60$ m']
    source: {cite: mit, at: 'Sec. 21.2, Position (the numbers are the page''s own)'}
    origin: page-own

  - id: library-origin
    where: 'section "Position": with the library as origin the bus stop is at x = −150 m'
    inputs: {}
    formula: 0 - 150
    expected: '-150'
    shown: ['the bus stop is at $x = -150$ m']
    source: {cite: mit, at: 'Sec. 21.2, Position (the numbers are the page''s own)'}
    origin: page-own
