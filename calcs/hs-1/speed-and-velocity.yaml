# Calculations on content/year-0/hs-1/speed-and-velocity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.3, 21.5, 21.6; MIT 8.01SC course notes Ch. 4 and 5; 8.286 Lecture 4 slide 1.
# All numbers are the page's own.

page: content/year-0/hs-1/speed-and-velocity.mdx
calcs:
  - id: train-distance
    where: 'worked example "A train there and back": 36 km out and back is 72 km'
    inputs: {d: 36 km}
    formula: 2 * d
    expected: 72 km
    shown: ['36 km back: a distance of 72 km']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: train-time
    where: 'same: 30 + 20 + 40 = 90 min = 1.5 h = 5400 s'
    inputs: {a: 30 min, b: 20 min, w: 40 min}
    formula: a + b + w
    expected: 5400 s
    shown: ['$30 + 20 + 40 = 90$ min, which is 1.5 h or 5400 s']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: train-speed-kmh
    where: 'same: average speed 72 km / 1.5 h = 48 km/h'
    inputs: {d: 72 km, u: 1.5 hour}
    formula: d / u
    expected: 48 km/hour
    shown: ['\dfrac{72\ \text{km}}{1.5\ \text{h}} = 48$ km/h']
    source: {cite: mit, at: 'Sec. 21.3, Average speed (the numbers are the page''s own)'}
    origin: page-own

  - id: train-speed-ms
    where: 'same: 72 000 m / 5400 s ≈ 13 m/s'
    inputs: {d: 72000 m, u: 5400 s}
    formula: d / u
    expected: 13 m/s
    shown: ['\dfrac{72\,000\ \text{m}}{5400\ \text{s}} \approx 13$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average speed (the numbers are the page''s own)'}
    origin: page-own

  - id: train-velocity
    where: 'same: displacement zero, average velocity zero'
    inputs: {d: 36 km, u: 5400 s}
    formula: (d - d) / u
    expected: 0 m/s
    shown: ['average velocity for the whole trip is **zero**']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: train-out
    where: 'same: outward leg +36 km / 0.50 h = +72 km/h = +20 m/s'
    inputs: {d: 36 km, u: 0.50 hour}
    formula: d / u
    expected: 20 m/s
    shown: ['= +72$ km/h, or $+20$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: train-out-kmh
    where: 'same: +72 km/h'
    inputs: {d: 36 km, u: 0.50 hour}
    formula: d / u
    expected: 72 km/hour
    shown: ['\dfrac{+36\ \text{km}}{0.50\ \text{h}} = +72$ km/h']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: train-back-hours
    where: 'same: 40 min = 0.667 h'
    inputs: {w: 40 min}
    formula: w
    expected: 0.667 hour
    shown: ['= \dfrac{-36\ \text{km}}{0.667\ \text{h}}']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (converting minutes; the numbers are the page''s own)'}
    origin: page-own

  - id: train-back
    where: 'same: return leg −36 km / 40 min = −54 km/h = −15 m/s'
    inputs: {d: 36 km, w: 40 min}
    formula: -d / w
    expected: -54 km/hour
    shown: ['= -54$ km/h, or $-15$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: train-back-ms
    where: 'same: −54 km/h = −15 m/s'
    inputs: {d: 36 km, w: 40 min}
    formula: -d / w
    expected: -15 m/s
    shown: ['or $-15$ m/s. The return leg']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: train-check
    where: 'same, check: average speed (48 km/h) lower than both leg speeds 54 and 72 km/h'
    inputs: {d: 36 km, w: 40 min}
    formula: d / w
    expected: 54 km/hour
    shown: ['The average speed (48 km/h) is lower than both leg speeds (54 and 72 km/h)']
    source: {cite: mit, at: 'Sec. 21.3, Average speed (the numbers are the page''s own)'}
    origin: page-own

  - id: kmh-factor
    where: 'section "From km/h to m/s": 1 km/h = 1000 m / 3600 s = 1/3.6 m/s'
    inputs: {v: 1 km/hour}
    formula: v
    expected: 0.2778 m/s
    shown: ['1\ \text{km/h} = \frac{1000\ \text{m}}{3600\ \text{s}} = \frac{1}{3.6}\ \text{m/s}']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (unit conversion) and Exercise 21.3 (km/h to m/s); the factor 1/3.6 itself is the page''s own working, not printed in the source'}
    origin: page-own

  - id: sprinter
    where: 'same: 10 m/s = 36 km/h'
    inputs: {v: 10 m/s}
    formula: v
    expected: 36 km/hour
    shown: ['$10 \times 3.6 = 36$ km/h']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-east
    where: 'worked example "A cyclist in two legs": +6.0 km / 0.25 h = +24 km/h ≈ +6.7 m/s'
    inputs: {d: 6.0 km, w: 15 min}
    formula: d / w
    expected: 6.7 m/s
    shown: ['\dfrac{+6.0\ \text{km}}{0.25\ \text{h}} = +24$ km/h $\approx +6.7$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-east-kmh
    where: 'same: +24 km/h'
    inputs: {d: 6.0 km, w: 15 min}
    formula: d / w
    expected: 24 km/hour
    shown: ['East: $\dfrac{+6.0\ \text{km}}{0.25\ \text{h}}']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-west
    where: 'same: −2.0 km / 10 min = −12 km/h ≈ −3.3 m/s'
    inputs: {d: 2.0 km, w: 10 min}
    formula: -d / w
    expected: -3.3 m/s
    shown: ['this is $-12$ km/h $\approx -3.3$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-west-kmh
    where: 'same: −12 km/h; ten minutes is 1/6 h'
    inputs: {d: 2.0 km, w: 10 min}
    formula: -d / w
    expected: -12 km/hour
    shown: ['ten minutes is $1/6$ h']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-speed-kmh
    where: 'same: 8.0 km in 25 min = 19.2 km/h'
    inputs: {d: 8.0 km, w: 25 min}
    formula: d / w
    expected: 19.2 km/hour
    shown: ['\dfrac{8.0\ \text{km}}{25\ \text{min}} = 19.2$ km/h']
    source: {cite: mit, at: 'Sec. 21.3, Average speed (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-distance
    where: 'same: 6.0 + 2.0 = 8.0 km in 15 + 10 = 25 min'
    inputs: {a: 6.0 km, b: 2.0 km}
    formula: a + b
    expected: 8.0 km
    shown: ['Distance $= 6.0 + 2.0 = 8.0$ km in $15 + 10 = 25$ min']
    source: {cite: mit, at: 'Sec. 21.3, Average speed (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-speed-ms
    where: 'same: 19.2 km/h ≈ 5.3 m/s'
    inputs: {d: 8.0 km, w: 25 min}
    formula: d / w
    expected: 5.3 m/s
    shown: ['= 19.2$ km/h $\approx 5.3$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average speed (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-displacement
    where: 'same: +6.0 + (−2.0) = +4.0 km'
    inputs: {a: 6.0 km, b: -2.0 km}
    formula: a + b
    expected: 4.0 km
    shown: ['Displacement $= +6.0 + (-2.0) = +4.0$ km']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-velocity-kmh
    where: 'same: +4.0 km / 25 min = +9.6 km/h'
    inputs: {d: 4.0 km, w: 25 min}
    formula: d / w
    expected: 9.6 km/hour
    shown: ['\dfrac{+4.0\ \text{km}}{25\ \text{min}} = +9.6$ km/h']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-velocity-ms
    where: 'same: +9.6 km/h ≈ +2.7 m/s, 2.7 m/s east'
    inputs: {d: 4.0 km, w: 25 min}
    formula: d / w
    expected: 2.7 m/s
    shown: ['$\approx +2.7$ m/s, that is 2.7 m/s east']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-plain-average
    where: 'same, check: the plain average (24 + (−12))/2 = 6 km/h is not the average velocity'
    inputs: {}
    formula: (24 + (-12)) / 2
    expected: '6'
    shown: ['$(24 + (-12))/2 = 6$ km/h']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: tram
    where: 'section "Constant velocity": 50 + 8.0 × 30 = 290 m'
    inputs: {a: 50 m, v: 8.0 m/s, u: 30 s}
    formula: a + v * u
    expected: 290 m
    shown: ['$50 + 8.0 \times 30 = 290$ m after 30 s']
    source: {cite: reading2, at: 'Sec. 21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: tram-b-end
    where: 'graph: tram B, 290 − 6.0 × 30 = 110 m at the end of the graph (inside the range 0 to 320 m)'
    inputs: {a: 290 m, v: -6.0 m/s, u: 30 s}
    formula: a + v * u
    expected: 110 m
    shown: ['tram B starts at 290 m with v = −6.0 m/s']
    source: {cite: reading2, at: 'Sec. 21.6, Motion at constant velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-vx
    where: 'worked example "A drone": vx = 36 m / 10 s = 3.6 m/s'
    inputs: {x: 36 m, u: 10 s}
    formula: x / u
    expected: 3.6 m/s
    shown: ['\dfrac{36\ \text{m}}{10\ \text{s}} = 3.6$ m/s']
    source: {cite: reading4, at: 'Sec. 5.1, Eq. (5.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-vy
    where: 'same: vy = 48 m / 10 s = 4.8 m/s'
    inputs: {y: 48 m, u: 10 s}
    formula: y / u
    expected: 4.8 m/s
    shown: ['\dfrac{48\ \text{m}}{10\ \text{s}} = 4.8$ m/s']
    source: {cite: reading4, at: 'Sec. 5.1, Eq. (5.1.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-speed
    where: 'same: sqrt(3.6² + 4.8²) = sqrt(36) = 6.0 m/s'
    inputs: {a: 3.6 m/s, b: 4.8 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 6.0 m/s
    shown: ['$v = \sqrt{3.6^{2} + 4.8^{2}} = \sqrt{36} = 6.0$ m/s']
    source: {cite: reading4, at: 'Sec. 5.1 components, with Pythagoras from lesson 0.8 (not shown in Sec. 5.1; the numbers are the page''s own)'}
    origin: page-own

  - id: drone-angle
    where: 'same: tan θ = 4.8/3.6, θ ≈ 53° north of east (also in the diagram caption)'
    inputs: {}
    formula: atan(4.8 / 3.6) * 180 / pi
    expected: '53'
    shown: ['so $\theta \approx 53°$ north of east']
    source: {cite: reading4, at: 'Sec. 5.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: drone-path
    where: 'same, check: sqrt(36² + 48²) = 60 m, and 60 m / 10 s = 6.0 m/s'
    inputs: {a: 36 m, b: 48 m}
    formula: sqrt(a**2 + b**2)
    expected: 60 m
    shown: ['The straight path is $\sqrt{36^{2} + 48^{2}} = 60$ m long']
    source: {cite: reading4, at: 'Sec. 5.1 components, with Pythagoras from lesson 0.8 (not shown in Sec. 5.1; the numbers are the page''s own)'}
    origin: page-own

  - id: drone-caption
    where: 'diagram caption: 6.0 m/s at 53° north of east'
    inputs: {a: 3.6 m/s, b: 4.8 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 6.0 m/s
    shown: ['so the speed is 6.0 m/s at 53° north of east']
    source: {cite: reading4, at: 'Sec. 5.1 (the numbers are the page''s own)'}
    origin: page-own

  - id: galaxy-speed
    where: 'cosmology callout: 70 km/s/Mpc × 100 Mpc = 7000 km/s = 7.0 × 10⁶ m/s'
    inputs: {H: 70 km/s/Mpc, d: 100 Mpc}
    formula: H * d
    expected: 7.0e6 m/s
    shown: ['$70 \times 100 = 7000$ km/s, which is $7.0 \times 10^{6}$ m/s']
    source: {cite: guth4, at: 'slide 1 (Hubble''s law; the value of H is the site''s round example value)'}
    origin: page-own

  - id: galaxy-fraction-c
    where: 'same: about 2.3% of the speed of light'
    inputs: {H: 70 km/s/Mpc, d: 100 Mpc}
    formula: H * d / c * 100
    expected: '2.3'
    shown: ['about 2.3% of the speed of light']
    source: {cite: guth4, at: 'slide 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-lap-speed
    where: 'quiz 1: 400 m / 80 s = 5.0 m/s; average velocity 0'
    inputs: {d: 400 m, u: 80 s}
    formula: d / u
    expected: 5.0 m/s
    shown: ['Average speed = distance / time = 400 m / 80 s = 5.0 m/s']
    source: {cite: mit, at: 'Sec. 21.3, Differences between speed and velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-motorway
    where: 'quiz 2: 126 km/h / 3.6 = 35 m/s'
    inputs: {v: 126 km/hour}
    formula: v
    expected: 35 m/s
    shown: ['Divide by 3.6: $126 / 3.6 = 35$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Worked example 1 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-motorway-wrong
    where: 'quiz 2, distractor: 126 × 3.6 ≈ 454'
    inputs: {}
    formula: 126 * 3.6
    expected: '454'
    shown: ['gives the impossible 454 m/s']
    source: {cite: mit, at: 'Sec. 21.3 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-lift
    where: 'quiz 4: −12 m / 8.0 s = −1.5 m/s'
    inputs: {d: -12 m, u: 8.0 s}
    formula: d / u
    expected: -1.5 m/s
    shown: ['$v = -12\\ \\text{m} / 8.0\\ \\text{s} = -1.5$ m/s']
    source: {cite: mit, at: 'Sec. 21.3, Average velocity (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-boat
    where: 'quiz 5: sqrt(8.0² + 6.0²) = sqrt(100) = 10 m/s'
    inputs: {a: 8.0 m/s, b: 6.0 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 10 m/s
    shown: ['$\\sqrt{8.0^{2} + 6.0^{2}} = \\sqrt{100} = 10$ m/s']
    source: {cite: reading4, at: 'Sec. 5.1 components, with Pythagoras from lesson 0.8 (not shown in Sec. 5.1; the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-boat-sum
    where: 'quiz 5 explanation: the wrong sum 8.0 + 6.0 = 14 m/s'
    inputs: {a: 8.0 m/s, b: 6.0 m/s}
    formula: a + b
    expected: 14 m/s
    shown: ['Adding them (14 m/s)']
    source: {cite: reading4, at: 'the page''s own distractor, not in the source'}
    origin: page-own
