# Calculations on content/year-0/hs-1/relative-velocity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.2 (reference frame) and 10.2 (speed of sound); Grade 11, 1.2 (perpendicular vectors);
# MIT 8.01SC course notes Ch. 11 (law of addition of velocities); 8.286 Lecture 4 slide 1 and transcript pp. 16–17.
# All worked-example and quiz numbers are the page's own (MIT Example 11.1 uses 160 and 200 m/s planes; none of its numbers are reused).

page: content/year-0/hs-1/relative-velocity.mdx
calcs:
  - id: overtake-relative
    where: 'worked example "Overtaking on a motorway": v_AB = 32 − 25 = +7.0 m/s'
    inputs: {a: 32 m/s, b: 25 m/s}
    formula: a - b
    expected: 7.0 m/s
    shown: ['32 - 25 = +7.0$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: overtake-time
    where: 'same: 35 m / 7.0 m/s = 5.0 s'
    inputs: {d: 35 m, v: 7.0 m/s}
    formula: d / v
    expected: 5.0 s
    shown: ['35\ \text{m} / 7.0\ \text{m/s} = 5.0$ s']
    source: {cite: reading1, at: 'Sec. 11.3 (constant velocity in the lorry''s frame; the numbers are the page''s own)'}
    origin: page-own

  - id: oncoming
    where: 'same: v_CA = −28 − 32 = −60 m/s'
    inputs: {c: -28 m/s, a: 32 m/s}
    formula: c - a
    expected: -60 m/s
    shown: ['-28 - 32 = -60$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: oncoming-kmh
    where: 'same: 60 m/s is more than 200 km/h (216 km/h)'
    inputs: {v: 60 m/s}
    formula: v
    expected: 216 km/hour
    shown: ['more than 200 km/h']
    source: {cite: reading1, at: 'plain unit conversion (1 m/s = 3.6 km/h, as in lessons 0.2 and 1.2), not in the source; the numbers are the page''s own'}
    origin: page-own

  - id: oncoming-sum
    where: 'same, check: opposite directions give the sum 32 + 28 = 60 m/s'
    inputs: {a: 32 m/s, c: 28 m/s}
    formula: a + c
    expected: 60 m/s
    shown: ['$32 + 28 = 60$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: train-walk
    where: 'worked example "Walking on a train": v_YG = −1.5 + 22.0 = +20.5 m/s'
    inputs: {w: -1.5 m/s, v: 22.0 m/s}
    formula: w + v
    expected: 20.5 m/s
    shown: ['-1.5 + 22.0 = +20.5$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) rearranged (the numbers are the page''s own)'}
    origin: page-own

  - id: train-walk-forward
    where: 'same, check: walking to the front gives 1.5 + 22.0 = +23.5 m/s'
    inputs: {w: 1.5 m/s, v: 22.0 m/s}
    formula: w + v
    expected: 23.5 m/s
    shown: ['+23.5$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) rearranged (the numbers are the page''s own)'}
    origin: page-own

  - id: speed-of-sound
    kind: fact
    where: 'section "Chaining relative velocities": sound at about 340 m/s relative to the air (Siyavula Table 10.1: 343 m/s at 20 °C; 341 m/s at 21 °C)'
    value: 340 m/s
    shown: ['Sound travels at about 340 m/s relative to the air']
    source: {cite: siy-sound, at: 'Table 10.1 and the text below it (343 m/s at 20 °C, rounded)'}
    origin: mit

  - id: listener
    where: 'same: 340 + 5.0 = 345 m/s'
    inputs: {v: 340 m/s, w: 5.0 m/s}
    formula: v + w
    expected: 345 m/s
    shown: ['$340 + 5.0 = 345$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: listener-signs
    where: 'same, with signs: 340 − (−5.0) = 345 m/s'
    inputs: {v: 340 m/s, w: -5.0 m/s}
    formula: v - w
    expected: 345 m/s
    shown: ['340 - (-5.0) = 345$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-speed
    where: 'worked example "A boat crossing a river": sqrt(1.5² + 4.0²) = sqrt(18.25) ≈ 4.3 m/s'
    inputs: {a: 1.5 m/s, b: 4.0 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 4.3 m/s
    shown: ['\sqrt{1.5^{2} + 4.0^{2}} = \sqrt{18.25} \approx 4.3$ m/s']
    source: {cite: reading2, at: 'Sec. 1.2, Magnitude of the resultant of vectors at right angles (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-angle
    where: 'same: tan α = 1.5/4.0, α ≈ 21° east of north'
    inputs: {}
    formula: atan(1.5 / 4.0) * 180 / pi
    expected: '21'
    shown: ['the boat moves at 21° east of north']
    source: {cite: reading2, at: 'Sec. 1.2, direction of the resultant (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-time
    where: 'same: 80 m / 4.0 m/s = 20 s'
    inputs: {d: 80 m, v: 4.0 m/s}
    formula: d / v
    expected: 20 s
    shown: ['80\ \text{m} / 4.0\ \text{m/s} = 20$ s']
    source: {cite: reading1, at: 'Sec. 11.3 and Example 11.1 (components treated separately; the numbers are the page''s own)'}
    origin: page-own

  - id: boat-drift
    where: 'same: 1.5 m/s × 20 s = 30 m downstream'
    inputs: {v: 1.5 m/s, u: 20 s}
    formula: v * u
    expected: 30 m
    shown: ['1.5\ \text{m/s} \times 20\ \text{s} = 30$ m']
    source: {cite: reading1, at: 'Sec. 11.3 and Example 11.1 (components treated separately; the numbers are the page''s own)'}
    origin: page-own

  - id: boat-path
    where: 'same, check: sqrt(30² + 80²) ≈ 85 m'
    inputs: {a: 30 m, b: 80 m}
    formula: sqrt(a**2 + b**2)
    expected: 85 m
    shown: ['\sqrt{30^{2} + 80^{2}} \approx 85$ m']
    source: {cite: reading2, at: 'Sec. 1.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-path-speed
    where: 'same, check: 85 m / 20 s ≈ 4.3 m/s (85.4 m exactly)'
    inputs: {a: 30 m, b: 80 m, u: 20 s}
    formula: sqrt(a**2 + b**2) / u
    expected: 4.3 m/s
    shown: ['85\ \text{m} / 20\ \text{s} \approx 4.3$ m/s']
    source: {cite: reading2, at: 'Sec. 1.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: boat-caption
    where: 'diagram caption: about 4.3 m/s at 21° east of north'
    inputs: {a: 1.5 m/s, b: 4.0 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 4.3 m/s
    shown: ['about 4.3 m/s at 21° east of north']
    source: {cite: reading2, at: 'Sec. 1.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: plane-heading
    where: 'worked example "A plane in a crosswind": sin β = 20/75, β ≈ 15° west of north'
    inputs: {}
    formula: atan(20 / sqrt(75**2 - 20**2)) * 180 / pi
    expected: '15'
    shown: ['$\sin\beta = 20/75$, so $\beta \approx 15°$ west of north']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) with components (the numbers are the page''s own)'}
    origin: page-own

  - id: plane-ground-speed
    where: 'same: sqrt(75² − 20²) = sqrt(5225) ≈ 72 m/s'
    inputs: {a: 75 m/s, b: 20 m/s}
    formula: sqrt(a**2 - b**2)
    expected: 72 m/s
    shown: ['\sqrt{75^{2} - 20^{2}} = \sqrt{5225} \approx 72$ m/s']
    source: {cite: reading2, at: 'Sec. 1.2, Pythagoras for perpendicular vectors (the numbers are the page''s own)'}
    origin: page-own

  - id: plane-check
    where: 'same, check: sqrt(72.3² + 20²) ≈ 75 m/s'
    inputs: {a: 72.3 m/s, b: 20 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 75 m/s
    shown: ['\sqrt{72.3^{2} + 20^{2}} \approx 75$ m/s']
    source: {cite: reading2, at: 'Sec. 1.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: einstein-1905
    kind: fact
    where: 'note "A later development: Einstein": special relativity, 1905'
    value: 1905
    shown: ['In 1905 Einstein']
    source: {cite: reading1, at: 'Ch. 11 opening quotation, footnote 1 (Einstein, Ann. Physik 17, 1905)'}
    origin: mit

  - id: hubble-a
    where: 'cosmology callout: v_A = 70 × 100 = 7000 km/s'
    inputs: {H: 70 km/s/Mpc, d: 100 Mpc, u: 1 km/s}
    formula: H * d / u
    expected: '7000'
    shown: ['$v_A = 70 \times 100 = 7000$ km/s']
    source: {cite: guth4, at: 'slide 1 (Hubble''s law; H = 70 is the site''s round example value)'}
    origin: page-own

  - id: hubble-b
    where: 'same: v_B = 70 × 200 = 14 000 km/s'
    inputs: {H: 70 km/s/Mpc, d: 200 Mpc, u: 1 km/s}
    formula: H * d / u
    expected: '14000'
    shown: ['$v_B = 70 \times 200 = 14\,000$ km/s']
    source: {cite: guth4, at: 'slide 1 (Hubble''s law; H = 70 is the site''s round example value)'}
    origin: page-own

  - id: hubble-ba
    where: 'same: v_BA = 14 000 − 7000 = 7000 km/s, which is H × 100 Mpc as seen from A'
    inputs: {H: 70 km/s/Mpc, a: 100 Mpc, b: 200 Mpc, u: 1 km/s}
    formula: (H * b - H * a) / u
    expected: '7000'
    shown: ['v_{BA} = v_B - v_A = 7000$ km/s']
    source: {cite: guth4t, at: 'pp. 16–17 (change of frame by adding one velocity to all; the numbers are the page''s own)'}
    origin: page-own

  - id: hubble-oa
    where: 'same: v_OA = 0 − 7000 = −7000 km/s'
    inputs: {H: 70 km/s/Mpc, a: 100 Mpc, u: 1 km/s}
    formula: (0 * u - H * a) / u
    expected: '-7000'
    shown: ['$v_{OA} = 0 - 7000 = -7000$ km/s']
    source: {cite: guth4t, at: 'pp. 16–17 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trains
    where: 'quiz 1: 25 − 18 = +7.0 m/s'
    inputs: {a: 25 m/s, b: 18 m/s}
    formula: a - b
    expected: 7.0 m/s
    shown: ['25 - 18 = +7.0$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trains-wrong
    where: 'quiz 1 distractor: 25 + 18 = 43 m/s'
    inputs: {a: 25 m/s, b: 18 m/s}
    formula: a + b
    expected: 43 m/s
    shown: ['Adding the speeds (43 m/s)']
    source: {cite: reading1, at: 'the page''s own distractor'}
    origin: page-own

  - id: quiz-bus
    where: 'quiz 2: v_BA = −v_AB = −4.0 m/s'
    inputs: {v: 4.0 m/s}
    formula: -v
    expected: -4.0 m/s
    shown: ['falls back from the bus at 4.0 m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) with A and B swapped (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-swimmer
    where: 'quiz 3: +1.2 + (−1.5) = −0.30 m/s'
    inputs: {a: 1.2 m/s, b: -1.5 m/s}
    formula: a + b
    expected: -0.30 m/s
    shown: ['$= +1.2 + (-1.5) = -0.30$ m/s']
    source: {cite: reading1, at: 'Sec. 11.3, Eq. (11.3.2) rearranged (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-swimmer-wrong
    where: 'quiz 3 distractor: 1.2 + 1.5 = 2.7 m/s'
    inputs: {a: 1.2 m/s, b: 1.5 m/s}
    formula: a + b
    expected: 2.7 m/s
    shown: ['upstream at 2.7 m/s']
    source: {cite: reading1, at: 'the page''s own distractor'}
    origin: page-own

  - id: quiz-plane
    where: 'quiz 4: sqrt(80² + 18²) = sqrt(6724) = 82 m/s'
    inputs: {a: 80 m/s, b: 18 m/s}
    formula: sqrt(a**2 + b**2)
    expected: 82 m/s
    shown: ['\\sqrt{80^{2} + 18^{2}} = \\sqrt{6724} = 82$ m/s']
    source: {cite: reading2, at: 'Sec. 1.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-plane-sum
    where: 'quiz 4 distractor: 80 + 18 = 98 m/s'
    inputs: {a: 80 m/s, b: 18 m/s}
    formula: a + b
    expected: 98 m/s
    shown: ['adding (98 m/s)']
    source: {cite: reading2, at: 'the page''s own distractor'}
    origin: page-own

  - id: quiz-plane-difference
    where: 'quiz 4 distractor: 80 − 18 = 62 m/s'
    inputs: {a: 80 m/s, b: 18 m/s}
    formula: a - b
    expected: 62 m/s
    shown: ['subtracting (62 m/s)']
    source: {cite: reading2, at: 'the page''s own distractor'}
    origin: page-own
