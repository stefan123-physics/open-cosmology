# Calculations on content/year-0/hs-1/hs-1-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8). All problems and numbers are our own.

page: content/year-0/hs-1/hs-1-practice.mdx
calcs:
  # Problem 1: distance and displacement
  - id: p1-a
    answer: p1-a
    where: 'Problem 1(a): 15 m out and 24 m back, 39 m'
    inputs: {x0: 6.0 m, x1: 21 m, x2: -3.0 m, u: 1 m}
    formula: ((x1 - x0) + (x1 - x2)) / u
    expected: '39'
    shown: ['The distance is $15 + 24 = 39$ m.']
    source: {cite: reading1, at: '21.2, Displacement and distance (our own problem)'}
    origin: page-own

  - id: p1-b
    answer: p1-b
    where: 'Problem 1(b): Δx = −3.0 − 6.0 = −9.0 m'
    inputs: {x0: 6.0 m, x2: -3.0 m, u: 1 m}
    formula: (x2 - x0) / u
    expected: '-9'
    shown: ['$\Delta x = x_f - x_i = -3.0 - 6.0 = -9.0$ m']
    source: {cite: reading1, at: '21.2, Displacement and distance (our own problem)'}
    origin: page-own

  - id: p1-check
    where: 'Problem 1(b), check: +15 + (−24) = −9 m'
    inputs: {}
    formula: 15 + (-24)
    expected: '-9'
    shown: ['$+15 + (-24) = -9$ m']
    source: {cite: reading1, at: '21.2, Displacement and distance (our own solution)'}
    origin: page-own

