  # Problem 6: equations for constant acceleration
  - id: p6-a
    kind: identity
    answer: p6-a
    where: 'Problem 6(a): a = (vf² − vi²)/(2Δx), checked against a numerical solution of vi² + 2 A Δx = vf² for A'
    formula: (vf**2 - vi**2) / (2 * dx)
    equals: solve('vi**2 + 2*A*dx - vf**2', 'A', -100, 100)
    samples:
      vf: [30, 10, 40, 25]
      vi: [12, 2, 9, 3.5]
      dx: [420, 50, 500, 137]
    tolerance: 1e-9
    shown: ['$a = \dfrac{v_f^{2} - v_i^{2}}{2\,\Delta x}$']
    source: {cite: mit, at: '21.7, Equation (4), rearranged (our own solution)'}
    origin: page-own

  - id: p6-b
    answer: p6-b
    where: 'Problem 6(b): (900 − 144)/840 = 0.90 m/s²'
    inputs: {vi: 12 m/s, vf: 30 m/s, dx: 420 m, u: 1 m/s**2}
    formula: (vf**2 - vi**2) / (2 * dx) / u
    expected: '0.9'
    shown: ['= \dfrac{756}{840} = 0.90$ m/s²']
    source: {cite: mit, at: '21.7, Equation (4) (our own problem)'}
    origin: page-own

  - id: p6-b-check
    where: 'Problem 6(b), check: 144 + 756 = 900'
    inputs: {}
    formula: 12**2 + 2 * 0.90 * 420
    expected: '900'
    shown: ['$12^{2} + 2 \times 0.90 \times 420 = 144 + 756 = 900 = 30^{2}$']
    source: {cite: mit, at: '21.7, Equation (4) (our own solution)'}
    origin: page-own

  - id: p6-c
    answer: p6-c
    where: 'Problem 6(c): 840/42 = 20 s'
    inputs: {vi: 12 m/s, vf: 30 m/s, dx: 420 m, u: 1 s}
    formula: 2 * dx / (vi + vf) / u
    expected: '20'
    shown: ['= \dfrac{840}{42} = 20$ s']
    source: {cite: mit, at: '21.7, Equation (2), solved for Δt (our own problem)'}
    origin: page-own

  - id: p6-c-check
    where: 'Problem 6(c), check: 18/0.90 = 20 s'
