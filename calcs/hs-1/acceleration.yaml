# Calculations on content/year-0/hs-1/acceleration.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.4 Acceleration; MIT 8.01SC Course Notes Chapter 4, Sec. 4.4 and 4.5, Chapter 5, Sec. 5.2.
# All numbers are the page's own except g (MIT 8.01SC Ch. 5).

page: content/year-0/hs-1/acceleration.mdx
calcs:
  - id: unit-example
    where: 'section "Average acceleration": 2 m/s² means the velocity changes by 2 m/s every second'
    inputs: {a: 2 m/s**2, dt: 1 s}
    formula: a * dt
    expected: 2 m/s
    shown: ['An acceleration of 2 m/s² means that the velocity changes by 2 m/s every second']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: tram-dv
    where: 'worked example "A tram pulling away": Δv = 15 − 3.0 = 12 m/s'
    inputs: {vf: 15 m/s, vi: 3.0 m/s}
    formula: vf - vi
    expected: 12 m/s
    shown: ['$\Delta v = 15\ \text{m/s} - 3.0\ \text{m/s} = 12$ m/s']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: tram-a
    where: 'same: a = 12 m/s / 6.0 s = 2.0 m/s²'
    inputs: {dv: 12 m/s, dt: 6.0 s}
    formula: dv / dt
    expected: 2.0 m/s**2
    shown: ['$a_\text{ave} = \dfrac{12\ \text{m/s}}{6.0\ \text{s}} = 2.0\ \text{m/s}^2$']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: tram-steps
    where: 'same, check: 3.0 + 6 × 2.0 = 15 m/s (the sequence 3.0, 5.0, …, 15)'
    inputs: {vi: 3.0 m/s, a: 2.0 m/s**2, dt: 6.0 s}
    formula: vi + a * dt
    expected: 15 m/s
    shown: ['3.0, 5.0, 7.0, 9.0, 11, 13 and 15 m/s']
    source: {cite: reading1, at: 'Sec. 4.5, Eq. (4.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: plane-cruise
    kind: fact
    where: 'section "Average acceleration": a plane cruising steadily at 250 m/s (a typical airliner cruising speed, illustration only)'
    value: 250 m/s
    shown: ['cruising steadily at 250 m/s']
    source: {cite: mit, at: '21.4, Average acceleration: acceleration says nothing about how fast the object moves (the number is the page''s own)'}
    origin: page-own

  - id: train-a
    where: 'worked example "A train braking while heading west": a = (−8.0 − (−20))/4.0 = +3.0 m/s²'
    inputs: {vf: -8.0 m/s, vi: -20 m/s, dt: 4.0 s}
    formula: (vf - vi) / dt
    expected: 3.0 m/s**2
    shown: ['{4.0}\ \text{m/s}^2 = +3.0\ \text{m/s}^2$']
    source: {cite: mit, at: '21.4, Average acceleration: negative velocity with positive acceleration, slowing down (the numbers are the page''s own)'}
    origin: page-own

  - id: train-dv
    where: 'same: −8.0 − (−20) = 12'
    inputs: {}
    formula: -8.0 - (-20)
    expected: '12'
    shown: ['\dfrac{12}{4.0}\ \text{m/s}^2']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: train-west-positive
    where: 'same, check: with west positive the acceleration is −3.0 m/s²'
    inputs: {vf: 8.0 m/s, vi: 20 m/s, dt: 4.0 s}
    formula: (vf - vi) / dt
    expected: -3.0 m/s**2
    shown: ['the acceleration $-3.0$ m/s²']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: skater
    where: 'worked example "A skateboarder on a slope": 1.5 + 0.80 × 5.0 = 5.5 m/s'
    inputs: {vi: 1.5 m/s, a: 0.80 m/s**2, dt: 5.0 s}
    formula: vi + a * dt
    expected: 5.5 m/s
    shown: ['= 1.5 + 4.0 = 5.5$ m/s']
    source: {cite: reading1, at: 'Sec. 4.5, Eq. (4.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: skater-gain
    where: 'same: 0.80 × 5.0 = 4.0 m/s'
    inputs: {a: 0.80 m/s**2, dt: 5.0 s}
    formula: a * dt
    expected: 4.0 m/s
    shown: ['0.80\ \text{m/s}^2 \times 5.0\ \text{s}']
    source: {cite: reading1, at: 'Sec. 4.5, Eq. (4.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-v2
    where: 'worked example "A sprinter leaving the blocks": v(2.0) = 22/3.3 ≈ 6.67 m/s'
    inputs: {t: 2.0}
    formula: 11 * t / (t + 1.3)
    expected: '6.67'
    shown: ['= \dfrac{22}{3.3} \approx 6.67$ m/s']
    source: {cite: reading1, at: 'Sec. 4.4.1, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-avg
    where: 'same: average acceleration over the first 2.0 s ≈ 3.3 m/s²'
    inputs: {}
    formula: (11 * 2.0 / (2.0 + 1.3) - 0) / 2.0
    expected: '3.3'
    shown: ['{2.0\ \text{s}} \approx 3.3\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Sec. 4.4.1, Eq. (4.3.24) (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-tangent-0
    where: 'same: slope of the tangent at t = 0 is 8.5 m/s²'
    inputs: {}
    formula: deriv('11*u/(u + 1.3)', 'u', 0)
    expected: '8.5'
    shown: ['which are 8.5 m/s² and 1.3 m/s²']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25) (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-tangent-2
    where: 'same: slope of the tangent at t = 2.0 s is 1.3 m/s²'
    inputs: {}
    formula: deriv('11*u/(u + 1.3)', 'u', 2.0)
    expected: '1.3'
    shown: ['after 2.0 s it has dropped to 1.3 m/s²']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25) (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-v01
    where: 'same, check: v(0.10) = 1.1/1.4 ≈ 0.79 m/s'
    inputs: {t: 0.10}
    formula: 11 * t / (t + 1.3)
    expected: '0.79'
    shown: ['$v(0.10) = \dfrac{1.1}{1.4} \approx 0.79$ m/s']
    source: {cite: reading1, at: 'Sec. 4.4.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-short
    where: 'same, check: over the first 0.10 s the average acceleration is about 7.9 m/s²'
    inputs: {}
    formula: (11 * 0.10 / (0.10 + 1.3)) / 0.10
    expected: '7.9'
    shown: ['about 7.9 m/s²']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25): the limit of shorter intervals (the numbers are the page''s own)'}
    origin: page-own

  - id: car-kmh
    where: 'section "How large are accelerations?": 100 km/h ≈ 27.8 m/s'
    inputs: {v: 100 km/hour}
    formula: v
    expected: 27.8 m/s
    shown: ['$100 / 3.6 \approx 27.8$ m/s']
    source: {cite: mit, at: 'not in 21.4: the km/h to m/s factor 1/3.6 is from lesson 1.2 (Siyavula 21.3); the numbers are the page''s own'}
    origin: page-own

  - id: car-a
    where: 'same: 27.8 m/s / 10 s ≈ 2.8 m/s²'
    inputs: {v: 100 km/hour, dt: 10 s}
    formula: v / dt
    expected: 2.8 m/s**2
    shown: ['$a \approx 27.8 / 10 \approx 2.8$ m/s²']
    source: {cite: mit, at: '21.4, Average acceleration; the km/h conversion is from lesson 1.2 (Siyavula 21.3), not 21.4; the numbers are the page''s own'}
    origin: page-own

  - id: emergency-stop
    where: 'same: (0 − 30)/4.0 = −7.5 m/s²'
    inputs: {vf: 0 m/s, vi: 30 m/s, dt: 4.0 s}
    formula: (vf - vi) / dt
    expected: -7.5 m/s**2
    shown: ['$a = (0 - 30)/4.0 = -7.5$ m/s²']
    source: {cite: mit, at: '21.4, Average acceleration: a negative acceleration while moving in the positive direction (the numbers are the page''s own)'}
    origin: page-own

  - id: sprinter-start
    where: 'same: a sprinter, about 8.5 m/s² at the very start (the model above)'
    inputs: {}
    formula: deriv('11*u/(u + 1.3)', 'u', 0)
    expected: '8.5'
    shown: ['about 8.5 m/s² at the very start']
    source: {cite: reading1, at: 'Sec. 4.4.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: g
    kind: fact
    where: 'same: the acceleration of free fall g ≈ 9.8 m/s²'
    value: 9.8 m/s**2
    shown: ['tex="g \approx 9.8\ \text{m/s}^2"']
    source: {cite: reading2, at: 'Sec. 5.2'}
    origin: mit

  - id: g-site
    kind: fact
    where: 'same: from lesson 1.7 on the High School uses g = 9.81 m/s²'
    value: 9.81 m/s**2
    shown: ['$g = 9.81$ m/s²']
    source: {cite: reading2, at: 'Sec. 5.2 gives 9.8 m/s²; 9.81 is the site''s convention from lesson 1.7 on, not in the source'}
    origin: page-own

  - id: g-per-second
    where: 'same: the velocity of a falling stone grows by about 9.8 m/s every second'
    inputs: {g: 9.8 m/s**2, dt: 1 s}
    formula: g * dt
    expected: 9.8 m/s
    shown: ['grows by about 9.8 m/s every second']
    source: {cite: reading2, at: 'Sec. 5.2 (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bus
    where: 'quiz 1: (16 − 4.0)/8.0 = 1.5 m/s²'
    inputs: {}
    formula: (16 - 4.0) / 8.0
    expected: '1.5'
    shown: ['$(16 - 4.0)/8.0 = 12/8.0 = 1.5$ m/s²']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-bus-wrong
    where: 'quiz 1, distractor: 16/8.0 = 2.0 m/s²'
    inputs: {}
    formula: 16 / 8.0
    expected: '2.0'
    shown: ['Dividing the final velocity alone by the time (2.0 m/s²)']
    source: {cite: mit, at: '21.4, Average acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-cart-gain
    where: 'quiz 4: 2.5 × 4.0 = 10 m/s'
    inputs: {a: 2.5 m/s**2, dt: 4.0 s}
    formula: a * dt
    expected: 10 m/s
    shown: ['$2.5 \\times 4.0 = 10$ m/s']
    source: {cite: reading1, at: 'Sec. 4.5, Eq. (4.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-cart
    where: 'quiz 4: v_f = 3.0 + 10 = 13 m/s'
    inputs: {vi: 3.0 m/s, a: 2.5 m/s**2, dt: 4.0 s}
    formula: vi + a * dt
    expected: 13 m/s
    shown: ['$v_f = 3.0 + 10 = 13$ m/s']
    source: {cite: reading1, at: 'Sec. 4.5, Eq. (4.4.2) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-vt-slope
    where: 'quiz 5: (5.0 − 20)/(5.0 − 0) = −3.0 m/s²'
    inputs: {}
    formula: (5.0 - 20) / (5.0 - 0)
    expected: '-3.0'
    shown: ['$(5.0 - 20)/(5.0 - 0) = -15/5.0 = -3.0$ m/s²']
    source: {cite: reading1, at: 'Sec. 4.4.1, Eq. (4.3.24) (the numbers are the page''s own)'}
    origin: page-own
