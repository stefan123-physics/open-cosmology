# Calculations on content/year-0/hs-1/velocity-time-graphs.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.6 Description of motion; MIT 8.01SC Course Notes Chapter 4, Secs. 4.4 and 4.5. All numbers are the page's own.

page: content/year-0/hs-1/velocity-time-graphs.mdx
calcs:
  - id: train-rise
    where: 'worked example "A train leaving a station": rise 14 − 5.0 = 9.0 m/s'
    inputs: {v2: 14 m/s, v1: 5.0 m/s}
    formula: v2 - v1
    expected: 9.0 m/s
    shown: ['$\Delta v = 14\ \text{m/s} - 5.0\ \text{m/s} = 9.0$ m/s']
    source: {cite: mit, at: '21.6, Motion at constant acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: train-run
    where: 'same: run 16 − 4.0 = 12 s'
    inputs: {t2: 16 s, t1: 4.0 s}
    formula: t2 - t1
    expected: 12 s
    shown: ['$\Delta t = 16\ \text{s} - 4.0\ \text{s} = 12$ s']
    source: {cite: mit, at: '21.6, Motion at constant acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: train-a
    where: 'same: a = 9.0 m/s / 12 s = 0.75 m/s²'
    inputs: {dv: 9.0 m/s, dt: 12 s}
    formula: dv / dt
    expected: 0.75 m/s^2
    shown: ['{12\ \text{s}} = 0.75$ m/s²']
    source: {cite: mit, at: '21.6, Motion at constant acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: train-check
    where: 'same, check: 0.75 × 12 = 9.0 m/s'
    inputs: {a: 0.75 m/s^2, dt: 12 s}
    formula: a * dt
    expected: 9.0 m/s
    shown: ['$0.75 \times 12 = 9.0$ m/s']
    source: {cite: mit, at: '21.6, Motion at constant acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: car-a
    where: 'worked example "A remote-controlled car": a = (−2.0 − 2.0)/(16 − 12) = −1.0 m/s²'
    inputs: {v2: -2.0 m/s, v1: 2.0 m/s, dt: 4.0 s}
    formula: (v2 - v1) / dt
    expected: -1.0 m/s^2
    shown: ['= \dfrac{-4.0}{4.0} = -1.0$ m/s²']
    source: {cite: mit, at: '21.6, Motion at constant acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: car-stop-time
    where: 'same: the car stops at 14 s (2.0 m/s lost at 1.0 m/s² after 12 s)'
    inputs: {t0: 12 s, v: 2.0 m/s, a: 1.0 m/s^2}
    formula: t0 + v / a
    expected: 14 s
    shown: ['stops at 14 s and starts back']
    source: {cite: mit, at: '21.6, Motion at constant acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: car-tri1
    where: 'same: ½ × 4.0 × 2.0 = 4.0 m'
    inputs: {b: 4.0 s, h: 2.0 m/s}
    formula: 0.5 * b * h
    expected: 4.0 m
    shown: ['$\tfrac12 \times 4.0 \times 2.0 = 4.0$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-rect1
    where: 'same: 8.0 × 2.0 = 16 m'
    inputs: {b: 8.0 s, h: 2.0 m/s}
    formula: b * h
    expected: 16 m
    shown: ['$8.0 \times 2.0 = 16$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-tri2
    where: 'same: ½ × 2.0 × 2.0 = 2.0 m'
    inputs: {b: 2.0 s, h: 2.0 m/s}
    formula: 0.5 * b * h
    expected: 2.0 m
    shown: ['$\tfrac12 \times 2.0 \times 2.0 = 2.0$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-above
    where: 'same: 4.0 + 16 + 2.0 = 22 m'
    inputs: {A: 4.0 m, B: 16 m, C: 2.0 m}
    formula: A + B + C
    expected: 22 m
    shown: ['$4.0 + 16 + 2.0 = 22$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-rect2
    where: 'same: 4.0 × 2.0 = 8.0 m below'
    inputs: {b: 4.0 s, h: 2.0 m/s}
    formula: b * h
    expected: 8.0 m
    shown: ['$4.0 \times 2.0 = 8.0$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-below
    where: 'same: 2.0 + 8.0 + 2.0 = 12 m'
    inputs: {A: 2.0 m, B: 8.0 m, C: 2.0 m}
    formula: A + B + C
    expected: 12 m
    shown: ['$2.0 + 8.0 + 2.0 = 12$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-disp
    where: 'same: displacement 22 − 12 = 10 m'
    inputs: {up: 22 m, dn: 12 m}
    formula: up - dn
    expected: 10 m
    shown: ['Displacement $= 22 - 12 = 10$ m forwards']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-dist
    where: 'same: distance 22 + 12 = 34 m'
    inputs: {up: 22 m, dn: 12 m}
    formula: up + dn
    expected: 34 m
    shown: ['Distance $= 22 + 12 = 34$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-caption
    where: 'caption of the cars velocity–time graph: area above 22 m, below 12 m (integral of the plotted formula, positive part)'
    inputs: {}
    formula: 0.5*4*2 + 8*2 + 0.5*2*2
    expected: 22
    shown: ['The area above the axis is 22 m, the area below it 12 m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x12
    where: 'section "From velocity–time to position–time": x(12 s) = 4.0 + 16 = 20 m'
    inputs: {A: 4.0 m, B: 16 m}
    formula: A + B
    expected: 20 m
    shown: ['after 12 s at $4.0 + 16 = 20$ m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-xmax
    where: 'same: farthest point 22 m at 14 s (x = 20 + 2(t − 12) − 0.5(t − 12)² at t = 14)'
    inputs: {u: 2}
    formula: 20 + 2*u - 0.5*u**2
    expected: 22
    shown: ['its farthest point, 22 m']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x16
    where: 'same: back to 20 m at 16 s'
    inputs: {u: 4}
    formula: 20 + 2*u - 0.5*u**2
    expected: 20
    shown: ['back to 20 m at 16 s']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x20
    where: 'same: 12 m at 20 s'
    inputs: {u: 4}
    formula: 20 - 2*u
    expected: 12
    shown: ['to 12 m at 20 s']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: car-x22
    where: 'same: stops at 10 m'
    inputs: {u: 2}
    formula: 12 - 2*u + 0.5*u**2
    expected: 10
    shown: ['stops at 10 m, its displacement']
    source: {cite: mit, at: '21.6, Worked examples, calculations from a velocity vs. time graph (the numbers are the page''s own)'}
    origin: page-own

  - id: scooter-tangent-point
    where: 'worked example "An electric scooter pulling away" and its graph: the model v = 3.0√t gives 6.0 m/s at t = 4.0 s, where the tangent touches'
    inputs: {t: 4.0}
    formula: 3 * sqrt(t)
    expected: 6.0
    shown: ['points={[{ x: 4, y: 6, label: "t = 4 s" }]}']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25), tangent slope as the instantaneous acceleration (the model and numbers are the page''s own)'}
    origin: page-own

  - id: scooter-tangent-slope
    where: 'same: the exact tangent slope of v = 3.0√t at t = 4.0 s is 3/(2√4) = 0.75 m/s²'
    inputs: {}
    formula: deriv('3 * sqrt(x)', 'x', 4.0)
    expected: 0.75
    shown: ['{ expr: "6 + 0.75*(t - 4)", label: "tangent", dash: true }']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25) (the model and numbers are the page''s own)'}
    origin: page-own

  - id: scooter-tangent-v0
    where: 'same: the tangent passes through 3.0 m/s at t = 0'
    inputs: {t: 0}
    formula: 6 + 0.75 * (t - 4)
    expected: 3.0
    shown: ['The tangent passes through 3.0 m/s at t = 0']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25) (the model and numbers are the page''s own)'}
    origin: page-own

  - id: scooter-tangent-v8
    where: 'same: and 9.0 m/s at t = 8.0 s'
    inputs: {t: 8.0}
    formula: 6 + 0.75 * (t - 4)
    expected: 9.0
    shown: ['and 9.0 m/s at t = 8.0 s.']
    source: {cite: reading1, at: 'Sec. 4.4.2, Eq. (4.3.25) (the model and numbers are the page''s own)'}
    origin: page-own

  - id: scooter-a
    where: 'same: slope read from the tangent, (9.0 − 3.0)/(8.0 − 0) = 0.75 m/s²'
    inputs: {v2: 9.0 m/s, v1: 3.0 m/s, dt: 8.0 s}
    formula: (v2 - v1) / dt
    expected: 0.75 m/s^2
    shown: ['$\dfrac{9.0 - 3.0}{8.0 - 0} = 0.75$ m/s²']
    source: {cite: mit, at: '21.6, the tangent of a velocity vs. time graph gives the instantaneous acceleration (the numbers are the page''s own)'}
    origin: page-own

  - id: scooter-v1
    where: 'same: reading at the middle of strip 1, 3.0√1.0 = 3.0 m/s'
    inputs: {t: 1.0}
    formula: 3 * sqrt(t)
    expected: 3.0
    shown: ['the graph reads about 3.0, 5.2, 6.7 and 7.9 m/s']
    source: {cite: mit, at: '21.6, reading a velocity vs. time graph (the model v = 3.0√t and the readings are the page''s own, not in the source)'}
    origin: page-own

  - id: scooter-v3
    where: 'same: 3.0√3.0 = 5.196, read as 5.2 m/s'
    inputs: {t: 3.0}
    formula: 3 * sqrt(t)
    expected: 5.2
    shown: ['5.2, 6.7']
    source: {cite: mit, at: '21.6, reading a velocity vs. time graph (the model v = 3.0√t and the readings are the page''s own, not in the source)'}
    origin: page-own

  - id: scooter-v5
    where: 'same: 3.0√5.0 = 6.708, read as 6.7 m/s'
    inputs: {t: 5.0}
    formula: 3 * sqrt(t)
    expected: 6.7
    shown: ['6.7 and 7.9']
    source: {cite: mit, at: '21.6, reading a velocity vs. time graph (the model v = 3.0√t and the readings are the page''s own, not in the source)'}
    origin: page-own

  - id: scooter-v7
    where: 'same: 3.0√7.0 = 7.937, read as 7.9 m/s'
    inputs: {t: 7.0}
    formula: 3 * sqrt(t)
    expected: 7.9
    shown: ['7.9 m/s']
    source: {cite: mit, at: '21.6, reading a velocity vs. time graph (the model v = 3.0√t and the readings are the page''s own, not in the source)'}
    origin: page-own

  - id: scooter-strips
    where: 'same: 2.0 × (3.0 + 5.2 + 6.7 + 7.9) = 45.6, about 46 m'
    inputs: {w: 2.0 s, s: 22.8 m/s}
    formula: w * s
    expected: 46 m
    shown: ['$2.0 \times (3.0 + 5.2 + 6.7 + 7.9) \approx 46$ m']
    source: {cite: mit, at: '21.6, the area under the velocity vs. time graph gives the displacement; strips as in lesson 0.10 (the numbers are the page''s own)'}
    origin: page-own

  - id: scooter-exact
    where: 'same, check: with ever thinner strips the total settles at the integral of 3.0√t from 0 to 8.0 s, 2 × 8^1.5 = 45.25, about 45 m'
    inputs: {}
    formula: integrate('3 * sqrt(x)', 'x', 0, 8)
    expected: 45
    shown: ['the total settles at about 45 m']
    source: {cite: reading1, at: 'not in the source: the page''s own model, integrated (Sec. 4.5.2 gives the area method for straight graphs only)'}
    origin: page-own

  - id: bus-vf
    where: 'worked example "A bus leaving a village": v = 6.0 + 0.50 × 8.0 = 10 m/s'
    inputs: {vi: 6.0 m/s, a: 0.50 m/s^2, t: 8.0 s}
    formula: vi + a * t
    expected: 10 m/s
    shown: ['$v_f = v_i + a\,t = 6.0 + 0.50 \times 8.0 = 10$ m/s']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eqs. (4.4.5) to (4.4.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: bus-dx
    where: 'same: ½(6.0 + 10) × 8.0 = 64 m'
    inputs: {vi: 6.0 m/s, vf: 10 m/s, t: 8.0 s}
    formula: 0.5 * (vi + vf) * t
    expected: 64 m
    shown: ['$\Delta x = \tfrac12\,(6.0 + 10) \times 8.0 = 64$ m']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eqs. (4.4.5) to (4.4.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: bus-rect
    where: 'same, check: 6.0 × 8.0 = 48 m'
    inputs: {vi: 6.0 m/s, t: 8.0 s}
    formula: vi * t
    expected: 48 m
    shown: ['$v_i\,t + \tfrac12 a t^{2} = 6.0 \times 8.0']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eqs. (4.4.5) to (4.4.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: bus-check
    where: 'same, check: 48 + ½ × 0.50 × 8.0² = 64 m'
    inputs: {vi: 6.0 m/s, a: 0.50 m/s^2, t: 8.0 s}
    formula: vi * t + 0.5 * a * t**2
    expected: 64 m
    shown: ['= 48 + 16 = 64$ m']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eqs. (4.4.5) to (4.4.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: bus-tri
    where: 'same and caption: triangle ½ × 0.50 × 8.0² = 16 m'
    inputs: {a: 0.50 m/s^2, t: 8.0 s}
    formula: 0.5 * a * t**2
    expected: 16 m
    shown: ['the triangle between the two lines adds 16 m']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eqs. (4.4.5) to (4.4.8) (the numbers are the page''s own)'}
    origin: page-own

  - id: bus-dv
    where: 'section on the acceleration–time graph: 0.50 × 8.0 = 4.0 m/s'
    inputs: {a: 0.50 m/s^2, t: 8.0 s}
    formula: a * t
    expected: 4.0 m/s
    shown: ['$0.50\ \text{m/s}^2 \times 8.0\ \text{s} = 4.0$ m/s']
    source: {cite: reading1, at: 'Sec. 4.5.1, Eq. (4.4.4) (the numbers are the page''s own)'}
    origin: page-own

  - id: lift-up
