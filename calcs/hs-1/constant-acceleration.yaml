# Calculations on content/year-0/hs-1/constant-acceleration.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Sources: Siyavula Physical Sciences Grade 10, 21.7 Equations of motion; MIT 8.01SC course notes Ch. 4, Sec. 4.5.
# All numbers are the page's own (none of Siyavula's or MIT's example numbers are reused).

page: content/year-0/hs-1/constant-acceleration.mdx
calcs:
  - id: eq1-change
    where: 'section "Equation 1": 3.0 m/s² for 4.0 s adds 12 m/s'
    inputs: {a: 3.0 m/s**2, u: 4.0 s}
    formula: a * u
    expected: 12 m/s
    shown: ['$3.0 \times 4.0 = 12$ m/s to the velocity']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: vt-plot-final
    where: 'velocity–time graph caption: 3.0 m/s² for 6.0 s reaches 18 m/s'
    inputs: {a: 3.0 m/s**2, u: 6.0 s}
    formula: a * u
    expected: 18 m/s
    shown: ['reaches 18 m/s at 6.0 s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: vt-plot-area
    where: 'same caption: triangle of width 6.0 s and height 18 m/s has area 54 m'
    inputs: {w: 6.0 s, h: 18 m/s}
    formula: w * h / 2
    expected: 54 m
    shown: ['a triangle of width 6.0 s and height 18 m/s, is the displacement: 54 m']
    source: {cite: mit, at: 'Sec. 21.7, Derivation of Equation 2 (the numbers are the page''s own)'}
    origin: page-own

  - id: car-vf
    where: 'worked example "A car pulling away": v_f = 0 + 3.0 × 6.0 = 18 m/s'
    inputs: {a: 3.0 m/s**2, u: 6.0 s}
    formula: a * u
    expected: 18 m/s
    shown: ['$v_f = 0 + 3.0 \times 6.0 = 18$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-vf-kmh
    where: 'same: 18 m/s × 3.6 ≈ 65 km/h'
    inputs: {v: 18 m/s}
    formula: v
    expected: 65 km/hour
    shown: ['$18 \times 3.6 \approx 65$ km/h']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-dx
    where: 'same: Δx = ½ × 3.0 × 6.0² = 54 m'
    inputs: {a: 3.0 m/s**2, u: 6.0 s}
    formula: a * u**2 / 2
    expected: 54 m
    shown: ['$\Delta x = 0 \times 6.0 + \tfrac{1}{2} \times 3.0 \times 6.0^{2} = 54$ m']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-check-eq2
    where: 'same, check: ½(0 + 18) × 6.0 = 54 m'
    inputs: {v: 18 m/s, u: 6.0 s}
    formula: v / 2 * u
    expected: 54 m
    shown: ['$\Delta x = \tfrac{1}{2}(0 + 18) \times 6.0 = 54$ m, the same']
    source: {cite: mit, at: 'Sec. 21.7, Equation (2) (the numbers are the page''s own)'}
    origin: page-own

  - id: car-check-eq4
    where: 'same, check: v_f² = 2 × 3.0 × 54 = 324, √324 = 18 m/s'
    inputs: {a: 3.0 m/s**2, d: 54 m}
    formula: sqrt(2 * a * d)
    expected: 18 m/s
    shown: ['$v_f^{2} = 0 + 2 \times 3.0 \times 54 = 324$, and $\sqrt{324} = 18$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-vi
    where: 'worked example "Braking distance": 90 km/h / 3.6 = 25 m/s'
    inputs: {v: 90 km/hour}
    formula: v
    expected: 25 m/s
    shown: ['$v_i = 90 / 3.6 = 25$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Applications in the real-world (braking setting only; the km/h to m/s conversion by 3.6 is from lesson 1.2, not in the source; the numbers are the page''s own)'}
    origin: page-own

  - id: brake-reaction
    where: 'same: reaction distance 25 × 0.80 = 20 m'
    inputs: {v: 25 m/s, u: 0.80 s}
    formula: v * u
    expected: 20 m
    shown: ['$25 \times 0.80 = 20$ m']
    source: {cite: mit, at: 'Sec. 21.7, Worked example 9: Stopping distance (method; the numbers are the page''s own)'}
    origin: page-own

  - id: brake-distance
    where: 'same: braking distance 625/16 ≈ 39 m'
    inputs: {v: 25 m/s, a: -8.0 m/s**2}
    formula: -v**2 / (2 * a)
    expected: 39 m
    shown: ['$\Delta x = \dfrac{625}{16} \approx 39$ m']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-total
    where: 'same: stopping distance 20 + 39 = 59 m'
    inputs: {v: 25 m/s, a: 8.0 m/s**2, u: 0.80 s}
    formula: v * u + v**2 / (2 * a)
    expected: 59 m
    shown: ['$20 + 39 = 59$ m']
    source: {cite: mit, at: 'Sec. 21.7, Worked example 9: Stopping distance (method; the numbers are the page''s own)'}
    origin: page-own

  - id: brake-half-vi
    where: 'same: 45 km/h = 12.5 m/s'
    inputs: {v: 45 km/hour}
    formula: v
    expected: 12.5 m/s
    shown: ['At 45 km/h, $v_i = 12.5$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Applications in the real-world (braking setting only; the km/h to m/s conversion by 3.6 is from lesson 1.2, not in the source; the numbers are the page''s own)'}
    origin: page-own

  - id: brake-half-reaction
    where: 'same: 12.5 × 0.80 = 10 m'
    inputs: {v: 12.5 m/s, u: 0.80 s}
    formula: v * u
    expected: 10 m
    shown: ['$12.5 \times 0.80 = 10$ m']
    source: {cite: mit, at: 'Sec. 21.7, Worked example 9: Stopping distance (method; the numbers are the page''s own)'}
    origin: page-own

  - id: brake-half-braking
    where: 'same: 12.5²/16 ≈ 9.8 m'
    inputs: {v: 12.5 m/s, a: 8.0 m/s**2}
    formula: v**2 / (2 * a)
    expected: 9.8 m
    shown: ['$\dfrac{12.5^{2}}{16} \approx 9.8$ m']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-half-total
    where: 'same: together about 20 m'
    inputs: {v: 12.5 m/s, a: 8.0 m/s**2, u: 0.80 s}
    formula: v * u + v**2 / (2 * a)
    expected: 20 m
    shown: ['together about 20 m']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-time
    where: 'same, check: braking time 25 / 8.0 ≈ 3.1 s'
    inputs: {v: 25 m/s, a: 8.0 m/s**2}
    formula: v / a
    expected: 3.1 s
    shown: ['$\Delta t = 25 / 8.0 \approx 3.1$ s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: brake-check-eq2
    where: 'same, check: ½(25 + 0) × 3.125 ≈ 39 m'
    inputs: {v: 25 m/s, u: 3.125 s}
    formula: v / 2 * u
    expected: 39 m
    shown: ['$\Delta x = \tfrac{1}{2}(25 + 0) \times 3.125 \approx 39$ m']
    source: {cite: mit, at: 'Sec. 21.7, Equation (2) (the numbers are the page''s own)'}
    origin: page-own

  - id: galileo-2s
    where: 'section "The position–time graph is a parabola": ½ × 3.0 × 2.0² = 6.0 m'
    inputs: {a: 3.0 m/s**2, u: 2.0 s}
    formula: a * u**2 / 2
    expected: 6.0 m
    shown: ['$\tfrac{1}{2} \times 3.0 \times 2.0^{2} = 6.0$ m']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eq. (4.4.9) (the numbers are the page''s own)'}
    origin: page-own

  - id: galileo-4s
    where: 'same: ½ × 3.0 × 4.0² = 24 m'
    inputs: {a: 3.0 m/s**2, u: 4.0 s}
    formula: a * u**2 / 2
    expected: 24 m
    shown: ['$\tfrac{1}{2} \times 3.0 \times 4.0^{2} = 24$ m']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eq. (4.4.9) (the numbers are the page''s own)'}
    origin: page-own

  - id: xt-plot-average
    where: 'position–time graph caption: average velocity 54 m / 6.0 s = 9.0 m/s, both reach 54 m at 6.0 s'
    inputs: {d: 54 m, u: 6.0 s}
    formula: d / u
    expected: 9.0 m/s
    shown: ['a car at a steady 9.0 m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (2) (the numbers are the page''s own)'}
    origin: page-own

  - id: xt-plot-meet
    where: 'same: 1.5 × 6.0² = 9.0 × 6.0 = 54 m'
    inputs: {u: 6.0 s, a: 3.0 m/s**2}
    formula: a * u**2 / 2
    expected: 54 m
    shown: ['Both reach 54 m at 6.0 s']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eq. (4.4.9) (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-discriminant
    where: 'worked example "A cyclist rolling downhill": 4.0² + 4 × 0.25 × 60 = 76'
    inputs: {}
    formula: 4.0**2 + 4 * 0.25 * 60
    expected: '76'
    shown: ['\sqrt{4.0^{2} + 4 \times 0.25 \times 60}}{2 \times 0.25} = \dfrac{-4.0 \pm \sqrt{76}}{0.50}']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) solved with the quadratic formula (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-sqrt
    where: 'same: √76 ≈ 8.72'
    inputs: {}
    formula: sqrt(76)
    expected: '8.72'
    shown: ['With $\sqrt{76} \approx 8.72$']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-time
    where: 'same: Δt ≈ 9.4 s (also "about 9.4 s")'
    inputs: {v: 4.0 m/s, a: 0.50 m/s**2, d: 60 m}
    formula: (-v + sqrt(v**2 + 2 * a * d)) / a
    expected: 9.4 s
    shown: ['this gives $\Delta t \approx 9.4$ s or']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-time-solve
    where: 'same: the root of 0.25 t² + 4.0 t − 60 = 0 found numerically, she takes about 9.4 s'
    inputs: {}
    formula: solve('0.25*x**2 + 4.0*x - 60', 'x', 0, 20)
    expected: '9.4'
    shown: ['she takes about **9.4 s**']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-negative-root
    where: 'same: the other root ≈ −25 s'
    inputs: {v: 4.0 m/s, a: 0.50 m/s**2, d: 60 m}
    formula: (-v - sqrt(v**2 + 2 * a * d)) / a
    expected: -25 s
    shown: ['$\Delta t \approx -25$ s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-vf
    where: 'same, check: speed at the bottom √76 ≈ 8.7 m/s'
    inputs: {v: 4.0 m/s, a: 0.50 m/s**2, d: 60 m}
    formula: sqrt(v**2 + 2 * a * d)
    expected: 8.7 m/s
    shown: ['= \sqrt{76} \approx 8.7$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: cyclist-check
    where: 'same, check: 2 × 60 / (4.0 + 8.72) ≈ 9.4 s'
    inputs: {v: 4.0 m/s, w: 8.718 m/s, d: 60 m}
    formula: 2 * d / (v + w)
    expected: 9.4 s
    shown: ['$\Delta t = 2\,\Delta x / (v_i + v_f) = 120 / 12.7 \approx 9.4$ s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (2) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-root-1
    where: 'worked example "Two answers": roots of t² − 6.0 t + 5.0 = 0, first 1.0 s'
    inputs: {}
    formula: solve('x**2 - 6.0*x + 5.0', 'x', 0, 3)
    expected: '1.0'
    shown: ['$\Delta t = 1.0$ s or $\Delta t = 5.0$ s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-root-2
    where: 'same: second root 5.0 s'
    inputs: {}
    formula: solve('x**2 - 6.0*x + 5.0', 'x', 3, 6)
    expected: '5.0'
    shown: ['$(\Delta t - 1.0)(\Delta t - 5.0) = 0$']
    source: {cite: mit, at: 'Sec. 21.7, Equation (3) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-v1
    where: 'same: v = 6.0 − 2.0 × 1.0 = +4.0 m/s'
    inputs: {v: 6.0 m/s, a: -2.0 m/s**2, u: 1.0 s}
    formula: v + a * u
    expected: 4.0 m/s
    shown: ['$v = 6.0 - 2.0 \times 1.0 = +4.0$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-v5
    where: 'same: v = 6.0 − 2.0 × 5.0 = −4.0 m/s'
    inputs: {v: 6.0 m/s, a: -2.0 m/s**2, u: 5.0 s}
    formula: v + a * u
    expected: -4.0 m/s
    shown: ['$v = 6.0 - 2.0 \times 5.0 = -4.0$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-check-eq4
    where: 'same, check: 6.0² + 2 × (−2.0) × 5.0 = 16'
    inputs: {}
    formula: 6.0**2 + 2 * (-2.0) * 5.0
    expected: '16'
    shown: ['$v_f^{2} = 6.0^{2} + 2 \times (-2.0) \times 5.0 = 16$']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-turn-time
    where: 'same: turns round after 6.0 / 2.0 = 3.0 s (also in the graph caption)'
    inputs: {v: 6.0 m/s, a: 2.0 m/s**2}
    formula: v / a
    expected: 3.0 s
    shown: ['after $6.0 / 2.0 = 3.0$ s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-top
    where: 'same: highest point 6.0² / (2 × 2.0) = 9.0 m (also in the graph caption)'
    inputs: {v: 6.0 m/s, a: 2.0 m/s**2}
    formula: v**2 / (2 * a)
    expected: 9.0 m
    shown: ['$\dfrac{6.0^{2}}{2 \times 2.0} = 9.0$ m up the ramp']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: ball-plot
    where: 'ball graph caption: x = 6.0 t − 1.0 t² is 9.0 m at 3.0 s'
    inputs: {}
    formula: 6.0 * 3.0 - 1.0 * 3.0**2
    expected: '9.0'
    shown: ['is highest, 9.0 m up, at 3.0 s']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eq. (4.4.9) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-tram
    where: 'quiz 2: 0 + 0.40 × 50 = 20 m/s'
    inputs: {a: 0.40 m/s**2, u: 50 s}
    formula: a * u
    expected: 20 m/s
    shown: ['$v_f = v_i + a\\,\\Delta t = 0 + 0.40 \\times 50 = 20$ m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-tram-wrong
    where: 'quiz 2, distractor: 50 / 0.40 = 125'
    inputs: {}
    formula: 50 / 0.40
    expected: '125'
    shown: ['gives the impossible 125 m/s']
    source: {cite: mit, at: 'Sec. 21.7, Equation (1) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-cyclist
    where: 'quiz 3: a = −15² / (2 × 45) = −2.5 m/s²'
    inputs: {v: 15 m/s, d: 45 m}
    formula: -v**2 / (2 * d)
    expected: -2.5 m/s**2
    shown: ['$a = -225/90 = -2.5$ m/s²']
    source: {cite: mit, at: 'Sec. 21.7, Equation (4) (the numbers are the page''s own)'}
    origin: page-own

  - id: quiz-trolley
    where: 'quiz 5: 4 × 3.0 = 12 m'
    inputs: {d: 3.0 m, u: 2.0 s, w: 4.0 s}
    formula: d * (w / u)**2
    expected: 12 m
    shown: ['$4 \\times 3.0 = 12$ m']
    source: {cite: reading1, at: 'Sec. 4.5.2, Eq. (4.4.9) (the numbers are the page''s own)'}
    origin: page-own
