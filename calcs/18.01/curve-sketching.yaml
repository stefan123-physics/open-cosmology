# Calculations on content/year-1/18.01/curve-sketching.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 10 (David Jerison): transcript and lecture notes, with the page's own examples.

page: content/year-1/18.01/curve-sketching.mdx
calcs:
  - id: product-quadratic
    kind: identity
    where: 'formula "Quadratic approximation of the product": second derivative at 0 of e^(−3x)(1 + x)^(−1/2) is 2 × 51/8'
    formula: deriv('-3 * exp(-3*x) * (1 + x)**(-0.5) - 0.5 * exp(-3*x) * (1 + x)**(-1.5)', 'x', 0.0)
    equals: 51 / 4 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-5
    shown: ['= 1 - \tfrac72\,x + \tfrac{51}{8}\,x^2']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: product-quadratic-sum
    where: 'formula "Quadratic approximation of the product": 3/2 + 9/2 + 3/8 = 51/8'
    inputs: {}
    formula: 3/2 + 9/2 + 3/8
    expected: '6.375'
    shown: ['\left(\tfrac32 + \tfrac92 + \tfrac38\right)x^2']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: power-coefficient
    where: 'section "A quadratic approximation": ½(−½)(−3/2) = 3/8'
    inputs: {}
    formula: 0.5 * (-0.5) * (-1.5)
    expected: '0.375'
    shown: ['= 1 - \tfrac12 x + \tfrac38 x^2$']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: ak-log-100
    where: 'section "How fast": ln(1.01¹⁰⁰) ≈ 0.99503'
    inputs: {}
    formula: 100 * log(1.01)
    expected: '0.99503'
    shown: ['$\ln(1.01^{100}) \approx 0.99503$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: ak-quadratic-100
    where: 'section "How fast": 1 − 1/(2k) = 0.995 for k = 100'
    inputs: {}
    formula: 1 - 1 / (2 * 100)
    expected: '0.995'
    shown: ['against $1 - 0.005 = 0.995$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: cubic-critical
    kind: identity
    where: 'formula "The example''s derivatives": f′ = 3(1 − x)(1 + x), f″ = −6x for f = 3x − x³'
    formula: deriv('3*x - x**3', 'x', x0)
    equals: 3 * (1 - x0) * (1 + x0)
    samples: {x0: [-2.0, 0.3, 1.0]}
    tolerance: 1e-6
    shown: ['f''(x) = 3(1 - x)(1 + x), \qquad f''''(x) = -6x']
    source: {cite: reading2, at: 'pp. 10, 13'}
    origin: mit

  - id: quiz-critical-value
    where: 'quiz 4 and example: f(1) = 3 − 1 = 2'
    inputs: {}
    formula: 3 * 1 - 1**3
    expected: '2'
    shown: ['the critical value is $f(1) = 3 - 1 = 2$']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: cubic-zeros
    where: 'graph caption: zeros at ±√3 ≈ ±1.73'
    inputs: {}
    formula: sqrt(3)
    expected: '1.73'
    shown: ['±√3 ≈ ±1.73']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: ln-over-x
    kind: identity
    where: 'formula "Critical point of ln x / x": y′ = (1 − ln x)/x², zero at x = e with y(e) = 1/e'
    formula: deriv('log(x) / x', 'x', x0)
    equals: (1 - log(x0)) / x0**2
    samples: {x0: [0.5, 2.5, 5.0]}
    tolerance: 1e-6
    shown: ['y'' = \frac{1 - \ln x}{x^2} = 0 \;\Rightarrow\; x = e, \qquad y(e) = \frac1e']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: quartic-derivative
    kind: identity
    where: 'worked example "x⁴ − 2x²": f′ = 4x(x − 1)(x + 1)'
    formula: deriv('x**4 - 2*x**2', 'x', x0)
    equals: 4 * x0 * (x0 - 1) * (x0 + 1)
    samples: {x0: [-1.5, 0.4, 2.0]}
    tolerance: 1e-6
    shown: ['$f''(x) = 4x^3 - 4x = 4x(x - 1)(x + 1)$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: quartic-second
    kind: identity
    where: 'worked example "x⁴ − 2x²": f″ = 12x² − 4; f″(0) = −4, f″(±1) = 8'
    formula: deriv('4*x**3 - 4*x', 'x', x0)
    equals: 12 * x0**2 - 4
    samples: {x0: [0.0, 1.0, -1.0]}
    tolerance: 1e-6
    shown: ['$f''''(x) = 12x^2 - 4$. $f''''(0) = -4 < 0$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: quartic-inflection-x
    where: 'worked example "x⁴ − 2x²": inflection at 1/√3 ≈ 0.577'
    inputs: {}
    formula: 1 / sqrt(3)
    expected: '0.577'
    shown: ['$x = \pm1/\sqrt3 \approx \pm0.577$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: quartic-inflection-y
    where: 'worked example "x⁴ − 2x²": f(1/√3) = 1/9 − 2/3 = −5/9 ≈ −0.556'
    inputs: {}
    formula: (1 / sqrt(3))**4 - 2 * (1 / sqrt(3))**2
    expected: '-0.556'
    shown: ['$f = \tfrac19 - \tfrac23 = -\tfrac59 \approx -0.556$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: quartic-zero
    where: 'worked example "x⁴ − 2x²": zeros at ±√2 ≈ ±1.414'
    inputs: {}
    formula: sqrt(2)
    expected: '1.414'
    shown: ['$x = \pm\sqrt2 \approx \pm1.414$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: xexp-derivatives
    kind: identity
    where: 'worked example "x e⁻ˣ": g′ = (1 − x)e⁻ˣ'
    formula: deriv('x * exp(-x)', 'x', x0)
    equals: (1 - x0) * exp(-x0)
    samples: {x0: [-1.0, 0.5, 3.0]}
    tolerance: 1e-6
    shown: ['$g''(x) = (1 - x)\,e^{-x}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: xexp-second
    kind: identity
    where: 'worked example "x e⁻ˣ": g″ = (x − 2)e⁻ˣ'
    formula: deriv('(1 - x) * exp(-x)', 'x', x0)
    equals: (x0 - 2) * exp(-x0)
    samples: {x0: [-1.0, 0.5, 3.0]}
    tolerance: 1e-6
    shown: ['$g''''(x) = (x - 2)\,e^{-x}$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: xexp-max
    where: 'worked example "x e⁻ˣ": maximum value 1/e ≈ 0.368'
    inputs: {}
    formula: exp(-1)
    expected: '0.368'
    shown: ['with value $1/e \approx 0.368$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: xexp-inflection
    where: 'worked example "x e⁻ˣ": g(2) = 2/e² ≈ 0.271'
    inputs: {}
    formula: 2 * exp(-2)
    expected: '0.271'
    shown: ['$g = 2/e^2 \approx 0.271$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
