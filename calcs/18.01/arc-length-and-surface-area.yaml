# Calculations on content/year-1/18.01/arc-length-and-surface-area.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 31 transcript, Lecture 30 notes pp. 4–8 and Lecture 31 notes, with the page's own numbers.

page: content/year-1/18.01/arc-length-and-surface-area.mdx
calcs:
  - id: circle-arc
    kind: identity
    where: 'formula "Arc of a circle": ∫₀^a dx/√(1 − x²) = sin⁻¹a'
    formula: integrate('1 / sqrt(1 - t**2)', 't', 0, a)
    equals: asin(a)
    samples: {a: [0.3, 0.8]}
    tolerance: 1e-6
    shown: ['= \sin^{-1}a, \qquad\text{that is,}']
    source: {cite: reading3, at: 'p. 4'}
    origin: mit

  - id: parabola-length
    kind: identity
    where: 'formula "Length of a parabola"'
    formula: integrate('sqrt(1 + 4 * t**2)', 't', 0, a)
    equals: 0.25 * log(2 * a + sqrt(1 + 4 * a**2)) + 0.5 * a * sqrt(1 + 4 * a**2)
    samples: {a: [0.5, 2.0]}
    tolerance: 1e-6
    shown: ['\frac{1}{4}\ln\left(2x + \sqrt{1 + 4x^2}\right) + \frac{1}{2}x\sqrt{1 + 4x^2}']
    source: {cite: reading3, at: 'p. 6'}
    origin: mit

  - id: notes-curve
    where: 'notes example: length of x = t², y = t³ is (13^(3/2) − 8)/27'
    inputs: {}
    formula: integrate('sqrt(4 * t**2 + 9 * t**4)', 't', 0, 1)
    expected: '1.4397'
    shown: ['\frac{1}{27}\left(13^{3/2} - 4^{3/2}\right)']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: sphere-slice
    kind: identity
    where: 'formula "A slice of a sphere": ∫ 2π√(a² − x²) · a/√(a² − x²) dx = 2πa(x₂ − x₁)'
    formula: integrate('2 * pi * sqrt(a**2 - t**2) * sqrt(1 + t**2 / (a**2 - t**2))', 't', x1, x2)
    equals: 2 * pi * a * (x2 - x1)
    samples: {a: [1.0, 3.0], x1: [-0.5, 0.0], x2: [0.7, 2.5]}
    tolerance: 1e-6
    shown: ['= 2\pi a\,(x_2 - x_1)']
    source: {cite: reading3, at: 'p. 9'}
    origin: mit

  - id: quiz-line
    where: 'quiz 2: 2√10 ≈ 6.32'
    inputs: {}
    formula: 2 * sqrt(10)
    expected: '6.32'
    shown: ['$2\\sqrt{10} \\approx 6.32$']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: example-a
    where: 'worked example (a): (8/27)(10^(3/2) − 1) ≈ 9.07'
    inputs: {}
    formula: integrate('sqrt(1 + 9 * t / 4)', 't', 0, 4)
    expected: '9.07'
    shown: ['\left(10^{3/2} - 1\right) \approx 9.07$']
    source: {cite: reading3, at: 'p. 2'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): 2000/(2 × 6371) ≈ 0.157'
    inputs: {}
    formula: 2000 / (2 * 6371)
    expected: '0.157'
    shown: ['$\frac{2000}{2 \times 6371} \approx 0.157$']
    source: {cite: reading3, at: 'p. 9'}
    origin: page-own

