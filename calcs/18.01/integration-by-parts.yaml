# Calculations on content/year-1/18.01/integration-by-parts.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 30 transcript and notes, with the page's own numbers.

page: content/year-1/18.01/integration-by-parts.mdx
calcs:
  - id: unknowns
    where: 'section "Partial fractions in general": 4 + 2 + 6 = 12 unknowns'
    inputs: {}
    formula: 4 + 2 + 6
    expected: '12'
    shown: ['with 12 unknowns']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: guess-x-over-cube
    kind: identity
    where: 'same: ∫ x dx/(x² + 4)³ = −¼(x² + 4)⁻²'
    formula: integrate('t / (t**2 + 4)**3', 't', 0, x)
    equals: -0.25 * (x**2 + 4)**(-2) + 0.25 * 4**(-2)
    samples: {x: [1.0, 3.0]}
    tolerance: 1e-6
    shown: ['= -\frac{1}{4}(x^2 + 4)^{-2} + c$']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: log-integral
    kind: identity
    where: 'formula "Integral of the logarithm"'
    formula: integrate('log(t)', 't', 1, x)
    equals: x * log(x) - x + 1
    samples: {x: [2.0, 5.0]}
    tolerance: 1e-6
    shown: ['= x\ln x - x + c" cite']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: arctan-integral
    kind: identity
    where: 'notes Example 1: ∫ tan⁻¹x dx = x tan⁻¹x − ½ ln(1 + x²)'
    formula: integrate('atan(t)', 't', 0, x)
    equals: x * atan(x) - 0.5 * log(1 + x**2)
    samples: {x: [0.5, 3.0]}
    tolerance: 1e-6
    shown: ['$\int\tan^{-1}x\,dx = x\tan^{-1}x - \frac{1}{2}\ln(1 + x^2) + c$']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: log-squared
    kind: identity
    where: 'section "Reduction formulas": F₂ = x(ln x)² − 2(x ln x − x)'
    formula: integrate('log(t)**2', 't', 1, x)
    equals: (x * log(x)**2 - 2 * (x * log(x) - x)) - 2
    samples: {x: [2.0, 5.0]}
    tolerance: 1e-6
    shown: ['$F_2 = x(\ln x)^2 - 2(x\ln x - x)$']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: x-exp
    kind: identity
    where: 'formula "Reduction formula for powers times the exponential": G₁ = xeˣ − eˣ'
    formula: integrate('t * exp(t)', 't', 0, x)
    equals: x * exp(x) - exp(x) + 1
    samples: {x: [1.0, 2.5]}
    tolerance: 1e-6
    shown: ['G_1 = x e^x - e^x" cite']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: glass-disks
    where: 'formula "Wine glass by disks": π ∫₁^e (ln y)² dy = π(e − 2)'
    inputs: {}
    formula: pi * integrate('log(t)**2', 't', 1, e)
    expected: '2.257'
    shown: ['= \pi(e - 2)" cite']
    source: {cite: reading2, at: 'pp. 10–11'}
    origin: mit

  - id: glass-shells
    where: 'formula "Wine glass by shells": ∫₀¹ (e − eˣ) 2πx dx'
    inputs: {}
    formula: integrate('(e - exp(t)) * 2 * pi * t', 't', 0, 1)
    expected: '2.257'
    shown: ['Both give $\pi(e - 2) \approx 2.26$']
    source: {cite: reading2, at: 'pp. 11–12'}
    origin: mit

  - id: example-a
    where: 'worked example (a): π/2 − 1 ≈ 0.571'
    inputs: {}
    formula: integrate('t * cos(t)', 't', 0, pi / 2)
    expected: '0.571'
    shown: ['= \frac{\pi}{2} - 1 \approx 0.571$']
    source: {cite: reading2, at: 'pp. 5–6'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): e − 2 ≈ 0.718'
    inputs: {}
    formula: integrate('t**2 * exp(t)', 't', 0, 1)
    expected: '0.718'
    shown: ['So the integral is $e - 2 \approx 0.718$']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): (e² + 1)/4 ≈ 2.097'
    inputs: {}
    formula: integrate('t * log(t)', 't', 1, e)
    expected: '2.097'
    shown: ['= \frac{e^2 + 1}{4} \approx 2.097$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: photon-integral
    where: 'cosmology note: ∫₀^∞ x²/(eˣ − 1) dx = 2ζ(3) ≈ 2.404'
    inputs: {}
    formula: integrate('t**2 / (exp(t) - 1)', 't', 1e-9, 60)
    expected: '2.404'
    shown: ['= 2\zeta(3) \approx 2.404$']
    source: {cite: reading2, at: 'pp. 8–9 (the method; the numbers are the page''s own)'}
    origin: page-own

  - id: photon-term
    kind: identity
    where: 'same: ∫₀^∞ x² e^(−kx) dx = 2/k³'
    formula: integrate('t**2 * exp(-k * t)', 't', 0, 80)
    equals: 2 / k**3
    samples: {k: [1.0, 2.0, 3.0]}
    tolerance: 1e-6
    shown: ['= \frac{2}{k^3}$']
    source: {cite: reading2, at: 'pp. 8–9 (the method; the numbers are the page''s own)'}
    origin: page-own

