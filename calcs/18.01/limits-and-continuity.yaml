# Calculations on content/year-1/18.01/limits-and-continuity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 2 (Fall 2006): lecture notes and transcript.

page: content/year-1/18.01/limits-and-continuity.mdx
calcs:
  - id: pumpkin-average
    where: 'section "The derivative as a rate of change", example 2: average velocity (0 − 80)/(4 − 0) = −20 m/s'
    inputs: {h: 80 m, t: 4 s}
    formula: (0 * h - h) / t
    expected: -20 m/s
    shown: ['its average velocity is $(0 - 80)/(4 - 0) = -20$ m/s']
    source: {cite: reading2, at: 'transcript p. 2'}
    origin: mit

  - id: pumpkin-landing-time
    where: 'example 2: h = 80 − 5t² = 0 at t = 4 s'
    formula: sqrt(80 / 5)
    expected: 4
    shown: ['The pumpkin lands at $t = 4$ s']
    source: {cite: reading2, at: 'transcript p. 2'}
    origin: mit

  - id: pumpkin-impact
    where: 'example 2: h''(4) = −10 × 4 = −40 m/s'
    formula: deriv('80 - 5*t**2', 't', 4)
    expected: -40
    shown: ['its velocity on impact is $h''(4) = -40$ m/s']
    source: {cite: reading2, at: 'transcript p. 3'}
    origin: mit

  - id: pumpkin-mph
    where: 'example 2: 40 m/s is about 90 miles an hour'
    inputs: {v: 40 m/s}
    formula: v
    expected: 90 mph
    tolerance: 2 mph
    shown: ['about 90 miles an hour']
    source: {cite: reading2, at: 'transcript p. 3'}
    origin: mit

  - id: lecture-easy-limit
    where: 'section "Easy limits": Jerison''s lim (x + 3)/(x² + 1) at x = 4 is 7/17'
    formula: (4 + 3) / (4**2 + 1) - 7 / 17
    expected: 0
    tolerance: 1e-12
    shown: ['$\lim_{x\to4}(x + 3)/(x^2 + 1) = 7/17$']
    source: {cite: reading2, at: 'transcript p. 5'}
    origin: mit

  - id: notes-easy-limit
    where: 'section "Easy limits": (3² + 3)/(3 + 1) = 12/4 = 3'
    formula: (3**2 + 3) / (3 + 1)
    expected: 3
    shown: ['\frac{3^2 + 3}{3 + 1} = \frac{12}{4} = 3"']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: lecture-right-limit
    where: 'section "Left-hand and right-hand limits": right-hand limit of x + 1 at 0 is 1'
    formula: 0 + 1
    expected: 1
    shown: ['$\lim_{x\to0^+} f(x) = 1$']
    source: {cite: reading2, at: 'transcript p. 6'}
    origin: mit

  - id: lecture-left-limit
    where: 'section "Left-hand and right-hand limits": left-hand limit of −x + 2 at 0 is 2'
    formula: -0 + 2
    expected: 2
    shown: ['$\lim_{x\to0^-} f(x) = 2$']
    source: {cite: reading2, at: 'transcript p. 6'}
    origin: mit

  - id: quiz-easy-limit
    where: 'quiz 1: (1 + 2)/(1 + 4) = 3/5 = 0.6'
    formula: (1**2 + 2 * 1) / (1 + 4)
    expected: 0.6
    shown: ['giving $3/5 = 0.6$']
    quiz: 0
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: jump-left
    where: 'worked example "Which kind of discontinuity?", (a): left-hand limit of x² at 1 is 1'
    formula: 1**2
    expected: 1
    shown: ['From the left, $x^2 \to 1$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: jump-right
    where: 'worked example, (a): right-hand limit of 3 − x at 1 is 2, and f(1) = 2'
    formula: 3 - 1
    expected: 2
    shown: ['from the right, $3 - x \to 2$', 'Since $f(1) = 3 - 1 = 2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: removable-example
    kind: identity
    where: 'worked example, (b): (x² − 4)/(x − 2) = x + 2 for x ≠ 2'
    formula: (x**2 - 4) / (x - 2)
    equals: x + 2
    samples: {x: [1.9, 2.1, 1.999, -3, 5]}
    tolerance: 1e-9
    shown: ['$(x^2 - 4)/(x - 2) = x + 2$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: removable-limit
    kind: limit
    where: 'worked example, (b): limit 4 at x = 2'
    formula: (x**2 - 4) / (x - 2)
    limit: 4
    vary: {x: [2.1, 2.01, 2.001, 2.0001]}
    tolerance: 1e-3
    shown: ['$\lim_{x\to2} g(x) = 4$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: sin-limit
    kind: limit
    where: 'section "Two trigonometric limits": sin θ / θ → 1'
    formula: sin(t) / t
    limit: 1
    vary: {t: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-6
    shown: ['\lim_{\theta \to 0} \frac{\sin\theta}{\theta} = 1']
    source: {cite: reading1, at: 'p. 9'}
    origin: mit

  - id: cos-limit
    kind: limit
    where: 'section "Two trigonometric limits": (1 − cos θ)/θ → 0 (checked as (1 − cos θ)/θ + 1 → 1)'
    formula: (1 - cos(t)) / t + 1
    limit: 1
    vary: {t: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-4
    shown: ['\lim_{\theta \to 0} \frac{1 - \cos\theta}{\theta} = 0']
    source: {cite: reading1, at: 'pp. 9–10'}
    origin: mit

  - id: sin-01
    where: 'worked example "The limits in numbers", θ = 0.1: sin 0.1/0.1 = 0.99833'
    formula: sin(0.1) / 0.1
    expected: 0.99833
    shown: ['$\sin 0.1/0.1 = 0.99833$']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: cos-01
    where: 'worked example, θ = 0.1: (1 − cos 0.1)/0.1 = 0.04996'
    formula: (1 - cos(0.1)) / 0.1
    expected: 0.04996
    shown: ['$(1 - \cos 0.1)/0.1 = 0.04996$']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: sin-001
    where: 'worked example, θ = 0.01: sin 0.01/0.01 = 0.99998'
    formula: sin(0.01) / 0.01
    expected: 0.99998
    shown: ['$\sin 0.01/0.01 = 0.99998$']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: cos-001
    where: 'worked example, θ = 0.01: (1 − cos 0.01)/0.01 = 0.00500'
    formula: (1 - cos(0.01)) / 0.01
    expected: 0.00500
    shown: ['$(1 - \cos 0.01)/0.01 = 0.00500$']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: cos-half-theta
    kind: limit
    where: 'worked example, θ = 0.01: (1 − cos θ)/θ ≈ θ/2 for small θ'
    formula: (1 - cos(t)) / t / (t / 2)
    limit: 1
    vary: {t: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 1e-5
    shown: ['$(1 - \cos\theta)/\theta \approx \theta/2$ for small θ']
    source: {cite: reading1, at: 'p. 10'}
    origin: page-own

  - id: sin-degree
    where: 'worked example, step "Degrees": sin(1°) = 0.017452 = π/180 to this precision'
    formula: sin(pi / 180)
    expected: 0.017452
    shown: ['$\sin(1°) = 0.017452$', 'gives 0.017452']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: pi-over-180
    where: 'worked example, step "Degrees": π/180 = 0.017453 (what sin(θ°)/θ tends to)'
    formula: pi / 180
    expected: 0.017453
    shown: ['which is $\approx \pi/180 = 0.017453$, not 1']
    source: {cite: reading1, at: 'p. 9'}
    origin: page-own

  - id: diff-implies-cont
    kind: identity
    where: 'section "Differentiable implies continuous": f(x) − f(x0) = [(f(x) − f(x0))/(x − x0)](x − x0), for f = x³ at x0 = 2'
    formula: (x**3 - 8) / (x - 2) * (x - 2)
    equals: x**3 - 8
    samples: {x: [1.9, 2.1, 2.001, 3]}
    tolerance: 1e-9
    shown: ['= f''(x_0)\cdot 0 = 0"']
    source: {cite: reading1, at: 'p. 11'}
    origin: mit

  - id: pumpkin2-derivative
    kind: identity
    where: 'section on the derivative''s graph: notes'' Pumpkin Drop Part II, y = 400 − 16t² has y'' = −32t'
    formula: deriv('400 - 16*t**2', 't', t0)
    equals: -32 * t0
    samples: {t0: [-5, -2, 0.5, 4]}
    tolerance: 1e-7
    shown: ['the graph of its derivative, $y'' = -32t$, is a falling straight line']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit
