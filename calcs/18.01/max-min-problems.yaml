# Calculations on content/year-1/18.01/max-min-problems.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 11 (David Jerison): transcript and lecture notes, with the page's own examples.

page: content/year-1/18.01/max-min-problems.mdx
calcs:
  - id: hyperbola-derivative
    kind: identity
    where: 'section "A function with no critical points": (x + 1)/(x + 2) = 1 − 1/(x + 2) has derivative 1/(x + 2)²'
    formula: deriv('(x + 1) / (x + 2)', 'x', x0)
    equals: 1 / (x0 + 2)**2
    samples: {x0: [-5.0, -1.0, 3.0]}
    tolerance: 1e-6
    shown: ['$f(x) = 1 - 1/(x + 2)$ shows at once that $f'' = 1/(x + 2)^2 > 0$']
    source: {cite: reading2, at: 'pp. 1, 4'}
    origin: mit

  - id: hyperbola-second
    kind: identity
    where: 'formula "Second derivative": f″ = −2/(x + 2)³'
    formula: deriv('1 / (x + 2)**2', 'x', x0)
    equals: -2 / (x0 + 2)**3
    samples: {x0: [-5.0, -1.0, 3.0]}
    tolerance: 1e-6
    shown: ['f''''(x) = \frac{-2}{(x + 2)^3}']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: xlnx-derivative
    kind: identity
    where: 'formula "Derivative of x / ln x"'
    formula: deriv('x / log(x)', 'x', x0)
    equals: (log(x0) - 1) / log(x0)**2
    samples: {x0: [0.5, 2.0, 9.0]}
    tolerance: 1e-6
    shown: ['f''(x) = \frac{\ln x - 1}{(\ln x)^2} = \frac{1}{\ln x} - \frac{1}{(\ln x)^2}']
    source: {cite: reading2, at: 'pp. 8–9'}
    origin: mit

  - id: xlnx-second
    kind: identity
    where: 'formula "Second derivative of x / ln x"'
    formula: deriv('1 / log(x) - 1 / log(x)**2', 'x', x0)
    equals: (2 - log(x0)) / (x0 * log(x0)**3)
    samples: {x0: [0.5, 2.0, 9.0]}
    tolerance: 1e-6
    shown: ['f''''(x) = \frac{2 - \ln x}{x\,(\ln x)^3}']
    source: {cite: reading2, at: 'p. 10'}
    origin: mit

  - id: ln10-times-10
    where: 'section "x / ln x": 10 ln 10 ≈ 23'
    inputs: {}
    formula: 10 * log(10)
    expected: '23'
    tolerance: 0.1
    shown: ['$10\ln 10 \approx 23$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: xlnx-inflection
    where: 'graph caption: inflection (e², e²/2) ≈ (7.39, 3.69)'
    inputs: {}
    formula: exp(2) / 2
    expected: '3.69'
    shown: ['≈ (7.39, 3.69)']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: e-value
    where: 'graph caption: (e, e) ≈ (2.72, 2.72)'
    inputs: {}
    formula: exp(1)
    expected: '2.72'
    shown: ['(e, e) ≈ (2.72, 2.72)']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: can-critical
    kind: identity
    where: 'formula "Critical point of the surface area": dS/dr = 0 at r = (V/π)^(1/3), where h = r'
    formula: deriv('pi * r**2 + 2 * V / r', 'r', (V / pi)**(1/3))
    equals: 0 * V
    samples: {V: [1.0, 5.0, 0.3]}
    tolerance: 1e-6
    shown: ['r^3 = \frac{V}{\pi}, \quad r = \left(\frac{V}{\pi}\right)^{1/3}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: can-min-area
    kind: identity
    where: 'section "The open can": S_min = 3 π^(1/3) V^(2/3)'
    formula: pi * (V / pi)**(2/3) + 2 * V / (V / pi)**(1/3)
    equals: 3 * pi**(1/3) * V**(2/3)
    samples: {V: [1.0, 5.0, 0.3]}
    tolerance: 1e-9
    shown: ['$S = 3\pi^{1/3}V^{2/3}$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: can-plot-r
    where: 'graph caption: for V = 1 the minimum is at r = (1/π)^(1/3) ≈ 0.683'
    inputs: {}
    formula: (1 / pi)**(1/3)
    expected: '0.683'
    shown: ['r = (1/π)^(1/3) ≈ 0.683']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: can-plot-S
    where: 'graph caption: S ≈ 4.39 at the minimum for V = 1'
    inputs: {}
    formula: 3 * pi**(1/3)
    expected: '4.39'
    shown: ['where S ≈ 4.39']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: squares-critical
    where: 'formula "Area of the two squares": A(1/2) = 1/32'
    inputs: {}
    formula: (0.5 / 4)**2 + (0.5 / 4)**2
    expected: '0.03125'
    shown: ['$A = 2 \times (1/8)^2 = 1/32$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: squares-endpoint
    where: 'section "A wire cut into two squares": A(0) = A(1) = 1/16'
    inputs: {}
    formula: (1 / 4)**2
    expected: '0.0625'
    shown: ['$A(0) = A(1) = 1/16$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: mit

  - id: closed-can-r
    where: 'worked example "A closed can", step "Critical point": r = (1000/2π)^(1/3) ≈ 5.42 cm'
    inputs: {V: 1000 cm**3}
    formula: (V / (2 * pi))**(1/3)
    expected: 5.42 cm
    shown: ['$r = (1000/2\pi)^{1/3} \approx 5.42$ cm']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: closed-can-h
    where: 'worked example "A closed can": h = 2r ≈ 10.8 cm'
    inputs: {V: 1000 cm**3}
    formula: V / (pi * (V / (2 * pi))**(2/3))
    expected: 10.8 cm
    shown: ['$h = V/(\pi r^2) = 2r \approx 10.8$ cm']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: closed-can-S
    where: 'worked example "A closed can": S = 6πr² ≈ 554 cm²'
    inputs: {V: 1000 cm**3}
    formula: 6 * pi * (V / (2 * pi))**(2/3)
    expected: 554 cm**2
    tolerance: 1 cm**2
    shown: ['$S = 6\pi r^2 \approx 554$ cm²']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: closed-can-critical
    kind: identity
    where: 'worked example "A closed can": dS/dr = 4πr − 2V/r² = 0 at r³ = V/(2π)'
    formula: deriv('2 * pi * r**2 + 2 * V / r', 'r', (V / (2 * pi))**(1/3))
    equals: 0 * V
    samples: {V: [1000.0, 1.0]}
    tolerance: 1e-6
    shown: ['$dS/dr = 4\pi r - 2V/r^2 = 0$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: circle-square-x
    where: 'worked example "A square and a circle": x = 4/(π + 4) ≈ 0.560'
    inputs: {}
    formula: 4 / (pi + 4)
    expected: '0.560'
    shown: ['$x = 4/(\pi + 4) \approx 0.560$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: circle-square-critical
    kind: identity
    where: 'worked example "A square and a circle": A′ = 0 at x = 4/(π + 4)'
    formula: deriv('x**2 / 16 + (1 - x)**2 / (4 * pi)', 'x', 4 / (pi + 4)) + 0 * x0
    equals: 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['$A'' = x/8 - (1 - x)/(2\pi) = 0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: circle-square-min
    where: 'worked example "A square and a circle": minimum area 1/(4(π + 4)) ≈ 0.0350'
    inputs: {}
    formula: 1 / (4 * (pi + 4))
    expected: '0.0350'
    shown: ['$A = 1/\bigl(4(\pi + 4)\bigr) \approx 0.0350$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: circle-square-min-check
    where: 'worked example "A square and a circle": A at x = 4/(π + 4) equals 1/(4(π + 4))'
    inputs: {}
    formula: (4 / (pi + 4))**2 / 16 + (1 - 4 / (pi + 4))**2 / (4 * pi)
    expected: '0.0350'
    shown: ['\approx 0.0350$: the minimum']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: circle-only
    where: 'worked example "A square and a circle": A(0) = 1/(4π) ≈ 0.0796'
    inputs: {}
    formula: 1 / (4 * pi)
    expected: '0.0796'
    shown: ['$A(0) = 1/(4\pi) \approx 0.0796$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: square-only
    where: 'worked example "A square and a circle": A(1) = 1/16 = 0.0625'
    inputs: {}
    formula: 1 / 16
    expected: '0.0625'
    shown: ['$A(1) = 1/16 = 0.0625$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
