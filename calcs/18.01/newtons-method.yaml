# Calculations on content/year-1/18.01/newtons-method.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 13 (David Jerison): transcript and lecture notes, with the page's own examples.

page: content/year-1/18.01/newtons-method.mdx
calcs:
  - id: sqrt5-step
    kind: identity
    where: 'formula "Newton''s method for the square root of 5": x − (x² − 5)/(2x) = x/2 + 5/(2x)'
    formula: x0 - (x0**2 - 5) / (2 * x0)
    equals: x0 / 2 + 5 / (2 * x0)
    samples: {x0: [2.0, 3.0, 0.7]}
    tolerance: 1e-12
    shown: ['x_{n+1} = x_n - \frac{x_n^2 - 5}{2x_n} = \frac12\,x_n + \frac{5}{2x_n}']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: sqrt5-x1
    where: 'quiz 2 and text: x₁ = 9/4'
    inputs: {}
    formula: 2 / 2 + 5 / (2 * 2)
    expected: '2.25'
    shown: ['| 1 | 9/4 = 2.25 |']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: sqrt5-x2
    where: 'text and table: x₂ = 161/72 ≈ 2.236111'
    inputs: {}
    formula: 2.25 / 2 + 5 / (2 * 2.25)
    expected: '2.236111'
    shown: ['| 2 | 161/72 ≈ 2.236111 |']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: sqrt5-x2-fraction
    where: 'text: 161/72'
    inputs: {}
    formula: 161 / 72
    expected: '2.236111'
    shown: ['= \tfrac{161}{72}$, and so on']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: sqrt5-x3
    where: 'table: x₃ ≈ 2.2360680'
    inputs: {}
    formula: (161 / 72) / 2 + 5 / (2 * 161 / 72)
    expected: '2.2360680'
    shown: ['| 3 | ≈ 2.2360680 |']
    source: {cite: reading2, at: 'pp. 12–13'}
    origin: page-own

  - id: sqrt5-err0
    where: 'table: error of x₀ about 2 × 10⁻¹'
    inputs: {}
    formula: sqrt(5) - 2
    expected: '0.24'
    tolerance: 0.05
    shown: ['| 0 | 2 | about $2 \times 10^{-1}$ |']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: sqrt5-err1
    where: 'table: error of x₁ about 10⁻²'
    inputs: {}
    formula: 2.25 - sqrt(5)
    expected: '0.014'
    tolerance: 0.005
    shown: ['| 1 | 9/4 = 2.25 | about $10^{-2}$ |']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: sqrt5-err2
    where: 'table: error of x₂ about 4 × 10⁻⁵'
    inputs: {}
    formula: 161 / 72 - sqrt(5)
    expected: '4.3e-5'
    tolerance: 0.3e-5
    shown: ['about $4 \times 10^{-5}$']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: sqrt5-err3
    where: 'table: error of x₃ about 10⁻¹⁰'
    inputs: {}
    formula: (161 / 72) / 2 + 5 / (2 * 161 / 72) - sqrt(5)
    expected: '4.2e-10'
    tolerance: 0.5e-10
    shown: ['about $10^{-10}$']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: plot-step
    where: 'graph caption: from x₀ = 3 the next guess is 3/2 + 5/6 ≈ 2.333'
    inputs: {}
    formula: 3 / 2 + 5 / 6
    expected: '2.333'
    shown: ['From x₀ = 3 that is 2.333']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: sqrt5-value
    where: 'graph caption: √5 ≈ 2.236'
    inputs: {}
    formula: sqrt(5)
    expected: '2.236'
    shown: ['close to √5 ≈ 2.236']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: ring-sin
    where: 'worked example "A ring on a 6 m rope", step "Angle": sin α = 2/3, α ≈ 41.8°'
    inputs: {}
    formula: asin(4.0 / 6.0) * 180 / pi
    expected: '41.8'
    shown: ['$\alpha = \beta \approx 41.8°$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ring-root
    where: 'worked example "A ring": √(36 − 16) ≈ 4.472 m'
    inputs: {}
    formula: sqrt(36 - 16)
    expected: '4.472'
    shown: ['$\sqrt{L^2 - a^2} = \sqrt{36 - 16} \approx 4.472$ m']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ring-y
    where: 'worked example "A ring", step "Height": y = ½(1.0 − 4.472) ≈ −1.74 m'
    inputs: {a: 4.0 m, b: 1.0 m, L: 6.0 m}
    formula: 0.5 * (b - sqrt(L**2 - a**2))
    expected: -1.74 m
    shown: ['so $y = \tfrac12(1.0 - 4.472) \approx -1.74$ m']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ring-x
    where: 'worked example "A ring": x = (a/2)(1 − b/√(L² − a²)) ≈ 1.55 m'
    inputs: {a: 4.0 m, b: 1.0 m, L: 6.0 m}
    formula: a / 2 * (1 - b / sqrt(L**2 - a**2))
    expected: 1.55 m
    shown: ['$x = \tfrac{4.0}{2}(1 - 1.0/4.472) \approx 1.55$ m']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ring-left-piece
    where: 'worked example "A ring": the left piece ≈ 2.33 m'
    inputs: {a: 4.0, b: 1.0, L: 6.0}
    formula: sqrt((a / 2 * (1 - b / sqrt(L**2 - a**2)))**2 + (0.5 * (b - sqrt(L**2 - a**2)))**2)
    expected: '2.33'
    shown: ['$\sqrt{1.55^2 + 1.74^2} \approx 2.33$ m']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: ring-right-piece
    where: 'worked example "A ring": the right piece ≈ 3.67 m'
    inputs: {a: 4.0, b: 1.0, L: 6.0}
    formula: sqrt((a - a / 2 * (1 - b / sqrt(L**2 - a**2)))**2 + (b - 0.5 * (b - sqrt(L**2 - a**2)))**2)
    expected: '3.67'
    shown: ['$\sqrt{2.45^2 + 2.74^2} \approx 3.67$ m']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: ring-balance
    kind: identity
    where: 'formula "Where the ring hangs": the notes'' x and y satisfy the balance x/√(x² + y²) = a/L'
    formula: (a / 2 * (1 - b / sqrt(L**2 - a**2))) / sqrt((a / 2 * (1 - b / sqrt(L**2 - a**2)))**2 + (0.5 * (b - sqrt(L**2 - a**2)))**2)
    equals: a / L
    samples: {a: [4.0, 3.0], b: [1.0, -0.5], L: [6.0, 5.0]}
    tolerance: 1e-9
    shown: ['\sin\alpha = \frac{a}{L}, \qquad y = \frac12\left(b - \sqrt{L^2 - a^2}\right)']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: cos-x1
    where: 'worked example "Where cos x = x": x₁ ≈ 0.7504'
    inputs: {}
    formula: 1 - (1 - cos(1)) / (1 + sin(1))
    expected: '0.7504'
    shown: ['$x_1 = 1 - (1 - 0.5403)/(1 + 0.8415) \approx 0.7504$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: cos-x2
    where: 'worked example "Where cos x = x": x₂ ≈ 0.7391'
    inputs: {}
    formula: (1 - (1 - cos(1)) / (1 + sin(1))) - ((1 - (1 - cos(1)) / (1 + sin(1))) - cos(1 - (1 - cos(1)) / (1 + sin(1)))) / (1 + sin(1 - (1 - cos(1)) / (1 + sin(1))))
    expected: '0.7391'
    shown: ['$x_2 \approx 0.7391$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: cos-root
    where: 'worked example "Where cos x = x": x₃ ≈ 0.739085 satisfies x = cos x to six decimals'
    inputs: {}
    formula: 0.739085 - cos(0.739085)
    expected: '0'
    tolerance: 1e-6
    shown: ['$x_3 \approx 0.739085$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: cube-x1
    where: 'worked example "A cube root": x₁ = 4/3 ≈ 1.3333'
    inputs: {}
    formula: 2 / 3 * 1 + 2 / (3 * 1**2)
    expected: '1.3333'
    shown: ['$x_1 = \tfrac23 + \tfrac23 \approx 1.3333$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: cube-x2
    where: 'worked example "A cube root": x₂ ≈ 1.2639'
    inputs: {}
    formula: 2 / 3 * (4 / 3) + 2 / (3 * (4 / 3)**2)
    expected: '1.2639'
    shown: ['$x_2 \approx 1.2639$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: cube-x3
    where: 'worked example "A cube root": x₃ ≈ 1.25993'
    inputs: {}
    formula: 2 / 3 * (2 / 3 * (4 / 3) + 2 / (3 * (4 / 3)**2)) + 2 / (3 * (2 / 3 * (4 / 3) + 2 / (3 * (4 / 3)**2))**2)
    expected: '1.25993'
    shown: ['$x_3 \approx 1.25993$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: cube-true
    where: 'worked example "A cube root": the true value 1.259921'
    inputs: {}
    formula: 2**(1 / 3)
    expected: '1.259921'
    shown: ['the true value is $1.259921\ldots$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own
