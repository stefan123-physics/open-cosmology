  # ---- Problem 7

  # The answer against a numerical derivative: three straight lines with values u, v, w and slopes du, dv, dw at x = 0.
  - id: p7-three-factors
    kind: identity
    answer: p7-a
    where: 'Problem 7(a), answer box and formula "Product rule for three factors": against the numerical derivative at x = 0 of a product of three straight lines with the given values and slopes'
    formula: du*v*w + u*dv*w + u*v*dw
    equals: deriv('(u + du*x) * (v + dv*x) * (w + dw*x)', 'x', 0)
    samples:
      u: [1, 2.5, 0.7, -1.2]
      v: [2, 0.5, 1.9, 3]
      w: [3, 1.5, 0.6, -2]
      du: [0.5, -1, 2.2, 1]
      dv: [1.5, 2, -0.4, 0.3]
      dw: [-2, 0.8, 1.1, 2.5]
    tolerance: 1e-7
    shown: ['= u''vw + uv''w + uvw''"']
    source: {cite: mit, at: 'Part II, Problem 7(a) (our own solution)'}
    origin: page-own

  - id: p7-three-functions
    kind: identity
    where: 'Problem 7(a): the three-factor rule on three real functions (x² + 1, sin x, 3x + 2), against the numerical derivative'
    formula: deriv('(x**2 + 1) * sin(x) * (3*x + 2)', 'x', t)
    equals: 2*t*sin(t)*(3*t + 2) + (t**2 + 1)*cos(t)*(3*t + 2) + (t**2 + 1)*sin(t)*3
    samples: {t: [0.3, 1, 2.2, -1.5]}
    tolerance: 1e-6
    shown: ['In each of them one factor is differentiated and the other two are left alone.']
    source: {cite: mit, at: 'Part II, Problem 7(a) (our own check)'}
    origin: page-own

  - id: p7-cube
    kind: identity
    where: 'Problem 7(a), check: u = v = w = x gives 3x²'
    formula: deriv('x * x * x', 'x', t)
    equals: t**2 + t**2 + t**2
    samples: {t: [0.3, 1, 2.2, -1.5]}
    tolerance: 1e-6
    shown: ['$x^2 + x^2 + x^2 = 3x^2$']
    source: {cite: mit, at: 'Part II, Problem 7(a) (our own solution)'}
    origin: page-own

  - id: p7-four-functions
    kind: identity
    where: 'Problem 7(b), formula "Product rule for n factors": for n = 4 on four real functions (x² + 1, sin x, 3x + 2, exp x), against the numerical derivative'
    formula: deriv('(x**2 + 1) * sin(x) * (3*x + 2) * exp(x)', 'x', t)
    equals: 2*t*sin(t)*(3*t + 2)*exp(t) + (t**2 + 1)*cos(t)*(3*t + 2)*exp(t) + (t**2 + 1)*sin(t)*3*exp(t) + (t**2 + 1)*sin(t)*(3*t + 2)*exp(t)
    samples: {t: [0.3, 1, 2.2, -1.5]}
    tolerance: 1e-6
    shown: ['D(u_1 u_2 \cdots u_n) = u_1''\,u_2 \cdots u_n + u_1\,u_2'' \cdots u_n + \cdots + u_1\,u_2 \cdots u_n''']
    source: {cite: mit, at: 'Part II, Problem 7(b) (our own check)'}
    origin: page-own

  - id: p7-power-rule
    kind: identity
    where: 'Problem 7(b), check: all n functions equal to x give the power rule'
    formula: deriv('x**n', 'x', t)
    equals: n * t**(n - 1)
    samples:
      n: [2, 3, 5, 8]
      t: [0.7, 1.3, 2, 1.1]
    tolerance: 1e-6
    shown: ['$D\,x^n = n\,x^{n-1}$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own
