  # ---- Problem 3: mound y = 1000 − x², pole of 100 feet (MIT's)

  - id: p3-tangent-at-pole
    kind: identity
    where: 'Problem 3, formula "Height of the line of sight at the pole": the tangent line at x0, with a numerical slope, evaluated at x = 0'
    formula: (1000 - a**2) + deriv('1000 - x**2', 'x', a) * (0 - a)
    equals: 1000 + a**2
    samples: {a: [1, 5, 10, 20, 31.6]}
    tolerance: 1e-6
    shown: ['y = y_0 + 2x_0^2 = 1000 - x_0^2 + 2x_0^2 = 1000 + x_0^2']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-contact
    where: 'Problem 3, step "The first sight of the tower": the x at which the tangent line passes through the top of the pole'
    inputs: {}
    formula: solve('1000 + q**2 - 1100', 'q', 1, 30)
    expected: '10'
    tolerance: 1e-6
    shown: ['so $x_0^2 = 100$ and $x_0 = 10$']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-height
    answer: p3-y
    where: 'Problem 3, answer box: the height of the ant when the tangent line passes through (0, 1100)'
    inputs: {}
    formula: 1000 - solve('1000 + q**2 - 1100', 'q', 1, 30)**2
    expected: '900'
    tolerance: 1e-6
    shown: ['y_0 = 1000 - 10^2 = 900 \text{ feet}']
    source: {cite: mit, at: 'Part II, Problem 3, p. 2 (the mound and the pole are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p3-start-sight
    where: 'Problem 3: where the line of sight passes the pole when the ant starts (x0² = 1000)'
    inputs: {}
    formula: 1000 + sqrt(1000)**2
    expected: '2000'
    tolerance: 1e-9
    shown: ['at a height of 2000 feet']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-slope-at-contact
    where: 'Problem 3, check: the slope of the mound at x = 10'
    inputs: {}
    formula: deriv('1000 - x**2', 'x', 10)
    expected: '-20'
    tolerance: 1e-6
    shown: ['$-2 \times 10 = -20$']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-slope-of-sight
    where: 'Problem 3, check: the slope of the line from (10, 900) to (0, 1100)'
    inputs: {}
    formula: (1100 - 900) / (0 - 10)
    expected: '-20'
    tolerance: 1e-12
    shown: ['rises 200 feet over 10 feet backwards: slope $-20$ as well']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  # The second check: for m = −20 the quadratic x² + m x + 100 is the perfect square (x − 10)².
  - id: p3-double-root
    kind: identity
    where: 'Problem 3, second check: with m = −20 (m² = 400) the line through the top of the pole touches the mound at x = 10'
    formula: (1100 + (-20)*x) - (1000 - x**2)
    equals: (x - 10)**2
    samples: {x: [0, 3, 10, 17.5, 31]}
    tolerance: 1e-9
    shown: ['that is $x^2 + mx + 100 = 0$', 'which requires $m^2 = 400$']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-double-root-height
    where: 'Problem 3, second check: the point of contact'
    inputs: {slope: -20}
    formula: 1000 - (-slope/2)**2
    expected: '900'
    tolerance: 1e-12
    shown: ['$x = -m/2 = 10$, $y = 900$']
    source: {cite: mit, at: 'Part II, Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-ground
    where: 'Problem 3, the graph: where the mound meets the ground'
    inputs: {}
    formula: sqrt(1000)
    expected: '31.62'
    shown: ['{ x: 31.62, y: 0, label: "ant starts" }']
    source: {cite: mit, at: 'Part II, Problem 3 (our own graph)'}
    origin: page-own

  - id: p3-width
    where: 'Problem 3, caption of the graph: the width of the mound at the ground'
    inputs: {}
    formula: 2 * sqrt(1000)
    expected: '63'
    shown: ['about 63 feet wide at the ground']
    source: {cite: mit, at: 'Part II, Problem 3 (our own graph)'}
    origin: page-own

  # ---- Problem 5: volume (10 − t)²/5 litres (MIT's)

  - id: p5-volume-start
    where: 'Problem 5(a): the volume at t = 0'
    inputs: {t: 0}
    formula: (10 - t)**2 / 5
    expected: '20'
    tolerance: 1e-12
    shown: ['$V(0) = 10^2/5 = 20$ litres']
    source: {cite: mit, at: 'Part II, Problem 5, p. 3 (our own solution)'}
    origin: page-own

  - id: p5-volume-at-5
    where: 'Problem 5(a): the volume at t = 5'
    inputs: {t: 5}
    formula: (10 - t)**2 / 5
    expected: '5'
    tolerance: 1e-12
    shown: ['$V(5) = 5^2/5 = 5$ litres']
    source: {cite: mit, at: 'Part II, Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-average-rate
    answer: p5-a
    where: 'Problem 5(a), answer box: the average rate of outflow over the first 5 minutes, in litres per minute'
    inputs: {}
    formula: ((10 - 0)**2 / 5 - (10 - 5)**2 / 5) / (5 - 0)
    expected: '3'
    tolerance: 1e-12
    shown: ['Water leaves at an average of 3 litres per minute']
    source: {cite: mit, at: 'Part II, Problem 5(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-drained
    where: 'Problem 5(a), check: the water drained in 5 minutes'
    inputs: {}
    formula: (10 - 0)**2 / 5 - (10 - 5)**2 / 5
    expected: '15'
    tolerance: 1e-12
    shown: ['for 5 minutes is 15 litres']
    source: {cite: mit, at: 'Part II, Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5-expanded
    kind: identity
    where: 'Problem 5(b): the volume multiplied out'
    formula: (10 - t)**2 / 5
    equals: 20 - 4*t + t**2/5
    samples: {t: [0, 1, 2.5, 5, 10]}
    tolerance: 1e-12
    shown: ['$V(t) = 20 - 4t + t^2/5$']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-derivative
    kind: identity
    where: 'Problem 5(b), formula "Rate of change of the volume": against the numerical derivative'
    formula: deriv('(10 - x)**2 / 5', 'x', t)
    equals: -4 + 2*t/5
    samples: {t: [0, 1, 2.5, 5, 10]}
    tolerance: 1e-7
    shown: ['\frac{dV}{dt} = -4 + \frac{2t}{5}']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-rate-at-5
    answer: p5-b
    where: 'Problem 5(b), answer box: the rate of outflow at t = 5, in litres per minute, by numerical derivative'
    inputs: {}
    formula: -deriv('(10 - x)**2 / 5', 'x', 5)
    expected: '2'
    tolerance: 1e-7
    shown: ['The water flows out at 2 litres per minute']
    source: {cite: mit, at: 'Part II, Problem 5(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-difference-quotient
    kind: identity
    where: 'Problem 5(b), formula "Average outflow just after five minutes"'
    formula: ((10 - 5)**2 / 5 - (10 - (5 + dt))**2 / 5) / dt
    equals: 2 - dt/5
    samples: {dt: [1, 0.1, 0.01, -0.5, 3]}
    tolerance: 1e-9
    shown: ['= 2 - \frac{\Delta t}{5}"']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-one-minute
    where: 'Problem 5(b), check: the average outflow from t = 5 to t = 6'
    inputs: {dt: 1}
    formula: ((10 - 5)**2 / 5 - (10 - (5 + dt))**2 / 5) / dt
    expected: '1.8'
    tolerance: 1e-9
    shown: ['that is 1.8 litres per minute']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own numbers)'}
    origin: page-own

  - id: p5-tenth-minute
    where: 'Problem 5(b), check: the average outflow from t = 5 to t = 5.1'
    inputs: {dt: 0.1}
    formula: ((10 - 5)**2 / 5 - (10 - (5 + dt))**2 / 5) / dt
    expected: '1.98'
    tolerance: 1e-9
    shown: ['for $\Delta t = 0.1$ it is 1.98']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own numbers)'}
    origin: page-own

  - id: p5-rate-at-start
    where: 'Problem 5(b), check: the outflow at t = 0'
    inputs: {}
    formula: -deriv('(10 - x)**2 / 5', 'x', 0)
    expected: '4'
    tolerance: 1e-7
    shown: ['from 4 litres per minute at the start']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-rate-halfway
    where: 'Problem 5(b), check: the outflow at t = 2.5 equals the average of part (a)'
    inputs: {}
    formula: -deriv('(10 - x)**2 / 5', 'x', 2.5)
    expected: '3'
    tolerance: 1e-7
    shown: ['that is $4 - 1 = 3$ litres per minute']
    source: {cite: mit, at: 'Part II, Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5-empty
    where: 'Problem 5(b), check: at t = 10 both the volume and the outflow are zero (their difference is checked)'
    inputs: {t: 10}
    formula: (10 - t)**2 / 5 - (-4 + 2*t/5)
    expected: '0'
    tolerance: 1e-12
    shown: ['it stops at $t = 10$, when the cooler is empty']
