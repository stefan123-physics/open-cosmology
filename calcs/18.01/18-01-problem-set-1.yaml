# Calculations on content/year-1/18.01/18-01-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for Part II of this set, so every formula answer is checked here by an independent route:
# the definition of the even and odd parts, and a numerical derivative of a product of three straight lines.

page: content/year-1/18.01/18-01-problem-set-1.mdx
calcs:
  # ---- Problem 1

  - id: p1-even-part
    kind: identity
    answer: p1-even
    where: 'Problem 1(a), answer box and formula "Even part of the function": against half the sum of f(x) and f(−x), each computed from f itself'
    formula: (x**2 + 1)/(x**2 - 1)
    equals: ((x - 1)/(x + 1) + ((-x) - 1)/((-x) + 1)) / 2
    samples: {x: [1.5, 2, 3, 4, -2.5, 0.3, -0.7]}
    tolerance: 1e-12
    shown: ['= \frac{x^2 + 1}{x^2 - 1}"']
    source: {cite: mit, at: 'Part II, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-odd-part
    kind: identity
    answer: p1-odd
    where: 'Problem 1(b), answer box and formula "Odd part of the function": against half the difference of f(x) and f(−x)'
    formula: -2*x/(x**2 - 1)
    equals: ((x - 1)/(x + 1) - ((-x) - 1)/((-x) + 1)) / 2
    samples: {x: [1.5, 2, 3, 4, -2.5, 0.3, -0.7]}
    tolerance: 1e-12
    shown: ['= \frac{-2x}{x^2 - 1}"']
    source: {cite: mit, at: 'Part II, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-f-at-minus-x
    kind: identity
    where: 'Problem 1(a), formula "The function at −x": f(−x) = (x + 1)/(x − 1), the reciprocal of f(x)'
    formula: ((-x) - 1)/((-x) + 1)
    equals: 1 / ((x - 1)/(x + 1))
    samples: {x: [1.5, 2, 3, 4, -2.5, 0.3, -0.7]}
    tolerance: 1e-12
    shown: ['f(-x) = \frac{-x - 1}{-x + 1} = \frac{x + 1}{x - 1}']
    source: {cite: mit, at: 'Part II, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-parts-add-up
    kind: identity
    where: 'Problem 1(b), formula "The two parts together": p + q = f'
    formula: (x**2 + 1)/(x**2 - 1) + (-2*x)/(x**2 - 1)
    equals: (x - 1)/(x + 1)
    samples: {x: [1.5, 2, 3, 4, -2.5, 0.3, -0.7]}
    tolerance: 1e-12
    shown: ['= \frac{(x - 1)^2}{(x - 1)(x + 1)} = \frac{x - 1}{x + 1}"']
    source: {cite: mit, at: 'Part II, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-odd-other-form
    kind: identity
    where: 'Problem 1(b): the odd part written as 2x/(1 − x²)'
    formula: -2*x/(x**2 - 1)
    equals: 2*x/(1 - x**2)
    samples: {x: [1.5, 2, 3, 4, -2.5, 0.3, -0.7]}
    tolerance: 1e-12
    shown: ['written as $2x/(1 - x^2)$']
    source: {cite: mit, at: 'Part II, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-numerators
    kind: identity
    where: 'Problem 1(a) and (b): (x − 1)² + (x + 1)² = 2x² + 2 and (x − 1)² − (x + 1)² = −4x, checked together as their sum'
    formula: ((x - 1)**2 + (x + 1)**2) + ((x - 1)**2 - (x + 1)**2)
    equals: (2*x**2 + 2) + (-4*x)
    samples: {x: [1.5, 2, 3, 4, -2.5, 0.3, -0.7]}
    tolerance: 1e-12
    shown: ['$(x-1)^2 + (x+1)^2 = 2x^2 + 2$', '$(x-1)^2 - (x+1)^2 = -4x$']
    source: {cite: mit, at: 'Part II, Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-even-at-3
    where: 'Problem 1(b), check with numbers: the even part at x = 3; also the hint of a listed mistake in part (a)'
    inputs: {x: 3}
    formula: ((x - 1)/(x + 1) + ((-x) - 1)/((-x) + 1)) / 2
    expected: '1.25'
    tolerance: 1e-12
    shown: ['$p(3) = 10/8 = 1.25$', 'their average, is 1.25']
    source: {cite: mit, at: 'Part II, Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-odd-at-3
    where: 'Problem 1(b), check with numbers: the odd part at x = 3'
    inputs: {x: 3}
    formula: ((x - 1)/(x + 1) - ((-x) - 1)/((-x) + 1)) / 2
    expected: '-0.75'
    tolerance: 1e-12
    shown: ['$q(3) = -6/8 = -0.75$']
    source: {cite: mit, at: 'Part II, Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-f-at-3
    where: 'Problem 1(b), check with numbers: f(3)'
    inputs: {x: 3}
    formula: (x - 1)/(x + 1)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['Their sum is 0.5, which is $f(3) = 2/4$']
    source: {cite: mit, at: 'Part II, Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-f-at-minus-3
    where: 'Problem 1(b), check with numbers: f(−3) = p(3) − q(3)'
    inputs: {x: -3}
    formula: (x - 1)/(x + 1)
    expected: '2'
    tolerance: 1e-12
    shown: ['their difference is 2, which is $f(-3) = (-4)/(-2)$']
    source: {cite: mit, at: 'Part II, Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-wrong-reciprocal-at-3
    where: 'Problem 1(a), hint of the listed mistake (x² − 1)/(x² + 1): its value at x = 3'
    inputs: {x: 3}
    formula: (x**2 - 1)/(x**2 + 1)
    expected: '0.8'
    tolerance: 1e-12
    shown: ['Your answer gives 0.8 at x = 3']
    source: {cite: mit, at: 'Part II, Problem 1 (our own numbers)'}
    origin: page-own

  # ---- Problem 2, part (a): h0 = 25,000 km, altitude 20,000 km (both MIT's)

  - id: p2-a-start
    where: 'Problem 2(a), step "The position as a function of the measured distance": L0'
    inputs: {alt: 20000, h0: 25000}
    formula: sqrt(h0**2 - alt**2)
    expected: '15000'
    tolerance: 1e-9
    shown: ['this gives $L_0 = 15{,}000$ km']
    source: {cite: mit, at: 'Part II, Problem 2(a), p. 2 (the two lengths are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p2-a-triangle
    where: 'Problem 2(a): the 3, 4, 5 triangle enlarged 5000 times'
    inputs: {alt: 20000, h0: 25000}
    formula: sqrt(h0**2 - alt**2) / 3
    expected: '5000'
    tolerance: 1e-9
    shown: ['enlarged 5000 times']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-position-plus-1
    where: 'Problem 2(a), step "The six difference quotients": L for h = 25,001'
    inputs: {alt: 20000, h0: 25000, dh: 1}
    formula: sqrt((h0 + dh)**2 - alt**2)
    expected: '15001.66661'
    shown: ['= 15{,}001.66661$']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-change-plus-1
    where: 'Problem 2(a), step "The six difference quotients": ΔL for Δh = 1'
    inputs: {alt: 20000, h0: 25000, dh: 1}
    formula: sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)
    expected: '1.66661'
    shown: ['so $\Delta L = 1.66661$ km']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-ratio-plus-1
    answer: p2-a-ratio
    where: 'Problem 2(a), answer box: ΔL/Δh for Δh = +1 km, to four figures'
    inputs: {alt: 20000, h0: 25000, dh: 1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.667'
    shown: ['To four significant figures all six are 1.667.']
    source: {cite: mit, at: 'Part II, Problem 2(a), p. 2 (the lengths are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p2-a-table-plus-1
    where: 'Problem 2(a), table: Δh = +1'
    inputs: {alt: 20000, h0: 25000, dh: 1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.66661'
    shown: ['| $+1$ | 1.66661 |']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-table-minus-1
    where: 'Problem 2(a), table: Δh = −1'
    inputs: {alt: 20000, h0: 25000, dh: -1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.66673'
    shown: ['| $-1$ | 1.66673 |']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-table-plus-01
    where: 'Problem 2(a), table: Δh = +0.1'
    inputs: {alt: 20000, h0: 25000, dh: 0.1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.666661'
    shown: ['| $+0.1$ | 1.666661 |']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-table-minus-01
    where: 'Problem 2(a), table: Δh = −0.1'
    inputs: {alt: 20000, h0: 25000, dh: -0.1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.666673'
    shown: ['| $-0.1$ | 1.666673 |']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-table-plus-001
    where: 'Problem 2(a), table: Δh = +0.01'
    inputs: {alt: 20000, h0: 25000, dh: 0.01}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.6666661'
    shown: ['| $+0.01$ | 1.6666661 |']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-table-minus-001
    where: 'Problem 2(a), table: Δh = −0.01'
    inputs: {alt: 20000, h0: 25000, dh: -0.01}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.6666673'
    shown: ['| $-0.01$ | 1.6666673 |']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  # The answer C = 2: the largest of the six ratios (the one for Δh = −1) is 1.66673; 2 is the smallest whole number above it.
  - id: p2-a-bound
    answer: p2-a-c
    where: 'Problem 2(a), answer box C: the largest of the six ratios, which the smallest whole number 2 covers (tolerance: the ratio lies within 0.5 below 2)'
    inputs: {alt: 20000, h0: 25000, dh: -1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '2'
    tolerance: 0.5
    shown: ['The smallest whole number above them is 2']
    source: {cite: mit, at: 'Part II, Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-a-under
    where: 'Problem 2(a), step "The bound": the largest ratio is a little under 1.67'
    inputs: {alt: 20000, h0: 25000, dh: -1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '1.67'
    shown: ['All six ratios are a little under 1.67']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-ten-metres
    where: 'Problem 2(a): an error of 10 metres in h, doubled, in metres'
    inputs: {bound: 2, err: 10}
    formula: bound * err
    expected: '20'
    tolerance: 1e-12
    shown: ['off by at most 20 metres']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own numbers)'}
    origin: page-own

  - id: p2-a-derivative
    where: 'Problem 2(a), check: the numerical derivative of L(h) at h = 25,000'
    inputs: {}
    formula: deriv('sqrt(x**2 - 20000**2)', 'x', 25000)
    expected: '1.6667'
    shown: ['close in on $1.6667 = 5/3$']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-derivative-closed
    kind: identity
    where: 'Problem 2(a), check: dL/dh = h/L, against the numerical derivative'
    formula: deriv('sqrt(x**2 - 20000**2)', 'x', hh)
    equals: hh / sqrt(hh**2 - 20000**2)
    samples: {hh: [20001, 20500, 25000, 40000]}
    tolerance: 1e-6
    shown: ['$dL/dh = h/\sqrt{h^2 - 20{,}000^2} = h/L$']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-five-thirds
    where: 'Problem 2(a), check: 25,000/15,000 less 5/3'
    inputs: {alt: 20000, h0: 25000}
    formula: h0 / sqrt(h0**2 - alt**2) - 5/3
    expected: '0'
    tolerance: 1e-12
    shown: ['which is $25{,}000/15{,}000 = 5/3$ here']
    source: {cite: mit, at: 'Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  # ---- Problem 2, part (b): h0 = 20,001 km (MIT's)

  - id: p2-b-square
    where: 'Problem 2(b), step "The starting value": 20,001² − 20,000²'
    inputs: {alt: 20000, h0: 20001}
    formula: h0**2 - alt**2
    expected: '40001'
    tolerance: 1e-9
    shown: ['L_0 = \sqrt{20{,}001^2 - 20{,}000^2} = \sqrt{40{,}001}']
    source: {cite: mit, at: 'Part II, Problem 2(b), p. 2 (the lengths are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p2-b-start
    where: 'Problem 2(b), step "The starting value": L0; also ΔL for Δh = −1'
    inputs: {alt: 20000, h0: 20001}
    formula: sqrt(h0**2 - alt**2)
    expected: '200.0025'
    shown: ['= \sqrt{40{,}001} = 200.0025$ km', '$\Delta L = -200.0025$ km']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-square-plus-1
    where: 'Problem 2(b), step "The six difference quotients": 20,002² − 20,000²'
    inputs: {alt: 20000, h0: 20001, dh: 1}
    formula: (h0 + dh)**2 - alt**2
    expected: '80004'
    tolerance: 1e-9
    shown: ['= \sqrt{80{,}004}']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-position-plus-1
    where: 'Problem 2(b), step "The six difference quotients": L for h = 20,002'
    inputs: {alt: 20000, h0: 20001, dh: 1}
    formula: sqrt((h0 + dh)**2 - alt**2)
    expected: '282.8498'
    shown: ['= 282.8498$']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-change-plus-1
    where: 'Problem 2(b), step "The six difference quotients": ΔL for Δh = +1'
    inputs: {alt: 20000, h0: 20001, dh: 1}
    formula: sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)
    expected: '82.8473'
    shown: ['so $\Delta L = 82.8473$ km']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-position-minus-1
    where: 'Problem 2(b): for Δh = −1 the receiver is directly below the satellite, L = 0'
    inputs: {alt: 20000, h0: 20001, dh: -1}
    formula: sqrt((h0 + dh)**2 - alt**2)
    expected: '0'
    tolerance: 1e-12
    shown: ['$L = 0$ and']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-ratio-plus-1
    answer: p2-b-ratio-plus
    where: 'Problem 2(b), answer box and table: ΔL/Δh for Δh = +1 km'
    inputs: {alt: 20000, h0: 20001, dh: 1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '82.85'
    shown: ['| $+1$ | 82.85 |']
    source: {cite: mit, at: 'Part II, Problem 2(b), p. 2 (the lengths are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p2-b-ratio-minus-1
    answer: p2-b-ratio-minus
    where: 'Problem 2(b), answer box and table: ΔL/Δh for Δh = −1 km'
    inputs: {alt: 20000, h0: 20001, dh: -1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '200.0'
    shown: ['| $-1$ | 200.00 |']
    source: {cite: mit, at: 'Part II, Problem 2(b), p. 2 (the lengths are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p2-b-table-plus-01
    where: 'Problem 2(b), table: Δh = +0.1'
    inputs: {alt: 20000, h0: 20001, dh: 0.1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '97.62'
    shown: ['| $+0.1$ | 97.62 |']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-table-minus-01
    where: 'Problem 2(b), table: Δh = −0.1'
    inputs: {alt: 20000, h0: 20001, dh: -0.1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '102.64'
    shown: ['| $-0.1$ | 102.64 |']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-table-plus-001
    where: 'Problem 2(b), table: Δh = +0.01 (99.7550 is printed as 99.76)'
    inputs: {alt: 20000, h0: 20001, dh: 0.01}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '99.76'
    tolerance: 0.006
    shown: ['| $+0.01$ | 99.76 |']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-table-minus-001
    where: 'Problem 2(b), table: Δh = −0.01 (100.2550 is printed as 100.25)'
    inputs: {alt: 20000, h0: 20001, dh: -0.01}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '100.25'
    tolerance: 0.006
    shown: ['| $-0.01$ | 100.25 |']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-largest
    where: 'Problem 2(b), step "The bound": the largest ratio to four more digits'
    inputs: {alt: 20000, h0: 20001, dh: -1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '200.0025'
    shown: ['it is 200.0025, a hair above 200']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-miss
    where: 'Problem 2(b), step "The bound": by how much C = 200 misses the case Δh = −1, in metres'
    inputs: {alt: 20000, h0: 20001}
    formula: (sqrt(h0**2 - alt**2) - 200) * 1000
    expected: '2.5'
    shown: ['misses the sixth by 2.5 metres']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  # C = 300 is our choice of "simplest round number" above 200.0025; the entry checks that it covers the largest ratio.
  - id: p2-b-bound
    where: 'Problem 2(b), formula "Bound near 20,001 km": the largest ratio lies below 300 (within 100)'
    inputs: {alt: 20000, h0: 20001, dh: -1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '300'
    tolerance: 100
    shown: ['|\Delta L| \le 300\,|\Delta h|']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-derivative
    where: 'Problem 2(b), check: h0/L0, as the numerical derivative of L(h) at h = 20,001'
    inputs: {}
    formula: deriv('sqrt(x**2 - 20000**2)', 'x', 20001)
    expected: '100.0'
    shown: ['$h_0/L_0 = 20{,}001/200.0025 = 100.0$']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-sixty
    where: 'Problem 2(b), check: the sensitivity near 20,001 km over that near 25,000 km'
    inputs: {alt: 20000}
    formula: (20001 / sqrt(20001**2 - alt**2)) / (25000 / sqrt(25000**2 - alt**2))
    expected: '60'
    tolerance: 0.5
    shown: ['That is 60 times the $5/3$ of part (a)']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-about-100
    where: 'Problem 2(b), step "More or less accurate?": the ratio for the smallest step is about 100'
    inputs: {alt: 20000, h0: 20001, dh: 0.01}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '100'
    tolerance: 1
    shown: ['it is multiplied by about 100, and by up to 200 within this range']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-ten-metres
    where: 'Problem 2(b): an error of 10 metres (0.01 km) in h, as an error of the position in km'
    inputs: {alt: 20000, h0: 20001, dh: 0.01}
    formula: sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)
    expected: '1'
    tolerance: 0.05
    shown: ['now moves the position by about a kilometre']
    source: {cite: mit, at: 'Part II, Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-b-smallest
    where: 'Problem 2(b), check: the smallest of the six ratios, rounded'
    inputs: {alt: 20000, h0: 20001, dh: 1}
    formula: (sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh
    expected: '83'
    shown: ['from 83 to 200']
