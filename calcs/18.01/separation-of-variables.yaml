# Calculations on content/year-1/18.01/separation-of-variables.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 16, notes and transcript, with the page's own numbers.
# Solutions are checked by putting them back into their differential equations at sample points.

page: content/year-1/18.01/separation-of-variables.mdx
calcs:
  - id: gaussian-solves
    kind: identity
    where: 'formula "Separate and integrate": y = a e^(−x²/2) solves dy/dx = −xy'
    formula: deriv('A * exp(-x**2 / 2)', 'x', y, 1)
    equals: -y * A * exp(-y**2 / 2)
    samples: {y: [0.3, 1.2, -2.0], A: [1.0, -3.0, 2.5]}
    tolerance: 1e-6
    shown: ['y = a\,e^{-x^2/2}']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: start-value
    where: 'section "Remarks" and quiz 2: y(0) = 3 gives a = 3'
    inputs: {}
    formula: 3 / exp(0)
    expected: '3'
    tolerance: '1e-12'
    shown: ['so $y = 3e^{-x^2/2}$ (pp. 5–6)']
    source: {cite: reading2, at: 'pp. 5–6'}
    origin: mit

  - id: decay-rate
    where: 'worked example "Half-lives": λ = ln 2/8.0 ≈ 0.0866 per day'
    inputs: {T: 8.0 day}
    formula: log(2) / T
    expected: 0.0866 1/day
    shown: ['$\lambda = \ln 2/8.0 \approx 0.0866$ per day']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: decay-24-days
    where: 'same worked example and quiz 4: e^(−3 ln 2) = 1/8'
    inputs: {T: 8.0 day, t: 24 day}
    formula: exp(-log(2) / T * t)
    expected: '0.125'
    shown: ['= (\tfrac12)^3 = \tfrac18$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: decay-solves
    kind: identity
    where: 'same worked example: N = N0 e^(−λt) solves dN/dt = −λN'
    formula: deriv('N0 * exp(-k * x)', 'x', y, 1)
    equals: -k * N0 * exp(-k * y)
    samples: {y: [0.0, 5.0, 20.0], N0: [1.0, 100.0, 7.0], k: [0.0866, 0.5, 0.01]}
    tolerance: 1e-6
    shown: ['$N = N_0 e^{-\lambda t}$, where']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: parabola-solves
    kind: identity
    where: 'formula "Example 3": y = ax² solves dy/dx = 2y/x'
    formula: deriv('A * x**2', 'x', y, 1)
    equals: 2 * (A * y**2) / y
    samples: {y: [0.5, 2.0, -1.5], A: [1.0, -2.0, 100.0]}
    tolerance: 1e-6
    shown: ['\Rightarrow\; y = a x^2']
    source: {cite: reading2, at: 'pp. 7–8'}
    origin: mit

  - id: ellipse-perpendicular
    kind: identity
    where: 'formula "Example 4": the ellipse slope −x/(2y) times the parabola slope 2y/x is −1'
    formula: (-x0 / (2 * y0)) * (2 * y0 / x0)
    equals: -1 + 0 * x0
    samples: {x0: [0.5, 1.3, -2.0], y0: [0.4, -1.1, 3.0]}
    tolerance: 1e-12
    shown: ['\frac{dy}{dx} = -\frac{x}{2y}']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: ellipse-semi-axes
    where: 'section "Curves at right angles": x²/2 + y² = a² has semi-axes √2 a and a, ratio √2 (the notes say 2)'
    inputs: {}
    formula: sqrt(2 * 1.0**2) / 1.0
    expected: '1.414'
    shown: ['it is $\sqrt2$, notes, p. 4']
    source: {cite: reading2, at: 'p. 9'}
    origin: slip
    note: 'The notes give the ratio of the axes as 2; for x²/4 + y²/2 = c it is √2, as the transcript''s √2·a and a imply.'

  - id: blow-up-solves
    kind: identity
    where: 'worked example "A solution that runs out": y = 1/(1 − x) solves dy/dx = y²'
    formula: deriv('1 / (1 - x)', 'x', y, 1)
    equals: (1 / (1 - y))**2
    samples: {y: [0.0, 0.5, -2.0, 0.9]}
    tolerance: 1e-5
    shown: ['$dy/dx = \dfrac{1}{(1 - x)^2} = y^2$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: exponential-expansion
    kind: identity
    where: 'cosmology note: a = a0 e^(Ht) solves da/dt = Ha, and doubles in ln 2/H'
    formula: a0 * exp(H * (y + log(2) / H))
    equals: 2 * a0 * exp(H * y)
    samples: {y: [0.0, 1.5], a0: [1.0, 0.3], H: [0.7, 2.0]}
    tolerance: 1e-9
    shown: ['Distances double every $\ln 2/H$.']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own
