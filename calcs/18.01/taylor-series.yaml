# Calculations on content/year-1/18.01/taylor-series.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 38 transcript, the notes numbered Lecture 37, and the Lecture 36 notes on blocks, with the page's own numbers.

page: content/year-1/18.01/taylor-series.mdx
calcs:
  - id: recurrence
    kind: identity
    where: 'formula "Centre of mass of the stack": (N C + C + 1)/(N + 1) = C + 1/(N + 1)'
    formula: (N * C + (C + 1)) / (N + 1)
    equals: C + 1 / (N + 1)
    samples: {N: [1.0, 7.0], C: [1.0, 2.6]}
    tolerance: 1e-12
    shown: ['= C_N + \frac{1}{N + 1}']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: moon-stack
    where: 'section "How far can a stack of blocks lean?": 3 cm × e^24 ≈ 8 × 10^8 m'
    inputs: {h: 0.03 m}
    formula: h * exp(24)
    expected: 8e8 m
    tolerance: '2%'
    shown: ['about $8 \times 10^8$ m tall']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: moon-distance
    kind: fact
    where: 'same: twice the distance to the Moon (about 3.84 × 10^8 m)'
    value: '2'
    shown: ['twice the distance to the Moon']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: example-a
    where: 'worked example (a): six terms give 2.7167'
    inputs: {}
    formula: 1 + 1 + 1 / 2 + 1 / 6 + 1 / 24 + 1 / 120
    expected: '2.7167'
    shown: ['\frac{1}{120} \approx 2.7167$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: e-value
    where: 'same: e ≈ 2.71828'
    inputs: {}
    formula: exp(1)
    expected: '2.71828'
    shown: ['against $e \approx 2.71828$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): three terms give 0.479427'
    inputs: {}
    formula: 0.5 - 0.125 / 6 + 0.03125 / 120
    expected: '0.479427'
    shown: ['= 0.479427$, against']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: sin-half
    where: 'same: true value 0.479426'
    inputs: {}
    formula: sin(0.5)
    expected: '0.479426'
    shown: ['against the true 0.479426']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): four terms give 0.4010'
    inputs: {}
    formula: 0.5 - 0.25 / 2 + 0.125 / 3 - 0.0625 / 4
    expected: '0.4010'
    shown: ['\frac{0.0625}{4} \approx 0.4010$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ln-1-5
    where: 'same: ln 1.5 ≈ 0.4055'
    inputs: {}
    formula: log(1.5)
    expected: '0.4055'
    shown: ['against the true 0.4055']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: harmonic-30
    where: 'worked example (d): H_30 ≈ 3.995 (Euler–Maclaurin)'
    inputs: {}
    formula: log(30) + 0.5772156649 + 1 / 60 - 1 / (12 * 900)
    expected: '3.995'
    shown: ['about 3.995 for $N = 30$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: harmonic-31
    where: 'same: H_31 ≈ 4.027'
    inputs: {}
    formula: log(31) + 0.5772156649 + 1 / 62 - 1 / (12 * 961)
    expected: '4.027'
    shown: ['4.027 for $N = 31$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ln-31
    where: 'same: ln 31 ≈ 3.43'
    inputs: {}
    formula: log(31)
    expected: '3.43'
    shown: ['$\ln 31 \approx 3.43$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: sharper-stack
    where: 'section on blocks: with S_N ≈ ln N + 0.577 = 24, N ≈ 1.5 × 10^10 and the stack is ≈ 4.5 × 10^8 m'
    inputs: {h: 0.03 m}
    formula: h * exp(24 - 0.5772156649)
    expected: 4.5e8 m
    tolerance: '2%'
    shown: ['or $4.5 \times 10^8$ m, would do']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: sharper-n
    where: 'same: N ≈ 1.5 × 10^10'
    inputs: {}
    formula: exp(24 - 0.5772156649)
    expected: '1.5e10'
    tolerance: '2%'
    shown: ['about $1.5 \times 10^{10}$ blocks']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own
