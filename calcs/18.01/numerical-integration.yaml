# Calculations on content/year-1/18.01/numerical-integration.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 24, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/numerical-integration.mdx
calcs:
  - id: ring-probability
    kind: identity
    where: 'formula "Probability of a ring": ∫ e^(−r²) 2πr dr / π = e^(−r₁²) − e^(−r₂²)'
    formula: integrate('exp(-x**2) * 2 * pi * x', 'x', r1, r2) / pi
    equals: exp(-r1**2) - exp(-r2**2)
    samples: {r1: [0.0, 0.5], r2: [1.0, 2.0]}
    tolerance: 1e-6
    shown: ['}{\pi} = e^{-r_1^2} - e^{-r_2^2}']
    source: {cite: reading2, at: 'pp. 5–6'}
    origin: mit

  - id: brother
    where: 'formula "The little brother''s risk": (1/6)((1/2)⁴ − (1/2)⁹) ≈ 1/100'
    inputs: {}
    formula: (0.5**4 - 0.5**9) / 6
    expected: '0.01'
    tolerance: '0.001'
    shown: ['\approx \frac{1}{100}']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: notes-trapezoid
    where: 'section "Simpson''s rule": the notes'' trapezoidal value 0.775 for ∫₀¹ dx/(1 + x²), n = 2'
    inputs: {}
    formula: 0.5 * (1 / 2 + 0.8 + 0.5 / 2)
    expected: '0.775'
    shown: ['the trapezoidal rule gives 0.775']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: notes-simpson
    where: 'same: Simpson 0.7833'
    inputs: {}
    formula: 0.5 / 3 * (1 + 4 * 0.8 + 0.5)
    expected: '0.7833'
    shown: ['Simpson''s rule 0.7833']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: notes-exact
    where: 'same: π/4 ≈ 0.785'
    inputs: {}
    formula: integrate('1 / (1 + x**2)', 'x', 0, 1)
    expected: '0.785'
    shown: ['= \frac{\pi}{4} \approx 0.785$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: simpson-weights
    where: 'section "Simpson''s rule": for f = 1 the weights add to 3n, so the rule gives nΔx (n = 6)'
    inputs: {}
    formula: 1 + 4 + 2 + 4 + 2 + 4 + 1
    expected: '18'
    tolerance: '1e-9'
    shown: ['the weights add up to $3n$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: gauss-trap
    where: 'worked example "Simpson against the trapezoids": trapezoidal ≈ 0.74298'
    inputs: {}
    formula: 0.25 * (0.5 + exp(-0.0625) + exp(-0.25) + exp(-0.5625) + exp(-1) / 2)
    expected: '0.74298'
    shown: ['0.18394) \approx 0.74298$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: gauss-simpson
    where: 'same: Simpson ≈ 0.74686'
    inputs: {}
    formula: 0.25 / 3 * (1 + 4 * exp(-0.0625) + 2 * exp(-0.25) + 4 * exp(-0.5625) + exp(-1))
    expected: '0.74686'
    shown: ['0.36788) \approx 0.74686$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: gauss-exact
    where: 'same: the true value 0.746824'
    inputs: {}
    formula: integrate('exp(-x**2)', 'x', 0, 1)
    expected: '0.746824'
    shown: ['compare with the true value 0.746824']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ln2-simpson
    where: 'quiz 4: Simpson for ∫₁² dx/x with n = 2 ≈ 0.6944'
    inputs: {}
    formula: 0.5 / 3 * (1 + 4 * (2 / 3) + 0.5)
    expected: '0.6944'
    shown: ['\approx 0.6944$, against']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: comoving-distance
    where: 'cosmology note: Simpson n = 2 for c/H0 ∫₀¹ dz/√(0.3(1+z)³ + 0.7) ≈ 3300 Mpc'
    inputs: {c: 299792.458 km/s, H0: 70 km/s/Mpc}
    formula: c / H0 * (0.5 / 3) * (1 + 4 / sqrt(0.3 * 1.5**3 + 0.7) + 1 / sqrt(0.3 * 8 + 0.7))
    expected: 3300 Mpc
    tolerance: '1%'
    shown: ['gives about 3300 Mpc to $z = 1$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: comoving-exact
    where: 'same: within 0.1% of the exact value'
    inputs: {}
    formula: (0.5 / 3) * (1 + 4 / sqrt(0.3 * 1.5**3 + 0.7) + 1 / sqrt(0.3 * 8 + 0.7)) / integrate('1 / sqrt(0.3 * (1 + x)**3 + 0.7)', 'x', 0, 1) - 1
    expected: '-0.0009'
    tolerance: '0.0002'
    shown: ['within 0.1% of the exact value']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
