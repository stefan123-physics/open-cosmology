# Calculations on content/year-1/18.01/infinite-series.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 37 transcript and the notes numbered Lecture 36, with the page's own numbers.

page: content/year-1/18.01/infinite-series.mdx
calcs:
  - id: root-x
    where: 'section "Improper integrals of the second kind": ∫₀¹ x^(−1/2) dx = 2'
    inputs: {}
    formula: integrate('s**(-0.5)', 's', 1e-12, 1)
    expected: '2'
    tolerance: '1e-5'
    shown: ['= \Big[2x^{1/2}\Big]_0^1 = 2$ converges']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: mit

  - id: geometric
    kind: identity
    where: 'formula "Geometric series": partial sums tend to 1/(1 − a)'
    formula: (1 - a**200) / (1 - a)
    equals: 1 / (1 - a)
    samples: {a: [0.5, -0.6, 0.9]}
    tolerance: 1e-6
    shown: ['= \frac{1}{1 - a}, \qquad |a| < 1']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: basel
    where: 'section "Convergence of a series": Σ 1/n² = π²/6'
    inputs: {}
    formula: pi**2 / 6
    expected: '1.6449'
    shown: ['Euler found it to be $\frac{\pi^2}{6}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: cube-integral
    where: 'same: ∫₁^∞ dx/x³ = 1/2'
    inputs: {}
    formula: 1 / (3 - 1)
    expected: '0.5'
    shown: ['$\int_1^\infty\frac{dx}{x^3} = \frac{1}{2}$']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: harmonic-bounds
    where: 'formula "The harmonic series": S_1000 ≈ ln 1000 + γ + 1/2000 (Euler–Maclaurin) ≈ 7.49, between ln N and ln N + 1'
    inputs: {}
    formula: log(1000) + 0.5772156649 + 1 / 2000 - 1 / (12 * 1000**2)
    expected: '7.49'
    shown: ['(Adding it up gives about 7.49.)']
    source: {cite: reading2, at: 'pp. 10–11'}
    origin: page-own

  - id: example-a
    where: 'worked example (a) and quiz 1: Σ (2/3)^k = 3'
    inputs: {}
    formula: 1 / (1 - 2 / 3)
    expected: '3'
    shown: ['$\frac{1}{1 - 2/3} = 3$.']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): Σ 1/(n² + n) = 1'
    inputs: {}
    formula: 1 - 1 / (100001)
    expected: '1'
    tolerance: '1e-4'
    shown: ['the sum is exactly 1']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: example-d
    where: 'worked example (d): ln 1000 ≈ 6.91'
    inputs: {}
    formula: log(1000)
    expected: '6.91'
    shown: ['$\ln 1000 \approx 6.91$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: zeta3
    where: 'cosmology note: Σ 1/n³ = ζ(3) ≈ 1.202 (via ζ(3) = ½∫₀^∞ x²/(eˣ − 1) dx)'
    inputs: {}
    formula: 0.5 * integrate('t**2 / (exp(t) - 1)', 't', 1e-9, 60)
    expected: '1.202'
    shown: ['\frac{1}{27} + \cdots \approx 1.202$']
    source: {cite: reading2, at: 'p. 9 (the sum; its value computed here)'}
    origin: page-own
