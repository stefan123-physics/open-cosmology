  - id: p1-integral-closed-form
    where: 'Problem 1(b), formula "The integral over 50 days": the closed form'
    inputs: {}
    formula: 6500*(exp(1/2) - 1)
    expected: '4216.69'
    shown: ['= 6500\left(e^{1/2} - 1\right) = 4216.69']
    source: {cite: mit, at: 'Part II, Problem 1(b) (our own solution)'}
