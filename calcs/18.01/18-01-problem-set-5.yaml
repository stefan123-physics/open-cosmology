    formula: (8/6 - 32/40) / (8/15)
    expected: '1'
    tolerance: 1e-12
    shown: ['= \frac{8}{6} - \frac{32}{40} = \frac{4}{3} - \frac{4}{5}']
    source: {cite: mit, at: 'Part II, Problem 3(b) (our own solution)'}
    origin: page-own

