  # ---- Problem 3(b)

  # The cross-section at height z, integrated over x: for 0 < x < z²/2 the strip runs from y = z²/2 − x to y = z − x,
  # and for z²/2 < x < z from y = 0 to y = z − x.
  - id: p3-area
    kind: identity
    answer: p3-area
    where: 'Problem 3(b), answer box and formula "Area of a horizontal cross-section": against the strip integrated over x'
    formula: z**2/2 - z**4/8
    equals: integrate('(z - q) - (z**2/2 - q)', 'q', 0, z**2/2) + integrate('z - q', 'q', z**2/2, z)
    samples: {z: [0.3, 0.9, 1.4142, 1.8, 2]}
    tolerance: 1e-9
    shown: ['tex="A(z) = \frac{z^2}{2} - \frac{z^4}{8}"']
    source: {cite: mit, at: 'Part II, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-volume
    answer: p3-volume
    where: 'Problem 3(b), answer box: the volume, by numerical integration of the cross-section area'
    inputs: {}
    formula: integrate('q**2/2 - q**4/8', 'q', 0, 2)
    expected: '0.5333'
    shown: ['= \frac{8}{15} \approx 0.5333']
    source: {cite: mit, at: 'Part II, Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-volume-fractions
    where: 'Problem 3(b), formula "The volume": 8/6 − 32/40 = 8/15'
