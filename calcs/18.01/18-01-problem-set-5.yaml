    inputs: {}
    formula: integrate('65*exp(q/100)', 'q', 3, 4)
    expected: '67.32'
    shown: ['value="67.32"']
    source: {cite: mit, at: 'Part II, Problem 1(a) (our own check)'}
    origin: page-own

  - id: p1-day3-closed-form
    where: 'Problem 1(a), formula "Average temperature of day 3": the closed form'
    inputs: {}
    formula: 6500*(exp(0.04) - exp(0.03))
    expected: '67.32'
    shown: ['6500\left(e^{0.04} - e^{0.03}\right) = 67.32']
    source: {cite: mit, at: 'Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-integral
    answer: p1-b1
    where: 'Problem 1(b), answer box: the integral of the temperature over 50 days, by numerical integration'
    inputs: {}
    formula: integrate('65*exp(q/100)', 'q', 0, 50)
    expected: '4216.69'
    shown: ['value="4216.69"']
