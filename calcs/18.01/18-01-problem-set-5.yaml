# Calculations on content/year-1/18.01/18-01-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for Part II of this set, so every answer is checked here by an independent route:
# a numerical integral, a numerical derivative, a numerical root, or an explicit sum.

page: content/year-1/18.01/18-01-problem-set-5.mdx
calcs:
  # ---- Problem 1

  - id: p1-solution
    kind: identity
    answer: p1-a
    where: 'Problem 1(a), answer box and formula "The temperature": the numerical derivative of 65 e^(t/100) equals y/100'
    formula: 65*exp(t/100)
    equals: 100*deriv('65*exp(q/100)', 'q', t)
    samples: {t: [0, 3, 17, 33, 50]}
    tolerance: 1e-6
    shown: ['tex="y(t) = 65\,e^{t/100}"']
    source: {cite: mit, at: 'Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-start
    where: 'Problem 1(a): the solution starts at 65'
    inputs: {t: 0}
    formula: 65*exp(t/100)
    expected: '65'
    tolerance: 1e-12
    shown: ['and $y(0) = 65$. The average']
    source: {cite: mit, at: 'Part II, Problem 1(a), p. 1'}
    origin: mit

  - id: p1-y3
    where: 'Problem 1(a), step "The graph for days 3 and 4": the temperature at t = 3'
    inputs: {t: 3}
    formula: 65*exp(t/100)
    expected: '67.0'
    shown: ['$y(3) = 67.0$']
    source: {cite: mit, at: 'Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-y4
    where: 'Problem 1(a), step "The graph for days 3 and 4": the temperature at t = 4'
    inputs: {t: 4}
    formula: 65*exp(t/100)
    expected: '67.7'
    shown: ['$y(4) = 67.7$']
    source: {cite: mit, at: 'Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-y5
    where: 'Problem 1(a), step "The graph for days 3 and 4": the temperature at t = 5'
    inputs: {t: 5}
    formula: 65*exp(t/100)
    expected: '68.3'
