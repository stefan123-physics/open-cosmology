    expected: '1.2533'
    shown: ['$x = \pm\sqrt{\pi/2} = \pm 1.2533$']
    source: {cite: mit, at: 'Part II, Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-second-critical
