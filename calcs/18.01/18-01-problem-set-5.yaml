    formula: x - x**5/10 + x**9/216 - x**13/9360 + x**17/685440 - x**21/76204800 + x**25/11975040000 - x**29/2528170444800 + x**33/690452066304000 - x**37/236887827111936000 + x**41/99748982335242240000
