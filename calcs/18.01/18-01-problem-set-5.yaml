  # ---- Problem 1(c)

  - id: p1c-sum-explicit
    kind: identity
    answer: p1c-sum
    where: 'Problem 1(c), answer box and formula "The lower sum in closed form": against the four rectangles added one by one (n = 4)'
    formula: 3250*(exp(1/2) - 1)/(n*(exp(1/(2*n)) - 1))
    equals: (50/n)*(65*exp(0/100) + 65*exp(12.5/100) + 65*exp(25/100) + 65*exp(37.5/100))
    samples: {n: [4]}
    tolerance: 1e-9
    shown: ['L_n = \frac{3250}{n}\cdot\frac{e^{1/2} - 1}{e^{1/(2n)} - 1}']
    source: {cite: mit, at: 'Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  # For a rising function the upper sum minus the lower sum telescopes to Δt·(y(50) − y(0)); the upper sum is the
  # lower sum times e^(1/(2n)).
  - id: p1c-sum-telescope
    kind: identity
    where: 'Problem 1(c): upper sum minus lower sum equals (50/n)(y(50) − y(0)), for several n'
    formula: 3250*(exp(1/2) - 1)/(n*(exp(1/(2*n)) - 1)) * (exp(1/(2*n)) - 1)
    equals: (50/n)*(65*exp(50/100) - 65)
    samples: {n: [4, 7, 10, 25, 40]}
    tolerance: 1e-9
    shown: ['L_n = \frac{50}{n}\cdot 65\left(1 + r + r^2 + \cdots + r^{n-1}\right)']
    source: {cite: mit, at: 'Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-half-limit
    kind: limit
    where: 'Problem 1(c), step "The limit": n (e^(1/(2n)) − 1) → 1/2'
    formula: n*(exp(1/(2*n)) - 1)
    limit: 0.5
    vary: {n: [10, 100, 1000, 10000, 100000]}
    tolerance: 1e-5
    shown: ['goes to $\tfrac12$. (This limit']
    source: {cite: reading6, at: 'p. 2 (the linear approximation; the limit is our own step)'}
    origin: page-own

  - id: p1c-limit
    kind: limit
    where: 'Problem 1(c), formula "The limit of the lower sums": L_n → 6500 (e^(1/2) − 1)'
    formula: 3250*(exp(1/2) - 1)/(n*(exp(1/(2*n)) - 1))
    limit: 6500*(exp(1/2) - 1)
    vary: {n: [10, 100, 1000, 10000, 100000]}
    tolerance: 0.02
    shown: ['\lim_{n\to\infty} L_n = \frac{3250\left(e^{1/2} - 1\right)}{1/2}']
    source: {cite: mit, at: 'Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-n10
    where: 'Problem 1(c), check: the lower sum for n = 10'
    inputs: {n: 10}
    formula: 3250*(exp(1/2) - 1)/(n*(exp(1/(2*n)) - 1))
    expected: '4112.1'
    shown: ['4112.1 for $n = 10$']
    source: {cite: mit, at: 'Part II, Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1c-n100
    where: 'Problem 1(c), check: the lower sum for n = 100'
    inputs: {n: 100}
    formula: 3250*(exp(1/2) - 1)/(n*(exp(1/(2*n)) - 1))
    expected: '4206.2'
    shown: ['4206.2 for $n = 100$']
    source: {cite: mit, at: 'Part II, Problem 1(c) (our own check)'}
    origin: page-own

  - id: p1c-n1000
    where: 'Problem 1(c), check: the lower sum for n = 1000'
    inputs: {n: 1000}
    formula: 3250*(exp(1/2) - 1)/(n*(exp(1/(2*n)) - 1))
