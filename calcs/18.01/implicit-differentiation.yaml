# Calculations on content/year-1/18.01/implicit-differentiation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 5 (David Jerison): transcript and lecture notes.

page: content/year-1/18.01/implicit-differentiation.mdx
calcs:
  - id: rational-power
    kind: identity
    where: 'formula "Power rule for rational exponents", checked for a = 2/3 and a = 5/2'
    formula: deriv('x**(2/3)', 'x', x0) + deriv('x**(5/2)', 'x', x0)
    equals: (2/3) * x0**(-1/3) + (5/2) * x0**(3/2)
    samples: {x0: [0.5, 2.0, 8.0]}
    tolerance: 1e-6
    shown: ['\frac{d}{dx}\,x^{a} = a\,x^{a-1}']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: exponent-arithmetic
    kind: identity
    where: 'formula "Solving for dy/dx": m − 1 − (m/n)(n − 1) = m/n − 1'
    formula: m - 1 - (m / n) * (n - 1)
    equals: m / n - 1
    samples: {m: [2, 1, 5], n: [3, 2, 7]}
    tolerance: 1e-12
    shown: ['x^{\,m - 1 - m + m/n}']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: circle-explicit
    kind: identity
    where: 'formula "Explicit derivative": d/dx √(1 − x²) = −x/√(1 − x²) = −x/y'
    formula: deriv('sqrt(1 - x**2)', 'x', x0)
    equals: -x0 / sqrt(1 - x0**2)
    samples: {x0: [0.2, 0.5, 0.8]}
    tolerance: 1e-6
    shown: ['= \frac{-x}{\sqrt{1 - x^2}}']
    source: {cite: reading2, at: 'pp. 3–5'}
    origin: mit

  - id: quartic-point
    where: 'section "When y cannot be found easily": (1, 1) lies on y⁴ + x y² − 2 = 0'
    inputs: {}
    formula: 1**4 + 1 * 1**2 - 2
    expected: '0'
    shown: ['$y = 1$ works ($1 + 1 - 2 = 0$)']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: quartic-slope
    where: 'formula "Slope at (1, 1)": −y²/(4y³ + 2xy) at (1, 1)'
    inputs: {}
    formula: -(1**2) / (4 * 1**3 + 2 * 1 * 1)
    expected: '-0.1667'
    shown: ['= -\frac16" cite']
    source: {cite: reading2, at: 'pp. 6–7'}
    origin: mit

  - id: quartic-slope-check
    kind: identity
    where: 'formula "Implicit differentiation": the slope −y²/(4y³ + 2xy) agrees with differentiating the explicit branch y = √((−x + √(x² + 8))/2)'
    formula: deriv('sqrt((-x + sqrt(x**2 + 8)) / 2)', 'x', x0)
    equals: -((-x0 + sqrt(x0**2 + 8)) / 2) / (4 * ((-x0 + sqrt(x0**2 + 8)) / 2)**1.5 + 2 * x0 * sqrt((-x0 + sqrt(x0**2 + 8)) / 2))
    samples: {x0: [0.5, 1.0, 2.0]}
    tolerance: 1e-6
    shown: ['y'' = \frac{-y^2}{4y^3 + 2xy}']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: ellipse-point
    where: 'worked example "A slope on an ellipse": the point satisfies x²/4 + y² = 1'
    inputs: {}
    formula: sqrt(2)**2 / 4 + (sqrt(2) / 2)**2
    expected: '1'
    shown: ['$\tfrac{2}{4} + \tfrac{2}{4} = 1$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ellipse-slope
    where: 'worked example "A slope on an ellipse": y′ = −x/(4y)'
    inputs: {}
    formula: -sqrt(2) / (4 * sqrt(2) / 2)
    expected: '-0.5'
    shown: ['= -\dfrac{1}{2} = -0.5$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: arctan-derivative
    kind: identity
    where: 'formula "Derivative of arctan"'
    formula: deriv('atan(x)', 'x', x0)
    equals: 1 / (1 + x0**2)
    samples: {x0: [-2.0, 0.3, 1.0, 4.0]}
    tolerance: 1e-7
    shown: ['\frac{d}{dx}\arctan x = \frac{1}{1 + x^2}" cite']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: arcsin-derivative
    kind: identity
    where: 'formula "Derivative of arcsin"'
    formula: deriv('asin(x)', 'x', x0)
    equals: 1 / sqrt(1 - x0**2)
    samples: {x0: [-0.6, 0.1, 0.5]}
    tolerance: 1e-6
    shown: ['= \frac{1}{\sqrt{1 - x^2}}" cite']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: tan-derivative
    kind: identity
    where: 'formula "Derivative of the tangent": d/dy tan y = 1/cos² y'
    formula: deriv('tan(y)', 'y', y0)
    equals: 1 / cos(y0)**2
    samples: {y0: [0.2, 0.9, -1.1]}
    tolerance: 1e-6
    shown: ['\frac{d}{dy}\tan y = \frac{1}{\cos^2 y} = \sec^2 y']
    source: {cite: reading2, at: 'p. 10'}
    origin: mit

  - id: arctan-asymptote
    where: 'graph caption: arctan levels off towards ±π/2 ≈ ±1.57'
    inputs: {}
    formula: pi / 2
    expected: '1.57'
    shown: ['±π/2 ≈ ±1.57']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: example-power
    where: 'worked example "Using the new derivatives" (a): (2/3) 8^(−1/3) = 1/3'
    inputs: {}
    formula: (2 / 3) * 8**(-1 / 3)
    expected: '0.333'
    shown: ['= \tfrac13 \approx 0.333$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: example-arctan
    where: 'worked example (b) and quiz 3: 1/(1 + 1²) = 0.5'
    inputs: {}
    formula: 1 / (1 + 1**2)
    expected: '0.5'
    shown: ['$\dfrac{1}{1 + 1^2} = 0.5$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: example-arcsin
    where: 'worked example (b): 1/√(1 − 0.25) ≈ 1.155'
    inputs: {}
    formula: 1 / sqrt(1 - 0.25)
    expected: '1.155'
    shown: ['\approx 1.155$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own
