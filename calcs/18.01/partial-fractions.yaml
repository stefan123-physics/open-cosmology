# Calculations on content/year-1/18.01/partial-fractions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 29 transcript and notes, with the page's own numbers.

page: content/year-1/18.01/partial-fractions.mdx
calcs:
  - id: disguise
    kind: identity
    where: 'formula "The same function, disguised"'
    formula: 1 / (x - 1) + 3 / (x + 2)
    equals: (4 * x - 1) / (x**2 + x - 2)
    samples: {x: [0.0, 3.0, -5.0]}
    tolerance: 1e-9
    shown: ['= \frac{4x - 1}{x^2 + x - 2}']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: repeated
    kind: identity
    where: 'formula "Repeated factor, solved"'
    formula: (x**2 + 2) / ((x - 1)**2 * (x + 2))
    equals: (1 / 3) / (x - 1) + 1 / (x - 1)**2 + (2 / 3) / (x + 2)
    samples: {x: [0.0, 3.0, -5.0]}
    tolerance: 1e-9
    shown: ['\frac{1/3}{x - 1} + \frac{1}{(x - 1)^2} + \frac{2/3}{x + 2}']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: quadratic-factor
    kind: identity
    where: 'formula "Integrating with a quadratic factor"'
    formula: integrate('t**2 / ((t - 1) * (t**2 + 1))', 't', 2, x)
    equals: (0.5 * log(x - 1) + 0.25 * log(x**2 + 1) + 0.5 * atan(x)) - (0.5 * log(1) + 0.25 * log(5) + 0.5 * atan(2))
    samples: {x: [3.0, 5.0]}
    tolerance: 1e-6
    shown: ['\frac{1}{2}\ln|x - 1| + \frac{1}{4}\ln(x^2 + 1) + \frac{1}{2}\tan^{-1}x + c']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: long-division
    kind: identity
    where: 'formula "Long division first"'
    formula: x**3 / (x**2 + x - 2)
    equals: x - 1 + (3 * x - 2) / (x**2 + x - 2)
    samples: {x: [0.0, 3.0, -5.0]}
    tolerance: 1e-9
    shown: ['= x - 1 + \frac{3x - 2}{x^2 + x - 2}']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: example-a
    where: 'worked example (a): 3/2 ln 2 − 1/2 ln(6/5) ≈ 0.949'
    inputs: {}
    formula: integrate('(t + 5) / ((t - 1) * (t + 3))', 't', 2, 3)
    expected: '0.949'
    shown: ['\approx 1.040 - 0.091 = 0.949$']
    source: {cite: reading2, at: 'pp. 2–4'}
    origin: page-own

  - id: example-a-parts
    where: 'same: 3/2 ln 2 ≈ 1.040'
    inputs: {}
    formula: 1.5 * log(2)
    expected: '1.040'
    shown: ['\approx 1.040 - 0.091']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-b
    kind: identity
    where: 'worked example (b): 1/(x²(x + 1)) = −1/x + 1/x² + 1/(x + 1)'
    formula: 1 / (x**2 * (x + 1))
    equals: -1 / x + 1 / x**2 + 1 / (x + 1)
    samples: {x: [2.0, -3.0, 0.5]}
    tolerance: 1e-9
    shown: ['$-\frac{1}{2} + \frac{1}{4} + \frac{1}{3} = \frac{1}{12}']
    source: {cite: reading2, at: 'pp. 5–7'}
    origin: page-own

  - id: example-c
    kind: identity
    where: 'worked example (c): (x² + 1)/(x² − 1) = 1 + 1/(x − 1) − 1/(x + 1)'
    formula: (x**2 + 1) / (x**2 - 1)
    equals: 1 + 1 / (x - 1) - 1 / (x + 1)
    samples: {x: [2.0, -3.0, 0.5]}
    tolerance: 1e-9
    shown: ['so the function is $1 + \frac{1}{x - 1} - \frac{1}{x + 1}$']
    source: {cite: reading2, at: 'pp. 11–12'}
    origin: page-own

  - id: artanh
    kind: identity
    where: 'cosmology note: ∫₀^y dy′/(1 − y′²) = ½ ln((1 + y)/(1 − y))'
    formula: integrate('1 / (1 - s**2)', 's', 0, y)
    equals: 0.5 * log((1 + y) / (1 - y))
    samples: {y: [0.3, 0.8366]}
    tolerance: 1e-6
    shown: ['= \frac{1}{2}\ln\frac{1 + y}{1 - y} = \tanh^{-1}y$']
    source: {cite: reading2, at: 'pp. 2–4 (cover-up method)'}
    origin: page-own

  - id: artanh-value
    where: 'cosmology note: artanh √0.7 ≈ 1.21'
    inputs: {}
    formula: 0.5 * log((1 + sqrt(0.7)) / (1 - sqrt(0.7)))
    expected: '1.21'
    shown: ['\tanh^{-1}\sqrt{0.7} \approx 1.21$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own
