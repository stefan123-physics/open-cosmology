# Calculations on content/year-1/18.01/18-01-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for Part II of this set, so every answer is checked here by an independent route:
# arc lengths and areas by numerical integration of numerically differentiated curves, equations solved
# numerically, and the minimum of the soap bubble found by a numerical derivative and root search.
# Integrals to infinity are taken up to 80, where e^(−x) has fallen to 2e−35.

page: content/year-1/18.01/18-01-problem-set-8.mdx
calcs:
  # ---- Introduction: the points

  - id: intro-points-counted
    where: 'Introduction: the points of the five problems written out, 7 + 9 + 11 + 6 + 9'
    inputs: {}
    formula: 7 + 9 + 11 + 6 + 9
    expected: '42'
    shown: ['solutions of our own (42 points)']
    source: {cite: mit, at: 'Part II of Problem Sets 8A and 8B'}
    origin: mit

  - id: intro-points-8a
    where: 'Introduction: Part II of 8A, with Problem 0: 3 + 7 + 9 + 11'
    inputs: {}
    formula: 3 + 7 + 9 + 11
    expected: '30'
    shown: ['Part II of 8A is worth 30 points']
    source: {cite: mit, at: 'Problem Set 8A, Part II, p. 1'}
    origin: mit

  # MIT's heading for Part II of 8B says "17 points + 5 extra"; its items carry 3 + 6 + 9 = 18. A slip in the source.
  - id: intro-points-8b
    where: 'Introduction: the items of Part II of 8B add up to 18, not to the 17 of the heading'
    inputs: {}
    formula: 3 + 6 + 9
    expected: '18'
    shown: ['carry 3, 6 and 9 points, which is 18', 'heading says 17 points and 5 extra']
    source: {cite: reading1, at: 'Part II, p. 1'}
    origin: slip

  - id: intro-optional-points
    kind: fact
    where: 'Introduction: the extra credit of 8B Problem 1(e)'
    shown: ['as an optional problem of its own (5 points)']
    source: {cite: reading1, at: 'Part II, Problem 1(e), p. 2'}
    origin: mit

  - id: part1-points
    kind: fact
    where: 'Last section: the points of Part I of each half at MIT'
    shown: ['15 points for 8A and 20 for 8B at MIT']
    source: {cite: mit, at: 'Part I of Problem Sets 8A and 8B, p. 1'}
    origin: mit

  # ---- 8A, Problem 1

  # The power p for which (cosᵏ t)ᵖ + (sinᵏ t)ᵖ = 1, found by solving that equation numerically at a point of the curve.
  - id: a1-a-power
    kind: identity
    answer: a1-a
    where: '8A Problem 1(a), answer box: p = 2/k against the numerical root p of (cosᵏ t)ᵖ + (sinᵏ t)ᵖ = 1'
    formula: 2/k
    equals: solve('cos(t)**(k*p) + sin(t)**(k*p) - 1', 'p', 0.05, 20)
    samples:
      k: [1.0, 2.0, 3.0, 5.0, 2.5]
      t: [0.4, 1.1, 0.7, 0.9, 0.3]
    tolerance: 1e-8
    shown: ['\qquad\text{so } p = \frac{2}{k}']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: a1-a-halfway
    where: '8A Problem 1(a): the halfway point of the k = 3 curve, cos³(π/4)'
    inputs: {}
    formula: cos(pi/4)**3
    expected: '0.354'
    shown: ['x = y = a/(2\sqrt2) = 0.354\,a']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: a1-a-check
    where: '8A Problem 1(a), check: (2^(−3/2))^(2/3)'
    inputs: {}
    formula: (2**(-1.5))**(2/3)
    expected: '0.5'
    tolerance: 1e-9
    shown: ['\left(2^{-3/2}\right)^{2/3} = \tfrac12']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(a) (our own solution)'}
    origin: page-own

  - id: a1-b-quarter-circle
    kind: identity
    answer: a1-b-1
    where: '8A Problem 1(b), answer box: πa/2 against the numerical arc length of x = a cos t, y = a sin t (derivatives taken numerically)'
    formula: pi*a/2
    equals: integrate('sqrt(deriv("a*cos(s)", "s", t)**2 + deriv("a*sin(s)", "s", t)**2)', 't', 0, pi/2)
    samples: {a: [1.0, 2.5, 4.0]}
    tolerance: 1e-6
    shown: ['a quarter of $2\pi a$, which is $\pi a/2']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: a1-b-segment
    kind: identity
    answer: a1-b-2
    where: '8A Problem 1(b), answer box: √2 a against the numerical arc length of x = a cos² t, y = a sin² t'
    formula: sqrt(2)*a
    equals: integrate('sqrt(deriv("a*cos(s)**2", "s", t)**2 + deriv("a*sin(s)**2", "s", t)**2)', 't', 0, pi/2)
    samples: {a: [1.0, 2.5, 4.0]}
    tolerance: 1e-6
    shown: ['\sqrt{a^2 + a^2} = \sqrt2\,a']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: a1-b-quarter-number
    where: '8A Problem 1(b): π/2'
    inputs: {}
