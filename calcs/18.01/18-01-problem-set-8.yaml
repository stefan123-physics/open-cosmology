    expected: '1.414'
    shown: ['\sqrt2\,a = 1.414\,a$']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: a1-c-speed
    kind: identity
    answer: a1-c-speed
    where: '8A Problem 1(c), answer box: the speed formula against the root of the squared numerical derivatives of x and y'
    formula: a*k*sin(t)*cos(t)*sqrt(cos(t)**(2*k-4) + sin(t)**(2*k-4))
    equals: sqrt(deriv('a*cos(s)**k', 's', t)**2 + deriv('a*sin(s)**k', 's', t)**2)
    samples:
      a: [1.0, 2.0, 3.0, 1.5, 2.2]
      k: [1.0, 2.0, 3.0, 4.0, 2.5]
      t: [0.2, 0.7, 1.3, 1.0, 0.5]
    tolerance: 1e-6
    shown: ['\frac{ds}{dt} = ak\,\sin t\cos t\,\sqrt{\cos^{2k-4} t + \sin^{2k-4} t}']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  - id: a1-c-length-3
    kind: identity
    answer: a1-c-3
    where: '8A Problem 1(c), answer box: 3a/2 against the numerical arc length of x = a cos³ t, y = a sin³ t'
    formula: 3*a/2
    equals: integrate('sqrt(deriv("a*cos(s)**3", "s", t)**2 + deriv("a*sin(s)**3", "s", t)**2)', 't', 0, pi/2)
    samples: {a: [1.0, 2.5, 4.0]}
    tolerance: 1e-6
    shown: ['L = 3a\int_0^{\pi/2}\sin t\cos t\,dt = \frac{3a}{2}']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  - id: a1-c-general-integral
    kind: identity
    where: '8A Problem 1(c), formula "Length for general k": the integral of the speed formula against the numerical arc length, for several k'
    formula: a*k*integrate('sin(t)*cos(t)*sqrt(cos(t)**(2*k-4) + sin(t)**(2*k-4))', 't', 0, pi/2)
    equals: integrate('sqrt(deriv("a*cos(s)**k", "s", t)**2 + deriv("a*sin(s)**k", "s", t)**2)', 't', 0, pi/2)
    samples:
      a: [1.0, 2.0, 1.0, 3.0]
      k: [1.0, 2.0, 3.0, 2.5]
    tolerance: 1e-6
    shown: ['L = ak\int_0^{\pi/2} \sin t\cos t\,\sqrt{\cos^{2k-4} t + \sin^{2k-4} t}\;dt']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  - id: a1-c-half
    where: '8A Problem 1(c): the integral of sin t cos t from 0 to π/2'
