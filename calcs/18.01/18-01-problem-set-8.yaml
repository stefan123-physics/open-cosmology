    where: '8A Problem 3(a), check with a = 4, h = 3: the polar integral, numerically'
    inputs: {}
    formula: integrate('0.5*(4/cos(q))**2', 'q', 0, atan(3/4))
    expected: '6'
    tolerance: 1e-8
    shown: ['$\tfrac12 \times 16 \times 0.75 = 6$']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 3(a) (our own numbers)'}
    origin: page-own

  # The rectangular equation against the unsquared relation r = 1 − y, solved numerically for y at a given x.
  - id: a3-b-equation
    kind: identity
    answer: a3-b
    where: '8A Problem 3(b), answer box: (1 − x²)/2 against the numerical root y of √(x² + y²) = 1 − y'
    formula: (1 - x**2)/2
    equals: solve('sqrt(x**2 + y**2) - (1 - y)', 'y', -50, 0.5)
    samples: {x: [-2.0, -0.7, 0.3, 1.0, 1.6]}
    tolerance: 1e-8
    shown: ['\quad\Longrightarrow\quad y = \frac{1 - x^2}{2}']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 3(b) (our own solution)'}
    origin: page-own

  # Points of the polar curve itself, x = r cos θ and y = r sin θ with r = 1/(1 + sin θ), satisfy the rectangular equation.
  - id: a3-b-polar-points
    kind: identity
    where: '8A Problem 3(b): the points of the polar curve lie on y = (1 − x²)/2'
    formula: sin(q)/(1 + sin(q))
    equals: (1 - (cos(q)/(1 + sin(q)))**2)/2
    samples: {q: [-1.2, -0.5, 0.3, 0.8, 1.5708, 2.5, 3.0, 4.0]}
    tolerance: 1e-9
    shown: ['x^2 + y^2 = (1 - y)^2 = 1 - 2y + y^2']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 3(b) (our own solution)'}
    origin: page-own

