  - id: a2-d-area
    kind: identity
    answer: a2-d
    where: '8A Problem 2(d), answer box: π(x₁ + sinh(2x₁)/2) against the numerical integral of 2πy ds for y = cosh x (slope taken numerically)'
    formula: pi*(x1 + sinh(2*x1)/2)
    equals: integrate('2*pi*((exp(x) + exp(-x))/2)*sqrt(1 + deriv("(exp(s) + exp(-s))/2", "s", x)**2)', 'x', 0, x1)
