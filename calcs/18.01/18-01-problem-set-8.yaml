    expected: '1.571'
    shown: ['$\pi a/2 = 1.571\,a$']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(b) (our own solution)'}
    origin: page-own

  - id: a1-b-segment-number
    where: '8A Problem 1(b): √2'
    inputs: {}
