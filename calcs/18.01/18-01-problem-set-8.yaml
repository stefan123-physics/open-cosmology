  - id: a1-c-whole-curve
    where: '8A Problem 1(c), hint of a listed mistake: the whole closed k = 3 curve (t from 0 to 2π) has length 6a; numerical arc length for a = 1'
    inputs: {}
    formula: integrate('sqrt(deriv("cos(s)**3", "s", t)**2 + deriv("sin(s)**3", "s", t)**2)', 't', 0, pi/2) + integrate('sqrt(deriv("cos(s)**3", "s", t)**2 + deriv("sin(s)**3", "s", t)**2)', 't', pi/2, pi) + integrate('sqrt(deriv("cos(s)**3", "s", t)**2 + deriv("sin(s)**3", "s", t)**2)', 't', pi, 3*pi/2) + integrate('sqrt(deriv("cos(s)**3", "s", t)**2 + deriv("sin(s)**3", "s", t)**2)', 't', 3*pi/2, 2*pi)
    expected: '6'
    tolerance: 1e-5
    shown: ['expr: "6*a"']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 1(c) (our own solution)'}
    origin: page-own

  # ---- 8A, Problem 2

  - id: a2-a-derivative-sinh
    kind: identity
    where: '8A Problem 2(a): cosh x against the numerical derivative of (eˣ − e⁻ˣ)/2'
    formula: cosh(x)
    equals: deriv('(exp(s) - exp(-s))/2', 's', x)
    samples: {x: [-1.5, 0.0, 0.4, 2.0]}
    tolerance: 1e-6
    shown: ['\frac{d}{dx}\,\frac{e^x - e^{-x}}{2} = \frac{e^x + e^{-x}}{2} = \cosh x']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: a2-a-derivative-cosh
    kind: identity
    where: '8A Problem 2(a): sinh x against the numerical derivative of (eˣ + e⁻ˣ)/2'
    formula: sinh(x)
    equals: deriv('(exp(s) + exp(-s))/2', 's', x)
    samples: {x: [-1.5, 0.3, 0.4, 2.0]}
    tolerance: 1e-6
    shown: ['\frac{d}{dx}\,\frac{e^x + e^{-x}}{2} = \frac{e^x - e^{-x}}{2} = \sinh x']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: a2-a-difference-of-squares
    kind: identity
    where: '8A Problem 2(a): cosh² x against 1 + sinh² x, both written out with exponentials'
    formula: ((exp(x) + exp(-x))/2)**2
    equals: 1 + ((exp(x) - exp(-x))/2)**2
    samples: {x: [-1.5, 0.0, 0.4, 2.0]}
    tolerance: 1e-12
    shown: ['$\cosh^2 x - \sinh^2 x = \tfrac44 = 1$']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 2(a) (our own solution)'}
    origin: page-own

  - id: a2-a-half-angle
    kind: identity
    where: '8A Problem 2(a): cosh² x against (1 + cosh 2x)/2, the left side written out with exponentials'
    formula: ((exp(x) + exp(-x))/2)**2
    equals: (1 + cosh(2*x))/2
    samples: {x: [-1.5, 0.0, 0.4, 2.0]}
    tolerance: 1e-12
    shown: ['\cosh^2 x = \frac{2\cosh 2x + 2}{4} = \frac{1 + \cosh 2x}{2}']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 2(a) (our own solution)'}
    origin: page-own

