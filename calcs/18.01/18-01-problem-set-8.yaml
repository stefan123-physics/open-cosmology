  # ---- 8A, Problem 3

  # The distance from the origin to the point of the line x = a seen at the angle θ, by Pythagoras.
  - id: a3-a-side
    kind: identity
    answer: a3-a-r
    where: '8A Problem 3(a), answer box: a/cos θ against the distance from the origin to the point (a, a tan θ)'
    formula: a/cos(theta)
    equals: sqrt(a**2 + (a*tan(theta))**2)
    samples:
      a: [1.0, 2.0, 3.0, 1.5]
      theta: [0.1, 0.6, 1.2, 0.9]
    tolerance: 1e-10
    shown: ['tex="r = \frac{a}{\cos\theta}"']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: a3-a-area
    kind: identity
    answer: a3-a-area
    where: '8A Problem 3(a), answer box: ah/2 against the numerical integral of ½r² dθ from 0 to tan⁻¹(h/a)'
    formula: a*h/2
    equals: integrate('0.5*(a/cos(q))**2', 'q', 0, atan(h/a))
    samples:
      a: [1.0, 2.0, 3.0, 4.0]
      h: [1.0, 4.0, 2.5, 3.0]
    tolerance: 1e-8
    shown: ['\frac{a^2}{2}\cdot\frac{h}{a} = \frac{ah}{2}']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: a3-a-check-angle
    where: '8A Problem 3(a), check with a = 4, h = 3: the angle tan⁻¹(0.75)'
    inputs: {}
    formula: atan(3/4)
    expected: '0.6435'
    shown: ['\theta_0 = \tan^{-1}(0.75) = 0.6435']
    source: {cite: mit, at: 'Problem Set 8A, Part II, Problem 3(a) (our own numbers)'}
    origin: page-own

