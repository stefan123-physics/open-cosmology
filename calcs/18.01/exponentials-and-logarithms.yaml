# Calculations on content/year-1/18.01/exponentials-and-logarithms.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 6 (David Jerison): transcript and lecture notes.

page: content/year-1/18.01/exponentials-and-logarithms.mdx
calcs:
  - id: exp-derivative
    kind: identity
    where: 'formula "Definition of e": d/dx eˣ = eˣ'
    formula: deriv('exp(x)', 'x', x0)
    equals: exp(x0)
    samples: {x0: [-1.0, 0.0, 1.5]}
    tolerance: 1e-6
    shown: ['\frac{d}{dx}e^x = e^x" cite']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: ln-derivative
    kind: identity
    where: 'formula "Derivative of ln x": d/dx ln x = 1/x'
    formula: deriv('log(x)', 'x', x0)
    equals: 1 / x0
    samples: {x0: [0.3, 1.0, 4.0]}
    tolerance: 1e-6
    shown: ['\frac{d}{dx}\ln x = \frac1x" cite']
    source: {cite: reading2, at: 'pp. 6–7'}
    origin: mit

  - id: a-power-derivative
    kind: identity
    where: 'formula "Derivative of aˣ": d/dx aˣ = (ln a) aˣ'
    formula: deriv('a**x', 'x', x0)
    equals: log(a) * a**x0
    samples: {a: [2.0, 10.0, 0.5], x0: [0.3, 1.2, -1.0]}
    tolerance: 1e-6
    shown: ['= (\ln a)\,e^{x\ln a} = (\ln a)\,a^x']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: x-to-x
    kind: identity
    where: 'formula "Derivative of xˣ"'
    formula: deriv('x**x', 'x', x0)
    equals: x0**x0 * (1 + log(x0))
    samples: {x0: [0.5, 1.0, 2.0]}
    tolerance: 1e-6
    shown: ['\frac{d}{dx}x^x = x^x(1 + \ln x)']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: m2
    where: 'quiz 3: M(2) = ln 2 ≈ 0.693'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['For instance $M(2) \\approx 0.693$.']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: k-for-e
    where: 'graph caption: k = 1/ln 2 ≈ 1.443'
    inputs: {}
    formula: 1 / log(2)
    expected: '1.443'
    shown: ['At k ≈ 1.443 = 1/ln 2']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: page-own

  - id: example-3x
    where: 'worked example (a): (ln 3) 3² ≈ 9.89'
    inputs: {}
    formula: log(3) * 9
    expected: '9.89'
    shown: ['$(\ln 3)\,3^2 \approx 1.0986 \times 9 \approx 9.89$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: ln3
    where: 'worked example (a): ln 3 ≈ 1.0986'
    inputs: {}
    formula: log(3)
    expected: '1.0986'
    shown: ['1.0986 \times 9']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: example-xx
    where: 'worked example (b): 2²(1 + ln 2) ≈ 6.77'
    inputs: {}
    formula: 4 * (1 + log(2))
    expected: '6.77'
    shown: ['$2^2(1 + \ln 2) \approx 4 \times 1.693 \approx 6.77$']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: one-plus-ln2
    where: 'worked example (b): 1 + ln 2 ≈ 1.693'
    inputs: {}
    formula: 1 + log(2)
    expected: '1.693'
    shown: ['4 \times 1.693']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: example-logderiv
    kind: identity
    where: 'worked example (c): d/dx ln(x² + 1) = 2x/(x² + 1), which is 1 at x = 1'
    formula: deriv('log(x**2 + 1)', 'x', x0)
    equals: 2 * x0 / (x0**2 + 1)
    samples: {x0: [1.0, 0.4, 2.5]}
    tolerance: 1e-6
    shown: ['$\dfrac{2x}{x^2 + 1} = \dfrac{2}{2} = 1$ at $x = 1$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: e-limit-100
    where: 'section "Closing the loop": 1.01¹⁰⁰ ≈ 2.705'
    inputs: {}
    formula: 1.01**100
    expected: '2.705'
    shown: ['$1.01^{100} \approx 2.705$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: e-limit-1000
    where: 'section "Closing the loop": n = 1000 gives about 2.717'
    inputs: {}
    formula: 1.001**1000
    expected: '2.717'
    shown: ['$n = 1000$ gives about $2.717$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: e-value
    where: 'section "Closing the loop" and flashcard: e ≈ 2.71828'
    inputs: {}
    formula: exp(1)
    expected: '2.71828'
    shown: ['closing in on $e \approx 2.71828$']
    source: {cite: reading2, at: 'pp. 10–11'}
    origin: page-own

  - id: notes-secant-4
    where: 'section "Begging the question": the secant of 4ˣ from (−½, ½) to (0, 1) has slope 1'
    inputs: {}
    formula: (1 - 4**(-0.5)) / (0 - (-0.5))
    expected: '1'
    shown: ['secant from $(-\tfrac12, \tfrac12)$ to $(0, 1)$, also 1']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit
