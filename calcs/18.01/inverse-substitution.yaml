# Calculations on content/year-1/18.01/inverse-substitution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 28 transcript and notes, with the page's own numbers.

page: content/year-1/18.01/inverse-substitution.mdx
calcs:
  - id: sec4
    kind: identity
    where: 'formula "Fourth power of the secant": ∫ sec⁴x dx = tan x + tan³x/3'
    formula: integrate('1 / cos(t)**4', 't', 0, x)
    equals: tan(x) + tan(x)**3 / 3
    samples: {x: [0.3, 0.8, 1.2]}
    tolerance: 1e-6
    shown: ['= \tan x + \frac{\tan^3 x}{3} + c']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: lecture-example
    kind: identity
    where: 'formula "Result": ∫ dx/(x²√(1 + x²)) = −√(1 + x²)/x'
    formula: integrate('1 / (t**2 * sqrt(1 + t**2))', 't', 1, x)
    equals: -sqrt(1 + x**2) / x + sqrt(2)
    samples: {x: [0.5, 2.0, 5.0]}
    tolerance: 1e-6
    shown: ['= -\frac{\sqrt{1 + x^2}}{x} + c" cite']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: tan-arccsc
    kind: identity
    where: 'section "Undoing the substitution": tan of the arccosecant of x is 1/√(x² − 1)'
    formula: tan(asin(1 / x))
    equals: 1 / sqrt(x**2 - 1)
    samples: {x: [1.5, 3.0, 10.0]}
    tolerance: 1e-9
    shown: ['$\tan\theta = 1/\sqrt{x^2 - 1}$ (p. 8)']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: completing-square
    kind: identity
    where: 'formula "Result after completing the square"'
    formula: integrate('1 / sqrt(t**2 + 4 * t)', 't', 1, x)
    equals: log(x + 2 + sqrt(x**2 + 4 * x)) - log(3 + sqrt(5))
    samples: {x: [2.0, 5.0, 12.0]}
    tolerance: 1e-6
    shown: ['= \ln\left(x + 2 + \sqrt{x^2 + 4x}\right) + \tilde c']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: example-a
    kind: identity
    where: 'worked example (a): ∫ dx/(x²√(4 + x²)) = −√(4 + x²)/(4x)'
    formula: integrate('1 / (t**2 * sqrt(4 + t**2))', 't', 1, x)
    equals: -sqrt(4 + x**2) / (4 * x) + sqrt(5) / 4
    samples: {x: [0.5, 2.0, 5.0]}
    tolerance: 1e-6
    shown: ['so the answer is $-\frac{\sqrt{4 + x^2}}{4x} + c$']
    source: {cite: reading2, at: 'pp. 4–7'}
    origin: page-own

  - id: example-b
    where: 'worked example (b) and quiz 4: ∫₀¹ dx/√(1 + x²) = ln(1 + √2) ≈ 0.881'
    inputs: {}
    formula: integrate('1 / sqrt(1 + t**2)', 't', 0, 1)
    expected: '0.881'
    shown: ['So the integral is about 0.881.']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: page-own

  - id: example-c
    kind: identity
    where: 'worked example (c): ∫ dx/√(x² − 6x + 5) = ln(x − 3 + √(x² − 6x + 5)) for x > 5'
    formula: integrate('1 / sqrt(t**2 - 6 * t + 5)', 't', 6, x)
    equals: log(x - 3 + sqrt(x**2 - 6 * x + 5)) - log(3 + sqrt(5))
    samples: {x: [7.0, 10.0, 20.0]}
    tolerance: 1e-6
    shown: ['$\ln\left(x - 3 + \sqrt{x^2 - 6x + 5}\right) + c$']
    source: {cite: reading2, at: 'pp. 9–11'}
    origin: page-own

  - id: age-substitution
    kind: identity
    where: 'cosmology note: the age integral becomes (2/3) arcsinh(√(Ωv/Ωm) x^(3/2))/√Ωv'
    formula: integrate('sqrt(t) / sqrt(0.3 + 0.7 * t**3)', 't', 0, x)
    equals: 2 / (3 * sqrt(0.7)) * log(sqrt(0.7 / 0.3) * x**1.5 + sqrt(1 + 0.7 / 0.3 * x**3))
    samples: {x: [0.5, 1.0]}
    tolerance: 1e-6
    shown: ['\ln\left(w + \sqrt{1 + w^2}\right)$ with']
    source: {cite: reading2, at: 'pp. 8–9'}
    origin: page-own
