  # X = x1³ as the limit of x3 when ladder 2 (foot at x1 + d, top at sqrt(1 − (x1 + d)²)) closes in on ladder 1.
  - id: p6-c-limit-x
    kind: limit
    answer: p6-c-x
    where: 'Problem 6(c), answer box and formula "The limit point": the crossing point of ladder 1 (x1 = 0.6) with a ladder whose foot is d further right'
    inputs: {x1: 0.6}
    formula: x1**3
    limit: x1*(x1 + d)*(sqrt(1 - x1**2) - sqrt(1 - (x1 + d)**2)) / ((x1 + d)*sqrt(1 - x1**2) - x1*sqrt(1 - (x1 + d)**2))
