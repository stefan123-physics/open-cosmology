# Calculations on content/year-1/18.01/18-01-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for Part II of this set, so every formula answer is checked here by an independent route:
# a numerical derivative of the explicit function, or a numerical solution of the equation the answer should satisfy.

page: content/year-1/18.01/18-01-problem-set-3.mdx
calcs:
  # ---- MIT's points

  - id: points-scored
    kind: fact
    where: 'introduction: the points of the four scored problems, 2 + 7 + 5 + 8'
    shown: ['they count for the score (22 points)']
    source: {cite: mit, at: 'Part II, Problems 2 to 5, pp. 1–2'}
    origin: mit

  - id: points-part-two
    kind: fact
    where: 'introduction: MIT''s points for Part II and for the extra-credit problem'
    shown: ['MIT''s Part II is worth 31 points, plus 8 for the extra-credit problem']
    source: {cite: mit, at: 'Part II heading, p. 1'}
    origin: mit

  - id: points-part-one
    kind: fact
    where: 'last section: MIT''s points for Part I'
    shown: ['(10 points at MIT, not scored here)']
    source: {cite: mit, at: 'Part I heading, p. 1'}
    origin: mit

  # ---- Problem 2: the curve x^(2/3) + y^(2/3) = 1

  # The slope against a numerical derivative of the explicit arc y = (1 − x^(2/3))^(3/2); the sample points lie on the curve.
  - id: p2-slope-by-derivative
    kind: identity
    answer: p2-slope
    where: 'Problem 2(a), answer box and formula "Slope of the curve": against a numerical derivative of y = (1 − x^(2/3))^(3/2)'
    formula: -(y/x)**(1/3)
    equals: deriv('(1 - t**(2/3))**(3/2)', 't', x)
    samples:
      x: [0.125, 0.353553390593274, 0.421875]
      y: [0.649519052838329, 0.353553390593274, 0.289379049647690]
    tolerance: 1e-6
    shown: ['= -\left(\frac{y}{x}\right)^{1/3}"']
    source: {cite: mit, at: 'Part II, Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-x-crossing
    kind: identity
    where: 'Problem 2(b), formula "Crossing of the x-axis": x0 + y0 (x0/y0)^(1/3) = x0^(1/3) for points on the curve'
    formula: x0 + y0*(x0/y0)**(1/3)
    equals: x0**(1/3)
    samples:
      x0: [0.125, 0.353553390593274, 0.421875]
      y0: [0.649519052838329, 0.353553390593274, 0.289379049647690]
    tolerance: 1e-9
    shown: ['x_0^{1/3}\left(x_0^{2/3} + y_0^{2/3}\right) = x_0^{1/3}"']
    source: {cite: mit, at: 'Part II, Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-y-crossing
    kind: identity
    where: 'Problem 2(b), formula "Crossing of the y-axis": y0 + x0 (y0/x0)^(1/3) = y0^(1/3) for points on the curve'
    formula: y0 + x0*(y0/x0)**(1/3)
    equals: y0**(1/3)
    samples:
      x0: [0.125, 0.353553390593274, 0.421875]
      y0: [0.649519052838329, 0.353553390593274, 0.289379049647690]
    tolerance: 1e-9
    shown: ['y_0^{1/3}\left(x_0^{2/3} + y_0^{2/3}\right) = y_0^{1/3}"']
    source: {cite: mit, at: 'Part II, Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-length
    kind: identity
    where: 'Problem 2(b), formula "Length of the piece of tangent line": the distance between the two crossings is 1'
    formula: sqrt((x0 + y0*(x0/y0)**(1/3))**2 + (y0 + x0*(y0/x0)**(1/3))**2)
    equals: 1 + 0*x0
    samples:
      x0: [0.125, 0.353553390593274, 0.421875]
      y0: [0.649519052838329, 0.353553390593274, 0.289379049647690]
    tolerance: 1e-9
    shown: ['\left(x_0^{1/3}\right)^2 + \left(y_0^{1/3}\right)^2 = x_0^{2/3} + y_0^{2/3} = 1"']
    source: {cite: mit, at: 'Part II, Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-check-power
    where: 'Problem 2(b), check: x0^(2/3) at x0 = 1/8'
    inputs: {x0: 0.125}
    formula: x0**(2/3)
    expected: '0.25'
    tolerance: 1e-12
    shown: ['Then $x_0^{2/3} = 1/4$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-check-y0
    where: 'Problem 2(b), check: the point of the curve with x0 = 1/8'
    inputs: {x0: 0.125}
    formula: (1 - x0**(2/3))**(3/2)
    expected: '0.6495'
    shown: ['$y_0 = 0.6495$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-check-x-crossing
    where: 'Problem 2(b), check: crossing of the x-axis'
    inputs: {x0: 0.125}
    formula: x0**(1/3)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['$x_0^{1/3} = 0.5$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-check-y-crossing
    where: 'Problem 2(b), check: crossing of the y-axis'
    inputs: {x0: 0.125}
    formula: ((1 - x0**(2/3))**(3/2))**(1/3)
    expected: '0.8660'
    shown: ['$y_0^{1/3} = 0.8660$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-check-length
    where: 'Problem 2(b), check: the length of the piece'
    formula: sqrt(0.25 + 0.75)
    expected: '1'
    tolerance: 1e-12
    shown: ['$\sqrt{0.25 + 0.75} = 1$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-check-slope-line
    where: 'Problem 2(b), check: the slope of the tangent line from its two crossings'
    formula: -0.8660/0.5
    expected: '-1.732'
    shown: ['$-0.8660/0.5 = -1.732$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-check-slope-formula
    where: 'Problem 2(b), check: the slope from the formula of part (a)'
    formula: -(0.6495/0.125)**(1/3)
    expected: '-1.732'
    shown: ['$-(0.6495/0.125)^{1/3} = -1.732$']
    source: {cite: mit, at: 'Part II, Problem 2 (our own numbers)'}
    origin: page-own

