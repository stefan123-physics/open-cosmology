  # ---- Problem 6 (optional)

  # x3 against a numerical solution of "the two lines have the same height at x".
  - id: p6-a-crossing-x
    kind: identity
    answer: p6-a-x
    where: 'Problem 6(a), answer box and formula "Eliminating y": against a numerical solution of y1(1 − x/x1) = y2(1 − x/x2)'
    formula: x1*x2*(y1 - y2)/(x2*y1 - x1*y2)
    equals: solve('y1*(1 - t/x1) - y2*(1 - t/x2)', 't', -100, 100)
    samples:
      x1: [0.3, 0.6, 0.25]
      x2: [0.8, 0.8, 0.7]
      y1: [0.9, 0.8, 0.95]
      y2: [0.4, 0.6, 0.3]
    tolerance: 1e-9
    shown: ['x_3 = \frac{x_1 x_2\,(y_1 - y_2)}{x_2 y_1 - x_1 y_2}"']
    source: {cite: mit, at: 'Part II, Problem 6(a) (our own solution)'}
    origin: page-own

