  # ---- Problem 3(a)

  # h/L against a numerical derivative of L(h) = sqrt(h² − 20,000²); the sample pairs are Pythagorean (3-4-5, 20-21-29, 5-12-13).
  - id: p3-a-derivative
    kind: identity
    answer: p3-a-deriv
    where: 'Problem 3(a), answer box and formula "Sensitivity of the position": against a numerical derivative of sqrt(h² − 20,000²)'
    formula: h/L
    equals: deriv('sqrt(t**2 - 20000**2)', 't', h)
    samples:
      h: [25000, 29000, 52000]
      L: [15000, 21000, 48000]
    tolerance: 1e-7
    shown: ['\frac{dL}{dh} = \frac{h}{L}" cite="reading1"']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: p3-a-derivative-25000
    where: 'Problem 3(a), step "Compare with the table": the derivative at h = 25,000'
    inputs: {alt: 20000, h0: 25000}
    formula: h0 / sqrt(h0**2 - alt**2)
    expected: '1.666667'
    shown: ['$dL/dh = 25{,}000/15{,}000 = 1.666667$']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-table-fit-25000
    where: 'Problem 3(a), step "Compare with the table": the largest difference in the first column (Δh = −1) from the derivative, in percent'
    inputs: {alt: 20000, h0: 25000, dh: -1}
    formula: ((sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh / (h0 / sqrt(h0**2 - alt**2)) - 1) * 100
    expected: '0.0036'
    tolerance: 0.0004
    shown: ['differ from this by less than 0.004%']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-position-20001
    where: 'Problem 3(a), step "Compare with the table": L at h = 20,001'
    inputs: {alt: 20000, h0: 20001}
    formula: sqrt(h0**2 - alt**2)
    expected: '200.0025'
    shown: ['$L = \sqrt{40{,}001} = 200.0025$']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-derivative-20001
    answer: p3-a-near
    where: 'Problem 3(a), answer box: the derivative at h = 20,001, by a numerical derivative of sqrt(h² − 20,000²)'
    formula: deriv('sqrt(t**2 - 20000**2)', 't', 20001)
    expected: '100.0'
    shown: ['$dL/dh = 20{,}001/200.0025 = 100.0$']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-table-fit
    where: 'Problem 3(a), step "Compare with the table": the ratio for Δh = −0.01 near h = 20,001 against the derivative, in percent (the one for +0.01 is as close)'
    inputs: {alt: 20000, h0: 20001, dh: -0.01}
    formula: ((sqrt((h0 + dh)**2 - alt**2) - sqrt(h0**2 - alt**2)) / dh / (h0 / sqrt(h0**2 - alt**2)) - 1) * 100
    expected: '0.3'
    tolerance: 0.06
    shown: ['are within 0.3% of this']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-exact-quotient
    kind: identity
    where: 'Problem 3(a), formula "Exact difference quotient": (L1 − L0)/(h1 − h0) = (h1 + h0)/(L1 + L0)'
    formula: (sqrt(h1**2 - alt**2) - sqrt(h0**2 - alt**2)) / (h1 - h0)
    equals: (h1 + h0) / (sqrt(h1**2 - alt**2) + sqrt(h0**2 - alt**2))
    samples:
      alt: [20000, 20000, 20000, 3]
      h0: [25000, 20001, 21000, 5]
      h1: [25001, 20002, 52000, 7]
    tolerance: 1e-7
    shown: ['= \frac{L_1 - L_0}{h_1 - h_0} = \frac{h_1 + h_0}{L_1 + L_0}"']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-derivative-other-form
    kind: identity
    where: 'Problem 3(a), formula "The derivative as a function of the distance": the two ways of writing it'
    formula: h / sqrt(h**2 - 20000**2)
    equals: 1 / sqrt(1 - 20000**2/h**2)
    samples:
      h: [20001, 23094, 25000, 52000]
    tolerance: 1e-9
    shown: ['= \frac{1}{\sqrt{1 - 20{,}000^2/h^2}}"']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  # The boundary by solving h/sqrt(h² − 20,000²) = 2 numerically, not from the closed form 40,000/√3.
  - id: p3-a-bound-2
    answer: p3-a-range
    where: 'Problem 3(a), answer box and formula "Where the derivative is at most 2": the distance at which dL/dh = 2'
    formula: solve('t / sqrt(t**2 - 20000**2) - 2', 't', 20001, 60000)
    expected: '23094'
    shown: ['h \ge \frac{40{,}000}{\sqrt3} = 23{,}094 \text{ km}"']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-bound-2-closed-form
    where: 'Problem 3(a), step "Where the error is at most doubled": the closed form 40,000/√3'
    formula: 40000 / sqrt(3)
    expected: '23094'
    shown: ['lies at or above $h = 23{,}094$ km']
    source: {cite: mit, at: 'Part II, Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3-a-derivative-24999
