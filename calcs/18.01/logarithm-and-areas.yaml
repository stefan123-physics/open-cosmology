# Calculations on content/year-1/18.01/logarithm-and-areas.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 21, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/logarithm-and-areas.mdx
calcs:
  - id: L-is-log
    kind: identity
    where: 'formula "The logarithm as an integral": ∫₁ˣ dt/t = ln x'
    formula: integrate('1 / x', 'x', 1, y)
    equals: log(y)
    samples: {y: [0.3, 2.0, 5.0]}
    tolerance: 1e-6
    shown: ['L(x) = \int_1^x \frac{dt}{t} \quad (x > 0)']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: product-rule
    kind: identity
    where: 'formula "Change of variables": ∫ₐ^(ab) dt/t = ∫₁ᵇ du/u'
    formula: integrate('1 / x', 'x', a, a * b)
    equals: integrate('1 / x', 'x', 1, b)
    samples: {a: [2.0, 0.5], b: [3.0, 7.0]}
    tolerance: 1e-6
    shown: ['= L(b) \;\Rightarrow\; L(ab) = L(a) + L(b)']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: e-defined
    where: 'plot caption: L(e) = 1 at e ≈ 2.718'
    inputs: {}
    formula: exp(1)
    expected: '2.718'
    shown: ['at x = e ≈ 2.718']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: ln2
    where: 'worked example "Logarithms without a calculator" and quiz 3: ln 2 ≈ 0.693'
    inputs: {}
    formula: log(2)
    expected: '0.693'
    shown: ['Given $\ln 2 \approx 0.693$, find']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ln8
    where: 'same and quiz 3: ln 8 = 3 ln 2 ≈ 2.079'
    inputs: {}
    formula: 3 * log(2)
    expected: '2.079'
    shown: ['= 3\ln 2 \approx 2.079$']
    quiz: 2
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: bell-limit
    where: 'formula "The limit of the area under the bell curve": √π/2'
    inputs: {}
    formula: integrate('exp(-x**2)', 'x', 0, 8)
    expected: '0.8862269'
    tolerance: '1e-6'
    shown: ['= \frac{\sqrt\pi}{2}']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: crossing-points
    kind: identity
    where: 'example: y² − y − 2 = (y − 2)(y + 1)'
    formula: y**2 - y - 2
    equals: (y - 2) * (y + 1)
    samples: {y: [0.0, 3.5, -4.0]}
    tolerance: 1e-9
    shown: ['$(y - 2)(y + 1) = 0$']
    source: {cite: reading2, at: 'p. 10'}
    origin: mit

  - id: horizontal-area
    where: 'formula "Horizontal slices": ∫₋₁² ((y + 2) − y²) dy = 9/2'
    inputs: {}
    formula: integrate('(x + 2) - x**2', 'x', -1, 2)
    expected: '4.5'
    tolerance: '1e-6'
    shown: ['\right]_{-1}^{2} = \frac{9}{2}']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: vertical-area
    where: 'formula "Vertical slices": the two-piece integral also gives 9/2'
    inputs: {}
    formula: integrate('2 * sqrt(x)', 'x', 0, 1) + integrate('sqrt(x) - (x - 2)', 'x', 1, 4)
    expected: '4.5'
    tolerance: '1e-6'
    shown: ['\int_1^4 \big(\sqrt x - (x - 2)\big)\,dx']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: own-area-a
    where: 'worked example "Two areas" (a) and quiz 4: ∫₀¹ (x − x²) dx = 1/6'
    inputs: {}
    formula: integrate('x - x**2', 'x', 0, 1)
    expected: '0.166667'
    tolerance: '1e-6'
    shown: ['= \tfrac12 - \tfrac13 = \tfrac16$.']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: own-area-b
    where: 'same (b): ∫₋₂² (4 − y²) dy = 32/3 ≈ 10.7'
    inputs: {}
    formula: integrate('4 - x**2', 'x', -2, 2)
    expected: '10.7'
    shown: ['= \tfrac{32}{3} \approx 10.7$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: efolds
    where: 'cosmology note: e⁶⁰ ≈ 10²⁶'
    inputs: {}
    formula: exp(60)
    expected: '1.14e26'
    tolerance: '20%'
    shown: ['$e^{60} \approx 10^{26}$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own
