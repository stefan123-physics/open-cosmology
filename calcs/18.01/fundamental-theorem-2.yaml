# Calculations on content/year-1/18.01/fundamental-theorem-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 20, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/fundamental-theorem-2.mdx
calcs:
  - id: exam-lower
    where: 'section "Better than the mean value theorem": F(4) > 1 + 4/5 = 9/5'
    inputs: {}
    formula: 1 + 4 / 5
    expected: '1.8'
    shown: ['$\frac95 < F(4) < 5$']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: mit

  - id: exam-exact
    where: 'same: in fact F(4) = 1 + ln 5 ≈ 2.61'
    inputs: {}
    formula: 1 + integrate('1 / (1 + x)', 'x', 0, 4)
    expected: '2.61'
    shown: ['$F(4) = 1 + \ln 5 \approx 2.61$']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: page-own

  - id: arctan-bound-check
    where: 'worked example "Bounding an arctangent" and quiz 3: F(1) = π/4 ≈ 0.785'
    inputs: {}
    formula: integrate('1 / (1 + x**2)', 'x', 0, 1)
    expected: '0.785'
    shown: ['$F(1) = \pi/4 \approx 0.785$']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: page-own

  - id: ftc2-example
    kind: identity
    where: 'formula "Integrate, then differentiate": d/dx ∫₁ˣ dt/t² = 1/x² (G = 1 − 1/x)'
    formula: deriv('1 - 1 / x', 'x', y, 1)
    equals: 1 / y**2
    samples: {y: [0.5, 2.0, 7.0]}
    tolerance: 1e-6
    shown: ['$G(x) = \big[-1/t\big]_1^x = 1 - \frac1x$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: ftc2-general
    kind: identity
    where: 'formula "Second fundamental theorem": d/dx ∫₀ˣ √(1 + t³) dt = √(1 + x³) (worked example), checked numerically'
    formula: (integrate('sqrt(1 + x**3)', 'x', 0, y + 1e-4) - integrate('sqrt(1 + x**3)', 'x', 0, y - 1e-4)) / 2e-4
    equals: sqrt(1 + y**3)
    samples: {y: [0.5, 1.0, 2.0]}
    tolerance: 1e-4
    shown: ['Copy the integrand: $\sqrt{1 + x^3}$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: average-x2
    where: 'quiz 4: average of x² on [0, 3] = 9/3 = 3'
    inputs: {}
    formula: integrate('x**2', 'x', 0, 3) / 3
    expected: '3'
    tolerance: '1e-6'
    shown: ['= \\frac{1}{3}\\cdot 9 = 3$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: ln10-200
    where: 'section "New functions": ln 10²⁰⁰ = 200 ln 10 ≈ 460'
    inputs: {}
    formula: 200 * log(10)
    expected: '460'
    shown: ['between about 460 and 462']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ln10-201
    where: 'same: ln 10²⁰¹ ≈ 462'
    inputs: {}
    formula: 201 * log(10)
    expected: '462'
    tolerance: '1'
    shown: ['between about 460 and 462']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: primes-count
    where: 'same: 9 × 10²⁰⁰/500 = 1.8 × 10¹⁹⁸ primes between 10²⁰⁰ and 10²⁰¹ (201-digit numbers; the notes say 200-digit)'
    inputs: {}
    formula: (1e201 - 1e200) / 500
    expected: '1.8e198'
    shown: ['more precisely $1.8\times10^{198}$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: gaussian-area
    where: 'plot caption: the area levels off at √π/2 ≈ 0.886'
    inputs: {}
    formula: sqrt(pi) / 2
    expected: '0.886'
    shown: ['√π/2 ≈ 0.886']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own
