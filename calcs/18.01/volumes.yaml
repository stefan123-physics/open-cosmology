# Calculations on content/year-1/18.01/volumes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 22, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/volumes.mdx
calcs:
  - id: ball-y2
    kind: identity
    where: 'section "The method of disks": a² − (x − a)² = 2ax − x²'
    formula: A**2 - (y - A)**2
    equals: 2 * A * y - y**2
    samples: {A: [1.0, 2.5], y: [0.3, 1.7]}
    tolerance: 1e-9
    shown: ['(x - a)^2 = 2ax - x^2']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: ball-volume
    kind: identity
    where: 'formula "Volume of a ball": ∫₀^2a π(2ax − x²) dx = (4/3)πa³'
    formula: integrate('pi * (2 * A * x - x**2)', 'x', 0, 2 * A)
    equals: 4 / 3 * pi * A**3
    samples: {A: [1.0, 2.0]}
    tolerance: 1e-6
    shown: ['= \frac43\pi a^3']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: half-ball
    where: 'plot caption: V(1) = 2π/3 ≈ 2.09 for a = 1'
    inputs: {}
    formula: pi * (1 - 1 / 3)
    expected: '2.09'
    shown: ['2π/3 ≈ 2.09']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: whole-ball
    where: 'plot caption: 4π/3 ≈ 4.19'
    inputs: {}
    formula: 4 * pi / 3
    expected: '4.19'
    shown: ['4π/3 ≈ 4.19']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: cauldron-shells
    kind: identity
    where: 'formula "Volume of the cauldron": ∫₀^√a 2π(ax − x³) dx = (π/2)a²'
    formula: integrate('2 * pi * (A * x - x**3)', 'x', 0, sqrt(A))
    equals: pi / 2 * A**2
    samples: {A: [1.0, 4.0]}
    tolerance: 1e-6
    shown: ['= \frac{\pi}{2}\,a^2']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: cauldron-disks
    kind: identity
    where: 'same by disks: ∫₀ᵃ πy dy = (π/2)a²'
    formula: integrate('pi * x', 'x', 0, A)
    equals: pi / 2 * A**2
    samples: {A: [1.0, 4.0]}
    tolerance: 1e-6
    shown: ['V = \int_0^a \pi y\,dy']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: cauldron-cm
    where: 'section "A paradox about units": (π/2) × 100² cm³ ≈ 16 litres'
    inputs: {}
    formula: pi / 2 * 100**2 / 1000
    expected: '16'
    shown: ['cm³ $\approx 16$ litres']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: cauldron-m
    where: 'same: (π/2) m³ ≈ 1600 litres'
    inputs: {}
    formula: pi / 2 * 1000
    expected: '1600'
    tolerance: '50'
    shown: ['m³ $\approx 1600$ litres']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: cone
    where: 'worked example (a): ∫₀⁴ π(3x/4)² dx = 12π ≈ 37.7 cm³'
    inputs: {}
    formula: integrate('pi * (0.75 * x)**2', 'x', 0, 4)
    expected: '37.7'
    shown: ['= 12\pi \approx 37.7$ cm³']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: own-shells
    where: 'worked example (b) and quiz 3: ∫₀¹ 2πx(x − x²) dx = π/6 ≈ 0.524'
    inputs: {}
    formula: integrate('2 * pi * x * (x - x**2)', 'x', 0, 1)
    expected: '0.524'
    shown: ['= \tfrac{\pi}{6} \approx 0.524$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: boiling-heat
    where: 'formula "Heat for the boiling cauldron": π∫₀¹(100 − 30y)y dy = 40π'
    inputs: {}
    formula: integrate('(100 - 30 * x) * pi * x', 'x', 0, 1) / pi
    expected: '40'
    tolerance: '1e-6'
    shown: ['= 40\pi\ \ (^\circ\text{C})\,\text{m}^3']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: boiling-kcal
    where: 'same: 40π × 10⁶ cal ≈ 1.26 × 10⁵ kcal'
    inputs: {}
    formula: 40 * pi * 1e6 / 1000
    expected: '1.26e5'
    shown: ['\approx 1.26\times10^5$ kcal']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: candy-bars
    where: 'same: about 500 bars at 250 kcal'
    inputs: {}
    formula: 40 * pi * 1e6 / 1000 / 250
    expected: '500'
    tolerance: '10'
    shown: ['about 500 chocolate bars']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: pipe-flow
    kind: identity
    where: 'notes'' pipe flow: ∫₀ᴿ c(R² − r²)2πr dr = πcR⁴/2'
    formula: integrate('c * (R**2 - x**2) * 2 * pi * x', 'x', 0, R)
    equals: pi * c * R**4 / 2
    samples: {c: [1.0, 3.0], R: [1.0, 0.5]}
    tolerance: 1e-6
    shown: ['give a total flow $\pi c R^4/2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: shell-sphere
    kind: identity
    where: 'cosmology note: ∫₀ᴿ 4πr²ρ dr = (4/3)πR³ρ'
    formula: integrate('4 * pi * x**2 * p', 'x', 0, R)
    equals: 4 / 3 * pi * R**3 * p
    samples: {p: [1.0, 2.7], R: [1.0, 3.0]}
    tolerance: 1e-6
    shown: ['it gives $\tfrac43\pi R^3\rho$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
