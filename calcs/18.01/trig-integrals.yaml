# Calculations on content/year-1/18.01/trig-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 27 transcript and the session 26 notes, with the page's own numbers.

page: content/year-1/18.01/trig-integrals.mdx
calcs:
  - id: half-angle
    kind: identity
    where: 'formula "Half-angle formulas": cos²θ = (1 + cos 2θ)/2'
    formula: cos(x)**2
    equals: (1 + cos(2 * x)) / 2
    samples: {x: [0.3, 1.1, 2.5]}
    tolerance: 1e-9
    shown: ['\cos^2\theta = \frac{1 + \cos 2\theta}{2}, \qquad \sin^2\theta = \frac{1 - \cos 2\theta}{2}']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: mit

  - id: odd-sine
    kind: identity
    where: 'formula "An odd power of sine": ∫ sin³x cos²x dx = −cos³x/3 + cos⁵x/5'
    formula: integrate('sin(t)**3 * cos(t)**2', 't', 0, x)
    equals: (-cos(x)**3 / 3 + cos(x)**5 / 5) - (-1 / 3 + 1 / 5)
    samples: {x: [0.4, 1.3, 2.8]}
    tolerance: 1e-6
    shown: ['= -\frac{\cos^3 x}{3} + \frac{\cos^5 x}{5} + c']
    source: {cite: reading2, at: 'pp. 3–4'}
    origin: mit

  - id: sine-cubed
    kind: identity
    where: 'section "An odd exponent": ∫ sin³x dx = −cos x + cos³x/3'
    formula: integrate('sin(t)**3', 't', 0, x)
    equals: (-cos(x) + cos(x)**3 / 3) - (-1 + 1 / 3)
    samples: {x: [0.4, 1.3, 2.8]}
    tolerance: 1e-6
    shown: ['= -\cos x + \frac{\cos^3 x}{3} + c$ (p. 4)']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: cos-squared
    kind: identity
    where: 'formula "Cosine squared": ∫ cos²x dx = x/2 + sin 2x/4'
    formula: integrate('cos(t)**2', 't', 0, x)
    equals: x / 2 + sin(2 * x) / 4
    samples: {x: [0.4, 1.3, 2.8]}
    tolerance: 1e-6
    shown: ['= \frac{x}{2} + \frac{\sin 2x}{4} + c']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: sin2cos2
    kind: identity
    where: 'formula "Sine squared times cosine squared": ∫ sin²x cos²x dx = x/8 − sin 4x/32'
    formula: integrate('sin(t)**2 * cos(t)**2', 't', 0, x)
    equals: x / 8 - sin(4 * x) / 32
    samples: {x: [0.4, 1.3, 2.8]}
    tolerance: 1e-6
    shown: ['\int \sin^2 x\cos^2 x\,dx = \frac{x}{8} - \frac{\sin 4x}{32} + c']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: secant
    kind: identity
    where: 'formula "Integral of the secant": ln|sec x + tan x|'
    formula: integrate('1 / cos(t)', 't', 0, x)
    equals: log(1 / cos(x) + tan(x))
    samples: {x: [0.3, 0.9, 1.4]}
    tolerance: 1e-6
    shown: ['\,dx = \ln|\sec x + \tan x| + c" cite']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: sqrt-integral
    kind: identity
    where: 'formula "Integral of the square root"'
    formula: integrate('sqrt(a**2 - t**2)', 't', 0, y)
    equals: a**2 / 2 * asin(y / a) + y * sqrt(a**2 - y**2) / 2
    samples: {a: [1.0, 2.0, 5.0], y: [0.5, 1.5, 2.0]}
    tolerance: 1e-6
    shown: ['\frac{a^2}{2}\arcsin\frac{y}{a} + \frac{y\sqrt{a^2 - y^2}}{2} + c" cite']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: example-a
    where: 'worked example (a): ∫₀^(π/2) sin³x dx = 2/3 (and quiz 3)'
    inputs: {}
    formula: integrate('sin(t)**3', 't', 0, pi / 2)
    expected: '0.667'
    shown: ['So the integral is $\frac{2}{3} \approx 0.667$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-b
    where: 'worked example (b) and plot caption: ∫₀^π sin²x cos²x dx = π/8'
    inputs: {}
    formula: integrate('sin(t)**2 * cos(t)**2', 't', 0, pi)
    expected: '0.393'
    shown: ['= \frac{\pi}{8} \approx 0.393$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): area for a = 2, b = 1 is π/3 + √3/2 ≈ 1.913'
    inputs: {}
    formula: integrate('sqrt(4 - t**2)', 't', 0, 1)
    expected: '1.913'
    shown: ['\approx 1.047 + 0.866 = 1.913']
    source: {cite: reading2, at: 'pp. 9–10'}
    origin: page-own

  - id: example-c-sector
    where: 'same: sector π/3 ≈ 1.047'
    inputs: {}
    formula: 4 / 2 * asin(0.5)
    expected: '1.047'
    shown: ['= \frac{\pi}{3} + \frac{\sqrt 3}{2}']
    source: {cite: reading2, at: 'p. 10'}
    origin: page-own

  - id: session-number
    kind: fact
    where: 'introduction: the notes are numbered Lecture 26'
    value: '26'
    shown: ['are numbered Lecture 26']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit
