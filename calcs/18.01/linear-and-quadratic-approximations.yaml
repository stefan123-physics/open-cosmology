# Calculations on content/year-1/18.01/linear-and-quadratic-approximations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 9 (David Jerison): transcript and lecture notes, with the page's own numbers.

page: content/year-1/18.01/linear-and-quadratic-approximations.mdx
calcs:
  - id: ln-tangent-at-1
    kind: identity
    where: 'formula "Logarithm near 1": the slope of ln x at 1 is 1'
    formula: deriv('log(x)', 'x', 1.0)
    equals: 1.0 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['\ln x \approx 0 + 1\cdot(x - 1) = x - 1']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: power-slope-at-0
    kind: identity
    where: 'table: the derivative of (1 + x)^r at 0 is r'
    formula: deriv('(1 + x)**r', 'x', 0.0)
    equals: r
    samples: {r: [0.5, -0.5, 3.0, 10.0]}
    tolerance: 1e-6
    shown: ['(1 + x)^r \approx 1 + rx" cite']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: example3-slope
    kind: identity
    where: 'formula "Combining two approximations": the slope of e^(−3x)(1 + x)^(−1/2) at 0 is −7/2'
    formula: deriv('exp(-3*x) * (1 + x)**(-0.5)', 'x', 0.0)
    equals: -3.5 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['\approx 1 - \tfrac72 x" cite']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: example3-product
    kind: identity
    where: 'formula "Combining two approximations": (1 − 3x)(1 − x/2) = 1 − 7x/2 + 3x²/2'
    formula: (1 - 3 * x) * (1 - x / 2)
    equals: 1 - 3.5 * x + 1.5 * x**2
    samples: {x: [0.1, -0.4, 2.0]}
    tolerance: 1e-12
    shown: ['= 1 - \tfrac72 x + \tfrac32 x^2']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: notes-example2-slope
    kind: identity
    where: 'notes example with e^(−2x): slope −5/2 at 0'
    formula: deriv('exp(-2*x) * (1 + x)**(-0.5)', 'x', 0.0)
    equals: -2.5 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['$e^{-2x}$ and get $1 - \tfrac52 x$']
    source: {cite: reading1, at: 'pp. 2–3'}
    origin: mit

  - id: ln11-true
    where: 'sections "Hard on the left" and "Quadratic approximation": ln 1.1 = 0.0953'
    inputs: {}
    formula: log(1.1)
    expected: '0.0953'
    shown: ['The true value is $\ln 1.1 = 0.0953\ldots$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: ln11-quadratic
    where: 'section "Quadratic approximation": 1/10 − (1/2)(1/10)² = 0.095'
    inputs: {}
    formula: 0.1 - 0.5 * 0.1**2
    expected: '0.095'
    shown: ['= 0.1 - 0.005 = 0.095$']
    source: {cite: reading2, at: 'p. 10'}
    origin: mit

  - id: quiz-ln105
    where: 'quiz 2: ln 1.05 ≈ 0.05 (true 0.0488)'
    inputs: {}
    formula: log(1.05)
    expected: '0.0488'
    shown: ['(The true value is about 0.0488.)']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: quiz-ln105-linear
    where: 'quiz 2: the linear estimate of ln 1.05 is 0.05'
    inputs: {}
    formula: 0.05
    expected: '0.05'
    shown: ['$\\ln 1.05 = \\ln(1 + 0.05) \\approx 0.05$']
    quiz: 1
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: gps-ratio
    where: 'section "GPS": v²/c² ≈ 10⁻¹⁰ for v = 4 km/s'
    inputs: {v: 4 km/s, c: 3e5 km/s}
    formula: (v / c)**2
    expected: '1.8e-10'
    tolerance: 0.1e-10
    shown: ['$v^2/c^2$ is about $10^{-10}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: time-dilation-linear
    kind: identity
    where: 'formula "Time dilation, linear approximation": the slope of (1 − u)^(−1/2) at 0 is 1/2'
    formula: deriv('(1 - u)**(-0.5)', 'u', 0.0)
    equals: 0.5 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['T'' \approx T\left(1 + \frac12\,\frac{v^2}{c^2}\right)']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: sqrt102-linear
    where: 'worked example (a): √1.02 ≈ 1.01'
    inputs: {}
    formula: 1 + 0.5 * 0.02
    expected: '1.01'
    shown: ['\approx 1 + \tfrac12 \times 0.02 = 1.01$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: sqrt102-true
    where: 'worked example (a): √1.02 = 1.00995…'
    inputs: {}
    formula: sqrt(1.02)
    expected: '1.00995'
    shown: ['The true value is $1.00995\ldots$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: example-b-slope
    kind: identity
    where: 'worked example (b): √(1 + 4x) e^(−x) ≈ 1 + x (slope 1 at 0)'
    formula: deriv('sqrt(1 + 4*x) * exp(-x)', 'x', 0.0)
    equals: 1.0 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['the product is $\approx 1 + 2x - x = 1 + x$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: fast-clock-ratio
    where: 'worked example (c): (8.0/(3.0 × 10⁵))² ≈ 7.1 × 10⁻¹⁰'
    inputs: {v: 8.0 km/s, c: 3.0e5 km/s}
    formula: (v / c)**2
    expected: '7.1e-10'
    shown: ['\approx 7.1 \times 10^{-10}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: fast-clock-day
    where: 'worked example (c): ½ × 7.1 × 10⁻¹⁰ × 86,400 s ≈ 3.1 × 10⁻⁵ s, about 31 microseconds a day'
    inputs: {v: 8.0 km/s, c: 3.0e5 km/s, t: 86400 s}
    formula: 0.5 * (v / c)**2 * t
    expected: 3.1e-5 s
    shown: ['\approx 3.1 \times 10^{-5}$ s: about 31 microseconds a day']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: quadratic-exact-for-quadratic
    kind: identity
    where: 'section "Where the ½ comes from": f(0) + f′(0)x + f″(0)x²/2 reproduces a₀ + a₁x + a₂x²'
    formula: deriv('a0 + a1*x + a2*x**2', 'x', 0.0) - a1
    equals: 0 * a0
    samples: {a0: [1.0, -2.0], a1: [0.5, 3.0], a2: [2.0, -1.5]}
    tolerance: 1e-6
    shown: ['so $a_2 = f''''(0)/2$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: ln-second-derivative
    kind: identity
    where: 'quadratic list: f″(0) = −1 for ln(1 + x)'
    formula: deriv('1 / (1 + x)', 'x', 0.0)
    equals: -1.0 + 0 * x0
    samples: {x0: [0.0]}
    tolerance: 1e-6
    shown: ['\ln(1 + x) \approx x - \tfrac12 x^2, \quad (1 + x)^r']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: example5-product
    kind: identity
    where: 'formula "A quadratic product": (1 − 2x + 2x²)(1 − x/2 + 3x²/8) agrees with 1 − 5x/2 + 27x²/8 up to x²'
    formula: ((1 - 2 * x + 2 * x**2) * (1 - x / 2 + 3 * x**2 / 8) - (1 - 2.5 * x + 27 * x**2 / 8)) / x**3
    equals: -1.75 + 0.75 * x
    samples: {x: [0.1, 0.5, -0.3]}
    tolerance: 1e-9
    shown: ['\approx 1 - \tfrac52 x + \tfrac{27}{8}\,x^2']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: gps-quadratic-coefficient
    where: 'section "The quadratic list": the quadratic coefficient of (1 − u)^(−1/2) is r(r − 1)/2 = 3/8'
    inputs: {}
    formula: (-0.5) * (-0.5 - 1) / 2
    expected: '0.375'
    shown: ['is $\tfrac38\,(v^2/c^2)^2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: e01-quadratic
    where: 'worked example "Quadratic estimates" (a) and quiz 5: e^0.1 ≈ 1.105'
    inputs: {}
    formula: 1 + 0.1 + 0.5 * 0.1**2
    expected: '1.105'
    shown: ['$e^{0.1} \approx 1 + 0.1 + \tfrac12(0.1)^2 = 1.105$']
    quiz: 4
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: e01-true
    where: 'worked example "Quadratic estimates" (a): e^0.1 = 1.10517…'
    inputs: {}
    formula: exp(0.1)
    expected: '1.10517'
    shown: ['The true value is $1.10517\ldots$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: sqrt102-quadratic
    where: 'worked example "Quadratic estimates" (b): 1 + 0.01 − (1/8)(0.02)² = 1.00995'
    inputs: {}
    formula: 1 + 0.01 - (0.02)**2 / 8
    expected: '1.00995'
    shown: ['= 1.00995$. The error']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: sqrt102-errors
    where: 'worked example "Quadratic estimates" (b): the linear error is about 5 × 10⁻⁵, the quadratic one under 10⁻⁶'
    inputs: {}
    formula: 1.01 - sqrt(1.02)
    expected: '5e-5'
    tolerance: 0.1e-5
    shown: ['The error drops from about $5 \times 10^{-5}$ to under $10^{-6}$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: doppler-quadratic
    where: 'cosmology callout: (1 + b/2 - b**2/8)(1 + b/2 + 3b**2/8) has b**2 coefficient -1/8 + 1/4 + 3/8 = 1/2, so z = b + b**2/2'
    inputs: {}
    formula: -1/8 + 1/4 + 3/8
    expected: '0.5'
    shown: ['$z \approx \beta + \tfrac12\beta^2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
