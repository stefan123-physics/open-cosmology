  # Part (b) is part (a) with the letters renamed: checked against a factored form of the same left side.
  - id: p6-b-equation
    kind: identity
    answer: p6-b
    where: 'Problem 6(b), answer box: the left side of the differential equation, against the factored form (x − y/y′)² (1 + y′²), which uses y − x y′ = −y′ (x − y/y′)'
    formula: (x - y/yp)**2 + (y - x*yp)**2
    equals: (x - y/yp)**2 * (1 + yp**2)
    samples:
      x: [1, 3, 2.2, 1.4]
      y: [1, 1.5, 3, 2.6]
      yp: [-1, -2, -0.5, -1.3]
    tolerance: 1e-10
    shown: ['\left(x - \frac{y}{y''}\right)^2 + \left(y - x\,y''\right)^2 = L^2']
