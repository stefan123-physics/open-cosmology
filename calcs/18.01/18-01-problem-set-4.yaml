  # Part (d): the hypocycloid makes the first factor zero and the left side of (b) equal to L².
  - id: p6-d-first-factor
    kind: identity
    where: 'Problem 6(d), formula "The first factor on the hypocycloid": x + y/y′³ = 0 with y′ from a numerical derivative of y = (L^(2/3) − x^(2/3))^(3/2) (checked as 1 + (x + y/y′³) = 1)'
    formula: 1 + x + (L**(2/3) - x**(2/3))**1.5 / deriv('(L**(2/3) - t**(2/3))**1.5', 't', x, 1)**3
    equals: 1 + 0*x
    samples:
      x: [0.2, 0.5, 1.0, 0.125]
      L: [1.0, 1.7, 2.5, 1.0]
    tolerance: 1e-5
    shown: ['x + \frac{y}{y''^3} = x + y \cdot \left(-\frac{x}{y}\right) = 0']
    source: {cite: mit, at: 'Part II, Problem 6(d) (our own solution)'}
    origin: page-own

  - id: p6-d-length
    kind: identity
    where: 'Problem 6(d), formula "The hypocycloid satisfies the equation of part (b)": the left side of (b) on the hypocycloid, with y′ from a numerical derivative, equals L²'
    formula: (x - (L**(2/3) - x**(2/3))**1.5 / deriv('(L**(2/3) - t**(2/3))**1.5', 't', x, 1))**2 + ((L**(2/3) - x**(2/3))**1.5 - x * deriv('(L**(2/3) - t**(2/3))**1.5', 't', x, 1))**2
    equals: L**2
    samples:
      x: [0.2, 0.5, 1.0, 0.125]
      L: [1.0, 1.7, 2.5, 1.0]
    tolerance: 1e-5
