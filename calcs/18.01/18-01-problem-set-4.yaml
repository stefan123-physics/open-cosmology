  # Part (c): G = y/y'^3 checked on y = x^2, where d/dx of the left side of (b) is known in closed form.
  # Left side of (b) for y = x²: x²/4 + x⁴, derivative x/2 + 4x³. Factored form: 2 (x + G)(x y' − y) y'' with y' = 2x, y'' = 2.
  - id: p6-c-factor
    kind: identity
    answer: p6-c
    where: 'Problem 6(c), answer box: G = y/y′³, found back from the numerical derivative of the left side of (b) along the curve y = t^k (k = 3): G = derivative / (2 (x y′ − y) y″) − x'
    formula: y/yp**3
    equals: deriv('(t - t**3/(3*t**2))**2 + (t**3 - t*3*t**2)**2', 't', (y/yp)*3, 1) / (2 * (((y/yp)*3) * yp - y) * (6 * (y/yp)*3)) - (y/yp)*3
    samples:
      y: [1.0, 8.0, 0.125]
      yp: [3.0, 12.0, 0.75]
    tolerance: 1e-5
    shown: ['2\left(x + \frac{y}{y''^3}\right)(x\,y'' - y)\,y'''' = 0']
    source: {cite: mit, at: 'Part II, Problem 6(c) (our own solution)'}
    origin: page-own

