# Calculations on content/year-1/18.01/antiderivatives.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 15, notes and transcript, with the page's own numbers.
# Antiderivatives are checked by differentiating them back at sample points.

page: content/year-1/18.01/antiderivatives.mdx
calcs:
  - id: cube-root-slope
    where: 'formula "The differential at 64": ⅓ · 64^(−2/3) = 1/48'
    inputs: {}
    formula: (1 / 3) * 64**(-2 / 3)
    expected: '0.0208333'
    shown: ['= \tfrac{1}{48}\,dx']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: cube-root-641
    where: 'section "Linear approximation in differentials": 4 + 1/480 ≈ 4.002'
    inputs: {}
    formula: 4 + 1 / 480
    expected: '4.002'
    shown: ['4 + 1/480 \approx 4.002']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: mit

  - id: cube-root-641-true
    where: 'check: the true 64.1^(1/3) also rounds to 4.002'
    inputs: {}
    formula: 64.1**(1 / 3)
    expected: '4.002'
    shown: ['4 + 1/480 \approx 4.002']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: mit

  - id: sqrt101-estimate
    where: 'worked example "√101 again" and quiz 1: 10 + 1/20 = 10.05'
    inputs: {}
    formula: 10 + 1 / (2 * sqrt(100))
    expected: '10.05'
    shown: ['$\sqrt{101} \approx 10 + 1/20 = 10.05$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: sqrt101-true
    where: 'same worked example: the true value 10.04988'
    inputs: {}
    formula: sqrt(101)
    expected: '10.04988'
    shown: ['The true value is $10.04988$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: sine
    kind: identity
    where: 'formula "Sine": d/dx(−cos x) = sin x'
    formula: deriv('-cos(x)', 'x', y, 1)
    equals: sin(y)
    samples: {y: [0.3, 1.2, 2.5, 4.0]}
    tolerance: 1e-6
    shown: ['\int \sin x\,dx = -\cos x + c']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: power
    kind: identity
    where: 'formula "Powers": d/dx x^(a+1)/(a+1) = x^a'
    formula: deriv('x**(p + 1) / (p + 1)', 'x', y, 1)
    equals: y**p
    samples: {y: [0.5, 1.7, 3.0], p: [2.0, -0.5, -3.0]}
    tolerance: 1e-6
    shown: ['\int x^a\,dx = \frac{x^{a+1}}{a+1} + c']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: log-negative
    kind: identity
    where: 'formula "The exceptional power": for x < 0, d/dx ln(−x) = 1/x'
    formula: deriv('log(-x)', 'x', y, 1)
    equals: 1 / y
    samples: {y: [-0.4, -2.0, -7.5]}
    tolerance: 1e-6
    shown: ['\frac{1}{-x}\cdot(-1) = \frac1x']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: sec-squared
    kind: identity
    where: 'formula "Three more": d/dx tan x = sec² x'
    formula: deriv('tan(x)', 'x', y, 1)
    equals: 1 / cos(y)**2
    samples: {y: [0.2, 0.9, -1.1]}
    tolerance: 1e-6
    shown: ['\int \sec^2 x\,dx = \tan x + c']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: arcsin
    kind: identity
    where: 'formula "Three more": d/dx sin⁻¹ x = 1/√(1 − x²)'
    formula: deriv('asin(x)', 'x', y, 1)
    equals: 1 / sqrt(1 - y**2)
    samples: {y: [0.1, 0.5, -0.8]}
    tolerance: 1e-6
    shown: ['\int\frac{dx}{\sqrt{1 - x^2}} = \sin^{-1}x + c']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: arctan
    kind: identity
    where: 'formula "Three more": d/dx tan⁻¹ x = 1/(1 + x²)'
    formula: deriv('atan(x)', 'x', y, 1)
    equals: 1 / (1 + y**2)
    samples: {y: [0.1, 1.5, -3.0]}
    tolerance: 1e-6
    shown: ['\int\frac{dx}{1 + x^2} = \tan^{-1}x + c']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: substitution
    kind: identity
    where: 'formula "Substitution": d/dx (x⁴ + 2)⁶/24 = x³(x⁴ + 2)⁵'
    formula: deriv('(x**4 + 2)**6 / 24', 'x', y, 1)
    equals: y**3 * (y**4 + 2)**5
    samples: {y: [0.3, 0.8, -1.1]}
    tolerance: 1e-6
    shown: ['= \frac{(x^4 + 2)^6}{24} + c']
    source: {cite: reading2, at: 'pp. 6–7'}
    origin: mit

  - id: sqrt-guess
    kind: identity
    where: 'section "Advanced guessing": d/dx √(1 + x²) = x/√(1 + x²)'
    formula: deriv('sqrt(1 + x**2)', 'x', y, 1)
    equals: y / sqrt(1 + y**2)
    samples: {y: [0.3, 2.0, -1.5]}
    tolerance: 1e-6
    shown: ['the answer is $\sqrt{1 + x^2} + c$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: exp-six
    kind: identity
    where: 'section "Advanced guessing": d/dx ⅙ e^(6x) = e^(6x)'
    formula: deriv('exp(6 * x) / 6', 'x', y, 1)
    equals: exp(6 * y)
    samples: {y: [0.1, -0.5, 0.4]}
    tolerance: 1e-6
    shown: ['$\tfrac16 e^{6x} + c$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: gaussian
    kind: identity
    where: 'section "Advanced guessing" and quiz 4: d/dx (−½ e^(−x²)) = x e^(−x²)'
    formula: deriv('-exp(-x**2) / 2', 'x', y, 1)
    equals: y * exp(-y**2)
    samples: {y: [0.2, 1.0, -1.7]}
    tolerance: 1e-6
    shown: ['the answer is $-\tfrac12 e^{-x^2} + c$']
    source: {cite: reading2, at: 'pp. 7–8'}
    origin: mit

  - id: log-log
    kind: identity
    where: 'section "Advanced guessing": d/dx ln(ln x) = 1/(x ln x)'
    formula: deriv('log(log(x))', 'x', y, 1)
    equals: 1 / (y * log(y))
    samples: {y: [1.5, 3.0, 10.0]}
    tolerance: 1e-6
    shown: ['= \ln(\ln x) + c$ (transcript']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: own-substitution
    kind: identity
    where: 'worked example "Three antiderivatives": d/dx (x³ + 1)⁵/15 = x²(x³ + 1)⁴'
    formula: deriv('(x**3 + 1)**5 / 15', 'x', y, 1)
    equals: y**2 * (y**3 + 1)**4
    samples: {y: [0.2, 0.7, -0.6]}
    tolerance: 1e-6
    shown: ['\dfrac{(x^3 + 1)^5}{15} + c']
    source: {cite: reading2, at: 'pp. 6–7'}
    origin: page-own

  - id: own-cos
    kind: identity
    where: 'same worked example: d/dx ⅓ sin 3x = cos 3x'
    formula: deriv('sin(3 * x) / 3', 'x', y, 1)
    equals: cos(3 * y)
    samples: {y: [0.2, 1.1, -0.9]}
    tolerance: 1e-6
    shown: ['\int\cos 3x\,dx = \tfrac13\sin 3x + c']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: own-log
    kind: identity
    where: 'same worked example: d/dx ½ ln(x² + 4) = x/(x² + 4)'
    formula: deriv('log(x**2 + 4) / 2', 'x', y, 1)
    equals: y / (y**2 + 4)
    samples: {y: [0.5, 2.0, -3.0]}
    tolerance: 1e-6
    shown: ['$\tfrac12\ln(x^2 + 4) + c$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: two-answers
    kind: identity
    where: 'formula "The two answers differ by a constant": ½ sin² x + ½ cos² x = ½'
    formula: sin(y)**2 / 2 - (-cos(y)**2 / 2)
    equals: 0.5 + 0 * y
    samples: {y: [0.3, 1.9, 4.4]}
    tolerance: 1e-12
    shown: ['= \tfrac12\left(\sin^2 x + \cos^2 x\right) = \tfrac12']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: flat-universe
    kind: identity
    where: 'cosmology note: d/da (⅔ a^(3/2)) = √a'
    formula: deriv('2 / 3 * x**1.5', 'x', y, 1)
    equals: sqrt(y)
    samples: {y: [0.2, 1.0, 4.0]}
    tolerance: 1e-6
    shown: ['$\tfrac23 a^{3/2} = Ct + c$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: constants-differ
    kind: identity
    where: 'section "Two answers, one family": ½ sin²x + c₁ = −½ cos²x + c₂ needs c₂ − c₁ = ½ (the lecture says c₁ − c₂)'
    formula: (sin(y)**2 / 2 + c1) - (-cos(y)**2 / 2)
    equals: c1 + 0.5
    samples: {y: [0.4, 2.2], c1: [0.0, 3.0]}
    tolerance: 1e-12
    shown: ['with $c_2 - c_1 = \tfrac12$']
    source: {cite: reading1, at: 'p. 4'}
    origin: slip
    note: 'Transcript p. 9 says c1 - c2 = 1/2; the notes and the page have c2 - c1 = 1/2.'
