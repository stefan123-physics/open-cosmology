# Calculations on content/year-1/18.01/mean-value-theorem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 14, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/mean-value-theorem.mdx
calcs:
  - id: quiz-newton-square
    where: 'quiz 1: (10⁻³)² = 10⁻⁶'
    inputs: {}
    formula: (1e-3)**2
    expected: '1e-6'
    tolerance: '1%'
    shown: ['$(10^{-3})^2 = 10^{-6}$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: newton-x1
    where: 'worked example "Watching the error square": x₁ = 3 − 2/6 ≈ 2.6667'
    inputs: {}
    formula: 3 - (3**2 - 7) / (2 * 3)
    expected: '2.6667'
    shown: ['$x_1 \approx 2.6667$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: newton-x2
    where: 'same worked example: x₂ ≈ 2.645833'
    inputs: {x1: 2.6666666666666667}
    formula: x1 - (x1**2 - 7) / (2 * x1)
    expected: '2.645833'
    shown: ['$x_2 \approx 2.645833$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: newton-x3
    where: 'same worked example: x₃ ≈ 2.6457513'
    inputs: {x2: 2.6458333333333333}
    formula: x2 - (x2**2 - 7) / (2 * x2)
    expected: '2.6457513'
    shown: ['$x_3 \approx 2.6457513$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: sqrt7
    where: 'same worked example: √7 ≈ 2.6457513'
    inputs: {}
    formula: sqrt(7)
    expected: '2.6457513'
    shown: ['$\sqrt7 \approx 2.6457513$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: error-0
    where: 'same worked example, step "Errors": E₀ ≈ 0.35'
    inputs: {}
    formula: 3 - sqrt(7)
    expected: '0.35'
    shown: ['$E_0 \approx 0.35$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: error-1
    where: 'same step: E₁ ≈ 0.021'
    inputs: {}
    formula: 8 / 3 - sqrt(7)
    expected: '0.021'
    shown: ['$E_1 \approx 0.021$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: error-2
    where: 'same step: E₂ ≈ 8.2 × 10⁻⁵'
    inputs: {x2: 2.6458333333333333}
    formula: x2 - sqrt(7)
    expected: '8.2e-5'
    shown: ['$E_2 \approx 8.2\times10^{-5}$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: error-3
    where: 'same step: E₃ ≈ 1.3 × 10⁻⁹'
    inputs: {x2: 2.6458333333333333}
    formula: (x2 - (x2**2 - 7) / (2 * x2)) - sqrt(7)
    expected: '1.3e-9'
    tolerance: '5%'
    shown: ['$E_3 \approx 1.3\times10^{-9}$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: error-factor
    where: 'same step: each error about 0.19 times the square of the one before; 1/(2√7)'
    inputs: {}
    formula: 1 / (2 * sqrt(7))
    expected: '0.19'
    shown: ['about $0.19$ times the square']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: error-ratio-check
    where: 'same step: E₂/E₁² ≈ 0.19 (checks the claim on the actual errors)'
    inputs: {x2: 2.6458333333333333}
    formula: (x2 - sqrt(7)) / (8 / 3 - sqrt(7))**2
    expected: '0.19'
    shown: ['about $0.19$ times the square']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: cycle-x1
    where: 'section "How accurate is Newton''s method?": for x³ − 2x + 2 from x₀ = 0, x₁ = 0 − 2/(−2) = 1'
    inputs: {x0: 0}
    formula: x0 - (x0**3 - 2 * x0 + 2) / (3 * x0**2 - 2)
    expected: '1'
    tolerance: '1e-12'
    shown: ['$x_1 = 0 - 2/(-2) = 1$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: cycle-x2
    where: 'same: x₂ = 1 − 1/1 = 0'
    inputs: {x1: 1}
    formula: x1 - (x1**3 - 2 * x1 + 2) / (3 * x1**2 - 2)
    expected: '0'
    tolerance: '1e-12'
    shown: ['$x_2 = 1 - 1/1 = 0$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: boston-la
    where: 'section "The mean value theorem": 3000/6 = 500 miles per hour (the transcript says "times")'
    inputs: {d: 3000 mile, t: 6 hour}
    formula: d / t
    expected: 500 mile/hour
    shown: ['$3000/6 = 500$ miles per hour']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: slip
    note: 'The transcript says "3,000 miles times 6 hours"; the answer 500 mph is right, so it means divided by.'

  - id: boston-chicago
    where: 'same section: the notes'' 1000 miles in 3 hours, 1000/3 mph'
    inputs: {d: 1000 mile, t: 3 hour}
    formula: d / t
    expected: 333.3 mile/hour
    shown: ['exactly $1000/3$ mph']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: x-cubed-secant
    where: 'plot caption and quiz 3: secant slope of x³ on [0, 2] = (8 − 0)/2 = 4'
    inputs: {}
    formula: (2**3 - 0**3) / (2 - 0)
    expected: '4'
    tolerance: '1e-12'
    shown: ['$(8 - 0)/2 = 4$', '(slope 4)']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: x-cubed-c
    where: 'plot caption and quiz 3: 3c² = 4 gives c = 2/√3 ≈ 1.15'
    inputs: {}
    formula: 2 / sqrt(3)
    expected: '1.15'
    shown: ['c = 2/√3 ≈ 1.15']
    quiz: 2
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: x-cubed-c-check
    where: 'plot: the tangent at c has slope 3c² = 4 and passes through (c, c³) = (1.1547, 1.5396)'
    inputs: {}
    formula: 3 * (2 / sqrt(3))**2
    expected: '4'
    tolerance: '1e-9'
    shown: ['f′(c) = 3c² = 4']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: x-cubed-c-height
    where: 'plot: c³ ≈ 1.5396 (the tangent line and point c)'
    inputs: {}
    formula: (2 / sqrt(3))**3
    expected: '1.5396'
    shown: ['+ 1.5396']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: sqrt101-upper
    where: 'worked example "Pinning down √101": upper bound 1/20 = 0.05'
    inputs: {}
    formula: 1 / (2 * 10)
    expected: '0.05'
    shown: ['< 0.05$']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: sqrt101-lower
    where: 'same worked example: lower bound 1/22 ≈ 0.045'
    inputs: {}
    formula: 1 / (2 * 11)
    expected: '0.045'
    shown: ['$0.045 < \sqrt{101} - 10']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: sqrt101-actual
    where: 'same worked example: in fact √101 − 10 = 0.04988'
    inputs: {}
    formula: sqrt(101) - 10
    expected: '0.04988'
    shown: ['(In fact it is $0.04988$.)']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: camera-speed
    where: 'worked example "Average-speed cameras" and quiz 4: 12 km / 0.1 h = 120 km/h'
    inputs: {d: 12 km, t: 6 minute}
    formula: d / t
    expected: 120 km/hour
    shown: ['$12\ \text{km} / 0.1\ \text{h} = 120$ km/h']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: exp-half
    where: 'section "Proving inequalities": e^0.5 ≈ 1.6487'
    inputs: {}
    formula: exp(0.5)
    expected: '1.6487'
    shown: ['$e^{0.5} \approx 1.6487$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: exp-bound-2
    where: 'same: the second bound 1 + 0.5 + 0.5²/2 = 1.625'
    inputs: {}
    formula: 1 + 0.5 + 0.5**2 / 2
    expected: '1.625'
    shown: ['$1.5$ and $1.625$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: ln-one-point-five
    where: 'worked example "ln(1 + x) < x": ln 1.5 ≈ 0.405'
    inputs: {}
    formula: log(1.5)
    expected: '0.405'
    shown: ['$\ln 1.5 \approx 0.405 < 0.5$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ln-derivative
    kind: identity
    where: 'worked example "ln(1 + x) < x": f′(x) = 1 − 1/(1 + x) = x/(1 + x)'
    formula: deriv('x - log(1 + x)', 'x', y, 1)
    equals: y / (1 + y)
    samples: {y: [0.1, 0.5, 2.0, 7.0]}
    tolerance: 1e-6
    shown: ['= \dfrac{x}{1 + x} > 0']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: exp-g-derivative
    kind: identity
    where: 'section "Proving inequalities": g′(x) = eˣ − (1 + x) for g = eˣ − (1 + x + x²/2)'
    formula: deriv('exp(x) - (1 + x + x**2 / 2)', 'x', y, 1)
    equals: exp(y) - (1 + y)
    samples: {y: [0.1, 0.5, 2.0]}
    tolerance: 1e-6
    shown: ["$g'(x) = e^x - (1 + x)$"]
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: flat-age
    kind: fact
    where: 'cosmology note: a flat universe of matter alone is 2/3 of a Hubble time old (from 8.286 Lecture 8)'
    value: 0.6667
    shown: ['exactly $\tfrac23$ of it']
    source: {cite: guth-age, at: 'Lecture 8'}
    origin: page-own

  - id: error-ratio-first
    where: 'worked example "Watching the error square": E₁/E₀² ≈ 0.17 at the first step'
    inputs: {}
    formula: (8 / 3 - sqrt(7)) / (3 - sqrt(7))**2
    expected: '0.17'
    shown: ['$0.17$ at the first step']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
