# Calculations on content/year-1/18.01/lhopital-rule.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 35 transcript and the notes numbered Lecture 34, with the page's own numbers.

page: content/year-1/18.01/lhopital-rule.mdx
calcs:
  - id: x10-limit
    where: 'section "Where the rule comes from": (x¹⁰ − 1)/(x² − 1) → 5 at x = 1'
    inputs: {}
    formula: ((1 + 1e-7)**10 - 1) / ((1 + 1e-7)**2 - 1)
    expected: '5'
    tolerance: '1e-5'
    shown: ['so the limit is 5']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: mit

  - id: sine-ratio
    where: 'quiz 1: sin 5x/sin 2x → 5/2'
    inputs: {}
    formula: sin(5 * 1e-6) / sin(2 * 1e-6)
    expected: '2.5'
    tolerance: '1e-6'
    shown: ['= \frac{5}{2}$ (p. 4)']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: cos-limit
    where: 'formula "Applying the rule twice": (cos x − 1)/x² → −1/2'
    inputs: {}
    formula: (cos(1e-4) - 1) / 1e-8
    expected: '-0.5'
    tolerance: '1e-4'
    shown: ['\sim \frac{-\cos x}{2} \to -\frac{1}{2} \quad (x \to 0)']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: x-log-x
    where: 'formula "Zero times infinity": x ln x → 0'
    inputs: {}
    formula: 1e-9 * log(1e-9)
    expected: '0'
    tolerance: '1e-6'
    shown: ['\lim_{x \to 0^+}(-x) = 0']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: example-a
    where: 'worked example (a): (eˣ − 1 − x)/x² → 1/2'
    inputs: {}
    formula: (exp(1e-4) - 1 - 1e-4) / 1e-8
    expected: '0.5'
    tolerance: '1e-3'
    shown: ['again, $\frac{e^x}{2} \to \frac{1}{2}$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: example-c
    where: 'worked example (c): (1 + 1/x)^x → e ≈ 2.718'
    inputs: {}
    formula: (1 + 1e-6)**(1e6)
    expected: '2.718'
    shown: ['So the limit is $e^1 = e \approx 2.718$']
    source: {cite: reading2, at: 'pp. 9–10'}
    origin: page-own

  - id: example-d
    where: 'worked example (d): (e^0.1 − 1.1)/0.01 ≈ 0.517'
    inputs: {}
    formula: (exp(0.1) - 1.1) / 0.01
    expected: '0.517'
    shown: ['\frac{1.105171 - 1.1}{0.01} \approx 0.517$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: e-point-one
    where: 'same: e^0.1 = 1.105171'
    inputs: {}
    formula: exp(0.1)
    expected: '1.105171'
    shown: ['\frac{1.105171 - 1.1}{0.01}']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: artanh-limit
    where: 'cosmology note: artanh(u)/u → 1 as u → 0'
    inputs: {}
    formula: 0.5 * log((1 + 1e-5) / (1 - 1e-5)) / 1e-5
    expected: '1'
    tolerance: '1e-6'
    shown: ['\to \frac{1/(1 - u^2)}{1} \to 1$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
