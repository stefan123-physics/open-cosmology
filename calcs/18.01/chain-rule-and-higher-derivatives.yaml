# Calculations on content/year-1/18.01/chain-rule-and-higher-derivatives.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 4 (recorded lecture given by Haynes Miller, substituting for David Jerison): transcript and notes.

page: content/year-1/18.01/chain-rule-and-higher-derivatives.mdx
calcs:
  - id: product-example
    kind: identity
    where: 'formula "A product": d/dx (xⁿ sin x) = n xⁿ⁻¹ sin x + xⁿ cos x, for n = 3'
    formula: deriv('x**3 * sin(x)', 'x', x0)
    equals: 3 * x0**2 * sin(x0) + x0**3 * cos(x0)
    samples: {x0: [0.4, 1.3, 2.2]}
    tolerance: 1e-6
    shown: ['nx^{n-1}\sin x + x^n\cos x']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  - id: product-change
    kind: identity
    where: 'formula "Change of a product": Δ(uv) = (Δu) v(x+Δx) + u(x) Δv, for u = x², v = sin x'
    formula: (x + h)**2 * sin(x + h) - x**2 * sin(x)
    equals: ((x + h)**2 - x**2) * sin(x + h) + x**2 * (sin(x + h) - sin(x))
    samples: {x: [0.5, 1.2, 2.0], h: [0.1, 0.3, 0.05]}
    tolerance: 1e-12
    shown: ['= (\Delta u)\,v(x+\Delta x) + u(x)\,(\Delta v)']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: quotient-change
    kind: identity
    where: 'formula "Change of a quotient", for u = x, v = x² + 1'
    formula: (x + h) / ((x + h)**2 + 1) - x / (x**2 + 1)
    equals: (h * (x**2 + 1) - x * ((x + h)**2 - x**2)) / (((x + h)**2 + 1) * (x**2 + 1))
    samples: {x: [0.5, 1.2, 2.0], h: [0.1, 0.3, 0.05]}
    tolerance: 1e-12
    shown: ['\frac{(\Delta u)\,v - u\,(\Delta v)}{(v + \Delta v)\,v}']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: negative-power
    kind: identity
    where: 'formula "Negative powers": d/dx x⁻ⁿ = −n x⁻ⁿ⁻¹, for n = 3'
    formula: deriv('x**(-3)', 'x', x0)
    equals: -3 * x0**(-4)
    samples: {x0: [0.7, 1.5, 3.0]}
    tolerance: 1e-6
    shown: ['= -n\,x^{-n-1}']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: quiz-negative-power
    where: 'quiz 3: d/dx x⁻³ = −3x⁻⁴ (the coefficient)'
    inputs: {}
    formula: -3
    expected: '-3'
    shown: ['$-3x^{-3-1} = -3x^{-4}$']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: sin-tenth
    kind: identity
    where: 'formula "First example": d/dt (sin t)¹⁰ = 10 sin⁹ t cos t'
    formula: deriv('sin(t)**10', 't', t0)
    equals: 10 * sin(t0)**9 * cos(t0)
    samples: {t0: [0.4, 1.1, 2.3]}
    tolerance: 1e-6
    shown: ['= 10\sin^9 t\,\cos t']
    source: {cite: reading2, at: 'pp. 6–7'}
    origin: mit

  - id: sin-ten-t
    kind: identity
    where: 'formula "Second example": d/dt sin(10t) = 10 cos(10t); quiz 1'
    formula: deriv('sin(10 * t)', 't', t0)
    equals: 10 * cos(10 * t0)
    samples: {t0: [0.04, 0.2, 1.1]}
    tolerance: 1e-5
    shown: ['= \cos(10t)\cdot 10 = 10\cos(10t)']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: cos-one-over-x
    kind: identity
    where: 'formula "Third example": d/dx cos(1/x) = sin(1/x)/x²'
    formula: deriv('cos(1 / x)', 'x', x0)
    equals: sin(1 / x0) / x0**2
    samples: {x0: [0.5, 1.2, 3.0]}
    tolerance: 1e-6
    shown: ['= \frac{1}{x^2}\sin\frac{1}{x}']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: quotient-example
    where: 'worked example "A quotient": f′(2) = (1 − 4)/25'
    inputs: {}
    formula: (1 - 2**2) / (2**2 + 1)**2
    expected: '-0.12'
    shown: ['$f''(2) = \dfrac{1 - 4}{25} = -0.12$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: quotient-example-derivative
    kind: identity
    where: 'worked example "A quotient": f′(x) = (1 − x²)/(x² + 1)²'
    formula: deriv('x / (x**2 + 1)', 'x', x0)
    equals: (1 - x0**2) / (x0**2 + 1)**2
    samples: {x0: [0.3, 1.0, 2.0]}
    tolerance: 1e-6
    shown: ['= \dfrac{1 - x^2}{(x^2 + 1)^2}$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: plot-slope
    where: 'graph caption: slope of sin(x²) at a = 1.5 is 2·1.5·cos(2.25)'
    inputs: {}
    formula: 2 * 1.5 * cos(1.5**2)
    expected: '-1.88'
    shown: ['(at a = 1.5, about −1.88)']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: polynomial-power
    where: 'worked example "A power of a polynomial": 30 · 1 · 4⁴ = 7680'
    inputs: {}
    formula: 30 * 1 * 4**4
    expected: '7680'
    shown: ['$30 \cdot 1 \cdot 4^4 = 30 \cdot 256 = 7680$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: polynomial-power-derivative
    kind: identity
    where: 'worked example "A power of a polynomial": d/dx (3x² + 1)⁵ = 30x (3x² + 1)⁴'
    formula: deriv('(3 * x**2 + 1)**5', 'x', x0)
    equals: 30 * x0 * (3 * x0**2 + 1)**4
    samples: {x0: [0.2, 1.0, 1.4]}
    tolerance: 1e-4
    shown: ['= 30x\,(3x^2 + 1)^4$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: sine-fourth-derivative
    kind: identity
    where: 'formula "Derivatives of the sine": the last step, the derivative of u⁽³⁾ = −cos x, is sin x again; quiz 4'
    formula: deriv('-cos(x)', 'x', x0)
    equals: sin(x0)
    samples: {x0: [0.3, 1.2, 2.5]}
    tolerance: 1e-6
    shown: ['u^{(3)} = -\cos x,\quad u^{(4)} = \sin x']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: x5-third-derivative
    where: 'worked example "Higher derivatives of x⁵": D³x⁵ = 60x², 60 at x = 1'
    inputs: {}
    formula: 5 * 4 * 3
    expected: '60'
    shown: ['$D^3 x^5 = 60x^2$; at $x = 1$ this is 60']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: five-factorial
    where: 'worked example and quiz 5: D⁵x⁵ = 5! = 120'
    inputs: {}
    formula: 5 * 4 * 3 * 2 * 1
    expected: '120'
    shown: ['$D^5 x^5 = 5! = 5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 120$']
    quiz: 4
    source: {cite: reading2, at: 'p. 10'}
    origin: page-own

  - id: cycloid-rate
    kind: identity
    where: 'cosmology callout: da/dt = (da/dθ)/(dt/dθ) = c√k sin θ/(1 − cos θ) for a/√k = α(1 − cos θ), ct = α(θ − sin θ)'
    formula: (alpha * sqrtk * sin(th)) / (alpha * (1 - cos(th)) / c)
    equals: c * sqrtk * sin(th) / (1 - cos(th))
    samples: {alpha: [2.0, 0.5], sqrtk: [1.0, 0.3], c: [3.0, 1.0], th: [0.7, 2.0]}
    tolerance: 1e-12
    shown: ['$c\sqrt k\,\sin\theta/(1 - \cos\theta)$']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own
