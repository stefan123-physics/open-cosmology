# Calculations on content/year-1/18.01/improper-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 36 transcript and the notes numbered Lecture 35, with the page's own numbers.

page: content/year-1/18.01/improper-integrals.mdx
calcs:
  - id: exponential
    kind: identity
    where: 'formula "The decaying exponential": ∫₀^N e^(−kx) dx = (1 − e^(−kN))/k'
    formula: integrate('exp(-k * s)', 's', 0, N)
    equals: (1 - exp(-k * N)) / k
    samples: {k: [0.5, 3.0], N: [2.0, 10.0]}
    tolerance: 1e-6
    shown: ['= \frac{1}{k}\left(1 - e^{-kN}\right)']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: gaussian
    where: 'section "The definition": ∫ e^(−x²) over the line = √π'
    inputs: {}
    formula: 2 * integrate('exp(-s**2)', 's', 0, 10)
    expected: '1.7725'
    shown: ['dx = \sqrt\pi$, the key constant']
    source: {cite: reading2, at: 'pp. 5–6'}
    origin: mit

  - id: powers
    kind: identity
    where: 'formula "Integrals of powers to infinity": ∫₁^N x^(−p) dx = (1 − N^(1−p))/(p − 1) → 1/(p − 1) for p > 1'
    formula: integrate('s**(-p)', 's', 1, N)
    equals: (1 - N**(1 - p)) / (p - 1)
    samples: {p: [1.5, 3.0], N: [10.0, 1000.0]}
    tolerance: 1e-6
    shown: ['\dfrac{1}{p - 1} & p > 1 \text{ (converges)}']
    source: {cite: reading2, at: 'pp. 7–8'}
    origin: mit

  - id: second-type
    where: 'formula "Improper integral of the second type": ∫₀¹ dx/√x = 2'
    inputs: {}
    formula: integrate('s**(-0.5)', 's', 1e-12, 1)
    expected: '2'
    tolerance: '1e-5'
    shown: ['\left(2 - 2a^{1/2}\right) = 2']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: wrong-calc
    where: 'section "The second type": the meaningless −1/x evaluated from −1 to 1 gives −2'
    inputs: {}
    formula: (-1 / 1) - (-1 / -1)
    expected: '-2'
    shown: ['_{-1}^{1} = -2$, a negative area']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: example-a
    where: 'worked example (a): ∫₁^∞ x^(−3/2) dx = 2'
    inputs: {}
    formula: 1 / (1.5 - 1)
    expected: '2'
    shown: ['so it converges to $\frac{1}{p - 1} = 2$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: example-b
    where: 'worked example (b): ∫₁^∞ x^(−2) dx = 1'
    inputs: {}
    formula: 1 / (2 - 1)
    expected: '1'
    shown: ['$\int_1^\infty x^{-2}\,dx = 1$ converges']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: example-d
    where: 'worked example (d): ∫₀⁸ x^(−1/3) dx = (3/2) × 4 = 6'
    inputs: {}
    formula: 1.5 * 8**(2 / 3)
    expected: '6'
    shown: ['= \frac{3}{2} \times 4 = 6$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: horizon
    kind: identity
    where: 'cosmology note: t^(2/3) ∫₀^t c t′^(−2/3) dt′ = 3ct'
    formula: t**(2 / 3) * 3 * c * t**(1 / 3)
    equals: 3 * c * t
    samples: {t: [1.0, 5.0], c: [1.0, 3.0]}
    tolerance: 1e-9
    shown: ['and the horizon distance is $3ct$']
    source: {cite: reading1, at: 'p. 6 (the rule that x^(-p) is integrable at 0 for p < 1)'}
    origin: page-own
