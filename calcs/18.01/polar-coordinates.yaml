# Calculations on content/year-1/18.01/polar-coordinates.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 32 transcript and notes, with the page's own numbers.

page: content/year-1/18.01/polar-coordinates.mdx
calcs:
  - id: ellipse-perimeter
    where: 'section "An ellipse and its perimeter": ∫₀^{2π} √(4cos²t + sin²t) dt ≈ 9.69'
    inputs: {}
    formula: integrate('sqrt(4 * cos(t)**2 + sin(t)**2)', 't', 0, 2 * pi)
    expected: '9.69'
    shown: ['Numerically it is about 9.69']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: off-centre-circle
    kind: identity
    where: 'formula "Off-centre circle": r = 2a cos θ satisfies (x − a)² + y² = a²'
    formula: (2 * a * cos(th) * cos(th) - a)**2 + (2 * a * cos(th) * sin(th))**2
    equals: a**2
    samples: {a: [1.0, 2.5], th: [0.3, -1.1]}
    tolerance: 1e-9
    shown: ['r = 2a\cos\theta, \quad -\frac{\pi}{2} < \theta < \frac{\pi}{2}']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: notes-ellipse
    kind: identity
    where: 'notes p. 7: r = 1/(1 + ½ sin θ) satisfies x² + ¾y² + y = 1'
    formula: (cos(th) / (1 + 0.5 * sin(th)))**2 + 0.75 * (sin(th) / (1 + 0.5 * sin(th)))**2 + sin(th) / (1 + 0.5 * sin(th))
    equals: 1 + 0 * th
    samples: {th: [0.3, 2.0, -1.0]}
    tolerance: 1e-9
    shown: ['becomes $x^2 + \frac{3}{4}y^2 + y = 1$']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: circle-area
    kind: identity
    where: 'section "Area in polar coordinates": ∫ ½(2a cos θ)² dθ from −π/2 to π/2 = πa²'
    formula: integrate('0.5 * (2 * a * cos(t))**2', 't', -pi / 2, pi / 2)
    equals: pi * a**2
    samples: {a: [1.0, 2.5]}
    tolerance: 1e-6
    shown: ['$A = \int_{-\pi/2}^{\pi/2}\frac{1}{2}(2a\cos\theta)^2\,d\theta = \pi a^2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: point-r
    where: 'worked example (b): r = 2√2 ≈ 2.83'
    inputs: {}
    formula: sqrt(4 + 4)
    expected: '2.83'
    shown: ['$r = \sqrt{4 + 4} = 2\sqrt 2 \approx 2.83$']
    source: {cite: reading2, at: 'pp. 8–10'}
    origin: page-own

  - id: cardioid
    where: 'worked example (d): 3π/2 ≈ 4.71'
    inputs: {}
    formula: integrate('0.5 * (1 + cos(t))**2', 't', 0, 2 * pi)
    expected: '4.71'
    shown: ['= \frac{3\pi}{2} \approx 4.71$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: speed
    where: 'worked example (a): speed √36 = 6'
    inputs: {}
    formula: sqrt(36)
    expected: '6'
    shown: ['so the speed is $\sqrt{36} = 6$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
