# Calculations on content/year-1/18.01/derivatives-of-sine-and-cosine.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 3 (recorded lecture, instructor David Jerison; notes from the Fall 2006 class presented by Kobi Kremnizer): transcript and lecture notes.

page: content/year-1/18.01/derivatives-of-sine-and-cosine.mdx
calcs:
  - id: sine-grouping
    kind: identity
    where: 'section "The derivative of sin x": the difference quotient regrouped with the addition formula'
    formula: (sin(x + h) - sin(x)) / h
    equals: sin(x) * (cos(h) - 1) / h + cos(x) * sin(h) / h
    samples: {x: [0.3, 1.0, 2.5, 4.0], h: [0.1, 0.01, 0.5, 0.2]}
    tolerance: 1e-12
    shown: ['= \sin x\,\frac{\cos\Delta x - 1}{\Delta x} + \cos x\,\frac{\sin\Delta x}{\Delta x}']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: cosine-grouping
    kind: identity
    where: 'section "The derivative of cos x": the difference quotient regrouped'
    formula: (cos(x + h) - cos(x)) / h
    equals: cos(x) * (cos(h) - 1) / h - sin(x) * sin(h) / h
    samples: {x: [0.3, 1.0, 2.5, 4.0], h: [0.1, 0.01, 0.5, 0.2]}
    tolerance: 1e-12
    shown: ['= \cos x\,\frac{\cos\Delta x - 1}{\Delta x} - \sin x\,\frac{\sin\Delta x}{\Delta x}']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: derivative-of-sine
    kind: identity
    where: 'formula "Derivative of sine": d/dx sin x = cos x'
    formula: deriv('sin(x)', 'x', x0)
    equals: cos(x0)
    samples: {x0: [0.0, 0.7, 2.0, 5.1]}
    tolerance: 1e-7
    shown: ['label="Derivative of sine" tex="\frac{d}{dx}\sin x = \cos x"']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: derivative-of-cosine
    kind: identity
    where: 'formula "Derivative of cosine": d/dx cos x = −sin x'
    formula: deriv('cos(x)', 'x', x0)
    equals: -sin(x0)
    samples: {x0: [0.0, 0.7, 2.0, 5.1]}
    tolerance: 1e-7
    shown: ['label="Derivative of cosine" tex="\frac{d}{dx}\cos x = -\sin x"']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: product-rule
    kind: identity
    where: 'formula "Product rule", checked for u = x², v = sin x'
    formula: deriv('x**2 * sin(x)', 'x', x0)
    equals: 2 * x0 * sin(x0) + x0**2 * cos(x0)
    samples: {x0: [0.5, 1.3, 2.9]}
    tolerance: 1e-6
    shown: ['label="Product rule" tex="(uv)'' = u''v + uv''"']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: quotient-rule
    kind: identity
    where: 'formula "Quotient rule", checked for u = sin x, v = cos x: (tan x)′ = 1/cos² x'
    formula: deriv('tan(x)', 'x', x0)
    equals: 1 / cos(x0)**2
    samples: {x0: [0.2, 0.7, 1.2]}
    tolerance: 1e-6
    shown: ['\dfrac{1}{\cos^2 x}']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: degrees-slope
    where: 'section "Radians, not degrees": in degrees the slope of sine at 0 is π/180; quiz 3'
    inputs: {}
    formula: pi / 180
    expected: '0.01745'
    shown: ['$\pi/180 \approx 0.01745$', 'In degrees the slope of sine at 0 would be $\\pi/180$.']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: degrees-in-circle
    kind: fact
    where: 'section "Radians, not degrees": 360 degrees in a circle'
    value: 360
    shown: ['divide the circle into 360 arbitrary parts']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: right-angle
    kind: fact
    where: 'section "A second, purely geometric proof": turning by 90°'
    value: 90
    shown: ['turn both lines by 90°']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: quotient-at-one
    where: 'worked example "The derivative of sine, checked numerically": (sin 1.001 − sin 1)/0.001'
    inputs: {}
    formula: (sin(1.001) - sin(1)) / 0.001
    expected: '0.53988'
    shown: ['$(\sin 1.001 - \sin 1)/0.001 \approx 0.53988$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: cos-one
    where: 'worked example "The derivative of sine, checked numerically": cos 1'
    inputs: {}
    formula: cos(1)
    expected: '0.54030'
    shown: ['$\cos 1 \approx 0.54030$']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: quotient-error
    where: 'worked example: the two agree to within 0.0005'
    inputs: {}
    formula: cos(1) - (sin(1.001) - sin(1)) / 0.001
    expected: '0.0004'
    tolerance: 0.0001
    shown: ['agree to within 0.0005']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own

  - id: product-at-half-pi
    where: 'worked example "Using the new rules" (a): (x² sin x)′ at π/2 is π ≈ 3.14'
    inputs: {}
    formula: 2 * (pi / 2) * sin(pi / 2) + (pi / 2)**2 * cos(pi / 2)
    expected: '3.14'
    shown: ['= \pi \approx 3.14$']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: tan-at-quarter-pi
    where: 'worked example "Using the new rules" (b): 1/cos²(π/4) = 2'
    inputs: {}
    formula: 1 / cos(pi / 4)**2
    expected: '2'
    shown: ['At $x = \pi/4$ this is $1/(1/2) = 2$.']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: plot-peak
    where: 'graph caption: sin x peaks at a ≈ 1.57 (π/2), where cos x crosses zero'
    inputs: {}
    formula: pi / 2
    expected: '1.57'
    shown: ['Where sin x peaks (a ≈ 1.57)']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
