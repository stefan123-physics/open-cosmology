# Calculations on content/year-1/18.01/definite-integrals.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 18, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/definite-integrals.mdx
calcs:
  - id: parabola-area
    kind: identity
    where: 'formula "The area under x²": ∫₀ᵇ x² dx = b³/3'
    formula: integrate('x**2', 'x', 0, b)
    equals: b**3 / 3
    samples: {b: [1.0, 2.0, 3.5]}
    tolerance: 1e-9
    shown: ['= \frac{b^3}{3}" cite="reading2" at="p. 5"']
    source: {cite: reading2, at: 'p. 5'}
    origin: mit

  - id: pattern-line
    kind: identity
    where: 'formula "The pattern": ∫₀ᵇ x dx = b²/2'
    formula: integrate('x', 'x', 0, b)
    equals: b**2 / 2
    samples: {b: [1.0, 2.5]}
    tolerance: 1e-9
    shown: ['\int_0^b x\,dx = \frac{b^2}{2}']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: guess-cubic
    where: 'quiz 3: ∫₀² x³ dx = 2⁴/4 = 4'
    inputs: {}
    formula: integrate('x**3', 'x', 0, 2)
    expected: '4'
    tolerance: '1e-9'
    shown: ['$2^4/4 = 4$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: right-sum
    where: 'worked example "Three Riemann sums for x²", plot caption and quiz 2: right ends 30/64 ≈ 0.469'
    inputs: {}
    formula: ((1/4)**2 + (2/4)**2 + (3/4)**2 + 1) / 4
    expected: '0.46875'
    shown: ['= \tfrac{30}{64} \approx 0.469$']
    quiz: 1
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: left-sum
    where: 'same worked example: left ends 14/64 ≈ 0.219'
    inputs: {}
    formula: (0 + 1/16 + 4/16 + 9/16) / 4
    expected: '0.219'
    shown: ['= \tfrac{14}{64} \approx 0.219$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: midpoint-sum
    where: 'same worked example: midpoints ≈ 0.328'
    inputs: {}
    formula: ((1/8)**2 + (3/8)**2 + (5/8)**2 + (7/8)**2) / 4
    expected: '0.328'
    shown: ['$\approx 0.328$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: sum-of-squares-bounds
    kind: identity
    where: 'formula "Trapping the sum": checks 1² + … + 10² = 385 = n(n+1)(2n+1)/6, which lies between n³/3 = 333.3 and (n+1)³/3 = 443.7'
    formula: (1 + 4 + 9 + 16 + 25 + 36 + 49 + 64 + 81 + 100) - n**3 / 3 - (n * (n + 1) * (2 * n + 1) / 6 - n**3 / 3)
    equals: 0 * n
    samples: {n: [10.0]}
    tolerance: 1e-9
    shown: ['\tfrac13 n^3 \;<\; 1^2 + 2^2 + \cdots + n^2 \;<\; \tfrac13 (n+1)^3']
    source: {cite: reading1, at: 'pp. 2–3'}
    origin: mit

  - id: tank-left
    where: 'worked example "Filling a tank…" (a): left sum 2 + 3 + 4 + 5 = 14 litres'
    inputs: {}
    formula: 2 + 3 + 4 + 5
    expected: '14'
    tolerance: '1e-9'
    shown: ['$2 + 3 + 4 + 5 = 14$']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: tank-right
    where: 'same: right sum 3 + 4 + 5 + 6 = 18 litres'
    inputs: {}
    formula: 3 + 4 + 5 + 6
    expected: '18'
    tolerance: '1e-9'
    shown: ['$3 + 4 + 5 + 6 = 18$']
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: tank-exact
    where: 'same and quiz 4: ∫₀⁴ (2 + t) dt = 16 litres'
    inputs: {}
    formula: integrate('2 + x', 'x', 0, 4)
    expected: '16'
    tolerance: '1e-9'
    shown: ['$\tfrac12(2 + 6) \times 4 = 16$ litres']
    quiz: 3
    source: {cite: reading2, at: 'p. 9'}
    origin: page-own

  - id: loan-simple
    where: 'same (b): 9000 ∫₀¹ (1 + 0.04(1 − t)) dt = 9180'
    inputs: {}
    formula: 9000 * integrate('1 + 0.04 * (1 - x)', 'x', 0, 1)
    expected: '9180'
    tolerance: '0.5'
    shown: ['9000 \times (1 + 0.02) = 9180$ dollars']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: loan-continuous
    where: 'same (b): 9000 (e^0.04 − 1)/0.04 ≈ 9182'
    inputs: {}
    formula: 9000 * integrate('exp(0.04 * (1 - x))', 'x', 0, 1)
    expected: '9182'
    tolerance: '0.5'
    shown: ['\approx 9182$ dollars']
    source: {cite: reading2, at: 'p. 10'}
    origin: page-own

  - id: horizon-flat
    kind: identity
    where: 'cosmology note: a ∝ t^(2/3) gives ℓ = t₀^(2/3) ∫₀^t₀ c dt / t^(2/3) = 3 c t₀'
    formula: t0**(2/3) * integrate('1 / x**(2/3)', 'x', 1e-12, t0)
    equals: 3 * t0
    samples: {t0: [1.0, 2.0]}
    tolerance: 1e-2
    shown: ['it comes to $3ct_0$']
    source: {cite: reading2, at: 'pp. 9–10'}
    origin: page-own
