# Calculations on content/year-1/18.01/fundamental-theorem-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 19, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/fundamental-theorem-1.mdx
calcs:
  - id: parabola
    kind: identity
    where: 'formula "The parabola again": ∫₀ᵇ x² dx = b³/3'
    formula: integrate('x**2', 'x', 0, b)
    equals: b**3 / 3
    samples: {b: [1.0, 2.0]}
    tolerance: 1e-9
    shown: ['- \frac{0^3}{3} = \frac{b^3}{3}']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: sine-hump
    where: 'formula "One hump of sin x" and quiz 1: ∫₀^π sin x dx = 2'
    inputs: {}
    formula: -cos(pi) - (-cos(0))
    expected: '2'
    tolerance: '1e-9'
    shown: ['= -\cos\pi - (-\cos 0) = 1 + 1 = 2']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: sine-hump-numeric
    where: 'same, checked numerically'
    inputs: {}
    formula: integrate('sin(x)', 'x', 0, pi)
    expected: '2'
    tolerance: '1e-6'
    shown: ['= -\cos\pi - (-\cos 0) = 1 + 1 = 2']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: two-humps
    where: 'formula "Two humps of sin x" and quiz 2: ∫₀^2π sin x dx = 0'
    inputs: {}
    formula: integrate('sin(x)', 'x', 0, 2 * pi)
    expected: '0'
    tolerance: '1e-6'
    shown: ['\Big]_0^{2\pi} = -1 - (-1) = 0']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: x100
    where: 'section "Examples": ∫₀¹ x¹⁰⁰ dx = 1/101 (transcript)'
    inputs: {}
    formula: integrate('x**100', 'x', 0, 1)
    expected: '0.0099010'
    tolerance: '1e-6'
    shown: ['= \frac{1}{101}']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: sqrt-integral
    where: 'worked example "Three quick integrals": ∫₁⁴ √x dx = 14/3 ≈ 4.67'
    inputs: {}
    formula: integrate('sqrt(x)', 'x', 1, 4)
    expected: '4.67'
    shown: ['= \tfrac{14}{3} \approx 4.67']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: cos-integral
    where: 'same: ∫₀^(π/2) cos x dx = 1'
    inputs: {}
    formula: integrate('cos(x)', 'x', 0, pi / 2)
    expected: '1'
    tolerance: '1e-6'
    shown: ['$\sin\tfrac{\pi}{2} - \sin 0 = 1$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: log-integral
    where: 'same: ∫₁^e dx/x = 1'
    inputs: {}
    formula: integrate('1 / x', 'x', 1, exp(1))
    expected: '1'
    tolerance: '1e-6'
    shown: ['$\ln e - \ln 1 = 1$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: net-distance
    where: 'worked example "Net distance and total distance" and quiz 3: ∫₀⁵ (3 − t) dt = 2.5 m'
    inputs: {}
    formula: integrate('3 - x', 'x', 0, 5)
    expected: '2.5'
    shown: ['= 15 - 12.5 = 2.5$ m forward']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: page-own

  - id: total-distance
    where: 'same: forward 4.5 m + back 2 m = 6.5 m'
    inputs: {}
    formula: integrate('3 - x', 'x', 0, 3) + integrate('x - 3', 'x', 3, 5)
    expected: '6.5'
    shown: ['Total distance $6.5$ m']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  - id: e-bound
    where: 'worked example "One more step towards e": 1 + 1/2 + 1/6 = 5/3, so e ≥ 8/3 ≈ 2.667'
    inputs: {}
    formula: 1 + integrate('1 + x + x**2 / 2', 'x', 0, 1)
    expected: '2.667'
    shown: ['$e \ge \tfrac83 \approx 2.667$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: e-value
    where: 'same: the true value 2.718'
    inputs: {}
    formula: exp(1)
    expected: '2.718'
    shown: ['The true value is 2.718']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: substitution-transcript
    kind: identity
    where: 'section "Changing variables": ∫₁² (x³ + 2)⁵ x² dx = (10⁶ − 3⁶)/18'
    formula: integrate('(x**3 + 2)**5 * x**2', 'x', 1, 2) + 0 * k
    equals: (10**6 - 3**6) / 18 + 0 * k
    samples: {k: [1.0]}
    tolerance: 1e-3
    shown: ['= \frac{1}{18}(10^6 - 3^6)']
    source: {cite: reading2, at: 'pp. 9–10'}
    origin: mit

  - id: substitution-notes
    kind: identity
    where: 'same: the notes'' ∫₁² (x³ + 2)⁴ x² dx = (10⁵ − 3⁵)/15'
    formula: integrate('(x**3 + 2)**4 * x**2', 'x', 1, 2) + 0 * k
    equals: (10**5 - 3**5) / 15 + 0 * k
    samples: {k: [1.0]}
    tolerance: 1e-4
    shown: ['$\tfrac{1}{15}(10^5 - 3^5)$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: x2-symmetric
    where: 'warning: ∫₋₁¹ x² dx = 2/3, not 0'
    inputs: {}
    formula: integrate('x**2', 'x', -1, 1)
    expected: '0.6667'
    shown: ['(it is $\tfrac23$)']
    source: {cite: reading2, at: 'p. 10'}
    origin: page-own

  - id: own-substitution
    where: 'worked example "A substitution with limits" and quiz 4: ½(e − 1) ≈ 0.859'
    inputs: {}
    formula: integrate('x * exp(x**2)', 'x', 0, 1)
    expected: '0.859'
    shown: ['= \tfrac12(e - 1) \approx 0.859']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: age-flat
    kind: identity
    where: 'cosmology note: (1/H0) ∫₀¹ a^(1/2) da = 2/(3 H0)'
    formula: integrate('sqrt(x)', 'x', 0, 1) / H
    equals: 2 / (3 * H)
    samples: {H: [1.0, 0.07]}
    tolerance: 1e-5
    shown: ['= \frac{2}{3H_0}']
    source: {cite: reading2, at: 'p. 3'}
    origin: page-own
