# Calculations on content/year-1/18.01/related-rates.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 12 (David Jerison): transcript and lecture notes, with the page's own examples.

page: content/year-1/18.01/related-rates.mdx
calcs:
  - id: box-critical
    kind: identity
    where: 'formula "Critical point": A′ = 0 at x = (2V)^(1/3)'
    formula: deriv('x**2 + 4 * V / x', 'x', (2 * V)**(1/3))
    equals: 0 * V
    samples: {V: [1.0, 8.0, 0.3]}
    tolerance: 1e-6
    shown: ['x^3 = 2V, \quad x = 2^{1/3}V^{1/3}']
    source: {cite: reading2, at: 'p. 6'}
    origin: mit

  - id: box-area
    kind: identity
    where: 'formula "Least area": A at the critical point equals 3·2^(2/3) V^(2/3)'
    formula: ((2 * V)**(1/3))**2 + 4 * V / (2 * V)**(1/3)
    equals: 3 * 2**(2/3) * V**(2/3)
    samples: {V: [1.0, 8.0, 0.3]}
    tolerance: 1e-9
    shown: ['= 3\cdot 2^{2/3}\,V^{2/3}" cite']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: box-ratio
    kind: identity
    where: 'formula "The optimal shape": x/y = 2 with y = V/x²'
    formula: (2 * V)**(1/3) / (V / (2 * V)**(2/3))
    equals: 2 + 0 * V
    samples: {V: [1.0, 8.0, 0.3]}
    tolerance: 1e-9
    shown: ['\frac{x}{y} = \frac{2^{1/3}V^{1/3}}{2^{-2/3}V^{1/3}} = 2']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: box-second
    kind: identity
    where: 'section "A box without a top": A″ = 2 + 8V/x³'
    formula: deriv('2 * x - 4 * V / x**2', 'x', x0)
    equals: 2 + 8 * V / x0**3
    samples: {V: [1.0, 8.0], x0: [0.7, 2.5]}
    tolerance: 1e-6
    shown: ['$A'''' = 2 + 8V/x^3 > 0$']
    source: {cite: reading2, at: 'p. 7'}
    origin: mit

  - id: squares-min
    where: 'section "Minimum value": the least area 1/32 at x = 1/2'
    inputs: {}
    formula: (0.5 / 4)**2 * 2
    expected: '0.03125'
    shown: ['Its least area is $\tfrac1{32}$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: radar-x
    where: 'section "A radar trap": x = 40 ft from the 3-4-5 triangle'
    inputs: {}
    formula: sqrt(50**2 - 30**2)
    expected: '40'
    shown: ['from the 3-4-5 triangle, $x = 40$']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: radar-speed
    where: 'section "A radar trap" and quiz 3: ẋ = 50 × (−80)/40 = −100 ft/s'
    inputs: {}
    formula: 50 * (-80) / 40
    expected: '-100'
    shown: ['$\dot x = 50 \times (-80)/40 = -100$ ft/s. At 100 ft/s']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: speed-limit
    where: 'section "A radar trap": 65 mph is about 95 ft/s'
    inputs: {v: 65 mile/hour}
    formula: v
    expected: 95 ft/s
    tolerance: 0.5 ft/s
    shown: ['65 mph, is about 95 ft/s']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: cone-volume
    kind: identity
    where: 'formula "Volume in terms of height": (π/3)(2h/5)² h = (4π/75) h³, derivative (4π/25) h²'
    formula: deriv('pi / 3 * (2 * h / 5)**2 * h', 'h', h0)
    equals: 4 * pi / 25 * h0**2
    samples: {h0: [1.0, 5.0, 8.0]}
    tolerance: 1e-6
    shown: ['V = \frac{\pi}{3}\left(\frac{2}{5}h\right)^2 h = \frac{4\pi}{75}\,h^3']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: cone-rate
    where: 'section "Filling a cone": ḣ = 2/((4π/25) × 25) = 1/(2π) ≈ 0.16 ft/min'
    inputs: {}
    formula: 2 / (4 * pi / 25 * 25)
    expected: '0.16'
    shown: ['$\dot h = 1/(2\pi) \approx 0.16$ ft/min']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ladder-rate
    where: 'worked example "A sliding ladder" and quiz 4: ẏ = −3.0 × 0.40/4.0 = −0.30 m/s'
    inputs: {x: 3.0 m, y: 4.0 m, xdot: 0.40 m/s}
    formula: -x * xdot / y
    expected: -0.30 m/s
    shown: ['$\dot y = -3.0 \times 0.40/4.0 = -0.30$ m/s']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ladder-height
    where: 'worked example "A sliding ladder": y = √(25 − 9) = 4.0 m'
    inputs: {}
    formula: sqrt(5.0**2 - 3.0**2)
    expected: '4.0'
    shown: ['At $x = 3.0$ m, $y = 4.0$ m']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: balloon-rate
    where: 'worked example "Blowing up a balloon": ṙ = 0.010/(4π × 0.20²) ≈ 0.020 m/s'
    inputs: {Vdot: 0.010 m**3/s, r: 0.20 m}
    formula: Vdot / (4 * pi * r**2)
    expected: 0.020 m/s
    shown: ['$\dot r = 0.010/(4\pi \times 0.20^2) \approx 0.020$ m/s']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: balloon-derivative
    kind: identity
    where: 'worked example "Blowing up a balloon": dV/dr = 4πr²'
    formula: deriv('4 / 3 * pi * r**3', 'r', r0)
    equals: 4 * pi * r0**2
    samples: {r0: [0.2, 1.0]}
    tolerance: 1e-6
    shown: ['$\dfrac{dV}{dt} = 4\pi r^2\,\dfrac{dr}{dt}$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own
