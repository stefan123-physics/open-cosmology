# Calculations on content/year-1/18.01/derivative-as-slope.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 Lecture 1 (Fall 2006): lecture notes and transcript.

page: content/year-1/18.01/derivative-as-slope.mdx
calcs:
  - id: square-difference-quotient
    kind: identity
    where: 'worked example "The derivative of x² at x = 3": ((3 + Δx)² − 9)/Δx = 6 + Δx'
    formula: ((3 + d)**2 - 9) / d
    equals: 6 + d
    samples: {d: [0.1, 0.5, -0.3, 2]}
    tolerance: 1e-12
    shown: ['Dividing by $\Delta x$ leaves $6 + \Delta x$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: square-derivative-at-3
    where: 'worked example, step "Cancel, then take the limit": f''(3) = 6'
    formula: deriv('x**2', 'x', 3)
    expected: 6
    shown: ['this tends to $f''(3) = 6$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: square-secant-01
    where: 'worked example, step "See it in numbers": secant slope 6.1 for Δx = 0.1'
    formula: ((3 + 0.1)**2 - 9) / 0.1
    expected: 6.1
    shown: ['With $\Delta x = 0.1$ the secant slope is 6.1']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: square-secant-001
    where: 'worked example, step "See it in numbers": 6.01 for Δx = 0.01'
    formula: ((3 + 0.01)**2 - 9) / 0.01
    expected: 6.01
    shown: ['with $\Delta x = 0.01$ it is 6.01']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: square-secant-0001
    where: 'worked example, step "See it in numbers": 6.001 for Δx = 0.001'
    formula: ((3 + 0.001)**2 - 9) / 0.001
    expected: 6.001
    shown: ['with $\Delta x = 0.001$, 6.001']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: square-quiz
    where: 'quiz 1: marked choice "6"'
    formula: deriv('x**2', 'x', 3)
    expected: 6
    shown: ['which tends to 6 as $\\Delta x \\to 0$']
    quiz: 0
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: reciprocal-difference-quotient
    kind: identity
    where: 'section "Example: the derivative of 1/x": (1/(x0 + Δx) − 1/x0)/Δx = −1/((x0 + Δx) x0)'
    formula: (1 / (x0 + d) - 1 / x0) / d
    equals: -1 / ((x0 + d) * x0)
    samples: {x0: [1, 3, 0.5, 7], d: [0.1, -0.2, 0.01, 2]}
    tolerance: 1e-12
    shown: ['\frac{-1}{(x_0 + \Delta x)\,x_0}" cite="reading1" at="p. 2"']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: reciprocal-derivative
    kind: identity
    where: 'section "Example: the derivative of 1/x": f''(x0) = −1/x0²'
    formula: deriv('1/x', 'x', x0)
    equals: -1 / x0**2
    samples: {x0: [0.5, 1, 3, 7]}
    tolerance: 1e-8
    shown: ['tex="f''(x_0) = -\frac{1}{x_0^2}"']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: reciprocal-at-3
    where: 'section "Example: the derivative of 1/x": at x0 = 3 the expression tends to −1/9'
    formula: -1 / ((3 + 0) * 3)
    expected: -0.1111111
    shown: ['tends to $-1/9$']
    source: {cite: reading2, at: 'transcript p. 5'}
    origin: mit

  - id: reciprocal-quiz
    where: 'quiz 2 explanation: −1/4 at x0 = 2 (the choices are fractions, which the quiz check cannot read)'
    formula: deriv('1/x', 'x', 2)
    expected: -0.25
    shown: ['$f''(x_0) = -1/x_0^2 = -1/4$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: triangle-x-intercept
    kind: identity
    where: 'section "A word problem": the tangent to y = 1/x meets y = 0 at x = 2 x0'
    formula: 1 / x0 - (2 * x0 - x0) / x0**2
    equals: 0 * x0
    samples: {x0: [0.5, 1, 4, 9]}
    tolerance: 1e-12
    shown: ['which gives $x = 2x_0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: triangle-y-intercept
    kind: identity
    where: 'section "A word problem": the tangent to y = 1/x meets x = 0 at y = 2 y0 = 2/x0'
    formula: 1 / x0 - (0 - x0) / x0**2
    equals: 2 / x0
    samples: {x0: [0.5, 1, 4, 9]}
    tolerance: 1e-12
    shown: ['the $y$-intercept is $2y_0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: triangle-area
    kind: identity
    where: 'section "A word problem": area = ½ (2 x0)(2 y0) = 2 for every x0'
    formula: 0.5 * (2 * x0) * (2 / x0)
    equals: 2 + 0 * x0
    samples: {x0: [0.5, 1, 4, 9]}
    tolerance: 1e-12
    shown: ['= 2x_0y_0 = 2" cite="reading1" at="p. 4"']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: triangle-4-slope
    where: 'worked example "The triangle at x₀ = 4", step "Point and slope": f''(4) = −1/16'
    formula: deriv('1/x', 'x', 4)
    expected: -0.0625
    shown: ['$f''(4) = -1/16$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: triangle-4-x-intercept
    where: 'worked example, step "Intercepts": x = 4 + 16 × ¼ = 8'
    formula: 4 + 16 * 0.25
    expected: 8
    shown: ['$x = 4 + 16 \times \tfrac14 = 8 = 2x_0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: triangle-4-y-intercept
    where: 'worked example, step "Intercepts": y = ¼ + 4/16 = ½'
    formula: 0.25 + 4 / 16
    expected: 0.5
    shown: ['$y = \tfrac14 + \tfrac{4}{16} = \tfrac12 = 2y_0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: triangle-4-area
    where: 'worked example, step "Area": ½ × 8 × ½ = 2'
    formula: 0.5 * 8 * 0.5
    expected: 2
    shown: ['$\tfrac12 \times 8 \times \tfrac12 = 2$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: binomial-first-terms
    kind: limit
    where: 'section "Example: the derivative of xⁿ": ((x + Δx)ⁿ − xⁿ)/Δx → n xⁿ⁻¹ (checked for n = 5 at x = 1.3)'
    formula: ((1.3 + d)**5 - 1.3**5) / d
    limit: 5 * 1.3**4
    vary: {d: [0.1, 0.01, 0.001, 0.0001, 0.00001, 0.000001, 0.0000001]}
    shown: ['tex="\frac{d}{dx}\,x^n = n\,x^{n-1}"']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: power-rule
    kind: identity
    where: 'section "Example: the derivative of xⁿ": d/dx xⁿ = n xⁿ⁻¹'
    formula: deriv('x**n', 'x', x0)
    equals: n * x0**(n - 1)
    samples: {n: [1, 2, 3, 7], x0: [2, 0.5, 1.7, 1.1]}
    tolerance: 1e-6
    shown: ['tex="\frac{d}{dx}\,x^n = n\,x^{n-1}"']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: polynomial-example
    kind: identity
    where: 'section "Example: the derivative of xⁿ": d/dx (4x³ + x⁶) = 12x² + 6x⁵'
    formula: deriv('4*x**3 + x**6', 'x', x0)
    equals: 12 * x0**2 + 6 * x0**5
    samples: {x0: [0.5, 1, 1.5, -2]}
    tolerance: 1e-6
    shown: ['= 12x^2 + 6x^5$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: polynomial-quiz
    kind: identity
    where: 'quiz 4: marked choice d/dx (2x⁵ + x²) = 10x⁴ + 2x'
    formula: deriv('2*x**5 + x**2', 'x', x0)
    equals: 10 * x0**4 + 2 * x0
    samples: {x0: [0.5, 1, 1.5, -2]}
    tolerance: 1e-6
    shown: ['$2 \\times 5x^4 + 2x$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: stone-landing-time
    where: 'worked example "A dropped stone", step "Time to land": 4.9 t² = 44.1 gives t = 3 s'
    inputs: {h: 44.1 m, c: 4.9 m/s**2}
    formula: sqrt(h / c)
    expected: 3 s
    shown: ['$t^2 = 9$ and $t = 3$ s']
    source: {cite: reading1, at: 'pp. 6–7'}
    origin: page-own

  - id: stone-average-speed
    where: 'worked example, step "Average speed": 44.1/3 = 14.7 m/s'
    inputs: {h: 44.1 m, t: 3 s}
    formula: h / t
    expected: 14.7 m/s
    shown: ['an average of $44.1/3 = 14.7$ m/s']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: stone-landing-velocity
    where: 'worked example, step "Speed on landing": y''(3) = −9.8 × 3 = −29.4 m/s'
    formula: deriv('44.1 - 4.9*t**2', 't', 3)
    expected: -29.4
    shown: ['$y'' = -29.4$ m/s']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
