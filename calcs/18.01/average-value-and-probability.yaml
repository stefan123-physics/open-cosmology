# Calculations on content/year-1/18.01/average-value-and-probability.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 18.01 (Fall 2006) Lecture 23, notes and transcript, with the page's own numbers.

page: content/year-1/18.01/average-value-and-probability.mdx
calcs:
  - id: semicircle-x
    where: 'formula "Average height, with respect to x" and quiz 2: π/4 ≈ 0.785'
    inputs: {}
    formula: integrate('sqrt(1 - x**2)', 'x', -1, 1) / 2
    expected: '0.785'
    shown: ['= \frac12\cdot\frac{\pi}{2} = \frac{\pi}{4}']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: semicircle-theta
    where: 'formula "Average height, with respect to θ" and quiz 2: 2/π ≈ 0.637'
    inputs: {}
    formula: integrate('sin(x)', 'x', 0, pi) / pi
    expected: '0.637'
    shown: ['= \frac{2}{\pi}']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: pi-squared
    where: 'same: 2/π < π/4 because π² > 8'
    inputs: {}
    formula: pi**2
    expected: '9.87'
    shown: ['since $\pi^2 > 8$']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: cauldron-heat
    where: 'section "Weighted averages": ∫₀¹ (100 − 30y) πy dy = 40π'
    inputs: {}
    formula: integrate('(100 - 30 * x) * x', 'x', 0, 1)
    expected: '40'
    tolerance: '1e-6'
    shown: ['$\int_0^1 (100 - 30y)\,\pi y\,dy = 40\pi$']
    source: {cite: reading2, at: 'pp. 7–8'}
    origin: mit

  - id: cauldron-average
    where: 'formula "Average temperature of the cauldron": 40π/(π/2) = 80 °C'
    inputs: {}
    formula: integrate('(100 - 30 * x) * x', 'x', 0, 1) / integrate('x', 'x', 0, 1)
    expected: '80'
    tolerance: '1e-6'
    shown: ['= \frac{40\pi}{\pi/2} = 80^\circ\text{C}']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: cauldron-plain-average
    where: 'same: (100 + 70)/2 = 85 °C'
    inputs: {}
    formula: (100 + 70) / 2
    expected: '85'
    tolerance: '1e-9'
    shown: ['$(100 + 70)/2 = 85$ °C']
    source: {cite: reading2, at: 'p. 9'}
    origin: mit

  - id: stock-weighted
    where: 'worked example "A weighted average price" and quiz 3: 3600/200 = 18.00'
    inputs: {}
    formula: (100 * 12 + 50 * 18 + 50 * 30) / 200
    expected: '18.00'
    shown: ['= \dfrac{3600}{200} = 18.00$ dollars']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: stock-unweighted
    where: 'same: (12 + 18 + 30)/3 = 20'
    inputs: {}
    formula: (12 + 18 + 30) / 3
    expected: '20'
    tolerance: '1e-9'
    shown: ['$(12 + 18 + 30)/3 = 20$ dollars']
    source: {cite: reading2, at: 'p. 6'}
    origin: page-own

  - id: parabola-probability
    where: 'formula "A probability as a ratio of areas": (5/24)/(4/3) = 5/32 (the lecture says 5/18)'
    inputs: {}
    formula: integrate('1 - x**2', 'x', 0.5, 1) / integrate('1 - x**2', 'x', -1, 1)
    expected: '0.15625'
    tolerance: '1e-6'
    shown: ['= \frac{5/24}{4/3} = \frac{5}{32}']
    source: {cite: reading2, at: 'p. 10'}
    origin: slip
    note: 'The lecture quotes 5/18 and doubts it; the part is 5/24 and the whole 4/3, so 5/32 ≈ 0.16.'

  - id: triangle-probability
    where: 'worked example "A random point in a triangle" and quiz 4: (3/8)/(1/2) = 3/4'
    inputs: {}
    formula: integrate('x', 'x', 0.5, 1) / integrate('x', 'x', 0, 1)
    expected: '0.75'
    tolerance: '1e-6'
    shown: ['= \dfrac{3/8}{1/2} = \dfrac34$']
    source: {cite: reading2, at: 'p. 11'}
    origin: page-own

  - id: dart-brother
    where: 'section "Darts…": notes'' estimate (1/6)(e^(−4r₁²) − e^(−9r₁²)) with e^(−r₁²) = 1/2, about 1%'
    inputs: {}
    formula: (0.5**4 - 0.5**9) / 6
    expected: '0.01'
    tolerance: '0.001'
    shown: ['by about 1% of the darts']
    source: {cite: reading1, at: 'pp. 5–6'}
    origin: mit

  - id: shells-volume
    where: 'same: ∫₀^∞ e^(−r²) 2πr dr = π'
    inputs: {}
    formula: integrate('exp(-x**2) * 2 * pi * x', 'x', 0, 10)
    expected: '3.14159'
    tolerance: '1e-5'
    shown: ['is $\int_0^\infty e^{-r^2}\,2\pi r\,dr = \pi$ by shells']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: gaussian
    where: 'formula "The Gaussian integral": √π ≈ 1.772'
    inputs: {}
    formula: integrate('exp(-x**2)', 'x', -10, 10)
    expected: '1.7724539'
    tolerance: '1e-6'
    shown: ['\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt\pi']
    source: {cite: reading1, at: 'p. 10'}
    origin: mit
