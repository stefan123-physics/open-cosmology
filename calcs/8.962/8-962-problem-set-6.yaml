    origin: page-own

  # ---- Problem 4(d): A^t̄_t̂ from a second tetrad, the one whose time vector is the 4-velocity of the body at rest
  # in the barred coordinates: u^t̄ = (−g_t̄t̄)^(−1/2) = 1 + φ A^t̄_t̂ to first order. The diagonal entries of A are
