      phi: [0.01, 0.05, 0.02, 0.03, 0.04]
    tolerance: 1e-9
    shown: ['g_{\bar x\bar x} = 1 + 2\phi\,\gamma^2\left(1 + v^2\right)']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  # Part (a) repeated in the barred coordinates: Γ^z̄_t̄t̄ = −(1/2) g^zz ∂_z g_t̄t̄ with a numerical derivative, as φ → 0.
  - id: p4c-rest-check
    kind: limit
    where: 'Problem 4(c), check: −(1/2) g^zz ∂_z g_t̄t̄ against g γ²(1 + v²), as φ at the body goes to zero'
    inputs: {g: 0.7, v: 0.6}
