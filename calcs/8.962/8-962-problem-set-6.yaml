    tolerance: 1e-4
    shown: ['id="p4d-att"', 'A^{\bar t}{}_{\hat t} = \gamma^2\left(1 + v^2\right)']
    source: {cite: mit, at: 'Problem 4(d) (our own solution)'}
    origin: page-own

  # The norm of e_t̂ = (1 + φS_tt) e_t̄ − 2φγ²v e_x̄ in the barred metric, plus 1, divided by φ: it must go to zero.
  - id: p4d-norm
    kind: limit
    where: 'Problem 4(d), check: the square of the basis vector e_t̂ of the symmetric choice is −1 to first order in φ'
