# Calculations on content/year-5/8.962/linearized-gravity-static-limit.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 14 transcript; page numbers are the PDF pages of the transcript.
# Checks: the inverse metric to first order, the trace of the trace-reversed perturbation, the gauge cancellation
# in the divergence of h-bar, the static solution (h-bar_00 = -4 Phi -> h_00 = h_ii = -2 Phi), the uniform-sphere
# curve of the plot, and the page's Sun example (h at the surface, light deflection).

page: content/year-5/8.962/linearized-gravity-static-limit.mdx
calcs:
  - id: inverse-metric
    kind: identity
    where: 'formula "The inverse metric to first order": (1 - h)(1 + h) = 1 - h^2, i.e. the product is the identity up to second order (one diagonal component, checked at small h)'
    formula: (1 - hh)*(1 + hh)
    equals: '1'
    samples: {hh: [1e-5, -3e-5, 2e-6]}
    tolerance: 1e-9
    shown: ['tex="g^{\alpha\beta} = \eta^{\alpha\beta} - h^{\alpha\beta} + O(h^2)"']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  - id: trace-reverse-trace
    kind: identity
    where: 'formula "Trace-reversed perturbation": h-bar = h - (1/2) 4 h = -h; quiz 3'
    formula: hh - 0.5*4*hh
    equals: -hh
    samples: {hh: [0.3, -1.2, 5.0]}
    tolerance: 1e-12
    shown: ['\bar h = \eta^{\mu\nu}\bar h_{\mu\nu} = h - \frac{1}{2}\cdot 4\,h = -h"']
    source: {cite: reading1, at: 'transcript pp. 10–11'}
    origin: mit

  - id: lorenz-cancel
    kind: identity
    where: 'section "Lorenz gauge": the divergence of -d_nu xi_mu and of eta_mu_nu d.xi cancel (written as numbers D = d_nu(d.xi), plus 1 for a defined relative difference)'
    formula: 1 + (-DD) + DD
    equals: '1'
    samples: {DD: [0.4, -2.0, 7.0]}
    tolerance: 1e-12
    shown: ['which cancel. [Hughes first writes']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: mit

  - id: static-hbar00
    kind: identity
    where: 'formula "The static 00 equation": with hbar_00 = -4 Phi, lap hbar_00 = -4 lap Phi = -4 (4 pi G rho) = -16 pi G rho'
    formula: -4*(4*pi*Gn*rho)
    equals: -16*pi*Gn*rho
    samples: {Gn: [1.0, 6.674e-11], rho: [2.0, 1000.0]}
    tolerance: 1e-12
    shown: ['tex="\nabla^2\bar h_{00} = -16\pi G\rho"']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: static-h00
    kind: identity
    where: 'formula "Back to the metric perturbation": h_00 = -4 Phi - (1/2)(-1)(4 Phi) = -2 Phi'
    formula: -4*ph - 0.5*(-1)*(4*ph)
    equals: -2*ph
    samples: {ph: [-2.12e-6, -0.01, 0.3]}
    tolerance: 1e-12
    shown: ['tex="h_{00} = -4\Phi - \frac{1}{2}(-1)(4\Phi) = -2\Phi, \qquad h_{xx} = h_{yy} = h_{zz} = 0 - \frac{1}{2}(1)(4\Phi) = -2\Phi"']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: static-hxx
    kind: identity
    where: 'same formula: h_xx = 0 - (1/2)(1)(4 Phi) = -2 Phi'
    formula: 0 - 0.5*(1)*(4*ph)
    equals: -2*ph
    samples: {ph: [-2.12e-6, -0.01, 0.3]}
    tolerance: 1e-12
    shown: ['h_{zz} = 0 - \frac{1}{2}(1)(4\Phi) = -2\Phi"']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: sphere-continuity
    kind: identity
    where: 'plot: the uniform-sphere curve 3 - r^2 (inside, from Phi = -GM(3R^2 - r^2)/(2R^3)) and 2/r (outside) meet at r = R (both 2), checked at r = 1'
    formula: 3 - rr**2
    equals: 2/rr
    samples: {rr: [1.0]}
    tolerance: 1e-12
    shown: ['3 − (r/R)² inside, 2R/r outside']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: sphere-centre
    kind: identity
    where: 'plot: h_00 = -2 Phi with Phi = -(GM/R)(3 - r^2/R^2)/2 inside a uniform sphere gives (3 - r^2) in units of GM/R'
    formula: -2*(-(3 - rr**2)/2)
    equals: 3 - rr**2
    samples: {rr: [0.0, 0.5, 0.9]}
    tolerance: 1e-12
    shown: ['for a uniform sphere of radius R, computed from its Newtonian potential']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: gauge-example
    where: 'worked example "A perturbation that is pure gauge": largest |h_xx| = 2 k |x| for k = 1e-3 /m, |x| = 10 m'
    inputs: {k: 1e-3 1/m, x: 10 m}
    formula: 2*k*x
    expected: '0.02'
    shown: ['$2 \times 10^{-3} \times 10 = 0.02$']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: sun-phi
    where: 'worked example "How big is h at the surface of the Sun": Phi = -GM/(R c^2)'
    inputs: {R: 6.957e8 m}
    formula: G*M_sun/(R*c**2)
    expected: 2.12e-6
    shown: ['-1476.6/6.957\times10^8 \approx -2.12\times10^{-6}$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: sun-length
    where: 'worked example and quiz 4: GM_sun/c^2 = 1476.6 m'
    inputs: {}
    formula: G*M_sun/c**2
    expected: 1476.6 m
    shown: ['($GM_\odot/c^2 = 1476.6$ m', '$4 \\times 1476.6\\ \\text{m}']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: sun-h
    where: 'worked example: h_00 = h_xx = -2 Phi at the Sun''s surface'
    inputs: {R: 6.957e8 m}
    formula: 2*G*M_sun/(R*c**2)
    expected: 4.25e-6
    shown: ['$h_{00} = h_{xx} = 4.25\times10^{-6}$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: deflection-rad
    where: 'worked example step "The deflection" and quiz 4 explanation: 4 GM/(b c^2) in radians'
    inputs: {b: 6.957e8 m, rad: 1 radian}
    formula: 4*G*M_sun/(b*c**2)
    expected: 8.49e-6
    shown: ['\approx 8.49\times10^{-6}$ rad $\approx 1.75$ arcseconds', '\\approx 8.49\\times10^{-6}$ rad, about 1.75']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: deflection-arcsec
    where: 'worked example and quiz 4: the grazing deflection in arcseconds'
    inputs: {b: 6.957e8 m, rad: 1 radian}
    formula: 4*G*M_sun/(b*c**2)*rad
    expected: 1.75 arcsecond
    quiz: 3
    shown: ['rad $\approx 1.75$ arcseconds for a grazing ray']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: deflection-half
    where: 'worked example and quiz 4: h_00 alone gives half, 0.88 arcseconds'
    inputs: {b: 6.957e8 m, rad: 1 radian}
    formula: 2*G*M_sun/(b*c**2)*rad
    expected: 0.88 arcsecond
    shown: ['it would be half, about 0.88 arcseconds', 'Only half of it, 0.88 arcseconds']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: history
    kind: fact
    where: 'worked example: the deflection confirmed in 1919; Hughes: tests rested on this metric until about twenty years before the lecture'
    shown: ['until about twenty years before the lecture']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: eclipse-1919
    kind: fact
    where: 'worked example: the 1919 eclipse test and later radio measurements of the deflection (better than 0.1%)'
    shown: ['the 1919 eclipse expeditions set out to test', 'better than 0.1%']
    source: {ref: 'Dyson, Eddington and Davidson, Phil. Trans. R. Soc. A 220, 291 (1920); VLBI deflection measurements, e.g. Lambert and Le Poncin-Lafitte, A&A 499, 331 (2009): gamma = 1 to about 1e-4'}
    origin: later-data
