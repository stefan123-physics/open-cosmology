  - id: vd-ephi-r2-x
    where: 'diagram: e_phi at r = 2, phi = 30 degrees has x component -r sin phi = -1'
    inputs: {}
    formula: -2 * sin(30 * pi / 180)
    expected: '-1'
    shown: ['{ x: -1, y: 1.732']
    source: {cite: reading1, at: 'transcript p. 2'}
    origin: page-own

  - id: d-phi-e-r
    kind: identity
    where: 'formula "Derivatives of the polar basis vectors": the x component of d e_r / d phi equals that of e_phi / r, i.e. -sin phi (plus 2 for a defined relative difference)'
    formula: 2 + deriv('cos(p)', 'p', ph, 1)
    equals: 2 - sin(ph)
    samples: {ph: [0.3, 1.2, 2.9, -0.8]}
    tolerance: 1e-8
    shown: ['\partial_\phi\vec e_r = \frac{1}{r}\,\vec e_\phi']
    source: {cite: reading1, at: 'transcript pp. 4–5'}
    origin: mit

  - id: d-phi-e-phi
    kind: identity
    where: 'formula "Derivatives of the polar basis vectors": the x component of d e_phi / d phi, d(-r sin phi)/d phi, equals that of -r e_r, -r cos phi (plus 5)'
    formula: 5 + deriv('-r * sin(p)', 'p', ph, 1)
    equals: 5 - r * cos(ph)
    samples: {ph: [0.3, 1.2, 2.9], r: [0.5, 2, 3.7]}
    tolerance: 1e-8
    shown: ['\partial_\phi\vec e_\phi = -r\,\vec e_r']
    source: {cite: reading1, at: 'transcript pp. 4–5'}
    origin: mit

  - id: christoffel-r-phiphi
    kind: identity
    where: 'worked example "Polar Christoffel symbols from the metric": Gamma^r_phiphi = (1/2) g^rr (-d_r g_phiphi) = -r (plus 10)'
    formula: 10 + 0.5 * 1 * (0 + 0 - deriv('x**2', 'x', r, 1))
    equals: 10 - r
    samples: {r: [0.5, 1, 2, 3.7]}
    tolerance: 1e-8
    shown: ['= \tfrac12(0 + 0 - 2r) = -r$']
    source: {cite: reading1, at: 'transcript pp. 6 and 17'}
    origin: page-own

  - id: christoffel-phi-rphi
    kind: identity
    where: 'worked example "Polar Christoffel symbols from the metric": Gamma^phi_rphi = (1/2) g^phiphi d_r g_phiphi = 1/r'
    formula: 0.5 * (1 / r**2) * deriv('x**2', 'x', r, 1)
    equals: 1 / r
    samples: {r: [0.5, 1, 2, 3.7]}
    tolerance: 1e-8
    shown: ['= \tfrac12\cdot\tfrac{1}{r^2}\cdot 2r = 1/r$']
    source: {cite: reading1, at: 'transcript pp. 6 and 17'}
    origin: page-own

  - id: divergence-a-polar
    where: 'worked example "Two divergences, two ways": A^r = r, so d_r A^r + A^r / r = 1 + 1 = 2'
    inputs: {r: 1.7}
    formula: deriv('x', 'x', r, 1) + r / r
    expected: '2'
    shown: ['$\partial_r A^r + A^r/r = 1 + 1 = 2$']
    source: {cite: reading1, at: 'transcript p. 9 (formula); the field is the page''s own'}
    origin: page-own

  - id: divergence-a-cartesian
    where: 'worked example "Two divergences, two ways": Cartesian divergence of x e_x + y e_y'
    inputs: {x: 0.4, y: 1.3}
    formula: deriv('u', 'u', x, 1) + deriv('u', 'u', y, 1)
    expected: '2'
    shown: ['$\nabla\cdot\vec A = \partial_x x + \partial_y y = 2$']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: page-own

  - id: redshift-50m
    where: 'worked example "A redshift up a tall building": g h / c^2 for h = 50 m'
    inputs: {g: 9.81 m/s**2, h: 50 m}
    formula: g * h / c**2
    expected: '5.46e-15'
    shown: ['\approx 5.46\times 10^{-15}$']
    source: {cite: reading1, at: 'transcript p. 20 (factor gh/c^2); the height is the page''s own'}
    origin: page-own

  - id: redshift-exact-vs-approx
    kind: identity
    where: 'formula "Gravitational redshift": m/(m + m g h) is 1 - gh to first order in gh (c = 1); checked with the second-order remainder (gh)^2/(1 + gh)'
    formula: 1 / (1 + q)
    equals: 1 - q + q**2 / (1 + q)
    samples: {q: [1e-15, 1e-9, 0.01, 0.2]}
    tolerance: 1e-12
    shown: ['\frac{\omega_{\text{top}}}{\omega_{\text{bottom}}} = \frac{m}{m + m g h} \approx 1 - \frac{g h}{c^2}']
    source: {cite: reading1, at: 'transcript pp. 19–20'}
    origin: mit
