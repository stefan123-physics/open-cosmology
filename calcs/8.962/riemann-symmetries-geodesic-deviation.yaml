# Calculations on content/year-5/8.962/riemann-symmetries-geodesic-deviation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-5/8.962/riemann-symmetries-geodesic-deviation.mdx
calcs:
  - id: riemann-count-4d
    where: 'section "The symmetries of Riemann": n^2(n^2 - 1)/12 = 20 for n = 4'
    inputs: {n: 4}
    formula: n**2 * (n**2 - 1) / 12
    expected: '20'
    shown: ['which is 20 for $n = 4$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit

  - id: riemann-naive
    where: 'section "The symmetries of Riemann": 4^4 = 256'
    inputs: {}
    formula: 4**4
    expected: '256'
    shown: ['seems to have 256 components']
    source: {cite: reading1, at: 'transcript p. 2'}
    origin: mit

  - id: ricci-count
    where: 'section "Ricci and Weyl": a symmetric 4 x 4 tensor has 10 components'
    inputs: {n: 4}
    formula: n * (n + 1) / 2
    expected: '10'
    shown: ['in four dimensions Ricci has 10 independent components']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: weyl-count
    where: 'section "Ricci and Weyl": Weyl has 20 - 10 = 10 components in four dimensions'
    inputs: {n: 4}
    formula: n**2 * (n**2 - 1) / 12 - n * (n + 1) / 2
    expected: '10'
    shown: ['which leaves 10 independent components in four dimensions']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: mit

  - id: sphere-ricci-thetatheta
    where: 'worked example "Ricci curvature of a sphere": R^phi_thetaphitheta = a^2 sin^2 / (a^2 sin^2) = 1'
    inputs: {a: 2.5, th: 0.8}
    formula: a**2 * sin(th)**2 / (a**2 * sin(th)**2)
    expected: '1'
    shown: ['so $R^\phi{}_{\theta\phi\theta} = a^2\sin^2\theta/(a^2\sin^2\theta) = 1$']
    source: {cite: reading1, at: 'transcript p. 6 (definition of Ricci); the sphere is the page''s own example'}
    origin: page-own

  - id: sphere-ricci-scalar
    kind: identity
    where: 'worked example: R = g^thth R_thth + g^phph R_phph = 1/a^2 + sin^2/(a^2 sin^2) = 2/a^2'
    formula: 1 / a**2 * 1 + 1 / (a**2 * sin(th)**2) * sin(th)**2
    equals: 2 / a**2
    samples: {a: [0.5, 1, 3], th: [0.3, 1.2, 2.5]}
    tolerance: 1e-12
    shown: ['= 1/a^2 + \sin^2\theta/(a^2\sin^2\theta) = 2/a^2$']
    source: {cite: reading1, at: 'transcript p. 7 (Ricci scalar)'}
    origin: page-own

  - id: sphere-einstein-zero
    kind: identity
    where: 'worked example: G_thth = 1 - (1/2) a^2 (2/a^2) = 0 and G_phph = sin^2 - (1/2) a^2 sin^2 (2/a^2) = 0 (plus 1)'
    formula: 1 + (1 - 0.5 * a**2 * (2 / a**2)) + (sin(th)**2 - 0.5 * a**2 * sin(th)**2 * (2 / a**2))
    equals: '1'
    samples: {a: [0.5, 1, 3], th: [0.3, 1.2, 2.5]}
    tolerance: 1e-12
    shown: ['$G_{\theta\theta} = 1 - \tfrac12 a^2 (2/a^2) = 0$']
    source: {cite: reading1, at: 'transcript p. 20 (Einstein tensor)'}
    origin: page-own

  - id: iss-radius
    kind: fact
    where: 'worked example and quiz 4: r = 6.771e6 m, about 400 km above the Earth (6.371e6 m radius)'
    value: 6.771e6 m
    shown: ['$r = 6.771\times 10^6$ m (about 400 km up)']
    source: {cite: reading1, at: 'transcript p. 16 (tides); the orbit is the page''s own example'}
    origin: page-own

  - id: iss-tidal-rate
    where: 'worked example "Tides at the height of the Space Station": 2GM/r^3'
    inputs: {GM: 3.986e14 m**3/s**2, r: 6.771e6 m}
    formula: 2 * GM / r**3
    expected: 2.57e-6 1/s**2
    shown: ['\approx 2.57\times 10^{-6}\ \text{s}^{-2}$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: iss-tidal-1m
    where: 'worked example and quiz 4: relative acceleration for 1 m separation, about 2.6e-6 m/s^2'
    inputs: {GM: 3.986e14 m**3/s**2, r: 6.771e6 m, xi: 1 m}
    formula: 2 * GM / r**3 * xi
    expected: 2.6e-6 m/s**2
    shown: ['accelerate apart at about $2.6\times 10^{-6}$ m/s²']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: plot-iss-point
    where: 'plot point ISS at 400 km: 2GM/r^3 in units of 1e-6 s^-2'
    inputs: {GM: 3.986e14, r: 6.771e6}
    formula: 2 * GM / r**3 * 1e6
    expected: '2.568'
    shown: ['{ x: 400, y: 2.568, label: "ISS" }']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: plot-surface
    where: 'plot caption: about 3.08e-6 s^-2 at the surface (R = 6371 km)'
    inputs: {GM: 3.986e14 m**3/s**2, R: 6.371e6 m}
    formula: 2 * GM / R**3
    expected: 3.08e-6 1/s**2
    shown: ['It falls from about 3.08 × 10⁻⁶ s⁻² at the surface']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: tidal-newtonian-limit
    kind: identity
    where: 'worked example: -d^2/dr^2 (-GM/r) = 2GM/r^3 (GM = 1 units)'
    formula: -deriv('-1 / x', 'x', r, 2)
    equals: 2 / r**3
    samples: {r: [0.5, 1, 2, 7]}
    tolerance: 1e-6
    shown: ['$-\partial_r^2\Phi = 2GM/r^3$']
    source: {cite: reading1, at: 'transcript p. 16 (tides)'}
    origin: page-own
