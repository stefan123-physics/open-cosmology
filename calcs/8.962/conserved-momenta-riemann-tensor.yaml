# Calculations on content/year-5/8.962/conserved-momenta-riemann-tensor.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-5/8.962/conserved-momenta-riemann-tensor.mdx
calcs:
  - id: earth-phi
    where: 'worked example "How small is Phi at the Earth''s surface?": GM/(R c^2)'
    inputs: {GM: 3.986e14 m**3/s**2, R: 6.371e6 m}
    formula: GM / (R * c**2)
    expected: '6.96e-10'
    shown: ['\approx 6.96\times 10^{-10}$']
    source: {cite: reading1, at: 'transcript p. 8 (the metric); the Earth values are the page''s own'}
    origin: page-own

  - id: earth-phi-squared
    where: 'worked example: Phi^2 about 5e-19'
    inputs: {GM: 3.986e14 m**3/s**2, R: 6.371e6 m}
    formula: (GM / (R * c**2))**2
    expected: '5e-19'
    tolerance: 0.2e-19
    shown: ['Its square, about $5\times 10^{-19}$']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: earth-g
    where: 'worked example: GM / R^2 = 9.82 m/s^2'
    inputs: {GM: 3.986e14 m**3/s**2, R: 6.371e6 m}
    formula: GM / R**2
    expected: 9.82 m/s**2
    shown: ['\approx -9.82\ \text{m/s}^2$']
    source: {cite: reading1, at: 'transcript pp. 10–11'}
    origin: page-own

  - id: gamma-i00
    kind: identity
    where: 'formula "The relevant Christoffel symbol": -(1/2) g^ii d_i g_00 with g_00 = -(1 + 2 Phi), g^ii = 1/(1 - 2 Phi) equals dPhi/(1 - 2 Phi); checked for Phi = eps * x at sample points (plus 1)'
    formula: 1 + (-0.5) * (1 / (1 - 2 * eps * x)) * deriv('-(1 + 2 * eps * u)', 'u', x, 1)
    equals: 1 + eps / (1 - 2 * eps * x)
    samples: {eps: [0.001, 0.01, 0.05], x: [0.3, 1.0, 2.0]}
    tolerance: 1e-8
    shown: ['\Gamma^i_{00} = -\tfrac12\,g^{ij}\,\partial_j g_{00} = \frac{\partial_i\Phi}{1 - 2\Phi} \approx \partial_i\Phi']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  - id: octant-excess
    where: 'section "Curvature from parallel transport round a loop" and quiz 2: the triangle with three right angles has an excess of 90 degrees'
    inputs: {}
    formula: 90 + 90 + 90 - 180
    expected: '90'
    shown: ['comes back up to the pole turned by 90°']
    source: {cite: reading1, at: 'transcript pp. 13–14'}
    origin: mit

  - id: holonomy-60-excess
    where: 'worked example "Holonomy on a sphere": 60 + 90 + 90 - 180 = 60 degrees'
    inputs: {}
    formula: 60 + 90 + 90 - 180
    expected: '60'
    shown: ['which add to 240°: an excess of 60°']
    source: {cite: reading1, at: 'transcript pp. 13–14 (rule); the triangle is the page''s own'}
    origin: page-own

  - id: holonomy-60-area
    where: 'worked example: area of the triangle / a^2 = (1/6)(2 pi) = pi/3 rad = 60 degrees'
    inputs: {}
    formula: (60 / 360) * 2 * pi * 180 / pi
    expected: '60'
    shown: ['its area is $\pi a^2/3$. Divided by $a^2$ that is $\pi/3$ radians, which is 60°']
    source: {cite: reading1, at: 'transcript pp. 13–14'}
    origin: page-own

  - id: sphere-riemann
    kind: identity
    where: 'worked example "The Riemann tensor of a sphere": d_theta(-sin cos) - Gamma^theta_phiphi Gamma^phi_thetaphi = sin^2 theta (plus 1)'
    formula: 1 + deriv('-sin(u) * cos(u)', 'u', th, 1) - (-sin(th) * cos(th)) * (cos(th) / sin(th))
    equals: 1 + sin(th)**2
    samples: {th: [0.3, 0.9, 1.5, 2.6]}
    tolerance: 1e-8
    shown: ['In total $R^\theta{}_{\phi\theta\phi} = \sin^2\theta$']
    source: {cite: reading1, at: 'transcript p. 19 (definition); the sphere is the page''s own example'}
    origin: page-own

  - id: sphere-gauss-curvature
    kind: identity
    where: 'worked example: R_thetaphithetaphi / det g = a^2 sin^2 / (a^4 sin^2) = 1/a^2'
    formula: a**2 * sin(th)**2 / (a**4 * sin(th)**2)
    equals: 1 / a**2
    samples: {a: [0.5, 1, 3], th: [0.3, 1.2, 2.5]}
    tolerance: 1e-12
    shown: ['leaves $1/a^2$, the same at every point']
    source: {cite: reading1, at: 'transcript p. 21 (one number in two dimensions)'}
    origin: page-own

  - id: riemann-naive
    where: 'section "What the Riemann tensor does": 4^4 = 256'
    inputs: {}
    formula: 4**4
    expected: '256'
    shown: ['$4^4 = 256$ components']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: riemann-n1
    where: 'n = 1 gives 0'
    inputs: {n: 1}
    formula: n**2 * (n**2 - 1) / 12
    expected: '0'
    shown: ['For $n = 1$ this is 0']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: riemann-n2
    where: 'n = 2 gives 1; quiz 3'
    inputs: {n: 2}
    formula: n**2 * (n**2 - 1) / 12
    expected: '1'
    shown: ['For $n = 2$ it is 1', '$4 \\cdot 3/12 = 1$ for $n = 2$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: mit

  - id: riemann-n4
    where: 'n = 4 gives 16 x 15 / 12 = 20; quiz 3'
    inputs: {n: 4}
    formula: n**2 * (n**2 - 1) / 12
    expected: '20'
    shown: ['For $n = 4$ it is $16 \times 15/12 = 20$', '$16 \\cdot 15/12 = 20$ for $n = 4$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: mit

  - id: loop-holonomy-sign
    kind: identity
    where: 'formula "Change of a vector carried round a small loop": sign check with an abelian test connection (A_x = 0, A_y = x, so d_x A_y - d_y A_x = 1). Going first along x (side h), then y, then back: the first-order change is minus the integrals of A along the legs, which sum to -h^2 times (d_x A_y - d_y A_x), i.e. delta V = -F h^2 V, matching the minus sign in front of R for this orientation'
    formula: (-integrate('x + h + 0 * v', 'v', y, y + h) + integrate('x + 0 * v', 'v', y, y + h)) / h**2
    equals: '-1'
    samples: {x: [0.5, 1.2, 3.0], y: [0.7, 2.0, -1.0], h: [1e-3, 1e-2, 0.1]}
    tolerance: 1e-8
    shown: ['\delta V^\alpha = -R^\alpha{}_{\mu\sigma\lambda}\,V^\mu\,\delta x^\sigma\,\delta x^\lambda']
    source: {cite: reading1, at: 'transcript pp. 15–19 (the method); the sign check is the page''s own'}
    origin: page-own
