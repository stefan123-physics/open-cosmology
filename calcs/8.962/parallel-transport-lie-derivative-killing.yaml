calcs:
  - id: pt-circle-r-equation
    kind: identity
    where: 'worked example "Parallel transport round a circle": dA^r/dphi + Gamma^r_phiphi U^phi A^phi = -sin phi + (-R)(1)(-sin phi / R) = 0 (plus 1 for a defined relative difference)'
    formula: 1 + deriv('cos(p)', 'p', ph, 1) + (-R) * 1 * (-sin(ph) / R)
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.9, 5.0], R: [0.5, 2, 7, 1.3]}
    tolerance: 1e-8
    shown: ['$dA^r/d\phi + \Gamma^r_{\phi\phi}U^\phi A^\phi = -\sin\phi + (-R)(1)(-\sin\phi/R) = 0$']
    source: {cite: reading1, at: 'transcript pp. 6–7 (the equation); the example is the page''s own'}
    origin: page-own

  - id: pt-circle-phi-equation
    kind: identity
    where: 'worked example "Parallel transport round a circle": dA^phi/dphi + Gamma^phi_phir U^phi A^r = -cos phi / R + cos phi / R = 0 (plus 1)'
    formula: 1 + deriv('-sin(p) / R', 'p', ph, 1) + (1 / R) * 1 * cos(ph)
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.9, 5.0], R: [0.5, 2, 7, 1.3]}
    tolerance: 1e-8
    shown: ['$dA^\phi/d\phi + \Gamma^\phi_{\phi r}U^\phi A^r = -\cos\phi/R + (1/R)\cos\phi = 0$']
    source: {cite: reading1, at: 'transcript pp. 6–7'}
    origin: page-own

  - id: lie-rotation-radial
    kind: identity
    where: 'worked example "A radial field dragged round by a rotation": x component of U.grad A - A.grad U with U = (-y, x), A = (x, y) is (-y) - (-y) = 0 (plus 1)'
    formula: 1 + ((-y) * 1 + x * 0) - (x * 0 + y * (-1))
    equals: '1'
    samples: {x: [0.3, -1.2, 2.0], y: [0.7, 1.5, -0.4]}
    tolerance: 1e-12
    shown: ['$\mathcal{L}_U A = (-y, x) - (-y, x) = 0$']
    source: {cite: reading1, at: 'transcript p. 10 (formula); the fields are the page''s own'}
    origin: page-own

  - id: killing-line-angular-momentum
    where: 'worked example "Angular momentum from a Killing vector": x dy/dl - y dx/dl on the line y = 2 at unit speed'
    inputs: {x: 3.7, y: 2, vx: 1, vy: 0}
    formula: x * vy - y * vx
    expected: '-2'
    shown: ['$r^2\,d\phi/d\lambda = x\,dy/d\lambda - y\,dx/d\lambda = 0 - 2 \cdot 1 = -2$']
    source: {cite: reading1, at: 'transcript pp. 14–15 (conserved quantity); the example is the page''s own'}
    origin: page-own

  - id: killing-polar-identity
    kind: identity
    where: 'worked example: r^2 dphi/dl equals x dy/dl - y dx/dl along x = l, y = 2 (phi = atan(2/l) for l > 0), checked by differentiating phi'
    formula: (l**2 + 4) * deriv('atan(2 / s)', 's', l, 1)
    equals: '-2'
    samples: {l: [0.2, 1, 4, 9]}
    tolerance: 1e-6
    shown: ['So $U^\alpha C_\alpha = r^2\,d\phi/d\lambda$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: spherical-det
    kind: identity
    where: 'formula "The volume element in spherical coordinates": det diag(1, r^2, r^2 sin^2 theta) = r^4 sin^2 theta and its square root is r^2 sin theta'
    formula: sqrt(1 * r**2 * r**2 * sin(th)**2)
    equals: r**2 * sin(th)
    samples: {r: [0.5, 2, 3.3], th: [0.2, 1.0, 2.5]}
    tolerance: 1e-12
    shown: ['g = \det g_{ij} = r^4\sin^2\theta']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: mit

  - id: ball-volume
    where: 'worked example "Volume of a ball from sqrt g": (8/3)(2)(2 pi) = 32 pi / 3'
