    formula: integrate('r**2', 'r', 0, 2) * integrate('sin(t)', 't', 0, pi) * 2 * pi
    expected: '33.51'
    shown: ['$V = (8/3)(2)(2\pi) = 32\pi/3 \approx 33.51$']
    source: {cite: reading1, at: 'transcript p. 17 (volume element); the radius is the page''s own'}
    origin: page-own

  - id: ball-volume-check
