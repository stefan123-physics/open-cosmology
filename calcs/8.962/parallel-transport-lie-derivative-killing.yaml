  - id: levi-civita-det
    kind: identity
    where: 'formula "Levi-Civita symbol and the determinant": the full contraction eps_{mu nu rho sigma} M^mu_0 M^nu_1 M^rho_2 M^sigma_3 is det M; checked for a 2 x 2 analogue eps_ij M_i1 M_j2 = det M (plus 10)'
