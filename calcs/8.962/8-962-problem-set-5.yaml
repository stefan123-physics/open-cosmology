# Calculations on content/year-5/8.962/8-962-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# numerical derivatives of the metric (connection coefficients, tidal terms, the curvature of the sphere and of the
# two-dimensional spacetime), numerical integrals (the bending of light, the solid angle, the proper distance), or
# the differential equation that a solution must obey.
# The speed of light is 1 and G is kept, except in the number entries, which use SI units.
# Outside this file, while writing (NumPy and SciPy): geodesics of the weak-field metric integrated for the shuttle and
# the bag (Problem 1(d)) and for the light ray (Problem 2); the transport equations on the sphere solved round a circle
# of latitude and round a small loop (Problems 3 and 4(b)); the Riemann tensor of Problem 6 by finite differences of
# the metric, and the flat metric carried back through the change of coordinates of Problem 6(b). The page says so
# where it mentions these checks.
# Short names in the samples: F = Φ, K = GM, At and Ap = A^θ and A^φ, f = φ along the circle.

page: content/year-5/8.962/8-962-problem-set-5.mdx
calcs:
  # ---- Constants (NASA fact sheets)

  - id: const-gm-earth
    kind: fact
    where: 'Problem 1(b), statement: GM of the Earth, 0.39860 × 10^6 km^3/s^2 on the NASA Earth Fact Sheet'
    shown: ['$GM = 3.9860\times 10^{14}$ m³/s² (NASA']
    source: {cite: nasaearth, at: 'Bulk parameters: GM'}
    origin: page-own

  - id: const-r-earth
    kind: fact
    where: 'Problem 1(b), statement: the volumetric mean radius of the Earth on the NASA Earth Fact Sheet'
    shown: ['mean radius of 6371 km']
    source: {cite: nasaearth, at: 'Bulk parameters: volumetric mean radius'}
    origin: page-own

  - id: const-gm-sun
    kind: fact
    where: 'Problem 2, statement: GM of the Sun, 132,712 × 10^6 km^3/s^2 on the NASA Sun Fact Sheet'
    shown: ['$GM = 1.32712\times 10^{20}$ m³/s² for the Sun']
    source: {cite: nasasun, at: 'Bulk parameters: GM'}
    origin: page-own

  - id: const-r-sun
    kind: fact
    where: 'Problem 2, statement: the volumetric mean radius of the Sun on the NASA Sun Fact Sheet'
    shown: ['$b = 695\,700$ km']
    source: {cite: nasasun, at: 'Bulk parameters: volumetric mean radius'}
    origin: page-own

  - id: const-c
    where: 'Problem 2, statement: the speed of light (exact)'
    formula: c
    expected: 299792458 m/s
    shown: ['$c = 299\,792\,458$ m/s']
    source: {cite: mit, at: 'Problem 2 (our own addition)'}
    origin: page-own

  - id: const-arcsec
    where: 'Problem 2, statement: arcseconds in one radian'
    formula: 180*3600/pi
    expected: '206265'
    shown: ['One radian is 206 265 arcseconds']
    source: {cite: mit, at: 'Problem 2 (our own addition)'}
    origin: page-own

  # ---- Problem 1(a): connection coefficients of the weak-field metric, each from a numerical derivative of the metric

  - id: p1a-gamma
    kind: identity
    answer: p1a-gamma
    where: 'Problem 1(a), answer box: against −(1/2) g^θθ ∂_θ g_φφ with a numerical derivative'
    formula: -sin(theta)*cos(theta)
    equals: -0.5/((1 + 2*F)*r**2)*deriv('(1 + 2*F)*r**2*sin(q)**2', 'q', theta)
    samples:
      theta: [0.3, 0.7, 1.0, 1.3, 1.5]
      F: [0.001, 0.01, 0.1, 0.2, 0.05]
      r: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['id="p1a-gamma"']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-gamma-rtheta
    kind: identity
    where: 'Problem 1(a), formula "the coefficients with upper index theta": Γ^θ_rθ against (1/2) g^θθ ∂_r g_θθ, with Φ = K/r'
    formula: (1 + K/r)/(r*(1 + 2*K/r))
    equals: 0.5/((1 + 2*K/r)*r**2)*deriv('(1 + 2*K/q)*q**2', 'q', r)
    samples:
      K: [0.001, 0.01, 0.1, 0.3, 0.05]
      r: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 1(a): the coefficients with upper index theta"']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-gamma-ttr
    kind: identity
    where: 'Problem 1(a), formula "the other connection coefficients": Γ^t_tr against ∂_r g_tt/(2 g_tt)'
    formula: (K/r)/(r*(1 - 2*K/r))
    equals: 0.5/(-(1 - 2*K/r))*deriv('-(1 - 2*K/q)', 'q', r)
    samples:
      K: [0.001, 0.01, 0.1, 0.3, 0.05]
      r: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['\Gamma^t_{tr} = \frac{\Phi}{r\left(1 - 2\Phi\right)}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-gamma-rtt
    kind: identity
    where: 'Problem 1(a), formula "the other connection coefficients": Γ^r_tt against −∂_r g_tt/(2 g_rr)'
    formula: (K/r)/(r*(1 + 2*K/r))
    equals: -0.5/(1 + 2*K/r)*deriv('-(1 - 2*K/q)', 'q', r)
    samples:
      K: [0.001, 0.01, 0.1, 0.3, 0.05]
      r: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['\Gamma^r_{tt} = \frac{\Phi}{r\left(1 + 2\Phi\right)}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-gamma-rrr
    kind: identity
    where: 'Problem 1(a), formula "the other connection coefficients": Γ^r_rr against ∂_r g_rr/(2 g_rr)'
    formula: -(K/r)/(r*(1 + 2*K/r))
    equals: 0.5/(1 + 2*K/r)*deriv('1 + 2*K/q', 'q', r)
    samples:
      K: [0.001, 0.01, 0.1, 0.3, 0.05]
      r: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['\Gamma^r_{rr} = -\frac{\Phi}{r\left(1 + 2\Phi\right)}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-gamma-rthth
    kind: identity
    where: 'Problem 1(a), formula "the other connection coefficients": Γ^r_θθ against −∂_r g_θθ/(2 g_rr)'
    formula: -r*(1 + K/r)/(1 + 2*K/r)
    equals: -0.5/(1 + 2*K/r)*deriv('(1 + 2*K/q)*q**2', 'q', r)
    samples:
      K: [0.001, 0.01, 0.1, 0.3, 0.05]
      r: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['\Gamma^r_{\theta\theta} = -\frac{r\left(1 + \Phi\right)}{1 + 2\Phi}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-gamma-phthph
    kind: identity
    where: 'Problem 1(a), formula "the other connection coefficients": Γ^φ_θφ = cot θ against ∂_θ g_φφ/(2 g_φφ)'
    formula: cos(theta)/sin(theta)
    equals: 0.5/sin(theta)**2*deriv('sin(q)**2', 'q', theta)
    samples:
      theta: [0.3, 0.7, 1.0, 1.3, 1.5]
    tolerance: 1e-7
    shown: ['\Gamma^\phi_{r\phi} = \Gamma^\theta_{r\theta}, \quad \Gamma^\phi_{\theta\phi} = \cot\theta']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-first-order
    kind: limit
    where: 'Problem 1(a), solution: to first order in Φ, Γ^r_tt is Φ/r'
    inputs: {r: 1}
    formula: (F/r)/(r*(1 + 2*F))
    limit: F/r
    vary:
      F: [0.01, 0.001, 0.0001, 0.00001]
    tolerance: 1e-4
    shown: ['\Gamma^t_{tr} \approx \Gamma^r_{tt} \approx \Phi/r = GM/r^2']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  # ---- Problem 1(b): the orbital frequency

  # Ω² = −Γ^r_tt/Γ^r_φφ = ∂_r(−g_tt)/∂_r g_φφ at θ = π/2, with numerical derivatives of the metric; for Φ → 0 it is GM/R³.
  - id: p1b-omega
    kind: limit
    answer: p1b-omega
    where: 'Problem 1(b), answer box: against the ratio of numerical derivatives of g_tt and g_φφ, as Φ = GM/R goes to zero'
    inputs: {G: 1, R: 1}
    formula: sqrt(G*M/R**3)
    limit: sqrt(deriv('1 - 2*G*M/q', 'q', R)/deriv('(1 + 2*G*M/q)*q**2', 'q', R))
    vary:
      M: [0.01, 0.001, 0.0001, 0.00001]
    tolerance: 1e-5
    shown: ['id="p1b-omega"']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-omega-exact
    kind: identity
    where: 'Problem 1(b), formula "Kepler''s third law": GM/(R³(1 + Φ)) against the ratio of numerical derivatives of the metric'
    formula: K/(R**3*(1 + K/R))
    equals: deriv('1 - 2*K/q', 'q', R)/deriv('(1 + 2*K/q)*q**2', 'q', R)
    samples:
      K: [0.001, 0.01, 0.1, 0.3, 0.05]
      R: [1, 2, 0.5, 3, 7]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 1(b): Kepler''s third law"']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-radius
    where: 'Problem 1(b), statement: 400 km above the mean radius, in km'
    formula: 6371 + 400
    expected: '6771'
    shown: ['so $R = 6771$ km']
    source: {cite: mit, at: 'Problem 1(b) (our own addition)'}
    origin: page-own

  - id: p1b-omega-number
    where: 'Problem 1(b), solution: Ω for R = 6771 km'
    inputs: {GM: 3.9860e14 m**3/s**2, R: 6.771e6 m}
    formula: sqrt(GM/R**3)
    expected: 1.133e-3 1/s
    shown: ['\Omega = \sqrt{3.9860\times 10^{14}/(6.771\times 10^6)^3} = 1.133\times 10^{-3}$ rad/s']
    source: {cite: mit, at: 'Problem 1(b) (our own addition)'}
    origin: page-own

  - id: p1b-period-seconds
    where: 'Problem 1(b), solution: the period in seconds'
    inputs: {GM: 3.9860e14 m**3/s**2, R: 6.771e6 m}
    formula: 2*pi*sqrt(R**3/GM)
    expected: 5545 s
    shown: ['$2\pi/\Omega = 5545$ s']
    source: {cite: mit, at: 'Problem 1(b) (our own addition)'}
    origin: page-own

  - id: p1b-period
    answer: p1b-period
    where: 'Problem 1(b), answer box: the period 2π sqrt(R³/GM), in minutes'
    inputs: {GM: 3.9860e14 m**3/s**2, R: 6.771e6 m}
    formula: 2*pi*sqrt(R**3/GM)
    expected: 92.4 min
    shown: ['id="p1b-period"', 'which is 92.4 minutes']
    source: {cite: mit, at: 'Problem 1(b) (our own addition)'}
    origin: page-own

  - id: p1b-speed
    where: 'Problem 1(b), check: the orbital speed ΩR = sqrt(GM/R)'
    inputs: {GM: 3.9860e14 m**3/s**2, R: 6.771e6 m}
    formula: sqrt(GM/R)
    expected: 7.67 km/s
    shown: ['$\Omega R = 7.67$ km/s']
    source: {cite: mit, at: 'Problem 1(b) (our own addition)'}
    origin: page-own

  - id: p1b-phi
    where: 'Problem 1(b), check: Φ = GM/(Rc²) on the orbit'
    inputs: {GM: 3.9860e14 m**3/s**2, R: 6.771e6 m}
    formula: GM/(R*c**2)
    expected: '6.55e-10'
    shown: ['$\Phi = GM/(Rc^2) = 6.55\times 10^{-10}$']
    source: {cite: mit, at: 'Problem 1(b) (our own addition)'}
    origin: page-own

  # ---- Problem 1(c): the tidal terms, as numerical second derivatives of Φ = GM/r with GM = Ω²R³

  - id: p1c-zz
    kind: identity
    answer: p1c-zz
    where: 'Problem 1(c), answer box: against the numerical second derivative of GM/r along z at the shuttle'
    formula: -Omega**2
    equals: deriv('Omega**2*R**3/sqrt(R**2 + q**2)', 'q', 0, 2)
    samples:
      Omega: [0.5, 1, 1.3, 2, 0.8]
      R: [1, 2, 0.7, 3, 1.5]
    tolerance: 1e-6
    shown: ['id="p1c-zz"']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-xx
    kind: identity
    answer: p1c-xx
    where: 'Problem 1(c), answer box: against the numerical second derivative of GM/r along x at the shuttle (R cos Ωt, R sin Ωt, 0)'
    formula: Omega**2*(3*cos(Omega*t)**2 - 1)
    equals: deriv('Omega**2*R**3/sqrt(q**2 + (R*sin(Omega*t))**2)', 'q', R*cos(Omega*t), 2)
    samples:
      Omega: [0.5, 1, 1.3, 2, 0.8]
      R: [1, 2, 0.7, 3, 1.5]
      t: [0.2, 0.9, 1.4, 0.3, 2.5]
    tolerance: 1e-6
    shown: ['id="p1c-xx"']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-yy
    kind: identity
    where: 'Problem 1(c), formula "the tidal equations for the garbage": the bracket on ξ^y in the ξ^y equation, against the numerical second derivative along y'
    formula: Omega**2*(3*sin(Omega*t)**2 - 1)
    equals: deriv('Omega**2*R**3/sqrt((R*cos(Omega*t))**2 + q**2)', 'q', R*sin(Omega*t), 2)
    samples:
      Omega: [0.5, 1, 1.3, 2, 0.8]
      R: [1, 2, 0.7, 3, 1.5]
      t: [0.2, 0.9, 1.4, 0.3, 2.5]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 1(c): the tidal equations for the garbage"']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  # The mixed derivative from the second derivative along the diagonal: f'' = (Φ_xx + Φ_yy)/2 + Φ_xy.
  - id: p1c-xy
    kind: identity
    where: 'Problem 1(c), formula "the tidal equations for the garbage": the bracket that couples ξ^x and ξ^y, against a numerical mixed derivative'
    formula: 3*Omega**2*sin(Omega*t)*cos(Omega*t)
    equals: deriv('Omega**2*R**3/sqrt((R*cos(Omega*t) + q/sqrt(2))**2 + (R*sin(Omega*t) + q/sqrt(2))**2)', 'q', 0, 2) - 0.5*deriv('Omega**2*R**3/sqrt(q**2 + (R*sin(Omega*t))**2)', 'q', R*cos(Omega*t), 2) - 0.5*deriv('Omega**2*R**3/sqrt((R*cos(Omega*t))**2 + q**2)', 'q', R*sin(Omega*t), 2)
    samples:
      Omega: [0.5, 1, 1.3, 2, 0.8]
      R: [1, 2, 0.7, 3, 1.5]
      t: [0.2, 0.9, 1.4, 0.3, 2.5]
    tolerance: 1e-5
    shown: ['3\sin\Omega t\cos\Omega t\;\xi^x + \left(3\sin^2\Omega t - 1\right)\xi^y']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-riemann
    kind: identity
    where: 'Problem 1(c), formula "the tidal components of the Riemann tensor": the xx component GM(3x² − r²)/r⁵ against a numerical second derivative of GM/r'
    formula: K*(3*x**2 - (x**2 + y**2 + z**2))/(x**2 + y**2 + z**2)**2.5
    equals: deriv('K/sqrt(q**2 + y**2 + z**2)', 'q', x, 2)
    samples:
      K: [1, 2, 0.5, 1, 3]
      x: [1, 0.3, 2, -1.5, 0.8]
      y: [0.5, 1, -1, 2, 0.1]
      z: [0.2, -0.7, 1, 0.4, 1.1]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 1(c): the tidal components of the Riemann tensor"']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-trace
    kind: identity
    where: 'Problem 1(c), check: the three brackets on the diagonal add up to zero'
    formula: Omega**2*(3*cos(Omega*t)**2 - 1) + Omega**2*(3*sin(Omega*t)**2 - 1) - Omega**2
    equals: 0*Omega
    samples:
      Omega: [0.5, 1, 1.3, 2, 0.8]
      t: [0.2, 0.9, 1.4, 0.3, 2.5]
    tolerance: 1e-12
    shown: ['$\Omega^2(3\cos^2\Omega t + 3\sin^2\Omega t - 3) = 0$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-rates
    kind: identity
    where: 'Problem 1(c), check: at t = 0 the stretching rate along x is 2Ω², from the numerical second derivative of GM/r along the radius'
    formula: 2*Omega**2
    equals: deriv('Omega**2*R**3/q', 'q', R, 2)
    samples:
      Omega: [0.5, 1, 1.3, 2, 0.8]
      R: [1, 2, 0.7, 3, 1.5]
    tolerance: 1e-6
    shown: ['with the rate $2\Omega^2$']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  # ---- Problem 1(d)

  - id: p1d-xi
    kind: identity
    answer: p1d-xi
    where: 'Problem 1(d), answer box: L cos Ωt obeys the ξ^z equation of part (c), by a numerical second derivative'
    formula: L*cos(Omega*t)
    equals: -deriv('L*cos(Omega*q)', 'q', t, 2)/Omega**2
    samples:
      L: [1, 0.5, 2, 1.5, 0.7]
      Omega: [0.5, 1, 1.3, 2, 0.8]
      t: [0.2, 0.9, 1.4, 0.3, 2.5]
    tolerance: 1e-6
    shown: ['id="p1d-xi"']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1d-xi-start
    kind: identity
    where: 'Problem 1(d), formula "the motion of the garbage": the starting value is L and the starting velocity is zero'
    formula: L*cos(Omega*0) + deriv('L*cos(Omega*q)', 'q', 0)
    equals: L
    samples:
      L: [1, 0.5, 2, 1.5, 0.7]
      Omega: [0.5, 1, 1.3, 2, 0.8]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 1(d): the motion of the garbage"']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1d-time
    answer: p1d-time
    where: 'Problem 1(d), answer box: a quarter of the period of the orbit of part (b), in minutes'
    inputs: {GM: 3.9860e14 m**3/s**2, R: 6.771e6 m}
    formula: 2*pi*sqrt(R**3/GM)/4
    expected: 23.1 min
    shown: ['id="p1d-time"', 'which is 23.1 minutes']
    source: {cite: mit, at: 'Problem 1(d) (our own addition)'}
    origin: page-own

  - id: p1d-time-seconds
    where: 'Problem 1(d), solution: a quarter of 5545 s'
    formula: 5545/4
    expected: '1386'
    shown: ['$5545/4 = 1386$ s']
    source: {cite: mit, at: 'Problem 1(d) (our own addition)'}
    origin: page-own

  # ---- Problem 2

  # The two halves of the line are integrated apart; the cut-off at |x| = 10⁴ b changes the result by a fraction 5 × 10⁻⁹.
  - id: p2-angle
    kind: identity
    answer: p2-angle
    where: 'Problem 2, answer box: against the numerical integral of 2 ∂_yΦ along the line y = b'
    formula: 4*G*M/b
    equals: 2*G*M*b*(integrate('1/(x**2 + b**2)**1.5', 'x', -10000*b, 0) + integrate('1/(x**2 + b**2)**1.5', 'x', 0, 10000*b))
    samples:
      G: [1, 0.5, 2, 1, 1.5]
      M: [1, 2, 0.5, 1.5, 0.7]
      b: [1, 2, 3, 4, 1.5]
    tolerance: 1e-6
    shown: ['id="p2-angle"']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-integral
    kind: identity
    where: 'Problem 2, solution: the integral of dx/(x² + b²)^(3/2) over the whole line is 2/b²'
    formula: 2/b**2
    equals: integrate('1/(x**2 + b**2)**1.5', 'x', -10000*b, 0) + integrate('1/(x**2 + b**2)**1.5', 'x', 0, 10000*b)
    samples:
      b: [1, 2, 3, 4, 1.5]
    tolerance: 1e-6
    shown: ['which is $2/b^2$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-half
    kind: identity
    where: 'Problem 2, solution: one of the two equal terms alone (the one from g_tt) gives 2GM/b, half of the angle'
    formula: 2*G*M/b
    equals: G*M*b*(integrate('1/(x**2 + b**2)**1.5', 'x', -10000*b, 0) + integrate('1/(x**2 + b**2)**1.5', 'x', 0, 10000*b))
    samples:
      G: [1, 0.5, 2, 1, 1.5]
      M: [1, 2, 0.5, 1.5, 0.7]
      b: [1, 2, 3, 4, 1.5]
    tolerance: 1e-6
    shown: ['They are equal: each gives half of the bending.']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-path
    kind: identity
    where: 'Problem 2, formula "the path of the ray to first order": its slope against the integral of the sideways kick up to x'
    formula: deriv('b - 2*K/b*(q + sqrt(q**2 + b**2))', 'q', x)
    equals: -2*K*b*integrate('1/(q**2 + b**2)**1.5', 'q', -10000*b, x)
    samples:
      K: [0.01, 0.02, 0.05, 0.01, 0.03]
      b: [1, 2, 3, 4, 1.5]
      x: [-2, 0, 1, 5, -0.5]
    tolerance: 1e-5
    shown: ['<Formula label="Problem 2: the path of the ray to first order"']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-gm-c2
    where: 'Problem 2, solution: GM/c² of the Sun'
    inputs: {GM: 1.32712e20 m**3/s**2}
    formula: GM/c**2
    expected: 1476.6 m
    shown: ['$GM/c^2 = 1.32712\times 10^{20}/(299\,792\,458)^2 = 1476.6$ m']
    source: {cite: mit, at: 'Problem 2 (our own addition)'}
    origin: page-own

  - id: p2-radians
    where: 'Problem 2, solution: the angle at the edge of the Sun in radians'
    formula: 4*1476.6/6.957e8
    expected: '8.49e-6'
    shown: ['$\Delta\phi = 4 \times 1476.6/(6.957\times 10^8) = 8.49\times 10^{-6}$ rad']
    source: {cite: mit, at: 'Problem 2 (our own addition)'}
    origin: page-own

