  # The flat metric carried back through the change of coordinates, with numerical derivatives (side x > x₀, g > 0).
  - id: p6b-gtt
    kind: identity
    where: 'Problem 6(b), formula "the change of coordinates": −(∂t̄/∂t)² + (∂x̄/∂t)² equals g_tt = −g u'
    formula: -deriv('2*sqrt(u/g)*sinh(g*q/2)', 'q', t)**2 + deriv('2*sqrt(u/g)*cosh(g*q/2)', 'q', t)**2
    equals: -g*u
    samples:
      g: [0.5, 1, 2, 3, 1.7]
      u: [0.2, 0.5, 1, 2, 3]
      t: [0.3, 1, -0.5, 0.2, 0.8]
    tolerance: 1e-5
