# Calculations on content/year-5/8.962/gravitational-waves-quadrupole-formula.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 16 transcript; page numbers are the PDF pages of the transcript.
# Checks: the light-travel expansion, the geodesic-deviation response from the Riemann components, projection-tensor
# properties, the trace removal in 2 dimensions, the face-on binary (quadrupole moment, TT projection, numbers), the
# LIGO arm change, and quoted facts.

page: content/year-5/8.962/gravitational-waves-quadrupole-formula.mdx
calcs:
  - id: light-expansion
    kind: identity
    where: 'formula "Light along x in the wave": sqrt(1 + h) = 1 + h/2 to first order (checked at small h)'
    formula: sqrt(1 + hh)
    equals: 1 + hh/2
    samples: {hh: [1e-6, -3e-6, 2e-7]}
    tolerance: 1e-11
    shown: ['dt = \sqrt{1 + h^{\text{TT}}_{xx}}\;dx \approx \left(1 + \frac{1}{2}h^{\text{TT}}_{xx}\right)dx"']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: deviation-x
    kind: identity
    where: 'formula "The response of separated test masses": d2 xi^x/dt2 = -R_x0x0 xi^x - R_x0y0 xi^y with R_x0x0 = -hxx''''/2 and R_x0y0 = -hxy''''/2 (second derivatives as numbers)'
    formula: -(-0.5*axx)*X - (-0.5*axy)*Y
    equals: 0.5*axx*X + 0.5*axy*Y
    samples: {axx: [0.3, -1.2, 2.0], axy: [0.7, 0.4, -1.5], X: [1.0, 0.5, -2.0], Y: [0.2, -1.0, 3.0]}
    tolerance: 1e-12
    shown: ['tex="\frac{\partial^2\xi^{x}}{\partial t^2} = \frac{1}{2}']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  - id: deviation-y
    kind: identity
    where: 'same formula: d2 xi^y/dt2 = -R_y0x0 xi^x - R_y0y0 xi^y with R_y0y0 = -hyy''''/2 = +hxx''''/2 (traceless)'
    formula: -(-0.5*axy)*X - (0.5*axx)*Y
    equals: 0.5*axy*X - 0.5*axx*Y
    samples: {axx: [0.3, -1.2, 2.0], axy: [0.7, 0.4, -1.5], X: [1.0, 0.5, -2.0], Y: [0.2, -1.0, 3.0]}
    tolerance: 1e-12
    shown: ['R_{y0y0} = -\frac{1}{2}\partial_t^2 h^{\text{TT}}_{yy} = \frac{1}{2}\partial_t^2 h^{\text{TT}}_{xx}']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  - id: projector-kills-n
    kind: identity
    where: 'quiz 3 and formula "Projection onto the plane transverse to n": P_ij n_j = n_i - n_i (n.n) = 0 for a unit n (i = x component, n = (sin a cos b, sin a sin b, cos a); plus 1)'
    formula: 1 + sin(aa)*cos(bb) - sin(aa)*cos(bb)*((sin(aa)*cos(bb))**2 + (sin(aa)*sin(bb))**2 + cos(aa)**2)
    equals: '1'
    samples: {aa: [0.3, 1.2, 2.5], bb: [0.1, 2.0, 4.0]}
    tolerance: 1e-12
    shown: ['$P_{ij}n_j = n_i - n_i(n_jn_j) = 0$']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: mit

  - id: projector-trace
    where: 'quiz 3: the trace of P_ij = delta_ij - n_i n_j is 3 - 1 = 2'
    inputs: {}
    formula: 3 - 1
    expected: '2'
    shown: ['so its trace is 2']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: mit

  - id: tt-face-on
    kind: identity
    where: 'worked example step "Project": for n = z the xx component of (P_ik P_jl - P_ij P_kl / 2) Iddot_kl is Ixx - (Ixx + Iyy)/2 = (Ixx - Iyy)/2'
    formula: Ix - 0.5*(Ix + Iy)
    equals: 0.5*(Ix - Iy)
    samples: {Ix: [1.0, -3.0, 0.4], Iy: [2.0, 1.5, -0.7]}
    tolerance: 1e-12
    shown: ['the TT projection of the $xx$ component is $\frac12(\ddot I_{xx} - \ddot I_{yy})$']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: binary-Ixx
    kind: identity
    where: 'worked example step "Quadrupole moment": 2 m (a/2)^2 cos^2 = (m a^2/4)(1 + cos 2 W t), and its second derivative -m a^2 W^2 cos 2 W t'
    formula: 2*mm*(aa/2)**2*cos(W*tt)**2
    equals: (mm*aa**2/4)*(1 + cos(2*W*tt))
    samples: {mm: [1.0, 3.0], aa: [2.0, 0.5], W: [1.3, 0.2], tt: [0.4, 7.0]}
    tolerance: 1e-12
    shown: ['$I_{xx} = 2m(\frac{a}{2})^2\cos^2\Omega t = \frac{ma^2}{4}(1 + \cos 2\Omega t)$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: binary-Ixx-ddot
    kind: identity
    where: 'worked example: d2/dt2 of (m a^2/4) cos 2 W t = -m a^2 W^2 cos 2 W t (numerical second derivative)'
    formula: "deriv('(mm*aa**2/4)*(1 + cos(2*W*u))', 'u', tt, 2)"
    equals: -mm*aa**2*W**2*cos(2*W*tt)
    samples: {mm: [1.0, 3.0], aa: [2.0, 0.5], W: [1.3, 0.2], tt: [0.4, 7.0]}
    tolerance: 1e-5
    shown: ['so $\ddot I_{xx} = -ma^2\Omega^2\cos 2\Omega t = -\ddot I_{yy}$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: binary-omega2
    where: 'worked example step "Numbers": Omega^2 = G (2m) / a^3 with m = 30 M_sun, a = 1000 km'
    inputs: {a: 1000 km}
    formula: G*60*M_sun/a**3
    expected: 7963 1/s**2
    shown: ['$\Omega^2 = 2 \times 30 \times 1.327\times10^{20}/(10^6)^3 \approx 7963\ \text{s}^{-2}$']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: binary-omega
    where: 'worked example: Omega'
    inputs: {a: 1000 km}
    formula: sqrt(G*60*M_sun/a**3)
    expected: 89.2 1/s
    shown: ['$\Omega \approx 89.2$ rad/s']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: binary-fgw
    where: 'worked example: wave frequency 2 Omega / 2 pi'
    inputs: {a: 1000 km}
    formula: 2*sqrt(G*60*M_sun/a**3)/(2*pi)
    expected: 28.4 Hz
    shown: ['$2\Omega/2\pi \approx 28.4$ Hz']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: binary-amplitude
    where: 'worked example and quiz 4: amplitude 2 G m a^2 Omega^2 / (r c^4) at r = 400 Mpc'
    inputs: {a: 1000 km, r: 400 Mpc}
    formula: 2*G*(30*M_sun)*a**2*(G*60*M_sun/a**3)/(r*c**4)
    expected: 6.4e-22
    shown: ['$2Gma^2\Omega^2/(rc^4) \approx 6.4\times10^{-22}$', 'seen face-on from $400$ Mpc, give $h_+ \\approx 6.4\\times10^{-22}$', '400 \times 3.086\times10^{22}$ m']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: ligo-arm
    where: 'worked example step "What LIGO sees" and quiz 4: (1/2) h L for L = 4 km'
    inputs: {L: 4 km}
    formula: 0.5*6.4e-22*L
    expected: 1.3e-18 m
    quiz: 3
    shown: ['$\frac12 h_+L \approx 0.5 \times 6.4\times10^{-22} \times 4000 \approx 1.3\times10^{-18}$ m', '0.5 \\times 6.4\\times10^{-22} \\times 4000\\ \\text{m} \\approx 1.3\\times10^{-18}$ m']
    source: {cite: reading1, at: 'transcript p. 13'}
    origin: page-own

  - id: gm-sun
    where: 'worked example: GM_sun'
    inputs: {}
    formula: G*M_sun
    expected: 1.327e20 m**3/s**2
    shown: ['($GM_\odot = 1.327\times10^{20}\ \text{m}^3/\text{s}^2$.)']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: facts
    kind: fact
    where: 'quoted figures: h of order 1e-21; sources hundreds of millions to billions of light years away, tens to hundreds of km across; Problem Set 2; detections since 2015'
    shown: ['real waves have h of order 10⁻²¹', 'to see $h$ of order $10^{-21}$', 'hundreds of millions to billions of light years, the source tens to hundreds of kilometres', 'Problem Set 2', 'since 2015']
    source: {cite: reading1, at: 'transcript pp. 13–15'}
    origin: mit

  - id: gw170817
    kind: fact
    where: 'cosmology callout: the first standard-siren measurement of the Hubble constant, GW170817 in 2017'
    shown: ['GW170817 in 2017']
    source: {ref: 'LIGO Scientific Collaboration and Virgo Collaboration et al., Nature 551, 85 (2017): a gravitational-wave standard siren measurement of the Hubble constant'}
    origin: later-data
