# Calculations on content/year-5/8.962/8-962-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# a second physical argument (counting particles, relative velocity), numerical derivatives of a path or of the
# coordinate transformation, a numerical integral, or the motion of free particles for the identities of Problem 4.
# The speed of light is 1 throughout, except in Problem 6(e).

page: content/year-5/8.962/8-962-problem-set-2.mdx
calcs:
  # ---- Introduction

  - id: intro-c
    kind: fact
    where: 'Introduction: the speed of light (exact, SI definition of the metre)'
    shown: ['299 792 458 m/s (exact)']
    source: {cite: mit, at: 'Problem 6(e) (our own addition)'}
    origin: page-own

  - id: intro-g
    kind: fact
    where: 'Introduction and Problem 6(e): our own choice of the acceleration'
    shown: ['our own choice $g = 9.81$ m/s²', 'For $g = 9.81$ m/s²']
    source: {cite: mit, at: 'Problem 6(e) (our own addition)'}
    origin: page-own

  # ---- Problem 1

  - id: p1-gamma-dust
    where: 'Problem 1, example: the Lorentz factor of the dust, v = 0.6'
    formula: 1/sqrt(1 - 0.6**2)
    expected: '1.25'
    shown: ['$\gamma = 1/\sqrt{1 - 0.6^2} = 1.25$']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  - id: p1-n-components
    where: 'Problem 1, example: the components of N, 2 γ and 2 γ v'
    formula: 2*1.25*0.6
    expected: '1.5'
    shown: ['$N^\alpha = 2\,(1.25,\ 0.75,\ 0,\ 0) = (2.5,\ 1.5,\ 0,\ 0)$']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  - id: p1-gamma-observer
    where: 'Problem 1, example: the Lorentz factor of the observer, speed 0.8, against 5/3'
    formula: 1/sqrt(1 - 0.8**2) - 5/3 + 1
    expected: '1'
    shown: ['$\gamma = 1/\sqrt{1 - 0.8^2} = 5/3$']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  - id: p1-first-term
    where: 'Problem 1, example: the first term, 2.5 × 5/3'
    formula: 2.5*5/3
    expected: '4.167'
    shown: ['= 4.167 + 2 = 6.167']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  # The box by the second route: n₀ times the Lorentz factor of the relative velocity.
  - id: p1-n
    answer: p1-n
    where: 'Problem 1, answer box: n₀ times the Lorentz factor of the relative velocity (0.6 + 0.8)/(1 + 0.48)'
    formula: 2/sqrt(1 - ((0.6 + 0.8)/(1 + 0.6*0.8))**2)
    expected: '6.167'
    shown: ['id="p1-n"']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  - id: p1-n-direct
    where: 'Problem 1, formula "Problem 1: the example": −N·U from the components in O'
    formula: -(-(2*1.25)*(1/sqrt(1 - 0.8**2)) + (2*1.25*0.6)*(-0.8/sqrt(1 - 0.8**2)))
    expected: '6.167'
    shown: ['<Formula label="Problem 1: the example"']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  - id: p1-relative-speed
    where: 'Problem 1, check: the relative speed'
    formula: (0.6 + 0.8)/(1 + 0.6*0.8)
    expected: '0.9459'
    shown: ['$(0.6 + 0.8)/(1 + 0.6\times 0.8) = 0.9459$']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  - id: p1-relative-gamma
    where: 'Problem 1, check: the Lorentz factor of the relative speed'
    formula: 1/sqrt(1 - ((0.6 + 0.8)/(1 + 0.6*0.8))**2)
    expected: '3.083'
    shown: ['with the Lorentz factor 3.083, and $2\times 3.083 = 6.167$']
    source: {cite: mit, at: 'Problem 1 (our own example)'}
    origin: page-own

  # ---- Problem 2

  # γ − 1 against v²/2 at small speeds (the next term is 3v⁴/8, a relative difference of 3v²/4).
  - id: p2-gamma
    kind: identity
    answer: p2-gamma
    where: 'Problem 2, answer box: the exact γ − 1 at small speeds'
    formula: v**2/2
    equals: 1/sqrt(1 - v**2) - 1
    samples:
      v: [0.001, 0.002, 0.005, 0.01, 0.003]
    tolerance: 1e-4
    shown: ['id="p2-gamma"']
    source: {cite: mit, at: 'Problem 2 (our own addition)'}
    origin: page-own

  - id: p2-gamma-series
    kind: identity
    where: 'Problem 2, formula "Problem 2: the Lorentz factor at low speed": the three terms against the exact factor'
    formula: 1 + v**2/2 + 3*v**4/8
    equals: 1/sqrt(1 - v**2)
    samples:
      v: [0.01, 0.02, 0.05, 0.1, 0.03]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 2: the Lorentz factor at low speed"']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-example-slow
    where: 'Problem 2, check: γ − 1 at v = 0.01, in units of 10⁻⁵'
    formula: (1/sqrt(1 - 0.01**2) - 1)*1e5
    expected: '5.0'
    shown: ['$\gamma - 1 = 5.0\times 10^{-5}$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-example-fast
    where: 'Problem 2, check: γ − 1 at v = 0.6'
    formula: 1/sqrt(1 - 0.6**2) - 1
    expected: '0.25'
    shown: ['At $v = 0.6$ it is $\gamma - 1 = 0.25$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # The exact equation on a sample flow that conserves particles: every particle moves freely with x = x₀ + u(x₀) t,
  # here the uniform stream n = n₁, v = v₁ plus the continuity equation for n = γn₀ checked on a travelling profile
  # n(t, x) = f(x − v t) with constant v: ∂_t n + ∂_x(n v) = 0 (1 is added on both sides).
  - id: p2-exact-travelling
    kind: identity
    where: 'Problem 2, check: the exact equation ∂n/∂t + ∂(n v)/∂x = 0 for a profile n = exp(−(x − v t)²) that moves with the dust at constant v'
    formula: 1 + deriv('exp(-(x - v*s)**2)', 's', t) + deriv('exp(-(s - v*t)**2)*v', 's', x)
    equals: 1
    samples:
      v: [0.1, 0.5, 0.9, 0.3, 0.7]
      t: [0.2, 1, 0.5, 2, 0.1]
      x: [0.5, 0.3, 1, 0.2, -0.4]
    tolerance: 1e-7
    shown: ['the exact equation is $\partial n/\partial t + \partial(nv^i)/\partial x^i = 0$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3(a)

  # Each box by counting: (energy or momentum of one particle) × (number density or number flux), with ρ₀ = m n₀
  # (the samples of rho0 are the products of the samples of m and n0).
  - id: p3a-tt
    kind: identity
    answer: p3a-tt
    where: 'Problem 3(a), answer box T⁰⁰: the energy γm of a particle times the number density γn₀'
    formula: rho0/(1 - b**2)
    equals: (m/sqrt(1 - b**2))*(n0/sqrt(1 - b**2))
    samples:
      rho0: [1, 1, 2, 6, 4.5]
      m: [1, 2, 0.5, 3, 1.5]
      n0: [1, 0.5, 4, 2, 3]
      b: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-10
    shown: ['id="p3a-tt"', 'expr="rho0/(1 - b^2)"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3a-tx
    kind: identity
    answer: p3a-tx
    where: 'Problem 3(a), answer box T⁰ˣ: the energy γm of a particle times the number flux γn₀β'
    formula: rho0*b/(1 - b**2)
    equals: (m/sqrt(1 - b**2))*(n0*b/sqrt(1 - b**2))
    samples:
      rho0: [1, 1, 2, 6, 4.5]
      m: [1, 2, 0.5, 3, 1.5]
      n0: [1, 0.5, 4, 2, 3]
      b: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-10
    shown: ['id="p3a-tx"', 'expr="rho0*b/(1 - b^2)"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3a-xx
    kind: identity
    answer: p3a-xx
    where: 'Problem 3(a), answer box Tˣˣ: the momentum γmβ of a particle times the number flux γn₀β'
    formula: rho0*b**2/(1 - b**2)
    equals: (m*b/sqrt(1 - b**2))*(n0*b/sqrt(1 - b**2))
    samples:
      rho0: [1, 1, 2, 6, 4.5]
      m: [1, 2, 0.5, 3, 1.5]
      n0: [1, 0.5, 4, 2, 3]
      b: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-10
    shown: ['id="p3a-xx"', 'expr="rho0*b^2/(1 - b^2)"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  # The three components by a Lorentz transformation of the rest-frame tensor diag(ρ₀, 0, 0, 0): T^{αβ} = Λ^α_0 Λ^β_0 ρ₀
  # with Λ^t_0 = γ and Λ^x_0 = γβ, written with cosh and sinh of the rapidity r, where β = tanh(r).
  - id: p3a-boost-tt
    kind: identity
    where: 'Problem 3(a), formula "Problem 3(a): the stream of dust": T⁰⁰ from a boost of the rest-frame tensor, with the rapidity'
    formula: rho0/(1 - tanh(r)**2)
    equals: rho0*cosh(r)**2
    samples:
      rho0: [1, 2, 0.5, 3, 1.5]
      r: [0.1, 0.3, 0.7, 1.1, 1.8]
    tolerance: 1e-9
    shown: ['<Formula label="Problem 3(a): the stream of dust"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3a-boost-tx
    kind: identity
    where: 'Problem 3(a), formula "Problem 3(a): the stream of dust": T⁰ˣ from a boost of the rest-frame tensor'
    formula: rho0*tanh(r)/(1 - tanh(r)**2)
    equals: rho0*cosh(r)*sinh(r)
    samples:
      rho0: [1, 2, 0.5, 3, 1.5]
      r: [0.1, 0.3, 0.7, 1.1, 1.8]
    tolerance: 1e-9
    shown: ['<Formula label="Problem 3(a): the stream of dust"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3a-boost-xx
    kind: identity
    where: 'Problem 3(a), formula "Problem 3(a): the stream of dust": Tˣˣ from a boost of the rest-frame tensor'
    formula: rho0*tanh(r)**2/(1 - tanh(r)**2)
    equals: rho0*sinh(r)**2
    samples:
      rho0: [1, 2, 0.5, 3, 1.5]
      r: [0.1, 0.3, 0.7, 1.1, 1.8]
    tolerance: 1e-9
    shown: ['<Formula label="Problem 3(a): the stream of dust"']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3a-trace
    kind: identity
    where: 'Problem 3(a), check: the trace −T⁰⁰ + Tˣˣ is −ρ₀'
    formula: -rho0/(1 - b**2) + rho0*b**2/(1 - b**2)
    equals: -rho0
    samples:
      rho0: [1, 2, 0.5, 3, 1.5]
      b: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-9
    shown: ['$T^\alpha{}_\alpha = -T^{00} + T^{xx} = -\gamma^2\rho_0(1 - \beta^2) = -\rho_0$']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  - id: p3a-example-tt
    where: 'Problem 3(a), check: T⁰⁰ for β = 0.6, ρ₀ = 2'
    formula: 2/(1 - 0.6**2)
    expected: '3.125'
    shown: ['$T^{00} = 3.125$']
    source: {cite: mit, at: 'Problem 3(a) (our own example)'}
    origin: page-own

  - id: p3a-example-tx
    where: 'Problem 3(a), check: T⁰ˣ for β = 0.6, ρ₀ = 2'
    formula: 2*0.6/(1 - 0.6**2)
    expected: '1.875'
    shown: ['$T^{0x} = 1.875$']
    source: {cite: mit, at: 'Problem 3(a) (our own example)'}
    origin: page-own

  - id: p3a-example-xx
    where: 'Problem 3(a), check: Tˣˣ for β = 0.6, ρ₀ = 2'
    formula: 2*0.6**2/(1 - 0.6**2)
    expected: '1.125'
    shown: ['$T^{xx} = 1.125$']
    source: {cite: mit, at: 'Problem 3(a) (our own example)'}
    origin: page-own

  # ---- Problem 3(b)

  # The volume of the torus by a numerical integral over its cross-section: strips of height 2√(δa² − s²) at the
  # distance a + s from the axis, each swept around a circle of length 2π(a + s).
  - id: p3b-volume
    kind: identity
    where: 'Problem 3(b), formula "Problem 3(b): the volume of the ring in O": against a numerical integral over the cross-section'
    formula: 2*pi**2*a*da**2
    equals: integrate('2*pi*(a + s)*2*sqrt(da**2 - s**2)', 's', -da, da)
    samples:
      a: [1, 0.5, 2, 0.8, 1.5]
      da: [0.1, 0.05, 0.02, 0.01, 0.2]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 3(b): the volume of the ring in O"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # ρ₀ = m n/γ with n = N/V, where V is the numerical volume of the torus (not the closed form).
  - id: p3b-rho0
    kind: identity
    answer: p3b-rho0
    where: 'Problem 3(b), answer box ρ₀: m times the density N/V in O, divided by γ, with the volume V from the numerical integral over the cross-section'
    formula: N*m*sqrt(1 - a**2*w**2)/(2*pi**2*a*da**2)
    equals: m*(N/integrate('2*pi*(a + s)*2*sqrt(da**2 - s**2)', 's', -da, da))*sqrt(1 - a**2*w**2)
    samples:
      N: [10, 100, 50, 20, 1000]
      m: [1, 0.5, 2, 1.5, 0.8]
      a: [1, 0.5, 0.9, 0.8, 0.6]
      da: [0.1, 0.05, 0.02, 0.01, 0.03]
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
    tolerance: 1e-6
    shown: ['id="p3b-rho0"', 'expr="N*m*sqrt(1 - a^2*w^2)/(2*pi^2*a*da^2)"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # T⁰⁰: the energy N γ m of the particles divided by the numerical volume.
  - id: p3b-tt
    kind: identity
    answer: p3b-tt
    where: 'Problem 3(b), answer box T⁰⁰: the total energy N γ m of the particles spread over the numerical volume of the torus'
    formula: N*m/(sqrt(1 - a**2*w**2)*2*pi**2*a*da**2)
    equals: (N*m/sqrt(1 - a**2*w**2))/integrate('2*pi*(a + s)*2*sqrt(da**2 - s**2)', 's', -da, da)
    samples:
      N: [10, 100, 50, 20, 1000]
      m: [1, 0.5, 2, 1.5, 0.8]
      a: [1, 0.5, 0.9, 0.8, 0.6]
      da: [0.1, 0.05, 0.02, 0.01, 0.03]
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
    tolerance: 1e-6
    shown: ['id="p3b-tt"', 'expr="N*m/(sqrt(1 - a^2*w^2)*2*pi^2*a*da^2)"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3b-tt-rho0
    kind: identity
    where: 'Problem 3(b), formula "Problem 3(b): the rotating ring": γ²ρ₀ equals the closed form of T⁰⁰'
    formula: (N*m*sqrt(1 - a**2*w**2)/(2*pi**2*a*da**2))/(1 - a**2*w**2)
    equals: N*m/(2*pi**2*a*da**2*sqrt(1 - a**2*w**2))
    samples:
      N: [10, 100, 50, 20, 1000]
      m: [1, 0.5, 2, 1.5, 0.8]
      a: [1, 0.5, 0.9, 0.8, 0.6]
      da: [0.1, 0.05, 0.02, 0.01, 0.03]
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
    tolerance: 1e-9
    shown: ['<Formula label="Problem 3(b): the rotating ring"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # The ratios: the velocity of a particle on the circle through (x, y), whose path is the point (x, y) turned by
  # the angle ω s counter-clockwise, by numerical derivatives of the path at s = 0.
  - id: p3b-tx
    kind: identity
    answer: p3b-tx
    where: 'Problem 3(b), answer box T⁰ˣ/T⁰⁰ = −ωy: against the x velocity of a particle on the circle, by a numerical derivative of its path'
    formula: -w*y
    equals: deriv('x*cos(w*s) - y*sin(w*s)', 's', 0)
    samples:
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
      x: [1, 0.3, -0.5, 0.7, 0.2]
      y: [0.1, 0.4, 0.6, -0.7, 0.6]
    tolerance: 1e-7
    shown: ['id="p3b-tx"', 'expr="-w*y"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3b-xy
    kind: identity
    answer: p3b-xy
    where: 'Problem 3(b), answer box Tˣʸ/T⁰⁰ = −ω²xy: against the product of the x and y velocities of a particle on the circle, by numerical derivatives of its path'
    formula: -w**2*x*y
    equals: deriv('x*cos(w*s) - y*sin(w*s)', 's', 0)*deriv('x*sin(w*s) + y*cos(w*s)', 's', 0)
    samples:
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
      x: [1, 0.3, -0.5, 0.7, 0.2]
      y: [0.1, 0.4, 0.6, -0.7, 0.6]
    tolerance: 1e-7
    shown: ['id="p3b-xy"', 'expr="-w^2*x*y"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3b-yy
    kind: identity
    where: 'Problem 3(b), formula "Problem 3(b): the rotating ring": Tʸʸ/T⁰⁰ = ω²x², against the square of the y velocity'
    formula: w**2*x**2
    equals: deriv('x*sin(w*s) + y*cos(w*s)', 's', 0)**2
    samples:
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
      x: [1, 0.3, -0.5, 0.7, 0.2]
      y: [0.1, 0.4, 0.6, -0.7, 0.6]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 3(b): the rotating ring"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # Angular momentum density x T⁰ʸ − y T⁰ˣ in units of T⁰⁰.
  - id: p3b-angular
    kind: identity
    where: 'Problem 3(b), check: x T⁰ʸ − y T⁰ˣ = T⁰⁰ ω (x² + y²)'
    formula: x*(w*x) - y*(-w*y)
    equals: w*(x**2 + y**2)
    samples:
      w: [0.5, 0.8, 0.2, 1.1, 0.9]
      x: [1, 0.3, -0.5, 0.7, 0]
      y: [0, 0.4, 0.6, -0.7, 0.6]
    tolerance: 1e-12
    shown: ['$xT^{0y} - yT^{0x} = T^{00}\omega(x^2 + y^2) = T^{00}\omega a^2$']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # The divergence of the stresses, in units of T⁰⁰ ω², with numerical derivatives: ∂_x(y²) + ∂_y(−x y) = −x.
  - id: p3b-force
    kind: identity
    where: 'Problem 3(b), check: ∂_x Tˣˣ + ∂_y Tˣʸ = −T⁰⁰ ω² x, with numerical derivatives (in units of T⁰⁰ ω²)'
    formula: deriv('y**2 + 0*s', 's', x) + deriv('-x*s', 's', y)
    equals: -x
    samples:
      x: [1, 0.3, -0.5, 0.7, 0.2]
      y: [0.1, 0.4, 0.6, -0.7, 0.6]
    tolerance: 1e-7
    shown: ['$\partial_xT^{xx} + \partial_yT^{xy} = \gamma^2\rho_0\omega^2\left(0 - x\right) = -T^{00}\omega^2x$']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3b-diameter
    where: 'Problem 3(b), check: the factor if δa is the diameter, π δa² over π δa²/4'
    formula: 1/(1/4)
    expected: '4'
    shown: ['every component is 4 times larger']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # ---- Problem 3(c)

  # The trace over ρ₀ for two rings, from the components at a point on the ring, with γ²ρ₀ω² times the squared
  # velocities taken from numerical derivatives of the path (a = 0.8, ω = 0.9, angle 0.7).
  - id: p3c-trace
    answer: p3c-trace
    where: 'Problem 3(c), answer box: (−T⁰⁰ + Tˣˣ + Tʸʸ)/ρ₀ for the pair, with a = 0.8, ω = 0.9 and the velocities from numerical derivatives of the path at the angle 0.7'
    formula: 2/(1 - 0.8**2*0.9**2)*(-1 + deriv('0.8*cos(0.9*s + 0.7)', 's', 0)**2 + deriv('0.8*sin(0.9*s + 0.7)', 's', 0)**2)
    expected: '-2'
    shown: ['id="p3c-trace"', '-2\gamma^2\rho_0\left(1 - a^2\omega^2\right) = -2\rho_0']
    source: {cite: mit, at: 'Problem 3(c) (our own addition)'}
    origin: page-own

  # ---- Problem 4

  # The identities of (b) and (c) on a bounded system that conserves energy and momentum exactly: two free particles
  # with energies E1, E2 on straight paths. ∫T⁰⁰ f d³x = Σ E f(position), ∫T^{ij} d³x = Σ E v^i v^j.
  # The left sides are numerical second derivatives with respect to time (deriv(…, 2)).
  - id: p4b-two-particles-xx
    kind: identity
    where: 'Problem 4(b), formula "Problem 4(b): a version of the virial theorem", i = j = x: two free particles, numerical second time derivative against 2 Σ E v_x²'
