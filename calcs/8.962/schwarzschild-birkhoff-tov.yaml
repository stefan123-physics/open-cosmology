# Calculations on content/year-5/8.962/schwarzschild-birkhoff-tov.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-5/8.962/schwarzschild-birkhoff-tov.mdx
calcs:
  # ---------------------------------------------------------------- exterior solution
  - id: tt-rr-combination
    kind: identity
    where: 'formula "Combining tt and rr": e^(-2(Phi-Lambda)) R_tt + R_rr = (2/r)(Phi'' + Lambda''), checked with arbitrary values of Phi'''', Phi'', Lambda'' (plus 10)'
    formula: 10 + (P2 + P1**2 - P1*L1 + 2/r*P1) + (-P2 - P1**2 + P1*L1 + 2/r*L1)
    equals: 10 + 2/r*(P1 + L1)
    samples: {P2: [0.3, -1.2, 2.0], P1: [0.5, 0.1, -0.7], L1: [-0.4, 0.9, 0.2], r: [1.5, 3.0, 7.0]}
    tolerance: 1e-12
    shown: ['e^{-2(\Phi - \Lambda)}R_{tt} + R_{rr} = \frac{2}{r}\left(\Phi'' + \Lambda''\right) = 0']
    source: {cite: reading1, at: 'transcript pp. 5–6'}
    origin: mit

  - id: thetatheta-with-lambda-minus-phi
    kind: identity
    where: 'formula "The thetatheta equation outside": with Lambda = -Phi, R_thth = e^(2Phi)(-2 r Phi'' - 1) + 1 equals 1 - d(r e^(2Phi))/dr; checked with Phi = 0.5 ln(1 + a/r) + 0.1 r (arbitrary)'
    formula: exp(2*(0.5*log(1 + a/r) + 0.1*r))*(-2*r*deriv('0.5*log(1 + a/x) + 0.1*x', 'x', r, 1) - 1) + 1
    equals: 1 - deriv('x*exp(2*(0.5*log(1 + a/x) + 0.1*x))', 'x', r, 1)
    samples: {a: [-2.0, -0.5, 1.0], r: [5.0, 3.0, 8.0]}
    tolerance: 1e-6
    shown: ['\frac{d}{dr}\left(r\,e^{2\Phi}\right) = 1']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  - id: exterior-solution-satisfies
    kind: identity
    where: 'formula "The thetatheta equation outside": Phi = (1/2) ln(1 + a/r) satisfies d(r e^(2Phi))/dr = 1'
    formula: deriv('x*exp(2*0.5*log(1 + a/x))', 'x', r, 1)
    equals: '1'
    samples: {a: [-2.0, -0.5, 1.0], r: [5.0, 3.0, 8.0]}
    tolerance: 1e-7
    shown: ['\Phi = \frac{1}{2}\ln\left(1 + \frac{a}{r}\right)']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  - id: gamma-r-tt
    kind: identity
    where: 'formula "Radial free fall far away": e^(2(Phi - Lambda)) Phi'' = e^(4 Phi) Phi'' = -(a/(2r^2))(1 + a/r) for Phi = (1/2) ln(1 + a/r)'
    formula: exp(4*0.5*log(1 + a/r))*deriv('0.5*log(1 + a/x)', 'x', r, 1)
    equals: -(a/(2*r**2))*(1 + a/r)
    samples: {a: [-2.0, -0.5, 1.0], r: [5.0, 3.0, 8.0]}
    tolerance: 1e-7
    shown: ['= -\frac{a}{2r^2}\left(1 + \frac{a}{r}\right) \approx -\frac{a}{2r^2}']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: newtonian-match
    kind: identity
    where: 'a/(2 r^2) with a = -2GM equals -GM/r^2 (GM = 1)'
    formula: (-2*1)/(2*r**2)
    equals: -1/r**2
    samples: {r: [5.0, 30.0, 100.0]}
    tolerance: 1e-12
    shown: ['Newton says $d^2r/dt^2 = -GM/r^2$, so $a = -2GM$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  # ---------------------------------------------------------------- worked example and plot
  - id: ns-gm
    where: 'worked example: GM/c^2 = 1.4 x 1477 = 2068 m'
    inputs: {}
    formula: G*(1.4*M_sun)/c**2
    expected: 2068 m
    tolerance: 2 m
    shown: ['$GM/c^2 = 1.4 \times 1477 = 2068$ m']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: sun-gm
    where: 'worked example: GM_sun/c^2 = 1477 m'
    inputs: {}
    formula: G*M_sun/c**2
    expected: 1477 m
    shown: ['$GM_\odot/c^2 = 1477$ m']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ns-compactness
    where: 'worked example: 2GM/(r c^2) = 4136/12 000 = 0.345'
    inputs: {R: 12 km}
    formula: 2*G*(1.4*M_sun)/(R*c**2)
    expected: '0.345'
    shown: ['$2GM/(r_\star c^2) = 4136/12\,000 = 0.345$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: sun-compactness
    where: 'worked example: 2 x 1477/(6.96e8) = 4.24e-6'
    inputs: {R: 6.96e8 m}
    formula: 2*G*M_sun/(R*c**2)
    expected: '4.24e-6'
    shown: ['$2 \times 1477/(6.96\times10^8) = 4.24\times10^{-6}$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ns-clock
    where: 'worked example: sqrt(1 - 0.345) = 0.810'
    inputs: {R: 12 km}
    formula: sqrt(1 - 2*G*(1.4*M_sun)/(R*c**2))
    expected: '0.810'
    shown: ['$\sqrt{-g_{tt}} = \sqrt{1 - 0.345} = 0.810$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ns-redshift
    where: 'worked example: 1/0.810 - 1 = 0.235'
    inputs: {R: 12 km}
    formula: 1/sqrt(1 - 2*G*(1.4*M_sun)/(R*c**2)) - 1
    expected: '0.235'
    shown: ['$1/0.810 - 1 = 0.235$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: plot-ns-radius
    where: 'plot point and caption: r = 12 km is 5.80 GM for 1.4 solar masses'
    inputs: {R: 12 km}
    formula: R*c**2/(G*(1.4*M_sun))
    expected: '5.80'
    shown: ['{ x: 5.80, y: 0.655, label: "neutron-star surface" }', 'at r = 5.80 GM']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: plot-ns-gtt
    where: 'plot point and caption: 1 - 2GM/r = 0.655 there'
    inputs: {R: 12 km}
    formula: 1 - 2*G*(1.4*M_sun)/(R*c**2)
    expected: '0.655'
    shown: ['where 1 − 2GM/r = 0.655']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ns-mass-radius
    kind: fact
    where: 'worked example inputs: 1.4 solar masses, 12 km (chosen typical neutron-star values); Sun radius 6.96e8 m'
    shown: ['$M = 1.4\,M_\odot$ and areal radius $r_\star = 12$ km', '($r = 6.96\times10^8$ m)']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: history-dates
    kind: fact
    where: 'history: field equations November 1915, Schwarzschild solution early 1916, death May 1916'
    shown: ['appeared in November 1915', 'published it early in 1916']
    source: {cite: reading1, at: 'transcript pp. 7–8'}
    origin: mit

  - id: death-date
    kind: fact
    where: 'bracket: Schwarzschild died in May 1916 (MacTutor), not weeks after the solution'
    shown: ['died in May 1916 (MacTutor biography)']
    source: {cite: mactutor, at: biography}
    origin: page-own

  # ---------------------------------------------------------------- Birkhoff
  - id: birkhoff-time-absorb
    kind: identity
    where: 'formula "Separating Phi": e^(2(Phi1 + Phi2(t))) dt^2 = e^(2 Phi1) dt''^2 with dt'' = e^(Phi2) dt'
    formula: exp(2*(p1 + p2))*dt**2
    equals: exp(2*p1)*(exp(p2)*dt)**2
    samples: {p1: [0.1, -0.5, 0.3], p2: [0.7, -0.2, 1.1], dt: [0.01, 0.5, 2.0]}
    tolerance: 1e-12
    shown: ['$dt'' = e^{\Phi_2(t)}dt$']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  # ---------------------------------------------------------------- interior
  - id: mass-function-gtt
    kind: identity
    where: 'formulas "The tt component" and "The mass function": with e^(-2 Lambda) = 1 - 2Gm/r, -(1/r^2) d/dr[r(1 - e^(-2Lambda))] = -(2G/r^2) dm/dr; checked with m = r^3 (G = 1)'
    formula: -(1/r**2)*deriv('x*(1 - (1 - 2*x**3/x))', 'x', r, 1)
    equals: -(2/r**2)*3*r**2
    samples: {r: [0.2, 0.5, 0.6]}
    tolerance: 1e-6
    shown: ['\frac{dm}{dr} = 4\pi r^2\rho']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: mit

  - id: dphi-dr
    kind: identity
    where: 'formula "The metric potential": solving G^r_r = 8 pi G P with e^(-2Lambda) = 1 - 2Gm/r for Phi'' gives G(m + 4 pi r^3 P)/(r(r - 2Gm)); checked by substituting back (G = 1)'
    formula: (1 - 2*m/r)*(2/r*((m + 4*pi*r**3*P)/(r*(r - 2*m))) + 1/r**2) - 1/r**2
    equals: 8*pi*P
    samples: {m: [0.1, 0.3, 0.05], r: [1.0, 2.0, 0.5], P: [0.01, 0.002, 0.03]}
    tolerance: 1e-10
    shown: ['\frac{d\Phi}{dr} = \frac{G\left(m + 4\pi r^3P\right)}{r\left(r - 2Gm\right)}']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: four-acceleration
    kind: identity
    where: 'relativistic hydrostatic equilibrium: Gamma^r_tt (U^t)^2 g_rr = e^(2(Phi - Lambda)) Phi'' e^(-2Phi) e^(2Lambda) = Phi'''
    formula: exp(2*(p - l))*p1*exp(-2*p)*exp(2*l)
    equals: p1
    samples: {p: [0.1, -0.5, 0.3], l: [0.7, -0.2, 1.1], p1: [0.2, 1.5, -0.3]}
    tolerance: 1e-12
    shown: ['$(\rho + P)\,\Gamma^r{}_{tt}(U^t)^2 g_{rr} = -dP/dr$']
    source: {cite: reading1, at: 'transcript pp. 14–15'}
    origin: page-own

  - id: newtonian-limit-tov
    kind: limit
    where: 'formula "The metric potential": as P and Gm/r go to zero, dPhi/dr tends to Gm/r^2 (m = 1, r = 1e3 scaled by the factor; G = 1)'
    inputs: {}
    formula: ((1*eps + 4*pi*1**3*0.01*eps**2)/(1*(1 - 2*1*eps)))/eps
    limit: '1'
    vary: {eps: [1e-2, 1e-4, 1e-6, 1e-8]}
    tolerance: 1e-6
    shown: ['Compare the Newtonian $d\Phi/dr = Gm/r^2$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit
