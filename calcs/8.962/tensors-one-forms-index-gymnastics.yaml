# Calculations on content/year-5/8.962/tensors-one-forms-index-gymnastics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 3 transcript. Units with c = 1, signature (-, +, +, +).
# Page's own examples: the metric transformed by a boost with v = 0.6 (worked example 1); the field phi = 3t + 2x
# seen by an observer at v = 0.6 (worked example 2); A = (2, 1, 0, 3), B = (1, 4, 2, 0) (quizzes 1-2);
# the height field h = x^2 + y^2 (graph).

page: content/year-5/8.962/tensors-one-forms-index-gymnastics.mdx
calcs:
  # ---------------------------------------------------------------- metric invariance (identities)
  - id: eta-00-invariant
    kind: identity
    where: 'eta_0bar0bar = gamma^2 (-1) + (gamma v)^2 (+1) = -1 for any v'
    formula: -(1/sqrt(1 - v**2))**2 + (v/sqrt(1 - v**2))**2
    equals: '-1'
    samples: {v: [0.1, 0.6, -0.95]}
    tolerance: 1e-12
    shown: ['\eta_{\bar\alpha\bar\beta} = \eta(\vec e_{\bar\alpha}, \vec e_{\bar\beta})']
    source: {cite: reading1, at: 'transcript pp. 5-6'}
    origin: mit

  - id: eta-11-invariant
    kind: identity
    where: 'eta_1bar1bar = (gamma v)^2 (-1) + gamma^2 (+1) = 1 for any v'
    formula: -(v/sqrt(1 - v**2))**2 + (1/sqrt(1 - v**2))**2
    equals: '1'
    samples: {v: [0.1, 0.6, -0.95]}
    tolerance: 1e-12
    shown: ['so $\eta_{\bar\alpha\bar\beta} = \mathrm{diag}(-1, 1, 1, 1)$, as it must']
    source: {cite: reading1, at: 'transcript pp. 5-6'}
    origin: mit

  - id: gradient-chain-rule
    kind: identity
    where: 'd phi / d tau = u^alpha d_alpha phi for phi = a t + b x along t = gamma tau, x = gamma v tau'
    formula: a/sqrt(1 - v**2) + b*v/sqrt(1 - v**2)
    equals: (a*(tau + 1e-3)/sqrt(1 - v**2) + b*v*(tau + 1e-3)/sqrt(1 - v**2) - a*tau/sqrt(1 - v**2) - b*v*tau/sqrt(1 - v**2))/1e-3
    samples: {a: [3, -1, 2], b: [2, 5, -4], v: [0.6, -0.3, 0.9], tau: [1, 2, 0.5]}
    tolerance: 1e-9
    shown: ['= u^\alpha\,\partial_\alpha\phi']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  # ---------------------------------------------------------------- worked example 1
  - id: ex1-gamma
    where: 'worked example 1: gamma = 1.25 and gamma v = 0.75 for v = 0.6'
    inputs: {v: 0.6}
    formula: v/sqrt(1 - v**2)
    expected: '0.75'
    shown: ['= \gamma v = 0.75$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex1-eta00
    where: 'worked example 1: (1.25)^2 (-1) + (0.75)^2 = -1.5625 + 0.5625 = -1'
    inputs: {}
    formula: -(1.25**2) + 0.75**2
    expected: '-1'
    shown: ['(1.25)^2(-1) + (0.75)^2(+1) = -1.5625 + 0.5625 = -1$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex1-eta01
    where: 'worked example 1: -1.25 * 0.75 + 0.75 * 1.25 = 0 (1 is added so that the relative difference is defined; expected 1 means the sum is 0)'
    inputs: {}
    formula: 1 - 1.25*0.75 + 0.75*1.25
    expected: '1'
    tolerance: 1e-12
    shown: ['= -1.25 \times 0.75 + 0.75 \times 1.25 = 0$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  # ---------------------------------------------------------------- worked example 2
  - id: ex2-rate
    where: 'worked example 2: u^alpha d_alpha phi = 1.25 * 3 + 0.75 * 2 = 3.75 + 1.5 = 5.25'
    inputs: {}
    formula: 1.25*3 + 0.75*2
    expected: '5.25'
    shown: ['= 1.25 \times 3 + 0.75 \times 2 = 3.75 + 1.5 = 5.25$']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: page-own

  - id: ex2-path
    where: 'worked example 2: phi along t = 1.25 tau, x = 0.75 tau is 5.25 tau (value at tau = 1)'
    inputs: {tau: 1}
    formula: 3*(1.25*tau) + 2*(0.75*tau)
    expected: '5.25'
    shown: ['$\phi = 3(1.25\,\tau) + 2(0.75\,\tau) = 5.25\,\tau$']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: page-own

  # ---------------------------------------------------------------- quizzes 1-2
  - id: quiz1-lower-time
    where: 'quiz 1: A_0 = eta_00 A^0 = -2'
    inputs: {}
    formula: -1*2
    expected: '-2'
    shown: ['"$(-2, 1, 0, 3)$"']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: quiz2-contraction
    where: 'quiz 2: A_alpha B^alpha = -2 + 4 + 0 + 0 = 2'
    inputs: {}
    formula: -2*1 + 1*4 + 0*2 + 3*0
    expected: '2'
    quiz: 1
    shown: ['$A_\\alpha B^\\alpha = -2 + 4 + 0 + 0 = 2$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: quiz2-euclid
    where: 'quiz 2: the meaningless sum A^alpha B^alpha = 2 + 4 + 0 + 0 = 6'
    inputs: {}
    formula: 2*1 + 1*4 + 0*2 + 3*0
    expected: '6'
    shown: ['with both indices up would give 6']
    source: {cite: reading1, at: 'transcript pp. 8-9'}
    origin: page-own

  # ---------------------------------------------------------------- graph
  - id: graph-AB
    where: 'graph: h rises from 0.2^2 = 0.04 at A to 1.0^2 = 1 at B, by 0.96'
    inputs: {}
    formula: 1.0**2 - 0.2**2
    expected: '0.96'
    shown: ['(h rises by 0.96)']
    source: {cite: reading1, at: 'transcript pp. 12-13'}
    origin: page-own

  - id: graph-CD
    where: 'graph: h rises from 1.6^2 = 2.56 at C to 2.4^2 = 5.76 at D, by 3.2'
    inputs: {}
    formula: 2.4**2 - 1.6**2
    expected: '3.2'
    shown: ['(h rises by 3.2)']
    source: {cite: reading1, at: 'transcript pp. 12-13'}
    origin: page-own

  - id: graph-length
    where: 'graph: both displacements have length 0.8'
    inputs: {}
    formula: 2.4 - 1.6
    expected: '0.8'
    shown: ['have the same length, 0.8']
    source: {cite: reading1, at: 'transcript pp. 12-13'}
    origin: page-own

  - id: graph-one-form-AB
    where: 'graph: the gradient one-form at the midpoint x = 0.6, d h = 2x dx, gives 1.2 * 0.8 = 0.96 exactly (h is quadratic)'
    inputs: {}
    formula: 2*0.6*0.8
    expected: '0.96'
    shown: ['the gradient one-form gives the second displacement a bigger number']
    source: {cite: reading1, at: 'transcript pp. 12-13'}
    origin: page-own

  - id: graph-one-form-CD
    where: 'graph: the gradient one-form at the midpoint x = 2.0 gives 4.0 * 0.8 = 3.2, equal to the exact rise'
    inputs: {}
    formula: 2*2.0*0.8
    expected: '3.2'
    shown: ['while the second crosses three (h rises by 3.2)']
    source: {cite: reading1, at: 'transcript pp. 12-13'}
    origin: page-own

