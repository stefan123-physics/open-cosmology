# Calculations on content/year-5/8.962/stress-energy-tensor.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 5 transcript. Units with c = 1, signature (-, +, +, +), Gaussian units for fields.
# Page's own examples: dust with rho0 = 2 streaming at v = 0.6 (worked example); dust seen at v = 0.8 (quiz 1, graph caption).

page: content/year-5/8.962/stress-energy-tensor.mdx
calcs:
  # ---------------------------------------------------------------- identities
  - id: perfect-fluid-rest
    kind: identity
    where: 'T = (rho + P) u u + P eta in the rest frame (u = (1,0,0,0)): T^00 = (rho + P) - P = rho'
    formula: (rho + P)*1*1 + P*(-1)
    equals: rho
    samples: {rho: [1, 2.5, 7], P: [0, 0.3, 2.3]}
    tolerance: 1e-12
    shown: ['= \left(\rho + P\right)u^\alpha u^\beta + P\,\eta^{\alpha\beta}"']
    source: {cite: reading1, at: 'transcript pp. 10-11'}
    origin: mit

  - id: perfect-fluid-boost-trace
    kind: identity
    where: 'perfect fluid boosted along x: -T^00 + T^xx = -(rho + P) gamma^2 + P + (rho + P) gamma^2 v^2 + P = -rho + P (the trace without the y, z terms)'
    formula: -((rho + P)/(1 - v**2) - P) + ((rho + P)*v**2/(1 - v**2) + P)
    equals: -rho + P
    samples: {rho: [1, 2.5, 7], P: [0, 0.3, 2.3], v: [0.2, 0.6, 0.9]}
    tolerance: 1e-12
    shown: ['tex="T^{\alpha\beta} = \rho\,u^\alpha u^\beta + P\left(\eta^{\alpha\beta} + u^\alpha u^\beta\right)']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: em-energy-density
    kind: identity
    where: 'T^00 of the field: (1/4pi)[F^0i F^0_i - (1/4) eta^00 F F] with F^0i F^0_i = E^2 and F_ab F^ab = 2 (B^2 - E^2) gives (E^2 + B^2)/(8 pi)'
    formula: (1/(4*pi))*(E**2 - 0.25*(-1)*2*(B**2 - E**2))
    equals: (E**2 + B**2)/(8*pi)
    samples: {E: [1, 0.5, 3], B: [2, 0, 1.5]}
    tolerance: 1e-12
    shown: ['T^{00} = \frac{E^2 + B^2}{8\pi}']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: capacitor-xx
    kind: identity
    where: 'capacitor, E along x, B = 0: T^xx = (1/4pi)[E^2/2 - E^2] = -E^2/(8 pi)'
    formula: (1/(4*pi))*(0.5*E**2 - E**2)
    equals: -E**2/(8*pi)
    samples: {E: [1, 2, 5]}
    tolerance: 1e-12
    shown: ['$T^{xx} = -E^2/8\pi$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: mit

  - id: capacitor-yy
    kind: identity
    where: 'capacitor: T^yy = (1/4pi)(E^2/2) = +E^2/(8 pi)'
    formula: (1/(4*pi))*(0.5*E**2)
    equals: E**2/(8*pi)
    samples: {E: [1, 2, 5]}
    tolerance: 1e-12
    shown: ['$T^{yy} = T^{zz} = +E^2/8\pi$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: mit

  - id: polar-inverse
    kind: identity
    where: 'the stated inverse times L (polar to Cartesian): the (r, r) entry cos^2 + sin^2 = 1 and the (phi, phi) entry r sin^2/r + r cos^2/r = 1'
    formula: cos(ph)*cos(ph) + sin(ph)*sin(ph) + (-sin(ph)/r)*(-r*sin(ph)) + (cos(ph)/r)*(r*cos(ph))
    equals: '2'
    samples: {ph: [0.3, 1.2, 2.5], r: [0.5, 2, 7]}
    tolerance: 1e-12
    shown: ['-\sin\phi/r & \cos\phi/r']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: mit

  - id: polar-inverse-offdiag
    kind: identity
    where: 'L inverse times L: the (r, phi) entry cos(-r sin) + sin(r cos) = 0 (plus 1)'
    formula: 1 + cos(ph)*(-r*sin(ph)) + sin(ph)*(r*cos(ph))
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.5], r: [0.5, 2, 7]}
    tolerance: 1e-12
    shown: ['\cos\phi & -r\sin\phi']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: mit

  - id: e-phi-norm
    kind: identity
    where: 'e_phi = (dx/dphi, dy/dphi) = (-r sin, r cos) has squared length r^2'
    formula: (r*sin(ph))**2 + (r*cos(ph))**2
    equals: r**2
    samples: {ph: [0.3, 1.2, 2.5], r: [0.5, 2, 7]}
    tolerance: 1e-12
    shown: ['tex="\vec e_\phi\cdot\vec e_\phi = r^2 \neq 1"']
    source: {cite: reading1, at: 'transcript p. 23'}
    origin: mit

  - id: angular-acceleration-scaling
    kind: identity
    where: 'torque l^3 dT divided by moment of inertia alpha rho l^5 is dT/(alpha rho l^2)'
    formula: (l**3*dT)/(al*rho*l**5)
    equals: dT/(al*rho*l**2)
    samples: {l: [0.1, 0.01, 1], dT: [1, 0.3, 2], al: [0.17, 0.2, 1], rho: [1, 3, 0.5]}
    tolerance: 1e-12
    shown: ['\sim \frac{T^{xy} - T^{yx}}{\alpha\,\rho\,l^2}']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  # ---------------------------------------------------------------- worked example: rho0 = 2, v = 0.6
  - id: ex-gamma2
    where: 'worked example: gamma^2 = 1.5625 for v = 0.6'
    inputs: {v: 0.6}
    formula: 1/(1 - v**2)
    expected: '1.5625'
    shown: ['$\gamma^2 = 1.5625$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ex-T00
    where: 'worked example: T^00 = gamma^2 rho0 = 3.125'
    inputs: {v: 0.6, rho0: 2}
    formula: rho0/(1 - v**2)
    expected: '3.125'
    shown: ['$\gamma^2\rho_0 = 3.125$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ex-T0x
    where: 'worked example: T^0x = 3.125 * 0.6 = 1.875'
    inputs: {v: 0.6, rho0: 2}
    formula: rho0*v/(1 - v**2)
    expected: '1.875'
    shown: ['$T^{0x} = T^{x0} = 3.125 \times 0.6 = 1.875$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ex-Txx
    where: 'worked example: T^xx = 3.125 * 0.36 = 1.125'
    inputs: {v: 0.6, rho0: 2}
    formula: rho0*v**2/(1 - v**2)
    expected: '1.125'
    shown: ['$T^{xx} = 3.125 \times 0.36 = 1.125$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: ex-trace
    where: 'worked example: -3.125 + 1.125 = -2 = -rho0'
    inputs: {}
    formula: -3.125 + 1.125
    expected: '-2'
    shown: ['$\eta_{\alpha\beta}T^{\alpha\beta} = -T^{00} + T^{xx} = -3.125 + 1.125 = -2$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  # ---------------------------------------------------------------- quiz 1 and graph: v = 0.8
  - id: quiz1-gamma2
    where: 'quiz 1: gamma^2 = 25/9 = 2.78 at v = 0.8; graph caption'
    inputs: {v: 0.8}
    formula: 1/(1 - v**2)
    expected: '2.78'
    quiz: 0
    shown: ['$\\gamma^2 = 25/9 \\approx 2.78$', 'the energy density 2.78 times']
    source: {cite: reading1, at: 'transcript pp. 3-4'}
    origin: page-own

  - id: quiz1-gamma
    where: 'quiz 1 distractor and graph caption: gamma = 5/3 = 1.67 at v = 0.8'
    inputs: {v: 0.8}
    formula: 1/sqrt(1 - v**2)
    expected: '1.67'
    shown: ['"About $1.67\\,\\rho_0$"', 'the number density is 1.67 times its rest value']
    source: {cite: reading1, at: 'transcript pp. 3-4'}
    origin: page-own

  - id: quiz1-sqrt
    where: 'quiz 1 distractor 0.6 = 1/gamma at v = 0.8'
    inputs: {v: 0.8}
    formula: sqrt(1 - v**2)
    expected: '0.6'
    shown: ['"$0.6\\,\\rho_0$"']
    source: {cite: reading1, at: 'transcript pp. 3-4'}
    origin: page-own

  - id: radiation-pressure
    kind: fact
    where: 'cosmology callout: radiation P = rho/3, vacuum energy P = -rho (standard results, used in 8.286)'
    value: '1/3'
    shown: ['radiation has $P = \rho/3$']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: page-own

  - id: polar-inverse-offdiag-2
    kind: identity
    where: 'L times the stated inverse: the (x, y) entry cos sin + (-r sin)(cos/r) = 0 (plus 1)'
    formula: 1 + cos(ph)*sin(ph) + (-r*sin(ph))*(cos(ph)/r)
    equals: '1'
    samples: {ph: [0.3, 1.2, 2.5], r: [0.5, 2, 7]}
    tolerance: 1e-12
    shown: ['\cos\phi & \sin\phi']
    source: {cite: reading1, at: 'transcript p. 24'}
    origin: mit
