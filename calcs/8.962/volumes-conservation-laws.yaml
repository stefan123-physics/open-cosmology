# Calculations on content/year-5/8.962/volumes-conservation-laws.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 4 transcript. Units with c = 1, signature (-, +, +, +).
# Page's own examples: dust with n0 = 3 seen at v = 0.6 (worked example 1, quiz 1); the parallelepiped
# A = (2, 0, 0), B = (1, 3, 0), C = (0, 1, 4) (worked example 2); counting components of 4x4 tensors (quiz 3).

page: content/year-5/8.962/volumes-conservation-laws.mdx
calcs:
  # ---------------------------------------------------------------- identities
  - id: N-norm
    kind: identity
    where: 'N.N = -(gamma n0)^2 + (gamma n0 v)^2 = -n0^2 (graph caption: the squares of density and flux per n0 differ by 1)'
    formula: -(n0/sqrt(1 - v**2))**2 + (n0*v/sqrt(1 - v**2))**2
    equals: -n0**2
    samples: {n0: [1, 3, 7.5], v: [0.2, 0.6, 0.95]}
    tolerance: 1e-12
    shown: ['tex="\vec N\cdot\vec N = -n_0^2"', 'Their squares always differ by exactly 1']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: maxwell-gauss
    kind: identity
    where: 'd_nu F^{0 nu} with F^{0i} = E_i is div E: for E = (a x, b y, c z) the divergence is a + b + c (checked numerically by central differences, plus 10)'
    formula: 10 + ((a*(x + 1e-4)) - (a*(x - 1e-4)))/2e-4 + ((b*(y + 1e-4)) - (b*(y - 1e-4)))/2e-4 + ((cc*(z + 1e-4)) - (cc*(z - 1e-4)))/2e-4
    equals: 10 + a + b + cc
    samples: {a: [1, 2], b: [3, -1], cc: [0.5, 4], x: [1, 2], y: [0.3, 1], z: [2, 5]}
    tolerance: 1e-8
    shown: ['For $\mu = 0$ the first is Gauss''s law, $\nabla\cdot\vec E = 4\pi\rho$']
    source: {cite: reading1, at: 'transcript pp. 20-21'}
    origin: page-own

  - id: maxwell-ampere-x
    kind: identity
    where: 'mu = x: d_0 F^{10} + d_2 F^{12} + d_3 F^{13} = -dE_x/dt + dB_z/dy - dB_y/dz = (curl B)_x - dE_x/dt (signs of the matrix, plus 10)'
    formula: 10 + (-1)*ex + (1)*bzy + (-1)*byz
    equals: 10 + (bzy - byz) - ex
    samples: {ex: [1, -2, 0.5], bzy: [3, 1, -4], byz: [2, 0.7, 1]}
    tolerance: 1e-12
    shown: ['for $\mu = x$ it is the $x$ component of $\nabla\times\vec B - \partial\vec E/\partial t = 4\pi\vec J$']
    source: {cite: reading1, at: 'transcript pp. 20-21'}
    origin: page-own

  # ---------------------------------------------------------------- worked example 1 and quiz 1
  - id: ex1-density
    where: 'worked example 1: n = gamma n0 = 1.25 * 3 = 3.75; quiz 1'
    inputs: {n0: 3, v: 0.6}
    formula: n0/sqrt(1 - v**2)
    expected: '3.75'
    quiz: 0
    shown: ['$n = 1.25 \times 3 = 3.75$']
    source: {cite: reading1, at: 'transcript pp. 5-6'}
    origin: page-own

  - id: ex1-flux
    where: 'worked example 1: flux n v = 3.75 * 0.6 = 2.25'
    inputs: {n0: 3, v: 0.6}
    formula: n0*v/sqrt(1 - v**2)
    expected: '2.25'
    shown: ['$n v = 3.75 \times 0.6 = 2.25$']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: page-own

  - id: ex1-norm
    where: 'worked example 1: -(3.75)^2 + (2.25)^2 = -14.0625 + 5.0625 = -9'
    inputs: {}
    formula: -(3.75**2) + 2.25**2
    expected: '-9'
    shown: ['$\vec N\cdot\vec N = -(3.75)^2 + (2.25)^2 = -14.0625 + 5.0625 = -9$']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: quiz1-wrong-divide
    where: 'quiz 1 distractor 2.4: n0/gamma (contracting the wrong way)'
    inputs: {n0: 3, v: 0.6}
    formula: n0*sqrt(1 - v**2)
    expected: '2.4'
    shown: ['"$2.4$"']
    source: {cite: reading1, at: 'transcript pp. 5-6'}
    origin: page-own

  - id: quiz1-wrong-square
    where: 'quiz 1 distractor 4.69: n0 gamma^2 (contracting twice)'
    inputs: {n0: 3, v: 0.6}
    formula: n0/(1 - v**2)
    expected: '4.69'
    shown: ['"$4.69$"']
    source: {cite: reading1, at: 'transcript pp. 5-6'}
    origin: page-own

  # ---------------------------------------------------------------- worked example 2
  - id: ex2-cross-1
    where: 'worked example 2: (B x C)_1 = 3*4 - 0*1 = 12'
    inputs: {}
    formula: 3*4 - 0*1
    expected: '12'
    shown: ['= (12, -4, 1)$']
    source: {cite: reading1, at: 'transcript pp. 13-14'}
    origin: page-own

  - id: ex2-cross-2
    where: 'worked example 2: (B x C)_2 = 0*0 - 1*4 = -4'
    inputs: {}
    formula: 0*0 - 1*4
    expected: '-4'
    shown: ['0 \times 0 - 1 \times 4']
    source: {cite: reading1, at: 'transcript pp. 13-14'}
    origin: page-own

  - id: ex2-cross-3
    where: 'worked example 2: (B x C)_3 = 1*1 - 3*0 = 1'
    inputs: {}
    formula: 1*1 - 3*0
    expected: '1'
    shown: ['1 \times 1 - 3 \times 0']
    source: {cite: reading1, at: 'transcript pp. 13-14'}
    origin: page-own

  - id: ex2-volume
    where: 'worked example 2: V = sigma_i A^i = 2 * 12 = 24, equal to the determinant of the edge vectors'
    inputs: {}
    formula: 2*(3*4 - 0*1) - 0*(1*4 - 0*0) + 0*(1*1 - 3*0)
    expected: '24'
    shown: ['$V = \sigma_iA^i = 2 \times 12 + 0 + 0 = 24$']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: page-own

  # ---------------------------------------------------------------- component counting (quiz 3 and text)
  - id: count-symmetric
    where: 'a symmetric 4x4 tensor: 4 diagonal + 6 off-diagonal = 10'
    inputs: {}
    formula: 4 + (16 - 4)/2
    expected: '10'
    shown: ['10 in all']
    source: {cite: reading1, at: 'transcript pp. 19-20'}
    origin: mit

  - id: count-antisymmetric
    where: 'an antisymmetric 4x4 tensor: (16 - 4)/2 = 12/2 = 6; quiz 3'
    inputs: {}
    formula: (16 - 4)/2
    expected: '6'
    quiz: 2
    shown: ['$12/2 = 6$']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: box-faces
    where: 'a 4-dimensional box has 2n = 8 faces'
    inputs: {}
    formula: 2*4
    expected: '8'
    shown: ['A 4-dimensional box has 8 faces']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: mit

  - id: sphere-radius
    kind: fact
    where: 'example surface psi = sqrt(x^2 + y^2 + z^2) = 5, a sphere of radius 5 (Hughes''s example)'
    value: '5'
    shown: ['is a sphere of radius 5']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: mit
