# Calculations on content/year-5/8.962/equivalence-principle-local-lorentz-frames.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# The counting argument of the lecture (transcript pp. 13-16) and the page's own n = 3 example; quoted precisions as facts.

page: content/year-5/8.962/equivalence-principle-local-lorentz-frames.mdx
calcs:
  - id: order0-constraints
    where: 'section "A local Lorentz frame always exists", order zero: a symmetric 4 x 4 metric has n(n+1)/2 = 10 components'
    inputs: {n: 4}
    formula: n * (n + 1) / 2
    expected: '10'
    shown: ['symmetric $4\times 4$ matrix: 10 numbers to match']
    source: {cite: reading1, at: 'transcript pp. 13–14'}
    origin: mit

  - id: order0-freedoms
    where: 'order zero: Lambda at p has n^2 = 16 entries, 6 to spare'
    inputs: {n: 4}
    formula: n**2 - n * (n + 1) / 2
    expected: '6'
    shown: ['16 free numbers', 'with 6 freedoms to spare']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: lorentz-group-dimension
    where: 'order zero: the 6 spare freedoms are 3 rotations + 3 boosts, n(n-1)/2'
    inputs: {n: 4}
    formula: n * (n - 1) / 2
    expected: '6'
    shown: ['Those 6 are the three rotations and three boosts of the Lorentz group']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: order1-constraints
    where: 'order one: 10 metric components x 4 derivatives = 40'
    inputs: {n: 4}
    formula: n * (n + 1) / 2 * n
    expected: '40'
    shown: ['10 components times 4 derivatives: 40 numbers']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: order1-freedoms
    where: 'order one: 4 values of alpha x 10 symmetric pairs = 40'
    inputs: {n: 4}
    formula: n * n * (n + 1) / 2
    expected: '40'
    shown: ['4 values of $\alpha$ times 10 symmetric pairs $(\bar\mu, \bar\gamma)$, also 40']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: order2-constraints
    where: 'order two: 10 components x 10 symmetric pairs = 100'
    inputs: {n: 4}
    formula: (n * (n + 1) / 2)**2
    expected: '100'
    shown: ['10 components times 10 symmetric pairs of derivatives: 100 numbers']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: symmetric-triples
    where: 'order two: n(n+1)(n+2)/3! = 20 for n = 4'
    inputs: {n: 4}
    formula: n * (n + 1) * (n + 2) / 6
    expected: '20'
    shown: ['which is 20 for $n = 4$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: order2-freedoms
    where: 'order two: 4 x 20 = 80 free numbers'
    inputs: {n: 4}
    formula: n * n * (n + 1) * (n + 2) / 6
    expected: '80'
    shown: ['so there are $4 \times 20 = 80$ free numbers']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: leftover-20
    where: 'order two: 100 - 80 = 20 conditions cannot be met; quiz 3'
    inputs: {n: 4}
    formula: (n * (n + 1) / 2)**2 - n * n * (n + 1) * (n + 2) / 6
    expected: '20'
    shown: ['Twenty conditions cannot be met', '100 and 80, leaving 20 that cannot be removed']
    source: {cite: reading1, at: 'transcript pp. 15–16'}
    origin: mit

  - id: riemann-naive
    where: 'section "What the leftover terms mean": 4^4 = 256'
    inputs: {}
    formula: 4**4
    expected: '256'
    shown: ['$4^4 = 256$ components']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: mit

  - id: riemann-independent-4d
    where: 'worked example step "Order two": n^2(n^2 - 1)/12 = 20 for n = 4'
    inputs: {n: 4}
    formula: n**2 * (n**2 - 1) / 12
    expected: '20'
    shown: ['For $n = 4$ the same formula gives 20']
    source: {cite: reading1, at: 'transcript p. 16 (the number 20); the general formula is the page''s own'}
    origin: page-own

  - id: n3-metric
    where: 'worked example (n = 3) "Order zero": 6 metric components, 9 entries, 3 left'
    inputs: {n: 3}
    formula: n**2 - n * (n + 1) / 2
    expected: '3'
    shown: ['$3 \cdot 4/2 = 6$ components', '$3 \times 3 = 9$ entries. The 3 left over']
    source: {cite: reading1, at: 'transcript pp. 13–15 (method); the n = 3 case is the page''s own'}
    origin: page-own

  - id: n3-order1
    where: 'worked example (n = 3) "Order one": 18 against 18'
    inputs: {n: 3}
    formula: n * (n + 1) / 2 * n
    expected: '18'
    shown: ['6 components times 3 derivatives = 18', '3 values of $\alpha$ times 6 symmetric pairs = 18']
    source: {cite: reading1, at: 'transcript p. 14 (method)'}
    origin: page-own

  - id: n3-order2-constraints
    where: 'worked example (n = 3) "Order two": 6 x 6 = 36'
    inputs: {n: 3}
    formula: (n * (n + 1) / 2)**2
    expected: '36'
    shown: ['6 components times 6 symmetric pairs = 36']
    source: {cite: reading1, at: 'transcript p. 15 (method)'}
    origin: page-own

  - id: n3-order2-freedoms
    where: 'worked example (n = 3): 3 x 10 = 30 free numbers, 6 left'
    inputs: {n: 3}
    formula: n * n * (n + 1) * (n + 2) / 6
    expected: '30'
    shown: ['$3 \cdot 4 \cdot 5/3! = 10$, so 30']
    source: {cite: reading1, at: 'transcript p. 15 (method)'}
    origin: page-own

  - id: n3-riemann
    where: 'worked example (n = 3): 36 - 30 = 6 = n^2(n^2-1)/12'
    inputs: {n: 3}
    formula: n**2 * (n**2 - 1) / 12
    expected: '6'
    shown: ['$n^2(n^2-1)/12 = 6$']
    source: {cite: reading1, at: 'transcript p. 16 (for n = 4)'}
    origin: page-own

  - id: tidal-cosh
    kind: identity
    where: 'plot: z = L cosh(w t) solves d^2 z/dt^2 = w^2 z (L = 1, w = 1), checked at sample times (plus 3 for a defined relative difference)'
    formula: 3 + deriv('cosh(u)', 'u', s, 2)
    equals: 3 + cosh(s)
    samples: {s: [0, 0.4, 1.0, 1.5]}
    tolerance: 1e-6
    shown: ['whose solution is z = ±L cosh(ωt)']
    source: {cite: reading1, at: 'transcript p. 7 (the picture); the formula is the page''s own'}
    origin: page-own

  - id: tidal-plot-extent
    where: 'plot: the outer world lines reach cosh(1.5) = 2.35 times L at the top of the drawn range, inside the x domain -2.6..2.6'
    inputs: {}
    formula: cosh(1.5)
    expected: '2.35'
    shown: ['range: [0, 1.5], label: "top"']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: wep-precision
    kind: fact
    where: 'section "Three equivalence principles": Hughes recalls the weak equivalence principle tested to about a part in 10^13; flashcard 1'
    value: '1e-13'
    shown: ['about a part in $10^{13}$, perhaps better by now', 'to about a part in $10^{13}$ (Hughes''s figure)']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: mit

  - id: microscope-precision
    kind: fact
    where: 'section "Three equivalence principles": later development, MICROSCOPE final result (2022), about a part in 10^15'
    value: '1e-15'
    shown: ['reached about a part in $10^{15}$']
    source: {ref: 'Touboul et al. (MICROSCOPE Collaboration), Phys. Rev. Lett. 129, 121102 (2022): Eötvös parameter about 1e-15'}
    origin: later-data

  - id: ligo-date
    kind: fact
    where: 'strong equivalence principle: before September 2015 (first LIGO detection)'
    value: 'September 2015'
    shown: ['Before September 2015']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  - id: ten-thousand-miles
    kind: fact
    where: 'Einstein principle: the transformation into a falling frame here differs from the one 10,000 miles above the Earth (Hughes''s example)'
    value: '10000 miles'
    shown: ['10,000 miles above the Earth']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit
