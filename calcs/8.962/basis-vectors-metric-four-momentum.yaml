# Calculations on content/year-5/8.962/basis-vectors-metric-four-momentum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 2 transcript. Units with c = 1, signature (-, +, +, +).
# Page's own examples: a null vector (3, 1, 2, 2) (quiz 1); p = (10, 6, 0, 0) seen by an observer at v = -0.6 (quiz 2);
# p = (5, 4, 0, 0) seen by an observer at v = 0.6 (worked example and graph); constant proper acceleration g.

page: content/year-5/8.962/basis-vectors-metric-four-momentum.mdx
calcs:
  # ---------------------------------------------------------------- identities
  - id: inverse-lorentz
    kind: identity
    where: 'Lambda(-v) Lambda(v) = identity: the (0,0) entry gamma^2 - gamma^2 v^2 = 1'
    formula: (1/sqrt(1 - v**2))**2 + (v/sqrt(1 - v**2))*(-v/sqrt(1 - v**2))
    equals: '1'
    samples: {v: [0.2, 0.6, -0.9]}
    tolerance: 1e-12
    shown: ['\Lambda^{\gamma}{}_{\bar\nu}\,\Lambda^{\bar\nu}{}_{\beta} = \delta^\gamma_{\ \beta}']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: inverse-lorentz-offdiag
    kind: identity
    where: 'Lambda(-v) Lambda(v) = identity: the (0,1) entry gamma*(-gamma v) + (gamma v)*gamma = 0 (plus 1)'
    formula: 1 + (1/sqrt(1 - v**2))*(-v/sqrt(1 - v**2)) + (v/sqrt(1 - v**2))*(1/sqrt(1 - v**2))
    equals: '1'
    samples: {v: [0.2, 0.6, -0.9]}
    tolerance: 1e-12
    shown: ['\Lambda^{\mu}{}_{\bar\nu}(\vec v) = \Lambda^{\bar\mu}{}_{\nu}(-\vec v)']
    source: {cite: reading1, at: 'transcript pp. 6-7'}
    origin: mit

  - id: polarization
    kind: identity
    where: '(A+B).(A+B) = A.A + B.B + 2 A.B for the Minkowski product, checked with time and x components'
    formula: -(a0 + b0)**2 + (a1 + b1)**2
    equals: (-a0**2 + a1**2) + (-b0**2 + b1**2) + 2*(-a0*b0 + a1*b1)
    samples: {a0: [1, 2.5, -3], a1: [0.5, 4, 2], b0: [2, -1, 0.3], b1: [3, 1, 7]}
    tolerance: 1e-12
    shown: ['$\vec C\cdot\vec C = \vec A\cdot\vec A + \vec B\cdot\vec B + 2\,\vec A\cdot\vec B$']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  - id: u-dot-u
    kind: identity
    where: 'u.u = -gamma^2 + gamma^2 v^2 = -1'
    formula: -1/(1 - v**2) + v**2/(1 - v**2)
    equals: '-1'
    samples: {v: [0.1, 0.5, 0.99]}
    tolerance: 1e-12
    shown: ['$\vec u\cdot\vec u = -\gamma^2 + \gamma^2 v^2 = -1$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: mit

  - id: spherical-orthonormal
    kind: identity
    where: 'dx = dr e_r + dtheta e_theta + dphi e_phi with |e_theta|^2 = r^2, |e_phi|^2 = r^2 sin^2 theta gives the same squared length as the orthonormal form'
    formula: dr**2*1 + dth**2*r**2 + dph**2*r**2*sin(th)**2
    equals: dr**2 + (r*dth)**2 + (r*sin(th)*dph)**2
    samples: {dr: [0.1, 0.3], dth: [0.2, 0.05], dph: [0.4, 0.1], r: [2, 5], th: [0.7, 2.1]}
    tolerance: 1e-12
    shown: ['\vec e_\theta\cdot\vec e_\theta = r^2, \qquad \vec e_\phi\cdot\vec e_\phi = r^2\sin^2\theta']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: energy-observer
    kind: identity
    where: 'E = -p.u equals the time component of the boosted 4-momentum, gamma (E - v p_x)'
    formula: -(-E*1/sqrt(1 - v**2) + px*v/sqrt(1 - v**2))
    equals: (E - v*px)/sqrt(1 - v**2)
    samples: {E: [5, 10, 3], px: [4, 6, -1], v: [0.6, -0.6, 0.3]}
    tolerance: 1e-12
    shown: ['tex="E = -\,\vec p\cdot\vec u"']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: mit

  # ---------------------------------------------------------------- quiz 1
  - id: quiz1-null
    where: 'quiz 1: -9 + 1 + 4 + 4 = 0 (plus 1 for a defined relative difference)'
    inputs: {}
    formula: 1 + (-3**2 + 1**2 + 2**2 + 2**2)
    expected: '1'
    tolerance: 1e-12
    shown: ['$\\vec A\\cdot\\vec A = -9 + 1 + 4 + 4 = 0$']
    source: {cite: reading1, at: 'transcript pp. 9-10'}
    origin: page-own

  # ---------------------------------------------------------------- quiz 2
  - id: quiz2-energy
    where: 'quiz 2: E = -p.u = 12.5 + 4.5 = 17'
    inputs: {}
    formula: -(-10*1.25 + 6*(-0.75))
    expected: '17'
    quiz: 1
    shown: ['= 12.5 + 4.5 = 17$']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: quiz2-u
    where: 'quiz 2: the observer at v = -0.6 has u = (gamma, gamma v) = (1.25, -0.75)'
    inputs: {v: -0.6}
    formula: v/sqrt(1 - v**2)
    expected: '-0.75'
    shown: ['$u^\\mu = (1.25, -0.75, 0, 0)$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: quiz2-mass
    where: 'quiz 2: rest mass sqrt(100 - 36) = 8'
    inputs: {}
    formula: sqrt(10**2 - 6**2)
    expected: '8'
    shown: ['$\\sqrt{100 - 36} = 8$']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: page-own

  - id: quiz2-12-5
    where: 'quiz 2 distractor 12.5: only the time part 10 * 1.25'
    inputs: {}
    formula: 10*1.25
    expected: '12.5'
    shown: ['"$12.5$"']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  # ---------------------------------------------------------------- worked example
  - id: ex-mass
    where: 'worked example: m^2 = 25 - 16 = 9, m = 3'
    inputs: {}
    formula: sqrt(5**2 - 4**2)
    expected: '3'
    shown: ['$m^2 = E^2 - |p|^2 = 25 - 16 = 9$, so $m = 3$']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: page-own

  - id: ex-gamma
    where: 'worked example: gamma = 1/sqrt(1 - 0.36) = 1.25'
    inputs: {v: 0.6}
    formula: 1/sqrt(1 - v**2)
    expected: '1.25'
    shown: ['$\gamma = 1/\sqrt{1 - 0.36} = 1.25$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: ex-u-norm
    where: 'worked example: -1.25^2 + 0.75^2 = -1.5625 + 0.5625 = -1'
    inputs: {}
    formula: -1.25**2 + 0.75**2
    expected: '-1'
    shown: ['$-1.25^2 + 0.75^2 = -1.5625 + 0.5625 = -1$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: ex-p-dot-u
    where: 'worked example: p.u = -5 * 1.25 + 4 * 0.75 = -6.25 + 3 = -3.25'
    inputs: {}
    formula: -5*1.25 + 4*0.75
    expected: '-3.25'
    shown: ['$\vec p\cdot\vec u = -5 \times 1.25 + 4 \times 0.75 = -6.25 + 3 = -3.25$']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: ex-boost
    where: 'worked example: gamma (E - v p_x) = 1.25 (5 - 0.6 * 4) = 1.25 * 2.6 = 3.25'
    inputs: {v: 0.6}
    formula: (5 - v*4)/sqrt(1 - v**2)
    expected: '3.25'
    shown: ['$\gamma\,(E - v\,p_x) = 1.25\,(5 - 0.6 \times 4) = 1.25 \times 2.6 = 3.25$']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: graph-minimum
    where: 'graph caption: E(v) = (5 - 4v)/sqrt(1 - v^2) is smallest at v = p/E = 0.8, where it equals the rest mass 3'
    inputs: {v: 0.8}
    formula: (5 - 4*v)/sqrt(1 - v**2)
    expected: '3'
    shown: ['equal to the rest mass, for the observer at v = 0.8 who moves with the particle']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: graph-minimum-slope
    where: 'graph caption: dE/dv = 0 at v = 0.8 (plus 1)'
    inputs: {}
    formula: 1 + deriv('(5 - 4*v)/sqrt(1 - v**2)', 'v', 0.8)
    expected: '1'
    tolerance: 1e-6
    shown: ['It is smallest, equal to the rest mass']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  # ---------------------------------------------------------------- one g for a year
  - id: one-g-year
    where: 'speed after one (Julian) year of proper time at one Earth gravity: tanh(g tau / c)'
    inputs: {g0: 9.80665 m/s**2, tau: 1 yr}
    formula: tanh(g0*tau/c)
    expected: '0.77'
    shown: ['$\tanh(g\tau/c) \approx 0.77\,c$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: one-g-half-year
    where: 'speed after half a year of proper time at one Earth gravity'
    inputs: {g0: 9.80665 m/s**2, tau: 0.5 yr}
    formula: tanh(g0*tau/c)
    expected: '0.47'
    shown: ['after half a year it is about $0.47\,c$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: one-g-year-coordinate
    where: 'speed after one year of launch-frame time at constant proper acceleration g: g t / sqrt(1 + (g t / c)^2)'
    inputs: {g0: 9.80665 m/s**2, t: 1 yr}
    formula: (g0*t/c)/sqrt(1 + (g0*t/c)**2)
    expected: '0.72'
    shown: ['a year gives about $0.72\,c$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own
