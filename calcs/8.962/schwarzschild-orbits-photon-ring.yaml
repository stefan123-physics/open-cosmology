# Calculations on content/year-5/8.962/schwarzschild-orbits-photon-ring.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Geometric units G = M = 1 (lengths in units of GM) unless stated.

page: content/year-5/8.962/schwarzschild-orbits-photon-ring.mdx
calcs:
  # ---------------------------------------------------------------- radial equation
  - id: radial-equation
    kind: identity
    where: 'formula "Radial equation": -(1 - 2/r)(dt/dtau)^2 + (dr/dtau)^2/(1 - 2/r) + r^2 (dphi/dtau)^2 = -1 with dt/dtau = E/(1 - 2/r), dphi/dtau = L/r^2 and (dr/dtau)^2 = E^2 - V_eff'
    formula: -(1 - 2/r)*(E/(1 - 2/r))**2 + (E**2 - (1 - 2/r)*(1 + L**2/r**2))/(1 - 2/r) + r**2*(L/r**2)**2
    equals: '-1'
    samples: {r: [5.0, 10.0, 30.0], E: [0.95, 0.98, 1.1], L: [4.0, 3.8, 5.0]}
    tolerance: 1e-10
    shown: ['V_\text{eff} = \left(1 - \frac{2GM}{r}\right)\left(1 + \frac{\hat L^2}{r^2}\right)" cite']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit

  # ---------------------------------------------------------------- circular orbits
  - id: circular-L
    kind: identity
    where: 'formula "Angular momentum of a circular orbit": dV_eff/dr = 0 at L^2 = r/(1 - 3/r) (G = M = 1)'
    formula: 1 + deriv('(1 - 2/x)*(1 + LL/x**2)', 'x', r, 1)
    equals: '1'
    samples: {r: [4.0, 6.0, 12.0], LL: [16.0, 12.0, 16.0]}
    tolerance: 1e-7
    shown: ['\hat L = \pm\frac{\sqrt{GMr}}{\sqrt{1 - 3GM/r}}']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: mit

  - id: circular-L-formula-values
    kind: identity
    where: 'the plot''s L = 4 orbits at r = 4 and 12, and L^2 = 12 at r = 6, satisfy L^2 = r/(1 - 3/r)'
    formula: r/(1 - 3/r)
    equals: LL
    samples: {r: [4.0, 12.0, 6.0], LL: [16.0, 16.0, 12.0]}
    tolerance: 1e-12
    shown: ['For L̂ = 4GM there is a maximum at r = 4GM', 'they merge at r = 6GM']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: circular-E
    kind: identity
    where: 'formula "Energy of a circular orbit": E^2 = V_eff with L^2 = r/(1 - 3/r) gives E = (1 - 2/r)/sqrt(1 - 3/r)'
    formula: sqrt((1 - 2/r)*(1 + (r/(1 - 3/r))/r**2))
    equals: (1 - 2/r)/sqrt(1 - 3/r)
    samples: {r: [4.0, 6.0, 30.0]}
    tolerance: 1e-12
    shown: ['\hat E = \frac{1 - 2GM/r}{\sqrt{1 - 3GM/r}} \;\approx\; 1 - \frac{GM}{2r}']
    source: {cite: reading1, at: 'transcript pp. 8–9'}
    origin: mit

  - id: circular-E-newtonian
    kind: limit
    where: 'formula "Energy of a circular orbit": (E - 1) r tends to -1/2 for large r'
    inputs: {}
    formula: ((1 - 2/R)/sqrt(1 - 3/R) - 1)*R
    limit: '-0.5'
    vary: {R: [1e2, 1e3, 1e4, 1e5]}
    tolerance: 1e-3
    shown: ['1 - \frac{GM}{2r} \quad (r \gg GM)']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: mit

  - id: kepler
    kind: identity
    where: 'formula "Orbital frequency seen from far away": (L/r^2)/(E/(1 - 2/r)) = sqrt(1/r^3) for circular orbits'
    formula: (sqrt(r/(1 - 3/r))/r**2)/(((1 - 2/r)/sqrt(1 - 3/r))/(1 - 2/r))
    equals: sqrt(1/r**3)
    samples: {r: [4.0, 6.0, 30.0]}
    tolerance: 1e-12
    shown: ['= \pm\sqrt{\frac{GM}{r^3}}" cite']
    source: {cite: reading1, at: 'transcript pp. 9–10'}
    origin: mit

  - id: isco
    where: 'formula "Marginally stable orbit": d^2V/dr^2 = 0 at the circular orbit with L^2 = r/(1 - 3/r) only at r = 6'
    inputs: {}
    formula: solve('deriv("(1 - 2/y)*(1 + (x/(1 - 3/x))/y**2)", "y", x, 2)', 'x', 4.5, 10)
    expected: '6'
    shown: ['tex="r_\text{ms} = 6GM"']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  # ---------------------------------------------------------------- plot values
  - id: plot-v-4
    where: 'plot caption: V_eff(4) = 1 for L = 4'
    inputs: {}
    formula: (1 - 2/4)*(1 + 16/16)
    expected: '1'
    shown: ['(V_eff = 1, an unstable circular orbit)']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: plot-v-12
    where: 'plot point and caption: V_eff(12) = 0.926 for L = 4'
    inputs: {}
    formula: (1 - 2/12)*(1 + 16/144)
    expected: '0.926'
    shown: ['(V_eff = 0.926, a stable one)', 'y: 0.9259']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: plot-v-6
    where: 'plot point and caption: V_eff(6) = 0.889 for L^2 = 12'
    inputs: {}
    formula: (1 - 2/6)*(1 + 12/36)
    expected: '0.889'
    shown: ['(V_eff = 0.889), the marginally stable orbit', 'y: 0.8889']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: plot-sqrt12
    where: 'plot caption: sqrt(12) = 3.46'
    inputs: {}
    formula: sqrt(12)
    expected: '3.46'
    shown: ['L̂ = √12 GM = 3.46GM']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  # ---------------------------------------------------------------- worked example and quiz 1, 2
  - id: gm-10
    where: 'worked example: GM/c^2 = 14 770 m for 10 solar masses'
    inputs: {gm: 1477 m}
    formula: 10*gm
    expected: 14770 m
    shown: ['$GM/c^2 = 14\,770$ m']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: isco-10
    where: 'worked example and quiz 1: 6GM/c^2 = 88.6 km'
    inputs: {gm: 1477 m}
    formula: 6*10*gm
    expected: 88.6 km
    shown: ['$r_\text{ms} = 6GM/c^2 = 88.6$ km', '$= 88.6$ km. Inside']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: quiz-2gm-10
    where: 'quiz 1 distractors: 2GM/c^2 = 29.5 km, 3GM/c^2 = 44.3 km'
    inputs: {gm: 1477 m}
    formula: 2*10*gm
    expected: 29.5 km
    shown: ['At $2GM/c^2 = 29.5$ km']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: quiz-3gm-10
    where: 'quiz 1 distractor: 3GM/c^2 = 44.3 km'
    inputs: {gm: 1477 m}
    formula: 3*10*gm
    expected: 44.3 km
    shown: ['At $3GM/c^2 = 44.3$ km']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: isco-frequency-10
    where: 'worked example: f = c^3/(2 pi 6^1.5 GM) = 220 Hz for 10 solar masses'
    inputs: {}
    formula: c**3/(2*pi*6**1.5*G*10*M_sun)
    expected: 220 Hz
    shown: ['$f = \Omega/2\pi = 220$ Hz']
    source: {cite: reading1, at: 'transcript pp. 9–11'}
    origin: page-own

  - id: isco-gw-10
    where: 'worked example: gravitational waves at twice the orbital frequency, 440 Hz'
    inputs: {}
    formula: 2*c**3/(2*pi*6**1.5*G*10*M_sun)
    expected: 440 Hz
    shown: ['at twice this, 440 Hz']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: page-own

  - id: isco-frequency-sgra
    where: 'worked example: 5.5e-4 Hz for 4e6 solar masses'
    inputs: {}
    formula: c**3/(2*pi*6**1.5*G*4e6*M_sun)
    expected: 5.5e-4 Hz
    shown: ['$5.5\times10^{-4}$ Hz']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: page-own

  - id: isco-period-sgra
    where: 'worked example: period about 30 minutes'
    inputs: {}
    formula: 2*pi*6**1.5*G*4e6*M_sun/c**3
    expected: 30 min
    tolerance: 1 min
    shown: ['a period of about 30 minutes']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: page-own

  - id: isco-energy
    where: 'worked example and quiz 2: E = (1 - 1/3)/sqrt(1/2) = 0.943'
    inputs: {}
    formula: (1 - 2/6)/sqrt(1 - 3/6)
    expected: '0.943'
    shown: ['$\hat E = (1 - 1/3)/\sqrt{1 - 1/2} = 0.943$', '= (2/3)/\\sqrt{1/2} = 0.943$ at $6GM$']
    source: {cite: reading1, at: 'transcript pp. 8–11'}
    origin: page-own

  - id: isco-radiated
    where: 'worked example and quiz 2: 1 - 0.943 = 0.057, i.e. 5.7%'
    inputs: {}
    formula: 1 - (1 - 2/6)/sqrt(1 - 3/6)
    expected: '0.057'
    shown: ['$1 - 0.943 = 0.057$: 5.7% of the rest energy has been radiated,', '$1 - 0.943 = 0.057$: 5.7% of the rest energy has been radiated."']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: fusion-efficiency
    kind: fact
    where: 'hydrogen to helium fusion releases 0.7% of rest energy'
    shown: ['(0.7% for hydrogen to helium)']
    source: {ref: 'mass defect of helium-4 relative to four hydrogen atoms, about 0.7%'}
    origin: later-data

  - id: quiz-percent-choices
    kind: fact
    where: 'quiz 2 distractors 0.1% and 42% (42% is the extremal Kerr figure)'
    shown: ['"About 0.1%"', '"About 42%"']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: page-own

  # ---------------------------------------------------------------- photons
  - id: photon-radial
    kind: identity
    where: 'formula "Light: conserved quantities and radial equation": -(1 - 2/r)(E/(1 - 2/r))^2 + (dr)^2/(1 - 2/r) + r^2 (L/r^2)^2 = 0 (plus 1)'
    formula: 1 - (1 - 2/r)*(E/(1 - 2/r))**2 + (E**2 - (1 - 2/r)*L**2/r**2)/(1 - 2/r) + r**2*(L/r**2)**2
    equals: '1'
    samples: {r: [3.0, 6.0, 20.0], E: [1.0, 0.5, 2.0], L: [5.0, 3.0, 9.0]}
    tolerance: 1e-10
    shown: ['\left(\frac{dr}{d\lambda}\right)^2 = E^2 - \left(1 - \frac{2GM}{r}\right)\frac{L^2}{r^2}']
    source: {cite: reading1, at: 'transcript pp. 13–14'}
    origin: mit

  - id: photon-rescaled
    kind: identity
    where: 'formula "Photon potential": dividing by L^2 with b = L/E gives 1/b^2 - (1 - 2/r)/r^2'
    formula: (E**2 - (1 - 2/r)*L**2/r**2)/L**2
    equals: 1/(L/E)**2 - (1 - 2/r)/r**2
    samples: {r: [3.0, 6.0, 20.0], E: [1.0, 0.5, 2.0], L: [5.0, 3.0, 9.0]}
    tolerance: 1e-12
    shown: ['\left(\frac{dr}{d\tilde\lambda}\right)^2 = \frac{1}{b^2} - V_\text{phot}']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: photon-peak-location
    where: 'V_phot peaks at r = 3GM'
    inputs: {}
    formula: solve('deriv("(1 - 2/y)/y**2", "y", x, 1)', 'x', 2.5, 5)
    expected: '3'
    shown: ['It peaks at $r = 3GM$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: photon-peak-value
    where: 'formula "Peak of the photon potential": (1 - 2/3)/9 = 1/27 = (1/(3 sqrt 3))^2; checked as 27 V(3) = 1 and (3 sqrt 3)^2 = 27'
    inputs: {}
    formula: 27*(1 - 2/3)/3**2 * (3*sqrt(3))**2/27
    expected: '1'
    shown: ['V_\text{phot}(3GM) = \frac{1}{27\,G^2M^2}']
    source: {cite: reading1, at: 'transcript pp. 14–15'}
    origin: mit

  - id: photon-peak-decimal
    where: 'plot point and caption, quiz 4: 1/27 = 0.037'
    inputs: {}
    formula: 1/27
    expected: '0.037'
    shown: ['its peak 1/27 = 0.037 at r = 3GM', '{ x: 3, y: 0.037, label: "photon orbit, r = 3GM" }', '1/(27G^2M^2) = 0.037/(GM)^2']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: b-crit
    where: 'plot caption and quiz 4: 3 sqrt 3 = 5.20'
    inputs: {}
    formula: 3*sqrt(3)
    expected: '5.20'
    shown: ['below 3√3 = 5.20', '3\\sqrt3\\,GM \\approx 5.20\\,GM$']
    quiz: 3
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: quiz-b5
    where: 'quiz 4: 1/b^2 = 1/25 = 0.040'
    inputs: {}
    formula: 1/5**2
    expected: '0.040'
    shown: ['$1/b^2 = 0.040/(GM)^2$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: eht-dates
    kind: fact
    where: 'EHT image of M87* announced 2019; Sgr A* image 2022 (later development)'
    shown: ['announced in 2019 (for the black hole in the galaxy M87)', 'followed in 2022, a later development']
    source: {cite: eht2019, at: 'Paper I'}
    origin: later-data
