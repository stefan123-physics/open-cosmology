  # ---- Problem 3

  # With test functions Φ(r) = -q/r and 2GM(r) = mm (a constant): Γ^r_tt (U^t)^2 from a numerical derivative of g_tt.
  - id: p3b-acc
    kind: identity
    where: 'Problem 3(b), formula "Problem 3(b): the radial acceleration of the fluid": -½ g^rr ∂_r g_tt (U^t)^2 against (1 - 2GM/r) ∂_r Φ, for a test Φ = -q/r'
    formula: -0.5*(1 - mm/r)*deriv('-exp(2*(-q/s))', 's', r, 1)*exp(q/r)**2
    equals: (1 - mm/r)*deriv('-q/s', 's', r, 1)
    samples:
      mm: [0.5, 1, 0.2, 1.5]
      q: [0.3, 1, 2, 0.5]
      r: [2, 3, 1, 4]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 3(b): the radial acceleration of the fluid"']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

