# Calculations on content/year-5/8.962/8-962-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# Christoffel symbols by numerical derivatives of the metric, worldlines differentiated numerically, the equations of
# equilibrium integrated or solved numerically, or a second physical argument.
# The speed of light is 1 except in Problems 2(d) and 2(e). Rindler coordinates: x stands for x-bar.
# Inertial coordinates behind the Rindler checks (MIT's Problem Set 2, Problem 6): T = (1/g + x) sinh(g t),
# X = (1/g + x) cosh(g t) - 1/g; they are used here only as an independent route and are not printed on the page.

page: content/year-5/8.962/8-962-problem-set-4.mdx
calcs:
  # ---- Introduction

  - id: intro-boltzmann
    where: 'Introduction: the Boltzmann constant (CODATA 2018, exact in the 2019 SI)'
    inputs: {}
    formula: k_B
    expected: 1.380649e-23 J/K
    shown: ['the Boltzmann constant $k = 1.380649\times 10^{-23}$ J/K']
    source: {cite: nist, at: 'Boltzmann constant'}
    origin: page-own

  - id: intro-c
    where: 'Introduction: the speed of light (exact)'
    inputs: {}
    formula: c
    expected: 299792458 m/s
    shown: ['the speed of light $c = 299\,792\,458$ m/s']
    source: {cite: nist, at: 'speed of light in vacuum'}
    origin: page-own

  - id: intro-amu
    kind: fact
    where: 'Introduction: the atomic mass constant (CODATA 2018: 1.660 539 066 60 × 10^-27 kg), rounded'
    shown: ['the atomic mass constant $1.660539\times 10^{-27}$ kg']
    source: {cite: nist, at: 'atomic mass constant'}
    origin: page-own

  # ---- Problem 1

  - id: p1a-dgtt
    kind: identity
    where: 'Problem 1(a), formula "Problem 1(a): the derivative of the metric": against a numerical derivative of g_tt'
    formula: -2*g*(1 + g*x)
    equals: deriv('-(1 + g*s)**2', 's', x, 1)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 1(a): the derivative of the metric"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1a-down-xtt
    kind: identity
    where: 'Problem 1(a), formula "Problem 1(a): the symbols with the indices down": Γ_xtt = -½ ∂_x g_tt'
    formula: g*(1 + g*x)
    equals: -0.5*deriv('-(1 + g*s)**2', 's', x, 1)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 1(a): the symbols with the indices down"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1a-down-ttx
    kind: identity
    where: 'Problem 1(a), formula "Problem 1(a): the symbols with the indices down": Γ_ttx = +½ ∂_x g_tt'
    formula: -g*(1 + g*x)
    equals: 0.5*deriv('-(1 + g*s)**2', 's', x, 1)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 1(a): the symbols with the indices down"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  # Γ^t_tx = ½ g^tt ∂_x g_tt, with the derivative of the metric taken numerically.
  - id: p1a-ttx
    kind: identity
    answer: p1a-ttx
    where: 'Problem 1(a), answer box Γ^t_tx: against ½ g^tt ∂_x g_tt with a numerical derivative of the metric'
    formula: g/(1 + g*x)
    equals: 0.5*(-1/(1 + g*x)**2)*deriv('-(1 + g*s)**2', 's', x, 1)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['id="p1a-ttx"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  # Γ^x_tt = -½ g^xx ∂_x g_tt, with the derivative of the metric taken numerically.
  - id: p1a-xtt
    kind: identity
    answer: p1a-xtt
    where: 'Problem 1(a), answer box Γ^x_tt: against -½ g^xx ∂_x g_tt with a numerical derivative of the metric'
    formula: g*(1 + g*x)
    equals: -0.5*1*deriv('-(1 + g*s)**2', 's', x, 1)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['id="p1a-xtt"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  # Both symbols at once, by a route without the Christoffel formula: a particle at rest in the inertial frame at
  # X = A - 1/g follows x(t) = A/cosh(g t) - 1/g in Rindler coordinates. A geodesic written with coordinate time obeys
  # x'' = -Γ^x_tt + 2 Γ^t_tx x'^2. (2 is added on both sides.)
  - id: p1a-geodesic
    kind: identity
    where: 'Problem 1(a), formula "Problem 1(a): the Christoffel symbols of Rindler spacetime": a straight inertial worldline obeys the geodesic equation with these symbols'
    formula: 2 + deriv('A/cosh(g*s) - 1/g', 's', t, 2)
    equals: 2 - g*(1 + g*(A/cosh(g*t) - 1/g)) + 2*(g/(1 + g*(A/cosh(g*t) - 1/g)))*deriv('A/cosh(g*s) - 1/g', 's', t, 1)**2
    samples:
      g: [0.5, 1, 1.5, 0.8, 1]
      A: [2, 1, 1.2, 3, 0.7]
      t: [0.3, 0.8, -0.5, 1.2, 0]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 1(a): the Christoffel symbols of Rindler spacetime"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1a-geodesic-t
    kind: identity
    where: 'Problem 1(a), check, formula "Problem 1(a): the geodesic equations of Rindler spacetime": the factor 2g/(1 + g x) in the t equation is 2 Γ^t_tx'
    formula: 2*g/(1 + g*x)
    equals: (-1/(1 + g*x)**2)*deriv('-(1 + g*s)**2', 's', x, 1)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 1(a): the geodesic equations of Rindler spacetime"']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1a-all
    where: 'Problem 1(a), statement: the number of Christoffel symbols in four dimensions'
    formula: 4**3
    expected: '64'
    shown: ['how many of the 64 symbols']
    source: {cite: mit, at: 'Problem 1 (our own addition)'}
    origin: page-own

  - id: p1a-count
    where: 'Problem 1(a), solution: Γ^x_tt, Γ^t_tx and Γ^t_xt'
    formula: 1 + 2
    expected: '3'
    shown: ['3 of the 64 are not zero']
    source: {cite: mit, at: 'Problem 1 (our own addition)'}
    origin: page-own

  # The worldline of fixed Rindler x is the hyperbola X + 1/g = R cosh(τ/R), T = R sinh(τ/R) with R = 1/g + x in
  # inertial coordinates, τ its proper time. Its proper acceleration is sqrt(X''^2 - T''^2).
  - id: p1b-acc
    kind: identity
    answer: p1b-acc
    where: 'Problem 1(b), answer box: against the proper acceleration of the hyperbola in inertial coordinates, by numerical second derivatives'
    formula: g/(1 + g*x)
    equals: sqrt(deriv('(1/g + x)*cosh(s/(1/g + x))', 's', tau, 2)**2 - deriv('(1/g + x)*sinh(s/(1/g + x))', 's', tau, 2)**2)
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
      tau: [0.5, 1, 0.2, 0.8, 0]
    tolerance: 1e-6
    shown: ['id="p1b-acc"']
    source: {cite: mit, at: 'Problem 1 (our own addition)'}
    origin: page-own

  - id: p1b-acc-direct
    kind: identity
    where: 'Problem 1(b), formula "Problem 1(b): the acceleration of an observer at rest": Γ^x_tt (U^t)^2 with the symbol from a numerical derivative'
    formula: g/(1 + g*x)
    equals: -0.5*deriv('-(1 + g*s)**2', 's', x, 1)*(1/(1 + g*x))**2
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 1(b): the acceleration of an observer at rest"']
    source: {cite: mit, at: 'Problem 1 (our own addition)'}
    origin: page-own

  - id: p1b-norm
    kind: identity
    where: 'Problem 1(b), formula "Problem 1(b): the 4-velocity of an observer at rest": g_tt (U^t)^2 = -1'
    formula: -(1 + g*x)**2*(1/(1 + g*x))**2
    equals: -1
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, -0.4]
    tolerance: 1e-12
    shown: ['<Formula label="Problem 1(b): the 4-velocity of an observer at rest"']
    source: {cite: mit, at: 'Problem 1 (our own addition)'}
    origin: page-own

  # ---- Problem 2

  # (b) Each Christoffel symbol of spherical coordinates on its own, from numerical derivatives of the metric
  # g_rr = 1, g_θθ = r^2, g_φφ = r^2 sin^2 θ. (2 is added where a side could be near zero.)
  - id: p2b-gamma-r-thth
    kind: identity
    where: 'Problem 2(b), formula "Problem 2(b): the Christoffel symbols of spherical coordinates": Γ^r_θθ = -½ ∂_r g_θθ'
    formula: -r
    equals: -0.5*deriv('s**2', 's', r, 1)
    samples:
      r: [0.5, 1, 2, 3.5]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 2(b): the Christoffel symbols of spherical coordinates"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-gamma-r-phph
    kind: identity
    where: 'Problem 2(b), same formula: Γ^r_φφ = -½ ∂_r g_φφ'
    formula: -r*sin(th)**2
    equals: -0.5*deriv('s**2*sin(th)**2', 's', r, 1)
    samples:
      r: [0.5, 1, 2, 3.5]
      th: [0.3, 1.2, 0.8, 2.5]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 2(b): the Christoffel symbols of spherical coordinates"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-gamma-th-rth
    kind: identity
    where: 'Problem 2(b), same formula: Γ^θ_rθ = ½ g^θθ ∂_r g_θθ'
    formula: 1/r
    equals: 0.5*(1/r**2)*deriv('s**2', 's', r, 1)
    samples:
      r: [0.5, 1, 2, 3.5]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 2(b): the Christoffel symbols of spherical coordinates"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-gamma-ph-rph
    kind: identity
    where: 'Problem 2(b), same formula: Γ^φ_rφ = ½ g^φφ ∂_r g_φφ'
    formula: 1/r
    equals: 0.5*(1/(r**2*sin(th)**2))*deriv('s**2*sin(th)**2', 's', r, 1)
    samples:
      r: [0.5, 1, 2, 3.5]
      th: [0.3, 1.2, 0.8, 2.5]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 2(b): the Christoffel symbols of spherical coordinates"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-gamma-th-phph
    kind: identity
    where: 'Problem 2(b), same formula: Γ^θ_φφ = -½ g^θθ ∂_θ g_φφ'
    formula: 2 - sin(th)*cos(th)
    equals: 2 - 0.5*(1/r**2)*deriv('r**2*sin(s)**2', 's', th, 1)
    samples:
      r: [0.5, 1, 2, 3.5]
      th: [0.3, 1.2, 0.8, 2.5]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 2(b): the Christoffel symbols of spherical coordinates"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-gamma-ph-thph
    kind: identity
    where: 'Problem 2(b), same formula: Γ^φ_θφ = ½ g^φφ ∂_θ g_φφ'
    formula: 2 + cos(th)/sin(th)
    equals: 2 + 0.5*(1/(r**2*sin(th)**2))*deriv('r**2*sin(s)**2', 's', th, 1)
    samples:
      r: [0.5, 1, 2, 3.5]
      th: [0.3, 1.2, 0.8, 2.5]
    tolerance: 1e-8
    shown: ['<Formula label="Problem 2(b): the Christoffel symbols of spherical coordinates"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  # The extra terms by a route without Christoffel symbols: a point at fixed r with θ = th + vth s and φ = vph s has the
  # Cartesian position r (sin θ cos φ, sin θ sin φ, cos θ). The radial part of its Cartesian acceleration at s = 0
  # (unit vector (sin th, 0, cos th)) is what the r equation must contain besides d v^r/dt.
  - id: p2b-extra
    kind: identity
    answer: p2b-extra
    where: 'Problem 2(b), answer box: against the radial part of the Cartesian acceleration of a point moving at fixed r, by numerical second derivatives'
    formula: -r*vth**2 - r*sin(th)**2*vph**2
    equals: sin(th)*deriv('r*sin(th + vth*s)*cos(vph*s)', 's', 0, 2) + cos(th)*deriv('r*cos(th + vth*s)', 's', 0, 2)
    samples:
      r: [0.5, 1, 2, 1.5]
      th: [0.3, 1.2, 0.8, 1.5]
      vth: [0.2, 1, 0.6, 0.4]
      vph: [1, 0.3, 0.7, 0.9]
    tolerance: 1e-6
    shown: ['id="p2b-extra"']
    source: {cite: mit, at: 'Problem 2(b) (our own addition)'}
    origin: page-own

  # (c) The equation of equilibrium integrated numerically: ln(ρ/ρ0) = -∫ (1 + w)/w · g/(1 + g s) ds.
  - id: p2c-rho
    kind: identity
    answer: p2c-rho
    where: 'Problem 2(c), answer box: against the numerical integral of the equation of equilibrium'
    formula: (1 + g*x)**(-(1 + w)/w)
    equals: exp(-integrate('(1 + w)/w*g/(1 + g*s)', 's', 0, x))
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, 1.4]
      w: [0.2, 1.5, 0.3333333333333333, 1, 0.6]
    tolerance: 1e-9
    shown: ['id="p2c-rho"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  # The same without integrating: dP/dx + (ρ + P) g/(1 + g x) = 0 with P = wρ, by a numerical derivative (1 is added).
  - id: p2c-ode
    kind: identity
    where: 'Problem 2(c), formula "Problem 2(c): the density profile for constant w": it satisfies the equation of equilibrium'
    formula: 1 + w*deriv('(1 + g*s)**(-(1 + w)/w)', 's', x, 1) + (1 + w)*(1 + g*x)**(-(1 + w)/w)*g/(1 + g*x)
    equals: 1
    samples:
      g: [0.2, 0.5, 1, 1.5, 0.7]
      x: [0.3, 2, 1, 0.5, 1.4]
      w: [0.2, 1.5, 0.3333333333333333, 1, 0.6]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 2(c): the density profile for constant w"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2c-radiation-exponent
    where: 'Problem 2(c), check: the exponent (1 + w)/w for w = 1/3'
    formula: (1 + 1/3)/(1/3)
    expected: '4'
    shown: ['it is $\rho = \rho_0\left(1 + g\bar x\right)^{-4}$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2c-radiation-value
    where: 'Problem 2(c), check: (1 + g x)^4 at g x = 1'
    formula: (1 + 1)**((1 + 1/3)/(1/3))
    expected: '16'
    shown: ['the density is $\rho_0/16$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2c-cold-power
    where: 'Problem 2(c), check: the power law at w = 0.001, g x = 0.001'
    formula: (1 + 0.001)**(-(1 + 0.001)/0.001)
    expected: '0.3677'
    shown: ['the power law gives $0.3677\,\rho_0$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2c-cold-exp
    where: 'Problem 2(c), check: the exponential exp(-g x/w) at w = 0.001, g x = 0.001'
    formula: exp(-0.001/0.001)
    expected: '0.3679'
    shown: ['the exponential $0.3679\,\rho_0$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  # (d) With c kept: the equation of equilibrium is dP/dx = -(ρ + P)(g/c^2)/(1 + g x/c^2) and P = w0 ρ/(1 + g x/c^2).
  # Put ρ = exp(-x/LL) in, divide by the exponential, and solve the equation numerically for LL at one height x.
  # The root must be w0 c^2/g whatever x is.
  - id: p2d-scale
    kind: identity
    answer: p2d-scale
    where: 'Problem 2(d), answer box: against the numerical root LL of the equation of equilibrium for the profile exp(-x/LL), at several heights'
    formula: w0*c**2/g
    equals: solve('-w0/(LL*(1 + g*x/c**2)) - w0*(g/c**2)/(1 + g*x/c**2)**2 + (1 + w0/(1 + g*x/c**2))*(g/c**2)/(1 + g*x/c**2)', 'LL', 0.001, 1000)
    samples:
      w0: [0.5, 1, 2, 0.2, 1.3]
      c: [1, 2, 3, 1.5, 4]
      g: [1, 0.5, 2, 0.3, 3]
      x: [0.3, 2, 1, 5, 0.1]
    tolerance: 1e-6
    shown: ['id="p2d-scale"']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # The full profile with c = 1, by a numerical derivative of the pressure (1 is added).
  - id: p2d-ode
    kind: identity
    where: 'Problem 2(d), formula "Problem 2(d): the equation for the density": the exponential profile satisfies dP/dx = -(ρ + P) g/(1 + g x) with P = w0 ρ/(1 + g x)'
    formula: 1 + deriv('w0*exp(-g*s/w0)/(1 + g*s)', 's', x, 1) + (exp(-g*x/w0) + w0*exp(-g*x/w0)/(1 + g*x))*g/(1 + g*x)
    equals: 1
    samples:
      w0: [0.5, 1, 2, 0.2, 1.3]
      g: [1, 0.5, 2, 0.3, 1.5]
      x: [0.3, 2, 1, 1.5, 0.1]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 2(d): the equation for the density"']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2d-gradient
    kind: identity
    where: 'Problem 2(d), formula "Problem 2(d): the pressure gradient": the product rule against a numerical derivative, for the exponential profile'
    formula: (w0/(1 + g*x))*(-(g/w0)*exp(-g*x/w0)) - w0*g*exp(-g*x/w0)/(1 + g*x)**2
    equals: deriv('w0*exp(-g*s/w0)/(1 + g*s)', 's', x, 1)
    samples:
      w0: [0.5, 1, 2, 0.2, 1.3]
      g: [1, 0.5, 2, 0.3, 1.5]
      x: [0.3, 2, 1, 1.5, 0.1]
    tolerance: 1e-7
    shown: ['<Formula label="Problem 2(d): the pressure gradient"']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2d-check-gradient
    where: 'Problem 2(d), check at g = 1, w0 = 1, x = 1: dP/dx in units of ρ'
    formula: (1/(1 + 1))*(-1) - 1/(1 + 1)**2
    expected: '-0.75'
    shown: ['$dP/d\bar x = -\rho/2 - \rho/4 = -\tfrac34\rho$']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  - id: p2d-check-inertia
    where: 'Problem 2(d), check at g = 1, w0 = 1, x = 1: (ρ + P) g/(1 + g x) in units of ρ'
    formula: (1 + 1/2)/(1 + 1)
    expected: '0.75'
    shown: ['the left side is $\left(\rho + \rho/2\right)/2 = \tfrac34\rho$']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # (e) The Newtonian equation of equilibrium (kT/μ) dρ/dx = -g ρ for ρ = exp(-x/LL), solved numerically for LL.
  - id: p2e-ln
    kind: identity
    answer: p2e-ln
    where: 'Problem 2(e), answer box L_N: against the numerical root LL of the Newtonian equation of equilibrium for the profile exp(-x/LL)'
    formula: k*T/(mu*g)
    equals: solve('-(k*T/mu)/LL + g', 'LL', 0.001, 1000)
    samples:
      k: [0.5, 1, 2, 1.2, 0.8]
      T: [0.5, 3, 1, 2, 1.5]
      mu: [0.5, 1, 2, 0.7, 1.4]
      g: [0.5, 1, 3, 2, 0.9]
    tolerance: 1e-6
    shown: ['id="p2e-ln"']
    source: {cite: mit, at: 'Problem 2(e) (our own solution)'}
    origin: page-own

  - id: p2e-agree
    kind: identity
    where: 'Problem 2(e), formula "Problem 2(e): the two scale heights agree": w0 c^2/g with w0 = kT/(μ c^2) against kT/(μ g)'
    formula: (k*T/(mu*c**2))*c**2/g
    equals: k*T/(mu*g)
    samples:
      k: [0.5, 1, 2, 1.2, 0.8]
      T: [0.5, 3, 1, 2, 1.5]
      mu: [0.5, 1, 2, 0.7, 1.4]
      g: [0.5, 1, 3, 2, 0.9]
      c: [1, 2, 3, 1.5, 4]
    tolerance: 1e-12
    shown: ['<Formula label="Problem 2(e): the two scale heights agree"']
    source: {cite: mit, at: 'Problem 2(e) (our own solution)'}
    origin: page-own

  - id: p2e-given
    kind: fact
    where: 'Problem 2(e), statement: the numbers we chose for the gas and the field (our own)'
    shown: ['Take $T = 288$ K, $\mu = 4.8\times 10^{-26}$ kg', '$g = 9.81$ m/s²; these numbers are ours']
    source: {cite: mit, at: 'Problem 2(e) (our own numbers)'}
    origin: page-own

