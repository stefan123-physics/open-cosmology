  # ---- Problem 5

  # The worldline solved independently: u^x = sinh(eEτ) solves du_x/dτ = eE sqrt(1 + u_x^2); x(τ) is its numerical
  # integral; the proper time at which the particle is at x is found by a numerical solve; γ = cosh(eEτ) there.
  - id: p5b-gamma
    kind: identity
    answer: p5b-gamma
    where: 'Problem 5(b), answer box: against γ on the worldline u^x = sinh(eEτ), at the proper time where its numerically integrated position is x'
    formula: 1 + e*E*x
    equals: cosh(e*E*solve('integrate("sinh(e*E*s)", "s", 0, tt) - x', 'tt', 0, 20))
    samples:
      e: [0.5, 1, 2, 1.5, 0.8]
      E: [0.5, 2, 1, 0.7, 1.2]
      x: [0.2, 2, 1, 0.5, 1.5]
    tolerance: 1e-6
    shown: ['id="p5b-gamma"']
    source: {cite: mit, at: 'Problem 5 (our own addition)'}
    origin: page-own

