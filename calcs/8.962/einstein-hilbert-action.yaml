# Calculations on content/year-5/8.962/einstein-hilbert-action.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 13 transcript; page numbers are the PDF pages of the transcript.
# Checks: the volume variation on diag(-1, a^2, a^2, a^2), the Klein-Gordon Euler-Lagrange step, the
# electromagnetic stress-energy components of a uniform field (and its SI energy density and curvature), the
# alpha = 0 limit of the 1/R field equation, and the dates quoted.

page: content/year-5/8.962/einstein-hilbert-action.mdx
calcs:
  - id: sqrtg-variation
    kind: identity
    where: 'formula "Variation of the volume factor" on diag(-1, a^2, a^2, a^2): d(a^3)/da = -(1/2) a^3 * 3 * a^2 * d(1/a^2)/da'
    formula: 3*aa**2
    equals: -0.5*aa**3*3*aa**2*(-2/aa**3)
    samples: {aa: [0.5, 2.0, 7.3]}
    tolerance: 1e-12
    shown: ['$-\frac12 a^3 \times (-6\,\delta a/a) = 3a^2\,\delta a = 0.12$']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: sqrtg-direct
    where: 'worked example "Checking the volume variation": 3 a^2 da for a = 2, da = 0.01'
    inputs: {}
    formula: 3*2**2*0.01
    expected: '0.12'
    shown: ['$3 \times 4 \times 0.01 = 0.12$']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: sqrtg-exact
    where: 'worked example: the exact change 2.01^3 - 8'
    inputs: {}
    formula: 2.01**3 - 8
    expected: '0.120601'
    shown: ['$2.01^3 - 8 = 0.120601$']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: klein-gordon
    kind: identity
    where: 'formula "Klein-Gordon equation": for a plane wave exp(i(kx - wt)) the Euler-Lagrange equation of L = -(1/2) eta d phi d phi - (1/2) m^2 phi^2 requires -box phi... i.e. w^2 - k^2 - m^2 = 0; box acting on the wave gives (w^2 - k^2) phi, checked with the dispersion relation'
    formula: (ww**2 - kk**2) - mm**2
    equals: '0'
    samples: {kk: [0.3, 1.0, 2.5], mm: [1.0, 0.2, 3.0], ww: [1.0440306508910551, 1.019803902718557, 3.905124837953327]}
    tolerance: 1e-12
    shown: ['tex="\Box\phi - m^2\phi = 0, \qquad \Box \equiv']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  - id: em-invariant
    kind: identity
    where: 'worked example "The stress-energy of a uniform electric field": F_ab F^ab = 2 F_01 F^01 with F^01 = -F_01 = E'
    formula: 2*(-EE)*(EE)
    equals: -2*EE**2
    samples: {EE: [1.0, 3.5, 0.2]}
    tolerance: 1e-12
    shown: ['$F_{\alpha\beta}F^{\alpha\beta} = 2F_{01}F^{01} = 2(-E)(E) = -2E^2$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: em-T00
    kind: identity
    where: 'worked example: T_00 = F_01 F_0^1 - (1/4) g_00 F^2 = E^2 - (1/4)(-1)(-2E^2) = E^2/2'
    formula: (-EE)*(-EE) - 0.25*(-1)*(-2*EE**2)
    equals: 0.5*EE**2
    samples: {EE: [1.0, 3.5, 0.2]}
    tolerance: 1e-12
    shown: ['= E^2 - \frac12E^2 = \frac12E^2$, the energy density']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: em-T11
    kind: identity
    where: 'worked example: T_11 = F_10 F_1^0 - (1/4) g_11 F^2 with F_1^0 = g^00 F_10 = -E: -E^2 + E^2/2 = -E^2/2'
    formula: (EE)*(-EE) - 0.25*(1)*(-2*EE**2)
    equals: -0.5*EE**2
    samples: {EE: [1.0, 3.5, 0.2]}
    tolerance: 1e-12
    shown: ['= -E^2 + \frac12E^2 = -\frac12E^2$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: em-T22
    kind: identity
    where: 'worked example: T_22 = 0 - (1/4)(1)(-2E^2) = E^2/2'
    formula: 0 - 0.25*(1)*(-2*EE**2)
    equals: 0.5*EE**2
    samples: {EE: [1.0, 3.5, 0.2]}
    tolerance: 1e-12
    shown: ['$T_{22} = 0 + \frac12E^2$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: em-energy-si
    where: 'worked example step "In SI units": (1/2) eps0 E^2 for E = 1e6 V/m'
    inputs: {eps0: 8.8541878128e-12 F/m, E: 1e6 V/m}
    formula: 0.5*eps0*E**2
    expected: 4.43 J/m**3
    shown: ['10^{12} \approx 4.43\ \text{J/m}^3$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: em-curvature
    where: 'worked example step "In SI units": 8 pi G/c^4 times 4.43 J/m^3'
    inputs: {eps0: 8.8541878128e-12 F/m, E: 1e6 V/m}
    formula: 8*pi*G/c**4*0.5*eps0*E**2
    expected: 9.2e-43 1/m**2
    shown: ['about $9.2\times10^{-43}\ \text{m}^{-2}$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

  - id: one-over-r-limit
    kind: identity
    where: 'formula "Field equation of the 1/R theory": at alpha = 0 the left-hand side is R_mn - (1/2) R g_mn (one component with sample numbers; the derivative term is proportional to alpha)'
    formula: (1 + 0/RR**2)*Rmn - 0.5*(1 - 0/RR**2)*RR*gmn + 0*dterm
    equals: Rmn - 0.5*RR*gmn
    samples: {RR: [0.7, 2.0, -1.5], Rmn: [0.3, -1.1, 2.0], gmn: [-1.0, 1.0, 0.5], dterm: [5.0, -2.0, 0.1]}
    tolerance: 1e-12
    shown: ['For $\alpha = 0$ it is the Einstein equation.']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: f-of-R-trace
    kind: identity
    where: 'formula "Field equation of the 1/R theory": its first two terms are f''(R) R_mn - (1/2) f(R) g_mn for f = R - alpha/R, since f'' = 1 + alpha/R^2 and f = (1 - alpha/R^2) R'
    formula: RR - al/RR
    equals: (1 - al/RR**2)*RR
    samples: {RR: [0.7, 2.0, -1.5], al: [1.0, 0.3, 2.0]}
    tolerance: 1e-12
    shown: ['- \frac{1}{2}\left(1 - \frac{\alpha}{R^2}\right)R\,g_{\mu\nu}']
    source: {cite: reading1, at: 'transcript pp. 14–15'}
    origin: mit

  - id: dates-hilbert
    kind: fact
    where: 'introduction: Hilbert''s route in 1915; the Carroll et al. paper of 2004 (Hughes: "coming up on its second decade" in 2020)'
    shown: ['at almost the same time as Einstein''s in 1915', '*Physical Review D* (2004)']
    source: {cite: reading1, at: 'transcript pp. 3, 15'}
    origin: mit

  - id: constants-in-text
    kind: fact
    where: 'the constants 1/16 pi G and 8 pi G, the factor 1/4 of the Maxwell Lagrangian, Appendix E of Wald; the three methods of the outline'
    shown: ['Appendix E of Wald''s *General Relativity*', 'factor $1/16\pi G$ chosen']
    source: {cite: reading1, at: 'transcript pp. 7, 12'}
    origin: mit
