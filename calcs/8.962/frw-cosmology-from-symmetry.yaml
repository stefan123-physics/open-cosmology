  - id: killing-minkowski
    where: 'section "Maximally symmetric spaces" and quiz 1: 4 x 5/2 = 10 for Minkowski spacetime'
    inputs: {}
    formula: 4*(4 + 1)/2
    expected: '10'
    shown: ['$4 \times 5/2 = 10$: 3 rotations, 3 boosts', '$4 \\times 5/2 = 10$. In Minkowski']
    source: {cite: reading1, at: 'transcript p. 2'}
