  # ---------------------------------------------------------------- maximally symmetric curvature
  - id: ricci-from-riemann-trace
    kind: identity
    where: 'formula "Its Ricci tensor": R/(n(n-1)) (n g - g) = (R/n) g, checked for the coefficient of g at several n'
    formula: (n*1 - 1)/(n*(n - 1))
    equals: 1/n
    samples: {n: [2, 3, 4, 7]}
    tolerance: 1e-12
    shown: ['\left(n\,g_{\beta\nu} - g_{\beta\nu}\right) = \frac{R}{n}\,g_{\beta\nu}']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: mit

  - id: ricci-scalar-of-ricci
    kind: identity
    where: 'formula "Its Ricci tensor": one more trace of (R/n) g gives back R (trace of the metric is n)'
    formula: (RR/n)*n
    equals: RR
    samples: {RR: [0.5, 2.0, -3.0], n: [4, 3, 4]}
    tolerance: 1e-12
    shown: ['one more trace confirms that the $R$ in front is the Ricci scalar']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: mit

  - id: spatial-ricci-2k
    kind: identity
    where: 'formula "Curvature of each spatial slice": the n = 3 form R/(n(n-1)) = k gives Ricci coefficient (n-1)k = 2k and scalar n(n-1)k = 6k'
    formula: (3 - 1)*kk + 100
    equals: 2*kk + 100
    samples: {kk: [-1, 0.5, 1]}
    tolerance: 1e-12
    shown: ['{}^{3}\!R_{jl} = 2k\,\gamma_{jl}']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  - id: spatial-ricci-scalar-6k
    kind: identity
    where: 'formula "Curvature of each spatial slice": scalar curvature 3 x 2k = 6k'
    formula: 3*(3 - 1)*kk + 100
    equals: 6*kk + 100
    samples: {kk: [-1, 0.5, 1]}
    tolerance: 1e-12
    shown: ['{}^{3}\!R = 6k']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  # ---------------------------------------------------------------- solving for beta
  - id: beta-solves-ode
    kind: identity
    where: 'formula "Equating the two Ricci components": beta = -(1/2) ln(1 - k r^2) satisfies (2/r) dbeta/dr = 2k e^(2 beta)'
    formula: (2/r)*deriv('-0.5*log(1 - kk*x**2)', 'x', r, 1)
    equals: 2*kk*exp(2*(-0.5*log(1 - kk*r**2)))
    samples: {kk: [1, -1, 0.3], r: [0.5, 0.8, 0.2]}
    tolerance: 1e-7
    shown: ['\frac{2}{\bar r}\,\frac{d\beta}{d\bar r} = 2k\,e^{2\beta}']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: beta-ode-rearranged
    kind: identity
    where: 'formula "Equating the two Ricci components": d(e^(-2 beta))/dr = -2 k r for e^(-2 beta) = 1 - k r^2'
    formula: deriv('1 - kk*x**2', 'x', r, 1) + 10
    equals: -2*kk*r + 10
    samples: {kk: [1, -1, 0.3], r: [0.5, 0.8, 0.2]}
    tolerance: 1e-8
    shown: ['\frac{d}{d\bar r}\left(e^{-2\beta}\right) = -2k\,\bar r']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: rescaling-invariance
    kind: identity
    where: 'formula "A rescaling that leaves the metric unchanged": with k -> k/alpha, r -> sqrt(alpha) r, R -> R/sqrt(alpha), the radial term R^2 dr^2/(1 - k r^2) is unchanged (dr = 1)'
    formula: (RR/sqrt(al))**2*al/(1 - (kk/al)*al*r**2)
    equals: RR**2/(1 - kk*r**2)
    samples: {RR: [1.3, 2.0, 1.3], al: [4.0, 9.0, 0.5], kk: [1, -1, 1], r: [0.6, 0.3, 0.6]}
    tolerance: 1e-12
    shown: ['k \to \frac{k}{\alpha}, \qquad \bar r \to \sqrt{\alpha}\,\bar r, \qquad R \to \frac{R}{\sqrt{\alpha}}']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: slip

  - id: rescaling-angular
    kind: identity
    where: 'same rescaling: the angular term R^2 r^2 is unchanged'
    formula: (RR/sqrt(al))**2*al*r**2
    equals: RR**2*r**2
    samples: {RR: [1.3, 2.0, 1.3], al: [4.0, 9.0, 0.5], r: [0.3, 0.6, 0.3]}
    tolerance: 1e-12
    shown: ['Then $k\bar r^2$, $R\,d\bar r$ and $R\,\bar r$ are all unchanged']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: chi-closed
    kind: identity
    where: 'formula "The radial coordinate chi": for k = +1, r = sin(chi) gives dchi/dr = 1/sqrt(1 - r^2)'
    formula: deriv('asin(x)', 'x', r, 1)
    equals: 1/sqrt(1 - r**2)
    samples: {r: [0.1, 0.5, 0.9]}
    tolerance: 1e-7
    shown: ['\bar r = \sin\chi\ (k = +1)']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: mit

  - id: chi-open
    kind: identity
    where: 'formula "The radial coordinate chi": for k = -1, r = sinh(chi) gives dchi/dr = 1/sqrt(1 + r^2)'
    formula: deriv('asinh(x)', 'x', r, 1)
    equals: 1/sqrt(1 + r**2)
    samples: {r: [0.1, 0.5, 3.0]}
    tolerance: 1e-7
    shown: ['\bar r = \sinh\chi\ (k = -1)']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: mit

  - id: plot-sinh-sq
    where: 'plot caption: sinh^2 chi = 5.30 at chi = pi/2'
    inputs: {}
    formula: sinh(pi/2)**2
    expected: '5.30'
    shown: ['sinh²χ = 5.30 at χ = π/2']
    source: {cite: reading1, at: 'transcript pp. 9–10'}
    origin: page-own

  - id: plot-chi-sq
    where: 'plot caption: chi^2 = 2.47 at chi = pi/2'
    inputs: {}
    formula: (pi/2)**2
    expected: '2.47'
    shown: ['against χ² = 2.47 for flat space']
    source: {cite: reading1, at: 'transcript pp. 9–10'}
    origin: page-own

  - id: kappa-rescaled-metric
    kind: identity
    where: 'formula "Robertson-Walker line element with a(t)": with a = R/R0, r = R0 rbar, kappa = k/R0^2 the radial term a^2 dr^2/(1 - kappa r^2) equals R^2 drbar^2/(1 - k rbar^2) (drbar = 1)'
    formula: (RR/R0)**2*R0**2/(1 - (kk/R0**2)*(R0*rb)**2)
    equals: RR**2/(1 - kk*rb**2)
    samples: {RR: [1.5, 3.0], R0: [5.0, 2.0], kk: [1, -1], rb: [0.7, 0.2]}
    tolerance: 1e-12
    shown: ['\kappa = \frac{k}{R_0^2}']
    source: {cite: reading1, at: 'transcript pp. 10–11'}
    origin: mit

  # ---------------------------------------------------------------- energy conservation and Friedmann
  - id: first-law-equivalence
    kind: identity
    where: 'formula "Local energy conservation": with rhodot = -3 (adot/a)(rho + P), d(rho a^3)/dt + P d(a^3)/dt = 0; checked as rhodot a^3 + 3 rho a^2 adot + 3 P a^2 adot = 0 (plus 1)'
    formula: 1 + (-3*(ad/a)*(rho + P))*a**3 + 3*rho*a**2*ad + 3*P*a**2*ad
    equals: '1'
    samples: {a: [0.5, 1.0, 2.0], ad: [1.1, 0.3, 1.1], rho: [1.0, 2.5, 1.0], P: [0.0, 0.4, -1.0]}
    tolerance: 1e-12
    shown: ['\frac{d}{dt}\left(\rho R^3\right) = -P\,\frac{d}{dt}\left(R^3\right)']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: mit

  - id: trace-perfect-fluid
    kind: identity
    where: 'section "The Friedmann equations": T = trace of diag(-rho, P, P, P) = -rho + 3P'
    formula: -rho + P + P + P
    equals: -rho + 3*P
    samples: {rho: [1.0, 2.5, 1.0], P: [0.4, -1.0, 0.1]}
    tolerance: 1e-12
    shown: ['$T = T^{\mu}{}_{\mu} = -\rho + 3P$']
    source: {cite: reading1, at: 'transcript p. 13'}
    origin: page-own

  - id: friedmann-tt
    kind: identity
    where: 'F2 from the tt component: R_tt = -3 addot/a = 8 pi G (T_tt - (1/2) T g_tt) with T_tt = rho, g_tt = -1; checked with addot/a from F2 (G = 1)'
    formula: 10 - 3*(-(4*pi/3)*(rho + 3*P))
    equals: 10 + 8*pi*(rho - 0.5*(-rho + 3*P)*(-1))
    samples: {rho: [1.0, 2.5, 1.0], P: [0.4, -1.0, 0.0]}
    tolerance: 1e-12
    shown: ['\text{F2:}\ \ \frac{\ddot a}{a} = -\frac{4\pi G}{3}\left(\rho + 3P\right)']
    source: {cite: reading1, at: 'transcript p. 13'}
    origin: mit

  - id: friedmann-ij-consistent
    kind: identity
    where: 'the ij component (a addot + 2 adot^2 + 2 kappa) = 4 pi G (rho - P) a^2 holds when adot is set by F1 and addot by F2 (G = 1)'
    formula: 10 + a*(a*(-(4*pi/3)*(rho + 3*P))) + 2*(a**2*(8*pi/3*rho - kap/a**2)) + 2*kap
    equals: 10 + 4*pi*(rho - P)*a**2
    samples: {a: [0.5, 1.0, 2.0], rho: [2.5, 1.0, 2.5], P: [0.0, 0.4, 0.0], kap: [-0.5, 0.0, 0.7]}
    tolerance: 1e-12
    shown: ['$R_{ij} = \left(a\ddot a + 2\dot a^2 + 2\kappa\right)\tilde\gamma_{ij}$']
    source: {cite: reading1, at: 'transcript p. 13'}
    origin: page-own

  - id: omega-minus-one
    kind: identity
    where: 'formula "Density decides the geometry": F1 with rho = Omega rho_crit gives Omega - 1 = kappa/(H^2 a^2) (G = 1)'
    formula: 10 + (8*pi/3*rho)/H**2 - 1
    equals: 10 + (8*pi/3*rho - H**2)*a**2/(H**2*a**2)
    samples: {rho: [0.1, 0.3, 0.1], H: [1.5, 0.8, 1.5], a: [2.0, 0.5, 1.0]}
    tolerance: 1e-12
    shown: ['\Omega - 1 = \frac{\kappa}{H^2a^2}']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: omega-curv-sum
    kind: identity
    where: 'formula "Curvature density": Omega + Omega_curv = 1 when H^2 = 8 pi rho/3 - kappa/a^2 (G = 1)'
    formula: rho/(3*(8*pi/3*rho - kap/a**2)/(8*pi)) + (-3*kap/(8*pi*a**2))/(3*(8*pi/3*rho - kap/a**2)/(8*pi))
    equals: '1'
    samples: {rho: [0.1, 0.3, 0.1], kap: [0.05, -0.2, 0.05], a: [2.0, 0.8, 1.0]}
    tolerance: 1e-12
    shown: ['\qquad \Omega + \Omega_\text{curv} = 1']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: quiz2-closed
    where: 'quiz 2: 10% above critical gives Omega = 1.1 > 1, so kappa = H^2 a^2 (Omega - 1) > 0 (positive answer checked with H = a = 1)'
    inputs: {}
    formula: 1.1 - 1
    expected: '0.1'
    shown: ['$\\Omega = 1.1$ means $\\kappa > 0$']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: page-own

