  # ---------------------------------------------------------------- one-species flat universes
  - id: power-law-solves-friedmann
    kind: identity
    where: 'formula "Flat, one species": a = t^(2/(3(1+w))) gives (adot/a)^2 proportional to a^(-3(1+w)); checked as (adot/a)^2 a^(3(1+w)) = (2/(3(1+w)))^2, a constant'
    formula: (deriv('x**(2/(3*(1 + w)))', 'x', t, 1)/t**(2/(3*(1 + w))))**2 * (t**(2/(3*(1 + w))))**(3*(1 + w))
    equals: (2/(3*(1 + w)))**2
    samples: {w: [0, 0.3333333333, 1, -0.5], t: [1.0, 2.0, 0.5, 1.0]}
    tolerance: 1e-6
    shown: ['a \propto t^{2/[3(1+w)]}']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: mit

  - id: adot-power
    kind: identity
    where: 'formula "Flat, one species": adot proportional to a^(1 - 3(1+w)/2); for a = t^p, adot = p t^(p-1) = p a^(1 - 1/p) with 1/p = 3(1+w)/2'
    formula: deriv('x**(2/(3*(1 + w)))', 'x', t, 1)
    equals: (2/(3*(1 + w)))*(t**(2/(3*(1 + w))))**(1 - 3*(1 + w)/2)
    samples: {w: [0, 0.3333333333, 1], t: [2.0, 0.5, 2.0]}
    tolerance: 1e-6
    shown: ['\dot a \propto a^{1 - 3(1+w)/2}']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: mit

  - id: stiff-exponent
