  # ---------------------------------------------------------------- equations of state
  - id: dilution-solves-conservation
    kind: identity
    where: 'formula "How a species dilutes": rho = rho0 a^(-3(1+w)) satisfies d rho/da = -3 (rho + w rho)/a'
    formula: deriv('rho0*x**(-3*(1 + w))', 'x', a, 1)
    equals: -3*(1 + w)*rho0*a**(-3*(1 + w))/a
    samples: {rho0: [1.0, 2.0, 1.0, 2.0], w: [0.3333333333, -0.5, 1, 0], a: [0.5, 1.5, 0.5, 1.5]}
    tolerance: 1e-7
    shown: ['\frac{\rho_i}{\rho_{i,0}} = \left(\frac{a}{a_0}\right)^{-3(1 + w_i)}']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: mit

