    where: 'Problem 6(a), answer box: the exact solution of E + p = X with X = m_π(2m_N + m_π)/(2kT), in GeV'
    formula: ((135e6*(2*938e6 + 135e6)/(2*8.617333e-5*2.73)) + (938e6)**2/(135e6*(2*938e6 + 135e6)/(2*8.617333e-5*2.73)))/2 / 1e9
    expected: '2.885e11'
    shown: ['id="p6a-eth"', '= 2.885\times 10^{20}\ \text{eV} = 2.885\times 10^{11}\ \text{GeV}']
    source: {cite: mit, at: 'Problem 6(a) (our own solution)'}
