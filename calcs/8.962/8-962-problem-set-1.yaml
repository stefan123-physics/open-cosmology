  # ---- Problem 5

  - id: p5-vapp-fact
    kind: fact
    where: 'Problem 5(c), statement: the apparent speed of 3C 273 on the sheet of MIT'
    shown: ['$v_\text{app} \approx 10$']
    source: {cite: mit, at: 'Problem 5(c), p. 3'}
    origin: mit

  # (b): at cos θ = v the derivative of v_app with respect to θ vanishes (1 is added on both sides).
  - id: p5b-cos
    kind: identity
    answer: p5b-cos
    where: 'Problem 5(b), answer box cos θ: against the cosine of the angle at which the quotient-rule numerator of the derivative vanishes (numerical solve)'
    formula: v
    equals: cos(solve('v*cos(x)*(1 - v*cos(x)) - v*sin(x)*v*sin(x)', 'x', 0.01, 3.1))
    samples:
      v: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-5
    shown: ['id="p5b-cos"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  # The same without any algebra: the numerical derivative of v_app with respect to θ vanishes at θ = arccos v (1 is added on both sides).
  - id: p5b-cos-stationary
    kind: identity
    where: 'Problem 5(b), answer box cos θ: the numerical derivative of v sin θ/(1 − v cos θ) vanishes at θ = arccos v'
    formula: 1 + deriv('v*sin(s)/(1 - v*cos(s))', 's', acos(v))
    equals: 1
    samples:
      v: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-5
    shown: ['id="p5b-cos"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5b-max
    kind: identity
    answer: p5b-max
    where: 'Problem 5(b), answer box: the formula of part (a) evaluated at θ = arccos v'
    formula: v/sqrt(1 - v**2)
    equals: v*sin(acos(v))/(1 - v*cos(acos(v)))
    samples:
      v: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-10
    shown: ['id="p5b-max"', '<Formula label="Problem 5(b): the largest apparent speed"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5b-derivative
    kind: identity
    where: 'Problem 5(b), formula "Problem 5(b): the derivative with respect to the angle": against a numerical derivative'
    formula: v*(cos(th) - v)/(1 - v*cos(th))**2
    equals: deriv('v*sin(s)/(1 - v*cos(s))', 's', th)
    samples:
      v: [0.1, 0.3, 0.6, 0.8, 0.95]
      th: [0.2, 1.0, 0.5, 2.0, 0.3]
    tolerance: 1e-5
    shown: ['<Formula label="Problem 5(b): the derivative with respect to the angle"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5b-vmin
    answer: p5b-vmin
    where: 'Problem 5(b), answer box: the speed at which γv = 1, by a numerical solve'
