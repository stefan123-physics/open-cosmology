    expected: '0.7071'
    shown: ['id="p5b-vmin"', '$v > 1/\sqrt 2 = 0.7071$']
    source: {cite: mit, at: 'Problem 5(b) (our own addition)'}
    origin: page-own

  - id: p5b-vmin-closed
