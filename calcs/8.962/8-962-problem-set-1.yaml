# Calculations on content/year-5/8.962/8-962-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# numerical derivatives of the fields of Problem 2, a numerical solve, an exact entry of a matrix product, or a second physical argument.
# The speed of light is 1 throughout: speeds are pure numbers. Problem 6 uses eV.
# Problem 4: the three exact entries were also checked by multiplying the four 4×4 boost matrices numerically (NumPy, outside this file).

page: content/year-5/8.962/8-962-problem-set-1.mdx
calcs:
  # ---- Introduction

  - id: intro-boltzmann
    where: 'Introduction and Problem 6(a): the Boltzmann constant in eV/K (CODATA 2018, exact in the 2019 SI)'
    inputs: {}
    formula: k_B
    expected: 8.617333e-5 eV/K
    shown: ['NIST (CODATA 2018), $k = 8.617333\times 10^{-5}$ eV/K', 'with $k = 8.617333\times 10^{-5}$ eV/K']
    source: {cite: nist, at: 'Boltzmann constant in eV/K'}
    origin: page-own

  # ---- Problem 1

  - id: p1a-example-a
    where: 'Problem 1(a), check: the square of (0, 3, 0, 0)'
    formula: -0**2 + 3**2
    expected: '9'
    shown: ['$\vec A\cdot\vec A = 9$']
    source: {cite: mit, at: 'Problem 1(a) (our own example)'}
    origin: page-own

  - id: p1a-example-b
    where: 'Problem 1(a), check: the square of (1, 0, 2, 0)'
    formula: -1**2 + 2**2
    expected: '3'
    shown: ['$\vec B\cdot\vec B = -1 + 4 = 3$']
    source: {cite: mit, at: 'Problem 1(a) (our own example)'}
    origin: page-own

  - id: p1a-example-sum
    where: 'Problem 1(a), check: the square of the sum (1, 3, 2, 0)'
    formula: -1**2 + 3**2 + 2**2
    expected: '12'
    shown: ['$-1 + 9 + 4 = 12 = 9 + 3$']
    source: {cite: mit, at: 'Problem 1(a) (our own example)'}
    origin: page-own

  - id: p1a-counter-square
    where: 'Problem 1(a), check: the square of (2, 3, 0, 0), and of (2, −3, 0, 0)'
    formula: -2**2 + 3**2
    expected: '5'
    shown: ['with squares 5 and 5']
    source: {cite: mit, at: 'Problem 1(a) (our own example)'}
    origin: page-own

  - id: p1a-counter-product
    where: 'Problem 1(a), check: the product of (2, 3, 0, 0) and (2, −3, 0, 0)'
    formula: -2*2 + 3*(-3)
    expected: '-13'
    shown: ['their product is $-13$']
    source: {cite: mit, at: 'Problem 1(a) (our own example)'}
    origin: page-own

  - id: p1a-counter-sum
    where: 'Problem 1(a), check: the square of the sum (4, 0, 0, 0) is negative (timelike)'
    formula: -4**2
    expected: '-16'
    shown: ['their sum $(4, 0, 0, 0)$ is timelike']
    source: {cite: mit, at: 'Problem 1(a) (our own example)'}
    origin: page-own

  # ---- Problem 2

  - id: p2a-uu
    kind: identity
    where: 'Problem 2(a), formula "Problem 2(a): the square of U": −(U^t)² + (U^x)² + (U^y)² is −1 at every t'
    formula: -(1 + t**2)**2 + (t**2)**2 + (sqrt(2)*t)**2
    equals: -1
    samples:
      t: [0, 0.3, 1, 2.5, 7]
    tolerance: 1e-12
    shown: ['<Formula label="Problem 2(a): the square of U"']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-dd
    kind: identity
    answer: p2a-dd
    where: 'Problem 2(a), answer box: against the sum over components with the metric diag(−1, 1, 1, 1)'
    formula: -x**2 + 25*t**2*x**2 + 2*t**2
    equals: (-1)*x*x + 1*(5*t*x)*(5*t*x) + 1*(sqrt(2)*t)*(sqrt(2)*t) + 1*0*0
    samples:
      t: [0, 0.5, 1, 2, 0.2]
      x: [1, 0.5, 1, -2, 3]
    tolerance: 1e-12
    shown: ['id="p2a-dd"', '\vec D\cdot\vec D = -x^2 + 25\,t^2x^2 + 2t^2']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-dd-example
    where: 'Problem 2(a), solution: D·D at t = 1, x = 1'
    formula: -1 + 25 + 2
    expected: '26'
    shown: ['it is $-1 + 25 + 2 = 26$']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  # v_x against the Lorentz factor: 1 − v_x² − v_y² must be 1/γ² with γ = U^t.
  - id: p2b-vx
    kind: identity
    answer: p2b-vx
    where: 'Problem 2(b), answer box v_x: against the value that the Lorentz factor γ = 1 + t² requires, given v_y'
    formula: t**2/(1 + t**2)
    equals: sqrt(1 - 1/(1 + t**2)**2 - (sqrt(2)*t/(1 + t**2))**2)
    samples:
      t: [0.3, 0.7, 1, 2, 5]
    tolerance: 1e-10
    shown: ['id="p2b-vx"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-vy
    kind: identity
    answer: p2b-vy
    where: 'Problem 2(b), answer box v_y: against the value that the Lorentz factor γ = 1 + t² requires, given v_x'
    formula: sqrt(2)*t/(1 + t**2)
    equals: sqrt(1 - 1/(1 + t**2)**2 - (t**2/(1 + t**2))**2)
    samples:
      t: [0.3, 0.7, 1, 2, 5]
    tolerance: 1e-10
    shown: ['id="p2b-vy"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  # Each component on its own: γ v_x must reproduce U^x, γ v_y must reproduce U^y.
  - id: p2b-vx-direct
    kind: identity
    where: 'Problem 2(b), formula "Problem 2(b): the spatial velocity": γ v_x = U^x'
    formula: (1 + t**2) * (t**2/(1 + t**2))
    equals: t**2
    samples:
      t: [0.3, 0.7, 1, 2, 5]
    tolerance: 1e-12
    shown: ['<Formula label="Problem 2(b): the spatial velocity"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-vy-direct
    kind: identity
    where: 'Problem 2(b), formula "Problem 2(b): the spatial velocity": γ v_y = U^y'
    formula: (1 + t**2) * (sqrt(2)*t/(1 + t**2))
    equals: sqrt(2)*t
    samples:
      t: [0.3, 0.7, 1, 2, 5]
    tolerance: 1e-12
    shown: ['<Formula label="Problem 2(b): the spatial velocity"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-speed
    kind: identity
    where: 'Problem 2(b), formula "Problem 2(b): the speed": the two forms'
    formula: (t**4 + 2*t**2)/(1 + t**2)**2
    equals: 1 - 1/(1 + t**2)**2
    samples:
      t: [0, 0.3, 1, 2, 5]
    tolerance: 1e-12
    shown: ['<Formula label="Problem 2(b): the speed"']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-example-vx
    where: 'Problem 2(b), check: v_x at t = 1'
    formula: 1**2/(1 + 1**2)
    expected: '0.5'
    shown: ['$\vec v = (0.5, 0.707, 0)$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-example-vy
    where: 'Problem 2(b), check: v_y at t = 1'
    formula: sqrt(2)*1/(1 + 1**2)
    expected: '0.707'
    shown: ['$\vec v = (0.5, 0.707, 0)$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-example-speed
    where: 'Problem 2(b), check: the speed at t = 1'
    formula: sqrt(0.5**2 + (sqrt(2)/2)**2)
    expected: '0.866'
    shown: ['speed $\sqrt{0.75} = 0.866$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-example-gamma
    where: 'Problem 2(b), check: the Lorentz factor for the speed √0.75, against U^t = 2 at t = 1'
    formula: 1/sqrt(1 - 0.75)
    expected: '2'
    shown: ['and $\gamma = 2$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2c-dtut
    kind: identity
    answer: p2c-dtut
    where: 'Problem 2(c), answer box: against a numerical derivative of U^t = 1 + t²'
    formula: 2*t
    equals: deriv('1 + s**2', 's', t)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
    tolerance: 1e-6
    shown: ['id="p2c-dtut"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2c-dtuy
    kind: identity
    where: 'Problem 2(c), formula "Problem 2(c): the derivatives of U": the y component against a numerical derivative'
    formula: sqrt(2)
    equals: deriv('sqrt(2)*s', 's', t)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 2(c): the derivatives of U"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  # The contraction U_α ∂_t U^α, with numerical derivatives; 1 is added on both sides so that the comparison is not with zero.
  - id: p2c-contraction
    kind: identity
    where: 'Problem 2(c), formula "Problem 2(c): the contraction": U_α ∂_t U^α = 0, with numerical derivatives'
    formula: 1 - (1 + t**2)*deriv('1 + s**2', 's', t) + t**2*deriv('s**2', 's', t) + sqrt(2)*t*deriv('sqrt(2)*s', 's', t)
    equals: 1
    samples:
      t: [0.3, 0.7, 1, 2, 3]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 2(c): the contraction"']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2d-div
    kind: identity
    answer: p2d-div
    where: 'Problem 2(d), answer box: against numerical derivatives of D^t = x, D^x = 5tx and D^y = √2 t'
    formula: 5*t
    equals: deriv('x + 0*s', 's', t) + deriv('5*t*s', 's', x) + deriv('sqrt(2)*t + 0*s', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2d-div"']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # (e): each component as the sum of the derivatives of the three products U^α D^t, U^α D^x, U^α D^y (D^z = 0), without the product rule.
  - id: p2e-t
    kind: identity
    answer: p2e-t
    where: 'Problem 2(e), answer box α = t: against numerical derivatives of the products U^t D^β'
    formula: 2*t*x + 5*t + 5*t**3
    equals: deriv('(1 + s**2)*x', 's', t) + deriv('(1 + t**2)*5*t*s', 's', x) + deriv('(1 + t**2)*sqrt(2)*t + 0*s', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2e-t"']
    source: {cite: mit, at: 'Problem 2(e) (our own solution)'}
    origin: page-own

  - id: p2e-x
    kind: identity
    answer: p2e-x
    where: 'Problem 2(e), answer box α = x: against numerical derivatives of the products U^x D^β'
    formula: 2*t*x + 5*t**3
    equals: deriv('s**2*x', 's', t) + deriv('t**2*5*t*s', 's', x) + deriv('t**2*sqrt(2)*t + 0*s', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2e-x"']
    source: {cite: mit, at: 'Problem 2(e) (our own solution)'}
    origin: page-own

  - id: p2e-y
    kind: identity
    answer: p2e-y
    where: 'Problem 2(e), answer box α = y: against numerical derivatives of the products U^y D^β'
    formula: sqrt(2)*x + 5*sqrt(2)*t**2
    equals: deriv('sqrt(2)*s*x', 's', t) + deriv('sqrt(2)*t*5*t*s', 's', x) + deriv('sqrt(2)*t*sqrt(2)*t + 0*s', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2e-y"']
    source: {cite: mit, at: 'Problem 2(e) (our own solution)'}
    origin: page-own

  # (f): U_α contracted with the numerical derivatives of (e), not with the page's closed forms.
  - id: p2f
    kind: identity
    answer: p2f
    where: 'Problem 2(f), answer box: U_α times the numerical derivatives of the products U^α D^β'
    formula: -5*t
    equals: >-
      -(1 + t**2)*(deriv('(1 + s**2)*x', 's', t) + deriv('(1 + t**2)*5*t*s', 's', x))
      + t**2*(deriv('s**2*x', 's', t) + deriv('t**2*5*t*s', 's', x))
      + sqrt(2)*t*(deriv('sqrt(2)*s*x', 's', t) + deriv('sqrt(2)*t*5*t*s', 's', x))
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
    tolerance: 1e-5
    shown: ['id="p2f"']
    source: {cite: mit, at: 'Problem 2(f) (our own solution)'}
    origin: page-own

  - id: p2f-direct
    kind: identity
    where: 'Problem 2(f), check: the three terms written out on the page add up to −5t'
    formula: (-2*t*x - 5*t - 10*t**3 - 2*t**3*x - 5*t**5) + (2*t**3*x + 5*t**5) + (2*t*x + 10*t**3)
    equals: -5*t
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
    tolerance: 1e-10
    shown: ['$-(1 + t^2)(2tx + 5t + 5t^3) = -2tx - 5t - 10t^3 - 2t^3x - 5t^5$', 'the $x$ term is $2t^3x + 5t^5$, and the $y$ term is $2tx + 10t^3$']
    source: {cite: mit, at: 'Problem 2(f) (our own solution)'}
    origin: page-own

  - id: p2g-up
    kind: identity
    answer: p2g-up
    where: 'Problem 2(g), answer box: η^tt = −1 times a numerical derivative of ρ with respect to t'
    formula: -2*t
    equals: (-1)*deriv('x**2 + s**2 - y**2', 's', t)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2g-up"']
    source: {cite: mit, at: 'Problem 2(g) (our own solution)'}
    origin: page-own

  - id: p2g-dx
    kind: identity
    where: 'Problem 2(g), formula "Problem 2(g): the gradient of ρ": the x component against a numerical derivative'
    formula: 2*x
    equals: deriv('s**2 + t**2 - y**2', 's', x)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 2(g): the gradient of ρ"']
    source: {cite: mit, at: 'Problem 2(g) (our own solution)'}
    origin: page-own

  - id: p2g-dy
    kind: identity
    where: 'Problem 2(g), formula "Problem 2(g): the gradient of ρ": the y component against a numerical derivative'
    formula: -2*y
    equals: deriv('x**2 + t**2 - s**2', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['<Formula label="Problem 2(g): the gradient of ρ"']
    source: {cite: mit, at: 'Problem 2(g) (our own solution)'}
    origin: page-own

  - id: p2g-square
    kind: identity
    where: 'Problem 2(g), check: the square of the gradient, lower times upper components'
    formula: (2*t)*(-2*t) + (2*x)*(2*x) + (-2*y)*(-2*y)
    equals: -4*t**2 + 4*x**2 + 4*y**2
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-12
    shown: ['$\partial_\alpha\rho\,\partial^\alpha\rho = -4t^2 + 4x^2 + 4y^2$']
    source: {cite: mit, at: 'Problem 2(g) (our own solution)'}
    origin: page-own

  - id: p2h-u
    kind: identity
    answer: p2h-u
    where: 'Problem 2(h), answer box: U^α times numerical derivatives of ρ'
    formula: 2*t*(1 + t**2) + 2*x*t**2 - 2*sqrt(2)*t*y
    equals: (1 + t**2)*deriv('x**2 + s**2 - y**2', 's', t) + t**2*deriv('s**2 + t**2 - y**2', 's', x) + sqrt(2)*t*deriv('x**2 + t**2 - s**2', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2h-u"', '<Formula label="Problem 2(h): the derivative of ρ along U"']
    source: {cite: mit, at: 'Problem 2(h) (our own solution)'}
    origin: page-own

  - id: p2h-d
    kind: identity
    answer: p2h-d
    where: 'Problem 2(h), answer box: D^α times numerical derivatives of ρ'
    formula: 2*t*x + 10*t*x**2 - 2*sqrt(2)*t*y
    equals: x*deriv('x**2 + s**2 - y**2', 's', t) + 5*t*x*deriv('s**2 + t**2 - y**2', 's', x) + sqrt(2)*t*deriv('x**2 + t**2 - s**2', 's', y)
    samples:
      t: [0.3, 0.7, 1, 2, 3]
      x: [1, -0.5, 2, 0.4, 3]
      y: [0.2, 1, -1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p2h-d"', '<Formula label="Problem 2(h): the derivative of ρ along D"']
    source: {cite: mit, at: 'Problem 2(h) (our own solution)'}
    origin: page-own

  # ---- Problem 3

  # The trace for a moving observer, U = (γ, γv, 0, 0) with v = 0.6: δ^α_α + U^α U_α = 4 − γ² + γ²v².
  - id: p3b-trace
    answer: p3b-trace
    where: 'Problem 3(b), answer box: the trace of δ + U U for U = (γ, γv, 0, 0) with v = 0.6'
    formula: 4 - 1/(1 - 0.6**2) + 0.6**2/(1 - 0.6**2)
    expected: '3'
    shown: ['id="p3b-trace"', 'P^\alpha{}_\alpha = \delta^\alpha{}_\alpha + U^\alpha U_\alpha = 4 - 1 = 3']
    source: {cite: mit, at: 'Problem 3(b) (our own addition)'}
    origin: page-own

  # Idempotence in components for the same moving observer: the t-t entry of P·P against that of P.
  # P^t_t = 1 − γ², P^t_x = γ²v, P^x_t = −γ²v, P^x_x = 1 + γ²v².
  - id: p3b-idempotent
    kind: identity
    where: 'Problem 3(b), formula "Problem 3(b): the tensor times itself": the t-t entry of P·P equals that of P, for U = (γ, γv, 0, 0)'
    formula: (1 - 1/(1 - v**2))**2 + (v/(1 - v**2))*(-v/(1 - v**2))
    equals: 1 - 1/(1 - v**2)
    samples:
      v: [0.1, 0.3, 0.6, 0.8, 0.95]
    tolerance: 1e-9
    shown: ['<Formula label="Problem 3(b): the tensor times itself"']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3d-null-product
    where: 'Problem 3(d), check: the product of ℓ = ½(1, −1, 0, 0) and q = (1, 1, 0, 0)'
    formula: 0.5*(-1*1 + (-1)*1)
    expected: '-1'
    shown: ['$\vec\ell\cdot\vec q = \tfrac12(-1 - 1) = -1$']
    source: {cite: mit, at: 'Problem 3(d) (our own example)'}
    origin: page-own

  # η + q ℓ + ℓ q with lowered components q_α = (−1, 1, 0, 0) and ℓ_α = (−½, −½, 0, 0): the t-t and x-x entries are 0 (given as 1 + entry = 1), the t-x entry too.
  - id: p3d-null-tt
    where: 'Problem 3(d), check: the t-t entry of η + qℓ + ℓq, plus 1'
    formula: 1 + (-1 + 2*(-1)*(-0.5))
    expected: '1'
    shown: ['works out to $\mathrm{diag}(0, 0, 1, 1)$']
    source: {cite: mit, at: 'Problem 3(d) (our own example)'}
    origin: page-own

  - id: p3d-null-xx
    where: 'Problem 3(d), check: the x-x entry of η + qℓ + ℓq, plus 1'
    formula: 1 + (1 + 2*(1)*(-0.5))
    expected: '1'
    shown: ['works out to $\mathrm{diag}(0, 0, 1, 1)$']
    source: {cite: mit, at: 'Problem 3(d) (our own example)'}
    origin: page-own

  - id: p3d-null-tx
    where: 'Problem 3(d), check: the t-x entry of η + qℓ + ℓq, plus 1'
    formula: 1 + ((-1)*(-0.5) + (-0.5)*(1))
    expected: '1'
    shown: ['works out to $\mathrm{diag}(0, 0, 1, 1)$']
    source: {cite: mit, at: 'Problem 3(d) (our own example)'}
    origin: page-own

  # ---- Problem 4

  # The angle against the exact y-x entry of the product of the four boosts, which tends to −v1 v2 for small speeds.
  - id: p4-angle
    kind: identity
    answer: p4-angle
    where: 'Problem 4(c), answer box: against minus the exact y-x entry of the product, at small speeds'
    formula: v1*v2
    equals: v1*v2/(sqrt(1 - v1**2)*sqrt(1 - v2**2))
    samples:
      v1: [0.001, 0.002, 0.0005, 0.003, 0.001]
