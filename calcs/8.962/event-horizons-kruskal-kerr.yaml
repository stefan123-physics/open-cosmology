# Calculations on content/year-5/8.962/event-horizons-kruskal-kerr.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Geometric units G = M = 1 (lengths in units of GM) unless stated.

page: content/year-5/8.962/event-horizons-kruskal-kerr.mdx
calcs:
  # ---------------------------------------------------------------- redshift
  - id: static-observer-norm
    kind: identity
    where: 'formula "Static observer": g_tt (U^t)^2 = -1 with U^t = 1/sqrt(1 - 2/r)'
    formula: -(1 - 2/r)*(1/sqrt(1 - 2/r))**2
    equals: '-1'
    samples: {r: [2.5, 4.0, 30.0]}
    tolerance: 1e-12
    shown: ['U^t = \frac{1}{\sqrt{1 - 2GM/r}}']
    source: {cite: reading1, at: 'transcript pp. 3–4'}
    origin: slip

  - id: redshift-ratio
    kind: identity
    where: 'formula "Redshift to infinity": E = -p_t U^t; ratio of E at infinity (U^t = 1) to E at r is sqrt(1 - 2/r) (p_t = -1)'
    formula: (1*1)/(1*(1/sqrt(1 - 2/r)))
    equals: sqrt(1 - 2/r)
    samples: {r: [2.5, 4.0, 30.0]}
    tolerance: 1e-12
    shown: ['\frac{E_\infty}{E_r} = \sqrt{1 - \frac{2GM}{r}}']
    source: {cite: reading1, at: 'transcript pp. 4–5'}
    origin: mit

  - id: quiz-r3
    where: 'quiz 1 and worked example: sqrt(1 - 2/3) = 0.577'
    inputs: {}
    formula: sqrt(1 - 2/3)
    expected: '0.577'
    shown: ['$\sqrt{1 - 2/3} = 0.577$', '\\sqrt{1/3} = 0.577$']
    quiz: 0
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-r3-interval
    where: 'worked example: one pulse every 1/0.577 = 1.73 s; quiz explanation 1.73'
    inputs: {}
    formula: 1/sqrt(1 - 2/3)
    expected: '1.73'
    shown: ['one every $1/0.577 = 1.73$ s', 'by the inverse factor, 1.73']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex-r21
    where: 'worked example: sqrt(1 - 2/2.1) = 0.218'
    inputs: {}
    formula: sqrt(1 - 2/2.1)
    expected: '0.218'
    shown: ['$\sqrt{1 - 2/2.1} = 0.218$: 21.8% of the energy']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex-r21-interval
    where: 'worked example: one pulse every 4.58 s'
    inputs: {}
    formula: 1/sqrt(1 - 2/2.1)
    expected: '4.58'
    shown: ['one pulse every 4.58 s']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex-r201
    where: 'worked example: sqrt(1 - 2/2.01) = 0.0705, i.e. 7%'
    inputs: {}
    formula: sqrt(1 - 2/2.01)
    expected: '0.0705'
    shown: ['$\sqrt{1 - 2/2.01} = 0.0705$: 7% of the energy']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex-r201-interval
    where: 'worked example: one pulse every 14.2 s'
    inputs: {}
    formula: 1/sqrt(1 - 2/2.01)
    expected: '14.2'
    shown: ['one pulse every 14.2 s']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: ex-r3-percent
    where: 'worked example: 57.7% of its energy'
    inputs: {}
    formula: 100*sqrt(1 - 2/3)
    expected: '57.7'
    shown: ['each pulse arrives with 57.7% of its energy']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  # ---------------------------------------------------------------- null rays and tortoise
  - id: radial-null
    kind: identity
    where: 'formula "Radial null rays": ds^2 = 0 with dt = dr/(1 - 2/r) (plus 1)'
    formula: 1 - (1 - 2/r)*(dr/(1 - 2/r))**2 + dr**2/(1 - 2/r)
    equals: '1'
    samples: {r: [2.5, 4.0, 30.0], dr: [0.1, 1.0, 0.01]}
    tolerance: 1e-12
    shown: ['\frac{dt}{dr} = \pm\frac{1}{1 - 2GM/r}']
    source: {cite: reading1, at: 'transcript p. 6'}
    origin: mit

  - id: tortoise-derivative
    kind: identity
    where: 'formula "Tortoise coordinate": dr*/dr = 1/(1 - 2/r)'
    formula: deriv('x + 2*log(x/2 - 1)', 'x', r, 1)
    equals: 1/(1 - 2/r)
    samples: {r: [2.5, 4.0, 30.0]}
    tolerance: 1e-7
    shown: ['r_* = r + 2GM\ln\left(\frac{r}{2GM} - 1\right)']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: mit

  - id: tortoise-201
    where: 'plot caption: r* = -8.59 GM at r = 2.01 GM'
    inputs: {}
    formula: 2.01 + 2*log(2.01/2 - 1)
    expected: '-8.59'
    shown: ['r* = −8.59GM at r = 2.01GM']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: tortoise-10
    where: 'plot caption: r* = 12.8 GM at r = 10 GM'
    inputs: {}
    formula: 10 + 2*log(10/2 - 1)
    expected: '12.8'
    shown: ['r* = 12.8GM at r = 10GM']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  - id: tortoise-4
    where: 'plot point and caption: r* = r at r = 4 GM'
    inputs: {}
    formula: 4 + 2*log(4/2 - 1)
    expected: '4'
    shown: ['{ x: 4, y: 4, label: "r* = r at r = 4GM" }', 'It equals r at r = 4GM']
    source: {cite: reading1, at: 'transcript p. 7'}
    origin: page-own

  # ---------------------------------------------------------------- Eddington-Finkelstein
  - id: ef-metric
    kind: identity
    where: 'formula "Ingoing Eddington-Finkelstein metric": with dt = dv - dr/(1 - 2/r), -(1 - 2/r) dt^2 + dr^2/(1 - 2/r) = -(1 - 2/r) dv^2 + 2 dv dr (plus 5)'
    formula: 5 - (1 - 2/r)*(dv - dr/(1 - 2/r))**2 + dr**2/(1 - 2/r)
    equals: 5 - (1 - 2/r)*dv**2 + 2*dv*dr
    samples: {r: [2.5, 4.0, 30.0], dv: [0.3, -1.0, 2.0], dr: [0.1, 0.7, -0.4]}
    tolerance: 1e-10
    shown: ['ds^2 = -\left(1 - \frac{2GM}{r}\right)dv^2 + 2\,dv\,dr']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: mit

  - id: ef-outgoing
    kind: identity
    where: 'formula "Radial light in (v, r)": dv/dr = 2/(1 - 2/r) makes -(1 - 2/r) dv^2 + 2 dv dr vanish (dr = 1; plus 1); valid inside and outside'
    formula: 1 - (1 - 2/r)*(2/(1 - 2/r))**2 + 2*(2/(1 - 2/r))
    equals: '1'
    samples: {r: [1.0, 2.5, 30.0]}
    tolerance: 1e-10
    shown: ['\frac{dv}{dr} = \frac{2}{1 - 2GM/r} \ \ \text{(outgoing)}']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  # ---------------------------------------------------------------- Kruskal
  - id: kruskal-hyperbola
    kind: identity
    where: 'formula "Inverse relations": T^2 - R^2 = (1 - r/2) e^(r/2) from the exterior T, R (GM = 1)'
    formula: (sqrt(r/2 - 1)*exp(r/4))**2*(sinh(t/4)**2 - cosh(t/4)**2)
    equals: (1 - r/2)*exp(r/2)
    samples: {r: [2.5, 4.0, 10.0], t: [0.0, 3.0, -5.0]}
    tolerance: 1e-10
    shown: ['T^2 - R^2 = \left(1 - \frac{r}{2GM}\right)e^{r/2GM}']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  - id: kruskal-from-null
    kind: identity
    where: 'formula "Kruskal-Szekeres coordinates": T = (e^(v/4) - e^(-u/4))/2 equals sqrt(r/2 - 1) e^(r/4) sinh(t/4) with v = t + r*, u = t - r*'
    formula: (exp((t + r + 2*log(r/2 - 1))/4) - exp(-(t - r - 2*log(r/2 - 1))/4))/2
    equals: sqrt(r/2 - 1)*exp(r/4)*sinh(t/4)
    samples: {r: [2.5, 4.0, 10.0], t: [0.5, 3.0, -5.0]}
    tolerance: 1e-10
    shown: ['T = \sqrt{\frac{r}{2GM} - 1}\;e^{r/4GM}\sinh\frac{t}{4GM}']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  - id: kruskal-metric-tt
    kind: identity
    where: 'formula "Kruskal-Szekeres metric": for a step in t alone, (32/r) e^(-r/2) (-dT^2 + dR^2) = -(1 - 2/r) dt^2 (dt = 1, GM = 1)'
    formula: (32/r)*exp(-r/2)*(-(sqrt(r/2 - 1)*exp(r/4)*cosh(t/4)/4)**2 + (sqrt(r/2 - 1)*exp(r/4)*sinh(t/4)/4)**2)
    equals: -(1 - 2/r)
    samples: {r: [2.5, 4.0, 10.0], t: [0.5, 3.0, -5.0]}
    tolerance: 1e-10
    shown: ['ds^2 = \frac{32\,G^3M^3}{r}\,e^{-r/2GM}\left(-dT^2 + dR^2\right)']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  - id: kruskal-singularity
    where: 'r = 0 is the hyperbola T^2 - R^2 = (1 - 0) e^0 = 1'
    inputs: {}
    formula: (1 - 0/2)*exp(0/2)
    expected: '1'
    shown: ['The singularity $r = 0$ is the hyperbola $T^2 - R^2 = 1$']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: page-own

  # ---------------------------------------------------------------- charged and spinning
  - id: rn-horizons
    kind: identity
    where: 'formula "Its horizons": Delta(r+-) = 1 - 2/r + q2/r^2 = 0 at r = 1 +- sqrt(1 - q2) (G = M = 1, q2 = Q^2; plus 1)'
    formula: 2 - 2/(1 + s*sqrt(1 - q2)) + q2/(1 + s*sqrt(1 - q2))**2
    equals: '1'
    samples: {q2: [0.25, 0.5, 0.9], s: [1, -1, 1]}
    tolerance: 1e-10
    shown: ['r_\pm = GM \pm \sqrt{G^2M^2 - GQ^2}']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: kerr-horizon
    kind: identity
    where: 'formula "Kerr horizon": Delta = r^2 - 2r + a^2 vanishes at r+ = 1 + sqrt(1 - a^2) (plus 1)'
    formula: 1 + (1 + sqrt(1 - a**2))**2 - 2*(1 + sqrt(1 - a**2)) + a**2
    equals: '1'
    samples: {a: [0.0, 0.5, 0.9]}
    tolerance: 1e-10
    shown: ['r_+ = GM + \sqrt{G^2M^2 - a^2}, \qquad a = \frac{J}{M}']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: kerr-schwarzschild-limit
    kind: identity
    where: 'Kerr metric with a = 0: g_tt = -(1 - 2r/rho^2) with rho^2 = r^2 reduces to -(1 - 2/r); g_rr = rho^2/Delta = r^2/(r^2 - 2r) = 1/(1 - 2/r)'
    formula: 10 - (1 - 2*r/(r**2 + 0**2*cos(th)**2)) + (r**2 + 0)/(r**2 - 2*r + 0)
    equals: 10 - (1 - 2/r) + 1/(1 - 2/r)
    samples: {r: [2.5, 4.0, 30.0], th: [0.3, 1.2, 2.0]}
    tolerance: 1e-10
    shown: ['\Delta = r^2 - 2GMr + a^2, \qquad \rho^2 = r^2 + a^2\cos^2\theta']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: kerr-09
    where: 'quiz 3 and plot: r+ = 1 + sqrt(1 - 0.81) = 1.436 GM (1.44 in the quiz)'
    inputs: {}
    formula: 1 + sqrt(1 - 0.9**2)
    expected: '1.436'
    shown: ['r₊ = 1.436GM at a = 0.9GM', '{ x: 0.9, y: 1.436, label: "a = 0.9GM" }']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: kerr-09-quiz
    where: 'quiz 3: GM(1 + sqrt(0.19)) = 1.44 GM'
    inputs: {}
    formula: 1 + sqrt(0.19)
    expected: '1.44'
    shown: ['GM(1 + \\sqrt{0.19}) = 1.44\\,GM$']
    quiz: 2
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: page-own

  - id: kerr-gtphi-factor
    kind: identity
    where: 'line-element coefficient of dt dphi is 2 g_tphi = -4 GMar sin^2/rho^2'
    formula: 2*(-2*a*r*sin(th)**2/(r**2 + a**2*cos(th)**2))
    equals: -4*a*r*sin(th)**2/(r**2 + a**2*cos(th)**2)
    samples: {a: [0.3, 0.9, 0.5], r: [2.0, 5.0, 3.0], th: [0.4, 1.2, 2.0]}
    tolerance: 1e-12
    shown: ['$g_{t\phi} = -2GMar\sin^2\theta/\rho^2$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: kerr-1963
    kind: fact
    where: 'Kerr found the metric in 1963 (later fact, corrects the PhD remark)'
    shown: ['the spacetime Roy Kerr found in 1963', 'found the metric in 1963, at the University of Texas']
    source: {ref: 'R. P. Kerr, Phys. Rev. Lett. 11, 237 (1963)'}
    origin: later-data

  - id: kerr-tests-2020
    kind: fact
    where: 'as of 2020 the Kerr metric has passed every test'
    shown: ['the metric has passed every test so far (as of 2020)']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: mit
