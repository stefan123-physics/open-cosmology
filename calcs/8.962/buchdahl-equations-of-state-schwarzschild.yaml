  # ---------------------------------------------------------------- infall
  - id: cycloid-proper-time
    kind: identity
    where: 'formula "Radial infall in proper time": r = (r0/2)(1 + cos eta), tau = sqrt(r0^3/8M)(eta + sin eta) satisfies (dr/dtau)^2 = 2M/r - 2M/r0 (G = 1, M = 1, r0 = 10)'
    formula: (deriv('5*(1 + cos(x))', 'x', e, 1)/deriv('sqrt(125)*(x + sin(x))', 'x', e, 1))**2
    equals: 2/(5*(1 + cos(e))) - 2/10
    samples: {e: [0.3, 1.0, 2.5]}
    tolerance: 1e-6
    shown: ['r = \frac{r_0}{2}\left(1 + \cos\eta\right), \qquad \tau = \sqrt{\frac{r_0^3}{8GM}}\left(\eta + \sin\eta\right)']
    source: {cite: reading1, at: 'transcript pp. 15–16'}
    origin: mit

  - id: coordinate-time-infall
    kind: identity
    where: 'formula "Radial infall in Schwarzschild time": dt/deta = [sqrt(1 - 2M/r0)/(1 - 2M/r)] dtau/deta (G = M = 1, r0 = 10)'
    formula: deriv('2*log(abs((2 + tan(x/2))/(2 - tan(x/2)))) + 4*(x + 2.5*(x + sin(x)))', 'x', e, 1)
    equals: sqrt(0.8)/(1 - 2/(5*(1 + cos(e))))*sqrt(125)*(1 + cos(e))
    samples: {e: [0.3, 1.0, 2.0]}
    tolerance: 1e-6
    shown: ['\frac{t}{2GM} = \ln\left|']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

