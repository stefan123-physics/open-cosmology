  - id: polytrope-first-law
    kind: identity
    where: 'formula "First law per particle": -P d(1/rho0) = K rho0^(Gamma - 2) d rho0 for P = K rho0^Gamma'
    formula: -K*r0**G*deriv('1/x', 'x', r0, 1)
    equals: K*r0**(G - 2)
    samples: {K: [0.5, 2.0, 1.0], r0: [0.3, 1.5, 4.0], G: [1.5, 2.0, 1.3333]}
    tolerance: 1e-7
    shown: ['= K\rho_0^{\Gamma - 2}\,d\rho_0']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: polytrope-energy-density
    kind: identity
    where: 'formula "Energy density of a polytrope": rho = rho0 + P/(Gamma - 1) satisfies d(rho/rho0)/d rho0 = K rho0^(Gamma-2)'
    formula: deriv('(x + K*x**G/(G - 1))/x', 'x', r0, 1)
    equals: K*r0**(G - 2)
    samples: {K: [0.5, 2.0, 1.0], r0: [0.3, 1.5, 4.0], G: [1.5, 2.0, 1.3333]}
    tolerance: 1e-6
    shown: ['\rho = \rho_0 + \frac{P}{\Gamma - 1}']
    source: {cite: reading1, at: 'transcript pp. 8–9'}
    origin: mit

