  - id: tube-area
    kind: identity
    where: 'formula "Area of the world tube": integral of sqrt(-g_tt g_phiphi) over phi and t = 2 pi r sqrt(1 - 2GM/r) Delta t (GM = 1)'
    formula: 2*pi*sqrt((1 - 2/r)*r**2)*dt
    equals: 2*pi*r*sqrt(1 - 2/r)*dt
    samples: {r: [2.5, 4.0, 10.0], dt: [1.0, 3.0, 0.5]}
    tolerance: 1e-12
    shown: ['= 2\pi r\sqrt{1 - \frac{2GM}{r}}\;\Delta t']
    source: {cite: reading1, at: 'transcript pp. 13–14'}
    origin: mit

