page: content/year-5/8.962/buchdahl-equations-of-state-schwarzschild.mdx
calcs:
  # ---------------------------------------------------------------- constant-density star (G = 1)
  - id: tov-constant-density
    kind: identity
    where: 'formula "TOV for constant density": with m = (4/3) pi rho r^3, (rho + P) G(m + 4 pi r^3 P)/(r(r - 2Gm)) = (4 pi/3) r (rho + P)(rho + 3P)/(1 - 8 pi rho r^2/3)'
    formula: (rho + P)*((4/3)*pi*rho*r**3 + 4*pi*r**3*P)/(r*(r - 2*(4/3)*pi*rho*r**3))
    equals: (4*pi/3)*r*(rho + P)*(rho + 3*P)/(1 - 8*pi*rho*r**2/3)
    samples: {rho: [0.01, 0.05, 0.002], P: [0.001, 0.02, 0.0005], r: [1.0, 0.8, 3.0]}
    tolerance: 1e-10
    shown: ['\frac{dP}{dr} = -\frac{4\pi G}{3}\,r\,\frac{(\rho + P)(\rho + 3P)}{1 - 8\pi G\rho r^2/3}']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: mit

  - id: profile-solves-tov
    kind: identity
    where: 'formula "Pressure profile of a uniform star": P = rho (1 - y)/(3y - 1) with y = Q/sqrt(1 - 8 pi rho r^2/3), Q = (rho + Pc)/(rho + 3Pc), satisfies the constant-density TOV equation (numerical derivative; rho = 0.01, Pc = 0.002, G = 1)'
    formula: deriv('0.01*(1 - ((0.012/0.016)/sqrt(1 - 8*pi*0.01*x**2/3)))/(3*((0.012/0.016)/sqrt(1 - 8*pi*0.01*x**2/3)) - 1)', 'x', r, 1)
    equals: -(4*pi/3)*r*(0.01 + 0.01*(1 - ((0.012/0.016)/sqrt(1 - 8*pi*0.01*r**2/3)))/(3*((0.012/0.016)/sqrt(1 - 8*pi*0.01*r**2/3)) - 1))*(0.01 + 3*0.01*(1 - ((0.012/0.016)/sqrt(1 - 8*pi*0.01*r**2/3)))/(3*((0.012/0.016)/sqrt(1 - 8*pi*0.01*r**2/3)) - 1))/(1 - 8*pi*0.01*r**2/3)
    samples: {r: [0.5, 1.5, 2.5]}
    tolerance: 1e-6
    shown: ['\frac{\rho + P}{\rho + 3P} = \frac{\rho + P_c}{\rho + 3P_c}\,\frac{1}{\sqrt{1 - 8\pi G\rho r^2/3}}']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: mit

  - id: central-pressure-formula
    kind: identity
    where: 'formula "Central pressure and radius": P = 0 at the surface with 8 pi rho R^2/3 = 2GM/R gives (rho + Pc)/(rho + 3Pc) = sqrt(1 - 2GM/R); checked with Pc from the formula'
    formula: (rho + rho*(1 - sqrt(1 - u))/(3*sqrt(1 - u) - 1))/(rho + 3*rho*(1 - sqrt(1 - u))/(3*sqrt(1 - u) - 1))
    equals: sqrt(1 - u)
    samples: {rho: [0.01, 1.0, 5.0], u: [0.1, 0.4, 0.8]}
    tolerance: 1e-10
    shown: ['P_c = \rho\,\frac{1 - \sqrt{1 - 2GM/r_\star}}{3\sqrt{1 - 2GM/r_\star} - 1}']
    source: {cite: reading1, at: 'transcript pp. 3–4'}
    origin: mit

  - id: buchdahl-four-ninths
    where: 'formula "Maximum compactness": 3 sqrt(1 - 2C) = 1 gives C = 4/9'
    inputs: {}
    formula: solve('3*sqrt(1 - 2*x) - 1', 'x', 0.1, 0.49)
    expected: '0.4444'
    shown: ['\frac{GM}{r_\star} = \frac{4}{9}', 'as C approaches 4/9 = 0.444']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: mit

  - id: plot-pc-01
    where: 'plot caption: P_c = 0.063 rho at C = 0.1'
    inputs: {}
    formula: (1 - sqrt(0.8))/(3*sqrt(0.8) - 1)
    expected: '0.063'
    shown: ['only 0.063ρ']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: page-own

  - id: plot-pc-03
