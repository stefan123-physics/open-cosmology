# Calculations on content/year-5/8.962/einstein-field-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 12 transcript; page numbers are the PDF pages of the transcript.
# Derivation checks (trace of the Einstein tensor, the static-fluid algebra, kappa = 8 pi G) are identities at
# sample points; the page's own examples (water, the Earth) and the G, c conversions are recomputed with units.

page: content/year-5/8.962/einstein-field-equation.mdx
calcs:
  # ---------------------------------------------------------------- derivation checks
  - id: einstein-trace
    kind: identity
    where: 'formula "Trace of the Einstein tensor": R - (1/2) 4 R = -R (with delta^mu_mu = 4)'
    formula: RR - 0.5*4*RR
    equals: -RR
    samples: {RR: [0.3, -2.0, 7.5]}
    tolerance: 1e-12
    shown: ['tex="G \equiv g^{\mu\nu} G_{\mu\nu} = R - \frac{1}{2}\cdot 4\,R = -R"']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit

  - id: trace-reverse
    kind: identity
    where: 'worked example "Checking the trace-reversed form": R_mn = G_mn + (1/2) g_mn R with R = -kappa T gives kappa (T_mn - (1/2) g_mn T); checked for one component with sample numbers'
    formula: kap*Tmn + 0.5*gmn*(-kap*Tt)
    equals: kap*(Tmn - 0.5*gmn*Tt)
    samples: {kap: [1.0, 3.2, 0.5], Tmn: [0.7, -1.1, 2.0], gmn: [-1.0, 1.0, 0.4], Tt: [-0.9, 2.5, 1.3]}
    tolerance: 1e-12
    shown: ['$R_{\mu\nu} = G_{\mu\nu} + \frac12 g_{\mu\nu}R = \kappa T_{\mu\nu} - \frac12 g_{\mu\nu}\kappa T$']
    source: {cite: reading1, at: 'transcript p. 13'}
    origin: page-own

  - id: u0-normalisation
    kind: identity
    where: 'formula "Four-velocity of the static fluid": g00 (u^0)^2 = -1 with g00 = -1 + h and u^0 = 1 + h/2 holds to first order in h (checked at small h: the error is of order h^2)'
    formula: (-1 + hh)*(1 + hh/2)**2
    equals: '-1'
    samples: {hh: [1e-5, -2e-5, 3e-6]}
    tolerance: 1e-9
    shown: ['tex="u^0 = 1 + \frac{1}{2} h_{00}, \qquad u_0 = -\left(1 - \frac{1}{2} h_{00}\right)"']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: u0-lowered
    kind: identity
    where: 'u_0 = g00 u^0 = (-1 + h)(1 + h/2) = -(1 - h/2) + O(h^2) (the sign of the correction differs from the board, noted on the page)'
    formula: (-1 + hh)*(1 + hh/2)
    equals: -(1 - hh/2)
    samples: {hh: [1e-5, -2e-5, 3e-6]}
    tolerance: 1e-9
    shown: ['the first-order correction should have the opposite sign, as written here']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: slip

  - id: rhs-00
    kind: identity
    where: 'formula "Right-hand side, 00 component": with T00 = rho (1 - h) and T = g^00 T00 = T00 / g00, T00 - (1/2) g00 T = (1/2) rho (1 - h), i.e. rho/2 plus a term of order rho h'
    formula: rho*(1 - hh) - 0.5*(-1 + hh)*(rho*(1 - hh)/(-1 + hh))
    equals: 0.5*rho*(1 - hh)
    samples: {rho: [1.0, 2.5, 0.1], hh: [0.01, -0.003, 0.2]}
    tolerance: 1e-12
    shown: ['tex="T_{00} - \frac{1}{2} g_{00} T = \frac{1}{2}\rho + O(\rho\,h)"']
    source: {cite: reading1, at: 'transcript p. 14'}
    origin: mit

  - id: kappa-8piG
    kind: identity
    where: 'section "Fixing the constant": -(1/2) lap h00 = (1/2) kappa rho with h00 = -2 Phi gives lap Phi = kappa rho / 2, which is 4 pi G rho for kappa = 8 pi G'
    formula: (8*pi*Gn)*rho/2
    equals: 4*pi*Gn*rho
    samples: {Gn: [1.0, 6.674e-11, 0.3], rho: [1.0, 1000.0, 5.5]}
    tolerance: 1e-12
    shown: ['tex="G_{\mu\nu} = 8\pi G\,T_{\mu\nu}" cite="reading1" at="transcript p. 15"']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: lambda-fluid
    kind: identity
    where: 'formula "The cosmological constant as stress-energy": in a local Lorentz frame T00 = -(Lambda/8 pi G) eta00 = Lambda/8 pi G = rho and T11 = -(Lambda/8 pi G) eta11 = P = -rho'
    formula: -(lam/(8*pi*Gn))*(-1) + (-(lam/(8*pi*Gn))*1)
    equals: '0'
    samples: {lam: [1.0, 2e-52, 0.37], Gn: [1.0, 6.674e-11, 2.0]}
    tolerance: 1e-12
    shown: ['tex="T^{(\Lambda)}_{\mu\nu} = -\frac{\Lambda}{8\pi G}\,g_{\mu\nu}, \qquad \rho = \frac{\Lambda}{8\pi G}, \qquad P = -\frac{\Lambda}{8\pi G}"']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: mit

  # ---------------------------------------------------------------- units: G and c as conversion factors
  - id: sun-length
    where: 'formula "Mass as a length and as a time"; flashcard 6; summary'
    inputs: {}
    formula: G*M_sun/c**2
    expected: 1.477 km
    shown: ['\frac{GM_\odot}{c^2} \approx 1.477\ \text{km}', '$GM_\odot/c^2 \approx 1.477$ km.', '$GM_\\odot/c^2 \\approx 1.477$ km (mass to length)']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: mit

  - id: sun-time
    where: 'formula "Mass as a length and as a time"; flashcard 6'
    inputs: {}
    formula: G*M_sun/c**3
    expected: 4.925e-6 s
    shown: ['\frac{GM_\odot}{c^3} \approx 4.925\times10^{-6}\ \text{s}', '$GM_\\odot/c^3 \\approx 4.925\\ \\mu$s']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: mit

  - id: hughes-truncated
    kind: fact
    where: 'bracket after "Mass as a length and as a time": the values Hughes says aloud, 1.47 km and 4.92e-6 s (1.4766 km and 4.9255e-6 s cut off)'
    shown: ['[Hughes quotes 1.47 km and $4.92\times10^{-6}$ s']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: slip

  - id: G-codata
    where: 'section "Units": the 2018 CODATA value of G'
    inputs: {}
    formula: G
    expected: 6.67430e-11 m**3/(kg*s**2)
    shown: ['$6.67430\times10^{-11}$ in SI units']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: later-data

  - id: G-uncertainty
    kind: fact
    where: 'section "Units": relative uncertainty of G in CODATA 2018 (2.2e-5), against Hughes''s recollection of five or six digits'
    shown: ['has a relative uncertainty of about $2\times10^{-5}$, so closer to four or five', 'Hughes recalls five or six digits']
    source: {ref: 'CODATA 2018 recommended values (Tiesinga et al., Rev. Mod. Phys. 93, 025010, 2021): G = 6.67430(15) × 10⁻¹¹ m³ kg⁻¹ s⁻², relative standard uncertainty 2.2 × 10⁻⁵'}
    origin: later-data

  - id: GM-sun-digits
    kind: fact
    where: 'section "Units": GM of the Sun known to nine or ten digits (Hughes)'
    shown: ['for the Sun to some nine or ten digits']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: mit

  - id: dates
    kind: fact
    where: 'section "Einstein''s route": special relativity 1905, field equation 1915, six or seven weeks of this course; intro; supernovae 1998 in the callout'
    shown: ['published in 1915', 'Special relativity dates from 1905', 'in six or seven weeks', 'Einstein himself took in 1915', 'revealed it in 1998']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: mit

  - id: lambda-era
    kind: fact
    where: 'section "Einstein''s route": the cosmological constant became relevant in the 15 or 20 years before the 2020 lecture'
    shown: ['in the 15 or 20 years before this 2020 lecture']
    source: {cite: reading1, at: 'transcript p. 17'}
    origin: mit

  # ---------------------------------------------------------------- worked example: water and the Earth; quiz 4
  - id: c-squared
    where: 'worked example "How much curvature does a glass of water make?" and quiz 4: c^2'
    inputs: {}
    formula: c**2
    expected: 8.988e16 m**2/s**2
    shown: ['8\pi \times 6.674\times10^{-11} \times 1000 / (8.988\times10^{16}) \approx 1.87\times10^{-23}\ \text{m}^{-2}$.']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: water-curvature
    where: 'worked example step "Curvature": 8 pi G rho / c^2 for water'
    inputs: {rho: 1000 kg/m**3}
    formula: 8*pi*G*rho/c**2
    expected: 1.87e-23 1/m**2
    shown: ['\approx 1.87\times10^{-23}\ \text{m}^{-2}$.', '$(1.87\times10^{-23})^{-1/2}']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: water-curvature-quiz
    where: 'quiz 4: the same curvature, rounded to 1.9e-23 in the choices; explanation 1.87e-23'
    inputs: {rho: 1000 kg/m**3}
    formula: 8*pi*G*rho/c**2
    expected: 1.9e-23 1/m**2
    quiz: 3
    shown: ['\\approx 1.87\\times10^{-23}\\ \\text{m}^{-2}$, a radius']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: water-radius
    where: 'worked example step "Radius of curvature"; quiz 4 explanation'
    inputs: {rho: 1000 kg/m**3}
    formula: (8*pi*G*rho/c**2)**-0.5
    expected: 2.3e11 m
    shown: ['\approx 2.3\times10^{11}$ m, about', 'of about $2.3\\times10^{11}$ m']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: water-radius-au
    where: 'worked example step "Radius of curvature": about one and a half times the Earth-Sun distance'
    inputs: {rho: 1000 kg/m**3}
    formula: (8*pi*G*rho/c**2)**-0.5 / au
    expected: '1.5'
    tolerance: 0.1
    shown: ['about one and a half times the Earth–Sun distance']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own

  - id: earth-length
    where: 'worked example step "The Earth as a length"'
    inputs: {M_e: 5.97e24 kg}
    formula: G*M_e/c**2
    expected: 4.43 mm
    shown: ['\approx 4.43$ mm', '$M_\oplus = 5.97\times10^{24}$ kg']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: earth-potential
    where: 'worked example step "The Earth as a length": GM/(R c^2) at the surface, R = 6371 km'
    inputs: {M_e: 5.97e24 kg, R_e: 6371 km}
    formula: G*M_e/(R_e*c**2)
    expected: 7e-10
    shown: ['radius of 6371 km this is $7\times10^{-10}$']
    source: {cite: reading1, at: 'transcript p. 18'}
    origin: page-own

  - id: water-ball
    kind: identity
    where: 'worked example step "Radius of curvature": a ball of density rho and radius R = (8 pi G rho/c^2)^(-1/2) has 2GM/(R c^2) = (8 pi G rho/3c^2) R^2 = 1/3'
    formula: 2*Gn*(4/3*pi*RR**3*rho)/(RR*cc**2)
    equals: (1/3)*(8*pi*Gn*rho/cc**2)*RR**2
    samples: {Gn: [6.674e-11, 1.0], rho: [1000.0, 2.0], RR: [2.3e11, 0.7], cc: [2.998e8, 1.0]}
    tolerance: 1e-12
    shown: ['equal to exactly a third of its radius']
    source: {cite: reading1, at: 'transcript p. 19'}
    origin: page-own
