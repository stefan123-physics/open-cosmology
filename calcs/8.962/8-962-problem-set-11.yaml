# Calculations on content/year-5/8.962/8-962-problem-set-11.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# numerical derivatives of the parametric solution (Problem 1(a)), the proper-time integral done numerically (1(d), 1(e)),
# the areal radius of the light ray (1(f)), numerical derivatives of the potential of the uniform cluster and of the
# Schwarzschild exterior (Problem 2), a numerical integral of dΦ/dr (2(d)), root finding on the effective potential
# (Problem 3(b)), and a second form of the orbit integral (3(c)).
# Problem 1 and 2: c = 1, G kept. Problem 3: GM = 1 (lengths and times in units of GM), except the units of 3(a).
# The numerical orbit integrations of Problem 3 (SciPy solve_ivp, RK45, rtol = atol = 1e-12, on the second-order
# equation of 3(a)) were run outside this file while writing; their results are the `kind: fact` entries, and where
# a result can be found another way (turning points, the advance), that other way is checked here.
# Short names in the samples: Rstar = R*, R0 = R_0, eta = the cycloid parameter, E = Ê; in Problem 2, M and R are the
# mass and radius of the uniform cluster, r the radius of the orbit, m = M r³/R³, Phi = Φ(r) of the uniform cluster,
# rho = 3M/(4πR³); q is the variable of a numerical derivative, integral or root.

page: content/year-5/8.962/8-962-problem-set-11.mdx
calcs:
  # ---- Problem 1(a): the closed dust solution

  - id: p1a-rho0
    kind: identity
    answer: p1a-rho0
    where: 'Problem 1(a), answer box: ρ0 = 3/(8πG R0²) against ρ0 = 3a/(8πG) (ȧ² + 1/R0²), the first Friedmann equation solved for ρ0, with ȧ from numerical derivatives of the parametric a(η) and τ(η)'
    formula: 3/(8*pi*G*R0**2)
    equals: 3*(1 + cos(eta))/2/(8*pi*G)*((deriv('(1 + cos(q))/2', 'q', eta)/deriv('R0/2*(q + sin(q))', 'q', eta))**2 + 1/R0**2)
    samples:
      G: [1, 0.7, 1.5, 1.2]
      R0: [3, 7.9, 1.5, 12]
      eta: [0.3, 1.1, 2.0, 2.9]
    tolerance: 1e-6
    shown: ['id="p1a-rho0"', '\qquad\Longleftrightarrow\qquad \rho_0 = \frac{3}{8\pi G R_0^2}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-lhs
    kind: identity
    where: 'Problem 1(a), solution: ȧ² = sin²η/(4R0²a²) = (1 − a)/(R0² a), with a = (1 + cos η)/2'
    formula: sin(eta)**2/(4*R0**2*((1 + cos(eta))/2)**2)
    equals: (1 - (1 + cos(eta))/2)/(R0**2*(1 + cos(eta))/2)
    samples:
      R0: [3, 7.9, 1.5, 12]
      eta: [0.3, 1.1, 2.0, 2.9]
    tolerance: 1e-12
    shown: ['\dot a^2 = \frac{\sin^2\eta}{4R_0^2a^2} = \frac{1 - a}{R_0^2\,a} = \frac{1}{R_0^2\,a} - \frac{1}{R_0^2}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-f2
    kind: identity
    where: 'Problem 1(a), solution: ä = −1/(2R0²a²) (numerical derivative of ȧ = −tan(η/2)/R0 over dτ/dη) equals −(4πG/3) ρ a with ρ = ρ0/a³ and ρ0 = 3/(8πG R0²)'
    formula: deriv('-tan(q/2)/R0', 'q', eta)/(R0*(1 + cos(eta))/2)
    equals: -4*pi*G/3*(3/(8*pi*G*R0**2))/((1 + cos(eta))/2)**2
    samples:
      G: [1, 0.7, 1.5, 1.2]
      R0: [3, 7.9, 1.5, 12]
      eta: [0.3, 1.1, 2.0, 2.9]
    tolerance: 1e-6
    shown: ['\ddot a = \frac{d\dot a/d\eta}{d\tau/d\eta} = -\frac{1}{2R_0 a}\cdot\frac{1}{R_0 a} = -\frac{1}{2R_0^2a^2}']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  # ---- Problem 1(c), (d), (e): the surface from outside

  - id: p1c-turn
    kind: identity
    answer: p1c-turn
    where: 'Problem 1(c), answer box: R = 2GM/(1 − Ê²) against the root of 1 − 2GM/q − Ê² found numerically'
    formula: 2*G*M/(1 - E**2)
    equals: solve('1 - 2*G*M/q - E**2', 'q', 2*G*M, 1e6)
    samples:
      G: [1, 0.7, 1.5, 0.5]
      M: [1, 2, 1.3, 1.8]
      E: [0.3, 0.6, 0.85, 0.5]
    tolerance: 1e-9
    shown: ['id="p1c-turn"', 'R = \frac{2GM}{1 - \hat E^2}']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1d-tau
    kind: identity
    where: 'Problem 1(d), statement and solution: √(R*³/(8GM)) (η + sin η) against the integral of 1/√(2GM/q − 2GM/R*) from r(η) = (R*/2)(1 + cos η) to R*, done numerically'
    formula: sqrt(Rstar**3/(8*G*M))*(eta + sin(eta))
    equals: integrate('1/sqrt(2*G*M/q - 2*G*M/Rstar)', 'q', Rstar/2*(1 + cos(eta)), Rstar)
    samples:
      G: [1, 0.7, 1.5, 1]
      M: [1, 2, 1.3, 1]
      Rstar: [5, 12, 20, 8]
      eta: [0.4, 1.2, 2.2, 3.0]
    tolerance: 1e-6
    shown: ['\tau = \sqrt{\frac{R_*^3}{8GM}}\left(\eta + \sin\eta\right)']
    source: {cite: mit, at: 'Problem 1(d), p. 2'}
    origin: mit

  - id: p1d-sub
    kind: identity
    where: 'Problem 1(d), solution: 2GM/r − 2GM/R* = (2GM/R*) tan²(η/2) for r = (R*/2)(1 + cos η)'
    formula: 2*G*M/(Rstar/2*(1 + cos(eta))) - 2*G*M/Rstar
    equals: 2*G*M/Rstar*tan(eta/2)**2
    samples:
      G: [1, 0.7, 1.5]
      M: [1, 2, 1.3]
      Rstar: [5, 12, 20]
      eta: [0.4, 1.2, 2.2]
    tolerance: 1e-12
    shown: ['= \frac{2GM}{R_*}\tan^2\frac{\eta}{2}']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1d-tc
    kind: identity
    answer: p1d-tc
    where: 'Problem 1(d), answer box: π√(R*³/(8GM)) against the proper-time integral from 0 to R*, done numerically'
    formula: pi*sqrt(Rstar**3/(8*G*M))
    equals: integrate('1/sqrt(2*G*M/q - 2*G*M/Rstar)', 'q', 0, Rstar)
    samples:
      G: [1, 0.7, 1.5, 1]
      M: [1, 2, 1.3, 1]
      Rstar: [5, 12, 20, 8]
    tolerance: 1e-6
    shown: ['id="p1d-tc"', '\tau = \pi\sqrt{\frac{R_*^3}{8GM}} \quad \text{at } r = 0']
    source: {cite: mit, at: 'Problem 1(d) (our own addition)'}
    origin: page-own

  - id: p1d-newton
    kind: identity
    where: 'Problem 1(d), check: π√(R*³/(8GM)) is the Newtonian free-fall time (π/2)√(R*³/(2GM))'
    formula: pi*sqrt(Rstar**3/(8*G*M))
    equals: pi/2*sqrt(Rstar**3/(2*G*M))
    samples:
      G: [1, 0.7]
      M: [1, 2]
      Rstar: [5, 12]
    tolerance: 1e-12
    shown: ['$\frac{\pi}{2}\sqrt{R_*^3/(2GM)}$']
    source: {cite: mit, at: 'Problem 1(d) (our own check)'}
    origin: page-own

  - id: p1e-r0
    kind: identity
    answer: p1e-r0
    where: 'Problem 1(e), answer box: R0 = √(R*³/(2GM)) against 2τ/(η + sin η), τ from the numerical proper-time integral (the interior τ is (R0/2)(η + sin η))'
    formula: sqrt(Rstar**3/(2*G*M))
    equals: 2*integrate('1/sqrt(2*G*M/q - 2*G*M/Rstar)', 'q', Rstar/2*(1 + cos(eta)), Rstar)/(eta + sin(eta))
    samples:
      G: [1, 0.7, 1.5, 1]
      M: [1, 2, 1.3, 1]
      Rstar: [5, 12, 20, 8]
      eta: [0.4, 1.2, 2.2, 3.0]
    tolerance: 1e-6
    shown: ['id="p1e-r0"', 'R_0 = 2\sqrt{\frac{R_*^3}{8GM}} = \sqrt{\frac{R_*^3}{2GM}}']
    source: {cite: mit, at: 'Problem 1(e) (our own solution)'}
    origin: page-own

  - id: p1e-chi
    kind: identity
    answer: p1e-chi
    where: 'Problem 1(e), answer box: χs = arcsin √(2GM/R*) against arcsin(R*/R0), R0 from the numerical proper-time integral'
    formula: asin(sqrt(2*G*M/Rstar))
    equals: asin(Rstar*(eta + sin(eta))/(2*integrate('1/sqrt(2*G*M/q - 2*G*M/Rstar)', 'q', Rstar/2*(1 + cos(eta)), Rstar)))
    samples:
      G: [1, 0.7, 1.5, 1]
      M: [1, 2, 1.3, 1]
      Rstar: [5, 12, 20, 8]
      eta: [0.4, 1.2, 2.2, 3.0]
    tolerance: 1e-6
    shown: ['id="p1e-chi"', '\chi_s = \arcsin\sqrt{\frac{2GM}{R_*}}']
    source: {cite: mit, at: 'Problem 1(e) (our own solution)'}
    origin: page-own

  - id: p1e-rho
    kind: identity
    where: 'Problem 1(e), check: ρ0 = 3/(8πG R0²) with R0² = R*³/(2GM) is 3M/(4πR*³)'
    formula: 3/(8*pi*G*(Rstar**3/(2*G*M)))
    equals: 3*M/(4*pi*Rstar**3)
    samples:
      G: [1, 0.7]
      M: [1, 2]
      Rstar: [5, 12]
    tolerance: 1e-12
    shown: ['= \frac{3M}{4\pi R_*^3}$']
    source: {cite: mit, at: 'Problem 1(e) (our own check)'}
    origin: page-own

