  # ---- Problem 2: the cluster. Samples of the uniform cluster (m = M r³/R³, Φ from Problem 2(d), ρ = 3M/(4πR³)).

  - id: p2a-e2l
    kind: identity
    answer: p2a-e2l
    where: 'Problem 2(a), answer box: e^(2Λ) = 1/(1 − 2Gm/r) against r(1 − e^(−2Λ)) = ∫ 8πGρ q² dq, done numerically for the uniform cluster'
    formula: 1/(1 - 2*G*m/r)
    equals: 1/(1 - integrate('8*pi*G*rho*q**2', 'q', 0, r)/r)
    samples:
      G: [1, 0.7, 1.2, 1]
      m: [0.125, 0.592592592592593, 0.012, 0.800655976676385]
      r: [5, 8, 3, 6.5]
      rho: [0.000238732414637843, 0.000276310665090096, 0.000106103295394597, 0.000696012870664265]
    tolerance: 1e-9
    shown: ['id="p2a-e2l"', 'e^{2\Lambda} = \frac{1}{1 - 2Gm/r}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-dphi
    kind: identity
    answer: p2a-dphi
    where: 'Problem 2(a), answer box: dΦ/dr = Gm/(r(r − 2Gm)) against the numerical derivative of the exterior Φ = ½ ln(1 − 2Gm/q) at fixed m'
    formula: G*m/(r*(r - 2*G*m))
    equals: deriv('0.5*log(1 - 2*G*m/q)', 'q', r)
    samples:
      G: [1, 0.7, 1.2, 0.5]
      m: [0.5, 1, 0.8, 2]
      r: [10, 15, 4, 20]
    tolerance: 1e-7
    shown: ['id="p2a-dphi"', '\frac{d\Phi}{dr} = \frac{Gm}{r\left(r - 2Gm\right)}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2b-ang
    kind: identity
    answer: p2b-ang
    where: 'Problem 2(b), answer box: L̂ = r√(Gm/(r − 3Gm)) against L̂² = r³Φ''/(1 − rΦ''), Φ'' a numerical derivative of the uniform-cluster Φ(q)'
    formula: r*sqrt(G*m/(r - 3*G*m))
    equals: sqrt(r**3*deriv('0.75*log(1 - 2*G*M/R) - 0.25*log(1 - 2*G*M*q**2/R**3)', 'q', r)/(1 - r*deriv('0.75*log(1 - 2*G*M/R) - 0.25*log(1 - 2*G*M*q**2/R**3)', 'q', r)))
    samples:
      G: [1, 0.7, 1.2, 1]
      M: [1, 2, 1.5, 1]
      R: [10, 12, 15, 7]
      r: [5, 8, 3, 6.5]
      m: [0.125, 0.592592592592593, 0.012, 0.800655976676385]
    tolerance: 1e-7
    shown: ['id="p2b-ang"', '\hat L^2 = \frac{Gm\,r^2}{r - 3Gm}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-flat
    kind: identity
    where: 'Problem 2(b), solution: with the L̂ of the box, the potential e^(2Φ(q))(1 + L̂²/q²) of the uniform cluster is flat at q = r (numerical derivative; 1 + 0 = 1)'
    formula: '1'
    equals: 1 + deriv('exp(2*(0.75*log(1 - 2*G*M/R) - 0.25*log(1 - 2*G*M*q**2/R**3)))*(1 + G*(M*r**3/R**3)*r**2/(r - 3*G*(M*r**3/R**3))/q**2)', 'q', r)
    samples:
      G: [1, 0.7, 1.2, 1]
      M: [1, 2, 1.5, 1]
      R: [10, 12, 15, 7]
      r: [5, 8, 3, 6.5]
    tolerance: 1e-8
    shown: ['$dV_\text{eff}/dr = e^{2\Phi}\left[2\Phi''\left(1 + \hat L^2/r^2\right) - 2\hat L^2/r^3\right] = 0$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-en
    kind: identity
    answer: p2b-en
    where: 'Problem 2(b), answer box: Ê = e^Φ √((r − 2Gm)/(r − 3Gm)) against √(e^(2Φ)(1 + L̂²/r²)) with L̂² = r³Φ''/(1 − rΦ''), Φ'' numerical, for the uniform cluster'
    formula: exp(Phi)*sqrt((r - 2*G*m)/(r - 3*G*m))
    equals: sqrt(exp(2*Phi)*(1 + r*deriv('0.75*log(1 - 2*G*M/R) - 0.25*log(1 - 2*G*M*q**2/R**3)', 'q', r)/(1 - r*deriv('0.75*log(1 - 2*G*M/R) - 0.25*log(1 - 2*G*M*q**2/R**3)', 'q', r))))
    samples:
      G: [1, 0.7, 1.2, 1]
      M: [1, 2, 1.5, 1]
      R: [10, 12, 15, 7]
      r: [5, 8, 3, 6.5]
      m: [0.125, 0.592592592592593, 0.012, 0.800655976676385]
