# Calculations on content/year-5/8.962/gravitational-wave-energy-isaacson.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 17 transcript; page numbers are the PDF pages of the transcript.
# Checks: sphere integrals of direction cosines (numerically), the trace of the trace-reversed perturbation, the
# binary power (sum of squares of third derivatives, Kepler substitution, numbers), the merger time, the chirp
# curve (chirp mass, G M/c^3, frequency at the plotted point), and quoted facts.

page: content/year-5/8.962/gravitational-wave-energy-isaacson.mdx
calcs:
  - id: sphere-nxnx
    where: 'formula "Integrals of direction cosines": the xx component of the integral of n_i n_j over the sphere is 4 pi/3 (numerical integral of cos^2(phi) sin^2(th) sin th)'
    inputs: {}
    formula: "integrate('sin(th)**3', 'th', 0, pi) * pi"
    expected: '4.18879'
    shown: ['\oint n_in_j\,d\Omega = \frac{4\pi}{3}\delta_{ij}']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: four-pi-over-3
    where: 'same: 4 pi / 3'
    inputs: {}
    formula: 4*pi/3
    expected: '4.18879'
    shown: ['$\\oint n_in_j\\,d\\Omega = \\frac{4\\pi}{3}\\delta_{ij}$; odd']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: sphere-nz4
    where: 'formula "Integrals of direction cosines": for i = j = k = l = z the four-n integral is (4 pi/15) * 3 = 4 pi/5 (integral of cos^4 th sin th dth times 2 pi)'
    inputs: {}
    formula: "2*pi*integrate('cos(th)**4*sin(th)', 'th', 0, pi)"
    expected: '2.51327'
    shown: ['\oint n_in_jn_kn_l\,d\Omega = \frac{4\pi}{15}\left(\delta_{ij}\delta_{kl} + \delta_{ik}\delta_{jl} + \delta_{il}\delta_{jk}\right)']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: sphere-nz4-check
    where: 'same: (4 pi/15) * 3'
    inputs: {}
    formula: 4*pi/15*3
    expected: '2.51327'
    shown: ['= \frac{4\pi}{15}\left(']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: sphere-nxxyy
    where: 'same: for i = j = x, k = l = y the four-n integral is (4 pi/15) * 1 (integral of sin^5 th cos^2 phi sin^2 phi)'
    inputs: {}
    formula: "integrate('sin(th)**5', 'th', 0, pi) * (pi/4)"
    expected: '0.837758'
    shown: ['\delta_{ij}\delta_{kl} + \delta_{ik}\delta_{jl} + \delta_{il}\delta_{jk}\right)" cite']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: four-pi-over-15
    where: 'same: 4 pi / 15'
    inputs: {}
    formula: 4*pi/15
    expected: '0.837758'
    shown: ['\\frac{4\\pi}{15}(\\delta_{ij}']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: mit

  - id: trace-reversed
    kind: identity
    where: 'section "Gauge on a curved background": the trace of h-bar = h - (1/2) g-hat h is h - 2h = -h'
    formula: hh - 0.5*4*hh
    equals: -hh
    samples: {hh: [0.3, -2.0]}
    tolerance: 1e-12
    shown: ['(whose trace is $-h$)']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: mit

  - id: orders
    kind: fact
    where: 'section "Second order": orders 1, 1e-22, 1e-44 (Hughes)'
    shown: ['for $h$ of order $10^{-22}$ the background terms are of order 1, the $h$ terms of order $10^{-22}$ and the $j$ terms of order $10^{-44}$']
    source: {cite: reading1, at: 'transcript p. 15'}
    origin: mit

  - id: history
    kind: fact
    where: 'Brill and Hartle 1964; Einstein 1916 and 1918, factor of 2; Earth radius about 6,000 km (Hughes); one third as long'
    shown: ['Brill and James Hartle made it rigorous in 1964', 'in 1916 and got it badly wrong, then nearly right in 1918, off by a factor of 2', 'some 6,000 km in radius', 'about a third as long']
    source: {cite: reading1, at: 'transcript pp. 4, 6, 9, 20'}
    origin: mit

  - id: binary-sum-squares
    kind: identity
    where: 'worked example step "Three derivatives": (2 m a^2 W^3)^2 (sin^2 + sin^2 + 2 cos^2) = 8 m^2 a^4 W^6'
    formula: (2*mm*aa**2*W**3*sin(ph))**2 + (-2*mm*aa**2*W**3*sin(ph))**2 + 2*(-2*mm*aa**2*W**3*cos(ph))**2
    equals: 8*mm**2*aa**4*W**6
    samples: {mm: [1.0, 2.0], aa: [1.5, 0.7], W: [0.8, 1.3], ph: [0.4, 2.2]}
    tolerance: 1e-12
    shown: ['is $4m^2a^4\Omega^6(2\sin^2 + 2\cos^2) = 8m^2a^4\Omega^6$']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: page-own

  - id: binary-third-derivative
    kind: identity
    where: 'worked example: d3/dt3 of (m a^2/4) cos(2 W t) = 2 m a^2 W^3 sin(2 W t) (numerical derivative)'
    formula: "deriv('-(mm*aa**2/2)*W*sin(2*W*u)', 'u', tt, 2)"
    equals: 2*mm*aa**2*W**3*sin(2*W*tt)
    samples: {mm: [1.0, 2.0], aa: [1.5, 0.7], W: [0.8, 1.3], tt: [0.4, 2.2]}
    tolerance: 1e-4
    shown: ['$\frac{d^3Q_{xx}}{dt^3} = 2ma^2\Omega^3\sin 2\Omega t = -\frac{d^3Q_{yy}}{dt^3}$']
    source: {cite: reading1, at: 'transcript p. 20'}
    origin: page-own

  - id: binary-kepler
    kind: identity
    where: 'worked example step "Use Kepler''s law": (8/5) G m^2 a^4 W^6 with W^2 = 2 G m / a^3 equals (64/5) G^4 m^5 / a^5'
    formula: (8/5)*Gn*mm**2*aa**4*(2*Gn*mm/aa**3)**3
    equals: (64/5)*Gn**4*mm**5/aa**5
    samples: {Gn: [1.0, 0.5], mm: [1.0, 2.0], aa: [1.5, 3.0]}
    tolerance: 1e-12
    shown: ['$P = \frac85 Gm^2a^4 \cdot \frac{8G^3m^3}{a^9} = \frac{64}{5}\frac{G^4m^5}{c^5a^5}$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: binary-Gm
    where: 'worked example step "Numbers": G m for m = 30 M_sun'
    inputs: {}
    formula: G*30*M_sun
    expected: 3.98e21 m**3/s**2
    shown: ['$Gm = 30 \times 1.327\times10^{20} = 3.98\times10^{21}\ \text{m}^3/\text{s}^2$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: binary-m
    where: 'worked example: m = 30 M_sun in kg'
    inputs: {}
    formula: 30*M_sun
    expected: 5.97e31 kg
    shown: ['$m = 5.97\times10^{31}$ kg']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: binary-power
    where: 'worked example and quiz 4: P = (64/5) G^4 m^5 / (c^5 a^5) for m = 30 M_sun, a = 1000 km'
    inputs: {a: 1000 km}
    formula: (64/5)*G**4*(30*M_sun)**5/(c**5*a**5)
    expected: 7.9e46 W
    quiz: 3
    shown: ['give $P \approx 7.9\times10^{46}$ W', 'gives about $7.9\\times10^{46}$ W']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: binary-c5a5
    where: 'quiz 4 explanation: c^5 a^5'
    inputs: {a: 1000 km}
    formula: c**5
    expected: 2.42e42 m**5/s**5
    shown: ['$c^5a^5 \\approx 2.42\\times10^{42} \\times 10^{30}$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: binary-vs-sun
    where: 'worked example and quiz 4: P / L_sun with L_sun = 3.83e26 W'
    inputs: {a: 1000 km, Lsun: 3.83e26 W}
    formula: (64/5)*G**4*(30*M_sun)**5/(c**5*a**5)/Lsun
    expected: 2e20
    shown: ['about $2\times10^{20}$ times the Sun''s luminosity of $3.83\times10^{26}$ W', 'some $2\\times10^{20}$ times']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: merger-time
    where: 'worked example: time to merger (5/256) c^5 a^4 / (G^3 m1 m2 M) = (5/512) c^5 a^4/(G^3 m^3); plot caption'
    inputs: {a: 1000 km}
    formula: (5/512)*c**5*a**4/(G**3*(30*M_sun)**3)
    expected: 0.37 s
    shown: ['the pair merges in about 0.37 s', 'it is 28.4 Hz, 0.37 s before merger']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: chirp-mass
    where: 'plot caption: chirp mass of two equal masses, m 2^(-1/5), for m = 30'
    inputs: {}
    formula: 30*2**(-1/5)
    expected: '26.1'
    shown: ['chirp mass 𝓜 = 26.1 M☉']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: chirp-time
    where: 'plot curve and caption: G M_chirp / c^3'
    inputs: {}
    formula: G*30*2**(-1/5)*M_sun/c**3
    expected: 1.2864e-4 s
    shown: ['(G𝓜/c³ = 1.2864 × 10⁻⁴ s)', '*(1.2864e-4)^(-5/8)']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: chirp-point
    where: 'plot point and caption: f at tau = 0.375 s equals the 28.4 Hz of the 1000 km orbit (Lecture 16)'
    inputs: {tau: 0.375 s, tc: 1.2864e-4 s}
    formula: (1/pi)*(5/(256*tau))**(3/8)*tc**(-5/8)
    expected: 28.4 Hz
    shown: ['{ x: 0.375, y: 28.4, label: "a = 1000 km" }']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: earth-curvature-length
    where: 'section "Wave or background?": the curvature length near the Earth, sqrt(c^2 R^3/(G M)), with R = 6371 km and M = 5.972e24 kg'
    inputs: {R: 6371 km, M: 5.972e24 kg}
    formula: sqrt(c**2*R**3/(G*M))
    expected: 2.4e8 km
    shown: ['\approx 2.4\times10^8$ km [Hughes guesses']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: slip

  - id: earth-radius
    kind: fact
    where: 'section "Wave or background?": Earth radius 6,371 km'
    shown: ['(6,371 km, more precisely)']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: binary-separation-GM
    where: 'worked example: a / (G M / c^2) with M = 60 M_sun, a = 1000 km'
    inputs: {a: 1000 km}
    formula: a/(G*60*M_sun/c**2)
    expected: '11'
    shown: ['only about $11\,GM/c^2$ apart']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: binary-relative-speed
    where: 'worked example: relative orbital speed a Omega in units of c'
    inputs: {a: 1000 km}
    formula: a*sqrt(G*60*M_sun/a**3)/c
    expected: '0.3'
    shown: ['their relative speed is about $0.3c$']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own

  - id: merger-formula
    kind: identity
    where: 'worked example: (5/512) c^5 a^4/(G^3 m^3) is (5/256) c^5 a^4/(G^3 m1 m2 M) for m1 = m2 = m, M = 2m'
    formula: (5/256)*aa**4/(Gn**3*mm*mm*(2*mm))
    equals: (5/512)*aa**4/(Gn**3*mm**3)
    samples: {aa: [2.0, 0.5], Gn: [1.0, 0.3], mm: [1.0, 2.5]}
    tolerance: 1e-12
    shown: ['$t = \frac{5}{512}\frac{c^5a^4}{G^3m^3}$ for equal masses']
    source: {cite: reading1, at: 'transcript p. 21'}
    origin: page-own
