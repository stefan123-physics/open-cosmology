    inputs: {}
    formula: G*(1*dyne/cm**2)/c**4*km**2*1e40
    expected: '8.263'
    shown: ['= 8.263\times 10^{-40}\ \text{km}^{-2}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-gc
    where: 'Problem 2(a), solution: (Gc)^(−2/3) in cgs numbers, × 1e3 (unit cm^(4/3) per g^(−2/3) cm⁴ s⁻²)'
    inputs: {}
    formula: (6.67430e-8*2.99792458e10)**(-2/3)*1e3
    expected: '6.298'
    shown: ['$(Gc)^{-2/3} = 6.298\times 10^{-3}$ cm⁴ᐟ³']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-kfac
    answer: p2a-kfac
    where: 'Problem 2(a), answer box: 1 g^(−2/3) cm⁴ s⁻² times (G/c⁴)/(G/c²)^(5/3), in units of 1e-9 km^(4/3)'
    inputs: {}
    formula: (1*gram**(-2/3)*cm**4/second**2)*(G/c**4)/(G/c**2)**(5/3)/km**(4/3)*1e9
    expected: '1.36'
    shown: ['id="p2a-kfac"']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-kfac-4
    where: 'Problem 2(a), formula "the constant of the polytrope": the factor with four digits'
    inputs: {}
    formula: (1*gram**(-2/3)*cm**4/second**2)*(G/c**4)/(G/c**2)**(5/3)/km**(4/3)*1e9
    expected: '1.357'
    shown: ['\text{s}^{-2} \to 1.357\times 10^{-9}\ \text{km}^{4/3}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-k
    answer: p2a-k
    where: 'Problem 2(a), answer box: the sheet''s K = 5.38e9 cgs in km^(4/3)'
    inputs: {}
    formula: 5.38e9*(1*gram**(-2/3)*cm**4/second**2)*(G/c**4)/(G/c**2)**(5/3)/km**(4/3)
