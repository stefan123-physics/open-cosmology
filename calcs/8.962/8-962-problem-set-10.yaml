    source: {cite: mit, at: 'Problem 2(b) (our own numerical solution)'}
    origin: page-own

  - id: p2b-newton-r
    where: 'Problem 2(b), check: radius of the Newtonian n = 3/2 polytrope with the same central density, ξ1 a with a² = (5/2) K ρ0c^(−1/3)/(4π) (km units)'
    inputs: {Kk: 7.29958, r0: 7.42616e-4, xi1: 3.65375}
    formula: xi1*sqrt(2.5*Kk*r0**(-1/3)/(4*pi))
    expected: '14.6'
