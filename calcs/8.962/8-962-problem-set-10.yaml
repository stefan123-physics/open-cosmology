    shown: ['id="p2a-k"', '\ \text{km}^{4/3} = 7.30\ \text{km}^{4/3}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-k-formula
    where: 'Problem 2(a), check: the sheet''s formula 3^(2/3) π^(4/3) ħ²/(5 m_n^(8/3)) with CODATA values, in units of 1e9 g^(−2/3) cm⁴ s⁻²'
    inputs: {m_n: 1.67492749804e-27 kg}
    formula: 3**(2/3)*pi**(4/3)*hbar**2/(5*m_n**(8/3))/(gram**(-2/3)*cm**4/second**2)/1e9
    expected: '5.380'
    shown: ['gives $5.380\times 10^{9}$ in cgs units']
