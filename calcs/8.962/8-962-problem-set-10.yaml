    formula: G*(1*gram/cm**3)/c**2*cm**2*1e29
    expected: '7.426'
    shown: ['= 7.426\times 10^{-29}\ \text{cm}^{-2} = 7.426\times 10^{-19}\ \text{km}^{-2}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-p
    answer: p2a-p
    where: 'Problem 2(a), answer box: G/c⁴ × 1 dyne/cm² in units of 1e-40 km⁻²'
