    formula: 2*M_s/R_s
    expected: '0.158'
    shown: ['The compactness is $2M_\star/R_\star = 0.158$', '\sqrt{1 - 0.158}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: buchdahl
    where: 'Problem 2(b) and 3(b), checks: Buchdahl''s limit 2GM/r < 8/9 (from GM/r < 4/9 in the lesson)'
    inputs: {}
    formula: 2*4/9
    expected: '0.889'
    shown: ['well below the limit $8/9$ of Buchdahl', "Buchdahl's limit of $8/9$"]
    source: {cite: reading2, at: 'transcript p. 4'}
