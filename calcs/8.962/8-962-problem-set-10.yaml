  - id: p2a-rounded
    where: 'Problem 2(a), check: with G = 6.67e-8 and c = 3.00e10 the density factor is smaller by 0.20%, the pressure factor by 0.34% (the larger of the two shown, in %)'
    inputs: {}
    formula: (1 - (6.67e-8/(3.00e10)**4)/(6.67430e-8/(2.99792458e10)**4))*100
    expected: '0.3'
    tolerance: 0.06
    shown: ['the density and pressure factors come out 0.2% and 0.3% smaller']
    source: {cite: mit, at: 'Problem 2(a) (our own check)'}
    origin: page-own

  # ---- Problem 2(b): the star with ρ_0,c = 1e15 g/cm³

  - id: p2b-rho0c
    where: 'Problem 2(b), solution: ρ_0,c = 1e15 g/cm³ in km⁻², × 1e4'
    inputs: {}
    formula: G*(1e15*gram/cm**3)/c**2*km**2*1e4
    expected: '7.426'
    shown: ['$\rho_{0,c} = 7.426\times 10^{-4}$ km⁻²']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-pc
    where: 'Problem 2(b), solution: P_c = K ρ_0,c^(5/3) in km⁻², × 1e5 (K and ρ in km units, as pure numbers)'
    inputs: {Kk: 7.29958, r0: 7.42616e-4}
    formula: Kk*r0**(5/3)*1e5
    expected: '4.45'
    shown: ['$P_c = K\rho_{0,c}^{5/3} = 4.45\times 10^{-5}$ km⁻²']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-rhoc-km
    where: 'Problem 2(b), solution: ρ_c = ρ_0,c + (3/2) P_c in km⁻², × 1e4'
    inputs: {Kk: 7.29958, r0: 7.42616e-4}
    formula: (r0 + 1.5*Kk*r0**(5/3))*1e4
    expected: '8.093'
    shown: ['which is $8.093\times 10^{-4}$ km⁻²']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-rhoc-cgs
    where: 'Problem 2(b), solution: the same in g/cm³, × 1e-15; and the 9% the internal energy adds'
    inputs: {Kk: 7.29958, r0: 7.42616e-4}
    formula: (1 + 1.5*Kk*r0**(2/3))*1
    expected: '1.090'
    shown: ['$1.090\times 10^{15}$ g/cm³: the internal energy adds 9% to the rest mass']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-run
    kind: fact
    where: 'Problem 2(b), solution: the solver settings and the result of our run (R⋆ = 12.6766 km, M⋆ = 1.002239 km); stopping at 1e-8 P_c gives R⋆ = 12.6639 km (0.10% less) and M⋆ = 1.0022384 km'
    shown: ['relative tolerance $10^{-10}$), starting at $r_1 = 10^{-6}$ km and stopping when $P$ fell to $10^{-14}P_c$', 'Stopping at $10^{-8}P_c$ instead moves the radius by 0.1% and the mass by less than a part in a million', "(MIT's rounded $G$ and $c$ give 12.68 km and 1.002 km as well.)"]
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own numerical solution)'}
