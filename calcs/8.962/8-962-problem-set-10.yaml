# Calculations on content/year-5/8.962/8-962-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set. Problem 1 is checked here by routes independent of the page: the
# Schwarzschild components evaluated at r(r̄) with a numerical derivative for dr/dr̄, and limits for part (b).
# Problem 2(a) is unit conversion with pint and the CODATA 2018 constants of calcs/constants.yaml.
# Problems 2(b) to 3(b) need the numerical solution of the TOV equations, which this harness cannot run (no ODE solver).
# Outside this file, while writing: SciPy solve_ivp (method DOP853, rtol 1e-10, atol 1e-30), unknowns m, P (and m_p
# or the baryonic sum), starting at r1 = 1e-6 km with m = (4π/3)ρ_c r1³, stopped by an event at P = 1e-14 P_c; constants
# G = 6.67430e-8, c = 2.99792458e10 (cgs), K = 5.38e9 cgs converted with them. The maximum of M⋆ was found with SciPy's
# bounded scalar minimiser on log10 ρ_0,c (xatol 1e-7), the minimum the same way. Checks of that run: rtol 1e-8 and
# 1e-12 change R⋆ and M⋆ by less than 1e-8; stopping at 1e-8 P_c moves R⋆ by 0.1%; MIT's rounded G and c give
# R⋆ = 12.683 km, M⋆ = 1.0018 km, Δ = 0.0793, M_max = 1.1741 km; the low-density models agree with the Newtonian
# polytrope (Lane–Emden n = 3/2, integrated separately: ξ1 = 3.65375, ξ1²|θ'(ξ1)| = 2.71406). Those solver results are
# recorded below as inputs of value entries (so each box is tied to the run) or as facts; everything that can be
# derived from them (redshift, Δ, solar masses, ratios, the Newtonian comparison) is recomputed here.

page: content/year-5/8.962/8-962-problem-set-10.mdx
calcs:
  # ---- Sheet values and constants

  - id: sheet-k
    kind: fact
    where: "Problem 2, statement: MIT's constant of the polytrope and its exponent"
    shown: ['\Gamma = \frac{5}{3}', '= 5.38\times 10^{9}\ \text{g}^{-2/3}\,\text{cm}^4\,\text{s}^{-2}']
    source: {cite: mit, at: 'Problem 2, p. 1'}
    origin: mit

  - id: codata
    kind: fact
    where: "How to answer: the CODATA 2018 values used"
    shown: ['$G = 6.67430\times 10^{-8}$ cm³ g⁻¹ s⁻² (measured)', '$c = 2.99792458\times 10^{10}$ cm/s (exact)', '$\hbar = 1.054571817\times 10^{-27}$ erg s (exact)', '$m_n = 1.67492749804\times 10^{-24}$ g (measured)']
    source: {ref: nist}
    origin: later-data

  - id: gm-sun-param
    kind: fact
    where: "How to answer: the solar mass parameter (IAU 2015 nominal value, as in calcs/constants.yaml and Problem Set 5)"
    shown: ['$GM_\odot = 1.3271244\times 10^{20}$ m³ s⁻²']
    source: {cite: mit, at: 'Problem 3(b), p. 4 (our own choice of value)'}
    origin: page-own

  - id: gm-sun-km
    where: "How to answer and Problem 3(b): GM_sun/c² in km"
    inputs: {}
    formula: G*M_sun/c**2
    expected: 1.4766 km
    shown: ['we use $GM_\odot/c^2 = 1.4766$ km']
    source: {cite: mit, at: 'Problem 3(b), p. 4 (our own arithmetic)'}
    origin: page-own

  # ---- Problem 1(a): the isotropic components against the Schwarzschild ones at r = r̄(1 + GM/2r̄)²

  - id: p1a-gtt
    kind: identity
    answer: p1a-gtt
    where: 'Problem 1(a), answer box: g_tt against −(1 − 2GM/r) evaluated at r(r̄)'
    formula: -((1 - G*M/(2*rbar))/(1 + G*M/(2*rbar)))**2
    equals: -(1 - 2*G*M/(rbar*(1 + G*M/(2*rbar))**2))
    samples:
      G: [1, 1.2, 1.5, 1.1, 1.4]
      M: [0.5, 1, 0.7, 0.9, 0.6]
      rbar: [1, 4, 2.5, 1.3, 3.2]
    tolerance: 1e-10
    shown: ['id="p1a-gtt"', 'g_{tt} = -\left(\frac{1 - GM/2\bar r}{1 + GM/2\bar r}\right)^2']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-g
    kind: identity
    answer: p1a-g
    where: 'Problem 1(a), answer box: g against the radial Schwarzschild term (dr/dr̄)²/(1 − 2GM/r), with dr/dr̄ from a numerical derivative of r(r̄)'
    formula: (1 + G*M/(2*rbar))**4
    equals: deriv('q*(1 + G*M/(2*q))**2', 'q', rbar)**2/(1 - 2*G*M/(rbar*(1 + G*M/(2*rbar))**2))
    samples:
      G: [1, 1.2, 1.5, 1.1, 1.4]
      M: [0.5, 1, 0.7, 0.9, 0.6]
      rbar: [1, 4, 2.5, 1.3, 3.2]
    tolerance: 1e-7
    shown: ['id="p1a-g"', '\left(1 + \frac{GM}{2\bar r}\right)^4\left(d\bar r^2 + \bar r^2\,d\Omega^2\right)']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-g-angular
    kind: identity
    where: 'Problem 1(a), solution: the angular part r² = g r̄², so g = (r/r̄)²'
    formula: (1 + G*M/(2*rbar))**4
    equals: (rbar*(1 + G*M/(2*rbar))**2/rbar)**2
    samples:
      G: [1, 1.2, 1.5, 1.1, 1.4]
      M: [0.5, 1, 0.7, 0.9, 0.6]
      rbar: [1, 4, 2.5, 1.3, 3.2]
    tolerance: 1e-10
    shown: ['The angular part is $r^2 d\Omega^2 = (1 + x)^4\,\bar r^2 d\Omega^2$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-drdrbar
    kind: identity
    where: 'Problem 1(a), formula "the radial part": dr/dr̄ = 1 − G²M²/(4r̄²), by a numerical derivative'
    formula: 1 - G**2*M**2/(4*rbar**2)
    equals: deriv('q*(1 + G*M/(2*q))**2', 'q', rbar)
    samples:
      G: [1, 1.2, 1.5, 1.1, 1.4]
      M: [0.5, 1, 0.7, 0.9, 0.6]
      rbar: [1, 4, 2.5, 1.3, 3.2]
    tolerance: 1e-7
    shown: ['\frac{dr}{d\bar r} = 1 - \frac{G^2M^2}{4\bar r^2} = (1 - x)(1 + x)']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-horizon
    where: 'Problem 1(a), check: at x = 1 (r̄ = GM/2) the Schwarzschild radius is r = 2GM; r/(GM) with GM = 1'
    inputs: {rb: 0.5}
    formula: rb*(1 + 1/(2*rb))**2
    expected: '2'
    tolerance: 1e-12
    shown: ['The horizon $r = 2GM$ is at $x = 1$, that is $\bar r = GM/2$']
    source: {cite: mit, at: 'Problem 1(a) (our own check)'}
    origin: page-own

  # ---- Problem 1(b): first-order forms (limits as r̄ grows, GM = 1)

  - id: p1b-gtt
    kind: limit
    answer: p1b-gtt
    where: 'Problem 1(b), answer box: the first-order g_tt approaches the exact isotropic g_tt as r̄ grows (GM = 1)'
    inputs: {G: 1, M: 1}
    formula: -(1 - 2*G*M/rbar)
    limit: -((1 - G*M/(2*rbar))/(1 + G*M/(2*rbar)))**2
    vary:
      rbar: [10, 100, 1000, 10000]
    tolerance: 1e-7
    shown: ['id="p1b-gtt"', '$g_{tt} \approx -(1 - 4x) = -(1 - 2GM/\bar r)$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-g
    kind: limit
    answer: p1b-g
    where: 'Problem 1(b), answer box: the first-order g approaches (1 + GM/2r̄)⁴ as r̄ grows (GM = 1)'
    inputs: {G: 1, M: 1}
    formula: 1 + 2*G*M/rbar
    limit: (1 + G*M/(2*rbar))**4
    vary:
      rbar: [10, 100, 1000, 10000]
    tolerance: 1e-7
    shown: ['id="p1b-g"', '$(1 + x)^4 \approx 1 + 4x = 1 + 2GM/\bar r$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-sun
    where: 'Problem 1(b), check: 2GM/r at the surface of the Sun (R_sun = 6.957e8 m, IAU nominal radius)'
    inputs: {R_sun: 6.957e8 m}
    formula: 2*G*M_sun/(R_sun*c**2)*1e6
    expected: '4'
    tolerance: 10%
    shown: ['$2GM/\bar r$ is about $4\times 10^{-6}$']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  # ---- Problem 2(a): unit conversions with G = c = 1

  - id: p2a-rho
    answer: p2a-rho
    where: 'Problem 2(a), answer box: G/c² × 1 g/cm³ in units of 1e-19 km⁻²'
