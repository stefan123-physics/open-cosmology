  # ---- Problem 2(c): the redshift

  - id: p2c-e
    kind: identity
    answer: p2c-e
    where: 'Problem 2(c), answer box: against −g_tt in isotropic coordinates (Problem 1), (1 − x)/(1 + x) with x = M/(2r̄) and r̄ found by solving r̄(1 + M/2r̄)² = R'
    formula: E*sqrt(1 - 2*M/R)
    equals: E*(1 - M/(2*solve('q*(1 + M/(2*q))**2 - R', 'q', M/2, R)))/(1 + M/(2*solve('q*(1 + M/(2*q))**2 - R', 'q', M/2, R)))
    samples:
      E: [1, 2, 3.5, 5, 1.7]
      M: [0.5, 1, 1.5, 0.8, 1.2]
      R: [4, 10, 20, 6, 12.7]
    tolerance: 1e-8
    shown: ['id="p2c-e"', '$E_\text{ob} = E_\text{em}\sqrt{1 - 2M_\star/R_\star}$']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2c-ratio
    where: 'Problem 2(c), solution: E_ob/E_em for our star'
    inputs: {M_s: 1.002239, R_s: 12.6766}
    formula: sqrt(1 - 2*M_s/R_s)
    expected: '0.9175'
    shown: ['= 0.9175']
