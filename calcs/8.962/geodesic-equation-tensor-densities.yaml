# Calculations on content/year-5/8.962/geodesic-equation-tensor-densities.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-5/8.962/geodesic-equation-tensor-densities.mdx
calcs:
  - id: party-trick-r
    kind: identity
    where: 'worked example "The party trick in spherical coordinates": d/dr ln(r^2 sin theta) = 2/r = Gamma^theta_thetar + Gamma^phi_phir'
    formula: deriv('log(x**2 * sin(th))', 'x', r, 1)
    equals: 1 / r + 1 / r
    samples: {r: [0.5, 1, 2.7, 9], th: [0.3, 1.1, 2.0, 2.9]}
    tolerance: 1e-6
    shown: ['$\Gamma^\mu_{\mu r} = \partial_r\ln\sqrt g = 2/r$']
    source: {cite: reading1, at: 'transcript p. 8 (the trick); the coordinates are the page''s own example'}
    origin: page-own

  - id: party-trick-theta
    kind: identity
    where: 'worked example: d/dtheta ln(r^2 sin theta) = cot theta'
    formula: deriv('log(r**2 * sin(x))', 'x', th, 1)
    equals: cos(th) / sin(th)
    samples: {r: [0.5, 1, 2.7, 9], th: [0.3, 1.1, 2.0, 2.9]}
    tolerance: 1e-6
    shown: ['$\Gamma^\mu_{\mu\theta} = \partial_\theta\ln\sqrt g = \cot\theta$']
    source: {cite: reading1, at: 'transcript p. 8'}
    origin: page-own

  - id: det-one-plus-eps
    where: 'worked example step "A numerical check of the identity": det(1 + eps) = 1.01 x 0.98 - 0.02 x 0.03'
    inputs: {}
    formula: 1.01 * 0.98 - 0.02 * 0.03
    expected: '0.9892'
    shown: ['$\det(1 + \epsilon) = 1.01 \times 0.98 - 0.02 \times 0.03 = 0.9892$']
    source: {cite: reading1, at: 'transcript p. 9 (the identity); the matrix is the page''s own'}
    origin: page-own

  - id: one-plus-trace
    where: 'worked example: 1 + tr eps = 1 + 0.01 - 0.02'
    inputs: {}
    formula: 1 + 0.01 - 0.02
    expected: '0.99'
    shown: ['$1 + \mathrm{tr}\,\epsilon = 0.99$']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: page-own

  - id: det-difference
    where: 'worked example: the difference 0.99 - 0.9892 is second order'
    inputs: {}
    formula: (1 + 0.01 - 0.02) - (1.01 * 0.98 - 0.02 * 0.03)
    expected: '0.0008'
    shown: ['The difference, $0.0008$, is of second order']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: page-own

  - id: christoffel-count
    where: 'section "Divergences and Gauss''s theorem": 40 independent Christoffel symbols in four dimensions, 4 x 10'
    inputs: {n: 4}
    formula: n * n * (n + 1) / 2
    expected: '40'
    shown: ['all 40 independent Christoffel symbols']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: mit

  - id: div-inverse-square
    kind: identity
    where: 'worked example "An inverse-square field has no divergence": (1/(r^2 sin th)) d/dr (r^2 sin th / r^2) = 0 (plus 1)'
    formula: 1 + deriv('x**2 * sin(th) / x**2', 'x', r, 1) / (r**2 * sin(th))
    equals: '1'
    samples: {r: [0.5, 1, 2.7, 9], th: [0.3, 1.1, 2.0, 2.9]}
    tolerance: 1e-6
    shown: ['which does not depend on $r$, so $\nabla_\mu V^\mu = 0$']
    source: {cite: reading1, at: 'transcript p. 11 (formula); the field is the page''s own'}
    origin: page-own

  - id: div-linear
    kind: identity
    where: 'worked example: (1/(r^2 sin th)) d/dr (r^3 sin th) = 3'
    formula: deriv('x**3 * sin(th)', 'x', r, 1) / (r**2 * sin(th))
    equals: '3'
    samples: {r: [0.5, 1, 2.7, 9], th: [0.3, 1.1, 2.0, 2.9]}
    tolerance: 1e-6
    shown: ['\cdot 3r^2\sin\theta = 3$']
    source: {cite: reading1, at: 'transcript p. 11'}
    origin: page-own

  - id: geo-r
    where: 'worked example "A straight line is a geodesic": r = sqrt(5) at lambda = 1'
    inputs: {l: 1}
    formula: sqrt(l**2 + 4)
    expected: '2.236'
    shown: ['$r = \sqrt5 \approx 2.236$']
    source: {cite: reading1, at: 'transcript p. 16 (equation); the line is the page''s own'}
    origin: page-own

  - id: geo-rdot
    where: 'worked example: dr/dlambda = lambda / r'
    inputs: {l: 1}
    formula: deriv('sqrt(s**2 + 4)', 's', l, 1)
    expected: '0.4472'
    shown: ['$\dot r = \lambda/r \approx 0.4472$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: geo-rddot
    where: 'worked example: d2r/dlambda2 = 4 / r^3'
    inputs: {l: 1}
    formula: deriv('sqrt(s**2 + 4)', 's', l, 2)
    expected: '0.3578'
    shown: ['$\ddot r = 4/r^3 \approx 0.3578$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: geo-phidot
    where: 'worked example: dphi/dlambda of atan(2/lambda) = -2/(lambda^2 + 4)'
    inputs: {l: 1}
    formula: deriv('atan(2 / s)', 's', l, 1)
    expected: '-0.4'
    shown: ['$\dot\phi = -2/(\lambda^2 + 4) = -0.4$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: geo-phiddot
    where: 'worked example: d2phi/dlambda2 = 4 lambda / (lambda^2 + 4)^2'
    inputs: {l: 1}
    formula: deriv('atan(2 / s)', 's', l, 2)
    expected: '0.16'
    shown: ['$\ddot\phi = 4\lambda/(\lambda^2 + 4)^2 = 0.16$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: geo-r-equation
    kind: identity
    where: 'worked example: rddot - r phidot^2 = 0 along x = lambda, y = 2 (plus 1)'
    formula: 1 + deriv('sqrt(s**2 + 4)', 's', l, 2) - sqrt(l**2 + 4) * deriv('atan(2 / s)', 's', l, 1)**2
    equals: '1'
    samples: {l: [0.5, 1, 2, 5]}
    tolerance: 1e-5
    shown: ['$\ddot r - r\dot\phi^2 \approx 0.3578 - 2.236 \times 0.16 = 0.3578 - 0.3578 = 0$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: geo-phi-equation
    kind: identity
    where: 'worked example: phiddot + (2/r) rdot phidot = 0 (plus 1)'
    formula: 1 + deriv('atan(2 / s)', 's', l, 2) + 2 / sqrt(l**2 + 4) * deriv('sqrt(s**2 + 4)', 's', l, 1) * deriv('atan(2 / s)', 's', l, 1)
    equals: '1'
    samples: {l: [0.5, 1, 2, 5]}
    tolerance: 1e-5
    shown: ['$\ddot\phi + (2/r)\dot r\dot\phi \approx 0.16 + (0.8944)(0.4472)(-0.4) = 0.16 - 0.16 = 0$']
    source: {cite: reading1, at: 'transcript p. 16'}
    origin: page-own

  - id: twin-tau
