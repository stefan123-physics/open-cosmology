  - id: det-second-order
    where: 'worked example: the difference equals -(1/2)[(tr eps)^2 - tr(eps^2)] with tr eps = -0.01, tr(eps^2) = 0.01^2 + 2(0.02)(0.03) + 0.02^2 = 0.0017'
