# Calculations on content/year-5/8.962/linearized-gravity-dynamic-sources.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.962 (Spring 2020, Hughes) Lecture 15 transcript (PDF page numbers) and Flanagan & Hughes,
# New J. Phys. 7, 204 (2005), Sec. 2.2. Checks: the Green's-function prefactor (-1/4 pi)(-16 pi G) = 4G, degree-of-
# freedom counts, gauge invariance of Phi, Theta, Xi (coefficients checked with sample numbers), the Newtonian check
# Theta = -2 Phi, and the Sun example.

page: content/year-5/8.962/linearized-gravity-dynamic-sources.mdx
calcs:
  - id: green-prefactor
    kind: identity
    where: 'formula "Exact solution in Lorenz gauge": (-1/4 pi) times (-16 pi G) = 4 G'
    formula: (-1/(4*pi))*(-16*pi*Gn)
    equals: 4*Gn
    samples: {Gn: [1.0, 6.674e-11]}
    tolerance: 1e-12
    shown: ['The $-1/4\pi$ of the Green''s function meets the $-16\pi$ of the source']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit


  - id: dof-count
    where: 'section "Splitting the metric": 1 + 1 + 2 + 1 + 1 + 2 + 2 = 10'
    inputs: {}
    formula: 1 + 1 + 2 + 1 + 1 + 2 + 2
    expected: '10'
    shown: ['$1 + 1 + 2 + 1 + 1 + 2 + 2 = 10$']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  - id: tt-count
    where: 'quiz 3 and section "Splitting the metric": 6 - 1 - 3 = 2 transverse-traceless functions'
    inputs: {}
    formula: 6 - 1 - 3
    expected: '2'
    shown: ['leaves 2: the two polarizations']
    source: {cite: reading1, at: 'transcript p. 10'}
    origin: mit

  - id: invariant-count
    where: 'section "Which combinations": 1 + 1 + 2 + 2 = 6 gauge-invariant functions, 10 = 6 + 4'
    inputs: {}
    formula: 1 + 1 + 2 + 2
    expected: '6'
    shown: ['$1 + 1 + 2 + 2 = 6$ gauge-invariant functions']
    source: {cite: reading1, at: 'transcript p. 12'}
    origin: mit

  - id: Phi-invariant
    kind: identity
    where: 'worked example "Checking that Phi is gauge invariant": the change of phi + gamma-dot - lambda-ddot/2 is Adot + (-Adot - Cddot) - (1/2)(-2 Cddot) = 0 (plus 1)'
    formula: 1 + Ad + (-Ad - Cdd) - 0.5*(-2*Cdd)
    equals: '1'
    samples: {Ad: [0.3, -1.0, 2.2], Cdd: [1.5, 0.4, -3.0]}
    tolerance: 1e-12
    shown: ['$\dot A - \dot A - \ddot C + \ddot C = 0$']
    source: {cite: flanagan-hughes, at: 'Sec. 2.2'}
    origin: mit

  - id: Theta-invariant
    kind: identity
    where: 'Theta = (1/3)(H - lap lambda): H -> H - 2 lap C, lambda -> lambda - 2C leaves H - lap lambda unchanged (LC = lap C as a number)'
    formula: (1/3)*((HH - 2*LC) - (Ll - 2*LC))
    equals: (1/3)*(HH - Ll)
    samples: {HH: [0.3, -1.0, 2.2], Ll: [1.5, 0.4, -3.0], LC: [0.7, -2.0, 5.0]}
    tolerance: 1e-12
    shown: ['\Theta = \frac{1}{3}\left(H - \nabla^2\lambda\right)']
    source: {cite: flanagan-hughes, at: 'Sec. 2.2'}
    origin: mit

  - id: Xi-invariant
    kind: identity
    where: 'Xi_i = beta_i - (1/2) epsilon-dot_i: beta -> beta - Bdot, epsilon -> epsilon - 2B leaves it unchanged (one component, sample numbers)'
    formula: (be - Bd) - 0.5*(ed - 2*Bd)
    equals: be - 0.5*ed
    samples: {be: [0.3, -1.0, 2.2], ed: [1.5, 0.4, -3.0], Bd: [0.7, -2.0, 5.0]}
    tolerance: 1e-12
    shown: ['\Xi_i = \beta_i - \frac{1}{2}\dot\varepsilon_i']
    source: {cite: flanagan-hughes, at: 'Sec. 2.2'}
    origin: mit

  - id: lambda-trace
    kind: identity
    where: 'section "Splitting the metric": the trace of (d_i d_j - delta_ij lap/3) is lap - (1/3) 3 lap = 0 (lap as a number, plus 1)'
    formula: 1 + LL - (1/3)*3*LL
    equals: '1'
    samples: {LL: [0.3, -4.0, 9.0]}
    tolerance: 1e-12
    shown: ['its trace is $\nabla^2 - \frac13\cdot 3\nabla^2 = 0$']
    source: {cite: reading1, at: 'transcript p. 9'}
    origin: mit

  - id: newtonian-check
    kind: identity
    where: 'Newtonian check: h_ij = -2 Phi delta_ij gives H = -6 Phi, lambda = 0, Theta = H/3 = -2 Phi; then lap Theta = -2 (4 pi G rho) = -8 pi G rho'
    formula: -2*(4*pi*Gn*rho)
    equals: -8*pi*Gn*rho
    samples: {Gn: [1.0, 6.674e-11], rho: [2.0, 1000.0]}
    tolerance: 1e-12
    shown: ['and $\Theta = -2\Phi$, the $(1 - 2\Phi)$ of the spatial metric']
    source: {cite: flanagan-hughes, at: 'Sec. 2.2'}
    origin: page-own

  - id: sun-hbar00
    where: 'worked example "The Sun''s field at the Earth": hbar_00 = 4 G M / (r c^2)'
    inputs: {r: 1.496e11 m}
    formula: 4*G*M_sun/(r*c**2)
    expected: 3.95e-8
    shown: ['$\bar h_{00} = 4GM_\odot/(rc^2) = 4 \times 1476.6/1.496\times10^{11} \approx 3.95\times10^{-8}$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: sun-length
    where: 'worked example: GM_sun/c^2'
    inputs: {}
    formula: G*M_sun/c**2
    expected: 1476.6 m
    shown: ['($GM_\odot/c^2 = 1476.6$ m.)']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  - id: sun-delay
    where: 'worked example step "The retarded time": r/c in seconds and minutes'
    inputs: {r: 1.496e11 m}
    formula: r/c
    expected: 499 s
    shown: ['$1.496\times10^{11}/2.998\times10^8 \approx 499$ s']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: sun-delay-min
    where: 'worked example: about 8.3 minutes'
    inputs: {r: 1.496e11 m}
    formula: r/c
    expected: 8.3 min
    shown: ['about 8.3 minutes earlier']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: facts
    kind: fact
    where: 'Arfken sections, Jackson 2nd edition Sec. 6.6, the paper about 16 years before the lecture'
    shown: ['Sections 16.5–16.6 of the third edition', 'Section 6.6 of the second edition of Jackson', 'about 16 years earlier']
    source: {cite: reading1, at: 'transcript pp. 2, 4, 8'}
    origin: mit
