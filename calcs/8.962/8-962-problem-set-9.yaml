  # ---- Problem 5: flatness. (Ω − 1)/Ω = 3κ/(8πGρa²): with κ, G constant and ρ = ρ1 (a1/a)^n, the ratio is (a/a1)^(2−n)·(1 − 1/Ω1).
  # Independent route: integrate d ln[(Ω − 1)/Ω]/d ln a = −(d ln ρ/d ln a) − 2 numerically, with ρ from the dilution law.

  - id: p5a-matter
    kind: identity
    answer: p5a-matter
    where: 'Problem 5(a), answer box: matter, against (1 − 1/Ω1)·exp(∫ (n − 2) d ln a) with n = −d ln ρ/d ln a from a numerical derivative of ρ ∝ a⁻³'
    formula: (1 - 1/Omega1)*a2/a1
    equals: (1 - 1/Omega1)*exp(integrate("(-deriv('log(w**(-3))', 'w', exp(q))*exp(q) - 2)", 'q', log(a1), log(a2)))
    samples:
      Omega1: [1.1, 1.5, 2, 2.5, 3]
      a1: [0.5, 0.6, 0.8, 1, 0.7]
      a2: [2, 3, 5, 4, 2.5]
    tolerance: 1e-6
    shown: ['id="p5a-matter"']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

