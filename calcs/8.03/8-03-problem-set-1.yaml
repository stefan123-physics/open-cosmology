# Calculations on content/year-2/8.03/8-03-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for its homework, so every formula answer is checked here by an independent route:
# a numerical derivative or integral, a numerical solve, the real part of the complex form, or the chain rule.
# Number answers are recomputed from the same physics by a different route where one exists.

page: content/year-2/8.03/8-03-problem-set-1.mdx
calcs:
- id: p1-a-by-solve
  answer: p1-a
  kind: identity
  where: 'Problem 1(a), answer box: the hanging position against a numerical solve of the force balance'
  formula: m*g/k
  equals: solve('k*x - m*g', 'x', 0, 1000)
  samples:
    m: [0.1, 2, 0.5]
    g: [9, 10, 9.8]
    k: [10, 100, 20]
  tolerance: 1.0e-09
  shown: [expr="m*g/k"]
  source: {cite: mit, at: Problem 1.1(a) (our own solution)}
  origin: page-own
- id: p1-hang-value
  where: 'Problem 1(a), check: hanging position for m = 0.50 kg, k = 20 N/m'
  inputs: {m: 0.50 kg, g: 9.8 m/s**2, k: 20 N/m}
  formula: m * g / k
  expected: 0.245 m
  shown: [0.50 \times 9.8/20 = 0.245]
  source: {cite: mit, at: Problem 1.1(a) (our own check)}
  origin: page-own
- id: p1-omega-value
  where: 'Problem 1(b), check: angular frequency for m = 0.50 kg, k = 20 N/m'
  inputs: {m: 0.50 kg, k: 20 N/m}
  formula: sqrt(k / m)
  expected: 6.32 1/s
  shown: ['\omega = \sqrt{20/0.50} = 6.32']
  source: {cite: mit, at: Problem 1.1(b) (our own check)}
  origin: page-own
- id: p1-omega-independent-of-g
  kind: identity
  where: 'Problem 1(b) and (c): the curvature of the potential k y²/2 − m g y does not depend on g, so omega does not either'
  formula: sqrt(k/m)
  equals: sqrt(deriv('0.5*k*u**2 - m*g*u', 'u', y0, 2)/m)
  samples:
    k: [20, 100, 7.5]
    m: [0.5, 2, 1.3]
    g: [9.8, 1.62, 24.8]
    y0: [0, 0.3, -1]
  tolerance: 1.0e-07
  shown: ['\qquad \omega = \sqrt{\frac{k}{m}}']
  source: {cite: mit, at: Problem 1.1(c) (our own solution)}
  origin: page-own
