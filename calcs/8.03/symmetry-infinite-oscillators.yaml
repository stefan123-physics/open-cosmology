# Calculations on content/year-2/8.03/symmetry-infinite-oscillators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 7 notes and transcript, with the page's own example.

page: content/year-2/8.03/symmetry-infinite-oscillators.mdx
calcs:
  - id: s-squared
    where: 'S² for S = (0 −1; −1 0): entry (1, 1) = 0·0 + (−1)(−1) = 1, entry (1, 2) = 0·(−1) + (−1)·0 = 0'
    inputs: {}
    formula: (0*0 + (-1)*(-1))*10 + (0*(-1) + (-1)*0)
    expected: '10'
    shown: ['$S^2 = I$, so $\beta^2 = 1$']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: beta-omega
    kind: identity
    where: 'with A_j = β^j: (−β^(j−1) + 2β^j − β^(j+1))/β^j = 2 − β − 1/β'
    formula: (-(b**(3 - 1)) + 2*b**3 - b**(3 + 1))/b**3
    equals: 2 - b - 1/b
    samples: {b: [0.5, 1.7, -2.0]}
    tolerance: 1e-12
    shown: ['\omega^2 = \omega_0^2\left(2 - \beta - \frac{1}{\beta}\right)']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: dispersion
    kind: identity
    where: 'β = e^(ika): β + 1/β = 2 cos ka, so 2 − β − 1/β = 2(1 − cos ka); real form with x = ka'
    formula: 2 - 2*cos(x)
    equals: 2*(1 - cos(x))
    samples: {x: [0.3, 1.0, 3.1]}
    tolerance: 1e-12
    shown: ['\omega^2 = 2\omega_0^2\,(1 - \cos ka)']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: sine-mode
    kind: identity
    where: 'sin(jka) with ω² from the dispersion relation satisfies row j: ω₀²(−A_{j−1} + 2A_j − A_{j+1}) = ω²A_j (ka = 0.7, ω₀ = 1, j = x)'
    formula: -sin((x - 1)*0.7) + 2*sin(x*0.7) - sin((x + 1)*0.7)
    equals: 2*(1 - cos(0.7))*sin(x*0.7)
    samples: {x: [1.0, 2.0, 5.0]}
    tolerance: 1e-12
    shown: ['= \sin(jka)" cite']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: max-freq
    where: 'cos ka = −1: ω² = 2ω₀²·2 = 4ω₀²'
    inputs: {}
    formula: 2*(1 - (-1))
    expected: '4'
    shown: ['gives $\omega^2 = 4\omega_0^2$, $\omega = 2\omega_0$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: ex-ka
    where: 'example: k a = (2π/0.40)·0.050 = π/4'
    inputs: {}
    formula: (2*pi/0.40)*0.050 - pi/4
    expected: '0'
    tolerance: 1e-12
    shown: ['$ka = 15.7 \times 0.050 = \pi/4$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-k
    where: 'example: 2π/0.40'
    inputs: {}
    formula: 2*pi/0.40
    expected: '15.7'
    tolerance: 0.05
    shown: ['$k = 2\pi/0.40 \approx 15.7$ m⁻¹']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-omega2
    where: 'example: 200(1 − cos π/4)'
    inputs: {}
    formula: 200*(1 - cos(pi/4))
    expected: '58.6'
    tolerance: 0.05
    shown: ['= 200(1 - 0.7071) \approx 58.6$']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-omega
    where: 'example: √58.6'
    inputs: {}
    formula: sqrt(200*(1 - cos(pi/4)))
    expected: '7.65'
    tolerance: 0.005
    shown: ['so $\omega \approx 7.65$ rad/s']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-long
    where: 'example: ω₀ka = 10π/4'
    inputs: {}
    formula: 10*pi/4
    expected: '7.85'
    tolerance: 0.005
    shown: ['$\omega \approx \omega_0ka = 10 \times \pi/4 \approx 7.85$ rad/s']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-error
    where: 'example: 7.854/7.654 − 1 ≈ 2.6%, "about 3%"'
    inputs: {}
    formula: (10*pi/4)/sqrt(200*(1 - cos(pi/4))) - 1
    expected: '0.026'
    tolerance: 0.001
    shown: ['about 3% too high already at eight masses per wavelength']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-per-wavelength
    where: 'example: 40 cm / 5 cm = 8 masses per wavelength'
    inputs: {}
    formula: 40/5.0
    expected: '8'
    shown: ['eight masses per wavelength']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own
