# Calculations on content/year-2/8.03/travelling-waves-reflection.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 10 notes and transcript, with the page's own example.

page: content/year-2/8.03/travelling-waves-reflection.mdx
calcs:
  - id: travelling-solves
    kind: identity
    where: 'f(x − v t) with f = e^(−s²), v = 3, solves ψ_tt = v²ψ_xx at x = 0.4: compare second derivatives'
    formula: deriv('exp(-(0.4 - 3*s)**2)', 's', t, 2)
    equals: 9*deriv('exp(-(y - 3*t)**2)', 'y', 0.4, 2)
    samples: {t: [0.0, 0.1, 0.3]}
    tolerance: 1e-4
    shown: ['\Longrightarrow\quad \frac{\partial^2f}{\partial t^2} = v_p^2\,\frac{\partial^2f}{\partial x^2}']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: stretch
    kind: identity
    where: 'dx(√(1 + s²) − 1) ≈ ½ s² dx for small slope s'
    formula: sqrt(1 + s**2) - 1
    equals: 0.5*s**2
    samples: {s: [0.001, 0.01]}
    tolerance: 1e-4
    shown: ['dW \approx \frac T2\left(\frac{\partial\psi}{\partial x}\right)^2dx']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: example-speed
    where: '1/(1 + (x − 3t)⁴) has the form f(x − 3t): speed 3; ratio ψ_tt/ψ_xx = 9 at x = 0.5, t = 0.1'
    inputs: {}
    formula: deriv('1/(1 + (0.5 - 3*s)**4)', 's', 0.1, 2)/deriv('1/(1 + (y - 0.3)**4)', 'y', 0.5, 2)
    expected: '9'
    tolerance: 1e-3
    shown: ['travels to the right at speed 3']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: mit

  - id: half-speed
    where: 'v₂ = √(T/4ρ) = v₁/2 (T = ρ = 1)'
    inputs: {}
    formula: sqrt(1/4)/sqrt(1)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['v_2 = \sqrt{\frac{T}{4\rho_L}} = \frac{v_1}{2}']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: r-lecture
    where: 'R = (v₂ − v₁)/(v₂ + v₁) with v₂ = v₁/2'
    inputs: {}
    formula: (0.5 - 1)/(0.5 + 1)
    expected: '-0.3333'
    tolerance: 0.0001
    shown: ['so $R = -\frac13$ and $\tau = \frac23$']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: t-lecture
    where: 'τ = 2v₂/(v₁ + v₂) with v₂ = v₁/2'
    inputs: {}
    formula: 2*0.5/(1 + 0.5)
    expected: '0.6667'
    tolerance: 0.0001
    shown: ['so $R = -\frac13$ and $\tau = \frac23$']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: continuity
    kind: identity
    where: '1 + R = τ for all v₂ (v₁ = 1): the string is continuous'
    formula: 1 + (v - 1)/(v + 1)
    equals: 2*v/(1 + v)
    samples: {v: [0.2, 0.5, 3.0]}
    tolerance: 1e-12
    shown: ['f_r = Rf_i,\quad R = \frac{v_2 - v_1}{v_2 + v_1}']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: ex-speed
    where: 'example: 2x + 8t = 2(x + 4t): speed 8/2'
    inputs: {}
    formula: 8/2
    expected: '4'
    shown: ['it travels towards $-x$ at speed 4']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-v2
    where: 'example: v₂/v₁ = √(ρ₁/ρ₂) = √9'
    inputs: {}
    formula: sqrt(9)
    expected: '3'
    shown: ['so $v_2 = 3v_1$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-r
    where: 'example: (3 − 1)/(3 + 1)'
    inputs: {}
    formula: (3 - 1)/(3 + 1)
    expected: '0.5'
    shown: ['$R = (3 - 1)/(3 + 1) = \frac12$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-t
    where: 'example: 2·3/(1 + 3)'
    inputs: {}
    formula: 2*3/(1 + 3)
    expected: '1.5'
    shown: ['$\tau = 2 \cdot 3/(1 + 3) = \frac32$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-energy
    where: 'example: Z₁(1/2)² + (Z₁/3)(3/2)² = Z₁(0.25 + 0.75) (Z₁ = A = 1)'
    inputs: {}
    formula: 1*(0.5)**2 + (1/3)*(1.5)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['The sum is $Z_1A^2$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own
