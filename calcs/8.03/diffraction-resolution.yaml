# Calculations on content/year-2/8.03/diffraction-resolution.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 22 notes and transcript, with the page's own example.

page: content/year-2/8.03/diffraction-resolution.mdx
calcs:
  - id: slit-integral
    kind: identity
    where: '∫_{−D/2}^{D/2} e^(−ik_x x) dx = 2 sin(k_x D/2)/k_x (the imaginary part cancels; D = 1)'
    formula: integrate('cos(k*s)', 's', -0.5, 0.5)
    equals: 2*sin(k*0.5)/k
    samples: {k: [0.7, 3.0, 11.0]}
    tolerance: 1e-8
    shown: ['frac{2\sin(k_xD/2)}{k_x}" cite']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: method-one-limit
    kind: identity
    where: 'sin(Nδ/2)/(N sin(δ/2)) → sin β/β for large N at fixed β = Nδ/2 (N = 100000)'
    formula: sin(b)/(100000*sin(b/100000))
    equals: sin(b)/b
    samples: {b: [0.5, 2.0, 4.0]}
    tolerance: 1e-8
    shown: ['frac{\sin\beta}{\beta}\right]^2" cite']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: bessel-zero
    where: 'J₁(3.83) ≈ 0 using J₁(x) = (1/π)∫₀^π cos(τ − x sin τ) dτ'
    inputs: {}
    formula: integrate('cos(s - 3.8317*sin(s))', 's', 0, pi)/pi
    expected: '0'
    tolerance: 1e-4
    shown: ['sin\theta \approx 1.22\,\frac{\lambda}{D}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: bessel-factor
    where: '3.8317/π'
    inputs: {}
    formula: 3.8317/pi
    expected: '1.22'
    tolerance: 0.005
    shown: ['sin\theta \approx 1.22\,\frac{\lambda}{D}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: laser-wavelength
    where: 'λ = Dd/r = 0.16e-3 × 3.5e-2/7.6'
    inputs: {}
    formula: 0.16e-3*3.5e-2/7.6
    expected: '7.37e-7'
    tolerance: 0.005e-7
    shown: ['approx 7.37 \times 10^{-7}\ \text{m}" cite', '737 nm (a student']
    source: {cite: reading2, at: 'pp. 12–13'}
    origin: mit

  - id: notes-wavelength
    where: 'notes: r = 7.7 m gives 0.16e-3 × 3.5e-2/7.7 in nm'
    inputs: {}
    formula: 0.16e-3*3.5e-2/7.7*1e9
    expected: '727'
    tolerance: 0.5
    shown: ['and 727 nm']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: eye
    where: '1.22 × 500e-9/5e-3'
    inputs: {}
    formula: 1.22*500e-9/5e-3
    expected: '1.22e-4'
    tolerance: 1e-9
    shown: ['approx 1.22 \times 10^{-4}$. A phone']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: pixel
    where: '2.54 cm/401'
    inputs: {}
    formula: 2.54/401
    expected: '6.3e-3'
    tolerance: 0.05e-3
    shown: ['approx 6.3 \times 10^{-3}$ cm apart']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: pixel-angle
    where: '6.33e-3 cm/20 cm'
    inputs: {}
    formula: (2.54/401)/20
    expected: '3e-4'
    tolerance: 0.2e-4
    shown: ['$3 \times 10^{-4}$ apart']
    source: {cite: reading2, at: 'p. 17'}
    origin: mit

  - id: laser-angle
    where: '1.22 × 5e-7/1e-3'
    inputs: {}
    formula: 1.22*5e-7/1e-3
    expected: '6e-4'
    tolerance: 0.2e-4
    shown: ['approx 6 \times 10^{-4}$; over']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: moon-spot
    where: '6.1e-4 × 4e8 m in km'
    inputs: {}
    formula: 1.22*5e-7/1e-3*4e8/1000
    expected: '240'
    tolerance: 5
    shown: ['radius of about 240 km']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: ex-slit-angle
    where: 'example: 532e-9/1.0e-4'
    inputs: {}
    formula: 532e-9/1.0e-4
    expected: '5.32e-3'
    tolerance: 1e-9
    shown: ['= 5.32 \times 10^{-3}$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-slit-y
    where: 'example: 3.0 m × 5.32e-3 in cm'
    inputs: {}
    formula: 3.0*5.32e-3*100
    expected: '1.6'
    tolerance: 0.05
    shown: ['approx 1.6$ cm from']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-slit-width
    where: 'example: twice 1.6 cm'
    inputs: {}
    formula: 2*3.0*5.32e-3*100
    expected: '3.2'
    tolerance: 0.05
    shown: ['about 3.2 cm wide']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-headlights
    where: 'example: 1.5/1.22e-4 in m'
    inputs: {}
    formula: 1.5/1.22e-4
    expected: '1.2e4'
    tolerance: 0.05e4
    shown: ['approx 1.2 \times 10^4$ m, about 12 km']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-telescope
    where: 'example: 1.22 × 500e-9/2.4, and its ratio to the eye'
    inputs: {}
    formula: 1.22*500e-9/2.4
    expected: '2.5e-7'
    tolerance: 0.05e-7
    shown: ['approx 2.5 \times 10^{-7}$ rad, about 500 times']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-telescope-ratio
    where: 'example: 1.22e-4/2.54e-7'
    inputs: {}
    formula: 1.22e-4/(1.22*500e-9/2.4)
    expected: '480'
    tolerance: 30
    shown: ['approx 2.5 \times 10^{-7}$ rad, about 500 times']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ppi-20cm
    where: 'pixels per inch the eye resolves at 20 cm: 2.54 cm/(1.22e-4 × 20 cm)'
    inputs: {}
    formula: 2.54/(1.22e-4*20)
    expected: '1040'
    tolerance: 5
    shown: ['about 1,040 ppi at 20 cm']
    source: {cite: reading2, at: 'p. 18'}
    origin: page-own

  - id: ppi-10cm
    where: 'at 10 cm: 2.54/(1.22e-4 × 10)'
    inputs: {}
    formula: 2.54/(1.22e-4*10)
    expected: '2080'
    tolerance: 5
    shown: ['about 2,080 ppi at 10 cm']
    source: {cite: reading2, at: 'p. 18'}
    origin: page-own
