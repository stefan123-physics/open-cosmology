# Calculations on content/year-2/8.03/coupled-pendulums-beats.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 5 notes and transcript (Prof. Wyslouch), with the page's own example.

page: content/year-2/8.03/coupled-pendulums-beats.mdx
calcs:
  - id: roots
    kind: identity
    where: '(g/l + k/m − ω²)² − (k/m)² = (g/l − ω²)(g/l + 2k/m − ω²), with a = g/l, b = k/m, s = ω²'
    formula: (a + b - s)**2 - b**2
    equals: (a - s)*(a + 2*b - s)
    samples: {a: [1.0, 19.6, 3.0], b: [0.5, 2.0, 0.1], s: [0.3, 20.0, 2.0]}
    tolerance: 1e-9
    shown: ['\omega_1^2 = \frac{g}{l}, \qquad \omega_2^2 = \frac{g}{l} + \frac{2k}{m}']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: mode2-shape
    where: 'ω₂²: first row of (M⁻¹K − ω₂²I)(1, −1) = (−k/m)(1) + (−k/m)(−1)'
    inputs: {}
    formula: (-1)*1 + (-1)*(-1)
    expected: '0'
    shown: ['\omega_2:\ A^{(2)} = \begin{pmatrix} 1 \\ -1 \end{pmatrix}']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: sum-to-product
    kind: identity
    where: '(cos ω₁t + cos ω₂t)/2 = cos((ω₁+ω₂)t/2) cos((ω₁−ω₂)t/2)'
    formula: 0.5*(cos(4.4*t) + cos(4.9*t))
    equals: cos((4.4 + 4.9)*t/2)*cos((4.4 - 4.9)*t/2)
    samples: {t: [0.0, 0.7, 3.1]}
    tolerance: 1e-12
    shown: ['x_2 = x_0\cos\frac{(\omega_1 + \omega_2)t}{2}\cos\frac{(\omega_1 - \omega_2)t}{2}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: diff-to-product
    kind: identity
    where: '(cos ω₁t − cos ω₂t)/2 = −sin((ω₁+ω₂)t/2) sin((ω₁−ω₂)t/2)'
    formula: 0.5*(cos(4.4*t) - cos(4.9*t))
    equals: -sin((4.4 + 4.9)*t/2)*sin((4.4 - 4.9)*t/2)
    samples: {t: [0.0, 0.7, 3.1]}
    tolerance: 1e-12
    shown: ['x_1 = -x_0\sin\frac{(\omega_1 + \omega_2)t}{2}\sin\frac{(\omega_1 - \omega_2)t}{2}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: carrier-095
    where: 'ω₁ = 0.9ω₂: (ω₁ + ω₂)/2 = 0.95ω₂'
    inputs: {}
    formula: (0.9 + 1)/2
    expected: '0.95'
    tolerance: 1e-12
    shown: ['at about $0.95\,\omega_2$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: envelope-005
    where: '(ω₁ − ω₂)/2 = −0.05ω₂, a slow rate of 0.05ω₂'
    inputs: {}
    formula: (1 - 0.9)/2
    expected: '0.05'
    tolerance: 1e-12
    shown: ['at $0.05\,\omega_2$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: quiz-envelope
    where: 'quiz: (10.4 − 10.0)/2 and (10.0 + 10.4)/2'
    inputs: {}
    formula: (10.4 - 10.0)/2
    expected: '0.2'
    tolerance: 1e-12
    shown: ['Half the difference, $0.4/2 = 0.2$ rad/s']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-w1
    where: 'example: √(9.8/0.50)'
    inputs: {}
    formula: sqrt(9.8/0.50)
    expected: '4.43'
    tolerance: 0.005
    shown: ['so $\omega_1 \approx 4.43$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-w2
    where: 'example: √(19.6 + 2·0.40/0.20)'
    inputs: {}
    formula: sqrt(9.8/0.50 + 2*0.40/0.20)
    expected: '4.86'
    tolerance: 0.005
    shown: ['and $\omega_2 \approx 4.86$ rad/s']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-carrier
    where: 'example: (ω₁ + ω₂)/2'
    inputs: {}
    formula: (sqrt(19.6) + sqrt(23.6))/2
    expected: '4.64'
    tolerance: 0.005
    shown: ['Carrier $(\omega_1 + \omega_2)/2 \approx 4.64$ rad/s']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-transfer
    where: 'example: π/(ω₂ − ω₁)'
    inputs: {}
    formula: pi/(sqrt(23.6) - sqrt(19.6))
    expected: '7.3'
    tolerance: 0.05
    shown: ['\approx \pi/0.431 \approx 7.3$ s']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-diff
    where: 'example: ω₂ − ω₁ on Earth'
    inputs: {}
    formula: sqrt(23.6) - sqrt(19.6)
    expected: '0.431'
    tolerance: 0.0005
    shown: ['\approx \pi/0.431 \approx 7.3$ s']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-moon-w2
    where: 'example, Moon: √(1.62/0.50 + 4)'
    inputs: {}
    formula: sqrt(1.62/0.50 + 4)
    expected: '2.69'
    tolerance: 0.005
    shown: ['and $\omega_2 \approx 2.69$ rad/s']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-moon-transfer
    where: 'example, Moon: π/(ω₂ − ω₁) with ω₁ = 1.80'
    inputs: {}
    formula: pi/(sqrt(7.24) - sqrt(3.24))
    expected: '3.5'
    tolerance: 0.05
    shown: ['the transfer takes only $\pi/0.89 \approx 3.5$ s']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own
