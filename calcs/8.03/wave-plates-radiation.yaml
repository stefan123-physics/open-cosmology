# Calculations on content/year-2/8.03/wave-plates-radiation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 18 notes and transcript, with the page's own example.

page: content/year-2/8.03/wave-plates-radiation.mdx
calcs:
  - id: phase-difference
    kind: identity
    where: '2πl/λ_x − 2πl/λ_y with λ = 2πc/(nω) equals (n_x − n_y)ωl/c (c = 1)'
    formula: 2*pi*l/(2*pi/(nx*w)) - 2*pi*l/(2*pi/(ny*w))
    equals: (nx - ny)*w*l
    samples: {l: [1.0, 0.3], nx: [1.5, 1.2], ny: [1.4, 1.6], w: [2.0, 7.0]}
    tolerance: 1e-12
    shown: ['frac{n_x - n_y}{c}\,\omega l" cite']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: kink-ratio
    kind: identity
    where: '−a_⊥Δt·t/(cΔt) = −a_⊥r/c² with r = ct (c = 3)'
    formula: -a*dt*t/(3*dt)
    equals: -a*(3*t)/3**2
    samples: {a: [1.0, 5.0], dt: [0.01, 0.2], t: [2.0, 9.0]}
    tolerance: 1e-12
    shown: ['frac{-a_\perp r}{c^2}" cite']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: sphere-average
    where: '∫ sin²θ dΩ = 2π ∫ sin³θ dθ = 8π/3'
    inputs: {}
    formula: 2*pi*integrate('sin(s)**3', 's', 0, pi)
    expected: '8.3776'
    tolerance: 1e-4
    shown: ['gives $8\pi/3$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: larmor
    where: 'total power: ε₀c (q a/4πε₀c²)² × 8π/3 = q²a²/6πε₀c³; ratio to q²a²/(6πε₀c³) with q = a = c = ε₀ = 1'
    inputs: {}
    formula: (1/(4*pi))**2*(8*pi/3)/(1/(6*pi))
    expected: '1'
    tolerance: 1e-12
    shown: ['q^2a^2/6\pi\varepsilon_0c^3$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: thirty-degrees
    where: 'notes example at 30° from z: |ẑ − (√3/2)(½ŷ + (√3/2)ẑ)| = |(¼, −√3/4)| = ½'
    inputs: {}
    formula: sqrt((1 - 3/4)**2 + (sqrt(3)/4)**2)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['reduced to half, $\sin 30°$']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: ex-thickness
    where: 'example: l = λ/4Δn = 600e-9/(4 × 0.0090)'
    inputs: {}
    formula: 600e-9/(4*0.0090)
    expected: '1.7e-5'
    tolerance: 0.05e-5
    shown: ['0.036 \approx 1.7 \times 10^{-5}']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-field
    where: 'example: E = qa/(4πε₀c²r)'
    inputs: {}
    formula: 8.99e9*1.60e-19*1.0e15/(8.99e16*1.0)
    expected: '1.6e-11'
    tolerance: 0.05e-11
    shown: ['approx 1.6 \times 10^{-11}']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-field-30
    where: 'example: × sin 30°'
    inputs: {}
    formula: 8.99e9*1.60e-19*1.0e15/(8.99e16*1.0)*sin(pi/6)
    expected: '8.0e-12'
    tolerance: 0.05e-12
    shown: ['$8.0 \times 10^{-12}$ V/m']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
