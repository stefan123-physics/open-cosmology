# Calculations on content/year-2/8.03/damped-free-oscillators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 2 notes and transcript, with the page's own example.

page: content/year-2/8.03/damped-free-oscillators.mdx
calcs:
  - id: energy-constant
    kind: identity
    where: '½μA²ω₀² sin² + ½κA² cos² = ½κA² when ω₀² = κ/μ (μ = 2, κ = 8, A = 0.5)'
    formula: 0.5*2*0.5**2*(8/2)*sin(2*t + 0.3)**2 + 0.5*8*0.5**2*cos(2*t + 0.3)**2
    equals: 0.5*8*0.5**2 + 0*t
    samples: {t: [0.0, 0.7, 2.1]}
    tolerance: 1e-12
    shown: ['= \tfrac12\kappa A^2" cite']
    source: {cite: reading1, at: 'p. 2, eq. 2'}
    origin: mit

  - id: small-angle-1
    where: 'sin(1°)/(1° in radians)'
    inputs: {}
    formula: sin(pi/180)/(pi/180)
    expected: '0.9999'
    tolerance: 0.00005
    shown: ['= 0.9999\ (1°)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: small-angle-5
    where: 'sin(5°)/(5° in radians) = 0.99873'
    inputs: {}
    formula: sin(5*pi/180)/(5*pi/180)
    expected: '0.999'
    tolerance: 0.0005
    shown: ['0.999\ (5°)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: small-angle-10
    where: 'sin(10°)/(10° in radians) = 0.99493'
    inputs: {}
    formula: sin(10*pi/180)/(10*pi/180)
    expected: '0.995'
    tolerance: 0.0005
    shown: ['0.995\ (10°)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: rod-omega
    where: 'rod: (mgl/2)/(ml²/3) = 3g/(2l)'
    kind: identity
    formula: (m*g*l/2)/(m*l**2/3)
    equals: 3*g/(2*l)
    samples: {m: [0.4, 2.0], g: [9.8, 9.8], l: [0.5, 1.3]}
    tolerance: 1e-12
    shown: ['= -\frac{3g}{2l}\sin\theta']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: damped-roots
    kind: identity
    where: 'α = iγ/2 + w with w² = ω₀² − γ²/4 solves α² − iγα − ω₀² = 0: the real part, (w² − γ²/4) + γ²/2 − ω₀², vanishes (the imaginary part, wγ − γw, trivially)'
    formula: (w**2 - g2**2/4) + g2**2/2 - (w**2 + g2**2/4)
    equals: 0*w
    samples: {w: [1.0, 3.0], g2: [0.5, 2.0]}
    tolerance: 1e-12
    shown: ['\alpha = \frac{i\gamma}{2} \pm \sqrt{\omega_0^2 - \frac{\gamma^2}{4}}']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: underdamped-solves
    kind: identity
    where: 'e^(−γt/2) cos ωt with ω² = ω₀² − γ²/4 solves θ̈ + γθ̇ + ω₀²θ = 0 (γ = 0.6, ω₀ = 2)'
    formula: deriv('exp(-0.3*s)*cos(sqrt(4 - 0.09)*s)', 's', t, 2) + 0.6*deriv('exp(-0.3*s)*cos(sqrt(4 - 0.09)*s)', 's', t, 1) + 4*exp(-0.3*t)*cos(sqrt(4 - 0.09)*t)
    equals: 0*t
    samples: {t: [0.2, 1.0, 2.5]}
    tolerance: 1e-5
    shown: ['= Ae^{-\gamma t/2}\cos(\omega t + \phi), \qquad \omega = \sqrt{\omega_0^2 - \frac{\gamma^2}{4}}']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: critical-solves
    kind: identity
    where: 't e^(−γt/2) solves the equation when ω₀ = γ/2 (γ = 2, ω₀ = 1)'
    formula: deriv('s*exp(-s)', 's', t, 2) + 2*deriv('s*exp(-s)', 's', t, 1) + 1*t*exp(-t)
    equals: 0*t
    samples: {t: [0.2, 1.0, 2.5]}
    tolerance: 1e-5
    shown: ['\theta(t) = (A + Bt)\,e^{-\gamma t/2}']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: ex-omega0
    where: 'example: √(50/0.50)'
    inputs: {}
    formula: sqrt(50/0.50)
    expected: '10'
    tolerance: 1e-12
    shown: ['$\omega_0 = \sqrt{50/0.50} = 10$ rad/s']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-gamma
    where: 'example: γ = 1.0/0.50'
    inputs: {}
    formula: 1.0/0.50
    expected: '2.0'
    tolerance: 1e-12
    shown: ['$\gamma = 1.0/0.50 = 2.0$ s⁻¹']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-omega
    where: 'example: √(100 − 1)'
    inputs: {}
    formula: sqrt(100 - 2.0**2/4)
    expected: '9.95'
    tolerance: 0.005
    shown: ['$\omega = \sqrt{100 - 1} = \sqrt{99} \approx 9.95$ rad/s']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-half
    where: 'example: e^(−γt/2) = ½ with γ = 2: t = ln 2'
    inputs: {}
    formula: 2*log(2)/2.0
    expected: '0.69'
    tolerance: 0.005
    shown: ['$t = \ln 2 \approx 0.69$ s']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-period
    where: 'example: 2π/ω (the period, one full turn of ωt: the page''s own step)'
    inputs: {}
    formula: 2*pi/sqrt(99)
    expected: '0.63'
    tolerance: 0.005
    shown: ['($2\pi/\omega \approx 0.63$ s)']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-critical-b
    where: 'example: b = m·2ω₀ = 0.50·20'
    inputs: {}
    formula: 0.50*2*10
    expected: '10'
    tolerance: 1e-12
    shown: ['so $b = m\gamma = 0.50 \times 20 = 10$ kg/s']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
