# Calculations on content/year-2/8.03/dispersion-phase-group-velocity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 13 notes and transcript, with the page's own example.

page: content/year-2/8.03/dispersion-phase-group-velocity.mdx
calcs:
  - id: stiff-dispersion
    kind: identity
    where: 'ψ = cos(kx − ωt) in ψ_tt = v²(ψ_xx − αψ_xxxx): ω² = v²(k² + αk⁴). Check −ω²ψ = v²(−k² − αk⁴)ψ via derivatives in x; the fourth derivative as the second derivative of ψ_xx = −4 cos 2x (v = 1, k = 2, α = 0.1, x samples)'
    formula: deriv('cos(2*s)', 's', x, 2) - 0.1*deriv('-4*cos(2*s)', 's', x, 2)
    equals: -(4 + 0.1*16)*cos(2*x)
    samples: {x: [0.1, 0.5, 1.3]}
    tolerance: 1e-3
    shown: ['omega^2 = v^2(k^2 + \alpha k^4) \quad']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: sum-of-waves
    kind: identity
    where: 'sin a + sin b = 2 sin((a + b)/2) cos((a − b)/2), with a = k₁x − ω₁t, b = k₂x − ω₂t'
    formula: sin(a) + sin(b)
    equals: 2*sin((a + b)/2)*cos((a - b)/2)
    samples: {a: [0.3, 1.7, 4.0], b: [0.5, -0.9, 2.2]}
    tolerance: 1e-12
    shown: ['\cos\left(\frac{k_1 - k_2}{2}x - \frac{\omega_1 - \omega_2}{2}t\right)" cite']
    source: {cite: reading2, at: 'p. 11'}
    origin: mit

  - id: group-velocity-limit
    where: '(ω₁ − ω₂)/(k₁ − k₂) ≈ dω/dk for nearby k: stiff string v = 100, α = 1e-4, k = 20 ± 0.001'
    inputs: {}
    formula: (100*sqrt(20.001**2 + 1e-4*20.001**4) - 100*sqrt(19.999**2 + 1e-4*19.999**4))/0.002
    expected: '105.9'
    tolerance: 0.05
    shown: ['frac{\omega_1 - \omega_2}{k_1 - k_2} \approx']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-ak2
    where: 'example: αk² = 1e-4 × 20²'
    inputs: {}
    formula: 1e-4*20**2
    expected: '0.040'
    tolerance: 1e-12
    shown: ['= 0.040$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-vp
    where: 'example: v_p = 100 √1.04'
    inputs: {}
    formula: 100*sqrt(1 + 1e-4*20**2)
    expected: '102.0'
    tolerance: 0.05
    shown: ['100\sqrt{1.040} \approx 102.0']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-vg
    where: 'example: v_g = v(1 + 2αk²)/√(1 + αk²)'
    inputs: {}
    formula: 100*(1 + 2*0.04)/sqrt(1.04)
    expected: '105.9'
    tolerance: 0.05
    shown: ['1.0198 \approx 105.9']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-vg-deriv
    kind: identity
    where: 'dω/dk of ω = v√(k² + αk⁴) equals v(1 + 2αk²)/√(1 + αk²) (v = 100, α = 1e-4)'
    formula: deriv('100*sqrt(s**2 + 1e-4*s**4)', 's', k, 1)
    equals: 100*(1 + 2e-4*k**2)/sqrt(1 + 1e-4*k**2)
    samples: {k: [5.0, 20.0, 60.0]}
    tolerance: 1e-4
    shown: ['1.0198 \approx 105.9']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-ak1
    where: 'example: αk₁² = 1e-4 π²'
    inputs: {}
    formula: 1e-4*pi**2
    expected: '0.000987'
    tolerance: 5e-7
    shown: ['alpha k_1^2 = 0.000987']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-ak10
    where: 'example: αk₁₀² = 1e-4 (10π)²'
    inputs: {}
    formula: 1e-4*(10*pi)**2
    expected: '0.0987'
    tolerance: 5e-5
    shown: ['alpha k_{10}^2 = 0.0987']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-ratio
    where: 'example: ω₁₀/ω₁ = 10 √(1.0987/1.000987)'
    inputs: {}
    formula: 10*sqrt((1 + 1e-4*(10*pi)**2)/(1 + 1e-4*pi**2))
    expected: '10.48'
    tolerance: 0.005
    shown: ['approx 10.48']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: alpha-small
    kind: fact
    where: 'simulation stiffness settings quoted in the lecture'
    value: '0.02'
    shown: ['with $\alpha = 0.02$']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: alpha-large
    kind: fact
    where: 'larger simulation stiffness'
    value: '0.2'
    shown: ['$\alpha = 0.2$']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit
