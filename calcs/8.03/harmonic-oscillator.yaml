# Calculations on content/year-2/8.03/harmonic-oscillator.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 1 notes and transcript, with the page's own example.

page: content/year-2/8.03/harmonic-oscillator.mdx
calcs:
  - id: solution-check
    kind: identity
    where: 'x = a cos ωt + b sin ωt satisfies ẍ = −ω²x (ω = 3, a = 2, b = −1)'
    formula: deriv('2*cos(3*s) - sin(3*s)', 's', t, 2)
    equals: -9*(2*cos(3*t) - sin(3*t))
    samples: {t: [0.0, 0.4, 1.3]}
    tolerance: 1e-5
    shown: ['tex="x(t) = a\cos\omega t + b\sin\omega t"']
    source: {cite: reading1, at: 'p. 2, eq. 4'}
    origin: mit

  - id: phase-form
    kind: identity
    where: 'A cos(ωt + φ) = (A cos φ) cos ωt − (A sin φ) sin ωt'
    formula: 2.5*cos(t + 0.7)
    equals: 2.5*cos(0.7)*cos(t) - 2.5*sin(0.7)*sin(t)
    samples: {t: [0.0, 1.1, 2.9]}
    tolerance: 1e-12
    shown: ['$(A\cos\phi)\cos\omega t - (A\sin\phi)\sin\omega t$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: quiz-omega
    where: 'quiz: √(200/2.0)'
    inputs: {}
    formula: sqrt(200/2.0)
    expected: '10'
    tolerance: 1e-12
    shown: ['$\\omega = \\sqrt{k/m} = \\sqrt{200/2.0} = \\sqrt{100} = 10$ rad/s.']
    source: {cite: reading1, at: 'p. 2, eq. 3'}
    origin: page-own

  - id: ex-omega
    where: 'example: ω = √(100/0.25)'
    inputs: {}
    formula: sqrt(100/0.25)
    expected: '20'
    tolerance: 1e-9
    shown: ['$\omega = \sqrt{k/m} = \sqrt{100/0.25} = \sqrt{400} = 20$ rad/s']
    source: {cite: reading1, at: 'p. 2, eq. 3'}
    origin: page-own

  - id: ex-period
    where: 'example: T = 2π/ω (one full turn of ωt; the page''s own step from the cosine in eq. 6)'
    inputs: {}
    formula: 2*pi/20
    expected: '0.314'
    tolerance: 0.0005
    shown: ['Period $T = 2\pi/\omega = 2\pi/20 \approx 0.314$ s']
    source: {cite: reading1, at: 'p. 2, eq. 6'}
    origin: page-own

  - id: ex-b
    where: 'example: b = v₀/ω = 0.80/20'
    inputs: {}
    formula: 0.80/20
    expected: '0.040'
    tolerance: 1e-12
    shown: ['so $b = 0.80/20 = 0.040$ m']
    source: {cite: reading1, at: 'p. 2, eq. 5'}
    origin: page-own

  - id: ex-amplitude
    where: 'example: A = √(0.030² + 0.040²)'
    inputs: {}
    formula: sqrt(0.030**2 + 0.040**2)
    expected: '0.050'
    tolerance: 1e-12
    shown: ['= \sqrt{0.030^2 + 0.040^2} = 0.050$ m']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
