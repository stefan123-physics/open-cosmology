  - id: p4-q
    kind: identity
    answer: p4-q
    where: 'Problem 4(e), answer box: q against the numerical solve of dx/dt = 0 at t = 0 for the complete solution'
    formula: (k*D/m)*w*(b**2/(2*m**2) - (2*k/m - w**2))/(((2*k/m - w**2)**2 + (b*w/m)**2)*sqrt(2*k/m - b**2/(4*m**2)))
    equals: solve('deriv("exp(-b*u/(2*m))*((k*D/m)*(b/m)*w/((2*k/m - w**2)**2 + (b*w/m)**2)*cos(sqrt(2*k/m - b**2/(4*m**2))*u) + x*sin(sqrt(2*k/m - b**2/(4*m**2))*u)) + k*D/m/sqrt((2*k/m - w**2)**2 + (b*w/m)**2)*sin(w*u - atan(b*w/(2*k - m*w**2)))", "u", 0)', 'x', -10, 10)
    samples:
      k: [2, 3, 1.5, 1, 4]
      m: [1, 0.5, 1, 0.5, 2]
      b: [0.2, 0.5, 0.1, 0.6, 0.3]
      w: [0.7, 1.2, 0.9, 1.1, 0.5]
