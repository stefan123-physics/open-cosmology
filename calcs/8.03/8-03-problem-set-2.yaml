  # The same amplitude and phase as a residual of the equation of motion, away from the special moment.
  - id: p4-driven-equation
    kind: identity
    where: 'Problem 4(c), the formula "Amplitude and phase on the air track" gives x = A sin(wt - delta) as a solution of the equation of motion'
    formula: m*deriv('k*D/m/sqrt((2*k/m - w**2)**2 + (b*w/m)**2)*sin(w*x - atan(b*w/(2*k - m*w**2)))', 'x', t0, 2) + b*deriv('k*D/m/sqrt((2*k/m - w**2)**2 + (b*w/m)**2)*sin(w*x - atan(b*w/(2*k - m*w**2)))', 'x', t0) + 2*k*k*D/m/sqrt((2*k/m - w**2)**2 + (b*w/m)**2)*sin(w*t0 - atan(b*w/(2*k - m*w**2)))
    equals: k*D*sin(w*t0)
    samples:
      k: [2, 3, 1.5, 1, 4]
      m: [1, 0.5, 1, 0.5, 2]
      b: [0.2, 0.5, 0.1, 0.6, 0.3]
