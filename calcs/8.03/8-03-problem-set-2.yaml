    answer: p4-amp
    where: 'Problem 4(c), answer box: against the solution of the equation of motion at the peak of the drive, with the phase from tan(delta)'
    formula: k*D/m/sqrt((2*k/m - w**2)**2 + (b*w/m)**2)
    equals: solve('(2*k - m*w**2)*x*cos(atan(b*w/(2*k - m*w**2))) + b*w*x*sin(atan(b*w/(2*k - m*w**2))) - k*D', 'x', 0, 1000)
