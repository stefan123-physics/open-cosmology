# Calculations on content/year-2/8.03/coupled-oscillators-normal-modes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 4 notes and transcript, with the page's own example.

page: content/year-2/8.03/coupled-oscillators-normal-modes.mdx
calcs:
  - id: mode-b-omega
    where: 'centre against both ends: force −2k·2Δx on mass 2m: ω² = 4k/2m = 2k/m (k = m = 1)'
    inputs: {}
    formula: (2*2)/2
    expected: '2'
    shown: ['so $\omega^2 = 4k/2m = 2k/m$ (pp. 4–5)']
    source: {cite: reading2, at: 'pp. 4–5'}
    origin: mit

  - id: char-poly
    kind: identity
    where: 'det(M⁻¹K − ω²I) with ω₀² = 1, ω² = s: (1 − s)³ − ½(1 − s) − ½(1 − s) = (1 − s)·s·(s − 2)'
    formula: (1 - s)**3 - 0.5*(1 - s) - 0.5*(1 - s)
    equals: (1 - s)*s*(s - 2)
    samples: {s: [-0.5, 0.3, 1.7, 3.0]}
    tolerance: 1e-12
    shown: ['(\omega_0^2 - \omega^2)^3 - \omega_0^4(\omega_0^2 - \omega^2) = (\omega_0^2 - \omega^2)\,\omega^2\,(\omega^2 - 2\omega_0^2) = 0']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: det-direct
    kind: identity
    where: 'cofactor expansion of the 3 × 3 determinant with rows (1 − s, −½, −½), (−1, 1 − s, 0), (−1, 0, 1 − s) equals (1 − s)s(s − 2)'
    formula: (1 - s)*((1 - s)**2) - (-0.5)*((-1)*(1 - s) - 0) + (-0.5)*(0 - (1 - s)*(-1))
    equals: (1 - s)*s*(s - 2)
    samples: {s: [-0.5, 0.3, 1.7, 3.0]}
    tolerance: 1e-12
    shown: ['its determinant factors']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: mode-b-amplitudes
    where: 'ω² = 2k/m, first row of (M⁻¹K − ω²I)A with A = (1, −1, −1), k = m = 1: (1 − 2)·1 − ½(−1) − ½(−1)'
    inputs: {}
    formula: (1 - 2)*1 - 0.5*(-1) - 0.5*(-1)
    expected: '0'
    tolerance: 1e-12
    shown: ['$A_1 = -A_2 = -A_3$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: ex-roots
    kind: identity
    where: 'example: (2 − s)(½ − s) − ½ = s² − 5s/2 + ½'
    formula: (2 - s)*(0.5 - s) - 0.5
    equals: s**2 - 2.5*s + 0.5
    samples: {s: [0.0, 1.0, 3.0]}
    tolerance: 1e-12
    shown: ['= s^2 - \frac52s + \frac12 = 0']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-s-big
    where: 'example: s = (5/2 + √(17/4))/2'
    inputs: {}
    formula: (2.5 + sqrt(17/4))/2
    expected: '2.281'
    tolerance: 0.0005
    shown: ['\approx 2.281$ or $0.219$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-s-small
    where: 'example: s = (5/2 − √(17/4))/2'
    inputs: {}
    formula: (2.5 - sqrt(17/4))/2
    expected: '0.219'
    tolerance: 0.0005
    shown: ['\approx 2.281$ or $0.219$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-w-big
    where: 'example: √2.281'
    inputs: {}
    formula: sqrt((2.5 + sqrt(17/4))/2)
    expected: '1.510'
    tolerance: 0.0005
    shown: ['$\omega \approx 1.510\,\omega_0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-w-small
    where: 'example: √0.219'
    inputs: {}
    formula: sqrt((2.5 - sqrt(17/4))/2)
    expected: '0.468'
    tolerance: 0.0005
    shown: ['and $0.468\,\omega_0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-ratio-slow
    where: 'example: A₂/A₁ = 2 − s for the slow mode'
    inputs: {}
    formula: 2 - (2.5 - sqrt(17/4))/2
    expected: '1.78'
    tolerance: 0.005
    shown: ['$A_2 \approx 1.78A_1$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-ratio-fast
    where: 'example: A₂/A₁ = 2 − s for the fast mode'
    inputs: {}
    formula: 2 - (2.5 + sqrt(17/4))/2
    expected: '-0.28'
    tolerance: 0.005
    shown: ['$A_2 \approx -0.28A_1$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-second-row
    where: 'example: second row check for the slow mode, −½·1 + (½ − s)(2 − s) = 0'
    inputs: {}
    formula: -0.5 + (0.5 - (2.5 - sqrt(17/4))/2)*(2 - (2.5 - sqrt(17/4))/2)
    expected: '0'
    tolerance: 1e-9
    shown: ['both masses moving together, the heavy one more']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
