# Calculations on content/year-2/8.03/phased-radar-electron-interference.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 21 notes and transcript, with the page's own example.

page: content/year-2/8.03/phased-radar-electron-interference.mdx
calcs:
  - id: two-slit
    kind: identity
    where: '|1 + e^(−iδ)|² = 2 + 2cos δ = 4cos²(δ/2)'
    formula: (1 + cos(x))**2 + sin(x)**2
    equals: 4*cos(x/2)**2
    samples: {x: [0.3, 1.7, 3.0]}
    tolerance: 1e-12
    shown: ['hat z, \qquad \langle I\rangle \propto']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: n-slit
    kind: identity
    where: '|Σ e^(−imδ)|² for N = 5 equals [sin(5δ/2)/sin(δ/2)]²: real and imaginary parts summed explicitly'
    formula: (1 + cos(x) + cos(2*x) + cos(3*x) + cos(4*x))**2 + (sin(x) + sin(2*x) + sin(3*x) + sin(4*x))**2
    equals: (sin(5*x/2)/sin(x/2))**2
    samples: {x: [0.3, 1.1, 2.5]}
    tolerance: 1e-9
    shown: ['frac{\sin(N\delta/2)}{\sin(\delta/2)}\right]^2" cite']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: first-zero
    where: 'sin(Nδ/2) = 0 at δ = 2π/N (N = 4): sin(4·(π/2)/2)'
    inputs: {}
    formula: sin(4*(2*pi/4)/2)
    expected: '0'
    tolerance: 1e-12
    shown: ['delta = 2\pi/4 = \pi/2$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: peak-width
    where: 'principal maximum from −2π/N to +2π/N: width 4π/N (N = 7)'
    inputs: {}
    formula: 2*(2*pi/7)/(pi/7)
    expected: '4'
    tolerance: 1e-12
    shown: ['width $4\pi/N$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: beam-width
    kind: identity
    where: '(2π/λ)d sin θ = 2π/N gives sin θ = λ/(Nd)'
    formula: (2*pi/l)*d*(l/(n*d))
    equals: 2*pi/n
    samples: {l: [1.0, 0.03], d: [0.5, 0.2], n: [8, 20]}
    tolerance: 1e-12
    shown: ['sin\theta = \frac{\lambda}{Nd}" cite']
    source: {cite: reading2, at: 'p. 15'}
    origin: mit

  - id: ex-beam
    where: 'example: sin θ = 1/(8 × 0.5), θ in degrees'
    inputs: {}
    formula: asin(1/(8*0.5))*180/pi
    expected: '14.5'
    tolerance: 0.05
    shown: ['0.5) = 0.25$, so $\theta \approx 14.5°']
    source: {cite: reading2, at: 'p. 15'}
    origin: page-own

  - id: ex-steer
    where: 'example: φ = 2πd sin θ/λ with d = λ/2, θ = 30°'
    inputs: {}
    formula: 2*pi*0.5*sin(pi/6)/(pi/2)
    expected: '1'
    tolerance: 1e-12
    shown: ['needs $\phi = \pi/2$']
    source: {cite: reading2, at: 'p. 16'}
    origin: page-own

  - id: ex-fringes
    where: 'example: Lλ/d = 2.0 × 633e-9/2.5e-4'
    inputs: {}
    formula: 2.0*633e-9/2.5e-4
    expected: '5.1e-3'
    tolerance: 0.05e-3
    shown: ['approx 5.1 \times 10^{-3}']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own
