# Calculations on content/year-2/8.03/quantum-and-gravitational-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 23 notes and transcript, with the page's own example.

page: content/year-2/8.03/quantum-and-gravitational-waves.mdx
calcs:
  - id: two-path
    kind: identity
    where: '|a + b e^(iδ)|² = a² + b² + 2ab cos δ, with I₁ = a², I₂ = b²'
    formula: (a + b*cos(x))**2 + (b*sin(x))**2
    equals: a**2 + b**2 + 2*sqrt(a**2*b**2)*cos(x)
    samples: {a: [1.0, 0.7], b: [0.5, 1.2], x: [0.4, 2.5]}
    tolerance: 1e-12
    shown: ['2\sqrt{I_1I_2}\cos\delta" cite']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: schrodinger-dispersion
    kind: identity
    where: 'ψ = sin(kx)e^(−iωt) in iħψ_t = −(ħ²/2m)ψ_xx (ħ = m = 1, k = 3): iħ(−iω) = ħ²k²/2m, i.e. ω = k²/2; check ψ_xx = −k²ψ at x samples'
    formula: deriv('sin(3*s)', 's', x, 2)
    equals: -9*sin(3*x)
    samples: {x: [0.2, 0.9, 1.7]}
    tolerance: 1e-4
    shown: ['frac{\hbar k}{m} = \frac{p}{m}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: group-velocity
    kind: identity
    where: 'd/dk (ħk²/2m) = ħk/m (ħ = 1, m = 2)'
    formula: deriv('s**2/4', 's', k, 1)
    equals: k/2
    samples: {k: [0.5, 2.0, 7.0]}
    tolerance: 1e-6
    shown: ['frac{\hbar k}{m} = \frac{p}{m}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: ligo-masses
    kind: fact
    where: 'black-hole masses of GW150914 quoted in the lecture'
    value: '29 and 36 solar masses'
    shown: ['29 and 36 solar masses about 1.3 billion']
    source: {cite: reading2, at: 'p. 18'}
    origin: mit

  - id: ligo-arms
    kind: fact
    where: 'LIGO arm length quoted in the lecture'
    value: '4 km'
    shown: ['perpendicular arms 4 km long']
    source: {cite: reading2, at: 'p. 17'}
    origin: mit

  - id: ligo-separation
    kind: fact
    where: 'distance between the LIGO sites quoted in the lecture'
    value: '3000 km'
    shown: ['about 3,000 km apart, guard']
    source: {cite: reading2, at: 'p. 17'}
    origin: mit

  - id: nobel
    kind: fact
    where: 'year of Einstein''s Nobel Prize, as quoted'
    value: '1921'
    shown: ['Nobel Prize of 1921']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: ex-box-joule
    where: 'example: ħ²π²/(2mL²) with L = 1.0e-9 m'
    inputs: {}
    formula: (1.055e-34)**2*pi**2/(2*9.11e-31*1.0e-18)
    expected: '6.0e-20'
    tolerance: 0.05e-20
    shown: ['approx 6.0 \times 10^{-20}$ J, about $0.38$ eV']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-box-ev
    where: 'example: in eV'
    inputs: {}
    formula: (1.055e-34)**2*pi**2/(2*9.11e-31*1.0e-18)/1.602e-19
    expected: '0.38'
    tolerance: 0.005
    shown: ['approx 6.0 \times 10^{-20}$ J, about $0.38$ eV']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-ratio
    where: 'example: ω ∝ k², k₂ = 2k₁'
    inputs: {}
    formula: (2*pi)**2/pi**2
    expected: '4'
    tolerance: 1e-12
    shown: ['omega_2/\omega_1 = 4$']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own

  - id: ex-debroglie
    where: 'example: h/(mv) with v = 1.0e6 m/s'
    inputs: {}
    formula: 6.63e-34/(9.11e-31*1.0e6)
    expected: '7.3e-10'
    tolerance: 0.05e-10
    shown: ['approx 7.3 \times 10^{-10}$ m']
    source: {cite: reading1, at: 'p. 6'}
    origin: page-own
