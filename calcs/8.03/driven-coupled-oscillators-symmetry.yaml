# Calculations on content/year-2/8.03/driven-coupled-oscillators-symmetry.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 6 notes and transcript (Prof. Wyslouch), with the page's own example.

page: content/year-2/8.03/driven-coupled-oscillators-symmetry.mdx
calcs:
  - id: compact-det
    kind: identity
    where: 'det(M⁻¹K − ω²I) = (a + b − s)² − b² = (s − a)(s − a − 2b), a = g/l, b = k/m, s = ω²'
    formula: (a + b - s)**2 - b**2
    equals: (s - a)*(s - a - 2*b)
    samples: {a: [19.6, 3.0, 1.0], b: [2.0, 0.5, 0.1], s: [16.0, 2.0, 5.0]}
    tolerance: 1e-9
    shown: ['\det(M^{-1}K - \omega^2I) = (\omega^2 - \omega_1^2)(\omega^2 - \omega_2^2)']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: cramer-b1
    kind: identity
    where: 'Cramer: B₁ = det[(F, −b); (0, c)]/det E with c = a + b − s, F = F₀/m; check E·B = (F, 0), first row c·B₁ − b·B₂ = F'
    formula: (a + b - s)*(f*(a + b - s)/((s - a)*(s - a - 2*b))) - b*(f*b/((s - a)*(s - a - 2*b)))
    equals: f + 0*s
    samples: {a: [19.6, 3.0], b: [2.0, 0.5], s: [16.0, 5.0], f: [0.1, 1.0]}
    tolerance: 1e-9
    shown: ['B_1 = \frac{\frac{F_0}{m}\left(\frac km + \frac gl - \omega_d^2\right)}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: cramer-b2
    kind: identity
    where: 'second row: −b·B₁ + c·B₂ = 0'
    formula: -b*(f*(a + b - s)/((s - a)*(s - a - 2*b))) + (a + b - s)*(f*b/((s - a)*(s - a - 2*b)))
    equals: 0*s
    samples: {a: [19.6, 3.0], b: [2.0, 0.5], s: [16.0, 5.0], f: [0.1, 1.0]}
    tolerance: 1e-9
    shown: ['B_2 = \frac{\frac{F_0}{m}\,\frac km}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ratio-mode1
    where: 'B₁/B₂ at ω_d² = g/l: (b + a − a)/b'
    inputs: {}
    formula: (2.0 + 19.6 - 19.6)/2.0
    expected: '1'
    tolerance: 1e-12
    shown: ['$\omega_d^2 = \omega_1^2 = g/l$ it is $+1$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ratio-mode2
    where: 'B₁/B₂ at ω_d² = g/l + 2k/m: (b + a − a − 2b)/b'
    inputs: {}
    formula: (2.0 + 19.6 - (19.6 + 2*2.0))/2.0
    expected: '-1'
    tolerance: 1e-12
    shown: ['it is $-1$, the shape of the opposite-phase mode']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: s-eig1
    where: 'S(1, 1) = (−1, −1): first component 0·1 + (−1)·1'
    inputs: {}
    formula: 0*1 + (-1)*1
    expected: '-1'
    shown: ['S\begin{pmatrix} 1 \\ 1 \end{pmatrix} = -\begin{pmatrix} 1 \\ 1 \end{pmatrix}']
    source: {cite: reading2, at: 'p. 21'}
    origin: mit

  - id: s-eig2
    where: 'S(1, −1): first component 0·1 + (−1)(−1) = 1'
    inputs: {}
    formula: 0*1 + (-1)*(-1)
    expected: '1'
    shown: ['S\begin{pmatrix} 1 \\ -1 \end{pmatrix} = +\begin{pmatrix} 1 \\ -1 \end{pmatrix}']
    source: {cite: reading2, at: 'pp. 21–22'}
    origin: mit

  - id: s-eig2-second
    where: 'S(1, −1): second component (−1)(1) + 0·(−1) = −1'
    inputs: {}
    formula: (-1)*1 + 0*(-1)
    expected: '-1'
    shown: ['S\begin{pmatrix} 1 \\ -1 \end{pmatrix} = +\begin{pmatrix} 1 \\ -1 \end{pmatrix}']
    source: {cite: reading2, at: 'pp. 21–22'}
    origin: mit

  - id: ex-den-16
    where: 'example: (16 − 19.6)(16 − 23.6)'
    inputs: {}
    formula: (16 - 19.6)*(16 - 23.6)
    expected: '27.36'
    tolerance: 1e-9
    shown: ['$(16 - 19.6)(16 - 23.6) = (-3.6)(-7.6) = 27.36$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-b1-16
    where: 'example: B₁ = 0.10·5.6/27.36'
    inputs: {}
    formula: 0.10*(2.0 + 19.6 - 16)/27.36
    expected: '0.020'
    tolerance: 0.0005
    shown: ['= 0.56/27.36 \approx 0.020$ m']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-b2-16
    where: 'example: B₂ = 0.10·2.0/27.36'
    inputs: {}
    formula: 0.10*2.0/27.36
    expected: '0.0073'
    tolerance: 0.00005
    shown: ['\approx 0.0073$ m']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-ratio-16
    where: 'example: B₁/B₂ = 5.6/2.0'
    inputs: {}
    formula: (2.0 + 19.6 - 16)/2.0
    expected: '2.8'
    tolerance: 1e-9
    shown: ['the driven mass moves about three times as much']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-den-216
    where: 'example: (21.6 − 19.6)(21.6 − 23.6)'
    inputs: {}
    formula: (21.6 - 19.6)*(21.6 - 23.6)
    expected: '-4.0'
    tolerance: 1e-9
    shown: ['the denominator is $(2.0)(-2.0) = -4.0$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-b2-216
    where: 'example: B₂ = 0.10·2.0/(−4.0)'
    inputs: {}
    formula: 0.10*2.0/(-4.0)
    expected: '-0.050'
    tolerance: 1e-9
    shown: ['$B_2 = 0.10 \cdot 2.0/(-4.0) = -0.050$ m']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-cancel
    where: 'example: force of the spring on mass 1, k(x₂ − x₁)/m with x₁ = 0, x₂ = −0.050: 2.0·(−0.050) = −0.10, cancelling F₀/m = 0.10'
    inputs: {}
    formula: 2.0*(-0.050) + 0.10
    expected: '0'
    tolerance: 1e-12
    shown: ['so that its spring exactly cancels the drive on the first']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own
