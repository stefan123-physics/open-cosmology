# Calculations on content/year-2/8.03/standing-waves-fourier-series.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 9 notes and transcript, with the page's own example.

page: content/year-2/8.03/standing-waves-fourier-series.mdx
calcs:
  - id: small-ka
    where: '(4T/ma) sin²(ka/2) ≈ (T/(m/a)) k² for small ka: ratio at ka = 0.01 (T = m = a = k-scale 1)'
    inputs: {}
    formula: (4*sin(0.01/2)**2)/(0.01**2)
    expected: '1'
    tolerance: 1e-4
    shown: ['\approx \frac{4T}{ma}\left(\frac{ka}{2}\right)^2 = \frac{T}{\rho_L}k^2']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: mode-solves
    kind: identity
    where: 'sin(ωt + β) sin(kx) with ω = v k solves ψ_tt = v² ψ_xx (v = 3, k = 2, β = 0.4), at x = 0.7'
    formula: deriv('sin(6*s + 0.4)*sin(2*0.7)', 's', t, 2)
    equals: 9*sin(6*t + 0.4)*(-4)*sin(2*0.7)
    samples: {t: [0.0, 0.3, 1.1]}
    tolerance: 1e-4
    shown: ['\psi_m(x, t) = A_m\sin(\omega_mt + \beta_m)\sin(k_mx + \alpha_m)']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: free-end
    where: 'cos(k_m L) = 0 for k_m = (2m − 1)π/2L: m = 3'
    inputs: {}
    formula: cos(5*pi/2)
    expected: '0'
    tolerance: 1e-12
    shown: ['k_m = \frac{(2m - 1)\pi}{2L}, \quad m = 1, 2, 3, \dots']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: lambda1
    where: 'λ₁ = 2π/k₁ = 2π·2L/π = 4L (L = 1)'
    inputs: {}
    formula: 2*pi/(pi/2)
    expected: '4'
    tolerance: 1e-12
    shown: ['\lambda_1 = 4L']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: lambda2
    where: 'λ₂ = 2π/(3π/2L) = 4L/3 (L = 1)'
    inputs: {}
    formula: 2*pi/(3*pi/2)
    expected: '1.3333'
    tolerance: 0.0001
    shown: ['\lambda_2 = \frac{4L}{3}']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: orthogonality
    where: '∫₀ᴸ sin(k₁x) sin(k₂x) dx = 0 and ∫₀ᴸ sin²(k₁x) dx = L/2 (L = 1): sum'
    inputs: {}
    formula: integrate("sin(pi*x/2)*sin(3*pi*x/2)", "x", 0, 1) + integrate("sin(pi*x/2)**2", "x", 0, 1)
    expected: '0.5'
    tolerance: 1e-9
    shown: ['L/2 & m = n \\ 0 & m \neq n']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: step-coefficient
    where: 'A₁ for the step (L = 1, h = 1): (2/L)∫_{L/2}^{L} h sin(k₁x) dx equals −(2h/Lk₁)[cos k₁L − cos(k₁L/2)]'
    inputs: {}
    formula: 2*integrate("sin(pi*x/2)", "x", 0.5, 1) + (2/(pi/2))*(cos(pi/2) - cos(pi/4))
    expected: '0'
    tolerance: 1e-9
    shown: ['= -\frac{2h}{Lk_m}\left[\cos(k_mL) - \cos\frac{k_mL}{2}\right]']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: ex-f1
    where: 'example: f₁ = v_p/4L = 40/4'
    inputs: {}
    formula: 40/4
    expected: '10'
    shown: ['$f_1 = 40/4 = 10$ Hz']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-f3
    where: 'example: f₃ = 5·40/4'
    inputs: {}
    formula: 5*40/4
    expected: '50'
    shown: ['$f_3 = 50$ Hz']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-a1-integral
    where: 'example: A₁ = (2/L)∫₀ᴸ (x/L) sin(πx/2L) dx = 8/π² (h = L = 1)'
    inputs: {}
    formula: 2*integrate("x*sin(pi*x/2)", "x", 0, 1) - 8/pi**2
    expected: '0'
    tolerance: 1e-9
    shown: ['= \frac{8h(-1)^{m+1}}{(2m - 1)^2\pi^2}$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-a1
    where: 'example: 8/π²'
    inputs: {}
    formula: 8/pi**2
    expected: '0.811'
    tolerance: 0.0005
    shown: ['$A_1 \approx 0.811h$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-a2
    where: 'example: −8/(9π²)'
    inputs: {}
    formula: -8/(9*pi**2)
    expected: '-0.090'
    tolerance: 0.0005
    shown: ['$A_2 \approx -0.090h$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-a3
    where: 'example: 8/(25π²)'
    inputs: {}
    formula: 8/(25*pi**2)
    expected: '0.032'
    tolerance: 0.0005
    shown: ['$A_3 \approx 0.032h$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-sum
    where: 'example: 1 + 1/9 + 1/25 + … = π²/8, checked as ∫₀¹ artanh(x)/x dx = Σ ∫₀¹ x^(2m−2)/(2m − 1) dx'
    inputs: {}
    formula: integrate("0.5*log((1 + x)/(1 - x))/x", "x", 0, 1) - pi**2/8
    expected: '0'
    tolerance: 0.0002
    shown: ['= \frac{8h}{\pi^2} \cdot \frac{\pi^2}{8} = h$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
