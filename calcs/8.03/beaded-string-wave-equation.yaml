# Calculations on content/year-2/8.03/beaded-string-wave-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 8 notes and transcript, with the page's own example.

page: content/year-2/8.03/beaded-string-wave-equation.mdx
calcs:
  - id: half-angle
    kind: identity
    where: '2(1 − cos ka) = 4 sin²(ka/2), x = ka'
    formula: 2*(1 - cos(x))
    equals: 4*sin(x/2)**2
    samples: {x: [0.3, 1.2, 3.0]}
    tolerance: 1e-12
    shown: ['= 2\omega_0^2(1 - \cos ka) = 4\omega_0^2\sin^2\frac{ka}{2}']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: fixed-end-mode
    kind: identity
    where: 'sin(jka) with ka = nπ/(N + 1) vanishes at j = N + 1 (N = 4, n = 3, j as x)'
    formula: sin(5*3*pi/5) + 0*x
    equals: 0*x
    samples: {x: [1.0]}
    tolerance: 1e-12
    shown: ['ka = \frac{n\pi}{N + 1}, \qquad n = 1, 2, \dots, N']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: taylor
    kind: identity
    where: '−A(x − a) + 2A(x) − A(x + a) ≈ −a²A″(x) for A = sin x, a = 0.01'
    formula: -sin(x - 0.01) + 2*sin(x) - sin(x + 0.01)
    equals: 0.01**2*sin(x)
    samples: {x: [0.3, 1.0, 2.0]}
    tolerance: 1e-4
    shown: ['leaving $-a^2A''''(x)$ plus higher-order terms']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: quiz-vp
    where: 'quiz: √(72/0.020)'
    inputs: {}
    formula: sqrt(72/0.020)
    expected: '60'
    tolerance: 1e-9
    shown: ['= \\sqrt{3600} = 60$ m/s.']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-w1
    where: 'example: 2 sin(π/8)'
    inputs: {}
    formula: 2*sin(pi/8)
    expected: '0.765'
    tolerance: 0.0005
    shown: ['$\omega_1 \approx 0.765\,\omega_0$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: ex-w2
    where: 'example: 2 sin(π/4) = √2'
    inputs: {}
    formula: 2*sin(pi/4)
    expected: '1.414'
    tolerance: 0.0005
    shown: ['$\omega_2 = \sqrt2\,\omega_0 \approx 1.414\,\omega_0$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: ex-w3
    where: 'example: 2 sin(3π/8)'
    inputs: {}
    formula: 2*sin(3*pi/8)
    expected: '1.848'
    tolerance: 0.0005
    shown: ['$\omega_3 \approx 1.848\,\omega_0$']
    source: {cite: reading1, at: 'pp. 3–4'}
    origin: page-own

  - id: ex-shape1
    where: 'example: sin(π/4)'
    inputs: {}
    formula: sin(pi/4)
    expected: '0.707'
    tolerance: 0.0005
    shown: ['Mode 1: $(0.707, 1, 0.707)$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-shape2-mid
    where: 'example: mode 2, middle bead sin(2·2π/4) = sin π'
    inputs: {}
    formula: sin(2*2*pi/4)
    expected: '0'
    tolerance: 1e-12
    shown: ['Mode 2: $(1, 0, -1)$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-shape3-mid
    where: 'example: mode 3, middle bead sin(2·3π/4)'
    inputs: {}
    formula: sin(2*3*pi/4)
    expected: '-1'
    tolerance: 1e-12
    shown: ['Mode 3: $(0.707, -1, 0.707)$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-vp
    where: 'example: √(50/0.020)'
    inputs: {}
    formula: sqrt(50/0.020)
    expected: '50'
    tolerance: 1e-9
    shown: ['$v_p = \sqrt{50/0.020} = \sqrt{2500} = 50$ m/s']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-k
    where: 'example: 2π/0.50'
    inputs: {}
    formula: 2*pi/0.50
    expected: '12.6'
    tolerance: 0.05
    shown: ['$k = 2\pi/0.50 \approx 12.6$ m⁻¹']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-omega
    where: 'example: ω = v_p k = 50·2π/0.50'
    inputs: {}
    formula: 50*2*pi/0.50
    expected: '628'
    tolerance: 0.5
    shown: ['$\omega = v_pk \approx 628$ rad/s']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-f
    where: 'example: f = ω/2π = 100 Hz'
    inputs: {}
    formula: 50/0.50
    expected: '100'
    tolerance: 1e-9
    shown: ['a frequency of $\omega/2\pi = 100$ Hz']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
