  # The order, by direct comparison instead of the solved inequality. For m = 1 … 5 the term
  # (|x| + x)/(2|x|) is 1 when x = (2m + 1) 480 - (2m - 1) 650 is positive (blue of the next order still needs the
  # thicker film) and 0 when it is negative. The answer is one more than the number of orders with x > 0.
  - id: p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: lowest order in which red needs a thicker film than blue of the next order, by direct comparison of orders 1 to 5'
    inputs: {r: 650, u: 480}
    formula: >-
      1 + (abs(3*u - 1*r) + (3*u - 1*r))/(2*abs(3*u - 1*r)) + (abs(5*u - 3*r) + (5*u - 3*r))/(2*abs(5*u - 3*r))
      + (abs(7*u - 5*r) + (7*u - 5*r))/(2*abs(7*u - 5*r)) + (abs(9*u - 7*r) + (9*u - 7*r))/(2*abs(9*u - 7*r))
      + (abs(11*u - 9*r) + (11*u - 9*r))/(2*abs(11*u - 9*r))
    expected: 4
    tolerance: 1e-9
    shown: ['id="p4-b"']
    source: {cite: mit, at: 'Problem 10.4(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-b-bound
    where: 'Problem 4(b), solution: the bound on m'
