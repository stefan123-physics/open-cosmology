# Calculations on content/year-2/8.03/8-03-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this homework, so every answer is checked here by a route independent of the page:
# the two (or three) waves are added as arrows (real and imaginary parts) or as cosines in time, and the maxima,
# minima and averages are then found numerically (solve, deriv, integrate), not from the page's closed forms.
# In the nested expressions q and p are the variables of the integral, derivative or solve.
# In Problem 1 the speed of light c is a sample value (it overrides the constant of calcs/constants.yaml), not 3e8.
# Lengths are plain numbers in the unit named in each entry (mm in Problem 2, nm in Problem 4).

page: content/year-2/8.03/8-03-problem-set-10.mdx
calcs:
  # ---- Problem 1: source in front of a perfect conductor.
  # Direct wave: arrow 1. Reflected wave: arrow of length 1 turned by the phase 4 pi nu L/c + pi.
  # Squared length of the sum: (1 + cos)^2 + sin^2. Its derivative with respect to L is zero at maxima and minima.

  - id: p1-a-first
    kind: identity
    answer: p1-a-first
    where: 'Problem 1(a), answer box: smallest L with a maximum, as the first zero of the derivative of the summed arrows'
    formula: c/(4*nu)
    equals: >-
      solve("deriv('(1 + cos(4*pi*nu*p/c + pi))**2 + sin(4*pi*nu*p/c + pi)**2', 'p', q)", 'q', 0.15*c/nu, 0.35*c/nu)
    samples:
      c: [2.0, 3.0, 4.5]
      nu: [0.6, 1.1, 1.9]
    tolerance: 1e-6
    shown: ['id="p1-a-first"']
    source: {cite: mit, at: 'Problem 10.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-a-step
    kind: identity
    answer: p1-a-step
    where: 'Problem 1(a), answer box: step between maxima, as the difference of the second and the first maximum found numerically'
    formula: c/(2*nu)
    equals: >-
      solve("deriv('(1 + cos(4*pi*nu*p/c + pi))**2 + sin(4*pi*nu*p/c + pi)**2', 'p', q)", 'q', 0.65*c/nu, 0.85*c/nu)
      - solve("deriv('(1 + cos(4*pi*nu*p/c + pi))**2 + sin(4*pi*nu*p/c + pi)**2', 'p', q)", 'q', 0.15*c/nu, 0.35*c/nu)
    samples:
      c: [2.0, 3.0, 4.5]
      nu: [0.6, 1.1, 1.9]
    tolerance: 1e-6
    shown: ['id="p1-a-step"']
    source: {cite: mit, at: 'Problem 10.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-b
    kind: identity
    answer: p1-b
    where: 'Problem 1(b), answer box: smallest L > 0 with a minimum, as the zero of the derivative between the first two maxima'
    formula: c/(2*nu)
    equals: >-
      solve("deriv('(1 + cos(4*pi*nu*p/c + pi))**2 + sin(4*pi*nu*p/c + pi)**2', 'p', q)", 'q', 0.4*c/nu, 0.6*c/nu)
    samples:
      c: [2.0, 3.0, 4.5]
      nu: [0.6, 1.1, 1.9]
    tolerance: 1e-6
    shown: ['id="p1-b"']
    source: {cite: mit, at: 'Problem 10.1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-b-dark
    where: 'Problem 1(b), check: at L = c/(2 nu) the summed arrows have zero length (sample c = 3, nu = 1.1)'
    inputs: {c: 3.0, nu: 1.1}
    formula: (1 + cos(4*pi*nu*(c/(2*nu))/c + pi))**2 + sin(4*pi*nu*(c/(2*nu))/c + pi)**2
    expected: 0
    tolerance: 1e-9
    shown: ['Because the two amplitudes are equal the minimum is completely dark.']
    source: {cite: mit, at: 'Problem 10.1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-a-four
    where: 'Problem 1(a), check: at L = c/(4 nu) the summed arrows have squared length 4 (sample c = 3, nu = 1.1)'
    inputs: {c: 3.0, nu: 1.1}
    formula: (1 + cos(4*pi*nu*(c/(4*nu))/c + pi))**2 + sin(4*pi*nu*(c/(4*nu))/c + pi)**2
    expected: 4
    tolerance: 1e-9
    shown: ['four times the intensity of the source alone, the most that two equal waves can give']
    source: {cite: mit, at: 'Problem 10.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-intensity-form
    kind: identity
    where: 'Problem 1(a), check: 4 sin^2(2 pi nu L/c) against the time average of the two summed waves (unit amplitudes; one wave alone averages to 1/2)'
    formula: 4*sin(2*pi*nu*L/c)**2
    equals: integrate('(cos(q) + cos(q - 4*pi*nu*L/c - pi))**2', 'q', 0, 2*pi)/pi
    samples:
      c: [2.0, 3.0, 4.5]
      nu: [0.6, 1.1, 1.9]
      L: [0.4, 1.7, 2.9]
    tolerance: 1e-8
    shown: ['4I_0\sin^2\frac{2\pi\nu L}{c}']
    source: {cite: mit, at: 'Problem 10.1, p. 1 (our own solution)'}
    origin: page-own

  - id: p1-green-1
    where: 'Problem 1(a), check: first maximum for a wavelength of 520 nm (nm)'
    inputs: {lam: 520}
    formula: lam/4
    expected: 130
    shown: ['$L = 130$ nm']
    source: {cite: mit, at: 'Problem 10.1(a), p. 1 (our own number)'}
    origin: page-own

  - id: p1-green-2
    where: 'Problem 1(a), check: second maximum for 520 nm (nm)'
    inputs: {lam: 520}
    formula: 3*lam/4
    expected: 390
    shown: ['$390$ nm']
    source: {cite: mit, at: 'Problem 10.1(a), p. 1 (our own number)'}
    origin: page-own

  - id: p1-green-3
    where: 'Problem 1(a), check: third maximum for 520 nm (nm)'
    inputs: {lam: 520}
    formula: 5*lam/4
    expected: 650
    shown: ['$650$ nm.']
    source: {cite: mit, at: 'Problem 10.1(a), p. 1 (our own number)'}
    origin: page-own

  # The plate: start at the first maximum (4 pi nu L/c = pi) and add the phase 4 pi nu (n - 1) h/c of a plate of
  # thickness h crossed twice. The first zero of the derivative in h is the thinnest plate that gives a minimum.
  - id: p1-c
    kind: identity
    answer: p1-c
    where: 'Problem 1(c), answer box: thinnest plate, as the first minimum in h of the summed arrows, starting from a maximum'
    formula: c/(4*nu*(n - 1))
    equals: >-
      solve("deriv('(1 + cos(pi + 4*pi*nu*(n - 1)*p/c + pi))**2 + sin(pi + 4*pi*nu*(n - 1)*p/c + pi)**2', 'p', q)", 'q', 0.15*c/(nu*(n - 1)), 0.35*c/(nu*(n - 1)))
    samples:
      c: [2.0, 3.0, 4.5]
      nu: [0.6, 1.1, 1.9]
      n: [1.33, 1.5, 1.8]
    tolerance: 1e-6
    shown: ['id="p1-c"']
    source: {cite: mit, at: 'Problem 10.1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-c-number
    where: 'Problem 1(c), check: plate for 520 nm and n = 1.5 (nm)'
    inputs: {lam: 520, n: 1.5}
    formula: lam/(4*(n - 1))
    expected: 260
    shown: ['$h = 520/(4 \times 0.5) = 260$ nm']
    source: {cite: mit, at: 'Problem 10.1(c), p. 1 (our own number)'}
    origin: page-own

  # ---- Problem 2: three narrow slits. Lengths in mm: lam = 0.0005, d = 1, L = 5000.
  # The slits are added as arrows: real parts (cosines) and imaginary parts (sines) of 1, e^(iD), e^(2iD),
  # with D = 2 pi d x/(lam L) the phase between neighbours at the position x on the screen.

  - id: p2-given
    kind: fact
    where: 'Problem 2, statement: wavelength, slit distance and screen distance'
    shown: ['$\lambda = 500$ nm', '$d = 1$ mm apart', '$L = 5$ m behind the slits']
    source: {cite: mit, at: 'Problem 10.2, p. 2'}
    origin: mit

  - id: p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: first minimum of two slits (mm), as the first root of the summed field 2 cos(pi d x/(lam L))'
    inputs: {lam: 0.0005, d: 1, L: 5000}
    formula: solve('cos(pi*d*q/(lam*L))', 'q', 0.5, 2)
    expected: 1.25
    tolerance: 1e-6
    shown: ['id="p2-a"']
    source: {cite: mit, at: 'Problem 10.2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-a-shown
    where: 'Problem 2(a), solution: lam L/(2d) with units'
    inputs: {lam: 500 nm, L: 5 m, d: 1 mm}
    formula: lam*L/(2*d)
    expected: 1.25 mm
    shown: ['1.25 \times 10^{-3}\ \text{m} = 1.25\ \text{mm}']
    source: {cite: mit, at: 'Problem 10.2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-a-angle
    where: 'Problem 2(a), check: the angle of the first minimum, x/L'
    inputs: {x: 1.25 mm, L: 5 m}
    formula: x/L
    expected: 2.5e-4
    shown: ['$x/L = 2.5 \times 10^{-4}$']
    source: {cite: mit, at: 'Problem 10.2(a), p. 2 (our own check)'}
    origin: page-own

  - id: p2-spacing
    where: 'Problem 2(b), solution: distance between bright fringes, lam L/d'
    inputs: {lam: 500 nm, L: 5 m, d: 1 mm}
    formula: lam*L/d
    expected: 2.5 mm
    shown: ['$\pm2.5$ mm and $\pm5$ mm']
    source: {cite: mit, at: 'Problem 10.2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-dark-lines
    where: 'Problem 2(b), solution: second dark line of two slits, at one and a half fringe distances (mm)'
    inputs: {s: 2.5}
    formula: 1.5*s
    expected: 3.75
    shown: ['$\pm3.75$ mm']
    source: {cite: mit, at: 'Problem 10.2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: height of a two-slit fringe in units of one slit, as a ratio of time averages (two waves in step against one)'
    formula: integrate('(cos(q) + cos(q))**2', 'q', 0, 2*pi)/integrate('cos(q)**2', 'q', 0, 2*pi)
    expected: 4
    tolerance: 1e-8
    shown: ['id="p2-b"']
    source: {cite: mit, at: 'Problem 10.2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-b-average
    where: 'Problem 2(b), check: the two-slit intensity 4 cos^2(D/2) averaged over the phase D, in units of I0'
    formula: integrate('4*cos(q/2)**2', 'q', 0, 2*pi)/(2*pi)
    expected: 2
    tolerance: 1e-8
    shown: ['$4I_0 \times \tfrac12 = 2I_0$']
    source: {cite: mit, at: 'Problem 10.2(b), p. 2 (our own check)'}
    origin: page-own

  - id: p2-c
    answer: p2-c
    where: 'Problem 2(c), answer box: first minimum of three slits (mm), as the first root of the summed field 1 + 2 cos(D)'
    inputs: {lam: 0.0005, d: 1, L: 5000}
    formula: solve('1 + 2*cos(2*pi*d*q/(lam*L))', 'q', 0.3, 1.2)
    expected: 0.833
    tolerance: 0.0005
    shown: ['id="p2-c"']
    source: {cite: mit, at: 'Problem 10.2(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-c-shown
    where: 'Problem 2(c), solution: a third of the fringe distance (mm)'
    inputs: {s: 2.5}
    formula: s/3
    expected: 0.833
    shown: ['\frac{2.5\ \text{mm}}{3} = 0.833\ \text{mm}']
    source: {cite: mit, at: 'Problem 10.2(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-d-second-zero
    where: 'Problem 2(d), solution: second zero of three slits (mm), as the second root of 1 + 2 cos(D)'
    inputs: {lam: 0.0005, d: 1, L: 5000}
    formula: solve('1 + 2*cos(2*pi*d*q/(lam*L))', 'q', 1.3, 2.2)
    expected: 1.667
    shown: ['$x = \pm0.833$ mm and $\pm1.667$ mm']
    source: {cite: mit, at: 'Problem 10.2(d), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-d-form
    kind: identity
    where: 'Problem 2(d), solution: (1 + 2 cos D)^2 against the three summed arrows'
    formula: (1 + 2*cos(D))**2
    equals: (1 + cos(D) + cos(2*D))**2 + (sin(D) + sin(2*D))**2
    samples:
      D: [0.4, 1.3, 2.9, 4.4]
    tolerance: 1e-9
    shown: ['I_0\left(1 + 2\cos\delta\right)^2']
    source: {cite: reading2, at: 'p. 4 (N-source intensity with N = 3)'}
    origin: page-own

  - id: p2-d-lesson-form
    kind: identity
    where: 'Problem 2(d), solution: the lesson''s N-source form with N = 3 against the three summed arrows'
    formula: (sin(3*D/2)/sin(D/2))**2
    equals: (1 + cos(D) + cos(2*D))**2 + (sin(D) + sin(2*D))**2
    samples:
      D: [0.4, 1.3, 2.9, 4.4]
    tolerance: 1e-9
    shown: ['I_0\left[\frac{\sin(3\delta/2)}{\sin(\delta/2)}\right]^2']
    source: {cite: reading2, at: 'p. 4 (N-source intensity with N = 3)'}
    origin: page-own

  - id: p2-e-main
    answer: p2-e-main
    where: 'Problem 2(e), answer box: height of the fringe at x = 2.5 mm (same as the central one), from the three summed arrows'
    inputs: {lam: 0.0005, d: 1, L: 5000, x: 2.5}
    formula: (1 + cos(2*pi*d*x/(lam*L)) + cos(4*pi*d*x/(lam*L)))**2 + (sin(2*pi*d*x/(lam*L)) + sin(4*pi*d*x/(lam*L)))**2
    expected: 9
    tolerance: 1e-8
    shown: ['id="p2-e-main"']
    source: {cite: mit, at: 'Problem 10.2(e), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-e-side
    answer: p2-e-side
    where: 'Problem 2(e), answer box: height of the fringe at x = 1.25 mm, from the three summed arrows'
    inputs: {lam: 0.0005, d: 1, L: 5000, x: 1.25}
    formula: (1 + cos(2*pi*d*x/(lam*L)) + cos(4*pi*d*x/(lam*L)))**2 + (sin(2*pi*d*x/(lam*L)) + sin(4*pi*d*x/(lam*L)))**2
    expected: 1
    tolerance: 1e-8
    shown: ['id="p2-e-side"']
    source: {cite: mit, at: 'Problem 10.2(e), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-e-average
    where: 'Problem 2(e), check: the three-slit intensity averaged over the phase, in units of I0'
    formula: integrate('(1 + 2*cos(q))**2', 'q', 0, 2*pi)/(2*pi)
    expected: 3
    tolerance: 1e-8
    shown: ['$1 + 4 \times \tfrac12 = 3$']
    source: {cite: mit, at: 'Problem 10.2(e), p. 2 (our own check)'}
    origin: page-own

  # The half-covered slit: its arrow has the length sqrt(1/2).
  - id: p2-f
    answer: p2-f
    where: 'Problem 2(f), answer box: height of the fringe at x = 2.5 mm with the first arrow shortened to sqrt(1/2)'
    inputs: {lam: 0.0005, d: 1, L: 5000, x: 2.5}
    formula: (sqrt(0.5) + cos(2*pi*d*x/(lam*L)) + cos(4*pi*d*x/(lam*L)))**2 + (sin(2*pi*d*x/(lam*L)) + sin(4*pi*d*x/(lam*L)))**2
    expected: 7.33
    tolerance: 0.005
    shown: ['id="p2-f"']
    source: {cite: mit, at: 'Problem 10.2(f), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-f-shown
    where: 'Problem 2(f), solution: 9/2 + 2 sqrt 2'
    formula: 9/2 + 2*sqrt(2)
    expected: 7.33
    shown: ['\left(\frac92 + 2\sqrt2\right) I_0 = 7.33\,I_0']
    source: {cite: mit, at: 'Problem 10.2(f), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-f-wrong-sum
    where: 'Problem 2(f), check: the wrong result of adding intensities'
    formula: 1 + 1 + 0.5
    expected: 2.5
    shown: ['Adding intensities would give $2.5\,I_0$']
    source: {cite: mit, at: 'Problem 10.2(f), p. 2 (our own check)'}
    origin: page-own

  - id: p2-f-wrong-half
    where: 'Problem 2(f), check: the wrong result of halving the field'
    formula: (1 + 1 + 0.5)**2
    expected: 6.25
    shown: ['$2.5^2 I_0 = 6.25\,I_0$']
    source: {cite: mit, at: 'Problem 10.2(f), p. 2 (our own check)'}
    origin: page-own

  - id: p2-g-form
    kind: identity
    where: 'Problem 2(g), solution: the intensity 5/2 + (2 + sqrt 2) cos D + sqrt 2 cos 2D against the three summed arrows'
    formula: 2.5 + (2 + sqrt(2))*cos(D) + sqrt(2)*cos(2*D)
    equals: (sqrt(0.5) + cos(D) + cos(2*D))**2 + (sin(D) + sin(2*D))**2
    samples:
      D: [0.4, 1.3, 2.9, 4.4]
    tolerance: 1e-9
    shown: ['\frac{\langle I\rangle}{I_0} = \frac52 + \left(2 + \sqrt2\right)\cos\delta + \sqrt2\cos2\delta']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-g
    answer: p2-g
    where: 'Problem 2(g), answer box (our own check): nearest minimum (mm), as the zero of the numerical derivative of the summed arrows'
    inputs: {lam: 0.0005, d: 1, L: 5000}
    formula: >-
      solve("deriv('(sqrt(0.5) + cos(2*pi*d*p/(lam*L)) + cos(4*pi*d*p/(lam*L)))**2 + (sin(2*pi*d*p/(lam*L)) + sin(4*pi*d*p/(lam*L)))**2', 'p', q)", 'q', 0.6, 1.1)
    expected: 0.883
    tolerance: 0.0005
    shown: ['id="p2-g"']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own check)'}
    origin: page-own

  - id: p2-g-rhs
    where: 'Problem 2(g), solution: right-hand side of the equation'
    formula: -(1 + sqrt(2))/4
    expected: -0.604
    shown: ['The right-hand side is $-0.604$']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-g-forms-agree
    where: 'Problem 2(g), solution: the two forms of the right-hand side are equal'
    formula: (2 + sqrt(2))/(4*sqrt(2)) - (1 + sqrt(2))/4
    expected: 0
    tolerance: 1e-12
    shown: ['-\frac{2 + \sqrt2}{4\sqrt2} = -\frac{1 + \sqrt2}{4}']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-g-delta
    where: 'Problem 2(g), check: the phase at the minimum (rad)'
    formula: acos(-(1 + sqrt(2))/4)
    expected: 2.219
    shown: ['so $\delta = 2.219$ rad']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own check)'}
    origin: page-own

  - id: p2-g-delta-degrees
    where: 'Problem 2(g), check: the same phase in degrees'
    formula: acos(-(1 + sqrt(2))/4)*180/pi
    expected: 127
    shown: ['about $127^\circ$']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own check)'}
    origin: page-own

  - id: p2-g-x-shown
    where: 'Problem 2(g), check: position of the minimum from the phase (mm)'
    inputs: {s: 2.5}
    formula: s*acos(-(1 + sqrt(2))/4)/(2*pi)
    expected: 0.883
    shown: ['2.5\ \text{mm} \times \frac{2.219}{2\pi} = 0.883\ \text{mm}']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own check)'}
    origin: page-own

  - id: p2-g-min-value
    where: 'Problem 2(g), check: the intensity at the minimum, from the three summed arrows at D = 2.2188'
    inputs: {D: 2.21881}
    formula: (sqrt(0.5) + cos(D) + cos(2*D))**2 + (sin(D) + sin(2*D))**2
    expected: 0.055
    shown: ['gives $0.055\,I_0$']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own check)'}
    origin: page-own

  - id: p2-g-equal-slits
    where: 'Problem 2(g), check: for three equal slits the same condition gives cos D = -1/2, D = 2 pi/3'
    formula: acos(-0.5)*3/(2*pi)
    expected: 1
    tolerance: 1e-9
    shown: ['the same steps give $\cos\delta = -\tfrac12$']
    source: {cite: mit, at: 'Problem 10.2(g), p. 2 (our own check)'}
    origin: page-own

  - id: p2-h
    answer: p2-h
    where: 'Problem 2(h), answer box (our own check): height of the fringe at x = 1.25 mm with the first arrow shortened'
    inputs: {lam: 0.0005, d: 1, L: 5000, x: 1.25}
    formula: (sqrt(0.5) + cos(2*pi*d*x/(lam*L)) + cos(4*pi*d*x/(lam*L)))**2 + (sin(2*pi*d*x/(lam*L)) + sin(4*pi*d*x/(lam*L)))**2
    expected: 0.5
    tolerance: 1e-8
    shown: ['id="p2-h"']
    source: {cite: mit, at: 'Problem 10.2(h), p. 2 (our own check)'}
    origin: page-own

  - id: p2-h-second-min
    where: 'Problem 2(h), check: the second minimum (mm), as the zero of the numerical derivative between the small and the next large fringe'
    inputs: {lam: 0.0005, d: 1, L: 5000}
    formula: >-
      solve("deriv('(sqrt(0.5) + cos(2*pi*d*p/(lam*L)) + cos(4*pi*d*p/(lam*L)))**2 + (sin(2*pi*d*p/(lam*L)) + sin(4*pi*d*p/(lam*L)))**2', 'p', q)", 'q', 1.4, 1.9)
    expected: 1.617
    shown: ['$2.5 - 0.883 = 1.617$ mm']
    source: {cite: mit, at: 'Problem 10.2(h), p. 2 (our own check)'}
    origin: page-own

  # ---- Problem 3: two dipoles. The two waves are added as cosines in time, with q = omega t, and the square is
  # averaged over a period. Two waves in step give the integral 4 pi, so dividing by 4 pi gives the fraction of 4 I0.
  # The dipole at +x is closer by (separation) sin(th), which advances its wave.

  - id: p3-a
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box: pattern of two dipoles in phase, half a wavelength apart, against a numerical time average'
    formula: cos(pi*sin(th)/2)**2
    equals: integrate('(cos(q + pi/2*sin(th)) + cos(q - pi/2*sin(th)))**2', 'q', 0, 2*pi)/(4*pi)
    samples:
      th: [0.3, 0.9, 1.2, 2.5, 4.0]
    tolerance: 1e-8
    shown: ['id="p3-a"']
    source: {cite: mit, at: 'Problem 10.3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-a-60
    answer: p3-a-60
