# Calculations on content/year-2/8.03/em-waves-in-matter-brewster.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 19 notes and transcript, with the page's own example.

page: content/year-2/8.03/em-waves-in-matter-brewster.mdx
calcs:
  - id: solve-amplitudes
    kind: identity
    where: 'E₀R = (α − β)/(α + β) and E₀T = 2/(α + β) (E₀I = 1) satisfy E₀I − E₀R = βE₀T: 1 − (α − β)/(α + β) = 2β/(α + β)'
    formula: 1 - (a - b)/(a + b)
    equals: b*2/(a + b)
    samples: {a: [1.0, 0.8, 2.0], b: [1.5, 0.7, 1.33]}
    tolerance: 1e-12
    shown: ['frac{2}{\alpha + \beta}E_{0I}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: solve-amplitudes-2
    kind: identity
    where: 'and E₀I + E₀R = αE₀T: 1 + (α − β)/(α + β) = 2α/(α + β)'
    formula: 1 + (a - b)/(a + b)
    equals: a*2/(a + b)
    samples: {a: [1.0, 0.8, 2.0], b: [1.5, 0.7, 1.33]}
    tolerance: 1e-12
    shown: ['frac{2}{\alpha + \beta}E_{0I}" cite']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: normal-incidence
    kind: identity
    where: 'α = 1, β = n₂/n₁: (1 − β)/(1 + β) = (n₁ − n₂)/(n₁ + n₂)'
    formula: (1 - n2/n1)/(1 + n2/n1)
    equals: (n1 - n2)/(n1 + n2)
    samples: {n1: [1.0, 1.33], n2: [1.5, 1.0]}
    tolerance: 1e-12
    shown: ['R = \frac{n_1 - n_2}{n_1 + n_2}, \qquad T']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: brewster-alpha-beta
    kind: identity
    where: 'at tan θ_B = n₂/n₁ (n₁ = 1), with θ_T = 90° − θ_B: α = cos θ_T/cos θ_B equals β = n₂'
    formula: cos(pi/2 - atan(n))/cos(atan(n))
    equals: n
    samples: {n: [1.33, 1.5, 2.4]}
    tolerance: 1e-12
    shown: ['theta_B + \theta_T = \frac{\pi}{2}" cite']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: brewster-snell
    kind: identity
    where: 'θ_T = 90° − θ_B also satisfies Snell: sin θ_B = n sin θ_T when tan θ_B = n'
    formula: sin(atan(n))
    equals: n*sin(pi/2 - atan(n))
    samples: {n: [1.33, 1.5, 2.4]}
    tolerance: 1e-12
    shown: ['theta_B + \theta_T = \frac{\pi}{2}" cite']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: diamond
    kind: fact
    where: 'refractive index of diamond: Lee says about 2.6; standard value about 2.42'
    value: '2.42'
    shown: ['about 2.6; it is about 2.4']
    source: {cite: reading2, at: 'p. 18'}
    origin: mit

  - id: ex-brewster-glass
    where: 'example: arctan 1.50 in degrees'
    inputs: {}
    formula: atan(1.50)*180/pi
    expected: '56.3'
    tolerance: 0.05
    shown: ['theta_B \approx 56.3°']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-theta-t
    where: 'example: 90° − 56.3°'
    inputs: {}
    formula: 90 - atan(1.50)*180/pi
    expected: '33.7'
    tolerance: 0.05
    shown: ['33.7°$. Check']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-check
    where: 'example: sin 56.3° and 1.50 sin 33.7°'
    inputs: {}
    formula: sin(atan(1.5))
    expected: '0.832'
    tolerance: 0.0005
    shown: ['approx 0.832$ and']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-brewster-water
    where: 'example: arctan 1.33 in degrees'
    inputs: {}
    formula: atan(1.33)*180/pi
    expected: '53.1'
    tolerance: 0.05
    shown: ['theta_B \approx 53.1°']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-below-horizontal
    where: 'example: 90° − 53.1°'
    inputs: {}
    formula: 90 - atan(1.33)*180/pi
    expected: '37'
    tolerance: 0.5
    shown: ['about $37°$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-r
    where: 'example: (1 − 1.50)/(1 + 1.50)'
    inputs: {}
    formula: (1 - 1.50)/(1 + 1.50)
    expected: '-0.20'
    tolerance: 1e-12
    shown: ['1.50) = -0.20$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-r2
    where: 'example: R² = 0.04, about 4%'
    inputs: {}
    formula: ((1 - 1.50)/(1 + 1.50))**2
    expected: '0.04'
    tolerance: 1e-12
    shown: ['R^2 = 0.04$', 'about 4% at each surface']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
