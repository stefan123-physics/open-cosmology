# Calculations on content/year-2/8.03/uncertainty-principle-2d-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 15 notes and transcript, with the page's own example.

page: content/year-2/8.03/uncertainty-principle-2d-waves.mdx
calcs:
  - id: c-of-omega
    kind: identity
    where: 'C(ω) = (1/2π)∫e^(−Γ|t|)cos(ωt)dt (the sine part cancels) equals Γ/π(Γ² + ω²); Γ = 2, integral to |t| = 30'
    formula: (1/pi)*integrate('exp(-2*s)*cos(w*s)', 's', 0, 30)
    equals: 2/(pi*(4 + w**2))
    samples: {w: [0.0, 1.0, 3.0]}
    tolerance: 1e-6
    shown: ['frac{\Gamma}{\pi(\Gamma^2 + \omega^2)}" cite']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: r-minimum
    kind: identity
    where: 'R(κ) = Δt² + κ²Δω² − κ at κ = 1/2Δω² equals Δt² − 1/4Δω² (Δt² = a, Δω² = b)'
    formula: a + (1/(2*b))**2*b - 1/(2*b)
    equals: a - 1/(4*b)
    samples: {a: [0.5, 2.0, 0.1], b: [1.0, 0.3, 7.0]}
    tolerance: 1e-12
    shown: ['is $\Delta t^2 - 1/4\Delta\omega^2 \geq 0$']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: am-bandwidth
    where: 'Δω = 2π × 5 kHz'
    inputs: {}
    formula: 2*pi*5000
    expected: '3e4'
    tolerance: 2e3
    shown: ['approx 3 \times 10^4$ s⁻¹ means']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: am-dt
    where: 'Δt ≥ 1/(2Δω) with Δω = 2π × 5000: 1.6e-5 s, "a few times 10⁻⁵ s"'
    inputs: {}
    formula: 1/(2*2*pi*5000)
    expected: '1.6e-5'
    tolerance: 1e-6
    shown: ['a few times $10^{-5}$ s']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: hbar-ev
    where: 'ħ in eV·s: 1.0546e-34 J·s / 1.602e-19 J/eV'
    inputs: {}
    formula: 1.0546e-34/1.602e-19
    expected: '6.6e-16'
    tolerance: 0.05e-16
    shown: ['slip for $6.6 \times 10^{-16}$ eV·s']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: pulsar-period
    kind: fact
    where: 'rotation period of PSR B1937+21 quoted in the lecture'
    value: '1.6 ms'
    shown: ['once every 1.6 ms']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: pulsar-distance
    kind: fact
    where: 'distance of PSR B1937+21 quoted in the lecture'
    value: '16000 light years'
    shown: ['about 16,000 light years']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: photon-mass
    kind: fact
    where: 'apparent photon mass quoted in the lecture'
    value: '1.3e-49 g'
    shown: ['mass of $1.3 \times 10^{-49}$ g']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: ex-norm
    where: 'example: ∫e^(−2Γ|t|)dt = 1/Γ (Γ = 2)'
    inputs: {}
    formula: 2*integrate('exp(-4*s)', 's', 0, 30)
    expected: '0.5'
    tolerance: 1e-9
    shown: ['$\int|f|^2dt = 1/\Gamma$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-t2
    where: 'example: ∫t²e^(−2Γ|t|)dt = 1/2Γ³ (Γ = 2: 1/16)'
    inputs: {}
    formula: 2*integrate('s**2*exp(-4*s)', 's', 0, 30)
    expected: '0.0625'
    tolerance: 1e-9
    shown: ['$\int t^2|f|^2dt = 1/2\Gamma^3$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-product
    where: 'example: Δt Δω = √(1/2Γ²) × Γ = 1/√2'
    inputs: {}
    formula: sqrt(1/(2*2**2))*2
    expected: '0.71'
    tolerance: 0.005
    shown: ['1/\sqrt2 \approx 0.71']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-domega
    where: 'example: Δω = 2π × 9000'
    inputs: {}
    formula: 2*pi*9000
    expected: '5.7e4'
    tolerance: 0.05e4
    shown: ['approx 5.7 \times 10^4$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-dt
    where: 'example: Δt ≥ 1/(2Δω)'
    inputs: {}
    formula: 1/(2*2*pi*9000)
    expected: '8.8e-6'
    tolerance: 0.05e-6
    shown: ['approx 8.8 \times 10^{-6}']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-domega-gamma
    where: 'example: Δω² = ∫|f′|²dt/∫|f|²dt = Γ² (Γ = 2: ∫Γ²e^(−2Γ|t|)dt / ∫e^(−2Γ|t|)dt)'
    inputs: {}
    formula: integrate('4*exp(-4*s)', 's', 0, 30)/integrate('exp(-4*s)', 's', 0, 30)
    expected: '4'
    tolerance: 1e-9
    shown: ['so $\Delta\omega^2 = \Gamma^2$']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own
