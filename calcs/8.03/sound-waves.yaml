# Calculations on content/year-2/8.03/sound-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 11 notes and transcript, with the page's own example.

page: content/year-2/8.03/sound-waves.mdx
calcs:
  - id: wall-r
    where: 'R = (v₂ − v₁)/(v₂ + v₁) with v₂ → 0 (v₁ = 1, v₂ = 1e-9)'
    inputs: {}
    formula: (1e-9 - 1)/(1e-9 + 1)
    expected: '-1'
    tolerance: 1e-6
    shown: ['so $v_2 \to 0$: $R = -1$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: free-r
    where: 'R with v₂ → ∞ (v₁ = 1, v₂ = 1e9)'
    inputs: {}
    formula: (1e9 - 1)/(1e9 + 1)
    expected: '1'
    tolerance: 1e-6
    shown: ['so $v_2 \to \infty$: $R = 1$']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: mit

  - id: free-tau
    where: 'τ = 2v₂/(v₁ + v₂) with v₂ → ∞'
    inputs: {}
    formula: 2*1e9/(1 + 1e9)
    expected: '2'
    tolerance: 1e-6
    shown: ['so $v_2 \to \infty$: $R = 1$, $\tau = 2$']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: mit

  - id: linearise
    kind: identity
    where: '(1 + u)^γ ≈ 1 + γu for small u = ΔV/V₀ (γ = 1.4)'
    formula: (1 + u)**1.4
    equals: 1 + 1.4*u
    samples: {u: [0.0001, -0.0001, 0.00001]}
    tolerance: 1e-7
    shown: ['gamma\Delta V/V_0)']
    source: {cite: reading1, at: 'pp. 1–2'}
    origin: mit

  - id: pressure-relation
    kind: identity
    where: 'exact adiabatic change ψ_P = P₀[(1 + u)^(−γ) − 1] ≈ −γP₀u for small u (P₀ = 1e5, γ = 1.4)'
    formula: 1e5*((1 + u)**(-1.4) - 1)
    equals: -1.4*1e5*u
    samples: {u: [0.00001, -0.00001]}
    tolerance: 1e-4
    shown: ['tex="\psi_P = -\gamma P_0']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: gamma-mono
    where: 'γ = (α + 1)/α with α = 3/2'
    inputs: {}
    formula: (1.5 + 1)/1.5
    expected: '1.6667'
    tolerance: 0.0001
    shown: ['\gamma = 5/3$. A']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: gamma-di
    where: 'γ = (α + 1)/α with α = 5/2'
    inputs: {}
    formula: (2.5 + 1)/2.5
    expected: '1.4'
    tolerance: 1e-12
    shown: ['\gamma = 7/5$ (notes']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: laplace
    where: 'v = √(γP₀/ρ), γ = 1.4, P₀ = 1e5 Pa, ρ = 1.2 kg/m³'
    inputs: {}
    formula: sqrt(1.4*1e5/1.2)
    expected: '342'
    tolerance: 0.5
    shown: ['v_p \approx 342']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: newton
    where: 'v = √(P₀/ρ), Newton''s γ = 1 (the lecture says 389, a slip)'
    inputs: {}
    formula: sqrt(1e5/1.2)
    expected: '289'
    tolerance: 0.5
    shown: ['\sqrt{10^5/1.2} \approx 289']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: wavelength
    where: 'λ = 64 cm − 30 cm'
    inputs: {}
    formula: 64 - 30
    expected: '34'
    shown: ['calls "stop" at 30 cm: a wavelength of 34 cm']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: measured
    where: 'v = fλ = 1000 Hz × 0.34 m'
    inputs: {}
    formula: 1000*0.34
    expected: '340'
    tolerance: 1e-9
    shown: ['0.34\ \text{m} = 340']
    source: {cite: reading2, at: 'p. 13'}
    origin: mit

  - id: agreement
    where: '(342 − 340)/342 < 1%'
    inputs: {}
    formula: (sqrt(1.4*1e5/1.2) - 340)/sqrt(1.4*1e5/1.2)
    expected: '0.005'
    tolerance: 0.005
    shown: ['within 1%']
    source: {cite: reading2, at: 'p. 14'}
    origin: mit

  - id: measured-notes
    kind: fact
    where: 'speed of sound measured at 70 °F, quoted in the notes'
    value: '343'
    shown: ['343 m/s measured at 70 °F']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: ex-helium
    where: 'example: v = √((5/3)(1.0e5)/0.17)'
    inputs: {}
    formula: sqrt((5/3)*1.0e5/0.17)
    expected: '990'
    tolerance: 1
    shown: ['approx 990']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-helium-ratio
    where: 'example: 990/342 ≈ 2.9, "almost three times"'
    inputs: {}
    formula: sqrt((5/3)*1.0e5/0.17)/342
    expected: '2.9'
    tolerance: 0.05
    shown: ['almost three times the speed in air']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-f-unit
    where: 'example: v/4L = 342/(4·0.50)'
    inputs: {}
    formula: 342/(4*0.50)
    expected: '171'
    tolerance: 1e-9
    shown: ['342/2.0 = 171']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-f2
    where: 'example: f₂ = 3v/4L'
    inputs: {}
    formula: 3*342/(4*0.50)
    expected: '513'
    tolerance: 1e-9
    shown: ['f_2 = 513']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: ex-f3
    where: 'example: f₃ = 5v/4L'
    inputs: {}
    formula: 5*342/(4*0.50)
    expected: '855'
    tolerance: 1e-9
    shown: ['f_3 = 855']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: page-own

  - id: closed-open-modes
    kind: identity
    where: 'closed–open pipe: ψ = sin(k_m x) with k_m = (m − ½)π/L has ψ(0) = 0 and ∂ψ/∂x = 0 at x = L (L = 0.5): check cos(k_m L) = 0'
    formula: cos((m - 0.5)*pi)
    equals: 0*m
    samples: {m: [1, 2, 3]}
    tolerance: 1e-9
    shown: ['\text{closed–open: } k_m = \frac{(m - \frac12)\pi}{L}']
    source: {cite: reading1, at: 'pp. 4–5'}
    origin: mit

  - id: helium-gamma-factor
    where: 'helium vs air: the γ factor √((5/3)/1.4)'
    inputs: {}
    formula: sqrt((5/3)/1.4)
    expected: '1.09'
    tolerance: 0.005
    shown: ['by a factor of about 1.09']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: helium-density-factor
    where: 'helium vs air: the density factor √(1.2/0.17)'
    inputs: {}
    formula: sqrt(1.2/0.17)
    expected: '2.66'
    tolerance: 0.005
    shown: ['the lower density by about 2.66']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: driven-pipe
    kind: identity
    where: 'driven pipe ψ = D sin(k x)/sin(k L): ψ(0) = 0 and ψ(L) = D (D = 1, L = 1)'
    formula: sin(k*1)/sin(k*1)
    equals: 1 + 0*k
    samples: {k: [0.5, 2.0, 4.0]}
    tolerance: 1e-12
    shown: ['at $k_d = m\pi/L$, the closed–closed modes']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit
