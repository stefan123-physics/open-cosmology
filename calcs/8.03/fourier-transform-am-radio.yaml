# Calculations on content/year-2/8.03/fourier-transform-am-radio.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 14 notes and transcript, with the page's own example.

page: content/year-2/8.03/fourier-transform-am-radio.mdx
calcs:
  - id: delta-normalisation
    where: '(1/2π)∫e^{iΔωt}dt is δ(Δω): its integral over Δω is 1. Check with the finite window ∫_{−T}^{T}: (1/2π)·2 sin(ΔωT)/Δω integrated over Δω gives 1 (T = 1, Δω from −2000 to 2000)'
    inputs: {}
    formula: 2*integrate('sin(w)/(pi*w)', 'w', 1e-9, 2000)
    expected: '1'
    tolerance: 0.001
    shown: ['e^{i(\omega - \omega'')t}\,dt = \delta(\omega - \omega''), \qquad']
    source: {cite: reading2, at: 'p. 8'}
    origin: mit

  - id: product-of-cosines
    kind: identity
    where: 'cos a cos b = ½[cos(a + b) + cos(a − b)], with a = ω_s t, b = ω₀t'
    formula: cos(a)*cos(b)
    equals: 0.5*(cos(b + a) + cos(b - a))
    samples: {a: [0.2, 1.1, 3.0], b: [5.0, 40.0, 7.3]}
    tolerance: 1e-12
    shown: ['frac12\left[\cos(\omega_0 + \omega_s)t']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: am-band
    kind: fact
    where: 'AM carrier frequencies quoted in the notes'
    value: '0.1 to 30 MHz'
    shown: ['about 0.1 to 30 MHz']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: skywave-band
    kind: fact
    where: 'medium-frequency band listed in the notes'
    value: '300 kHz to 3 MHz'
    shown: ['300 kHz to 3 MHz']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: sim-alpha
    kind: fact
    where: 'stiffness in the closing simulation'
    value: '0.1'
    shown: ['With stiffness $\alpha = 0.1$']
    source: {cite: reading2, at: 'pp. 18–19'}
    origin: mit

  - id: ex-uk
    where: 'example: uk = 2.0e8 × 1.0e5'
    inputs: {}
    formula: 2.0e8*1.0e5
    expected: '2.0e13'
    tolerance: 1e9
    shown: ['uk = 2.0 \times 10^{13}']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-omega
    where: 'example: ω = √(ω_b² + u²k²)'
    inputs: {}
    formula: sqrt(1.0e13**2 + (2.0e8*1.0e5)**2)
    expected: '2.24e13'
    tolerance: 0.005e13
    shown: ['approx 2.24 \times 10^{13}']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-vp
    where: 'example: v_p = ω/k'
    inputs: {}
    formula: sqrt(1.0e13**2 + (2.0e8*1.0e5)**2)/1.0e5
    expected: '2.24e8'
    tolerance: 0.005e8
    shown: ['k \approx 2.24 \times 10^8']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-vg
    where: 'example: v_g = u²k/ω'
    inputs: {}
    formula: (2.0e8)**2*1.0e5/sqrt(1.0e13**2 + (2.0e8*1.0e5)**2)
    expected: '1.79e8'
    tolerance: 0.005e8
    shown: ['approx 1.79 \times 10^8']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-vg-deriv
    kind: identity
    where: 'dω/dk for ω = √(ω_b² + u²k²) equals u²k/ω (units of 1e13 rad/s and 1e5 rad/m, so u = 2)'
    formula: deriv('sqrt(1 + 4*s**2)', 's', k, 1)
    equals: 4*k/sqrt(1 + 4*k**2)
    samples: {k: [0.5, 1.0, 3.0]}
    tolerance: 1e-6
    shown: ['approx 1.79 \times 10^8']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-product
    where: 'example: v_p v_g = u²'
    inputs: {}
    formula: (sqrt(1.0e13**2 + (2.0e8*1.0e5)**2)/1.0e5)*((2.0e8)**2*1.0e5/sqrt(1.0e13**2 + (2.0e8*1.0e5)**2))
    expected: '4.0e16'
    tolerance: 1e10
    shown: ['u^2 = 4.0 \times 10^{16}']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-vg-step
    where: 'example: the written step (4.0e16 × 1.0e5)/(2.24e13)'
    inputs: {}
    formula: (4.0e16*1.0e5)/(2.24e13)
    expected: '1.79e8'
    tolerance: 0.005e8
    shown: ['(4.0 \times 10^{16} \times 1.0 \times 10^5)/(2.24 \times 10^{13})']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own
