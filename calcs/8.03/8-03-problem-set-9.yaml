  # ---- Problem 5: Brewster's angle

  # Independent of the right-angle condition: the reflected amplitude (alpha - beta)/(alpha + beta) of the lesson
  # vanishes where cos(theta_T)/cos(theta_I) = n, with theta_T from Snell's law.
  - id: p5-b
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box: arctan(n) against the numerical root of alpha = beta, with Snell''s law'
    formula: atan(n)
    equals: solve('cos(asin(sin(q)/n))/cos(q) - n', 'q', 0.6, 1.4)
    samples:
      n: [1.3, 1.52, 2.4]
    tolerance: 1e-8
    shown: ['id="p5-b"']
    source: {cite: reading4, at: 'pp. 6-7'}
    origin: page-own

  - id: p5-n
    kind: fact
    where: 'Problem 5(b), statement: the refractive index of our own example'
    shown: ['in degrees for a glass with $n_{\text{glass}} = 1.52$']
    source: {cite: mit, at: 'Problem 9.5(b), p. 4 (our own example)'}
    origin: page-own

  - id: p5-deg
    answer: p5-deg
    where: 'Problem 5(b), answer box: Brewster''s angle in degrees for n = 1.52, as the numerical root of alpha = beta'
    inputs: {n: 1.52}
    formula: solve('cos(asin(sin(q)/n))/cos(q) - n', 'q', 0.6, 1.4)*180/pi
    expected: 56.7
    shown: ['id="p5-deg"', '\arctan(1.52) \approx 56.7°', 'gives $56.7°$ again']
    source: {cite: mit, at: 'Problem 9.5(b), p. 4 (our own example)'}
    origin: page-own

  - id: p5-thetaT
    where: 'Problem 5(b), solution: the angle of the refracted ray for n = 1.52'
    inputs: {n: 1.52}
