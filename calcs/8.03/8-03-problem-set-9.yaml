  # The average of |a_perp|^2/|a|^2 over a turn in the direction (theta, phi), as a numerical integral.
  - id: p4-angular
    kind: identity
    where: 'Problem 4(d), solution: the average of |a_perp|^2 over a turn is (1 + cos^2 theta)/2 times |a|^2'
    formula: (1 + cos(th)**2)/2
    equals: 1/(2*pi)*integrate('1 - (sin(th)*cos(q - ph))**2', 'q', 0, 2*pi)
    samples:
      th: [0.3, 1.2, 2.5]
      ph: [0.0, 0.9, 2.2]
    tolerance: 1e-9
    shown: ['label="Average energy flow in the direction θ"']
    source: {cite: mit, at: 'Problem 9.4(d), p. 4 (our own solution)'}
    origin: page-own

  # Largest over smallest: the average of |a_perp|^2 on the axis (all of a) over that in the plane of the circle
