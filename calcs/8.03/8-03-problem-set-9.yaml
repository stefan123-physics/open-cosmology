  # The wave number as minus the numerical slope in R of the phase be (t - R/c) of the field of part (b).
  - id: p4-k
    kind: identity
    answer: p4-k
    where: 'Problem 4(a), answer box: wave number as minus the slope in R of the phase be (t - R/c)'
    formula: be/c
    equals: -deriv('be*(t - q/c)', 'q', R)
    samples:
      be: [0.6, 1.4, 2.7]
      c: [2.0, 3.0, 4.5]
      t: [3.1, 4.0, 4.8]
      R: [1.1, 1.5, 1.9]
    tolerance: 1e-7
    shown: ['id="p4-k"']
    source: {cite: mit, at: 'Problem 9.4(a), p. 3 (our own solution)'}
    origin: page-own

  # Position (ii): the unit acceleration (cos u, sin u, 0) has the component cos(u)/sqrt(2) along (x - z)/sqrt(2)
  # and sin(u) along y. The axis ratio is the root of the ratio of the two mean squares.
  - id: p4-ratio
    answer: p4-ratio
    where: 'Problem 4(a), answer box: short over long axis at (ii), from the mean squares of the two transverse components'
    formula: sqrt(integrate('(cos(q)*1/sqrt(2) + 0*(-1/sqrt(2)))**2', 'q', 0, 2*pi)/integrate('sin(q)**2', 'q', 0, 2*pi))
    expected: 0.707
    shown: ['id="p4-ratio"', '$1/\sqrt2 \approx 0.707$ times as long']
    source: {cite: mit, at: 'Problem 9.4(a)(ii), p. 3 (our own solution)'}
    origin: page-own

  # |a_perp|^2 = |a|^2 - (a . r)^2 must equal the sum of the squares of the two transverse components at (ii).
  - id: p4-aperp-ii
    kind: identity
    where: 'Problem 4(a)(ii): the two transverse components carry all of the perpendicular acceleration'
    formula: (cos(u)/sqrt(2))**2 + sin(u)**2
    equals: 1 - (cos(u)/sqrt(2))**2
    samples:
      u: [0.4, 1.9, 4.3]
    tolerance: 1e-12
    shown: ['label="Perpendicular acceleration at position (ii)"']
    source: {cite: reading3, at: 'p. 5'}
    origin: page-own

  # Fields at (0, 0, R): E = -q a/(4 pi eps0 c^2 R) with q = -e and a the numerical second derivative of the
