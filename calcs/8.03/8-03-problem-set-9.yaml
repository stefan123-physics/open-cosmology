  # The power as the integral of the average energy flow of part (d) over the sphere of radius R:
  # <S> = e^2 al^2 be^4 (1 + cos^2 th)/(32 pi^2 eps0 c^3 R^2), area element 2 pi R^2 sin(th) d th.
  - id: p4-p
    kind: identity
    answer: p4-p
    where: 'Problem 4(c), answer box: Larmor power against the numerical integral of the average energy flow over a sphere'
    formula: e**2*al**2*be**4/(6*pi*eps0*c**3)
    equals: integrate('e**2*al**2*be**4*(1 + cos(q)**2)/(32*pi**2*eps0*c**3*R**2)*2*pi*R**2*sin(q)', 'q', 0, pi)
    samples:
      e: [1.1, 1.6, 1.9]
      al: [0.6, 1.2, 1.8]
      be: [0.6, 1.4, 1.9]
      R: [1.1, 1.5, 1.9]
      c: [2.0, 3.0, 4.5]
      eps0: [0.7, 0.4, 1.1]
    tolerance: 1e-8
