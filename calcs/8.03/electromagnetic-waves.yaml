# Calculations on content/year-2/8.03/electromagnetic-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 12 notes and transcript, with the page's own example.

page: content/year-2/8.03/electromagnetic-waves.mdx
calcs:
  - id: speed-of-light
    where: 'c = 1/√(μ₀ε₀) with μ₀ = 4π × 10⁻⁷, ε₀ = 8.854 × 10⁻¹²'
    inputs: {}
    formula: 1/sqrt(4*pi*1e-7*8.854e-12)
    expected: '3e8'
    tolerance: 1e6
    shown: ['\approx 3 \times 10^8\ \text{m/s}" cite']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: romer
    kind: fact
    where: 'Rømer 1676, as quoted in the notes'
    value: '2.2e8'
    shown: ['found $2.2 \times 10^8$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: bradley
    kind: fact
    where: 'Bradley 1729, as quoted in the notes'
    value: '3.01e8'
    shown: ['found $3.01 \times 10^8$']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: plane-wave-b
    kind: identity
    where: 'Faraday: −∂B/∂t for B = (k/ω)E₀cos(kz − ωt) equals −kE₀ sin(kz − ωt) (k = 2, ω = 3, E₀ = 1, z = 0.4)'
    formula: -deriv('(2/3)*cos(2*0.4 - 3*s)', 's', t, 1)
    equals: -2*sin(2*0.4 - 3*t)
    samples: {t: [0.0, 0.2, 0.7]}
    tolerance: 1e-6
    shown: ['frac{k}{\omega}E_0\cos']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: notes-example-b
    where: 'notes example: z component of k̂ × Ê with k̂ = (1, 1, 0)/√2, Ê = (−1, 1, 0)/√2'
    inputs: {}
    formula: (1/sqrt(2))*(1/sqrt(2)) - (1/sqrt(2))*(-1/sqrt(2))
    expected: '1'
    tolerance: 1e-12
    shown: ['then $\vec B$ points along $\hat z$']
    source: {cite: reading1, at: 'pp. 6–7'}
    origin: mit

  - id: standing-e
    kind: identity
    where: '½[cos(kz − ωt) − cos(−kz − ωt)] = sin ωt sin kz, with a = kz, b = ωt'
    formula: 0.5*(cos(a - b) - cos(-a - b))
    equals: sin(b)*sin(a)
    samples: {a: [0.3, 1.2, 2.5], b: [0.7, 2.0, 4.1]}
    tolerance: 1e-12
    shown: ['E_0\sin(\omega t)\sin(kz)\,\hat x, \qquad']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: standing-b
    kind: identity
    where: '½[cos(kz − ωt) + cos(−kz − ωt)] = cos ωt cos kz'
    formula: 0.5*(cos(a - b) + cos(-a - b))
    equals: cos(b)*cos(a)
    samples: {a: [0.3, 1.2, 2.5], b: [0.7, 2.0, 4.1]}
    tolerance: 1e-12
    shown: ['\frac{E_0}{c}\cos(\omega t)\cos(kz)\,\hat y" cite']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: poynting
    kind: identity
    where: 'sin ωt cos ωt sin kz cos kz = ¼ sin 2ωt sin 2kz'
    formula: sin(b)*cos(b)*sin(a)*cos(a)
    equals: 0.25*sin(2*b)*sin(2*a)
    samples: {a: [0.3, 1.2, 2.5], b: [0.7, 2.0, 4.1]}
    tolerance: 1e-12
    shown: ['sin(2\omega t)\sin(2kz)\,\hat z" cite']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: energy-average
    where: 'average of sin²(kz) over half a wavelength (kz from 0 to π)'
    inputs: {}
    formula: integrate('sin(u)**2', 'u', 0, pi)/pi
    expected: '0.5'
    tolerance: 1e-9
    shown: ['epsilon_0E_0^2/4$']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-mu-eps
    where: 'example: μ₀ε₀ = 4π × 10⁻⁷ × 8.85 × 10⁻¹²'
    inputs: {}
    formula: 4*pi*1e-7*8.85e-12
    expected: '1.112e-17'
    tolerance: 1e-20
    shown: ['1.112 \times 10^{-17}']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-c
    where: 'example: c = 1/√(1.112 × 10⁻¹⁷)'
    inputs: {}
    formula: 1/sqrt(4*pi*1e-7*8.85e-12)
    expected: '3.00e8'
    tolerance: 5e5
    shown: ['c \approx 3.00 \times 10^8$ m/s.']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-b0
    where: 'example: B₀ = 30/(3.00 × 10⁸)'
    inputs: {}
    formula: 30/3.00e8
    expected: '1.0e-7'
    tolerance: 1e-9
    shown: ['= 1.0 \times 10^{-7}$ T']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-lambda
    where: 'example: λ = c/f = 3.00 × 10⁸/2.45 × 10⁹'
    inputs: {}
    formula: 3.00e8/2.45e9
    expected: '0.122'
    tolerance: 0.005
    shown: ['approx 0.122$ m']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own

  - id: ex-node-spacing
    where: 'example: λ/2 in cm'
    inputs: {}
    formula: 100*3.00e8/2.45e9/2
    expected: '6.1'
    tolerance: 0.05
    shown: ['about $6.1$ cm']
    source: {cite: reading1, at: 'p. 8'}
    origin: page-own
