# Calculations on content/year-2/8.03/8-03-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this homework, so every answer is checked here by a route independent of the page:
# the mode put into the equation of motion of one bead, a numerical solve of Snell's law, or a numerical root of
# the slope of the rainbow angle. In the nested expressions q and p are the variables of the solve or derivative.
# Angles are in radians inside the formulas and are turned into degrees with 180/pi.

page: content/year-2/8.03/8-03-problem-set-8.mdx
calcs:
  # ---- Problem 1: the mesh of 3 x 3 beads. s(n, i) = sin(n pi i/4) is the shape along a row or a column.

  - id: p1-given
    kind: fact
    where: 'Problem 1(b), statement: the vertical strings are a thousand times tighter'
    shown: ['Now take $T_v = 1000\,T_h$']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2'}
    origin: mit

  # The product of two sines is half the difference of two cosines: the sum of the four travelling
  # exponentials of the notes (p. 3).
  - id: p1-shape
    kind: identity
    answer: p1-shape
    where: 'Problem 1(a), answer box: the shape of a mode, against the combination of the cosines of the sum and the difference'
    formula: sin(nx*pi*k/4)*sin(ny*pi*j/4)
    equals: (cos(nx*pi*k/4 - ny*pi*j/4) - cos(nx*pi*k/4 + ny*pi*j/4))/2
    samples:
      nx: [1, 2, 3, 3]
      ny: [1, 3, 2, 3]
      j: [1, 3, 1, 2]
      k: [2, 1, 3, 3]
    tolerance: 1e-12
    shown: ['id="p1-shape"']
    source: {cite: reading1, at: 'p. 3 (modes inside walls)'}
    origin: page-own

  # omega^2 as minus the force on bead (j, k) divided by its mass and its displacement, with the four
  # neighbours written out (a = L/4), against the formula of the page.
  - id: p1-omega2
    kind: identity
    answer: p1-omega2
    where: 'Problem 1(a), answer box: omega squared, against the force of the four pieces of string on bead (j, k) in the mode'
    formula: 16*(Th*sin(nx*pi/8)**2 + Tv*sin(ny*pi/8)**2)/(m*L)
    equals: ((Th/(L/4))*(2*sin(nx*pi*k/4) - sin(nx*pi*(k + 1)/4) - sin(nx*pi*(k - 1)/4))/sin(nx*pi*k/4) + (Tv/(L/4))*(2*sin(ny*pi*j/4) - sin(ny*pi*(j + 1)/4) - sin(ny*pi*(j - 1)/4))/sin(ny*pi*j/4))/m
    samples:
      nx: [1, 2, 3, 3]
      ny: [1, 3, 2, 3]
      j: [1, 3, 1, 2]
      k: [2, 1, 3, 3]
      Th: [1.0, 2.5, 0.7, 3.0]
      Tv: [1000.0, 4.0, 9.0, 3.0]
      m: [0.5, 1.3, 2.0, 0.8]
      L: [1.0, 0.6, 2.0, 1.5]
    tolerance: 1e-10
    shown: ['id="p1-omega2"']
    source: {cite: reading1, at: 'p. 2 (dispersion relation of the mesh)'}
    origin: page-own

  - id: p1-sin2-1
    where: 'Problem 1(a), solution: squared sine for n = 1'
    formula: sin(pi/8)**2
    expected: 0.146
    shown: ['$\sin^2(\pi/8) = 0.146$']
    source: {cite: mit, at: 'Problem 8.1(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-sin2-2
    where: 'Problem 1(a), solution: squared sine for n = 2'
    formula: sin(2*pi/8)**2
    expected: 0.5
    tolerance: 1e-9
    shown: ['$\sin^2(2\pi/8) = 0.5$']
    source: {cite: mit, at: 'Problem 8.1(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-sin2-3
    where: 'Problem 1(a), solution: squared sine for n = 3'
    formula: sin(3*pi/8)**2
    expected: 0.854
    shown: ['$\sin^2(3\pi/8) = 0.854$']
    source: {cite: mit, at: 'Problem 8.1(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-highest-over-lowest
    where: 'Problem 1(a), check: frequency of mode (3, 3) over that of mode (1, 1), for any tensions'
    formula: sin(3*pi/8)/sin(pi/8)
    expected: 2.414
    shown: ['1 + \sqrt2 = 2.414']
    source: {cite: mit, at: 'Problem 8.1(a), p. 2 (our own check)'}
    origin: page-own

  - id: p1-highest-over-lowest-root
    kind: identity
    where: 'Problem 1(a), check: sin(3 pi/8)/sin(pi/8) is 1 + sqrt 2'
    formula: sin(3*pi/8)/sin(pi/8) + 0*u
    equals: 1 + sqrt(2) + 0*u
    samples:
      u: [1, 2]
    tolerance: 1e-12
    shown: ['\sin(3\pi/8)/\sin(\pi/8) = 1 + \sqrt2']
    source: {cite: mit, at: 'Problem 8.1(a), p. 2 (our own check)'}
    origin: page-own

  - id: p1-equal-tensions
    where: 'Problem 1(a), check: with equal tensions the modes (1, 3), (3, 1) and (2, 2) share a frequency'
    formula: sin(pi/8)**2 + sin(3*pi/8)**2
    expected: 1
    tolerance: 1e-12
    shown: ['\sin^2(\pi/8) + \sin^2(3\pi/8) = 1 = 2\sin^2(2\pi/8)']
    source: {cite: mit, at: 'Problem 8.1(a), p. 2 (our own check)'}
    origin: page-own

  - id: p1-second-term-smallest
    where: 'Problem 1(b), solution: the smallest value of 1000 sin^2(n_y pi/8)'
    formula: 1000*sin(pi/8)**2
    expected: 146
    shown: ['The second term is at least 146']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-first-term-largest
    where: 'Problem 1(b), solution: the largest value of sin^2(n_x pi/8)'
    formula: sin(3*pi/8)**2
    expected: 0.854
    shown: ['the first at most 0.854']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  # The table: omega of mode (nx, ny) over omega of mode (1, 1) for T_v = 1000 T_h.
  - id: p1-table-2
    where: 'Problem 1(b), table: mode 2, (2, 1)'
    inputs: {nx: 2, ny: 1}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 1.0012
    shown: ['| 1.0012 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-3
    where: 'Problem 1(b), table: mode 3, (3, 1)'
    inputs: {nx: 3, ny: 1}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 1.0024
    shown: ['| 1.0024 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-4
    where: 'Problem 1(b), table: mode 4, (1, 2)'
    inputs: {nx: 1, ny: 2}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 1.8471
    shown: ['| 1.8471 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-5
    where: 'Problem 1(b), table: mode 5, (2, 2)'
    inputs: {nx: 2, ny: 2}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 1.8478
    shown: ['| 1.8478 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-6
    where: 'Problem 1(b), table: mode 6, (3, 2)'
    inputs: {nx: 3, ny: 2}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 1.8484
    shown: ['| 1.8484 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-7
    where: 'Problem 1(b), table: mode 7, (1, 3)'
    inputs: {nx: 1, ny: 3}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 2.4132
    shown: ['| 2.4132 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-8
    where: 'Problem 1(b), table: mode 8, (2, 3)'
    inputs: {nx: 2, ny: 3}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 2.4137
    shown: ['| 2.4137 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-table-9
    where: 'Problem 1(b), table: mode 9, (3, 3)'
    inputs: {nx: 3, ny: 3}
    formula: sqrt((sin(nx*pi/8)**2 + 1000*sin(ny*pi/8)**2)/(1001*sin(pi/8)**2))
    expected: 2.4142
    shown: ['| 2.4142 |']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  # The answer box by another route: omega^2 of modes (1, 2) and (1, 1) from the force on the corner bead
  # (j, k) = (1, 1), whose neighbours are beads (1, 2) and (2, 1) and two points of the frame (displacement 0).
  - id: p1-ratio
    answer: p1-ratio
    where: 'Problem 1(b), answer box: frequency of mode 4 over that of mode 1, from the forces on the corner bead'
    formula: sqrt(((2*sin(pi/4) - sin(2*pi/4))/sin(pi/4) + 1000*(2*sin(2*pi/4) - sin(4*pi/4))/sin(2*pi/4))/(1001*(2*sin(pi/4) - sin(2*pi/4))/sin(pi/4)))
    expected: 1.847
    shown: ['id="p1-ratio"']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-omega1
    where: 'Problem 1(b), solution: the lowest frequency in units of sqrt(T_h/(m L))'
    formula: sqrt(16*1001*sin(pi/8)**2)
    expected: 48.43
    shown: ['\omega_1 = 48.43\sqrt{T_h/(mL)}']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-centre-over-corner
    where: 'Problem 1(b), solution: displacement of the centre bead over that of a corner bead in mode 1'
    formula: sin(2*pi/4)**2/sin(pi/4)**2
    expected: 2
    tolerance: 1e-9
    shown: ['the centre bead moves twice as far as a corner bead']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-group-2
    where: 'Problem 1(b), check: second frequency of a single string with three beads over its first'
    formula: sin(2*pi/8)/sin(pi/8)
    expected: 1.848
    shown: ['near 1, 1.848 and 2.414 times']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own check)'}
    origin: page-own

  - id: p1-group-3
    where: 'Problem 1(b), check: third frequency of a single string with three beads over its first'
    formula: sin(3*pi/8)/sin(pi/8)
    expected: 2.414
    shown: ['near 1, 1.848 and 2.414 times']
    source: {cite: mit, at: 'Problem 8.1(b), p. 2 (our own check)'}
    origin: page-own

  # ---- Problem 2: the beam through the plate (alpha = 60 degrees = pi/3, beta = 30 degrees = pi/6)

  - id: p2-given
    kind: fact
    where: 'Problem 2, statement: the two angles'
    shown: ['$\alpha = 60°$ with the normal to the plate', '$\beta = 30°$ with the normal']
    source: {cite: mit, at: 'Problem 8.2, p. 2'}
    origin: mit

  # The index at which Snell's law at the first face gives a sine of exactly 1 in the plate.
  - id: p2-limit
    answer: p2-limit
    where: 'Problem 2(a), answer box: the index of the plate at which sin(theta_2) = sin(60 deg)/n_2 reaches 1'
    formula: solve('sin(pi/3)/q - 1', 'q', 0.5, 1.5)
    expected: 0.866
    shown: ['id="p2-limit"']
    source: {cite: reading1, at: 'p. 7 (Snell''s law and the condition for no transmission)'}
    origin: page-own

  - id: p2-limit-shown
    where: 'Problem 2(a), solution: half the square root of 3'
    formula: sqrt(3)/2
    expected: 0.866
    shown: ['\frac{\sqrt3}{2} = 0.866']
    source: {cite: mit, at: 'Problem 8.2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-angle
    answer: p2-angle
    where: 'Problem 2(a), answer box: the angle in a plate of index 1.5, as the numerical root of Snell''s law'
    formula: solve('1.5*sin(q) - sin(pi/3)', 'q', 0, 1.5)*180/pi
    expected: 35.26
    shown: ['id="p2-angle"']
    source: {cite: reading1, at: 'p. 7 (Snell''s law)'}
    origin: page-own

  - id: p2-angle-sine
    where: 'Problem 2(a), solution: the sine of the angle in the sample plate'
    formula: 0.866/1.5
    expected: 0.577
    shown: ['0.866/1.5 = 0.577']
    source: {cite: mit, at: 'Problem 8.2(a), p. 2 (our own check)'}
    origin: page-own

  - id: p2-angle-shown
    where: 'Problem 2(a), solution: the angle in the sample plate from the inverse sine'
    formula: asin(sin(pi/3)/1.5)*180/pi
    expected: 35.26
    shown: ['so $\theta_2 = 35.26°$']
    source: {cite: mit, at: 'Problem 8.2(a), p. 2 (our own check)'}
    origin: page-own

  - id: p2-n3
    answer: p2-n3
    where: 'Problem 2(b), answer box: the third index, as the numerical root of n_3 sin(30 deg) = sin(60 deg)'
    formula: solve('q*sin(pi/6) - sin(pi/3)', 'q', 1, 3)
    expected: 1.732
    shown: ['id="p2-n3"']
    source: {cite: reading1, at: 'p. 7 (Snell''s law)'}
    origin: page-own

  - id: p2-n3-shown
    where: 'Problem 2(b), solution: the square root of 3'
    formula: sqrt(3)
    expected: 1.732
    shown: ['\frac{\sin 60°}{\sin 30°} = \sqrt3 = 1.732']
    source: {cite: mit, at: 'Problem 8.2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-check-plate
    where: 'Problem 2(b), check: n sin(theta) in the sample plate'
    formula: 1.5*sin(35.26*pi/180)
    expected: 0.866
    shown: ['$1.5 \times \sin 35.26° = 0.866 = 1.732 \times \sin 30°$']
    source: {cite: mit, at: 'Problem 8.2(b), p. 2 (our own check)'}
    origin: page-own

  - id: p2-check-third
    where: 'Problem 2(b), check: n sin(theta) in the third material'
    formula: 1.732*sin(pi/6)
    expected: 0.866
    shown: ['$1.5 \times \sin 35.26° = 0.866 = 1.732 \times \sin 30°$']
    source: {cite: mit, at: 'Problem 8.2(b), p. 2 (our own check)'}
    origin: page-own

  # ---- Problem 3: the rainbow. alpha = 4 phi - 2 theta with sin(theta) = n sin(phi).
  # The page's formulas were also checked outside this file by tracing rays through a unit circle with
  # vectors (refraction, one or two reflections, refraction): the angles agree to 12 digits.

  - id: p3-given
    kind: fact
    where: 'Problem 3, statement: the angle of the rainbow and the index of water'
    shown: ['of about 40 to 42 degrees', 'with $n = 1.33$ (use any plotting tool)']
    source: {cite: mit, at: 'Problem 8.3, p. 3'}
    origin: mit

  # The angle as 180 degrees minus the three turns, with the angle in the drop from a numerical solve of Snell's law.
  - id: p3-alpha
    kind: identity
    answer: p3-alpha
    where: 'Problem 3(a), answer box: alpha, against pi minus the sum of the three turns with phi solved numerically from Snell''s law'
    formula: 4*asin(sin(th)/n) - 2*th
    equals: pi - (2*(th - solve('n*sin(q) - sin(th)', 'q', 0, 1.57)) + (pi - 2*solve('n*sin(q) - sin(th)', 'q', 0, 1.57)))
    samples:
      th: [0.3, 0.8, 1.2, 1.5]
      n: [1.33, 1.2, 1.5, 1.34]
    tolerance: 1e-8
    shown: ['id="p3-alpha"']
    source: {cite: reading1, at: 'p. 7 (Snell''s law and the law of reflection)'}
    origin: page-own

  # The angle of incidence where the numerical slope of alpha(theta) is zero.
  - id: p3-thetamax
    answer: p3-thetamax
    where: 'Problem 3(a), answer box: angle of incidence at the largest alpha, as the root of the numerical slope (n = 1.33)'
    formula: solve("deriv('4*asin(sin(p)/1.33) - 2*p', 'p', q)", 'q', 0.5, 1.4)*180/pi
    expected: 59.58
    shown: ['id="p3-thetamax"']
    source: {cite: mit, at: 'Problem 8.3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-thetamax-closed
    where: 'Problem 3(a), solution: the same angle from cos(theta) = sqrt((n^2 - 1)/3)'
    inputs: {n: 1.33}
    formula: acos(sqrt((n**2 - 1)/3))*180/pi
    expected: 59.58
    shown: ['this gives $\theta = 59.58°$']
    source: {cite: mit, at: 'Problem 8.3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-phimax
    where: 'Problem 3(a), solution: the angle inside the drop at the largest alpha'
    inputs: {n: 1.33}
    formula: asin(sin(acos(sqrt((n**2 - 1)/3)))/n)*180/pi
    expected: 40.42
    shown: ['Then $\phi = 40.42°$']
    source: {cite: mit, at: 'Problem 8.3(a), p. 3 (our own solution)'}
    origin: page-own

  # alpha evaluated at the numerical root of its slope.
  - id: p3-alphamax
    answer: p3-alphamax
    where: 'Problem 3(a), answer box: the largest alpha, evaluated at the root of the numerical slope (n = 1.33)'
    formula: (4*asin(sin(solve("deriv('4*asin(sin(p)/1.33) - 2*p', 'p', q)", 'q', 0.5, 1.4))/1.33) - 2*solve("deriv('4*asin(sin(p)/1.33) - 2*p', 'p', q)", 'q', 0.5, 1.4))*180/pi
    expected: 42.52
    shown: ['id="p3-alphamax"']
    source: {cite: mit, at: 'Problem 8.3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-alphamax-shown
    where: 'Problem 3(a), solution: the largest alpha from the two rounded angles'
    formula: 4*40.42 - 2*59.58
    expected: 42.52
    shown: ['4 \times 40.42° - 2 \times 59.58° = 42.52°']
    source: {cite: mit, at: 'Problem 8.3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-alpha-at-90
    where: 'Problem 3(a), caption: alpha at grazing incidence'
    formula: (4*asin(1/1.33) - pi)*180/pi
    expected: 15.0
    shown: ['falls to 15.0° at θ = 90°']
    source: {cite: mit, at: 'Problem 8.3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-alpha-at-55
    where: 'Problem 3(b), solution: alpha at an angle of incidence of 55 degrees'
    inputs: {d: 55}
    formula: (4*asin(sin(d*pi/180)/1.33) - 2*d*pi/180)*180/pi
    expected: 42.07
    shown: ['the curve is still at 42.07° and 42.06°']
    source: {cite: mit, at: 'Problem 8.3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-alpha-at-64
    where: 'Problem 3(b), solution: alpha at an angle of incidence of 64 degrees'
    inputs: {d: 64}
    formula: (4*asin(sin(d*pi/180)/1.33) - 2*d*pi/180)*180/pi
    expected: 42.06
    shown: ['the curve is still at 42.07° and 42.06°']
    source: {cite: mit, at: 'Problem 8.3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-alpha134
    answer: p3-alpha134
    where: 'Problem 3(c), answer box: the largest alpha for n = 1.34, evaluated at the root of the numerical slope'
    formula: (4*asin(sin(solve("deriv('4*asin(sin(p)/1.34) - 2*p', 'p', q)", 'q', 0.5, 1.4))/1.34) - 2*solve("deriv('4*asin(sin(p)/1.34) - 2*p', 'p', q)", 'q', 0.5, 1.4))*180/pi
    expected: 41.07
    shown: ['id="p3-alpha134"']
    source: {cite: mit, at: 'Problem 8.3(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-theta134
    where: 'Problem 3(c), solution: angle of incidence at the largest alpha for n = 1.34'
    inputs: {n: 1.34}
    formula: acos(sqrt((n**2 - 1)/3))*180/pi
    expected: 59.004
    shown: ['gives $\theta = 59.004°$']
    source: {cite: mit, at: 'Problem 8.3(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-phi134
    where: 'Problem 3(c), solution: angle inside the drop at the largest alpha for n = 1.34'
    inputs: {n: 1.34}
    formula: asin(sin(acos(sqrt((n**2 - 1)/3)))/n)*180/pi
    expected: 39.770
    shown: ['$\phi = 39.770°$ and']
    source: {cite: mit, at: 'Problem 8.3(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-alpha134-shown
    where: 'Problem 3(c), solution: the largest alpha for n = 1.34 from the two rounded angles'
    formula: 4*39.770 - 2*59.004
    expected: 41.07
    shown: ['4 \times 39.770° - 2 \times 59.004° = 41.07°']
    source: {cite: mit, at: 'Problem 8.3(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-shift
    where: 'Problem 3(c), check: shift of the bow for a change of 0.01 in n'
    formula: 42.52 - 41.07
    expected: 1.45
    shown: ['$42.52° - 41.07° = 1.45°$']
    source: {cite: mit, at: 'Problem 8.3(c), p. 3 (our own check)'}
    origin: page-own

  # The second bow: alpha_2 = pi + 2 theta - 6 phi, at the root of its numerical slope.
  - id: p3-second-theta
    where: 'Problem 3(d), solution: angle of incidence at the smallest alpha_2, as the root of the numerical slope (n = 1.33)'
    formula: solve("deriv('pi + 2*p - 6*asin(sin(p)/1.33)', 'p', q)", 'q', 0.8, 1.5)*180/pi
    expected: 71.94
    shown: ['For $n = 1.33$: $\theta = 71.94°$']
    source: {cite: mit, at: 'Problem 8.3(d), p. 3 (our own addition)'}
    origin: page-own

  - id: p3-second-theta-closed
    kind: identity
    where: 'Problem 3(d), solution: cos(theta) = sqrt((n^2 - 1)/8) against the root of the numerical slope'
    formula: acos(sqrt((n**2 - 1)/8))
