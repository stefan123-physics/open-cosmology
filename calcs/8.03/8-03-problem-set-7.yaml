# Calculations on content/year-2/8.03/8-03-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="..."> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this homework, so every answer is checked here by a route independent of the page:
# MIT's full formula for the phase velocity evaluated in the limit, numerical derivatives of omega(k) = k v_p,
# numerical roots of the tangent condition on the dispersion curve, and numerical Fourier integrals of the pulse.
# In the nested expressions q and p are the variables of the integral, derivative or solve.
# Problem 2: the curve drawn on the page is omega(k) = 7 - 6 [0.4 E(k; 0.6) + 0.6 E(k; 1.7)], with
# E(k; w) = [tanh((k + 3.5)/w) - tanh((k - 3.5)/w)]/(2 tanh(3.5/w)) (even in k, 1 at k = 0, 0 at large k),
# in units of 10^4 1/s with k in 1/m (a formula of our own, fitted to points read from MIT's Figure 1).

page: content/year-2/8.03/8-03-problem-set-7.mdx
calcs:
  # ---- Problem 1: water waves, v_p^2 = (g/k + T k/rho) tanh(k h)

  - id: p1-given
    kind: fact
    where: 'Problem 1, statement: the density of water and the critical wavelength MIT gives'
    shown: ['$\rho = 1$ g/cm³', 'MIT gives $\lambda_c = 2$ cm']
    source: {cite: mit, at: 'Problem 7.1, p. 1'}
    origin: mit

  - id: p1-density
    where: 'Problem 1, statement: 1 g/cm^3 in kg/m^3'
    inputs: {rho: "1 g/cm**3"}
    formula: rho
    expected: 1000 kg/m**3
    tolerance: 1e-9 kg/m**3
    shown: ['which is $1000$ kg/m³']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (unit conversion by us)'}
    origin: page-own

  - id: p1-g
    kind: fact
    where: 'Problem 1, statement: the value of g used for numbers (MIT only says "on Earth")'
    shown: ['take $g = 9.8$ m/s²']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (the value is ours)'}
    origin: page-own

  # The crossover as a numerical root: g/k = T k/rho solved for k, then lambda = 2 pi/k.
  - id: p1-lc
    kind: identity
    answer: p1-lc
    where: 'Problem 1(a), answer box: the wavelength 2 pi/k at the numerical root of "gravity term = surface-tension term"'
    formula: 2*pi*sqrt(T/(rho*g))
    equals: 2*pi/solve('g/q - T*q/rho', 'q', 1, 100000)
    samples:
      T: [0.0993, 0.05, 0.2]
      rho: [1000, 800, 13600]
      g: [9.8, 3.7, 9.8]
    tolerance: 1e-9
    shown: ['id="p1-lc"']
    source: {cite: mit, at: 'Problem 7.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-tension
    answer: p1-tension
    where: 'Problem 1(a), answer box: T as the numerical root of "the two terms are equal at lambda = 2 cm"'
    inputs: {rho: 1000, g: 9.8, lc: 0.02}
    formula: solve('g/(2*pi/lc) - q*(2*pi/lc)/rho', 'q', 0.001, 10)
    expected: 0.0993
    tolerance: 0.1%
    shown: ['id="p1-tension"']
    source: {cite: mit, at: 'Problem 7.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-tension-shown
    where: 'Problem 1(a), solution: T = rho g lambda_c^2/(4 pi^2)'
    inputs: {rho: 1000, g: 9.8, lc: 0.02}
    formula: rho*g*lc**2/(4*pi**2)
    expected: 0.099
    shown: ['\approx 0.099\ \text{N/m}', '\frac{1000 \times 9.8 \times (0.02)^2}{4\pi^2}']
    source: {cite: mit, at: 'Problem 7.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-term-ratio
    kind: identity
    where: 'Problem 1(a), check: gravity term over surface-tension term equals (lambda/lambda_c)^2'
    formula: (g/k)/(T*k/rho)
    equals: ((2*pi/k)/(2*pi*sqrt(T/(rho*g))))**2
    samples:
      T: [0.0993, 0.05, 0.2]
      rho: [1000, 800, 13600]
      g: [9.8, 3.7, 9.8]
      k: [3141.6, 10, 500]
    tolerance: 1e-9
    shown: ['\rho g/(Tk^2) = (\lambda/\lambda_c)^2']
    source: {cite: mit, at: 'Problem 7.1(a), p. 1 (our own check)'}
    origin: page-own

  # Shallow water: the full formula (T = 0) at k h of about 0.001, and the numerical slope of omega = k v_p there.
  - id: p1b-vp
    kind: identity
    answer: p1b-vp
    where: 'Problem 1(b), answer box: the full formula of MIT without surface tension at very small k h'
    formula: sqrt(g*h)
    equals: sqrt(g/k*tanh(k*h))
    samples:
      g: [9.8, 5, 15]
      h: [1, 0.5, 3]
      k: [0.001, 0.002, 0.0003]
    tolerance: 1e-5
    shown: ['id="p1b-vp"']
    source: {cite: mit, at: 'Problem 7.1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1b-vg
    kind: identity
    answer: p1b-vg
    where: 'Problem 1(b), answer box: numerical d omega/dk of omega = sqrt(g k tanh(k h)) at very small k h'
    formula: sqrt(g*h)
    equals: deriv('sqrt(g*q*tanh(q*h))', 'q', k)
    samples:
      g: [9.8, 5, 15]
      h: [1, 0.5, 3]
      k: [0.001, 0.002, 0.0003]
    tolerance: 1e-5
    shown: ['id="p1b-vg"']
    source: {cite: mit, at: 'Problem 7.1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1b-example
    where: 'Problem 1(b), check: speed in water 1 m deep'
    inputs: {g: 9.8, h: 1}
    formula: sqrt(g*h)
    expected: 3.1
    shown: ['\sqrt{9.8 \times 1} \approx 3.1$ m/s']
    source: {cite: mit, at: 'Problem 7.1(b), p. 1 (our own example)'}
    origin: page-own

  - id: p1b-series
    kind: identity
    where: 'Problem 1(b), check: the next term of the series, v_p = sqrt(g h)[1 - (k h)^2/6]'
    formula: sqrt(g*h)*(1 - (k*h)**2/6)
    equals: sqrt(g/k*tanh(k*h))
    samples:
      g: [9.8, 5, 15]
      h: [1, 0.5, 3]
      k: [0.1, 0.2, 0.03]
    tolerance: 1e-4
    shown: ['\left[1 - (kh)^2/6\right]']
    source: {cite: mit, at: 'Problem 7.1(b), p. 1 (our own check)'}
    origin: page-own

  # Deep water: the full formula (T = 0) at k h of 40 or more, and the numerical slope of omega there.
  - id: p1c-vp
    kind: identity
    answer: p1c-vp
    where: 'Problem 1(c), answer box: the full formula of MIT without surface tension at large k h'
    formula: sqrt(g/k)
    equals: sqrt(g/k*tanh(k*h))
    samples:
      g: [9.8, 5, 15]
      k: [1, 2, 0.5]
      h: [40, 20, 100]
    tolerance: 1e-9
    shown: ['id="p1c-vp"']
    source: {cite: mit, at: 'Problem 7.1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1c-vg
    kind: identity
    answer: p1c-vg
    where: 'Problem 1(c), answer box: numerical d omega/dk of omega = sqrt(g k tanh(k h)) at large k h'
    formula: sqrt(g/k)/2
    equals: deriv('sqrt(g*q*tanh(q*h))', 'q', k)
    samples:
      g: [9.8, 5, 15]
      k: [1, 2, 0.5]
      h: [40, 20, 100]
    tolerance: 1e-6
    shown: ['id="p1c-vg"']
    source: {cite: mit, at: 'Problem 7.1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1c-example-vp
    where: 'Problem 1(c), check: phase velocity of a 10 m wave on deep water'
    inputs: {g: 9.8, lam: 10}
    formula: sqrt(g*lam/(2*pi))
    expected: 3.9
    shown: ['$v_p \approx 3.9$ m/s']
    source: {cite: mit, at: 'Problem 7.1(c), p. 1 (our own example)'}
    origin: page-own

  - id: p1c-example-vg
    where: 'Problem 1(c), check: group velocity of a 10 m wave on deep water'
    inputs: {g: 9.8, lam: 10}
    formula: sqrt(g*lam/(2*pi))/2
    expected: 2.0
    shown: ['$v_g \approx 2.0$ m/s']
    source: {cite: mit, at: 'Problem 7.1(c), p. 1 (our own example)'}
    origin: page-own

  - id: p1c-tanh
    where: 'Problem 1(c), check: tanh(k h) when the depth is half a wavelength'
    inputs: {lam: 1, h: 0.5}
    formula: tanh(2*pi/lam*h)
    expected: 0.996
    shown: ['\tanh\pi \approx 0.996']
    source: {cite: mit, at: 'Problem 7.1(c), p. 1 (our own check)'}
    origin: page-own

  # Capillary waves: the full formula with gravity kept, at k of about 10^6 per metre in deep water, and the numerical slope of omega there.
  - id: p1d-vp
    kind: identity
    answer: p1d-vp
    where: 'Problem 1(d), answer box: the full formula of MIT at a wave number where gravity is negligible'
    formula: sqrt(T*k/rho)
    equals: sqrt((g/k + T*k/rho)*tanh(k*h))
    samples:
      T: [0.0993, 0.05, 0.2]
      k: [1000000, 2000000, 500000]
      rho: [1000, 800, 1200]
      g: [9.8, 9.8, 9.8]
      h: [1, 1, 1]
    tolerance: 1e-5
    shown: ['id="p1d-vp"']
    source: {cite: mit, at: 'Problem 7.1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1d-vg
    kind: identity
    answer: p1d-vg
    where: 'Problem 1(d), answer box: numerical d omega/dk of the full omega(k) where gravity is negligible'
    formula: 3*sqrt(T*k/rho)/2
    equals: deriv('sqrt((g*q + T*q**3/rho)*tanh(q*h))', 'q', k)
    samples:
      T: [0.0993, 0.05, 0.2]
      k: [1000000, 2000000, 500000]
      rho: [1000, 800, 1200]
      g: [9.8, 9.8, 9.8]
      h: [1, 1, 1]
    tolerance: 1e-5
    shown: ['id="p1d-vg"']
    source: {cite: mit, at: 'Problem 7.1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1d-example-vp
    where: 'Problem 1(d), check: phase velocity of 2 mm ripples with the T of part (a)'
    inputs: {rho: 1000, g: 9.8, lc: 0.02, lam: 0.002}
    formula: sqrt(rho*g*lc**2/(4*pi**2)*(2*pi/lam)/rho)
    expected: 0.56
    shown: ['$v_p \approx 0.56$ m/s']
    source: {cite: mit, at: 'Problem 7.1(d), p. 1 (our own example)'}
    origin: page-own

  - id: p1d-example-vg
    where: 'Problem 1(d), check: group velocity of 2 mm ripples'
    inputs: {rho: 1000, g: 9.8, lc: 0.02, lam: 0.002}
    formula: 1.5*sqrt(rho*g*lc**2/(4*pi**2)*(2*pi/lam)/rho)
    expected: 0.84
    shown: ['$v_g \approx 0.84$ m/s']
    source: {cite: mit, at: 'Problem 7.1(d), p. 1 (our own example)'}
    origin: page-own

  - id: p1d-example-ratio
    where: 'Problem 1(d), check: the gravity term over the surface-tension term for 2 mm ripples'
    inputs: {rho: 1000, g: 9.8, lc: 0.02, lam: 0.002}
    formula: (g/(2*pi/lam))/(rho*g*lc**2/(4*pi**2)*(2*pi/lam)/rho)
    expected: 0.01
    tolerance: 1e-9
    shown: ['(\lambda/\lambda_c)^2 = 0.01$', 'so 1% of it']
    source: {cite: mit, at: 'Problem 7.1(d), p. 1 (our own check)'}
    origin: page-own

  - id: p1-vg-relation
    kind: identity
    where: 'Problem 1(d), check: v_g = v_p + k dv_p/dk, with the full deep-water formula'
    formula: deriv('q*sqrt(g/q + T*q/rho)', 'q', k)
    equals: sqrt(g/k + T*k/rho) + k*deriv('sqrt(g/q + T*q/rho)', 'q', k)
    samples:
      T: [0.0993, 0.05, 0.2]
      rho: [1000, 800, 1200]
      g: [9.8, 9.8, 3.7]
      k: [100, 400, 900]
    tolerance: 1e-6
    shown: ['v_g = v_p + k\,\frac{dv_p}{dk}']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (our own check)'}
    origin: page-own

  - id: p1-equal-at-crossover
    kind: identity
    where: 'Problem 1(d), check: at k_c the group velocity (numerical slope of omega) equals the phase velocity'
    formula: sqrt(2*g/sqrt(rho*g/T))
    equals: deriv('sqrt(g*q + T*q**3/rho)', 'q', sqrt(rho*g/T))
    samples:
      T: [0.0993, 0.05, 0.2]
      rho: [1000, 800, 1200]
      g: [9.8, 9.8, 3.7]
    tolerance: 1e-6
    shown: ['so $v_g = v_p$. For water']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (our own check)'}
    origin: page-own

  - id: p1-vmin
    where: 'Problem 1(d), check: the smallest phase velocity on deep water, v_p at lambda_c = 2 cm'
    inputs: {rho: 1000, g: 9.8, lc: 0.02}
    formula: sqrt(g/(2*pi/lc) + rho*g*lc**2/(4*pi**2)*(2*pi/lc)/rho)
    expected: 0.25
    shown: ['\sqrt{g\lambda_c/\pi} \approx 0.25$ m/s']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (our own check)'}
    origin: page-own

  - id: p1-vmin-is-minimum
    where: 'Problem 1(d), check: the phase velocity has zero slope in k at k_c'
    inputs: {T: 0.0993, rho: 1000, g: 9.8}
    formula: deriv('sqrt(g/q + T*q/rho)', 'q', sqrt(rho*g/T))
    expected: 0
    tolerance: 1e-9
    shown: ['there $dv_p/dk = 0$']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (our own check)'}
    origin: page-own

  - id: p1-plot-t-over-rho
    where: 'Problem 1(d), graph: T/rho in m^3/s^2 used in the two curves'
    inputs: {g: 9.8, lc: 0.02}
    formula: g*lc**2/(4*pi**2)
    expected: 9.929e-5
    shown: ['9.929e-5*200*pi/L']
    source: {cite: mit, at: 'Problem 7.1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-plot-point
    where: 'Problem 1(d), graph: the marked point, v_p = v_g at lambda = 2 cm, in cm/s'
    inputs: {g: 9.8, lc: 0.02}
    formula: 100*sqrt(g*lc/pi)
    expected: 24.98
    shown: ['y: 24.98']
    source: {cite: mit, at: 'Problem 7.1, p. 1 (our own check)'}
    origin: page-own

  # ---- Problem 2: the dispersion curve (omega in 10^4 1/s, k in 1/m, speeds in 10^4 m/s, all as plain numbers)

  - id: p2-given
    kind: fact
    where: 'Problem 2: the frequency at which the curve of MIT starts'
    shown: ['The curve starts at $\omega_0 = 1 \times 10^4$ s⁻¹ at $k = 0$.']
    source: {cite: mit, at: 'Problem 7.2(c), p. 2'}
    origin: mit

  - id: p2-curve-start
    where: 'Problem 2, graph: the drawn curve starts at omega = 1 at k = 0'
    formula: 7 - 1.2*(tanh((0 + 3.5)/0.6) - tanh((0 - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((0 + 3.5)/1.7) - tanh((0 - 3.5)/1.7))/tanh(3.5/1.7)
    expected: 1
    tolerance: 1e-12
    shown: ['It leaves the vertical axis horizontally at ω = 1 × 10⁴ s⁻¹']
    source: {cite: mit, at: 'Problem 7.2, Figure 1, p. 2 (our own curve)'}
    origin: page-own

  - id: p2-curve-flat-start
    where: 'Problem 2, graph: the drawn curve is horizontal at k = 0 (v_g = 0 there)'
    formula: deriv('7 - 1.2*(tanh((q + 3.5)/0.6) - tanh((q - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((q + 3.5)/1.7) - tanh((q - 3.5)/1.7))/tanh(3.5/1.7)', 'q', 0)
    expected: 0
    tolerance: 1e-9
    shown: ['v_g = \frac{d\omega}{dk} \to 0']
    source: {cite: mit, at: 'Problem 7.2(c), p. 2 (our own curve)'}
    origin: page-own

  - id: p2-curve-top
    kind: limit
    where: 'Problem 2, graph: the drawn curve tends to 7 at large k'
    formula: 7 - 1.2*(tanh((k + 3.5)/0.6) - tanh((k - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((k + 3.5)/1.7) - tanh((k - 3.5)/1.7))/tanh(3.5/1.7)
    limit: 7
    vary: {k: [8, 12, 20, 40, 80]}
    tolerance: 1e-9
    shown: ['flattens out towards 7 × 10⁴ s⁻¹']
    source: {cite: mit, at: 'Problem 7.2, Figure 1, p. 2 (our own curve)'}
    origin: page-own

  # The two tangent points as the extrema of omega/k: d(omega/k)/dk = 0, by numerical derivative and Brent root.
  - id: p2-low
    answer: p2-low
    where: 'Problem 2(a), answer box: omega where v_p = omega/k has its minimum (numerical derivative and root)'
    formula: 7 - 1.2*(tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 1.5, 3) + 3.5)/0.6) - tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 1.5, 3) - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 1.5, 3) + 3.5)/1.7) - tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 1.5, 3) - 3.5)/1.7))/tanh(3.5/1.7)
    expected: 1.56
    tolerance: 0.2%
    shown: ['id="p2-low"']
    source: {cite: mit, at: 'Problem 7.2(a), p. 2 (our own solution, for the curve drawn on the page)'}
    origin: page-own

  - id: p2-high
    answer: p2-high
    where: 'Problem 2(a), answer box: omega where v_p = omega/k has its maximum'
    formula: 7 - 1.2*(tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 4, 5) + 3.5)/0.6) - tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 4, 5) - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 4, 5) + 3.5)/1.7) - tanh((solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 4, 5) - 3.5)/1.7))/tanh(3.5/1.7)
    expected: 5.82
    tolerance: 0.2%
    shown: ['id="p2-high"']
    source: {cite: mit, at: 'Problem 7.2(a), p. 2 (our own solution, for the curve drawn on the page)'}
    origin: page-own

  - id: p2-low-k
    where: 'Problem 2(a), solution: wave number of the lower tangent point'
    formula: solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 1.5, 3)
    expected: 2.175
    tolerance: 0.001
    shown: ['near $k \approx 2.2$ per metre', 'x: 2.175']
    source: {cite: mit, at: 'Problem 7.2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-high-k
    where: 'Problem 2(a), solution: wave number of the upper tangent point'
    formula: solve('deriv("(7 - 1.2*(tanh((p + 3.5)/0.6) - tanh((p - 3.5)/0.6))/tanh(3.5/0.6) - 1.8*(tanh((p + 3.5)/1.7) - tanh((p - 3.5)/1.7))/tanh(3.5/1.7))/p", "p", q)', 'q', 4, 5)
    expected: 4.311
    tolerance: 0.001
    shown: ['near $k \approx 4.3$ per metre', 'x: 4.311']
    source: {cite: mit, at: 'Problem 7.2(a), p. 2 (our own solution)'}
    origin: page-own

