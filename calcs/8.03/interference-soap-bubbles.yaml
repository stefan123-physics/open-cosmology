# Calculations on content/year-2/8.03/interference-soap-bubbles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 20 notes and transcript, with the page's own example.

page: content/year-2/8.03/interference-soap-bubbles.mdx
calcs:
  - id: average-intensity
    kind: identity
    where: 'time average of (A₁cos(u + φ₁) + A₂cos(u + φ₂))² over u from 0 to 2π equals A₁²/2 + A₂²/2 + A₁A₂cos(φ₁ − φ₂) (A₁ = 1, A₂ = 0.5, φ₂ = 0)'
    formula: integrate('(cos(s + p) + 0.5*cos(s))**2', 's', 0, 2*pi)/(2*pi)
    equals: 0.5 + 0.125 + 0.5*cos(p)
    samples: {p: [0.0, 1.0, 3.14159]}
    tolerance: 1e-6
    shown: ['A_1A_2\cos\delta\right], \qquad']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: air-soap-r
    where: 'R = (1 − 1.5)/(1 + 1.5); reflected intensity R²'
    inputs: {}
    formula: ((1 - 1.5)/(1 + 1.5))**2
    expected: '0.04'
    tolerance: 1e-12
    shown: ['1.5 \cdot 0.8^2\,I_0 = 0.96\,I_0']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: air-soap-t
    where: 'transmitted intensity n₂T² = 1.5 × 0.8²'
    inputs: {}
    formula: 1.5*(2/2.5)**2
    expected: '0.96'
    tolerance: 1e-12
    shown: ['1.5 \cdot 0.8^2\,I_0 = 0.96\,I_0']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: second-reflection
    where: '4% × 96% × 96% of the intensity'
    inputs: {}
    formula: 100*0.04*0.96*0.96
    expected: '3.7'
    tolerance: 0.05
    shown: ['3.7% comes out towards the eye']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: thin-film
    where: 'λ_max = 4 × 100 nm × 1.5/(2N − 1) for N = 1, 2, 3'
    inputs: {}
    formula: 4*100*1.5/(2*3 - 1)
    expected: '120'
    tolerance: 1e-9
    shown: ['= 600$, 200, 120 nm']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: thick-500
    where: '600 μm/(2 × 500 − 1) in nm'
    inputs: {}
    formula: 600000/(2*500 - 1)
    expected: '600.6'
    tolerance: 0.05
    shown: ['$N = 500$ gives 600.6 nm']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: thick-501
    where: '600 μm/(2 × 501 − 1) in nm'
    inputs: {}
    formula: 600000/(2*501 - 1)
    expected: '599.4'
    tolerance: 0.05
    shown: ['$N = 501$ gives 599.4 nm']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: thick-502
    where: '600 μm/(2 × 502 − 1) in nm'
    inputs: {}
    formula: 600000/(2*502 - 1)
    expected: '598.2'
    tolerance: 0.05
    shown: ['$N = 502$ gives 598.2 nm']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: constructive-check
    kind: identity
    where: 'at λ = 4dn₂/(2N − 1), δ = 2d·2π/(λ/n₂) + π = 2Nπ'
    formula: 2*d*2*pi/((4*d*1.5/(2*N - 1))/1.5) + pi
    equals: 2*N*pi
    samples: {d: [100.0, 250.0], N: [1, 3]}
    tolerance: 1e-9
    shown: ['frac{2d}{\lambda/n_2}\,2\pi + \pi" cite']
    source: {cite: reading1, at: 'p. 4'}
    origin: mit

  - id: ex-max
    where: 'example: ½(1.0 + 0.50)²'
    inputs: {}
    formula: 0.5*(1.0 + 0.50)**2
    expected: '1.125'
    tolerance: 1e-12
    shown: ['frac12(1.5)^2 = 1.125']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-min
    where: 'example: ½(1.0 − 0.50)²'
    inputs: {}
    formula: 0.5*(1.0 - 0.50)**2
    expected: '0.125'
    tolerance: 1e-12
    shown: ['frac12(0.50)^2 = 0.125']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-ratio
    where: 'example: 1.125/0.125'
    inputs: {}
    formula: 1.125/0.125
    expected: '9'
    tolerance: 1e-12
    shown: ['The ratio is 9']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: ex-film-1
    where: 'example: 4 × 120 × 1.33'
    inputs: {}
    formula: 4*120*1.33
    expected: '638'
    tolerance: 0.5
    shown: ['approx 638$ nm for']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-film-2
    where: 'example: 638.4/3'
    inputs: {}
    formula: 4*120*1.33/3
    expected: '213'
    tolerance: 0.5
    shown: ['213 nm for $N = 2$']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-film-dark
    where: 'example: 2 × 120 × 1.33'
    inputs: {}
    formula: 2*120*1.33
    expected: '319'
    tolerance: 0.5
    shown: ['approx 319$ nm']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own
