# Calculations on content/year-2/8.03/two-dimensional-waves-snells-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 16 notes and transcript, with the page's own example.

page: content/year-2/8.03/two-dimensional-waves-snells-law.mdx
calcs:
  - id: continuum-limit
    kind: identity
    where: '(4T/ma)(k_x²a²/4) + (4T/ma)(k_y²a²/4) = (Ta/m)(k_x² + k_y²)'
    formula: (4*T/(m*a))*(kx**2*a**2/4) + (4*T/(m*a))*(ky**2*a**2/4)
    equals: (T*a/m)*(kx**2 + ky**2)
    samples: {T: [1.0, 3.0], m: [0.2, 0.5], a: [0.01, 0.002], kx: [1.0, 7.0], ky: [2.0, 0.5]}
    tolerance: 1e-12
    shown: ['frac{Ta}{m}(k_x^2 + k_y^2)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: small-angle
    kind: identity
    where: 'sin²(ka/2) ≈ (ka/2)² when ka is small'
    formula: sin(u/2)**2
    equals: (u/2)**2
    samples: {u: [0.001, 0.0005]}
    tolerance: 1e-6
    shown: ['frac{Ta}{m}(k_x^2 + k_y^2)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: interior-modes
    where: 'walls at L_H = 5a_H: n_x runs 1 to 5 − 1'
    inputs: {}
    formula: 5 - 1
    expected: '4'
    shown: ['L_H = 5a_H, \quad L_V = 4a_V']
    source: {cite: reading1, at: 'pp. 2–3'}
    origin: mit

  - id: reflected-kx
    where: 'k_αx = −√(ω²/v² − k_y²) equals −k_x for the incident wave (ω = 3, v = 1, k_y = 1, k_x = √8)'
    inputs: {}
    formula: -sqrt(3**2/1**2 - 1**2) + sqrt(8)
    expected: '0'
    tolerance: 1e-12
    shown: ['-k_x, \qquad k_{\beta x}']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: snell
    kind: identity
    where: 'equal k_y: |k| sin θ = |k′| sin θ′ with |k| = nω/c gives n sin θ = n′ sin θ′ (ω = c = 1): sin θ′ = (n/n′) sin θ makes both sides equal'
    formula: n1*sin(th)
    equals: n2*((n1/n2)*sin(th))
    samples: {n1: [1.0, 1.33], n2: [1.5, 1.0], th: [0.3, 0.6]}
    tolerance: 1e-12
    shown: ['n\sin\theta = n''\sin\theta'', \qquad']
    source: {cite: reading1, at: 'p. 7'}
    origin: mit

  - id: ex-v
    where: 'example: v = √(200/0.50)'
    inputs: {}
    formula: sqrt(200/0.50)
    expected: '20'
    tolerance: 1e-12
    shown: ['sqrt{200/0.50} = 20']
    source: {cite: reading1, at: 'p. 4'}
    origin: page-own

  - id: ex-f11
    where: 'example: f(1,1) = (v/2)√((1/0.5)² + (1/0.4)²)'
    inputs: {}
    formula: 10*sqrt((1/0.5)**2 + (1/0.4)**2)
    expected: '32.0'
    tolerance: 0.05
    shown: ['10\sqrt{4.0 + 6.25} \approx 32.0']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-f21
    where: 'example: f(2,1)'
    inputs: {}
    formula: 10*sqrt((2/0.5)**2 + (1/0.4)**2)
    expected: '47.2'
    tolerance: 0.05
    shown: ['10\sqrt{16 + 6.25} \approx 47.2']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-f12
    where: 'example: f(1,2)'
    inputs: {}
    formula: 10*sqrt((1/0.5)**2 + (2/0.4)**2)
    expected: '53.9'
    tolerance: 0.05
    shown: ['10\sqrt{4.0 + 25} \approx 53.9']
    source: {cite: reading1, at: 'p. 3'}
    origin: page-own

  - id: ex-sin
    where: 'example: sin θ′ = ½ sin 30°'
    inputs: {}
    formula: 0.5*sin(pi/6)
    expected: '0.25'
    tolerance: 1e-12
    shown: ['sin 30° = 0.25']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-angle
    where: 'example: θ′ = arcsin 0.25 in degrees'
    inputs: {}
    formula: asin(0.25)*180/pi
    expected: '14.5'
    tolerance: 0.05
    shown: ['approx 14.5°']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own

  - id: ex-critical
    where: 'example: 2 sin θ = 1 at θ = 30°'
    inputs: {}
    formula: asin(0.5)*180/pi
    expected: '30'
    tolerance: 1e-9
    shown: ['beyond $30°$']
    source: {cite: reading1, at: 'p. 7'}
    origin: page-own
