# Calculations on content/year-2/8.03/polarization-polarizers.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 17 notes and transcript, with the page's own example.

page: content/year-2/8.03/polarization-polarizers.mdx
calcs:
  - id: circular-x
    kind: identity
    where: 'Re[E₀ e^(−iωt)] at z = 0 is E₀ cos ωt (E₀ = 1): x component'
    formula: cos(-w)
    equals: cos(w)
    samples: {w: [0.3, 1.5, 4.0]}
    tolerance: 1e-12
    shown: ['E_0(\cos\omega t, -\sin\omega t)']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: circular-y
    kind: identity
    where: 'Re[−i E₀ e^(−iωt)] = Re[−i(cos ωt − i sin ωt)] = −sin ωt: y component, so the field turns clockwise'
    formula: -sin(w)
    equals: sin(-w)
    samples: {w: [0.3, 1.5, 4.0]}
    tolerance: 1e-12
    shown: ['E_0(\cos\omega t, -\sin\omega t)']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: circular-length
    kind: identity
    where: 'cos²ωt + sin²ωt = 1: constant length'
    formula: cos(w)**2 + sin(w)**2
    equals: 1 + 0*w
    samples: {w: [0.3, 1.5, 4.0]}
    tolerance: 1e-12
    shown: ['E_0(\cos\omega t, -\sin\omega t)']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: p-pi4
    where: 'P_θ at θ = π/4: cos²(π/4)'
    inputs: {}
    formula: cos(pi/4)**2
    expected: '0.5'
    tolerance: 1e-12
    shown: ['P_{\pi/4} = \begin{pmatrix} 1/2']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: malus-projection
    kind: identity
    where: 'P_θ applied to a unit field at angle φ gives length |cos(θ − φ)|: x component of P_θ(cos φ, sin φ) is cos θ cos(θ − φ)'
    formula: cos(th)**2*cos(ph) + cos(th)*sin(th)*sin(ph)
    equals: cos(th)*cos(th - ph)
    samples: {th: [0.3, 1.0, 2.0], ph: [1.2, 0.1, 0.5]}
    tolerance: 1e-12
    shown: ['I_f = I_0\cos^2\theta" cite']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: three-polarizers
    where: 'x then 45°: ½ × ½ of the unpolarized intensity'
    inputs: {}
    formula: 0.5*cos(pi/4)**2
    expected: '0.25'
    tolerance: 1e-12
    shown: ['the light comes out at $I_0/4$']
    source: {cite: reading2, at: 'p. 19'}
    origin: mit

  - id: water-index
    kind: fact
    where: 'refractive index of water quoted in the lecture'
    value: '1.33'
    shown: ['water ($n \approx 1.33$)']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: ex-cos30
    where: 'example: cos²30°'
    inputs: {}
    formula: cos(pi/6)**2
    expected: '0.75'
    tolerance: 1e-12
    shown: ['cos^2 30° = 0.75']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-after-two
    where: 'example: ½ × 0.75'
    inputs: {}
    formula: 0.5*cos(pi/6)**2
    expected: '0.375'
    tolerance: 1e-12
    shown: ['$0.375\,I_0$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-cos60
    where: 'example: cos²60°'
    inputs: {}
    formula: cos(pi/3)**2
    expected: '0.25'
    tolerance: 1e-12
    shown: ['cos^2 60° = 0.25']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-final
    where: 'example: 0.375 × 0.25'
    inputs: {}
    formula: 0.5*cos(pi/6)**2*cos(pi/3)**2
    expected: '0.094'
    tolerance: 0.0005
    shown: ['leaving $0.094\,I_0$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-critical
    where: 'example: arcsin(1/1.60) in degrees'
    inputs: {}
    formula: asin(1/1.60)*180/pi
    expected: '38.7'
    tolerance: 0.05
    shown: ['theta_c \approx 38.7°']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: quiz-critical
    where: 'quiz: arcsin(1/1.5) ≈ 41.8°'
    inputs: {}
    formula: asin(1/1.5)*180/pi
    expected: '41.8'
    tolerance: 0.05
    shown: ['so $\\theta_c \\approx 41.8°$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own
