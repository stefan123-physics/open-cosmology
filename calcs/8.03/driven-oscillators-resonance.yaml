# Calculations on content/year-2/8.03/driven-oscillators-resonance.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.03SC (Fall 2016) Lecture 3 notes and transcript, with the page's own example.

page: content/year-2/8.03/driven-oscillators-resonance.mdx
calcs:
  - id: critical-q
    where: 'critical damping γ = 2ω₀ means Q = ω₀/γ = 0.5'
    inputs: {}
    formula: 1/2
    expected: '0.5'
    tolerance: 1e-12
    shown: ['As $Q$ falls to $0.5$, that is $\gamma = 2\omega_0$']
    source: {cite: reading2, at: 'p. 2'}
    origin: mit

  - id: steady-state-solves
    kind: identity
    where: 'A cos(ω_d t − δ) with A, tan δ from the formulas solves θ̈ + γθ̇ + ω₀²θ = f₀ cos ω_d t (ω₀ = 2, γ = 0.5, ω_d = 1.5, f₀ = 1)'
    formula: deriv('(1/sqrt((4 - 2.25)**2 + 0.25*2.25))*cos(1.5*s - atan(0.75/1.75))', 's', t, 2) + 0.5*deriv('(1/sqrt((4 - 2.25)**2 + 0.25*2.25))*cos(1.5*s - atan(0.75/1.75))', 's', t, 1) + 4*(1/sqrt((4 - 2.25)**2 + 0.25*2.25))*cos(1.5*t - atan(0.75/1.75))
    equals: cos(1.5*t)
    samples: {t: [0.0, 0.8, 2.3]}
    tolerance: 1e-5
    shown: ['A(\omega_d) = \frac{f_0}{\sqrt{(\omega_0^2 - \omega_d^2)^2 + \gamma^2\omega_d^2}}, \qquad \tan\delta']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: slow-limit
    where: 'ω_d → 0 for the pendulum: f₀/ω₀² = ω₀²Δ/ω₀² = Δ (Δ = 0.03, ω₀ = 3)'
    inputs: {}
    formula: (3**2*0.03)/3**2
    expected: '0.03'
    tolerance: 1e-12
    shown: ['$A \to f_0/\omega_0^2 = \Delta$ and $\delta \to 0$']
    source: {cite: reading2, at: 'p. 12'}
    origin: mit

  - id: resonance-q-delta
    kind: identity
    where: 'A(ω₀) = f₀/(ω₀γ) = ω₀²Δ/(ω₀γ) = QΔ'
    formula: (w**2*D)/(w*g)
    equals: (w/g)*D
    samples: {w: [3.0, 10.0], g: [0.1, 0.5], D: [0.01, 0.02]}
    tolerance: 1e-12
    shown: ['= \frac{\omega_0^2\Delta}{\omega_0\gamma} = Q\,\Delta']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: q-100
    where: 'drive amplitude 1 cm, response about 1 m: Q ≈ 1/0.01'
    inputs: {}
    formula: 1/0.01
    expected: '100'
    tolerance: 1e-9
    shown: ['would mean $Q \approx 100$']
    source: {cite: reading2, at: 'p. 14'}
    origin: mit

  - id: glass
    where: 'the glass resonates at about 683 Hz (measured in the lecture)'
    kind: fact
    value: '683 Hz'
    shown: ['rings at about 683 Hz']
    source: {cite: reading2, at: 'pp. 17–18'}
    origin: mit

  - id: ex-q
    where: 'example: Q = 10/0.50'
    inputs: {}
    formula: 10/0.50
    expected: '20'
    tolerance: 1e-12
    shown: ['$Q = 10/0.50 = 20$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-static
    where: 'example: f₀/ω₀² = 2.0/100'
    inputs: {}
    formula: 2.0/100
    expected: '0.020'
    tolerance: 1e-12
    shown: ['$A \to f_0/\omega_0^2 = 2.0/100 = 0.020$ m']
    source: {cite: reading2, at: 'p. 12'}
    origin: page-own

  - id: ex-res
    where: 'example: f₀/(ω₀γ) = 2.0/5.0'
    inputs: {}
    formula: 2.0/(10*0.50)
    expected: '0.40'
    tolerance: 1e-12
    shown: ['$A = f_0/(\omega_0\gamma) = 2.0/5.0 = 0.40$ m']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-a8
    where: 'example: A(8) = 2/√(36² + 0.25·64)'
    inputs: {}
    formula: 2.0/sqrt((100 - 64)**2 + 0.25*64)
    expected: '0.055'
    tolerance: 0.0005
    shown: ['= 2.0/\sqrt{1312} \approx 0.055$ m']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-d8
    where: 'example: δ(8) = arctan(0.5·8/36)'
    inputs: {}
    formula: atan(0.5*8/36)
    expected: '0.11'
    tolerance: 0.005
    shown: ['$\delta \approx 0.11$ rad']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-a12
    where: 'example: A(12) = 2/√(44² + 0.25·144)'
    inputs: {}
    formula: 2.0/sqrt((100 - 144)**2 + 0.25*144)
    expected: '0.045'
    tolerance: 0.0005
    shown: ['= 2.0/\sqrt{1972} \approx 0.045$ m']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-d12
    where: 'example: δ(12) = π − arctan(6/44)'
    inputs: {}
    formula: pi - atan(6/44)
    expected: '3.01'
    tolerance: 0.005
    shown: ['$\delta \approx \pi - 0.136 \approx 3.01$ rad']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-ratio
    where: 'example: 0.40/0.055 ≈ 7.2 and 0.40/0.045 ≈ 8.9'
    inputs: {}
    formula: 0.40/(2.0/sqrt(1312))
    expected: '7.2'
    tolerance: 0.05
    shown: ['by a factor of about 7 to 9']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own
