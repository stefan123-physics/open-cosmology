  - id: curve-peak
    where: 'graph caption: the liquid-drop curve (8.033 slide 28 coefficients, no pairing term, Z on the stability line) peaks at about 8.7 MeV near A = 60 (maximum 8.682 MeV at A ≈ 65; 8.681 at A = 62)'
    inputs: {A: 65}
    formula: (15.8*A - 18.3*A**(2/3) - 0.714*(A/(2 + 0.01539*A**(2/3)))**2/A**(1/3) - 23.2*(A - 2*A/(2 + 0.01539*A**(2/3)))**2/A)/A
    expected: '8.7'
    tolerance: '1%'
    shown: ['it peaks at about 8.7 MeV near A = 60']
    source: {cite: reading1, at: 'slide 28'}
    origin: page-own

  - id: stability-z
    kind: identity
    where: 'graph curve: Z = A/(2 + 0.01539 A^(2/3)) makes the slide-28 formula largest in Z (dB/dZ = 0)'
    formula: -2*0.714*(A/(2 + 0.01539*A**(2/3)))/A**(1/3) + 4*23.2*(A - 2*A/(2 + 0.01539*A**(2/3)))/A
    equals: 0 * A
    samples: {A: [20.0, 62.0, 140.0, 235.0]}
    tolerance: 5e-3
    shown: ['for the most stable number of protons at each A']
    source: {cite: reading1, at: 'slide 28'}
    origin: page-own

