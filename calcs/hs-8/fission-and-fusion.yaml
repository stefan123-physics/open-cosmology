# Calculations on content/year-0/hs-8/fission-and-fusion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Block 6-8 constants: e = 1.6 × 10⁻¹⁹ C, 1 eV = 1.6 × 10⁻¹⁹ J, c = 3.00 × 10⁸ m/s, k = 9.0 × 10⁹ N m²/C², 1 u = 1.66 × 10⁻²⁷ kg.
# Masses in u and energies in MeV are written as plain numbers (1 u × c² = 931.5 MeV, MIT 22.02 Ch. 1, p. 6).

page: content/year-0/hs-8/fission-and-fusion.mdx
calcs:
  - id: mev-in-joules
    where: 'section "A handy unit": 1 MeV = 10⁶ eV in joules'
    inputs: {eV: 1.6e-19 J}
    formula: 1e6 * eV
    expected: 1.6e-13 J
    shown: ['$1\ \text{MeV} = 10^6\ \text{eV} = 1.6 \times 10^{-13}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 1.1.2, p. 6'}
    origin: page-own

  - id: u-energy-rounded-joules
    where: 'section "A handy unit": E = mc² for 1 u with rounded constants'
    inputs: {m: 1.66e-27 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 1.49e-10 J
    shown: ['$1.66 \times 10^{-27} \times (3.00 \times 10^8)^2 = 1.49 \times 10^{-10}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 1.1.2, p. 6'}
    origin: page-own

  - id: u-energy-rounded-mev
    where: 'section "A handy unit": the same energy in MeV with rounded constants'
    inputs: {m: 1.66e-27 kg, c: 3.00e8 m/s, MeV: 1.6e-13 J}
    formula: m * c**2 / MeV
    expected: '934'
    tolerance: '0.1%'
    shown: ['gives $934\ \text{MeV}$']
    source: {cite: mit, at: 'Sec. 1.1.2, p. 6'}
    origin: page-own

  - id: u-energy-precise
    where: 'formula "Energy of one atomic mass unit", the text after it, the summary and flashcards: 1 u × c² with CODATA constants'
    inputs: {m: 1.66053906892e-27 kg, c: 299792458 m/s, MeV: 1.602176634e-13 J}
    formula: m * c**2 / MeV
    expected: '931.5'
    tolerance: '0.01%'
    shown: ['1\ \text{u} \times c^2 = 931.5\ \text{MeV}', 'the answer is $931.5\ \text{MeV}$', 'times 931.5, is a binding energy in MeV', '$1\ \text{u}$ of mass is worth $931.5\ \text{MeV}$', '$1\\ \\text{u}$ of mass is worth $931.5\\ \\text{MeV}$', '1 u of mass is worth 931.5 MeV']
    source: {cite: nistUMeV, at: 'atomic mass constant energy equivalent, 931.494 103 72 MeV'}
    origin: page-own

  - id: u-energy-notes
    kind: fact
    where: 'formula "Energy of one atomic mass unit", its at: the notes give 931.502 MeV/u'
    value: '931.502'
    shown: ['(the notes give 931.502 MeV)']
    source: {cite: mit, at: 'Sec. 1.1.2, p. 6'}
    origin: mit

  - id: he4-parts
    where: 'worked example "The binding energy of helium-4", step "Mass of the parts"'
    inputs: {mp: 1.00728, mn: 1.00866}
    formula: 2 * mp + 2 * mn
    expected: '4.03188'
    tolerance: 1e-9
    shown: ['$2 \times 1.00728 + 2 \times 1.00866 = 4.03188\ \text{u}$']
    source: {cite: nistMp, at: 'proton and neutron masses in u (nistMp, nistMn)'}
    origin: page-own

  - id: he4-mass-defect
    where: 'worked example "The binding energy of helium-4", step "Mass defect", the flashcard and the summary'
    inputs: {parts: 4.03188, M: 4.00151}
    formula: parts - M
    expected: '0.03037'
    tolerance: 1e-9
    shown: ['$\Delta m = 4.03188 - 4.00151 = 0.03037\ \text{u}$', '$\\Delta m = 0.03037\\ \\text{u}$', '$\Delta m = 0.03037\ \text{u}$']
    source: {cite: nistMalpha, at: 'alpha particle mass in u'}
    origin: page-own

  - id: he4-percent
    where: 'worked example "The binding energy of helium-4", step "Mass defect": percentage of the mass of the parts'
    inputs: {}
    formula: 0.03037 / 4.03188 * 100
    expected: '0.75'
    tolerance: '1%'
    shown: ['0.75% lighter than its parts']
    source: {cite: mit, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: he4-binding-energy
    where: 'worked example "The binding energy of helium-4", step "Binding energy", the flashcard and the summary'
    inputs: {}
    formula: 0.03037 * 931.5
    expected: '28.3'
    tolerance: '0.2%'
    shown: ['$E_b = 0.03037 \times 931.5 = 28.3\ \text{MeV}$', '$E_b = 28.3\\ \\text{MeV}$', '$E_b = 28.3\ \text{MeV}$']
    source: {cite: mit, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: he4-binding-energy-joules
    where: 'worked example "The binding energy of helium-4", step "Binding energy": in joules'
    inputs: {MeV: 1.6e-13 J}
    formula: 0.03037 * 931.5 * MeV
    expected: 4.5e-12 J
    tolerance: '1%'
    shown: ['$4.5 \times 10^{-12}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 1.1.2, p. 6'}
    origin: page-own

  - id: he4-per-nucleon
    where: 'worked example "The binding energy of helium-4", step "Per nucleon", flashcard and summary'
    inputs: {}
    formula: 0.03037 * 931.5 / 4
    expected: '7.07'
    tolerance: '0.2%'
    shown: ['$28.3/4 = 7.07\ \text{MeV}$', 'about $7.07\\ \\text{MeV}$ per nucleon', '$7.07\ \text{MeV}$ per nucleon']
    source: {cite: mit, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: he4-vs-hydrogen
