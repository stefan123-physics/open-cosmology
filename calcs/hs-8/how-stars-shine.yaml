  - id: chem-per-kg
    where: 'worked example "Could the Sun be burning?", step "Energy per kilogram"; quiz 0 explanation'
    inputs: {dH: 393e3 J, M_C: 0.0120 kg}
    formula: dH / M_C
    expected: 3.3e7 J/kg
    shown: ['$393 \times 10^{3}\ \text{J}/0.0120\ \text{kg} = 3.3 \times 10^{7}\ \text{J/kg}$', 'about $3.3 \\times 10^{7}\\ \\text{J}$ per kilogram']
    source: {cite: chem, at: 'Sec. 12.2, ΔH = −393 kJ/mol for C + O₂ → CO₂'}
    origin: page-own

  - id: chem-total
    where: 'worked example "Could the Sun be burning?", step "The whole Sun"; quiz 0 explanation'
    inputs: {dH: 393e3 J, M_C: 0.0120 kg, M: 1.99e30 kg}
    formula: dH / M_C * M
    expected: 6.5e37 J
    shown: ['$E = 3.3 \times 10^{7} \times 1.99 \times 10^{30} = 6.5 \times 10^{37}\ \text{J}$', 'about $6.5 \\times 10^{37}\\ \\text{J}$']
    source: {cite: chem, at: 'Sec. 12.2'}
    origin: page-own

  - id: chem-time-s
    where: 'worked example "Could the Sun be burning?", step "Time"'
    inputs: {E: 6.5e37 J, L: 3.828e26 W}
    formula: E / L
    expected: 1.7e11 s
    shown: ['$t = E/L = 6.5 \times 10^{37}/(3.828 \times 10^{26}) = 1.7 \times 10^{11}\ \text{s}$']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

  - id: chem-time-yr
    where: 'worked example "Could the Sun be burning?", step "Time"; quiz 0; flashcard 0; summary: about 5400 years'
    inputs: {dH: 393e3 J, M_C: 0.0120 kg, M: 1.99e30 kg, L: 3.828e26 W, year: 3.156e7 s}
    formula: dH / M_C * M / L / year
    expected: 5400
    tolerance: '2%'
    shown: ['which is about 5400 years', 'enough for about 5400 years', 'Burning would last only about 5400 years', 'for only about 5400 years']
    source: {cite: mit, at: 'slide 10'}
    origin: page-own

