# Calculations on content/year-0/hs-8/how-stars-shine.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6-8: c = 3.00e8 m/s, 1 MeV = 1.6e-13 J, 1 u c² = 931.5 MeV, m_p = 1.67e-27 kg; G = 6.674e-11 (as PC 1's Block 2-3 lessons).
# Sun: L = 3.828e26 W, M = 1.99e30 kg, R = 6.96e8 m (NASA Sun Fact Sheet, rounded). 1 year = 3.156e7 s.
# Masses in u and energies in MeV are written as plain numbers.

page: content/year-0/hs-8/how-stars-shine.mdx
calcs:
  - id: sun-luminosity
    kind: fact
    where: 'section "The puzzle", worked examples, quiz 0 and summary: L = 3.828 × 10²⁶ W'
    value: 3.828e26 W
    shown: ['The Sun radiates $L = 3.828 \times 10^{26}\ \text{W}$ (NASA Sun Fact Sheet)', 'at $3.828 \\times 10^{26}\\ \\text{W}$']
    source: {cite: sunfact, at: 'Bulk parameters: luminosity 382.8 × 10²⁴ J/s'}
    origin: later-data

  - id: sun-mass
    kind: fact
