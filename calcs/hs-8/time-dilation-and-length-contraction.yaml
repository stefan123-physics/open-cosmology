# Calculations on content/year-0/hs-8/time-dilation-and-length-contraction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-8/time-dilation-and-length-contraction.mdx
calcs:
  - id: light-clock-pythagoras
    kind: identity
    where: 'section "Pythagoras gives the factor": solving (cΔt/2)² = d² + (vΔt/2)² for Δt gives γ times 2d/c'
    formula: (c * (2 * d / sqrt(c**2 - v**2)) / 2)**2 - (v * (2 * d / sqrt(c**2 - v**2)) / 2)**2
    equals: d**2
    samples: {c: [3.0e8, 3.0e8, 1.0], d: [0.9, 2.0, 1.0], v: [1.8e8, 2.7e8, 0.5]}
    tolerance: 1e-9
    shown: ['$\Delta t = (2d/c)/\sqrt{1 - v^2/c^2}$']
    source: {cite: mit, at: 'slides 5–6'}
    origin: page-own

  - id: tick-rest
    where: 'worked example "A light clock on a fast ship", step "On the ship"'
    inputs: {d: 0.90 m, c: 3.00e8 m/s}
    formula: 2 * d / c
    expected: 6.0e-9 s
    shown: ['$\Delta t_0 = 2d/c = 2 \times 0.90/(3.00 \times 10^8) = 6.0 \times 10^{-9}\ \text{s}$']
    source: {cite: mit, at: 'slides 5–6'}
    origin: page-own

  - id: gamma-060
    where: 'worked example, step "The Lorentz factor"; quiz 2 and the twin example use the same γ'
    inputs: {}
    formula: 1 / sqrt(1 - 0.60**2)
    expected: '1.25'
    shown: ['$\gamma = 1/\sqrt{1 - 0.60^2} = 1/\sqrt{0.64} = 1/0.80 = 1.25$']
    source: {cite: reading1, at: 'slide 15'}
    origin: page-own

  - id: tick-moving
    where: 'worked example, step "From the Earth"'
    inputs: {d: 0.90 m, c: 3.00e8 m/s}
    formula: 2 * d / c / sqrt(1 - 0.60**2)
    expected: 7.5e-9 s
    shown: ['$\Delta t = \gamma\Delta t_0 = 1.25 \times 6.0 = 7.5$ nanoseconds']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: tick-light-path
    where: 'worked example: light path in half a tick'
    inputs: {d: 0.90 m}
    formula: d / sqrt(1 - 0.60**2)
    expected: 1.125 m
    shown: ['the light travels $1.125\ \text{m}$']
    source: {cite: mit, at: 'slides 5–6'}
    origin: page-own

  - id: tick-ship-moves
    where: 'worked example: ship moves 0.60c × 3.75 ns'
    inputs: {d: 0.90 m}
    formula: 0.60 * d / sqrt(1 - 0.60**2)
    expected: 0.675 m
    shown: ['the ship moves $0.675\ \text{m}$']
    source: {cite: mit, at: 'slides 5–6'}
    origin: page-own

  - id: tick-check
    where: 'worked example: √(0.675² + 0.90²) = 1.125'
    inputs: {}
    formula: sqrt(0.675**2 + 0.90**2)
    expected: '1.125'
    shown: ['$\sqrt{0.675^2 + 0.90^2} = 1.125$']
    source: {cite: mit, at: 'slides 5–6'}
    origin: page-own

  - id: gamma-small-01
    where: 'section "How big is γ?": at 0.1c both γ and 1 + v²/(2c²) give 1.005'
