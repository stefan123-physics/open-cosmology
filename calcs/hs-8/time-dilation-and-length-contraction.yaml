  - id: muon-lifetime
    kind: fact
    where: 'section "Muons from space": the muon mean lifetime'
    value: 2.2e-6 s
    shown: ['its mean lifetime is $2.2\ \text{μs}$ (Particle Data Group)']
    source: {cite: pdg, at: 'muon mean life'}
    origin: later-data

  - id: muon-half-life
    where: 'half-life = mean lifetime × ln 2 (PDG mean life 2.1969811 μs)'
    inputs: {tau: 2.1969811e-6 s}
    formula: tau * log(2)
    expected: 1.52e-6 s
    shown: ['the half-life is $\ln 2$ times the mean lifetime: $2.2 \times \ln 2 = 1.52\ \text{μs}$']
    source: {cite: pdg, at: 'muon mean life'}
    origin: page-own

  - id: muon-light-distance
    where: 'even at the speed of light, about half a kilometre in one half-life'
    inputs: {tau: 2.2e-6 s, c: 3.00e8 m/s}
    formula: c * tau * log(2)
    expected: 0.5 km
    tolerance: '15%'
    shown: ['a muon would cover only about half a kilometre in one half-life']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: muon-trip-time
    where: 'worked example "Muons reaching the ground", step "Travel time in the Earth''s frame"'
    inputs: {h: 12000 m, c: 3.00e8 m/s}
    formula: h / (0.998 * c)
    expected: 4.01e-5 s
    shown: ['$t = 12\,000/(0.998 \times 3.00 \times 10^8) = 4.01 \times 10^{-5}\ \text{s}$, or $40.1\ \text{μs}$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: muon-halflives-plain
    where: 'step "(a) Without time dilation": number of half-lives, from h, v, c and the PDG mean life (unrounded 26.32)'
    inputs: {h: 12000 m, beta: 0.998, c: 3.00e8 m/s, tau: 2.1969811e-6 s}
    formula: h / (beta * c) / (tau * log(2))
    expected: '26.3'
    tolerance: '0.3%'
    shown: ['$40.08/1.523 = 26.3$ half-lives']
    source: {cite: reading1, at: 'slide 15'}
    origin: page-own

  - id: muon-fraction-plain
    where: 'step (a): (½)^26.32 = 1.19e-8'
    inputs: {h: 12000 m, beta: 0.998, c: 3.00e8 m/s, tau: 2.1969811e-6 s}
    formula: 0.5**(h / (beta * c) / (tau * log(2)))
    expected: '1.2e-8'
    tolerance: '1%'
    shown: ['$(\tfrac12)^{26.3} = 1.2 \times 10^{-8}$']
    source: {cite: mit, at: 'slide 6'}
    origin: page-own

  - id: muon-one-in
    where: 'step (a): about 1 muon in 84 million (unrounded 83.8 million)'
    inputs: {h: 12000 m, beta: 0.998, c: 3.00e8 m/s, tau: 2.1969811e-6 s}
    formula: 1 / 0.5**(h / (beta * c) / (tau * log(2)))
    expected: '8.4e7'
    tolerance: '1%'
    shown: ['about 1 muon in 84 million would survive']
    source: {cite: mit, at: 'slide 6'}
