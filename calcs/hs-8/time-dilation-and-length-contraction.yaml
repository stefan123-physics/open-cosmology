    inputs: {h: 12000 m, beta: 0.998, c: 3.00e8 m/s, tau: 2.1969811e-6 s}
    formula: h / (beta * c) / (tau * log(2) / sqrt(1 - beta**2))
    expected: '1.67'
    tolerance: '0.5%'
    shown: ['The trip is $40.1/24.0 = 1.67$ half-lives']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: muon-fraction-dilated
    where: 'step (b): (½)^1.664 = 0.316, about a third'
    inputs: {h: 12000 m, beta: 0.998, c: 3.00e8 m/s, tau: 2.1969811e-6 s}
    formula: 0.5**(h / (beta * c) / (tau * log(2) / sqrt(1 - beta**2)))
