  - id: muon-dilated-half-life
    where: 'step "(b) With time dilation": the dilated half-life (15.8 × 1.52 = 24.0 from the rounded values shown; unrounded 24.09 μs)'
    inputs: {beta: 0.998, tau: 2.1969811e-6 s}
    formula: tau * log(2) / sqrt(1 - beta**2)
    expected: 24.0e-6 s
    tolerance: '0.5%'
    shown: ['$15.8 \times 1.52 = 24.0\ \text{μs}$']
