# Calculations on content/year-0/hs-8/special-relativity-postulates.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-8/special-relativity-postulates.mdx
calcs:
  - id: quiz-parcel
    where: 'quiz 0: parcel thrown forwards at 15 m/s from a lorry at 20 m/s'
    inputs: {u: 15 m/s, v: 20 m/s}
    formula: u + v
    expected: 35 m/s
    shown: ['$15 + 20 = 35$ m/s']
    quiz: 0
    source: {cite: reading1, at: 'slide 12'}
    origin: page-own

  - id: quiz-spaceship-galilean
    where: 'quiz 1: the everyday rule would give 1.5c for light met head-on at 0.5c'
    inputs: {c: 1, v: 0.5}
    formula: c + v
    expected: '1.5'
    shown: ['would give $1.5c$, and that is wrong']
    source: {cite: reading1, at: 'slide 12'}
    origin: page-own

  - id: quiz-fringe-shift
    where: 'quiz 4: arms adding up to 6.0 m, 600 nm light, 30 km/s'
    inputs: {L: 6.0 m, lam: 600 nm, v: 30 km/s, c: 3.00e8 m/s}
    formula: L / lam * (v / c)**2
    expected: '0.10'
    tolerance: '1%'
    shown: ['$N \\approx \\frac{L_\\parallel + L_\\perp}{\\lambda}\\left(\\frac{v}{c}\\right)^2 = \\frac{6.0}{600 \\times 10^{-9}} \\times (10^{-4})^2 = 10^{7} \\times 10^{-8} = 0.10$ of a fringe']
    quiz: 4
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: quiz-twenty-times
    where: 'quiz 2: expected 0.2 fringe is twenty times the smallest visible shift 0.01'
    inputs: {N: 0.2, Nmin: 0.01}
    formula: N / Nmin
    expected: '20'
    shown: ['twenty times more than they could see']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: c-from-constants
    where: 'section "Light names no frame": c = 1/sqrt(mu0 eps0)'
    inputs: {mu0: 1.2566370614e-6 T*m/A, eps0: 8.85e-12 F/m}
    formula: 1 / sqrt(mu0 * eps0)
    expected: 3.00e8 m/s
    tolerance: '0.5%'
    shown: ['This gives $c = 3.00 \times 10^{8}$ m/s', '$c = 1/\sqrt{\mu_0\varepsilon_0} = 3.00 \times 10^8$ m/s']
    source: {cite: mit802, at: 'Eq. (13.4.15)'}
    origin: page-own

  - id: earth-orbital-speed
    kind: fact
    where: 'Earth moves round the Sun at about 30 km/s (the slide''s value)'
    value: 30 km/s
    shown: ['Sun at about 30 km/s', 'Earth''s orbital speed, $30$ km/s', 'at Earth''s 30 km/s']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: rower-upstream-speed
    where: 'worked example "Two rowers, one river", step "Along the current": upstream speed'
    inputs: {u: 1.30 m/s, w: 0.50 m/s}
    formula: u - w
    expected: 0.80 m/s
    shown: ['$1.30 - 0.50 = 0.80$ m/s']
    source: {cite: reading1, at: 'slide 12'}
    origin: page-own

  - id: rower-upstream-time
    where: 'worked example, upstream time'
    inputs: {d: 60 m, s: 0.80 m/s}
    formula: d / s
    expected: 75.0 s
    shown: ['$60/0.80 = 75.0$ s']
    source: {cite: reading1, at: 'slide 12'}
    origin: page-own

  - id: rower-downstream-speed
    where: 'worked example, downstream speed'
    inputs: {u: 1.30 m/s, w: 0.50 m/s}
    formula: u + w
    expected: 1.80 m/s
    shown: ['$1.30 + 0.50 = 1.80$ m/s']
    source: {cite: reading1, at: 'slide 12'}
    origin: page-own

  - id: rower-downstream-time
    where: 'worked example, downstream time'
    inputs: {d: 60 m, s: 1.80 m/s}
    formula: d / s
    expected: 33.3 s
    tolerance: '0.2%'
    shown: ['$60/1.80 = 33.3$ s']
    source: {cite: reading1, at: 'slide 12'}
    origin: page-own

  - id: rower-along-total
    where: 'worked example, total time along the current (t_parallel formula of slide 16)'
    inputs: {L: 60 m, u: 1.30 m/s, w: 0.50 m/s}
    formula: L / (u - w) + L / (u + w)
    expected: 108.3 s
    tolerance: '0.1%'
    shown: ['Altogether $108.3$ s']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: rower-across-speed
    where: 'worked example, step "Across the current": sqrt(1.30^2 - 0.50^2)'
    inputs: {u: 1.30 m/s, w: 0.50 m/s}
    formula: sqrt(u**2 - w**2)
    expected: 1.20 m/s
    shown: ['$\sqrt{1.30^2 - 0.50^2} = \sqrt{1.44} = 1.20$ m/s']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: rower-across-time
    where: 'worked example, round trip across (t_perp formula of slide 16)'
    inputs: {L: 60 m, u: 1.30 m/s, w: 0.50 m/s}
    formula: 2 * L / sqrt(u**2 - w**2)
    expected: 100 s
    shown: ['$120/1.20 = 100$ s']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: rower-difference
    where: 'worked example, step "Result": B wins by about 8.3 s'
    inputs: {L: 60 m, u: 1.30 m/s, w: 0.50 m/s}
    formula: L / (u - w) + L / (u + w) - 2 * L / sqrt(u**2 - w**2)
    expected: 8.3 s
    tolerance: '0.5%'
    shown: ['B wins by about $8.3$ s']
    source: {cite: mit, at: 'slide 16'}
    origin: page-own

  - id: rotation-change-identity
    kind: identity
    where: 'formula "Expected change on turning the interferometer": the exact change 2γ(γ − 1)(L∥ + L⊥)/c (slide 17) is (L∥ + L⊥)/c (v/c)² to lowest order'
    formula: 2 * (1/sqrt(1 - b**2)) * (1/sqrt(1 - b**2) - 1)
    equals: b**2
    samples: {b: [1.0e-4, 3.0e-4, 1.0e-3]}
    tolerance: 1e-5
    shown: ['\Delta t \approx \frac{L_\parallel + L_\perp}{c}\left(\frac{v}{c}\right)^2']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: ex-v-over-c
    where: 'worked example "How big is the effect?", step "The ratio v/c"'
    inputs: {v: 3.0e4 m/s, c: 3.00e8 m/s}
    formula: v / c
    expected: '1.0e-4'
    shown: ['$v/c = 3.0 \times 10^{4} / 3.00 \times 10^{8} = 1.0 \times 10^{-4}$']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-v-over-c-squared
    where: 'worked example: (v/c)^2 = 1.0e-8, one part in a hundred million'
    inputs: {v: 3.0e4 m/s, c: 3.00e8 m/s}
    formula: (v / c)**2
    expected: '1.0e-8'
    shown: ['so $(v/c)^2 = 1.0 \times 10^{-8}$: one part in a hundred million']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-delta-t
    where: 'worked example, step "The time difference"'
    inputs: {L: 4.0 m, v: 3.0e4 m/s, c: 3.00e8 m/s}
    formula: L / c * (v / c)**2
    expected: 1.3e-16 s
    tolerance: '3%'
    shown: ['$\Delta t \approx (4.0 / 3.00 \times 10^{8}) \times 1.0 \times 10^{-8} = 1.3 \times 10^{-16}$ s']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-period
    where: 'worked example, step "Compare with the light wave": period of 550 nm light'
    inputs: {lam: 550 nm, c: 3.00e8 m/s}
    formula: lam / c
    expected: 1.8e-15 s
    tolerance: '2%'
    shown: ['$\lambda/c = 550 \times 10^{-9} / 3.00 \times 10^{8} = 1.8 \times 10^{-15}$ s']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-fraction-of-period
    where: 'worked example: delay over period, about 0.07'
    inputs: {L: 4.0 m, v: 3.0e4 m/s, c: 3.00e8 m/s, lam: 550 nm}
    formula: (L / c * (v / c)**2) / (lam / c)
    expected: '0.07'
    tolerance: '5%'
    shown: ['$1.3 \times 10^{-16} / 1.8 \times 10^{-15} \approx 0.07$ of a period', 'by about $0.07$ of a fringe']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: ex-fringe-shift
    where: 'worked example: N from the fringe-shift formula, and the plot caption for 4.0 m'
    inputs: {L: 4.0 m, v: 3.0e4 m/s, c: 3.00e8 m/s, lam: 550 nm}
    formula: L / lam * (v / c)**2
    expected: '0.07'
    tolerance: '5%'
    shown: ['$N \approx (4.0 / 550 \times 10^{-9}) \times 10^{-8} = 0.07$', 'with 4.0 m, about 0.07']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own

  - id: mm-wavelengths
    where: 'Michelson and Morley: 11 m of arms is roughly 2 × 10⁷ wavelengths (slide: λ ~ 500 nm; here 550 nm)'
    inputs: {L: 11 m, lam: 550 nm}
    formula: L / lam
    expected: '2e7'
    tolerance: '5%'
    shown: ['roughly $2 \times 10^{7}$ wavelengths']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: mm-arm-length
    kind: fact
    where: 'Michelson and Morley''s arms added up to about 11 m'
    value: 11 m
    shown: ['their arms added up to about 11 m', 'With arms adding up to 11 m']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: mm-expected-shift
    where: 'expected shift about 0.2 fringe for 11 m at 30 km/s (text, plot caption, summary, flashcard, quiz 2)'
    inputs: {L: 11 m, v: 3.0e4 m/s, c: 3.00e8 m/s, lam: 550 nm}
    formula: L / lam * (v / c)**2
    expected: '0.2'
    tolerance: '5%'
    shown: ['They expected a shift of about $0.2$ of a fringe', 'it reaches about 0.2 at Earth', 'fringe shift of about $0.2$ when turned', 'should have shifted the fringes by about 0.2', 'predicted a shift of about 0.2 of a fringe']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: mm-sensitivity
    kind: fact
    where: 'smallest visible fringe shift, 0.01'
    value: '0.01'
    shown: ['could see shifts as small as $0.01$', 'the smallest shift Michelson and Morley could see, 0.01 fringe']
    source: {cite: mit, at: 'slide 17'}
    origin: mit

  - id: plot-wavelength
    kind: fact
    where: 'plot: green light 550 nm (page-own choice, as in the worked example)'
    value: 550 nm
    shown: ['with λ = 550 nm and c = 3.00 × 10⁸ m/s']
    source: {cite: mit, at: 'slide 17'}
    origin: page-own
