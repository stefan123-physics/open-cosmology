# Calculations on content/year-0/hs-8/how-old-is-the-universe.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-8/how-old-is-the-universe.mdx
calcs:
  - id: hubble-time-identity
    kind: identity
    where: 'formula "Time since all galaxies were together": d/(H₀ d) = 1/H₀ for every distance'
    formula: d / (H * d)
    equals: 1 / H
    samples: {d: [1.0, 150.0, 450.0], H: [70.0, 67.3, 100.0]}
    tolerance: 1e-12
    shown: ['t = \frac{d}{v} = \frac{d}{H_0\, d} = \frac{1}{H_0}']
    source: {cite: reading2, at: 'p. 14'}
    origin: page-own

  - id: quiz-double-H
    kind: identity
    where: 'quiz 0: twice the Hubble constant halves the Hubble time'
    formula: 1 / (2 * H)
    equals: 0.5 / H
    samples: {H: [50.0, 70.0, 100.0]}
    tolerance: 1e-12
    shown: ['so twice the $H_0$ gives half the time']
    source: {cite: reading2, at: 'p. 14'}
    origin: page-own

  - id: parsec-ly
    kind: fact
    where: 'section "From km/s/Mpc to years": 1 parsec = 3.26 light-years (Guth 3.2616)'
    value: '3.26'
    shown: ['a parsec is 3.26 light-years (Guth gives 3.2616, Lecture 4 p. 8)']
    source: {cite: reading2, at: 'p. 8 (board)'}
    origin: mit

  - id: mpc-metres
    where: 'worked example "The Hubble time in seconds and in years", step "One megaparsec in metres"; summary'
    inputs: {}
    formula: 3.26e6 * 9.46e15
    expected: '3.08e22'
    shown: ['3.26 \times 10^{6} \times 9.46 \times 10^{15}\ \text{m} = 3.08 \times 10^{22}\ \text{m}$', '$1\ \text{Mpc} = 3.08 \times 10^{22}\ \text{m}$']
    source: {cite: reading2, at: 'p. 8 (board)'}
    origin: page-own

  - id: H0-si
    where: 'worked example, step "The Hubble constant in SI units"; summary'
    inputs: {}
    formula: 7.0e4 / 3.08e22
    expected: '2.27e-18'
    shown: ['$H_0 = 7.0 \times 10^{4}/(3.08 \times 10^{22}) = 2.27 \times 10^{-18}\ \text{s}^{-1}$', 'is $2.27 \times 10^{-18}\ \text{s}^{-1}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: H0-si-pint
    where: 'cross-check of the same conversion with the exact megaparsec'
    inputs: {H: 70 km/s/Mpc}
    formula: H
    expected: 2.27e-18 1/s
    shown: ['= 2.27 \times 10^{-18}\ \text{s}^{-1}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: hubble-time-s
    where: 'worked example, step "The Hubble time": 1/H₀ in seconds; flashcard 1'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 4.41e17 s
    shown: ['$1/H_0 = 1/(2.27 \times 10^{-18}\ \text{s}^{-1}) = 4.41 \times 10^{17}\ \text{s}$', '$1/H_0 = 4.41 \\times 10^{17}\\ \\text{s}$']
    source: {cite: reading2, at: 'p. 14'}
    origin: page-own

  - id: hubble-time-yr
    where: 'worked example, step "The Hubble time": in years'
    inputs: {}
    formula: 4.41e17 / 3.156e7
    expected: '1.40e10'
    shown: ['$4.41 \times 10^{17}/(3.156 \times 10^{7}) = 1.40 \times 10^{10}\ \text{years}$, about 14 billion years']
    source: {cite: reading2, at: 'p. 14'}
    origin: page-own

  - id: hubble-time-70
    where: 'quick rule for H₀ = 70; "about 14 billion years" in summary, flashcard 1 and the frontmatter summary'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 14.0 Gyr
    shown: ['that gives $977.8/70 = 14.0$ billion years', '$1/H_0$ is about 14 billion years']
    source: {cite: reading2, at: 'p. 8 (board)'}
    origin: page-own

  - id: conversion-97-8
    where: 'formula "Converting the Hubble constant to years"; quiz 1 explanation'
    inputs: {}
    formula: 1 / (1e10 * yr)
    expected: 97.8 km/s/Mpc
    shown: ['\frac{1}{10^{10}\ \text{years}} = 97.8\ \text{km/s/Mpc}', '$1/(10^{10}\\ \\text{years}) = 97.8\\ \\text{km/s/Mpc}$']
    source: {cite: reading2, at: 'p. 8 (board)'}
    origin: mit

  - id: conversion-977-8
    where: 'quick rule: 1/H₀ = (977.8/H₀) billion years, H₀ in km/s/Mpc; plot captions'
    inputs: {H: 100 km/s/Mpc}
    formula: 100 / H
    expected: 977.8 Gyr
    shown: ['or $(977.8/H_0)$ billion years', 'with the Hubble time 977.8/H₀ billion years. All three', 'with the Hubble time 977.8/H₀ billion years. Both']
    source: {cite: reading2, at: 'p. 8 (board)'}
    origin: page-own

  - id: near-speed
    where: 'worked example "Near and far galaxies agree", step "Speeds": near galaxy'
    inputs: {H: 70 km/s/Mpc, d: 150 Mpc}
    formula: H * d
    expected: 10500 km/s
    shown: ['$v = H_0 d = 70 \times 150 = 10\,500\ \text{km/s}$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: far-speed
    where: 'worked example, step "Speeds": far galaxy'
    inputs: {H: 70 km/s/Mpc, d: 450 Mpc}
    formula: H * d
    expected: 31500 km/s
    shown: ['$70 \times 450 = 31\,500\ \text{km/s}$']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: near-distance
    where: 'worked example, step "Times in SI units": 150 Mpc in metres'
    inputs: {}
    formula: 150 * 3.08e22
    expected: '4.62e24'
    shown: ['$d = 150 \times 3.08 \times 10^{22} = 4.62 \times 10^{24}\ \text{m}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: near-time
    where: 'worked example, step "Times in SI units": near galaxy t = d/v'
    inputs: {}
    formula: 150 * 3.08e22 / 1.05e7
    expected: '4.40e17'
    shown: ['$v = 1.05 \times 10^{7}\ \text{m/s}$, so $t = d/v = 4.40 \times 10^{17}\ \text{s}$']
    source: {cite: reading2, at: 'p. 14'}
    origin: page-own

  - id: far-distance
    where: 'worked example, step "Times in SI units": 450 Mpc in metres'
    inputs: {}
    formula: 450 * 3.08e22
    expected: '1.39e25'
    shown: ['Far: $d = 1.39 \times 10^{25}\ \text{m}$']
    source: {cite: reading2, at: 'p. 8'}
    origin: page-own

  - id: far-time
    where: 'worked example, step "Times in SI units": far galaxy t = d/v'
    inputs: {}
    formula: 450 * 3.08e22 / 3.15e7
    expected: '4.40e17'
    shown: ['$v = 3.15 \times 10^{7}\ \text{m/s}$, so $t = 4.40 \times 10^{17}\ \text{s}$ as well']
    source: {cite: reading2, at: 'p. 14'}
    origin: page-own

  - id: far-near-ratio
    where: 'worked example, step "Check": three times as far, three times as fast'
    inputs: {}
    formula: 31500 / 10500
    expected: '3'
    shown: ['Three times as far, three times as fast']
    source: {cite: reading2, at: 'p. 7'}
    origin: page-own

  - id: matter-only-identity
    kind: identity
    where: 'formula "Age of a flat universe of matter alone": for a ∝ t^(2/3), H = (da/dt)/a = 2/(3t), so t = (2/3)/H'
    formula: (2/3) / (2 / (3 * t))
    equals: t
    samples: {t: [1.0, 9.3, 13.8]}
    tolerance: 1e-12
    shown: ['t = \frac{2}{3}\cdot\frac{1}{H_0}']
    source: {cite: reading1, at: 'p. 11 (board)'}
    origin: mit

  - id: plot-matter-slope
    kind: identity
    where: 'second plot: (1 + 1.5 x)^(2/3) has slope 1 at x = 0 (same expansion rate today) and reaches zero at x = −2/3'
    formula: ((1 + 1.5 * (x + 1e-7))**(2/3) - (1 + 1.5 * (x - 1e-7))**(2/3)) / 2e-7
    equals: (1 + 1.5 * x)**(-1/3)
    samples: {x: [0.0, 0.5, -0.3]}
    tolerance: 1e-6
    shown: ['Both have the same slope today']
    source: {cite: reading1, at: 'p. 11'}
    origin: page-own

  - id: matter-only-70
    where: 'worked example "Too young for its stars"; quiz 3; flashcard 2'
    inputs: {H: 70 km/s/Mpc}
    formula: 2/3 / H
    expected: 9.3 Gyr
    shown: ['$t = \tfrac23 \times 14.0 = 9.3$ billion years', 'would be about 9.3 billion years old', 'about 9.3 billion years, too young']
    source: {cite: reading1, at: 'p. 11 (board)'}
    origin: page-own

  - id: quiz1-hubble-time-100
    where: 'quiz 1: Hubble time for H₀ = 100 km/s/Mpc'
    inputs: {H: 100 km/s/Mpc}
