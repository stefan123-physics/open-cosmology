    expected: 9.8e9 yr
    shown: ['$(97.8/100) \\times 10^{10} = 9.8 \\times 10^{9}\\ \\text{years}$']
    quiz: 1
    source: {cite: reading2, at: 'p. 8 (board)'}
    origin: page-own

  - id: hubble-time-planck
    where: 'section "Why the real age is not exactly 1/H₀": Hubble time for H₀ = 67.3'
    inputs: {H: 67.3 km/s/Mpc}
