  - id: electron-gamma
    where: 'worked example "A fast electron", step "Lorentz factor"'
    inputs: {b: 0.80}
    formula: 1 / sqrt(1 - b**2)
    expected: 1.67
    shown: ['$\gamma = 1/\sqrt{1 - 0.80^2} = 1/\sqrt{0.36} = 1/0.60 = 5/3$, about $1.67$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: electron-total
    where: 'worked example "A fast electron", step "Total and kinetic energy": E = γmc²'
    inputs: {b: 0.80, E0: 0.511 MeV}
    formula: E0 / sqrt(1 - b**2)
    expected: 0.852 MeV
    shown: ['$E = \gamma mc^2 = (5/3) \times 0.511 = 0.852\ \text{MeV}$']
