# Calculations on content/year-0/hs-8/mass-and-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6-7: c = 3.00e8 m/s, 1 eV = 1.6e-19 J, h = 6.63e-34 J s, m_e = 9.11e-31 kg, m_p = 1.67e-27 kg.

page: content/year-0/hs-8/mass-and-energy.mdx
calcs:
  - id: c-squared
    where: 'section "Mass is a form of energy": c² = 9.0 × 10¹⁶ m²/s²'
    inputs: {c: 3.00e8 m/s}
    formula: c**2
    expected: 9.0e16 m**2/s**2
    shown: ['$c^2 = 9.0 \times 10^{16}\ \text{m}^2/\text{s}^2$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: gram-energy
    where: 'worked example "The energy in one gram", step "Rest energy"'
    inputs: {m: 1.0e-3 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 9.0e13 J
    shown: ['$E_0 = mc^2 = 1.0 \times 10^{-3} \times (3.00 \times 10^{8})^2 = 9.0 \times 10^{13}\ \text{J}$', 'One gram holds $9.0 \times 10^{13}\ \text{J}$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: gram-time-s
    where: 'worked example "The energy in one gram", step "Running time": t = E/P'
    inputs: {m: 1.0e-3 kg, c: 3.00e8 m/s, P: 1.0e9 W}
    formula: m * c**2 / P
    expected: 9.0e4 s
    shown: ['$t = E/P = 9.0 \times 10^{13}/(1.0 \times 10^{9}) = 9.0 \times 10^{4}\ \text{s}$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: gram-time-h
    where: 'worked example "The energy in one gram": 9.0 × 10⁴ s in hours'
    inputs: {m: 1.0e-3 kg, c: 3.00e8 m/s, P: 1.0e9 W, hr: 3600 s}
    formula: m * c**2 / P / hr
    expected: 25
    shown: ['which is $25$ hours']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: one-kg-energy
    where: 'flashcard "Rest energy": 1 kg holds 9.0 × 10¹⁶ J'
    inputs: {m: 1 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 9.0e16 J
    shown: ['$1\\ \\text{kg}$ holds $9.0 \\times 10^{16}\\ \\text{J}$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: quiz-rest-energy
    where: 'quiz 0: rest energy of 2.0 kg'
    inputs: {m: 2.0 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 1.8e17 J
    shown: ['$E_0 = mc^2 = 2.0 \\times (3.00 \\times 10^{8})^2 = 1.8 \\times 10^{17}\\ \\text{J}$']
    quiz: 0
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: quiz0-wrong-no-square
    where: 'quiz 0, distractor: c not squared'
    inputs: {m: 2.0 kg, c: 3.00e8 m/s}
    formula: m * c
    expected: 6.0e8 kg*m/s
    shown: ['$6.0 \\times 10^{8}\\ \\text{J}$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: quiz0-wrong-mass-squared
    where: 'quiz 0, distractor: mass squared as well'
    inputs: {m: 2.0 kg, c: 3.00e8 m/s, k: 1 kg}
    formula: m**2 * c**2 / k
    expected: 3.6e17 J
    shown: ['$3.6 \\times 10^{17}\\ \\text{J}$']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: gamma-09
    where: 'section "Energy in motion" and table row 0.9: γ at 0.9c'
    inputs: {b: 0.9}
    formula: 1 / sqrt(1 - b**2)
    expected: 2.29
    shown: ['at $v = 0.9c$ it is $2.29$', '| 0.9 | 2.29 | $1.29\,mc^2$ | $0.405\,mc^2$ | 3.2 |']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: gamma-099
    where: 'section "Energy in motion" and table row 0.99: γ at 0.99c'
    inputs: {b: 0.99}
    formula: 1 / sqrt(1 - b**2)
    expected: 7.09
    shown: ['at $0.99c$ it is $7.09$', '| 0.99 | 7.09 | $6.09\,mc^2$ | $0.490\,mc^2$ | 12 |']
    source: {cite: reading1, at: 'p. 1'}
    origin: page-own

  - id: low-speed-limit
    kind: identity
    where: 'formula "Kinetic energy at low speed": (γ − 1)mc² → ½mv² for v ≪ c (ratio of the two tends to 1)'
    formula: (1 / sqrt(1 - b**2) - 1) / (0.5 * b**2)
    equals: 1
    samples: {b: [1.0e-4, 3.0e-4, 1.0e-3]}
    tolerance: 1e-6
    shown: ['tex="E_k \approx \tfrac12 mv^2 \quad \text{when } v \ll c"']
    source: {cite: mit, at: 'p. 1'}
    origin: mit

