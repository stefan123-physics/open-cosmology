# Calculations on content/year-0/hs-8/the-first-elements.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6-8: c = 3.00e8 m/s, h = 6.63e-34 J s, 1 MeV = 1.6e-13 J, 1 u c² = 931.5 MeV, k_B = 1.38e-23 J/K,
# Wien's constant 2.9e-3 m K (lesson 7.2). Masses in u and energies in MeV are written as plain numbers.

page: content/year-0/hs-8/the-first-elements.mdx
calcs:
  - id: nucleon-masses
    kind: fact
    where: 'worked example "How much more is a neutron?": m_n = 1.00866 u, m_p = 1.00728 u (NIST, rounded)'
    value: 1.00866
    shown: ['A neutron has a mass of $1.00866\ \text{u}$ and a proton $1.00728\ \text{u}$ (NIST values, rounded)']
    source: {cite: nistMn, at: '1.008 664 916 06 u (proton: nistMp, 1.007 276 466 5789 u)'}
    origin: later-data

  - id: mass-difference
    where: 'worked example "How much more is a neutron?", step "Mass difference"'
    inputs: {mn: 1.00866, mp: 1.00728}
    formula: mn - mp
    expected: 0.00138
    shown: ['$1.00866 - 1.00728 = 0.00138\ \text{u}$']
    source: {cite: nistMn, at: 'neutron and proton masses in u'}
    origin: page-own

  - id: delta-E-MeV
    where: 'worked example step "Mass difference"; formula "Extra rest energy of a neutron"; summary; flashcard 0; summary line of the page'
    inputs: {mn: 1.00866, mp: 1.00728, u: 931.5}
    formula: (mn - mp) * u
    expected: 1.29
    shown: ['$0.00138 \times 931.5 = 1.29\ \text{MeV}$', '(m_n - m_p)\,c^2 \approx 1.29\ \text{MeV}', 'A neutron has $1.29\ \text{MeV}$ more rest energy than a proton', 'A neutron has 1.29 MeV more rest energy than a proton', 'Neutrons, 1.29 MeV heavier than protons']
    source: {cite: reading1, at: 'eq. (481), p. 110'}
    origin: page-own

  - id: delta-E-J
    where: 'worked example step "In joules"'
    inputs: {E: 1.29, MeV: 1.6e-13 J}
    formula: E * MeV
    expected: 2.06e-13 J
    shown: ['$1.29 \times 1.6 \times 10^{-13} = 2.06 \times 10^{-13}\ \text{J}$']
    source: {cite: reading1, at: 'eq. (481), p. 110'}
    origin: page-own

  - id: T-neutron
    where: 'worked example step "Matching temperature"; text after it'
    inputs: {E: 2.06e-13 J, kB: 1.38e-23 J/K}
    formula: E / kB
    expected: 1.5e10 K
    shown: ['$T = 2.06 \times 10^{-13}/(1.38 \times 10^{-23}) = 1.5 \times 10^{10}\ \text{K}$: fifteen billion kelvin', 'far hotter than $1.5 \times 10^{10}$ K']
    source: {cite: nistMn, at: 'masses; k_B as in lesson 8.4'}
    origin: page-own

  - id: T-one-second
    where: 'section "A reactor the size of the universe", freeze-out, flashcard 0 and summary: T ≈ 1 MeV at t ≈ 1 s (PDG) is about 10¹⁰ K'
    inputs: {E: 1.6e-13 J, kB: 1.38e-23 J/K}
    formula: E / kB
    expected: 1e10 K
    tolerance: '20%'
    shown: ['One second after the start its temperature was about $10^{10}$ K', 'At about one second, near $10^{10}$ K, they stopped', 'At about one second, near $10^{10}$ K, the changes stopped', 'at one second about $10^{10}$ K']
    source: {cite: reading2, at: 'Sec. 24.2, p. 1: T ≈ 1 MeV at t ≈ 1 s'}
    origin: page-own

  - id: freeze-out-ratios
    kind: fact
    where: 'section "Neutrons and protons" and summary: about 1 to 6 at freeze-out (PDG), 1 to 5 in the 8.902 estimate'
    shown: ['there was about **one neutron for every 6 protons** (PDG', 'the simpler estimate in the 8.902 notes gives 1 to 5', 'leaving about **one neutron for every 6 protons**', 'about one neutron for every 6 protons.']
    source: {cite: reading2, at: 'Sec. 24.2, p. 1: n/p ≈ 1/6; 8.902 notes p. 110: 5-to-1'}
    origin: mit

  - id: ratio-at-fusion
    kind: fact
    where: 'section "Free neutrons decay", summary, flashcard 3: about 1 to 7 when nuclear reactions began (PDG)'
    shown: ['**about one neutron for every 7 protons**', 'so the ratio fell to **about 1 to 7** before fusion could start', 'With $n/p \\approx 1/7$']
    source: {cite: reading2, at: 'Sec. 24.2, p. 1: n/p ≈ 1/7'}
    origin: mit

  - id: neutron-mean-life
    kind: fact
    where: 'section "Free neutrons decay"; flashcard 1: mean life 878.4 s'
    value: 878.4 s
    shown: ['A free neutron has a mean life of $878.4\ \text{s}$ (PDG neutron listing)', 'mean life 878 s']
    source: {cite: pdgN, at: 'n mean life, our average'}
    origin: later-data

  - id: neutron-half-life
    where: 'section "Free neutrons decay": half-life = mean life × ln 2; about 10 minutes (summary, flashcard 1, summary line)'
    inputs: {tau: 878.4 s}
    formula: tau * log(2)
    expected: 609 s
    shown: ['$878.4 \times \ln 2 = 609\ \text{s}$', 'Use $t_{1/2} = 609\ \text{s}$']
    source: {cite: pdgN, at: 'n mean life 878.4 s'}
    origin: page-own

  - id: half-life-minutes
    where: 'about 10 minutes'
    inputs: {th: 609 s, minute: 60 s}
    formula: th / minute
    expected: 10
    tolerance: '2%'
    shown: ['**about 10 minutes**', 'with a half-life of about 10 minutes (mean life 878 s)', 'with a half-life of about 10 minutes, so']
    source: {cite: pdgN, at: 'n mean life 878.4 s'}
    origin: page-own

  - id: decay-law
    kind: identity
    where: 'formula "Decay law": N₀(½)^(t/t½) equals N₀ e^(−t/τ) with t½ = τ ln 2'
    formula: N0 * 0.5**(t / (tau * log(2)))
    equals: N0 * exp(-t / tau)
    samples: {N0: [100.0, 1.0, 700.0], t: [0.0, 180.0, 1218.0], tau: [878.4, 878.4, 600.0]}
    tolerance: 1e-12
    shown: ['tex="N = N_0\left(\tfrac{1}{2}\right)^{t/t_{1/2}}"']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: mit

  - id: decay-steps
    where: 'worked example "Three minutes of decay", step "Fraction left": 180/609'
    inputs: {t: 180 s, th: 609 s}
    formula: t / th
    expected: 0.296
    shown: ['$t/t_{1/2} = 180/609 = 0.296$']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: decay-fraction
    where: 'worked example "Three minutes of decay", step "Fraction left"'
    inputs: {t: 180 s, th: 609 s}
    formula: 0.5**(t / th)
    expected: 0.815
    shown: ['$\left(\tfrac12\right)^{0.296} = 0.815$']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: decay-neutrons
    where: 'worked example step "Neutrons and protons": neutrons left'
    inputs: {N0: 100, t: 180 s, th: 609 s}
    formula: N0 * 0.5**(t / th)
    expected: 81.5
    shown: ['$N = 100 \times 0.815 = 81.5$ neutrons']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: decay-protons
    where: 'worked example step "Neutrons and protons": decayed neutrons become protons'
    inputs: {N0: 100, P0: 600, t: 180 s, th: 609 s}
    formula: P0 + N0 * (1 - 0.5**(t / th))
    expected: 618.5
    shown: ['The other $18.5$ have become protons: $600 + 18.5 = 618.5$ protons']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: decay-ratio
    where: 'worked example step "Ratio"'
    inputs: {N0: 100, P0: 600, t: 180 s, th: 609 s}
    formula: N0 * 0.5**(t / th) / (P0 + N0 * (1 - 0.5**(t / th)))
    expected: 0.132
    shown: ['$81.5/618.5 = 0.132$']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: decay-ratio-inverse
    where: 'worked example step "Ratio": about 1 neutron for every 7.6 protons'
    inputs: {n: 81.5, p: 618.5}
    formula: p / n
    expected: 7.6
    shown: ['about 1 neutron for every 7.6 protons']
    source: {cite: reading1, at: 'eq. (491), p. 111'}
    origin: page-own

  - id: deuteron-binding
    where: 'section "The deuterium bottleneck": 2.22 MeV = 2 × 1.11 MeV per nucleon (lesson 8.4)'
    inputs: {b: 1.11}
    formula: 2 * b
    expected: 2.22
    shown: ['its binding energy, $2.22\ \text{MeV}$, as a gamma ray (lesson 8.4 found 1.11 MeV per nucleon, for 2 nucleons)', 'deuterium (binding energy 2.22 MeV) was broken']
    source: {cite: reading1, at: 'p. 110: binding energy about 2.22 MeV'}
    origin: page-own

  - id: helium-binding
    kind: fact
    where: 'section "Building helium-4": about 7.1 MeV per nucleon (lesson 8.4, AME 2020: 7073.92 keV)'
    shown: ['(lesson 8.4, about 7.1 MeV per nucleon)']
    source: {cite: reading2, at: 'Sec. 24.2, p. 2: ⁴He the most stable light element'}
    origin: later-data

  - id: wien-peak
    where: 'worked example "How strong were the photons?", step "Peak wavelength"'
    inputs: {b: 2.9e-3 m*K, T: 2e9 K}
    formula: b / T
    expected: 1.45e-12 m
    shown: ['$\lambda_{\max} = 2.9 \times 10^{-3}/(2 \times 10^{9}) = 1.45 \times 10^{-12}\ \text{m}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: peak-photon-J
    where: 'worked example step "Peak photon energy"'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, lam: 1.45e-12 m}
    formula: h * c / lam
    expected: 1.37e-13 J
    shown: ['$E = 6.63 \times 10^{-34} \times 3.00 \times 10^{8}/(1.45 \times 10^{-12}) = 1.37 \times 10^{-13}\ \text{J}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: peak-photon-MeV
    where: 'worked example step "Peak photon energy": in MeV'
    inputs: {E: 1.37e-13 J, MeV: 1.6e-13 J}
    formula: E / MeV
    expected: 0.86
    shown: ['$1.37 \times 10^{-13}/(1.6 \times 10^{-13}) = 0.86\ \text{MeV}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: deuteron-J
    where: 'worked example step "Temperature for 2.22 MeV": energy in joules'
    inputs: {E: 2.22, MeV: 1.6e-13 J}
    formula: E * MeV
    expected: 3.55e-13 J
    shown: ['$E = 2.22 \times 1.6 \times 10^{-13} = 3.55 \times 10^{-13}\ \text{J}$']
    source: {cite: reading1, at: 'p. 110'}
    origin: page-own

  - id: deuteron-lambda
    where: 'worked example step "Temperature for 2.22 MeV": wavelength'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 3.55e-13 J}
    formula: h * c / E
    expected: 5.6e-13 m
    shown: ['$\lambda = hc/E = 5.6 \times 10^{-13}\ \text{m}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: deuteron-T
    where: 'worked example step "Temperature for 2.22 MeV": temperature; text after it (about 5 × 10⁹ K)'
    inputs: {b: 2.9e-3 m*K, lam: 5.6e-13 m}
    formula: b / lam
    expected: 5.2e9 K
    shown: ['$T = 2.9 \times 10^{-3}/(5.6 \times 10^{-13}) = 5.2 \times 10^{9}\ \text{K}$', 'So from about $5 \times 10^9$ K downwards']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: photons-per-nucleon
    where: 'section "The deuterium bottleneck": 1/η with η₁₀ = 6.040 (PDG) is about 1.7 billion; more than a billion (quiz 1, flashcard 2, summary)'
    inputs: {eta: 6.040e-10}
    formula: 1 / eta
    expected: 1.7e9
    shown: ['one nucleon per $1.7 \times 10^9$ photons', 'there were more than a billion of them', 'There were more than a billion photons for every proton or neutron', 'with more than a billion photons per nucleon even', 'tail of more than a billion photons per nucleon']
    source: {cite: reading2, at: 'Sec. 24.2, p. 1: η₁₀ = 6.040 ± 0.118'}
    origin: page-own

  - id: T-deuterium
    where: 'section "The deuterium bottleneck": T ≈ 0.1 MeV (PDG) is about 10⁹ K; quiz 1, flashcard 2, summary, summary line'
    inputs: {E: 0.1e0, MeV: 1.6e-13 J, kB: 1.38e-23 J/K}
    formula: E * MeV / kB
    expected: 1e9 K
    tolerance: '20%'
    shown: ['once the universe had cooled to about $10^{9}$ K', 'per nucleon until the universe cooled to about $10^9$ K', 'Deuterium only survives once the universe has cooled to about a billion kelvin', 'until the universe cooled to about a billion kelvin']
    source: {cite: reading2, at: 'Sec. 24.2, p. 1: T ≈ 0.1 MeV'}
    origin: page-own

  - id: deuterium-time-mit
    kind: fact
    where: 'section "The deuterium bottleneck": 8 × 10⁸ K and 200 s in the 8.902 notes; about three minutes (PDG: end of the first three minutes)'
    shown: ['the 8.902 notes find $8 \times 10^{8}$ K, eq. (490)', 'about **three minutes** after the start (the 8.902 notes give 200 s)']
    source: {cite: reading1, at: 'eq. (490), p. 111; PDG Sec. 24.1'}
    origin: mit

  - id: Y-identity
    kind: identity
    where: 'formula "Helium mass fraction": 2n/(n + p) = 2(n/p)/(1 + n/p)'
    formula: 2 * n / (n + p)
    equals: 2 * (n / p) / (1 + n / p)
    samples: {n: [1.0, 2.0, 81.5], p: [7.0, 12.0, 618.5]}
    tolerance: 1e-12
    shown: ['tex="Y = \frac{2n}{n + p} = \frac{2\,(n/p)}{1 + n/p}"']
    source: {cite: reading1, at: 'eqs. (492)-(493), pp. 111-112'}
    origin: mit

  - id: Y-count-7
    where: 'worked example "A quarter helium", step "(a) Counting": 4/16'
    inputs: {}
    formula: 4 / 16
    expected: 0.25
    shown: ['$Y = 4/16 = 0.25$']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: page-own

  - id: Y-formula-7
    where: 'worked example step "(a) Formula"; plot point; caption; summary; flashcard 3; summary line'
    inputs: {r: 0.142857142857}
    formula: 2 * r / (1 + r)
    expected: 0.25
    shown: ['$Y = 2 \times \tfrac17/(1 + \tfrac17) = \tfrac27 \times \tfrac78 = 0.25$', '{ x: 0.1429, y: 0.25, label: "1 to 7" }', 'With one neutron for every 7 protons, Y = 0.25', '$Y = 2(n/p)/(1 + n/p) = 0.25$ for $n/p = 1/7$', '$n/p \\approx 1/7$, $Y = 0.25$']
    source: {cite: reading2, at: 'eq. (24.1)'}
    origin: page-own

  - id: Y-count-6
    where: 'worked example step "(b) No decay": 4/14; formula 2/7; plot point; caption'
    inputs: {r: 0.166666666667}
    formula: 2 * r / (1 + r)
    expected: 0.29
    shown: ['$Y = 4/14 = 0.29$', '$2 \times \tfrac16/(1 + \tfrac16) = \tfrac27 = 0.29$', 'with 1 to 6, Y = 0.29', 'lower the helium from 29% to 25%']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: page-own

  - id: plot-point-6
    where: 'graph point for 1 to 6'
    inputs: {r: 0.166666666667}
    formula: 2 * r / (1 + r)
    expected: 0.2857
    shown: ['{ x: 0.1667, y: 0.2857, label: "1 to 6" }']
    source: {cite: reading1, at: 'eq. (493), p. 112'}
    origin: page-own

  - id: quiz-Y-8
    where: 'quiz 0: n/p = 1/8 gives Y = 0.25/1.125 = 0.22; counting 4/18'
    quiz: 0
    inputs: {r: 0.125}
    formula: 2 * r / (1 + r)
    expected: 0.22
    shown: ['$Y = 2(n/p)/(1 + n/p) = 2 \\times \\tfrac18 / (1 + \\tfrac18) = 0.25/1.125 = 0.22$', 'and $4/18 = 0.22$']
    source: {cite: reading2, at: 'eq. (24.1)'}
    origin: page-own

  - id: quiz-Y-late
    where: 'quiz 3: one neutron in 7 nucleons, two half-lives, Y = 2/28'
    quiz: 3
    inputs: {Xn: 0.142857142857}
    formula: 2 * Xn * 0.5**2
    expected: 0.071
    shown: ['one in every $7 \\times 4 = 28$ nucleons', '$Y = 2/28 = 0.071$']
    source: {cite: reading1, at: 'eqs. (491)-(493)'}
    origin: page-own

  - id: quiz-H-per-He
    where: 'quiz 4: hydrogen atoms per helium atom for Y = 0.245; also section "Checking against the sky": one helium atom for every 12 hydrogen atoms'
    quiz: 4
    inputs: {Y: 0.245}
    formula: (1 - Y) / (Y / 4)
    expected: 12.3
    tolerance: '5%'
    shown: ['$0.755/(0.245/4) = 12.3$', 'about one helium atom for every 12 hydrogen atoms']
    source: {cite: reading2, at: 'Sec. 24.1: ⁴He/H ≈ 0.08 by number'}
    origin: page-own

  - id: Y-measured
    kind: fact
    where: 'section "Checking against the sky", graph, flashcard 4, summary, quiz 4: Y = 0.245'
    value: 0.245
    shown: ['$Y = 0.245$, from the glowing gas', 'The dashed line is the measured value, 0.245 (PDG review, 2025)', 'measured, 0.245', '$Y = 0.245$, D/H $= 2.5 \times 10^{-5}$', 'helium mass fraction of 0.245']
    source: {cite: reading2, at: 'eq. (24.3)'}
    origin: later-data

  - id: DH-measured
    kind: fact
    where: 'section "Checking against the sky": D/H = 25.08 × 10⁻⁶ rounded to 2.5 × 10⁻⁵'
    value: 2.508e-5
    shown: ['$2.5 \times 10^{-5}$ deuterium atoms per hydrogen atom', 'D/H $= 2.5 \\times 10^{-5}$']
    source: {cite: reading2, at: 'eq. (24.2)'}
    origin: later-data

  - id: Li-observed
    kind: fact
    where: 'section "Checking against the sky": Li/H = 1.45 × 10⁻¹⁰ in old stars, predicted 4.72 × 10⁻¹⁰'
    value: 1.45e-10
    shown: ['about $1.5 \times 10^{-10}$ per hydrogen atom', '($4.7 \times 10^{-10}$)']
    source: {cite: reading2, at: 'eqs. (24.4) and (24.10)'}
    origin: later-data

  - id: Li-ratio
    where: 'section "Checking against the sky", flashcard 4, summary: lithium about 3 times rarer than predicted'
    inputs: {pred: 4.72e-10, obs: 1.45e-10}
    formula: pred / obs
    expected: 3
    tolerance: '10%'
    shown: ['about 3 times less than predicted', 'only lithium is about 3 times rarer than predicted', 'lithium is about 3 times too rare']
    source: {cite: reading2, at: 'eqs. (24.4) and (24.10)'}
    origin: page-own

  - id: traces
    kind: fact
    where: 'section "Traces": D and ³He a few in 10⁵, ⁷Li about one in 10¹⁰'
    shown: ['a few atoms for every $10^5$ hydrogen atoms', 'about one atom for every $10^{10}$ hydrogen atoms']
    source: {cite: reading2, at: 'Sec. 24.2, p. 2'}
    origin: mit

  - id: sun-helium
    kind: fact
    where: 'section "Checking against the sky": the Sun has about 28% helium (lesson 8.5, MIT 8.033 slides 8-9)'
    shown: ['has about 28% (lesson 8.5)']
    source: {cite: reading2, at: 'value from lesson 8.5 (8.033 Lecture 10, slides 8 and 9)'}
    origin: mit
