# Calculations on content/year-0/hs-8/black-holes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 8: G = 6.67e-11 N m²/kg², c = 3.00e8 m/s, solar mass 1.99e30 kg.

page: content/year-0/hs-8/black-holes.mdx
calcs:
  - id: progenitor-8
    kind: fact
    where: 'section "How a black hole forms": stars of more than about 8 solar masses'
    value: '8'
    shown: ['Stars of more than about 8 solar masses can end their lives this way']
    source: {cite: types, at: 'Stellar'}
    origin: later-data

  - id: progenitor-20
    kind: fact
    where: 'section "How a black hole forms", summary and flashcard: about 20 solar masses or more'
    value: '20'
    shown: ['Stars of about 20 solar masses or more leave a', 'A star of about 20 solar masses or more ends in a supernova', 'A star of more than about 20 solar masses runs out of fuel']
    source: {cite: types, at: 'Stellar'}
    origin: later-data

  - id: max-neutron-star
    kind: fact
    where: 'section "How a black hole forms", "X-ray binaries", quiz 2, summary and flashcard: largest neutron star mass, about 3 solar masses'
    value: '3'
    shown: ['largest possible mass of a neutron star at about 3 solar masses (Lecture 24, slide 30)', 'If it is heavier than 3 solar masses and still invisible', 'heavier than the largest possible neutron star (about 3 solar masses)', 'heavier than any neutron star can be (about 3 solar masses)', 'too heavy (more than about 3 solar masses)']
    source: {cite: reading1, at: 'slide 30'}
    origin: mit

  - id: escape-speed-rs-form
    kind: identity
    where: 'section "Escape speed and the Schwarzschild radius": with 2GM = r_s c², √(2GM/r) = c√(r_s/r)'
    formula: sqrt(2 * G * M / r)
    equals: c * sqrt((2 * G * M / c**2) / r)
    samples: {G: [6.67e-11, 6.67e-11, 6.674e-11], M: [1.99e31, 7.96e36, 5.97e24], r: [1.0e5, 1.8e13, 6.371e6], c: [3.0e8, 3.0e8, 3.0e8]}
    tolerance: 1e-9
    shown: ['v_{\text{esc}} = c\,\sqrt{\frac{r_s}{r}}']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: escape-at-horizon
    kind: identity
    where: 'section "Escape speed and the Schwarzschild radius": at r = 2GM/c² the escape speed √(2GM/r) equals c'
    formula: sqrt(2 * G * M / (2 * G * M / c**2))
    equals: c
    samples: {G: [6.67e-11, 6.67e-11], M: [1.99e31, 7.96e36], c: [3.0e8, 3.0e8]}
    tolerance: 1e-6
    shown: ['r_s = \frac{2 G M}{c^2}']
    source: {cite: mit, at: 'slides 8 and 10–11'}
    origin: page-own

  - id: plot-half-c
    where: 'plot caption: at four Schwarzschild radii the escape speed is half the speed of light'
    inputs: {x: '4'}
    formula: 1 / sqrt(x)
    expected: '0.5'
    shown: ['At four Schwarzschild radii it is half the speed of light']
    source: {cite: mit, at: 'slide 8'}
    origin: page-own

  - id: plot-horizon-point
    where: 'plot: the horizon point, v_esc/c = 1 at r/r_s = 1'
    inputs: {x: '1'}
    formula: 1 / sqrt(x)
    expected: '1'
    shown: ['{ x: 1, y: 1, label: "horizon" }']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: ten-mass
    where: 'worked example "A black hole of 10 solar masses", step "The mass"'
    inputs: {Msun: 1.99e30 kg}
    formula: 10 * Msun
    expected: 1.99e31 kg
    shown: ['$M = 10 \times 1.99 \times 10^{30} = 1.99 \times 10^{31}\ \text{kg}$']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: ten-rs
    where: 'worked example "A black hole of 10 solar masses", step "The radius" (unrounded 29 496 m); also the summary'
    inputs: {G: 6.67e-11 N*m**2/kg**2, M: 1.99e31 kg, c: 3.00e8 m/s}
    formula: 2 * G * M / c**2
    expected: 2.95e4 m
    shown: ['$r_s = 2 \times 6.67 \times 10^{-11} \times 1.99 \times 10^{31}/(3.00 \times 10^8)^2 = 2.95 \times 10^4\ \text{m}$', 'or $29.5\ \text{km}$', '$29.5$ km for 10 solar masses']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: ten-diameter
    where: 'worked example, step "The radius": a sphere about 60 km across (2 × 29.5 km)'
    inputs: {G: 6.67e-11 N*m**2/kg**2, M: 1.99e31 kg, c: 3.00e8 m/s}
    formula: 2 * (2 * G * M / c**2)
    expected: 60 km
    tolerance: '2%'
    shown: ['inside a sphere about $60\ \text{km}$ across']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: rs-per-solar-mass
    where: 'worked example, step "A rule of thumb": r_s per solar mass (unrounded 2.9496 km); also flashcard, summary and quiz 1'
    inputs: {G: 6.67e-11 N*m**2/kg**2, M: 1.99e30 kg, c: 3.00e8 m/s}
    formula: 2 * G * M / c**2
    expected: 2.95 km
    shown: ['every solar mass adds $2.95\ \text{km}$', 'About $2.95$ km per solar mass.', 'about $2.95$ km per solar mass: $29.5$ km', '2.95 km is the value for one solar mass']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: rs-1000
    where: 'worked example, step "A rule of thumb": 1000 solar masses'
    inputs: {G: 6.67e-11 N*m**2/kg**2, M: 1.99e33 kg, c: 3.00e8 m/s}
    formula: 2 * G * M / c**2
    expected: 2950 km
    tolerance: '0.1%'
    shown: ['would have $r_s = 2950\ \text{km}$']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: ten-density
    where: 'worked example, step "How dense?" (unrounded 1.85e17 kg/m³ with r_s = 2.95e4 m)'
    inputs: {M: 1.99e31 kg, r: 2.95e4 m}
    formula: M / (4 / 3 * pi * r**3)
    expected: 1.9e17 kg/m**3
    shown: ['= 1.9 \times 10^{17}\ \text{kg/m}^3$']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

  - id: ten-density-water
    where: 'worked example, step "How dense?": compared with water, 1000 kg/m³'
    inputs: {M: 1.99e31 kg, r: 2.95e4 m, water: 1000 kg/m**3}
    formula: M / (4 / 3 * pi * r**3) / water
    expected: '2e14'
    tolerance: '10%'
    shown: ['about $2 \times 10^{14}$ times the density of water']
    source: {cite: mit, at: 'slides 10–11'}
    origin: page-own

