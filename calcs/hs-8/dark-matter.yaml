# Calculations on content/year-0/hs-8/dark-matter.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-8/dark-matter.mdx
calcs:
  - id: speed-from-mass
    kind: identity
    where: 'section "Weighing a galaxy, ring by ring": m v²/r = G M m/r² solved for v'
    formula: sqrt(G * M / r)
    equals: sqrt((G * M * m / r**2) * r / m)
    samples: {G: [6.67e-11, 6.67e-11], M: [2.0e41, 1.0e30], m: [2.0e30, 5.0e24], r: [5.0e20, 1.5e11]}
    tolerance: 1e-12
    shown: ['v = \sqrt{\frac{G\,M(r)}{r}}']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: mit

  - id: mass-from-speed
    kind: identity
    where: 'section "Weighing a galaxy, ring by ring": the same balance solved for the mass inside'
    formula: v**2 * r / G
    equals: M
    samples: {G: [6.67e-11, 6.67e-11], M: [2.0e41, 1.0e30], r: [5.0e20, 1.5e11], v: [1.6332e5, 2.1087e4]}
    tolerance: 1e-3
    shown: ['M(r) = \frac{v^2\, r}{G}']
    source: {cite: mit, at: 'eqs. (22)–(23), p. 10'}
    origin: mit

  - id: kepler-falloff-four
    where: 'section "Weighing a galaxy": four times farther out, half the speed'
    inputs: {k: 4}
    formula: 1 / sqrt(k)
    expected: 0.5
    shown: ['four times farther out, half the speed']
    source: {cite: mit, at: 'p. 10 (v_c ∝ r^(−1/2))'}
    origin: page-own

  - id: typical-speed
    kind: fact
    where: 'section "Weighing a galaxy": spiral galaxies have circular speeds of about 200 ± 50 km/s'
    value: 200 km/s
    shown: ['typically about $200 \pm 50$ km/s']
    source: {cite: mit, at: 'p. 10'}
    origin: mit

  - id: we-radius
    where: 'worked example "How much of a galaxy is dark?", step "Radius and speed in SI units"'
    inputs: {n: 60000, ly: 9.46e15 m}
    formula: n * ly
    expected: 5.68e20 m
    tolerance: '0.1%'
    shown: ['$r = 60\,000 \times 9.46 \times 10^{15}\ \text{m} = 5.68 \times 10^{20}$ m']
    source: {cite: mit, at: 'p. 10'}
    origin: page-own

  - id: we-mass
    where: 'worked example "How much of a galaxy is dark?", step (a)'
    inputs: {v: 1.6e5 m/s, r: 5.68e20 m, G: 6.67e-11 m**3/(kg*s**2)}
    formula: v**2 * r / G
    expected: 2.2e41 kg
    tolerance: '1.5%'
    shown: ['= 2.2 \times 10^{41}$ kg. Divided by']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: we-mass-suns
    where: 'worked example "How much of a galaxy is dark?", step (a), in Sun masses'
    inputs: {v: 1.6e5 m/s, r: 5.68e20 m, G: 6.67e-11 m**3/(kg*s**2), Msun: 1.99e30 kg}
    formula: v**2 * r / G / Msun
    expected: 1.1e11
    tolerance: '1.5%'
    shown: ['= 1.1 \times 10^{11}$ Sun masses.']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: we-dark-fraction
    where: 'worked example "How much of a galaxy is dark?", step (b)'
    inputs: {Mvis: 2.0e10, Mtot: 1.1e11}
    formula: 1 - Mvis / Mtot
    expected: 0.82
    tolerance: '1%'
    shown: ['is about 82%', '82% dark inside its orbits']
    source: {cite: mit, at: 'p. 10'}
    origin: page-own

  - id: we-visible-speed
    where: 'worked example "How much of a galaxy is dark?", step (c)'
    inputs: {G: 6.67e-11 m**3/(kg*s**2), Mvis: 2.0e10, Msun: 1.99e30 kg, r: 5.68e20 m}
    formula: sqrt(G * Mvis * Msun / r)
    expected: 6.8e4 m/s
    tolerance: '1%'
    shown: ['= 6.8 \times 10^{4}$ m/s, about 68 km/s']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: we-check-ratio
    where: 'worked example "How much of a galaxy is dark?", step "Check"'
    inputs: {a: 68, b: 160}
    formula: (a / b)**2
    expected: 0.18
    tolerance: '1%'
    shown: ['$(68/160)^2 = 0.18$, the visible 18%']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: plot-visible-edge
    where: 'Plot caption: visible matter alone peaks at 150 km/s at 8 000 light-years'
    inputs: {r: 8}
    formula: 150 * r / 8
    expected: 150
    shown: ['rising to 150 km/s at its edge']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: plot-visible-100
    where: 'Plot caption: visible matter alone at 100 000 light-years'
    inputs: {r: 100}
    formula: 150 * sqrt(8 / r)
    expected: 42
    tolerance: '1.5%'
    shown: ['to 42 km/s at 100 000 light-years']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: plot-total-min
    where: 'Plot caption: the lowest total speed between 8 000 and 100 000 light-years (near 10 500 light-years)'
    inputs: {r: 10.5}
    formula: sqrt((150 * sqrt(8 / r))**2 + (200 * r / sqrt(r**2 + 225))**2)
    expected: 174
    tolerance: '0.5%'
    shown: ['stays between 174 and 202 km/s']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: plot-total-100
    where: 'Plot caption: the total at 100 000 light-years, the highest in the range'
    inputs: {r: 100}
    formula: sqrt((150 * sqrt(8 / r))**2 + (200 * r / sqrt(r**2 + 225))**2)
    expected: 202
    tolerance: '0.5%'
    shown: ['stays between 174 and 202 km/s']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: plot-visible-50
    where: 'Plot caption: visible matter alone at 50 000 light-years'
    inputs: {r: 50}
    formula: 150 * sqrt(8 / r)
    expected: 60
    tolerance: '0.5%'
    shown: ['the visible matter alone gives 60 km/s']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: plot-total-50
    where: 'Plot caption: the total at 50 000 light-years'
    inputs: {r: 50}
    formula: sqrt((150 * sqrt(8 / r))**2 + (200 * r / sqrt(r**2 + 225))**2)
    expected: 201
    tolerance: '0.5%'
    shown: ['the total 201 km/s']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: quiz-mass-ratio
    where: 'quiz 1: flat curve, mass inside 90 000 ly vs 30 000 ly'
    inputs: {r1: 30000, r2: 90000}
    formula: r2 / r1
    expected: 3
    shown: ['three times the radius, three times the mass']
    source: {cite: mit, at: 'eqs. (22)–(23), p. 10'}
    origin: page-own

  - id: quiz-cloud-mass
    quiz: 1
    where: 'quiz 2: mass inside an orbit at 4.0e20 m with 250 km/s'
    inputs: {v: 2.5e5 m/s, r: 4.0e20 m, G: 6.67e-11 m**3/(kg*s**2)}
    formula: v**2 * r / G
    expected: 3.7e41 kg
    tolerance: '1.5%'
    shown: ['= 3.7 \\times 10^{41}$ kg, about']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: quiz-cloud-mass-suns
    where: 'quiz 2 explanation: the same mass in Sun masses'
    inputs: {v: 2.5e5 m/s, r: 4.0e20 m, G: 6.67e-11 m**3/(kg*s**2), Msun: 1.99e30 kg}
    formula: v**2 * r / G / Msun
    expected: 2e11
    tolerance: '10%'
    shown: ['about $2 \\times 10^{11}$ Sun masses']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: quiz-cloud-mass-kms
    where: 'quiz 2 distractor: speed left in km/s'
    inputs: {v: 250, r: 4.0e20, G: 6.67e-11}
    formula: v**2 * r / G
    expected: 3.7e35
    tolerance: '1.5%'
    shown: ['$3.7 \\times 10^{35}$ kg']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: quiz-cloud-mass-timesG
    where: 'quiz 2 distractor: multiplying by G'
    inputs: {v: 2.5e5, r: 4.0e20, G: 6.67e-11}
    formula: v**2 * r * G
    expected: 1.7e21
    tolerance: '2%'
    shown: ['$1.7 \\times 10^{21}$ kg']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: quiz-cloud-mass-nosquare
    where: 'quiz 2 distractor: speed not squared'
    inputs: {v: 2.5e5, r: 4.0e20, G: 6.67e-11}
    formula: v * r / G
    expected: 1.5e36
    tolerance: '1.5%'
    shown: ['$1.5 \\times 10^{36}$ kg']
    source: {cite: mit, at: 'eq. (22), p. 10'}
    origin: page-own

  - id: quiz-kepler
    quiz: 2
    where: 'quiz 3: 210 km/s at 10 000 ly, predicted speed at 90 000 ly'
    inputs: {v: 210, r1: 10000, r2: 90000}
    formula: v * sqrt(r1 / r2)
    expected: 70
    shown: ['$210/3 = 70$ km/s']
    source: {cite: mit, at: 'p. 10 (v_c ∝ r^(−1/2))'}
    origin: page-own

  - id: nasa-ordinary
    kind: fact
    where: 'section "How much is there?", quiz 5 and Summary: ordinary matter about 5%'
    value: '0.05'
    shown: ['ordinary matter about 5%, dark matter about 27%, and dark energy about 68%', 'about 5% ordinary matter, 27% dark matter and 68% dark energy']
    source: {cite: nasaDM, at: 'What is Dark Matter?'}
    origin: later-data

  - id: dark-to-ordinary
    where: 'section "How much is there?" and quiz 5: dark matter / ordinary matter'
    inputs: {dm: 27, b: 5}
    formula: dm / b
    expected: 5.4
    shown: ['there is about $27/5 = 5.4$ times', '$27/5 = 5.4$, so about five times']
    source: {cite: nasaDM, at: 'What is Dark Matter?'}
    origin: page-own

  - id: dark-share-of-matter
    where: 'section "How much is there?" and quiz 5: dark share of all matter'
    inputs: {dm: 27, b: 5}
    formula: dm / (dm + b)
    expected: 0.84
    tolerance: '0.5%'
    shown: ['of all matter, $27/(27 + 5) = 0.84$, or 84%', 'dark matter is $27/(27 + 5) = 0.84$, or 84%.']
    source: {cite: nasaDM, at: 'What is Dark Matter?'}
    origin: page-own

  - id: quiz5-distractors
    where: 'quiz 5 explanation: subtracting gives 22, adding gives 32'
