    expected: 22
    shown: ['Subtracting gives 22 and adding gives 32']
    source: {cite: nasaDM, at: 'What is Dark Matter?'}
    origin: page-own

  - id: matter-total-nasa
    where: 'section "How much is there?": NASA 27% + 5% = 32%'
    inputs: {dm: 27, b: 5}
    formula: dm + b
    expected: 32
    shown: ['27% + 5% = 32% again']
