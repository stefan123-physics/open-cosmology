# Calculations on content/year-0/hs-8/towards-the-universe-open-questions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Block 8: c = 3.00e8 m/s, 1 light-year = 9.46e15 m.
# Cosmological values from calcs/values.yaml: age 13.8 billion years (Guth 2013 / site standard), T_CMB = 2.725 K,
# H0 = 70 km/s/Mpc (example) with 30% matter and 70% dark energy (example) for the graph.

page: content/year-0/hs-8/towards-the-universe-open-questions.mdx
calcs:
  - id: age
    kind: fact
    where: 'section "The road so far", worked example and Summary: the age of the universe'
    value: 13.8e9 yr
    shown: ['gives an age of about 13.8 billion years (lesson 8.12)', 'about **13.8 billion years** old']
    source: {cite: mit, at: 'Cosmic History: inflation about 13.8 billion years ago'}
    origin: later-data

  - id: cmb-temperature
    kind: fact
    where: 'section "The road so far" and Summary: the cosmic microwave background today'
    value: 2.725 K
    shown: ['now at 2.725 K, about 380 000 years later (lesson 8.15)', 'now at 2.725 K.']
    source: {cite: mit, at: 'Cosmic History: recombination about 380 000 years after the Big Bang (temperature as in lesson 8.15)'}
    origin: later-data

  - id: shares
    kind: fact
    where: 'section "The road so far", flashcard 1 and Summary: 5% ordinary matter, 27% dark matter, 68% dark energy'
    value: '0.68'
    shown: ['the universe is about 5% ordinary matter, 27% dark matter and 68% dark energy', 'About 5% ordinary matter (atoms), 27% dark matter and 68% dark energy.', '**5% ordinary matter, 27% dark matter and 68% dark energy**']
    source: {cite: nasaDM, at: 'What is Dark Matter?'}
    origin: later-data

  - id: dark-to-ordinary
    where: 'section "What is dark matter?": dark matter about five times as common as ordinary matter'
    inputs: {dm: 27, om: 5}
    formula: dm / om
    expected: '5.4'
    tolerance: '10%'
    shown: ['Dark matter is about five times as common as the matter we are made of']
    source: {cite: nasaDM, at: 'What is Dark Matter?'}
    origin: page-own

  - id: acceleration-1998
    kind: fact
    where: 'section "What is dark energy?" and flashcard 3: the accelerating expansion found in 1998'
    value: '1998'
    shown: ['Since 1998, when two teams found that distant Type Ia supernovae are dimmer than expected', 'speed up (found in 1998)']
    source: {cite: nasaDE, at: 'discovery section'}
    origin: later-data

  - id: vacuum-120
    kind: fact
    where: 'section "What is dark energy?", flashcard 3 and Summary: the quantum estimate of the vacuum energy is about 120 orders of magnitude too large'
    value: '120'
    shown: ['too large by about 120 orders of magnitude: a factor of 1 followed by 120 zeros', 'too large by about 120 orders of magnitude.', 'about 120 orders of magnitude too large']
    source: {cite: reading1, at: 'p. 27'}
    origin: mit

  - id: planck-length
    kind: fact
    where: 'sections "What is dark energy?" and "The singularity and quantum gravity": the length scale of quantum gravity'
    value: 1e-33 cm
    shown: ['(about $10^{-33}$ cm)', 'about $10^{-33}$ cm (Lecture 1, p. 27)']
    source: {cite: reading1, at: 'p. 27'}
    origin: mit

  - id: photons-per-baryon
    kind: fact
    where: 'section "Why is there matter at all?", quiz 2 and flashcard 4: about a billion photons per proton or neutron'
    value: 1e9
    shown: ['there are about a billion of them for every proton or neutron', 'for every billion or so particles that met an antiparticle, about one was left over', 'one particle of matter survives for every billion or so photons', 'about one particle per billion photons']
    source: {cite: ferreras, at: 'Sec. 6.2, p. 136'}
    origin: later-data

  - id: hubble-tension-cmb
    kind: fact
    where: 'section "Why do two ways of measuring the expansion disagree?", quiz 3 and flashcard 5: H0 from the CMB'
    value: 67 km/s/Mpc
    tolerance: '2%'
    shown: ['the background radiation gives about 67 to 68 km/s/Mpc', 'gives an expansion rate of about 67 to 68 km/s/Mpc']
    source: {cite: nasaTension, at: 'CMB measurements'}
    origin: later-data

  - id: hubble-tension-ladder
    kind: fact
    where: 'section "Why do two ways of measuring the expansion disagree?", quiz 3 and flashcard 5: H0 from Cepheids and supernovae'
    value: 73 km/s/Mpc
    tolerance: '5%'
    shown: ['Cepheids and supernovae give between about 70 and 76', 'space telescopes give about 70 to 76 and the background radiation about 67 to 68 km/s/Mpc', 'Cepheids and supernovae about 70 to 76.']
    source: {cite: nasaTension, at: 'space telescope measurements (70 to 76 km/s/Mpc)'}
    origin: later-data

  - id: horizon-identity
    kind: identity
    where: 'formula "Distance today to the source of the oldest light": a ∝ t^(2/3) gives b t0^(2/3) · 3c t0^(1/3)/b = 3c t0'
    formula: b * t0**(2/3) * 3 * c * t0**(1/3) / b
    equals: 3 * c * t0
    samples: {b: [1.0, 2.5, 0.3], t0: [13.8, 9.0, 1.0], c: [1.0, 3.0e8, 1.0]}
    tolerance: 1e-9
    shown: ['tex="d = 3\,c\,t_0"']
    source: {cite: reading3, at: 'pp. 19–20 (board)'}
    origin: mit

  - id: ex-light-distance
    where: 'worked example "The size of the visible universe", step "The light''s own journey"'
    inputs: {t: 1.38e10, ly: 9.46e15 m}
    formula: t * ly
    expected: 1.31e26 m
    tolerance: '0.5%'
    shown: ['$1.38 \times 10^{10} \times 9.46 \times 10^{15}\ \text{m} = 1.31 \times 10^{26}\ \text{m}$']
    source: {cite: reading3, at: 'p. 17: light covers c per unit time'}
    origin: page-own

  - id: ex-horizon-gly
    where: 'worked example, step "Where the source is now", and Summary: 3 × 13.8 billion light-years'
    inputs: {t: 13.8}
    formula: 3 * t
    expected: '41.4'
    tolerance: '0.1%'
    shown: ['$d = 3ct_0 = 3 \times 13.8 = 41.4$ billion light-years', 'about 41 billion light-years for $t_0 = 13.8$ billion years']
    source: {cite: reading3, at: 'pp. 19–20'}
    origin: page-own

  - id: ex-horizon-m
    where: 'worked example, step "Where the source is now": 41.4 billion light-years in metres'
    inputs: {t: 4.14e10, ly: 9.46e15 m}
    formula: t * ly
    expected: 3.92e26 m
    tolerance: '0.5%'
    shown: ['or $3.92 \times 10^{26}\ \text{m}$: three times as far']
    source: {cite: reading3, at: 'pp. 19–20'}
    origin: page-own

  - id: quiz-light-10gyr
    where: 'quiz 0: light travelling for 10.0 billion years'
    quiz: 0
    inputs: {t: 1.00e10, ly: 9.46e15 m}
    formula: t * ly
    expected: 9.46e25 m
    tolerance: '0.5%'
    shown: ['$1.00 \\times 10^{10} \\times 9.46 \\times 10^{15}\\ \\text{m} = 9.46 \\times 10^{25}\\ \\text{m}$']
    source: {cite: reading3, at: 'p. 17'}
    origin: page-own

  - id: quiz-horizon-9gyr
    where: 'quiz 1: 3ct0 for a matter-only universe 9.0 billion years old'
    quiz: 1
    inputs: {t: 9.0e9}
    formula: 3 * t
    expected: '2.7e10'
    tolerance: '0.1%'
    shown: ['$3 \\times 9.0 = 27$ billion light-years']
    source: {cite: reading3, at: 'pp. 19–20'}
    origin: page-own

  - id: plot-hubble-time
    where: 'graph: 1/H0 for H0 = 70 km/s/Mpc, in billions of years (13.97 in the curve)'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 13.97e9 yr
    tolerance: '0.1%'
    shown: ['both expanding at 70 km/s/Mpc today']
    source: {cite: reading4, at: 'pp. 8–9'}
    origin: page-own

  - id: plot-age-lambda
    where: 'graph caption: age of the flat model with 30% matter and 70% dark energy (13.47 in the curve)'
    inputs: {TH: 13.97, om: 0.3, ol: 0.7}
    formula: 2 / (3 * sqrt(ol)) * TH * asinh(sqrt(ol / om))
    expected: '13.47'
    tolerance: '0.2%'
    shown: ['This simple model puts the Big Bang 13.5 billion years ago']
    source: {cite: reading4, at: 'pp. 9–10 (board)'}
    origin: page-own

  - id: plot-age-matter
    where: 'graph: age of the matter-only model, 2/3 of the Hubble time (9.31 in the curve)'
    inputs: {TH: 13.97}
    formula: 2 / 3 * TH
    expected: '9.31'
    tolerance: '0.2%'
    shown: ['matter only; both expanding']
    source: {cite: reading4, at: 'pp. 9–10 (board), the case with no vacuum energy'}
    origin: page-own

  - id: plot-today-is-one
    where: 'graph: the solid curve passes through 1 today (point "today")'
    inputs: {TH: 13.97, om: 0.3, ol: 0.7, t0: 13.47}
    formula: (om / ol)**(1/3) * sinh(1.5 * sqrt(ol) * t0 / TH)**(2/3)
    expected: '1.00'
    tolerance: '0.5%'
    shown: ['points={[{ x: 0, y: 1, label: "today" }]}']
    source: {cite: reading4, at: 'pp. 8–10'}
    origin: page-own

  - id: plot-lambda-30
    where: 'graph caption: size 30 billion years from now with dark energy'
    inputs: {TH: 13.97, om: 0.3, ol: 0.7, t: 43.47}
    formula: (om / ol)**(1/3) * sinh(1.5 * sqrt(ol) * t / TH)**(2/3)
    expected: '6.4'
    tolerance: '1%'
    shown: ['the universe would be about 6.4 times its present size']
    source: {cite: reading4, at: 'pp. 8–10'}
    origin: page-own

  - id: plot-matter-30
    where: 'graph caption: size 30 billion years from now with matter only'
    inputs: {t: 39.31, tm: 9.31}
    formula: (t / tm)**(2/3)
    expected: '2.6'
    tolerance: '1%'
    shown: ['against 2.6 times with matter alone']
    source: {cite: reading3, at: 'a ∝ t^(2/3), pp. 19–20'}
    origin: page-own
