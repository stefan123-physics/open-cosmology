  - id: clock-c
    where: 'worked example (c): time when T = 1.0e9 K by the rounded rule (outside the rule''s range; the page says so)'
    inputs: {T: 1.0e9}
    formula: (1.0e10 / T)**2
    expected: '100'
    shown: ['so $t = 100\ \text{s}$ by the rule']
    source: {cite: reading4, at: 'p. 17'}
    origin: page-own

  - id: bbn-three-minutes
