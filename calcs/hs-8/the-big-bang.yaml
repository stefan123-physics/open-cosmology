# Calculations on content/year-0/hs-8/the-big-bang.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-8/the-big-bang.mdx
calcs:
  - id: age-13-8
    kind: fact
    where: 'section "What the Big Bang theory says", timeline table, summary: the universe began about 13.8 billion years ago (Guth: 13.82 from Planck 2013)'
    value: 13.8e9 yr
    shown: ['began about 13.8 billion years ago in a state', '| Today, 13.8 billion years |']
    source: {cite: reading1, at: 'pp. 1–2'}
    origin: mit

  - id: distances-identity
    kind: identity
    where: 'formula "Distances grow with the scale factor": with a = 1 today, d(now) = d_now'
    formula: a * dnow
    equals: dnow
    samples: {a: [1.0, 1.0, 1.0], dnow: [1.0, 50.0, 400.0]}
    tolerance: 1e-12
    shown: ['d(t) = a(t)\, d_\text{now}']
    source: {cite: reading2, at: 'p. 21'}
    origin: page-own

  - id: density-half-size
    where: 'section "The scale factor": halving every length makes the volume 1/8 and the density 8 times higher'
    inputs: {}
    formula: (1/2)**(-3)
    expected: '8'
    shown: ['$(1/2)^3 = 1/8$ as large', 'packed **8 times** as densely']
    source: {cite: reading4, at: 'p. 18'}
    origin: page-own

  - id: wien-constant
    kind: fact
    where: 'section "Cooling as space expands": Wien''s law, as in lesson 7.2'
    value: 2.9e-3 m*K
    shown: ['$\lambda_{\max} T = 2.9 \times 10^{-3}\ \text{m K}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: mit

  - id: T-a-identity
    kind: identity
    where: 'formula "Radiation cools as the universe grows": T = T_now/a keeps T × a constant, and halving a doubles T (first plot caption)'
    formula: (Tnow / a) * a
    equals: Tnow
    samples: {Tnow: [2.725, 2.725, 2.725], a: [0.5, 0.01, 0.001]}
    tolerance: 1e-12
    shown: ['T \times a = \text{constant} \quad\Longrightarrow\quad T = \frac{T_\text{now}}{a}', 'Halving the size doubles the temperature']
    source: {cite: reading4, at: 'p. 18'}
    origin: mit

  - id: T-cmb
    kind: fact
    where: 'section "Cooling as space expands", worked example, flashcard 3, summary: T_now = 2.725 K'
    value: 2.725 K
    shown: ['$T_\text{now} = 2.725\ \text{K}$ (measured', 'with $T_\text{now} = 2.725\ \text{K}$.']
    source: {cite: firas, at: 'temperature 2.725 ± 0.002 K'}
    origin: later-data

  - id: T-at-a-100
    where: 'worked example "How hot was a smaller universe?" (a); summary'
    inputs: {Tnow: 2.725 K, a: 0.01}
    formula: Tnow / a
    expected: 272.5 K
    shown: ['$T = 2.725/0.01 = 272.5\ \text{K}$', 'the sky was at $272.5\ \text{K}$']
    source: {cite: reading4, at: 'p. 18'}
    origin: page-own

  - id: T-at-a-100-celsius
    where: 'worked example (a): 272.5 K in degrees Celsius'
    inputs: {}
    formula: 272.5 - 273.15
    expected: '-0.65'
    tolerance: '10%'
    shown: ['That is about $-0.7\ ^\circ\text{C}$']
    source: {cite: reading4, at: 'p. 18'}
    origin: page-own

  - id: T-at-a-1000
    where: 'worked example (b); flashcard 3; summary'
    inputs: {Tnow: 2.725 K, a: 0.001}
    formula: Tnow / a
    expected: 2725 K
    shown: ['$T = 2.725/0.001 = 2725\ \text{K}$', 'At $a = 1/1000$: $2725\\ \\text{K}$.', 'at $a = 1/1000$ at $2725\ \text{K}$']
    source: {cite: reading4, at: 'p. 18'}
    origin: page-own

  - id: peak-at-2725
    where: 'worked example (b): Wien peak at 2725 K'
    inputs: {b: 2.9e-3 m*K, T: 2725 K}
    formula: b / T
    expected: 1.06e-6 m
    shown: ['$\lambda_{\max} = 2.9 \times 10^{-3}/2725 = 1.06 \times 10^{-6}\ \text{m}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: a-at-1e10
    where: 'worked example (c): scale factor when T = 1.0e10 K'
    inputs: {Tnow: 2.725 K, T: 1.0e10 K}
    formula: Tnow / T
    expected: '2.7e-10'
    tolerance: '2%'
    shown: ['$a = T_\text{now}/T = 2.725/(1.0 \times 10^{10}) = 2.7 \times 10^{-10}$']
    source: {cite: reading4, at: 'p. 18'}
    origin: page-own

  - id: shrink-factor-1e10
    where: 'worked example (c): every distance about 3.7 billion times smaller'
    inputs: {}
    formula: 1 / 2.7e-10
    expected: '3.7e9'
    shown: ['$1/(2.7 \times 10^{-10}) = 3.7 \times 10^{9}$ times smaller', 'almost four billion times']
    source: {cite: reading4, at: 'p. 18'}
    origin: page-own

  - id: a-at-3000
    where: 'first plot caption: the radiation crossed 3000 K when a was about 1/1100'
    inputs: {}
    formula: 3000 / 2.725
    expected: '1100'
    tolerance: '1%'
    shown: ['it crossed that line when a was about 1/1100']
    source: {cite: reading4, at: 'p. 19'}
    origin: page-own

  - id: decoupling-3000
    kind: fact
    where: 'worked example (b), first plot, timeline table: light set free at about 3000 K'
    value: 3000 K
    shown: ['a little below the $3000\ \text{K}$ at which', '| About 380 000 years | about $3000\ \text{K}$ |']
    source: {cite: reading4, at: 'p. 19'}
    origin: mit

  - id: decoupling-time
    kind: fact
    where: 'timeline table, quiz 3, flashcard 5, summary: atoms and the microwave background at about 380 000 years'
    value: 380000 yr
    shown: ['| About 380 000 years |', 'atoms and the microwave background at about 380 000 years']
    source: {cite: reading4, at: 'p. 19'}
    origin: mit

  - id: radiation-sqrt-identity
    kind: identity
    where: 'section "A temperature clock": with a ∝ √t and T ∝ 1/a, four times as long gives half the temperature (also second plot caption)'
    formula: 1 / sqrt(4 * t)
    equals: 0.5 / sqrt(t)
    samples: {t: [0.25, 1.0, 10.0]}
    tolerance: 1e-12
    shown: ['four times as long, half as hot', 'four times later it is half as hot']
    source: {cite: reading3, at: 'p. 14 (board)'}
    origin: page-own

  - id: guth-T-of-t
    where: 'formula "Temperature of the early universe against time": the coefficient for g = 10¾ (exactly 9.97e9 K; Guth rounds to 9.98e9); flashcard 4; callout; second plot'
    inputs: {g: 10.75, t: 1 s}
    formula: (45 * hbar**3 * c**5 / (16 * pi**3 * g * G))**(1/4) / sqrt(t) / k_B
    expected: 9.98e9 K
    tolerance: '0.5%'
    shown: ['T = \frac{9.98 \times 10^{9}\ \text{K}}{\sqrt{t\ [\text{s}]}}', '$9.98 \\times 10^{9}\\ \\text{K}/\\sqrt{t}$', 'clock $T = 9.98 \times 10^{9}\ \text{K}/\sqrt{t}$']
    source: {cite: reading4, at: 'p. 17'}
    origin: mit

  - id: T-at-1s
    where: 'section "A temperature clock", timeline table, summary: about 10¹⁰ K at one second'
    inputs: {}
    formula: 9.98e9
    expected: '1e10'
    tolerance: '1%'
    shown: ['at about ten billion kelvin, $10^{10}\ \text{K}$', '| About $1\ \text{s}$ | about $10^{10}\ \text{K}$ |', 'about $10^{10}\ \text{K}$ one second after the start']
    source: {cite: reading4, at: 'p. 17'}
    origin: page-own

  - id: clock-a
    where: 'worked example "Reading the temperature clock" (a): t = 0.01 s'
    inputs: {t: 0.01}
    formula: 1.0e10 / sqrt(t)
    expected: '1.0e11'
    shown: ['$T = 1.0 \times 10^{10}/0.1 = 1.0 \times 10^{11}\ \text{K}$']
    source: {cite: reading4, at: 'p. 17'}
    origin: page-own

  - id: clock-b
    where: 'worked example (b): t = 25 s'
    inputs: {t: 25}
    formula: 1.0e10 / sqrt(t)
    expected: '2.0e9'
    shown: ['$T = 1.0 \times 10^{10}/5 = 2.0 \times 10^{9}\ \text{K}$']
