# Calculations on content/year-0/hs-8/cosmic-microwave-background.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6/7: Wien constant 2.9e-3 m K (lessons 7.2 and 7.6).
# Wien constant cited to MIT 8.901 PS2 Problem 1(c), as lesson 7.2. T_CMB = 2.725 K (calcs/values.yaml), cited to NASA COBE FIRAS as in lessons 7.11 and 8.13. Decoupling at about 3000 K and 380 000 years: 8.286 Lecture 17 pp. 18-19.

page: content/year-0/hs-8/cosmic-microwave-background.mdx
calcs:
  - id: wien-constant
    kind: fact
    where: 'formula "Wien''s displacement law" (recap of lessons 7.2 and 7.6)'
    value: 2.9e-3 m*K
    shown: ['tex="\lambda_{\max}\,T = 2.9 \times 10^{-3}\ \text{m K}"']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: mit

  - id: t-cmb
    kind: fact
    where: 'section "A black body, cooled by the expansion": the temperature today, COBE FIRAS 2.725 ± 0.002 K (as in lessons 7.11 and 8.13)'
    value: 2.725 K
    shown: ['Today the radiation has a temperature of $2.725\ \text{K}$, as measured by NASA''s COBE satellite ($2.725 \pm 0.002\ \text{K}$; NASA, *COBE FIRAS Overview*).']
    source: {cite: firas, at: '2.725 ± 0.002 K'}
    origin: later-data

  - id: brightness-ratio
    where: 'worked example "The oldest light, then and now", step "How much brighter": Stefan-Boltzmann ratio (3000/2.725)^4'
    inputs: {Tthen: 3000, Tnow: 2.725}
    formula: (Tthen / Tnow)**4
    expected: 1.5e12
    tolerance: '3%'
    shown: ['$(3000/2.725)^4 = 1100^4 = 1.5 \times 10^{12}$']
    source: {cite: reading2, at: 'p. 18 (board), with the Stefan-Boltzmann law of lesson 7.2'}
    origin: page-own

  - id: volume-factor
    where: 'worked example "The oldest light, then and now", step "How much brighter": volume factor 1100^3'
    inputs: {}
    formula: 1100**3
    expected: 1.3e9
    tolerance: '3%'
    shown: ['$1100^3 = 1.3 \times 10^9$']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: quiz3-peak-start
    where: 'quiz 3 explanation: the peak of a 2000 K black body'
    inputs: {b: 2.9e-3 m*K, T: 2000 K}
    formula: b / T
    expected: 1.45e-6 m
    shown: ['$(2.9 \\times 10^{-3})/2000 = 1.45 \\times 10^{-6}\\ \\text{m}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: quiz3-peak-stretched
    where: 'quiz 3 answer and explanation: the peak stretched 4 times'
    inputs: {b: 2.9e-3 m*K, T: 2000 K}
    formula: 4 * b / T
    expected: 5.8e-6 m
    shown: ['$4 \\times 1.45 \\times 10^{-6} = 5.8 \\times 10^{-6}\\ \\text{m}$', '500\\ \\text{K}$, with its peak at $5.8 \\times 10^{-6}\\ \\text{m}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: quiz3-temperature
    where: 'quiz 3 answer and explanation: Wien temperature of a 5.8e-6 m peak'
    inputs: {b: 2.9e-3 m*K, lam: 5.8e-6 m}
    formula: b / lam
    expected: 500 K
    shown: ['$(2.9 \\times 10^{-3})/(5.8 \\times 10^{-6}) = 500\\ \\text{K}$', 'A black body at $500\\ \\text{K}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: quiz3-wrong-peak
    where: 'quiz 3 distractor: multiplying the temperature by 4 (8000 K) and its peak'
    inputs: {b: 2.9e-3 m*K, T: 8000 K}
    formula: b / T
    expected: 3.6e-7 m
    tolerance: '1%'
    shown: ['A black body at $8000\\ \\text{K}$, with its peak at $3.6 \\times 10^{-7}\\ \\text{m}$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: t-decoupling
    kind: fact
    where: 'section "A glowing fog clears": decoupling at about 3000 K, about 380 000 years after the Big Bang; recombination about 4000 K'
    value: 3000 K
    shown: ['So by about **3000 K** there were too few free electrons left', 'about **380 000 years** after the Big Bang', 'by about 4000 K about half of the hydrogen had become neutral']
    source: {cite: reading2, at: 'pp. 18-19'}
    origin: mit

  - id: t-scaling-identity
    kind: identity
    where: 'formula "Temperature then and now": T ∝ 1/a with 1 + z = a_now/a_then gives T_then = (1 + z) T_now'
    formula: Tnow * (anow / athen)
    equals: (1 + (anow / athen - 1)) * Tnow
    samples: {Tnow: [2.725, 2.725, 1.0], anow: [1.0, 1.0, 2.0], athen: [0.5, 0.001, 0.25]}
    tolerance: 1e-12
    shown: ['tex="T_\text{then} = (1 + z)\,T_\text{now}"']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: peak-now
    where: 'worked example "The oldest light, then and now", step "Now"; summary; flashcard 4; plot caption and point'
    inputs: {b: 2.9e-3 m*K, T: 2.725 K}
    formula: b / T
    expected: 1.06e-3 m
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/2.725 = 1.06 \times 10^{-3}\ \text{m} = 1.06\ \text{mm}$', 'its peak is at $1.06\ \text{mm}$', '$(2.9 \\times 10^{-3})/2.725 = 1.06 \\times 10^{-3}\\ \\text{m}$', 'label: "peak today, 1.06 mm"', '1.06 mm today']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: peak-decoupling
    where: 'worked example "The oldest light, then and now", step "At decoupling"; summary; quiz 2 explanation'
    inputs: {b: 2.9e-3 m*K, T: 3000 K}
    formula: b / T
    expected: 9.7e-7 m
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/3000 = 9.7 \times 10^{-7}\ \text{m} = 970\ \text{nm}$', 'the peak was near 970 nm']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: stretch-factor
    where: 'worked example "The oldest light, then and now", step "The stretch"; summary; quiz 2; flashcard 3'
    inputs: {Tthen: 3000, Tnow: 2.725}
    formula: Tthen / Tnow
    expected: '1100'
    tolerance: '0.5%'
    shown: ['$1 + z = T_\text{then}/T_\text{now} = 3000/2.725 = 1100$', 'Since decoupling the universe has grown about **1100** times', 'From about 3000 K to 2.725 K is a factor of about 1100']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: stretch-factor-peaks
    where: 'worked example "The oldest light, then and now", step "The stretch": the ratio of the rounded peak wavelengths'
    inputs: {}
    formula: 1.06e-3 / 9.7e-7
    expected: '1100'
    tolerance: '1%'
    shown: ['$(1.06 \times 10^{-3})/(9.7 \times 10^{-7}) = 1100$']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: room-temp-size
    where: 'worked example "A universe at room temperature", step "The size"'
    inputs: {Tthen: 300, Tnow: 2.725}
    formula: Tthen / Tnow
    expected: '110'
    shown: ['$1 + z = T_\text{then}/T_\text{now} = 300/2.725 = 110$']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: room-temp-peak
    where: 'worked example "A universe at room temperature", step "The peak"'
    inputs: {b: 2.9e-3 m*K, T: 300 K}
    formula: b / T
    expected: 9.7e-6 m
    shown: ['$\lambda_{\max} = (2.9 \times 10^{-3})/300 = 9.7 \times 10^{-6}\ \text{m}$, about 10 micrometres']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: plot-peak-today
    where: 'plot: the dashed curve (λ/1.0642)^(−5)(e^4.965 − 1)/(e^(4.965·1.0642/λ) − 1) equals 1 at its peak λ = 2.9/2.725 mm'
    inputs: {T: 2.725}
    formula: ((2.9 / T) / 1.0642)**(-5) * (exp(4.965) - 1) / (exp(4.965 * 1.0642 / (2.9 / T)) - 1)
    expected: '1.000'
    shown: ['scaled so that today''s curve (dashed, 2.725 K) has its peak at 1']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: plot-4K-size
    where: 'plot caption: at 4 K the universe was 4/2.725 times smaller'
    inputs: {}
    formula: 4 / 2.725
    expected: '1.47'
    shown: ['At 4 K, when the universe was 1.47 times smaller than now']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: plot-4K-peak
    where: 'plot caption: the peak at 4 K'
    inputs: {}
    formula: 2.9 / 4
    expected: '0.73'
    tolerance: '1%'
    shown: ['the peak was at 0.73 mm']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: plot-4K-height
    where: 'plot caption: the peak height at 4 K relative to today, (T/2.725)^5, evaluated with the plotted curve at its peak'
    inputs: {T: 4.0}
    formula: (T / 2.725)**5 * ((2.9 / T) / (2.9 / T))**(-5) * (exp(4.965) - 1) / (exp(4.965) - 1)
    expected: '6.8'
    shown: ['almost seven times higher, because the peak height grows as T⁵']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: quiz-z5-temperature
    quiz: 1
    where: 'quiz 1: the temperature when 1 + z = 5'
    inputs: {T: 2.725 K}
    formula: 5 * T
    expected: 13.6 K
    tolerance: '0.5%'
    shown: ['"$13.6\\ \\text{K}$"', '$5 \\times 2.725 = 13.6\\ \\text{K}$']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: quiz-z5-wrong
    where: 'quiz 1 distractor: dividing instead of multiplying'
    inputs: {T: 2.725 K}
    formula: T / 5
    expected: 0.545 K
    shown: ['"$0.545\\ \\text{K}$"']
    source: {cite: reading2, at: 'p. 18 (board)'}
    origin: page-own

  - id: quiz-z5-peak
    where: 'quiz 1 explanation: the peak at 13.6 K'
    inputs: {b: 2.9e-3 m*K, T: 13.6 K}
    formula: b / T
    expected: 2.1e-4 m
    shown: ['$(2.9 \\times 10^{-3})/13.6 = 2.1 \\times 10^{-4}\\ \\text{m}$, about 0.21 mm']
    source: {cite: wien, at: 'Problem 1(c)'}
    origin: page-own

  - id: ripple-size
    where: 'worked example "How small is one part in 100 000?"'
    inputs: {T: 2.725 K}
    formula: T / 100000
    expected: 2.7e-5 K
    shown: ['$2.725/100\,000 = 2.7 \times 10^{-5}\ \text{K}$, about 27 millionths of a kelvin']
    source: {cite: reading3, at: 'p. 100, section 1.A'}
    origin: page-own

  - id: ripple-fraction
    kind: fact
    where: 'section "Ripples: the seeds of galaxies": ΔT/T about 10⁻⁵; about 10⁻³ (a hundred times larger) without dark matter'
    value: '1e-5'
    shown: ['the background is the same in every direction to about one part in 100 000.', 'ripples about a hundred times larger would have been needed']
    source: {cite: reading3, at: 'p. 100, section 1.A'}
    origin: mit

  - id: wmap-contents
    kind: fact
    where: 'section "Ripples: the seeds of galaxies": contents of the universe from WMAP'
    value: '5% atoms, 25% dark matter, 70% dark energy'
    shown: ['ordinary atoms make up about 5% of the universe, dark matter about 25% and dark energy about 70%']
    source: {cite: nasa-wmap-overview, at: 'section on what WMAP found'}
    origin: later-data

  - id: age
    kind: fact
    where: 'section "Ripples: the seeds of galaxies"; summary; flashcard 5: age of the universe'
    value: 13.8e9 yr
    shown: ['the universe is about 13.8 billion years old (lesson 8.12)']
    source: {cite: nasa-wmap-overview, at: 'age fixed to within half a percent'}
    origin: later-data
