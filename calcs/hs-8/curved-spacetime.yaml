# Calculations on content/year-0/hs-8/curved-spacetime.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-8/curved-spacetime.mdx
calcs:
  - id: wep-precision
    kind: fact
    where: 'section "Newton''s gravity in one minute": tests of the equivalence principle by 2000'
    value: '1e-13'
    shown: ['By 2000 the tests reached about one part in $10^{13}$ (slide 18)']
    source: {cite: mit, at: 'slide 18'}
    origin: mit

  - id: lift-time
    where: 'worked example "Light across a lift", step "Time to cross"'
    inputs: {w: 3.0 m, c: 3.00e8 m/s}
    formula: w / c
    expected: 1.0e-8 s
    shown: ['$t = 3.0/(3.00 \times 10^8) = 1.0 \times 10^{-8}\ \text{s}$']
    source: {cite: mit, at: 'slides 19–20'}
    origin: page-own

  - id: lift-drop
    where: 'worked example "Light across a lift", step "The drop"'
    inputs: {g: 9.81 m/s**2, w: 3.0 m, c: 3.00e8 m/s}
    formula: 0.5 * g * (w / c)**2
    expected: 4.9e-16 m
    shown: ['$\tfrac12 \times 9.81 \times (1.0 \times 10^{-8})^2 = 4.9 \times 10^{-16}\ \text{m}$']
    source: {cite: mit, at: 'slides 19–20'}
    origin: page-own

  - id: lift-drop-vs-atom
    where: 'worked example "Light across a lift", step "What it means": an atom of 1e-10 m against the drop (unrounded 204 000)'
    inputs: {g: 9.81 m/s**2, w: 3.0 m, c: 3.00e8 m/s, atom: 1e-10 m}
    formula: atom / (0.5 * g * (w / c)**2)
    expected: '200000'
    tolerance: '3%'
    shown: ['the drop is some $200\,000$ times smaller than an atom']
    source: {cite: mit, at: 'slides 19–20'}
    origin: page-own

  - id: redshift-rocket
    kind: identity
    where: 'section "Clocks run slower lower down": the detector gains v = g·(h/c), and z ≈ v/c gives gh/c²'
    formula: (g * h / c) / c
    equals: g * h / c**2
    samples: {g: [9.81, 1.62], h: [10.0, 500.0], c: [3.0e8, 3.0e8]}
    tolerance: 1e-12
    shown: ['has gained a speed $v = g h/c$ compared with the moment the light left']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: tower-fraction
    where: 'worked example "A clock at the top of a skyscraper", step "The fraction"'
    inputs: {g: 9.81 m/s**2, h: 500 m, c: 3.00e8 m/s}
    formula: g * h / c**2
    expected: '5.45e-14'
    shown: ['$gh/c^2 = 9.81 \times 500/(3.00 \times 10^8)^2 = 5.45 \times 10^{-14}$']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: tower-year
    where: 'worked example "A clock at the top of a skyscraper", step "One year"'
    inputs: {g: 9.81 m/s**2, h: 500 m, c: 3.00e8 m/s, year: 3.156e7 s}
    formula: g * h / c**2 * year
    expected: 1.7e-6 s
    shown: ['$\Delta t = 5.45 \times 10^{-14} \times 3.156 \times 10^7 = 1.7 \times 10^{-6}\ \text{s}$', 'about $1.7$ microseconds ahead after a year']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: small-height-limit
    kind: identity
    where: 'section "Far from the ground": for small h, (GM/c²)(1/R − 1/(R + h)) ≈ gh/c² with g = GM/R²'
    formula: GM / c**2 * (1 / R - 1 / (R + h))
    equals: (GM / R**2) * h / c**2
    samples: {GM: [3.986e14, 3.986e14, 4.28e13], R: [6.371e6, 6.371e6, 3.39e6], h: [100.0, 1000.0, 500.0], c: [3.0e8, 3.0e8, 3.0e8]}
    tolerance: 2e-4
    shown: ['since $GM/R^2 = g$ this is $gh/c^2$ again']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: earth-gm
    kind: fact
    where: 'worked example "How much do GPS clocks gain from gravity?": GM of the Earth'
    value: 3.986e14 m**3/s**2
    shown: ['$GM = 3.986 \times 10^{14}\ \text{m}^3/\text{s}^2$']
    source: {cite: earth, at: 'GM'}
    origin: later-data

  - id: earth-radius
    kind: fact
    where: 'worked example: Earth radius'
    value: 6371 km
    shown: ['$R = 6371\ \text{km}$']
    source: {cite: earth, at: 'volumetric mean radius'}
    origin: later-data

  - id: gps-altitude
    kind: fact
    where: 'worked example: GPS orbit altitude'
    value: 20200 km
    shown: ['GPS satellites orbit about $20\,200\ \text{km}$ up']
    source: {cite: gps, at: 'slide 9'}
    origin: later-data

  - id: gps-radius
    where: 'step "The two distances"'
    inputs: {R: 6371 km, h: 20200 km}
    formula: R + h
    expected: 26571 km
    shown: ['$r = 6371 + 20\,200 = 26\,571\ \text{km} = 2.6571 \times 10^7\ \text{m}$']
    source: {cite: gps, at: 'slide 9'}
    origin: page-own

  - id: gm-over-c2
    where: 'step "The fraction": GM/c²'
    inputs: {GM: 3.986e14 m**3/s**2, c: 3.00e8 m/s}
    formula: GM / c**2
    expected: 4.43e-3 m
    shown: ['$GM/c^2 = 3.986 \times 10^{14}/(9.00 \times 10^{16}) = 4.43 \times 10^{-3}\ \text{m}$']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: gps-bracket
    where: 'step "The fraction": 1/R − 1/r'
    inputs: {R: 6.371e6 m, r: 2.6571e7 m}
    formula: 1 / R - 1 / r
    expected: 1.193e-7 1/m
    shown: ['$1/R - 1/r = 1.193 \times 10^{-7}\ \text{m}^{-1}$']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: gps-gravity-fraction
    where: 'step "The fraction": Δt/t'
    inputs: {GM: 3.986e14 m**3/s**2, c: 3.00e8 m/s, R: 6.371e6 m, r: 2.6571e7 m}
    formula: GM / c**2 * (1 / R - 1 / r)
    expected: '5.28e-10'
    shown: ['so $\Delta t/t = 5.28 \times 10^{-10}$']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: gps-gravity-day
    where: 'step "Per day" (unrounded 45.7 μs); also the summary and the frontmatter summary (46 μs)'
    inputs: {GM: 3.986e14 m**3/s**2, c: 3.00e8 m/s, R: 6.371e6 m, r: 2.6571e7 m, day: 86400 s}
    formula: GM / c**2 * (1 / R - 1 / r) * day
    expected: 4.6e-5 s
    tolerance: '1%'
    shown: ['$5.28 \times 10^{-10} \times 86\,400 = 4.6 \times 10^{-5}\ \text{s}$', 'about $46$ microseconds a day ahead', 'GPS clocks gain about $46$ μs a day from gravity', 'GPS clocks gain about 46 μs a day from weaker gravity']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: gps-uniform-g
    where: 'step "Per day": the wrong estimate with g = 9.81 m/s² all the way up (unrounded 190 μs)'
    inputs: {g: 9.81 m/s**2, h: 2.02e7 m, c: 3.00e8 m/s, day: 86400 s}
    formula: g * h / c**2 * day
    expected: 190e-6 s
    tolerance: '1%'
    shown: ['you would get about $190$ microseconds, four times too much']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: gps-uniform-ratio
    where: 'step "Per day": four times too much'
    inputs: {g: 9.81 m/s**2, h: 2.02e7 m, GM: 3.986e14 m**3/s**2, R: 6.371e6 m, r: 2.6571e7 m}
    formula: (g * h) / (GM * (1 / R - 1 / r))
    expected: '4'
    tolerance: '5%'
    shown: ['four times too much']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: gps-speed-day
    where: 'step "Together with the speed effect": the speed effect from lesson 8.2, here as v²/(2c²) with v = √(GM/r) (unrounded 7.2 μs)'
    inputs: {GM: 3.986e14 m**3/s**2, c: 3.00e8 m/s, r: 2.6571e7 m, day: 86400 s}
    formula: GM / r / (2 * c**2) * day
    expected: 7.2e-6 s
    tolerance: '1%'
    shown: ['makes its clock lose about $7$ microseconds a day', 'lose about $7$ μs from speed']
    source: {cite: gps, at: 'slide 27'}
    origin: page-own

  - id: gps-net
    where: 'step "Together with the speed effect": 46 − 7 = 39'
    inputs: {}
    formula: 46 - 7
    expected: '39'
    shown: ['The net gain is $46 - 7 = 39$ microseconds a day']
    source: {cite: gps, at: 'slide 27'}
    origin: page-own

  - id: gps-net-fact
    kind: fact
    where: 'step "Together with the speed effect": the presentation''s net gain'
    value: 38e-6 s
    shown: ['gives about $38$ microseconds a day']
    source: {cite: gps, at: 'slide 27'}
    origin: later-data

  - id: gps-range-error
    where: 'step "Together with the speed effect": 38 μs times c, about 11 km'
    inputs: {t: 38e-6 s, c: 3.00e8 m/s}
    formula: c * t
    expected: 11 km
    tolerance: '5%'
    shown: ['would move your position by about $11\ \text{km}$ a day']
    source: {cite: gps, at: 'slide 27'}
    origin: page-own

  - id: plot-coefficient
    where: 'plot: 382.66 = 86 400 s × 10⁶ μs/s × (GM/c²) / 10⁶ m per 1000 km, so that h is in thousands of km and the result in μs per day'
    inputs: {GM: 3.986e14, c: 3.00e8}
    formula: 86400 * 1e6 * GM / c**2 / 1e6
    expected: '382.66'
    tolerance: '0.01%'
    shown: ['{ expr: "382.66*(1/6.371 - 1/(6.371 + h))", label: "gravity" }']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: plot-speed-coefficient
    where: 'plot: the speed curve v²/(2c²) per day with v² = GM/r, half the gravity coefficient'
    inputs: {GM: 3.986e14, c: 3.00e8}
    formula: 86400 * 1e6 * GM / c**2 / 1e6 / 2
    expected: '191.33'
    tolerance: '0.01%'
    shown: ['{ expr: "-191.33/(6.371 + h)", label: "speed", dash: true }']
    source: {cite: gps, at: 'slide 27'}
    origin: page-own

  - id: plot-gps-point
    where: 'plot: the GPS point, net gain at 20 200 km (unrounded 38.46 μs per day)'
    inputs: {h: 20.2}
    formula: 382.66 * (1 / 6.371 - 1 / (6.371 + h)) - 191.33 / (6.371 + h)
    expected: '38.5'
    tolerance: '0.2%'
    shown: ['{ x: 20.2, y: 38.5, label: "GPS" }']
    source: {cite: gps, at: 'slide 27'}
    origin: page-own

  - id: crossover-height
    where: 'plot caption and quiz 3: the net effect is zero where 1/R − 1/r = 1/(2r), so r = 1.5R and h = R/2 (3186 km)'
    inputs: {R: 6371 km}
    formula: R / 2
    expected: 3200 km
    tolerance: '1%'
    shown: ['Below about 3200 km the speed effect wins', 'below about half an Earth radius (3200 km) the speed effect is larger']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: quiz-200m
    quiz: 1
    where: 'quiz 1: a clock 200 m higher'
    inputs: {g: 9.81 m/s**2, h: 200 m, c: 3.00e8 m/s}
    formula: g * h / c**2
    expected: '2.2e-14'
    tolerance: '1%'
    shown: ['$gh/c^2 = 9.81 \\times 200/(3.00 \\times 10^8)^2 = 2.2 \\times 10^{-14}$']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: quiz-200m-distractor
    where: 'quiz 1: the distractor gh/c (divided by c once)'
    inputs: {g: 9.81, h: 200, c: 3.00e8}
    formula: g * h / c
    expected: '6.5e-6'
    tolerance: '1%'
    shown: ['The choice $6.5 \\times 10^{-6}$ divides by $c$ only once']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: quiz-iss
    where: 'quiz 3: net effect for a clock 400 km up (unrounded −24.7 μs per day)'
    inputs: {GM: 3.986e14 m**3/s**2, c: 3.00e8 m/s, R: 6.371e6 m, r: 6.771e6 m, day: 86400 s}
    formula: -(GM / c**2 * (1 / R - 1 / r) - GM / (2 * r * c**2)) * day
    expected: 25e-6 s
    tolerance: '2%'
    shown: ['make the station''s clock lose about $25$ microseconds a day']
    source: {cite: mit, at: 'slide 30'}
    origin: page-own

  - id: flashcard-per-metre
    where: 'flashcard: g/c² per metre of height'
    inputs: {g: 9.81, c: 3.00e8}
    formula: g / c**2
    expected: '1.1e-16'
    tolerance: '1%'
    shown: ['about $1.1 \\times 10^{-16}$ per metre']
    source: {cite: mit, at: 'slides 21–22'}
    origin: page-own

  - id: ligo-masses
    kind: fact
    where: 'section "Ripples in spacetime" and quiz 4: the two black holes'
    value: '36'
    shown: ['two black holes of about 29 and 36 times the mass of the Sun', 'of about 29 and 36 solar masses, that']
    source: {cite: ligo, at: 'masses'}
    origin: later-data

  - id: ligo-time
    kind: fact
    where: 'section "Ripples in spacetime" and quiz 4: merged about 1.3 billion years earlier'
    value: 1.3e9 year
    shown: ['merged about 1.3 billion years earlier', 'merged about 1.3 billion years ago.']
    source: {cite: ligo, at: 'detection'}
    origin: later-data

  - id: ligo-arms
    kind: fact
    where: 'section "Ripples in spacetime": arm length'
    value: 4 km
    shown: ['The 4-km arms of the detectors']
    source: {cite: ligo, at: 'detectors'}
    origin: later-data
