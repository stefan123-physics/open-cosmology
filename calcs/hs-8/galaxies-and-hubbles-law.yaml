  - id: from-P-Q
    where: 'worked example "Hubble''s law from another galaxy", step "Galaxy Q": seen from P, Q is 30 Mpc away at 2100 km/s = 70 × 30'
    kind: identity
    formula: (H * dq - H * dp) / (dq - dp)
    equals: H
    samples: {H: [70, 70, 70], dq: [50, 0, -30], dp: [20, 20, 20]}
    tolerance: 1e-12
    shown: ['velocity $3500 - 1400 = 2100\ \text{km/s}$, moving away. And $70 \times 30 = 2100$: Hubble''s law.']
    source: {cite: reading2, at: 'pp. 16–17'}
    origin: mit

