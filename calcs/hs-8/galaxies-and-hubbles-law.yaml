  - id: sun-orbit-length
    where: 'worked example "How fast does the Sun go round", step "The length of one orbit"'
    inputs: {r: 25000 light_year, ly: 9.46e15 m}
    formula: 2 * pi * (r / light_year) * ly
    expected: 1.49e21 m
    tolerance: '0.5%'
    shown: ['2\pi \times 25\,000 \times 9.46 \times 10^{15}\ \text{m} = 1.49 \times 10^{21}\ \text{m}$']
    source: {cite: nasaGalaxies, at: 'The Milky Way'}
    origin: page-own

  - id: sun-orbit-time
    where: 'worked example "How fast does the Sun go round", step "The time"'
    inputs: {T: 240e6, yr: 3.16e7 s}
    formula: T * yr
    expected: 7.6e15 s
    tolerance: '0.5%'
    shown: ['$240 \times 10^{6} \times 3.16 \times 10^{7}\ \text{s} = 7.6 \times 10^{15}\ \text{s}$']
    source: {cite: nasaGalaxies, at: 'The Milky Way'}
    origin: page-own

  - id: sun-orbit-speed
    where: 'worked example "How fast does the Sun go round", step "The speed"; also the Summary and section "On average"'
    inputs: {r: 25000 light_year, ly: 9.46e15 m, T: 240e6, yr: 3.16e7 s}
    formula: 2 * pi * (r / light_year) * ly / (T * yr)
    expected: 2.0e5 m/s
    tolerance: '3%'
    shown: ['= 2.0 \times 10^{5}\ \text{m/s}$, about $200\ \text{km/s}$', 'its centre at about $200\ \text{km/s}$', 'The Sun goes round the galaxy at about $200\ \text{km/s}$']
    source: {cite: nasaGalaxies, at: 'The Milky Way'}
    origin: page-own

