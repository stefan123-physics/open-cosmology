  - id: sun-radius-estimate
    where: 'worked example "How fast does the Sun go round": halfway out in a disk 100 000 ly across'
    inputs: {D: 100000 light_year}
    formula: D / 2 / 2
    expected: 25000 light_year
    shown: ['roughly $25\,000$ light-years from the centre']
    source: {cite: nasaGalaxies, at: 'The Milky Way (about halfway from the centre)'}
