# Calculations on content/year-0/hs-8/cosmic-distances.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6-8: c = 3.00e8 m/s, light-year 9.46e15 m. 1 AU = 1.496e11 m (NASA glossary: 149 597 870.7 km).
# 1 arcsec = pi/(180*3600) rad = 4.848e-6 rad; 1 pc = 3.086e16 m = 3.26 ly. Sun's luminosity 3.828e26 W (as lesson 8.5).

page: content/year-0/hs-8/cosmic-distances.mdx
calcs:
  - id: radar-venus-distance
    where: 'worked example "An echo from Venus": d = ct/2 for an echo after 276 s'
    inputs: {c: 3.00e8 m/s, t: 276 s}
    formula: c * t / 2
    expected: 4.14e10 m
    shown: ['$d = c\,t/2 = 3.00 \times 10^{8} \times 276/2 = 4.14 \times 10^{10}\ \text{m}$', 'about 41 million kilometres']
    source: {cite: radar, at: 'radar signals sent to Venus and back, 1961'}
    origin: page-own

  - id: radar-venus-minutes
    where: 'worked example "An echo from Venus": 276 s is 4.6 minutes'
    inputs: {t: 276 s}
    formula: t
    expected: 4.6 minute
    shown: ['comes back after $276\ \text{s}$ (4.6 minutes)']
    source: {cite: radar, at: 'radar signals sent to Venus and back, 1961'}
    origin: page-own

  - id: au-value
    kind: fact
    where: 'section "Radar in the Solar System" and summary: 1 AU = 1.496 × 10¹¹ m (149 597 870.7 km)'
    value: 1.496e11 m
    shown: ['$1\ \text{AU} = 1.496 \times 10^{11}\ \text{m}$ (149 597 870.7 km)']
    source: {cite: reading2, at: 'entry Astronomical unit: 149 597 870.7 km'}
    origin: later-data

  - id: arcsec-in-rad
    where: 'formula "One arcsecond in radians": π/(180 × 3600)'
    inputs: {}
    formula: pi / (180 * 3600)
    expected: 4.848e-6
    shown: ['\frac{\pi}{180 \times 3600}\ \text{rad} = 4.848 \times 10^{-6}\ \text{rad}']
    source: {cite: reading2, at: 'entry Parsec (1 arcsecond)'}
    origin: page-own

  - id: coin-distance
    where: 'section "Parallax": a 2 cm coin fills one arcsecond at about 4 km'
    inputs: {s: 0.02 m}
    formula: s / (pi / (180 * 3600))
    expected: 4 km
    tolerance: '5%'
    shown: ['a 2 cm coin seen from 4 kilometres away']
    source: {cite: reading2, at: 'entry Parsec (1 arcsecond)'}
    origin: page-own

  - id: parsec-in-m
    where: 'formula "The parsec": 1 AU divided by one arcsecond in radians'
    inputs: {AU: 1.496e11 m}
    formula: AU / 4.848e-6
    expected: 3.086e16 m
    shown: ['\frac{1.496 \times 10^{11}\ \text{m}}{4.848 \times 10^{-6}} = 3.086 \times 10^{16}\ \text{m}', 'one parsec is about $3.09 \times 10^{16}\ \text{m}$', 'one parsec is $3.09 \times 10^{16}\ \text{m}$', 'One parsec is $3.09 \\times 10^{16}\\ \\text{m}$', 'one parsec is 3.09 × 10¹⁶ m']
    source: {cite: mit, at: 'p. 8 (board)'}
    origin: page-own

  - id: parsec-in-ly
    where: 'section "The parsec", flashcard 0, summary: 1 pc in light-years'
    inputs: {pc: 3.086e16 m, ly: 9.46e15 m}
    formula: pc / ly
    expected: 3.26
    shown: ['$3.086 \times 10^{16}/9.46 \times 10^{15} = 3.26$ light-years', 'about 3.26 light-years.', ', or 3.26 light-years.', '10¹⁶ m or 3.26 light-years']
    source: {cite: mit, at: 'p. 8 (board): one parsec equals 3.2616 light years'}
    origin: page-own

  - id: guth-parsec
    kind: fact
    where: 'section "The parsec": Guth gives 3.2616 light-years'
    value: 3.2616
    shown: ["Guth's lecture gives 3.2616 light-years"]
    source: {cite: mit, at: 'p. 8'}
    origin: mit

  - id: example-pc
    where: 'worked example "A star with a parallax of 0.125 arcseconds", step "Parsecs"'
    inputs: {p: 0.125}
    formula: 1 / p
    expected: 8.0
    shown: ['$d = 1/p = 1/0.125 = 8.0\ \text{pc}$']
    source: {cite: reading2, at: 'entry Parsec'}
    origin: page-own

  - id: example-m
    where: 'worked example, step "Metres": 8.0 pc in metres'
    inputs: {d: 8.0, pc: 3.09e16 m}
    formula: d * pc
    expected: 2.47e17 m
    shown: ['$d = 8.0 \times 3.09 \times 10^{16} = 2.47 \times 10^{17}\ \text{m}$']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: example-ly
    where: 'worked example, step "Light-years"'
    inputs: {d: 2.47e17 m, ly: 9.46e15 m}
    formula: d / ly
    expected: 26.1
    shown: ['$d = 2.47 \times 10^{17}/9.46 \times 10^{15} = 26.1$ light-years', 'left the star 26 years ago']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: hubble-cepheid-distance
    kind: fact
    where: 'section "The parsec" and worked example "How small is that angle?": Cepheids about 7500 light-years away (Hubble, 2014)'
    value: 7500 light_year
    shown: ['measured the parallax of Cepheid stars about 7500 light-years away', 'What parallax does a star 7500 light-years away have?']
    source: {cite: tape, at: 'Cepheids about 7500 light-years away in Auriga'}
    origin: later-data

  - id: cepheid-7500-pc
    where: 'worked example "How small is that angle?", step "Distance in parsecs"'
    inputs: {d: 7500, k: 3.26}
    formula: d / k
    expected: 2300
    shown: ['$d = 7500/3.26 = 2300\ \text{pc}$']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: cepheid-7500-parallax
    where: 'worked example "How small is that angle?", step "Parallax"'
    inputs: {d: 2300}
    formula: 1 / d
    expected: 4.3e-4
    shown: ['$p = 1/d = 1/2300 = 4.3 \times 10^{-4}$ arcseconds: less than a two-thousandth of an arcsecond']
    source: {cite: reading2, at: 'entry Parsec'}
    origin: page-own

  - id: plot-equal-flux
    kind: identity
    where: 'plot caption: a candle 4 times as luminous at 2 pc gives the same flux as candle A at 1 pc'
    formula: L / d**2
    equals: 1 / (d / 2)**2
    samples: {L: [4.0, 4.0], d: [2.0, 3.0]}
    tolerance: 1e-12
    shown: ['With L = 4 it looks exactly as bright at 2 pc as A does at 1 pc']
    source: {cite: reading1, at: 'eq. (4), p. 4'}
    origin: page-own

  - id: cepheid-galaxy-pc
    where: 'worked example "Two Cepheids with the same period": d₂ = d₁√(F₁/F₂)'
    inputs: {d1: 2000, ratio: 1.0e6}
    formula: d1 * sqrt(ratio)
    expected: 2.0e6
    shown: ['$d_2 = d_1\sqrt{F_1/F_2} = 2000 \times \sqrt{10^{6}} = 2000 \times 1000 = 2.0 \times 10^{6}\ \text{pc}$', 'That is $2.0\ \text{Mpc}$']
    source: {cite: reading1, at: 'eq. (4), p. 4'}
    origin: page-own

  - id: cepheid-galaxy-ly
    where: 'worked example "Two Cepheids with the same period", step "In other units"'
    inputs: {d: 2.0e6, k: 3.26}
    formula: d * k
    expected: 6.5e6
    shown: ['$2.0 \times 10^{6} \times 3.26 = 6.5$ million light-years']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: sun-luminosity
    kind: fact
    where: 'worked example "A supernova in a faraway galaxy": the Sun radiates 3.828 × 10²⁶ W (as in lessons 7.6 and 8.5)'
    value: 3.828e26 W
    shown: ['the Sun''s $3.828 \times 10^{26}\ \text{W}$']
    source: {cite: reading2, at: 'entry Bolometric luminosity (3.83 × 10²⁶ W)'}
    origin: later-data

  - id: sn-in-suns
    where: 'worked example "A supernova in a faraway galaxy": 1.0 × 10³⁶ W in Suns'
    inputs: {L: 1.0e36 W, Ls: 3.828e26 W}
    formula: L / Ls
    expected: 2.6e9
    shown: ['about 2.6 billion times the Sun']
    source: {cite: reading2, at: 'entry Bolometric luminosity'}
    origin: page-own

  - id: sn-d-squared
    where: 'worked example, step "Use the inverse square law": L/(4πF)'
    inputs: {L: 1.0e36 W, F: 2.0e-15 W/m**2}
    formula: L / (4 * pi * F)
    expected: 4.0e49 m**2
    shown: ['= \sqrt{4.0 \times 10^{49}}']
    source: {cite: reading1, at: 'p. 8, eq. (15)'}
    origin: page-own

  - id: sn-distance-m
    where: 'worked example, step "Use the inverse square law": d = √(L/4πF)'
    inputs: {L: 1.0e36 W, F: 2.0e-15 W/m**2}
    formula: sqrt(L / (4 * pi * F))
    expected: 6.3e24 m
    shown: ['= 6.3 \times 10^{24}\ \text{m}$']
    source: {cite: reading1, at: 'p. 8, eq. (15)'}
    origin: page-own

  - id: sn-distance-mpc
    where: 'worked example, step "In megaparsecs and light-years": 6.3 × 10²⁴ m in Mpc'
    inputs: {d: 6.3e24 m, mpc: 3.09e22 m}
    formula: d / mpc
    expected: 204
    tolerance: '1%'
    shown: ['$6.3 \times 10^{24}/3.09 \times 10^{22} = 204\ \text{Mpc}$']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: sn-distance-ly
    where: 'worked example, step "In megaparsecs and light-years": 6.3 × 10²⁴ m in light-years'
    inputs: {d: 6.3e24 m, ly: 9.46e15 m}
    formula: d / ly
    expected: 6.7e8
    shown: ['$6.3 \times 10^{24}/9.46 \times 10^{15} = 6.7 \times 10^{8}$ light-years', 'about 670 million years ago']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: quiz-parallax
    where: 'quiz 0: a parallax of 0.050 arcseconds'
    inputs: {p: 0.050}
    formula: 1 / p
    expected: 20
    shown: ['$d = 1/p = 1/0.050 = 20\\ \\text{pc}$']
    quiz: 0
    source: {cite: reading2, at: 'entry Parsec'}
    origin: page-own

  - id: quiz-parallax-ly
    where: 'quiz 0 explanation: 20 pc in light-years'
    inputs: {d: 20, k: 3.26}
    formula: d * k
    expected: 65
    shown: ['about 65 light-years']
    source: {cite: mit, at: 'p. 8'}
    origin: page-own

  - id: quiz-five-times
    where: 'quiz 1: five times the distance gives 1/25 of the flux'
    inputs: {n: 5}
    formula: 1 / n**2
    expected: 0.04
    shown: ['$1/5^2 = 1/25$']
    source: {cite: reading1, at: 'eq. (4), p. 4'}
    origin: page-own

  - id: quiz-cepheid-ratio
    where: 'quiz 2: flux ratio 100 gives a distance ratio of 10'
    inputs: {r: 100}
    formula: sqrt(r)
    expected: 10
    shown: ['$d_2/d_1 = \\sqrt{F_1/F_2} = \\sqrt{100} = 10$']
    source: {cite: reading1, at: 'eq. (4), p. 4'}
    origin: page-own

  - id: leavitt-year
    kind: fact
    where: 'section "Cepheid variables", flashcard 2 and summary: Leavitt, 1912'
    value: 1912
    shown: ['In 1912 Henrietta Leavitt', 'Henrietta Leavitt found the relation in 1912', 'their luminosity (Leavitt, 1912); they reach']
    source: {cite: reading2, at: 'entry Cepheid variable'}
    origin: later-data
