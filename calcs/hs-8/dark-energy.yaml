    source: {cite: reading3, at: 'p. 64'}
    origin: mit

  - id: density-ratio-identity
    kind: identity
    where: 'formula "Matter compared with vacuum energy": (Ω_m ρ₀/a³)/(Ω_vac ρ₀) = (Ω_m/Ω_vac)/a³'
    formula: (Om * rho0 / a**3) / (Ov * rho0)
    equals: (Om / Ov) / a**3
    samples: {Om: [0.3, 0.315, 0.24], Ov: [0.7, 0.6847, 0.76], rho0: [8.5e-27, 9.0e-27, 1.0], a: [0.5, 1.0, 2.0]}
    tolerance: 1e-12
    shown: ['\frac{\rho_m}{\rho_\text{vac}} = \frac{\Omega_m}{\Omega_\text{vac}} \cdot \frac{1}{a^3}']
    source: {cite: reading3, at: 'eqs. (298)–(299), p. 68'}
    origin: mit

  - id: acceleration-identity
    kind: identity
    where: 'formula "Acceleration of the expansion": Guth''s board equation with zero matter pressure and p_vac = −ρ_vac c², collected'
    formula: -(4 * pi / 3) * G * (rhom + 3 * 0) - (4 * pi / 3) * G * (rhov + 3 * (-rhov))
    equals: -(4 * pi * G / 3) * (rhom - 2 * rhov)
    samples: {G: [6.67e-11, 6.67e-11, 1.0], rhom: [2.6e-27, 1.0e-26, 3.0], rhov: [6.0e-27, 1.0e-27, 1.0]}
    tolerance: 1e-9
    shown: ['\frac{\ddot a}{a} = -\frac{4\pi G}{3}\left(\rho_m - 2\rho_\text{vac}\right)']
    source: {cite: reading1, at: 'p. 21 (board)'}
    origin: mit

