  - id: we-distance-factor
    where: 'worked example "How much farther is a fainter supernova?", step "Flux and distance"'
    inputs: {f: 0.75}
    formula: 1 / sqrt(f)
    expected: 1.155
    tolerance: '0.05%'
    shown: ['$1/\sqrt{0.75} = 1.155$ times the prediction']
    source: {cite: reading2, at: 'pp. 8–9'}
    origin: page-own

  - id: we-distance
    where: 'worked example "How much farther is a fainter supernova?", step "The distance"'
    inputs: {d0: 2000 Mpc, f: 0.75}
    formula: d0 / sqrt(f)
    expected: 2310 Mpc
    tolerance: '0.1%'
    shown: ['$d = 2000\ \text{Mpc} \times 1.155 = 2310\ \text{Mpc}$: about 15% farther']
    source: {cite: reading2, at: 'pp. 8–9'}
    origin: page-own

  - id: we-check
    where: 'worked example "How much farther is a fainter supernova?", step "Check"'
    inputs: {a: 2000, b: 2310}
