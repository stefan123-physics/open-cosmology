# Calculations on content/year-0/hs-8/particles-and-forces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6-8: c = 3.00e8 m/s, 1 eV = 1.6e-19 J, h = 6.63e-34 J s, k_B = 1.38e-23 J/K.
# Particle values from the Particle Data Group 2024 summary tables (CC BY 4.0).

page: content/year-0/hs-8/particles-and-forces.mdx
calcs:
  - id: proton-charge
    where: 'section "The building blocks", formula "Charge of a proton from its quarks": up + up + down, in units of e'
    inputs: {qu: 0.6666667, qd: -0.3333333}
    formula: 2 * qu + qd
    expected: 1
    tolerance: '0.001%'
    shown: ['tex="\tfrac23 e + \tfrac23 e + \left(-\tfrac13 e\right) = +e"']
    source: {cite: pdgq, at: 'quark summary: charges of u and d; N baryons: p = uud'}
    origin: page-own

  - id: neutron-charge
    where: 'section "The building blocks" and quiz 0 explanation: up + down + down, in units of e'
    inputs: {qu: 0.6666667, qd: -0.3333333}
    formula: qu + 2 * qd
    expected: 0.000
    shown: ['$\tfrac23 e - \tfrac13 e - \tfrac13 e = 0$', '$\\tfrac23 e - \\tfrac13 e - \\tfrac13 e = 0$']
    source: {cite: pdgq, at: 'quark summary: charges of u and d; N baryons: n = udd'}
    origin: page-own

  - id: beta-quark-charge
    where: 'section "The building blocks": charge after a down quark turns into up quark + electron + antineutrino, in units of e'
    inputs: {qu: 0.6666667}
    formula: qu - 1 + 0
    expected: -0.3333
    shown: ['$+\tfrac23 e - e + 0 = -\tfrac13 e$']
    source: {cite: pdgq, at: 'quark summary: charges of u and d'}
    origin: page-own

  - id: electron-rest-energy
    kind: fact
    where: 'worked example "The light of annihilation", flashcard and summary: 0.511 MeV per photon (NASA: 511 000 eV; lesson 8.3: 0.511 MeV)'
    value: 0.511 MeV
    shown: ['tex="E = m_e c^2 = 0.511\ \text{MeV}"', 'exactly this $511\ 000\ \text{eV}$ signal', 'two gamma-ray photons of $0.511\\ \\text{MeV}$ each', 'two gamma-ray photons of $0.511\ \text{MeV}$ each']
    source: {cite: nasaFermi, at: 'gamma rays of 511 000 electronvolts'}
    origin: later-data

  - id: annihilation-total
    where: 'worked example "The light of annihilation", step "Energy of each photon": total rest energy of electron and positron'
    inputs: {E0: 0.511 MeV}
    formula: 2 * E0
    expected: 1.022 MeV
    shown: ['The total rest energy is $2 \times 0.511 = 1.022\ \text{MeV}$']
    source: {cite: nasaFermi, at: '511 000 eV per photon'}
    origin: page-own

  - id: pair-threshold
    where: 'section "Antimatter": least photon energy for pair creation, and summary'
    inputs: {E0: 0.511 MeV}
    formula: 2 * E0
    expected: 1.022 MeV
    shown: ['at least the two rest energies, $2 \times 0.511 = 1.022\ \text{MeV}$', 'A photon with at least $1.022\ \text{MeV}$ can create']
    source: {cite: reading1, at: 'slide 2'}
    origin: page-own

  - id: photon-energy-J
    where: 'worked example "The light of annihilation": 0.511 MeV in joules'
    inputs: {E0: 0.511e6, eV: 1.6e-19 J}
    formula: E0 * eV
    expected: 8.18e-14 J
    shown: ['$E = 0.511 \times 1.6 \times 10^{-13} = 8.18 \times 10^{-14}\ \text{J}$']
    source: {cite: nasaFermi, at: '511 000 eV'}
    origin: page-own

  - id: photon-wavelength
    where: 'worked example "The light of annihilation", step "Wavelength": λ = hc/E'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 8.18e-14 J}
    formula: h * c / E
    expected: 2.43e-12 m
    shown: ['$\lambda = hc/E = 6.63 \times 10^{-34} \times 3.00 \times 10^{8}/(8.18 \times 10^{-14}) = 2.43 \times 10^{-12}\ \text{m}$']
    source: {cite: nasaFermi, at: 'gamma rays'}
    origin: page-own

  - id: alpha-em
    kind: fact
    where: 'table of the four forces: electromagnetic strength about 1/137 (fine-structure constant, PDG)'
    value: 0.0072973525693
    shown: ['about $1/137 \approx 10^{-2}$', 'the value $1/137$ for electromagnetism']
    source: {cite: pdgc, at: 'fine-structure constant'}
    origin: later-data

  - id: weak-strength
    where: 'table of the four forces: weak strength, Fermi constant times the square of the proton rest energy'
    inputs: {GF: 1.1663788e-5 1/GeV**2, Ep: 0.938272 GeV}
    formula: GF * Ep**2
    expected: 1e-5
    tolerance: '5%'
    shown: ['| about $10^{-5}$ |', '$10^{-5}$ and $6 \times 10^{-39}$']
    source: {cite: pdgc, at: 'Fermi coupling constant'}
    origin: page-own

  - id: em-gravity-ratio
    where: 'section "Four forces": electric force over gravity for two protons, from lesson 6.13'
    inputs: {k: 9.0e9 N*m**2/C**2, e: 1.6e-19 C, G: 6.67e-11 N*m**2/kg**2, mp: 1.67e-27 kg}
    formula: k * e**2 / (G * mp**2)
    expected: 1.24e36
    shown: ['it is $1.24 \times 10^{36}$ times weaker than the electric force']
    source: {cite: pdgc, at: 'fine-structure constant (the ratio itself is from lesson 6.13)'}
    origin: page-own

  - id: gravity-strength
    where: 'section "Four forces": gravity strength (1/137)/(1.24 × 10³⁶)'
    inputs: {R: 1.24e36}
    formula: (1 / 137) / R
    expected: 5.9e-39
    shown: ['$(1/137)/(1.24 \times 10^{36}) = 5.9 \times 10^{-39}$']
    source: {cite: pdgc, at: 'fine-structure constant'}
    origin: page-own

  - id: gravity-strength-rounded
    where: 'table of the four forces and summary: gravity about 6 × 10⁻³⁹'
    inputs: {R: 1.24e36}
    formula: (1 / 137) / R
    expected: 6e-39
    shown: ['| about $6 \times 10^{-39}$ |', '$10^{-5}$ and $6 \times 10^{-39}$']
    source: {cite: pdgc, at: 'fine-structure constant'}
    origin: page-own

  - id: w-mass
    kind: fact
    where: 'carrier table, worked example "How far does the weak force reach?", Plot and caption: W rest energy (PDG 80.3692 GeV)'
    value: 80.4 GeV
    shown: ['$80.4\ \text{GeV}$ (W)', 'The W boson has a rest energy of $80.4\ \text{GeV}$ (PDG)', 'The W boson, at 80.4 GeV', 'x: 80.4']
    source: {cite: pdgb, at: 'W mass'}
    origin: later-data

  - id: z-mass
    kind: fact
    where: 'carrier table and quiz 2: Z rest energy (PDG 91.1880 GeV)'
    value: 91.2 GeV
    shown: ['$91.2\ \text{GeV}$ (Z)', 'the Z, at 91.2 GeV', 'has a rest energy of $91.2\\ \\text{GeV}$']
    source: {cite: pdgb, at: 'Z mass'}
    origin: later-data

  - id: w-over-proton
    where: 'section "Forces as exchanged particles": a W boson is about 86 times heavier than a proton'
    inputs: {EW: 80.4 GeV, Ep: 938 MeV}
    formula: EW / Ep
    expected: 86
    shown: ['a W boson is about 86 times heavier than a proton (938 MeV)']
    source: {cite: pdgb, at: 'W mass; proton mass from the N baryon table'}
    origin: page-own

  - id: z-over-proton
    where: 'quiz 4 explanation: the W and Z are each nearly a hundred times heavier than a proton (86 and 97)'
    inputs: {EZ: 91.2 GeV, Ep: 938 MeV}
    formula: EZ / Ep
    expected: 100
    tolerance: '15%'
    shown: ['are each nearly a hundred times heavier than a proton']
    source: {cite: pdgb, at: 'Z mass'}
    origin: page-own

  - id: w-rest-J
    where: 'worked example "How far does the weak force reach?", step "Rest energy in joules"'
    inputs: {E: 80.4e9, eV: 1.6e-19 J}
    formula: E * eV
    expected: 1.29e-8 J
    shown: ['$mc^2 = 80.4 \times 10^{9} \times 1.6 \times 10^{-19} = 1.29 \times 10^{-8}\ \text{J}$']
    source: {cite: pdgb, at: 'W mass'}
    origin: page-own

  - id: w-range
    where: 'worked example "How far does the weak force reach?", step "Range", Plot caption and summary: r ≈ hc/(2πmc²)'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 1.2864e-8 J}
    formula: h * c / (2 * pi * E)
    expected: 2.5e-18 m
    shown: ['$r \approx hc/(2\pi mc^2) = 6.63 \times 10^{-34} \times 3.00 \times 10^{8}/(2\pi \times 1.29 \times 10^{-8}) = 2.5 \times 10^{-18}\ \text{m}$', 'gives about 2.5 × 10⁻¹⁸ m', 'the W gives about $2.5 \times 10^{-18}\ \text{m}$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: w-range-plot-point
    where: 'Plot point W: range in units of 10⁻¹⁸ m'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 1.2864e-8 J, unit: 1e-18 m}
    formula: h * c / (2 * pi * E) / unit
    expected: 2.46
    shown: ['y: 2.46']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: weak-range-mit
    kind: fact
    where: 'worked example and force table: the range of the weak force, about 10⁻¹⁸ m (MIT 8.701 Lecture 1.3)'
    value: 1e-18 m
    shown: ['the range of about $10^{-18}\ \text{m}$ given in MIT', '| about $10^{-18}\ \text{m}$ |']
    source: {cite: reading2, at: 'p. 1'}
    origin: later-data

  - id: range-vs-proton
    where: 'worked example, step "Compared with a proton": 10⁻¹⁵ m over the W range'
    inputs: {R: 1e-15 m, r: 2.46e-18 m}
    formula: R / r
    expected: 400
    tolerance: '5%'
    shown: ['$10^{-15}/(2.5 \times 10^{-18}) \approx 400$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: range-vs-proton-percent
    where: 'worked example, step "Compared with a proton": about a quarter of a percent (in percent)'
    inputs: {R: 1e-15 m, r: 2.46e-18 m}
    formula: 100 * r / R
    expected: 0.25
    tolerance: '5%'
    shown: ['about a quarter of a percent of the way across a proton']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: quiz-z-rest-J
    where: 'quiz 2 explanation: Z rest energy in joules'
    inputs: {E: 91.2e9, eV: 1.6e-19 J}
    formula: E * eV
    expected: 1.46e-8 J
    shown: ['$mc^2 = 91.2 \\times 10^{9} \\times 1.6 \\times 10^{-19} = 1.46 \\times 10^{-8}\\ \\text{J}$']
    source: {cite: pdgb, at: 'Z mass'}
    origin: page-own

  - id: quiz-z-range
    where: 'quiz 2: range of a force carried by the Z'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 1.4592e-8 J}
    formula: h * c / (2 * pi * E)
    expected: 2.2e-18 m
    shown: ['$r \\approx hc/(2\\pi mc^2) = 6.63 \\times 10^{-34} \\times 3.00 \\times 10^{8}/(2\\pi \\times 1.46 \\times 10^{-8}) = 2.2 \\times 10^{-18}\\ \\text{m}$']
    quiz: 2
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: quiz2-wrong-no-2pi
    where: 'quiz 2, distractor: the 2π forgotten'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 1.4592e-8 J}
    formula: h * c / E
    expected: 1.4e-17 m
    shown: ['$1.4 \\times 10^{-17}\\ \\text{m}$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: quiz2-wrong-thousand
    where: 'quiz 2, distractor: a factor of 1000 too large'
    inputs: {h: 6.63e-34 J*s, c: 3.00e8 m/s, E: 1.4592e-8 J}
    formula: 1000 * h * c / (2 * pi * E)
    expected: 2.2e-15 m
    shown: ['$2.2 \\times 10^{-15}\\ \\text{m}$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: quiz-annihilation
    where: 'quiz 1: 1.0 mg of antihydrogen and 1.0 mg of hydrogen annihilate'
    inputs: {m: 2.0e-6 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 1.8e11 J
    shown: ['$E = mc^2 = 2.0 \\times 10^{-6} \\times (3.00 \\times 10^{8})^2 = 1.8 \\times 10^{11}\\ \\text{J}$']
    quiz: 1
    source: {cite: nasaFermi, at: 'matter and antimatter are both destroyed'}
    origin: page-own

  - id: quiz1-wrong-antimatter-only
    where: 'quiz 1, distractor: only the antimatter counted'
    inputs: {m: 1.0e-6 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 9.0e10 J
    shown: ['$9.0 \\times 10^{10}\\ \\text{J}$']
    source: {cite: nasaFermi, at: 'annihilation'}
    origin: page-own

  - id: quiz1-wrong-no-square
    where: 'quiz 1, distractor: c not squared'
    inputs: {m: 2.0e-6, c: 3.00e8}
    formula: m * c
    expected: 6.0e2
    shown: ['$6.0 \\times 10^{2}\\ \\text{J}$']
    source: {cite: nasaFermi, at: 'annihilation'}
    origin: page-own

  - id: quiz1-wrong-kg
    where: 'quiz 1, distractor: 2.0 kg instead of 2.0 mg'
    inputs: {m: 2.0 kg, c: 3.00e8 m/s}
    formula: m * c**2
    expected: 1.8e17 J
    shown: ['$1.8 \\times 10^{17}\\ \\text{J}$']
    source: {cite: nasaFermi, at: 'annihilation'}
    origin: page-own

  - id: higgs-mass
    kind: fact
    where: 'section "The Higgs boson", flashcard and summary: Higgs boson rest energy (PDG 125.20 GeV)'
    value: 125.20 GeV
    shown: ['today''s measured rest energy is $125\ \text{GeV}$ (PDG: 125.20 GeV)', 'its rest energy is about $125\\ \\text{GeV}$', 'the Higgs boson ($125\ \text{GeV}$)']
    source: {cite: pdgb, at: 'H mass'}
    origin: later-data

  - id: higgs-announcement
    kind: fact
    where: 'section "The Higgs boson": announcement of 4 July 2012 (US DOE Office of Science)'
    value: 2012
    shown: ['announced on 4 July 2012 by the ATLAS and CMS experiments']
    source: {cite: doeHiggs, at: 'announcement'}
    origin: later-data

  - id: quark-mass-sum
    where: 'section "The Higgs boson": rest energies of two up quarks and a down quark (PDG 2.16 and 4.70 MeV)'
    inputs: {mu: 2.16 MeV, md: 4.70 MeV}
    formula: 2 * mu + md
    expected: 9.0 MeV
    shown: ['$2 \times 2.16 + 4.70 = 9.0\ \text{MeV}$']
    source: {cite: pdgq, at: 'u and d quark masses'}
    origin: page-own

  - id: quark-mass-fraction
    where: 'section "The Higgs boson": quark masses as a percentage of the proton''s 938 MeV'
    inputs: {mu: 2.16 MeV, md: 4.70 MeV, Ep: 938 MeV}
    formula: 100 * (2 * mu + md) / Ep
    expected: 1
    tolerance: '10%'
    shown: ['about 1% of the proton''s $938\ \text{MeV}$']
    source: {cite: pdgq, at: 'u and d quark masses; proton mass'}
    origin: page-own

  - id: electroweak-scale
    kind: fact
    where: 'section "Forces that were once one", flashcard and summary: electroweak unification above about 100 GeV (8.286 Lecture 23: the strengths are measured near 100 GeV)'
    value: 100 GeV
    shown: ['at energies of about $100\ \text{GeV}$ and above', 'above about $100\\ \\text{GeV}$ electromagnetism', 'electroweak unification above about $100\ \text{GeV}$']
    source: {cite: reading4, at: 'p. 16'}
    origin: later-data

  - id: gut-scale
    kind: fact
    where: 'section "Forces that were once one": the three strengths meet near 10¹⁶ GeV'
    value: 1e16 GeV
    shown: ['tex="E_\text{GUT} \approx 10^{16}\ \text{GeV}"', 'the three meet at about $10^{16}\ \text{GeV}$']
    source: {cite: reading4, at: 'p. 16'}
    origin: later-data

  - id: ew-energy-J
    where: 'worked example "How hot for the forces to merge?", step "Electroweak": 100 GeV in joules'
    inputs: {E: 100e9, eV: 1.6e-19 J}
    formula: E * eV
    expected: 1.6e-8 J
    shown: ['$E = 100 \times 1.6 \times 10^{-10} = 1.6 \times 10^{-8}\ \text{J}$']
    source: {cite: reading4, at: 'p. 16'}
    origin: page-own

  - id: ew-temperature
    where: 'worked example "How hot for the forces to merge?", step "Electroweak": T = 2E/(3k_B)'
    inputs: {E: 1.6e-8 J, kB: 1.38e-23 J/K}
    formula: 2 * E / (3 * kB)
    expected: 7.7e14 K
    shown: ['$T = 2 \times 1.6 \times 10^{-8}/(3 \times 1.38 \times 10^{-23}) = 7.7 \times 10^{14}\ \text{K}$']
    source: {cite: reading4, at: 'p. 16'}
    origin: page-own

  - id: sun-core-temperature
    kind: fact
    where: 'worked example, step "Electroweak": temperature at the centre of the Sun (NASA Sun Fact Sheet, 1.571 × 10⁷ K)'
    value: 1.571e7 K
    shown: ['$1.57 \times 10^{7}\ \text{K}$, NASA Sun Fact Sheet']
    source: {cite: sunfact, at: 'Solar interior: central temperature'}
    origin: later-data

  - id: ew-vs-sun
    where: 'worked example, step "Electroweak": about fifty million times hotter than the centre of the Sun'
    inputs: {T: 7.73e14 K, Ts: 1.571e7 K}
    formula: T / Ts
    expected: 5e7
    tolerance: '5%'
    shown: ['about fifty million times hotter than the centre of the Sun']
    source: {cite: sunfact, at: 'Solar interior: central temperature'}
    origin: page-own

  - id: gut-energy-J
    where: 'worked example, step "Grand unification": 10¹⁶ GeV in joules'
    inputs: {E: 1e25, eV: 1.6e-19 J}
    formula: E * eV
    expected: 1.6e6 J
    shown: ['$E = 10^{16} \times 1.6 \times 10^{-10} = 1.6 \times 10^{6}\ \text{J}$']
    source: {cite: reading4, at: 'p. 16'}
    origin: page-own

  - id: gut-temperature
    where: 'worked example, step "Grand unification": T = 2E/(3k_B)'
    inputs: {E: 1.6e6 J, kB: 1.38e-23 J/K}
    formula: 2 * E / (3 * kB)
    expected: 7.7e28 K
    shown: ['$T = 2 \times 1.6 \times 10^{6}/(3 \times 1.38 \times 10^{-23}) = 7.7 \times 10^{28}\ \text{K}$']
    source: {cite: reading4, at: 'p. 16'}
    origin: page-own
