  - id: guth-factor-and-size
    kind: fact
    where: 'section "The idea of inflation": about 100 doublings, a growth of at least 10²⁸, to a marble about 1 cm across'
    value: 1e28
    shown: ['After about **100 doublings**, a growth of at least $10^{28}$ times', 'roughly 1 cm across']
    source: {cite: reading2, at: 'slide 5; about 1 cm: transcript p. 8'}
    origin: mit

  - id: guth-duration
    where: 'section "The idea of inflation": 100 doublings of 10⁻³⁷ s take about 10⁻³⁵ s (Guth''s own arithmetic)'
    inputs: {n: 100, td: 1e-37 s}
    formula: n * td
    expected: 1e-35 s
    shown: ['in about $10^{-35}\ \text{s}$']
    source: {cite: reading1, at: 'p. 8'}
    origin: mit

  - id: guth-doublings-check
    where: 'section "The idea of inflation": a factor of 10²⁸ is about 100 doublings (93 exactly; also the plot point "1 cm, a marble" at n = 93.0)'
    inputs: {}
    formula: 28 / log10(2)
    expected: '93.0'
    shown: ['{ x: 93.0, y: 0, label: "1 cm, a marble" }', 'reaches 1 cm after 93']
    source: {cite: reading1, at: 'p. 7 (about 100 doublings); the count is the page''s own'}
    origin: page-own

  - id: doublings-identity
    kind: identity
    where: 'formula "Number of doublings": n = log(L/L0)/log 2 undoes L = L0 × 2ⁿ'
    formula: L0 * 2**(log10(L / L0) / log10(2))
    equals: L
    samples: {L0: [1e-28, 1.0, 3.0], L: [1.0, 1e26, 48.0]}
    tolerance: 1e-9
    shown: ['tex="n = \log_{2}\frac{L}{L_0} = \frac{\log (L/L_0)}{\log 2}"', 'tex="L = L_0 \times 2^{n}"']
    source: {cite: reading1, at: 'pp. 7-8'}
    origin: page-own

  - id: log2
    where: 'worked example "Inflating by a factor of 10²⁶"; text before the plot; plot caption: log 2 = 0.301'
    inputs: {}
    formula: log10(2)
    expected: '0.301'
    shown: ['26/0.301', 'each doubling adds $\log 2 = 0.301$ to it', 'a straight line rising 0.301 per doubling']
    source: {cite: reading1, at: 'p. 7 (the logarithm is the page''s own, lesson 0.9)'}
    origin: page-own

  - id: we1-doublings
    where: 'worked example "Inflating by a factor of 10²⁶", step "Doublings"'
    inputs: {}
    formula: 26 / log10(2)
    expected: '86.4'
    shown: ['$n = \log 10^{26} / \log 2 = 26/0.301 = 86.4$']
    source: {cite: reading1, at: 'p. 7 (numbers are the page''s own)'}
    origin: page-own

  - id: we1-86-short
    where: 'worked example "Inflating by a factor of 10²⁶": 2⁸⁶ falls short of 10²⁶, so 87 doublings'
    inputs: {}
    formula: 2**86 / 1e26
    expected: '0.774'
    tolerance: '1%'
    shown: ['Since 86 doublings fall just short, it takes **87 doublings**']
    source: {cite: reading1, at: 'p. 7 (numbers are the page''s own)'}
    origin: page-own

  - id: we1-time
    where: 'worked example "Inflating by a factor of 10²⁶", step "Time"'
    inputs: {n: 87, td: 1e-37 s}
    formula: n * td
    expected: 8.7e-36 s
    shown: ['$87 \times 1 \times 10^{-37}\ \text{s} = 8.7 \times 10^{-36}\ \text{s}$']
    source: {cite: reading2, at: 'slide 4 (doubling time); numbers are the page''s own'}
    origin: page-own

  - id: we1-proton-light
    where: 'worked example "Inflating by a factor of 10²⁶", step "Time": light crossing a proton (10⁻¹⁵ m)'
    inputs: {d: 1e-15 m, c: 3.00e8 m/s}
    formula: d / c
    expected: 3e-24 s
    tolerance: '15%'
    shown: ['$(10^{-15}\ \text{m})/(3.00 \times 10^{8}\ \text{m/s}) = 3 \times 10^{-24}\ \text{s}$']
    source: {cite: reading4, at: 'p. 18 (proton about 10⁻¹³ cm); numbers are the page''s own'}
    origin: page-own

  - id: we1-billionth
