# Calculations on content/year-0/hs-8/inflation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6/7: c = 3.00e8 m/s. Guth's sample numbers for inflation: 8.286 Lecture 1 pp. 7-8 and slides 4-5.
# Proton size about 1e-13 cm: 8.286 Lecture 23 p. 18.

page: content/year-0/hs-8/inflation.mdx
calcs:
  - id: cmb-uniformity
    kind: fact
    where: 'section "The horizon problem"; ripples section; summary; quiz 0; flashcard 1: the background is uniform to one part in 100 000'
    value: '1e-5'
    shown: ['to about **one part in 100 000**', 'ripples of about one part in 100 000', 'in opposite directions to one part in 100 000, but in the Big Bang', 'in opposite directions to one part in 100 000, yet the places', 'same temperature to one part in 100 000']
    source: {cite: reading1, at: 'pp. 13-14; slide 8'}
    origin: mit

  - id: decoupling-time
    kind: fact
    where: 'section "The horizon problem": the background set free about 380 000 years after the start (lesson 8.15)'
    value: 380000 yr
    shown: ['about 380 000 years after the start']
    source: {cite: reading1, at: 'p. 13 (Guth rounds to 400 000 years there; 380 000 years is the value of lesson 8.15, from 8.286 Lecture 17 p. 19)'}
    origin: mit

  - id: speed-of-light
    kind: fact
    where: 'section "The horizon problem"; worked example "Inflating by a factor of 10²⁶", step "Time"'
    value: 3.00e8 m/s
    shown: ['travels faster than $3.00 \times 10^{8}\ \text{m/s}$', '(3.00 \times 10^{8}\ \text{m/s})']
    source: {cite: reading1, at: 'block constant (lessons 7.x and 8.1)'}
