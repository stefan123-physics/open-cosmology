  - id: guth-doubling-time
    kind: fact
    where: 'section "The idea of inflation"; flashcard 3; section "How sure are we?"; summary: doubling time about 10⁻³⁷ s'
    value: 1e-37 s
    shown: ['Guth''s sample doubling time is about $10^{-37}\ \text{s}$', 'The numbers in this lesson, $10^{-37}\ \text{s}$ and 100 doublings', 'every $10^{-37}\ \text{s}$, about 100']
