    expected: '2.4e52'
    tolerance: '1%'
    shown: ['$(2^{87})^2 = 2^{174} = 2.4 \times 10^{52}$']
    source: {cite: reading4, at: 'p. 21 (numbers are the page''s own)'}
    origin: page-own

  - id: we2-result
    where: 'worked example "Ironing out the curvature", step "The result"'
    inputs: {}
    formula: 0.1 / 2**174
    expected: '4e-54'
    tolerance: '6%'
    shown: ['$|\Omega - 1| = 0.1/(2.4 \times 10^{52}) = 4 \times 10^{-54}$', 'so $|\Omega - 1| = 0.1$']
