  - id: flatten-per-doubling
    kind: identity
    where: 'section "How inflation solves the two puzzles": with |Ω − 1| ∝ 1/a², doubling a divides |Ω − 1| by 4'
    formula: (1 / a**2) / (1 / (2 * a)**2)
    equals: 4
    samples: {a: [1.0, 3.0, 1e10]}
    tolerance: 1e-9
    shown: ['So every doubling of the size divides $|\Omega - 1|$ by 4']
    source: {cite: reading4, at: 'p. 21'}
    origin: page-own

  - id: we2-shrink
