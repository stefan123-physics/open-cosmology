# Calculations on content/year-0/hs-8/matter-waves-and-uncertainty.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Constants as in Blocks 6-7: h = 6.63e-34 J s, e = 1.6e-19 C, m_e = 9.11e-31 kg, m_p = 1.67e-27 kg, c = 3.00e8 m/s; hbar = h/2pi.

page: content/year-0/hs-8/matter-waves-and-uncertainty.mdx
calcs:
  - id: photon-momentum-identity
    kind: identity
    where: 'formula "Momentum of a photon": p = E/c with E = hc/λ gives h/λ'
    formula: (h * c / lam) / c
    equals: h / lam
    samples: {h: [6.63e-34, 6.63e-34], c: [3.0e8, 3.0e8], lam: [5.0e-7, 1.0e-10]}
    tolerance: 1e-12
    shown: ['p = \frac{E}{c} = \frac{h}{\lambda}']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.22)'}
    origin: mit

  - id: electron-momentum
    where: 'worked example "An electron and a tennis ball", step "The electron": p = m_e v'
    inputs: {m: 9.11e-31 kg, v: 2.0e6 m/s}
    formula: m * v
    expected: 1.82e-24 kg*m/s
    shown: ['$p = m_e v = 9.11 \times 10^{-31} \times 2.0 \times 10^{6} = 1.82 \times 10^{-24}\ \text{kg m/s}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: electron-wavelength
    where: 'worked example "An electron and a tennis ball", step "The electron": λ = h/(m_e v)'
    inputs: {h: 6.63e-34 J*s, m: 9.11e-31 kg, v: 2.0e6 m/s}
    formula: h / (m * v)
    expected: 3.6e-10 m
    shown: ['$\lambda = h/p = 6.63 \times 10^{-34}/(1.82 \times 10^{-24}) = 3.6 \times 10^{-10}\ \text{m}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: electron-wavelength-nm
    where: 'worked example "An electron and a tennis ball": 3.6 × 10⁻¹⁰ m in nm'
    inputs: {h: 6.63e-34 J*s, m: 9.11e-31 kg, v: 2.0e6 m/s}
    formula: h / (m * v)
    expected: 0.36 nm
    shown: ['or $0.36\ \text{nm}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: ball-momentum
    where: 'worked example "An electron and a tennis ball", step "The tennis ball": p = mv'
    inputs: {m: 0.058 kg, v: 50 m/s}
    formula: m * v
    expected: 2.9 kg*m/s
    shown: ['$p = 0.058 \times 50 = 2.9\ \text{kg m/s}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: ball-wavelength
    where: 'worked example "An electron and a tennis ball", step "The tennis ball": λ = h/p'
    inputs: {h: 6.63e-34 J*s, m: 0.058 kg, v: 50 m/s}
    formula: h / (m * v)
    expected: 2.3e-34 m
    shown: ['$\lambda = 6.63 \times 10^{-34}/2.9 = 2.3 \times 10^{-34}\ \text{m}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: ball-vs-proton
    where: 'worked example "An electron and a tennis ball": a proton (10⁻¹⁵ m) is more than 10¹⁸ times larger than the ball''s wavelength'
    inputs: {h: 6.63e-34 J*s, m: 0.058 kg, v: 50 m/s, rp: 1e-15 m}
    formula: rp / (h / (m * v))
    expected: 4.4e18
    tolerance: '5%'
    shown: ['more than $10^{18}$ times smaller still']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-energy
    where: 'worked example "The wavelength in an electron microscope", step "Kinetic energy": E_k = eV'
    inputs: {e: 1.6e-19 C, V: 1.0e4 V}
    formula: e * V
    expected: 1.6e-15 J
    shown: ['$E_k = eV = 1.6 \times 10^{-19} \times 1.0 \times 10^{4} = 1.6 \times 10^{-15}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-momentum
    where: 'worked example "The wavelength in an electron microscope": p = √(2 m_e E_k)'
    inputs: {m: 9.11e-31 kg, e: 1.6e-19 C, V: 1.0e4 V}
    formula: sqrt(2 * m * e * V)
    expected: 5.40e-23 kg*m/s
    shown: ['$p = \sqrt{2 m_e E_k} = \sqrt{2 \times 9.11 \times 10^{-31} \times 1.6 \times 10^{-15}} = 5.40 \times 10^{-23}\ \text{kg m/s}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-wavelength
    where: 'worked example "The wavelength in an electron microscope": λ = h/√(2meV)'
    inputs: {h: 6.63e-34 J*s, m: 9.11e-31 kg, e: 1.6e-19 C, V: 1.0e4 V}
    formula: h / sqrt(2 * m * e * V)
    expected: 1.23e-11 m
    shown: ['$\lambda = h/p = 6.63 \times 10^{-34}/(5.40 \times 10^{-23}) = 1.23 \times 10^{-11}\ \text{m}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-wavelength-nm
    where: 'worked example "The wavelength in an electron microscope" and Summary: about 0.012 nm'
    inputs: {h: 6.63e-34 J*s, m: 9.11e-31 kg, e: 1.6e-19 C, V: 1.0e4 V}
    formula: h / sqrt(2 * m * e * V)
    expected: 0.012 nm
    tolerance: '5%'
    shown: ['\text{m}$, about $0.012\ \text{nm}$.', '$h/\sqrt{2meV}$, about $0.012\ \text{nm}$ at $10\ \text{kV}$', 'wavelengths of about $0.01\\ \\text{nm}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-vs-green
    where: 'worked example "The wavelength in an electron microscope", step "Comparison": 500 nm / 0.0123 nm'
    inputs: {lg: 500e-9 m, h: 6.63e-34 J*s, m: 9.11e-31 kg, e: 1.6e-19 C, V: 1.0e4 V}
    formula: lg / (h / sqrt(2 * m * e * V))
    expected: 41000
    tolerance: '2%'
    shown: ['$500\ \text{nm}/0.0123\ \text{nm} \approx 41\ 000$', 'about forty thousand times shorter']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-ek-vs-rest
    where: 'worked example "The wavelength in an electron microscope": 10 keV is 2% of 511 keV'
    inputs: {Ek: 10 keV, E0: 511 keV}
    formula: Ek / E0 * 100
    expected: 2.0
    tolerance: '5%'
    shown: ['is only 2% of their rest energy of $511\ \text{keV}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: microscope-formula-identity
    kind: identity
    where: 'formula "Wavelength of electrons accelerated through a voltage V": h/p with p = √(2m E_k), E_k = eV; and E_k = ½mv² = p²/2m'
    formula: h / (m * sqrt(2 * e * V / m))
    equals: h / sqrt(2 * m * e * V)
    samples: {h: [6.63e-34, 6.63e-34], m: [9.11e-31, 1.67e-27], e: [1.6e-19, 1.6e-19], V: [1.0e4, 100.0]}
    tolerance: 1e-9
    shown: ['\lambda = \frac{h}{p} = \frac{h}{\sqrt{2meV}}']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: hbar-value
    where: 'section "A wave in a short packet": ħ = h/2π'
    inputs: {h: 6.63e-34 J*s}
    formula: h / (2 * pi)
    expected: 1.055e-34 J*s
    shown: ['$\hbar = h/2\pi = 1.055 \times 10^{-34}\ \text{J s}$']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.13)'}
    origin: page-own

  - id: h-over-4pi-identity
    kind: identity
    where: 'formula "Heisenberg''s uncertainty principle": h/4π = ħ/2'
    formula: h / (4 * pi)
    equals: (h / (2 * pi)) / 2
    samples: {h: [6.63e-34, 1.0]}
    tolerance: 1e-12
    shown: ['\Delta x\,\Delta p \ge \frac{h}{4\pi} = \frac{\hbar}{2}']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: mit

  - id: dust-speed
    where: 'section "The uncertainty principle": dust speck, Δv = h/(4π m Δx)'
    inputs: {h: 6.63e-34 J*s, m: 1.0e-15 kg, dx: 1.0e-6 m}
    formula: h / (4 * pi * m * dx)
    expected: 5.3e-14 m/s
    shown: ['$h/(4\pi m\,\Delta x) = 5.3 \times 10^{-14}\ \text{m/s}$']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: dust-drift-years
    where: 'section "The uncertainty principle": time to drift 1 mm at 5.3 × 10⁻¹⁴ m/s, in years'
    inputs: {h: 6.63e-34 J*s, m: 1.0e-15 kg, dx: 1.0e-6 m, d: 1.0e-3 m, yr: 3.156e7 s}
    formula: d / (h / (4 * pi * m * dx)) / yr
    expected: 600
    tolerance: '3%'
    shown: ['about 600 years to drift one millimetre']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: electron-vs-dust
    where: 'section "The uncertainty principle": the electron is 10¹⁵ times lighter than the dust speck'
    inputs: {m: 1.0e-15 kg, me: 9.11e-31 kg}
    formula: m / me
    expected: 1.1e15
    tolerance: '10%'
    shown: ['which is $10^{15}$ times lighter']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: atom-dp
    where: 'worked example "An electron held inside an atom", step "Spread in momentum"'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-10 m}
    formula: h / (4 * pi * dx)
    expected: 5.3e-25 kg*m/s
    shown: ['$\Delta p \ge h/(4\pi\,\Delta x) = 6.63 \times 10^{-34}/(4\pi \times 1.0 \times 10^{-10}) = 5.3 \times 10^{-25}\ \text{kg m/s}$', 'has $\Delta p \ge 5 \times 10^{-25}\ \text{kg m/s}$', '$\\Delta p \\ge h/(4\\pi\\Delta x) \\approx 5 \\times 10^{-25}\\ \\text{kg m/s}$']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: atom-dv
    where: 'worked example "An electron held inside an atom", step "Spread in speed"'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-10 m, m: 9.11e-31 kg}
    formula: h / (4 * pi * dx) / m
    expected: 5.8e5 m/s
    shown: ['$\Delta v = \Delta p/m_e = 5.3 \times 10^{-25}/(9.11 \times 10^{-31}) = 5.8 \times 10^{5}\ \text{m/s}$', 'nearly 600 kilometres per second']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: atom-ek
    where: 'worked example "An electron held inside an atom", step "Kinetic energy": E_k ≈ p²/2m with p = Δp'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-10 m, m: 9.11e-31 kg}
    formula: (h / (4 * pi * dx))**2 / (2 * m)
    expected: 1.5e-19 J
    shown: ['$E_k \approx p^2/2m_e = (5.3 \times 10^{-25})^2/(2 \times 9.11 \times 10^{-31}) = 1.5 \times 10^{-19}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: atom-ek-ev
    where: 'worked example "An electron held inside an atom": 1.5 × 10⁻¹⁹ J is about 1 eV (flashcard too)'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-10 m, m: 9.11e-31 kg, eV: 1.6e-19 J}
    formula: (h / (4 * pi * dx))**2 / (2 * m) / eV
    expected: 1.0
    tolerance: '10%'
    shown: ['about $1\ \text{eV}$', 'a kinetic energy of about $1\\ \\text{eV}$']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: quiz-proton-wavelength
    where: 'quiz 0: λ = h/(m_p v) for v = 1.0 × 10⁴ m/s'
    inputs: {h: 6.63e-34 J*s, m: 1.67e-27 kg, v: 1.0e4 m/s}
    formula: h / (m * v)
    expected: 4.0e-11 m
    shown: ['$\\lambda = h/p = 6.63 \\times 10^{-34}/(1.67 \\times 10^{-23}) = 4.0 \\times 10^{-11}\\ \\text{m}$']
    quiz: 0
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz0-momentum
    where: 'quiz 0, explanation: p = m_p v'
    inputs: {m: 1.67e-27 kg, v: 1.0e4 m/s}
    formula: m * v
    expected: 1.67e-23 kg*m/s
    shown: ['$p = mv = 1.67 \\times 10^{-27} \\times 1.0 \\times 10^{4} = 1.67 \\times 10^{-23}\\ \\text{kg m/s}$']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz0-wrong-electron-mass
    where: 'quiz 0, distractor: the electron''s mass instead of the proton''s'
    inputs: {h: 6.63e-34 J*s, m: 9.11e-31 kg, v: 1.0e4 m/s}
    formula: h / (m * v)
    expected: 7.3e-8 m
    shown: ['"$7.3 \\times 10^{-8}\\ \\text{m}$"']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz0-wrong-inverted
    where: 'quiz 0, distractor: p/h instead of h/p (its unit is really 1/m)'
    inputs: {h: 6.63e-34 J*s, m: 1.67e-27 kg, v: 1.0e4 m/s}
    formula: m * v / h
    expected: 2.5e10 1/m
    shown: ['"$2.5 \\times 10^{10}\\ \\text{m}$"']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz0-wrong-product
    where: 'quiz 0, distractor: h times p (its unit is really J s kg m/s)'
    inputs: {h: 6.63e-34 J*s, m: 1.67e-27 kg, v: 1.0e4 m/s}
    formula: h * m * v
    expected: 1.1e-56 J*s*kg*m/s
    shown: ['"$1.1 \\times 10^{-56}\\ \\text{m}$"']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz-ball-wavelength-order
    where: 'quiz 1 explanation and flashcard: a ball''s wavelength is about 10⁻³⁴ m (the tennis ball of the worked example)'
    inputs: {h: 6.63e-34 J*s, m: 0.058 kg, v: 50 m/s}
    formula: h / (m * v)
    expected: 2.3e-34 m
    shown: ['for a ball it is about $10^{-34}\\ \\text{m}$', 'is about $10^{-34}\\ \\text{m}$, far smaller', '(about $10^{-34}\ \text{m}$ for a tennis ball)']
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz-double-speed-halves
    kind: identity
    where: 'quiz 2: twice the speed halves the wavelength h/mv, and so the fringe spacing'
    formula: h / (m * 2 * v)
    equals: 0.5 * h / (m * v)
    samples: {h: [6.63e-34, 6.63e-34], m: [9.11e-31, 9.11e-31], v: [1.0e6, 3.0e6]}
    tolerance: 1e-12
    shown: ['They move twice as close together']
    quiz: 2
    source: {cite: mit, at: 'Sec. 3, Eq. (3.23)'}
    origin: page-own

  - id: quiz-min-dp
    where: 'quiz 3: Δp ≥ h/(4π Δx) for Δx = 1.0 nm'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-9 m}
    formula: h / (4 * pi * dx)
    expected: 5.3e-26 kg*m/s
    shown: ['$\\Delta p \\ge h/(4\\pi\\,\\Delta x) = 6.63 \\times 10^{-34}/(4\\pi \\times 1.0 \\times 10^{-9}) = 5.3 \\times 10^{-26}\\ \\text{kg m/s}$']
    quiz: 3
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: quiz3-wrong-no-4pi
    where: 'quiz 3, distractor: h/Δx'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-9 m}
    formula: h / dx
    expected: 6.6e-25 kg*m/s
    shown: ['"$6.6 \\times 10^{-25}\\ \\text{kg m/s}$"']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: quiz3-wrong-hbar
    where: 'quiz 3, distractor: ħ/Δx'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-9 m}
    formula: h / (2 * pi * dx)
    expected: 1.1e-25 kg*m/s
    shown: ['"$1.1 \\times 10^{-25}\\ \\text{kg m/s}$"']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: quiz3-wrong-times-dx
    where: 'quiz 3, distractor: h/(4π) times Δx (its unit is really J s m)'
    inputs: {h: 6.63e-34 J*s, dx: 1.0e-9 m}
    formula: h / (4 * pi) * dx
    expected: 5.3e-44 J*s*m
    shown: ['"$5.3 \\times 10^{-44}\\ \\text{kg m/s}$"']
    source: {cite: reading1, at: 'Sec. 1, Eq. (1.15)'}
    origin: page-own

  - id: molecule-mass
    kind: fact
    where: 'section "Electrons that interfere": molecules of 810 atoms and more than 10 000 atomic mass units, as quoted in the MIT notes (experiment reported 2013)'
    value: 10000
    shown: ['even molecules of 810 atoms, with a mass of more than 10 000 atomic mass units']
    source: {cite: mit, at: 'Sec. 3, p. 6'}
    origin: mit
