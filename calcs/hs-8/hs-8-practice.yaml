# Calculations on content/year-0/hs-8/hs-8-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Block 8 constants: c = 3.00e8 m/s, e = 1.6e-19 C (1 eV = 1.6e-19 J), h = 6.63e-34 J s, G = 6.67e-11 N m²/kg²,
# m_e = 9.11e-31 kg, m_p = 1.67e-27 kg, 1 u c² = 931.5 MeV, M_sun = 1.99e30 kg, light-year 9.46e15 m,
# parsec 3.086e16 m, year 3.156e7 s, Wien 2.9e-3 m K.
# Inputs are plain SI numbers (no units), as in calcs/hs-7/hs-7-practice.yaml.

page: content/year-0/hs-8/hs-8-practice.mdx
calcs:
  # ---------------------------------------------------------------- constants
  - id: hs8p-const-c
    kind: fact
    where: 'Introduction: the speed of light'
    value: 3.00e8
    shown: ['Use $c = 3.00 \times 10^8\ \text{m/s}$']
    source: {cite: reading1, at: 'slide 4'}
    origin: mit

  - id: hs8p-const-e
    kind: fact
    where: 'Introduction: the elementary charge and the electronvolt'
    value: 1.6e-19
    shown: ['$e = 1.6 \times 10^{-19}\ \text{C}$ (so $1\ \text{eV} = 1.6 \times 10^{-19}\ \text{J}$)']
    source: {cite: evunit, at: 'Units of energy'}
    origin: mit

  - id: hs8p-const-h
    kind: fact
    where: 'Introduction: Planck''s constant'
    value: 6.63e-34
    shown: ['$h = 6.63 \times 10^{-34}\ \text{J s}$']
    source: {cite: photon, at: 'Sec. 11.5'}
    origin: mit

  - id: hs8p-const-u
    kind: fact
    where: 'Introduction and Problem 3: 1 u c² = 931.5 MeV (the notes give 931.502)'
    value: 931.5
    shown: ['$1\ \text{u} \times c^2 = 931.5\ \text{MeV}$']
    source: {cite: reading4, at: 'Sec. 1.1.2, p. 6'}
    origin: mit

  - id: hs8p-const-msun
    kind: fact
    where: 'Introduction: the Sun''s mass 1.99e30 kg (NASA 1 988 400 × 10²⁴ kg)'
    value: 1.99e30
    shown: ['the Sun''s mass $1.99 \times 10^{30}\ \text{kg}$']
    source: {cite: sunfact, at: 'Bulk parameters: mass'}
    origin: later-data

  - id: hs8p-const-pc
    where: 'Introduction: one parsec, 1 AU divided by one arcsecond in radians'
    inputs: {AU: 1.496e11}
    formula: AU / (pi / (180 * 3600))
    expected: '3.086e16'
    tolerance: '0.1%'
    shown: ['one parsec $3.086 \times 10^{16}\ \text{m}$']
    source: {cite: nasaGlossary, at: 'entries Astronomical unit and Parsec'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 1
  - id: hs8p-p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: γ for v = 0.96c'
    inputs: {b: 0.96}
    formula: 1 / sqrt(1 - b**2)
    expected: '3.57'
    tolerance: '0.3%'
    shown: ['$\gamma = 1/\sqrt{1 - 0.9216} = 1/\sqrt{0.0784} = 1/0.28 = 3.57$']
    source: {cite: reading1, at: 'slide 15'}
    origin: page-own

  - id: hs8p-p1-b-sq
    where: 'Problem 1(b): 0.96² and 1 − 0.9216 and its root'
    inputs: {b: 0.96}
    formula: sqrt(1 - b**2)
    expected: '0.28'
    tolerance: '0.1%'
    shown: ['$v^2/c^2 = 0.96^2 = 0.9216$']
    source: {cite: reading1, at: 'slide 15'}
    origin: page-own

  - id: hs8p-p1-c
    answer: p1-c
    where: 'Problem 1(c), answer box: Earth time for 3.00 h of proper time'
    inputs: {g: 3.5714, t0: 3.00}
    formula: g * t0
    expected: '10.7'
    tolerance: '0.5%'
    shown: ['$\Delta t = 3.57 \times 3.00 = 10.7\ \text{h}$']
    source: {cite: mit, at: 'slide 4'}
    origin: page-own

  - id: hs8p-p1-c-dist
    where: 'Problem 1(c), check: distance covered in the Earth frame'
    inputs: {v: 2.88e8, t: 10.714}
    formula: v * t * 3600
    expected: '1.11e13'
    tolerance: '0.5%'
    shown: ['$0.96 \times 3.00 \times 10^{8} \times 10.7 \times 3600 = 1.11 \times 10^{13}\ \text{m}$']
    source: {cite: mit, at: 'slide 4 (our own check)'}
    origin: page-own

  - id: hs8p-p1-c-contracted
    where: 'Problem 1(c), check: the same stretch contracted, and covered at 0.96c in 3.00 h'
    inputs: {D: 1.111e13, g: 3.5714, v: 2.88e8}
    formula: D / g
    expected: '3.11e12'
    tolerance: '0.5%'
    shown: ['$1.11 \times 10^{13}/3.57 = 3.11 \times 10^{12}\ \text{m}$']
    source: {cite: mit, at: 'slides 12–13 (our own check)'}
    origin: page-own

  - id: hs8p-p1-c-contracted-time
    where: 'Problem 1(c), check: 3.11e12 m at 0.96c takes 3.00 h'
    inputs: {d: 3.11e12, v: 2.88e8}
    formula: d / v / 3600
    expected: '3.00'
    tolerance: '0.5%'
    shown: ['which the probe covers at $0.96c$ in $3.00\ \text{h}$']
    source: {cite: mit, at: 'slide 4 (our own check)'}
    origin: page-own

  - id: hs8p-p1-d
    answer: p1-d
    where: 'Problem 1(d), answer box: contracted length 50.0/γ'
    inputs: {L0: 50.0, g: 3.5714}
    formula: L0 / g
    expected: '14.0'
    tolerance: '0.3%'
    shown: ['$L = 50.0/3.57 = 14.0\ \text{m}$']
    source: {cite: mit, at: 'slides 12–13'}
    origin: page-own

  - id: hs8p-p1-e
    kind: identity
    answer: p1-e
    where: 'Problem 1(e), answer box: v = c√(1 − 1/γ²), against √(c² − (c/γ)²)'
    formula: c*sqrt(1 - 1/g**2)
    equals: sqrt(c**2 - (c/g)**2)
    samples:
      c: [3.0e8, 1, 2, 7]
      g: [3.5714, 1.01, 2, 20]
    tolerance: 1e-12
    shown: ['v = c\,\sqrt{1 - \frac{1}{\gamma^2}}']
    source: {cite: reading1, at: 'slide 15 (our own step)'}
    origin: page-own

  - id: hs8p-p1-e-roundtrip
    kind: identity
    where: 'Problem 1(e): the Lorentz factor of v = c√(1 − 1/γ²) is γ again'
    formula: 1 / sqrt(1 - (sqrt(1 - 1/g**2))**2)
    equals: g
    samples:
      g: [3.5714, 1.01, 2, 20]
    tolerance: 1e-9
    shown: ['\frac{1}{\gamma^2} = 1 - \frac{v^2}{c^2}']
    source: {cite: reading1, at: 'slide 15 (our own step)'}
    origin: page-own

  - id: hs8p-p1-e-check
    where: 'Problem 1(e), check: γ = 3.57 gives 0.96c'
    inputs: {g: 3.5714}
    formula: sqrt(1 - 1/g**2)
    expected: '0.96'
    tolerance: '0.3%'
    shown: ['$\gamma = 3.57$ gives $v = c\sqrt{1 - 1/12.76} = c\sqrt{0.9216} = 0.96c$']
    source: {cite: reading1, at: 'slide 15'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 2
  - id: hs8p-p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: rest energy of an electron in J'
    inputs: {m: 9.11e-31, c: 3.00e8}
    formula: m * c**2
    expected: '8.20e-14'
    tolerance: '0.3%'
    shown: ['$E_0 = 9.11 \times 10^{-31} \times (3.00 \times 10^{8})^2 = 8.20 \times 10^{-14}\ \text{J}$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: hs8p-p2-a-MeV
    where: 'Problem 2(a), check: the rest energy in MeV with the rounded constants'
    inputs: {E: 8.199e-14, eV: 1.6e-19}
    formula: E / eV / 1e6
    expected: '0.512'
    tolerance: '0.2%'
    shown: ['$8.20 \times 10^{-14}/(1.6 \times 10^{-19}) = 5.12 \times 10^{5}\ \text{eV} = 0.512\ \text{MeV}$']
    source: {cite: evunit, at: 'Units of energy'}
    origin: page-own

  - id: hs8p-p2-a-nist
    kind: fact
    where: 'Problem 2(a), check: the measured rest energy 0.511 MeV'
    value: 0.511
    shown: ['The measured value is $0.511\ \text{MeV}$ (NIST)']
    source: {cite: nist-me, at: '0.510 998 950 69 MeV'}
    origin: later-data

  - id: hs8p-p2-E
    where: 'Problem 2(b): total energy 0.511 + 1.53 MeV'
    inputs: {E0: 0.511, Ek: 1.53}
    formula: E0 + Ek
    expected: '2.04'
    tolerance: '0.3%'
    shown: ['$E = 0.511 + 1.53 = 2.04\ \text{MeV}$']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: hs8p-p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: γ = E/E_0'
    inputs: {E0: 0.511, Ek: 1.53}
    formula: (E0 + Ek) / E0
    expected: '3.99'
    tolerance: '0.3%'
    shown: ['$\gamma = E/E_0 = 2.041/0.511 = 3.99$']
    source: {cite: reading2, at: 'p. 1'}
    origin: page-own

  - id: hs8p-p2-b-check
    where: 'Problem 2(b), check: (γ − 1) mc² gives back 1.53 MeV'
    inputs: {g: 3.99, E0: 0.511}
    formula: (g - 1) * E0
    expected: '1.53'
    tolerance: '0.5%'
    shown: ['$(\gamma - 1)\,mc^2 = 2.99 \times 0.511 = 1.53\ \text{MeV}$']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: hs8p-p2-c
    answer: p2-c
    where: 'Problem 2(c), answer box: v/c from γ'
    inputs: {g: 3.9941}
    formula: sqrt(1 - 1/g**2)
    expected: '0.968'
    tolerance: '0.1%'
    shown: ['$v/c = \sqrt{1 - 1/\gamma^2} = \sqrt{1 - 1/3.99^2} = \sqrt{1 - 0.0627} = 0.968$']
    source: {cite: reading1, at: 'slide 15 (as in Problem 1(e))'}
    origin: page-own

  - id: hs8p-p2-d
    where: 'Problem 2(d): Newton''s speed √(2E_k/(mc²)) in units of c'
    inputs: {Ek: 1.53, E0: 0.511}
    formula: sqrt(2 * Ek / E0)
    expected: '2.45'
    tolerance: '0.3%'
    shown: ['$v/c = \sqrt{2E_k/(mc^2)} = \sqrt{2 \times 1.53/0.511} = 2.45$', '"About 2.4c, faster than light, which is impossible"']
    source: {cite: reading3, at: 'p. 1 (½mv² for small v)'}
    origin: page-own

  - id: hs8p-p2-e
    kind: identity
    answer: p2-e
    where: 'Problem 2(e), answer box: γ = 1 + E_k/(mc²), against the total energy (mc² + E_k) divided by the rest energy'
    formula: 1 + E/(m*c**2)
    equals: (m*c**2 + E) / (m*c**2)
    samples:
      E: [1.53, 0.1, 5, 10]
      m: [0.511, 1, 0.1, 5]
      c: [1, 1, 3, 2]
    tolerance: 1e-9
    shown: ['\gamma = 1 + \frac{E_k}{mc^2}']
    source: {cite: reading3, at: 'p. 1 (our own step)'}
    origin: page-own

  - id: hs8p-p2-e-check
    where: 'Problem 2(e), check: 1 + 1.53/0.511'
    inputs: {Ek: 1.53, E0: 0.511}
    formula: 1 + Ek / E0
    expected: '3.99'
    tolerance: '0.3%'
    shown: ['$1 + 1.53/0.511 = 3.99$']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 3
  - id: hs8p-p3-masses
    kind: fact
    where: 'Problem 3 statement: proton, neutron, deuteron and triton masses in u (NIST, rounded)'
    value: 2.01355
    shown: ['proton $1.00728\ \text{u}$, neutron $1.00866\ \text{u}$, deuteron $2.01355\ \text{u}$ and triton $3.01550\ \text{u}$']
    source: {cite: nistMd, at: '2.013 553 212 544 u (proton, neutron and triton: nistMp, nistMn, nistMt)'}
    origin: later-data

  - id: hs8p-p3-a
    answer: p3-a
    where: 'Problem 3(a), answer box: mass defect of the deuteron'
    inputs: {p: 1.00728, n: 1.00866, d: 2.01355}
    formula: p + n - d
    expected: '0.00239'
    tolerance: '0.5%'
    shown: ['$\Delta m = 1.00728 + 1.00866 - 2.01355 = 0.00239\ \text{u}$']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: hs8p-p3-a-frac
    where: 'Problem 3(a), check: the defect is about 0.1% of the mass'
    inputs: {dm: 0.00239, d: 2.01355}
    formula: dm / d * 100
    expected: '0.12'
    tolerance: '20%'
    shown: ['about 0.1% of the mass']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6 (our own check)'}
    origin: page-own

  - id: hs8p-p3-b
    answer: p3-b
    where: 'Problem 3(b), answer box: binding energy of the deuteron'
    inputs: {dm: 0.00239, u: 931.5}
    formula: dm * u
    expected: '2.23'
    tolerance: '0.5%'
    shown: ['$E_b = 0.00239 \times 931.5 = 2.23\ \text{MeV}$']
    source: {cite: reading4, at: 'Sec. 1.2.1 and Sec. 1.1.2, p. 6'}
    origin: page-own

  - id: hs8p-p3-b-pern
    where: 'Problem 3(b), check: per nucleon'
    inputs: {E: 2.226}
    formula: E / 2
    expected: '1.11'
    tolerance: '0.5%'
    shown: ['only $2.23/2 = 1.11\ \text{MeV}$ per nucleon']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: hs8p-p3-b-iron
    kind: fact
    where: 'Problem 3(b), check: almost 9 MeV per nucleon near iron (lesson 8.4, AME 2020: ⁶²Ni 8.79 MeV)'
    value: 9
    shown: ['the almost $9\ \text{MeV}$ per nucleon near iron (lesson 8.4)']
    source: {cite: reading4, at: 'as in lesson 8.4'}
    origin: later-data

  - id: hs8p-p3-c-dm
    where: 'Problem 3(c): mass defect of the triton'
    inputs: {p: 1.00728, n: 1.00866, t: 3.01550}
    formula: p + 2*n - t
    expected: '0.00910'
    tolerance: '0.5%'
    shown: ['$\Delta m = 1.00728 + 2 \times 1.00866 - 3.01550 = 0.00910\ \text{u}$']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: hs8p-p3-c-Eb
    where: 'Problem 3(c): binding energy of the triton'
    inputs: {dm: 0.00910, u: 931.5}
    formula: dm * u
    expected: '8.48'
    tolerance: '0.3%'
    shown: ['$E_b = 0.00910 \times 931.5 = 8.48\ \text{MeV}$']
    source: {cite: reading4, at: 'Sec. 1.2.1 and Sec. 1.1.2, p. 6'}
    origin: page-own

  - id: hs8p-p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: binding energy per nucleon of the triton'
    inputs: {dm: 0.00910, u: 931.5}
    formula: dm * u / 3
    expected: '2.83'
    tolerance: '0.3%'
    shown: ['per nucleon $8.48/3 = 2.83\ \text{MeV}$']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  - id: hs8p-p3-d-before
    where: 'Problem 3(d): mass before, two deuterons'
    inputs: {d: 2.01355}
    formula: 2 * d
    expected: '4.02710'
    tolerance: '1e-6'
    shown: ['$m_\text{before} = 2 \times 2.01355 = 4.02710\ \text{u}$']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: hs8p-p3-d-after
    where: 'Problem 3(d): mass after, triton and proton'
    inputs: {t: 3.01550, p: 1.00728}
    formula: t + p
    expected: '4.02278'
    tolerance: '1e-6'
    shown: ['$m_\text{after} = 3.01550 + 1.00728 = 4.02278\ \text{u}$']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: hs8p-p3-d
    answer: p3-d
    where: 'Problem 3(d), answer box: Q of D + D → T + p'
    inputs: {d: 2.01355, t: 3.01550, p: 1.00728, u: 931.5}
    formula: (2*d - t - p) * u
    expected: '4.02'
    tolerance: '0.5%'
    shown: ['so $Q = 0.00432 \times 931.5 = 4.02\ \text{MeV}$']
    source: {cite: reading5, at: 'p. 2'}
    origin: page-own

  - id: hs8p-p3-d-check
    where: 'Problem 3(d), check: from binding energies 8.48 − 2 × 2.23'
    inputs: {Et: 8.48, Ed: 2.23}
    formula: Et - 2 * Ed
    expected: '4.02'
    tolerance: '0.3%'
    shown: ['$2 \times 2.23 = 4.46\ \text{MeV}$', '$8.48 - 4.46 = 4.02\ \text{MeV}$']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6 (our own check)'}
    origin: page-own

  - id: hs8p-p3-e
    kind: identity
    answer: p3-e
    where: 'Problem 3(e), answer box: binding energy per nucleon in MeV, against mass defect × 931.5 shared out step by step'
    formula: 931.5*(Z*mp + N*mn - M)/(Z + N)
    equals: (Z*mp*931.5 + N*mn*931.5 - M*931.5) / (Z + N)
    samples:
      Z: [1, 2, 26, 1]
      N: [2, 2, 30, 1]
      M: [3.01550, 4.00151, 55.92068, 2.01355]
      mp: [1.00728, 1.00728, 1.00728, 1.00728]
      mn: [1.00866, 1.00866, 1.00866, 1.00866]
    tolerance: 1e-9
    shown: ['\frac{E_b}{A} = \frac{931.5\ \text{MeV} \times \left(Z\,m_p + N\,m_n - M\right)}{Z + N}']
    source: {cite: reading4, at: 'Sec. 1.2.1 and Sec. 1.1.2, p. 6 (our own step)'}
    origin: page-own

  - id: hs8p-p3-e-check
    where: 'Problem 3(e), check: the triton'
    inputs: {dm: 0.00910}
    formula: 931.5 * dm / 3
    expected: '2.83'
    tolerance: '0.3%'
    shown: ['$931.5 \times 0.00910/3 = 2.83\ \text{MeV}$']
    source: {cite: reading4, at: 'Sec. 1.2.1, p. 6'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 4
  - id: hs8p-p4-L
    where: 'Problem 4 statement: 6.1e27 W is about 16 times the Sun''s 3.83e26 W'
    inputs: {L: 6.1e27, Ls: 3.83e26}
    formula: L / Ls
    expected: '16'
    tolerance: '1%'
    shown: ['$6.1 \times 10^{27}\ \text{W}$, about $16$ times the Sun''s $3.83 \times 10^{26}\ \text{W}$']
    source: {cite: sunfact, at: 'luminosity 382.8 × 10²⁴ J/s'}
    origin: page-own

  - id: hs8p-p4-Q
    where: 'Problem 4(a), check: 26.7 MeV from the masses (lesson 8.5)'
    inputs: {p: 1.00728, e: 0.00055, he: 4.00151, u: 931.5}
    formula: (4*p + 2*e - he) * u
    expected: '26.7'
    tolerance: '0.3%'
    shown: ['$(4 \times 1.00728 + 2 \times 0.00055 - 4.00151) \times 931.5 = 26.7\ \text{MeV}$', 'which releases $26.7\ \text{MeV}$ for each helium nucleus']
    source: {cite: reading6, at: 'slide 16 (masses: nistMp, nistMe, nistMalpha)'}
    origin: page-own

  - id: hs8p-p4-Ech
    where: 'Problem 4(a): 26.7 MeV in joules'
    inputs: {E: 26.7e6, eV: 1.6e-19}
    formula: E * eV
    expected: '4.27e-12'
    tolerance: '0.2%'
    shown: ['$26.7 \times 10^{6} \times 1.6 \times 10^{-19} = 4.27 \times 10^{-12}\ \text{J}$']
    source: {cite: evunit, at: 'Units of energy'}
    origin: page-own

  - id: hs8p-p4-a
    answer: p4-a
    where: 'Problem 4(a), answer box: helium nuclei per second'
    inputs: {L: 6.1e27, E: 4.272e-12}
    formula: L / E
    expected: '1.43e39'
    tolerance: '0.3%'
    shown: ['$6.1 \times 10^{27}/(4.27 \times 10^{-12}) = 1.43 \times 10^{39}$']
    source: {cite: reading6, at: 'slide 16 (our own step)'}
    origin: page-own

  - id: hs8p-p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: hydrogen used per second'
    inputs: {mp: 1.67e-27, n: 1.4279e39}
    formula: 4 * mp * n
    expected: '9.54e12'
    tolerance: '0.3%'
    shown: ['$4 \times 1.67 \times 10^{-27} \times 1.43 \times 10^{39} = 9.54 \times 10^{12}\ \text{kg}$']
    source: {cite: reading6, at: 'slide 15 (four protons per helium nucleus)'}
    origin: page-own

  - id: hs8p-p4-c
    answer: p4-c
    where: 'Problem 4(c), answer box: mass turned into energy per second, L/c²'
    inputs: {L: 6.1e27, c: 3.00e8}
    formula: L / c**2
    expected: '6.78e10'
    tolerance: '0.3%'
    shown: ['$6.1 \times 10^{27}/(3.00 \times 10^{8})^2 = 6.78 \times 10^{10}\ \text{kg/s}$']
    source: {cite: reading6, at: 'slide 16'}
    origin: page-own

  - id: hs8p-p4-c-frac
    where: 'Problem 4(c), check: fraction of the hydrogen''s mass that becomes energy'
    inputs: {a: 6.78e10, b: 9.54e12}
    formula: a / b
    expected: '0.0071'
    tolerance: '1%'
    shown: ['$6.78 \times 10^{10}/(9.54 \times 10^{12}) = 0.0071$', 'Just 0.7% of the hydrogen''s mass']
    source: {cite: reading6, at: 'slide 16 (0.7%)'}
    origin: page-own

  - id: hs8p-p4-d-M
    where: 'Problem 4(d): the star''s mass and 10% of it'
