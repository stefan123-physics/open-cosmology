# Calculations on content/year-5/Ferreras/galaxy-clusters.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Section 2.3.

page: content/year-5/Ferreras/galaxy-clusters.mdx
calcs:
  - id: zwicky-1933
    kind: fact
    where: 'section "Zwicky and the Coma cluster" and quiz 1: Zwicky, 1933'
    value: 1933
    shown: ['In 1933 **Fritz Zwicky**', 'argued, in 1933, that', "Fritz Zwicky's 1933 study"]
    source: {cite: mit, at: 'p. 23'}
    origin: mit

  - id: truncated-isothermal-potential
    kind: identity
    where: 'worked example "Weighing a cluster", step "The potential energy": ∫₀ᴿ G (M r/R)(M/R) dr / r = GM²/R'
    formula: integrate('G0 * (M0 * x / R0) * (M0 / R0) / x', 'x', 0.001 * R0, R0) / (1 - 0.001)
    equals: G0 * M0**2 / R0
    samples: {G0: [1, 2.5], M0: [1, 3], R0: [1, 7]}
    shown: ['= -\int_0^R G (M r/R)(M/R)\,dr / r = -GM^2/R$']
    source: {cite: mit, at: 'p. 23, Exercise 2.2'}
    origin: page-own

  - id: virial-alpha
    kind: identity
    where: 'worked example, step "Solve for α": 2K + W = 0 with K = (3/2)Mσ², W = −GM²/R gives M = 3σ²R/G'
    formula: 2 * (3 / 2) * (3 * s**2 * R0 / G0) * s**2 - G0 * (3 * s**2 * R0 / G0)**2 / R0
    equals: 0 * s
    samples: {s: [1, 2], R0: [1, 5], G0: [1, 3]}
    tolerance: 1e-9
    shown: ['$M = 3\sigma^2 R/G$, so $\alpha = 3$']
    source: {cite: mit, at: 'p. 23, Exercise 2.2'}
    origin: page-own

  - id: cluster-mass-example
    where: 'worked example, step "The mass": M = 3 × 800² × 1200 / 4.30 × 10⁻⁶ ≈ 5.4 × 10¹⁴ M⊙'
    inputs: {s: 800 km/s, R: 1.2 Mpc, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: 3 * s**2 * R / (G * M_sun)
    expected: 5.4e14
    shown: ['$M = 3 \times 800^2 \times 1200 / 4.30 \times 10^{-6} \approx 5.4 \times 10^{14}\,M_\odot$']
    source: {cite: mit, at: 'Section 2.3, p. 23'}
    origin: page-own

  - id: cluster-mass-quiz
    where: 'quiz 2: about 5 × 10¹⁴ M⊙'
    inputs: {s: 800 km/s, R: 1.2 Mpc, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: 3 * s**2 * R / (G * M_sun)
    expected: 5e14
    shown: ['"$3 \\times 800^2 \\times 1200 / 4.30 \\times 10^{-6} \\approx 5.4 \\times 10^{14}\\,M_\\odot$."']
    quiz: 1
    source: {cite: mit, at: 'Section 2.3, p. 23'}
    origin: page-own

  - id: cluster-mass-to-light
    where: 'worked example, step "Mass-to-light ratio": M/L ≈ 110'
    inputs: {M: 5.4e14, L: 5e12}
    formula: M / L
    expected: 110
    shown: ['$M/L \approx 5.4 \times 10^{14} / 5 \times 10^{12} \approx 110$']
    source: {cite: mit, at: 'Section 2.3, p. 23'}
    origin: page-own

  - id: kev-temperature
    where: 'text: about 10⁷ K corresponds to kT of order a keV'
    inputs: {T: 1e7 K, k: 1.380649e-23 J/K}
    formula: k * T
    expected: 0.9 keV
    shown: ['thermal energies $kT$ of order a keV']
    source: {cite: mit, at: 'p. 24'}
    origin: mit

  - id: icm-facts
    kind: fact
    where: 'text and flashcard 3: T ≈ 10⁷ K and central densities around 10⁻³ per cm³'
    value: 1e-3 / cm**3
    shown: ['reaches temperatures of about $10^7$ K and more', 'central densities around $10^{-3}$ particles per cm³', 'Hot gas, $T \\sim 10^7$–$10^8$ K (keV), central density ~$10^{-3}$ cm⁻³']
    source: {cite: mit, at: 'p. 24'}
    origin: mit

  - id: mu-ionised
    kind: fact
    where: 'text: μ ≈ 0.6 for ionised gas'
    value: 0.6
    shown: ['$\mu \approx 0.6$ for ionised gas']
    source: {cite: mit, at: 'Eq. (2.7), p. 25'}
    origin: page-own

  - id: hydro-kev
    where: 'worked example "A cluster weighed by its X-ray gas": 7 × 10⁷ K is about 6 keV'
    inputs: {T: 7e7 K, k: 1.380649e-23 J/K}
    formula: k * T
    expected: 6 keV
    shown: ['$T = 7 \times 10^7$ K (about 6 keV)']
    source: {cite: mit, at: 'Eq. (2.7), p. 25'}
    origin: page-own

  - id: hydro-mass-kg
    where: 'worked example, step "The mass": M ≈ 8.9 × 10⁴⁴ kg'
    inputs: {r: 3.086e22 m, k: 1.381e-23 J/K, T: 7e7 K, G: 6.674e-11 m**3/(kg*s**2), mu: 0.6, mp: 1.673e-27 kg}
    formula: 2 * r * k * T / (G * mu * mp)
    expected: 8.9e44 kg
    shown: ['$ kg $\approx 8.9 \times 10^{44}$ kg']
    source: {cite: mit, at: 'Eq. (2.7), p. 25'}
    origin: page-own

  - id: hydro-mass-msun
    where: 'worked example, step "The mass": ≈ 4.5 × 10¹⁴ M⊙'
    inputs: {M: 8.9e44 kg}
    formula: M / M_sun
    expected: 4.5e14
    shown: ['\approx 4.5 \times 10^{14}\,M_\odot$.']
    source: {cite: mit, at: 'Eq. (2.7), p. 25'}
    origin: page-own

  - id: hydro-sigma
    where: 'worked example, step "The galaxy equivalent": σ = √(kT/(μ m_p)) ≈ 980 km/s'
    inputs: {k: 1.381e-23 J/K, T: 7e7 K, mu: 0.6, mp: 1.673e-27 kg}
    formula: sqrt(k * T / (mu * mp))
    expected: 980 km/s
    shown: ['\approx 980$ km/s']
    source: {cite: mit, at: 'Eqs. (2.7)–(2.8), p. 25'}
    origin: page-own

  - id: summary-cluster-scales
    kind: fact
    where: 'summary: σ ~ 1000 km/s, masses ~10¹⁴–10¹⁵ M⊙, mass-to-light ratios of order 100'
    value: 1000 km/s
    shown: ['Typical clusters have $\sigma \sim 1000$ km/s, masses $\sim 10^{14}$–$10^{15}\,M_\odot$ and mass-to-light ratios of order 100']
    source: {cite: mit, at: 'p. 23, Exercise 2.2, and p. 28'}
    origin: mit

  - id: summary-icm
    kind: fact
    where: 'summary: T ~ 10⁷–10⁸ K, n ~ 10⁻³ cm⁻³'
    value: 1e-3 / cm**3
    shown: ['($T \sim 10^7$–$10^8$ K, $n \sim 10^{-3}$ cm⁻³)']
    source: {cite: mit, at: 'p. 24'}
    origin: mit
