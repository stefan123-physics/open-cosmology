# Calculations on content/year-5/Ferreras/ferreras-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Source: I. Ferreras, Fundamentals of Dark Matter (UCL Press 2025, CC BY-NC 4.0), Exercises 4.1–4.4 (pp. 78, 81, 91, 98).
# The book prints no solutions; every number below is from our own solutions. Problem 1: Omega_m,0 = 0.3, h = 0.7
# (the book's values), m1 = 1e7 Msun, Delta = 330 today and 178 at z = 2 (the book's values, p. 71).
# Problem 2: four masses at (±s, y), (0, y ± s), test particle at the origin; the exact force is also checked as the
# derivative of the summed potential. Problem 3: virial and adiabatic-invariant arguments; the fast case is also checked
# by solving the energy balance numerically. Problem 4: gamma = n + 3, also checked by integrating a Gaussian-damped
# power-law spectrum numerically and measuring the slope of xi between r = 1 and r = 2.
# Constants: G, M_sun from calcs/constants.yaml; Mpc and kpc from pint.

page: content/year-5/Ferreras/ferreras-problem-set-3.mdx
calcs:
  # ---- Problem 1

  - id: p1-h0
    where: 'Problem 1(A), solution: H0 = 70 km/s/Mpc in s^-1'
    inputs: {H0: 70 km/s/Mpc}
    formula: H0
    expected: 2.269e-18 1/s
    shown: ['$= 2.269 \times 10^{-18}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 4.1, p. 78 (our own solution)'}
    origin: page-own

  - id: p1-rhoc-si
    where: 'Problem 1(A), solution: critical density today in kg/m^3'
    inputs: {H0: 70 km/s/Mpc}
    formula: 3*H0**2/(8*pi*G)
    expected: 9.20e-27 kg/m**3
    shown: ['$\rho_{c,0} = 3H_0^2/8\pi G = 9.20 \times 10^{-27}$ kg/m³']
    source: {cite: mit, at: 'Exercise 4.1, p. 78 (our own solution)'}
    origin: page-own

  - id: p1-mpc3
    where: 'Problem 1(A), solution: one Mpc^3 in m^3'
    inputs: {}
    formula: (1*Mpc)**3
    expected: 2.938e67 m**3
    shown: ['$2.938 \times 10^{67}$ m³']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-rhoc
    where: 'Problem 1(A), solution: critical density today in Msun per Mpc^3'
    inputs: {H0: 70 km/s/Mpc}
    formula: 3*H0**2/(8*pi*G) * (1*Mpc)**3 / M_sun
    expected: '1.360e11'
    shown: ['$\rho_{c,0} = 1.360 \times 10^{11}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-rhoc-h2
    where: 'Problem 1(A), check: 2.775e11 h^2 Msun per Mpc^3 with h = 0.7'
    inputs: {H100: 100 km/s/Mpc}
    formula: 3*H100**2/(8*pi*G) * (1*Mpc)**3 / M_sun
    expected: '2.775e11'
    shown: ['$\rho_{c,0} = 2.775 \times 10^{11}\,h^2\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-rhom
    answer: p1-rhom
    where: 'Problem 1(A), answer box: mean matter density today in 1e10 Msun per Mpc^3'
    inputs: {H0: 70 km/s/Mpc}
    formula: 0.3 * 3*H0**2/(8*pi*G) * (1*Mpc)**3 / M_sun / 1e10
    expected: '4.08'
    shown: ['id="p1-rhom"', '$\bar\rho_{m,0} = 0.3\,\rho_{c,0} = 4.08 \times 10^{10}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-rhoh0
    where: 'Problem 1(B), solution: halo density today, Delta = 330'
    inputs: {H0: 70 km/s/Mpc}
    formula: 330 * 0.3 * 3*H0**2/(8*pi*G) * (1*Mpc)**3 / M_sun
    expected: '1.346e13'
    shown: ['$\rho_h = 330 \times 4.08 \times 10^{10} = 1.346 \times 10^{13}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 4.1, with Δ from p. 71 (our own solution)'}
    origin: page-own

  - id: p1-volume-per-particle
    where: 'Problem 1(B), solution: m1/rho_h in Mpc^3'
    inputs: {rh: 1.3463e13}
    formula: 1e7 / rh
    expected: '7.43e-7'
    shown: ['(7.43 \times 10^{-7})^{1/3}$ Mpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-d0
    answer: p1-d0
    where: 'Problem 1(B), answer box: mean particle spacing in a halo forming today, in kpc'
    inputs: {H0: 70 km/s/Mpc}
    formula: (1e7*M_sun / (330 * 0.3 * 3*H0**2/(8*pi*G)))**(1/3) / kpc
    expected: '9.06'
    shown: ['id="p1-d0"', '$= 9.06 \times 10^{-3}$ Mpc $= 9.06$ kpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-dbox
    where: 'Problem 1(B), check: mean spacing in the whole universe, in kpc'
    inputs: {H0: 70 km/s/Mpc}
    formula: (1e7*M_sun / (0.3 * 3*H0**2/(8*pi*G)))**(1/3) / kpc
    expected: '62.6'
    shown: ['$(10^7/4.08 \times 10^{10})^{1/3}$ Mpc $= 62.6$ kpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-cuberoot330
    where: 'Problem 1(B), check: 330^(1/3)'
    inputs: {}
    formula: 330**(1/3)
    expected: '6.91'
    shown: ['$62.6/330^{1/3} = 62.6/6.91 = 9.06$ kpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-d0-by-ratio
    kind: identity
    where: 'Problem 1(B), check: the halo spacing is the mean spacing divided by Delta^(1/3)'
    formula: (m1/(D*rho))**(1/3)
    equals: (m1/rho)**(1/3) / D**(1/3)
    samples:
      m1: [1e7, 3, 0.5]
      D: [330, 178, 200]
      rho: [4.08e10, 1, 7.7]
    tolerance: 1e-9
    shown: ['$62.6/330^{1/3} = 62.6/6.91 = 9.06$ kpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-mw-particles
    where: 'Problem 1(B), check: particles in a 1e12 Msun halo'
    inputs: {}
    formula: 1e12/1e7
    expected: '1e5'
    shown: ['$10^{12}/10^7 = 10^5$ particles']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-mw-radius
    where: 'Problem 1(B), check: radius of a 1e12 Msun halo with Delta = 330, in kpc'
    inputs: {H0: 70 km/s/Mpc}
    formula: (3*1e12*M_sun / (4*pi*330 * 0.3 * 3*H0**2/(8*pi*G)))**(1/3) / kpc
    expected: '261'
    shown: ['$(3 \times 10^{12}/4\pi\rho_h)^{1/3} = 261$ kpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-mw-spacings
    where: 'Problem 1(B), check: halo radius in units of the spacing'
    inputs: {}
    formula: 260.77/9.0563
    expected: '29'
    shown: ['its radius is about 29 spacings']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-rhoh2
    where: 'Problem 1(D), solution: density of a halo that virialised at z = 2 with Delta = 178'
    inputs: {H0: 70 km/s/Mpc}
    formula: 178 * 27 * 0.3 * 3*H0**2/(8*pi*G) * (1*Mpc)**3 / M_sun
    expected: '1.961e14'
    shown: ['$\rho_h = 178 \times 27 \times 4.08 \times 10^{10} = 1.961 \times 10^{14}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 4.1, with Δ from p. 71 (our own solution)'}
    origin: page-own

  - id: p1-density-ratio
    where: 'Problem 1(D), solution: ratio of the two halo densities'
    inputs: {}
    formula: 178*27/330
    expected: '14.6'
    shown: ['14.6 times the density of the halo of part B']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-d2
    answer: p1-d2
    where: 'Problem 1(D), answer box: physical mean particle spacing in a halo from z = 2, in kpc'
    inputs: {H0: 70 km/s/Mpc}
    formula: (1e7*M_sun / (178 * (1+2)**3 * 0.3 * 3*H0**2/(8*pi*G)))**(1/3) / kpc
    expected: '3.71'
    shown: ['id="p1-d2"', '$= 3.71 \times 10^{-3}$ Mpc $= 3.71$ kpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own solution)'}
    origin: page-own

  - id: p1-spacing-ratio
    where: 'Problem 1(D), check: (14.6)^(1/3)'
    inputs: {}
    formula: (178*27/330)**(1/3)
    expected: '2.44'
    shown: ['$(14.6)^{1/3} = 2.44$']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-n
    where: 'Problem 1(E), solution: particles in a (100 Mpc)^3 box'
    inputs: {H0: 70 km/s/Mpc}
    formula: 0.3 * 3*H0**2/(8*pi*G) * (100*Mpc)**3 / (1e7*M_sun)
    expected: '4.08e9'
    shown: ['= 4.08 \times 10^9$']
    source: {cite: mit, at: 'Exercise 4.1 (our own addition)'}
    origin: page-own

  - id: p1-nside
    answer: p1-nside
    where: 'Problem 1(E), answer box: particles along one side, N^(1/3)'
    inputs: {H0: 70 km/s/Mpc}
    formula: (0.3 * 3*H0**2/(8*pi*G) * (100*Mpc)**3 / (1e7*M_sun))**(1/3)
    expected: '1598'
    shown: ['id="p1-nside"', '$N^{1/3} = 1598$']
    source: {cite: mit, at: 'Exercise 4.1 (our own addition)'}
    origin: page-own

  - id: p1-nside-check
    where: 'Problem 1(E), check: N^(1/3) times the mean spacing is the box side, in Mpc'
    inputs: {}
    formula: 1597.9 * 62.583 / 1000
    expected: '100'
    shown: ['$1598 \times 62.6$ kpc $= 100$ Mpc']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  - id: p1-n2
    where: 'Problem 1(E), check: N^2 pair forces per step'
    inputs: {}
    formula: 4.0798e9**2
    expected: '1.7e19'
    shown: ['$N^2 \approx 1.7 \times 10^{19}$']
    source: {cite: mit, at: 'Exercise 4.1 (our own check)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-exact-by-potential
    kind: identity
    answer: p2-exact
    where: 'Problem 2(A), answer box: the exact force against the derivative of the summed potential at the test particle'
    formula: 1/(y - s)**2 + 1/(y + s)**2 + 2*y/(y**2 + s**2)**(3/2)
    equals: deriv('1/(y - s - q) + 1/(y + s - q) + 2/sqrt(s**2 + (y - q)**2)', 'q', 0)
    samples:
      y: [3, 6, 4.4, 5.1]
      s: [0.3, 1, 0.65, 0.9]
    tolerance: 1e-6
    shown: ['\frac{F_\text{exact}}{G\,m\,m_t} = \frac{1}{(y - s)^2} + \frac{1}{(y + s)^2} + \frac{2y}{\left(y^2 + s^2\right)^{3/2}}']
    source: {cite: mit, at: 'Exercise 4.2, p. 81 (our own solution)'}
    origin: page-own

  - id: p2-c
    answer: p2-c
    where: 'Problem 2(B), answer box: coefficient C of (s/y)^2, as the limit of (relative error)/(s/y)^2 for small s/y'
    inputs: {}
    formula: ((1/(1 - 1e-3)**2 + 1/(1 + 1e-3)**2 + 2/(1 + 1e-6)**1.5)/4 - 1) / 1e-6
    expected: '0.75'
    tolerance: 1e-5
    shown: ['id="p2-c"', '$C = 0.75$']
    source: {cite: mit, at: 'Exercise 4.2, p. 81 (our own solution)'}
    origin: page-own

  - id: p2-expansion
    kind: identity
    where: 'Problem 2(B), formula "Exact force for a distant group": 4 + 3x^2 up to terms in x^4 (checked at small x)'
    formula: 4 + 3*x**2
    equals: (1/(1 - x)**2 + 1/(1 + x)**2 + 2/(1 + x**2)**1.5)
    samples:
      x: [1e-3, 2e-3, 5e-4]
    tolerance: 1e-10
    shown: ['\left[4 + 3\left(\frac{s}{y}\right)^2 + \dots\right]']
    source: {cite: mit, at: 'Exercise 4.2, p. 81 (our own solution)'}
    origin: page-own

  - id: p2-terms-1
    where: 'Problem 2(C), solution: 1/16'
    inputs: {}
    formula: 1/16
    expected: '0.06250'
    shown: ['$1/16 = 0.06250$']
    source: {cite: mit, at: 'Exercise 4.2 (our own solution)'}
    origin: page-own

  - id: p2-terms-2
    where: 'Problem 2(C), solution: 1/36'
    inputs: {}
    formula: 1/36
    expected: '0.02778'
    shown: ['$1/36 = 0.02778$']
    source: {cite: mit, at: 'Exercise 4.2 (our own solution)'}
    origin: page-own

  - id: p2-terms-3
    where: 'Problem 2(C), solution: 26^(3/2) and 10/26^(3/2)'
    inputs: {}
    formula: 10/26**1.5
    expected: '0.07543'
    shown: ['$2 \times 5/26^{3/2} = 10/132.57 = 0.07543$']
    source: {cite: mit, at: 'Exercise 4.2 (our own solution)'}
    origin: page-own

  - id: p2-terms-26
    where: 'Problem 2(C), solution: 26^(3/2)'
    inputs: {}
    formula: 26**1.5
    expected: '132.57'
    shown: ['10/132.57']
    source: {cite: mit, at: 'Exercise 4.2 (our own solution)'}
    origin: page-own

  - id: p2-sum
    where: 'Problem 2(C), solution: the sum of the three terms'
    inputs: {}
    formula: 1/16 + 1/36 + 10/26**1.5
    expected: '0.16571'
    shown: ['The sum is $0.16571$']
    source: {cite: mit, at: 'Exercise 4.2 (our own solution)'}
    origin: page-own

  - id: p2-y5
    answer: p2-y5
    where: 'Problem 2(C), answer box: exact relative error at y = 5s, in percent'
    inputs: {}
    formula: 100*((1/16 + 1/36 + 10/26**1.5)/(4/25) - 1)
    expected: '3.57'
    shown: ['id="p2-y5"', '$0.16571/0.16 - 1 = 0.0357$: 3.57%']
    source: {cite: mit, at: 'Exercise 4.2 (our own solution)'}
    origin: page-own

  - id: p2-y5-leading
    where: 'Problem 2(C), check: leading-order error at y = 5s, in percent'
    inputs: {}
    formula: 0.75/25
    expected: '0.030'
    shown: ['$0.75/25 = 0.030$, or 3.0%']
    source: {cite: mit, at: 'Exercise 4.2 (our own check)'}
    origin: page-own

  - id: p2-angle5
    where: 'Problem 2(C), check: angle 2s/y = 0.4 rad in degrees'
    inputs: {}
    formula: 0.4*180/pi
    expected: '23'
    shown: ['$2s/y = 0.4$ radian (23°)']
    source: {cite: mit, at: 'Exercise 4.2 (our own check)'}
    origin: page-own

  - id: p2-first-guess
    where: 'Problem 2(D), solution: leading-order y/s for 1% error'
    inputs: {}
    formula: sqrt(75)
    expected: '8.66'
    shown: ['$y/s = \sqrt{75} = 8.66$']
    source: {cite: mit, at: 'Exercise 4.2 (our own addition)'}
    origin: page-own

  - id: p2-error-at-guess
    where: 'Problem 2(D), solution: exact error at y/s = 8.66, in percent'
    inputs: {}
    formula: 100*((1/(sqrt(75) - 1)**2 + 1/(sqrt(75) + 1)**2 + 2*sqrt(75)/(75 + 1)**1.5)/(4/75) - 1)
    expected: '1.06'
    shown: ['At $y/s = 8.66$ the exact error is 1.06%']
    source: {cite: mit, at: 'Exercise 4.2 (our own addition)'}
    origin: page-own

  - id: p2-open
    answer: p2-open
    where: 'Problem 2(D), answer box: y/s at which the exact relative error is 1%'
    inputs: {}
    formula: solve('(1/(q - 1)**2 + 1/(q + 1)**2 + 2*q/(q**2 + 1)**1.5)*q**2/4 - 1.01', 'q', 3, 30)
    expected: '8.91'
    shown: ['id="p2-open"', 'gives $y/s = 8.91$']
    source: {cite: mit, at: 'Exercise 4.2 (our own addition)'}
    origin: page-own

  - id: p2-angle-open
    where: 'Problem 2(D), check: angle 2s/y at y/s = 8.91, in rad and degrees'
    inputs: {}
    formula: 2/8.909*180/pi
    expected: '13'
    shown: ['$2s/y = 0.22$ radian (13°)']
    source: {cite: mit, at: 'Exercise 4.2 (our own check)'}
    origin: page-own

  - id: p2-angle-open-rad
    where: 'Problem 2(D), check: angle 2s/y at y/s = 8.91, in rad'
    inputs: {}
    formula: 2/8.909
    expected: '0.22'
    shown: ['$2s/y = 0.22$ radian']
    source: {cite: mit, at: 'Exercise 4.2 (our own check)'}
    origin: page-own

  # ---- Problem 3

  - id: p3-fast-by-energy
    kind: identity
    answer: p3-fast
    where: 'Problem 3(C), answer box: R_f/R_i after a sudden loss, against a numerical solution of the energy balance (G = c = M_i = R_i = 1)'
    formula: (1 - f)/(1 - 2*f)
    equals: solve('(1 - f)*1/2 - (1 - f)**2 + (1 - f)**2/(2*q)', 'q', 0.5, 100)
    samples:
      f: [0.05, 0.2, 0.33, 0.4]
    tolerance: 1e-6
    shown: ['\frac{R_f}{R_i} = \frac{1 - f}{1 - 2f}']
    source: {cite: mit, at: 'Exercise 4.3, p. 91 (our own solution)'}
    origin: page-own

  - id: p3-fast-book
    kind: identity
    where: 'Problem 3(A), formula "Size after a sudden loss": R_i/R_f = 2 - alpha, from E = -c G M_f^2/(2 R_f)'
    formula: 2 - a
    equals: 1/solve('a/2 - 1 + 1/(2*q)', 'q', 0.01, 1000)
    samples:
      a: [1.05, 1.25, 1.5, 1.9]
    tolerance: 1e-6
    shown: ['\frac{R_i}{R_f} = 2 - \alpha']
    source: {cite: mit, at: 'Exercise 4.3, p. 91'}
    origin: page-own

  - id: p3-slow-ineq
    kind: identity
    where: 'Problem 3(B), solution: alpha (2 - alpha) = 1 - (alpha - 1)^2'
    formula: a*(2 - a)
    equals: 1 - (a - 1)**2
    samples:
      a: [1.05, 1.25, 1.5, 3]
    tolerance: 1e-12
    shown: ['$\alpha(2 - \alpha) = 1 - (\alpha - 1)^2 < 1$']
    source: {cite: mit, at: 'Exercise 4.3 (our own solution)'}
    origin: page-own

  - id: p3-alpha15
    where: 'Problem 3(A), check: losing a third of the mass doubles the size'
    inputs: {}
    formula: 1/(2 - 1.5)
    expected: '2'
    shown: ['Losing a third of the mass ($\alpha = 1.5$) already doubles the size']
    source: {cite: mit, at: 'Exercise 4.3 (our own check)'}
    origin: page-own

  - id: p3-alpha
    where: 'Problem 3(D), solution: alpha for f = 0.2'
    inputs: {}
    formula: 1/(1 - 0.5*0.4)
    expected: '1.25'
    shown: ['$\alpha = 1/0.8 = 1.25$']
    source: {cite: mit, at: 'Exercise 4.3 (our own addition)'}
    origin: page-own

  - id: p3-dm-fast
    answer: p3-dm-fast
    where: 'Problem 3(D), answer box: R_f/R_i after a sudden loss of half the baryons (40% of the mass)'
    inputs: {}
    formula: 1/(2 - 1/(1 - 0.5*0.4))
    expected: '1.333'
    shown: ['id="p3-dm-fast"', 'Sudden: $R_f/R_i = 0.8/0.6 = 1.333$']
    source: {cite: mit, at: 'Exercise 4.3 (our own addition)'}
    origin: page-own

  - id: p3-dm-slow
    answer: p3-dm-slow
    where: 'Problem 3(D), answer box: R_f/R_i after a slow loss of half the baryons'
    inputs: {}
    formula: 1/(1 - 0.5*0.4)
    expected: '1.25'
    shown: ['id="p3-dm-slow"', 'Slow: $R_f/R_i = 1/0.8 = 1.25$']
    source: {cite: mit, at: 'Exercise 4.3 (our own addition)'}
    origin: page-own

  # ---- Problem 4

  - id: p4-gamma-by-integration
    kind: identity
    answer: p4-gamma
    where: 'Problem 4(B), answer box: gamma = n + 3, against the slope of xi between r = 1 and r = 2 for a Gaussian-damped spectrum k^n exp(-(k/50)^2), integrated numerically'
    formula: n + 3
    equals: -log(integrate('q**(n + 2)*exp(-(q/50)**2)*sin(2*q)/(2*q)', 'q', 0, 400)/integrate('q**(n + 2)*exp(-(q/50)**2)*sin(q)/q', 'q', 0, 400))/log(2)
    samples:
      n: [-2, -1.5, -1.2]
    tolerance: 3e-3
    shown: ['\;\propto\; r^{-(n+3)}']
    source: {cite: mit, at: 'Exercise 4.4, p. 98 (our own solution)'}
    origin: page-own

  - id: p4-dirichlet
    where: 'Problem 4(B), solution: the integral of sin(u)/u from 0 to infinity is pi/2 (computed with a Gaussian damping exp(-(u/200)^2), which changes it by far less than the tolerance)'
    inputs: {}
    formula: integrate('sin(q)/q*exp(-(q/200)**2)', 'q', 1e-9, 1600)
    expected: '1.5708'
    tolerance: 1e-4
    shown: ['$\int_0^\infty \sin u/u\,du = \pi/2$']
    source: {cite: mit, at: 'Exercise 4.4 (our own solution)'}
    origin: page-own

  - id: p4-n
    answer: p4-n
    where: 'Problem 4(C), answer box: n = gamma - 3 for gamma = 1.8'
    inputs: {}
    formula: 1.8 - 3
    expected: '-1.2'
    shown: ['id="p4-n"', '$n = \gamma - 3 = 1.8 - 3 = -1.2$']
    source: {cite: mit, at: 'Exercise 4.4 (our own solution)'}
    origin: page-own

  - id: p4-ratio
    where: 'Problem 4(D), solution: xi_g/xi_DM = (5/4)^1.8'
    inputs: {}
    formula: (5/4)**1.8
    expected: '1.494'
    shown: ['(5/4)^{1.8} = 1.494$']
