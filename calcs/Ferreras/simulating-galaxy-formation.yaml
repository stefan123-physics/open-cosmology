# Calculations on content/year-5/Ferreras/simulating-galaxy-formation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 4.1–4.4.

page: content/year-5/Ferreras/simulating-galaxy-formation.mdx
calcs:
  - id: eagle-particle
    kind: fact
    where: 'text and summary: EAGLE, 100 Mpc box, dark matter particles of 9.7 × 10⁶ M⊙'
    value: 9.7e6
    shown: ['in a cube 100 Mpc on a side, each dark matter particle has a mass of $9.7 \times 10^6\,M_\odot$', '(EAGLE: $9.7 \times 10^6\,M_\odot$ each)']
    source: {cite: mit, at: 'p. 77'}
    origin: mit

  - id: simulation-scales
    kind: fact
    where: 'text: from about 100 kpc to about a gigaparsec; best resolution about 100 pc; boxes about 100 Mpc'
    value: 100 pc
    shown: ['from a single galaxy''s halo (about 100 kpc) to cosmological volumes (about a gigaparsec)', 'The best cosmological simulations reach about 100 pc', 'force resolution (today about 100 pc at best)', 'force resolution reaches about 100 pc', 'typically about 100 Mpc across with **periodic boundaries**', 'rarer than about one per (100 Mpc)³', 'below the resolution of about 100 pc', 'in a periodic box of about 100 Mpc']
    source: {cite: mit, at: 'pp. 77–81'}
    origin: mit

  - id: barnes-hut-1986
    kind: fact
    where: 'text: Barnes and Hut, 1986'
    value: 1986
    shown: ['(Barnes and Hut, 1986)']
    source: {cite: mit, at: 'p. 79'}
    origin: mit

  - id: direct-sum-ops
    where: 'worked example "Why trees matter", step 1: N² = 10²⁰'
    inputs: {N: 1e10}
    formula: N**2
    expected: 1e20
    shown: ['$N^2 = 10^{20}$ interactions per step']
    source: {cite: mit, at: 'Eq. (4.3), p. 78'}
    origin: page-own

  - id: tree-ops
    where: 'worked example, step 2: N log₂ N ≈ 10¹⁰ × 33 ≈ 3.3 × 10¹¹'
    inputs: {N: 1e10}
    formula: N * log(N) / log(2)
    expected: 3.3e11
    shown: ['$N\log_2 N \approx 10^{10} \times 33 \approx 3.3 \times 10^{11}$ operations']
    source: {cite: mit, at: 'p. 79'}
    origin: page-own

  - id: tree-speedup
    where: 'worked example, step 2: about 300 million times fewer'
    inputs: {a: 1e20, b: 3.3e11}
    formula: a / b
    expected: 3e8
    shown: ['about 300 million times fewer']
    source: {cite: mit, at: 'p. 79'}
    origin: page-own

  - id: direct-sum-day
    where: 'worked example, step 3: at 10¹⁵ operations per second, about a day per step'
    inputs: {ops: 1e20, rate: 1e15 / s}
    formula: ops / rate
    expected: 1 day
    shown: ['Even at $10^{15}$ operations per second, direct summation would need about a day per step']
    source: {cite: mit, at: 'p. 79'}
    origin: page-own

  - id: sf-threshold
    kind: fact
    where: 'text: Schmidt–Kennicutt n ≈ 1–2 and threshold about 10 M⊙ per pc²'
    value: 10
    shown: ['with $n \approx 1$–2 and an efficiency', 'above a threshold surface density of about $10\,M_\odot$ per pc²']
    source: {cite: mit, at: 'p. 86'}
    origin: mit

  - id: supernova-facts
    kind: fact
    where: 'text and summary: massive stars live 1–30 Myr; each supernova releases about 10⁵¹ erg; one supernova per 100 M⊙ of stars'
    value: 1e51 erg
    shown: ['The most massive stars live only 1–30 Myr', 'each releasing about $10^{51}$ erg', 'supernova feedback (about $10^{51}$ erg each)', 'with one supernova for every $100\,M_\odot$ of stars formed']
    source: {cite: mit, at: 'p. 87'}
    origin: mit

  - id: dwarf-binding-energy
    where: 'worked example "Can supernovae unbind a dwarf galaxy''s gas?", step 1: GM²/R ≈ 4.3 × 10⁴⁸ J'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 1.99e39 kg, R: 6.17e19 m}
    formula: G * M**2 / R
    expected: 4.3e48 J
    shown: ['$ J $\approx 4.3 \times 10^{48}$ J $= 4.3 \times 10^{55}$ erg']
    source: {cite: mit, at: 'p. 87, "How about ...?"'}
    origin: page-own

  - id: dwarf-mass-kg
    where: 'worked example, step 1: 10⁹ M⊙ = 1.99 × 10³⁹ kg, 2 kpc = 6.17 × 10¹⁹ m'
    inputs: {R: 2 kpc}
    formula: R
    expected: 6.17e19 m
    shown: ['(1.99 \times 10^{39})^2 / (6.17 \times 10^{19})$']
    source: {cite: mit, at: 'p. 87'}
    origin: page-own

  - id: dwarf-supernovae
    where: 'worked example, step 2: 5 × 10⁷ M⊙ of stars gives 5 × 10⁵ supernovae and 5 × 10⁵⁶ erg'
    inputs: {Ms: 5e7, E: 1e51 erg}
    formula: Ms / 100 * E
    expected: 5e56 erg
    shown: ['$5 \times 10^7\,M_\odot$ of stars gives $5 \times 10^5$ supernovae, releasing $5 \times 10^{56}$ erg in total']
    source: {cite: mit, at: 'p. 87'}
    origin: page-own

  - id: dwarf-efficiency
    where: 'worked example, step 3: only about 9% of the energy is needed'
    inputs: {W: 4.3e55, E: 5e56}
    formula: 100 * W / E
    expected: 9
    shown: ['Only about 9% of that energy needs to couple']
    source: {cite: mit, at: 'p. 87'}
    origin: page-own

  - id: bigger-galaxy-binding
    where: 'worked example, step 3: a galaxy a hundred times more massive (same radius) has ten thousand times the binding energy'
    formula: 100**2
    expected: 10000
    shown: ['of the same size, would be bound ten thousand times more strongly']
    source: {cite: mit, at: 'p. 87'}
    origin: page-own

  - id: agn-efficiency
    kind: fact
    where: 'text: up to about 10% of rest-mass energy; ε_r ≈ 0.1; seeds about 10⁵ M⊙'
    value: 0.1
    shown: ['up to about 10% of the infalling rest-mass energy', '$\varepsilon_r = L/(\dot M_\text{BH}c^2) \approx 0.1$', 'plant **seed** black holes (about $10^5\,M_\odot$)']
    source: {cite: mit, at: 'pp. 88–90'}
    origin: mit

  - id: radius-of-influence
    where: 'text: GM_BH/c∞² ≈ 0.05 kpc for 10⁷ M⊙ and 30 km/s'
    inputs: {G: 6.6743e-11 m**3/(kg*s**2), c: 30 km/s}
    formula: G * 1e7 * M_sun / c**2
    expected: 0.05 kpc
    shown: ['is only about 0.05 kpc for $M_\text{BH} = 10^7\,M_\odot$ and $c_\infty = 30$ km/s']
    source: {cite: mit, at: 'pp. 88–89'}
    origin: mit

  - id: salpeter-time-quiz
    where: 'quiz 4: the e-folding time is about 45 million years'
    inputs: {e: 0.1, sT: 6.652e-29 m**2, c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), mp: 1.673e-27 kg}
    formula: e * sT * c / (4 * pi * G * mp)
    expected: 45 megayear
    shown: ['(4\\pi \\times 6.674 \\times 10^{-11} \\times 1.673 \\times 10^{-27})$ s ≈ 45 million years']
    source: {cite: mit, at: 'Eq. (4.12), p. 90'}
    origin: page-own

  - id: salpeter-time-quiz-choice
    where: 'quiz 4: marked choice "About 45 million years"'
    inputs: {e: 0.1, sT: 6.652e-29 m**2, c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), mp: 1.673e-27 kg, u: 1 megayear}
    formula: e * sT * c / (4 * pi * G * mp) / u * 1e6
    expected: 45e6
    shown: ['"About 45 thousand years", "About 45 million years"']
    quiz: 3
    source: {cite: mit, at: 'Eq. (4.12), p. 90'}
    origin: page-own

  - id: salpeter-time-seconds
    where: 'worked example "How fast can a black hole grow?", step 1: t_E ≈ 1.4 × 10¹⁵ s ≈ 45 Myr'
    inputs: {e: 0.1, sT: 6.652e-29 m**2, c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), mp: 1.673e-27 kg}
    formula: e * sT * c / (4 * pi * G * mp)
    expected: 1.4e15 s
    shown: ['s $\approx 1.4 \times 10^{15}$ s $\approx 45$ Myr']
    source: {cite: mit, at: 'Eq. (4.12), p. 90'}
    origin: page-own

  - id: salpeter-time-flashcard
    where: 'flashcard 3 and summary: e-folding time ≈ 45 Myr'
    inputs: {e: 0.1, sT: 6.652e-29 m**2, c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), mp: 1.673e-27 kg}
    formula: e * sT * c / (4 * pi * G * mp)
    expected: 45 megayear
    shown: ['e-folding time ≈ 45 Myr for', '(e-folding time about 45 Myr)']
    source: {cite: mit, at: 'Eq. (4.12), p. 90'}
    origin: page-own

  - id: growth-efolds
    where: 'worked example, step 2: ln(10⁴) ≈ 9.2 e-foldings, about 415 Myr'
    formula: log(1e4)
    expected: 9.2
    shown: ['$\ln(10^4) \approx 9.2$ e-foldings']
    source: {cite: mit, at: 'Eq. (4.12), p. 90'}
    origin: page-own

  - id: growth-time
    where: 'worked example, step 2: about 415 Myr'
    inputs: {t: 45.04 megayear}
    formula: t * log(1e4)
    expected: 415 megayear
    shown: ['about 415 Myr of uninterrupted']
    source: {cite: mit, at: 'Eq. (4.12), p. 90'}
    origin: page-own

  - id: tng-star-particles
    kind: fact
    where: 'text: IllustrisTNG star particles of 10⁵–10⁷ M⊙; dust under one per cent; cosmic rays about 1 GeV'
    value: 1e7
    shown: ['(in IllustrisTNG, $10^5$–$10^7\,M_\odot$)', 'Dust, under one per cent of the interstellar mass', '(typical energies about 1 GeV)']
    source: {cite: mit, at: 'pp. 91–93'}
    origin: mit
