# Calculations on content/year-5/Ferreras/weak-lensing-and-machos.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Section 2.6 (weak lensing, microlensing).

page: content/year-5/Ferreras/weak-lensing-and-machos.mdx
calcs:
  - id: shear-galaxies-needed
    where: 'worked example "How many galaxies to see a shear?", step "Require a 3σ signal": √N ≥ 45, N ≈ 2000'
    inputs: {e: 0.3, g: 0.02}
    formula: (3 * e / g)**2
    expected: 2000
    shown: ['$\sqrt N \geq 45$, so $N \approx 2000$ galaxies']
    source: {cite: mit, at: 'pp. 44–45'}
    origin: page-own

  - id: shear-sqrt-n
    where: 'worked example, step "Require a 3σ signal": √N ≥ 45'
    inputs: {e: 0.3, g: 0.02}
    formula: 3 * e / g
    expected: 45
    shown: ['$0.02 \geq 3 \times 0.3/\sqrt N$ gives']
    source: {cite: mit, at: 'pp. 44–45'}
    origin: page-own

  - id: intrinsic-ellipticity
    kind: fact
    where: 'worked example (problem) and quiz 1: intrinsic ellipticities scattered by about 0.3; a shear of 0.02'
    value: 0.3
    shown: ['scattered with a standard deviation of about 0.3', 'Galaxies have intrinsic ellipticities of about 0.3; a shear of 0.02']
    source: {cite: mit, at: 'p. 44'}
    origin: page-own

  - id: kaiser-squires-1993
    kind: fact
    where: 'text: Kaiser and Squires (1993)'
    value: 1993
    shown: ['**Kaiser and Squires** (1993)']
    source: {cite: mit, at: 'p. 44'}
    origin: mit

  - id: bullet-redshift
    kind: fact
    where: 'section "The Bullet Cluster": 1E 0657−558 at redshift 0.296'
    value: 0.296
    shown: ['1E 0657−558 at redshift 0.296']
    source: {cite: mit, at: 'p. 46, Figure 2.11'}
    origin: mit

  - id: kaiser-squires-identity
    kind: identity
    where: 'formula "Kaiser–Squires inversion": with γ̂₁ = (k₁² − k₂²)/k² κ̂ and γ̂₂ = 2k₁k₂/k² κ̂, the inversion returns κ̂'
    formula: ((k1**2 - k2**2) * ((k1**2 - k2**2) / (k1**2 + k2**2) * K) + 2 * k1 * k2 * (2 * k1 * k2 / (k1**2 + k2**2) * K)) / (k1**2 + k2**2)
    equals: K
    samples: {k1: [1, 0.3, -2], k2: [0.5, 2, 1.5], K: [1, -0.7, 3]}
    shown: ['\Longrightarrow\quad \hat\kappa = \frac{(k_1^2 - k_2^2)\,\hat\gamma_1 + 2k_1k_2\,\hat\gamma_2}{k^2}']
    source: {cite: mit, at: 'Eq. (2.35), p. 45'}
    origin: page-own

  - id: mu-at-one
    where: 'text and quiz 3: μ(1) = 3/√5 ≈ 1.34'
    formula: (1 + 2) / (1 * sqrt(1 + 4))
    expected: 1.34
    shown: ['$3/\sqrt5 \approx 1.34$, a brightening', 'By a factor of about 1.34, or 0.32 magnitudes', 'gives $3/\\sqrt5 \\approx 1.34$ at $u = 1$', '$\\mu(1) \\approx 1.34$']
    source: {cite: mit, at: 'Eq. (2.36), p. 47'}
    origin: mit

  - id: mu-at-one-quiz
    where: 'quiz 3: marked choice "about 1.34"'
    formula: (1 + 2) / (1 * sqrt(1 + 4))
    expected: 1.34
    shown: ['"By a factor of 2", "By a factor of 10"]']
    quiz: 2
    source: {cite: mit, at: 'Eq. (2.36), p. 47'}
    origin: mit

  - id: mu-at-one-mag
    where: 'text: a brightening of 0.32 magnitudes'
    formula: 2.5 * log10(3 / sqrt(5))
    expected: 0.32
    shown: ['a brightening of 0.32 magnitudes']
    source: {cite: mit, at: 'p. 47'}
    origin: mit

  - id: einstein-radius-macho
    where: 'worked example "How long does a microlensing event last?", step 1: r_E ≈ 8.5 × 10¹¹ m ≈ 5.7 AU'
    inputs: {G: 6.6743e-11 m**3/(kg*s**2), c: 2.998e8 m/s, DL: 10 kpc, DLS: 40 kpc, DS: 50 kpc}
    formula: sqrt(4 * G * 0.5 * M_sun / c**2 * DL * DLS / DS)
    expected: 8.5e11 m
    shown: ['$r_E \approx 8.5 \times 10^{11}$ m']
    source: {cite: mit, at: 'pp. 47–48'}
    origin: page-own

  - id: einstein-radius-macho-au
    where: 'worked example, step 1: ≈ 5.7 AU'
    inputs: {r: 8.54e11 m}
    formula: r
    expected: 5.7 au
    shown: ['m $\approx 5.7$ AU']
    source: {cite: mit, at: 'pp. 47–48'}
    origin: page-own

  - id: macho-time
    where: 'worked example, step "Timescale": t_E ≈ 4.3 × 10⁶ s, about 49 days'
    inputs: {r: 8.5e11 m, v: 2e5 m/s}
    formula: r / v
    expected: 4.3e6 s
    shown: ['\approx 4.3 \times 10^6$ s, about 49 days']
    source: {cite: mit, at: 'p. 48'}
    origin: page-own

  - id: macho-time-days
    where: 'worked example, step "Timescale": about 49 days'
    inputs: {r: 8.54e11 m, v: 2e5 m/s}
    formula: r / v
    expected: 49 day
    shown: ['s, about 49 days']
    source: {cite: mit, at: 'p. 48'}
    origin: page-own

  - id: planet-time
    where: 'worked example, step "Other masses": a 10⁻⁶ M⊙ body gives about 1.7 hours'
    inputs: {t: 49.4 day}
    formula: t * sqrt(1e-6 / 0.5)
    expected: 1.7 hour
    shown: ['a $10^{-6}\,M_\odot$ body gives about 1.7 hours']
    source: {cite: mit, at: 'p. 49'}
    origin: page-own

  - id: bh-time
    where: 'worked example, step "Other masses": a 30 M⊙ black hole about 380 days'
    inputs: {t: 49.4 day}
    formula: t * sqrt(30 / 0.5)
    expected: 380 day
    shown: ['a 30 $M_\odot$ black hole about 380 days']
    source: {cite: mit, at: 'p. 49'}
    origin: page-own

  - id: optical-depth-integral
    kind: identity
    where: 'formula "Microlensing optical depth": (4πGρ/c²)∫₀^D x(D − x)/D dx = (2πGρ/3c²) D²'
    formula: 4 * pi * integrate('x * (D0 - x) / D0', 'x', 0, D0)
    equals: 2 * pi / 3 * D0**2
    samples: {D0: [1, 2.5, 7]}
    shown: ['= \frac{2\pi G\rho}{3c^2}\,D_S^2']
    source: {cite: mit, at: 'Eq. (2.37), p. 48'}
    origin: mit

  - id: optical-depth-lmc
    where: 'text: halo density 0.01 M⊙/pc³ to the LMC (50 kpc) gives τ ≈ 2.5 × 10⁻⁶'
    inputs: {G: 6.6743e-11 m**3/(kg*s**2), c: 2.998e8 m/s, rho: 0.01 / pc**3, D: 50 kpc}
    formula: 2 * pi * G * rho * M_sun * D**2 / (3 * c**2)
    expected: 2.5e-6
    shown: ['$\tau \approx 2.5 \times 10^{-6}$']
    source: {cite: mit, at: 'Eq. (2.37), p. 48'}
    origin: page-own

  - id: macho-survey
    kind: fact
    where: 'text, quiz 4 and its explanation: about 12 million stars for six years, 13–17 events, 10–30% in 0.1–1 M⊙ (Alcock et al. 2000)'
    value: 12e6
    shown: ['monitored about 12 million stars for six years and found 13 to 17 microlensing events', 'halo, of order 10–30%, and **rules out a halo made entirely of them**', 'after monitoring about 12 million stars for six years', 'They found only 13–17 events', '"Compact objects of 0.1–1 $M_\\odot$ make up']
    source: {cite: mit, at: 'p. 49, Figure 2.12 (Alcock et al. 2000)'}
    origin: mit

  - id: halo-speed
    kind: fact
    where: 'text: typical halo speed about 200 km/s; masses 10⁻⁶ to a few M⊙ give hours to months'
    value: 200 km/s
    shown: ['at a typical halo speed of about 200 km/s', 'for masses from $10^{-6}$ to a few solar masses']
    source: {cite: mit, at: 'p. 48'}
    origin: mit

  - id: pbh-limit
    kind: fact
    where: 'text: Ferreras gives about 10¹¹ kg as the lower mass of primordial black holes'
    value: 1e11 kg
    shown: ['Ferreras gives about $10^{11}$ kg']
    source: {cite: mit, at: 'p. 49'}
    origin: mit
