    origin: page-own

  - id: e2-it2
    where: 'Exercise 6.2(A): second iteration x = 25.26 + ln(26.87)/2'
    inputs: {}
    formula: '25.26 + 0.5*log(26.87)'
    expected: '26.91'
    shown: ['then $26.91$, and the root']
