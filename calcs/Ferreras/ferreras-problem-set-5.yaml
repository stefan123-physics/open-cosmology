# Calculations on content/year-5/Ferreras/ferreras-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Source: I. Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Chapters 6-8, Exercises 6.1-6.4, 7.1-7.3, 8.1.
# The book prints no solutions; every solution here is ours. `cite: mit` means the book (textbook course).
# Book values: T_gamma,0 = 2.73 K (p. 142), Omega_gamma h^2 = 2.5e-5 and H0 = 70 (Ex. 6.1), m_Pl = 1.22e19 GeV (p. 117),
# rho_0 = 0.3 GeV/cm^3, sigma = 1e-44 cm^2, m = 100 GeV (Ex. 6.3), a0 ~ 1e-10 m/s^2 (p. 160), NGC 2403 speeds (Ex. 7.2).
# Our choices: alpha = 0.01, g = 2, g* = 100 (Ex. 6.2); Omega_m = 0.3, 18 pi^2, z_c = 1, M = 1e12 M_sun, c = 10 (Ex. 6.3);
# v = 230 km/s (Ex. 6.3, 6.4); xenon A = 131 with 0.93149410242 GeV per u (CODATA 2018); 5 keV threshold; w = -0.8.

page: content/year-5/Ferreras/ferreras-problem-set-5.mdx
calcs:
  # ---------------------------------------------------------------- Exercise 6.1
  - id: e1-kt0
    where: 'Exercise 6.1(A): k T_gamma,0 for 2.73 K, in eV'
    inputs: {T0: 2.73 K}
    formula: 'k_B*T0/eV'
    expected: '2.353e-4'
    shown: ['$kT_{\gamma,0} = k_B \times 2.73$ K $= 2.353 \times 10^{-4}$ eV']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own solution)'}
    origin: page-own

  - id: e1-a
    where: 'Exercise 6.1(A): scale factor at 1 MeV, a = kT0/(1 MeV)'
    inputs: {T0: 2.73 K}
    formula: 'k_B*T0/MeV'
    expected: '2.353e-10'
    shown: ['at 1 MeV the scale factor was $a = 2.353 \times 10^{-10}$']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own solution)'}
    origin: page-own

  - id: e1-h100
    where: 'Exercise 6.1(A): 100 km/s/Mpc in 1/s'
    inputs: {H: 100 km/s/Mpc}
    formula: 'H*second'
    expected: '3.2408e-18'
    shown: ['= 3.2408 \times 10^{-18}\ \text{s}^{-1} \times 0.005']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own solution)'}
    origin: page-own

  - id: e1-hrad
    where: 'Exercise 6.1(A): H0 sqrt(Omega_gamma) = 100 km/s/Mpc sqrt(2.5e-5), in 1/s'
    inputs: {H: 100 km/s/Mpc}
    formula: 'H*sqrt(2.5e-5)*second'
    expected: '1.620e-20'
    shown: ['\times 0.005 = 1.620 \times 10^{-20}$ s⁻¹. Then']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own solution)'}
    origin: page-own

  - id: e1-t
    answer: e1-t
    where: 'Exercise 6.1(A), answer box: age at kT = 1 MeV, photons only, a = T0/T'
    inputs: {T0: 2.73 K, H: 100 km/s/Mpc}
    formula: '(k_B*T0/MeV)**2/(2*H*sqrt(2.5e-5))'
    expected: '1.71 s'
    shown: ['id="e1-t"', '= 1.71$ s.']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own solution)'}
    origin: page-own

  - id: e1-omg
    where: 'Exercise 6.1(A), check: Omega_gamma = 2.5e-5/0.49'
    inputs: {}
    formula: '2.5e-5/0.7**2'
    expected: '5.10e-5'
    shown: ['$\Omega_{\gamma,0} = 2.5 \times 10^{-5}/0.49 = 5.10 \times 10^{-5}$']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own check)'}
    origin: page-own

  - id: e1-h0s
    where: 'Exercise 6.1(A), check: H0 = 70 km/s/Mpc in 1/s'
    inputs: {H0: 70 km/s/Mpc}
    formula: 'H0*second'
    expected: '2.2685e-18'
    shown: ['$H_0 = 2.2685 \times 10^{-18}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own check)'}
    origin: page-own

  - id: e1-hrad-check
    where: 'Exercise 6.1(A), check: H0 sqrt(Omega_gamma) with h = 0.7 taken apart, the same'
    inputs: {H0: 70 km/s/Mpc}
    formula: 'H0*sqrt(2.5e-5/0.7**2)*second'
    expected: '1.620e-20'
    shown: ['give the same $H_0\sqrt{\Omega_{\gamma,0}} = 1.620 \times 10^{-20}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own check)'}
    origin: page-own

  - id: e1-nufac
    where: 'Exercise 6.1(B): radiation over photons, 1 + 3 (7/8) (4/11)^(4/3)'
