    origin: page-own

  - id: e2-xf
    answer: e2-xf
    where: 'Exercise 6.2(A), answer box: root of sqrt(x) exp(-x) = K'
    inputs: {}
    formula: 'solve(''0.5*log(y) - y - log(1.66*sqrt(100)*(2*pi)**1.5*100/(2*0.01**2*1.22e19))'', ''y'', 5, 100)'
    expected: '26.9'
    shown: ['id="e2-xf"', 'and the root is $x_f = 26.9$']
    source: {cite: mit, at: 'Exercise 6.2, p. 145 (our own solution)'}
    origin: page-own

  - id: e2-xf-direct
    where: 'Exercise 6.2(A), independent route: n_eq <sigma v> = H solved for T in GeV, then x = m/T'
    inputs: {}
    formula: '100/solve(''log(2*(100*y/(2*pi))**1.5*exp(-100/y)*0.01**2/100**2) - log(1.66*sqrt(100)*y**2/1.22e19)'', ''y'', 1, 20)'
    expected: '26.9'
    shown: ['and the root is $x_f = 26.9$']
    source: {cite: mit, at: 'Eqs. (5.23), (5.24), (5.35), pp. 117 and 122 (our own check)'}
