    formula: '1 + 3*7/8*(4/11)**(4/3)'
    expected: '1.681'
    shown: ['$1 + 3 \times \frac78 \times (4/11)^{4/3} = 1.681$']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own addition)'}
    origin: page-own

  - id: e1-tnu
    answer: e1-tnu
    where: 'Exercise 6.1(B), answer box: age at 1 MeV with three neutrino species in the radiation'
    inputs: {T0: 2.73 K, H: 100 km/s/Mpc}
    formula: '(k_B*T0/MeV)**2/(2*H*sqrt(2.5e-5*(1 + 3*7/8*(4/11)**(4/3))))'
    expected: '1.32 s'
    shown: ['id="e1-tnu"', '$t = 1.71\ \text{s}/\sqrt{1.681} = 1.32$ s']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own addition)'}
    origin: page-own

  - id: e1-sqrtnu
    where: 'Exercise 6.1(B), check: sqrt(1.681)'
