    vary: {S: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-6
    shown: ['so $\alpha/\alpha_N = \frac{\pi}{2}s^{-1/2}']
    source: {cite: mit, at: 'Exercise 7.3, p. 167 (our own check)'}
    origin: page-own

