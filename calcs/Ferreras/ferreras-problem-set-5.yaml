    shown: ['$\ln(1/K) = 25.26$']
    source: {cite: mit, at: 'Exercise 6.2, p. 145 (our own solution)'}
    origin: page-own

  - id: e2-it1
    where: 'Exercise 6.2(A): first iteration x = 25.26 + ln(25.26)/2'
    inputs: {}
    formula: '25.26 + 0.5*log(25.26)'
    expected: '26.87'
