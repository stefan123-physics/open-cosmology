  # ---------------------------------------------------------------- Exercise 7.3
  - id: e7-sub
    kind: identity
    where: 'Exercise 7.3(A): the line-of-sight integral of Eq. 7.10 for a point mass equals the u-integral (s = 1, 0.3, 5; xi = 1, G M = 1, a0 = 1/s)'
    formula: 'integrate(''(1 + (S*(1 - u**2))**2)**0.25/sqrt(S*(1 - u**2))'', ''u'', 0, 1)'
    equals: 'integrate(''(1 + (S/(1 + t**2))**2)**0.25/sqrt(S/(1 + t**2))/(1 + t**2)**1.5'', ''t'', 0, 1) + integrate(''(1 + (S*q**2/(q**2 + 1))**2)**0.25/sqrt(S*q**2/(q**2 + 1))*q/(q**2 + 1)**1.5'', ''q'', 0, 1)'
    samples: {S: [1, 0.3, 5]}
    tolerance: 1e-7
    shown: ['tex="\frac{\alpha}{\alpha_N} = \int_0^1 \tilde f^{-1/2}\!\left[s\,(1 - u^2)\right]du"']
    source: {cite: mit, at: 'Eq. (7.10), p. 167 (our own solution)'}
    origin: page-own

  - id: e7-deep
    kind: identity
    answer: e7-deep
    where: 'Exercise 7.3(B), answer box: deep-MOND deflection against (4 G M/(c^2 xi)) times the u-integral with f-tilde = x, at xi = 1'
    formula: '2*pi*sqrt(G*M*a)/c**2'
    equals: '4*G*M/c**2*integrate(''1/sqrt(G*M/a*(1 - u**2))'', ''u'', 0, 1)'
    samples: {G: [0.5, 2, 1], M: [1, 10, 3], a: [0.1, 1, 0.5], c: [2, 4, 3]}
    tolerance: 1e-7
    shown: ['id="e7-deep"', '= \frac{2\pi\sqrt{GMa_0}}{c^2}']
    source: {cite: mit, at: 'Exercise 7.3, p. 167 (our own solution)'}
    origin: page-own

  - id: e7-deep-limit
