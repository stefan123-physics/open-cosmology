  - id: e1-tgev
    where: 'Exercise 6.1(C): t in 1/GeV at T = 1e-3 GeV'
    inputs: {}
    formula: '1.22e19/(3.32*sqrt(10.75)*1e-6)'
    expected: '1.121e24'
    shown: ['GeV⁻¹ $= 1.121 \times 10^{24}$ GeV⁻¹']
    source: {cite: mit, at: 'Eq. (5.23), p. 117 (our own solution)'}
    origin: page-own

  - id: e1-hbar
    where: 'Exercise 6.1(C) and constants: hbar in GeV s'
    inputs: {}
    formula: 'hbar/(GeV*second)'
    expected: '6.582e-25'
    shown: ['and times $\hbar = 6.582 \times 10^{-25}$ GeV s']
    source: {cite: codata, at: 'reduced Planck constant'}
    origin: page-own

  - id: e1-tg
    answer: e1-tg
    where: 'Exercise 6.1(C), answer box: t = m_Pl/(3.32 sqrt(g*) T^2) at T = 1 MeV, g* = 10.75'
    inputs: {mPl: 1.22e19 GeV, T: 1 MeV}
    formula: 'hbar*mPl/(2*1.66*sqrt(10.75)*T**2)'
    expected: '0.738 s'
    shown: ['id="e1-tg"', '$t = 0.738$ s.']
