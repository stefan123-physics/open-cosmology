    formula: 'sqrt(1 + 3*7/8*(4/11)**(4/3))'
    expected: '1.297'
    shown: ['$\sqrt{1.681} = 1.297$']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own check)'}
    origin: page-own

  - id: e1-tnu-check
    where: 'Exercise 6.1(B), check: 1.708/1.297'
    inputs: {}
    formula: '1.708/1.297'
    expected: '1.317'
    shown: ['$1.708/1.297 = 1.317$']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own check)'}
    origin: page-own

  - id: e1-younger
    where: 'Exercise 6.1(B), check: 1 - 1/sqrt(1.681), about 23%'
    inputs: {}
    formula: '100*(1 - 1/sqrt(1 + 3*7/8*(4/11)**(4/3)))'
    expected: '23'
    shown: ['about 23% younger']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own check)'}
    origin: page-own

  - id: e1-gstar
    where: 'Exercise 6.1(C): g* = 2 + 7/8 (4 + 6)'
    inputs: {}
    formula: '2 + 7/8*(4 + 6)'
    expected: '10.75'
    shown: ['$g_* = 2 + \frac78(4 + 6) = 10.75$']
    source: {cite: mit, at: 'Eq. (5.18), p. 115 (our own count)'}
    origin: page-own

  - id: e1-sqrtg
    where: 'Exercise 6.1(C): sqrt(10.75)'
    inputs: {}
    formula: 'sqrt(10.75)'
    expected: '3.279'
    shown: ['so $\sqrt{g_*} = 3.279$']
    source: {cite: mit, at: 'Exercise 6.1, p. 142 (our own addition)'}
