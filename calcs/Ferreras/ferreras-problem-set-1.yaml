# Calculations on content/year-5/Ferreras/ferreras-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# The book (Ferreras, Fundamentals of Dark Matter, 2025) prints no solutions to its exercises: every answer here is
# recomputed from the inputs, and every formula answer is checked by an independent route (a numerical integral,
# a numerical derivative or a numerical root). Constants: G, c, M_sun from calcs/constants.yaml; pc, kpc, Mpc and
# arcsec from pint.

page: content/year-5/Ferreras/ferreras-problem-set-1.mdx
calcs:
  # ---- constants line

  - id: g-astro
    where: 'section "How to answer": G in pc (km/s)^2 per solar mass'
    inputs: {v: 1 km/s}
    formula: G * M_sun / (pc * v**2)
    expected: '4.3009e-3'
    shown: ['$G = 4.3009 \times 10^{-3}$ pc (km/s)²']
    source: {cite: codata, at: 'Newtonian constant of gravitation'}
    origin: page-own

  - id: arcsec-rad
    where: 'section "How to answer": one arcsecond in radians'
    inputs: {}
    formula: arcsec / radian
    expected: '4.8481e-6'
    shown: ['one arcsecond $= 4.8481 \times 10^{-6}$ rad']
    source: {cite: mit, at: 'unit conversion (our own)'}
    origin: page-own

  # ---- Problem 1 (Exercise 2.1)

  - id: p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: v = v_los / sin i, with v_los = 180 km/s and i = 50 degrees'
    inputs: {vlos: 180, inc: 50}
    formula: vlos / sin(inc * pi / 180)
    expected: '235'
    shown: ['id="p1-b"', '$v = v_\text{los}/\sin i = 180/\sin 50° = 180/0.7660 = 235$ km/s']
    source: {cite: mit, at: 'Exercise 2.1 (our addition)'}
    origin: page-own

  - id: p1-sin50
    where: 'Problem 1(b), solution: sin 50 degrees'
    inputs: {inc: 50}
    formula: sin(inc * pi / 180)
    expected: '0.7660'
    shown: ['180/0.7660']
    source: {cite: mit, at: 'Exercise 2.1 (our addition)'}
    origin: page-own

  # ---- Problem 2 (Exercise 2.2)

  # alpha = 3 from the virial theorem; the potential energy W = -G M^2/R is checked by numerical integration
  # (G = M = R = 1 scaled out: W / (G M^2 / R) = -integral of M(r) dm / r with M(r) = r, dm = dr).
  - id: p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: alpha = 2K/(M sigma^2) scaled: 3 sigma^2 = G M / R with W from the integral'
    inputs: {}
    formula: 3 / integrate('u * 1 / u', 'u', 0, 1)
    expected: '3'
    shown: ['id="p2-a"', '$\alpha = 3$']
    source: {cite: mit, at: 'Exercise 2.2 (our own solution)'}
    origin: page-own

  - id: p2-d
    answer: p2-d
    where: 'Problem 2(d), answer box: uniform sphere, W = -(3/5) G M^2/R by integration, alpha = 3 / (3/5)'
    inputs: {}
    formula: 3 / integrate('u**3 * 3 * u**2 / u', 'u', 0, 1)
    expected: '5'
    shown: ['id="p2-d"', '$\alpha = 5$']
    source: {cite: mit, at: 'Exercise 2.2 (our addition)'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: M = 3 sigma^2 R / G with sigma = 1000 km/s, R = 1.5 Mpc, in 1e15 M_sun'
    inputs: {sig: 1000 km/s, R: 1.5 Mpc}
    formula: 3 * sig**2 * R / G / (1e15 * M_sun)
    expected: '1.05'
    shown: ['id="p2-b"', '= 1.05 \times 10^{15}\,M_\odot$']
    source: {cite: mit, at: 'Exercise 2.2, p. 23 (our own solution)'}
    origin: page-own

  - id: p2-ml
    answer: p2-ml
    where: 'Problem 2(c), answer box: M/L with L = 1e13 L_sun'
    inputs: {sig: 1000 km/s, R: 1.5 Mpc}
    formula: 3 * sig**2 * R / G / (1e13 * M_sun)
    expected: '105'
    shown: ['id="p2-ml"', '$M/L = 1.05 \times 10^{15}/10^{13} = 105$']
    source: {cite: mit, at: 'Exercise 2.2, p. 23 (our own solution)'}
    origin: page-own

  - id: p2-fstar
    answer: p2-fstar
    where: 'Problem 2(c), answer box: stellar mass 5e13 M_sun (Upsilon_V = 5, our choice) as a percentage of the total'
    inputs: {sig: 1000 km/s, R: 1.5 Mpc, ups: 5}
    formula: 100 * ups * 1e13 * M_sun / (3 * sig**2 * R / G)
    expected: '4.8'
    shown: ['id="p2-fstar"', 'a fraction $5 \times 10^{13}/1.05 \times 10^{15}$, or 4.8%']
    source: {cite: mit, at: 'Exercise 2.2 (our own solution; Upsilon_V our choice)'}
    origin: page-own

  # ---- Problem 3 (Exercise 2.3)

  - id: p3-n
    answer: p3-n
    where: 'Problem 3(a), answer box: number ratio, 0.1-0.5 against 10-20 solar masses, dN/dM ∝ M^-2.35'
    inputs: {}
    formula: integrate('u**(-2.35)', 'u', 0.1, 0.5) / integrate('u**(-2.35)', 'u', 10, 20)
    expected: '731'
    shown: ['id="p3-n"', '$14.69/0.02011 = 731$']
    source: {cite: mit, at: 'Exercise 2.3, p. 27 (our own solution)'}
    origin: page-own

  - id: p3-n-low
    where: 'Problem 3(a), solution: the low-mass number integral and its terms'
    inputs: {}
    formula: (0.1**(-1.35) - 0.5**(-1.35)) / 1.35
    expected: '14.69'
    shown: ['$(0.1^{-1.35} - 0.5^{-1.35})/1.35 = (22.39 - 2.549)/1.35 = 14.69$']
    source: {cite: mit, at: 'Exercise 2.3 (our own solution)'}
    origin: page-own

  - id: p3-n-high
    where: 'Problem 3(a), solution: the massive-star number integral'
    inputs: {}
    formula: (10**(-1.35) - 20**(-1.35)) / 1.35
    expected: '0.02011'
    shown: ['$(10^{-1.35} - 20^{-1.35})/1.35 = (0.04467 - 0.01752)/1.35 = 0.02011$']
    source: {cite: mit, at: 'Exercise 2.3 (our own solution)'}
    origin: page-own

  - id: p3-m
    answer: p3-m
    where: 'Problem 3(b), answer box: mass ratio, low-mass to massive stars'
    inputs: {}
    formula: integrate('u**(-1.35)', 'u', 0.1, 0.5) / integrate('u**(-1.35)', 'u', 10, 20)
    expected: '10.0'
    shown: ['id="p3-m"', '$2.755/0.2749 = 10.0$']
    source: {cite: mit, at: 'Exercise 2.3, p. 27 (our own solution)'}
    origin: page-own

  - id: p3-m-low
    where: 'Problem 3(b), solution: the low-mass mass integral'
    inputs: {}
    formula: (0.1**(-0.35) - 0.5**(-0.35)) / 0.35
    expected: '2.755'
    shown: ['$(0.1^{-0.35} - 0.5^{-0.35})/0.35 = (2.239 - 1.275)/0.35 = 2.755$']
    source: {cite: mit, at: 'Exercise 2.3 (our own solution)'}
    origin: page-own

  - id: p3-m-high
    where: 'Problem 3(b), solution: the massive-star mass integral'
    inputs: {}
    formula: (10**(-0.35) - 20**(-0.35)) / 0.35
    expected: '0.2749'
    shown: ['$(10^{-0.35} - 20^{-0.35})/0.35 = (0.4467 - 0.3505)/0.35 = 0.2749$']
    source: {cite: mit, at: 'Exercise 2.3 (our own solution)'}
    origin: page-own

  - id: p3-l
    answer: p3-l
    where: 'Problem 3(c), answer box: light ratio, massive to low-mass stars, with L ∝ M^3'
    inputs: {}
    formula: integrate('u**3 * u**(-2.35)', 'u', 10, 20) / integrate('u**3 * u**(-2.35)', 'u', 0.1, 0.5)
    expected: '322'
    shown: ['id="p3-l"', '$57.89/0.1795 = 322$']
    source: {cite: mit, at: 'Exercise 2.3 (our addition)'}
    origin: page-own

  - id: p3-l-high
    where: 'Problem 3(c), solution: the massive-star light integral'
    inputs: {}
    formula: (20**1.65 - 10**1.65) / 1.65
    expected: '57.89'
    shown: ['$(20^{1.65} - 10^{1.65})/1.65 = (140.2 - 44.67)/1.65 = 57.89$']
    source: {cite: mit, at: 'Exercise 2.3 (our addition)'}
    origin: page-own

  - id: p3-l-low
    where: 'Problem 3(c), solution: the low-mass light integral'
    inputs: {}
    formula: (0.5**1.65 - 0.1**1.65) / 1.65
    expected: '0.1795'
    shown: ['$(0.5^{1.65} - 0.1^{1.65})/1.65 = (0.3186 - 0.02239)/1.65 = 0.1795$']
    source: {cite: mit, at: 'Exercise 2.3 (our addition)'}
    origin: page-own

  # ---- Problem 4 (Exercise 2.4)

  # Independent route: with the mass constant, M/L ∝ 1/L(t), and L(t) = ∫ M^3 M^-x dM from 0 to the turnoff mass
  # t^(-1/3); the power of t is log(L(t1)/L(t2)) / log(t2/t1), evaluated by numerical integration.
  - id: p4-p
    kind: identity
    answer: p4-p
    where: 'Problem 4(a), answer box and formula "Mass-to-light ratio of an ageing population": against the numerical light integral'
    formula: (4 - x)/3
    equals: log(integrate('u**(3 - x)', 'u', 0, t1**(-1/3)) / integrate('u**(3 - x)', 'u', 0, t2**(-1/3))) / log(t2/t1)
    samples:
      x: [2.1, 2.35, 3.0, 3.5]
      t1: [1, 2, 0.5, 3]
      t2: [5, 12, 7, 9]
    tolerance: 1e-6
    shown: ['t^{(4-x)/3}']
    source: {cite: mit, at: 'Exercise 2.4 (our own solution)'}
    origin: page-own

  - id: p4-salpeter-p
    where: 'Problem 4(b), solution: p for x = 2.35'
    inputs: {x: 2.35}
    formula: (4 - x)/3
    expected: '0.55'
    shown: ['$p = (4 - 2.35)/3 = 0.55$']
    source: {cite: mit, at: 'Exercise 2.4 (our own solution)'}
    origin: page-own

  - id: p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: growth of M/L from 2 to 12 Gyr, (12/2)^0.55'
    inputs: {x: 2.35}
    formula: (12/2)**((4 - x)/3)
    expected: '2.68'
    shown: ['id="p4-b"', '$(12/2)^{0.55} = 6^{0.55} = 2.68$']
    source: {cite: mit, at: 'Exercise 2.4 (our own solution)'}
    origin: page-own

  - id: p4-c-factor
    where: 'Problem 4(c), solution: the same factor quoted again'
    inputs: {x: 2.35}
    formula: (12/2)**((4 - x)/3)
    expected: '2.7'
    shown: ['a factor 2.7 from 2 to 12 billion years']
    source: {cite: mit, at: 'Exercise 2.4 (our own solution)'}
    origin: page-own

  # ---- Problem 5 (Exercise 2.5)

  - id: p5-c
    where: 'Problem 5, statement: log10(r_t/r_c) for r_c = 1.5 pc, r_t = 47 pc (the book quotes c = 1.54)'
    inputs: {rt: 47, rc: 1.5}
    formula: log10(rt/rc)
    expected: '1.50'
    shown: ['$\log_{10}(r_t/r_c) = 1.50$']
    source: {cite: mit, at: 'Exercise 2.5, p. 30'}
    origin: page-own

  - id: p5-king-sigma
    kind: fact
    where: 'Problem 5, statement: central one-dimensional dispersion of our numerical King (1966) model with r_t/r_c = 47/1.5 (W0 = 6.892) is 0.980 of the velocity parameter (sigma^2 ratio 0.961), so the two are about 2% apart'
    shown: ['about 2% apart']
    source: {cite: king1966, at: 'our own numerical King model, solved with SciPy'}
    origin: page-own

  - id: p2-a-sis
    where: 'Problem 2(a), check: self-gravitating isothermal sphere, M(R) = integral of 4 pi r^2 sigma^2/(2 pi G r^2) from 0 to R, divided by sigma^2 R / G'
    inputs: {}
    formula: integrate('4 * pi * u**2 / (2 * pi * u**2)', 'u', 0, 1)
    expected: '2'
    shown: ['($\alpha = 2$, used in Problem 5)']
    source: {cite: mit, at: 'Exercise 2.2 (our own solution)'}
    origin: page-own

  - id: p5-rho
    answer: p5-rho
    where: 'Problem 5(a), answer box: rho_0 = 9 sigma_0^2/(4 pi G r_c^2), in M_sun/pc^3'
    inputs: {s0: 7.1 km/s, rc: 1.5 pc}
    formula: 9 * s0**2 / (4 * pi * G * rc**2) / (M_sun / pc**3)
    expected: '3730'
    shown: ['id="p5-rho"', '= 453.7/0.1216 = 3730\,M_\odot$ per pc³']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  - id: p5-rho-num
    where: 'Problem 5(a), solution: numerator 9 sigma_0^2 in (km/s)^2'
    inputs: {}
    formula: 9 * 7.1**2
    expected: '453.7'
    shown: ['= 453.7/0.1216']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  - id: p5-rho-den
    where: 'Problem 5(a), solution: denominator 4 pi G r_c^2 in pc^3 (km/s)^2 per M_sun'
    inputs: {}
    formula: 4 * pi * 4.3009e-3 * 1.5**2
    expected: '0.1216'
    shown: ['453.7/0.1216']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  - id: p5-core
    answer: p5-core
    where: 'Problem 5(b), answer box: (4 pi/3) rho_0 r_c^3 = 3 sigma_0^2 r_c / G, in 1e4 M_sun'
    inputs: {s0: 7.1 km/s, rc: 1.5 pc}
    formula: (4 * pi / 3) * (9 * s0**2 / (4 * pi * G * rc**2)) * rc**3 / (1e4 * M_sun)
    expected: '5.27'
    shown: ['id="p5-core"', '= 5.27 \times 10^4\,M_\odot$']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  - id: p5-king-core
    kind: fact
    where: 'Problem 5(b), check: mass inside r_c from our numerical King (1966) model with r_t/r_c = 47/1.5 (W0 = 6.89): 2.145 rho_0 r_c^3 = 2.70e4 M_sun'
    shown: ['about $2.7 \times 10^4\,M_\odot$ inside $r_c$']
    source: {cite: mit, at: 'Exercise 2.5 (our own numerical King model, solved with SciPy)'}
    origin: page-own

  - id: p5-tidal
    answer: p5-tidal
    where: 'Problem 5(c), answer box: 2 sigma_0^2 r_t / G, in 1e5 M_sun'
    inputs: {s0: 7.1 km/s, rt: 47 pc}
    formula: 2 * s0**2 * rt / G / (1e5 * M_sun)
    expected: '11.0'
    shown: ['id="p5-tidal"', 'that is $11.0 \times 10^5\,M_\odot$']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  - id: p5-tidal-msun
    where: 'Problem 5(c), solution: the same mass in M_sun'
    inputs: {s0: 7.1 km/s, rt: 47 pc}
    formula: 2 * s0**2 * rt / G / M_sun
    expected: '1.10e6'
    shown: ['= 1.10 \times 10^6\,M_\odot$']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  # The isothermal enclosed mass 2 sigma^2 r / G, checked by integrating 4 pi r^2 rho with rho = sigma^2/(2 pi G r^2).
  - id: p5-isothermal-mass
    kind: identity
    where: 'Problem 5(c), formula "Mass inside r for an isothermal fall-off": against numerical integration'
    formula: 2 * s**2 * rr / gg
    equals: integrate('4 * pi * u**2 * s**2 / (2 * pi * gg * u**2)', 'u', 0, rr)
    samples:
      s: [1, 7.1, 3, 200]
      rr: [1, 47, 0.3, 12]
      gg: [1, 0.0043009, 2, 6.7]
    tolerance: 1e-7
    shown: ['= \frac{2\sigma_0^2 r}{G}']
    source: {cite: mit, at: 'Exercise 2.5 (our own solution)'}
    origin: page-own

  - id: p5-king-total
    kind: fact
    where: 'Problem 5(c), check: total mass of our numerical King (1966) model with r_t/r_c = 47/1.5 (W0 = 6.89): 23.84 rho_0 r_c^3 = 3.0e5 M_sun'
    shown: ['a total mass of about $3 \times 10^5\,M_\odot$']
    source: {cite: mit, at: 'Exercise 2.5 (our own numerical King model, solved with SciPy)'}
    origin: page-own

  # ---- Problem 6 (Exercise 2.6)

  # The integral of the sideways acceleration along the straight path, checked numerically (b and the
  # combination G M scaled by the samples; the integral to ±200 b is within 2.5e-5 of the infinite one).
  - id: p6-integral
    kind: identity
    where: 'Problem 6(a), hint and formula "Sideways velocity gained": the integral of (b^2 + z^2)^(-3/2) is 2/b^2'
    formula: 2 / bb**2
    equals: integrate('(bb**2 + u**2)**(-1.5)', 'u', -2000 * bb, 2000 * bb)
    samples:
      bb: [1, 0.3, 4.5, 10]
    tolerance: 1e-6
    shown: ['equals $2/b^2$']
    source: {cite: mit, at: 'Exercise 2.6 (our own solution)'}
    origin: page-own

  - id: p6-b
    answer: p6-b
    where: 'Problem 6(b), answer box: GR deflection 4 G M/(c^2 b), M = 1e12 M_sun, b = 10 kpc, in arcsec'
    inputs: {Mm: 1e12, bb: 10 kpc}
    formula: 4 * G * Mm * M_sun / (c**2 * bb) / arcsec
    expected: '3.95'
    shown: ['id="p6-b"', '$= 3.95$ arcseconds']
    source: {cite: mit, at: 'Exercise 2.6 (our addition)'}
    origin: page-own

  - id: p6-b-rad
    where: 'Problem 6(b), solution: the deflection in radians'
    inputs: {Mm: 1e12, bb: 10 kpc}
    formula: 4 * G * Mm * M_sun / (c**2 * bb)
    expected: '1.914e-5'
    shown: ['rad $= 1.914 \times 10^{-5}$ rad']
    source: {cite: mit, at: 'Exercise 2.6 (our addition)'}
    origin: page-own

  - id: p6-b-newton
    where: 'Problem 6(b), check: Newtonian half of the deflection, in arcsec'
    inputs: {Mm: 1e12, bb: 10 kpc}
    formula: 2 * G * Mm * M_sun / (c**2 * bb) / arcsec
    expected: '1.97'
    shown: ['would give half, 1.97 arcseconds']
    source: {cite: mit, at: 'Exercise 2.6 (our addition)'}
    origin: page-own

  # ---- Problem 7 (Exercise 2.7)

  # Independent route for the isothermal magnification: kappa from the deflection alpha = th0 (n = 2) by a
  # numerical derivative, and mu = 1/((1 - alpha/th)(1 - d alpha/d th)), the determinant of a symmetric lens.
  - id: p7-b
    kind: identity
    answer: p7-b
    where: 'Problem 7(b), answer box and formula "Magnification by an isothermal sphere": against 1/[(1-kappa)^2 - gamma^2] with kappa, gamma from a numerical derivative of alpha'
    formula: th/(th - th0)
    equals: 1 / ((1 - (th0/th + deriv('th0 * (w/th0)**(2 - 2)', 'w', th))/2)**2 - ((th0/th - deriv('th0 * (w/th0)**(2 - 2)', 'w', th))/2)**2)
    samples:
      th: [1.5, 2, 3.3, 4]
      th0: [0.5, 1, 0.7, 0.95]
    tolerance: 1e-6
    shown: ['\mu = \frac{1}{1 - \theta_0/\theta} = \frac{\theta}{\theta - \theta_0}']
    source: {cite: mit, at: 'Exercise 2.7 (our own solution)'}
    origin: page-own

  # Part (a): kappa from Eq. (2.23) with alpha = th0 (th/th0)^(2-n), by numerical differentiation, against Eq. (2.27).
  - id: p7-a-kappa
    kind: identity
    where: 'Problem 7(a), formula "Convergence and shear of a power-law lens": kappa from Eq. (2.23) by numerical differentiation'
    formula: (3 - n)/2 * (th/th0)**(1 - n)
    equals: (th0 * (th/th0)**(2 - n) / th + deriv('th0 * (w/th0)**(2 - n)', 'w', th)) / 2
    samples:
      n: [1.2, 1.5, 2, 2.7]
      th: [0.3, 1.7, 2.2, 5]
      th0: [1, 0.8, 1.3, 2]
    tolerance: 1e-6
    shown: ['\kappa(\theta) = \frac{3-n}{2}\left(\frac{\theta}{\theta_0}\right)^{1-n}']
    source: {cite: mit, at: 'Exercise 2.7, Eq. (2.27), p. 37'}
    origin: mit

  - id: p7-a-gamma
    kind: identity
    where: 'Problem 7(a), formula "Convergence and shear of a power-law lens": gamma from Eq. (2.23) by numerical differentiation'
    formula: (n - 1)/2 * (th/th0)**(1 - n)
    equals: (th0 * (th/th0)**(2 - n) / th - deriv('th0 * (w/th0)**(2 - n)', 'w', th)) / 2
    samples:
      n: [1.2, 1.5, 2, 2.7]
      th: [0.3, 1.7, 2.2, 5]
      th0: [1, 0.8, 1.3, 2]
    tolerance: 1e-6
    shown: ['\gamma(\theta) = \frac{n-1}{2}\left(\frac{\theta}{\theta_0}\right)^{1-n}']
    source: {cite: mit, at: 'Exercise 2.7, Eq. (2.27), p. 37'}
    origin: mit

  # And the deflection itself from Eq. (2.22): (2/th) * integral of th' kappa(th') from 0 to th.
  - id: p7-a-alpha
    kind: identity
    where: 'Problem 7(a), statement: alpha = th0 (th/th0)^(2-n) from Eq. (2.22) by numerical integration of kappa'
    formula: th0 * (th/th0)**(2 - n)
    equals: (2/th) * integrate('w * (3 - n)/2 * (w/th0)**(1 - n)', 'w', 0, th)
    samples:
      n: [1.2, 1.5, 2, 2.7]
      th: [0.3, 1.7, 2.2, 5]
      th0: [1, 0.8, 1.3, 2]
    tolerance: 1e-5
    shown: ['$\alpha(\theta) = \theta_0\,(\theta/\theta_0)^{2-n}$']
    source: {cite: mit, at: 'Exercise 2.7, p. 37'}
    origin: mit

  # The radial critical curve: the root of 1 - kappa + gamma = 1 - d alpha / d theta, found numerically.
  - id: p7-c
    kind: identity
    answer: p7-c
    where: 'Problem 7(c), answer box and formula "Radial critical curve of a power-law lens": against a numerical root of 1 - d alpha/d theta'
    formula: th0*(2 - n)**(1/(n - 1))
    equals: solve('1 - deriv("th0 * (w/th0)**(2 - n)", "w", u)', 'u', 0.001 * th0, 0.999 * th0)
    samples:
      n: [1.2, 1.5, 1.65, 1.8]
      th0: [0.5, 1, 1.7, 2]
    tolerance: 1e-5
    shown: ['\theta_r = \theta_0\,(2-n)^{1/(n-1)}']
    source: {cite: mit, at: 'Exercise 2.7 (our addition)'}
    origin: page-own

  - id: p7-c-example
    where: 'Problem 7(c), check: n = 1.5 gives theta_r = theta_0/4'
    inputs: {n: 1.5}
    formula: (2 - n)**(1/(n - 1))
