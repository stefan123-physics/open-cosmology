# Calculations on content/year-5/Ferreras/mond.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 7.1–7.2. The book takes a₀ ≈ 10⁻¹⁰ m/s².

page: content/year-5/Ferreras/mond.mdx
calcs:
  - id: a0-value
    kind: fact
    where: 'summary, text, quiz 1, flashcard 1 and summary: a₀ ≈ 10⁻¹⁰ m/s²; R₀ about 10 kpc'
    value: 1e-10 m/s**2
    shown: ['below a tiny acceleration, about 10⁻¹⁰ m/s²', 'by fitting rotation curves: about $10^{-10}$ m/s²', 'a characteristic acceleration $a_0 \\approx 10^{-10}$ m/s²', 'with $a_0 \\approx 10^{-10}$ m/s²"', 'below an acceleration $a_0 \approx 10^{-10}$ m/s²', 'typically about 10 kpc, the measured', 'fails beyond about 10 kpc in galaxies']
    source: {cite: mit, at: 'pp. 158–160'}
    origin: mit

  - id: deep-mond-identity
    kind: identity
    where: 'text: a = √(GMa₀)/r and a = v²/r give v⁴ = GMa₀'
    formula: (r * sqrt(G0 * M0 * A) / r)**2
    equals: sqrt(G0 * M0 * A)**2
    samples: {r: [1, 5], G0: [1, 2], M0: [3, 1], A: [0.5, 2]}
    shown: ['Now the speed no longer depends on $r$']
    source: {cite: mit, at: 'Eq. (7.5), p. 160'}
    origin: page-own

  - id: a0-km-kpc
    where: 'plot caption: a₀ = 3086 (km/s)²/kpc is 10⁻¹⁰ m/s²; 1.2 × 10⁻¹⁰ is about 3700'
    inputs: {a: 1e-10 m/s**2}
    formula: a
    expected: 3086 km**2/s**2/kpc
    shown: ['The default a₀ = 3086 (km/s)²/kpc is 10⁻¹⁰ m/s²']
    source: {cite: mit, at: 'p. 160'}
    origin: page-own

  - id: a0-km-kpc-12
    where: 'plot caption: 1.2 × 10⁻¹⁰ m/s² is about 3700 (km/s)²/kpc'
    inputs: {a: 1.2e-10 m/s**2}
    formula: a
    expected: 3700 km**2/s**2/kpc
    shown: ['about 3700 in these units']
    source: {cite: mit, at: 'p. 160'}
    origin: page-own

  - id: example-mass-ratio
    where: 'worked example "A galaxy weighed with MOND", step 1: (150/90)² ≈ 2.78, dark matter 1.78 times visible'
    formula: (150 / 90)**2
    expected: 2.78
    shown: ['$M_\text{TOT}/M_\text{OBS} = (150/90)^2 \approx 2.78$, so dark matter would be about 1.78 times']
    source: {cite: mit, at: 'p. 162, Exercise 7.2'}
    origin: page-own

  - id: example-radius
    where: 'worked example, step 2: R = 15 × 3.086 × 10¹⁹ m = 4.63 × 10²⁰ m'
    inputs: {R: 15 kpc}
    formula: R
    expected: 4.63e20 m
    shown: ['$R = 15 \times 3.086 \times 10^{19}$ m $= 4.63 \times 10^{20}$ m']
    source: {cite: mit, at: 'p. 162'}
    origin: page-own

  - id: example-a
    where: 'worked example, step 2: a ≈ 4.86 × 10⁻¹¹ m/s²'
    inputs: {v: 1.5e5 m/s, R: 4.63e20 m}
    formula: v**2 / R
    expected: 4.86e-11 m/s**2
    shown: ['True: $a = v^2/R = (1.5 \times 10^5)^2/4.63 \times 10^{20} \approx 4.86 \times 10^{-11}$ m/s²']
    source: {cite: mit, at: 'Eq. (7.3), p. 158'}
    origin: page-own

  - id: example-aN
    where: 'worked example, step 2: a_N ≈ 1.75 × 10⁻¹¹ m/s²'
    inputs: {v: 9e4 m/s, R: 4.63e20 m}
    formula: v**2 / R
    expected: 1.75e-11 m/s**2
    shown: ['Newtonian: $a_N = (9 \times 10^4)^2/4.63 \times 10^{20} \approx 1.75 \times 10^{-11}$ m/s²']
    source: {cite: mit, at: 'Eq. (7.1), p. 158'}
    origin: page-own

  - id: example-a0
    where: 'worked example, step 3: a₀ = a(a − a_N)/a_N ≈ 8.6 × 10⁻¹¹ m/s²'
    inputs: {a: 4.86e-11 m/s**2, aN: 1.75e-11 m/s**2}
    formula: a * (a - aN) / aN
    expected: 8.6e-11 m/s**2
    shown: ['$a_0 = a(a - a_N)/a_N = 4.86 \times 10^{-11} \times 3.11/1.75 \approx 8.6 \times 10^{-11}$ m/s²']
    source: {cite: mit, at: 'Eq. (7.6), p. 161'}
    origin: page-own

  - id: example-a0-solution
    kind: identity
    where: 'worked example, step 3: x = a_N/(a − a_N) solves a_N = a x/(1 + x)'
    formula: A * (B / (A - B)) / (1 + B / (A - B))
    equals: B
    samples: {A: [4.86, 3, 10], B: [1.75, 1, 9]}
    shown: ['$a_N = a\,x/(1+x)$ with $x = a/a_0$ gives $x = a_N/(a - a_N)$']
    source: {cite: mit, at: 'Eq. (7.6), p. 161'}
    origin: page-own

  - id: neptune-acceleration
    where: 'worked example "MOND and the Solar System", step 1, and quiz 3: a ≈ 6.6 × 10⁻⁶ m/s²'
    inputs: {GM: 1.327e20 m**3/s**2, r: 4.50e12 m}
    formula: GM / r**2
    expected: 6.6e-6 m/s**2
    shown: ['$a = GM_\odot/r^2 = 1.327 \times 10^{20}/(4.50 \times 10^{12})^2 \approx 6.6 \times 10^{-6}$ m/s²', 'with an acceleration of about $6.6 \\times 10^{-6}$ m/s²']
    source: {cite: mit, at: 'p. 161, "How about ...?"'}
    origin: page-own

  - id: neptune-radius
    where: 'worked example: 30.07 AU = 4.50 × 10¹² m'
    inputs: {r: 30.07 au}
    formula: r
    expected: 4.50e12 m
    shown: ['(orbital radius 30.07 AU)']
    source: {cite: mit, at: 'p. 161'}
    origin: page-own

  - id: neptune-ratio
    where: 'worked example, step 1, and quiz 3: about 66 000 times a₀'
    inputs: {a: 6.56e-6, a0: 1e-10}
    formula: a / a0
    expected: 66000
    shown: ['about 66 000 times $a_0$. Deep in', 'It is about 66 000 times $a_0$']
    source: {cite: mit, at: 'p. 161'}
    origin: page-own

  - id: deep-mond-speed
    where: 'worked example, step 2: v = (GMa₀)^¼ ≈ 1.6 × 10⁵ m/s, about 160 km/s'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 9.94e40 kg, a0: 1e-10 m/s**2}
    formula: (G * M * a0)**(1/4)
    expected: 1.6e5 m/s
    shown: ['$v = (GMa_0)^{1/4} = (6.674 \times 10^{-11} \times 9.94 \times 10^{40} \times 10^{-10})^{1/4} \approx 1.6 \times 10^5$ m/s, about 160 km/s']
    source: {cite: mit, at: 'Eq. (7.5), p. 160'}
    origin: page-own

  - id: deep-mond-speed-12
    where: 'worked example, step 2: 168 km/s with a₀ = 1.2 × 10⁻¹⁰'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 9.94e40 kg, a0: 1.2e-10 m/s**2}
    formula: (G * M * a0)**(1/4)
    expected: 168 km/s
    shown: ['(or 168 km/s with $a_0 = 1.2 \times 10^{-10}$ m/s²)']
    source: {cite: mit, at: 'Eq. (7.5), p. 160'}
    origin: page-own

  - id: galaxy-mass-kg
    where: 'worked example: 5 × 10¹⁰ M⊙ = 9.94 × 10⁴⁰ kg'
    formula: 5e10 * M_sun
    expected: 9.94e40 kg
    shown: ['for a galaxy of $5 \times 10^{10}\,M_\odot$ of stars and gas']
    source: {cite: mit, at: 'p. 160'}
    origin: page-own

  - id: cH0
    where: 'text, quiz 4 and summary: cH₀ ≈ 9.7h × 10⁻¹⁰ m/s²'
    inputs: {c: 2.998e8 m/s, H: 100 km/s/Mpc}
    formula: c * H
    expected: 9.7e-10 m/s**2
    shown: ['Today $cH_0 \approx 9.7h \times 10^{-10}$ m/s²', '"$cH_0 \\approx 9.7h \\times 10^{-10}$ m/s²"', '$cH_0 \approx 9.7h \times 10^{-10}$ m/s² is suspiciously close']
    source: {cite: mit, at: 'p. 163'}
    origin: mit

  - id: cH0-h07
    where: 'quiz 4 explanation: with h ≈ 0.7, cH₀ ≈ 7 × 10⁻¹⁰ m/s²'
    inputs: {c: 2.998e8 m/s, H: 70 km/s/Mpc}
    formula: c * H
    expected: 7e-10 m/s**2
    shown: ['With $h \\approx 0.7$, $cH_0 \\approx 7 \\times 10^{-10}$ m/s²']
    source: {cite: mit, at: 'p. 163'}
    origin: page-own

  - id: ngc2403-5kpc
    kind: fact
    where: 'text: NGC 2403 falls short beyond about 5 kpc'
    value: 5 kpc
    shown: ['fall short beyond about 5 kpc']
    source: {cite: mit, at: 'p. 162, Figure 7.2'}
    origin: mit

  - id: tf-exponent-mond
    kind: fact
    where: 'text and summary: Tully–Fisher exponent 4; distance-based model gives L ∝ v²'
    value: 4
    shown: ['a **Tully–Fisher relation** with exponent 4', 'make $L \propto v^2$ rather than $v^4$', '= GMa_0$ and a baryonic Tully–Fisher relation with exponent 4', 'curves, and a baryonic Tully–Fisher relation with exponent 4."']
    source: {cite: mit, at: 'pp. 164–166'}
    origin: mit
