# Calculations on content/year-5/Ferreras/mond-tests.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 7.3–7.5.

page: content/year-5/Ferreras/mond-tests.mdx
calcs:
  - id: rar-sample
    kind: fact
    where: 'text, quiz 1, flashcard 1 and summary: 2693 points in 240 galaxies (Lelli et al. 2017)'
    value: 2693
    shown: ['Lelli and collaborators (2017) compared, at 2693 points in 240 galaxies', 'Lelli and collaborators (2017) used 2693 measurements in 240 galaxies', 'at 2693 points in 240 galaxies (Lelli et al. 2017)', '(2693 points, 240 galaxies)']
    source: {cite: mit, at: 'p. 164, Figure 7.3'}
    origin: mit

  - id: tf-slope-range
    kind: fact
    where: 'text and summary: slope between about 3 and 4; baryonic slope about 4'
    value: 4
    shown: ['with a slope $\alpha_X$ between about 3 and 4', 'The baryonic Tully–Fisher relation (slope about 4)']
    source: {cite: mit, at: 'Eq. (7.9), p. 166'}
    origin: mit

  - id: mortlock-turner-2001
    kind: fact
    where: 'text: Mortlock and Turner, 2001'
    value: 2001
    shown: ['(Mortlock and Turner, 2001)']
    source: {cite: mit, at: 'p. 167'}
    origin: mit

  - id: mond-deflection-limit
    kind: fact
    where: 'text, flashcard 2 and summary: for 10¹¹ M⊙ at about 10³ Mpc (z ≈ 0.3) the deflection tends to about 0.3″'
    value: 0.3 arcsecond
    shown: ['For $10^{11}\,M_\odot$ at a distance of about $10^3$ Mpc (redshift about 0.3), Ferreras finds a limit of about 0.3 arcseconds', 'Deflection tends to a constant (about 0.3″ in Ferreras''s estimate for', 'tends to a constant (about 0.3″ in Ferreras''s estimate for $10^{11}\,M_\odot$)']
    source: {cite: mit, at: 'p. 168, Figure 7.4'}
    origin: mit

  - id: lens-acceleration-coefficient
    where: 'formula "Acceleration near a lens": GM/(θ D_L)² ≈ 6 a₀ for 10¹¹ M⊙, 1″, D_L = 10³ Mpc, a₀ = 10⁻¹⁰'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), D: 1000 Mpc, t: 1 arcsecond, a0: 1e-10 m/s**2}
    formula: G * 1e11 * M_sun / (t * D)**2 / a0
    expected: 6
    shown: ['\approx 6\,a_0\left(\frac{M}{10^{11}\,M_\odot}\right)']
    source: {cite: mit, at: 'Eq. (7.11), p. 169'}
    origin: mit

  - id: lens-xi
    where: 'worked example "How far from Newton is a strong lens?", step 1: ξ ≈ 4.85 kpc ≈ 1.50 × 10²⁰ m'
    inputs: {D: 1000 Mpc}
    formula: D / 206265
    expected: 4.85 kpc
    shown: ['$\xi = \theta D_L = (1/206\,265) \times 1000$ Mpc $\approx 4.85$ kpc $\approx 1.50 \times 10^{20}$ m']
    source: {cite: mit, at: 'Eq. (7.11), p. 169'}
    origin: page-own

  - id: lens-acceleration
    where: 'worked example, step 2: a ≈ 5.9 × 10⁻¹⁰ m/s², about 6 a₀; also quiz 2'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 1.99e41 kg, x: 1.50e20 m}
    formula: G * M / x**2
    expected: 5.9e-10 m/s**2
    shown: ['$a = GM/\xi^2 = 6.674 \times 10^{-11} \times 1.99 \times 10^{41}/(1.50 \times 10^{20})^2 \approx 5.9 \times 10^{-10}$ m/s², about $6\,a_0$', 'and 1″ from the centre, $a \\approx 6a_0$', 'typical strong lenses sit at about $6a_0$', 'typical lenses sit at about $6a_0$']
    source: {cite: mit, at: 'Eq. (7.11), p. 169'}
    origin: page-own

  - id: mond-boost
    where: 'worked example, step 3: a²/(a + a₀) = 6a₀ gives a = ½(6 + √60) a₀ ≈ 6.87 a₀, about 15% stronger than Newton'
    formula: (6 + sqrt(60)) / 2
    expected: 6.87
    shown: ['gives $a = \tfrac12\left(6 + \sqrt{60}\right)a_0 \approx 6.87\,a_0$']
    source: {cite: mit, at: 'Eq. (7.4), p. 159'}
    origin: page-own

  - id: mond-boost-percent
    where: 'worked example, step 3: 6.87/6 ≈ 1.15, about 15% stronger'
    formula: 100 * ((6 + sqrt(60)) / 2 / 6 - 1)
    expected: 15
    shown: ['gravity is only about 15% stronger than Newton''s']
    source: {cite: mit, at: 'Eq. (7.4), p. 159'}
    origin: page-own

  - id: he1104
    kind: fact
    where: 'text: HE 1104−1805, z = 0.73, log M⋆/M⊙ ≈ 11.5 (Ferreras, Sakellariadou and Yusaf 2008)'
    value: 11.5
    shown: ['(lens galaxy at redshift 0.73 with stellar mass $\log(M_\star/M_\odot) \lesssim 11.5$; Ferreras, Sakellariadou and Yusaf, 2008)']
    source: {cite: mit, at: 'pp. 169–170, Figure 7.5'}
    origin: mit

  - id: aqual-teves-years
    kind: fact
    where: 'text, quiz 4, flashcard 3 and summary: AQUAL (Bekenstein and Milgrom 1984), TeVeS (Bekenstein 2004)'
    value: 1984
    shown: ['Bekenstein and Milgrom (1984) proposed **AQUAL**', 'Bekenstein''s **TeVeS** (2004)', 'proposed by Bekenstein in 2004', 'AQUAL (Bekenstein and Milgrom 1984)', 'TeVeS (Bekenstein 2004)', 'AQUAL (1984) gives MOND a Lagrangian; TeVeS (2004)']
    source: {cite: mit, at: 'pp. 170–171'}
    origin: mit

  - id: a0-for-lens
    kind: fact
    where: 'text: for D_L = 10³ Mpc and a₀ = 10⁻¹⁰ m/s²'
    value: 1e-10 m/s**2
    shown: ['(for $D_L = 10^3$ Mpc and $a_0 = 10^{-10}$ m/s²)']
    source: {cite: mit, at: 'Eq. (7.11), p. 169'}
    origin: mit
