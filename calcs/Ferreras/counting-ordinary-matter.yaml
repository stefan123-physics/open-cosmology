# Calculations on content/year-5/Ferreras/counting-ordinary-matter.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 2.4–2.5.

page: content/year-5/Ferreras/counting-ordinary-matter.mdx
calcs:
  - id: jupiter-thousandth
    where: 'introduction: even Jupiter has only about a thousandth of the Sun''s mass'
    inputs: {MJ: 1.898e27 kg}
    formula: MJ / M_sun
    expected: 0.001
    shown: ['even Jupiter has only about a thousandth of the Sun''s mass']
    source: {cite: mit, at: 'p. 26'}
    origin: page-own

  - id: passbands
    kind: fact
    where: 'section "Stellar mass from light": red/near-infrared 0.6–2 μm, blue below 0.4 μm'
    value: 0.6 micrometer
    shown: ['(about 0.6–2 μm in the galaxy''s rest frame)', '(below about 0.4 μm)']
    source: {cite: mit, at: 'p. 26'}
    origin: mit

  - id: salpeter-slope
    kind: fact
    where: 'text and flashcard 1: Salpeter dN/dM ∝ M^−2.35'
    value: 2.35
    shown: ['Salpeter''s single power law, $dN/dM \propto M^{-2.35}$', 'Salpeter''s 2.35 is the slope per unit mass', '"$dN/dM \\propto M^{-2.35}$: a power law']
    source: {cite: mit, at: 'p. 27, Exercise 2.3'}
    origin: mit

  - id: salpeter-low-mass-number
    where: 'worked example "Where the stellar mass is", step "Low-mass stars": about 96% by number'
    formula: 100 * integrate('x**-2.35', 'x', 0.1, 1) / integrate('x**-2.35', 'x', 0.1, 100)
    expected: 96
    shown: ['are about 96% of all stars by number and about 61% of the mass']
    source: {cite: mit, at: 'p. 27, Exercise 2.3'}
    origin: page-own

  - id: salpeter-low-mass-mass
    where: 'worked example, step "Low-mass stars": about 61% of the mass; also quiz 2 and summary'
    formula: 100 * integrate('x**-1.35', 'x', 0.1, 1) / integrate('x**-1.35', 'x', 0.1, 100)
    expected: 61
    shown: ['"They are about 96% of the stars by number and about 61% by mass.', 'about 61% below 1 $M_\odot$ at birth']
    source: {cite: mit, at: 'p. 27, Exercise 2.3'}
    origin: page-own

  - id: salpeter-low-mass-mass-quiz
    where: 'quiz 2: the marked choice "About 61%"'
    formula: 100 * integrate('x**-1.35', 'x', 0.1, 1) / integrate('x**-1.35', 'x', 0.1, 100)
    expected: 61
    shown: ['choices: ["About 6%", "About 61%", "About 96%", "About 11%"]']
    quiz: 1
    source: {cite: mit, at: 'p. 27, Exercise 2.3'}
    origin: page-own

  - id: salpeter-massive-number
    where: 'worked example, step "Massive stars": 8–50 M⊙ are about 0.25% of the stars'
    formula: 100 * integrate('x**-2.35', 'x', 8, 50) / integrate('x**-2.35', 'x', 0.1, 100)
    expected: 0.25
    shown: ['are only about 0.25% of the stars but hold about 11% of the mass']
    source: {cite: mit, at: 'p. 27, Exercise 2.3'}
    origin: page-own

  - id: salpeter-massive-mass
    where: 'worked example, step "Massive stars": about 11% of the mass; quiz 2 explanation (11%, a quarter of a percent)'
    formula: 100 * integrate('x**-1.35', 'x', 8, 50) / integrate('x**-1.35', 'x', 0.1, 100)
    expected: 11
    shown: ['are only a quarter of a percent of the stars but 11% of the mass']
    source: {cite: mit, at: 'p. 27, Exercise 2.3'}
    origin: page-own

  - id: max-stellar-ml
    kind: fact
    where: 'text, quiz 3, flashcard 2 and summary: stellar V-band M/L at most about 10; outskirts and clusters tens to hundreds'
    value: 10
    shown: ['**does not rise above about 10**', 'give a V-band mass-to-light ratio of at most about 10', '"About 10 in the V band, whatever', 'but never exceeds about 10 in the V band']
    source: {cite: mit, at: 'p. 28, Figure 2.4'}
    origin: mit

  - id: dex-uncertainty
    where: 'text: 0.2 dex is a factor of about 1.6'
    inputs: {d: 0.2}
    formula: 10**d
    expected: 1.6
    shown: ['about **0.2 dex** (a factor of about 1.6)']
    source: {cite: mit, at: 'p. 28'}
    origin: page-own

  - id: helium-factor
    where: 'section "Gas": 1/(1 − Y) ≈ 1.3 for Y ≈ 0.24; also flashcard 3'
    inputs: {Y: 0.24}
    formula: 1 / (1 - Y)
    expected: 1.3
    shown: ['$1/(1-Y) \approx 1.3$ times the hydrogen mass', 'about 1/(1 − Y) ≈ 1.3 for helium (Y ≈ 0.24)']
    source: {cite: mit, at: 'p. 29'}
    origin: page-own

  - id: helium-floor
    kind: fact
    where: 'section "Gas" and summary: Y starts at about 0.24'
    value: 0.24
    shown: ['which starts at about 0.24 from Big Bang', 'corrected for helium ($Y \approx 0.24$)']
    source: {cite: mit, at: 'p. 29'}
    origin: mit

  - id: gc-mass
    where: 'worked example "A globular cluster''s mass": M ≈ 3 × 5² × 0.003 / 4.30 × 10⁻⁶ ≈ 5.2 × 10⁴ M⊙'
    inputs: {s: 5 km/s, r: 3 pc, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: 3 * s**2 * r / (G * M_sun)
    expected: 5.2e4
    shown: ['$M \approx 3 \times 5^2 \times 0.003 / 4.30 \times 10^{-6} \approx 5.2 \times 10^4\,M_\odot$']
    source: {cite: mit, at: 'Section 2.5, p. 30'}
    origin: page-own

  - id: gc-mass-to-light
    where: 'worked example, step "Mass-to-light ratio": ≈ 1.7'
    inputs: {M: 5.2e4, L: 3e4}
    formula: M / L
    expected: 1.7
    shown: ['$M/L \approx 5.2 \times 10^4 / 3 \times 10^4 \approx 1.7$']
    source: {cite: mit, at: 'Section 2.5, p. 30'}
    origin: page-own

  - id: local-dm-density
    where: 'worked example "How much dark matter is in the Solar System?", step 1: ρ = v²/(4πGr²) ≈ 1.4 × 10⁷ M⊙/kpc³'
    inputs: {v: 220 km/s, r: 8 kpc, G: 6.6743e-11 m**3/(kg*s**2), u: 1 kpc}
    formula: v**2 / (4 * pi * G * r**2) * u**3 / M_sun
    expected: 1.4e7
    shown: ['\approx 1.4 \times 10^7\,M_\odot$ per kpc³']
    source: {cite: mit, at: 'p. 31, "How about ...?"'}
    origin: page-own

  - id: local-dm-density-pc
    where: 'worked example, step 1: about 0.014 M⊙ per pc³'
    inputs: {rho: 1.4e7, u: 1 kpc, w: 1 pc}
    formula: rho * (w / u)**3
    expected: 0.014
    shown: ['or about $0.014\,M_\odot$ per pc³']
    source: {cite: mit, at: 'p. 31'}
    origin: page-own

  - id: local-dm-density-gev
    where: 'worked example, step 1: about 0.5 GeV/c² per cm³'
    inputs: {v: 220 km/s, r: 8 kpc, G: 6.6743e-11 m**3/(kg*s**2), c: 2.998e8 m/s}
    formula: v**2 / (4 * pi * G * r**2) * c**2
    expected: 0.5 GeV/cm**3
    shown: ['(about 0.5 GeV/$c^2$ per cm³)']
    source: {cite: mit, at: 'p. 31'}
    origin: page-own

  - id: neptune-orbit-kpc
    where: 'worked example, problem: Neptune''s orbit, 30.07 AU = 1.46 × 10⁻⁷ kpc'
    inputs: {r: 30.07 au}
    formula: r
    expected: 1.46e-7 kpc
    shown: ['(30.07 AU, or $1.46 \times 10^{-7}$ kpc)']
    source: {cite: mit, at: 'p. 31'}
    origin: mit

  - id: dm-within-neptune
    where: 'worked example, step 2: ≈ 1.8 × 10⁻¹³ M⊙'
    inputs: {rho: 1.4e7, r: 1.46e-7}
    formula: rho * 4 / 3 * pi * r**3
    expected: 1.8e-13
    shown: ['\approx 1.8 \times 10^{-13}\,M_\odot$, about']
    source: {cite: mit, at: 'p. 31'}
    origin: page-own

  - id: dm-within-neptune-kg
    where: 'worked example, step 2: about 3.6 × 10¹⁷ kg'
    inputs: {M: 1.8e-13}
    formula: M * M_sun
    expected: 3.6e17 kg
    shown: ['about $3.6 \times 10^{17}$ kg']
    source: {cite: mit, at: 'p. 31'}
    origin: page-own

  - id: asteroid-size
    where: 'worked example, step 3: a rocky asteroid (density about 2000 kg/m³) of 3.6 × 10¹⁷ kg is about 70 km across'
    inputs: {M: 3.6e17 kg, rho: 2000 kg/m**3}
    formula: 2 * (3 * M / (4 * pi * rho))**(1/3)
    expected: 70 km
    shown: ['a single rocky asteroid about 70 km across']
    source: {cite: mit, at: 'p. 31'}
    origin: page-own

  - id: dm-fraction-of-sun
    kind: fact
    where: 'worked example, step 3, and summary: about 10⁻¹³ of the Sun''s mass'
    value: 1e-13
    shown: ['about $10^{-13}$ of the Sun''s mass. No planetary', 'adds only about $10^{-13}$ of the Sun''s mass']
    source: {cite: mit, at: 'p. 31'}
    origin: page-own

  - id: flat-220
    kind: fact
    where: 'worked example, problem: rotation curve flat at 220 km/s at 8 kpc (the book''s Milky Way example uses 8.5 kpc)'
    value: 220 km/s
    shown: ['roughly flat at 220 km/s at a radius of 8 kpc']
    source: {cite: mit, at: 'p. 18'}
    origin: mit

  - id: gc-million
    kind: fact
    where: 'text: globular clusters of up to about a million stars'
    value: 1e6
    shown: ['up to about a million old stars']
    source: {cite: mit, at: 'p. 30'}
    origin: page-own

  - id: model-years
    kind: fact
    where: 'text: Bruzual & Charlot 2003, MILES (Vazdekis and collaborators 2010)'
    value: 2003
    shown: ['(Bruzual & Charlot 2003, and MILES by Vazdekis and collaborators 2010)']
    source: {cite: mit, at: 'p. 27'}
    origin: mit
