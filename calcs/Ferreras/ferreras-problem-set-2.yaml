    formula: '(3*M*M_sun/(4*pi*180*0.3*3*H0**2/(8*pi*G)*(1+0)**3))**(1/3)/Rt - 1'
    expected: '0.596'
    shown: ['id="e1-zc"', 'so $z_c = 0.596$, about 0.6']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own addition)'}
