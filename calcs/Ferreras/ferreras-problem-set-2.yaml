# Calculations on content/year-5/Ferreras/ferreras-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Source: I. Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Chapter 3, Exercises 3.1-3.5. The book prints no
# solutions; every solution here is ours. `cite: mit` means the book (textbook course).
# Exercise 3.1: H0 = 70 km/s/Mpc, Omega_m = 0.3, mean halo density 180 times the background at collapse.
# Exercise 3.5: G = 1, r_h = 1, M_i(r_h) = 1, c = 5 (r_S = 0.2), f_d = 0.1, Hernquist galaxy of total mass f_d with
# scale a = 0.2 (part A) or 0.04 (part B). Radii are found with solve(); peaks with solve(deriv(...)).

page: content/year-5/Ferreras/ferreras-problem-set-2.mdx
calcs:
  - id: e1-rhoc
    where: 'Exercise 3.1(A), solution: critical density for H0 = 70 km/s/Mpc in M_sun per Mpc^3'
    inputs: {H0: 70 km/s/Mpc, u: 1 Mpc}
    formula: '3*H0**2/(8*pi*G)*u**3/M_sun'
    expected: '1.360e11'
    shown: ['$\rho_c = 3H_0^2/8\pi G = 1.360 \times 10^{11}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own solution)'}
    origin: page-own

  - id: e1-rhobar
    where: 'Exercise 3.1(A), solution: mean matter density today, 0.3 rho_c'
    inputs: {H0: 70 km/s/Mpc, u: 1 Mpc}
    formula: '0.3*3*H0**2/(8*pi*G)*u**3/M_sun'
    expected: '4.080e10'
    shown: ['$\bar\rho_0 = 0.3\rho_c = 4.080 \times 10^{10}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own solution)'}
    origin: page-own

  - id: e1-r0
    answer: e1-r0
    where: 'Exercise 3.1(A), answer box: radius for collapse at z_c = 0, in kpc'
    inputs: {H0: 70 km/s/Mpc, M: 1e12}
    formula: '(3*M*M_sun/(4*pi*180*0.3*3*H0**2/(8*pi*G)*(1+0)**3))**(1/3)'
    expected: '319 kpc'
    shown: ['id="e1-r0"', 'Mpc $= 0.319$ Mpc $= 319$ kpc']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own solution)'}
    origin: page-own

  - id: e1-r1
    answer: e1-r1
    where: 'Exercise 3.1(B), answer box: radius for collapse at z_c = 1, in kpc'
    inputs: {H0: 70 km/s/Mpc, M: 1e12}
    formula: '(3*M*M_sun/(4*pi*180*0.3*3*H0**2/(8*pi*G)*(1+1)**3))**(1/3)'
    expected: '160 kpc'
    shown: ['id="e1-r1"', '$R = 319\ \text{kpc}/(1 + 1) = 160$ kpc']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own solution)'}
    origin: page-own

  - id: e1-r1-check
    where: 'Exercise 3.1(B), check: radius at z_c = 1 in Mpc from the background density 8 times higher'
    inputs: {H0: 70 km/s/Mpc, M: 1e12}
    formula: '(3*M*M_sun/(4*pi*180*0.3*3*H0**2/(8*pi*G)*(1+1)**3))**(1/3)'
    expected: '0.160 Mpc'
    shown: ['Mpc $= 0.160$ Mpc, as above']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own check)'}
    origin: page-own

  - id: e1-rhobar-z1
    where: 'Exercise 3.1(B), check: background matter density at z = 1'
    inputs: {H0: 70 km/s/Mpc, u: 1 Mpc}
    formula: '8*0.3*3*H0**2/(8*pi*G)*u**3/M_sun'
    expected: '3.264e11'
    shown: ['$8 \times 4.080 \times 10^{10} = 3.264 \times 10^{11}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'Exercise 3.1, p. 52 (our own check)'}
    origin: page-own

  - id: e1-zc
