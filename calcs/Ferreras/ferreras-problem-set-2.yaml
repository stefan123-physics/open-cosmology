    formula: 'log(1 + x) - x/(1 + x)'
    equals: 'integrate(''y/(1 + y)**2'', ''y'', 0, x)'
    samples: {x: [0.1, 1, 2.163, 5, 30]}
    tolerance: 1e-6
    shown: ['M_\text{NFW}(x) = M_0\left[\ln(1 + x) - \frac{x}{1 + x}\right]']
    source: {cite: mit, at: 'Exercise 3.3, p. 56 (our own solution)'}
    origin: page-own

  - id: e3-mass-hern
    kind: identity
