  - id: e2-gamma
    kind: identity
    answer: e2-gamma
    where: 'Exercise 3.2(A), answer box: Einasto slope against a numerical derivative of ln rho with respect to ln x'
    formula: '-2*x**a'
    equals: 'x*deriv(''-(2/a)*(y**a - 1)'', ''y'', x)'
    samples: {x: [5, 10, 0.3, 1, 2.7], a: [0.1, 0.5, 0.17, 0.3, 0.25]}
    tolerance: 1e-6
    shown: ['id="e2-gamma"', '= -\frac{2}{\alpha}\,\alpha x^\alpha = -2x^\alpha']
    source: {cite: mit, at: 'Exercise 3.2, p. 56 (our own solution)'}
    origin: page-own

  - id: e2-gamma-nfw
    kind: identity
    where: 'Exercise 3.2(B), formula: NFW slope against a numerical derivative'
    formula: '-(1 + 3*x)/(1 + x)'
    equals: 'x*deriv(''log(1/(y*(1 + y)**2))'', ''y'', x)'
    samples: {x: [0.1, 1, 10, 0.37, 4.2]}
    tolerance: 1e-6
    shown: ['= -1 - \frac{2x}{1 + x} = -\frac{1 + 3x}{1 + x}']
    source: {cite: mit, at: 'Exercise 3.2, p. 56 (our own solution)'}
    origin: page-own

  - id: e2-g01
    where: 'Exercise 3.2(B): NFW slope at x = 0.1'
    inputs: {}
    formula: '-(1 + 3*0.1)/(1 + 0.1)'
    expected: '-1.182'
    shown: ['$\gamma_\text{NFW} = -1.3/1.1 = -1.182$']
    source: {cite: mit, at: 'Exercise 3.2, p. 56 (our own solution)'}
    origin: page-own

  - id: e2-r01
    where: 'Exercise 3.2(B): 1.182/2'
    inputs: {}
    formula: '(1.3/1.1)/2'
    expected: '0.591'
    shown: ['$\alpha = \ln(0.591)/\ln(0.1) = 0.228$']
    source: {cite: mit, at: 'Exercise 3.2, p. 56 (our own solution)'}
