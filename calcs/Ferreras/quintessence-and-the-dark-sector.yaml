# Calculations on content/year-5/Ferreras/quintessence-and-the-dark-sector.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 8.3–8.4. The page computes its own
# dark energy density and lookback time (H0 = 70 km/s/Mpc, Ω_m = 0.3, Ω_Λ = 0.7) rather than quoting the book's.

page: content/year-5/Ferreras/quintessence-and-the-dark-sector.mdx
calcs:
  - id: lookback-z1
    where: 'text and summary: light from redshift 1 left about 7.7 billion years ago'
    inputs: {H0: 70 km/s/Mpc}
    formula: integrate('1 / ((1 + x) * sqrt(0.3 * (1 + x)**3 + 0.7))', 'x', 0, 1) / H0
    expected: 7.7 gigayear
    shown: ['the light from redshift 1 left about 7.7 billion years ago', 'over the past 7.7 billion years']
    source: {cite: mit, at: 'p. 187'}
    origin: page-own

  - id: lookback-fraction
    where: 'text: some 57% of the universe''s age'
    formula: integrate('1 / ((1 + x) * sqrt(0.3 * (1 + x)**3 + 0.7))', 'x', 0, 1) / integrate('1 / ((1 + x) * sqrt(0.3 * (1 + x)**3 + 0.7))', 'x', 0, inf) * 100
    expected: 57
    shown: ['some 57% of the universe''s age']
    source: {cite: mit, at: 'p. 187'}
    origin: mit

  - id: w-example
    where: 'worked example "How close to −1?", step 1, and quiz 2: w = −0.95/1.05 ≈ −0.905'
    formula: (0.05 - 1) / (0.05 + 1)
    expected: -0.905
    shown: ['$w = (0.05V - V)/(0.05V + V) = -0.95/1.05 \approx -0.905$', '"$w = (0.05 - 1)/(0.05 + 1) \\approx -0.905$."']
    source: {cite: mit, at: 'Eqs. (8.17)–(8.18), p. 187'}
    origin: page-own

  - id: w-example-quiz
    where: 'quiz 2: marked choice "About −0.90"'
    formula: -((0.05 - 1) / (0.05 + 1))
    expected: 0.90
    shown: ['choices: ["About −1.05", "About −0.90", "About −0.50", "About 0"]']
    quiz: 1
    source: {cite: mit, at: 'Eqs. (8.17)–(8.18), p. 187'}
    origin: page-own

  - id: dilution-exponent
    where: 'worked example, step 2: ρ ∝ a^(−3(1+w)) = a^(−0.29)'
    formula: 3 * (1 + (0.05 - 1) / (0.05 + 1))
    expected: 0.29
    shown: ['$\rho \propto a^{-3(1+w)} = a^{-0.29}$']
    source: {cite: mit, at: 'p. 187'}
    origin: page-own

  - id: dilution-factor
    where: 'worked example, step 2: 2^(−0.29) ≈ 0.82, about 18%; matter falls by a factor of 8'
    formula: 2**(-0.29)
    expected: 0.82
    shown: ['its density falls by $2^{-0.29} \approx 0.82$, about 18%']
    source: {cite: mit, at: 'p. 187'}
    origin: page-own

  - id: de-density-gev4
    where: 'summary, text, flashcard 2 and summary: ρ_Λ ≈ 3 × 10⁻⁴⁷ GeV⁴ for H₀ = 70, Ω_Λ = 0.7'
    inputs: {H0: 70 km/s/Mpc, G: 6.6743e-11 m**3/(kg*s**2), c: 2.998e8 m/s, hc: 1.97327e-16 GeV*m}
    formula: 0.7 * 3 * H0**2 / (8 * pi * G) * c**2 * hc**3
    expected: 3e-47 GeV**4
    shown: ['Its tiny density, about 3 × 10⁻⁴⁷ GeV⁴', 'the present dark energy density is about $3 \times 10^{-47}$ GeV⁴', 'About $3 \\times 10^{-47}$ GeV⁴ (energy scale about 2 meV)', 'The measured density, about $3 \times 10^{-47}$ GeV⁴']
    source: {cite: mit, at: 'p. 187'}
    origin: page-own

  - id: de-energy-scale
    where: 'text, flashcard 2 and summary: an energy scale of about 2 meV'
    inputs: {rho: 2.78e-47 GeV**4}
    formula: rho**(1/4)
    expected: 2 meV
    shown: ['an energy scale of only about 2 meV', '(about 2 meV to the fourth power)']
    source: {cite: mit, at: 'p. 187'}
    origin: page-own

  - id: gut-vacuum
    where: 'text: Λ ~ 10¹⁵ GeV gives 10⁶⁰ GeV⁴, more than a hundred orders of magnitude too large; flashcard 2: about 10¹⁰⁶ times'
    inputs: {L: 1e15 GeV, rho: 2.78e-47 GeV**4}
    formula: L**4 / rho
    expected: 4e106
    shown: ['about $4 \\times 10^{106}$ times larger"','that is $10^{60}$ GeV⁴, more than a hundred orders of magnitude too large']
    source: {cite: mit, at: 'Eq. (8.21), p. 188'}
    origin: page-own

  - id: ratio-z1
    where: 'worked example "Why now?", step 2: at z = 1, 2.33/8 ≈ 0.29'
    formula: 0.7 / 0.3 / 2**3
    expected: 0.29
    shown: ['At $z = 1$: $2.33/8 \approx 0.29$']
    source: {cite: mit, at: 'p. 188'}
    origin: page-own

  - id: ratio-z3
    where: 'worked example, step 2, quiz 3 and summary: at z = 3, 2.33/64 ≈ 0.036, under 4%'
    formula: 0.7 / 0.3 / 4**3
    expected: 0.036
    shown: ['At $z = 3$: $2.33/64 \approx 0.036$, so dark energy was under 4%', 'at redshift 3 it was only about 4% of the matter density', 'it was under 4% of the matter at redshift 3']
    source: {cite: mit, at: 'p. 188'}
    origin: page-own

  - id: ratio-today
    where: 'worked example, step 1: 0.7/0.3 = 2.33'
    formula: 0.7 / 0.3
    expected: 2.33
    shown: ['$\rho_\Lambda/\rho_m = (0.7/0.3)(1+z)^{-3} = 2.33\,(1+z)^{-3}$']
    source: {cite: mit, at: 'p. 188'}
    origin: page-own

  - id: dark-budget
    kind: fact
    where: 'text, flashcard 3 and summary: about 70% dark energy, about 25% dark matter (about 80% of all matter)'
    value: 70
    shown: ['Today about **70%** of the universe''s energy budget is dark energy and about **25%** dark matter (about 80% of all the matter)', '"About 70% dark energy, about 25% dark matter (about 80% of all matter)', 'About 70% dark energy and 25% dark matter make up the budget']
    source: {cite: mit, at: 'p. 189'}
    origin: mit

  - id: hossenfelder-2017
    kind: fact
    where: 'text: Hossenfelder, 2017'
    value: 2017
    shown: ['(Hossenfelder, 2017)']
    source: {cite: mit, at: 'p. 190'}
    origin: mit

  - id: omega-lambda-quoted
    kind: fact
    where: 'text: Ω_Λ ≈ 0.7 heading towards 1'
    value: 0.7
    shown: ['with $\Omega_\Lambda \approx 0.7$ and heading towards 1', 'with $\Omega_\Lambda \approx 0.7$, the present']
    source: {cite: mit, at: 'p. 188'}
    origin: mit
