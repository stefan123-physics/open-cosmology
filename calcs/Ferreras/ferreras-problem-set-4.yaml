# Calculations on content/year-5/Ferreras/ferreras-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Source: I. Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Chapter 5, Exercises 5.1-5.7. The book prints no
# solutions; every solution here is ours. `cite: mit` means the book (textbook course).
# Inputs: T = 2.73 K and T_nu = 1.95 K (the book's), zeta(3) = 1.2020569; m_p = 1.67262192369e-27 kg and
# sigma_T = 6.6524587321e-29 m^2 (CODATA 2018), 1 eV = 1.602176634e-19 J (exact), 1 Mpc = 3.0857e22 m.
# Exercise 5.3: Omega_b h^2 = 0.022, h = 0.67, X = 0.75, Y = 0.25 (helium nucleus 4 m_p), Omega_m = 0.3 (our choice),
# Omega_r h^2 = 4.19e-5 (from Exercise 5.1). Exercise 5.5: g = 2, g*s(T_f) = 10.75 or 106.75, g*s,0 = 2 + 21/4 * 4/11.
# Integrals of the Planck and Fermi distributions are checked numerically with integrate() (upper limit 60).

page: content/year-5/Ferreras/ferreras-problem-set-4.mdx
calcs:
  # ---- Exercise 5.1

  - id: e1-kt-hbarc
    where: 'Exercise 5.1(A), solution: k_B T / hbar c at 2.73 K'
    inputs: {T: 2.73 K}
    formula: k_B*T/(hbar*c)
    expected: 1192.2 1/m
    shown: ['$k_BT/\hbar c = 1192.2$ m⁻¹ at 2.73 K']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-cube
    where: 'Exercise 5.1(A), solution: (k_B T / hbar c)^3'
    inputs: {T: 2.73 K}
    formula: (k_B*T/(hbar*c))**3
    expected: 1.6945e9 1/m**3
    shown: ['$(k_BT/\hbar c)^3 = 1.6945 \times 10^9$ m⁻³']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-coef
    where: 'Exercise 5.1(A), solution: 2 zeta(3)/pi^2'
    inputs: {zeta3: 1.2020569}
    formula: 2*zeta3/pi**2
    expected: '0.24359'
    shown: ['$n_\gamma = 0.24359 \times 1.6945']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-bose-int
    where: 'Exercise 5.1(A), hint: the integral of x^2/(e^x - 1) is 2 zeta(3)'
    inputs: {zeta3: 1.2020569}
    formula: integrate('x**2/(exp(x) - 1)', 'x', 1e-9, 60)
    expected: '2.4041138'
    tolerance: 1e-6
    shown: ['$\int_0^\infty x^2\,dx/(e^x - 1) = 2\zeta(3)$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-ng-m3
    where: 'Exercise 5.1(A), solution: n_gamma in m^-3'
    inputs: {T: 2.73 K, zeta3: 1.2020569}
    formula: 2*zeta3/pi**2*(k_B*T/(hbar*c))**3
    expected: 4.128e8 1/m**3
    shown: ['$= 4.128 \times 10^8$ m⁻³']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-ng
    answer: e1-ng
    where: 'Exercise 5.1(A), answer box: n_gamma in cm^-3'
    inputs: {T: 2.73 K, zeta3: 1.2020569}
    formula: 2*zeta3/pi**2*(k_B*T/(hbar*c))**3
    expected: 413 1/cm**3
    shown: ['id="e1-ng"', '$= 413$ photons per cm³']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-ng-cross
    where: 'Exercise 5.1(A): the photon density from the integral of the radiance, 8 pi (kT/hc)^3 times the integral, over the closed form'
    inputs: {zeta3: 1.2020569}
    formula: 8*pi/(2*pi)**3*integrate('x**2/(exp(x) - 1)', 'x', 1e-9, 60)/(2*zeta3/pi**2)
    expected: '1.000000'
    tolerance: 1e-6
    shown: ['= 8\pi\left(\frac{k_BT}{hc}\right)^3\int_0^\infty\frac{x^2\,dx}{e^x - 1}']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-kt-j
    where: 'Exercise 5.1(B), solution: k_B T at 2.73 K in J'
    inputs: {T: 2.73 K}
    formula: k_B*T
    expected: 3.7692e-23 J
    shown: ['(3.7692 \times 10^{-23}\ \text{J})']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-rg-si
    where: 'Exercise 5.1(B), solution: rho_gamma in J/m^3'
    inputs: {T: 2.73 K}
    formula: pi**2/15*k_B*T*(k_B*T/(hbar*c))**3
    expected: 4.202e-14 J/m**3
    shown: ['$= 4.202 \times 10^{-14}$ J/m³']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-pi2-15
    where: 'Exercise 5.1(B), solution: pi^2/15'
    inputs: {}
    formula: pi**2/15
    expected: '0.65797'
    shown: ['$\rho_\gamma = 0.65797 \times']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-rg
    answer: e1-rg
    where: 'Exercise 5.1(B), answer box: rho_gamma in eV/cm^3'
    inputs: {T: 2.73 K, ev1: 1.602176634e-19 J}
    formula: pi**2/15*k_B*T*(k_B*T/(hbar*c))**3/ev1
    expected: 0.262 1/cm**3
    shown: ['id="e1-rg"', 'J/m³ $= 0.262$ eV/cm³']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-bose-int3
    where: 'Exercise 5.1(B), hint: the integral of x^3/(e^x - 1) is pi^4/15'
    inputs: {}
    formula: integrate('x**3/(exp(x) - 1)', 'x', 1e-9, 60)/(pi**4/15)
    expected: '1.000000'
    tolerance: 1e-6
    shown: ['$\int_0^\infty x^3\,dx/(e^x - 1) = \pi^4/15$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-mean-ev
    where: 'Exercise 5.1(B), check: mean photon energy in eV'
    inputs: {T: 2.73 K, ev1: 1.602176634e-19 J, zeta3: 1.2020569}
    formula: pi**4/(30*zeta3)*k_B*T/ev1
    expected: '6.35e-4'
    shown: ['n_\gamma = 6.35 \times 10^{-4}$ eV $= 2.70\,k_BT$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-kt-ev
    where: 'Exercise 5.1(B), check: k_B T at 2.73 K in eV'
    inputs: {T: 2.73 K, ev1: 1.602176634e-19 J}
    formula: k_B*T/ev1
    expected: '2.35e-4'
    shown: ['(since $k_BT = 2.35 \times 10^{-4}$ eV)']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-mean-kt
    where: 'Exercise 5.1(B), check: pi^4/(30 zeta(3))'
    inputs: {zeta3: 1.2020569}
    formula: pi**4/(30*zeta3)
    expected: '2.70'
    shown: ['black-body value $\pi^4/(30\zeta(3)) = 2.70$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-cube-ratio
    where: 'Exercise 5.1(C), solution: (1.95/2.73)^3'
    inputs: {}
    formula: (1.95/2.73)**3
    expected: '0.3644'
    shown: ['$(1.95/2.73)^3 = 0.3644$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-nn
    answer: e1-nn
    where: 'Exercise 5.1(C), answer box: total neutrino number density, three families, in cm^-3'
    inputs: {Tn: 1.95 K, zeta3: 1.2020569}
    formula: 3*2*3/4*zeta3/pi**2*(k_B*Tn/(hbar*c))**3
    expected: 338 1/cm**3
    shown: ['id="e1-nn"', '412.8$ cm⁻³ $= 338$ cm⁻³']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-nn-family
    where: 'Exercise 5.1(C), solution: per family'
    inputs: {Tn: 1.95 K, zeta3: 1.2020569}
    formula: 2*3/4*zeta3/pi**2*(k_B*Tn/(hbar*c))**3
    expected: 113 1/cm**3
    shown: ['about 113 per family']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-fourth
    where: 'Exercise 5.1(C), solution: (1.95/2.73)^4'
    inputs: {}
    formula: (1.95/2.73)**4
    expected: '0.2603'
    shown: ['$(1.95/2.73)^4 = 0.2603$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-ratio
    answer: e1-ratio
    where: 'Exercise 5.1(C), answer box: rho_nu/rho_gamma'
    inputs: {}
    formula: 3*2*7/8/2*(1.95/2.73)**4
    expected: '0.683'
    shown: ['id="e1-ratio"', '$\rho_\nu/\rho_\gamma = 2.625 \times 0.2603 = 0.683$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-ratio-exact
    where: 'Exercise 5.1(C), check: with the exact (4/11)^(1/3)'
    inputs: {}
    formula: 21/8*(4/11)**(4/3)
    expected: '0.681'
    shown: ['$\rho_\nu/\rho_\gamma = \tfrac{21}{8}(4/11)^{4/3} = 0.681$']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  - id: e1-tnu
    where: 'Exercise 5.1(C), check: (4/11)^(1/3) x 2.73 K = 1.95 K'
    inputs: {}
    formula: (4/11)**(1/3)*2.73
    expected: '1.95'
    shown: ['The temperature 1.95 K is $(4/11)^{1/3} \times 2.73$ K']
    source: {cite: mit, at: 'Exercise 5.1, p. 106 (our own solution)'}
    origin: page-own

  # ---- Exercise 5.2

  - id: e2-temp
    kind: identity
    answer: e2-temp
    where: 'Exercise 5.2(A), answer box: gas temperature, against keeping T V^(2/3) fixed with V proportional to (1+z)^-3'
    formula: T*((1+z)/(1+w))**2
    equals: T*((1+w)**-3/(1+z)**-3)**(5/3 - 1)
    samples: {T: [100, 412, 1000, 250, 700], z: [0, 20, 5, 13, 1], w: [100, 150, 200, 120, 180]}
    tolerance: 1e-9
    shown: ['id="e2-temp"', 'T = T_d\left(\frac{1 + z}{1 + z_d}\right)^2']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  - id: e2-Td
    where: 'Exercise 5.2(B), solution: T_d = 2.73 x 151'
    inputs: {}
    formula: 2.73*151
    expected: '412'
    shown: ['$T_d = 2.73 \times 151 = 412$ K']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  - id: e2-sq
    where: 'Exercise 5.2(B), solution: (21/151)^2'
    inputs: {}
    formula: (21/151)**2
    expected: '0.01934'
    shown: ['412 \times 0.01934$ K']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  - id: e2-temp20
    answer: e2-temp20
    where: 'Exercise 5.2(B), answer box: gas temperature at z = 20 in K'
    inputs: {}
    formula: 2.73*151*(21/151)**2
    expected: '7.97'
    shown: ['id="e2-temp20"', '$= 7.97$ K.']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  - id: e2-Tg20
    where: 'Exercise 5.2(B), check: photon temperature at z = 20'
    inputs: {}
    formula: 2.73*21
    expected: '57.3'
    shown: ['$2.73 \times 21 = 57.3$ K']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  - id: e2-seven
    where: 'Exercise 5.2(B), check: "about seven times warmer"'
    inputs: {}
    formula: 57.33/7.973
    expected: '7.2'
    tolerance: 0.3
    shown: ['about seven times warmer']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  - id: e2-ratio
    where: 'Exercise 5.2(B), check: 21/151 and 57.3 x 0.139'
    inputs: {}
    formula: 2.73*21*21/151
    expected: '7.97'
    shown: ['(1 + z)/(1 + z_d) = 21/151 = 0.139$, and $57.3 \times 0.139 = 7.97$ K']
    source: {cite: mit, at: 'Exercise 5.2, p. 110 (our own solution)'}
    origin: page-own

  # ---- Exercise 5.3

  - id: e3-rhoc
    where: 'How to answer: critical density per h^2 in kg/m^3'
    inputs: {H0: 100 km/s/Mpc}
    formula: 3*H0**2/(8*pi*G)
    expected: 1.8783e-26 kg/m**3
    shown: ['$\rho_c = 3H_0^2/8\pi G = 1.8783 \times 10^{-26}\,h^2$ kg/m³']
    source: {cite: mit, at: 'p. 114 (our own solution)'}
    origin: page-own

  - id: e3-rhoc-ev
    where: 'How to answer: critical energy density per h^2 in eV/cm^3'
    inputs: {H0: 100 km/s/Mpc, ev1: 1.602176634e-19 J}
    formula: 3*H0**2/(8*pi*G)*c**2/ev1
    expected: 10537 1/cm**3
    tolerance: '0.01%'
    shown: ['as an energy density, $\rho_c c^2 = 10{,}537\,h^2$ eV/cm³']
    source: {cite: mit, at: 'p. 114 (our own solution)'}
    origin: page-own

  - id: e3-rhob
    where: 'Exercise 5.3(A), solution: baryon density today'
    inputs: {H0: 100 km/s/Mpc}
    formula: 0.022*3*H0**2/(8*pi*G)
    expected: 4.132e-28 kg/m**3
    shown: ['$\rho_{b,0} = 0.022 \times 1.8783 \times 10^{-26}$ kg/m³ $= 4.132 \times 10^{-28}$ kg/m³']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-xy
    where: 'Exercise 5.3(A), solution: X + Y/2'
    inputs: {}
    formula: 0.75 + 0.25/2
    expected: '0.875'
    shown: ['$n_e = (X + Y/2)\,\rho_b/m_p = 0.875\,\rho_b/m_p$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-ne
    answer: e3-ne
    where: 'Exercise 5.3(A), answer box: electron density today if fully ionised, m^-3'
    inputs: {H0: 100 km/s/Mpc, m_p: 1.67262192369e-27 kg}
    formula: 0.875*0.022*3*H0**2/(8*pi*G)/m_p
    expected: 0.216 1/m**3
    shown: ['id="e3-ne"', 'm⁻³ $= 0.216$ m⁻³']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-nb
    where: 'Exercise 5.3(A), check: baryon number density'
    inputs: {H0: 100 km/s/Mpc, m_p: 1.67262192369e-27 kg}
    formula: 0.022*3*H0**2/(8*pi*G)/m_p
    expected: 0.247 1/m**3
    shown: ['$\rho_{b,0}/m_p = 0.247$ m⁻³, and $0.875 \times 0.247 = 0.216$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-h0
    where: 'Exercise 5.3(B), hint: H0 = 67 km/s/Mpc in s^-1'
    inputs: {H0: 67 km/s/Mpc}
    formula: H0
    expected: 2.171e-18 1/s
    shown: ['$H_0 = 67$ km/s/Mpc is $2.171 \times 10^{-18}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-gamma0
    where: 'Exercise 5.3(B), solution: Gamma_0 = n_e0 sigma_T c'
    inputs: {H0: 100 km/s/Mpc, m_p: 1.67262192369e-27 kg, sT: 6.6524587321e-29 m**2}
    formula: 0.875*0.022*3*H0**2/(8*pi*G)/m_p*sT*c
    expected: 4.311e-21 1/s
    shown: ['$\Gamma_0 = 0.2162 \times 6.6525 \times 10^{-29} \times 2.9979 \times 10^8$ s⁻¹ $= 4.311 \times 10^{-21}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-hsqrt
    where: 'Exercise 5.3(B), solution: H0 sqrt(0.3)'
    inputs: {H0: 67 km/s/Mpc}
    formula: H0*sqrt(0.3)
    expected: 1.1893e-18 1/s
    shown: ['$H_0\sqrt{0.3} = 1.1893 \times 10^{-18}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-ratio
    where: 'Exercise 5.3(B), solution: H0 sqrt(Omega_m)/Gamma_0'
    inputs: {H0: 67 km/s/Mpc, H1: 100 km/s/Mpc, m_p: 1.67262192369e-27 kg, sT: 6.6524587321e-29 m**2}
    formula: H0*sqrt(0.3)/(0.875*0.022*3*H1**2/(8*pi*G)/m_p*sT*c)
    expected: '275.9'
    shown: ['Their ratio is 275.9, and $275.9^{2/3} = 42.4$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-zf
    kind: identity
    answer: e3-zf
    where: 'Exercise 5.3(B), answer box: 1 + z_dec against a root of Gamma/H - 1 in 1 + z'
    formula: (H*sqrt(W)/q)**(2/3)
    equals: solve('q*u**3/(H*sqrt(W)*u**1.5) - 1', 'u', 1, 1000)
    samples: {H: [2e-18, 2.4e-18, 2.17e-18, 2.3e-18, 2.1e-18], W: [0.2, 0.4, 0.3, 0.25, 0.35], q: [3e-21, 6e-21, 4.3e-21, 5e-21, 3.5e-21]}
    tolerance: 1e-6
    shown: ['id="e3-zf"', '1 + z_\text{dec} = \left(\frac{H_0\sqrt{\Omega_{m,0}}}{\Gamma_0}\right)^{2/3}']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-z
    answer: e3-z
    where: 'Exercise 5.3(B), answer box: z_dec'
    inputs: {H0: 67 km/s/Mpc, H1: 100 km/s/Mpc, m_p: 1.67262192369e-27 kg, sT: 6.6524587321e-29 m**2}
    formula: (H0*sqrt(0.3)/(0.875*0.022*3*H1**2/(8*pi*G)/m_p*sT*c))**(2/3) - 1
    expected: '41.4'
    shown: ['id="e3-z"', 'so $z_\text{dec} = 41.4$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-check-gamma
    where: 'Exercise 5.3(B), check: Gamma at z = 41.4'
    inputs: {}
    formula: 4.311e-21*42.38**3
    expected: '3.28e-16'
    shown: ['$\Gamma = 4.311 \times 10^{-21} \times 42.38^3$ s⁻¹ $= 3.28 \times 10^{-16}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-check-h
    where: 'Exercise 5.3(B), check: H at z = 41.4'
    inputs: {}
    formula: 1.1893e-18*42.38**1.5
    expected: '3.28e-16'
    shown: ['$H = 1.1893 \times 10^{-18} \times 42.38^{1.5}$ s⁻¹ $= 3.28 \times 10^{-16}$ s⁻¹']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-rad-share
    where: 'Exercise 5.3(B), check: radiation share at z_dec, 42.4/3214'
    inputs: {}
    formula: 100*42.4/3214
    expected: '1.3'
    shown: ['radiation is only about 1.3% of it: $42.4/3214$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-z-eds
    where: 'Exercise 5.3(B), check: the reading Omega_m = 1'
    inputs: {H0: 67 km/s/Mpc, H1: 100 km/s/Mpc, m_p: 1.67262192369e-27 kg, sT: 6.6524587321e-29 m**2}
    formula: (H0/(0.875*0.022*3*H1**2/(8*pi*G)/m_p*sT*c))**(2/3)
    expected: '63.3'
    shown: ['$1 + z_\text{dec} = 63.3$, $z_\text{dec} = 62$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-or
    where: 'Exercise 5.3(C), statement: Omega_r h^2 = 4.19e-5 from photons (2.73 K) and neutrinos (1.95 K)'
    inputs: {T: 2.73 K, H0: 100 km/s/Mpc}
    formula: (1 + 3*2*7/8/2*(1.95/2.73)**4)*pi**2/15*k_B*T*(k_B*T/(hbar*c))**3/(3*H0**2/(8*pi*G)*c**2)
    expected: '4.19e-5'
    shown: ['$\Omega_{r,0}h_0^2 = 4.19 \times 10^{-5}$']
    source: {cite: mit, at: 'Exercise 5.3, p. 114 (our own solution)'}
    origin: page-own

  - id: e3-omh2
    where: 'Exercise 5.3(C), solution: Omega_m h^2'
    inputs: {}
    formula: 0.3*0.67**2
