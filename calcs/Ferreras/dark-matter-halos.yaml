# Calculations on content/year-5/Ferreras/dark-matter-halos.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 3.1–3.2.

page: content/year-5/Ferreras/dark-matter-halos.mdx
calcs:
  - id: critical-density-msun-mpc3
    where: 'worked example "How big is a halo?", step 1: ρ_c ≈ 1.36 × 10¹¹ M⊙ per Mpc³'
    inputs: {H0: 70 km/s/Mpc, G: 6.6743e-11 m**3/(kg*s**2), u: 1 Mpc}
    formula: 3 * H0**2 / (8 * pi * G) * u**3 / M_sun
    expected: 1.36e11
    shown: ['$\rho_c = 3H_0^2/(8\pi G) \approx 1.36 \times 10^{11}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'p. 52, Exercise 3.1'}
    origin: page-own

  - id: mean-matter-density
    where: 'worked example, step 1: ρ̄ = 0.3 ρ_c ≈ 4.08 × 10¹⁰ M⊙ per Mpc³'
    inputs: {rc: 1.36e11}
    formula: 0.3 * rc
    expected: 4.08e10
    shown: ['$\bar\rho = 0.3\rho_c \approx 4.08 \times 10^{10}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'p. 52, Exercise 3.1'}
    origin: page-own

  - id: halo-radius
    where: 'worked example, step "The radius": R ≈ 0.21 Mpc, about 210 kpc'
    inputs: {M: 3e11, rb: 4.08e10}
    formula: (3 * M / (800 * pi * rb))**(1/3)
    expected: 0.21
    shown: ['Mpc $\approx 0.21$ Mpc, or about 210 kpc']
    source: {cite: mit, at: 'p. 52, Exercise 3.1'}
    origin: page-own

  - id: halo-vs-disc
    where: 'worked example, step "Compare": the halo radius (210 kpc) is some forty times the radius of a 10 kpc disc'
    inputs: {R: 210, d: 5}
    formula: R / d
    expected: 40
    shown: ['the halo''s radius is some forty times the disc''s']
    source: {cite: mit, at: 'p. 52'}
    origin: page-own

  - id: collapse-overdensity
    kind: fact
    where: 'text: mean density about 180 times the background at collapse; halo radius at about 200 times'
    value: 180
    shown: ['a halo''s mean density is about 180 times the background density', 'is about **200 times the background density at virialisation**']
    source: {cite: mit, at: 'pp. 51 and 57'}
    origin: mit

  - id: milky-way-sizes
    kind: fact
    where: 'text and quiz 1: Milky Way disc 10–20 kpc, halo 100–200 kpc'
    value: 200 kpc
    shown: ['the Milky Way''s stellar disc reaches about 10–20 kpc, its dark halo about 100–200 kpc', 'The Milky Way''s disc extends to about 10–20 kpc, its halo to about 100–200 kpc']
    source: {cite: mit, at: 'p. 52'}
    origin: mit

  - id: cluster-halos-redshift
    kind: fact
    where: 'text: cluster-sized halos (≳ 10¹⁴ M⊙) common only below z ≈ 2'
    value: 2
    shown: ['Cluster-sized halos ($\gtrsim 10^{14}\,M_\odot$) become common only at redshifts below about 2']
    source: {cite: mit, at: 'p. 53, Figure 3.1'}
    origin: mit

  - id: smooth-accretion
    kind: fact
    where: 'text: about 40% of halo mass from smooth accretion (Genel et al. 2010)'
    value: 40
    shown: ['about 40% of a halo''s mass is gained by **smooth accretion**', '(Genel and collaborators, 2010)']
    source: {cite: mit, at: 'p. 54'}
    origin: mit

  - id: profile-references
    kind: fact
    where: 'text: NFW (1996), Hernquist (1990); steeper centres α ≈ 1.5, cores α ≈ 0'
    value: 1996
    shown: ['**Navarro–Frenk–White (NFW) profile** (1996)', 'The **Hernquist profile** (1990)', 'steeper centres ($\alpha \approx 1.5$) or cores ($\alpha \approx 0$)']
    source: {cite: mit, at: 'p. 56'}
    origin: mit

  - id: einasto-slope
    kind: identity
    where: 'text: the Einasto slope is γ = −2x^α, which is −2 at x = 1'
    formula: deriv('-2 / a * (exp(y * a) - 1)', 'y', log(X))
    equals: -2 * X**a
    samples: {X: [0.1, 1, 3, 20], a: [0.17, 0.2, 0.3, 0.5]}
    shown: ['whose slope $\gamma = -2x^\alpha$ passes through $-2$']
    source: {cite: mit, at: 'Eq. (3.3), p. 56, Exercise 3.2'}
    origin: mit

  - id: einasto-alpha
    kind: fact
    where: 'text and plot caption: Einasto with α ≈ 0.2 follows NFW'
    value: 0.2
    shown: ['with $\alpha \approx 0.2$ its slope is comparable to that of the NFW profile', 'Einasto approach NFW near α ≈ 0.2']
    source: {cite: mit, at: 'p. 56, Exercise 3.2'}
    origin: mit

  - id: nfw-slope
    kind: identity
    where: 'plot caption: NFW slope γ = −(1 + 3x)/(1 + x)'
    formula: deriv('-y - 2 * log(1 + exp(y))', 'y', log(X))
    equals: -(1 + 3 * X) / (1 + X)
    samples: {X: [0.01, 0.5, 1, 7, 50]}
    shown: ['NFW, γ = −(1 + 3x)/(1 + x)']
    source: {cite: mit, at: 'Eqs. (3.1)–(3.2), p. 55'}
    origin: page-own

  - id: hernquist-slope
    kind: identity
    where: 'plot caption: Hernquist slope γ = −(1 + 4x)/(1 + x)'
    formula: deriv('-y - 3 * log(1 + exp(y))', 'y', log(X))
    equals: -(1 + 4 * X) / (1 + X)
    samples: {X: [0.01, 0.5, 1, 7, 50]}
    shown: ['Hernquist, γ = −(1 + 4x)/(1 + x)']
    source: {cite: mit, at: 'Eqs. (3.1)–(3.2), p. 55'}
    origin: page-own

  - id: nfw-mass-integral
    kind: identity
    where: 'worked example "Mass and rotation curve of an NFW halo", step 1: ∫₀ˣ x′/(1+x′)² dx′ = ln(1+x) − x/(1+x)'
    formula: integrate('y / (1 + y)**2', 'y', 0, X)
    equals: log(1 + X) - X / (1 + X)
    samples: {X: [0.3, 1, 2.163, 10, 40]}
    shown: ['4\pi\rho_0 r_S^3\left[\ln(1+x) - \frac{x}{1+x}\right]$']
    source: {cite: mit, at: 'p. 56, Exercise 3.3'}
    origin: page-own

  - id: nfw-vmax
    where: 'worked example, step "Peak of the rotation curve", quiz 3 and summary: x ≈ 2.163'
    formula: solve('log(1 + x) - x**2 / (1 + x)**2 - x / (1 + x)', 'x', 0.5, 10)
    expected: 2.163
    shown: ['solved numerically at $x \approx 2.163$', 'gives $x \\approx 2.163$']
    source: {cite: mit, at: 'p. 56, Exercise 3.3'}
    origin: page-own

  - id: nfw-vmax-quiz
    where: 'quiz 3: marked choice "about 2.16 r_S"; also the worked example and summary'
    formula: solve('log(1 + x) - x**2 / (1 + x)**2 - x / (1 + x)', 'x', 0.5, 10)
    expected: 2.16
    shown: ['"At about $2.16\\,r_S$"', 'peaks at about $2.16\,r_S$.', 'rotation curve peaks at $2.16\,r_S$']
    quiz: 2
    source: {cite: mit, at: 'p. 56, Exercise 3.3'}
    origin: page-own

  - id: spin-peak
    kind: fact
    where: 'text, flashcard 3 and summary: spin parameter peaks at λ ≈ 0.04'
    value: 0.04
    shown: ['peaking at $\lambda \approx 0.04$', 'halos have λ ≈ 0.04 (log-normal', 'spin slowly ($\lambda \approx 0.04$)']
    source: {cite: mit, at: 'p. 62'}
    origin: mit
