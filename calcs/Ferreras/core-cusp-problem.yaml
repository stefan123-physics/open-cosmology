# Calculations on content/year-5/Ferreras/core-cusp-problem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 3.3–3.4.

page: content/year-5/Ferreras/core-cusp-problem.mdx
calcs:
  - id: contraction-solution
    kind: identity
    where: 'worked example "How far does a shell contract?", step "Solve": r_f = r_i²/(f_d R + (1 − f_d) r_i) satisfies r_i²/R = r_f [f_d + (1 − f_d) r_i/R]'
    formula: ri**2 / R0 - (ri**2 / (f * R0 + (1 - f) * ri)) * (f + (1 - f) * ri / R0)
    equals: 0 * ri
    samples: {ri: [10, 50, 3], R0: [200, 200, 150], f: [0.05, 0.05, 0.1]}
    tolerance: 1e-9
    shown: ['$r_f = \dfrac{r_i^2}{f_d R + (1 - f_d) r_i}$']
    source: {cite: mit, at: 'Eq. (3.7), p. 63'}
    origin: page-own

  - id: contraction-10kpc
    where: 'worked example, step "Solve": r_i = 10 kpc gives r_f = 100/(10 + 9.5) ≈ 5.1 kpc'
    inputs: {ri: 10, R: 200, f: 0.05}
    formula: ri**2 / (f * R + (1 - f) * ri)
    expected: 5.1
    shown: ['$r_f = 100/(10 + 9.5) \approx 5.1$ kpc']
    source: {cite: mit, at: 'Eq. (3.7), p. 63'}
    origin: page-own

  - id: contraction-50kpc
    where: 'worked example, step "Farther out": r_i = 50 kpc gives r_f = 2500/(10 + 47.5) ≈ 43 kpc'
    inputs: {ri: 50, R: 200, f: 0.05}
    formula: ri**2 / (f * R + (1 - f) * ri)
    expected: 43
    shown: ['$r_f = 2500/(10 + 47.5) \approx 43$ kpc']
    source: {cite: mit, at: 'Eq. (3.7), p. 63'}
    origin: page-own

  - id: blumenthal-1986
    kind: fact
    where: 'text: Blumenthal and collaborators (1986)'
    value: 1986
    shown: ['A simple model by Blumenthal and collaborators (1986)', '"Adiabatic contraction (Blumenthal et al. 1986)"']
    source: {cite: mit, at: 'p. 62'}
    origin: mit

  - id: pseudo-iso-slope
    kind: identity
    where: 'plot caption: pseudo-isothermal slope −2x²/(1 + x²)'
    formula: deriv('-log(1 + exp(2 * y))', 'y', log(X))
    equals: -2 * X**2 / (1 + X**2)
    samples: {X: [0.01, 0.5, 1, 7, 50]}
    shown: ['the pseudo-isothermal sphere and the Burkert profile flatten to 0']
    source: {cite: mit, at: 'Eq. (3.8), p. 65'}
    origin: page-own

  - id: burkert-slope
    kind: identity
    where: 'plot curve: Burkert slope −x/(1 + x) − 2x²/(1 + x²)'
    formula: deriv('-log(1 + exp(y)) - log(1 + exp(2 * y))', 'y', log(X))
    equals: -X / (1 + X) - 2 * X**2 / (1 + X**2)
    samples: {X: [0.01, 0.5, 1, 7, 50]}
    shown: ['Burkert and NFW both approach −3']
    source: {cite: mit, at: 'Eq. (3.9), p. 65'}
    origin: page-own

  - id: lazar-range
    kind: fact
    where: 'text and summary: baryons make cores for 10⁻³ ≲ M⋆/M_halo ≲ 2 × 10⁻²; slope measured within 1–2% of the virial radius (Lazar et al. 2020)'
    value: 0.02
    shown: ['roughly $10^{-3} \lesssim M_\star/M_\text{halo} \lesssim 2 \times 10^{-2}$', 'works for $10^{-3} \lesssim M_\star/M_\text{halo} \lesssim 2 \times 10^{-2}$', 'within the central 1–2% of the virial radius', '(Lazar and collaborators, 2020)']
    source: {cite: mit, at: 'p. 66, Figure 3.4'}
    origin: mit

  - id: total-dispersion-identity
    kind: identity
    where: 'formula "Total velocity dispersion": σ_r² + 2σ_⊥² with β = 1 − (σ_⊥/σ_r)² equals σ_r²(3 − 2β)'
    formula: sr**2 + 2 * sp**2
    equals: sr**2 * (3 - 2 * (1 - (sp / sr)**2))
    samples: {sr: [1, 2, 0.5], sp: [1, 0.7, 2]}
    shown: ['= \sigma_r^2 + 2\sigma_\perp^2 = \sigma_r^2\,(3 - 2\beta)']
    source: {cite: mit, at: 'Eq. (3.12), p. 68'}
    origin: mit

  - id: mass-total-identity
    kind: identity
    where: 'formula "Mass in terms of the total dispersion": σ_r²(γ_ρ + γ_σ − 2β) = σ_tot² + σ_r²(γ_ρ + γ_σ − 3) (the book prints a minus; this identity is why the page uses the plus sign)'
    formula: sr**2 * (gr + gv - 2 * b)
    equals: sr**2 * (3 - 2 * b) + sr**2 * (gr + gv - 3)
    samples: {sr: [1, 2.5], gr: [3, 1.2], gv: [0, -0.3], b: [0.2, -0.5]}
    shown: ['M(r) = \frac{r}{G}\left[\sigma_\text{tot}^2 + \sigma_r^2\left(\gamma_\rho + \gamma_\sigma - 3\right)\right]']
    source: {cite: mit, at: 'Eq. (3.13), p. 68'}
    origin: page-own

  - id: wolf-2010
    kind: fact
    where: 'text: Wolf and collaborators, 2010; Lazar and Bullock, 2020'
    value: 2010
    shown: ['(Wolf and collaborators, 2010)', '(Lazar and Bullock, 2020)']
    source: {cite: mit, at: 'pp. 68–69'}
    origin: mit

  - id: dwarf-r3
    where: 'worked example "Weighing a dwarf galaxy": r₃ ≈ (4/3) × 0.25 ≈ 0.33 kpc'
    formula: 4 / 3 * 0.25
    expected: 0.33
    shown: ['$r_3 \approx \tfrac43 \times 0.25 \approx 0.33$ kpc']
    source: {cite: mit, at: 'Eq. (3.14), p. 68'}
    origin: page-own

  - id: dwarf-mass
    where: 'worked example, step "The mass": M(r₃) ≈ 1.9 × 10⁷ M⊙; quiz 4'
    inputs: {r3: 0.333 kpc, s: 9 km/s, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: 3 * r3 * s**2 / (G * M_sun)
    expected: 1.9e7
    shown: ['$M(r_3) = 3 r_3\langle\sigma_\text{LOS}^2\rangle/G = 3 \times 0.333 \times 9^2 / 4.30 \times 10^{-6} \approx 1.9 \times 10^7\,M_\odot$']
    source: {cite: mit, at: 'Eq. (3.14), p. 68'}
    origin: page-own

  - id: dwarf-mass-quiz
    where: 'quiz 4: marked choice about 1.9 × 10⁷ M⊙'
    inputs: {r3: 0.333 kpc, s: 9 km/s, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: 3 * r3 * s**2 / (G * M_sun)
    expected: 1.9e7
    shown: ['"$3 \\times 0.333 \\times 81 / 4.30 \\times 10^{-6} \\approx 1.9 \\times 10^7\\,M_\\odot$."']
    quiz: 3
    source: {cite: mit, at: 'Eq. (3.14), p. 68'}
    origin: page-own

  - id: dwarf-ml
    where: 'worked example, step "Mass-to-light ratio": M/L ≈ 1.9 × 10⁷ / 10⁵ ≈ 190'
    inputs: {M: 1.9e7, L: 1e5}
    formula: M / L
    expected: 190
    shown: ['$M/L \approx 1.9 \times 10^7 / 10^5 \approx 190$']
    source: {cite: mit, at: 'Eq. (3.14), p. 68'}
    origin: page-own
