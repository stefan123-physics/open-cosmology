# Calculations on content/year-5/Ferreras/galaxies-in-halos.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 4.5–4.7.

page: content/year-5/Ferreras/galaxies-in-halos.mdx
calcs:
  - id: correlation-facts
    kind: fact
    where: 'text, flashcard 2 and summary: r₀ ≈ 3–5 Mpc, γ ≈ 1.8, 1-halo/2-halo switch at about 1–2 Mpc'
    value: 1.8
    shown: ['**correlation length** $r_0 \approx 3$–5 Mpc and $\gamma \approx 1.8$', 'the switch happens at the size of large halos, about 1–2 Mpc', 'The switch is at about 1–2 Mpc.', 'with $r_0 \approx 3$–5 Mpc; the bias', '1-halo and 2-halo terms meet at about 1–2 Mpc']
    source: {cite: mit, at: 'pp. 96–98'}
    origin: mit

  - id: ncen-at-threshold
    where: 'worked example "How many galaxies in a cluster-mass halo?", step 1, and quiz 3: N_cen = ½[1 + erf(0)] = 0.5'
    formula: 0.5 * (1 + erf(0))
    expected: 0.5
    shown: ['$N_\text{cen} = \tfrac12[1 + \text{erf}(0)] = 0.5$ and', 'erf(0) = 0, so $N_\\text{cen} = 1/2$']
    source: {cite: mit, at: 'Eq. (4.17), p. 98'}
    origin: page-own

  - id: ncen-at-threshold-quiz
    where: 'quiz 3: marked choice 0.5'
    formula: 0.5 * (1 + erf(0))
    expected: 0.5
    shown: ['choices: ["0", "0.5", "1", "2"]']
    quiz: 2
    source: {cite: mit, at: 'Eq. (4.17), p. 98'}
    origin: page-own

  - id: ncen-cluster
    where: 'worked example, step 2: N_cen = ½[1 + erf(10)] = 1'
    formula: 0.5 * (1 + erf((14 - 12) / 0.2))
    expected: 1
    shown: ['$N_\text{cen} = \tfrac12[1 + \text{erf}(10)] = 1$']
    source: {cite: mit, at: 'Eq. (4.17), p. 98'}
    origin: page-own

  - id: nsat-cluster
    where: 'worked example, step 2: N_sat = (10¹⁴ − 10¹²)/10^13.3 ≈ 5.0'
    formula: 1e14 / 10**13.3
    expected: 5.0
    shown: ['$N_\text{sat} = 10^{14}/10^{13.3} \approx 5.0$']
    source: {cite: mit, at: 'Eq. (4.18), p. 98'}
    origin: page-own

  - id: n-total-cluster
    where: 'worked example, step 2: ⟨N⟩ ≈ 6'
    formula: 0.5 * (1 + erf(10)) + 1e14 / 10**13.3
    expected: 6
    shown: ['So $\langle N\rangle \approx 6$ galaxies']
    source: {cite: mit, at: 'Eqs. (4.17)–(4.18), p. 98'}
    origin: page-own

  - id: moster-2010
    kind: fact
    where: 'text: Moster and collaborators, 2010; peak about 3%; baryon fraction 18.6%; universe about 4 billion years old at z = 1.5'
    value: 0.186
    shown: ['the relation of Moster and collaborators, 2010', 'Today the peak is about **3%** of the dark matter mass, against a cosmic baryon-to-dark-matter ratio of **18.6%**', 'when the universe was only about 4 billion years old']
    source: {cite: mit, at: 'pp. 101–102, Figure 4.3'}
    origin: mit

  - id: baryon-sixth
    where: 'text, quiz 4 and summary: 3/18.6 ≈ 0.16, about a sixth'
    inputs: {s: 0.03, b: 0.186}
    formula: s / b
    expected: 0.16
    shown: ['"$3/18.6 \\approx 0.16$. Star formation', 'only about **a sixth** of the baryons']
    source: {cite: mit, at: 'p. 102'}
    origin: mit

  - id: baryon-sixth-quiz
    kind: fact
    where: 'quiz 4 (choices quoted) and summary: peak about 3%, baryon fraction 18.6%'
    value: 0.03
    shown: ['peaks at about 3% today, while the cosmic ratio of baryons to dark matter is 18.6%', 'M⋆/M_halo peaks at about 3% today (vs 18.6%, the cosmic ratio of baryons to dark matter)', 'a stellar-to-halo ratio peaking at about 3% today, against a cosmic baryon-to-dark-matter ratio of 18.6%']
    source: {cite: mit, at: 'p. 102'}
    origin: mit

  - id: example-stars
    where: 'worked example "Where are a halo''s baryons?", step 1: 0.03 × 10¹² = 3 × 10¹⁰ M⊙'
    formula: 0.03 * 1e12
    expected: 3e10
    shown: ['$0.03 \times 10^{12} = 3 \times 10^{10}\,M_\odot$']
    source: {cite: mit, at: 'p. 102'}
    origin: page-own

  - id: example-baryons
    where: 'worked example, step 2: 0.186 × 10¹² ≈ 1.9 × 10¹¹ M⊙'
    formula: 0.186 * 1e12
    expected: 1.9e11
    shown: ['$0.186 \times 10^{12} \approx 1.9 \times 10^{11}\,M_\odot$']
    source: {cite: mit, at: 'p. 102'}
    origin: page-own

  - id: example-efficiency
    where: 'worked example, step 3: 3 × 10¹⁰ / 1.86 × 10¹¹ ≈ 0.16'
    formula: 3e10 / 1.86e11
    expected: 0.16
    shown: ['$3 \times 10^{10} / 1.86 \times 10^{11} \approx 0.16$']
    source: {cite: mit, at: 'p. 102'}
    origin: page-own
