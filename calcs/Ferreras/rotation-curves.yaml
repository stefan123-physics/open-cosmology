# Calculations on content/year-5/Ferreras/rotation-curves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 2.1–2.2.

page: content/year-5/Ferreras/rotation-curves.mdx
calcs:
  - id: kpc-in-metres
    where: 'section "Gravity as a potential": a kiloparsec is about 3 × 10¹⁹ m'
    inputs: {d: 1 kpc}
    formula: d
    expected: 3e19 m
    shown: ['is about 3 × 10¹⁹ m']
    source: {cite: mit, at: 'p. 14, footnote 2'}
    origin: page-own

  - id: sun-galactocentric
    kind: fact
    where: 'section "Gravity as a potential": the Sun is about 8 kpc from the centre of our Galaxy'
    value: 8 kpc
    shown: ['the Sun is about 8 kpc from the centre']
    source: {cite: mit, at: 'p. 14, footnote 2'}
    origin: mit

  - id: g-astro-units
    where: 'worked example "How much of a galaxy is dark?", step 1, and flashcard 1: G = 4.30 × 10⁻⁶ kpc (km/s)² M⊙⁻¹'
    inputs: {G: 6.6743e-11 m**3/(kg*s**2), u: 1 kpc, w: 1 km/s}
    formula: G * M_sun / (u * w**2)
    expected: 4.30e-6
    shown: ['In astronomical units, $G = 4.30 \times 10^{-6}$ kpc', 'with $G = 4.30 \\times 10^{-6}$ kpc', 'Using $G = 4.30 \\times 10^{-6}$ kpc']
    source: {cite: mit, at: 'p. 18, "How about ...?"'}
    origin: mit

  - id: quiz-mass-40kpc
    where: 'quiz 2: M = 40 × 180² / 4.30 × 10⁻⁶ ≈ 3 × 10¹¹ M⊙'
    inputs: {r: 40 kpc, v: 180 km/s, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: r * v**2 / (G * M_sun)
    expected: 3e11
    shown: ['$M = r v_c^2/G = 40 \\times 180^2 / 4.30 \\times 10^{-6} \\approx 3.0 \\times 10^{11}\\,M_\\odot$']
    quiz: 1
    source: {cite: mit, at: 'Eq. (2.4), p. 16'}
    origin: page-own

  - id: example-mass-40kpc
    where: 'worked example "How much of a galaxy is dark?", step "Mass inside 40 kpc"'
    inputs: {r: 40 kpc, v: 180 km/s, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: r * v**2 / (G * M_sun)
    expected: 3.0e11
    shown: ['$M = r v_c^2 / G = 40 \times 180^2 / 4.30 \times 10^{-6} \approx 3.0 \times 10^{11}\,M_\odot$']
    source: {cite: mit, at: 'Eq. (2.4), p. 16'}
    origin: page-own

  - id: example-dark-fraction
    where: 'worked example, step "The dark fraction": about 83% is dark'
    inputs: {Mvis: 5e10, M: 3.0e11}
    formula: 100 * (1 - Mvis / M)
    expected: 83
    shown: ['about 83% of the mass inside 40 kpc is dark']
    source: {cite: mit, at: 'Eq. (2.4), p. 16'}
    origin: page-own

  - id: example-visible-sixth
    where: 'worked example, step "The dark fraction": the visible mass is about a sixth'
    inputs: {Mvis: 5e10, M: 3.0e11}
    formula: M / Mvis
    expected: 6
    shown: ['is only about a sixth of this']
    source: {cite: mit, at: 'Eq. (2.4), p. 16'}
    origin: page-own

  - id: example-kepler-speed
    where: 'worked example, step "What the visible mass alone would do": v ≈ 73 km/s'
    inputs: {M: 5e10, r: 40 kpc, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: sqrt(G * M * M_sun / r)
    expected: 73 km/s
    shown: ['$v = \sqrt{GM/r} = \sqrt{4.30 \times 10^{-6} \times 5 \times 10^{10} / 40} \approx 73$ km/s']
    source: {cite: mit, at: 'Eq. (2.3), p. 15'}
    origin: page-own

  - id: ngc2841-mass
    where: 'text: NGC 2841, flat at about 300 km/s out to 35 kpc, gives about 7.3 × 10¹¹ M⊙'
    inputs: {r: 35 kpc, v: 300 km/s, G: 6.6743e-11 m**3/(kg*s**2)}
    formula: r * v**2 / (G * M_sun)
    expected: 7.3e11
    shown: ['The same formula gives about $7.3 \times 10^{11}\,M_\odot$']
    source: {cite: mit, at: 'p. 21'}
    origin: mit

  - id: ngc2841-luminosity
    where: 'text: log(L_V/L⊙) ≈ 10.85 from M_V = −22.3 and M_V,⊙ = 4.83'
    inputs: {Msun: 4.83, Mgal: -22.3}
    formula: 0.4 * (Msun - Mgal)
    expected: 10.85
    shown: ['$\log(L_V/L_\odot) \approx 10.85$ (from an absolute magnitude of −22.3, against 4.83 for the Sun)']
    source: {cite: mit, at: 'p. 21'}
    origin: mit

  - id: ngc2841-mass-to-light
    where: 'text: Υ = M/L_V ≈ 10'
    inputs: {M: 7.3e11, logL: 10.85}
    formula: M / 10**logL
    expected: 10
    shown: ['$\Upsilon = M/L_V \approx 10$ in solar units']
    source: {cite: mit, at: 'p. 21'}
    origin: mit

  - id: spider-example
    where: 'worked example "The spider pattern", step "Project": i = 60°, 200 km/s gives ±173 km/s'
    inputs: {v: 200 km/s, i: 60 degree}
    formula: v * sin(i)
    expected: 173 km/s
    shown: ['rotating at 200 km/s shows ±173 km/s']
    source: {cite: mit, at: 'p. 21, Exercise 2.1'}
    origin: page-own

  - id: oiii-line
    kind: fact
    where: 'text: [O III] at 5007 Å'
    value: 5007 angstrom
    shown: ['[O III] at 5007 Å']
    source: {cite: mit, at: 'p. 21'}
    origin: mit

  - id: tully-fisher-exponent
    kind: fact
    where: 'text, quiz 4 and summary: the Tully–Fisher exponent is close to 4'
    value: 4
    shown: ['always close to 4', 'roughly $L \\propto v_\\text{max}^4$', '$L \propto v_\text{max}^4$, and its baryonic version']
    source: {cite: mit, at: 'Eq. (2.6), p. 22'}
    origin: mit

  - id: mcgaugh-2000
    kind: fact
    where: 'text: the baryonic Tully–Fisher relation (McGaugh and collaborators, 2000)'
    value: 2000
    shown: ['(McGaugh and collaborators, 2000)']
    source: {cite: mit, at: 'p. 22'}
    origin: mit

  - id: ten-kpc-scale
    kind: fact
    where: 'section "Gravity as a potential": dark matter shows itself from about 10 kpc upwards'
    value: 10 kpc
    shown: ['from about 10 kpc upwards']
    source: {cite: mit, at: 'p. 14'}
    origin: mit

  - id: summary-ngc2841
    kind: fact
    where: 'summary: in NGC 2841 the mass-to-light ratio is about 10'
    value: 10
    shown: ['In NGC 2841 the mass-to-light ratio is about 10']
    source: {cite: mit, at: 'p. 21'}
    origin: mit
