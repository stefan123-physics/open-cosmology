# Calculations on content/year-5/Ferreras/gravitational-lensing.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Section 2.6. Cosmology for the examples:
# flat, H0 = 70 km/s/Mpc, Ω_m,0 = 0.3, Ω_Λ,0 = 0.7 (the book's choice for its lens example).
# The book's own example (HE 2149−2745) is mentioned on the page without its numbers: its point-mass Einstein
# radius (2.73″) is four times what the image positions (1.354″, 0.344″) give; see the review file.

page: content/year-5/Ferreras/gravitational-lensing.mdx
calcs:
  - id: sun-deflection-newton-rad
    where: 'worked example "Light bending at the edge of the Sun", step 1: 2GM/(c²b) ≈ 4.24 × 10⁻⁶ rad'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 1.989e30 kg, c: 3.00e8 m/s, b: 6.96e8 m}
    formula: 2 * G * M / (c**2 * b)
    expected: 4.24e-6
    shown: ['\approx 4.24 \times 10^{-6}$ rad, or about']
    source: {cite: mit, at: 'p. 33, Exercise 2.6'}
    origin: page-own

  - id: sun-deflection-newton-arcsec
    where: 'worked example, step 1: about 0.87 arcseconds'
    inputs: {a: 4.24e-6 radian}
    formula: a
    expected: 0.87 arcsecond
    shown: ['rad, or about 0.87 arcseconds']
    source: {cite: mit, at: 'p. 33'}
    origin: page-own

  - id: sun-deflection-half-quiz
    where: 'quiz 3: half of 1.75″ is about 0.88″'
    inputs: {a: 1.751 arcsecond}
    formula: a / 2
    expected: 0.88 arcsecond
    shown: ['"Half as much, about 0.88″"']
    source: {cite: mit, at: 'p. 33'}
    origin: page-own

  - id: sun-deflection-gr
    where: 'worked example, step 2, quiz 3 and summary: 4GM/(c²b) ≈ 1.75 arcseconds'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 1.989e30 kg, c: 2.998e8 m/s, b: 6.96e8 m}
    formula: 4 * G * M / (c**2 * b)
    expected: 1.75 arcsecond
    shown: ['Twice as much: about 1.75 arcseconds', 'is deflected by about 1.75 arcseconds', '(1.75″ at the Sun''s edge)']
    source: {cite: mit, at: 'p. 33'}
    origin: page-own

  - id: eddington-1919
    kind: fact
    where: 'worked example, step 2, and quiz 3 explanation: the 1919 eclipse'
    value: 1919
    shown: ['Eddington''s 1919 eclipse expedition', 'as the 1919 eclipse measurements showed']
    source: {cite: mit, at: 'p. 33'}
    origin: page-own

  - id: distance-DL
    where: 'worked example "The Einstein radius of a lens galaxy": D_L ≈ 1259 Mpc for z = 0.5'
    inputs: {H0: 70 km/s/Mpc, c: 299792.458 km/s}
    formula: c / (H0 * 1.5) * integrate('1 / sqrt(0.3 * (1 + x)**3 + 0.7)', 'x', 0, 0.5)
    expected: 1259 Mpc
    shown: ['$D_L \approx 1259$ Mpc']
    source: {cite: mit, at: 'Eq. (2.10), p. 32'}
    origin: page-own

  - id: distance-DS
    where: 'worked example: D_S ≈ 1727 Mpc for z = 2.0'
    inputs: {H0: 70 km/s/Mpc, c: 299792.458 km/s}
    formula: c / (H0 * 3.0) * integrate('1 / sqrt(0.3 * (1 + x)**3 + 0.7)', 'x', 0, 2.0)
    expected: 1727 Mpc
    shown: ['$D_S \approx 1727$ Mpc']
    source: {cite: mit, at: 'Eq. (2.10), p. 32'}
    origin: page-own

  - id: distance-DLS
    where: 'worked example: D_LS ≈ 1097 Mpc'
    inputs: {H0: 70 km/s/Mpc, c: 299792.458 km/s}
    formula: c / (H0 * 3.0) * integrate('1 / sqrt(0.3 * (1 + x)**3 + 0.7)', 'x', 0.5, 2.0)
    expected: 1097 Mpc
    shown: ['$D_{LS} \approx 1097$ Mpc']
    source: {cite: mit, at: 'Eq. (2.11), p. 33'}
    origin: page-own

  - id: distance-ratio
    where: 'worked example, step "The distance ratio": D_LS/D_S ≈ 0.635'
    inputs: {DLS: 1097 Mpc, DS: 1727 Mpc}
    formula: DLS / DS
    expected: 0.635
    shown: ['$D_{LS}/D_S \approx 0.635$']
    source: {cite: mit, at: 'Eq. (2.11), p. 33'}
    origin: page-own

  - id: sigma-critical
    where: 'section "Thin lenses": Σ_cr ≈ 2100 M⊙ per pc² for z_L = 0.5, z_S = 2'
    inputs: {c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), DL: 1259 Mpc, DS: 1727 Mpc, DLS: 1097 Mpc, u: 1 pc}
    formula: c**2 / (4 * pi * G) * DS / (DL * DLS) * u**2 / M_sun
    expected: 2100
    shown: ['$\Sigma_\text{cr} \approx 2100\,M_\odot$ per pc²']
    source: {cite: mit, at: 'Eq. (2.17), p. 35'}
    origin: page-own

  - id: einstein-radius-rad
    where: 'worked example, step "The angle": θ_E = 4π (2.5 × 10⁵ / 3.00 × 10⁸)² × 0.635 ≈ 5.54 × 10⁻⁶ rad'
    inputs: {s: 2.5e5 m/s, c: 3.00e8 m/s, r: 0.635}
    formula: 4 * pi * (s / c)**2 * r
    expected: 5.54e-6
    shown: ['\times 0.635 \approx 5.54 \times 10^{-6}$ rad']
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: einstein-radius-arcsec
    where: 'worked example, step "The angle": ≈ 1.14 arcseconds'
    inputs: {t: 5.54e-6 radian}
    formula: t
    expected: 1.14 arcsecond
    shown: ['rad $\approx 1.14$ arcseconds']
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: einstein-radius-kpc
    where: 'worked example, step "The physical size": ξ_E = D_L θ_E ≈ 7.0 kpc'
    inputs: {DL: 1259 Mpc, t: 5.54e-6}
    formula: DL * t
    expected: 7.0 kpc
    shown: ['\times 5.54 \times 10^{-6} \approx 7.0$ kpc']
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: point-mass-thetaE
    where: 'worked example "Point mass or isothermal sphere?", step "Point mass": θ_E = √(1.20 × 0.40) ≈ 0.69″; quiz 4 explanation'
    inputs: {a: 1.20, b: 0.40}
    formula: sqrt(a * b)
    expected: 0.69
    shown: ['$\theta_E = \sqrt{1.20 \times 0.40} \approx 0.69″$', 'A point mass would give $\\sqrt{1.20 \\times 0.40} \\approx 0.69″$']
    source: {cite: mit, at: 'Eq. (2.25), p. 37'}
    origin: page-own

  - id: point-mass-beta
    where: 'worked example, step "Point mass": β = 0.80″'
    inputs: {a: 1.20, b: 0.40}
    formula: a - b
    expected: 0.80
    shown: ['and $\beta = 0.80″$']
    source: {cite: mit, at: 'Eq. (2.25), p. 37'}
    origin: page-own

  - id: sis-thetaE
    where: 'worked example, step "Isothermal sphere", and quiz 4: θ_E = (1.20 + 0.40)/2 = 0.80″'
    inputs: {a: 1.20, b: 0.40}
    formula: (a + b) / 2
    expected: 0.80
    shown: ['$\theta_E = (1.20 + 0.40)/2 = 0.80″$ and', '$(1.20 + 0.40)/2 = 0.80″$. A point']
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: sis-thetaE-quiz
    where: 'quiz 4: marked choice 0.80″'
    inputs: {a: 1.20, b: 0.40}
    formula: (a + b) / 2
    expected: 0.80
    shown: ['choices: ["0.40″", "0.69″", "0.80″", "1.60″"]']
    quiz: 3
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: sis-beta
    where: 'worked example, step "Isothermal sphere": β = (1.20 − 0.40)/2 = 0.40″'
    inputs: {a: 1.20, b: 0.40}
    formula: (a - b) / 2
    expected: 0.40
    shown: ['$\beta = (1.20 - 0.40)/2 = 0.40″$']
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: sis-sigma
    where: 'worked example, step "Isothermal sphere": the implied velocity dispersion is about 210 km/s'
    inputs: {t: 0.80 arcsecond, c: 2.998e8 m/s, DS: 1727 Mpc, DLS: 1097 Mpc}
    formula: sqrt(t * c**2 * DS / (4 * pi * DLS))
    expected: 210 km/s
    shown: ['The implied velocity dispersion is about 210 km/s']
    source: {cite: mit, at: 'Section 2.6, p. 38'}
    origin: page-own

  - id: point-mass-mass
    where: 'worked example, step "The masses": about 1.2 × 10¹¹ M⊙ for the point mass'
    inputs: {t: 0.693 arcsecond, c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), DL: 1259 Mpc, DS: 1727 Mpc, DLS: 1097 Mpc}
    formula: t**2 * c**2 * DL * DS / (4 * G * DLS) / M_sun
    expected: 1.2e11
    shown: ['This gives about $1.2 \times 10^{11}\,M_\odot$ for the point mass']
    source: {cite: mit, at: 'Eq. (2.24), p. 37'}
    origin: page-own

  - id: sis-mass
    where: 'worked example, step "The masses": 1.6 × 10¹¹ M⊙ for the isothermal sphere'
    inputs: {t: 0.80 arcsecond, c: 2.998e8 m/s, G: 6.674e-11 m**3/(kg*s**2), DL: 1259 Mpc, DS: 1727 Mpc, DLS: 1097 Mpc}
    formula: t**2 * c**2 * DL * DS / (4 * G * DLS) / M_sun
    expected: 1.6e11
    shown: ['and $1.6 \times 10^{11}\,M_\odot$ for the isothermal sphere']
    source: {cite: mit, at: 'Eq. (2.17), p. 35'}
    origin: page-own

  - id: point-mass-flux-ratio
    where: 'worked example, step "The flux ratio decides": point mass gives a ratio of 9 (about 2.4 mag)'
    inputs: {tE: 0.6928, a: 1.20, b: 0.40}
    formula: abs(1 / (1 - (tE / a)**4)) / abs(1 / (1 - (tE / b)**4))
    expected: 9
    shown: ['giving a flux ratio of 9 between']
    source: {cite: mit, at: 'p. 42, Exercise 2.8'}
    origin: page-own

  - id: sis-flux-ratio
    where: 'worked example, step "The flux ratio decides": isothermal sphere gives a ratio of 3'
    inputs: {tE: 0.80, a: 1.20, b: 0.40}
    formula: abs(1 / (1 - tE / a)) / abs(1 / (1 - tE / b))
    expected: 3
    shown: ['$|1 - \theta_E/\theta|^{-1}$, a ratio of 3']
    source: {cite: mit, at: 'p. 42, Exercise 2.8'}
    origin: page-own

  - id: flux-ratio-mags
    where: 'worked example, step "The flux ratio decides": about 2.4 versus 1.2 magnitudes'
    formula: 2.5 * log10(9)
    expected: 2.4
    shown: ['(in magnitudes, about 2.4 versus 1.2)']
    source: {cite: mit, at: 'p. 42, Exercise 2.8'}
    origin: page-own

  - id: flux-ratio-mags-sis
    where: 'worked example: 2.5 log₁₀ 3 ≈ 1.2 mag'
    formula: 2.5 * log10(3)
    expected: 1.2
    shown: ['about 2.4 versus 1.2)']
    source: {cite: mit, at: 'p. 42, Exercise 2.8'}
    origin: page-own

  - id: mass-difference-third
    where: 'worked example, step "The masses": a difference of a third'
    inputs: {Mpt: 1.168e11, Mis: 1.557e11}
    formula: Mis / Mpt
    expected: 1.33
    shown: ['a difference of a third, from the model alone']
    source: {cite: mit, at: 'p. 42'}
    origin: page-own

  - id: he2149-redshifts
    kind: fact
    where: 'text: HE 2149−2745, lens at z = 0.60, source at z = 2.03'
    value: 2.03
    shown: ['(lens at $z = 0.60$, source at $z = 2.03$)']
    source: {cite: mit, at: 'p. 40'}
    origin: mit

  - id: leier-2011
    kind: fact
    where: 'text: Leier and collaborators, 2011'
    value: 2011
    shown: ['(Leier and collaborators, 2011)']
    source: {cite: mit, at: 'p. 43, Figure 2.9'}
    origin: mit

  - id: he2149-iso-mass-book
    kind: fact
    where: 'text, bracket on HE 2149−2745: the isothermal mass the book prints from its Eq. (2.34)'
    value: 7.8e10
    shown: ['$7.8 \times 10^{10}\,M_\odot$ from Eq. (2.34)']
    source: {cite: mit, at: 'Eq. (2.34), p. 42'}
    origin: page-own

  - id: he2149-iso-mass
    where: 'text, bracket on HE 2149−2745: mass inside the isothermal Einstein radius, M = theta_E^2 c^2 D_L D_S /(4 G D_LS), in 1e11 M_sun (as ferreras-problem-set-1 p8-e)'
    inputs: {te: 0.849, DL: 1382 Mpc, DS: 1724 Mpc, DLS: 992 Mpc}
    formula: (te * arcsec / radian)**2 * c**2 * DL * DS / (4 * G * DLS) / (1e11 * M_sun)
    expected: '2.1'
    shown: ['about $2.1 \times 10^{11}\,M_\odot$']
    source: {cite: mit, at: 'Eq. (2.34), p. 42 (our own correction)'}
    origin: page-own
