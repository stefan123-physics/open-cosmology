# Calculations on content/year-5/Ferreras/dark-matter-particles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 6.1–6.3.

page: content/year-5/Ferreras/dark-matter-particles.mdx
calcs:
  - id: thermal-timeline
    kind: fact
    where: 'section "A particle physics primer": QCD transition at about 3 × 10¹² K and 10⁻⁵ s; nucleosynthesis at about 10⁹ K; photons per baryon about a billion'
    value: 3e12 K
    shown: ['about $3 \times 10^{12}$ K, $10^{-5}$ s: quarks are confined', 'about $10^9$ K, a few minutes: nucleosynthesis', 'the huge number of photons per baryon, about a billion']
    source: {cite: mit, at: 'pp. 135–137'}
    origin: mit

  - id: neutrino-decoupling-facts
    kind: fact
    where: 'text, flashcard 2 and summary: neutrinos decouple at about 1 MeV, 1 s'
    value: 1 MeV
    shown: ['about 1 MeV, 1 s: neutrinos decouple', '\quad\Longrightarrow\quad T_{\nu,\text{dec}} \approx 1\ \text{MeV}', 'falls below H ∝ $T^2$ at T ≈ 1 MeV, about 1 s', 'Neutrinos decoupled at about 1 MeV']
    source: {cite: mit, at: 'Eq. (6.3), p. 141'}
    origin: mit

  - id: baryon-and-dm-density
    kind: fact
    where: 'text, quiz 1 and summary: Ω_b h² ≈ 0.02, Ω_dm h² ≈ 0.12'
    value: 0.12
    shown: ['fixes the baryon density at $\Omega_b h^2 \approx 0.02$, well below the dark matter density $\Omega_\text{dm} h^2 \approx 0.12$. Dark matter', 'at $\\Omega_b h^2 \\approx 0.02$, well below', 'Nucleosynthesis gives $\Omega_b h^2 \approx 0.02$ against $\Omega_\text{dm} h^2 \approx 0.12$']
    source: {cite: mit, at: 'p. 137'}
    origin: mit

  - id: hot-dm-cutoff
    kind: fact
    where: 'text and quiz 2: hot dark matter would suppress power above about k ≈ 0.1 h Mpc⁻¹'
    value: 0.1
    shown: ['above about $k \approx 0.1\,h$ Mpc⁻¹, and is firmly rejected', 'above about $k \\approx 0.1\\,h$ Mpc⁻¹, which']
    source: {cite: mit, at: 'p. 139'}
    origin: mit

  - id: pauli-1930
    kind: fact
    where: 'section "Neutrinos": Pauli proposed it in 1930'
    value: 1930
    shown: ['Pauli proposed it in 1930']
    source: {cite: mit, at: 'p. 140'}
    origin: mit

  - id: temperature-ratio
    where: 'formula "Neutrino and photon temperatures": (4/11)^(1/3) ≈ 0.714'
    formula: (4 / 11)**(1/3)
    expected: 0.714
    shown: ['= \left(\frac{4}{11}\right)^{1/3} \approx 0.714']
    source: {cite: mit, at: 'Eq. (6.5), p. 141'}
    origin: mit

  - id: neutrino-temperature
    where: 'text, flashcard 2 and summary: CMB at 2.725 K gives T_ν ≈ 1.95 K'
    inputs: {T: 2.725 K}
    formula: (4 / 11)**(1/3) * T
    expected: 1.95 K
    shown: ['so with the CMB at 2.725 K, the neutrino background is at about 1.95 K today', '$T_\\nu = (4/11)^{1/3}T_\\gamma \\approx 1.95$ K', 'now form a 1.95 K background']
    source: {cite: mit, at: 'p. 142'}
    origin: page-own

  - id: neutrino-number-density
    where: 'text, quiz 3, worked example and summary: about 112 per cm³ per flavour'
    inputs: {T: 1.945 K, k: 8.617333e-5 eV/K, hc: 1.97327e-5 eV*cm}
    formula: 2 * 0.75 * 1.2020569 / pi**2 * (k * T / hc)**3
    expected: 112 / cm**3
    shown: ['about 112 per cm³ per flavour. [The book', 'has about 112 neutrinos plus antineutrinos per cm³ per flavour', 'Using about 112 neutrinos and antineutrinos per cm³ per flavour', 'background of about 112 per cm³ per flavour']
    source: {cite: mit, at: 'Eq. (6.6), p. 142'}
    origin: page-own

  - id: omega-per-ev
    where: 'quiz 3: each flavour adds about 0.0106 (m/eV) to Ω h²'
    inputs: {n: 112 / cm**3, m: 1 eV, rc: 1.0537e4 eV/cm**3}
    formula: n * m / rc
    expected: 0.0106
    shown: ['Each flavour adds about $0.0106\\,(m/\\text{eV})$ to $\\Omega h^2$']
    source: {cite: mit, at: 'Eq. (6.7), p. 142'}
    origin: page-own

  - id: mass-for-all-dm
    where: 'quiz 3 explanation: 0.12/(3 × 0.0106) ≈ 3.8 eV'
    formula: 0.12 / (3 * 0.0106)
    expected: 3.8
    shown: ['"$0.12/(3 \\times 0.0106) \\approx 3.8$ eV']
    source: {cite: mit, at: 'p. 142'}
    origin: page-own

  - id: mass-for-all-dm-quiz
    where: 'quiz 3: marked choice "About 4 eV"; also text, flashcard 3 and summary'
    formula: 0.12 / (3 * 0.0106)
    expected: 4
    shown: ['choices: ["About 0.04 eV", "About 4 eV", "About 40 eV", "About 400 eV"]', 'only if each had about 4 eV', 'would need about 4 eV per flavour', 'would need about 4 eV each to be the dark matter']
    quiz: 2
    source: {cite: mit, at: 'p. 142'}
    origin: mit

  - id: example-energy-density
    where: 'worked example "How much do neutrinos weigh in the universe?", step 1: 336 per cm³ and 112 × 0.1 ≈ 11 eV per cm³'
    inputs: {n: 112 / cm**3, s: 0.1 eV}
    formula: n * s
    expected: 11.2 eV/cm**3
    shown: ['The total number is $3 \times 112 = 336$ per cm³; with an average mass of $0.1/3$ eV each, the mass-energy density is $112 \times 0.1 = 11.2$ eV per cm³']
    source: {cite: mit, at: 'Eq. (6.7), p. 142'}
    origin: page-own

  - id: critical-density-ev
    where: 'worked example, step 2: ρ_c ≈ 1.05 × 10⁴ h² eV per cm³'
    inputs: {H0: 100 km/s/Mpc, G: 6.6743e-11 m**3/(kg*s**2), c: 2.998e8 m/s}
    formula: 3 * H0**2 / (8 * pi * G) * c**2
    expected: 1.05e4 eV/cm**3
    shown: ['$\rho_c \approx 1.05 \times 10^4\,h^2$ eV per cm³']
    source: {cite: mit, at: 'Eq. (6.7), p. 142'}
    origin: page-own

  - id: example-omega-nu
    where: 'worked example, step 2: Ω_ν h² ≈ 11/1.05 × 10⁴ ≈ 0.0011'
    formula: 11.2 / 1.05e4
    expected: 0.0011
    shown: ['$\Omega_\nu h^2 \approx 11.2/1.05 \times 10^4 \approx 0.0011$']
    source: {cite: mit, at: 'Eq. (6.7), p. 142'}
    origin: page-own

  - id: example-percent
    where: 'worked example, step 3: about 1% of 0.12; equals Σm/(94 eV)'
    formula: 100 * 0.0011 / 0.12
    expected: 1
    shown: ['That is about 1% of the dark matter''s $0.12$']
    source: {cite: mit, at: 'Eq. (6.7), p. 142'}
    origin: page-own

  - id: sum-over-94
    where: 'worked example, step 3 and flashcard 3: Σm/(94 eV), 0.1 eV gives 0.0011'
    formula: 0.1 / 94
    expected: 0.0011
    shown: ['It equals $\sum m_\nu/(94\ \text{eV})$', '$\\Omega_\\nu h^2 \\approx \\sum m_\\nu/(94\\ \\text{eV})$']
    source: {cite: mit, at: 'Eq. (6.7), p. 142'}
    origin: page-own
