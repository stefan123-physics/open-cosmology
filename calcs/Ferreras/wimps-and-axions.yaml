# Calculations on content/year-5/Ferreras/wimps-and-axions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Sections 6.4–6.5.

page: content/year-5/Ferreras/wimps-and-axions.mdx
calcs:
  - id: wimp-relic-scaling
    kind: identity
    where: 'formula "WIMP relic density": 0.1 (0.01/α)²(m/100 GeV)² equals 0.1 at the reference values and scales as (m/α)² (the book writes m to the first power; see the note on the page)'
    formula: 0.1 * (0.01 / a)**2 * (m / 100)**2
    equals: 0.1 * (m / a / 1e4)**2
    samples: {a: [0.01, 0.1, 0.003], m: [100, 1000, 30]}
    shown: ['\simeq 0.1\left(\frac{0.01}{\alpha}\right)^2\left(\frac{m_\chi}{100\ \text{GeV}}\right)^2']
    source: {cite: mit, at: 'Eq. (6.10), p. 144'}
    origin: page-own

  - id: wimp-weak-cross-section
    where: 'note on the page: with α = 0.01 and m = 100 GeV, ⟨σv⟩ ~ α²/m² ≈ 1.2 × 10⁻²⁵ cm³/s, so 10⁻²⁶/⟨σv⟩ ≈ 0.1, consistent with the second form'
    inputs: {hc: 1.97327e-14 GeV*cm, c: 2.998e10 cm/s, m: 100 GeV, sv: 1e-26 cm**3/s}
    formula: sv / ((0.01 / m)**2 * hc**2 * c)
    expected: 0.09
    shown: ['\Omega_\text{WIMP}\,h^2 \sim \frac{10^{-26}\ \text{cm}^3\,\text{s}^{-1}}{\langle\sigma v\rangle}']
    source: {cite: mit, at: 'Eq. (6.10), p. 144'}
    origin: page-own

  - id: wimp-cross-section-benchmark
    kind: fact
    where: 'quiz 1, flashcard 1 and summary: Ω h² ~ 10⁻²⁶ cm³ s⁻¹/⟨σv⟩, benchmark ⟨σv⟩ ~ 10⁻²⁶ cm³/s'
    value: 1e-26 cm**3/s
    shown: ['$\\langle\\sigma v\\rangle \\sim 10^{-26}$ cm³/s', '$\\Omega_\\text{WIMP}h^2 \\sim 10^{-26}', 'The relic density $\Omega h^2 \sim (10^{-26}\ \text{cm}^3/\text{s})/\langle\sigma v\rangle$']
    source: {cite: mit, at: 'Eqs. (6.10), p. 144, and p. 155'}
    origin: mit

  - id: coupling-ratio
    where: 'worked example "Mass and coupling go together", step 1: m/α = 100 GeV/0.01 = 10⁴ GeV'
    formula: 100 / 0.01
    expected: 1e4
    shown: ['$m_\chi/\alpha = 100\ \text{GeV}/0.01 = 10^4$ GeV']
    source: {cite: mit, at: 'Eq. (6.10), p. 144'}
    origin: page-own

  - id: coupling-1tev
    where: 'worked example, step 2: α = 1000/10⁴ = 0.1, ten times stronger'
    formula: 1000 / 1e4
    expected: 0.1
    shown: ['$\alpha = 1000/10^4 = 0.1$, ten times stronger']
    source: {cite: mit, at: 'Eq. (6.10), p. 144'}
    origin: page-own

  - id: same-density-check
    where: 'worked example: the 1 TeV, α = 0.1 particle has the same relic density as 100 GeV, α = 0.01'
    formula: (0.01 / 0.1)**2 * (1000 / 100)**2
    expected: 1
    shown: ['what coupling would a 1 TeV particle need']
    source: {cite: mit, at: 'Eq. (6.10), p. 144'}
    origin: page-own

  - id: higgs-and-wimp-mass
    kind: fact
    where: 'text and summary: Higgs boson at 125 GeV in 2012; typical WIMP mass 0.1–1 TeV'
    value: 125 GeV
    shown: ['The discovery of the **Higgs boson** at 125 GeV in 2012', 'a typical WIMP mass of 0.1–1 TeV', 'the Higgs boson (125 GeV, 2012) but no superpartners in the expected 0.1–1 TeV range']
    source: {cite: mit, at: 'p. 145'}
    origin: mit

  - id: wimp-100-gev
    kind: fact
    where: 'text: a mass near 100 GeV'
    value: 100 GeV
    shown: ['a mass near 100 GeV and a coupling']
    source: {cite: mit, at: 'Eq. (6.10), p. 144'}
    origin: mit

  - id: theta-limit
    kind: fact
    where: 'text, quiz 4 and summary: θ ≲ 10⁻¹⁰'
    value: 1e-10
    shown: ['None is found: $\theta \lesssim 10^{-10}$', 'smaller than about $10^{-10}$', '($\theta \lesssim 10^{-10}$, Peccei–Quinn)']
    source: {cite: mit, at: 'p. 146'}
    origin: mit

  - id: axion-mass-limits
    kind: fact
    where: 'text, flashcard 3 and summary: well below 1 eV; range 10⁻¹² eV to 1 MeV; red giants exclude 0.5 eV–200 keV; electron coupling above 10⁻² eV; below about 10⁻³ eV'
    value: 1e-3 eV
    shown: ['typically well below 1 eV', 'from about $10^{-12}$ eV to 1 MeV', 'rule out masses between about 0.5 eV and 200 keV', 'are excluded above about $10^{-2}$ eV', 'down to about $10^{-3}$ eV', 'axions must be lighter than about $10^{-3}$ eV', 'Red giants exclude 0.5 eV–200 keV; supernovae and laboratory searches push it below about $10^{-3}$ eV', 'put their mass below about $10^{-3}$ eV']
    source: {cite: mit, at: 'pp. 146–147'}
    origin: mit

  - id: dm-density-axion
    kind: fact
    where: 'text: Ω_dm h² ≈ 0.12'
    value: 0.12
    shown: ['could be all the dark matter, $\Omega_\text{dm}h^2 \approx 0.12$']
    source: {cite: mit, at: 'p. 146'}
    origin: mit
