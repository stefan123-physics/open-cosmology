# Calculations on content/year-5/Ferreras/the-dark-matter-problem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Chapter 1. Planetary data: NASA Planetary Fact Sheet
# (Table 1.1 of the book); Io: NASA Jovian Satellite Fact Sheet.

page: content/year-5/Ferreras/the-dark-matter-problem.mdx
calcs:
  - id: earth-speed-at-1au
    where: 'plot caption: v = √(GM⊙/r) is 29.78 km/s at 1 AU'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), M: 1.98847e30 kg, r: 1 au}
    formula: sqrt(G * M / r)
    expected: 29.78 km/s
    shown: ['(29.78 km/s at 1 AU)']
    source: {cite: mit, at: 'Eq. (1.3), p. 8'}
    origin: page-own

  - id: mercury-speed
    where: 'plot point Mercury: 2πr/T with r = 0.3870 AU, T = 88.0 d'
    inputs: {r: 0.3870 au, T: 88.0 day}
    formula: 2 * pi * r / T
    expected: 47.84 km/s
    shown: ['y: 47.84, label: "Mercury"']
    source: {cite: nasa, at: 'Mercury: semi-major axis, orbital period'}
    origin: page-own

  - id: venus-speed
    where: 'plot point Venus'
    inputs: {r: 0.7233 au, T: 224.7 day}
    formula: 2 * pi * r / T
    expected: 35.02 km/s
    shown: ['y: 35.02, label: "Venus"']
    source: {cite: nasa, at: 'Venus'}
    origin: page-own

  - id: earth-speed
    where: 'plot point Earth'
    inputs: {r: 1.0 au, T: 365.2 day}
    formula: 2 * pi * r / T
    expected: 29.79 km/s
    shown: ['y: 29.79, label: "Earth"']
    source: {cite: nasa, at: 'Earth'}
    origin: page-own

  - id: mars-speed
    where: 'plot point Mars'
    inputs: {r: 1.5241 au, T: 687 day}
    formula: 2 * pi * r / T
    expected: 24.14 km/s
    shown: ['y: 24.14, label: "Mars"']
    source: {cite: nasa, at: 'Mars'}
    origin: page-own

  - id: jupiter-speed
    where: 'plot point Jupiter'
    inputs: {r: 5.2039 au, T: 4331 day}
    formula: 2 * pi * r / T
    expected: 13.07 km/s
    shown: ['y: 13.07, label: "Jupiter"']
    source: {cite: nasa, at: 'Jupiter'}
    origin: page-own

  - id: saturn-speed
    where: 'plot point Saturn'
    inputs: {r: 9.5722 au, T: 10747 day}
    formula: 2 * pi * r / T
    expected: 9.69 km/s
    shown: ['y: 9.69, label: "Saturn"']
    source: {cite: nasa, at: 'Saturn'}
    origin: page-own

  - id: uranus-speed
    where: 'plot point Uranus'
    inputs: {r: 19.1644 au, T: 30589 day}
    formula: 2 * pi * r / T
    expected: 6.82 km/s
    shown: ['y: 6.82, label: "Uranus"']
    source: {cite: nasa, at: 'Uranus'}
    origin: page-own

  - id: neptune-speed
    where: 'plot point Neptune'
    inputs: {r: 30.1805 au, T: 59800 day}
    formula: 2 * pi * r / T
    expected: 5.49 km/s
    shown: ['y: 5.49, label: "Neptune"']
    source: {cite: nasa, at: 'Neptune'}
    origin: page-own

  - id: sun-mass-from-earth
    where: 'text: each planet gives the Sun''s mass (checked here for the Earth; the book''s average of all eight is (2.00 ± 0.02) × 10³⁰ kg)'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), r: 1.0 au, T: 365.2 day}
    formula: 4 * pi**2 * r**3 / (G * T**2)
    expected: 1.99e30 kg
    shown: ['$(2.00 \pm 0.02) \times 10^{30}$ kg, close to']
    source: {cite: mit, at: 'p. 8 and Figure 1.2'}
    origin: mit

  - id: sun-mass-official
    kind: fact
    where: 'text: the accurate value of 1.98847 × 10³⁰ kg'
    value: 1.98847e30 kg
    shown: ['$1.98847 \times 10^{30}$ kg']
    source: {cite: mit, at: 'p. 8'}
    origin: mit

  - id: io-seconds
    where: 'worked example "Weighing Jupiter with its moon Io", step 1: T = 1.769 × 86 400 s'
    inputs: {T: 1.769 day}
    formula: T
    expected: 1.528e5 s
    shown: ['1.769 \times 86\,400\ \text{s} = 1.528 \times 10^5$ s']
    source: {cite: nasaJupiter, at: 'Io: orbital period'}
    origin: page-own

  - id: jupiter-mass
    where: 'worked example, step "Apply the orbit formula": M ≈ 1.90 × 10²⁷ kg'
    inputs: {G: 6.674e-11 m**3/(kg*s**2), r: 4.218e8 m, T: 1.528e5 s}
    formula: 4 * pi**2 * r**3 / (G * T**2)
    expected: 1.90e27 kg
    shown: ['\approx 1.90 \times 10^{27}$ kg']
    source: {cite: mit, at: 'Eq. (1.3), p. 8'}
    origin: page-own

  - id: jupiter-to-sun
    where: 'worked example, step "Check": about one thousandth of the Sun''s mass'
    inputs: {MJ: 1.90e27 kg, MS: 1.98847e30 kg}
    formula: MJ / MS
    expected: 0.001
    shown: ['about one thousandth of the Sun''s mass']
    source: {cite: nasaJupiter, at: 'Io'}
    origin: page-own

  - id: hubble-separation
    where: 'text: two galaxies 10 Mpc apart separate at about 700 km/s'
    inputs: {H0: 70 km/s/Mpc, d: 10 Mpc}
    formula: H0 * d
    expected: 700 km/s
    shown: ['separate at about 700 km/s']
    source: {cite: mit, at: 'p. 10'}
    origin: mit

  - id: critical-density
    where: 'text and summary: ρ_c ≈ 9.2 × 10⁻²⁷ kg/m³ for H₀ = 70 km/s/Mpc'
    inputs: {H0: 70 km/s/Mpc, G: 6.674e-11 m**3/(kg*s**2)}
    formula: 3 * H0**2 / (8 * pi * G)
    expected: 9.2e-27 kg/m**3
    shown: ['$\rho_c \approx 9.2 \times 10^{-27}$ kg/m³, roughly five', '\approx 9.2 \times 10^{-27}$ kg/m³ (for']
    source: {cite: mit, at: 'Eq. (1.4), p. 10'}
    origin: page-own

  - id: critical-density-quiz
    where: 'quiz 4: about 9 × 10⁻²⁷ kg/m³'
    inputs: {H0: 70 km/s/Mpc, G: 6.674e-11 m**3/(kg*s**2)}
    formula: 3 * H0**2 / (8 * pi * G)
    expected: 9e-27 kg/m**3
    shown: ['about $9 \\times 10^{-27}$ kg/m³']
    source: {cite: mit, at: 'Eq. (1.4), p. 10'}
    origin: page-own

  - id: hydrogen-atoms-per-m3
    where: 'text: roughly five hydrogen atoms per cubic metre'
    inputs: {rho: 9.2e-27 kg/m**3, mH: 1.674e-27 kg}
    formula: rho / mH
    expected: 5.5 / m**3
    shown: ['roughly five hydrogen atoms per cubic metre']
    source: {cite: mit, at: 'p. 10'}
    origin: page-own

  - id: person-volume
    where: 'text: 70 kg of dark matter at a quarter of ρ_c fills about 3.0 × 10²⁸ m³'
    inputs: {m: 70 kg, rho: 9.2e-27 kg/m**3}
    formula: m / (rho / 4)
    expected: 3.0e28 m**3
    shown: ['$3.0 \times 10^{28}$ m³']
    source: {cite: mit, at: 'p. 10'}
    origin: page-own

  - id: person-cube-side
    where: 'text: a cube some 3.1 million km on a side; also quiz 4 "about 3 million km"'
    inputs: {V: 3.0e28 m**3}
    formula: V**(1/3)
    expected: 3.1e6 km
    shown: ['a cube some 3.1 million km on a side', 'a cube about 3 million km on a side']
    source: {cite: mit, at: 'p. 10'}
    origin: page-own

  - id: person-cube-moon
    where: 'text: about eight times the distance to the Moon'
    inputs: {L: 3.1e6 km, dMoon: 384400 km}
    formula: L / dMoon
    expected: 8
    shown: ['about eight times the distance to the Moon']
    source: {cite: mit, at: 'p. 10'}
    origin: page-own

  - id: vacuum-density
    where: 'worked example "Emptier than any vacuum", step 1: n = P/(kT) ≈ 2.5 × 10¹¹ m⁻³'
    inputs: {P: 1e-9 Pa, k: 1.381e-23 J/K, T: 293 K}
    formula: P / (k * T)
    expected: 2.5e11 / m**3
    shown: ['\approx 2.5 \times 10^{11}$ m⁻³']
    source: {cite: mit, at: 'p. 11, "How about ...?"'}
    origin: page-own

  - id: vacuum-density-cm3
    where: 'worked example, step 1: about 250 000 particles per cm³'
    inputs: {n: 2.5e11 / m**3}
    formula: n
    expected: 250000 / cm**3
    shown: ['about 250 000 particles per cm³']
    source: {cite: mit, at: 'p. 11'}
    origin: page-own

  - id: dm-particle-mass
    where: 'worked example, problem: 100 GeV/c² is about 1.78 × 10⁻²⁵ kg'
    inputs: {E: 100 GeV, c: 2.998e8 m/s}
    formula: E / c**2
    expected: 1.78e-25 kg
    shown: ['about $1.78 \times 10^{-25}$ kg']
    source: {cite: mit, at: 'p. 11'}
    origin: page-own

  - id: dm-number-density
    where: 'worked example, step 2: n = ρ_c/m ≈ 0.052 m⁻³'
    inputs: {rho: 9.2e-27 kg/m**3, m: 1.78e-25 kg}
    formula: rho / m
    expected: 0.052 / m**3
    shown: ['\approx 0.052$ m⁻³']
    source: {cite: mit, at: 'p. 11'}
    origin: page-own

  - id: dm-per-20-m3
    where: 'worked example, step 2: about 5 × 10⁻⁸ per cm³, one particle in every 20 m³ or so'
    inputs: {n: 0.052 / m**3}
    formula: 1 / n
    expected: 19 m**3
    shown: ['about $5 \times 10^{-8}$ per cm³, one particle in every 20 cubic metres']
    source: {cite: mit, at: 'p. 11'}
    origin: page-own

  - id: vacuum-vs-ism
    where: 'worked example, step 3: interstellar space is some 250 000 times emptier'
    inputs: {nvac: 2.5e11 / m**3, nism: 1 / cm**3}
    formula: nvac / nism
    expected: 250000
    shown: ['some 250 000 times emptier']
    source: {cite: mit, at: 'p. 11'}
    origin: page-own

  - id: ism-vs-dm
    where: 'worked example, step 3: dark matter about 20 million times sparser again'
    inputs: {nism: 1 / cm**3, ndm: 0.052 / m**3}
    formula: nism / ndm
    expected: 1.9e7
    shown: ['about 20 million times sparser again']
    source: {cite: mit, at: 'p. 11'}
    origin: page-own

  - id: moon-in-earth-radii
    where: 'section "How we learn about the sky": the Moon is about 60 Earth radii away'
    inputs: {d: 384400 km, RE: 6371 km}
    formula: d / RE
    expected: 60
    shown: ['the Moon, is about 60 Earth radii away']
    source: {cite: mit, at: 'p. 2'}
    origin: mit

  - id: sun-in-earth-radii
    where: 'section "How we learn about the sky": sunlight travels some 23 500 Earth radii (the book: "nearly 24 thousand")'
    inputs: {d: 1 au, RE: 6371 km}
    formula: d / RE
    expected: 23500
    shown: ['some 23 500 Earth radii']
    source: {cite: mit, at: 'p. 2'}
    origin: mit

  - id: io-distance-m
    where: 'worked example "Weighing Jupiter with its moon Io": 421 800 km = 4.218 × 10⁸ m'
    inputs: {a: 421800 km}
    formula: a
    expected: 4.218e8 m
    shown: ['average distance of 421 800 km, once every 1.769 days', '$r = 4.218 \times 10^8$ m']
    source: {cite: nasaJupiter, at: 'Io: semi-major axis'}
    origin: page-own

  - id: summary-sun-mass
    kind: fact
    where: 'summary: the planets give (2.00 ± 0.02) × 10³⁰ kg (the book''s average over the eight planets, Figure 1.2)'
    value: 2.00e30 kg
    shown: ['The planets all give the Sun''s mass, $(2.00 \pm 0.02) \times 10^{30}$ kg']
    source: {cite: mit, at: 'p. 8 and Figure 1.2'}
    origin: mit

  - id: critical-density-flashcard
    where: 'flashcard 2: ρ_c ≈ 9.2 × 10⁻²⁷ kg/m³'
    inputs: {H0: 70 km/s/Mpc, G: 6.674e-11 m**3/(kg*s**2)}
    formula: 3 * H0**2 / (8 * pi * G)
    expected: 9.2e-27 kg/m**3
    shown: ['\\approx 9.2 \\times 10^{-27}$ kg/m³ for $H_0']
    source: {cite: mit, at: 'Eq. (1.4), p. 10'}
    origin: page-own

  - id: io-mass-fraction
    where: 'worked example "Weighing Jupiter with its moon Io", step "Check": Io''s mass is about 0.005% of Jupiter''s'
    inputs: {mIo: 8.93e22 kg, MJ: 1.898e27 kg}
    formula: 100 * mIo / MJ
    expected: 0.005
    shown: ['(about 0.005% of Jupiter''s)']
    source: {cite: nasaJupiter, at: 'Io: mass'}
    origin: page-own
