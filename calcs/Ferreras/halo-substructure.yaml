# Calculations on content/year-5/Ferreras/halo-substructure.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Section 3.5.

page: content/year-5/Ferreras/halo-substructure.mdx
calcs:
  - id: satellite-counts
    kind: fact
    where: 'text, quiz 2, flashcard 1 and summary: about 50 satellites around the Milky Way, 30 around Andromeda, ~1000 predicted subhalos'
    value: 50
    shown: ['about **50 satellite galaxies around the Milky Way** and about **30 around Andromeda**', '**as many as 1000 subhalos**', '"About 50 known, about 1000 predicted"', '"Simulations: ~1000 subhalos around a Milky Way-sized halo. Observed: ~50 satellites around the Milky Way, ~30 around Andromeda."', 'About 50 satellite galaxies are known around the Milky Way and 30 around Andromeda, against about 1000 predicted']
    source: {cite: mit, at: 'p. 70'}
    origin: mit

  - id: satellite-factor
    where: 'text and quiz 2 explanation: a mismatch of about a factor of twenty'
    inputs: {pred: 1000, obs: 50}
    formula: pred / obs
    expected: 20
    shown: ['This mismatch of about a factor of twenty', 'mismatch, a factor of about 20']
    source: {cite: mit, at: 'p. 70'}
    origin: page-own

  - id: dwarf-definitions
    kind: fact
    where: 'text: dwarfs below about 10⁹ M⊙, ultra-faint below about 10⁵ M⊙ in stars; a few hundred M⊙ in stars; simulation out to 250 kpc'
    value: 1e9
    shown: ['Galaxies below about $10^9\,M_\odot$ are traditionally called **dwarfs**', 'stellar masses below about $10^5\,M_\odot$', 'some with only a few hundred solar masses in stars', 'simulated out to 250 kpc']
    source: {cite: mit, at: 'pp. 69–70'}
    origin: mit

  - id: survey-years
    kind: fact
    where: 'text: SDSS (York et al. 2000), DES (2016), PAndAS (Huxor et al. 2014)'
    value: 2000
    shown: ['(York and collaborators, 2000) and the Dark Energy Survey (2016)', '(Huxor and collaborators, 2014)']
    source: {cite: mit, at: 'pp. 70–71'}
    origin: mit

  - id: virial-contrast
    kind: fact
    where: 'text and summary: virial density contrast about 178 at galaxy-forming redshifts, about 330 today; R₂₀₀ at 200 times the background'
    value: 178
    shown: ['the virial density contrast is about 178 at the redshifts where most galaxies form, rising to about 330 today', 'virial contrast about 178 rising to 330 today', 'inside which the mean density is 200 times the background']
    source: {cite: mit, at: 'p. 71, "How about ...?"'}
    origin: mit

  - id: lagrangian-mw
    where: 'worked example "Which scales does substructure probe?", step 1: r ≈ 1.8 Mpc for 10¹² M⊙'
    inputs: {M: 1e12, rb: 4.08e10}
    formula: (3 * M / (4 * pi * rb))**(1/3)
    expected: 1.8
    shown: ['Mpc $\approx 1.8$ Mpc, so']
    source: {cite: mit, at: 'p. 72'}
    origin: page-own

  - id: lagrangian-mw-k
    where: 'worked example, step 1: k ≈ 1.7 Mpc⁻¹'
    inputs: {r: 1.80}
    formula: pi / r
    expected: 1.7
    shown: ['so $k \approx 1.7$ Mpc⁻¹']
    source: {cite: mit, at: 'p. 71'}
    origin: page-own

  - id: lagrangian-sub
    where: 'worked example, step 2: r ≈ 0.18 Mpc for 10⁹ M⊙'
    inputs: {M: 1e9, rb: 4.08e10}
    formula: (3 * M / (4 * pi * rb))**(1/3)
    expected: 0.18
    shown: ['$r \approx 0.18$ Mpc']
    source: {cite: mit, at: 'p. 72'}
    origin: page-own

  - id: lagrangian-sub-k
    where: 'worked example, step 2: k ≈ 17 Mpc⁻¹'
    inputs: {r: 0.180}
    formula: pi / r
    expected: 17
    shown: ['$k \approx 17$ Mpc⁻¹']
    source: {cite: mit, at: 'p. 71'}
    origin: page-own

  - id: mean-density-quoted
    where: 'worked example, problem: ρ̄ = 4.08 × 10¹⁰ M⊙ per Mpc³ for H₀ = 70, Ω_m = 0.3'
    inputs: {H0: 70 km/s/Mpc, G: 6.6743e-11 m**3/(kg*s**2), u: 1 Mpc}
    formula: 0.3 * 3 * H0**2 / (8 * pi * G) * u**3 / M_sun
    expected: 4.08e10
    shown: ['$\bar\rho = 4.08 \times 10^{10}\,M_\odot$ per Mpc³']
    source: {cite: mit, at: 'p. 72'}
    origin: page-own

  - id: wdm-threshold
    kind: fact
    where: 'text, quiz 3 explanation, flashcard 2 and summary: a 3 keV particle suppresses halos below about 10⁹ M⊙ (stellar mass up to a few × 10⁷ M⊙)'
    value: 3 keV
    shown: ['A warm dark matter particle of **3 keV**', 'suppress halos below about $10^9\,M_\odot$, which host galaxies of up to a few times $10^7\,M_\odot$', 'A 3 keV particle suppresses halos below about $10^9\\,M_\\odot$', 'a 3 keV particle cuts off halos below ~$10^9\\,M_\\odot$', '(3 keV suppresses halos below about $10^9\,M_\odot$)']
    source: {cite: mit, at: 'p. 72'}
    origin: mit

  - id: high-z-galaxies
    kind: fact
    where: 'text: massive galaxies and quasars at redshifts above about 3'
    value: 3
    shown: ['seen at redshifts above about 3']
    source: {cite: mit, at: 'p. 72'}
    origin: mit

  - id: too-big-to-fail
    kind: fact
    where: 'text, quiz 4 and summary: subhalos around 10¹⁰ M⊙'
    value: 1e10
    shown: ['the most massive subhalos around the Milky Way (around $10^{10}\,M_\odot$)', 'massive subhalos (around $10^{10}\\,M_\\odot$)', 'the most massive subhalos (about $10^{10}\,M_\odot$)']
    source: {cite: mit, at: 'p. 73'}
    origin: mit

  - id: lane-emden-n5
    kind: identity
    where: 'worked example "A self-interacting halo as a polytrope": θ = (1 + ξ²/3)^(−1/2) solves (1/ξ²)(ξ²θ'')'' = −θ⁵'
    formula: deriv('-y**3 / 3 * (1 + y**2 / 3)**(-1.5)', 'y', X) / X**2
    equals: -(1 + X**2 / 3)**(-2.5)
    samples: {X: [0.3, 1, 2.5, 6]}
    shown: ['Show that $\theta = (1 + \xi^2/3)^{-1/2}$ satisfies the Lane–Emden equation with $n = 5$']
    source: {cite: mit, at: 'Eqs. (3.17)–(3.18), pp. 73–74'}
    origin: mit

  - id: lane-emden-derivative
    kind: identity
    where: 'worked example, step "The n = 5 solution": ξ²θ'' = −(ξ³/3)(1 + ξ²/3)^(−3/2)'
    formula: X**2 * deriv('(1 + y**2 / 3)**(-0.5)', 'y', X)
    equals: -X**3 / 3 * (1 + X**2 / 3)**(-1.5)
    samples: {X: [0.3, 1, 2.5, 6]}
    shown: ['$\xi^2\theta'' = -\tfrac{\xi^3}{3}(1 + \xi^2/3)^{-3/2}$']
    source: {cite: mit, at: 'Eq. (3.18), p. 74'}
    origin: page-own

  - id: sanchez-almeida-2021
    kind: fact
    where: 'text: Sánchez-Almeida and collaborators, 2021'
    value: 2021
    shown: ['as Sánchez-Almeida and collaborators did in 2021']
    source: {cite: mit, at: 'p. 74'}
    origin: mit
