# Calculations on content/year-5/Ferreras/detecting-dark-matter.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: Ferreras, Fundamentals of Dark Matter (UCL Press 2025), Section 6.6.

page: content/year-5/Ferreras/detecting-dark-matter.mdx
calcs:
  - id: recoil-max-identity
    kind: identity
    where: 'text: the maximum of E_R = μ²v²(1 − cos θ)/m_N, at θ = 180°, is 2μ²v²/m_N'
    formula: mu**2 * v**2 / mN * (1 - cos(pi))
    equals: 2 * mu**2 * v**2 / mN
    samples: {mu: [55, 50], v: [1, 0.7], mN: [122, 100]}
    shown: ['Its maximum ($\theta = 180°$) is $2\mu^2v^2/m_N$']
    source: {cite: mit, at: 'Eq. (6.14), p. 151'}
    origin: mit

  - id: reduced-mass
    where: 'worked example "How hard does a WIMP hit?", step 1: μ = 100 × 122/(100 + 122) ≈ 55 GeV'
    formula: 100 * 122 / (100 + 122)
    expected: 55
    shown: ['$\mu = 100 \times 122/(100 + 122) \approx 55$ GeV']
    source: {cite: mit, at: 'Eq. (6.14), p. 151'}
    origin: page-own

  - id: speed-over-c
    where: 'worked example, step 2: v/c = 230/299 792 ≈ 7.7 × 10⁻⁴'
    formula: 230 / 299792
    expected: 7.7e-4
    shown: ['$v/c = 230/299\,792 \approx 7.7 \times 10^{-4}$']
    source: {cite: mit, at: 'Eq. (6.14), p. 151'}
    origin: page-own

  - id: recoil-example
    where: 'worked example, step 3: E_R ≈ 2.9 × 10⁻⁵ GeV, about 29 keV'
    inputs: {mu: 55 GeV, b: 7.7e-4, mN: 122 GeV}
    formula: 2 * mu**2 * b**2 / mN
    expected: 2.9e-5 GeV
    shown: ['$ GeV $\approx 2.9 \times 10^{-5}$ GeV, about **29 keV**']
    source: {cite: mit, at: 'Eq. (6.14), p. 151'}
    origin: page-own

  - id: recoil-quiz-explanation
    where: 'quiz 4 explanation: 2 × 55² × (7.7 × 10⁻⁴)²/122 ≈ 2.9 × 10⁻⁵ GeV ≈ 29 keV (the choices differ only in unit, so the marked "About 30 keV" is checked here, not by the numeric quiz check)'
    inputs: {mu: 55 GeV, b: 7.7e-4, mN: 122 GeV}
    formula: 2 * mu**2 * b**2 / mN
    expected: 29 keV
    shown: ['/122 \\approx 2.9 \\times 10^{-5}$ GeV ≈ 29 keV']
    source: {cite: mit, at: 'Eq. (6.14), p. 151'}
    origin: page-own

  - id: recoil-scale
    kind: fact
    where: 'formula "Typical maximum recoil energy": about 50 keV for 100 GeV; detection thresholds about 1 keV'
    value: 50 keV
    shown: ['E_R \sim 50\ \text{keV}', 'Thresholds of about 1 keV set the lightest detectable particles']
    source: {cite: mit, at: 'Eq. (6.11), p. 149'}
    origin: mit

  - id: escape-and-motions
    kind: fact
    where: 'text: escape speed about 500 km/s; Sun about 200 km/s; Earth about 30 km/s'
    value: 500 km/s
    shown: ['the local **escape speed** from the Galaxy, about 500 km/s', '$v_\odot \approx 200$ km/s', '$v_\oplus \approx 30$ km/s', 'Earth''s 30 km/s orbital motion adding','the Earth''s 30 km/s orbit adds']
    source: {cite: mit, at: 'pp. 151–152'}
    origin: mit

  - id: n-chi
    where: 'worked example "Why detectors weigh tonnes", step 1: n = 0.3/100 = 3 × 10⁻³ per cm³'
    formula: 0.3 / 100
    expected: 3e-3
    shown: ['$n_\chi = 0.3/100 = 3 \times 10^{-3}$ per cm³']
    source: {cite: mit, at: 'p. 148, Exercise 6.3'}
    origin: page-own

  - id: xenon-nuclei
    where: 'worked example, step 2: 1000/131 × 6.02 × 10²³ ≈ 4.6 × 10²⁴ nuclei'
    formula: 1000 / 131 * 6.02e23
    expected: 4.6e24
    shown: ['$1000/131 \times 6.02 \times 10^{23} \approx 4.6 \times 10^{24}$ nuclei']
    source: {cite: mit, at: 'p. 150'}
    origin: page-own

  - id: rate-per-second
    where: 'worked example, step 3: R ≈ 3.2 × 10⁻¹³ per second per kg'
    inputs: {n: 3e-3 / cm**3, s: 1e-42 cm**2, v: 2.3e7 cm/s, N: 4.6e24}
    formula: n * s * v * N
    expected: 3.2e-13 / s
    shown: ['\approx 3.2 \times 10^{-13}$ per second per kg']
    source: {cite: mit, at: 'p. 150'}
    origin: page-own

  - id: rate-per-year
    where: 'worked example, step 3: about 10⁻⁵ per kg per year, about one event per hundred tonne-years'
    inputs: {R: 3.2e-13 / s, y: 1 year}
    formula: R * y * 1000 * 100
    expected: 1
    shown: ['about $10^{-5}$ per kg per year, or about **one event per hundred tonne-years**', 'around one event per hundred tonne-years for $\sigma = 10^{-42}$ cm²']
    source: {cite: mit, at: 'p. 150'}
    origin: page-own

  - id: dama-values
    kind: fact
    where: 'text: DAMA/LIBRA implies 1–10 GeV and about 10⁻⁴⁰ cm²'
    value: 1e-40 cm**2
    shown: ['a light particle (1–10 GeV) with a large cross-section (about $10^{-40}$ cm²)']
    source: {cite: mit, at: 'p. 152'}
    origin: mit

  - id: neutrino-floor-10gev
    kind: fact
    where: 'text: solar-neutrino background drops near 10 GeV'
    value: 10 GeV
    shown: ['with a drop near 10 GeV']
    source: {cite: mit, at: 'p. 150'}
    origin: mit

  - id: line-width
    kind: fact
    where: 'text: relative line width about 10⁻³ in the Milky Way halo'
    value: 1e-3
    shown: ['a relative width of about $10^{-3}$']
    source: {cite: mit, at: 'p. 154'}
    origin: mit

  - id: thermal-benchmark
    kind: fact
    where: 'text: ⟨σv⟩ ~ 10⁻²⁶ cm³/s'
    value: 1e-26 cm**3/s
    shown: ['The thermal-relic benchmark $\langle\sigma v\rangle \sim 10^{-26}$ cm³/s']
    source: {cite: mit, at: 'p. 155'}
    origin: mit

  - id: lhc-values
    kind: fact
    where: 'text: LHC 13 TeV; peak luminosity about 2 × 10³⁴ cm⁻² s⁻¹; about one Higgs per second, one in a thousand detected'
    value: 2e34 / cm**2 / s
    shown: ['The Large Hadron Collider reaches 13 TeV', 'a peak luminosity of about $2 \times 10^{34}$ cm⁻² s⁻¹, making about one Higgs boson per second, of which only about one in a thousand was detected']
    source: {cite: mit, at: 'pp. 155–156'}
    origin: mit

  - id: wimp-scale-100
    kind: fact
    where: 'text: experiments designed for particles near 100 GeV'
    value: 100 GeV
    shown: ['weak-strength interactions of particles near 100 GeV']
    source: {cite: mit, at: 'p. 148'}
    origin: mit
