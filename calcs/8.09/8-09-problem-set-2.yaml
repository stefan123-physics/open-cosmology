# Calculations on content/year-4/8.09/8-09-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# a numerical integral of Stokes' drag (1(a)), numerical derivatives of the Lagrangian and of the dissipation
# function (1(b)), the equation of motion checked on the solution ż(z) (2(a)), the torque as ż dL_z/dz with a
# numerical derivative (2(a)), the energy (3(c)), root finding (3(d), 4(c), 5(d)), numerical integrals (5(d), 5(g)),
# and the conservation of energy along the equation of motion after the wall (5(e)).
# Outside this file, while writing (SciPy solve_ivp, rtol 1e-11, atol 1e-12): the ladder of Problem 5(g), with the
# switch of equations where 3 sin θ = 2 sin θ0. It gave the time of leaving 0.562970 s at 35.2644°, the landing at
# 0.840346 s with θ̇ = −2.79065 rad/s, the smallest floor push after the wall 2.00196 m/s² × M (0.204 Mg), and the top
# end 0.12898 m from the wall at landing. The quadratures here (p5d-time, p5g-land, p5g-thd) agree to 1e-9 or better.
# Short names in the samples: th θ, thd θ̇, phd φ̇, l ℓ, eta η, v0 v₀, th0 θ₀, Lz0 L_z(0), D the 1 + b² + a²b²z² of
# Problem 2, q the variable of a numerical derivative, integral or root.

page: content/year-4/8.09/8-09-problem-set-2.mdx
calcs:
  # ---- Problem 1(a): the dissipation function, against the integral of Stokes' drag 6πηa v' from 0 to the speed
  # v = ℓ √(θ̇² + sin²θ φ̇²)

  - id: p1a-diss
    kind: identity
    answer: p1a-diss
    where: 'Problem 1(a), answer box: 3πηa ℓ²(θ̇² + sin²θ φ̇²) against ∫₀^v 6πηa v′ dv′'
    formula: 3*pi*eta*a*l**2*(thd**2 + sin(th)**2*phd**2)
    equals: integrate('6*pi*eta*a*q', 'q', 0, l*sqrt(thd**2 + sin(th)**2*phd**2))
    samples:
      eta: [1.0, 0.6, 1.8]
      a: [0.02, 0.01, 0.045]
      l: [1.0, 0.7, 1.9]
      th: [0.5, 1.1, 0.35]
      thd: [0.4, 1.3, 0.25]
      phd: [1.2, 0.6, 1.9]
    tolerance: 1e-9
    shown: ['id="p1a-diss"', '\mathcal{F} = 3\pi\eta a\,\ell^2\left(\dot\theta^2 + \sin^2\theta\,\dot\phi^2\right)']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  # ---- Problem 1(b): θ̈ from (∂L/∂θ − ∂𝓕/∂θ̇)/(mℓ²), both derivatives numerical

  - id: p1b-thdd
    kind: identity
    answer: p1b-thdd
    where: 'Problem 1(b), answer box: θ̈ against (∂L/∂θ − ∂𝓕/∂θ̇)/(mℓ²) with numerical derivatives'
    formula: sin(th)*cos(th)*phd**2 - g/l*sin(th) - 6*pi*eta*a/m*thd
    equals: (deriv('m*l**2/2*(thd**2 + sin(q)**2*phd**2) + m*g*l*cos(q)', 'q', th, 1) - deriv('3*pi*eta*a*l**2*(q**2 + sin(th)**2*phd**2)', 'q', thd, 1))/(m*l**2)
    samples:
      g: [9.81, 6, 14]
      l: [1.0, 0.7, 1.9]
      m: [0.5, 0.2, 0.9]
      eta: [1.0, 0.6, 1.8]
      a: [0.02, 0.01, 0.045]
      th: [0.5, 1.1, 0.35]
      thd: [0.4, 1.3, 0.25]
      phd: [1.2, 0.6, 1.9]
    tolerance: 1e-7
    shown: ['id="p1b-thdd"', '\ddot\theta = \sin\theta\cos\theta\,\dot\phi^2 - \frac{g}{\ell}\sin\theta - \frac{6\pi\eta a}{m}\dot\theta']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-torque
    kind: identity
    where: 'Problem 1(b), solution: the friction torque −∂𝓕/∂φ̇ (numerical derivative) equals −(6πηa/m) L_z with L_z = mℓ² sin²θ φ̇'
    formula: -deriv('3*pi*eta*a*l**2*(thd**2 + sin(th)**2*q**2)', 'q', phd, 1)
    equals: -(6*pi*eta*a/m)*m*l**2*sin(th)**2*phd
    samples:
      l: [1.0, 0.7, 1.9]
      m: [0.5, 0.2, 0.9]
      eta: [1.0, 0.6, 1.8]
      a: [0.02, 0.01, 0.045]
      th: [0.5, 1.1, 0.35]
      thd: [0.4, 1.3, 0.25]
      phd: [1.2, 0.6, 1.9]
    tolerance: 1e-7
    shown: ['\frac{dL_z}{dt} = -\frac{6\pi\eta a}{m}\,L_z']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-lz
    kind: identity
    answer: p1b-lz
    where: 'Problem 1(b), answer box: L_z(0) exp(−6πηa t/m) against L_z(0) exp(∫₀ᵗ d ln L_z), with d ln L_z/dt = −6πηa/m integrated numerically'
    formula: Lz0*exp(-6*pi*eta*a*t/m)
    equals: Lz0*exp(-integrate('6*pi*eta*a/m + 0*q', 'q', 0, t))
    samples:
      Lz0: [1.0, 0.6, 1.7]
      eta: [1.0, 0.6, 1.8]
      a: [0.02, 0.01, 0.045]
      m: [0.5, 0.2, 0.9]
      t: [1.0, 2.5, 0.7]
    tolerance: 1e-7
    shown: ['id="p1b-lz"', 'L_z(t) = L_z(0)\,e^{-6\pi\eta a\,t/m}']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-lz-ode
    kind: identity
    where: 'Problem 1(b), solution: L_z(0) exp(−6πηa t/m) solves dL_z/dt = −(6πηa/m) L_z (numerical derivative)'
    formula: deriv('Lz0*exp(-6*pi*eta*a*q/m)', 'q', t, 1)
    equals: -(6*pi*eta*a/m)*Lz0*exp(-6*pi*eta*a*t/m)
    samples:
      Lz0: [1.0, 0.6, 1.7]
      eta: [1.0, 0.6, 1.8]
      a: [0.02, 0.01, 0.045]
      m: [0.5, 0.2, 0.9]
      t: [1.0, 2.5, 0.7]
    tolerance: 1e-7
    shown: ['\Rightarrow\quad L_z(t) = L_z(0)']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-energy
    kind: identity
    where: 'Problem 1(b), solution: Σ q̇ ∂𝓕/∂q̇ = 2𝓕 for the quadratic dissipation function (numerical derivatives)'
    formula: thd*deriv('3*pi*eta*a*l**2*(q**2 + sin(th)**2*phd**2)', 'q', thd, 1) + phd*deriv('3*pi*eta*a*l**2*(thd**2 + sin(th)**2*q**2)', 'q', phd, 1)
    equals: 2*3*pi*eta*a*l**2*(thd**2 + sin(th)**2*phd**2)
    samples:
      l: [1.0, 0.7, 1.9]
      eta: [1.0, 0.6, 1.8]
      a: [0.02, 0.01, 0.045]
      th: [0.5, 1.1, 0.35]
      thd: [0.4, 1.3, 0.25]
      phd: [1.2, 0.6, 1.9]
    tolerance: 1e-7
    shown: ['$dE/dt = -2\mathcal{F} = -6\pi\eta a\,v^2$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  # ---- Problem 2(a): ż(z) checked on the equation of motion D z̈ + a²b² z ż² = 0, with z̈ = ż dż/dz (numerical)

  - id: p2a-zdot
    kind: identity
    answer: p2a-zdot
    where: 'Problem 2(a), answer box: ż(z) against the sheet''s route, ln ż − ln v0 = ∫ z̈/ż dt = −∫ₕᶻ a²b²q/(1 + b² + a²b²q²) dq (numerical integral)'
    formula: v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2))
    equals: v0*exp(-integrate('a**2*b**2*q/(1 + b**2 + a**2*b**2*q**2)', 'q', h, z))
    samples:
      a: [1.0, 0.6, 1.8]
      b: [0.5, 1.2, 0.35]
      z: [3.0, 2.2, 3.7]
      h: [1.0, 0.6, 1.4]
      v0: [1.0, 1.7, 0.6]
    tolerance: 1e-9
    shown: ['id="p2a-zdot"', '\dot z = v_0\sqrt{\frac{1 + b^2 + a^2b^2h^2}{1 + b^2 + a^2b^2z^2}}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-zdot-eom
    kind: identity
    where: 'Problem 2(a), solution: ż(z) satisfies (1 + b² + a²b²z²) ż dż/dz + a²b² z ż² = 0 (numerical derivative), and ż(h) = v0 (entry p2a-zdot-start)'
    formula: (1 + b**2 + a**2*b**2*z**2)*v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2))*deriv('v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*q**2))', 'q', z, 1)
    equals: -a**2*b**2*z*v0**2*(1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2)
    samples:
      a: [1.0, 0.6, 1.8]
      b: [0.5, 1.2, 0.35]
      z: [3.0, 2.2, 3.7]
      h: [1.0, 0.6, 1.4]
      v0: [1.0, 1.7, 0.6]
    tolerance: 1e-7
    shown: ['\dot z = v_0\sqrt{\frac{1 + b^2 + a^2b^2h^2}{1 + b^2 + a^2b^2z^2}}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-zdot-start
    kind: identity
    where: 'Problem 2(a): the formula for ż gives v0 at z = h'
    formula: v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*h**2))
    equals: v0
    samples:
      a: [1.0, 0.6]
      b: [0.5, 1.2]
      h: [1.0, 0.6]
      v0: [1.0, 1.7]
    tolerance: 1e-12
    shown: ['the starting values $\dot z = v_0$ at $z = h$']
    source: {cite: mit, at: 'Problem 2(a), p. 2'}
    origin: mit

  # ---- Problem 2(a): the torque, against ż dL_z/dz with L_z(z) = m a b² z² ż(z) differentiated numerically

  - id: p2a-torque
    kind: identity
    answer: p2a-torque
    where: 'Problem 2(a), answer box: Z_θ against ż(z) times the numerical z derivative of L_z(z) = m a b² z² ż(z)'
    formula: m*a*b**2*v0**2*z*(1 + b**2 + a**2*b**2*h**2)*(2 + 2*b**2 + a**2*b**2*z**2)/(1 + b**2 + a**2*b**2*z**2)**2
    equals: v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2))*deriv('m*a*b**2*q**2*v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*q**2))', 'q', z, 1)
    samples:
      a: [1.0, 0.6, 1.8]
      b: [0.5, 1.2, 0.35]
      m: [1.0, 0.7, 1.6]
      z: [3.0, 2.2, 3.7]
      h: [1.0, 0.6, 1.4]
      v0: [1.0, 1.7, 0.6]
    tolerance: 1e-7
    shown: ['id="p2a-torque"', 'Z_\theta = \frac{mab^2v_0^2\,z\left(1 + b^2 + a^2b^2h^2\right)\left(2 + 2b^2 + a^2b^2z^2\right)}{\left(1 + b^2 + a^2b^2z^2\right)^2}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2b-lz
    kind: identity
    answer: p2b-lz
    where: 'Problem 2(b), answer box: L_z = m r² θ̇ with r = bz and θ̇ = a ż, ż from p2a-zdot'
    formula: m*a*b**2*z**2*v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2))
    equals: m*(b*z)**2*(a*v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2)))
    samples:
      a: [1.0, 0.6, 1.8]
      b: [0.5, 1.2, 0.35]
      m: [1.0, 0.7, 1.6]
      z: [3.0, 2.2, 3.7]
      h: [1.0, 0.6, 1.4]
      v0: [1.0, 1.7, 0.6]
    tolerance: 1e-12
    shown: ['id="p2b-lz"', 'L_z = mab^2v_0\,z^2\sqrt{\frac{1 + b^2 + a^2b^2h^2}{1 + b^2 + a^2b^2z^2}}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-dlz
    kind: identity
    where: 'Problem 2(b), solution: the z derivative of L_z (numerical) against the formula on the page'
    formula: deriv('m*a*b**2*q**2*v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*q**2))', 'q', z, 1)
    equals: m*a*b**2*v0*sqrt(1 + b**2 + a**2*b**2*h**2)*z*(2 + 2*b**2 + a**2*b**2*z**2)/(1 + b**2 + a**2*b**2*z**2)**1.5
    samples:
      a: [1.0, 0.6, 1.8]
      b: [0.5, 1.2, 0.35]
      m: [1.0, 0.7, 1.6]
      z: [3.0, 2.2, 3.7]
      h: [1.0, 0.6, 1.4]
      v0: [1.0, 1.7, 0.6]
    tolerance: 1e-7
    shown: ['Its $z$ derivative is $mab^2v_0\sqrt{1 + b^2 + a^2b^2h^2}\;z\left(2 + 2b^2 + a^2b^2z^2\right)/D^{3/2}$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-energy
    kind: identity
    where: 'Problem 2(b), solution: T = ½ m (ṙ² + r²θ̇² + ż²) with ṙ = bż, θ̇ = aż and ż(z) is ½ m v0² (1 + b² + a²b²h²) at every z'
    formula: m/2*((b**2 + a**2*b**2*z**2 + 1)*v0**2*(1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*z**2))
    equals: m/2*v0**2*(1 + b**2 + a**2*b**2*h**2)
    samples:
      a: [1.0, 0.6, 1.8]
      b: [0.5, 1.2, 0.35]
      m: [1.0, 0.7, 1.6]
      z: [3.0, 2.2, 3.7]
      h: [1.0, 0.6, 1.4]
      v0: [1.0, 1.7, 0.6]
    tolerance: 1e-12
    shown: ['$T = \frac m2 D\dot z^2 = \frac m2 v_0^2\left(1 + b^2 + a^2b^2h^2\right)$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-large-z
    kind: identity
    where: 'Problem 2(b), check: for large z, L_z / z tends to m b v0 √(1 + b² + a²b²h²) (taken at z = 1e6)'
    formula: m*a*b**2*1e6*v0*sqrt((1 + b**2 + a**2*b**2*h**2)/(1 + b**2 + a**2*b**2*1e12))
    equals: m*b*v0*sqrt(1 + b**2 + a**2*b**2*h**2)
    samples:
      a: [1.0, 0.6]
      b: [0.5, 1.2]
      m: [1.0, 0.7]
      h: [1.0, 0.6]
      v0: [1.0, 1.7]
    tolerance: 1e-9
    shown: ['for large $z$ it tends to $mbv_0\sqrt{1 + b^2 + a^2b^2h^2}\;z$']
    source: {cite: mit, at: 'Problem 2(b) (our own check)'}
    origin: page-own

  # ---- Problem 3 (our own problem): rolling, the angular acceleration, the forces, the angles

  - id: p3a-roll
    kind: identity
    answer: p3a-roll
    where: 'Problem 3(a), answer box: φ̇ = (R + r) θ̇ / r makes the contact point at rest: (R + r) θ̇ − r φ̇ = 0'
    formula: (R + r)/r*thd
    equals: solve('(R + r)*thd - r*q', 'q', 0, 100)
    samples:
      R: [2, 1.2, 2.8]
      r: [0.5, 0.3, 0.7]
      thd: [1, 0.4, 1.8]
    tolerance: 1e-12
    shown: ['id="p3a-roll"', 'So $\dot\phi = (R + r)\dot\theta/r$.']
    source: {cite: mit, at: 'Problem 3 (our own problem)'}
    origin: page-own

  - id: p3a-coin
    where: 'Problem 3(a), check: with R = r, φ = 2θ, so one trip round (θ = 2π) turns the coin through 4π, two turns'
    formula: (1 + 1)/1*2*pi/(2*pi)
    expected: '2'
    shown: ['$\phi = 2\theta$, and $\theta = 2\pi$ gives $\phi = 4\pi$']
    source: {cite: mit, at: 'Problem 3 (our own check)'}
    origin: page-own

  - id: p3b-thdd
    kind: identity
    answer: p3b-thdd
    where: 'Problem 3(b), answer box: θ̈ against the numerical θ derivative of ½θ̇² with (R + r)θ̇² = g(1 − cos θ) from energy conservation (p3c-energy)'
    formula: g*sin(th)/(2*(R + r))
    equals: deriv('g*(1 - cos(q))/(R + r)/2', 'q', th, 1)
    samples:
      g: [9.81, 6, 14]
      R: [2, 1.2, 2.8]
      r: [0.5, 0.3, 0.7]
      th: [0.5, 0.25, 0.9]
    tolerance: 1e-7
    shown: ['id="p3b-thdd"', '\ddot\theta = \frac{g\sin\theta}{2(R + r)}, \qquad \lambda_2 = -\frac12\,mg\sin\theta']
    source: {cite: mit, at: 'Problem 3 (our own problem)'}
    origin: page-own

  - id: p3b-friction
    kind: identity
    answer: p3b-friction
    where: 'Problem 3(b), answer box: the friction is m r φ̈ (from the φ equation), with r φ̈ = (R + r) θ̈ and θ̈ from p3b-thdd'
    formula: m*g*sin(th)/2
    equals: m*(R + r)*g*sin(th)/(2*(R + r))
    samples:
      g: [9.81, 6, 14]
      m: [1, 0.6, 1.8]
      R: [2, 1.2, 2.8]
      r: [0.5, 0.3, 0.7]
      th: [0.5, 0.25, 0.9]
    tolerance: 1e-12
    shown: ['id="p3b-friction"', 'the friction has size $\frac12 mg\sin\theta$']
    source: {cite: mit, at: 'Problem 3 (our own problem)'}
    origin: page-own

  - id: p3c-energy
    kind: identity
    where: 'Problem 3(c): the kinetic energy ½m(R + r)²θ̇² + ½mr²φ̇² with φ̇ = (R + r)θ̇/r equals the drop mg(R + r)(1 − cos θ) when (R + r)θ̇² = g(1 − cos θ)'
    formula: m/2*(R + r)**2*(g*(1 - cos(th))/(R + r)) + m/2*r**2*((R + r)/r)**2*(g*(1 - cos(th))/(R + r))
    equals: m*g*(R + r)*(1 - cos(th))
    samples:
      g: [9.81, 6]
      m: [1, 0.6]
      R: [2, 1.2]
      r: [0.5, 0.3]
      th: [0.5, 0.9]
    tolerance: 1e-8
    shown: ['$(R + r)\dot\theta^2 = g(1 - \cos\theta)$']
    source: {cite: mit, at: 'Problem 3 (our own problem)'}
    origin: page-own

  - id: p3c-normal
    kind: identity
    answer: p3c-normal
    where: 'Problem 3(c), answer box: λ1 = −m(R + r)θ̇² + mg cos θ with (R + r)θ̇² = g(1 − cos θ)'
    formula: m*g*(2*cos(th) - 1)
    equals: -m*g*(1 - cos(th)) + m*g*cos(th)
    samples:
      g: [9.81, 6, 14]
      m: [1, 0.6, 1.8]
      th: [0.5, 0.25, 0.9]
    tolerance: 1e-12
    shown: ['id="p3c-normal"', '\lambda_1 = mg\left(2\cos\theta - 1\right)']
    source: {cite: mit, at: 'Problem 3 (our own problem)'}
    origin: page-own

  - id: p3c-angle
    answer: p3c-angle
    where: 'Problem 3(c), answer box: the root of 2 cos θ − 1, in degrees'
    formula: solve('2*cos(q) - 1', 'q', 0.5, 1.5)*180/pi
    expected: '60.0'
    shown: ['id="p3c-angle"', 'the hoop leaves the cylinder at $\theta = 60.0^\circ$']
    source: {cite: mit, at: 'Problem 3 (our own problem)'}
    origin: page-own

  - id: p3c-particle
    where: 'Problem 3(c), check: a particle sliding off leaves at cos θ = 2/3'
    formula: acos(2/3)*180/pi
    expected: '48.2'
    shown: ['at $\cos\theta = \frac23$ ($48.2^\circ$)']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.94), p. 25'}
    origin: page-own

  - id: p3d-slip
    answer: p3d-slip
    where: 'Problem 3(d), answer box: the root of ½ sin θ − 0.50 (2 cos θ − 1), in degrees'
    formula: solve('sin(q)/2 - 0.5*(2*cos(q) - 1)', 'q', 0.1, 1.0)*180/pi
    expected: '36.9'
    shown: ['id="p3d-slip"', '\cos\theta = \frac45, \qquad \theta = 36.9^\circ']
    source: {cite: mit, at: 'Problem 3 (our own addition)'}
    origin: page-own

  - id: p3d-cos
    where: 'Problem 3(d), solution: the root of the squared condition 5c² = 4c'
    formula: solve('5*q**2 - 4*q', 'q', 0.5, 1)
