# Calculations on content/year-4/8.09/rotating-frames-coriolis-force.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 2, Section 2.2, pp. 33-37 (printed page = PDF page + 28).
# Page's own worked example: latitude 45 deg (theta = 45 deg from the vertical), stone dropped from 80 m, ball thrown up at 20 m/s,
# g = 9.8 m/s^2, omega = 2 pi / 86400 s = 7.27e-5 1/s, omega sin(theta) = 5.14e-5 1/s.
# Slip in the notes (p. 37): x(t1) for the dropped body is printed as 8 omega sin(theta) h^3 / (3 g^2); the correct result is
# (omega sin(theta)/3) sqrt(8 h^3/g). The notes' form gives 0.73 (not even a length) for the example; quoted as a wrong choice in quiz 3.

page: content/year-4/8.09/rotating-frames-coriolis-force.mdx
calcs:
  - id: omega-earth
    where: 'formula "The Earth''s angular velocity"; summary; section "Summary"'
    inputs: {}
    formula: 2*pi / (24*3600)
    expected: '7.3e-5'
    shown: ['\approx 7.3 \times 10^{-5}\ \text{s}^{-1}', 'ω ≈ 7.3 × 10⁻⁵ s⁻¹', '$\omega \approx 7.3 \times 10^{-5}$ s⁻¹']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: mit

  - id: omega-earth-3sf
    where: 'worked example and quiz 3: omega = 2 pi/86400 s = 7.27e-5 1/s'
    inputs: {}
    formula: 2*pi / 86400
    expected: '7.27e-5'
    shown: ['$\omega = 2\pi/(86\,400\ \text{s}) = 7.27 \times 10^{-5}$ s⁻¹']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: page-own

  - id: omega-sidereal
    where: 'section "The rotating Earth": one turn per sidereal day (86164 s)'
    inputs: {}
    formula: 2*pi / 86164
    expected: '7.29e-5'
    shown: ['which gives $7.29 \times 10^{-5}$ s⁻¹']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: page-own

  - id: sidereal-shorter
    where: 'section "The rotating Earth": the sidereal day is about 4 minutes shorter than 24 h'
    inputs: {}
    formula: (86400 - 86164) / 60
    expected: '4'
    tolerance: 0.1
    shown: ['about 4 minutes shorter']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: page-own

  - id: centrifugal-equator
    where: 'section "The rotating Earth": omega^2 R_Earth at the equator, R = 6.371e6 m'
    inputs: {}
    formula: (2*pi/86400)**2 * 6.371e6
    expected: '0.034'
    shown: ['\omega^2 R_\text{Earth} \approx 0.034$ m/s²']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: page-own

  - id: centrifugal-fraction
    where: 'section "The rotating Earth": 0.034 / 9.8 as a percentage'
    inputs: {}
    formula: 100 * (2*pi/86400)**2 * 6.371e6 / 9.8
    expected: '0.3'
    shown: ['about 0.3% of $g$']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: page-own

  - id: foucault-40
    where: 'section "The rotating Earth": a full turn of the Foucault plane at latitude 40 deg takes 24 h / sin 40 deg'
    inputs: {}
    formula: 24 / sin(40*pi/180)
    expected: '37.3'
    shown: ['about 37.3 hours']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: page-own

  - id: omega-sin-theta
    where: 'worked example "The angle": 7.27e-5 * sin 45 deg; plot caption'
    inputs: {}
    formula: 2*pi/86400 * sin(pi/4)
    expected: '5.14e-5'
    shown: ['= 5.14 \times 10^{-5}$ s⁻¹', 'ω sin θ = 5.14 × 10⁻⁵ s⁻¹']
    source: {cite: reading1, at: 'Section 2.2, p. 36'}
    origin: page-own

  - id: sin45
    where: 'worked example "The angle": sin 45 deg'
    inputs: {}
    formula: sin(pi/4)
    expected: '0.707'
    shown: ['7.27 \times 10^{-5} \times 0.707']
    source: {cite: reading1, at: 'Section 2.2, p. 36'}
    origin: page-own

  - id: fall-time
    where: 'worked example "The stone" and quiz 3: t1 = sqrt(2 h / g) for h = 80 m'
    inputs: {}
    formula: sqrt(2*80/9.8)
    expected: '4.04'
    shown: ['$t_1 = \sqrt{2 \times 80/9.8} = 4.04$ s', 't_1 = \\sqrt{2h/g} = 4.04$ s']
    source: {cite: reading1, at: 'Section 2.2, eq. (2.31), p. 37'}
    origin: page-own

  - id: stone-drift
    where: 'worked example "The stone"; quiz 3 (about 1.1 cm east); plot caption (11 mm)'
    inputs: {}
    formula: 1/3 * 2*pi/86400 * sin(pi/4) * sqrt(8*80**3/9.8)
    expected: '0.011'
    shown: ['\approx 0.011$ m: about **1.1 cm east**', 'About 1.1 cm east of the point below', 'reaching 11 mm']
    source: {cite: reading1, at: 'Section 2.2, p. 37 (corrected)'}
    origin: page-own

  - id: stone-drift-two-forms
    kind: identity
    where: 'formula "Eastward drift of a dropped body": (omega sin/3) g t1^3 equals (omega sin/3) sqrt(8 h^3/g) with t1 = sqrt(2h/g)'
    formula: g * sqrt(2*h/g)**3
    equals: sqrt(8*h**3/g)
    samples: {g: [9.8, 1.6, 24.0], h: [80, 3.5, 1000]}
    tolerance: 1e-12
    shown: ['= \frac{\omega\sin\theta}{3}\sqrt{\frac{8h_\text{max}^3}{g}} > 0']
    source: {cite: reading1, at: 'Section 2.2, eqs. (2.29), (2.31), p. 37'}
    origin: page-own

  - id: notes-slip-value
    where: 'quiz 3 explanation: the notes'' printed formula 8 omega sin(theta) h^3/(3 g^2) gives 0.73 for the example (a wrong choice, "About 73 cm east")'
    inputs: {}
    formula: 8 * 2*pi/86400 * sin(pi/4) * 80**3 / (3 * 9.8**2)
    expected: '0.73'
    shown: ['About 73 cm east', 'The 73 cm comes from the formula printed in the notes']
    source: {cite: reading1, at: 'Section 2.2, p. 37'}
    origin: slip

  - id: ball-height
    where: 'worked example "The ball": v0^2 / (2 g)'
    inputs: {}
    formula: 20**2 / (2*9.8)
    expected: '20.4'
    shown: ['$20^2/(2 \times 9.8) = 20.4$ m']
    source: {cite: reading1, at: 'Section 2.2, p. 37'}
    origin: page-own

  - id: ball-time
    where: 'worked example "The ball"; plot caption: 2 v0 / g'
    inputs: {}
    formula: 2*20/9.8
    expected: '4.08'
    shown: ['$2 \times 20/9.8 = 4.08$ s', 'when it lands at 4.08 s']
    source: {cite: reading1, at: 'Section 2.2, p. 37'}
    origin: page-own

  - id: ball-drift
    where: 'worked example "The ball"; plot caption (-5.7 mm)'
    inputs: {}
    formula: -4 * 2*pi/86400 * sin(pi/4) * 20**3 / (3 * 9.8**2)
    expected: '-0.0057'
    shown: ['\approx -0.0057$ m: about **5.7 mm west**', 'reaching −5.7 mm']
    source: {cite: reading1, at: 'Section 2.2, eq. (2.33), p. 37'}
    origin: page-own

  - id: ball-drift-from-229
    kind: identity
    where: 'eq. (2.33) from (2.29) at t1 = 2 v0 / g'
    formula: -2*w*(v0/2*(2*v0/g)**2 - g/6*(2*v0/g)**3)
    equals: -4*w*v0**3/(3*g**2)
    samples: {w: [5.14e-5, 1.0], v0: [20, 3.3], g: [9.8, 1.6]}
    tolerance: 1e-12
    shown: ['x(t_1) = -\frac{4\omega\sin\theta\,v_0^3}{3g^2} < 0']
    source: {cite: reading1, at: 'Section 2.2, eq. (2.33), p. 37'}
    origin: mit

  - id: drift-ratio
    where: 'worked example "Comparing": the ball''s drift is about half the stone''s'
    inputs: {}
    formula: (4 * 20**3 / (3 * 9.8**2)) / (1/3 * sqrt(8*80**3/9.8))
    expected: '0.5'
    tolerance: 0.05
    shown: ['only about half the stone''s']
    source: {cite: reading1, at: 'Section 2.2, p. 37'}
    origin: page-own

  - id: drift-fraction-stone
    where: 'worked example "Comparing": 1.1 cm in 80 m is parts in ten thousand'
    inputs: {}
    formula: 1e4 * 0.011 / 80
    expected: '1.4'
    shown: ['parts in ten thousand']
    source: {cite: reading1, at: 'Section 2.2, p. 37'}
    origin: page-own

  - id: plot-stone-end
    where: 'plot: the dropped-stone curve 1000 * 2 * 5.14e-5 * 9.8 t^3/6 at t = 4.04 s, in mm'
    inputs: {}
    formula: 1000*2*5.14e-5*9.8*4.04**3/6
    expected: '11'
    shown: ['1000*2*5.14e-5*9.8*t^3/6']
    source: {cite: reading1, at: 'Section 2.2, eq. (2.29), p. 36'}
    origin: page-own

  - id: theta-from-latitude
    where: 'worked example "The angle": theta = 90 - 45'
    inputs: {}
    formula: 90 - 45
    expected: '45'
    shown: ['$\theta = 90^\circ - 45^\circ = 45^\circ$']
    source: {cite: reading1, at: 'Section 2.2, p. 36'}
    origin: page-own

  - id: centrifugal-perp
    kind: identity
    where: 'formula "The centrifugal force points away from the axis": -w x (w x r_perp) = w^2 r_perp for w along z, r_perp = (a, b, 0); x component checked (y and z follow likewise)'
    formula: -(0*0 - w*(w*a))
    equals: w**2*a
    samples: {w: [0.5, 2.0], a: [1.3, -0.4], b: [0.7, 2.1]}
    tolerance: 1e-12
    shown: ['= \omega^2\,\vec r_\perp']
    source: {cite: reading1, at: 'Section 2.2, p. 35'}
    origin: mit
