# Calculations on content/year-4/8.09/symmetry-conservation-laws.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 1, Section 1.3, pp. 12-16.
# Page's own worked example: a 50 g bead on a horizontal wire turned at 2.0 rad/s, starting at rest 10 cm from the axis.
# Quiz 2: free fall from 5 m takes 1.0 s; from 20 m it takes 2.0 s.

page: content/year-4/8.09/symmetry-conservation-laws.mdx
calcs:
  # ---------------------------------------------------------------- centre of mass (p. 12)
  - id: kinetic-energy-split
    kind: identity
    where: 'formula "Kinetic energy split" (eq. 1.49), one dimension, two particles: 1/2 sum m_i v_i^2 = 1/2 M V^2 + 1/2 sum m_i (v_i - V)^2 with V = (m1 v1 + m2 v2)/M'
    formula: 0.5*m1*v1**2 + 0.5*m2*v2**2
    equals: 0.5*(m1 + m2)*((m1*v1 + m2*v2)/(m1 + m2))**2 + 0.5*m1*(v1 - (m1*v1 + m2*v2)/(m1 + m2))**2 + 0.5*m2*(v2 - (m1*v1 + m2*v2)/(m1 + m2))**2
    samples: {m1: [1.0, 2.5, 0.3], m2: [2.0, 0.4, 1.7], v1: [0.3, -1.1, 2.0], v2: [1.5, 0.6, -0.9]}
    tolerance: 1e-12
    shown: ['T = \frac12\sum_i m_i\dot{\vec r}_i^{\,2} = \frac12 M\dot{\vec R}^2 + \frac12\sum_i m_i\dot{\vec r}_i''^{\,2}']
    source: {cite: reading1, at: 'Section 1.3, eq. (1.49), p. 12'}
    origin: mit

  # ---------------------------------------------------------------- rotations (p. 13)
  - id: triple-product
    kind: identity
    where: 'formula "It is the angular momentum about the axis" (eq. 1.52): v . (n x r) = n . (r x v), checked component by component'
    formula: vx*(ny*rz - nz*ry) + vy*(nz*rx - nx*rz) + vz*(nx*ry - ny*rx)
    equals: nx*(ry*vz - rz*vy) + ny*(rz*vx - rx*vz) + nz*(rx*vy - ry*vx)
    samples: {vx: [0.3, 1.1, -0.6], vy: [1.0, -0.4, 2.2], vz: [0.5, 0.9, -1.3], nx: [0.0, 0.6, 0.48], ny: [0.0, 0.8, 0.6], nz: [1.0, 0.0, 0.64], rx: [1.5, -0.2, 0.7], ry: [0.4, 2.0, -1.1], rz: [-0.8, 0.3, 1.9]}
    tolerance: 1e-12
    shown: ['p_\phi = \sum_i m_i\vec v_i\cdot(\hat n\times\vec r_i) = \hat n\cdot\sum_i\vec r_i\times m_i\vec v_i']
    source: {cite: reading1, at: 'Section 1.3, eq. (1.52), p. 13'}
    origin: mit

  # ---------------------------------------------------------------- scaling (p. 14)
  - id: scaling-kinetic
    kind: identity
    where: 'formula "Scaling of time and velocity": velocities scale as lambda / lambda^(1 - k/2) = lambda^(k/2), so T scales as lambda^k'
    formula: (lam / lam**(1 - k/2))**2
    equals: lam**k
    samples: {lam: [2.0, 0.5, 3.7], k: [2, -1, 1]}
    tolerance: 1e-12
    shown: ['t \to \lambda^{1 - k/2}\,t, \qquad \dot{\vec r}_i \to \lambda^{k/2}\,\dot{\vec r}_i']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: mit

  - id: kepler-exponent
    where: 'Coulomb/gravity case: 1 - k/2 for k = -1, so T^2 is proportional to a^3; also the plot curve x^(3/2)'
    inputs: {}
    formula: 1 - (-1)/2
    expected: '1.5'
    shown: ['Times scale as $\lambda^{3/2}$', 'x^(3/2)']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: mit

  - id: fall-exponent
    where: 'uniform gravity: 1 - k/2 for k = 1; also the plot curve x^(1/2)'
    inputs: {}
    formula: 1 - 1/2
    expected: '0.5'
    shown: ['Times scale as $\lambda^{1/2}$', 'x^(1/2)']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: mit

  - id: quiz-fall-time
    where: 'quiz 2 and plot point "20 m vs 5 m": 1.0 s times (20/5)^(1/2)'
    inputs: {t5: 1.0 s, h1: 5 m, h2: 20 m}
    formula: t5 * (h2/h1)**0.5
    expected: 2.0 s
    shown: ['so the time is $\\sqrt 4 = 2$ times longer: 2.0 s', '{ x: 4, y: 2, label: "20 m vs 5 m" }']
    quiz: 1
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  # ---------------------------------------------------------------- the cart (pp. 15-16)
  - id: cart-lagrangian
    kind: identity
    where: 'formula "Lagrangian in the cart''s coordinate" (eq. 1.58): m/2 (xd'' + v0)^2 - k/2 x''^2 expanded; the middle term has xdot'', not x'' (slip in the notes)'
    formula: m/2*(u + v0)**2 - kk/2*xp**2
    equals: m/2*u**2 + m*v0*u + m/2*v0**2 - kk/2*xp**2
    samples: {m: [1.0, 2.5, 0.3], u: [0.3, -1.1, 2.0], v0: [1.5, 0.6, 0.9], kk: [3.0, 10.0, 0.5], xp: [0.2, -0.7, 1.4]}
    tolerance: 1e-12
    shown: ['L''(x'', \dot x'') = \frac m2\dot x''^2 + mv_0\dot x'' + \frac m2 v_0^2 - \frac k2 x''^2', 'The notes print the middle term as $mv_0x''$']
    source: {cite: reading1, at: 'Section 1.3, eq. (1.58), p. 15'}
    origin: slip

  - id: cart-hamiltonian
    kind: identity
    where: 'formula "H differs from E, but is conserved" (eq. 1.59): xd'' p'' - L'' with p'' = m xd'' + m v0 equals (p'' - m v0)^2/2m + k x''^2/2 - m v0^2/2'
    formula: u*(m*u + m*v0) - (m/2*u**2 + m*v0*u + m/2*v0**2 - kk/2*xp**2)
    equals: (m*u + m*v0 - m*v0)**2/(2*m) + kk/2*xp**2 - m/2*v0**2
    samples: {m: [1.0, 2.5, 0.3], u: [0.3, -1.1, 2.0], v0: [1.5, 0.6, 0.9], kk: [3.0, 10.0, 0.5], xp: [0.2, -0.7, 1.4]}
    tolerance: 1e-12
    shown: ['H''(x'', p'') = \dot x''p'' - L'' = \frac{1}{2m}\left(p'' - mv_0\right)^2 + \frac k2 x''^2 - \frac m2 v_0^2']
    source: {cite: reading1, at: 'Section 1.3, eq. (1.59), p. 15'}
    origin: mit

  # ---------------------------------------------------------------- worked example: bead on a spinning wire
  - id: bead-h-conserved
    kind: identity
    where: 'worked example: with r = r0 cosh(w t), H = m/2 (rdot^2 - w^2 r^2) = -m w^2 r0^2/2 at all times'
    formula: m/2*((r0*w*sinh(w*tt))**2 - w**2*(r0*cosh(w*tt))**2)
    equals: -m*w**2*r0**2/2
    samples: {m: [0.05, 1.0, 2.0], w: [2.0, 0.7, 3.1], r0: [0.1, 1.0, 0.4], tt: [1.0, 0.3, 0.8]}
    tolerance: 1e-9
    shown: ['$r = r_0\cosh\omega t$ and $\dot r = r_0\omega\sinh\omega t$']
    source: {cite: reading1, at: 'Section 1.3, eq. (1.55), p. 14'}
    origin: page-own

  - id: bead-cosh
    where: 'worked example step "The motion": cosh(2)'
    inputs: {}
    formula: cosh(2)
    expected: '3.762'
    shown: ['0.10 \times 3.762']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-r
    where: 'worked example step "The motion": r at t = 1.0 s'
    inputs: {r0: 0.10 m}
    formula: r0*cosh(2)
    expected: 0.376 m
    shown: ['= 0.376$ m']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-sinh
    where: 'worked example step "The motion": sinh(2)'
    inputs: {}
    formula: sinh(2)
    expected: '3.627'
    shown: ['2.0 \times 3.627']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-rdot
    where: 'worked example step "The motion": rdot at t = 1.0 s'
    inputs: {r0: 0.10 m, w: 2.0 1/s}
    formula: r0*w*sinh(2)
    expected: 0.725 m/s
    shown: ['= 0.725$ m/s']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-T0
    where: 'worked example step "Energy and H": starting kinetic energy m/2 w^2 r0^2 (and H = minus this)'
    inputs: {m: 0.050 kg, w: 2.0 1/s, r0: 0.10 m}
    formula: m/2*w**2*r0**2
    expected: 0.0010 J
    shown: ['0.025 \times 4.0 \times 0.010 = 0.0010$ J', '$H = -0.0010$ J']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-rdot2
    where: 'worked example step "Energy and H": rdot^2 at 1 s'
    inputs: {r0: 0.10, w: 2.0}
    formula: (r0*w*sinh(2))**2
    expected: '0.526'
    shown: ['(0.526 + 0.566)', '(0.526 - 0.566)']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-w2r2
    where: 'worked example step "Energy and H": w^2 r^2 at 1 s'
    inputs: {r0: 0.10, w: 2.0}
    formula: (w*r0*cosh(2))**2
    expected: '0.566'
    shown: ['(0.526 + 0.566)']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-T1
    where: 'worked example step "Energy and H": kinetic energy at 1 s'
    inputs: {m: 0.050 kg, w: 2.0 1/s, r0: 0.10 m}
    formula: m/2*((r0*w*sinh(2))**2 + (w*r0*cosh(2))**2)
    expected: 0.0273 J
    shown: ['= 0.0273$ J']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-T-ratio
    where: 'worked example step "Energy and H": more than 27 times larger'
    inputs: {}
    formula: (sinh(2)**2 + cosh(2)**2)
    expected: '27.3'
    shown: ['more than 27 times larger']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own

  - id: bead-H1
    where: 'worked example step "Energy and H": H at 1 s, unchanged'
    inputs: {m: 0.050 kg, w: 2.0 1/s, r0: 0.10 m}
    formula: m/2*((r0*w*sinh(2))**2 - (w*r0*cosh(2))**2)
    expected: -0.0010 J
    shown: ['(0.526 - 0.566) = -0.0010$ J']
    source: {cite: reading1, at: 'Section 1.3, p. 14'}
    origin: page-own
