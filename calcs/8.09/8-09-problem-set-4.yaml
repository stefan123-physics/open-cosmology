    samples:
      m: [1, 0.5]
      l: [1, 2]
      th: [0.1, 0.05]
    tolerance: 1e-12
    shown: ['= \ell\theta_1/2$', '$(3\ell\theta_1 + 3\ell\theta_1)/4 = 3\ell\theta_1/2$']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own check)'}
    origin: page-own

  - id: p4a-s0
    kind: identity
