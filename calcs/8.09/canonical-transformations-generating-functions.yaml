# Calculations on content/year-4/8.09/canonical-transformations-generating-functions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 4, introduction and Section 4.1, pp. 60-65.
# Page's own worked example: free particle, m = 2 kg, v = 3 m/s, q = vt, F2 = q^2 P, evaluated at t = 1 s.
# Page's own plot: oscillator orbits with m = 1 kg, omega = 2 /s, P = 1 J s and 0.5 J s.

page: content/year-4/8.09/canonical-transformations-generating-functions.mdx
calcs:
  # ---------------------------------------------------------------- type-1 examples (pp. 62-63)
  - id: f1-example-p
    kind: identity
    where: '"Generating functions of the first type": F1 = -Q/q gives p = dF1/dq = Q/q^2 (derivative checked numerically)'
    formula: deriv('-QQ/x', 'x', qq, 1)
    equals: QQ/qq**2
    samples: {QQ: [0.7, 2.0, -1.3], qq: [0.5, 1.7, 3.1]}
    tolerance: 1e-9
    shown: ['generates $p = Q/q^2$ and $P = 1/q$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.16), p. 62'}
    origin: mit

  - id: f1-example2-p
    kind: identity
    where: 'formula "Generating function of the second example": dF1/dq = q e^Q = p (with p = q e^Q from Q = ln(p/q))'
    formula: deriv('(x**2/2 + 1)*exp(QQ)', 'x', qq, 1)
    equals: qq*exp(QQ)
    samples: {QQ: [0.2, -0.5, 1.1], qq: [0.5, 1.7, 3.1]}
    tolerance: 1e-9
    shown: ['integrate $\partial F_1/\partial q = qe^Q$ over $q$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.19), p. 63'}
    origin: mit

  - id: f1-example2-P
    kind: identity
    where: 'formula "Generating function of the second example": -dF1/dQ = -(q^2/2 + 1) e^Q = -(q^2/2 + 1) p/q, the given P'
    formula: -deriv('(qq**2/2 + 1)*exp(x)', 'x', QQ, 1)
    equals: -(qq**2/2 + 1)*(qq*exp(QQ))/qq
    samples: {QQ: [0.2, -0.5, 1.1], qq: [0.5, 1.7, 3.1]}
    tolerance: 1e-9
    shown: ['It works with $g = e^Q$']
    source: {cite: reading1, at: 'Section 4.1, eqs. (4.21)-(4.22), p. 63'}
    origin: mit

  # ---------------------------------------------------------------- worked example (page-own)
  - id: ex-K-equals-H
    kind: identity
    where: 'worked example, step "The new Hamiltonian": (2qP)^2/(2m) = 2 Q P^2/m with Q = q^2'
    formula: (2*qq*PP)**2/(2*mm)
    equals: 2*qq**2*PP**2/mm
    samples: {qq: [0.5, 3.0, 1.7], PP: [1.0, 0.3, 2.2], mm: [2.0, 1.0, 5.0]}
    tolerance: 1e-12
    shown: ['$K = (2qP)^2/(2m) = 2QP^2/m$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.28), p. 64'}
    origin: page-own

  - id: ex-Qdot
    kind: identity
    where: 'worked example, step "Check Hamilton''s equations": dK/dP = 4QP/m equals dQ/dt = 2 v^2 t along Q = v^2 t^2, P = m/(2t)'
    formula: 4*(vv**2*tt**2)*(mm/(2*tt))/mm
    equals: deriv('vv**2*x**2', 'x', tt, 1)
    samples: {vv: [3.0, 1.2, 0.4], tt: [1.0, 2.5, 0.3], mm: [2.0, 1.0, 5.0]}
    tolerance: 1e-9
    shown: ['$\partial K/\partial P = 4QP/m = 4v^2t^2\cdot m/(2t)/m = 2v^2t$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.6), p. 61'}
    origin: page-own

  - id: ex-Pdot
    kind: identity
    where: 'worked example, step "Check Hamilton''s equations": -dK/dQ = -2P^2/m equals dP/dt = -m/(2t^2) along P = m/(2t)'
    formula: -2*(mm/(2*tt))**2/mm
    equals: deriv('mm/(2*x)', 'x', tt, 1)
    samples: {tt: [1.0, 2.5, 0.3], mm: [2.0, 1.0, 5.0]}
    tolerance: 1e-9
    shown: ['$-\partial K/\partial Q = -2P^2/m = -m/(2t^2)$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.6), p. 61'}
    origin: page-own

  - id: ex-q
    where: 'worked example, step "Numbers at t = 1 s": q = v t'
    inputs: {v: 3 m/s, t: 1 s}
    formula: v * t
    expected: 3 m
    shown: ['$q = 3$ m and']
    source: {cite: reading1, at: 'Section 4.1, p. 64'}
    origin: page-own

  - id: ex-p
    where: 'worked example, step "Numbers at t = 1 s"; quiz 3 explanation'
    inputs: {m: 2 kg, v: 3 m/s}
    formula: m * v
    expected: 6 kg*m/s
    shown: ['$q = 3$ m and $p = mv = 6$ kg m/s', 'with $p = mv = 6$ kg m/s']
    source: {cite: reading1, at: 'Section 4.1, p. 64'}
    origin: page-own

  - id: ex-Q
    where: 'worked example, step "Numbers at t = 1 s"; quiz 3'
    inputs: {q: 3 m}
    formula: q**2
    expected: 9 m**2
    shown: ['so $Q = 9$ m² and', '$Q = \\partial F_2/\\partial P = q^2 = 9$ m²']
    quiz: 2
    source: {cite: reading1, at: 'Section 4.1, eq. (4.31), p. 64'}
    origin: page-own

  - id: ex-P
    where: 'worked example, step "Numbers at t = 1 s"; quiz 3'
    inputs: {p: 6 kg*m/s, q: 3 m}
    formula: p / (2*q)
    expected: 1 kg/s
    shown: ['$P = 6/(2 \times 3) = 1$ kg/s', '$P = p/(2q) = 6/6 = 1$ kg/s']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.32), p. 64'}
    origin: page-own

  - id: ex-H
    where: 'worked example, step "Numbers at t = 1 s": H = p^2/(2m)'
    inputs: {p: 6 kg*m/s, m: 2 kg}
    formula: p**2 / (2*m)
    expected: 9 J
    shown: ['$H = 6^2/4 = 9$ J']
    source: {cite: reading1, at: 'Section 4.1, p. 64'}
    origin: page-own

  - id: ex-K
    where: 'worked example, step "Numbers at t = 1 s": K = 2 Q P^2/m'
    inputs: {Q: 9 m**2, P: 1 kg/s, m: 2 kg}
    formula: 2 * Q * P**2 / m
    expected: 9 J
    shown: ['$K = 2 \times 9 \times 1^2/2 = 9$ J']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.28), p. 64'}
    origin: page-own

  # ---------------------------------------------------------------- oscillator (pp. 64-65)
  - id: osc-trial-H
    kind: identity
    where: '"The harmonic oscillator, made cyclic": the trial transformation gives H = P alpha^2 (eq. 4.35)'
    formula: (al*sqrt(2*mm*PP)*cos(QQ))**2/(2*mm) + mm*ww**2*((al/(mm*ww))*sqrt(2*mm*PP)*sin(QQ))**2/2
    equals: PP*al**2
    samples: {al: [1.3, 0.7, 2.0], mm: [1.0, 2.5, 0.4], PP: [0.6, 1.0, 3.2], QQ: [0.3, 1.9, 4.4], ww: [2.0, 0.8, 1.5]}
    tolerance: 1e-12
    shown: ['$H = P\alpha^2(\cos^2 Q + \sin^2 Q) = P\alpha^2$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.35), p. 65'}
    origin: mit

  - id: osc-F1-P
    kind: identity
    where: 'formula "Building the generating function": -dF1/dQ of (1/2) m w q^2 cot Q equals m w q^2/(2 sin^2 Q)'
    formula: -deriv('0.5*mm*ww*qq**2*cos(x)/sin(x)', 'x', QQ, 1)
    equals: mm*ww*qq**2/(2*sin(QQ)**2)
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], qq: [0.5, 1.2, 2.0], QQ: [0.3, 1.9, 2.4]}
    tolerance: 1e-8
    shown: ['P = -\frac{\partial F_1}{\partial Q} = \frac{m\omega q^2}{2\sin^2 Q} - \frac{dg}{dQ}']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.38), p. 65'}
    origin: mit

  - id: osc-alpha-sqrt-omega
    kind: identity
    where: '"The harmonic oscillator, made cyclic": q^2 from the trial transformation, 2 alpha^2 P sin^2 Q/(m w), equals 2 P sin^2 Q/(m w) when alpha^2 = w'
    formula: ((sqrt(ww)/(mm*ww))*sqrt(2*mm*PP)*sin(QQ))**2
    equals: 2*PP*sin(QQ)**2/(mm*ww)
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], PP: [0.6, 1.0, 3.2], QQ: [0.3, 1.9, 4.4]}
    tolerance: 1e-12
    shown: ['only if $\alpha^2 = \omega$, that is $\alpha = \sqrt{\omega}$']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.39), p. 65'}
    origin: mit

  - id: osc-K-omega-P
    kind: identity
    where: 'quiz 4: q = sqrt(2P/(m w)) sin Q, p = sqrt(2 m w P) cos Q gives p^2/2m + m w^2 q^2/2 = w P'
    formula: (sqrt(2*mm*ww*PP)*cos(QQ))**2/(2*mm) + mm*ww**2*(sqrt(2*PP/(mm*ww))*sin(QQ))**2/2
    equals: ww*PP
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], PP: [0.6, 1.0, 3.2], QQ: [0.3, 1.9, 4.4]}
    tolerance: 1e-12
    shown: ['$p^2/2m + m\\omega^2q^2/2 = \\omega P(\\cos^2 Q + \\sin^2 Q) = \\omega P$']
    source: {cite: reading1, at: 'Section 4.1, eqs. (4.40)-(4.41), p. 65'}
    origin: mit

  - id: osc-amplitude
    kind: identity
    where: 'formula "The oscillator solved": sqrt(2P/(m w)) with P = E/w equals sqrt(2E/(m w^2))'
    formula: sqrt(2*(EE/ww)/(mm*ww))
    equals: sqrt(2*EE/(mm*ww**2))
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], EE: [0.6, 1.0, 3.2]}
    tolerance: 1e-12
    shown: ['q = \sqrt{\frac{2E}{m\omega^2}}\,\sin(\omega t + \delta)']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.42), p. 65'}
    origin: mit

  # ---------------------------------------------------------------- plot caption (page-own)
  - id: plot-q-amp
    where: 'plot caption: q from -1 to 1 m'
    inputs: {P: 1 J*s, m: 1 kg, w: 2 1/s}
    formula: sqrt(2*P/(m*w))
    expected: 1 m
    shown: ['q from −1 to 1 m']
    source: {cite: reading1, at: 'Section 4.1, p. 65'}
    origin: page-own

  - id: plot-p-amp
    where: 'plot caption: p from -2 to 2 kg m/s'
    inputs: {P: 1 J*s, m: 1 kg, w: 2 1/s}
    formula: sqrt(2*m*w*P)
    expected: 2 kg*m/s
    shown: ['p from −2 to 2 kg m/s']
    source: {cite: reading1, at: 'Section 4.1, p. 65'}
    origin: page-own

  - id: plot-energy
    where: 'plot caption: energy omega P = 2 J'
    inputs: {P: 1 J*s, w: 2 1/s}
    formula: w * P
    expected: 2 J
    shown: ['energy ωP = 2 J']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.40), p. 65'}
    origin: page-own
