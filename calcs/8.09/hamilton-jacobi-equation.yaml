# Calculations on content/year-4/8.09/hamilton-jacobi-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 4, Section 4.4, pp. 73-79.
# Page's own worked example and graph: a ball of m = 0.2 kg thrown up from q = 0 at 9.8 m/s, g = 9.8 m/s^2,
# H = p^2/2m + m g q; W = -[2m(a - m g q)]^(3/2)/(3 m^2 g), q = a/(m g) - g (t + b)^2/2.

page: content/year-4/8.09/hamilton-jacobi-equation.mdx
calcs:
  # ---------------------------------------------------------------- oscillator (pp. 75-76)
  - id: osc-beta-integral
    kind: identity
    where: 'formula "The new coordinate of the oscillator": d/dq of (1/w) arcsin(sqrt(m w^2/(2a)) q) equals m/sqrt(2 m a - (m w q)^2)'
    formula: deriv('asin(sqrt(mm*ww**2/(2*aa))*x)/ww', 'x', qq, 1)
    equals: mm/sqrt(2*mm*aa - (mm*ww*qq)**2)
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], aa: [3.0, 1.0, 2.2], qq: [0.3, 0.2, 0.9]}
    tolerance: 1e-8
    shown: ['t + \beta = \pm\frac{1}{\omega}\arcsin\left(\sqrt{\frac{m\omega^2}{2\alpha}}\,q\right)']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.125), p. 76'}
    origin: mit

  - id: osc-p-from-q
    kind: identity
    where: 'formula "The oscillator solved by H-J": sqrt(2 m a - (m w q)^2) with q = sqrt(2a/(m w^2)) sin(w(t+b)) equals sqrt(2 m a) |cos(w(t+b))|'
    formula: sqrt(2*mm*aa - (mm*ww*sqrt(2*aa/(mm*ww**2))*sin(ph))**2)
    equals: sqrt(2*mm*aa)*abs(cos(ph))
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], aa: [3.0, 1.0, 2.2], ph: [0.3, 2.0, 4.0]}
    tolerance: 1e-9
    shown: ['p = \pm\sqrt{2m\alpha}\,\cos(\omega(t + \beta))']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.127), p. 76'}
    origin: mit

  - id: osc-hj-satisfied
    kind: identity
    where: 'formula "Principal function of the oscillator": S = -a t + W with dW/dq = sqrt(2 m a - (m w q)^2) satisfies the H-J equation (dS/dq)^2/2m + m w^2 q^2/2 + dS/dt = 0'
    formula: (2*mm*aa - (mm*ww*qq)**2)/(2*mm) + mm*ww**2*qq**2/2 - aa
    equals: 0
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], aa: [3.0, 1.0, 2.2], qq: [0.3, 0.2, 0.9]}
    tolerance: 1e-12
    shown: ['S = -\alpha t \pm \int\sqrt{2m\alpha - (m\omega q)^2}\,dq']
    source: {cite: reading1, at: 'Section 4.4, eqs. (4.116)-(4.124), pp. 75-76'}
    origin: mit

  # ---------------------------------------------------------------- worked example (page-own)
  - id: ball-W-derivative
    kind: identity
    where: 'worked example step "The characteristic function": dW/dq of -[2m(a - m g q)]^(3/2)/(3 m^2 g) equals sqrt(2m(a - m g q))'
    formula: deriv('-(2*mm*(aa - mm*gg*x))**1.5/(3*mm**2*gg)', 'x', qq, 1)
    equals: sqrt(2*mm*(aa - mm*gg*qq))
    samples: {mm: [0.2, 1.0, 2.5], gg: [9.8, 9.8, 1.6], aa: [9.604, 30.0, 12.0], qq: [0.0, 1.5, 0.7]}
    tolerance: 1e-8
    shown: ['$W = -\dfrac{\left[2m(\alpha - mgq)\right]^{3/2}}{3m^2g}$']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.130), p. 77'}
    origin: page-own

  - id: ball-W-alpha
    kind: identity
    where: 'worked example step "The motion": dW/da equals -sqrt(2m(a - m g q))/(m g)'
    formula: deriv('-(2*mm*(x - mm*gg*qq))**1.5/(3*mm**2*gg)', 'x', aa, 1)
    equals: -sqrt(2*mm*(aa - mm*gg*qq))/(mm*gg)
    samples: {mm: [0.2, 1.0, 2.5], gg: [9.8, 9.8, 1.6], aa: [9.604, 30.0, 12.0], qq: [0.0, 1.5, 0.7]}
    tolerance: 1e-8
    shown: ['$\partial W/\partial\alpha = -\dfrac{\sqrt{2m(\alpha - mgq)}}{mg} = t + \beta$']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.134), p. 77'}
    origin: page-own

  - id: ball-q-solution
    kind: identity
    where: 'worked example step "The motion": q = a/(m g) - g (t+b)^2/2 makes m^2 g^2 (t+b)^2 = 2m(a - m g q)'
    formula: mm**2*gg**2*(tt + bb)**2
    equals: 2*mm*(aa - mm*gg*(aa/(mm*gg) - gg*(tt + bb)**2/2))
    samples: {mm: [0.2, 1.0, 2.5], gg: [9.8, 9.8, 1.6], aa: [9.604, 30.0, 12.0], tt: [0.0, 0.4, 2.0], bb: [-1.0, -2.0, 0.5]}
    tolerance: 1e-9
    shown: ['so $q = \dfrac{\alpha}{mg} - \dfrac{1}{2}g(t + \beta)^2$']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.131), p. 77'}
    origin: page-own

  - id: ball-energy
    where: 'worked example step "The constants"; quiz 3: alpha = m v0^2/2'
    inputs: {m: 0.2 kg, v: 9.8 m/s}
    formula: m * v**2 / 2
    expected: 9.604 J
    tolerance: 1e-6 J
    quiz: 2
    shown: ['$\tfrac{1}{2}(0.2)(9.8)^2 = 9.604$ J. The top', '$\\tfrac{1}{2}(0.2)(9.8)^2 = 9.604$ J, so the top']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.130), p. 77'}
    origin: page-own

  - id: ball-top
    where: 'worked example step "The constants"; quiz 3 explanation; graph caption: top height a/(m g)'
    inputs: {a: 9.604 J, m: 0.2 kg, g: 9.8 m/s**2}
    formula: a / (m * g)
    expected: 4.9 m
    shown: ['$9.604/(0.2 \times 9.8) = 4.9$ m', 'tops out at 4.9 m after 1 s']
    source: {cite: reading1, at: 'Section 4.4, p. 77'}
    origin: page-own

  - id: ball-top-time
    where: 'worked example step "The constants"; graph caption: time to the top v0/g'
    inputs: {v: 9.8 m/s, g: 9.8 m/s**2}
    formula: v / g
    expected: 1 s
    shown: ['reached after $9.8/9.8 = 1$ s, so $\beta = -1$ s']
    source: {cite: reading1, at: 'Section 4.4, p. 77'}
    origin: page-own

  - id: ball-q-at-0
    where: 'worked example step "The constants": q(0) = 4.9 - 4.9 x 1 = 0'
    inputs: {h: 4.9 m, g: 9.8 m/s**2, b: -1 s, t: 0 s}
    formula: h - g * (t + b)**2 / 2
    expected: 0 m
    tolerance: 1e-9 m
    shown: ['$q = 4.9 - 4.9 \times 1 = 0$']
    source: {cite: reading1, at: 'Section 4.4, p. 77'}
    origin: page-own

  - id: ball-p-at-0
    where: 'worked example step "The constants": p = sqrt(2 m a) = 1.96 kg m/s = m v0'
    inputs: {m: 0.2 kg, a: 9.604 J}
    formula: sqrt(2 * m * a)
    expected: 1.96 kg*m/s
    shown: ['$p = \partial W/\partial q = \sqrt{2 \times 0.2 \times 9.604} = 1.96$ kg m/s']
    source: {cite: reading1, at: 'Section 4.4, eq. (4.131), p. 77'}
    origin: page-own
