# Calculations on content/year-4/8.09/chaos-phase-space-poincare-sections.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014) Lecture Notes, Chapter 7 (Stewart, typed), Section 7.1, printed pp. 142-152.
# The notes' only numbers are the parameters of their computer runs (q = 2, omega_D = 2/3, 30 cycles, the values of a
# and the table of Fig. 7.7): kind: fact. Everything else is the page's own: the forecast-horizon example, the
# dimensionless numbers of a real pendulum, the phase-portrait and limit-cycle plots, the quiz.

page: content/year-4/8.09/chaos-phase-space-poincare-sections.mdx
calcs:
  # ---------------------------------------------------------------- forecast horizon (worked example, quiz 1, plot 1)
  - id: horizon-a
    where: 'worked example "A forecast horizon" (a); quiz 1; plot 1 caption'
    inputs: {lam: 0.5, d0: 1e-6, tol: 1e-2}
    formula: log(tol/d0)/lam
    expected: '18.4'
    shown: ['= 9.21/0.5 \approx 18.4$ time units', 'cross the tolerance at t ≈ 18.4', '\\approx 18.4$']
    quiz: 0
    source: {cite: reading1, at: 'p. 142'}
    origin: page-own

  - id: horizon-a-log
    where: 'worked example (a): ln(10^4)'
    inputs: {}
    formula: log(1e4)
    expected: '9.21'
    shown: ['\ln(10^{4})/0.5 = 9.21/0.5']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: horizon-b
    where: 'worked example (b); plot 1 caption'
    inputs: {lam: 0.5, d0: 1e-9, tol: 1e-2}
    formula: log(tol/d0)/lam
    expected: '32.2'
    shown: ['= 16.1/0.5 \approx 32.2$', 'and t ≈ 32.2. Making']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: horizon-b-log
    where: 'worked example (b): ln(10^7)'
    inputs: {}
    formula: log(1e7)
    expected: '16.1'
    shown: ['\ln(10^{7})/0.5 = 16.1/0.5']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: horizon-gain
    where: 'worked example (b); plot 1 caption: extra time for 1000 times better data'
    inputs: {lam: 0.5}
    formula: log(1000)/lam
    expected: '13.8'
    shown: ['\ln(1000)/\lambda \approx 13.8$', 'buys only 13.8 time units']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: horizon-per-decade
    where: 'worked example (b): extra time per factor of ten'
    inputs: {lam: 0.5}
    formula: log(10)/lam
    expected: '4.6'
    shown: ['\ln 10/\lambda \approx 4.6$ units']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: plot1-slope
    kind: identity
    where: 'plot 1: log10|delta| = log10|delta0| + lambda t / ln 10 is log10 of delta0 e^(lambda t)'
    formula: log10(d0*exp(lam*t))
    equals: log10(d0) + lam*t/log(10)
    samples: {d0: [1e-6, 1e-9, 1e-6], lam: [0.5, 0.5, 0.2], t: [0, 10, 30]}
    tolerance: 1e-9
    shown: ['log₁₀|δ| = log₁₀|δ₀| + λt/ln 10']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  # ---------------------------------------------------------------- the dimensionless pendulum (worked example)
  - id: time-unit
    where: 'worked example "Dimensionless numbers for a real pendulum": sqrt(l/g)'
    inputs: {l: 0.50 m, g: 9.81 m/s^2}
    formula: sqrt(l/g)
    expected: 0.226 s
    shown: ['\sqrt{0.50/9.81} = 0.226$ s']
    source: {cite: reading1, at: 'p. 144, eq. (7.6)'}
    origin: page-own

  - id: small-swing-period
    where: 'same example: period of a small free swing, 2 pi sqrt(l/g)'
    inputs: {l: 0.50 m, g: 9.81 m/s^2}
    formula: 2*pi*sqrt(l/g)
    expected: 1.42 s
    shown: ['2\pi \times 0.226 = 1.42$ s']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: inverse-q
    where: 'same example: 1/q = gamma sqrt(l/g), eq. (7.7)'
    inputs: {l: 0.50 m, g: 9.81 m/s^2, gam: 0.80 1/s}
    formula: gam*sqrt(l/g)
    expected: '0.181'
    shown: ['1/q = 0.226 \times 0.80 = 0.181$']
    source: {cite: reading1, at: 'p. 144, eq. (7.7)'}
    origin: page-own

  - id: q-value
    where: 'same example; the volume-shrinking remark'
    inputs: {l: 0.50 m, g: 9.81 m/s^2, gam: 0.80 1/s}
    formula: 1/(gam*sqrt(l/g))
    expected: '5.5'
    shown: ['so $q = 5.5$', 'With $q \approx 5.5$']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: drive-frequency
    where: 'same example: omega_D'' = sqrt(l/g) omega_D, eq. (7.6)'
    inputs: {l: 0.50 m, g: 9.81 m/s^2, wD: 2.0 1/s}
    formula: sqrt(l/g)*wD
    expected: '0.45'
    shown: ['\omega_D'' = 0.226 \times 2.0 = 0.45$']
    source: {cite: reading1, at: 'p. 144, eq. (7.6)'}
    origin: page-own

  - id: volume-efold-time
    where: '"Phase space: no crossings, and volumes": q dimensionless time units are 1/gamma seconds'
    inputs: {l: 0.50 m, g: 9.81 m/s^2, gam: 0.80 1/s}
    formula: (1/(gam*sqrt(l/g)))*sqrt(l/g)
    expected: 1.25 s
    shown: ['1/\gamma = 1.25$ s']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: divergence
    kind: identity
    where: 'formula "Divergence of the pendulum flow", eq. (7.12): d(omega_dot)/d(omega) = -1/q (the other two terms vanish)'
    formula: deriv('-w/q - sin(th) + a*cos(ph)', 'w', w0)
    equals: -1/q
    samples: {q: [2, 5.5], th: [0.3, 2.0], a: [1.07, 0.9], ph: [0.5, 2.0], w0: [0.1, -1.0]}
    tolerance: 1e-6
    shown: ['= -\frac{1}{q} < 0']
    source: {cite: reading1, at: 'p. 146, eq. (7.12)'}
    origin: mit

  # ---------------------------------------------------------------- phase portrait (plot 2)
  - id: separatrix
    kind: identity
    where: 'plot 2: the E = 1 curve sqrt(2(1 + cos theta)) equals 2|cos(theta/2)|'
    formula: sqrt(2*(1 + cos(th)))
    equals: 2*abs(cos(th/2))
    samples: {th: [-6.5, -3.0, -1.0, 0.0, 2.0, 5.0]}
    tolerance: 1e-9
    shown: ['{ expr: "2*abs(cos(x/2))", label: "E = 1 (separatrix)", dash: true }']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: energy-conserved
    kind: identity
    where: 'plot 2: E = omega^2/2 - cos theta is constant on the flow theta_dot = omega, omega_dot = -sin theta (dE/dt = omega omega_dot + sin theta theta_dot = 0)'
    formula: w*(-sin(th)) + sin(th)*w
    equals: '0'
    samples: {w: [0.3, -1.2], th: [0.4, 2.5]}
    tolerance: 1e-12
    shown: ['E = \frac12\omega^2 - \cos\theta']
    source: {cite: reading1, at: 'p. 146, eq. (7.13)'}
    origin: page-own

  # ---------------------------------------------------------------- linear driven oscillator (eq. 7.16, plot 3)
  - id: steady-amplitude-form
    kind: identity
    where: 'formula "Underdamped driven solution", eq. (7.16): the notes'' amplitude a/(w sqrt(q^-2 + (1/w - w)^2)) equals the usual a/sqrt((1 - w^2)^2 + w^2/q^2)'
    formula: a/(w*sqrt(q**-2 + (1/w - w)**2))
    equals: a/sqrt((1 - w**2)**2 + w**2/q**2)
    samples: {a: [0.5, 0.5, 1.0, 0.2], w: [0.3, 0.6, 1.0, 2.0], q: [0.7, 3, 3, 1.5]}
    tolerance: 1e-9
    shown: ['\omega_D\sqrt{q^{-2} + (\omega_D^{-1} - \omega_D)^2}']
    source: {cite: reading1, at: 'p. 148, eq. (7.16)'}
    origin: mit

  - id: steady-solution-solves
    kind: identity
    where: 'eq. (7.16): the steady term A cos(w t - psi) with tan psi = w/(q - q w^2) (w < 1, so psi = atan of it) solves theta_ddot + theta_dot/q + theta = a cos(w t) (residual 0)'
    formula: "-w**2*(a/sqrt((1-w**2)**2 + w**2/q**2))*cos(w*t - atan(w/(q - q*w**2))) - (w/q)*(a/sqrt((1-w**2)**2 + w**2/q**2))*sin(w*t - atan(w/(q - q*w**2))) + (a/sqrt((1-w**2)**2 + w**2/q**2))*cos(w*t - atan(w/(q - q*w**2))) - a*cos(w*t)"
    equals: '0'
    samples: {a: [0.5, 0.5, 1.2], w: [0.6, 0.4, 0.9], q: [3, 0.8, 5], t: [0.0, 1.3, 7.0]}
    tolerance: 1e-9
    shown: ['with $\tan\psi = \omega_D/(q - q\omega_D^2)$']
    source: {cite: reading1, at: 'p. 148, eq. (7.16)'}
    origin: mit

  - id: transient-solves
    kind: identity
    where: 'eq. (7.16): the transient B e^(-t/2q) cos(t sqrt(1 - 1/4q^2)) solves theta_ddot + theta_dot/q + theta = 0 (numerical second derivative)'
    formula: deriv('exp(-s/(2*q))*cos(s*sqrt(1 - 1/(4*q**2)))', 's', t0, 2) + deriv('exp(-s/(2*q))*cos(s*sqrt(1 - 1/(4*q**2)))', 's', t0)/q + exp(-t0/(2*q))*cos(t0*sqrt(1 - 1/(4*q**2)))
    equals: '0'
    samples: {q: [3, 0.9], t0: [0.5, 2.0]}
    tolerance: 1e-4
    shown: ['Be^{-t/(2q)}\cos\!\left(t\sqrt{1 - \frac{1}{4q^2}} + \varphi_0\right)']
    source: {cite: reading1, at: 'p. 148, eq. (7.16)'}
    origin: mit

  - id: plot3-amplitude
    where: 'plot 3 caption: steady amplitude for q = 3, omega_D = 0.6, a = 0.5'
    inputs: {a: 0.5, w: 0.6, q: 3}
    formula: a/(w*sqrt(q**-2 + (1/w - w)**2))
    expected: '0.75'
    shown: ['= 0.75 and the phase lag', 'θ = 0.75 cos(ω_D t − ψ)', '0.74569*cos(s)']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: plot3-phase
    where: 'plot 3 caption: phase lag psi'
    inputs: {w: 0.6, q: 3}
    formula: atan(w/(q - q*w**2))
    expected: '0.303'
    shown: ['ψ = 0.303 rad', '0.74569*cos(0.6*s - 0.30288)']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: plot3-omega-amplitude
    where: 'plot 3: amplitude of omega in the steady motion, omega_D times the angle amplitude'
    inputs: {a: 0.5, w: 0.6, q: 3}
    formula: w*a/(w*sqrt(q**-2 + (1/w - w)**2))
    expected: '0.45'
    shown: ['ω = −0.45 sin(ω_D t − ψ)', '-0.44741*sin(s)']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  - id: plot3-transient-frequency
    where: 'plot 3: transient frequency sqrt(1 - 1/(4 q^2)) for q = 3'
    inputs: {q: 3}
    formula: sqrt(1 - 1/(4*q**2))
    expected: '0.98601'
    shown: ['2*exp(-s/6)*cos(0.98601*s)']
    source: {cite: reading1, at: 'pp. 142-152 (the page''s own example)'}
    origin: page-own

  # ---------------------------------------------------------------- the notes' computer runs (facts)
  - id: run-parameters
    kind: fact
    where: '"Picturing chaotic trajectories": the notes'' Poincare-section runs use omega_D = 2/3, q = 2 and wait 30 drive cycles'
    value: 'omega_D = 2/3, q = 2, 30 cycles'
    shown: ['take $\omega_D = \frac23$ and $q = 2$ and wait 30 drive cycles']
    source: {cite: reading1, at: 'p. 150'}
    origin: mit

  - id: run-a-values
    kind: fact
    where: 'same: a = 0.9 (period one), 1.07 (period two), 1.19 (chaos), 1.35 (periodic within chaos)'
    value: 'a = 0.9, 1.07, 1.19, 1.35'
    shown: ['($a = 0.9$, one point in the section)', '($a = 1.07$, two points)', '($a = 1.19$, a scattered', '($a = 1.35$)']
    source: {cite: reading1, at: 'p. 150 and Fig. 7.6'}
    origin: mit

  - id: bifurcation-table
    kind: fact
    where: 'table after "Bifurcation diagrams" (the notes'' table below Fig. 7.7); summary'
    value: '1.0 single; 1.07 doubling; 1.15-1.28 mostly chaos; 1.35 periodic'
    shown: ['| 1.15 to 1.28 | mostly chaos, with some periodic windows |', 'between about 1.15 and 1.28']
    source: {cite: reading1, at: 'p. 152'}
    origin: mit
