# Calculations on content/year-4/8.09/poisson-brackets-symplectic-condition.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 4, Section 4.2, pp. 66-69.
# Page's own worked example: brackets of Q = q^2, P = p/(2q), and of the oscillator variables
# Q = arctan(m w q/p), P = (p^2 + m^2 w^2 q^2)/(2 m w) at q = 1 m, p = 2 kg m/s, m = 1 kg, w = 2 /s.
# Page's own graph: the linear map Q = 2q + p, P = q + p on the unit circle.

page: content/year-4/8.09/poisson-brackets-symplectic-condition.mdx
calcs:
  - id: bracket-squared
    kind: identity
    where: 'worked example step "(a) The squared coordinate": dQ/dq dP/dp - dQ/dp dP/dq = 2q/(2q) = 1'
    formula: deriv('x**2', 'x', qq, 1) * deriv('pp/(2*qq)', 'pp', pp, 1) - 0
    equals: 1
    samples: {qq: [0.5, 3.0, 1.7], pp: [1.0, 6.0, -2.0]}
    tolerance: 1e-9
    shown: ['2q \cdot \dfrac{1}{2q} - 0 = 1']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.52), p. 66'}
    origin: page-own

  - id: bracket-oscillator
    kind: identity
    where: 'worked example step "(b) The bracket": {Q, P} = 1 for Q = arctan(m w q/p), P = (p^2 + m^2 w^2 q^2)/(2 m w), derivatives taken numerically'
    formula: deriv('atan(mm*ww*x/pp)', 'x', qq, 1) * deriv('(x**2 + mm**2*ww**2*qq**2)/(2*mm*ww)', 'x', pp, 1) - deriv('atan(mm*ww*qq/x)', 'x', pp, 1) * deriv('(pp**2 + mm**2*ww**2*x**2)/(2*mm*ww)', 'x', qq, 1)
    equals: 1
    samples: {mm: [1.0, 2.5, 0.4], ww: [2.0, 0.8, 1.5], qq: [1.0, 0.3, -0.7], pp: [2.0, 1.1, 0.9]}
    tolerance: 1e-7
    shown: ['= \dfrac{p^2 + m^2\omega^2q^2}{p^2 + m^2\omega^2q^2} = 1$ at every point']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.52), p. 66'}
    origin: page-own

  - id: osc-point-mwq
    where: 'worked example step "(b) The bracket": m w q = 2 kg m/s, equal to p'
    inputs: {m: 1 kg, w: 2 1/s, q: 1 m}
    formula: m * w * q
    expected: 2 kg*m/s
    shown: ['At the given point $m\omega q = 2$ kg m/s equals $p$']
    source: {cite: reading1, at: 'Section 4.1, p. 65'}
    origin: page-own

  - id: osc-point-Q
    where: 'worked example step "(b) The bracket": Q = arctan 1 = pi/4'
    inputs: {}
    formula: atan(1) / pi
    expected: '0.25'
    shown: ['$Q = \arctan 1 = \pi/4$']
    source: {cite: reading1, at: 'Section 4.1, p. 65'}
    origin: page-own

  - id: osc-point-P
    where: 'worked example step "(b) The bracket": P = (4 + 4)/4 = 2 J s'
    inputs: {p: 2 kg*m/s, m: 1 kg, w: 2 1/s, q: 1 m}
    formula: (p**2 + m**2 * w**2 * q**2) / (2 * m * w)
    expected: 2 J*s
    shown: ['$P = (4 + 4)/4 = 2$ J s']
    source: {cite: reading1, at: 'Section 4.1, eq. (4.40), p. 65'}
    origin: page-own

  - id: osc-point-terms
    where: 'worked example step "(b) The bracket": each term of the bracket is 1/2 at the given point'
    inputs: {}
    formula: (1*2*2/(4 + 4)) * (2/(1*2))
    expected: '0.5'
    shown: ['the two terms of the bracket are $\tfrac{1}{2}$ each']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.43), p. 66'}
    origin: page-own

  - id: quiz-q2-p
    kind: identity
    where: 'quiz 1: {q^2, p} = 2q'
    formula: deriv('x**2', 'x', qq, 1)
    equals: 2*qq
    samples: {qq: [0.5, 3.0, -1.7]}
    tolerance: 1e-9
    shown: ['= 2q \\times 1 - 0 = 2q$']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.43), p. 66'}
    origin: page-own

  - id: quiz-linear-a
    where: 'quiz 2: {Q, P} = 2 - a = 1 gives a = 1'
    inputs: {}
    formula: 2 - 1
    expected: '1'
    quiz: 1
    shown: ['which must equal 1, so $a = 1$']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.52), p. 66'}
    origin: page-own

  - id: twobytwo-symplectic
    kind: identity
    where: '"Two consequences": for a 2 x 2 matrix M = (a b; c d), the (1,2) entry of M^T J M, summed term by term as sum_kl (M^T)_1k J_kl M_l2 with J_12 = 1, J_21 = -1, J_11 = J_22 = 0, equals ad - bc'
    formula: aa*0*bb + aa*1*dd + cc*(-1)*bb + cc*0*dd
    equals: aa*dd - bb*cc
    samples: {aa: [2, 0.3, -1.7], bb: [1, 2.2, 0.4], cc: [1, -0.8, 1.9], dd: [1, 1.1, -0.6]}
    tolerance: 1e-12
    shown: ['$M^T JM = (ad - bc)J$']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.65), p. 68'}
    origin: page-own

  - id: graph-det
    where: 'graph caption and text: det M = 2 x 1 - 1 x 1 = 1 for Q = 2q + p, P = q + p'
    inputs: {}
    formula: 2*1 - 1*1
    expected: '1'
    shown: ['determinant 2 × 1 − 1 × 1 = 1', 'with $\det M = 2 - 1 = 1$']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.75), p. 69'}
    origin: page-own

  - id: graph-area
    kind: identity
    where: 'graph caption: the image ellipse encloses area pi (shoelace integral of Q dP over the parametrised curve)'
    formula: integrate('(2*cos(s) + sin(s))*(-sin(s) + cos(s))', 's', 0, 2*pi) * kk
    equals: pi * kk
    samples: {kk: [1.0, 2.0]}
    tolerance: 1e-9
    shown: ['encloses the same area as the circle, π']
    source: {cite: reading1, at: 'Section 4.2, eq. (4.74), p. 69'}
    origin: page-own
