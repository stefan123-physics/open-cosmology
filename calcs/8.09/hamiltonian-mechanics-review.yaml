# Calculations on content/year-4/8.09/hamiltonian-mechanics-review.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 1, Section 1.2 (Hamiltonian part), pp. 8-12.
# Two-coordinate checks write the symmetric velocity matrix as T = [[t11, t12], [t12, t22]].
# Page's own worked example: a spherical pendulum, l = 0.50 m, circling steadily at 60 degrees.
# Quiz 3: a 0.50 kg bob on a 0.40 m rod hanging from a 2.0 kg sliding block.

page: content/year-4/8.09/hamiltonian-mechanics-review.mdx
calcs:
  # ---------------------------------------------------------------- H = E (p. 9)
  - id: euler-homogeneous
    kind: identity
    where: 'formula "Velocities times momenta" (eq. 1.30): qdot_i dL/dqdot_i = 2T for T = 1/2 T_jk qdot_j qdot_k (two coordinates)'
    formula: u*(t11*u + t12*w) + w*(t12*u + t22*w)
    equals: 2 * (0.5*(t11*u**2 + 2*t12*u*w + t22*w**2))
    samples: {u: [0.3, 1.1, -0.6], w: [1.0, -0.4, 2.2], t11: [2.0, 1.5, 3.0], t12: [0.3, -0.2, 0.9], t22: [1.0, 0.7, 2.5]}
    tolerance: 1e-12
    shown: ['= 2T" cite="reading1" at="Section 1.2, eq. (1.30), p. 9"']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.30), p. 9'}
    origin: mit

  # ---------------------------------------------------------------- the recipe (pp. 9-10)
  - id: recipe-hamiltonian
    kind: identity
    where: 'formula "Hamiltonian for this Lagrangian" (eq. 1.35): with p = a + T qdot, qdot.p - L equals 1/2 (p - a).T^-1.(p - a) - L0 (two coordinates; L0 = 0.7)'
    formula: u*(a1 + t11*u + t12*w) + w*(a2 + t12*u + t22*w) - (0.7 + a1*u + a2*w + 0.5*(t11*u**2 + 2*t12*u*w + t22*w**2))
    equals: 0.5*(t22*(t11*u + t12*w)**2 - 2*t12*(t11*u + t12*w)*(t12*u + t22*w) + t11*(t12*u + t22*w)**2)/(t11*t22 - t12**2) - 0.7
    samples: {u: [0.3, 1.1, -0.6], w: [1.0, -0.4, 2.2], a1: [0.5, -1.0, 2.0], a2: [0.2, 0.8, -0.3], t11: [2.0, 1.5, 3.0], t12: [0.3, -0.2, 0.9], t22: [1.0, 0.7, 2.5]}
    tolerance: 1e-12
    shown: ['H = \frac12\,(p_j - a_j)\,(T^{-1})_{jk}\,(p_k - a_k) - L_0(q, t)']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.35), p. 10'}
    origin: mit

  - id: polar-hamiltonian
    kind: identity
    where: 'quiz 1: free particle in polar coordinates, H = p_r^2/2m + p_th^2/(2 m r^2) with p_r = m rdot, p_th = m r^2 thdot equals the kinetic energy'
    formula: (m*rd)**2/(2*m) + (m*r**2*w)**2/(2*m*r**2)
    equals: m/2*(rd**2 + r**2*w**2)
    samples: {m: [1.0, 2.5, 0.3], rd: [0.3, 1.1, -0.6], r: [0.5, 2.0, 1.3], w: [1.0, -0.4, 2.2]}
    tolerance: 1e-12
    shown: ['$H = p_r^2/2m + p_\\theta^2/2mr^2$']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.35), p. 10'}
    origin: page-own

  # ---------------------------------------------------------------- pendulum on a sliding block (pp. 10-12)
  - id: pendulum-lagrangian
    kind: identity
    where: 'formula "Lagrangian with the constraints imposed" (eq. 1.39): m1/2 xd^2 + m2/2 ((xd + l cos th thd)^2 + (l sin th thd)^2) simplifies to the page form'
    formula: m1/2*xd**2 + m2/2*((xd + l*cos(th)*thd)**2 + (l*sin(th)*thd)**2)
    equals: (m1 + m2)/2*xd**2 + m2*l*cos(th)*xd*thd + m2*l**2/2*thd**2
    samples: {m1: [2.0, 1.0, 5.0], m2: [0.5, 3.0, 1.2], l: [0.4, 1.0, 2.0], th: [0.3, 1.2, -0.8], xd: [0.7, -0.3, 1.5], thd: [1.1, 0.4, -2.0]}
    tolerance: 1e-12
    shown: ['L = \frac{m_1 + m_2}{2}\dot x^2 + m_2\ell\cos\theta\,\dot x\dot\theta + \frac{m_2\ell^2}{2}\dot\theta^2 + m_2 g\ell\cos\theta']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.39), p. 10'}
    origin: mit

  - id: pendulum-determinant
    kind: identity
    where: 'formula "The velocity matrix and its inverse" (eqs. 1.41-1.42): det T = m2 l^2 (m1 + m2 sin^2 th)'
    formula: (m1 + m2)*m2*l**2 - (m2*l*cos(th))**2
    equals: m2*l**2*(m1 + m2*sin(th)**2)
    samples: {m1: [2.0, 1.0, 5.0], m2: [0.5, 3.0, 1.2], l: [0.4, 1.0, 2.0], th: [0.3, 1.2, -0.8]}
    tolerance: 1e-12
    shown: ['m_2\ell^2(m_1 + m_2) - m_2^2\ell^2\cos^2\theta = m_2\ell^2(m_1 + m_2\sin^2\theta)']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.42), p. 11'}
    origin: mit

  - id: pendulum-hamiltonian
    kind: identity
    where: 'formula "Hamiltonian of the pendulum on a sliding block" (eq. 1.43): with p_x, p_th from eq. (1.40), the page H equals the kinetic energy minus L0 = m2 g l cos th'
    formula: (m2*l**2*((m1 + m2)*xd + m2*l*cos(th)*thd)**2 + (m1 + m2)*(m2*l*cos(th)*xd + m2*l**2*thd)**2 - 2*m2*l*cos(th)*((m1 + m2)*xd + m2*l*cos(th)*thd)*(m2*l*cos(th)*xd + m2*l**2*thd))/(2*m2*l**2*(m1 + m2*sin(th)**2)) - m2*9.81*l*cos(th)
    equals: (m1 + m2)/2*xd**2 + m2*l*cos(th)*xd*thd + m2*l**2/2*thd**2 - m2*9.81*l*cos(th)
    samples: {m1: [2.0, 1.0, 5.0], m2: [0.5, 3.0, 1.2], l: [0.4, 1.0, 2.0], th: [0.3, 1.2, -0.8], xd: [0.7, -0.3, 1.5], thd: [1.1, 0.4, -2.0]}
    tolerance: 1e-10
    shown: ['- 2m_2\ell\cos\theta\,p_x p_\theta}{2m_2\ell^2\left(m_1 + m_2\sin^2\theta\right)} - m_2 g\ell\cos\theta']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.43), p. 11'}
    origin: mit

  - id: pendulum-xdot
    kind: identity
    where: 'formula "Equations for x" (eq. 1.44): dH/dp_x, taken numerically, equals p_x/(m1 + m2 sin^2) - cos th p_th/(l (m1 + m2 sin^2)); m1 = 2, m2 = 0.5, l = 0.4'
    formula: "deriv('(0.5*0.4**2*x**2 + 2.5*pt**2 - 2*0.5*0.4*cos(th)*x*pt)/(2*0.5*0.4**2*(2 + 0.5*sin(th)**2))', 'x', px, 1)"
    equals: px/(2 + 0.5*sin(th)**2) - cos(th)*pt/(0.4*(2 + 0.5*sin(th)**2))
    samples: {th: [0.3, 1.2, -0.8], px: [0.7, -0.3, 1.5], pt: [1.1, 0.4, -2.0]}
    tolerance: 1e-6
    shown: ['\dot x = \frac{p_x}{m_1 + m_2\sin^2\theta} - \frac{\cos\theta\,p_\theta}{\ell\left(m_1 + m_2\sin^2\theta\right)}']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.44), p. 11'}
    origin: mit

  - id: pendulum-pthetadot-slip
    kind: identity
    where: 'bracketed note after eq. (1.44): -dH/dth (numerical) equals the notes'' eq. (1.45) with the last denominator l (m1 + m2 sin^2 th), not l (m1 + m2 sin th); m1 = 2, m2 = 0.5, l = 0.4, g = 9.81'
    formula: "-deriv('(0.5*0.4**2*px**2 + 2.5*pt**2 - 2*0.5*0.4*cos(x)*px*pt)/(2*0.5*0.4**2*(2 + 0.5*sin(x)**2)) - 0.5*9.81*0.4*cos(x)', 'x', th, 1)"
    equals: sin(th)*cos(th)/(0.4**2*(2 + 0.5*sin(th)**2)**2)*(0.5*0.4**2*px**2 + 2.5*pt**2 - 2*0.5*0.4*cos(th)*px*pt) - 0.5*9.81*0.4*sin(th) - sin(th)*px*pt/(0.4*(2 + 0.5*sin(th)**2))
    samples: {th: [0.3, 1.2, -0.8], px: [0.7, -0.3, 1.5], pt: [1.1, 0.4, -2.0]}
    tolerance: 1e-6
    shown: ['- \frac{\sin\theta\,p_x p_\theta}{\ell\left(m_1 + m_2\sin^2\theta\right)}', 'the square on $\sin\theta$ belongs there']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.45), p. 11'}
    origin: slip

  - id: small-oscillation-frequency
    kind: identity
    where: 'formula "Frequency of the small oscillations": m2 g/(mu l) with mu = m1 m2/(m1 + m2) equals (g/l)(1 + m2/m1); also the plot curve sqrt(1 + x)'
    formula: m2*g0/((m1*m2/(m1 + m2))*l)
    equals: g0/l*(1 + m2/m1)
    samples: {m1: [2.0, 1.0, 5.0], m2: [0.5, 3.0, 1.2], l: [0.4, 1.0, 2.0], g0: [9.81, 9.81, 9.81]}
    tolerance: 1e-12
    shown: ['\omega^2 = \frac{m_2\,g}{\mu\,\ell} = \frac{g}{\ell}\left(1 + \frac{m_2}{m_1}\right)', 'sqrt(1 + x)']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.47), p. 12'}
    origin: mit

  - id: quiz-frequency-ratio-squared
    where: 'quiz 3 explanation: 1 + m2/m1 for m2 = 0.50 kg, m1 = 2.0 kg'
    inputs: {m1: 2.0 kg, m2: 0.50 kg}
    formula: 1 + m2/m1
    expected: '1.25'
    shown: ['$1 + m_2/m_1 = 1.25$']
    source: {cite: reading1, at: 'Section 1.2, p. 12'}
    origin: page-own

  - id: quiz-frequency-ratio
    where: 'quiz 3 (answer 1.12) and the plot point "quiz example" at m2/m1 = 0.25, y = 1.118'
    inputs: {m1: 2.0 kg, m2: 0.50 kg}
    formula: sqrt(1 + m2/m1)
    expected: '1.118'
    shown: ['$\\sqrt{1.25} = 1.12$', '{ x: 0.25, y: 1.118, label: "quiz example" }']
    source: {cite: reading1, at: 'Section 1.2, p. 12'}
    origin: page-own

  # ---------------------------------------------------------------- worked example: spherical pendulum
  - id: spherical-steady-condition
    kind: identity
    where: 'worked example step "Steady circling": with p_phi = m l^2 sin^2 th phidot, p_phi^2 cos th/(m l^2 sin^3 th) = m l^2 sin th cos th phidot^2'
    formula: (m*l**2*sin(th)**2*w)**2*cos(th)/(m*l**2*sin(th)**3)
    equals: m*l**2*sin(th)*cos(th)*w**2
    samples: {m: [1.0, 2.5, 0.3], l: [0.5, 2.0, 1.3], th: [0.3, 1.2, 0.8], w: [1.0, -0.4, 2.2]}
    tolerance: 1e-12
    shown: ['$m\ell^2\sin\theta\cos\theta\,\dot\phi^2 = mg\ell\sin\theta$']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.35), p. 10'}
    origin: page-own

  - id: spherical-phidot-squared
    where: 'worked example step "Steady circling": phidot^2 = g/(l cos 60 degrees)'
    inputs: {g0: 9.81 m/s**2, l: 0.50 m}
    formula: g0 / (l * cos(pi/3))
    expected: 39.2 s**-2
    shown: ['$\dot\phi^2 = 9.81/0.25 = 39.2\ \text{s}^{-2}$']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.35), p. 10'}
    origin: page-own

  - id: spherical-phidot
    where: 'worked example step "Steady circling": phidot'
    inputs: {g0: 9.81 m/s**2, l: 0.50 m}
    formula: sqrt(g0 / (l * cos(pi/3)))
    expected: 6.26 s**-1
    shown: ['$\dot\phi = 6.26$ rad/s']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.35), p. 10'}
    origin: page-own

  - id: spherical-period
    where: 'worked example step "Steady circling": one turn takes 2 pi/phidot'
    inputs: {g0: 9.81 m/s**2, l: 0.50 m}
    formula: 2*pi / sqrt(g0 / (l * cos(pi/3)))
    expected: 1.00 s
    shown: ['$2\pi/6.26 = 1.00$ s']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.35), p. 10'}
    origin: page-own

  - id: quiz-frequency-ratio-answer
    where: 'quiz 3: the marked answer 1.12 for m2 = 0.50 kg, m1 = 2.0 kg, l = 0.40 m (the rod length cancels in the ratio)'
    inputs: {m1: 2.0 kg, m2: 0.50 kg}
    formula: sqrt(1 + m2/m1)
    expected: '1.12'
    shown: ['A pendulum bob of 0.50 kg hangs on a 0.40 m rod from a 2.0 kg block']
    quiz: 2
    source: {cite: reading1, at: 'Section 1.2, p. 12'}
    origin: page-own

  - id: pendulum-thetadot
    kind: identity
    where: 'formula "Equations for theta" (eq. 1.45), first part: dH/dp_th (numerical) equals ((m1 + m2) p_th - m2 l cos th p_x)/(m2 l^2 (m1 + m2 sin^2 th)); m1 = 2, m2 = 0.5, l = 0.4'
    formula: "deriv('(0.5*0.4**2*px**2 + 2.5*x**2 - 2*0.5*0.4*cos(th)*px*x)/(2*0.5*0.4**2*(2 + 0.5*sin(th)**2))', 'x', pt, 1)"
    equals: (2.5*pt - 0.5*0.4*cos(th)*px)/(0.5*0.4**2*(2 + 0.5*sin(th)**2))
    samples: {th: [0.3, 1.2, -0.8], px: [0.7, -0.3, 1.5], pt: [1.1, 0.4, -2.0]}
    tolerance: 1e-6
    shown: ['\dot\theta = \frac{(m_1 + m_2)p_\theta - m_2\ell\cos\theta\,p_x}{m_2\ell^2\left(m_1 + m_2\sin^2\theta\right)}']
    source: {cite: reading1, at: 'Section 1.2, eq. (1.45), p. 11'}
    origin: mit
