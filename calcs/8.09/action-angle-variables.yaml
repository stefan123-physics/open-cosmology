# Calculations on content/year-4/8.09/action-angle-variables.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 4, Section 4.6, pp. 83-87 (one degree of freedom).
# Page's own worked example: a pendulum with a = 1 m, g = 9.8 m/s^2, released from rest at 90 degrees.
# Page's own graph: pendulum orbits for E~ = -0.5, 0.5, 1 (separatrix) and 1.8.

page: content/year-4/8.09/action-angle-variables.mdx
calcs:
  - id: quiz-turning-point
    where: 'quiz 2: E~ = 0.5 gives cos(theta0) = -0.5, theta0 = 120 degrees'
    inputs: {}
    formula: acos(-0.5) * 180 / pi
    expected: '120'
    quiz: 1
    shown: ['$\\theta_0 = 120°$, above the horizontal']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.183), p. 86'}
    origin: page-own

  - id: osc-action
    kind: identity
    where: 'formula "Oscillator action": the integral of eq. (4.189), 4 sqrt(2mE) times the integral of sqrt(1 - x^2/x0^2) from 0 to x0, equals 2 pi E/Omega'
    formula: 4*sqrt(2*mm*EE)*integrate('sqrt(1 - x**2/x0**2)', 'x', 0, x0) + 0*(x0 - sqrt(2*mm*EE)/(mm*WW))
    equals: 2*pi*EE/WW
    samples: {mm: [1.0, 2.5, 0.4], EE: [0.5, 3.0, 1.2], WW: [2.0, 0.8, 3.3], x0: [0.5, 1.9364917, 0.7422696]}
    tolerance: 1e-6
    shown: ['J = \pi\sqrt{2mE}\,x_0 = \frac{2\pi mE}{m\Omega} = \frac{2\pi E}{\Omega}']
    source: {cite: reading1, at: 'Section 4.6, eqs. (4.189)-(4.190), p. 87'}
    origin: mit

  - id: pendulum-small-angle
    kind: identity
    where: 'formula "Pendulum for small angles": -m g a cos(theta) = m g a theta^2/2 - m g a + O(theta^4) (checked as a limit-free comparison at small theta, tolerance relative)'
    formula: -9.8*cos(th)
    equals: 9.8*th**2/2 - 9.8
    samples: {th: [0.001, 0.002, -0.0015]}
    tolerance: 1e-12
    shown: ['$\cos\theta \approx 1 - \theta^2/2$']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.185), p. 86'}
    origin: mit

  - id: ex-integral
    where: 'worked example step "Numbers": the integral of 1/sqrt(cos theta) from 0 to pi/2'
    inputs: {}
    formula: integrate('1/sqrt(cos(x))', 'x', 0, pi/2)
    expected: '2.622'
    shown: ['The integral is $2.622$']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.184), p. 86'}
    origin: page-own

  - id: ex-prefactor
    where: 'worked example step "Numbers": 2 sqrt(2a/g)'
    inputs: {a: 1 m, g: 9.8 m/s**2}
    formula: 2 * sqrt(2 * a / g)
    expected: 0.9035 s
    shown: ['$2\sqrt{2 \times 1/9.8} = 0.9035$ s']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.184), p. 86'}
    origin: page-own

  - id: ex-period
    where: 'worked example step "Numbers": tau = 2 sqrt(2a/g) times the integral'
    inputs: {a: 1 m, g: 9.8 m/s**2}
    formula: 2 * sqrt(2 * a / g) * integrate('1/sqrt(cos(x))', 'x', 0, pi/2)
    expected: 2.369 s
    shown: ['so $\tau = 2.369$ s and']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.184), p. 86'}
    origin: page-own

  - id: ex-period-elliptic
    kind: identity
    where: 'worked example: the same period from the standard form 4 sqrt(a/g) K(sin(theta0/2)), K written as a smooth integral (cross-check of the singular integral)'
    formula: 2*sqrt(2/9.8)*integrate('1/sqrt(cos(x))', 'x', 0, pi/2) + kk
    equals: 4*sqrt(1/9.8)*integrate('1/sqrt(1 - 0.5*sin(x)**2)', 'x', 0, pi/2) + kk
    samples: {kk: [0.0, 1.0]}
    tolerance: 1e-6
    shown: ['(it is finite although the integrand blows up at $\pi/2$)']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.183), p. 86'}
    origin: page-own

  - id: ex-frequency
    where: 'worked example step "Numbers": nu = 1/tau'
    inputs: {a: 1 m, g: 9.8 m/s**2}
    formula: 1 / (2 * sqrt(2 * a / g) * integrate('1/sqrt(cos(x))', 'x', 0, pi/2))
    expected: 0.422 Hz
    shown: ['$\nu = 0.422$ Hz']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.178), p. 85'}
    origin: page-own

  - id: ex-nu0
    where: 'worked example step "Numbers": small-amplitude frequency sqrt(g/a)/2 pi'
    inputs: {a: 1 m, g: 9.8 m/s**2}
    formula: sqrt(g / a) / (2 * pi)
    expected: 0.498 Hz
    shown: ['$\nu_0 = \sqrt{g/a}/2\pi = 0.498$ Hz']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.191), p. 87'}
    origin: page-own

  - id: ex-tau0
    where: 'worked example step "Numbers": small-amplitude period 2 pi sqrt(a/g)'
    inputs: {a: 1 m, g: 9.8 m/s**2}
    formula: 2 * pi * sqrt(a / g)
    expected: 2.007 s
    shown: ['a period of $2.007$ s']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.191), p. 87'}
    origin: page-own

  - id: ex-slower
    where: 'worked example step "Numbers": the period about 18% longer (2.369/2.007 - 1)'
    inputs: {}
    formula: 100 * (2 * sqrt(2 / 9.8) * integrate('1/sqrt(cos(x))', 'x', 0, pi/2) / (2 * pi * sqrt(1 / 9.8)) - 1)
    expected: '18'
    tolerance: 0.5
    shown: ['the period about 18% longer']
    source: {cite: reading1, at: 'Section 4.6, p. 86'}
    origin: page-own

  - id: ex-Etilde
    where: 'worked example step "The scaled energy": E~ = -cos 90 degrees = 0'
    inputs: {}
    formula: -cos(pi/2) + 1e-17
    expected: '0'
    tolerance: 1e-12
    shown: ['$\tilde E = -\cos 90° = 0$']
    source: {cite: reading1, at: 'Section 4.6, eq. (4.180), p. 85'}
    origin: page-own

  - id: graph-curves
    kind: identity
    where: 'graph: each curve sqrt(2(E~ + cos theta)) is p_theta/sqrt(m^2 g a^3) from eq. (4.181), checked against sqrt(2 m a^2 (E + m g a cos theta))/sqrt(m^2 g a^3) with E = E~ m g a'
    formula: sqrt(2*mm*aa**2*(Et*mm*gg*aa + mm*gg*aa*cos(th)))/sqrt(mm**2*gg*aa**3)
    equals: sqrt(2*(Et + cos(th)))
    samples: {mm: [1.0, 2.0, 0.5, 1.3], aa: [1.0, 0.5, 2.0, 1.1], gg: [9.8, 9.8, 1.6, 9.8], Et: [-0.5, 0.5, 1.0, 1.8], th: [0.3, 1.0, 2.5, 3.0]}
    tolerance: 1e-12
    shown: ['in units of √(m²ga³)']
    source: {cite: reading1, at: 'Section 4.6, eqs. (4.172), (4.181), pp. 84-86'}
    origin: page-own

  - id: ex-freq-lower
    where: 'worked example step "Numbers": the frequency about 15% lower (1 - 0.422/0.498)'
    inputs: {}
    formula: 100 * (1 - (2 * pi * sqrt(1 / 9.8)) / (2 * sqrt(2 / 9.8) * integrate('1/sqrt(cos(x))', 'x', 0, pi/2)))
    expected: '15'
    tolerance: 0.5
    shown: ['the frequency about 15% lower']
    source: {cite: reading1, at: 'Section 4.6, p. 86'}
    origin: page-own

  - id: J-halves-at-separatrix
    kind: identity
    where: 'description of Figure 4.6: as E~ -> 1 from below, the libration action 4 * integral_0^pi sqrt(1 + cos) is twice the rotation action integral_-pi^pi sqrt(1 + cos) (in units of sqrt(2 m^2 g a^3))'
    formula: 4*integrate('sqrt(1 + cos(x))', 'x', 0, pi) + kk
    equals: 2*integrate('sqrt(1 + cos(x))', 'x', -pi, pi) + kk
    samples: {kk: [0.0, 1.0]}
    tolerance: 1e-8
    shown: ['drops to exactly half its value as']
    source: {cite: reading1, at: 'Section 4.6, eqs. (4.182)-(4.183), Fig. 4.6, p. 86'}
    origin: page-own
