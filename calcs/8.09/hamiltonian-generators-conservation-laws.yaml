# Calculations on content/year-4/8.09/hamiltonian-generators-conservation-laws.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 4, Section 4.3, pp. 69-72.
# Page's own worked example: one particle at r = (1, 2, 0) m with p = (0, 1, 3) kg m/s; {Lx, Ly} = Lz;
# a rotation by 0.01 rad generated by Lz. Page's own graph: oscillator, m = 1 kg, w = 2 /s, q0 = 1 m, p0 = 0,
# points at t = 0, 0.2, 0.4, 0.6 s (the graph points use offCurve because the checker samples the
# parametric curve coarsely; their values are recomputed here).

page: content/year-4/8.09/hamiltonian-generators-conservation-laws.mdx
calcs:
  - id: lx-ly-bracket
    kind: identity
    where: 'worked example step "The bracket": {Lx, Ly} = sum over x, y, z of dLx/dq dLy/dp - dLy/dq dLx/dp equals Lz (the partial derivatives written out)'
    formula: (0*(-zz) - (-pz)*0) + (pz*0 - 0*(-zz)) + ((-py)*(-xx) - px*yy)
    equals: xx*py - yy*px
    samples: {xx: [1, 0.3, -1.7], yy: [2, 2.2, 0.4], zz: [0, -0.8, 1.9], px: [0, 1.1, -0.6], py: [1, -2.5, 3.3], pz: [3, 0.7, 0.2]}
    tolerance: 1e-12
    shown: ['(-p_y)(-x) - (p_x)(y) = xp_y - yp_x = L_z$']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.87), p. 70'}
    origin: page-own

  - id: lx-value
    where: 'worked example step "Numbers": Lx = y pz - z py'
    inputs: {}
    formula: 2*3 - 0*1
    expected: '6'
    shown: ['$L_x = 2 \times 3 - 0 \times 1 = 6$']
    source: {cite: reading1, at: 'Section 4.3, p. 70'}
    origin: page-own

  - id: ly-value
    where: 'worked example step "Numbers": Ly = z px - x pz'
    inputs: {}
    formula: 0*0 - 1*3
    expected: '-3'
    shown: ['$L_y = 0 \times 0 - 1 \times 3 = -3$']
    source: {cite: reading1, at: 'Section 4.3, p. 70'}
    origin: page-own

  - id: lz-value
    where: 'worked example step "Numbers": Lz = x py - y px'
    inputs: {}
    formula: 1*1 - 2*0
    expected: '1'
    shown: ['$L_z = 1 \times 1 - 2 \times 0 = 1$']
    source: {cite: reading1, at: 'Section 4.3, p. 70'}
    origin: page-own

  - id: rot-dx
    where: 'rotation example and quiz 3: dx = -y dtheta, size 0.02 m (sign negative; the quiz check compares magnitudes)'
    inputs: {}
    formula: 2 * 0.01
    expected: '0.02'
    quiz: 2
    shown: ['$\delta x = -0.02$ m, $\delta y = 0.01$ m', '-y\\,\\delta\\theta = -2 \\times 0.01 = -0.02$ m']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.94), p. 71'}
    origin: page-own

  - id: rot-dy
    where: 'rotation example and quiz 3 explanation: dy = x dtheta'
    inputs: {x: 1 m}
    formula: x * 0.01
    expected: 0.01 m
    shown: ['The $y$ coordinate moves by $x\\,\\delta\\theta = 0.01$ m']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.94), p. 71'}
    origin: page-own

  - id: rot-dpx
    where: 'rotation example: dpx = -py dtheta'
    inputs: {py: 1 kg*m/s}
    formula: -py * 0.01
    expected: -0.01 kg*m/s
    shown: ['$\delta p_x = -0.01$ kg m/s']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.95), p. 71'}
    origin: page-own

  - id: rot-preserves-length
    kind: identity
    where: '"Infinitesimal canonical transformations": the change generated by Lz preserves x^2 + y^2 to first order (2x dx + 2y dy = 0)'
    formula: 2*xx*(-yy) + 2*yy*xx
    equals: 0
    samples: {xx: [1, 0.3, -1.7], yy: [2, 2.2, 0.4]}
    tolerance: 1e-12
    shown: ['Positions and momenta both turn by the small angle $\delta\theta$ about the $z$ axis']
    source: {cite: reading1, at: 'Section 4.3, eqs. (4.94)-(4.95), p. 71'}
    origin: page-own

  - id: lz-central-conserved
    kind: identity
    where: '"Symmetries and conservation laws": {Lz, H} = 0 for H = p^2/2m + V(|r|), with V = k|r| as a sample potential (bracket written out, k = 0.7)'
    formula: (py*(px/mm) + (-px)*(py/mm)) - ((0.7*xx/sqrt(xx**2+yy**2+zz**2))*(-yy) + (0.7*yy/sqrt(xx**2+yy**2+zz**2))*xx)
    equals: 0
    samples: {xx: [1, 0.3, -1.7], yy: [2, 2.2, 0.4], zz: [0.5, -0.8, 1.9], px: [0.2, 1.1, -0.6], py: [1, -2.5, 3.3], mm: [1.0, 2.0, 0.5]}
    tolerance: 1e-12
    shown: ['so $\{L_z, H\} = 0$ and $L_z$ is conserved']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.100), p. 72'}
    origin: page-own

  - id: graph-point-1
    where: 'graph: a marked point of q = cos 2t, p = -2 sin 2t at 2t = 0.4'
    inputs: {}
    formula: cos(0.4)
    expected: '0.921'
    shown: ['x: 0.921, ']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.97), p. 72'}
    origin: page-own

  - id: graph-point-2
    where: 'graph: a marked point of q = cos 2t, p = -2 sin 2t at 2t = 0.8'
    inputs: {}
    formula: cos(0.8)
    expected: '0.697'
    shown: ['x: 0.697, ']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.97), p. 72'}
    origin: page-own

  - id: graph-point-3
    where: 'graph: a marked point of q = cos 2t, p = -2 sin 2t at 2t = 1.2'
    inputs: {}
    formula: cos(1.2)
    expected: '0.362'
    shown: ['x: 0.362, ']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.97), p. 72'}
    origin: page-own

  - id: graph-point-4
    where: 'graph: a marked point of q = cos 2t, p = -2 sin 2t at 2t = 0.4'
    inputs: {}
    formula: -2*sin(0.4)
    expected: '-0.779'
    shown: ['y: -0.779, ']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.97), p. 72'}
    origin: page-own

  - id: graph-point-5
    where: 'graph: a marked point of q = cos 2t, p = -2 sin 2t at 2t = 0.8'
    inputs: {}
    formula: -2*sin(0.8)
    expected: '-1.435'
    shown: ['y: -1.435, ']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.97), p. 72'}
    origin: page-own

  - id: graph-point-6
    where: 'graph: a marked point of q = cos 2t, p = -2 sin 2t at 2t = 1.2'
    inputs: {}
    formula: -2*sin(1.2)
    expected: '-1.864'
    shown: ['y: -1.864, ']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.97), p. 72'}
    origin: page-own

  - id: graph-orbit
    kind: identity
    where: 'graph caption: q = cos 2t, p = -2 sin 2t solves Hamilton''s equations for m = 1 kg, w = 2 /s (dq/dt = p/m, dp/dt = -m w^2 q)'
    formula: deriv('cos(2*x)', 'x', tt, 1) + 10*deriv('-2*sin(2*x)', 'x', tt, 1)
    equals: -2*sin(2*tt) + 10*(-4*cos(2*tt))
    samples: {tt: [0.0, 0.2, 0.6, 1.3]}
    tolerance: 1e-8
    shown: ['the orbit q = cos 2t, p = −2 sin 2t']
    source: {cite: reading1, at: 'Section 4.3, eq. (4.78), p. 69'}
    origin: page-own
