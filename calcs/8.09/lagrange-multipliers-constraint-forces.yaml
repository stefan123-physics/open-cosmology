# Calculations on content/year-4/8.09/lagrange-multipliers-constraint-forces.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 1, Section 1.5 (Lagrange multipliers), pp. 23-28.
# Page's own worked example (and quiz 3): a 0.20 kg pendulum bob released from rest with the rod horizontal.

page: content/year-4/8.09/lagrange-multipliers-constraint-forces.mdx
calcs:
  # ---------------------------------------------------------------- mass on a sphere (pp. 25-26)
  - id: sphere-lambda
    kind: identity
    where: 'formula "Force of the sphere on the mass" (eq. 1.94): -m a thdot^2 + m g cos th with a thdot^2 = 2 g (1 - cos th) equals m g (3 cos th - 2); also the plot curve'
    formula: -m*2*g0*(1 - cos(th)) + m*g0*cos(th)
    equals: m*g0*(3*cos(th) - 2)
    samples: {m: [1.0, 0.2, 3.0], g0: [9.81, 9.81, 9.81], th: [0.2, 0.8, 1.3]}
    tolerance: 1e-12
    shown: ['\lambda = mg\left(3\cos\theta - 2\right)', '3*cos(x*pi/180) - 2']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.94), p. 25'}
    origin: mit

  - id: sphere-leaving-angle
    where: 'text after eq. (1.94), quiz 1 and plot point: arccos(2/3) in degrees'
    inputs: {}
    formula: acos(2/3)*180/pi
    expected: '48.19'
    shown: ['{ x: 48.19, y: 0, label: "leaves at 48.2°" }', '$\\theta = 48.2^\\circ$', '$\theta \approx 48^\circ$']
    source: {cite: reading1, at: 'Section 1.5, p. 26'}
    origin: mit

  - id: sphere-x1
    where: 'text "After leaving": x1 = a sin(arccos(2/3)) = sqrt(5) a/3'
    inputs: {}
    formula: sin(acos(2/3))
    expected: '0.745356'
    tolerance: 1e-6
    shown: ['$x_1 = \sqrt5\,a/3$']
    source: {cite: reading1, at: 'Section 1.5, p. 26'}
    origin: mit

  - id: sphere-thetadot1
    where: 'text "After leaving": thdot1^2 = (2g/a)(1 - 2/3) = 2g/(3a), in units of g/a'
    inputs: {}
    formula: 2*(1 - 2/3)
    expected: 2/3
    tolerance: 1e-12
    shown: ['$\dot\theta_1^2 = 2g/(3a)$']
    source: {cite: reading1, at: 'Section 1.5, p. 26'}
    origin: mit

  - id: sphere-half-angle
    kind: identity
    where: 'formula "Angular speed on the sphere" (eq. 1.98): 1 - cos th = 2 sin^2(th/2)'
    formula: 2*(1 - cos(th))
    equals: 4*sin(th/2)**2
    samples: {th: [0.2, 0.8, 1.3]}
    tolerance: 1e-12
    shown: ['= \frac{4g}{a}\sin^2\left(\frac{\theta}{2}\right)']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.98), p. 26'}
    origin: mit

  - id: constraint-rescaled
    where: 'text and quiz 4: with f'' = r^2 - a^2, df''/dr = 2a at r = a, so lambda = 2 a lambda'' (a = 1.7, lambda'' = 0.3)'
    inputs: {}
    formula: deriv('x**2 - 1.7**2', 'x', 1.7, 1) * 0.3
    expected: 2*1.7*0.3
    tolerance: 1e-6
    shown: ['so $2a\lambda'' = \lambda$']
    source: {cite: reading1, at: 'Section 1.5, p. 26'}
    origin: mit

  # ---------------------------------------------------------------- hoop (pp. 26-27)
  - id: hoop-acceleration
    kind: identity
    where: 'formula "Friction on the rolling hoop" (eq. 1.101): m xdd - m g sin(phi) = -lambda with m xdd = lambda gives xdd = g sin(phi)/2; checked as 2 m xdd = m g sin(phi) for xdd = g sin(phi)/2'
    formula: 2*m*(g0/2*sin(ph))
    equals: m*g0*sin(ph)
    samples: {m: [1.0, 0.2, 3.0], g0: [9.81, 9.81, 9.81], ph: [0.2, 0.5, 1.0]}
    tolerance: 1e-12
    shown: ['\ddot x = \frac g2\sin\phi, \qquad \lambda = \frac12 mg\sin\phi', 'The notes write $+\lambda$ in the first equation']
    source: {cite: reading1, at: 'Section 1.5, eqs. (1.100)-(1.101), p. 27'}
    origin: slip

  # ---------------------------------------------------------------- wedge (pp. 27-28)
  - id: wedge-lambda-forms
    kind: identity
    where: 'formula "The multiplier" (eq. 1.103): g/(1/(m1 cos^2) + tan^2/m2) = m1 m2 g cos^2/(m2 + m1 sin^2)'
    formula: g0/(1/(m1*cos(al)**2) + tan(al)**2/m2)
    equals: m1*m2*g0*cos(al)**2/(m2 + m1*sin(al)**2)
    samples: {m1: [1.0, 0.2, 3.0], m2: [2.0, 5.0, 0.7], g0: [9.81, 9.81, 9.81], al: [0.2, 0.5, 1.0]}
    tolerance: 1e-12
    shown: ['\lambda_1 = \frac{m_1 m_2 g\cos^2\alpha}{m_2 + m_1\sin^2\alpha}']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.103), p. 28'}
    origin: mit

  - id: wedge-constraint-satisfied
    kind: identity
    where: 'formula "Accelerations" (eq. 1.104): with lambda1 from eq. (1.103), y1dd = (x1dd - x2dd) tan(alpha)'
    formula: (m1*m2*g0*cos(al)**2/(m2 + m1*sin(al)**2))/m1 - g0
    equals: (-tan(al)/m1 - tan(al)/m2)*(m1*m2*g0*cos(al)**2/(m2 + m1*sin(al)**2))*tan(al)
    samples: {m1: [1.0, 0.2, 3.0], m2: [2.0, 5.0, 0.7], g0: [9.81, 9.81, 9.81], al: [0.2, 0.5, 1.0]}
    tolerance: 1e-12
    shown: ['\ddot x_2 = \frac{\tan\alpha}{m_2}\lambda_1, \qquad \ddot x_1 = -\frac{\tan\alpha}{m_1}\lambda_1, \qquad \ddot y_1 = \frac{\lambda_1}{m_1} - g']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.104), p. 28'}
    origin: mit

  - id: wedge-fixed-limit
    kind: limit
    where: 'text "Two checks": as m2 grows, x1dd = -tan(alpha) lambda1/m1 tends to -g sin(alpha) cos(alpha) (m1 = 1, alpha = 0.5)'
    inputs: {}
    formula: -tan(0.5)*(1*M2*9.81*cos(0.5)**2/(M2 + sin(0.5)**2))
    limit: -9.81*sin(0.5)*cos(0.5)
    vary: {M2: [10, 1000, 100000, 10000000]}
    tolerance: 1e-5
    shown: ['$\ddot x_1 = -g\sin\alpha\cos\alpha$']
    source: {cite: reading1, at: 'Section 1.5, p. 28'}
    origin: mit

  # ---------------------------------------------------------------- worked example: pendulum rod
  - id: rod-tension-identity
    kind: identity
    where: 'worked example step "The speed": with m l thdot^2 = 2 m g cos th, |lambda| = m l thdot^2 + m g cos th = 3 m g cos th'
    formula: 2*m*g0*cos(th) + m*g0*cos(th)
    equals: 3*m*g0*cos(th)
    samples: {m: [1.0, 0.2, 3.0], g0: [9.81, 9.81, 9.81], th: [0.0, 0.8, 1.3]}
    tolerance: 1e-12
    shown: ['$|\lambda| = 3mg\cos\theta$, whatever the length of the rod']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.89), p. 24'}
    origin: page-own

  - id: rod-tension-bottom
    where: 'worked example step "At the bottom" and quiz 3: 3 m g'
    inputs: {m: 0.20 kg, g0: 9.81 m/s**2}
    formula: 3*m*g0
    expected: 5.89 N
    shown: ['3 \times 0.20 \times 9.81 = 5.89$ N', '3 \\times 0.20 \\times 9.81 = 5.89$ N']
    quiz: 2
    source: {cite: reading1, at: 'Section 1.5, eq. (1.89), p. 24'}
    origin: page-own

  - id: bob-weight
    where: 'worked example step "At the bottom": the weight m g'
    inputs: {m: 0.20 kg, g0: 9.81 m/s**2}
    formula: m*g0
    expected: 1.96 N
    shown: ['weight of $1.96$ N']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.89), p. 24'}
    origin: page-own
