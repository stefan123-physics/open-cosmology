# Calculations on content/year-4/8.09/continuity-equation-vorticity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014) Lecture Notes, Chapter 6 (Stewart, typed), Section 6.2.1, pp. 109-112, eqs. (6.20)-(6.29).
# The notes quote no numbers in this part. Page's own examples: a gas expanding with v = alpha r, alpha = 0.2 /s, for 2 s;
# water turning rigidly at 3 rad/s, circle of radius 0.1 m.

page: content/year-4/8.09/continuity-equation-vorticity.mdx
calcs:
  # ---------------------------------------------------------------- derivations
  - id: continuity-expanded
    kind: identity
    where: 'eqs. (6.26)-(6.27) in 1D: d(rho v)/dx = v drho/dx + rho dv/dx, for rho = 2 + sin x, v = x^2 (checked at sample points)'
    formula: deriv('(2 + sin(x))*x**2', 'x', XX)
    equals: XX**2*cos(XX) + (2 + sin(XX))*2*XX
    samples: {XX: [0.3, 1.2, -0.7]}
    tolerance: 1e-6
    shown: ['\frac{\partial\rho}{\partial t} + \nabla\cdot\left(\rho\vec v\right) = 0']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.27), p. 110'}
    origin: mit

  - id: rotating-curl
    kind: identity
    where: 'p. 112: the z component of curl(omega x r) for omega along z is 2 omega: d(omega x)/dx - d(-omega y)/dy'
    formula: deriv('WW*x', 'x', XX) - deriv('-WW*y', 'y', YY)
    equals: 2*WW
    samples: {WW: [3.0, 0.7], XX: [0.2, 1.0], YY: [0.5, -0.4]}
    tolerance: 1e-6
    shown: ['= \nabla\times\vec v'' + 2\vec\omega" cite=']
    source: {cite: reading1, at: 'Section 6.2.1, unnumbered, p. 112'}
    origin: mit

  # ---------------------------------------------------------------- expanding gas
  - id: divergence-expanding
    kind: value
    where: 'worked example and quiz 3: div v = 3 alpha with alpha = 0.2 /s (1/s)'
    formula: 3*0.2
    expected: '0.6'
    shown: ['= 3\alpha = 0.6$ s⁻¹, the same everywhere', '$\\nabla\\cdot\\vec v = 3\\alpha = 0.6$ s⁻¹ everywhere']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.22), p. 110'}
    origin: page-own

  - id: density-after-2s
    kind: value
    where: 'worked example, quiz 3 and plot point: rho/rho0 = exp(-3 x 0.2 x 2)'
    formula: exp(-3*0.2*2)
    expected: '0.30'
    shown: ['$\rho/\rho_0 = e^{-1.2} \approx 0.30$', 'computed from the continuity equation. The marked point is the worked example''s value 0.30']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.25), p. 110'}
    origin: page-own

  - id: quiz-density-choice
    kind: value
    where: 'quiz 3: the marked choice'
    formula: exp(-1.2)
    expected: '0.30'
    shown: ['"To about 0.30 of the start"']
    quiz: 2
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.25), p. 110'}
    origin: page-own

  - id: quiz-wrong-choice
    kind: value
    where: 'quiz 3 explanation: the distractor 0.67 is exp(-alpha t) = exp(-0.4)'
    formula: exp(-0.4)
    expected: '0.67'
    shown: ['(0.67 would be $e^{-\\alpha t}$']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.25), p. 110'}
    origin: page-own

  - id: plot-point
    kind: value
    where: 'plot: the marked point at t = 2 s'
    formula: exp(-1.2)
    expected: '0.3012'
    shown: ['{ x: 2, y: 0.3012, label: "t = 2 s" }']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.25), p. 110'}
    origin: page-own

  # ---------------------------------------------------------------- rotating tank
  - id: vorticity-rigid
    kind: value
    where: 'worked example and quiz 4: Omega = 2 omega for omega = 3 rad/s (1/s)'
    formula: 2*3
    expected: '6'
    shown: ['$\\vec\\Omega = 6$ rad/s along $\\hat z$', '$\vec\Omega = 2\vec\omega$: 6 rad/s']
    source: {cite: reading1, at: 'Section 6.2.1, unnumbered, p. 112'}
    origin: page-own

  - id: circle-speed
    kind: value
    where: 'worked example: speed omega r = 3 x 0.1 (m/s)'
    formula: 3*0.1
    expected: '0.3'
    shown: ['the speed is $\omega r = 0.3$ m/s']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.29), p. 111'}
    origin: page-own

  - id: circulation
    kind: value
    where: 'worked example: circulation 2 pi r v = 2 pi x 0.1 x 0.3 (m^2/s)'
    formula: 2*pi*0.1*0.3
    expected: '0.188'
    shown: ['$2\pi r \times 0.3 = 2\pi \times 0.1 \times 0.3 \approx 0.188$ m²/s']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.29), p. 111'}
    origin: page-own

  - id: vorticity-flux
    kind: value
    where: 'worked example: Omega pi r^2 = 6 x pi x 0.01 (m^2/s)'
    formula: 6*pi*0.1**2
    expected: '0.188'
    shown: ['$\Omega\,\pi r^2 = 6 \times \pi \times 0.01 \approx 0.188$ m²/s']
    source: {cite: reading1, at: 'Section 6.2.1, eq. (6.29), p. 111'}
    origin: page-own
