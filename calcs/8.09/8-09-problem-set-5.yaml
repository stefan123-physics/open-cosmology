# Calculations on content/year-4/8.09/8-09-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# integrals of the momentum for the generating functions (Problems 1 and 5), roots of the conditions (Problems 1(c),
# 2(b), 5), Poisson brackets from numerical partial derivatives (Problems 1, 3, 4, 5), the amplitude-phase form of the
# oscillator (Problem 2), the vectors themselves at a point of a bound orbit (Problem 4(c)), the time integral
# t₀ − t = ∫dx/ẋ up to the turning point (Problem 5(c)) and elementary kinematics (Problem 6).
# Short names in the samples: z (and w) the variable of a numerical derivative, integral or root; x1, x2, x3, p1, p2,
# p3 the components of position and momentum; in Problem 4(b) and 4(c) x, y, px, py a point of a planar orbit;
# ax for α_x.

page: content/year-4/8.09/8-09-problem-set-5.mdx
calcs:
  # ---- Problem 1

  - id: p1a-f3
    kind: identity
    answer: p1a-f3
    where: 'Problem 1(a), answer box: F₃ = −pQ against F₃ = −∫₀ᵖ q dp′ with q = Q (the rule q = −∂F₃/∂p for the identity)'
    formula: -p*Q
    equals: -integrate('Q', 'z', 0, p)
    samples: &pq
      p: [0.6, 1.3, 1.9]
      Q: [0.7, 1.1, 1.8]
    tolerance: 1e-9
    shown: ['id="p1a-f3"']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1a-f3-P
    kind: identity
    where: 'Problem 1(a), check: P = −∂F₃/∂Q equals p'
    formula: p
    equals: -deriv('-p*z', 'z', Q)
    samples: *pq
    tolerance: 1e-6
    shown: ['$P_i = -\partial F_3/\partial Q_i = p_i$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1b-f1
    kind: identity
    answer: p1b-f1
    where: 'Problem 1(b), answer box: F₁ = qQt against ∫₀^q p dq′ with p = Qt (from Q = p/t)'
    formula: q*Q*t
    equals: integrate('Q*t', 'z', 0, q)
    samples: &qqt
      q: [0.6, 1.3, 1.9]
      Q: [0.7, 1.1, 1.8]
      t: [0.5, 1.4, 2.0]
    tolerance: 1e-9
    shown: ['id="p1b-f1"']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-P
    kind: identity
    where: 'Problem 1(b), check: P = −∂F₁/∂Q equals −qt'
    formula: -q*t
    equals: -deriv('q*z*t', 'z', Q)
    samples: *qqt
    tolerance: 1e-6
    shown: ['$P = -\partial F_1/\partial Q = -qt - \partial g/\partial Q$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-bracket
    kind: identity
    where: 'Problem 1(b), check: {Q, P} = 1 for Q = p/t, P = −qt, by numerical derivatives'
    formula: 1
    equals: deriv('p0/t', 'z', q)*deriv('-q*t', 'z', p0) - deriv('z/t', 'z', p0)*deriv('-z*t', 'z', q)
    samples:
      q: [0.6, 1.3, 1.9]
      p0: [0.4, 1.0, 2.2]
      t: [0.5, 1.4, 2.0]
    tolerance: 1e-6
    shown: ['$\{Q, P\} = \frac{\partial Q}{\partial q}\frac{\partial P}{\partial p} - \frac{\partial Q}{\partial p}\frac{\partial P}{\partial q} = 0 - \frac{1}{t}(-t) = 1$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1c-l
    kind: identity
    answer: p1c-l
    where: 'Problem 1(c), answer box: ℓ = k − 1 against the root of k(1 − ℓ) − ℓ(1 − k) = 1 (the coefficient condition with m = 1 − k, n = 1 − ℓ)'
    formula: k-1
    equals: solve('k*(1 - z) - z*(1 - k) - 1', 'z', -10, 10)
    samples: &kk
      k: [2.0, 2.7, 3.5, 4.0]
    tolerance: 1e-9
    shown: ['id="p1c-l"', '\ell = k - 1']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-m
    kind: identity
    answer: p1c-m
    where: 'Problem 1(c), answer box: m = 1 − k against the root of k + m − 1 = 0 (no net power of q in the bracket)'
    formula: 1-k
    equals: solve('k + z - 1', 'z', -10, 10)
    samples: *kk
    tolerance: 1e-9
    shown: ['id="p1c-m"', 'm = 1 - k']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-n
    kind: identity
    answer: p1c-n
    where: 'Problem 1(c), answer box: n = 2 − k against the root of ℓ + n − 1 = 0 with ℓ = k − 1 (no net power of p)'
    formula: 2-k
    equals: solve('(k - 1) + z - 1', 'z', -10, 10)
    samples: *kk
    tolerance: 1e-9
    shown: ['id="p1c-n"', 'n = 2 - k']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-bracket
    kind: identity
    where: 'Problem 1(c), check: with ℓ = k − 1, m = 1 − k, n = 2 − k the bracket {Q, P} of Q = qᵏpˡ, P = qᵐpⁿ is 1 at any point (numerical derivatives)'
    formula: 1
    equals: deriv('z**k*p0**(k - 1)', 'z', q0)*deriv('q0**(1 - k)*z**(2 - k)', 'z', p0) - deriv('q0**k*z**(k - 1)', 'z', p0)*deriv('z**(1 - k)*p0**(2 - k)', 'z', q0)
    samples:
      k: [2.0, 2.7, 3.5, -0.5]
      q0: [0.7, 1.3, 1.6, 0.9]
      p0: [1.2, 0.8, 1.5, 0.6]
    tolerance: 1e-6
    shown: ['(kn - \ell m)\,q^{k+m-1}\,p^{\ell+n-1}']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-k3
    kind: identity
    answer: p1c-k3
    where: 'Problem 1(c), answer box: F₁ = −2√(Q/q) for k = 3 against F₁(1) + ∫₁^q p dq′, with p = √(Q/q′³) from Q = q³p² and the value −2√Q at q = 1 of the general form (1 − k)(Q/q)^(1/(k−1))'
    formula: -2*sqrt(Q/q)
    equals: (1 - 3)*Q**(1/(3 - 1)) + integrate('sqrt(Q/z**3)', 'z', 1, q)
    samples: &qQ
      q: [0.6, 1.3, 1.9]
      Q: [0.7, 1.1, 1.8]
    tolerance: 1e-8
    shown: ['id="p1c-k3"']
    source: {cite: mit, at: 'Problem 1(c) (our own example)'}
    origin: page-own

  - id: p1c-k3-P
    kind: identity
    where: 'Problem 1(c), check: for k = 3, −∂F₁/∂Q equals P = q⁻²p⁻¹ with p = √(Q/q³)'
    formula: 1/(q**2*sqrt(Q/q**3))
    equals: -deriv('-2*sqrt(z/q)', 'z', Q)
    samples: *qQ
    tolerance: 1e-6
    shown: ['$P = -\partial F_1/\partial Q = 1/\sqrt{Qq} = 1/(q^2 p)$']
    source: {cite: mit, at: 'Problem 1(c) (our own example)'}
    origin: page-own

  - id: p1d-f2
    kind: identity
    answer: p1d-f2
    where: 'Problem 1(d), answer box (one dimension): F₂ = xP − qf against ∫₀ˣ p dx′ with p = P − q ∂f/∂x, for the gauge function f(x′) = (f/x) x′, linear in x′, which takes the value f at x'
    formula: x*P - q*f
    equals: integrate('P - q*f/x', 'z', 0, x)
    samples:
      x: [0.6, 1.3, 1.9]
      P: [0.7, 1.1, 1.8]
      q: [0.5, 1.2, 2.0]
      f: [0.9, 0.6, 1.7]
    tolerance: 1e-9
    shown: ['id="p1d-f2"']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  - id: p1d-p
    kind: identity
    where: 'Problem 1(d), check: p = ∂F₂/∂x = P − q ∂f/∂x for the gauge function f = t sin x (numerical derivative)'
    formula: P - q*t*cos(x)
    equals: deriv('z*P - q*t*sin(z)', 'z', x)
    samples:
      x: [0.6, 1.3, 1.9]
      P: [0.7, 1.1, 1.8]
      q: [0.5, 1.2, 2.0]
      t: [0.3, 1.0, 2.5]
    tolerance: 1e-6
    shown: ['$p_i = \partial F_2/\partial x_i = P_i - q\,\partial f/\partial x_i$']
    source: {cite: mit, at: 'Problem 1(d) (our own solution)'}
    origin: page-own

  # ---- Problem 2(b): a = mω cancels the Q² terms; the motion against the amplitude-phase form q = √(2E/mω²) sin(ωt + φ) (notes eq. (4.42)), with E from q₀, p₀ and tan φ = mωq₀/p₀

  - id: p2b-a
    kind: identity
    answer: p2b-a
    where: 'Problem 2(b), answer box: a = mω against the positive root of 1/(8m) − mω²/(8a²) = 0, the coefficient of Q² in K'
    formula: m*omega
    equals: solve('1/(8*m) - m*omega**2/(8*z**2)', 'z', 0.01, 100)
    samples:
      m: [1.5, 2.2, 3.0]
      omega: [1.0, 1.6, 2.0]
    tolerance: 1e-9
    shown: ['id="p2b-a"', 'a = m\omega, \qquad K = i\omega\,QP']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-q
    kind: identity
    answer: p2b-q
    where: 'Problem 2(b), answer box: q(t) against √(2E/mω²) sin(ωt + φ) with E = p₀²/2m + mω²q₀²/2 and φ = atan(mωq₀/p₀) (p₀ > 0)'
    formula: q0*cos(omega*t) + p0/(m*omega)*sin(omega*t)
    equals: sqrt(2*(p0**2/(2*m) + m*omega**2*q0**2/2)/(m*omega**2))*sin(omega*t + atan(m*omega*q0/p0))
    samples: &osc
      q0: [0.5, 1.3, 2.0, 0.8]
      p0: [0.6, 1.7, 0.9, 2.0]
      m: [1.5, 2.4, 3.0, 1.8]
      omega: [1.0, 1.5, 2.0, 1.2]
      t: [0.1, 0.45, 0.8, 1.0]
    tolerance: 1e-9
    shown: ['id="p2b-q"', 'q_0\cos\omega t + \frac{p_0}{m\omega}\sin\omega t']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-p
    kind: identity
    answer: p2b-p
    where: 'Problem 2(b), answer box: p(t) against √(2mE) cos(ωt + φ), same E and φ'
    formula: p0*cos(omega*t) - m*omega*q0*sin(omega*t)
    equals: sqrt(2*m*(p0**2/(2*m) + m*omega**2*q0**2/2))*cos(omega*t + atan(m*omega*q0/p0))
    samples: *osc
    tolerance: 1e-9
    shown: ['id="p2b-p"', 'p_0\cos\omega t - m\omega q_0\sin\omega t']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2b-energy
    kind: identity
    where: 'Problem 2(b), check: iωQ₀P₀ = ω(p₀² + m²ω²q₀²)/(2mω), the energy, written with real numbers: iω(p₀ + imωq₀)(p₀ − imωq₀)/(2imω) = (p₀² + m²ω²q₀²)/(2m)'
    formula: (p0**2 + m**2*omega**2*q0**2)/(2*m)
    equals: p0**2/(2*m) + m*omega**2*q0**2/2
    samples: *osc
    tolerance: 1e-12
    shown: ['$i\omega Q_0P_0 = \frac{1}{2m}(p_0^2 + m^2\omega^2q_0^2)$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  # ---- Problem 3: brackets with H = q₁p₁ − q₂p₂ + aq₁² + bq₂², by numerical partial derivatives

  - id: p3-bracket
    kind: identity
    answer: p3-bracket
    where: 'Problem 3, answer box: {p₁ + aq₁, H} = −(p₁ + aq₁) against −∂H/∂q₁ + a ∂H/∂p₁'
    formula: -(p1 + a*q1)
    equals: -deriv('z*p1 - q2*p2 + a*z**2 + b*q2**2', 'z', q1) + a*deriv('q1*z - q2*p2 + a*q1**2 + b*q2**2', 'z', p1)
    samples: &h3
      q1: [0.6, 1.3, 1.9]
      p1: [0.7, 1.6, 0.9]
      q2: [1.1, 0.8, 1.7]
      p2: [0.5, 1.2, 2.0]
      a: [0.5, 1.4, 2.0]
      b: [0.8, 1.9, 0.6]
    tolerance: 1e-6
    shown: ['id="p3-bracket"']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-u1
    kind: identity
    where: 'Problem 3, check: {u₁, H} = 0 for u₁ = (p₁ + aq₁)/q₂, from the four partial derivatives'
    formula: 0
    equals: deriv('(p1 + a*z)/q2', 'z', q1)*deriv('q1*z - q2*p2 + a*q1**2 + b*q2**2', 'z', p1) - deriv('(z + a*q1)/q2', 'z', p1)*deriv('z*p1 - q2*p2 + a*z**2 + b*q2**2', 'z', q1) + deriv('(p1 + a*q1)/z', 'z', q2)*deriv('q1*p1 - q2*z + a*q1**2 + b*q2**2', 'z', p2) - deriv('(p1 + a*q1)/q2', 'z', p2)*deriv('q1*p1 - z*p2 + a*q1**2 + b*z**2', 'z', q2)
    samples: *h3
    tolerance: 1e-6
    shown: ['\{u_1, H\} = \frac{\{p_1 + aq_1, H\}}{q_2}']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-u2
    kind: identity
    where: 'Problem 3, check: {u₂, H} = 0 for u₂ = q₁q₂'
    formula: 0
    equals: deriv('z*q2', 'z', q1)*deriv('q1*z - q2*p2 + a*q1**2 + b*q2**2', 'z', p1) - deriv('q1*q2', 'z', p1)*deriv('z*p1 - q2*p2 + a*z**2 + b*q2**2', 'z', q1) + deriv('q1*z', 'z', q2)*deriv('q1*p1 - q2*z + a*q1**2 + b*q2**2', 'z', p2) - deriv('q1*q2', 'z', p2)*deriv('q1*p1 - z*p2 + a*q1**2 + b*z**2', 'z', q2)
    samples: *h3
    tolerance: 1e-6
    shown: ['$\{q_1q_2, H\} = q_1\{q_2, H\} + \{q_1, H\}q_2 = -q_1q_2 + q_1q_2 = 0$']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  # ---- Problem 4: brackets of angular momentum by numerical derivatives; the Laplace-Runge-Lenz vector from cross products

  - id: p4a-x
    kind: identity
    answer: p4a-x
    where: 'Problem 4(a), answer box: {x₁, L₂} = ∂L₂/∂p₁ with L₂ = x₃p₁ − x₁p₃'
    formula: x3
    equals: deriv('x3*z - x1*p3', 'z', p1)
    samples: &xp
      x1: [0.6, 1.3, 1.9]
      x2: [0.7, -1.1, 0.4]
      x3: [1.2, 0.5, -0.8]
      p1: [0.9, -0.4, 1.5]
      p2: [-0.6, 1.2, 0.3]
      p3: [1.4, 0.7, -1.1]
    tolerance: 1e-6
    shown: ['id="p4a-x"']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4a-p
    kind: identity
    answer: p4a-p
    where: 'Problem 4(a), answer box: {p₃, L₁} = −∂L₁/∂x₃ with L₁ = x₂p₃ − x₃p₂'
    formula: p2
    equals: -deriv('x2*p3 - z*p2', 'z', x3)
    samples: *xp
    tolerance: 1e-6
    shown: ['id="p4a-p"']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4a-l
    kind: identity
    answer: p4a-l
    where: 'Problem 4(a), answer box: {L₁, L₂} = L₃ against the full bracket of L₁ = x₂p₃ − x₃p₂ and L₂ = x₃p₁ − x₁p₃ (numerical derivatives); the sample L₃ is x₁p₂ − x₂p₁ at each point'
    formula: L3
    equals: deriv('x2*p3 - x3*p2', 'z', x1)*deriv('x3*z - x1*p3', 'z', p1) - deriv('x2*p3 - x3*p2', 'z', p1)*deriv('x3*p1 - z*p3', 'z', x1) + deriv('z*p3 - x3*p2', 'z', x2)*deriv('x3*p1 - x1*p3', 'z', p2) - deriv('x2*p3 - x3*z', 'z', p2)*deriv('x3*p1 - x1*p3', 'z', x2) + deriv('x2*p3 - z*p2', 'z', x3)*deriv('x3*p1 - x1*z', 'z', p3) - deriv('x2*z - x3*p2', 'z', p3)*deriv('z*p1 - x1*p3', 'z', x3)
    samples:
      x1: [0.6, 1.3, 1.9]
      x2: [0.7, -1.1, 0.4]
      x3: [1.2, 0.5, -0.8]
      p1: [0.9, -0.4, 1.5]
      p2: [-0.6, 1.2, 0.3]
      p3: [1.4, 0.7, -1.1]
      L3: [-0.99, 1.12, -0.03]
    tolerance: 1e-6
    shown: ['id="p4a-l"']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4b-pdot
    kind: identity
    answer: p4b-pdot
    where: 'Problem 4(b), answer box: {p₁, H} = −kr₁/r³ against −∂H/∂r₁ with H′s potential −k/√(r₁² + r₂² + r₃²) (numerical derivative); the sample r is the length at each point'
    formula: -k*x1/r**3
    equals: -deriv('-k/sqrt(z**2 + x2**2 + x3**2)', 'z', x1)
    samples:
      k: [0.7, 1.5, 2.0]
      x1: [0.6, 1.3, 1.9]
      x2: [1.4, -1.1, 2.2]
      x3: [2.0, 2.6, -1.0]
      r: [2.513961018, 3.10805405358, 3.07408522979]
    tolerance: 1e-6
    shown: ['id="p4b-pdot"']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4b-conserved
    kind: identity
    where: 'Problem 4(b), check: {A_x, H} = 0 for motion in a plane, A_x = p_y L − μk x/r with L = x p_y − y p_x (numerical derivatives)'
    formula: 0
    equals: deriv('py*(z*py - y*px) - mu*k*z/sqrt(z**2 + y**2)', 'z', x)*deriv('(z**2 + py**2)/(2*mu) - k/sqrt(x**2 + y**2)', 'z', px) - deriv('py*(x*py - y*z) - mu*k*x/sqrt(x**2 + y**2)', 'z', px)*deriv('(px**2 + py**2)/(2*mu) - k/sqrt(z**2 + y**2)', 'z', x) + deriv('py*(x*py - z*px) - mu*k*x/sqrt(x**2 + z**2)', 'z', y)*deriv('(px**2 + z**2)/(2*mu) - k/sqrt(x**2 + y**2)', 'z', py) - deriv('z*(x*z - y*px) - mu*k*x/sqrt(x**2 + y**2)', 'z', py)*deriv('(px**2 + py**2)/(2*mu) - k/sqrt(x**2 + z**2)', 'z', y)
    samples:
      x: [1.0, 0.4, -1.3]
      y: [0.3, 1.1, 0.8]
      px: [0.2, -0.9, 0.5]
      py: [1.1, 0.4, -0.7]
      mu: [1.0, 0.6, 1.8]
      k: [1.0, 1.5, 0.8]
    tolerance: 1e-6
    shown: ['$\{A_i, H\}$ is the first result minus the second']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4c-mag
    kind: identity
    answer: p4c-mag
    where: 'Problem 4(c), answer box: |A| = μkε against the length of p × L − μk r/r computed from the vectors at a point of a bound orbit; the sample ε is √(1 + 2Eℓ²/μk²) from that point′s energy and angular momentum'
    formula: mu*k*eps
    equals: sqrt((py*(x*py - y*px) - mu*k*x/sqrt(x**2 + y**2))**2 + (-px*(x*py - y*px) - mu*k*y/sqrt(x**2 + y**2))**2)
    samples: &orb
      x: [1.0, 0.4, -1.3]
      y: [0.3, 1.1, 0.8]
      px: [0.2, -0.9, 0.5]
      py: [0.8, 0.4, -0.7]
      mu: [1.0, 0.6, 1.8]
      k: [1.0, 1.5, 0.8]
      eps: [0.568644574779, 0.269948773845, 0.925288299277]
    tolerance: 1e-9
    shown: ['id="p4c-mag"']
    source: {cite: mit, at: 'Problem 4(c) (our own solution)'}
    origin: page-own

  - id: p4c-relation
    kind: identity
    where: 'Problem 4(c), check: A² = μ²k² + 2μHL² at the same points, both sides from the vectors'
    formula: (py*(x*py - y*px) - mu*k*x/sqrt(x**2 + y**2))**2 + (-px*(x*py - y*px) - mu*k*y/sqrt(x**2 + y**2))**2
    equals: mu**2*k**2 + 2*mu*((px**2 + py**2)/(2*mu) - k/sqrt(x**2 + y**2))*(x*py - y*px)**2
    samples: *orb
    tolerance: 1e-9
    shown: ['\vec A^2 = \mu^2k^2 + 2\mu H\,\vec L^2']
    source: {cite: mit, at: 'Problem 4(c), p. 3'}
    origin: mit

  # ---- Problem 5: H = p² + eˣ, K = P²

  - id: p5a-p
    kind: identity
    answer: p5a-p
    where: 'Problem 5(a), answer box: p = √(P² − eˣ) against the positive root of p² + eˣ − P² = 0'
    formula: sqrt(P**2 - exp(x))
    equals: solve('z**2 + exp(x) - P**2', 'z', 0, 10)
    samples: &xP
      x: [-1.0, -0.2, 0.5, 1.0]
      P: [2.0, 2.4, 2.7, 3.0]
    tolerance: 1e-9
    shown: ['id="p5a-p"']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5a-f2
    kind: identity
    answer: p5a-f2
    where: 'Problem 5(a), answer box: F₂ against −∫ₓ^{2 ln P} √(P² − eˣ′) dx′, the integral of p from the turning point, where our choice puts F₂ = 0'
    formula: 2*sqrt(P**2 - exp(x)) - 2*P*log(P + sqrt(P**2 - exp(x))) + P*x
    equals: -integrate('sqrt(abs(P**2 - exp(z)))', 'z', x, 2*log(P))
    samples: *xP
    tolerance: 1e-7
    shown: ['id="p5a-f2"']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5a-logform
    kind: identity
    where: 'Problem 5(a), solution: the two forms of the integral agree, 2u − P ln((P + u)/(P − u)) = 2u − 2P ln(P + u) + Px with u = √(P² − eˣ)'
    formula: 2*sqrt(P**2 - exp(x)) - P*log((P + sqrt(P**2 - exp(x)))/(P - sqrt(P**2 - exp(x))))
    equals: 2*sqrt(P**2 - exp(x)) - 2*P*log(P + sqrt(P**2 - exp(x))) + P*x
    samples: *xP
    tolerance: 1e-12
    shown: ['2u - P\ln\frac{P + u}{P - u} + g(P)']
    source: {cite: mit, at: 'Problem 5(a) (our own solution)'}
    origin: page-own

  - id: p5b-p
    kind: identity
    answer: p5b-p
    where: 'Problem 5(b), answer box: P = √(p² + eˣ) against the positive root of P² − p² − eˣ = 0'
    formula: sqrt(p**2 + exp(x))
    equals: solve('z**2 - p**2 - exp(x)', 'z', 0, 100)
    samples: &xp5
      x: [-1.0, -0.2, 0.5, 1.0]
      p: [0.5, 1.1, 1.6, 2.0]
    tolerance: 1e-9
    shown: ['id="p5b-p"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5b-q
    kind: identity
    answer: p5b-q
    where: 'Problem 5(b), answer box: Q = −2 arsinh(p e^(−x/2)) against ∂F₂/∂P taken numerically at P = √(p² + eˣ)'
    formula: -2*asinh(p*exp(-x/2))
    equals: deriv('2*sqrt(z**2 - exp(x)) - 2*z*log(z + sqrt(z**2 - exp(x))) + z*x', 'z', sqrt(p**2 + exp(x)))
    samples: *xp5
    tolerance: 1e-6
    shown: ['id="p5b-q"']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5b-bracket
    kind: identity
    where: 'Problem 5(b), check: {Q, P} = 1 for Q = −2 arsinh(p e^(−x/2)), P = √(p² + eˣ) (numerical derivatives), here also for p < 0'
    formula: 1
    equals: deriv('-2*asinh(p*exp(-z/2))', 'z', x)*deriv('sqrt(z**2 + exp(x))', 'z', p) - deriv('-2*asinh(z*exp(-x/2))', 'z', p)*deriv('sqrt(p**2 + exp(z))', 'z', x)
    samples:
      x: [-1.0, -0.2, 0.5, 1.0]
      p: [0.5, -1.1, 1.6, -2.0]
    tolerance: 1e-6
    shown: ['this is $\frac{(p^2 + e^x)e^{-x/2}}{P^2e^{-x/2}} = 1$']
    source: {cite: mit, at: 'Problem 5(b) (our own solution)'}
    origin: page-own

  - id: p5c-x
    kind: identity
    answer: p5c-x
    where: 'Problem 5(c), answer box: x(t) against the root x of t₀ − t = ∫ₓ^{2 ln P} dx′/(2√(P² − eˣ′)), the time to reach the turning point at the speed ẋ = 2p, with the substitution eˣ′ = P²(1 − w²) that makes the integrand 1/(P(1 − w²))'
    formula: 2*log(P/cosh(P*(t - t0)))
    equals: solve("integrate('1/(P*(1 - w**2))', 'w', 0, sqrt(1 - exp(z)/P**2)) - (t0 - t)", 'z', -3, 2*log(P) - 1e-3)
    samples: &motion
      P: [2.0, 2.4, 2.7, 3.0]
      t: [-0.3, -0.25, -0.15, -0.1]
      t0: [0.0, 0.05, 0.1, 0.02]
    tolerance: 1e-6
    shown: ['id="p5c-x"']
    source: {cite: mit, at: 'Problem 5(c) (our own solution)'}
    origin: page-own

  - id: p5c-p
    kind: identity
    answer: p5c-p
    where: 'Problem 5(c), answer box: p(t) against √(P² − eˣ) with x the root of the same time integral'
    formula: -P*tanh(P*(t - t0))
    equals: sqrt(P**2 - exp(solve("integrate('1/(P*(1 - w**2))', 'w', 0, sqrt(1 - exp(z)/P**2)) - (t0 - t)", 'z', -3, 2*log(P) - 1e-3)))
    samples: *motion
    tolerance: 1e-5
    shown: ['id="p5c-p"']
    source: {cite: mit, at: 'Problem 5(c) (our own solution)'}
    origin: page-own

  - id: p5c-Q
    kind: identity
    where: 'Problem 5(c), check: Q(x(t), p(t)) = 2P(t − t₀)'
    formula: 2*P*(t - t0)
    equals: -2*asinh(-P*tanh(P*(t - t0))*exp(-log(P/cosh(P*(t - t0)))))
    samples: *motion
    tolerance: 1e-9
    shown: ['$Q = 2P(t - t_0)$']
    source: {cite: mit, at: 'Problem 5(c) (our own solution)'}
    origin: page-own

  - id: p5c-xdot
    kind: identity
    where: 'Problem 5(c), check: ẋ = 2p along the motion (numerical derivative)'
    formula: 2*(-P*tanh(P*(t - t0)))
    equals: deriv('2*log(P/cosh(P*(z - t0)))', 'z', t)
    samples: *motion
    tolerance: 1e-6
    shown: ['\dot x = -2P\tanh\left(P(t - t_0)\right) = 2p']
    source: {cite: mit, at: 'Problem 5(c) (our own solution)'}
    origin: page-own

  # ---- Problem 6: H = (p_x² + p_y²)/2m + mgy, launch at the origin with speed v₀ at angle θ

  - id: p6a-alpha
    kind: identity
    answer: p6a-alpha
    where: 'Problem 6(a), answer box: α_x = mv₀ cos θ against the horizontal launch momentum m√(v₀² − (v₀ sin θ)²)'
    formula: m*v0*cos(theta)
    equals: m*sqrt(v0**2 - (v0*sin(theta))**2)
    samples:
      m: [0.5, 1.2, 2.0]
      v0: [2.0, 3.5, 5.0]
      theta: [0.2, 0.45, 0.7]
    tolerance: 1e-12
    shown: ['id="p6a-alpha"']
    source: {cite: mit, at: 'Problem 6(a) (our own solution)'}
    origin: page-own

  - id: p6a-dsdy
    kind: identity
    where: 'Problem 6(a), check: ∂S/∂y of the principal function (numerical derivative) equals √(2mE − α_x² − 2m²gy)'
    formula: sqrt(2*m*E - ax**2 - 2*m**2*g*y)
    equals: deriv('ax*x - (2*m*E - ax**2 - 2*m**2*g*z)**1.5/(3*m**2*g) - E*t', 'z', y)
    samples:
      m: [0.5, 1.2, 2.0]
      E: [5.0, 8.0, 12.0]
      ax: [1.0, 2.0, 3.0]
      g: [9.81, 9.81, 9.0]
      y: [0.1, 0.2, 0.3]
      x: [0.5, 1.0, 1.5]
      t: [0.1, 0.2, 0.3]
    tolerance: 1e-6
    shown: ['$\partial S/\partial y = \sqrt{2mE - \alpha_x^2 - 2m^2gy}$']
    source: {cite: mit, at: 'Problem 6(a) (our own solution)'}
    origin: page-own

  - id: p6b-path
    kind: identity
    answer: p6b-path
    where: 'Problem 6(b), answer box: y(x) against the elementary route, t = x/(v₀ cos θ) put into v₀ sin θ t − gt²/2'
    formula: x*tan(theta) - g*x**2/(2*v0**2*cos(theta)**2)
    equals: v0*sin(theta)*(x/(v0*cos(theta))) - g/2*(x/(v0*cos(theta)))**2
    samples: &path
      x: [0.5, 1.2, 2.0]
      g: [9.0, 9.81, 10.0]
      v0: [4.0, 6.0, 8.0]
      theta: [0.2, 0.45, 0.7]
      m: [0.5, 1.2, 2.0]
    tolerance: 1e-12
    shown: ['id="p6b-path"']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
    origin: page-own

  - id: p6b-beta
    kind: identity
    where: 'Problem 6(b), check: on the rising part of the path (x below β_x), x + (α_x/m²g)√(2mE − α_x² − 2m²gy(x)) is the constant β_x = v₀² sin θ cos θ/g'
    formula: v0**2*sin(theta)*cos(theta)/g
    equals: x + m*v0*cos(theta)/(m**2*g)*sqrt(m**2*v0**2*sin(theta)**2 - 2*m**2*g*(x*tan(theta) - g*x**2/(2*v0**2*cos(theta)**2)))
    samples:
      x: [0.05, 0.3, 0.9]
      g: [9.0, 9.81, 10.0]
      v0: [4.0, 6.0, 8.0]
      theta: [0.2, 0.45, 0.7]
      m: [0.5, 1.2, 2.0]
    tolerance: 1e-9
    shown: ['$\beta_x = v_0^2\sin\theta\cos\theta/g$']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
    origin: page-own

  - id: p6b-inputs
    kind: fact
    where: 'Problem 6(b), statement: our own launch speed, angle and g'
    shown: ['$v_0 = 20$ m/s, $\theta = 30°$ and $g = 9.81$ m/s²']
    source: {cite: mit, at: 'Problem 6(b) (our own addition)'}
