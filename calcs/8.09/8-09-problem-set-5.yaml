  - id: p6b-range
    answer: p6b-range
    where: 'Problem 6(b), answer box: the range v₀² sin 2θ/g for v₀ = 20 m/s, θ = 30°, g = 9.81 m/s², in metres'
    formula: 20**2*sin(2*30*pi/180)/9.81
    expected: '35.3'
    shown: ['id="p6b-range"', '= 35.3$ m']
    source: {cite: mit, at: 'Problem 6(b) (our own addition)'}
