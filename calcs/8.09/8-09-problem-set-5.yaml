  - id: p6b-slip
    where: 'Problem 6(b), check: the slip with sin θ in place of sin 2θ, in metres'
    formula: 20**2*sin(30*pi/180)/9.81
    expected: '20.4'
    shown: ['Using $\sin\theta$ in place of $\sin 2\theta$ gives 20.4 m']
    source: {cite: mit, at: 'Problem 6(b) (our own addition)'}
    origin: page-own

  - id: p6c-x
    kind: identity
    answer: p6c-x
    where: 'Problem 6(c), answer box: x(t) against the Hamilton-Jacobi route, x = β_x − α_x p_y/(m²g) with p_y = mv₀ sin θ − mgt'
    formula: v0*cos(theta)*t
    equals: v0**2*sin(theta)*cos(theta)/g - m*v0*cos(theta)/(m**2*g)*(m*v0*sin(theta) - m*g*t)
    samples: &time
      t: [0.1, 0.5, 1.0]
      g: [9.0, 9.81, 10.0]
      v0: [4.0, 6.0, 8.0]
      theta: [0.2, 0.45, 0.7]
      m: [0.5, 1.2, 2.0]
    tolerance: 1e-9
    shown: ['id="p6c-x"']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  - id: p6c-y
    kind: identity
    answer: p6c-y
    where: 'Problem 6(c), answer box: y(t) against y = (m²v₀² sin²θ − p_y²)/(2m²g) with p_y = mv₀ sin θ − mgt'
    formula: v0*sin(theta)*t - g*t**2/2
    equals: (m**2*v0**2*sin(theta)**2 - (m*v0*sin(theta) - m*g*t)**2)/(2*m**2*g)
    samples: *time
    tolerance: 1e-9
    shown: ['id="p6c-y"']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
