  - id: p6b-range-root
    kind: identity
    where: 'Problem 6(b), check: the range as the far root of y(x) = 0 on the path of part (b), found numerically'
    formula: 20**2*sin(2*30*pi/180)/9.81
    equals: solve('z*tan(30*pi/180) - 9.81*z**2/(2*20**2*cos(30*pi/180)**2)', 'z', 1, 100)
    samples:
      dummy: [1.0]
    tolerance: 1e-9
    shown: ['$y = 0$ again at $x = 2\beta_x']
    source: {cite: mit, at: 'Problem 6(b) (our own addition)'}
