# Calculations on content/year-4/8.09/perihelion-precession-perturbed-kepler.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) Lecture Notes, Chapter 5, Section 5.3 and side note, pp. 98-103 (printed page numbers).
# The notes quote Mercury's data (T = 0.2409 T_Earth, eps = 0.2056, a = 5.79e7 km, GM_sun/c^2 = 1.4766 km), the GR result
# 42.98 arcsec/century, the planetary perturbation 531.54 and the observed 43.1 arcsec/century (p. 101).
# Page's own: the Earth (a = 1.496e8 km, eps = 0.0167, T = 1 yr), the precessing-orbit plot, the 3/16 (v/c)^2 form.
# Notation: hh = h, kk = k, mm = m, ell = l, TT = T, cc = c, eps = epsilon, aa = a, nn = n.

page: content/year-4/8.09/perihelion-precession-perturbed-kepler.mdx
calcs:
  # ---------------------------------------------------------------- the average (p. 100)
  - id: kepler-period
    kind: identity
    where: 'formula "Kepler energy and period": pi k sqrt(m/(-2E^3)) equals Kepler''s 2 pi sqrt(m a^3/k) with a = -k/(2E)'
    formula: pi*kk*sqrt(mm/(-2*EE**3))
    equals: 2*pi*sqrt(mm*(-kk/(2*EE))**3/kk)
    samples: {kk: [1.0, 3.0], mm: [1.0, 0.4], EE: [-0.5, -2.0]}
    tolerance: 1e-12
    shown: ['T = \frac{1}{\nu_r} = \pi k\sqrt{\frac{m}{-2E^{(0)3}}} = T(J_3)']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.34), p. 100'}
    origin: mit

  - id: average-time-to-angle
    kind: identity
    where: 'formula "The average as an angle integral": (1/T) integral of -h/r^n dt over one orbit, with dt = m r^2/l dpsi, equals the closed form for n = 3 (checked numerically against the time integral written as an angle integral)'
    formula: -(hh*mm/(ell*TT))*integrate('(mm*kk/ell**2*(1 + eps*cos(u)))**(3 - 2)', 'u', 0, 2*pi)
    equals: -2*pi*hh*kk*mm**2/(ell**3*TT)
    samples: {hh: [0.01, 0.2], mm: [1.0, 0.5], kk: [1.0, 2.0], ell: [1.0, 0.7], TT: [6.0, 2.5], eps: [0.2, 0.6]}
    tolerance: 1e-9
    shown: ['-\frac{hm}{\ell T}\Big(\frac{mk}{\ell^2}\Big)^{n-2}\int_0^{2\pi}\big[1 + \epsilon\cos(\psi - \psi'')\big]^{n-2}\, d\psi']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.37), p. 100'}
    origin: mit

  - id: n2-rate
    kind: identity
    where: 'n = 2 bullet: d/dl of -2 pi h m/(l T) = 2 pi h m/(l^2 T)'
    formula: deriv('-2*pi*hh*mm/(u*TT)', 'u', ell, 1)
    equals: 2*pi*hh*mm/(ell**2*TT)
    samples: {hh: [0.01, 0.2], mm: [1.0, 0.5], ell: [1.0, 0.7], TT: [6.0, 2.5]}
    tolerance: 1e-7
    shown: ['$\overline{\dot\omega^{(1)}} = 2\pi hm/(\ell^2T)$']
    source: {cite: reading1, at: 'Section 5.3, p. 100'}
    origin: mit

  - id: n3-rate
    kind: identity
    where: 'formula "Precession for an inverse-cube perturbation": d/dl of -2 pi h k m^2/(l^3 T) = 6 pi m^2 h k/(l^4 T)'
    formula: deriv('-2*pi*hh*kk*mm**2/(u**3*TT)', 'u', ell, 1)
    equals: 6*pi*mm**2*hh*kk/(ell**4*TT)
    samples: {hh: [0.01, 0.2], mm: [1.0, 0.5], kk: [1.0, 2.0], ell: [1.0, 0.7], TT: [6.0, 2.5]}
    tolerance: 1e-7
    shown: ['= \frac{6\pi m^2 h k}{\ell^4 T}']
    source: {cite: reading1, at: 'Section 5.3, p. 100'}
    origin: mit

  - id: gr-advance-per-orbit
    kind: identity
    where: 'formula "Relativistic advance per orbit": 6 pi m^2 h k/l^4 with h = k l^2/(c^2 m^2), l^2 = m k a (1 - eps^2), k = G M m, equals 6 pi G M/(c^2 a (1 - eps^2)) (GM written gm)'
    formula: 6*pi*mm**2*(gm*mm*(mm*gm*mm*aa*(1 - eps**2))/(cc**2*mm**2))*(gm*mm)/(mm*gm*mm*aa*(1 - eps**2))**2
    equals: 6*pi*gm/(cc**2*aa*(1 - eps**2))
    samples: {mm: [1.0, 0.3], gm: [1.0, 4.0], aa: [2.0, 0.7], eps: [0.2, 0.5], cc: [10.0, 30.0]}
    tolerance: 1e-12
    shown: ['= \frac{6\pi k^2}{c^2\ell^2} = \frac{6\pi GM}{c^2 a(1 - \epsilon^2)}']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: veff-from-side-note
    kind: identity
    where: 'side note: (m/2)(c^2 + l^2/(m^2 r^2))(1 - rs/r) - m c^2/2 equals -k/r + l^2/(2 m r^2) - k l^2/(m^2 c^2 r^3) with rs = 2k/(m c^2)'
    formula: (mm/2)*(cc**2 + ell**2/(mm**2*rr**2))*(1 - 2*kk/(mm*cc**2)/rr) - mm*cc**2/2
    equals: -kk/rr + ell**2/(2*mm*rr**2) - kk*ell**2/(mm**2*cc**2*rr**3)
    samples: {mm: [1.0, 0.3], cc: [10.0, 30.0], ell: [1.0, 0.7], rr: [2.0, 5.0], kk: [1.0, 4.0]}
    tolerance: 1e-9
    shown: ['V_{\text{eff}}(r) = -\frac{k}{r} + \frac{\ell^2}{2mr^2} - \frac{k\ell^2}{c^2m^2r^3}']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.40) and side note, pp. 101, 103'}
    origin: mit

  - id: relativistic-energy-series
    kind: identity
    where: 'formula "Expanded relativistic energy": sqrt(c^4 m^2 + c^2 p^2) - m c^2 - p^2/2m + p^4/(8 m^3 c^2) is of order p^6 (ratio to p^6/(16 m^5 c^4) is 1 for small p)'
    formula: (sqrt(cc**4*mm**2 + cc**2*pp**2) - mm*cc**2 - pp**2/(2*mm) + pp**4/(8*mm**3*cc**2))/(pp**6/(16*mm**5*cc**4))
    equals: 1 + 0*pp
    samples: {cc: [1.0, 1.0], mm: [1.0, 1.0], pp: [0.02, 0.03]}
    tolerance: 2e-3
    shown: ['E = \sqrt{c^4m^2 + c^2p^2} = mc^2 + \frac{p^2}{2m} - \frac{p^4}{8m^3c^2} + \ldots']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.41), p. 101'}
    origin: mit

  - id: oscillator-dh
    kind: identity
    where: 'formula "Relativistic perturbation in action-angle variables": -p^4/(8 c^2 m^3) with p = sqrt(J m Om/pi) cos(.)'
    formula: -(sqrt(JJ*mm*Om/pi)*cos(ph))**4/(8*cc**2*mm**3)
    equals: -(JJ**2*Om**2/(8*pi**2*cc**2*mm))*cos(ph)**4
    samples: {JJ: [0.3, 1.7], mm: [1.0, 0.4], Om: [2.0, 0.5], cc: [10.0, 3.0], ph: [0.4, 2.0]}
    tolerance: 1e-12
    shown: ['\Delta H = -\frac{J^2\Omega^2}{8\pi^2c^2m}\,\cos^4\big[2\pi(\nu t + \beta)\big]']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.44), p. 101'}
    origin: mit

  - id: oscillator-beta-average
    kind: identity
    where: 'formula "Secular drift of the oscillator phase": -(J0 Om^2/(4 pi^2 m c^2)) times the average 3/8 of cos^4'
    formula: -(JJ*Om**2/(4*pi**2*mm*cc**2))*integrate('cos(u)**4', 'u', 0, 2*pi)/(2*pi)
    equals: -3*JJ*Om**2/(32*pi**2*mm*cc**2)
    samples: {JJ: [0.3, 1.7], mm: [1.0, 0.4], Om: [2.0, 0.5], cc: [10.0, 3.0]}
    tolerance: 1e-9
    shown: ['\overline{\dot\beta^{(1)}} = -\frac{3J_0\Omega^2}{32\pi^2mc^2}']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.46), p. 101'}
    origin: mit

  - id: oscillator-relative-shift
    kind: identity
    where: 'text after eq. (5.46) and quiz 4: with J0 = pi m Om A^2 and nu = Om/(2 pi), the relative shift is -(3/16)(Om A/c)^2'
    formula: (-3*(pi*mm*Om*AA**2)*Om**2/(32*pi**2*mm*cc**2))/(Om/(2*pi))
    equals: -(3/16)*(Om*AA/cc)**2
    samples: {mm: [1.0, 0.4], Om: [2.0, 0.5], AA: [0.3, 1.2], cc: [10.0, 3.0]}
    tolerance: 1e-12
    shown: ['the relative shift is $\overline{\dot\beta^{(1)}}/\nu = -\tfrac{3}{16}(\Omega A/c)^2$']
    source: {cite: reading1, at: 'Section 5.3, eq. (5.46), p. 101'}
    origin: page-own

  # ---------------------------------------------------------------- the notes' numbers (p. 101)
  - id: mercury-one-minus-e2
    where: 'worked example, step "Mercury, for comparison"'
    inputs: {}
    formula: 1 - 0.2056**2
    expected: '0.95773'
    shown: ['$1 - \epsilon^2 = 0.95773$']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: mit

  - id: mercury-per-orbit
    where: 'same step; plot caption (about 0.1 arcsecond per orbit)'
    inputs: {}
    formula: 6*pi*1.4766/(5.79e7*(1 - 0.2056**2))
    expected: '5.019e-7'
    shown: ['\approx 5.019 \times 10^{-7}$ rad']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: mercury-per-orbit-arcsec
    where: 'plot caption: Mercury advances by about 0.1 arcsecond per orbit'
    inputs: {}
    formula: 6*pi*1.4766/(5.79e7*(1 - 0.2056**2))*206264.8
    expected: '0.1'
    shown: ['where Mercury''s advances by about 0.1 arcsecond']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: mercury-orbits-per-century
    where: 'same step'
    inputs: {}
    formula: 100/0.2409
    expected: '415.1'
    shown: ['$100/0.2409 \approx 415.1$ orbits']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: mercury-century-rad
    where: 'same step'
    inputs: {}
    formula: 6*pi*1.4766/(5.79e7*(1 - 0.2056**2))*100/0.2409
    expected: '2.084e-4'
    shown: ['$2.084 \times 10^{-4}$ rad, or 42.98 arcseconds']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: mercury-century-arcsec
    where: 'section "General relativity and Mercury", worked example, summaries, flashcard 3: the notes'' 42.98 arcseconds per century'
    inputs: {}
    formula: 6*pi*1.4766/(5.79e7*(1 - 0.2056**2))*100/0.2409*206264.8
    expected: '42.98'
    shown: ['**42.98 arcseconds per century**', 'or 42.98 arcseconds, as the notes say', '42.98 arcseconds per century for Mercury, matching', 'per orbit: 42.98 arcseconds per century for Mercury', 'for Mercury 42.98 arcseconds per century']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: mit

  - id: mercury-rounded
    where: 'introduction and leadsTo of Section 5.1: about 43 arcseconds per century'
    inputs: {}
    formula: 6*pi*1.4766/(5.79e7*(1 - 0.2056**2))*100/0.2409*206264.8
    expected: '43'
    shown: ['get Mercury''s famous 43 arcseconds per century']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: mit

  - id: observed-residual
    kind: fact
    where: 'Mercury text, summaries, flashcard 3: the observed residual quoted in the notes'
    value: '43.1'
    shown: ['the remaining 43.1 arcseconds per century', 'against an observed residual of 43.1', 'observed 43.1 after subtracting', 'matching the observed 43.1 left']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: mit

  - id: planets-shift
    kind: fact
    where: 'Mercury text, summary, flashcard 3: shift from the other planets quoted in the notes'
    value: '531.54'
    shown: ['a much larger 531.54 arcseconds per century', 'the other planets'' 531.54;', 'the planets'' 531.54."']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: mit

  - id: mercury-inputs
    kind: fact
    where: 'Mercury data quoted in the notes'
    value: 'T = 0.2409 T_Earth, eps = 0.2056, a = 5.79e7 km, GM_sun/c^2 = 1.4766 km'
    shown: ['$T = 0.2409\,T_{\text{Earth}}$, $\epsilon = 0.2056$, $a = 5.79 \times 10^7$ km and $GM_{\text{Sun}}/c^2 = 1.4766$ km']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: mit

  # ---------------------------------------------------------------- page's own: the Earth
  - id: earth-one-minus-e2
    where: 'worked example, step "Per orbit"; quiz 3'
    inputs: {}
    formula: 1 - 0.0167**2
    expected: '0.99972'
    shown: ['$1 - \epsilon^2 = 0.99972$']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: earth-per-orbit
    where: 'step "Per orbit"; quiz 3 explanation (1.86e-7)'
    inputs: {}
    formula: 6*pi*1.4766/(1.496e8*(1 - 0.0167**2))
    expected: '1.861e-7'
    shown: ['\approx 1.861 \times 10^{-7}$ rad', '\\approx 1.86 \\times 10^{-7}$ rad']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: earth-century-rad
    where: 'step "Per century"'
    inputs: {}
    formula: 100*6*pi*1.4766/(1.496e8*(1 - 0.0167**2))
    expected: '1.861e-5'
    shown: ['100 orbits give $1.861 \times 10^{-5}$ rad']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: earth-century-arcsec
    where: 'step "Per century", summary, quiz 3'
    inputs: {}
    formula: 100*6*pi*1.4766/(1.496e8*(1 - 0.0167**2))*206264.8
    expected: '3.84'
    shown: ['that is about 3.84 arcseconds per century', '531.54; 3.84 for the Earth', 'gives about 3.84 arcseconds per century']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: mercury-earth-ratio
    where: 'step "Mercury, for comparison" and quiz 3: factor of about 11'
    inputs: {}
    formula: (6*pi*1.4766/(5.79e7*(1 - 0.2056**2))*100/0.2409)/(100*6*pi*1.4766/(1.496e8*(1 - 0.0167**2)))
    expected: '11'
    shown: ['Mercury wins by a factor of about 11', 'eleven times less than Mercury''s']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: orbit-size-ratio
    where: 'same step: 1.496e8/5.79e7'
    inputs: {}
    formula: 1.496e8/5.79e7
    expected: '2.6'
    shown: ['its orbit is 2.6 times smaller']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: orbit-count-ratio
    where: 'same step: orbits per century ratio 1/0.2409'
    inputs: {}
    formula: 1/0.2409
    expected: '4.15'
    shown: ['by a factor 4.15, through the number of orbits']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: eccentricity-gain
    where: 'same step: (1 - 0.0167^2)/(1 - 0.2056^2) - 1, in percent'
    inputs: {}
    formula: ((1 - 0.0167**2)/(1 - 0.2056**2) - 1)*100
    expected: '4'
    shown: ['its larger eccentricity adds 4%']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: quiz-distractors-earth
    where: 'quiz 3 distractors: 0.38 (ten times too small) and 3.8 per year (a hundred times too large)'
    inputs: {}
    formula: 100*6*pi*1.4766/(1.496e8*(1 - 0.0167**2))*206264.8/10
    expected: '0.38'
    shown: ['"About 0.38 arcseconds per century"']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: page-own

  - id: arcsec-per-degree
    kind: fact
    where: 'Mercury text: an arcsecond is 1/3600 of a degree (the notes'' slip says "of a second")'
    value: '3600'
    shown: ['(An arcsecond is 1/3600 of a degree;']
    source: {cite: reading1, at: 'Section 5.3, p. 101'}
    origin: slip

  # ---------------------------------------------------------------- plot
  - id: plot-precession
    where: 'plot caption: r = 1/(1 + 0.5 cos(0.9 psi)) returns to perihelion after psi = 2 pi/0.9, an advance of 2 pi (1/0.9 - 1) rad'
    inputs: {}
    formula: 2*pi*(1/0.9 - 1)*180/pi
    expected: '40'
    shown: ['2π(1/0.9 − 1) ≈ 40° per orbit']
    source: {cite: reading1, at: 'Section 5.3, p. 99'}
    origin: page-own

  - id: plot-perihelion-point
    where: 'plot point "first perihelion": r at psi = 0'
    inputs: {}
    formula: 1/(1 + 0.5)
    expected: '0.6667'
    shown: ['{ x: 0.6667, y: 0, label: "first perihelion" }']
    source: {cite: reading1, at: 'Section 5.3, p. 99'}
    origin: page-own
