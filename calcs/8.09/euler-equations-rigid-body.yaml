# Calculations on content/year-4/8.09/euler-equations-rigid-body.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 2, Section 2.4, pp. 44-45 (printed page = PDF page + 28).
# Page's own worked example: a phone as a uniform box 15 cm x 7 cm x 0.8 cm, spun at omega = 4 pi 1/s.
# Principal moments in units of M cm^2: I1 = (7^2 + 0.8^2)/12, I2 = (15^2 + 0.8^2)/12, I3 = (15^2 + 7^2)/12.

page: content/year-4/8.09/euler-equations-rigid-body.mdx
calcs:
  - id: levi-civita-alpha1
    kind: identity
    where: 'section "From torque to Euler''s equations": eps_alk w_l w_k I_k at alpha = 1 equals (I3 - I2) w2 w3, so (2.69) reproduces the first line of (2.68)'
    formula: 1*w2*w3*I3 + (-1)*w3*w2*I2
    equals: -(I2 - I3)*w2*w3
    samples: {w2: [0.3, 1.7], w3: [2.2, -0.4], I2: [1.0, 3.5], I3: [2.0, 0.7]}
    tolerance: 1e-12
    shown: ['= (I_3 - I_2)\,\omega_2\omega_3$, which is the first line of (2.68)']
    source: {cite: reading1, at: 'Section 2.4, eqs. (2.68)-(2.69), p. 44'}
    origin: mit

  - id: euler-angles-omega
    kind: identity
    where: 'section "Back to the fixed frame": |omega|^2 from (2.70) equals phidot^2 + thetadot^2 + psidot^2 + 2 phidot psidot cos(theta) (sum of the three angular velocities along z, line of nodes and z'')'
    formula: (pd*sin(th)*sin(ps) + td*cos(ps))**2 + (pd*sin(th)*cos(ps) - td*sin(ps))**2 + (pd*cos(th) + sd)**2
    equals: pd**2 + td**2 + sd**2 + 2*pd*sd*cos(th)
    samples: {pd: [0.4, 1.3], td: [0.7, -0.2], sd: [2.1, 0.5], th: [0.6, 2.0], ps: [1.1, 4.0]}
    tolerance: 1e-12
    shown: ['Collecting terms gives (2.70)']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.70), p. 45'}
    origin: page-own

  - id: wobble-equation
    kind: identity
    where: 'eq. (2.73) from (2.72): d/dt of kappa2dot = (I3 - I1)/I2 w1 kappa3dot, with kappa3dot = (I1 - I2)/I3 w1 kappa2'
    formula: (I3 - I1)/I2 * w1 * ((I1 - I2)/I3 * w1 * k2)
    equals: (I3 - I1)*(I1 - I2)*w1**2/(I2*I3) * k2
    samples: {I1: [1.0, 3.0], I2: [2.0, 1.5], I3: [3.5, 0.6], w1: [1.2, 4.0], k2: [0.01, -0.3]}
    tolerance: 1e-12
    shown: ['\ddot\kappa_2 = \left[\frac{(I_3 - I_1)(I_1 - I_2)\,\omega_1^2}{I_2 I_3}\right]\kappa_2']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: mit

  - id: phone-omega
    where: 'worked example: two turns per second, 4 pi'
    inputs: {}
    formula: 4*pi
    expected: '12.6'
    shown: ['\omega = 4\pi\ \text{s}^{-1} \approx 12.6\ \text{s}^{-1}']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-I1
    where: 'worked example "Principal moments" and quiz 4: (7^2 + 0.8^2)/12'
    inputs: {}
    formula: (7**2 + 0.8**2)/12
    expected: '4.14'
    shown: ['$I_1 = (7^2 + 0.8^2)/12 = 4.14$', 'in the ratio 4.14 : 18.8 : 22.8']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-I2
    where: 'worked example "Principal moments" and quiz 4: (15^2 + 0.8^2)/12'
    inputs: {}
    formula: (15**2 + 0.8**2)/12
    expected: '18.8'
    shown: ['$I_2 = (15^2 + 0.8^2)/12 = 18.8$']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-I3
    where: 'worked example "Principal moments" and quiz 4: (15^2 + 7^2)/12'
    inputs: {}
    formula: (15**2 + 7**2)/12
    expected: '22.8'
    shown: ['$I_3 = (15^2 + 7^2)/12 = 22.8$']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-diff-32
    where: 'worked example "Spin about the width axis": I3 - I2'
    inputs: {}
    formula: (15**2 + 7**2)/12 - (15**2 + 0.8**2)/12
    expected: '4.03'
    shown: ['\omega^2 \times 4.03 \times 14.7/(4.14 \times 22.8)']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-diff-21
    where: 'worked example "Spin about the width axis": I2 - I1'
    inputs: {}
    formula: (15**2 + 0.8**2)/12 - (7**2 + 0.8**2)/12
    expected: '14.7'
    shown: ['\omega^2 \times 4.03 \times 14.7/(4.14 \times 22.8)']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-alpha-ratio
    where: 'worked example and quiz 4: alpha/omega = sqrt((I3 - I2)(I2 - I1)/(I1 I3))'
    inputs: {}
    formula: sqrt(((15**2 + 7**2) - (15**2 + 0.8**2))*((15**2 + 0.8**2) - (7**2 + 0.8**2))/((7**2 + 0.8**2)*(15**2 + 7**2)))
    expected: '0.791'
    shown: ['so $\alpha = 0.791\,\omega', '\approx 0.791\\,\\omega']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-alpha
    where: 'worked example, quiz 4 and plot: alpha = 0.791 * 4 pi'
    inputs: {}
    formula: 4*pi*sqrt(((15**2 + 7**2) - (15**2 + 0.8**2))*((15**2 + 0.8**2) - (7**2 + 0.8**2))/((7**2 + 0.8**2)*(15**2 + 7**2)))
    expected: '9.94'
    shown: ['\approx 9.94\ \text{s}^{-1}$. A wobble', '\approx 9.94$ s⁻¹', 'with α = 9.94 s⁻¹', 'cosh(9.94*t) <= 12 ?']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-efold
    where: 'worked example: e-folding time 1/alpha'
    inputs: {}
    formula: 1/9.94
    expected: '0.10'
    shown: ['grows by a factor $e$ every $0.10$ s']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-tgrow
    where: 'worked example: ln(100)/alpha'
    inputs: {}
    formula: log(100)/9.94
    expected: '0.46'
    shown: ['\ln 100/\alpha \approx 0.46$ s']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: quiz4-factor
    where: 'quiz 4: growth in 0.1 s, e^(0.994)'
    inputs: {}
    formula: exp(9.94*0.1)
    expected: '2.7'
    quiz: 3
    shown: ['e^{0.994} \\approx 2.7']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-Omega-long-ratio
    where: 'worked example "Spin about the long axis": Omega/omega = sqrt((I2 - I1)(I3 - I1)/(I2 I3))'
    inputs: {}
    formula: sqrt(((15**2 + 0.8**2) - (7**2 + 0.8**2))*((15**2 + 7**2) - (7**2 + 0.8**2))/((15**2 + 0.8**2)*(15**2 + 7**2)))
    expected: '0.799'
    shown: ['$\Omega = 0.799\,\omega \approx 10.0\ \text{s}^{-1}$']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-Omega-long
    where: 'worked example and plot: Omega = 0.799 * 4 pi (10.0 in the text, 10.04 in the plot)'
    inputs: {}
    formula: 4*pi*sqrt(((15**2 + 0.8**2) - (7**2 + 0.8**2))*((15**2 + 7**2) - (7**2 + 0.8**2))/((15**2 + 0.8**2)*(15**2 + 7**2)))
    expected: '10.04'
    shown: ['cos(10.04*t)', 'Ω = 10.04 s⁻¹']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-period-long
    where: 'worked example: period 2 pi / Omega'
    inputs: {}
    formula: 2*pi/10.043
    expected: '0.63'
    shown: ['with period about $0.63$ s']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-Omega-thick-ratio
    where: 'worked example: about the thickness axis, Omega/omega = sqrt((I3 - I1)(I3 - I2)/(I1 I2))'
    inputs: {}
    formula: sqrt(((15**2 + 7**2) - (7**2 + 0.8**2))*((15**2 + 7**2) - (15**2 + 0.8**2))/((7**2 + 0.8**2)*(15**2 + 0.8**2)))
    expected: '0.984'
    shown: ['= 0.984\,\omega \approx 12.4\ \text{s}^{-1}$']
    source: {cite: reading1, at: 'Section 2.4, eq. (2.73), p. 45'}
    origin: page-own

  - id: phone-Omega-thick
    where: 'worked example: 0.984 * 4 pi'
    inputs: {}
    formula: 4*pi*sqrt(((15**2 + 7**2) - (7**2 + 0.8**2))*((15**2 + 7**2) - (15**2 + 0.8**2))/((7**2 + 0.8**2)*(15**2 + 0.8**2)))
    expected: '12.4'
    shown: ['\approx 12.4\ \text{s}^{-1}$']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: plot-exit
    where: 'plot caption: cosh(9.94 t) = 12 at t = acosh(12)/9.94'
    inputs: {}
    formula: acosh(12)/9.94
    expected: '0.32'
    shown: ['leaves the graph at about 0.32 s']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own

  - id: phone-tgrow-cosh
    where: 'worked example: with no initial rate of change, cosh(alpha t) = 100 at t = acosh(100)/alpha'
    inputs: {}
    formula: acosh(100)/9.94
    expected: '0.53'
    shown: ['a little longer, 0.53 s, if it starts with no rate of change']
    source: {cite: reading1, at: 'Section 2.4, p. 45'}
    origin: page-own
