# Calculations on content/year-4/8.09/8-09-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# the trace and a root of a characteristic polynomial (Problems 1 and 4), numerical time derivatives of the Euler
# rotation matrix U = U_ψ U_θ U_φ itself (Problem 3(a), (b)) and of T(ψ) (3(c)), numerical derivatives of the position
# of the point mass (4(c)), and numerical integrals over thin slices of the cone (Problem 5).
# The two equations of motion of Problem 2(a) were first derived with SymPy while writing; entries p2a-theta and p2a-phi
# check them here against Lagrange's equations taken numerically from the vector form of the Lagrangian.
# Short names in the samples: ph, th, ps the Euler angles φ, θ, ψ and dph, dth, dps their rates; q the variable of a
# numerical derivative, integral or root (for the matrix U, the time along a path with constant rates, at q = 0).

page: content/year-4/8.09/8-09-problem-set-3.mdx
calcs:
  # ---- Problem 1

  - id: p1-det-w
    where: 'Problem 1(b), check: the determinant of W, (1/√2)³ √2 (i + i), has modulus 1'
    formula: (1/sqrt(2))**3*sqrt(2)*2
    expected: '1'
    shown: ['Its determinant, $\frac12(i + i) = i$, has modulus 1.']
    source: {cite: mit, at: 'Problem 1(b) (our own check)'}
    origin: page-own

  - id: p1c-angle
    answer: p1c-angle
    where: 'Problem 1(c), answer box: the rotation angle of the cyclic permutation matrix P from Tr P = 0 = 1 + 2 cos Φ, in degrees'
    formula: acos((0 + 0 + 0 - 1)/2)*180/pi
    expected: '120'
    shown: ['id="p1c-angle"', '$\cos\Phi = -\frac12$ and $\Phi = 120°$']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own example)'}
    origin: page-own

  - id: p1c-angle-root
    kind: identity
    where: 'Problem 1(c), check: the angle 120° against a root of cos Φ = −1/2 found numerically'
    formula: 120
    equals: solve('cos(q) + 0.5', 'q', 1.5, 3)*180/pi
    samples: {dummy: [1]}
    tolerance: 1e-9
    shown: ['three turns of $120°$ make $360°$']
    source: {cite: mit, at: 'Problem 1(c) (our own check)'}
    origin: page-own

  # ---- Problem 2(a): the two equations of motion (divided by m ℓ², with ℓ = 1 and G = g/ℓ) against Lagrange's equations
  # computed numerically from the Lagrangian to first order in ω, built from the vectors themselves:
  # L/(mℓ²) = ½|v|² + v·(ω × r) + G cos θ, with r = (sin θ cos φ, sin θ sin φ, −cos θ), ω = W(0, cos λ, sin λ) and v
  # written out in θ̇, φ̇. Test paths θ = th + a1 q + a2 q², φ = ph + b1 q + b2 q², at q = 0; the inner derivative (in p)
  # is ∂L/∂θ̇ (or ∂L/∂φ̇) along the path, the outer one its time derivative.

  - id: p2a-theta
    kind: identity
    where: 'Problem 2(a), solution: the θ equation against d/dt ∂L/∂θ̇ − ∂L/∂θ from the vector Lagrangian'
    formula: 2*a2 - sin(th)*cos(th)*b1**2 + G*sin(th) - 2*W*sin(th)*(sin(lam)*cos(th) - cos(lam)*sin(th)*sin(ph))*b1
    equals: deriv("deriv('0.5*((cos((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*p - sin((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*(b1 + 2*b2*q))**2 + (cos((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*p + sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*(b1 + 2*b2*q))**2 + (sin((th + a1*q + a2*q**2))*p)**2) + (cos((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*p - sin((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*(b1 + 2*b2*q))*(-W*cos(lam)*cos((th + a1*q + a2*q**2)) - W*sin(lam)*sin((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))) + (cos((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*p + sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*(b1 + 2*b2*q))*(W*sin(lam)*sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))) + (sin((th + a1*q + a2*q**2))*p)*(-W*cos(lam)*sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))) + G*cos((th + a1*q + a2*q**2))', 'p', (a1 + 2*a2*q))", 'q', 0) - deriv('0.5*((cos(p)*cos(ph)*a1 - sin(p)*sin(ph)*b1)**2 + (cos(p)*sin(ph)*a1 + sin(p)*cos(ph)*b1)**2 + (sin(p)*a1)**2) + (cos(p)*cos(ph)*a1 - sin(p)*sin(ph)*b1)*(-W*cos(lam)*cos(p) - W*sin(lam)*sin(p)*sin(ph)) + (cos(p)*sin(ph)*a1 + sin(p)*cos(ph)*b1)*(W*sin(lam)*sin(p)*cos(ph)) + (sin(p)*a1)*(-W*cos(lam)*sin(p)*cos(ph)) + G*cos(p)', 'p', th)
    samples: &fouc
      th: [0.3, 0.8, 1.2]
      ph: [0.5, 2.0, 4.0]
      a1: [0.4, -0.7, 1.1]
      a2: [0.2, 0.5, -0.3]
      b1: [0.6, 1.3, -0.8]
      b2: [-0.4, 0.3, 0.7]
      W: [0.05, 0.1, 0.02]
      lam: [0.85, 0.4, 1.2]
      G: [9.8, 4.0, 1.5]
    tolerance: 1e-4
    shown: ['\ddot\theta - \sin\theta\cos\theta\,\dot\phi^2 + \frac{g}{\ell}\sin\theta - 2\omega\sin\theta\left(\sin\lambda\cos\theta - \cos\lambda\sin\theta\sin\phi\right)\dot\phi = 0']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2a-phi
    kind: identity
    where: 'Problem 2(a), solution: the φ equation against d/dt ∂L/∂φ̇ − ∂L/∂φ from the vector Lagrangian'
    formula: 2*sin(th)*cos(th)*a1*b1 + sin(th)**2*2*b2 + 2*W*sin(th)*(sin(lam)*cos(th) - cos(lam)*sin(th)*sin(ph))*a1
    equals: deriv("deriv('0.5*((cos((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*(a1 + 2*a2*q) - sin((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*p)**2 + (cos((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*(a1 + 2*a2*q) + sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*p)**2 + (sin((th + a1*q + a2*q**2))*(a1 + 2*a2*q))**2) + (cos((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*(a1 + 2*a2*q) - sin((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*p)*(-W*cos(lam)*cos((th + a1*q + a2*q**2)) - W*sin(lam)*sin((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))) + (cos((th + a1*q + a2*q**2))*sin((ph + b1*q + b2*q**2))*(a1 + 2*a2*q) + sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))*p)*(W*sin(lam)*sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))) + (sin((th + a1*q + a2*q**2))*(a1 + 2*a2*q))*(-W*cos(lam)*sin((th + a1*q + a2*q**2))*cos((ph + b1*q + b2*q**2))) + G*cos((th + a1*q + a2*q**2))', 'p', (b1 + 2*b2*q))", 'q', 0) - deriv('0.5*((cos(th)*cos(p)*a1 - sin(th)*sin(p)*b1)**2 + (cos(th)*sin(p)*a1 + sin(th)*cos(p)*b1)**2 + (sin(th)*a1)**2) + (cos(th)*cos(p)*a1 - sin(th)*sin(p)*b1)*(-W*cos(lam)*cos(th) - W*sin(lam)*sin(th)*sin(p)) + (cos(th)*sin(p)*a1 + sin(th)*cos(p)*b1)*(W*sin(lam)*sin(th)*cos(p)) + (sin(th)*a1)*(-W*cos(lam)*sin(th)*cos(p)) + G*cos(th)', 'p', ph)
    samples: *fouc
    tolerance: 1e-4
    shown: ['\frac{d}{dt}\left(\sin^2\theta\,\dot\phi\right) + 2\omega\sin\theta\left(\sin\lambda\cos\theta - \cos\lambda\sin\theta\sin\phi\right)\dot\theta = 0']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  # ---- Problem 2(b): the precession time at the latitude of Paris (our addition)

  - id: p2b-inputs
    kind: fact
    where: 'Problem 2(b), statement: our own values for the Earth''s rotation rate (2π per sidereal day, 23.93 h) and the latitude of Paris'
    shown: ['$\omega = 7.29\times 10^{-5}$ s⁻¹', '$\lambda = 48.85°$']
    source: {cite: mit, at: 'Problem 2(b) (our own addition)'}
    origin: page-own

  - id: p2b-sin
    where: 'Problem 2(b), solution: sin of the latitude of Paris'
    formula: sin(48.85*pi/180)
    expected: '0.7530'
    shown: ['$\sin 48.85° = 0.7530$']
    source: {cite: mit, at: 'Problem 2(b) (our own addition)'}
    origin: page-own

  - id: p2b-day
    where: 'Problem 2(b), solution: 2π/ω in hours'
    formula: 2*pi/7.29e-5/3600
    expected: '23.94'
    shown: ['$2\pi/\omega = 23.94$ h']
    source: {cite: mit, at: 'Problem 2(b) (our own addition)'}
    origin: page-own

  - id: p2b-time
    answer: p2b-time
    where: 'Problem 2(b), answer box: 2π/(ω sin λ) in hours at λ = 48.85°'
    formula: 2*pi/(7.29e-5*sin(48.85*pi/180))/3600
    expected: '31.8'
    shown: ['id="p2b-time"', '$23.94/0.7530 = 31.8$ hours']
    source: {cite: mit, at: 'Problem 2(b) (our own addition)'}
    origin: page-own

  # ---- Problem 3(a), (b): the angular velocity from dU/dt along a path with constant rates. The body components are
  # read off U (dU/dt)ᵀ and the fixed components off (dU/dt)ᵀ U (both antisymmetric matrices), each compared with the
  # sheet's formula.

  - id: p3a-x
    kind: identity
    where: 'Problem 3(a): ω_x′ = φ̇ sin θ sin ψ + θ̇ cos ψ against U (dU/dt)ᵀ'
    formula: dph*sin(th)*sin(ps) + dth*cos(ps)
    equals: (sin(th)*sin(ph))*deriv('-sin((ps + dps*q))*cos((ph + dph*q)) - cos((th + dth*q))*sin((ph + dph*q))*cos((ps + dps*q))', 'q', 0) + (-sin(th)*cos(ph))*deriv('-sin((ps + dps*q))*sin((ph + dph*q)) + cos((th + dth*q))*cos((ph + dph*q))*cos((ps + dps*q))', 'q', 0) + (cos(th))*deriv('cos((ps + dps*q))*sin((th + dth*q))', 'q', 0)
    samples: &eul
      ph: [0.4, 1.3, 2.9, 5.0]
      th: [1.1, 0.3, 2.5, 1.7]
      ps: [2.0, 4.1, 0.6, 3.3]
      dph: [0.7, -1.2, 0.4, 2.0]
      dth: [-0.3, 0.8, 1.5, -0.6]
      dps: [1.3, 0.5, -0.9, 0.2]
    tolerance: 1e-6
    shown: ['\omega_{x''} &= \dot\phi\sin\theta\sin\psi + \dot\theta\cos\psi']
    source: {cite: mit, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3a-y
    kind: identity
    where: 'Problem 3(a): ω_y′ = φ̇ sin θ cos ψ − θ̇ sin ψ against U (dU/dt)ᵀ'
    formula: dph*sin(th)*cos(ps) - dth*sin(ps)
    equals: (cos(ps)*cos(ph) - cos(th)*sin(ph)*sin(ps))*deriv('sin((th + dth*q))*sin((ph + dph*q))', 'q', 0) + (cos(ps)*sin(ph) + cos(th)*cos(ph)*sin(ps))*deriv('-sin((th + dth*q))*cos((ph + dph*q))', 'q', 0) + (sin(ps)*sin(th))*deriv('cos((th + dth*q))', 'q', 0)
    samples: *eul
    tolerance: 1e-6
    shown: ['\omega_{y''} &= \dot\phi\sin\theta\cos\psi - \dot\theta\sin\psi']
    source: {cite: mit, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3a-z
    kind: identity
    where: 'Problem 3(a): ω_z′ = φ̇ cos θ + ψ̇ against U (dU/dt)ᵀ'
    formula: dph*cos(th) + dps
    equals: (-sin(ps)*cos(ph) - cos(th)*sin(ph)*cos(ps))*deriv('cos((ps + dps*q))*cos((ph + dph*q)) - cos((th + dth*q))*sin((ph + dph*q))*sin((ps + dps*q))', 'q', 0) + (-sin(ps)*sin(ph) + cos(th)*cos(ph)*cos(ps))*deriv('cos((ps + dps*q))*sin((ph + dph*q)) + cos((th + dth*q))*cos((ph + dph*q))*sin((ps + dps*q))', 'q', 0) + (cos(ps)*sin(th))*deriv('sin((ps + dps*q))*sin((th + dth*q))', 'q', 0)
    samples: *eul
    tolerance: 1e-6
    shown: ['\omega_{z''} &= \dot\phi\cos\theta + \dot\psi']
    source: {cite: mit, at: 'Problem 3(a), p. 3'}
    origin: mit

  - id: p3b-x
    kind: identity
    where: 'Problem 3(b): ω_x = θ̇ cos φ + ψ̇ sin θ sin φ against (dU/dt)ᵀ U'
    formula: dth*cos(ph) + dps*sin(th)*sin(ph)
    equals: deriv('sin((ps + dps*q))*sin((th + dth*q))', 'q', 0)*(cos(ps)*sin(ph) + cos(th)*cos(ph)*sin(ps)) + deriv('cos((ps + dps*q))*sin((th + dth*q))', 'q', 0)*(-sin(ps)*sin(ph) + cos(th)*cos(ph)*cos(ps)) + deriv('cos((th + dth*q))', 'q', 0)*(-sin(th)*cos(ph))
    samples: *eul
    tolerance: 1e-6
    shown: ['\omega_x &= \dot\theta\cos\phi + \dot\psi\sin\theta\sin\phi']
    source: {cite: mit, at: 'Problem 3(b), p. 3'}
    origin: mit

  - id: p3b-y
    kind: identity
    where: 'Problem 3(b): ω_y = θ̇ sin φ − ψ̇ sin θ cos φ against (dU/dt)ᵀ U'
    formula: dth*sin(ph) - dps*sin(th)*cos(ph)
    equals: deriv('cos((ps + dps*q))*cos((ph + dph*q)) - cos((th + dth*q))*sin((ph + dph*q))*sin((ps + dps*q))', 'q', 0)*(sin(ps)*sin(th)) + deriv('-sin((ps + dps*q))*cos((ph + dph*q)) - cos((th + dth*q))*sin((ph + dph*q))*cos((ps + dps*q))', 'q', 0)*(cos(ps)*sin(th)) + deriv('sin((th + dth*q))*sin((ph + dph*q))', 'q', 0)*(cos(th))
    samples: *eul
    tolerance: 1e-6
    shown: ['\omega_y &= \dot\theta\sin\phi - \dot\psi\sin\theta\cos\phi']
    source: {cite: mit, at: 'Problem 3(b), p. 3'}
    origin: mit

  - id: p3b-z
    kind: identity
    where: 'Problem 3(b): ω_z = ψ̇ cos θ + φ̇ against (dU/dt)ᵀ U'
    formula: dps*cos(th) + dph
    equals: deriv('cos((ps + dps*q))*sin((ph + dph*q)) + cos((th + dth*q))*cos((ph + dph*q))*sin((ps + dps*q))', 'q', 0)*(cos(ps)*cos(ph) - cos(th)*sin(ph)*sin(ps)) + deriv('-sin((ps + dps*q))*sin((ph + dph*q)) + cos((th + dth*q))*cos((ph + dph*q))*cos((ps + dps*q))', 'q', 0)*(-sin(ps)*cos(ph) - cos(th)*sin(ph)*cos(ps)) + deriv('-sin((th + dth*q))*cos((ph + dph*q))', 'q', 0)*(sin(th)*sin(ph))
    samples: *eul
    tolerance: 1e-6
    shown: ['\omega_z &= \dot\psi\cos\theta + \dot\phi']
    source: {cite: mit, at: 'Problem 3(b), p. 3'}
    origin: mit

  - id: p3b-length
    kind: identity
    where: 'Problem 3(b), check: |ω|² from the fixed components equals φ̇² + θ̇² + ψ̇² + 2φ̇ψ̇ cos θ'
    formula: (dth*cos(ph) + dps*sin(th)*sin(ph))**2 + (dth*sin(ph) - dps*sin(th)*cos(ph))**2 + (dps*cos(th) + dph)**2
    equals: dph**2 + dth**2 + dps**2 + 2*dph*dps*cos(th)
    samples: *eul
    tolerance: 1e-12
    shown: ['$|\vec\omega|^2 = \dot\phi^2 + \dot\theta^2 + \dot\psi^2 + 2\dot\phi\dot\psi\cos\theta$']
    source: {cite: mit, at: 'Problem 3(b) (our own check)'}
    origin: page-own

  # ---- Problem 3(c): ∂T/∂ψ against a numerical derivative of T(ψ) with φ̇, θ̇, ψ̇ and θ held fixed

  - id: p3c-dtdpsi
    kind: identity
    answer: p3c-dtdpsi
    where: 'Problem 3(c), answer box: (I₁ − I₂) ω₁ ω₂ against dT/dψ numerical, with ω₁, ω₂, ω₃ from Problem 3(a); the samples w1, w2 are ω₁, ω₂ of Problem 3(a) at the sampled angles and rates'
    formula: (I1-I2)*w1*w2
    equals: deriv('0.5*I1*(dph*sin(th)*sin(q) + dth*cos(q))**2 + 0.5*I2*(dph*sin(th)*cos(q) - dth*sin(q))**2 + 0.5*I3*(dph*cos(th) + dps)**2', 'q', ps)
    samples:
      I1: [1.0, 1.5, 2.0, 1.2]
      I2: [3.0, 3.5, 4.0, 3.1]
      I3: [2.0, 5.0, 2.5, 4.0]
      ph: [0.4, 1.3, 2.9, 5.0]
      th: [1.1, 0.3, 2.5, 1.7]
      ps: [2.0, 4.1, 0.6, 3.3]
      dph: [0.7, -1.2, 0.4, 2.0]
      dth: [-0.3, 0.8, 1.5, -0.6]
      dps: [1.3, 0.5, -0.9, 0.2]
      w1: [0.6921048424545231, -0.1696782520650173, 1.3731725390464729, 0.2796261541808042]
      w2: [0.013178041529737006, 0.8584681986196064, -0.649387560068412, -2.0531452941905926]
    tolerance: 1e-6
    shown: ['id="p3c-dtdpsi"', '= (I_1 - I_2)\,\omega_1\omega_2']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  # ---- Problem 4: disk (M, R) with m = 3M/8 at (R, R, 0); A at the origin, centre at (0, R, 0)

  - id: p4a-disk
    kind: identity
    answer: p4a-disk
    where: 'Problem 4(a), answer box: the disk about a diameter, MR²/4, against the integral of σ y² over the disk (rings of radius q, ∫ y² over the ring = π q³ dq)'
    formula: 1/4*M*R**2
    equals: integrate('M/(pi*R**2)*pi*q**3', 'q', 0, R)
    samples:
      M: [1, 2.5, 1.7]
      R: [1, 0.6, 1.9]
    tolerance: 1e-9
    shown: ['id="p4a-disk"', 'I^{\text{disk}}_{\text{centre}} = \frac{MR^2}{4}']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4a-disk-zz
    kind: identity
    where: 'Problem 4(a), solution: I_zz of the disk about its centre, MR²/2, against the integral over rings'
    formula: 1/2*M*R**2
    equals: integrate('M/(pi*R**2)*2*pi*q**3', 'q', 0, R)
    samples:
      M: [1, 2.5]
      R: [1, 0.6]
    tolerance: 1e-9
    shown: ['= \frac12 MR^2$']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4a-xx
    kind: identity
    answer: p4a-xx
    where: 'Problem 4(a), answer box: I_xx about A, 13MR²/8, against the sum of the disk (integral of σ y² over the disk at height R + y'') and m y² of the point mass'
    formula: 13/8*M*R**2
    equals: integrate('M/(pi*R**2)*(pi*q**3 + 2*pi*q*R**2)', 'q', 0, R) + 3*M/8*R**2
    samples:
      M: [1, 2.5, 1.7]
      R: [1, 0.6, 1.9]
    tolerance: 1e-9
    shown: ['id="p4a-xx"', '13 & -3 & 0']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4a-xy
    kind: identity
    answer: p4a-xy
    where: 'Problem 4(a), answer box: I_xy about A, −3MR²/8, against −m x y for the point mass at (R, R) (the disk gives 0 by symmetry about the y axis)'
    formula: -3/8*M*R**2
    equals: -(3*M/8)*R*R
    samples:
      M: [1, 2.5, 1.7]
      R: [1, 0.6, 1.9]
    tolerance: 1e-12
    shown: ['id="p4a-xy"', '-3 & 5 & 0']
    source: {cite: mit, at: 'Problem 4(a) (our own solution)'}
    origin: page-own

  - id: p4a-flat
    where: 'Problem 4(a), check: I_zz = I_xx + I_yy in units of MR²/8'
    formula: 13 + 5
    expected: '18'
    shown: ['$13 + 5 = 18$']
    source: {cite: mit, at: 'Problem 4(a) (our own check)'}
    origin: page-own

  - id: p4b-small
    answer: p4b-small
    where: 'Problem 4(b), answer box: the smaller root of det(I − λ) in the xy block, in units of MR², by root finding'
    formula: solve('(13/8 - q)*(5/8 - q) - 9/64', 'q', 0, 1)
    expected: '0.5'
    shown: ['id="p4b-small"', 'the principal moments are $0.5$, $1.75$ and $2.25$']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4b-mid
    answer: p4b-mid
    where: 'Problem 4(b), answer box: the larger root of det(I − λ) in the xy block, in units of MR², by root finding'
    formula: solve('(13/8 - q)*(5/8 - q) - 9/64', 'q', 1, 2)
    expected: '1.75'
    shown: ['id="p4b-mid"', '\frac{7}{4}\ \text{or}\ \frac{1}{2}']
    source: {cite: mit, at: 'Problem 4(b) (our own solution)'}
    origin: page-own

  - id: p4b-large
    answer: p4b-large
    where: 'Problem 4(b), answer box: I_zz about A in units of MR², 18/8'
    formula: 18/8
    expected: '2.25'
    shown: ['id="p4b-large"', '$I_{zz} = \frac94 MR^2$']
