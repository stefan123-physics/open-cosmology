# Calculations on content/year-4/8.09/moment-of-inertia-tensor.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 2, Section 2.3, pp. 37-44 (printed page = PDF page + 28).
# All moments in units of m a^2 (cube and plate). Slip in the notes: (2.63) prints I2 = I3 = ma^2/12 and (2.65) carries it
# (diag(1, 1/2, 1/2) ma^2/6); the characteristic equation (2.61) and the parallel axis theorem give 11/12.
# Page's own worked example: thin square plate (mass m, side a) in the xy plane, corner at the origin.

page: content/year-4/8.09/moment-of-inertia-tensor.mdx
calcs:
  # ---------------------------------------------------------------- the notes' cube (pp. 43-44)
  - id: cube-diagonal
    where: 'eq. (2.59): I_xx = (1/a^3) int (x^2 + y^2) over the unit-free cube = 2/3 (a = 1)'
    inputs: {}
    formula: 2*integrate('x**2', 'x', 0, 1)
    expected: '0.6667'
    shown: ['= \frac{2}{3}ma^2']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.59), p. 43'}
    origin: mit

  - id: cube-product
    where: 'eq. (2.59): I_xz = (1/a^3) int (-x z) = -1/4 (a = 1)'
    inputs: {}
    formula: -integrate('x', 'x', 0, 1)**2
    expected: '-0.25'
    shown: ['= -\frac{1}{4}ma^2']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.59), p. 43'}
    origin: mit

  - id: cube-eig-single
    where: 'eq. (2.61)-(2.62): eigenvalue along (1,1,1): 2/3 - 1/4 - 1/4 = 1/6'
    inputs: {}
    formula: 2/3 - 1/4 - 1/4
    expected: '0.16667'
    shown: ['The single root is $I_1 = \lambda_1 = \tfrac{1}{6}ma^2$']
    source: {cite: reading1, at: 'Section 2.3, eqs. (2.61)-(2.62), p. 43'}
    origin: mit

  - id: cube-eig-double
    where: 'eq. (2.63) corrected: eigenvalue across the diagonal, e.g. (1,-1,0): 2/3 + 1/4 = 11/12; summary; quiz 4 choice'
    inputs: {}
    formula: 2/3 + 1/4
    expected: '0.91667'
    shown: ['I_2 = I_3 = \lambda_2 = \lambda_3 = \frac{11}{12}ma^2', '$\tfrac{11}{12}ma^2$ (twice) across it']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.63), p. 43 (corrected)'}
    origin: slip

  - id: cube-char-poly
    kind: identity
    where: 'eq. (2.61): det(I - lambda 1) for the matrix with 2/3 on the diagonal and -1/4 off it equals (11/12 - lambda)^2 (1/6 - lambda) (ma^2 = 1)'
    formula: (2/3 - l)*((2/3 - l)**2 - 1/16) - (-1/4)*((-1/4)*(2/3 - l) - (-1/4)*(-1/4)) + (-1/4)*((-1/4)*(-1/4) - (2/3 - l)*(-1/4))
    equals: (11/12 - l)**2 * (1/6 - l)
    samples: {l: [0.0, 0.3, 1.7, -2.2]}
    tolerance: 1e-12
    shown: ['\det(I - \lambda 1) = \left(\frac{11}{12}ma^2 - \lambda\right)^2\left(\frac{1}{6}ma^2 - \lambda\right) = 0']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.61), p. 43'}
    origin: mit

  - id: cube-eigvec-3
    where: 'eq. (2.64): xi(3) = (1, 1, -2): first row of I times xi(3) = 2/3 - 1/4 + 2/4 = 11/12 times the first component (1)'
    inputs: {}
    formula: 2/3*1 - 1/4*1 - 1/4*(-2)
    expected: '0.91667'
    shown: ['\vec\xi^{(3)} = (1, 1, -2)']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.64), p. 43'}
    origin: mit

  - id: cube-centre-parallel-axis
    where: 'section "Finding principal axes by solving": across the diagonal, 1/6 + 3/4 = 11/12 with R^2 = 3a^2/4'
    inputs: {}
    formula: 1/6 + (sqrt(3)/2)**2
    expected: '0.91667'
    shown: ['adds $M R^2 = \tfrac{3}{4}ma^2$, giving $\tfrac{1}{6} + \tfrac{3}{4} = \tfrac{11}{12}$ in units of $ma^2$']
    source: {cite: reading1, at: 'Section 2.3, p. 44'}
    origin: mit

  - id: cube-centre
    where: 'cube about its centre: (1/a^3) int over [-1/2, 1/2]^3 of (x^2 + y^2) = 1/6 (a = 1); quiz 4'
    inputs: {}
    formula: 2*integrate('x**2', 'x', -0.5, 0.5)
    expected: '0.16667'
    shown: ['$I^{\text{CM}} = \tfrac{1}{6}ma^2\,1$']
    source: {cite: reading1, at: 'Section 2.3, p. 44'}
    origin: mit

  - id: quiz4-edge
    where: 'quiz 4: about an edge, 1/6 + (1/sqrt 2)^2 = 2/3, equal to I_zz about the corner (2.59)'
    inputs: {}
    formula: 1/6 + (1/sqrt(2))**2
    expected: '0.6667'
    shown: ['$I = \\tfrac{1}{6}ma^2 + m\\,a^2/2 = \\tfrac{2}{3}ma^2$']
    source: {cite: reading1, at: 'Section 2.3, eqs. (2.49), (2.59), pp. 40, 43'}
    origin: page-own

  # ---------------------------------------------------------------- dumbbell (pp. 40-41)
  - id: dumbbell-L-perp-rod
    kind: identity
    where: 'section "Angular momentum": L = (0, I_yz w, I_zz w) is perpendicular to the rod (0, sin a, cos a): I_yz sin a + I_zz cos a = 0 (common factor m (r1^2 + r2^2) w dropped)'
    formula: 1 + (-sin(al)*cos(al))*sin(al) + sin(al)**2*cos(al)
    equals: 1
    samples: {al: [0.3, 0.9, 1.4]}
    tolerance: 1e-12
    shown: ['In fact $\vec L \propto (0, -\cos\alpha, \sin\alpha)$ is perpendicular to the rod']
    source: {cite: reading1, at: 'Section 2.3, eqs. (2.52)-(2.53), p. 41'}
    origin: page-own

  - id: dumbbell-Izz
    kind: identity
    where: 'eq. (2.52): I_zz = m(x1^2 + y1^2) + m(x2^2 + y2^2) with the positions (2.51) equals m (r1^2 + r2^2) sin^2 alpha'
    formula: m*(0 + (r1*sin(al))**2) + m*(0 + (r2*sin(al))**2)
    equals: m*(r1**2 + r2**2)*sin(al)**2
    samples: {m: [1.0, 2.5], r1: [0.4, 1.2], r2: [0.9, 0.3], al: [0.5, 1.1]}
    tolerance: 1e-12
    shown: ['I_{zz} &= m(r_1^2 + r_2^2)\sin^2\alpha']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.52), p. 41'}
    origin: mit

  - id: dumbbell-Iyz
    kind: identity
    where: 'eq. (2.52): I_yz = m(-y1 z1 - y2 z2) equals -m (r1^2 + r2^2) sin alpha cos alpha'
    formula: m*(-(r1*sin(al))*(r1*cos(al)) - (-r2*sin(al))*(-r2*cos(al)))
    equals: -m*(r1**2 + r2**2)*sin(al)*cos(al)
    samples: {m: [1.0, 2.5], r1: [0.4, 1.2], r2: [0.9, 0.3], al: [0.5, 1.1]}
    tolerance: 1e-12
    shown: ['I_{yz} &= -m(r_1^2 + r_2^2)\sin\alpha\cos\alpha']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.52), p. 41'}
    origin: mit

  # ---------------------------------------------------------------- page's own example: the square plate
  - id: plate-Ixx
    where: 'worked example: I_xx = (1/a^2) int int y^2 = 1/3 (a = 1); quiz 2'
    inputs: {}
    formula: integrate('y**2', 'y', 0, 1)
    expected: '0.3333'
    shown: ['= \tfrac{1}{3}ma^2$, and likewise']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.38), p. 38'}
    origin: page-own

  - id: plate-Izz
    where: 'worked example: I_zz = (1/a^2) int int (x^2 + y^2) = 2/3'
    inputs: {}
    formula: 2*integrate('y**2', 'y', 0, 1)
    expected: '0.6667'
    shown: ['= \tfrac{2}{3}ma^2$. The only non-zero product']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.38), p. 38'}
    origin: page-own

  - id: plate-Ixy
    where: 'worked example and quiz 2: I_xy = -(1/a^2) int int x y = -1/4'
    inputs: {}
    formula: -integrate('x', 'x', 0, 1)**2
    expected: '-0.25'
    shown: ['= -\tfrac{1}{4}ma^2$, since']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.38), p. 38'}
    origin: page-own

  - id: plate-diag
    where: 'worked example and quiz 2: in-plane principal moment along (1,1): 1/3 - 1/4 = 1/12; plot point at 45 deg'
    inputs: {}
    formula: 1/3 - 1/4
    expected: '0.0833'
    shown: ['= \tfrac{1}{12}ma^2$ along the diagonal', '{ x: 45, y: 0.0833']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.57), p. 42'}
    origin: page-own

  - id: plate-across
    where: 'worked example and quiz 2: along (1,-1): 1/3 + 1/4 = 7/12; plot point at 135 deg'
    inputs: {}
    formula: 1/3 + 1/4
    expected: '0.5833'
    shown: ['= \tfrac{7}{12}ma^2$ across it', '{ x: 135, y: 0.5833']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.57), p. 42'}
    origin: page-own

  - id: plate-perp-axis
    where: 'worked example: 1/12 + 7/12 = 2/3 = I_zz'
    inputs: {}
    formula: 1/12 + 7/12
    expected: '0.6667'
    shown: ['The two in-plane moments add up to $I_3$']
    source: {cite: reading1, at: 'Section 2.3, p. 42'}
    origin: page-own

  - id: plate-cm-xx
    where: 'worked example "Check": correction M(R^2 - R_x^2) = 1/2 - 1/4 = 1/4; I_CM,xx = 1/3 - 1/4 = 1/12'
    inputs: {}
    formula: 1/3 - (1/2 - 1/4)
    expected: '0.0833'
    shown: ['$I^{\text{CM}}_{xx} = \tfrac{1}{3} - \tfrac{1}{4} = \tfrac{1}{12}$']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.49), p. 40'}
    origin: page-own

  - id: plate-cm-xy
    where: 'worked example "Check": I_CM,xy = -1/4 - (-R_x R_y) = -1/4 + 1/4 = 0 (shifted by 1)'
    inputs: {}
    formula: 1 + (-1/4 + 1/2*1/2)
    expected: '1'
    tolerance: 1e-12
    shown: ['$I^{\text{CM}}_{xy} = -\tfrac{1}{4} + \tfrac{1}{4} = 0$']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.49), p. 40'}
    origin: page-own

  - id: plate-line-moment
    kind: identity
    where: 'plot formula: n.I.n with n = (cos b, sin b, 0) equals 1/3 - (1/4) sin 2b'
    formula: 1/3*cos(b)**2 + 1/3*sin(b)**2 + 2*(-1/4)*sin(b)*cos(b)
    equals: 1/3 - 1/4*sin(2*b)
    samples: {b: [0.2, 0.785, 2.0, 2.9]}
    tolerance: 1e-12
    shown: ['1/3 - (1/4)*sin(2*beta*pi/180)', 'which works out to $ma^2(\tfrac{1}{3} - \tfrac{1}{4}\sin 2\beta)$']
    source: {cite: reading1, at: 'Section 2.3, eq. (2.39), p. 38'}
    origin: page-own
