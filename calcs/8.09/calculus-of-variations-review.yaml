# Calculations on content/year-4/8.09/calculus-of-variations-review.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 1, Section 1.5 (calculus of variations), pp. 22-23.
# Page's own worked example (and quiz 2): two places at latitude 60 N (colatitude 30 degrees), 90 degrees apart in
# longitude, on a sphere of radius 6371 km.

page: content/year-4/8.09/calculus-of-variations-review.mdx
calcs:
  - id: great-circle-plane
    kind: identity
    where: 'text after "Great circles": a sin(th) times sin(phi - alpha) = beta cot(th) gives y cos(alpha) - x sin(alpha) = beta z, a plane through the centre'
    formula: a*sin(th)*sin(ph - al) - be*a*cos(th)
    equals: (a*sin(th)*sin(ph))*cos(al) - (a*sin(th)*cos(ph))*sin(al) - be*(a*cos(th))
    samples: {a: [1.0, 2.0, 6371], th: [0.4, 1.1, 2.5], ph: [0.3, 2.0, 4.0], al: [-0.785, 0.5, 1.9], be: [0.408, 1.3, -0.7]}
    tolerance: 1e-9
    shown: ['the equation of a plane through the centre of the sphere']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: great-circle-solves-el
    kind: identity
    where: 'formula "Great circles": along phi(th) = alpha + asin(beta cot th), the conserved quantity df/dphidot = sin^2 th phidot / sqrt(1 + sin^2 th phidot^2) equals the constant -beta/sqrt(1 + beta^2); checked numerically with alpha = -pi/4, beta = 0.408248 at several th'
    formula: "sin(th)**2*deriv('asin(0.408248/tan(x))', 'x', th, 1) / sqrt(1 + sin(th)**2*deriv('asin(0.408248/tan(x))', 'x', th, 1)**2)"
    equals: -0.408248/sqrt(1 + 0.408248**2)
    samples: {th: [0.45, 0.8, 1.2]}
    tolerance: 1e-5
    shown: ['tex="\sin(\phi - \alpha) = \beta\cot\theta"']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: mit

  - id: parallel-length
    where: 'worked example step "Along the parallel": sin(30 deg) pi/2, in units of a'
    inputs: {}
    formula: sin(pi/6)*pi/2
    expected: '0.785'
    shown: ['a\sin 30^\circ \times \pi/2 = 0.785a', '= 0.785a$']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.79), p. 22'}
    origin: page-own

  - id: parallel-km
    where: 'worked example step "Along the parallel": the distance on a 6371 km sphere'
    inputs: {a: 6371 km}
    formula: a*sin(pi/6)*pi/2
    expected: 5004 km
    shown: ['= 5004$ km']
    source: {cite: reading1, at: 'Section 1.5, eq. (1.79), p. 22'}
    origin: page-own

  - id: beta-value
    where: 'worked example step "The great circle": beta = cos 45 deg / sqrt 3; also the plot curve and caption'
    inputs: {}
    formula: cos(pi/4)/sqrt(3)
    expected: '0.408'
    shown: ['$\beta = \cos 45^\circ/\sqrt3 = 0.408$', '0.408248', 'β = 0.408']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: central-angle-cos
    where: 'worked example step "The great circle": cos c'
    inputs: {}
    formula: cos(pi/6)**2 + sin(pi/6)**2*cos(pi/2)
    expected: '0.75'
    shown: ['\cos 90^\circ = 0.75$']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: central-angle
    where: 'worked example step "The great circle" and quiz 2: c = arccos(0.75)'
    inputs: {}
    formula: acos(0.75)
    expected: '0.723'
    shown: ['so $c = 0.723$ rad and the route', 'so $c = 0.723$ rad and the distance']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: great-circle-km
    where: 'worked example step "The great circle": the route length'
    inputs: {a: 6371 km}
    formula: a*acos(0.75)
    expected: 4605 km
    shown: ['$0.723a = 4605$ km']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: saving-km
    where: 'worked example step "The great circle": about 400 km shorter'
    inputs: {a: 6371 km}
    formula: a*(sin(pi/6)*pi/2 - acos(0.75))
    expected: 400 km
    tolerance: 5 km
    shown: ['about 400 km shorter']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: route-ratio
    where: 'quiz 2: parallel route over great-circle route'
    inputs: {}
    formula: (sin(pi/6)*pi/2)/acos(0.75)
    expected: '1.09'
    shown: ['The ratio is 1.09']
    quiz: 1
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: northmost-colatitude
    where: 'worked example step "How far north": theta = arctan(beta)'
    inputs: {}
    formula: atan(cos(pi/4)/sqrt(3))*180/pi
    expected: '22.2'
    shown: ['$\theta = \arctan 0.408 = 22.2^\circ$']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: northmost-latitude
    where: 'worked example step "How far north", plot point (45, 67.79): latitude 90 - 22.2'
    inputs: {}
    formula: 90 - atan(cos(pi/4)/sqrt(3))*180/pi
    expected: '67.79'
    shown: ['latitude 67.8° N', '{ x: 45, y: 67.79, label: "67.8° N" }']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own

  - id: northmost-excess
    where: 'worked example step "How far north": nearly 8 degrees north of the cities'
    inputs: {}
    formula: 30 - atan(cos(pi/4)/sqrt(3))*180/pi
    expected: '7.8'
    shown: ['nearly 8° north of the two cities']
    source: {cite: reading1, at: 'Section 1.5, p. 23'}
    origin: page-own
