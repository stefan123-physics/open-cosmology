# Calculations on content/year-4/8.09/8-09-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# the energy built from x = a tan θ and Pythagoras (Problem 1(a)), the expansion as a numerical small-amplitude
# limit (Problems 1(b), 2(a)), the curvature of the potential in x (Problem 1(b)), the standard frequency shift of an
# oscillator with an x⁴ term and a numerical period of the full potential (Problem 1(c)), numerical integrals of the
# rates and numerical averages over a period (Problem 2), the exact frequency of the pendulum from the complete
# elliptic integral (Problem 2(d)), Bernoulli and continuity solved numerically and the projectile's motion in time
# (Problem 3), the flux tensor built from T_ij (Problem 4(a)) and zero vorticity of the vortex (Problem 4(b)).
# Short names in the samples: z, u and s are variables of a numerical derivative, integral or root; th for θ,
# w for ω, w1 for θ̇₁, Js a small action used for a limit.

page: content/year-4/8.09/8-09-problem-set-7.mdx
calcs:
  # ---- Problem 1

  - id: p1a-h
    kind: identity
    answer: p1a-h
    where: 'Problem 1(a), answer box: H against ½mẋ² + 2·½k(ℓ − b)² with x = a tan θ, ẋ = (dx/dθ)θ̇, θ̇ = p_θ/(m (dx/dθ)²) and the spring length ℓ = √(a² + x²) (Pythagoras)'
    formula: p**2*cos(theta)**4/(2*m*a**2) + k*(a/cos(theta) - b)**2
    equals: m/2*(deriv('a*tan(z)', 'z', theta)*p/(m*deriv('a*tan(z)', 'z', theta)**2))**2 + 2*(k/2)*(sqrt(a**2 + (a*tan(theta))**2) - b)**2
    samples:
      theta: [0.15, 0.35, 0.55]
      p: [0.6, 1.2, 1.9]
      m: [0.7, 1.3, 1.8]
      a: [2.1, 2.5, 2.9]
      k: [0.6, 1.1, 1.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-6
    shown: ['id="p1a-h"']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1b-dh
    kind: identity
    answer: p1b-dh
    where: 'Problem 1(b), answer box: ΔH against [H − H₀](sθ, sp_θ)/s⁴ at s = 0.02 (the fourth-order part, by a numerical small-amplitude limit)'
    formula: -theta**2*p**2/(m*a**2) + k*a*(8*a - 5*b)*theta**4/12
    equals: (((0.02*p)**2*cos(0.02*theta)**4/(2*m*a**2) + k*(a/cos(0.02*theta) - b)**2) - (k*(a - b)**2 + (0.02*p)**2/(2*m*a**2) + k*a*(a - b)*(0.02*theta)**2))/0.02**4
    samples:
      theta: [0.15, 0.35, 0.55]
      p: [0.6, 1.2, 1.9]
      m: [0.7, 1.3, 1.8]
      a: [2.1, 2.5, 2.9]
      k: [0.6, 1.1, 1.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-4
    shown: ['id="p1b-dh"', '\Delta H = -\frac{\theta^2p_\theta^2}{ma^2} + \frac{ka(8a - 5b)}{12}\,\theta^4']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-coef
    kind: identity
    where: 'Problem 1(b), solution: a²/4 + 5a(a − b)/12 = a(8a − 5b)/12'
    formula: a**2/4 + 5*a*(a - b)/12
    equals: a*(8*a - 5*b)/12
    samples:
      a: [2.1, 2.5, 2.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-12
    shown: ['a^2/4 + 5a(a - b)/12 = a(8a - 5b)/12']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1b-w0
    kind: identity
    answer: p1b-w0
    where: 'Problem 1(b), answer box: ω₀² against the curvature of V(x) = k(√(a² + x²) − b)² at x = 0, divided by m'
    formula: 2*k*(a - b)/(m*a)
    equals: deriv('k*(sqrt(a**2 + z**2) - b)**2', 'z', 0, 2)/m
    samples:
      m: [0.7, 1.3, 1.8]
      a: [2.1, 2.5, 2.9]
      k: [0.6, 1.1, 1.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-5
    shown: ['id="p1b-w0"', 'whose curvature at $x = 0$ is $2k(1 - b/a)$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1c-bracket
    kind: identity
    where: 'Problem 1(c), solution: the bracket of ΔH averages to −1/8 + 3(8a − 5b)/(192(a − b)) = 3b/(64(a − b)), by a numerical average over the angle'
    formula: 3*b/(64*(a - b))
    equals: integrate('-sin(z)**2*cos(z)**2 + (8*a - 5*b)/(24*(a - b))*sin(z)**4', 'z', 0, 2*pi)/(2*pi)
    samples:
      a: [2.1, 2.5, 2.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-9
    shown: ['-\frac18 + \frac{3(8a - 5b)}{192(a - b)} = \frac{3b}{64(a - b)}']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-dh-aa
    kind: identity
    where: 'Problem 1(c), solution: ΔH in action-angle variables equals ΔH(θ, p_θ) with θ = √(J/(πIω₀)) sin φ, p_θ = √(IJω₀/π) cos φ'
    formula: J**2/(pi**2*m*a**2)*(-sin(z)**2*cos(z)**2 + (8*a - 5*b)/(24*(a - b))*sin(z)**4)
    equals: -(J/(pi*m*a**2*sqrt(2*k*(a - b)/(m*a)))*sin(z)**2)*(m*a**2*J*sqrt(2*k*(a - b)/(m*a))/pi*cos(z)**2)/(m*a**2) + k*a*(8*a - 5*b)/12*(J/(pi*m*a**2*sqrt(2*k*(a - b)/(m*a)))*sin(z)**2)**2
    samples:
      J: [0.6, 1.2, 1.8]
      z: [0.4, 1.3, 2.6]
      m: [0.7, 1.3, 1.8]
      a: [2.1, 2.5, 2.9]
      k: [0.6, 1.1, 1.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-9
    shown: ['\Delta H = \frac{J^2}{\pi^2 I}\left[-\sin^2\phi\cos^2\phi + \frac{8a - 5b}{24(a - b)}\,\sin^4\phi\right]']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-dnu
    kind: identity
    answer: p1c-dnu
    where: 'Problem 1(c), answer box: the frequency shift against the standard first-order shift of an oscillator with a λx⁴ term, Δω/ω₀ = 3λA²/(2mω₀²), with λ = kb/(4a³) from the potential in x, A² = 2E/(mω₀²) and E = νJ₀ (a route that does not use action-angle variables)'
    formula: 3*b*J/(32*pi**2*m*a**2*(a - b))
    equals: sqrt(2*k*(a - b)/(m*a))/(2*pi)*3*(k*b/(4*a**3))*(2*(sqrt(2*k*(a - b)/(m*a))/(2*pi)*J)/(m*2*k*(a - b)/(m*a)))/(2*m*2*k*(a - b)/(m*a))
    samples:
      J: [0.6, 1.2, 1.8]
      m: [0.7, 1.3, 1.8]
      a: [2.1, 2.5, 2.9]
      k: [0.6, 1.1, 1.9]
      b: [0.6, 1.0, 1.4]
    tolerance: 1e-9
    shown: ['id="p1c-dnu"', '\Delta\omega/\omega_0 = 3\lambda A^2/(2m\omega_0^2)']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

  - id: p1c-rel
    kind: identity
    answer: p1c-rel
    where: 'Problem 1(c), answer box: the relative shift against the exact period of the full potential V(x) = k(√(a² + x²) − b)² − k(a − b)² at the small energy 0.001, scaled linearly in E. With x = A sin u (A the turning point, a numerical root of V(A) = E) the period is T = 4∫₀^{π/2} √(m(S₁ + S₂)/(2k(S₁ + S₂ − 2b))) du, S₁ = √(a² + A²), S₂ = √(a² + A² sin²u), an exact rewriting of 4∫dx/ẋ that has no singular end point; tolerance for the neglected E² terms'
    formula: 3*b*E/(16*k*a*(a - b)**2)
    equals: E*((1/(4*integrate('sqrt(m*(sqrt(a**2 + solve("k*(sqrt(a**2 + s**2) - b)**2 - k*(a - b)**2 - 0.001", "s", 0, 10)**2) + sqrt(a**2 + (solve("k*(sqrt(a**2 + s**2) - b)**2 - k*(a - b)**2 - 0.001", "s", 0, 10)*sin(u))**2))/(2*k*(sqrt(a**2 + solve("k*(sqrt(a**2 + s**2) - b)**2 - k*(a - b)**2 - 0.001", "s", 0, 10)**2) + sqrt(a**2 + (solve("k*(sqrt(a**2 + s**2) - b)**2 - k*(a - b)**2 - 0.001", "s", 0, 10)*sin(u))**2) - 2*b)))', 'u', 0, pi/2))/(sqrt(2*k*(a - b)/(m*a))/(2*pi)) - 1)/0.001)
    samples:
      E: [0.6, 1.4]
      m: [1.3, 1.3]
      a: [2.5, 2.5]
      k: [1.1, 1.1]
      b: [1.0, 1.0]
    tolerance: 1e-2
    shown: ['id="p1c-rel"', 'A numerical period of the full potential at small energy gives the same relative shift']
    source: {cite: mit, at: 'Problem 1(c) (our own solution)'}
    origin: page-own

