      a: [1, 0.5, 1.5, 0.8]
      x0: [1, 0.5, 2, 1.3]
    tolerance: 1e-4
    shown: ['id="p4d-nu0"', '\nu_0 = \frac{1}{2\pi}\sqrt{\frac{2a}{m x_0^2}} = \frac{1}{\pi x_0}\sqrt{\frac{a}{2m}}']
    source: {cite: mit, at: 'Problem 4(d), p. 3 (our own solution)'}
    origin: page-own

  - id: p4d-limit
    kind: identity
    where: 'Problem 4(d), cross check: the frequency of (c), √(E/2m)/(πx₀), at E = a equals ν₀'
    formula: 'sqrt(a/(2*m))/(pi*x0)'
    equals: 'sqrt(E/(2*m))/(pi*x0)'
    samples:
      m: [1, 0.5, 2]
      a: [1, 0.5, 1.5]
      E: [1, 0.5, 1.5]
      x0: [1, 0.5, 2]
