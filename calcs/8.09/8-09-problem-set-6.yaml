# Calculations on content/year-4/8.09/8-09-problem-set-6.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every answer is checked here by a route independent of the page:
# the unexpanded Hamiltonian (1(a)), p_θ = 0 solved for θ̇ and the curvature of the radial potential (1(b)),
# the Hamilton-Jacobi residual and the integral of −f²/2m (2(a)), integrating the velocity (2(b)), numerical
# integrals of ∮ p dx and of the period ∮ dx/ẋ (3, 4(c)), a numerical second derivative of V (4(d)), the energy
# from the sheet's map (w, J) → (x, p) (5(a)), ∮ p dx of one oscillator (5(b)) and derivatives of the generating
# function (5(c)).
# Outside this file, while writing (SciPy, .venv): a direct integration of Newton's equation with the Lorentz force
# (solve_ivp, rtol 1e-11) for e = 1.3, B = 0.9, k = 2.0, m = 0.8, r(0) = 0.5, ṙ(0) = 0.3 and p_θ = 0 agrees with
# the motion of Problem 1(b) to 1e-11 at t = 1, 3 and 5; SymPy confirms the Hamilton-Jacobi residual of 2(a) is zero.
# Short names: al = α or α_θ, w1, w2, w3 = w₁, w₂, w₃, Ja, Jb, Jc = J_a, J_b, J_c, x0 = x₀, v0 = v₀,
# q, z, u the variables of a numerical derivative, integral or root, r0 a sample radius.

page: content/year-4/8.09/8-09-problem-set-6.mdx
calcs:
  # ---- Problem 1
  - id: p1a-wr
    kind: identity
    answer: p1a-wr
    where: 'Problem 1(a), answer box: (∂W_r/∂r)² against 2m(E − ½kr²) − (α_θ/r − eBr/2)², the Hamiltonian before expanding the square'
    formula: '2*m*E + e*B*al - al**2/r**2 - (m*k + e**2*B**2/4)*r**2'
    equals: '2*m*(E - k*r**2/2) - (al/r - e*B*r/2)**2'
    samples:
      m: [1, 0.5, 2, 1.3]
      E: [5, 10, 7, 6]
      k: [1, 0.5, 2, 1.5]
      e: [1, 0.5, 1.5, 1.2]
      B: [1, 1.5, 0.5, 0.8]
      r: [1, 0.5, 1.5, 0.8]
      al: [1, 2, 0.5, 1.4]
    tolerance: 1e-12
    shown: ['id="p1a-wr"', 'W = \alpha_\theta\theta + \int\sqrt{2mE + eB\alpha_\theta - \frac{\alpha_\theta^2}{r^2} - \left(mk + \frac{e^2B^2}{4}\right)r^2}\;dr']
    source: {cite: mit, at: 'Problem 1(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p1b-rate
    kind: identity
    answer: p1b-rate
    where: 'Problem 1(b), answer box: θ̇ = −eB/(2m) against the root of p_θ = mr²θ̇ + eBr²/2 = 0'
    formula: '-e*B/(2*m)'
    equals: 'solve(''m*r0**2*q + e*B*r0**2/2'', ''q'', -100, 100)'
    samples:
      e: [1, 0.5, 2, 1.3]
      B: [1, 2, 0.5, 0.7]
      m: [1, 0.5, 2, 1.6]
      r0: [1, 0.3, 2, 0.8]
    tolerance: 1e-9
    shown: ['id="p1b-rate"', '\theta = \theta_0 - \frac{eB}{2m}\,t']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1b-freq
    kind: identity
    answer: p1b-freq
    where: 'Problem 1(b), answer box: Ω against √(U′(r)/(mr)) for the radial potential U = (α_θ/r − eBr/2)²/2m + ½kr² at α_θ = 0, by a numerical derivative'
    formula: 'sqrt(k/m + e**2*B**2/(4*m**2))'
    equals: 'sqrt(deriv(''(0/q - e*B*q/2)**2/(2*m) + k*q**2/2'', ''q'', r0)/(m*r0))'
    samples:
      k: [1, 0.5, 2, 1.4]
      m: [1, 0.5, 2, 0.9]
      e: [1, 2, 0.5, 1.1]
      B: [1, 0.5, 2, 1.7]
      r0: [1, 0.5, 1.5, 0.7]
    tolerance: 1e-6
    shown: ['id="p1b-freq"', '\Omega = \sqrt{\frac{k}{m} + \frac{e^2B^2}{4m^2}}']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1b-ode
    kind: fact
    where: 'Problem 1(b), check: our numerical solution of Newton''s equation with the Lorentz force agrees with the formulas (computed with SciPy while writing; see the header of this file)'
    shown: ['A direct numerical solution of Newton''s equation with the Lorentz force agrees with these formulas']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own check)'}
    origin: page-own

  - id: p1b-plot
    kind: fact
    where: 'Problem 1(b), graph: our own ratio of rates eB/(2m) = 0.15 Ω; the curve runs over Ωt from 0 to π/0.15 = 20.944, half a turn of the line'
    shown: ['eB/(2m) = 0.15 Ω and eB > 0', 'range: [0, 20.944]']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own graph)'}
    origin: page-own

  - id: p1b-plot-range
