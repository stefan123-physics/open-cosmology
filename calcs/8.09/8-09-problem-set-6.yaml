      x: [1.7, 1.6, 1.8, 1.65]
      x0: [1.1, 1, 1.2, 1.05]
    tolerance: 1e-9
    shown: ['id="p4a-dw"', 'W(x, E) = \pm\int\sqrt{2m\left(E - \frac{a}{\sin^2(x/x_0)}\right)}\;dx']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4c-j
    kind: identity
    answer: p4c-j
    where: 'Problem 4(c), answer box: J against 2∫ √(2m(E − a/sin²(x/x₀))) dx between the turning points x₀ asin√(a/E) and x₀(π − asin√(a/E)), integrated numerically'
    formula: '2*pi*x0*sqrt(2*m)*(sqrt(E) - sqrt(a))'
    equals: '2*integrate(''sqrt(abs(2*m*(E - a/sin(q/x0)**2)))'', ''q'', x0*asin(sqrt(a/E)), x0*(pi - asin(sqrt(a/E))))'
    samples:
      m: [1, 0.5, 2, 0.7]
      E: [3, 2, 4, 2.5]
      a: [1, 0.5, 1.5, 0.8]
      x0: [1, 0.5, 2, 1.3]
    tolerance: 1e-7
    shown: ['id="p4c-j"', 'J = 2\pi x_0\sqrt{2m}\left(\sqrt E - \sqrt a\right)']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p4c-nu
    kind: identity
    answer: p4c-nu
    where: 'Problem 4(c), answer box: ν against 1/τ, with the period τ = 2∫ dx/ẋ between the turning points integrated numerically (no use of J)'
    formula: 'sqrt(E/(2*m))/(pi*x0)'
    equals: '1/(2*integrate(''1/sqrt(abs(2*(E - a/sin(q/x0)**2)/m))'', ''q'', x0*asin(sqrt(a/E)), x0*(pi - asin(sqrt(a/E)))))'
    samples:
      m: [1, 0.5, 2, 0.7]
      E: [3, 2, 4, 2.5]
      a: [1, 0.5, 1.5, 0.8]
      x0: [1, 0.5, 2, 1.3]
    tolerance: 1e-6
    shown: ['id="p4c-nu"', '\nu = \frac{\partial E}{\partial J} = \frac{2\sqrt E}{2\pi x_0\sqrt{2m}} = \frac{1}{\pi x_0}\sqrt{\frac{E}{2m}}']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p4d-nu0
    kind: identity
    answer: p4d-nu0
    where: 'Problem 4(d), answer box: ν₀ against √(V″/m)/(2π) at the bottom x = πx₀/2, with V″ a numerical second derivative of a/sin²(x/x₀)'
    formula: 'sqrt(a/(2*m))/(pi*x0)'
    equals: 'sqrt(deriv("deriv(''a/sin(z/x0)**2'', ''z'', q)", ''q'', pi*x0/2)/m)/(2*pi)'
