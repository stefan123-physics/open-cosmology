    where: 'Problem 5(b), answer box: J(x, p) against ∮ p dx = 4∫₀^{x_max} √(2m(E − kx²/2)) dx with E = p²/2m + kx²/2, integrated numerically'
    formula: 'pi*(sqrt(k*m)*x**2 + p**2/sqrt(k*m))'
