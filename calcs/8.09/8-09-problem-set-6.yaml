    formula: 'pi/0.15'
    expected: '20.944'
    tolerance: 1e-4
    shown: ['range: [0, 20.944]']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own graph)'}
    origin: page-own

  # ---- Problem 2
  - id: p2a-s
    kind: identity
    answer: p2a-s
    where: 'Problem 2(a), answer box: S against x f(t) − ∫₀ᵗ f²/(2m) dt′ with f = α + mAt′²/2, integrated numerically'
    formula: 'x*(al + m*A*t**2/2) - (al**2*t + al*m*A*t**3/3 + m**2*A**2*t**5/20)/(2*m)'
    equals: 'x*(al + m*A*t**2/2) - integrate(''(al + m*A*q**2/2)**2/(2*m)'', ''q'', 0, t)'
    samples:
      x: [1, 0.5, 2, 1.3]
      al: [1, 2, 0.5, 1.1]
      t: [1, 0.5, 2, 1.7]
      m: [1, 0.5, 2, 0.8]
      A: [1, 2, 0.5, 1.4]
    tolerance: 1e-9
    shown: ['id="p2a-s"', 'S(x, \alpha, t) = x\left(\alpha + \frac{1}{2}mAt^2\right) - \frac{1}{2m}\left(\alpha^2 t + \frac{1}{3}\alpha mAt^3 + \frac{1}{20}m^2A^2t^5\right)']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2a-hj
    kind: identity
    where: 'Problem 2(a), check: the Hamilton-Jacobi residual (∂S/∂x)²/2m − mAtx + ∂S/∂t vanishes, by numerical derivatives of S'
    formula: '0'
    equals: 'deriv(''q*(al + m*A*t**2/2) - (al**2*t + al*m*A*t**3/3 + m**2*A**2*t**5/20)/(2*m)'', ''q'', x)**2/(2*m) - m*A*t*x + deriv(''x*(al + m*A*q**2/2) - (al**2*q + al*m*A*q**3/3 + m**2*A**2*q**5/20)/(2*m)'', ''q'', t)'
    samples:
      x: [1, 0.5, 2, 1.3]
      al: [1, 2, 0.5, 1.1]
      t: [1, 0.5, 2, 1.7]
      m: [1, 0.5, 2, 0.8]
      A: [1, 2, 0.5, 1.4]
    tolerance: 1e-5
    shown: ['together they make the equation vanish']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2b-x
    kind: identity
    answer: p2b-x
    where: 'Problem 2(b), answer box: x(t) against the integral of ẋ = p/m = v₀ + At²/2 from Hamilton''s equations'
    formula: 'v0*t + A*t**3/6'
    equals: 'integrate(''v0 + A*q**2/2'', ''q'', 0, t)'
    samples:
      v0: [1, 0.5, 2, 1.2]
      A: [1, 2, 0.5, 1.6]
      t: [1, 0.5, 2, 1.4]
    tolerance: 1e-10
    shown: ['id="p2b-x"', 'x(t) = v_0 t + \frac{1}{6}At^3']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2b-beta
    kind: identity
    where: 'Problem 2(b), check: β = ∂S/∂α = x − αt/m − At³/6, by a numerical derivative of S'
    formula: 'x - al*t/m - A*t**3/6'
    equals: 'deriv(''x*(q + m*A*t**2/2) - (q**2*t + q*m*A*t**3/3 + m**2*A**2*t**5/20)/(2*m)'', ''q'', al)'
    samples:
      x: [1, 0.5, 2, 1.3]
      al: [1, 2, 0.5, 1.1]
      t: [1, 0.5, 2, 1.7]
      m: [1, 0.5, 2, 0.8]
      A: [1, 2, 0.5, 1.4]
    tolerance: 1e-6
    shown: ['Here $\beta = x - \alpha t/m - At^3/6$']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3
  - id: p3a-j
    kind: identity
    answer: p3a-j
    where: 'Problem 3(a), answer box: J against 4∫₀^{E/F} √(2m(E − Fx)) dx, integrated numerically'
    formula: '8*sqrt(2*m)*E**(3/2)/(3*F)'
    equals: '4*integrate(''sqrt(abs(2*m*(E - F*q)))'', ''q'', 0, E/F)'
    samples:
      m: [1, 0.5, 2, 1.3]
      E: [1, 0.5, 2, 1.6]
      F: [1, 2, 0.5, 0.9]
    tolerance: 1e-8
    shown: ['id="p3a-j"', 'J = 4\int_0^{E/F}\sqrt{2m(E - Fx)}\,dx = \frac{8\sqrt{2m}}{3F}\,E^{3/2}']
    source: {cite: mit, at: 'Problem 3, p. 2 (our own solution)'}
    origin: page-own

  - id: p3b-tau
    kind: identity
    answer: p3b-tau
    where: 'Problem 3(b), answer box: τ against the time ∮ dx/ẋ = 4∫₀^{E/F} dx/√(2(E − Fx)/m), integrated numerically'
    formula: '4*sqrt(2*m*E)/F'
    equals: '4*integrate(''1/sqrt(abs(2*(E - F*q)/m))'', ''q'', 0, E/F)'
    samples:
      m: [1, 0.5, 2, 1.3]
      E: [1, 0.5, 2, 1.6]
      F: [1, 2, 0.5, 0.9]
    tolerance: 1e-7
    shown: ['id="p3b-tau"', '\tau = \frac{1}{\nu} = \frac{dJ}{dE} = \frac{4\sqrt{2m}}{F}\,E^{1/2} = \frac{4\sqrt{2mE}}{F}']
    source: {cite: mit, at: 'Problem 3, p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 4
  - id: p4a-dw
    kind: identity
    answer: p4a-dw
    where: 'Problem 4(a), answer box: ∂W/∂x against the positive root p of p²/2m + a/sin²(x/x₀) = E'
    formula: 'sqrt(2*m*(E - a/sin(x/x0)**2))'
    equals: 'solve(''q**2/(2*m) + a/sin(x/x0)**2 - E'', ''q'', 0, 100)'
