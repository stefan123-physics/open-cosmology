# Calculations on content/year-4/8.09/kepler-problem-hamilton-jacobi.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.09 (Fall 2014, Stewart) lecture notes, Chapter 4, Section 4.5, pp. 79-83.
# Page's own worked example and graphs: a 1000 kg satellite, GM = 3.986e14 m^3/s^2 (k = GMm = 3.986e17 J m),
# perigee 7000 km, apogee 14000 km. GM of the Earth and its radius 6371 km are standard values (kind: fact).

page: content/year-4/8.09/kepler-problem-hamilton-jacobi.mdx
calcs:
  - id: earth-gm
    kind: fact
    where: 'worked example: GM of the Earth, 3.986e14 m^3/s^2 (standard geocentric gravitational constant)'
    value: 3.986e14 m**3/s**2
    shown: ['$GM = 3.986 \times 10^{14}$ m³/s²']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.155), p. 81'}
    origin: page-own

  - id: earth-radius
    kind: fact
    where: 'orbit graph: the Earth drawn with its mean radius, 6371 km'
    value: 6371 km
    shown: ['the Earth (radius 6371 km)']
    source: {cite: reading1, at: 'Section 4.5, p. 81'}
    origin: page-own

  - id: sat-k
    where: 'worked example: k = G M m'
    inputs: {GM: 3.986e14 m**3/s**2, m: 1000 kg}
    formula: GM * m
    expected: 3.986e17 J*m
    shown: ['$k = GMm = 3.986 \times 10^{17}$ J m']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.155), p. 81'}
    origin: page-own

  - id: sat-ecc
    where: 'worked example step "Eccentricity and the orbit''s size"; quiz 3'
    inputs: {rp: 7000 km, ra: 14000 km}
    formula: (ra - rp) / (ra + rp)
    expected: '0.3333'
    shown: ['$\varepsilon = (r_a - r_p)/(r_a + r_p) = 7000/21000 = 1/3$', '= 7000/21000 = 1/3$."']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.155), p. 81'}
    origin: page-own

  - id: sat-p
    where: 'worked example step "Eccentricity and the orbit''s size"; orbit graph: p = r_p (1 + e)'
    inputs: {rp: 7000 km}
    formula: rp * (1 + 1/3)
    expected: 9333 km
    shown: ['$p = r_p(1 + \varepsilon) = 9333$ km', 'p = ℓ²/(mk) = 9333 km']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.155), p. 81'}
    origin: page-own

  - id: sat-ell2
    where: 'worked example step "Angular momentum and energy": l^2 = m k p'
    inputs: {m: 1000 kg, k: 3.986e17 J*m, p: 9333.33 km}
    formula: m * k * p
    expected: 3.720e27 kg**2*m**4/s**2
    shown: ['= 3.720 \times 10^{27}$, so']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.155), p. 81'}
    origin: page-own

  - id: sat-ell
    where: 'worked example step "Angular momentum and energy"'
    inputs: {m: 1000 kg, k: 3.986e17 J*m, p: 9333.33 km}
    formula: sqrt(m * k * p)
    expected: 6.10e13 kg*m**2/s
    shown: ['$\ell = 6.10 \times 10^{13}$ kg m²/s']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.150), p. 79'}
    origin: page-own

  - id: sat-V-perigee
    where: 'worked example: -k/r_p'
    inputs: {k: 3.986e17 J*m, rp: 7000 km}
    formula: -k / rp
    expected: -5.694e10 J
    shown: ['$-k/r_p + \ell^2/(2mr_p^2) = -5.694 \times 10^{10}']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: sat-cent-perigee
    where: 'worked example: l^2/(2 m r_p^2)'
    inputs: {m: 1000 kg, k: 3.986e17 J*m, p: 9333.33 km, rp: 7000 km}
    formula: m * k * p / (2 * m * rp**2)
    expected: 3.796e10 J
    shown: ['+ 3.796 \times 10^{10} = -1.898 \times 10^{10}$ J']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: sat-V-apogee
    where: 'worked example: -k/r_a'
    inputs: {k: 3.986e17 J*m, ra: 14000 km}
    formula: -k / ra
    expected: -2.847e10 J
    shown: ['$-2.847 \times 10^{10} + 0.949 \times 10^{10}$']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: sat-cent-apogee
    where: 'worked example: l^2/(2 m r_a^2)'
    inputs: {m: 1000 kg, k: 3.986e17 J*m, p: 9333.33 km, ra: 14000 km}
    formula: m * k * p / (2 * m * ra**2)
    expected: 0.949e10 J
    shown: ['+ 0.949 \times 10^{10}$ gives the same']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: sat-energy
    where: 'worked example: E = -k/(r_p + r_a), equal to V_eff at both turning points; graph line'
    inputs: {k: 3.986e17 J*m, rp: 7000 km, ra: 14000 km}
    formula: -k / (rp + ra)
    expected: -1.898e10 J
    shown: ['$-3.986 \times 10^{17}/(2.1 \times 10^{7}) = -1.898 \times 10^{10}$ J', 'gives the same $-1.898 \times 10^{10}$ J']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: sat-ecc-term
    where: 'worked example step "Check with the eccentricity formula": 2 E l^2/(m k^2)'
    inputs: {m: 1000 kg, k: 3.986e17 J*m, p: 9333.33 km, rp: 7000 km, ra: 14000 km}
    formula: 2 * (-k/(rp + ra)) * (m*k*p) / (m * k**2)
    expected: '-0.889'
    shown: ['/(1000 \times (3.986 \times 10^{17})^2) = -0.889$']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.156), p. 81'}
    origin: page-own

  - id: sat-ecc-formula
    where: 'worked example step "Check with the eccentricity formula": sqrt(1 + 2 E l^2/(m k^2)) = sqrt(0.111) = 1/3'
    inputs: {m: 1000 kg, k: 3.986e17 J*m, p: 9333.33 km, rp: 7000 km, ra: 14000 km}
    formula: sqrt(1 + 2 * (-k/(rp + ra)) * (m*k*p) / (m * k**2))
    expected: '0.3333'
    shown: ['$\varepsilon = \sqrt{1 - 0.889} = \sqrt{0.111} = 1/3$']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.156), p. 81'}
    origin: page-own

  - id: graph-k-units
    where: 'V_eff graph: k = 39.86 in units of 1e10 J times 1000 km'
    inputs: {k: 3.986e17 J*m, E0: 1e10 J, L0: 1000 km}
    formula: k / (E0 * L0)
    expected: '39.86'
    shown: ['with k = 39.86 and']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: graph-cent-units
    where: 'V_eff graph: l^2/2m = 186.0 in units of 1e10 J times (1000 km)^2'
    inputs: {k: 3.986e17 J*m, p: 9333.33 km, E0: 1e10 J, L0: 1000 km}
    formula: k * p / 2 / (E0 * L0**2)
    expected: '186.0'
    shown: ['ℓ²/2m = 186.0 in units']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: graph-turning-points
    kind: identity
    where: 'V_eff graph: -39.86/r + 186.0/r^2 = -1.898 at r = 7 and r = 14 (both checked, weights 1 and 10)'
    formula: (-39.86/7 + 186.0/7**2) + 10*(-39.86/14 + 186.0/14**2) + kk
    equals: -1.898*11 + kk
    samples: {kk: [0.0]}
    tolerance: 1e-3
    shown: ['crosses it at the turning points r = 7 and 14 thousand km']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: graph-min-r
    where: 'V_eff graph: the minimum at r = 2 (l^2/2m)/k'
    inputs: {}
    formula: 2 * 186.013 / 39.86
    expected: '9.33'
    shown: ['at r = 9.33 thousand km']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.152), p. 80'}
    origin: page-own

  - id: graph-min-V
    where: 'V_eff graph: the minimum value -k^2/(4 l^2/2m) = -m k^2/(2 l^2)'
    inputs: {}
    formula: -39.86**2 / (4 * 186.013)
    expected: '-2.135'
    shown: ['−2.135 × 10¹⁰ J']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.156), p. 81'}
    origin: page-own

  - id: orbit-extremes
    kind: identity
    where: 'orbit graph: p/(1 + e) = 7000 km at psi = 0 and p/(1 - e) = 14000 km at psi = pi, for p = 9333.33 km and e = 1/3 (weights 1 and 10, in km)'
    formula: 9333.333/(1 + 1/3) + 10*9333.333/(1 - 1/3) + kk
    equals: 7000 + 140000 + kk
    samples: {kk: [0.0]}
    tolerance: 1e-6
    shown: ['between 7000 km (right) and 14000 km (left)']
    source: {cite: reading1, at: 'Section 4.5, eq. (4.155), p. 81'}
    origin: page-own

  - id: kepler-orbit-identity
    kind: identity
    where: 'eq. (4.155) with (4.156) solves the energy equation: at 1/r = (mk/l^2)(1 + e cos u), E - V_eff - (m/2) rdot^2 = 0, with rdot = (l/m) e (mk/l^2) sin u (checked at sample values)'
    formula: (-(mm*kk**2)/(2*ll**2)*(1 - ee**2)) + kk*(mm*kk/ll**2)*(1 + ee*cos(uu)) - ll**2*((mm*kk/ll**2)*(1 + ee*cos(uu)))**2/(2*mm) - (mm/2)*((ll/mm)*ee*(mm*kk/ll**2)*sin(uu))**2
    equals: 0
    samples: {mm: [1.0, 2.0, 0.5], kk: [1.0, 3.0, 0.7], ll: [1.0, 1.5, 0.4], ee: [0.3, 0.8, 0.1], uu: [0.4, 2.0, 5.1]}
    tolerance: 1e-9
    shown: ['\varepsilon \equiv \sqrt{1 + \frac{2E\ell^2}{mk^2}}']
    source: {cite: reading1, at: 'Section 4.5, eqs. (4.155)-(4.156), p. 81'}
    origin: mit
