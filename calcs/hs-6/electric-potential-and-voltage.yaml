# Calculations on content/year-0/hs-6/electric-potential-and-voltage.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/electric-potential-and-voltage.mdx
calcs:
  - id: quiz-voltage
    where: 'quiz 0: V = W/q with W = 3.0 J, q = 0.25 C'
    inputs: {W: 3.0 J, q: 0.25 C}
    formula: W / q
    expected: 12 V
    shown: ['$V = W/q = 3.0/0.25 = 12\\ \\text{V}$']
    quiz: 0
    source: {cite: mit, at: 'Sec. 3.1, Eqs. (3.1.9) and (3.1.10)'}
    origin: page-own

  - id: quiz-field-plates
    where: 'quiz 2: E = V/d with V = 60 V, d = 4.0 mm'
    inputs: {V: 60 V, d: 4.0 mm}
    formula: V / d
    expected: 1.5e4 V/m
    shown: ['$E = V/d = 60/0.0040 = 1.5 \\times 10^{4}\\ \\text{V/m}$']
    quiz: 2
    source: {cite: mit, at: 'Eq. (3.2.1)'}
    origin: page-own

  - id: quiz-proton-electron-ratio
    where: 'quiz 4: same kinetic energy, the electron is about 43 times faster'
    inputs: {m_e: 9.11e-31 kg, m_p: 1.67e-27 kg}
    formula: sqrt(m_p / m_e)
    expected: '43'
    tolerance: '2%'
    shown: ['the far lighter electron must be much faster (about 43 times)']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: elementary-charge
    kind: fact
    where: 'the size of the charge of an electron, rounded as in the sources'
    value: 1.6e-19 C
    tolerance: '1%'
    shown: ['$e = 1.6 \times 10^{-19}\ \text{C}$']
    source: {cite: mit, at: 'Eq. (3.1.12)'}
    origin: mit

  - id: electron-mass
    kind: fact
    where: 'worked example "An electron gun": the electron mass'
    value: 9.11e-31 kg
    shown: ['$m_e = 9.11 \times 10^{-31}\ \text{kg}$']
    source: {cite: nist-me, at: 'electron mass'}
    origin: later-data

  - id: proton-mass
    kind: fact
    where: 'worked example "A proton through the same kind of voltage": the proton mass'
    value: 1.67e-27 kg
    shown: ['$m_p = 1.67 \times 10^{-27}\ \text{kg}$']
    source: {cite: nist-mp, at: 'proton mass'}
    origin: later-data

  - id: electronvolt
    where: 'formula "The electronvolt": 1 eV = e × 1 V'
    inputs: {e: 1.6e-19 C, V: 1 V}
    formula: e * V
    expected: 1.6e-19 J
    shown: ['tex="1\ \text{eV} = 1.6 \times 10^{-19}\ \text{J}"']
    source: {cite: reading1, at: 'Sec. 12.2'}
    origin: mit

  - id: work-voltage
    where: 'worked example "Work and voltage", step "Voltage"'
    inputs: {W: 3.0e-4 J, q: 2.0e-6 C}
    formula: W / q
    expected: 150 V
    shown: ['$V = W/q = 3.0 \times 10^{-4}/2.0 \times 10^{-6} = 150\ \text{V}$']
    source: {cite: mit, at: 'Sec. 3.1, Eqs. (3.1.9) and (3.1.10)'}
    origin: page-own

  - id: work-larger-charge
    where: 'worked example "Work and voltage", step "A larger charge"'
    inputs: {q: 6.0e-6 C, V: 150 V}
    formula: q * V
    expected: 9.0e-4 J
    shown: ['$W = qV = 6.0 \times 10^{-6} \times 150 = 9.0 \times 10^{-4}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 3.1, Eqs. (3.1.9) and (3.1.10)'}
    origin: page-own

  - id: plates-field
    where: 'worked example "An electron between two plates", step "The field"'
    inputs: {V: 400 V, d: 0.025 m}
    formula: V / d
    expected: 1.6e4 V/m
    shown: ['$E = V/d = 400/0.025 = 1.6 \times 10^{4}\ \text{V/m}$']
    source: {cite: mit, at: 'Eq. (3.2.1)'}
    origin: page-own

  - id: plates-force
    where: 'worked example "An electron between two plates", step "The force"'
    inputs: {e: 1.6e-19 C, V: 400 V, d: 0.025 m}
    formula: e * V / d
    expected: 2.6e-15 N
    shown: ['$F = eE = 1.6 \times 10^{-19} \times 1.6 \times 10^{4} = 2.6 \times 10^{-15}\ \text{N}$']
    source: {cite: mit, at: 'Sec. 3.2'}
    origin: page-own

  - id: plates-work-force
    where: 'worked example "An electron between two plates", step "Check with energy": F d'
    inputs: {F: 2.56e-15 N, d: 0.025 m}
    formula: F * d
    expected: 6.4e-17 J
    shown: ['$Fd = 2.56 \times 10^{-15} \times 0.025 = 6.4 \times 10^{-17}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 3.2'}
    origin: page-own

  - id: plates-work-ev
    where: 'worked example "An electron between two plates", step "Check with energy": eV'
    inputs: {e: 1.6e-19 C, V: 400 V}
    formula: e * V
    expected: 6.4e-17 J
    shown: ['$eV = 1.6 \times 10^{-19} \times 400 = 6.4 \times 10^{-17}\ \text{J}$']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: plates-work-identity
    kind: identity
    where: 'step "Check with energy": F d = eE d = eV in a uniform field'
    formula: (e * V / d) * d
    equals: e * V
    samples: {e: [1.6e-19, 3.2e-19], V: [400.0, 60.0], d: [0.025, 0.004]}
    tolerance: 1e-12
    shown: ['as it must be']
    source: {cite: mit, at: 'Eq. (3.2.1)'}
    origin: mit

  - id: gun-energy
    where: 'worked example "An electron gun", step "Energy"'
    inputs: {e: 1.6e-19 C, V: 2000 V}
    formula: e * V
    expected: 3.2e-16 J
    shown: ['$eV = 1.6 \times 10^{-19} \times 2000 = 3.2 \times 10^{-16}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 12.2'}
    origin: page-own

  - id: gun-speed
    where: 'worked example "An electron gun", step "Speed"'
    inputs: {e: 1.6e-19 C, V: 2000 V, m_e: 9.11e-31 kg}
    formula: sqrt(2 * e * V / m_e)
    expected: 2.7e7 m/s
    shown: ['$v = \sqrt{2eV/m_e} = \sqrt{2 \times 3.2 \times 10^{-16}/9.11 \times 10^{-31}} = 2.7 \times 10^{7}\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: gun-fraction-of-c
    where: 'worked example "An electron gun": about 9% of the speed of light'
    inputs: {e: 1.6e-19 C, V: 2000 V, m_e: 9.11e-31 kg, c0: 3.00e8 m/s}
    formula: sqrt(2 * e * V / m_e) / c0 * 100
    expected: '9'
    tolerance: '5%'
    shown: ['That is about 9% of the speed of light ($3.00 \times 10^{8}\ \text{m/s}$)']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: proton-energy
    where: 'worked example "A proton through the same kind of voltage", step "Same energy"'
    inputs: {e: 1.6e-19 C, V: 500 V}
    formula: e * V
    expected: 8.0e-17 J
    shown: ['$500\ \text{eV} = 1.6 \times 10^{-19} \times 500 = 8.0 \times 10^{-17}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 12.2'}
    origin: page-own

  - id: proton-speed
    where: 'worked example "A proton...", step "Speeds": the proton'
    inputs: {K: 8.0e-17 J, m_p: 1.67e-27 kg}
    formula: sqrt(2 * K / m_p)
    expected: 3.1e5 m/s
    shown: ['$v = \sqrt{2 \times 8.0 \times 10^{-17}/1.67 \times 10^{-27}} = 3.1 \times 10^{5}\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: electron-speed-500
    where: 'worked example "A proton...", step "Speeds": the electron'
    inputs: {K: 8.0e-17 J, m_e: 9.11e-31 kg}
    formula: sqrt(2 * K / m_e)
    expected: 1.3e7 m/s
    shown: ['$v = \sqrt{2 \times 8.0 \times 10^{-17}/9.11 \times 10^{-31}} = 1.3 \times 10^{7}\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: mass-ratio
    where: 'worked example "A proton...", step "Compare": about 1840 times heavier'
    inputs: {m_e: 9.11e-31 kg, m_p: 1.67e-27 kg}
    formula: m_p / m_e
    expected: '1840'
    tolerance: '1%'
    shown: ['The proton is about 1840 times heavier']
    source: {cite: nist-mp, at: 'proton mass'}
    origin: page-own

  - id: speed-ratio
    where: 'worked example "A proton...", step "Compare": about 43 times slower'
    inputs: {m_e: 9.11e-31 kg, m_p: 1.67e-27 kg}
    formula: sqrt(m_p / m_e)
    expected: '43'
    tolerance: '2%'
    shown: ['$\sqrt{1840} \approx 43$ times slower']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: sqrt-1840
    where: 'worked example "A proton...", step "Compare": the square root of the rounded ratio 1840'
    inputs: {ratio: 1840}
    formula: sqrt(ratio)
    expected: '43'
    tolerance: '1%'
    shown: ['$\sqrt{1840} \approx 43$']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: k-coulomb
    kind: fact
    where: 'section "The potential of a point charge": Coulomb''s constant, block convention'
    value: 9.0e9 N*m**2/C**2
    shown: ['$k = 9.0 \times 10^{9}\ \text{N m}^2\ \text{C}^{-2}$']
    source: {cite: mit, at: 'Eq. (3.3.4), k_e = 1/(4πε₀)'}
    origin: mit

  - id: point-potential-3cm
    where: 'worked example "Near a small charged sphere", step "The potentials": V = kQ/r at 3.0 cm'
    inputs: {k: 9.0e9 N*m**2/C**2, Q: 2.0e-9 C, r: 0.030 m}
    formula: k * Q / r
    expected: 600 V
    shown: ['$V = kQ/r = 9.0 \times 10^{9} \times 2.0 \times 10^{-9}/0.030 = 600\ \text{V}$']
    source: {cite: mit, at: 'Eq. (3.3.3)'}
    origin: page-own

  - id: point-potential-6cm
    where: 'worked example "Near a small charged sphere", step "The potentials": V = kQ/r at 6.0 cm'
    inputs: {k: 9.0e9 N*m**2/C**2, Q: 2.0e-9 C, r: 0.060 m}
    formula: k * Q / r
    expected: 300 V
    shown: ['twice as far, half as much: $300\ \text{V}$']
    source: {cite: mit, at: 'Eq. (3.3.3)'}
    origin: page-own

  - id: point-voltage-3-to-6
    where: 'worked example "Near a small charged sphere", step "From 3 cm to 6 cm": the voltage'
    inputs: {V1: 600 V, V2: 300 V}
    formula: V1 - V2
    expected: 300 V
    shown: ['$600 - 300 = 300\ \text{V}$']
    source: {cite: mit, at: 'Eq. (3.3.1)'}
    origin: page-own

  - id: point-proton-gain
    where: 'worked example "Near a small charged sphere", step "From 3 cm to 6 cm": the energy gained'
    inputs: {e: 1.6e-19 C, V: 300 V}
    formula: e * V
    expected: 4.8e-17 J
    shown: ['$300\ \text{eV} = 1.6 \times 10^{-19} \times 300 = 4.8 \times 10^{-17}\ \text{J}$']
    source: {cite: mit, at: 'Eq. (3.1.10)'}
    origin: page-own

  - id: point-proton-energy
    where: 'worked example "Near a small charged sphere", step "All the way out": U = kQe/r at 3.0 cm'
    inputs: {k: 9.0e9 N*m**2/C**2, Q: 2.0e-9 C, e: 1.6e-19 C, r: 0.030 m}
    formula: k * Q * e / r
    expected: 9.6e-17 J
    shown: ['$U = kQe/r = 9.0 \times 10^{9} \times 2.0 \times 10^{-9} \times 1.6 \times 10^{-19}/0.030 = 9.6 \times 10^{-17}\ \text{J}$']
    source: {cite: mit, at: 'Eq. (3.3.5)'}
    origin: page-own

  - id: point-energy-is-eV
    kind: identity
    where: 'step "All the way out": U = kQe/r is e times the potential kQ/r, so 600 V gives 600 eV'
    formula: k * Q * e / r
    equals: e * (k * Q / r)
    samples: {k: [9.0e9, 9.0e9], Q: [2.0e-9, -5.0e-9], e: [1.6e-19, 1.6e-19], r: [0.030, 0.060]}
    tolerance: 1e-12
    shown: ['That is all the potential energy it had at the start']
    source: {cite: mit, at: 'Eq. (3.3.5)'}
    origin: mit

  - id: v-per-m-is-n-per-c
    kind: identity
    where: 'section "Voltage in a uniform field": 1 V/m = 1 N/C = 1 J/(C m)'
    formula: (W / q) / d
    equals: (W / d) / q
    samples: {W: [1.0, 6.4e-17], q: [1.0, 1.6e-19], d: [1.0, 0.025]}
    tolerance: 1e-12
    shown: ['(both are $1\ \text{J/(C m)}$)']
    source: {cite: mit, at: 'Eq. (3.1.11)'}
    origin: mit
