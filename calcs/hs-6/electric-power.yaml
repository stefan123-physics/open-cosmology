# Calculations on content/year-0/hs-6/electric-power.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/electric-power.mdx
calcs:
  - id: quiz-appliance-power
    quiz: 0
    where: 'quiz 0: P = VI on a 230 V socket at 4.0 A'
    inputs: {V: 230 V, I: 4.0 A}
    formula: V * I
    expected: 920 W
    shown: ['$P = VI = 230 \\times 4.0 = 920\\ \\text{W}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: quiz-double-current
    quiz: 1
    kind: identity
    where: 'quiz 1: twice the current gives four times P = I²R'
    formula: (2 * I)**2 * R
    equals: 4 * I**2 * R
    samples: {I: [0.5, 2.0, 10.0], R: [1.2, 30.0, 880.0]}
    tolerance: 1e-12
    shown: ['twice the current gives four times the power']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  # quiz 2: no 'quiz: 2' key, because the checker compares in SI units (J), but the choices are in kWh
  - id: quiz-heater-kwh
    where: 'quiz 2: E = Pt for 2.5 kW over 4.0 h'
    inputs: {P: 2.5 kW, t: 4.0 hour}
    formula: P * t
    expected: 10 kW*hour
    shown: ['$E = Pt = 2.5\\ \\text{kW} \\times 4.0\\ \\text{h} = 10\\ \\text{kWh}$']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: quiz-motor-efficiency
    quiz: 3
    where: 'quiz 3: η = 400/500'
    inputs: {Pout: 400 W, Pin: 500 W}
    formula: Pout / Pin * 100
    expected: '80'
    shown: ['$\\eta = P_\\text{out}/P_\\text{in} = 400/500 = 0.80$, or 80%.']
    source: {cite: siy-eff, at: '15.1, Useful and wasted energy'}
    origin: page-own

  - id: quiz-motor-waste
    where: 'quiz 3: the other 100 W becomes heat and sound'
    inputs: {Pout: 400 W, Pin: 500 W}
    formula: Pin - Pout
    expected: 100 W
    shown: ['The other $100\\ \\text{W}$ becomes heat and sound.']
    source: {cite: siy-eff, at: '15.1, Useful and wasted energy'}
    origin: page-own

  # quiz 4: no 'quiz: 4' key, because the choices are words, not numbers
  - id: quiz-lamp-resistance-ratio
    where: 'quiz 4: R = V²/P, the 25 W lamp has four times the resistance of the 100 W lamp'
    inputs: {V: 230 V, P1: 25 W, P2: 100 W}
    formula: (V**2 / P1) / (V**2 / P2)
    expected: '4'
    shown: ['The $25\\ \\text{W}$ lamp has four times the resistance.']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: kwh-joules
    where: 'flashcard and formula "The kilowatt-hour"'
    inputs: {}
    formula: 1000 * 3600
    expected: '3.6e6'
    shown: ['1\ \text{kWh} = 1000\ \text{W} \times 3600\ \text{s} = 3.6 \times 10^{6}\ \text{J}']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: mit

  - id: power-identity
    kind: identity
    where: 'formula "Power in a resistor": VI = I²R = V²/R with V = IR'
    formula: (I * R) * I
    equals: (I * R)**2 / R
    samples: {I: [0.26, 10.0, 4.5], R: [880.0, 1.2, 2.7]}
    tolerance: 1e-12
    shown: ['P = I^2 R = \frac{V^2}{R}']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: mit

  - id: headlamp-time
    where: 'worked example "A car headlamp", step "Charge": 10 minutes in seconds'
    inputs: {}
    formula: 10 * 60
    expected: '600'
    shown: ['$t = 10 \times 60 = 600\ \text{s}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: headlamp-charge
    where: 'worked example "A car headlamp": Q = It'
    inputs: {I: 4.5 A, t: 600 s}
    formula: I * t
    expected: 2700 C
    shown: ['$Q = It = 4.5 \times 600 = 2700\ \text{C}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: headlamp-energy
    where: 'worked example "A car headlamp": E = QV'
    inputs: {Q: 2700 C, V: 12 V}
    formula: Q * V
    expected: 3.2e4 J
    shown: ['$E = QV = 2700 \times 12 = 3.2 \times 10^{4}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 6.3'}
    origin: page-own

  - id: dryer-power
    where: 'worked example "A hair dryer", step "Power"'
    inputs: {V: 230 V, I: 8.0 A}
    formula: V * I
    expected: 1840 W
    shown: ['$P = VI = 230 \times 8.0 = 1840\ \text{W}$, about $1.8\ \text{kW}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: dryer-energy
    where: 'worked example "A hair dryer", step "Energy": 5.0 minutes'
    inputs: {P: 1840 W, t: 300 s}
    formula: P * t
    expected: 5.5e5 J
    shown: ['$E = Pt = 1840 \times 300 = 5.5 \times 10^{5}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: window-current
    where: 'worked example "The heated rear window of a car", step "Current"'
    inputs: {V: 12 V, R: 1.2 ohm}
    formula: V / R
    expected: 10 A
    shown: ['$I = V/R = 12/1.2 = 10\ \text{A}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: window-power
    where: 'worked example, step "Power": V²/R'
    inputs: {V: 12 V, R: 1.2 ohm}
    formula: V**2 / R
    expected: 120 W
    shown: ['$P = V^2/R = 12^2/1.2 = 120\ \text{W}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: window-check-i2r
    where: 'worked example, step "Check": I²R'
    inputs: {I: 10 A, R: 1.2 ohm}
    formula: I**2 * R
    expected: 120 W
    shown: ['$P = I^2R = 10^2 \times 1.2 = 120\ \text{W}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: window-check-vi
    where: 'worked example, step "Check": VI'
    inputs: {V: 12 V, I: 10 A}
    formula: V * I
    expected: 120 W
    shown: ['$P = VI = 12 \times 10 = 120\ \text{W}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: label-current
    where: 'worked example "What the label tells you", step "Current"'
    inputs: {P: 60 W, V: 230 V}
    formula: P / V
    expected: 0.26 A
    shown: ['$I = P/V = 60/230 = 0.26\ \text{A}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: label-resistance
    where: 'worked example "What the label tells you", step "Resistance"'
    inputs: {P: 60 W, V: 230 V}
    formula: V**2 / P
    expected: 880 ohm
    tolerance: '0.5%'
    shown: ['$R = V^2/P = 230^2/60 = 880$ Ω']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: heater-half-voltage
    where: 'section "Power ratings of appliances": 2000 W at 230 V gives a quarter on 115 V'
    inputs: {P: 2000 W, V: 230 V, V2: 115 V}
    formula: V2**2 / (V**2 / P)
    expected: 500 W
    shown: ['gives only a quarter, $500\ \text{W}$, on $115\ \text{V}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: fuse-power
    where: 'section "Power ratings of appliances": a 16 A circuit at 230 V'
    inputs: {V: 230 V, I: 16 A}
    formula: V * I
    expected: 3680 W
    shown: ['$230 \times 16 = 3680\ \text{W}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: overload-total
    where: 'section "Power ratings of appliances": heater, kettle and toaster on one circuit'
    inputs: {P1: 2000 W, P2: 2000 W, P3: 1000 W}
    formula: P1 + P2 + P3
    expected: 5000 W
    shown: ['and a $1000\ \text{W}$ toaster together on one circuit, $5000\ \text{W}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: overload-current
    where: 'section "Power ratings of appliances": current of 5000 W at 230 V (more than the 16 A of the breaker)'
    inputs: {P: 5000 W, V: 230 V}
    formula: P / V
    expected: 22 A
    tolerance: '2%'
    shown: ['$5000/230 = 22\ \text{A}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: mains-frequency
    kind: fact
    where: 'section "Power ratings of appliances": the mains alternates 50 times a second'
    value: 50 Hz
    shown: ['it swings one way and the other $50$ times a second']
    source: {cite: siy-ac, at: 'Alternating current (50 Hz)'}
    origin: page-own

  - id: kettle-day
    where: 'worked example "Boiling water for a month": energy per day'
    inputs: {P: 2.0 kW, t: 0.25 hour}
    formula: P * t
    expected: 0.50 kW*hour
    shown: ['$E = 2.0 \times 0.25 = 0.50\ \text{kWh}$']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: kettle-month
    where: 'worked example: 30 days'
    inputs: {P: 2.0 kW, t: 0.25 hour}
    formula: 30 * P * t
    expected: 15 kW*hour
    shown: ['and in $30$ days $15\ \text{kWh}$']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: kettle-cost
    where: 'worked example, step "Cost" (euros)'
    inputs: {}
    formula: 15 * 0.30
    expected: '4.50'
    shown: ['$15 \times 0.30 = 4.50$, so €4.50']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: kettle-joules
    where: 'worked example, step "Cost": the energy in joules'
    inputs: {E: 15 kW*hour}
    formula: E
    expected: 5.4e7 J
    shown: ['$15 \times 3.6 \times 10^{6} = 5.4 \times 10^{7}\ \text{J}$']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: lamp-filament-kwh
    where: 'worked example "An old lamp or an LED?", step "Filament lamp"'
    inputs: {P: 0.060 kW, t: 1825 hour}
    formula: P * t
    expected: 109.5 kW*hour
    shown: ['$E = 0.060\ \text{kW} \times 5 \times 365\ \text{h} = 110\ \text{kWh}$ (exactly $109.5$)']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: lamp-filament-cost
    where: 'worked example, filament lamp cost (euros)'
    inputs: {}
    formula: 109.5 * 0.30
    expected: '32.85'
    shown: ['$109.5 \times 0.30 = 32.85$, so €32.85']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: lamp-led-kwh
    where: 'worked example, step "LED lamp"'
    inputs: {P: 0.008 kW, t: 1825 hour}
    formula: P * t
    expected: 14.6 kW*hour
    shown: ['$E = 0.008 \times 5 \times 365 = 14.6\ \text{kWh}$']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: lamp-led-cost
    where: 'worked example, LED lamp cost (euros)'
    inputs: {}
    formula: 14.6 * 0.30
    expected: '4.38'
    shown: ['$14.6 \times 0.30 = 4.38$, so €4.38']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: lamp-saving
    where: 'worked example, step "Compare": about €28 a year'
    inputs: {}
    formula: 32.85 - 4.38
    expected: '28'
    tolerance: '2%'
    shown: ['The LED saves about €28 a year']
    source: {cite: reading1, at: 'Sec. 5.5, the kilowatt-hour'}
    origin: page-own

  - id: kettle-water-heat
    where: 'worked example "How efficient is a kettle?", step "Useful energy": 1.0 kg of water from 20 to 100 degrees, specific heat 4180 J/(kg K)'
    inputs: {c: 4180 J/(kg*K), m: 1.0 kg, dT: 80 K}
    formula: c * m * dT
    expected: 3.34e5 J
    shown: ['$E_\text{out} = 4180 \times 1.0 \times 80 = 3.34 \times 10^{5}\ \text{J}$, about $3.3 \times 10^{5}\ \text{J}$']
    source: {cite: siy-eff, at: '15.1, Useful and wasted energy'}
    origin: page-own

  - id: kettle-time
    where: 'worked example, step "Energy put in": 3.5 minutes in seconds'
    inputs: {}
    formula: 3.5 * 60
    expected: '210'
    shown: ['$3.5$ minutes is $210\ \text{s}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: kettle-input
    where: 'worked example "How efficient is a kettle?", step "Energy put in"'
    inputs: {P: 1800 W, t: 210 s}
    formula: P * t
    expected: 3.78e5 J
    shown: ['$E_\text{in} = Pt = 1800 \times 210 = 3.78 \times 10^{5}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: kettle-efficiency
    where: 'worked example, step "Efficiency"'
    inputs: {Eout: 3.344e5 J, Ein: 3.78e5 J}
    formula: Eout / Ein
    expected: '0.88'
    shown: ['$\eta = 3.34 \times 10^{5}/3.78 \times 10^{5} = 0.88$, or 88%. The other 12% warms']
    source: {cite: siy-eff, at: '15.1, Useful and wasted energy'}
    origin: page-own

  - id: kettle-per-minute
    where: 'section "Kilowatt-hours and the electricity bill": a 2 kW kettle in one minute'
    inputs: {P: 2000 W, t: 60 s}
    formula: P * t
    expected: 1.2e5 J
    shown: ['$2000 \times 60 = 1.2 \times 10^{5}\ \text{J}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: line-current-10kv
    where: 'worked example "Ten times the voltage", step "At 10 kV"'
    inputs: {P: 1.0e6 W, V: 1.0e4 V}
    formula: P / V
    expected: 100 A
    shown: ['$I = P/V = 10^{6}/10^{4} = 100\ \text{A}$']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.1)'}
    origin: page-own

  - id: line-loss-10kv
    where: 'worked example, loss at 10 kV'
    inputs: {I: 100 A, R: 5.0 ohm}
    formula: I**2 * R
    expected: 5.0e4 W
    shown: ['$I^2R = 100^2 \times 5.0 = 5.0 \times 10^{4}\ \text{W}$: 5% of the power']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: line-loss-100kv
    where: 'worked example, step "At 100 kV"'
    inputs: {P: 1.0e6 W, V: 1.0e5 V, R: 5.0 ohm}
    formula: (P / V)**2 * R
    expected: 500 W
    shown: ['$I = 10\ \text{A}$, so the loss is $10^2 \times 5.0 = 500\ \text{W}$: only 0.05%']
    source: {cite: mit, at: 'Sec. 6.3, Eq. (6.3.2)'}
    origin: page-own

  - id: sun-luminosity
    kind: fact
    where: 'cosmology callout: the Sun''s luminosity'
    value: 3.828e26 W
    shown: ['The Sun''s is about $3.8 \times 10^{26}\ \text{W}$ (NASA''s Sun Fact Sheet)']
    source: {cite: sun, at: 'luminosity'}
    origin: later-data

  - id: sun-kettles
    where: 'cosmology callout: the Sun''s power in 2 kW kettles'
    inputs: {L: 3.828e26 W, P: 2.0 kW}
    formula: L / P
    expected: '2e23'
    tolerance: '5%'
    shown: ['as much as about $2 \times 10^{23}$ two-kilowatt kettles']
    source: {cite: sun, at: 'luminosity'}
    origin: page-own
