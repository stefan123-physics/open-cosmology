# Calculations on content/year-0/hs-6/fields-from-currents.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# mu0 = 4π × 10⁻⁷ T m/A (Block 6 convention, MIT 8.02T Eq. 9.1.2). Earth's field 5 × 10⁻⁵ T (0.5 gauss, MIT 8.02T Ch. 9 Problem 9.13.12, p. 67).
# `origin: mit` marks a value taken from a cited source, as in the other Block 5 and 6 calcs files.

page: content/year-0/hs-6/fields-from-currents.mdx
calcs:
  - id: oersted-year
    kind: fact
    where: 'section "Oersted''s discovery": the year of Oersted''s experiment'
    value: 1820
    shown: ['In 1820 the Danish physicist Hans Christian Oersted']
    source: {cite: mit, at: 'Sec. 10.2'}
    origin: mit

  - id: mu0
    kind: fact
    where: 'section "How strong is the field?": the permeability of free space'
    value: 1.2566e-6 T*m/A
    shown: ['the **permeability of free space**, $\mu_0 = 4\pi \times 10^{-7}\ \text{T m/A}$']
    source: {cite: reading1, at: 'Eq. (9.1.2), p. 2'}
    origin: mit

  - id: earth-field
    kind: fact
    where: 'section "How strong is the field?": the Earth''s field, about 0.5 gauss in the source'
    value: 5e-5 T
    shown: ['about $5 \times 10^{-5}\ \text{T}$']
    source: {cite: reading1, at: 'Problem 9.13.12, p. 67'}
    origin: mit

  - id: earth-field-microtesla
    where: 'section "How strong is the field?" and plot caption: 5 × 10⁻⁵ T in microtesla'
    inputs: {B: 5e-5 T}
    formula: B
    expected: 50 uT
    shown: ['($50\ \mu\text{T}$)', 'the Earth''s field, about 50 μT']
    source: {cite: reading1, at: 'Problem 9.13.12, p. 67'}
    origin: page-own

  - id: plot-microtesla
    kind: identity
    where: 'plot: B = μ₀I/(2πr) in microtesla equals 0.2 I/r (I in A, r in m)'
    formula: 4 * pi * 1e-7 * I / (2 * pi * r) * 1e6
    equals: 0.2 * I / r
    samples: {I: [1.0, 12.0, 20.0], r: [0.02, 0.05, 0.2]}
    tolerance: 1e-12
    shown: ['B = 0.2 I/r μT']
    source: {cite: reading1, at: 'Eq. (9.1.7), p. 5'}
    origin: page-own

  - id: quiz-wire-third-distance
    where: 'quiz 1: 30 μT at 6.0 cm, field at 2.0 cm (B ∝ 1/r)'
    inputs: {B1: 30 uT, r1: 6.0 cm, r2: 2.0 cm}
    formula: B1 * r1 / r2
    expected: 90 uT
    shown: ['$3 \\times 30 = 90\\ \\mu\\text{T}$']
    quiz: 1
    source: {cite: reading1, at: 'Eq. (9.1.7), p. 5'}
    origin: page-own

  - id: quiz-solenoid-n
    where: 'quiz 2: turns per metre, 600 turns over 0.30 m'
    inputs: {N: 600, L: 0.30 m}
    formula: N / L
    expected: 2000 1/m
    shown: ['$n = 600/0.30 = 2000$']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: quiz-solenoid-field
    where: 'quiz 2: B = μ₀nI for n = 2000 per metre and 0.50 A'
    inputs: {mu0: 1.2566370614e-6 T*m/A, n: 2000 1/m, I: 0.50 A}
    formula: mu0 * n * I
    expected: 1.26 mT
    tolerance: '0.5%'
    shown: ['$B = \\mu_0 n I = 4\\pi \\times 10^{-7} \\times 2000 \\times 0.50 = 1.26 \\times 10^{-3}\\ \\text{T}']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: quiz-solenoid-choice
    where: 'quiz 2: the answer choice 1.3 mT, the field 1.26 mT rounded to two significant figures'
    inputs: {mu0: 1.2566370614e-6 T*m/A, n: 2000 1/m, I: 0.50 A}
    formula: mu0 * n * I
    expected: 1.3 mT
    tolerance: '4%'
    shown: ['\\approx 1.3\\ \\text{mT}$']
    quiz: 2
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: quiz-solenoid-wrong
    where: 'quiz 2 explanation: the wrong answer from using N = 600 instead of n'
    inputs: {mu0: 1.2566370614e-6 T*m/A, N: 600 1/m, I: 0.50 A}
    formula: mu0 * N * I
    expected: 0.38 mT
    tolerance: '1%'
    shown: ['the wrong answer $0.38\\ \\text{mT}$']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: cable-field
    where: 'worked example "A compass next to a cable", (a): B = μ₀I/(2πr) for 12 A at 3.0 cm'
    inputs: {mu0: 1.2566370614e-6 T*m/A, I: 12 A, r: 0.030 m}
    formula: mu0 * I / (2 * pi * r)
    expected: 8.0e-5 T
    tolerance: '0.5%'
    shown: ['\dfrac{4\pi \times 10^{-7} \times 12}{2\pi \times 0.030} = 8.0 \times 10^{-5}\ \text{T}$, or $80\ \mu\text{T}$']
    source: {cite: reading1, at: 'Eq. (9.1.7), p. 5'}
    origin: page-own

  - id: cable-earth-distance
    where: 'worked example, (b): r = μ₀I/(2πB) for 12 A and B = 5 × 10⁻⁵ T'
    inputs: {mu0: 1.2566370614e-6 T*m/A, I: 12 A, B: 5e-5 T}
    formula: mu0 * I / (2 * pi * B)
    expected: 0.048 m
    tolerance: '0.5%'
    shown: ['\dfrac{4\pi \times 10^{-7} \times 12}{2\pi \times 5 \times 10^{-5}} = 0.048\ \text{m}$, about $5\ \text{cm}$']
    source: {cite: reading1, at: 'Eq. (9.1.7), p. 5'}
    origin: page-own

  - id: lab-solenoid-n
    where: 'worked example "A coil for a physics lab": n = N/L for 500 turns over 20 cm'
    inputs: {N: 500, L: 0.20 m}
    formula: N / L
    expected: 2500 1/m
    shown: ['$n = N/L = 500/0.20 = 2500$ turns per metre']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: lab-solenoid-field
    where: 'worked example, step "The field": B = μ₀nI for 2500 per metre and 2.0 A'
    inputs: {mu0: 1.2566370614e-6 T*m/A, n: 2500 1/m, I: 2.0 A}
    formula: mu0 * n * I
    expected: 6.3e-3 T
    tolerance: '0.5%'
    shown: ['$B = \mu_0 n I = 4\pi \times 10^{-7} \times 2500 \times 2.0 = 6.3 \times 10^{-3}\ \text{T}$, or $6.3\ \text{mT}$']
    source: {cite: reading1, at: 'Eq. (9.4.3), p. 21'}
    origin: page-own

  - id: lab-solenoid-vs-earth
    where: 'worked example, step "Compare": 6.3 mT over the Earth''s 5 × 10⁻⁵ T'
    inputs: {B: 6.3e-3 T, B_E: 5e-5 T}
    formula: B / B_E
    expected: 130
    tolerance: '4%'
    shown: ['$6.3 \times 10^{-3} / (5 \times 10^{-5}) \approx 130$', 'about 130 times the Earth''s field']
    source: {cite: reading1, at: 'Problem 9.13.12, p. 67'}
    origin: page-own

  - id: iron-factor
    kind: fact
    where: 'section "Electromagnets and iron cores": field inside iron 10³ to 10⁴ times the applied field'
    value: 1e3
    shown: ['$10^3$ to $10^4$ times as strong as the coil''s field alone']
    source: {cite: reading1, at: 'Sec. 9.6.4, p. 31'}
    origin: mit

  - id: cord-force-per-metre
    where: 'worked example "The two wires of a power cord": F/L = μ₀I₁I₂/(2πd) for 10 A each, 4.0 mm apart'
    inputs: {mu0: 1.2566370614e-6 T*m/A, I1: 10 A, I2: 10 A, d: 0.0040 m}
    formula: mu0 * I1 * I2 / (2 * pi * d)
    expected: 5.0e-3 N/m
    tolerance: '0.5%'
    shown: ['\dfrac{4\pi \times 10^{-7} \times 10 \times 10}{2\pi \times 0.0040} = 5.0 \times 10^{-3}\ \text{N/m}$']
    source: {cite: reading1, at: 'Eq. (9.2.1), p. 13'}
    origin: page-own

  - id: cord-force
    where: 'worked example, step "Force on the length of cord": F = (F/L) × 2.0 m'
    inputs: {FL: 5.0e-3 N/m, L: 2.0 m}
    formula: FL * L
    expected: 1.0e-2 N
    shown: ['$F = 5.0 \times 10^{-3} \times 2.0 = 1.0 \times 10^{-2}\ \text{N}$']
    source: {cite: reading1, at: 'Eq. (9.2.1), p. 13'}
    origin: page-own

  - id: cord-force-as-mass
    where: 'worked example: 1.0 × 10⁻² N is about the weight of a one-gram mass (m = F/g)'
    inputs: {F: 1.0e-2 N, g: 9.81 m/s**2}
    formula: F / g
    expected: 1 g
    tolerance: '5%'
    shown: ['about the weight of a one-gram mass']
    source: {cite: reading1, at: 'Eq. (9.2.1), p. 13'}
    origin: page-own

  - id: ampere-years
    kind: fact
    where: 'section "The old definition of the ampere": the definition was in force from 1948 until 2019'
    value: 1948
    shown: ['From 1948 until 2019 the ampere was defined']
    source: {cite: nist-history, at: 'Ampere: History'}
    origin: mit

  - id: ampere-old-definition
    where: 'section "The old definition of the ampere": 1 A in each wire, 1 m apart, gives 2 × 10⁻⁷ N per metre'
    inputs: {mu0: 1.2566370614e-6 T*m/A, I1: 1 A, I2: 1 A, d: 1 m}
    formula: mu0 * I1 * I2 / (2 * pi * d)
    expected: 2e-7 N/m
    tolerance: '0.01%'
    shown: ['$F/L = 4\pi \times 10^{-7} \times 1 \times 1/(2\pi \times 1) = 2 \times 10^{-7}\ \text{N/m}$', 'with a force of $2 \times 10^{-7}\ \text{N}$ per metre of length']
    source: {cite: nist-ampere, at: 'definition used until 2019'}
    origin: page-own

  - id: mu0-measured-vs-old
    where: 'section "The old definition of the ampere": the measured μ₀ (CODATA, NIST) differs from 4π × 10⁻⁷ T m/A by about one part in 10¹⁰'
    inputs: {mu0_old: 1.2566370614359e-6 T*m/A, mu0_codata: 1.25663706127e-6 T*m/A}
    formula: (mu0_old - mu0_codata) / mu0_old
    expected: 1e-10
    tolerance: '50%'
    shown: ['to about one part in $10^{10}$']
    source: {cite: nist-mu0, at: 'CODATA value of the vacuum magnetic permeability'}
    origin: page-own
