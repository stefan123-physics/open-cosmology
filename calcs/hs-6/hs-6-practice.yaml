# Calculations on content/year-0/hs-6/hs-6-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Block 6 constants: k = 9.0e9 N m²/C², e = 1.6e-19 C, ε₀ = 8.85e-12 F/m, μ₀ = 4π × 10⁻⁷ T m/A,
# m_e = 9.11e-31 kg, m_p = 1.67e-27 kg, G = 6.67e-11 N m²/kg², g = 9.81 m/s², c = 3.00e8 m/s.
# Inputs are plain SI numbers (no units), as in calcs/hs-6/coulombs-law.yaml.

page: content/year-0/hs-6/hs-6-practice.mdx
calcs:
  # ---------------------------------------------------------------- Problem 1
  - id: hs6p-p1-a
    answer: p1-a
    where: 'Problem 1(a), answer box: extra electrons on −3.0 nC, n = Q/e'
    inputs: {Q: 3.0e-9, e: 1.6e-19}
    formula: Q / e
    expected: '1.88e10'
    tolerance: '0.5%'
    shown: ['$n = Q/e = 3.0 \times 10^{-9}/(1.6 \times 10^{-19}) = 1.88 \times 10^{10}$ extra electrons']
    source: {cite: siy164, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: hs6p-p1-a-exact
    where: 'Problem 1(a), check: the exact count 3.0e-9/1.6e-19'
    inputs: {Q: 3.0e-9, e: 1.6e-19}
    formula: Q / e
    expected: '18750000000'
    tolerance: '1e-6%'
    shown: ['here $18\,750\,000\,000$ exactly']
    source: {cite: siy164, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: hs6p-p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: Coulomb force between 9.0 nC and 3.0 nC at 4.0 cm'
    inputs: {k: 9.0e9, Q1: 9.0e-9, Q2: 3.0e-9, r: 0.040}
    formula: k * Q1 * Q2 / r**2
    expected: '1.52e-4'
    shown: ['$F = 9.0 \times 10^9 \times (9.0 \times 10^{-9})(3.0 \times 10^{-9})/0.040^2 = 1.52 \times 10^{-4}\ \text{N}$']
    source: {cite: siy92, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: hs6p-p1-b-weight
    where: 'Problem 1(b), check: the mass whose weight equals the force, F/g in milligrams'
    inputs: {F: 1.51875e-4, g: 9.81}
    formula: F / g * 1e6
    expected: '15'
    tolerance: '5%'
    shown: ['about the weight of $15$ milligrams']
    source: {cite: siy92, at: 'Sec. 9.2, Coulomb''s law (our own comparison)'}
    origin: page-own

  - id: hs6p-p1-c-share
    where: 'Problem 1(c): shared charge (9.0 − 3.0)/2 nC'
    inputs: {Q1: 9.0, Q2: -3.0}
    formula: (Q1 + Q2) / 2
    expected: '3.0'
    shown: ['$Q = (+9.0 - 3.0)/2 = +3.0\ \text{nC}$ on each sphere']
    source: {cite: siy163, at: 'Sec. 16.3, Arrangement of charge'}
    origin: page-own

  - id: hs6p-p1-c
    answer: p1-c
    where: 'Problem 1(c), answer box: Coulomb force between 3.0 nC and 3.0 nC at 4.0 cm'
    inputs: {k: 9.0e9, Q: 3.0e-9, r: 0.040}
    formula: k * Q**2 / r**2
    expected: '5.06e-5'
    shown: ['$F = 9.0 \times 10^9 \times (3.0 \times 10^{-9})^2/0.040^2 = 5.06 \times 10^{-5}\ \text{N}$']
    source: {cite: siy92, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: hs6p-p1-c-ratio
    where: 'Problem 1(c), check: force before divided by force after'
    inputs: {Fb: 1.52e-4, Fa: 5.06e-5}
    formula: Fb / Fa
    expected: '3.0'
    shown: ['($1.52 \times 10^{-4}/5.06 \times 10^{-5} = 3.0$)']
    source: {cite: siy92, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: hs6p-p1-c-total
    where: 'Problem 1(c), check: total charge 9.0 − 3.0 = 6.0 nC, and the products 27 and 9 nC²'
    inputs: {Q1: 9.0, Q2: 3.0}
    formula: Q1 - Q2
    expected: '6.0'
    shown: ['The total charge is $+6.0\ \text{nC}$ before and after', 'because the product of the charges fell from $27$ to $9$']
    source: {cite: siy163, at: 'Sec. 16.3, Arrangement of charge'}
    origin: page-own

  # Independent route: F_after/F_before = 1 + (Q1 − Q2)²/(4 Q1 Q2), from (Q1 + Q2)² = (Q1 − Q2)² + 4 Q1 Q2.
  - id: hs6p-p1-d-identity
    kind: identity
    answer: p1-d
    where: 'Problem 1(d), answer box: (Q1 + Q2)²/(4Q1Q2) against Coulomb''s law with the shared charge, k and r cancelled'
    formula: (Q1 + Q2)**2/(4*Q1*Q2)
    equals: (k * ((Q1 + Q2)/2)**2 / r**2) / (k * Q1 * Q2 / r**2)
    samples:
      Q1: [1, 2, 9, 5.5]
      Q2: [3, 2, 1, 7]
      k: [9.0e9, 9.0e9, 1, 3]
      r: [0.04, 1, 0.2, 7]
    tolerance: 1e-12
    shown: ['= \frac{(Q_1 + Q_2)^2}{4 Q_1 Q_2}']
    source: {cite: siy92, at: 'Sec. 9.2, Coulomb''s law, with the shared charge of Sec. 16.3 (our own step)'}
    origin: page-own

  - id: hs6p-p1-d-never-less
    kind: identity
    where: 'Problem 1(d), check: (Q1 + Q2)² − 4Q1Q2 = (Q1 − Q2)²'
    formula: (Q1 + Q2)**2 - 4*Q1*Q2
    equals: (Q1 - Q2)**2
    samples:
      Q1: [1, 2, 9, 5.5]
      Q2: [3, 2.5, 1, 7]
    tolerance: 1e-12
    shown: ['$(Q_1 + Q_2)^2 - 4Q_1Q_2 = (Q_1 - Q_2)^2$']
    source: {cite: siy92, at: 'Sec. 9.2 (our own step)'}
    origin: page-own

  - id: hs6p-p1-d-example
    where: 'Problem 1(d), check: Q1 = 1, Q2 = 3 gives 16/12'
    inputs: {Q1: 1, Q2: 3}
    formula: (Q1 + Q2)**2/(4*Q1*Q2)
    expected: '1.33'
    shown: ['it is $16/12 = 1.33$']
    source: {cite: siy92, at: 'Sec. 9.2 (our own step)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 2
  - id: hs6p-p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: field of 2.0 nC at 0.10 m'
    inputs: {k: 9.0e9, Q: 2.0e-9, r: 0.10}
    formula: k * Q / r**2
    expected: '1800'
    tolerance: '0.1%'
    shown: ['$E_A = 9.0 \times 10^9 \times 2.0 \times 10^{-9}/0.10^2 = 18/0.010 = 1800\ \text{N/C}$']
    source: {cite: siy93, at: 'Sec. 9.3, electric field strength'}
    origin: page-own

  - id: hs6p-p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: field of 8.0 nC at 0.20 m'
    inputs: {k: 9.0e9, Q: 8.0e-9, r: 0.20}
    formula: k * Q / r**2
    expected: '1800'
    tolerance: '0.1%'
    shown: ['$E_B = 9.0 \times 10^9 \times 8.0 \times 10^{-9}/0.20^2 = 72/0.040 = 1800\ \text{N/C}$']
    source: {cite: siy93, at: 'Sec. 9.3, electric field strength'}
    origin: page-own

  - id: hs6p-p2-b-distance
    where: 'Problem 2(b): distance from B to P'
    inputs: {D: 0.30, x: 0.10}
    formula: D - x
    expected: '0.20'
    shown: ['P is $0.30 - 0.10 = 0.20\ \text{m}$ from B']
    source: {cite: siy93, at: 'Sec. 9.3'}
    origin: page-own

  - id: hs6p-p2-b-check
    where: 'Problem 2(b), check: four times the charge at twice the distance, 4/2²'
    inputs: {}
    formula: 4 / 2**2
    expected: '1'
    shown: ['$4/2^2 = 1$']
    source: {cite: siy93, at: 'Sec. 9.3'}
    origin: page-own

  # Independent route: at x = d/(1 + √(Q2/Q1)) the two fields kQ1/x² and kQ2/(d − x)² are equal.
  - id: hs6p-p2-c-identity
    kind: identity
    answer: p2-c
    where: 'Problem 2(c), answer box: x = d/(1 + √(Q2/Q1)); checked by putting x into the two fields (their ratio must be 1)'
    formula: d/(1 + sqrt(Q2/Q1))
    equals: d/(1 + sqrt(Q2/Q1)) * ((k*Q1/(d/(1 + sqrt(Q2/Q1)))**2) / (k*Q2/(d - d/(1 + sqrt(Q2/Q1)))**2))
    samples:
      d: [0.30, 1, 2, 0.5]
      Q1: [2, 1, 9, 3]
      Q2: [8, 1, 1, 7]
      k: [9.0e9, 1, 2, 9.0e9]
    tolerance: 1e-9
    shown: ['x = \frac{d}{1 + \sqrt{Q_2/Q_1}}" cite="siy93"']
    source: {cite: siy93, at: 'Sec. 9.3, E = kQ/r² for each charge, set equal (our own step)'}
    origin: page-own

  - id: hs6p-p2-c-check
    where: 'Problem 2(c), check: d = 0.30 m, Q2/Q1 = 4 gives 0.10 m'
    inputs: {d: 0.30, Q1: 2.0, Q2: 8.0}
    formula: d/(1 + sqrt(Q2/Q1))
    expected: '0.10'
    shown: ['$x = 0.30/(1 + \sqrt{4}) = 0.30/3 = 0.10\ \text{m}$, point P']
    source: {cite: siy93, at: 'Sec. 9.3 (our own step)'}
    origin: page-own

  - id: hs6p-p2-d-EA
    where: 'Problem 2(d): field of A at the midpoint'
    inputs: {k: 9.0e9, Q: 2.0e-9, r: 0.15}
    formula: k * Q / r**2
    expected: '800'
    tolerance: '0.1%'
    shown: ['$E_A = 9.0 \times 10^9 \times 2.0 \times 10^{-9}/0.15^2 = 800\ \text{N/C}$']
    source: {cite: siy93, at: 'Sec. 9.3, electric field strength'}
    origin: page-own

  - id: hs6p-p2-d-EB
    where: 'Problem 2(d): field of B at the midpoint'
    inputs: {k: 9.0e9, Q: 8.0e-9, r: 0.15}
    formula: k * Q / r**2
    expected: '3200'
    tolerance: '0.1%'
    shown: ['$E_B = 9.0 \times 10^9 \times 8.0 \times 10^{-9}/0.15^2 = 3200\ \text{N/C}$']
    source: {cite: siy93, at: 'Sec. 9.3, electric field strength'}
    origin: page-own

  - id: hs6p-p2-d-E
    where: 'Problem 2(d): total field at the midpoint'
    inputs: {k: 9.0e9, QA: 2.0e-9, QB: 8.0e-9, r: 0.15}
    formula: k * (QB - QA) / r**2
    expected: '2400'
    tolerance: '0.1%'
    shown: ['The total is $3200 - 800 = 2400\ \text{N/C}$']
    source: {cite: siy93, at: 'Sec. 9.3, electric field strength'}
    origin: page-own

  - id: hs6p-p2-d-F
    where: 'Problem 2(d): force on the electron, eE'
    inputs: {e: 1.6e-19, E: 2400}
    formula: e * E
    expected: '3.84e-16'
    shown: ['$F = eE = 1.6 \times 10^{-19} \times 2400 = 3.84 \times 10^{-16}\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 1.6'}
    origin: page-own

  - id: hs6p-p2-d
    answer: p2-d
    where: 'Problem 2(d), answer box: acceleration of the electron, eE/m_e'
    inputs: {e: 1.6e-19, E: 2400, me: 9.11e-31}
    formula: e * E / me
    expected: '4.22e14'
    shown: ['$a = F/m_e = 3.84 \times 10^{-16}/(9.11 \times 10^{-31}) = 4.22 \times 10^{14}\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Sec. 1.6, with Newton''s second law'}
    origin: page-own

  - id: hs6p-p2-d-vs-g
    where: 'Problem 2(d), check: a/g is more than 10¹³'
    inputs: {a: 4.215e14, g: 9.81}
    formula: a / g
    expected: '4e13'
    tolerance: '10%'
    shown: ['more than $10^{13}$ times $g$']
    source: {cite: reading1, at: 'Sec. 1.6 (our own comparison)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 3
  - id: hs6p-p3-a
    answer: p3-a
    where: 'Problem 3(a), answer box: E = V/d = 1200/0.012'
    inputs: {V: 1200, d: 0.012}
    formula: V / d
    expected: '1.0e5'
    shown: ['$E = V/d = 1200/0.012 = 1.0 \times 10^{5}\ \text{V/m}$']
    source: {cite: reading2, at: 'Eq. (3.2.1)'}
    origin: page-own

  - id: hs6p-p3-b
    answer: p3-b
    where: 'Problem 3(b), answer box: q = mg/E'
    inputs: {m: 4.9e-15, g: 9.81, E: 1.0e5}
    formula: m * g / E
    expected: '4.81e-19'
    shown: ['$q = mg/E = 4.9 \times 10^{-15} \times 9.81/(1.0 \times 10^{5}) = 4.81 \times 10^{-19}\ \text{C}$']
    source: {cite: reading1, at: 'Sec. 1.6, F = qE, set equal to the weight (our own step)'}
    origin: page-own

  - id: hs6p-p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: n = q/e, a whole number'
    inputs: {m: 4.9e-15, g: 9.81, E: 1.0e5, e: 1.6e-19}
    formula: m * g / E / e
    expected: '3'
    shown: ['$n = q/e = 4.81 \times 10^{-19}/(1.6 \times 10^{-19}) = 3.0$, so $3$ extra electrons']
    source: {cite: siy164, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: hs6p-p3-d
    answer: p3-d
    where: 'Problem 3(d), answer box: work on a charge 3e through 1200 V, in eV'
    inputs: {n: 3, V: 1200}
    formula: n * V
    expected: '3600'
    tolerance: '0.1%'
    shown: ['A charge of $3e$ crossing $1200\ \text{V}$ gains $3 \times 1200 = 3600\ \text{eV}$']
    source: {cite: reading2, at: 'Eq. (3.1.12)'}
    origin: page-own

  - id: hs6p-p3-d-joule
    where: 'Problem 3(d): 3600 eV in joules'
    inputs: {W: 3600, e: 1.6e-19}
    formula: W * e
    expected: '5.76e-16'
    shown: ['$3600 \times 1.6 \times 10^{-19} = 5.76 \times 10^{-16}\ \text{J}$']
    source: {cite: reading2, at: 'Eq. (3.1.12)'}
    origin: page-own

  - id: hs6p-p3-d-mgd
    where: 'Problem 3(d), check: energy taken by gravity, mgd'
    inputs: {m: 4.9e-15, g: 9.81, d: 0.012}
    formula: m * g * d
    expected: '5.77e-16'
    shown: ['$mgd = 4.9 \times 10^{-15} \times 9.81 \times 0.012 = 5.77 \times 10^{-16}\ \text{J}$']
    source: {cite: reading2, at: 'Eq. (3.1.12) (our own check)'}
    origin: page-own

  # Independent route: with V = mgd/(ne) the field V/d gives a force ne·V/d equal to the weight mg.
  - id: hs6p-p3-e-identity
    kind: identity
    answer: p3-e
    where: 'Problem 3(e), answer box: V = mgd/(ne); the electric force n e V/d then equals mg'
    formula: m*g*d/(n*e)
    equals: (m*g) / (n*e/d)
    samples:
      m: [4.9e-15, 1e-15, 1e-13, 3e-14]
      g: [9.81, 9, 10, 9.5]
      d: [0.012, 0.005, 0.02, 0.01]
      n: [3, 1, 10, 4]
      e: [1.6e-19, 1.5e-19, 1.7e-19, 1.6e-19]
    tolerance: 1e-12
    shown: ['V = \frac{m g d}{n e}']
    source: {cite: reading2, at: 'Eq. (3.2.1) with the balance qE = mg of part (b) (our own step)'}
    origin: page-own

  - id: hs6p-p3-e-check
    where: 'Problem 3(e), check: the voltage for this drop'
    inputs: {m: 4.9e-15, g: 9.81, d: 0.012, n: 3, e: 1.6e-19}
    formula: m*g*d/(n*e)
    expected: '1202'
    shown: ['= 1202\ \text{V}$, the $1200\ \text{V}$ of the problem']
    source: {cite: reading2, at: 'Eq. (3.2.1) (our own step)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 4
  - id: hs6p-p4-area
    where: 'Problem 4(a): plate area 0.30 m × 0.25 m'
    inputs: {a: 0.30, b: 0.25}
    formula: a * b
    expected: '0.075'
    shown: ['$A = 0.30 \times 0.25 = 0.075\ \text{m}^2$']
    source: {cite: reading3, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: hs6p-p4-a
    answer: p4-a
    where: 'Problem 4(a), answer box: C = ε₀A/d in nF'
    inputs: {eps0: 8.85e-12, A: 0.075, d: 3.0e-4}
    formula: eps0 * A / d * 1e9
    expected: '2.21'
    shown: ['$C = 8.85 \times 10^{-12} \times 0.075/(3.0 \times 10^{-4}) = 2.21 \times 10^{-9}\ \text{F} = 2.21\ \text{nF}$']
    source: {cite: reading3, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: hs6p-p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: Q = CV in nC'
    inputs: {eps0: 8.85e-12, A: 0.075, d: 3.0e-4, V: 6.0}
    formula: eps0 * A / d * V * 1e9
    expected: '13.3'
    shown: ['$Q = 2.21 \times 10^{-9} \times 6.0 = 1.33 \times 10^{-8}\ \text{C} = 13.3\ \text{nC}$']
    source: {cite: reading3, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: hs6p-p4-c
    answer: p4-c
    where: 'Problem 4(c), answer box: U = ½CV²'
    inputs: {eps0: 8.85e-12, A: 0.075, d: 3.0e-4, V: 6.0}
    formula: 0.5 * eps0 * A / d * V**2
    expected: '3.98e-8'
    shown: ['$U = \tfrac12 \times 2.21 \times 10^{-9} \times 6.0^2 = 3.98 \times 10^{-8}\ \text{J}$']
    source: {cite: reading3, at: 'Eq. (5.4.2)'}
    origin: page-own

  - id: hs6p-p4-c-check
    where: 'Problem 4(c), check: U = ½QV'
    inputs: {Q: 1.3275e-8, V: 6.0}
    formula: 0.5 * Q * V
    expected: '3.98e-8'
    shown: ['$\tfrac12 QV = \tfrac12 \times 1.33 \times 10^{-8} \times 6.0 = 3.98 \times 10^{-8}\ \text{J}$']
    source: {cite: reading3, at: 'Eq. (5.4.2)'}
    origin: page-own

  - id: hs6p-p4-d-C
    where: 'Problem 4(d): capacitance with a 0.60 mm gap, in nF'
    inputs: {eps0: 8.85e-12, A: 0.075, d: 6.0e-4}
    formula: eps0 * A / d * 1e9
    expected: '1.11'
    shown: ['halves the capacitance, to $1.11\ \text{nF}$']
    source: {cite: reading3, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: hs6p-p4-d-V
    where: 'Problem 4(d): voltage with the charge fixed and the gap doubled, V = Q/C'
    inputs: {eps0: 8.85e-12, A: 0.075, Q: 1.3275e-8, d: 6.0e-4}
    formula: Q / (eps0 * A / d)
    expected: '12'
    shown: ['so $V = Q/C$ doubles to $12\ \text{V}$']
    source: {cite: reading3, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: hs6p-p4-d-U
    where: 'Problem 4(d): energy Q²/2C with the gap doubled'
    inputs: {eps0: 8.85e-12, A: 0.075, Q: 1.3275e-8, d: 6.0e-4}
    formula: Q**2 / (2 * eps0 * A / d)
    expected: '8.0e-8'
    shown: ['doubles, to about $8.0 \times 10^{-8}\ \text{J}$']
    source: {cite: reading3, at: 'Eqs. (5.4.1)–(5.4.2)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 5
  - id: hs6p-p5-area
    where: 'Problem 5(a): cross-section of a wire 0.50 mm in diameter'
    inputs: {r: 2.5e-4}
    formula: pi * r**2
    expected: '1.96e-7'
    shown: ['$A = \pi r^2 = \pi \times (2.5 \times 10^{-4})^2 = 1.96 \times 10^{-7}\ \text{m}^2$']
    source: {cite: reading4, at: 'Eq. (6.2.10)'}
    origin: page-own

  - id: hs6p-p5-a
    answer: p5-a
    where: 'Problem 5(a), answer box: R = ρL/A'
    inputs: {rho: 1.7e-8, L: 25, r: 2.5e-4}
    formula: rho * L / (pi * r**2)
    expected: '2.16'
    tolerance: '0.5%'
    shown: ['$R = 1.7 \times 10^{-8} \times 25/(1.96 \times 10^{-7}) = 2.16$ Ω']
    source: {cite: reading4, at: 'Eq. (6.2.10)'}
    origin: page-own

  - id: hs6p-p5-b
    answer: p5-b
    where: 'Problem 5(b), answer box: V = IR with I = 1.5 A'
    inputs: {rho: 1.7e-8, L: 25, r: 2.5e-4, I: 1.5}
    formula: I * rho * L / (pi * r**2)
    expected: '3.25'
    shown: ['$V = 1.5 \times 2.16 = 3.25\ \text{V}$']
    source: {cite: reading4, at: 'Eq. (6.2.7)'}
    origin: page-own

  - id: hs6p-p5-b-check
    where: 'Problem 5(b), check: I = V/R'
    inputs: {V: 3.25, R: 2.16}
    formula: V / R
    expected: '1.50'
    shown: ['$I = V/R = 3.25/2.16 = 1.50\ \text{A}$']
    source: {cite: reading4, at: 'Eq. (6.2.7)'}
    origin: page-own

  - id: hs6p-p5-c
    answer: p5-c
    where: 'Problem 5(c), answer box: same wire with twice the diameter, R/4'
    inputs: {rho: 1.7e-8, L: 25, r: 5.0e-4}
    formula: rho * L / (pi * r**2)
    expected: '0.541'
