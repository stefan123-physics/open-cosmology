# Calculations on content/year-0/hs-6/capacitors.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/capacitors.mdx
calcs:
  - id: quiz-capacitance
    where: 'quiz 0: C = Q/V with Q = 3.0 × 10⁻⁴ C, V = 6.0 V'
    inputs: {Q: 3.0e-4 C, V: 6.0 V}
    formula: Q / V
    expected: 50 uF
    shown: ['$C = Q/V = 3.0 \\times 10^{-4}/6.0 = 5.0 \\times 10^{-5}\\ \\text{F}$, which is $50\\ \\mu\\text{F}$']
    quiz: 0
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: quiz-capacitance-wrong-product
    where: 'quiz 0, wrong choice: Q × V instead of Q/V'
    inputs: {Q: 3.0e-4, V: 6.0}
    formula: Q * V
    expected: '1.8e-3'
    shown: ['"$1.8 \\times 10^{-3}\\ \\text{F}$"']
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: quiz-capacitance-wrong-inverse
    where: 'quiz 0, wrong choice: V/Q instead of Q/V'
    inputs: {Q: 3.0e-4, V: 6.0}
    formula: V / Q
    expected: '2.0e4'
    shown: ['"$2.0 \\times 10^{4}\\ \\text{F}$"']
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: quiz-half-gap
    kind: identity
    where: 'quiz 1: half the gap gives twice C = ε₀A/d'
    formula: eps0 * A / (d / 2)
    equals: 2 * eps0 * A / d
    samples: {eps0: [8.85e-12, 8.85e-12], A: [0.01, 0.04], d: [0.001, 0.002]}
    tolerance: 1e-12
    shown: ['so half the gap gives twice the capacitance']
    quiz: 1
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: quiz-triple-voltage
    kind: identity
    where: 'quiz 2: three times the voltage gives 3² = 9 times U = ½CV²'
    formula: 0.5 * C * (3 * V)**2
    equals: 9 * 0.5 * C * V**2
    samples: {C: [1.0e-6, 2.2e-4], V: [5.0, 330.0]}
    tolerance: 1e-12
    shown: ['$U = \\tfrac12 CV^2$ grows with the square of the voltage: $3^2 = 9$']
    quiz: 2
    source: {cite: mit, at: 'Eq. (5.4.2)'}
    origin: page-own

  - id: quiz-dielectric-battery
    kind: identity
    where: 'quiz 3: with the battery connected, Q = κC₀V becomes κ = 3 times as large'
    formula: 3 * C0 * V
    equals: 3 * (C0 * V)
    samples: {C0: [1.0e-9, 3.5e-10], V: [12.0, 9.0]}
    tolerance: 1e-12
    shown: ['$Q = CV$ becomes three times as large']
    quiz: 3
    source: {cite: mit, at: 'Eqs. (5.5.1) and (5.5.17)'}
    origin: page-own

  - id: epsilon-0
    kind: fact
    where: 'the electric constant, rounded as in the MIT notes and for the whole block'
    value: 8.85e-12 F/m
    tolerance: '0.1%'
    shown: ['Here $\varepsilon_0 = 8.85 \times 10^{-12}\ \text{F/m}$ is', 'with $\varepsilon_0 = 8.85 \times 10^{-12}\ \text{F/m}$. The field']
    source: {cite: mit, at: 'Eq. (5.4.7)'}
    origin: mit

  - id: charge-9v
    where: 'worked example "Charge on a capacitor", step "Charge at 9.0 V"'
    inputs: {C: 470e-6 F, V: 9.0 V}
    formula: C * V
    expected: 4.2e-3 C
    shown: ['$Q = CV = 470 \times 10^{-6} \times 9.0 = 4.2 \times 10^{-3}\ \text{C}$']
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: charge-4v5
    where: 'worked example "Charge on a capacitor", step "Half the voltage"'
    inputs: {C: 470e-6 F, V: 4.5 V}
    formula: C * V
    expected: 2.1e-3 C
    shown: ['$Q = 470 \times 10^{-6} \times 4.5 = 2.1 \times 10^{-3}\ \text{C}$']
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: parallel-plate-from-fields
    kind: identity
    where: 'section "The parallel-plate capacitor": V/d = Q/(ε₀A) gives Q = (ε₀A/d)V'
    formula: eps0 * A * (V / d)
    equals: (eps0 * A / d) * V
    samples: {eps0: [8.85e-12, 8.85e-12], A: [0.04, 0.01], d: [0.001, 0.0005], V: [12.0, 9.0]}
    tolerance: 1e-12
    shown: ['so $Q = (\varepsilon_0 A/d)\,V$']
    source: {cite: mit, at: 'Eqs. (5.2.1) to (5.2.4)'}
    origin: mit

  - id: plate-area
    where: 'worked example "A home-made capacitor": area of a 20 cm square'
    inputs: {s: 0.20 m}
    formula: s**2
    expected: 0.040 m**2
    shown: ['$A = 0.20 \times 0.20 = 0.040\ \text{m}^2$']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: plate-capacitance
    where: 'worked example "A home-made capacitor", step "Capacitance"'
    inputs: {eps0: 8.85e-12 F/m, A: 0.040 m**2, d: 0.0010 m}
    formula: eps0 * A / d
    expected: 3.5e-10 F
    shown: ['$C = \varepsilon_0 A/d = 8.85 \times 10^{-12} \times 0.040/0.0010 = 3.5 \times 10^{-10}\ \text{F}$']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: plate-capacitance-pf
    where: 'the same capacitance in picofarads ("about 350 pF", also quoted in the dielectric example)'
    inputs: {eps0: 8.85e-12 F/m, A: 0.040 m**2, d: 0.0010 m}
    formula: eps0 * A / d
    expected: 350 pF
    tolerance: '2%'
    shown: ['about $350\ \text{pF}$', '($350\ \text{pF}$ with air)']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: plate-capacitance-3sf
    where: 'the capacitance carried to three figures in the next steps, 3.54 × 10⁻¹⁰ F'
    inputs: {eps0: 8.85e-12 F/m, A: 0.040 m**2, d: 0.0010 m}
    formula: eps0 * A / d
    expected: 3.54e-10 F
    shown: ['$Q = CV = 3.54 \times 10^{-10} \times 12', '$C = \kappa C_0 = 3.7 \times 3.54 \times 10^{-10}']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: plate-charge
    where: 'worked example "A home-made capacitor", step "Charge"'
    inputs: {eps0: 8.85e-12 F/m, A: 0.040 m**2, d: 0.0010 m, V: 12 V}
    formula: eps0 * A / d * V
    expected: 4.2e-9 C
    shown: ['$Q = CV = 3.54 \times 10^{-10} \times 12 = 4.2 \times 10^{-9}\ \text{C}$', '$+4.2\ \text{nC}$ on one plate and $-4.2\ \text{nC}$']
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: plate-charge-3sf
    where: 'the charge to three figures in the check, 4.25 × 10⁻⁹ C'
    inputs: {eps0: 8.85e-12 F/m, A: 0.040 m**2, d: 0.0010 m, V: 12 V}
    formula: eps0 * A / d * V
    expected: 4.25e-9 C
    shown: ['$Q/(\varepsilon_0 A) = 4.25 \times 10^{-9}/']
    source: {cite: mit, at: 'Eq. (5.1.1)'}
    origin: page-own

  - id: plate-field
    where: 'worked example "A home-made capacitor", step "Field": E = V/d'
    inputs: {V: 12 V, d: 0.0010 m}
    formula: V / d
    expected: 1.2e4 V/m
    shown: ['$E = V/d = 12/0.0010 = 1.2 \times 10^{4}\ \text{V/m}$']
    source: {cite: mit, at: 'Eq. (5.2.3)'}
    origin: page-own

  - id: plate-field-check
    where: 'worked example, check E = Q/(ε₀A)'
    inputs: {eps0: 8.85e-12 F/m, A: 0.040 m**2, Q: 4.25e-9 C}
    formula: Q / (eps0 * A)
    expected: 1.2e4 V/m
    shown: ['(8.85 \times 10^{-12} \times 0.040) = 1.2 \times 10^{4}\ \text{V/m}$ too']
    source: {cite: mit, at: 'Eq. (5.2.1)'}
    origin: page-own

  - id: farad-area
    where: 'worked example "How large is one farad?", step "Rearrange": A = Cd/ε₀'
    inputs: {C: 1.0 F, d: 0.0010 m, eps0: 8.85e-12 F/m}
    formula: C * d / eps0
    expected: 1.1e8 m**2
    shown: ['$A = Cd/\varepsilon_0 = 1.0 \times 0.0010/(8.85 \times 10^{-12}) = 1.1 \times 10^{8}\ \text{m}^2$']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: farad-area-km2
    where: 'step "Picture it": more than 100 km²'
    inputs: {C: 1.0 F, d: 0.0010 m, eps0: 8.85e-12 F/m}
    formula: C * d / eps0
    expected: 113 km**2
    tolerance: '1%'
    shown: ['That is more than $100\ \text{km}^2$']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: farad-side
    where: 'step "Picture it": a square about 11 km on each side'
    inputs: {C: 1.0 F, d: 0.0010 m, eps0: 8.85e-12 F/m}
    formula: sqrt(C * d / eps0)
    expected: 11 km
    shown: ['a square about $11\ \text{km}$ on each side']
    source: {cite: mit, at: 'Eq. (5.2.4)'}
    origin: page-own

  - id: energy-forms
    kind: identity
    where: 'formula "Energy stored in a capacitor": ½QV = ½CV² = Q²/(2C) with Q = CV'
    formula: 0.5 * (C * V) * V
    equals: (C * V)**2 / (2 * C)
    samples: {C: [2.2e-4, 3.5e-10], V: [330.0, 12.0]}
    tolerance: 1e-12
    shown: ['tex="U = \tfrac12 QV = \tfrac12 CV^2 = \frac{Q^2}{2C}"']
    source: {cite: mit, at: 'Eq. (5.4.2)'}
    origin: mit

  - id: flash-energy
    where: 'worked example "A camera flash", step "Energy"'
    inputs: {C: 220e-6 F, V: 330 V}
    formula: 0.5 * C * V**2
    expected: 12 J
    shown: ['$U = \tfrac12 CV^2 = \tfrac12 \times 220 \times 10^{-6} \times 330^2 = 12\ \text{J}$']
    source: {cite: mit, at: 'Eq. (5.4.2)'}
    origin: page-own

  - id: flash-power
    where: 'worked example "A camera flash", step "Power": energy per second'
    inputs: {C: 220e-6 F, V: 330 V, t: 1.0 ms}
    formula: 0.5 * C * V**2 / t
    expected: 1.2e4 W
    shown: ['$12\ \text{J}/0.0010\ \text{s} = 1.2 \times 10^{4}\ \text{W}$, or $12\ \text{kW}$']
    source: {cite: mit, at: 'Eq. (5.4.2)'}
    origin: page-own

  - id: field-energy
    kind: identity
    where: 'cosmology callout: ½CV² with C = ε₀A/d and V = Ed equals ½ε₀E² × Ad'
    formula: 0.5 * (eps0 * A / d) * (E * d)**2
    equals: 0.5 * eps0 * E**2 * A * d
    samples: {eps0: [8.85e-12, 8.85e-12], A: [0.04, 0.01], d: [0.001, 0.003], E: [1.2e4, 3.0e5]}
    tolerance: 1e-12
    shown: ['you get $U = \tfrac12 \varepsilon_0 E^2 \times Ad$']
    source: {cite: mit, at: 'Eqs. (5.4.3) and (5.4.4)'}
    origin: mit

  - id: kappa-air
    kind: fact
    where: 'dielectric constant of air, 1.00059 in the MIT table, rounded'
    value: '1.0006'
    tolerance: '0.01%'
    shown: ['(1.0006)']
    source: {cite: mit, at: 'Sec. 5.5, table of dielectric constants'}
    origin: mit

  - id: kappa-paper
    kind: fact
    where: 'dielectric constant of paper in the MIT table'
    value: '3.7'
    shown: ['about 3.7 for paper']
    source: {cite: mit, at: 'Sec. 5.5, table of dielectric constants'}
    origin: mit

  - id: kappa-glass
    kind: fact
    where: 'dielectric constant of glass in the MIT table, 4 to 6 (upper value checked)'
    value: '6'
    shown: ['4 to 6 for glass']
    source: {cite: mit, at: 'Sec. 5.5, table of dielectric constants'}
    origin: mit

  - id: kappa-water
    kind: fact
    where: 'dielectric constant of water in the MIT table'
    value: '80'
    shown: ['80 for water']
    source: {cite: mit, at: 'Sec. 5.5, table of dielectric constants'}
    origin: mit

  - id: paper-capacitance
    where: 'worked example "Filling the gap with paper", step "Capacitance"'
    inputs: {kappa: 3.7, C0: 3.54e-10 F}
    formula: kappa * C0
    expected: 1.3e-9 F
    shown: ['$C = \kappa C_0 = 3.7 \times 3.54 \times 10^{-10} = 1.3 \times 10^{-9}\ \text{F}$, or $1.3\ \text{nF}$']
    source: {cite: mit, at: 'Eq. (5.5.1)'}
    origin: page-own

  - id: paper-charge
    where: 'worked example "Filling the gap with paper", step "Charge"'
    inputs: {kappa: 3.7, C0: 3.54e-10 F, V: 12 V}
    formula: kappa * C0 * V
    expected: 1.6e-8 C
    shown: ['$Q = CV = 1.31 \times 10^{-9} \times 12 = 1.6 \times 10^{-8}\ \text{C}$, $3.7$ times as much as with air']
    source: {cite: mit, at: 'Eqs. (5.1.1) and (5.5.1)'}
    origin: page-own
