# Calculations on content/year-0/hs-6/electromagnetic-induction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Formulas: Φ = BA cos θ and ε = −N ΔΦ/Δt (Siyavula Gr 11 Sec. 10.3), ε = BLv (MIT 8.02T Eq. 10.2.1),
# ε = NBAω sin ωt (MIT 8.02T Eq. 10.4.3), V_s/V_p = N_s/N_p (MIT 8.02T Session 21 slide 26).
# `origin: mit` marks a value taken from a cited source, as in the other Block 5 and 6 calcs files.

page: content/year-0/hs-6/electromagnetic-induction.mdx
calcs:
  - id: faraday-year
    kind: fact
    where: 'introduction: the year of Faraday''s discovery'
    value: 1831
    shown: ['In 1831 he found that it can']
    source: {cite: reading1, at: 'Sec. 10.1, p. 1'}
    origin: mit

  - id: weber-unit
    kind: identity
    where: 'section "Magnetic flux": 1 T through 1 m² face on is 1 Wb'
    formula: B * A * cos(theta)
    equals: B * A
    samples: {B: [1.0, 0.4, 2.0], A: [1.0, 0.004, 0.5], theta: [0.0, 0.0, 0.0]}
    tolerance: 1e-12
    shown: ['$1\ \text{Wb} = 1\ \text{T m}^2$']
    source: {cite: reading1, at: 'p. 2, below Eq. (10.1.2)'}
    origin: mit

  - id: loop-area
    where: 'worked example "Flux through a tilted loop": area of an 8.0 cm by 5.0 cm loop'
    inputs: {a: 0.080 m, b: 0.050 m}
    formula: a * b
    expected: 4.0e-3 m**2
    shown: ['$A = 0.080 \times 0.050 = 4.0 \times 10^{-3}\ \text{m}^2$']
    source: {cite: mit, at: 'Sec. 10.3, Magnetic flux'}
    origin: page-own

  - id: loop-flux-face-on
    where: 'worked example, (a): Φ = BA for 0.40 T and 4.0 × 10⁻³ m²'
    inputs: {B: 0.40 T, A: 4.0e-3 m**2}
    formula: B * A
    expected: 1.6e-3 Wb
    shown: ['$\Phi = BA = 0.40 \times 4.0 \times 10^{-3} = 1.6 \times 10^{-3}\ \text{Wb}$']
    source: {cite: mit, at: 'Sec. 10.3, Magnetic flux'}
    origin: page-own

  - id: loop-flux-tilted
    where: 'worked example, (b): Φ = BA cos 60°'
    inputs: {B: 0.40 T, A: 4.0e-3 m**2, theta: 60 deg}
    formula: B * A * cos(theta)
    expected: 8.0e-4 Wb
    shown: ['$\Phi = BA\cos 60^\circ = 1.6 \times 10^{-3} \times 0.50 = 8.0 \times 10^{-4}\ \text{Wb}$']
    source: {cite: mit, at: 'Sec. 10.3, Magnetic flux'}
    origin: page-own

  - id: magnet-flux-start
    where: 'worked example "Switching off an electromagnet": flux through one turn at the start'
    inputs: {B: 0.30 T, A: 2.0e-3 m**2}
    formula: B * A
    expected: 6.0e-4 Wb
    shown: ['$\Phi = BA = 0.30 \times 2.0 \times 10^{-3} = 6.0 \times 10^{-4}\ \text{Wb}$']
    source: {cite: mit, at: 'Sec. 10.3, Magnetic flux'}
    origin: page-own

  - id: magnet-emf
    where: 'worked example, step "Faraday''s law": ε = −N ΔΦ/Δt for 150 turns, ΔΦ = −6.0 × 10⁻⁴ Wb in 0.050 s'
    inputs: {N: 150, dPhi: -6.0e-4 Wb, dt: 0.050 s}
    formula: -N * dPhi / dt
    expected: 1.8 V
    shown: ['= -150 \times \dfrac{-6.0 \times 10^{-4}}{0.050} = 1.8\ \text{V}$']
    source: {cite: mit, at: 'Sec. 10.3, Faraday''s law of electromagnetic induction'}
    origin: page-own

  - id: rod-emf
    where: 'worked example "A rod on rails": ε = BLv for 0.60 T, 0.25 m, 4.0 m/s'
    inputs: {B: 0.60 T, L: 0.25 m, v: 4.0 m/s}
    formula: B * L * v
    expected: 0.60 V
    shown: ['$\varepsilon = BLv = 0.60 \times 0.25 \times 4.0 = 0.60\ \text{V}$']
    source: {cite: reading1, at: 'Eq. (10.2.1), p. 7'}
    origin: page-own

  - id: rod-current
    where: 'worked example: I = ε/R for 0.60 V and 2.0 Ω'
    inputs: {emf: 0.60 V, R: 2.0 ohm}
    formula: emf / R
    expected: 0.30 A
    shown: ['$I = \varepsilon/R = 0.60/2.0 = 0.30\ \text{A}$']
    source: {cite: reading1, at: 'Eq. (10.2.5), p. 7'}
    origin: page-own

  - id: rod-force
    where: 'worked example, step "The braking force": F = BIL'
    inputs: {B: 0.60 T, I: 0.30 A, L: 0.25 m}
    formula: B * I * L
    expected: 0.045 N
    shown: ['$F = BIL = 0.60 \times 0.30 \times 0.25 = 0.045\ \text{N}$', 'you must push with $0.045\ \text{N}$']
    source: {cite: reading1, at: 'Eqs. (10.2.6) and (10.2.7), p. 8'}
    origin: page-own

  - id: rod-power-in
    where: 'worked example, step "Energy check": power put in, Fv'
    inputs: {F: 0.045 N, v: 4.0 m/s}
    formula: F * v
    expected: 0.18 W
    shown: ['$Fv = 0.045 \times 4.0 = 0.18\ \text{W}$']
    source: {cite: reading1, at: 'Eq. (10.2.8), p. 8'}
    origin: page-own

  - id: rod-heat
    where: 'worked example, step "Energy check": heat in the resistor, I²R'
    inputs: {I: 0.30 A, R: 2.0 ohm}
    formula: I**2 * R
    expected: 0.18 W
    shown: ['$I^2R = 0.30^2 \times 2.0 = 0.18\ \text{W}$']
    source: {cite: reading1, at: 'Eq. (10.2.8), p. 8'}
    origin: page-own

  - id: generator-emf-identity
    kind: identity
    where: 'section "Generators and alternating current": ε = −N d(BA cos ωt)/dt equals NBAω sin ωt'
    formula: -deriv('N * B * A * cos(omega * x)', 'x', t, 1)
    equals: N * B * A * omega * sin(omega * t)
    samples: {N: [100, 50, 10], B: [0.20, 0.5, 1.0], A: [0.010, 0.02, 0.1], omega: [314.159, 100.0, 10.0], t: [0.001, 0.013, 0.2]}
    tolerance: 1e-6
    shown: ['tex="\varepsilon = NBA\omega\sin(\omega t)"']
    source: {cite: reading1, at: 'Eqs. (10.4.1) to (10.4.3), pp. 11 and 12'}
    origin: mit

  - id: generator-omega
    where: 'worked example "A small generator": ω = 2πf at 50 Hz'
    inputs: {f: 50 1/s}
    formula: 2 * pi * f
    expected: 314 rad/s
    tolerance: '0.1%'
    shown: ['$\omega = 2\pi f = 2\pi \times 50 = 314\ \text{rad/s}$']
    source: {cite: reading1, at: 'Eq. (10.4.3), p. 12'}
    origin: page-own

  - id: generator-peak
    where: 'worked example and plot caption: peak emf NBAω for 100 turns, 0.20 T, 0.010 m², 50 Hz'
    inputs: {N: 100, B: 0.20 T, A: 0.010 m**2, f: 50 1/s}
    formula: N * B * A * 2 * pi * f
    expected: 63 V
    tolerance: '0.5%'
    shown: ['$NBA\omega = 100 \times 0.20 \times 0.010 \times 314 = 63\ \text{V}$', 'With 100 turns at 50 Hz the peak is about 63 V']
    source: {cite: reading1, at: 'Eq. (10.4.3), p. 12'}
    origin: page-own

  - id: plot-max
    where: 'plot: the largest peak (200 turns at 60 Hz) fits in the range of ±160 V'
    inputs: {N: 200, B: 0.20 T, A: 0.010 m**2, f: 60 1/s}
    formula: N * B * A * 2 * pi * f
    expected: 151 V
    tolerance: '0.5%'
    shown: ['range={[-160, 160]}']
    source: {cite: reading1, at: 'Eq. (10.4.3), p. 12'}
    origin: page-own

  - id: mains-frequency
    kind: fact
    where: 'section "Generators and alternating current": mains frequency'
    value: 50 1/s
    shown: ['alternates $50$ times a second, at $50\ \text{Hz}$', 'still give $50\ \text{Hz}$']
    source: {cite: siy-ac, at: 'Sec. 11.3'}
    origin: mit

  - id: mains-peak
    where: 'section "Generators and alternating current": peak of the 230 V (rms) mains, V_max = √2 V_rms'
    inputs: {V: 230 V}
    formula: sqrt(2) * V
    expected: 325 V
    tolerance: '0.1%'
    shown: ['about $\sqrt{2} \times 230 \approx 325\ \text{V}$']
    source: {cite: siy-ac, at: 'Sec. 11.3, Current and voltage'}
    origin: page-own

  - id: lamp-secondary-turns
    where: 'worked example "A transformer for a 12 V lamp", (a): N_s = N_p V_s/V_p'
    inputs: {Np: 1150, Vs: 12 V, Vp: 230 V}
    formula: Np * Vs / Vp
    expected: 60
    shown: ['$N_s = N_p\,\dfrac{V_s}{V_p} = 1150 \times \dfrac{12}{230} = 60$ turns']
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own

  - id: lamp-power
    where: 'worked example, (b): lamp power V_s I_s'
    inputs: {Vs: 12 V, Is: 1.5 A}
    formula: Vs * Is
    expected: 18 W
    shown: ['$P = V_sI_s = 12 \times 1.5 = 18\ \text{W}$']
    source: {cite: siy-ac, at: 'Sec. 11.3 (power P = VI of lesson 6.8; the numbers are the page''s own)'}
    origin: page-own

  - id: lamp-primary-current
    where: 'worked example, (b): I_p = P/V_p for an ideal transformer'
    inputs: {P: 18 W, Vp: 230 V}
    formula: P / Vp
    expected: 0.078 A
    tolerance: '0.5%'
    shown: ['$I_p = P/V_p = 18/230 = 0.078\ \text{A}$']
    source: {cite: siy-ac, at: 'Sec. 11.3 (high voltage, low current), with the power balance V_p I_p = V_s I_s derived on the page from conservation of energy'}
    origin: page-own

  - id: substation-turns-ratio
    where: 'worked example "A substation transformer", (a): N_p/N_s = V_p/V_s for 400 kV down to 10 kV'
    inputs: {Vp: 400 kV, Vs: 10 kV}
    formula: Vp / Vs
    expected: 40
    shown: ['\dfrac{400 \times 10^3}{10 \times 10^3} = 40$', 'down by a factor of $40$']
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own

  - id: substation-primary-turns
    where: 'worked example, (a): N_p = 40 × 250'
    inputs: {Ns: 250, Vp: 400 kV, Vs: 10 kV}
    formula: Ns * Vp / Vs
    expected: 10000
    shown: ['$N_p = 40 \times 250 = 10\,000$ turns']
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own

  - id: substation-line-current
    where: 'worked example, (b): I_p = P/V_p for 12 MW at 400 kV'
    inputs: {P: 12 MW, Vp: 400 kV}
    formula: P / Vp
    expected: 30 A
    shown: ['$I_p = P/V_p = 12 \times 10^6/(400 \times 10^3) = 30\ \text{A}$']
    source: {cite: siy-ac, at: 'Sec. 11.3 (high voltage, low current), with the power balance V_p I_p = V_s I_s derived on the page from conservation of energy'}
    origin: page-own

  - id: substation-secondary-current
    where: 'worked example, (b): I_s = P/V_s for 12 MW at 10 kV'
    inputs: {P: 12 MW, Vs: 10 kV}
    formula: P / Vs
    expected: 1200 A
    shown: ['$I_s = P/V_s = 12 \times 10^6/(10 \times 10^3) = 1200\ \text{A}$']
    source: {cite: siy-ac, at: 'Sec. 11.3 (high voltage, low current), with the power balance V_p I_p = V_s I_s derived on the page from conservation of energy'}
    origin: page-own

  - id: substation-current-ratio
    where: 'worked example, (b): the current goes up by the same factor, 1200/30'
    inputs: {Is: 1200 A, Ip: 30 A}
    formula: Is / Ip
    expected: 40
    shown: ['$1200/30 = 40$']
    source: {cite: siy-ac, at: 'Sec. 11.3 (high voltage, low current), with the power balance V_p I_p = V_s I_s derived on the page from conservation of energy'}
    origin: page-own

  - id: quiz-faraday-emf
    where: 'quiz 1: |ε| = N ΔΦ/Δt for 400 turns, 3.0 × 10⁻⁴ Wb in 0.020 s'
    inputs: {N: 400, dPhi: 3.0e-4 Wb, dt: 0.020 s}
    formula: N * dPhi / dt
    expected: 6.0 V
    shown: ['$|\\varepsilon| = N\\,\\Delta\\Phi/\\Delta t = 400 \\times 3.0 \\times 10^{-4}/0.020 = 6.0\\ \\text{V}$']
    quiz: 1
    source: {cite: mit, at: 'Sec. 10.3, Faraday''s law of electromagnetic induction'}
    origin: page-own

  - id: quiz-faraday-wrong
    where: 'quiz 1 explanation: forgetting the 400 turns'
    inputs: {dPhi: 3.0e-4 Wb, dt: 0.020 s}
    formula: dPhi / dt
    expected: 0.015 V
    shown: ['Forgetting the $400$ turns gives $0.015\\ \\text{V}$']
    source: {cite: mit, at: 'Sec. 10.3, Faraday''s law of electromagnetic induction'}
    origin: page-own

  - id: quiz-transformer
    where: 'quiz 4: V_s = V_p N_s/N_p for 230 V, 120 and 2300 turns'
    inputs: {Vp: 230 V, Ns: 120, Np: 2300}
    formula: Vp * Ns / Np
    expected: 12 V
    shown: ['$V_s = V_p\\,N_s/N_p = 230 \\times 120/2300 = 12\\ \\text{V}$']
    quiz: 4
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own

  - id: quiz-transformer-wrong
    where: 'quiz 4 explanation: the ratio upside down'
    inputs: {Vp: 230 V, Ns: 120, Np: 2300}
    formula: Vp * Np / Ns
    expected: 4.4 kV
    tolerance: '0.5%'
    shown: ['the wrong answer $4.4\\ \\text{kV}$']
    source: {cite: reading3, at: 'slide 26'}
    origin: page-own
