# Calculations on content/year-0/hs-6/light-as-an-electromagnetic-wave.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Block 6 constants: mu0 = 4π × 10⁻⁷ T m/A, eps0 = 8.85 × 10⁻¹² F/m; c = 3.00 × 10⁸ m/s as in lesson 5.8.
# Page numbers are the printed footers of MIT 8.02T Course Notes Chapter 13.

page: content/year-0/hs-6/light-as-an-electromagnetic-wave.mdx
calcs:
  - id: sun-distance
    kind: fact
    where: 'introduction: sunlight crosses 150 million kilometres (mean Sun-Earth distance 1.50 × 10¹¹ m in the source)'
    value: 1.50e11 m
    shown: ['150 million kilometres']
    source: {cite: mit, at: 'Example 13.1, p. 16'}
    origin: mit

  - id: mu0
    kind: fact
    where: 'section "Maxwell''s prediction": the permeability of free space'
    value: 1.2566e-6 T*m/A
    shown: ['the permeability of free space $\mu_0 = 4\pi \times 10^{-7}\ \text{T m/A}$']
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: mit

  - id: eps0
    kind: fact
    where: 'section "Maxwell''s prediction": the electric constant'
    value: 8.85e-12 F/m
    shown: ['the electric constant $\varepsilon_0 = 8.85 \times 10^{-12}\ \text{F/m}$']
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: mit

  - id: mu0-eps0
    where: 'worked example "Working out the speed of light", step 1: μ₀ε₀'
    inputs: {mu0: 1.2566370614e-6 T*m/A, eps0: 8.85e-12 F/m}
    formula: mu0 * eps0
    expected: 1.11e-17 s**2/m**2
    tolerance: '1%'
    shown: ['$\mu_0\varepsilon_0 = 4\pi \times 10^{-7} \times 8.85 \times 10^{-12} = 1.11 \times 10^{-17}\ \text{s}^2/\text{m}^2$']
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: page-own

  - id: sqrt-mu0-eps0
    where: 'worked example, step 2: the square root of μ₀ε₀'
    inputs: {mu0: 1.2566370614e-6 T*m/A, eps0: 8.85e-12 F/m}
    formula: sqrt(mu0 * eps0)
    expected: 3.33e-9 s/m
    tolerance: '1%'
    shown: ['$\sqrt{1.11 \times 10^{-17}} = 3.33 \times 10^{-9}\ \text{s/m}$']
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: page-own

  - id: maxwell-c
    where: 'worked example, step 2: c = 1/√(μ₀ε₀) from the Block 6 constants (2.9986 × 10⁸ m/s)'
    inputs: {mu0: 1.2566370614e-6 T*m/A, eps0: 8.85e-12 F/m}
    formula: 1 / sqrt(mu0 * eps0)
    expected: 3.00e8 m/s
    tolerance: '0.5%'
    shown: ['$c = 1/(3.33 \times 10^{-9}) = 3.00 \times 10^{8}\ \text{m/s}$', '$c = 1/\sqrt{\mu_0\varepsilon_0} \approx 3.00 \times 10^{8}\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: mit

  - id: quiz-eps-four
    kind: identity
    where: 'quiz 2: four times ε₀ halves c = 1/√(μ₀ε₀)'
    formula: 1 / sqrt(mu0 * 4 * eps0)
    equals: 0.5 / sqrt(mu0 * eps0)
    samples: {mu0: [1.2566370614e-6, 1.0], eps0: [8.85e-12, 2.0]}
    tolerance: 1e-12
    shown: ['Four times $\\varepsilon_0$ makes the square root twice as large, so $c$ would be half as large.']
    quiz: 2
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: page-own

  - id: quiz-b-from-e
    where: 'quiz 3: B = E/c for 1.5 V/m'
    inputs: {E: 1.5 V/m, c: 3.00e8 m/s}
    formula: E / c
    expected: 5.0e-9 T
    shown: ['$B = E/c = 1.5/(3.00 \\times 10^{8}) = 5.0 \\times 10^{-9}\\ \\text{T}$']
    quiz: 3
    source: {cite: mit, at: 'Eq. (13.4.27), p. 11'}
    origin: page-own

  - id: quiz-b-wrong
    where: 'quiz 3: the wrong choice from multiplying by c'
    inputs: {E: 1.5, c: 3.00e8}
    formula: E * c
    expected: 4.5e8
    shown: ['$4.5 \\times 10^{8}\\ \\text{T}$']
    source: {cite: mit, at: 'Eq. (13.4.27), p. 11'}
    origin: page-own

  - id: quiz-b-vs-earth
    where: 'quiz 3 explanation: the Earth''s field (5 × 10⁻⁵ T, lesson 6.10) is about ten thousand times 5.0 × 10⁻⁹ T'
    inputs: {Be: 5e-5 T, B: 5.0e-9 T}
    formula: Be / B
    expected: 1.0e4
    shown: ['about ten thousand times weaker than the Earth''s magnetic field']
    source: {cite: mit, at: 'Eq. (13.4.27), p. 11'}
    origin: page-own

  - id: plot-b-amplitude
    where: 'plot caption: B = E/c for E = 6 V/m, in nanotesla'
    inputs: {E: 6 V/m, c: 3.00e8 m/s}
    formula: E / c
    expected: 20 nT
    shown: ['which gives 20 nT at the crests']
    source: {cite: mit, at: 'Eq. (13.4.27), p. 11'}
    origin: page-own

  - id: plot-frequency
    where: 'plot caption: f = c/λ for λ = 2.0 m'
    inputs: {c: 3.00e8 m/s, lam: 2.0 m}
    formula: c / lam
    expected: 150 MHz
    shown: ['wavelength 2.0 m (frequency 150 MHz)']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: plot-speed-per-ns
    where: 'plot caption: distance moved by the wave in one nanosecond'
    inputs: {c: 3.00e8 m/s, t: 1 ns}
    formula: c * t
    expected: 0.3 m
    shown: ['the wave moves 0.3 m every nanosecond']
    source: {cite: mit, at: 'Eq. (13.4.15), p. 9'}
    origin: page-own

  - id: radio-b
    where: 'worked example "The fields of a radio signal": B = E/c for 0.030 V/m'
    inputs: {E: 0.030 V/m, c: 3.00e8 m/s}
    formula: E / c
    expected: 1.0e-10 T
    shown: ['$B = E/c = 0.030/(3.00 \times 10^{8}) = 1.0 \times 10^{-10}\ \text{T}$']
    source: {cite: mit, at: 'Eq. (13.4.27), p. 11'}
    origin: page-own

  - id: radio-b-vs-earth
    where: 'worked example: the Earth''s field 5 × 10⁻⁵ T is half a million times 1.0 × 10⁻¹⁰ T'
    inputs: {Be: 5e-5 T, B: 1.0e-10 T}
    formula: Be / B
    expected: 5e5
    shown: ['That is half a million times weaker than the Earth''s magnetic field ($5 \times 10^{-5}\ \text{T}$, lesson 6.10)']
    source: {cite: mit, at: 'Eq. (13.4.27), p. 11'}
    origin: page-own

  - id: tv-wavelength
    where: 'worked example "An antenna for a television channel", step "Wavelength": λ = c/f at 600 MHz'
    inputs: {c: 3.00e8 m/s, f: 6.00e8 1/s}
    formula: c / f
    expected: 0.500 m
    shown: ['$\lambda = c/f = (3.00 \times 10^{8})/(6.00 \times 10^{8}) = 0.500\ \text{m}$', '$600\ \text{MHz} = 6.00 \times 10^{8}\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: tv-rod
    where: 'worked example, step "Rod length": a quarter wavelength'
    inputs: {lam: 0.500 m}
    formula: lam / 4
    expected: 0.125 m
    shown: ['$0.500/4 = 0.125\ \text{m}$, about $12.5\ \text{cm}$']
    source: {cite: mit, at: 'Sec. 13.8, pp. 22–23'}
    origin: page-own

  - id: tv-antenna
    where: 'worked example, step "Rod length": two rods, half a wavelength'
    inputs: {lam: 0.500 m}
    formula: lam / 2
    expected: 25 cm
    shown: ['the whole antenna is $25\ \text{cm}$ long']
    source: {cite: mit, at: 'Sec. 13.8, pp. 22–23'}
    origin: page-own

  - id: hertz-year
    kind: fact
    where: 'section "How electromagnetic waves are made" and summary: the year of Hertz''s experiment'
    value: 1887
    shown: ['Heinrich Hertz in 1887', 'with sparks in 1887']
    source: {cite: mit, at: 'Sec. 13.3, p. 5'}
    origin: mit

  - id: energy-halves
    kind: identity
    where: 'section "Electromagnetic waves carry energy": with E = cB and c = 1/√(μ₀ε₀), B²/(2μ₀) equals ½ε₀E²'
    formula: (E / (1 / sqrt(mu0 * eps0)))**2 / (2 * mu0)
    equals: 0.5 * eps0 * E**2
    samples: {E: [1.0, 0.03, 600.0], mu0: [1.2566370614e-6, 1.0, 2.0], eps0: [8.85e-12, 3.0, 0.5]}
    tolerance: 1e-12
    shown: ['half of the energy is in the electric field and half in the magnetic field']
    source: {cite: mit, at: 'Eq. (13.6.10), p. 16'}
    origin: mit

  - id: intensity-inverse-square
    kind: identity
    where: 'section "Electromagnetic waves carry energy": twice as far, four times smaller intensity'
    formula: P / (4 * pi * (2 * r)**2)
    equals: 0.25 * P / (4 * pi * r**2)
    samples: {P: [1.0, 5e4], r: [1.0, 1e4]}
    tolerance: 1e-12
    shown: ['Twice as far away, the intensity is four times smaller.']
    source: {cite: mit, at: 'Eq. (13.6.13), p. 17'}
    origin: page-own

  - id: radio-intensity
    where: 'worked example "How much power reaches a radio": I = P/(4πr²) for 50 kW at 10 km'
    inputs: {P: 50 kW, r: 10 km}
    formula: P / (4 * pi * r**2)
    expected: 4.0e-5 W/m**2
    tolerance: '1%'
    shown: ['$I = P/(4\pi r^2) = (5.0 \times 10^{4})/(4\pi \times (1.0 \times 10^{4})^2) = 4.0 \times 10^{-5}\ \text{W/m}^2$', 'Each square metre receives only 40 millionths of a watt']
    source: {cite: mit, at: 'Eq. (13.6.13), p. 17'}
    origin: page-own
