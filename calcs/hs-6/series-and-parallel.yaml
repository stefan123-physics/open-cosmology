# Calculations on content/year-0/hs-6/series-and-parallel.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/series-and-parallel.mdx
calcs:
  - id: quiz-series-total
    where: 'quiz 0: 40 Ω and 60 Ω in series'
    inputs: {R1: 40 ohm, R2: 60 ohm}
    formula: R1 + R2
    expected: 100 ohm
    shown: ['$40 + 60 = 100\\ \\text{Ω}$']
    source: {cite: mit, at: 'Eq. (7.3.2)'}
    origin: page-own

  - id: quiz-series-current
    where: 'quiz 0: I = V/R with 10 V across 100 Ω'
    inputs: {V: 10 V, R1: 40 ohm, R2: 60 ohm}
    formula: V / (R1 + R2)
    expected: 0.10 A
    shown: ['$I = V/R = 10/100 = 0.10\\ \\text{A}$']
    quiz: 0
    source: {cite: mit, at: 'Eq. (7.4.4)'}
    origin: page-own

  - id: quiz-series-distractor-parallel
    where: 'quiz 0, wrong choice: 10 V over the parallel total of 40 Ω and 60 Ω'
    inputs: {V: 10 V, R1: 40 ohm, R2: 60 ohm}
    formula: V * (R1 + R2) / (R1 * R2)
    expected: 0.42 A
    shown: ['"$0.42\\ \\text{A}$"']
    source: {cite: mit, at: 'Eq. (7.3.5)'}
    origin: page-own

  - id: quiz-parallel-small
    where: 'quiz 1: 10 Ω in parallel with 1000 Ω'
    inputs: {R1: 10 ohm, R2: 1000 ohm}
    formula: R1 * R2 / (R1 + R2)
    expected: 9.9 ohm
    shown: ['$R_\\text{p} = 10 \\times 1000/1010 = 9.9\\ \\text{Ω}$']
    # no quiz key: calc:test also matches the choice "a little less than 10 Ω" (it reads 10), so it cannot single out the answer
    source: {cite: mit, at: 'Sec. 7.3, after Eq. (7.3.6)'}
    origin: page-own

  - id: quiz-junction
    where: 'quiz 2: 2.5 A in, 1.0 A out by one wire'
    inputs: {I: 2.5 A, I1: 1.0 A}
    formula: I - I1
    expected: 1.5 A
    shown: ['$2.5 - 1.0 = 1.5\\ \\text{A}$']
    # no quiz key: choice 2 ("1.5 A, because energy is conserved") has the same number, so calc:test cannot single out the answer
    source: {cite: mit, at: 'Eq. (7.4.1)'}
    origin: page-own

  - id: quiz-loop
    where: 'quiz 3: 9.0 V shared by two lamps, 3.5 V across the first'
    inputs: {V: 9.0 V, V1: 3.5 V}
    formula: V - V1
    expected: 5.5 V
    shown: ['$9.0 - 3.5 = 5.5\\ \\text{V}$']
    quiz: 3
    source: {cite: mit, at: 'Eq. (7.4.2)'}
    origin: page-own

  - id: quiz-internal-lost
    where: 'quiz 4: lost volts ε − V'
    inputs: {emf: 1.5 V, V: 1.2 V}
    formula: emf - V
    expected: 0.3 V
    shown: ['$\\varepsilon - V = 1.5 - 1.2 = 0.3\\ \\text{V}$']
    source: {cite: mit, at: 'Eq. (7.2.5)'}
    origin: page-own

  - id: quiz-internal-r
    where: 'quiz 4: r = (ε − V)/I'
    inputs: {emf: 1.5 V, V: 1.2 V, I: 0.60 A}
    formula: (emf - V) / I
    expected: 0.50 ohm
    shown: ['$r = 0.3/0.60 = 0.50\\ \\text{Ω}$']
    quiz: 4
    source: {cite: mit, at: 'Eq. (7.2.5)'}
    origin: page-own

  - id: quiz-internal-distractors
    where: 'quiz 4, wrong choice V/I'
    inputs: {emf: 1.5 V, V: 1.2 V, I: 0.60 A}
    formula: V / I
    expected: 2.0 ohm
    shown: ['"$2.0\\ \\text{Ω}$"']
    source: {cite: mit, at: 'Eq. (7.2.5)'}
    origin: page-own

  - id: quiz-internal-distractor-emf
    where: 'quiz 4, wrong choice ε/I'
    inputs: {emf: 1.5 V, I: 0.60 A}
    formula: emf / I
    expected: 2.5 ohm
    shown: ['"$2.5\\ \\text{Ω}$"']
    source: {cite: mit, at: 'Eq. (7.2.5)'}
    origin: page-own

  - id: quiz-internal-distractor-product
    where: 'quiz 4, wrong choice (ε − V)·I: the lost volts multiplied by the current instead of divided (numbers only, since the product is not a resistance)'
    inputs: {lost: 0.3, I: 0.60}
    formula: lost * I
    expected: 0.18
    shown: ['"$0.18\\ \\text{Ω}$"']
    source: {cite: mit, at: 'Eq. (7.2.5)'}
    origin: page-own

  - id: quiz-series-distractor-one
    where: 'quiz 0, wrong choice: 10 V over the 40 Ω resistor alone'
    inputs: {V: 10 V, R1: 40 ohm}
    formula: V / R1
    expected: 0.25 A
    shown: ['"$0.25\\ \\text{A}$"']
    source: {cite: mit, at: 'Eq. (7.2.4)'}
    origin: page-own

  - id: quiz-parallel-distractor-sum
    where: 'quiz 1, wrong choice: the series sum'
    inputs: {R1: 10 ohm, R2: 1000 ohm}
    formula: R1 + R2
    expected: 1010 ohm
    shown: ['"$1010\\ \\text{Ω}$"']
    source: {cite: mit, at: 'Eq. (7.3.2)'}
    origin: page-own

  - id: quiz-parallel-distractor-half
    where: 'quiz 1, wrong choice: half the sum'
    inputs: {R1: 10 ohm, R2: 1000 ohm}
    formula: (R1 + R2) / 2
    expected: 505 ohm
    shown: ['"about $505\\ \\text{Ω}$"']
    source: {cite: mit, at: 'Eq. (7.3.5)'}
    origin: page-own

  - id: quiz-parallel-distractor-difference
    where: 'quiz 1, wrong choice: the difference'
    inputs: {R1: 10 ohm, R2: 1000 ohm}
    formula: R2 - R1
    expected: 990 ohm
    shown: ['"about $990\\ \\text{Ω}$"']
    source: {cite: mit, at: 'Eq. (7.3.5)'}
    origin: page-own

  - id: quiz-loop-distractor-sum
    where: 'quiz 3, wrong choice: the two voltages added instead of subtracted'
    inputs: {V: 9.0 V, V1: 3.5 V}
    formula: V + V1
    expected: 12.5 V
    shown: ['"$12.5\\ \\text{V}$"']
    source: {cite: mit, at: 'Eq. (7.4.2)'}
    origin: page-own

  - id: series-total
    where: 'worked example "Two resistors in series", step "Total resistance"'
    inputs: {R1: 10 ohm, R2: 20 ohm}
    formula: R1 + R2
    expected: 30 ohm
    shown: ['$R_\text{s} = 10 + 20 = 30\ \text{Ω}$']
    source: {cite: mit, at: 'Eq. (7.3.2)'}
    origin: page-own

  - id: series-current
    where: 'worked example "Two resistors in series", step "Current"'
    inputs: {V: 6.0 V, R1: 10 ohm, R2: 20 ohm}
    formula: V / (R1 + R2)
    expected: 0.20 A
    shown: ['$I = V/R_\text{s} = 6.0/30 = 0.20\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.4.4)'}
    origin: page-own

  - id: series-v1
    where: 'worked example "Two resistors in series": V₁ = IR₁'
    inputs: {I: 0.20 A, R1: 10 ohm}
    formula: I * R1
    expected: 2.0 V
    shown: ['$V_1 = IR_1 = 0.20 \times 10 = 2.0\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.3.1)'}
    origin: page-own

  - id: series-v2
    where: 'worked example "Two resistors in series": V₂ = IR₂'
    inputs: {I: 0.20 A, R2: 20 ohm}
    formula: I * R2
    expected: 4.0 V
    shown: ['$V_2 = IR_2 = 0.20 \times 20 = 4.0\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.3.1)'}
    origin: page-own

  - id: series-loop-check
    where: 'worked example "Two resistors in series": loop rule check'
    inputs: {V1: 2.0 V, V2: 4.0 V}
    formula: V1 + V2
    expected: 6.0 V
    shown: ['$2.0 + 4.0 = 6.0\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.4.3)'}
    origin: page-own

  - id: parallel-i1
    where: 'worked example "Two resistors in parallel": I₁ = V/R₁'
    inputs: {V: 12 V, R1: 20 ohm}
    formula: V / R1
    expected: 0.60 A
    shown: ['$I_1 = 12/20 = 0.60\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.3.4)'}
    origin: page-own

  - id: parallel-i2
    where: 'worked example "Two resistors in parallel": I₂ = V/R₂'
    inputs: {V: 12 V, R2: 30 ohm}
    formula: V / R2
    expected: 0.40 A
    shown: ['$I_2 = 12/30 = 0.40\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.3.4)'}
    origin: page-own

  - id: parallel-total-current
    where: 'worked example "Two resistors in parallel": junction rule'
    inputs: {V: 12 V, R1: 20 ohm, R2: 30 ohm}
    formula: V / R1 + V / R2
    expected: 1.0 A
    shown: ['$I = 0.60 + 0.40 = 1.0\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.3.4)'}
    origin: page-own

  - id: parallel-total-resistance
    where: 'worked example "Two resistors in parallel": product over sum'
    inputs: {R1: 20 ohm, R2: 30 ohm}
    formula: R1 * R2 / (R1 + R2)
    expected: 12 ohm
    shown: ['$R_\text{p} = 20 \times 30/(20 + 30) = 12\ \text{Ω}$']
    source: {cite: mit, at: 'Sec. 7.3, after Eq. (7.3.6)'}
    origin: page-own

  - id: parallel-check
    where: 'worked example "Two resistors in parallel": I = V/R_p'
    inputs: {V: 12 V, R1: 20 ohm, R2: 30 ohm}
    formula: V / (R1 * R2 / (R1 + R2))
    expected: 1.0 A
    shown: ['$I = V/R_\text{p} = 12/12 = 1.0\ \text{A}$']
    source: {cite: mit, at: 'Sec. 7.3, V = IReq after Eq. (7.3.4)'}
    origin: page-own

  - id: combo-pair
    where: 'worked example "A resistor in series with a parallel pair", step "Replace the parallel pair"'
    inputs: {R2: 10 ohm, R3: 15 ohm}
    formula: R2 * R3 / (R2 + R3)
    expected: 6.0 ohm
    shown: ['$R_\text{p} = 10 \times 15/(10 + 15) = 6.0\ \text{Ω}$']
    source: {cite: mit, at: 'Sec. 7.3, after Eq. (7.3.6)'}
    origin: page-own

  - id: combo-total
    where: 'worked example, step "Total resistance and current": R'
    inputs: {R1: 4.0 ohm, R2: 10 ohm, R3: 15 ohm}
    formula: R1 + R2 * R3 / (R2 + R3)
    expected: 10 ohm
    shown: ['$R = 4.0 + 6.0 = 10\ \text{Ω}$']
    source: {cite: mit, at: 'Eq. (7.3.2)'}
    origin: page-own

  - id: combo-current
    where: 'worked example, step "Total resistance and current": I'
    inputs: {V: 12 V, R1: 4.0 ohm, R2: 10 ohm, R3: 15 ohm}
    formula: V / (R1 + R2 * R3 / (R2 + R3))
    expected: 1.2 A
    shown: ['$I = 12/10 = 1.2\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.3.2)'}
    origin: page-own

  - id: combo-v-series
    where: 'worked example, step "Voltages": across 4.0 Ω'
    inputs: {I: 1.2 A, R1: 4.0 ohm}
    formula: I * R1
    expected: 4.8 V
    shown: ['$1.2 \times 4.0 = 4.8\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.3.1)'}
    origin: page-own

  - id: combo-v-pair
    where: 'worked example, step "Voltages": across the pair'
    inputs: {I: 1.2 A, Rp: 6.0 ohm}
    formula: I * Rp
    expected: 7.2 V
    shown: ['$1.2 \times 6.0 = 7.2\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.3.1)'}
    origin: page-own

  - id: combo-loop
    where: 'worked example, step "Voltages": loop rule'
    inputs: {V1: 4.8 V, Vp: 7.2 V}
    formula: V1 + Vp
    expected: 12 V
    shown: ['$4.8 + 7.2 = 12\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.4.2)'}
    origin: page-own

  - id: combo-i10
    where: 'worked example, step "Currents in the pair": 10 Ω branch'
    inputs: {Vp: 7.2 V, R2: 10 ohm}
    formula: Vp / R2
    expected: 0.72 A
    shown: ['$7.2/10 = 0.72\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.3.4)'}
    origin: page-own

  - id: combo-i15
    where: 'worked example, step "Currents in the pair": 15 Ω branch'
    inputs: {Vp: 7.2 V, R3: 15 ohm}
    formula: Vp / R3
    expected: 0.48 A
    shown: ['$7.2/15 = 0.48\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.3.4)'}
    origin: page-own

  - id: combo-junction
    where: 'worked example, step "Currents in the pair": junction rule'
    inputs: {Ia: 0.72 A, Ib: 0.48 A}
    formula: Ia + Ib
    expected: 1.2 A
    shown: ['$0.72 + 0.48 = 1.2\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.4.1)'}
    origin: page-own

  - id: battery-current
    where: 'worked example "A battery with internal resistance", step "Current"'
    inputs: {emf: 6.0 V, R: 2.6 ohm, r: 0.40 ohm}
    formula: emf / (R + r)
    expected: 2.0 A
    shown: ['$I = \varepsilon/(R + r) = 6.0/(2.6 + 0.40) = 2.0\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.2.7)'}
    origin: page-own

  - id: battery-terminal
    where: 'worked example, step "Terminal voltage": V = ε − Ir'
    inputs: {emf: 6.0 V, I: 2.0 A, r: 0.40 ohm}
    formula: emf - I * r
    expected: 5.2 V
    shown: ['$V = \varepsilon - Ir = 6.0 - 2.0 \times 0.40 = 5.2\ \text{V}$']
    source: {cite: mit, at: 'Eq. (7.2.5)'}
    origin: page-own

  - id: battery-terminal-check
    where: 'worked example, step "Terminal voltage": V = IR across the load'
    inputs: {I: 2.0 A, R: 2.6 ohm}
    formula: I * R
    expected: 5.2 V
    shown: ['$V = IR = 2.0 \times 2.6 = 5.2\ \text{V}$']
    source: {cite: mit, at: 'Sec. 7.2, Eq. (7.2.6)'}
    origin: page-own

  - id: battery-short
    where: 'worked example, step "Short circuit": I = ε/r'
    inputs: {emf: 6.0 V, r: 0.40 ohm}
    formula: emf / r
    expected: 15 A
    shown: ['$I = \varepsilon/r = 6.0/0.40 = 15\ \text{A}$']
    source: {cite: mit, at: 'Eq. (7.2.7) with R = 0'}
    origin: page-own

  - id: series-identity
    kind: identity
    where: 'section "Resistors in series": V = IR₁ + IR₂ = I(R₁ + R₂)'
    formula: I * R1 + I * R2
    equals: I * (R1 + R2)
    samples: {I: [0.2, 1.5], R1: [10.0, 3.0], R2: [20.0, 7.0]}
    tolerance: 1e-12
    shown: ['$V = IR_1 + IR_2 = I(R_1 + R_2)$']
    source: {cite: mit, at: 'Eq. (7.3.1)'}
    origin: mit

  - id: parallel-identity
    kind: identity
    where: 'two resistors in parallel: 1/(1/R₁ + 1/R₂) = R₁R₂/(R₁ + R₂)'
    formula: 1 / (1 / R1 + 1 / R2)
    equals: R1 * R2 / (R1 + R2)
    samples: {R1: [20.0, 10.0, 4.0], R2: [30.0, 15.0, 1000.0]}
    tolerance: 1e-12
    shown: ['tex="R_\text{p} = \frac{R_1 R_2}{R_1 + R_2}"']
    source: {cite: mit, at: 'Sec. 7.3, after Eq. (7.3.6)'}
    origin: mit

  - id: internal-identity
    kind: identity
    where: 'loop rule ε = IR + Ir gives I = ε/(R + r)'
    formula: (emf / (R + r)) * R + (emf / (R + r)) * r
    equals: emf
    samples: {emf: [6.0, 1.5], R: [2.6, 10.0], r: [0.4, 0.5]}
    tolerance: 1e-12
    shown: ['$\varepsilon = IR + Ir$']
    source: {cite: mit, at: 'Eq. (7.2.6)'}
    origin: mit
