# Calculations on content/year-0/hs-6/coulombs-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/coulombs-law.mdx
calcs:
  - id: quiz-double-distance
    kind: identity
    quiz: 0
    where: 'quiz 0: twice the distance gives a quarter of F = kQ₁Q₂/r²'
    formula: k * Q1 * Q2 / (2 * r)**2
    equals: 0.25 * k * Q1 * Q2 / r**2
    samples: {k: [9.0e9, 9.0e9], Q1: [1e-6, 3e-9], Q2: [2e-6, 5e-9], r: [0.1, 0.03]}
    tolerance: 1e-12
    shown: ['twice the distance gives $1/2^2 = 1/4$ of the force']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: quiz-charge-factor
    quiz: 1
    where: 'quiz 1: one charge ×3, the other ×½, so the force changes by 1.5'
    inputs: {}
    formula: 3 * 0.5
    expected: '1.5'
    shown: ['so it changes by $3 \\times \\tfrac12 = 1.5$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: quiz-two-microcoulomb
    where: 'quiz 2: +2.0 μC and +3.0 μC at 0.30 m'
    inputs: {k: 9.0e9, Q1: 2.0e-6, Q2: 3.0e-6, r: 0.30}
    formula: k * Q1 * Q2 / r**2
    expected: '0.60'
    shown: ['(3.0 \\times 10^{-6})/0.30^2 = 0.60\\ \\text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: quiz-two-microcoulomb-wrong
    where: 'quiz 2, wrong choice: forgetting to square the distance'
    inputs: {k: 9.0e9, Q1: 2.0e-6, Q2: 3.0e-6, r: 0.30}
    formula: k * Q1 * Q2 / r
    expected: '0.18'
    shown: ['($0.18\\ \\text{N}$ forgets to square the distance.)']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: quiz-midpoint
    kind: identity
    quiz: 3
    where: 'quiz 3: equal pulls from equal charges at equal distances on either side cancel'
    formula: k * Q * q / d**2 - k * Q * q / d**2
    equals: 0 * k
    samples: {k: [9.0e9, 9.0e9], Q: [1e-6, 4e-9], q: [2e-6, 1e-9], d: [0.1, 0.5]}
    tolerance: 1e-12
    shown: ['Added as vectors along the line, they cancel.']
    source: {cite: reading1, at: 'Sec. 9.2, forces in one dimension'}
    origin: page-own

  - id: k-block
    kind: fact
    where: 'formula "The Coulomb constant": k = 9.0 × 10⁹ N m²/C² (Siyavula''s electrostatic constant, the Block 6 value)'
    value: '9.0e9'
    shown: ['tex="k = 9.0 \times 10^9\ \text{N m}^2/\text{C}^2"', '$k = 9.0 \\times 10^9\\ \\text{N m}^2/\\text{C}^2$: the force']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law (electrostatic constant)'}
    origin: mit

  - id: k-precise
    where: 'text: a more precise value is 8.99 × 10⁹ N m²/C² (k = 1/(4πε₀), CODATA 2022 ε₀)'
    inputs: {eps0: 8.8541878188e-12}
    formula: 1 / (4 * pi * eps0)
    expected: '8.99e9'
    shown: ['A more precise value is $8.99 \times 10^9\ \text{N m}^2/\text{C}^2$']
    source: {cite: nistEps0, at: 'ε₀, CODATA 2022'}
    origin: page-own

  - id: one-coulomb-force
    where: 'two charges of 1 C a metre apart: about 9 × 10⁹ N'
    inputs: {k: 9.0e9}
    formula: k * 1 * 1 / 1**2
    expected: '9e9'
    shown: ['about $9 \times 10^9\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: one-coulomb-tonnes
    where: '9 × 10⁹ N is the weight of nearly a million tonnes (9 × 10⁹/9.81 kg = 0.92 × 10⁶ t)'
    inputs: {F: 9.0e9, g: 9.81}
    formula: F / g / 1000 / 1e6
    expected: '0.92'
    shown: ['the weight of nearly a million tonnes']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: plot-1uc-010
    where: 'Plot caption: two charges of 1.0 μC at 0.10 m'
    inputs: {k: 9.0e9, Q: 1.0e-6, r: 0.10}
    formula: k * Q**2 / r**2
    expected: '0.90'
    shown: ['For two charges of 1.0 μC the force is 0.90 N at 0.10 m']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: plot-1uc-020
    where: 'Plot caption: the same at 0.20 m, a quarter'
    inputs: {k: 9.0e9, Q: 1.0e-6, r: 0.20}
    formula: k * Q**2 / r**2
    expected: '0.225'
    shown: ['a quarter of that, 0.225 N, at 0.20 m']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: plot-curve-coefficient
    kind: identity
    where: 'Plot curves: 9.0e-3·Q1·Q2/r² is kQ₁Q₂/r² with the charges in μC; the dashed 1/r curve 9.0e-2·Q1·Q2/r equals it at r = 0.10 m'
    formula: 9.0e-3 * Q1 * Q2 / 0.10**2
    equals: 9.0e-2 * Q1 * Q2 / 0.10
    samples: {Q1: [1.0, 0.2, 2.0], Q2: [1.0, 1.5, 2.0]}
    tolerance: 1e-9
    shown: ['equal to it at 0.10 m']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: beads-force
    where: 'worked example "Two charged beads": +8.0 nC and −5.0 nC at 5.0 cm'
    inputs: {k: 9.0e9, Q1: 8.0e-9, Q2: 5.0e-9, r: 0.050}
    formula: k * Q1 * Q2 / r**2
    expected: '1.4e-4'
    shown: ['/0.050^2 = 1.4 \times 10^{-4}\ \text{N}$', 'with a force of $1.4 \times 10^{-4}\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: beads-mass
    where: 'worked example: 1.4 × 10⁻⁴ N (1.44 × 10⁻⁴ N unrounded) is the weight of about 15 mg'
    inputs: {k: 9.0e9, Q1: 8.0e-9, Q2: 5.0e-9, r: 0.050, g: 9.81}
    formula: k * Q1 * Q2 / r**2 / g * 1e6
    expected: '15'
    tolerance: '2.5%'
    shown: ['the weight of a mass of about $15\ \text{mg}$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: G-value
    kind: fact
    where: 'section "Compared with Newton''s law of gravitation": G = 6.67 × 10⁻¹¹ (CODATA 6.6743 × 10⁻¹¹)'
    value: '6.67e-11'
    shown: ['with $G = 6.67 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$']
    source: {cite: reading1, at: 'Sec. 9.2, Worked example 2'}
    origin: mit

  - id: e-value
    kind: fact
    where: 'hydrogen worked example: e = 1.6 × 10⁻¹⁹ C, the Block 6 value (exact 1.602176634 × 10⁻¹⁹)'
    value: '1.6e-19'
    shown: ['$e = 1.6 \times 10^{-19}\ \text{C}$']
    source: {cite: nistE, at: 'CODATA 2022'}
    origin: mit

  - id: mp-value
    kind: fact
    where: 'hydrogen worked example: m_p = 1.67 × 10⁻²⁷ kg (1.67262192595 × 10⁻²⁷)'
    value: '1.67e-27'
    shown: ['$m_p = 1.67 \times 10^{-27}\ \text{kg}$']
    source: {cite: nistMp, at: 'CODATA 2022'}
    origin: mit

  - id: me-value
    kind: fact
    where: 'hydrogen worked example: m_e = 9.11 × 10⁻³¹ kg, the Block 6 value (9.1093837139 × 10⁻³¹)'
    value: '9.11e-31'
    shown: ['$m_e = 9.11 \times 10^{-31}\ \text{kg}$']
    source: {cite: nistMe, at: 'CODATA 2022'}
    origin: mit

  - id: hydrogen-electric
    where: 'worked example "Electricity against gravity in a hydrogen atom", step "The electric force"'
    inputs: {k: 9.0e9, e: 1.6e-19, r: 5.0e-11}
    formula: k * e**2 / r**2
    expected: '9.22e-8'
    shown: ['/(5.0 \times 10^{-11})^2 = 9.22 \times 10^{-8}\ \text{N}$, an attraction']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: hydrogen-gravity
    where: 'worked example, step "The gravitational force"'
    inputs: {G: 6.67e-11, mp: 1.67e-27, me: 9.11e-31, r: 5.0e-11}
    formula: G * mp * me / r**2
    expected: '4.06e-47'
    shown: ['/(5.0 \times 10^{-11})^2 = 4.06 \times 10^{-47}\ \text{N}$, also an attraction']
    source: {cite: reading1, at: 'Sec. 9.2, similarity to Newton''s law of gravitation'}
    origin: page-own

  - id: hydrogen-ratio
    where: 'worked example, step "The ratio", and the text after it: k e²/(G m_p m_e) = 2.3 × 10³⁹ at every distance'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27, me: 9.11e-31}
    formula: k * e**2 / (G * mp * me)
    expected: '2.3e39'
    shown: ['/4.06 \times 10^{-47} = 2.3 \times 10^{39}$. The electric force', 'So the ratio is about $2.3 \times 10^{39}$ at **every** distance', 'it is about $2.3 \times 10^{39}$ times stronger than gravity']
    source: {cite: reading1, at: 'Sec. 9.2, Worked example 2 (method)'}
    origin: page-own

  - id: hydrogen-ratio-words
    where: 'step "The ratio": "more than a thousand billion billion billion billion" = 10³ × (10⁹)⁴ = 10³⁹'
    inputs: {}
    formula: 1e3 * (1e9)**4
    expected: '1e39'
    shown: ['more than a thousand billion billion billion billion times stronger']
    source: {cite: reading1, at: 'Sec. 9.2, Worked example 2'}
    origin: page-own

  - id: hydrogen-ratio-distance-free
    kind: identity
    where: 'formula "Electric against gravitational force": the distance cancels in F_e/F_g'
    formula: (k * e**2 / r**2) / (G * mp * me / r**2)
    equals: k * e**2 / (G * mp * me)
    samples: {k: [9.0e9, 9.0e9], e: [1.6e-19, 1.6e-19], G: [6.67e-11, 6.67e-11], mp: [1.67e-27, 1.67e-27], me: [9.11e-31, 9.11e-31], r: [5.0e-11, 1.0]}
    tolerance: 1e-9
    shown: ['tex="\frac{F_e}{F_g} = \frac{k e^2}{G\, m_p m_e}"']
    source: {cite: reading1, at: 'Sec. 9.2, Worked example 2'}
    origin: page-own

  - id: two-protons-ratio
    where: 'text: for two protons the ratio k e²/(G m_p²) is about 1.2 × 10³⁶'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: k * e**2 / (G * mp**2)
    expected: '1.2e36'
    shown: ['but still about $1.2 \times 10^{36}$']
    source: {cite: reading1, at: 'Sec. 9.2, Worked example 2 (method)'}
    origin: page-own

  - id: electron-acceleration
    where: 'worked example, step "What the force does": a = F_e/m_e'
    inputs: {F: 9.22e-8, me: 9.11e-31}
    formula: F / me
    expected: '1.0e23'
    shown: ['/9.11 \times 10^{-31} = 1.0 \times 10^{23}\ \text{m/s}^2$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: row-force-a
    where: 'worked example "Three charges in a row", step "Force of A on B"'
    inputs: {k: 9.0e9, QA: 3.0e-6, QB: 2.0e-6, r: 0.20}
    formula: k * QA * QB / r**2
    expected: '1.35'
    shown: ['(2.0 \times 10^{-6})/0.20^2 = 1.35\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: row-force-c
    where: 'worked example, step "Force of C on B"'
    inputs: {k: 9.0e9, QC: 5.0e-6, QB: 2.0e-6, r: 0.30}
    formula: k * QC * QB / r**2
    expected: '1.00'
    shown: ['(2.0 \times 10^{-6})/0.30^2 = 1.00\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: row-net
    where: 'worked example, step "Add with signs": right positive'
    inputs: {k: 9.0e9, QA: 3.0e-6, QB: 2.0e-6, QC: 5.0e-6}
    formula: -k * QA * QB / 0.20**2 + k * QC * QB / 0.30**2
    expected: '-0.35'
    shown: ['$F_\text{net} = -1.35 + 1.00 = -0.35\ \text{N}$', 'The net force on B is $0.35\ \text{N}$ to the left']
    source: {cite: reading1, at: 'Sec. 9.2, choosing a positive direction'}
    origin: page-own

  - id: right-angle-a
    where: 'worked example "Two forces at right angles": force of A (+4.0 μC) on B (+2.0 μC) at 0.30 m'
    inputs: {k: 9.0e9, QA: 4.0e-6, QB: 2.0e-6, r: 0.30}
    formula: k * QA * QB / r**2
    expected: '0.80'
    shown: ['(2.0 \times 10^{-6})/0.30^2 = 0.80\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, forces in two dimensions'}
    origin: page-own

  - id: right-angle-c
    where: 'worked example "Two forces at right angles": force of C (−3.0 μC) on B at 0.30 m'
    inputs: {k: 9.0e9, QC: 3.0e-6, QB: 2.0e-6, r: 0.30}
    formula: k * QC * QB / r**2
    expected: '0.60'
    shown: ['(2.0 \times 10^{-6})/0.30^2 = 0.60\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, forces in two dimensions'}
    origin: page-own

  - id: right-angle-net
    where: 'worked example "Two forces at right angles": size of the net force (Pythagoras)'
    inputs: {Fx: 0.80, Fy: 0.60}
    formula: sqrt(Fx**2 + Fy**2)
    expected: '1.0'
    shown: ['$\sqrt{0.80^2 + 0.60^2} = 1.0\ \text{N}$']
    source: {cite: reading1, at: 'Sec. 9.2, forces in two dimensions'}
    origin: page-own

  - id: right-angle-angle
    where: 'worked example "Two forces at right angles": direction, tan⁻¹(0.60/0.80) in degrees'
    inputs: {Fx: 0.80, Fy: 0.60}
    formula: atan(Fy / Fx) * 180 / pi
    expected: '37'
    shown: ['$\tan^{-1}(0.60/0.80) = 37^\circ$']
    source: {cite: reading1, at: 'Sec. 9.2, forces in two dimensions'}
    origin: page-own
