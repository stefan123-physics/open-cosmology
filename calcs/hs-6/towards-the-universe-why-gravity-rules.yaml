# Calculations on content/year-0/hs-6/towards-the-universe-why-gravity-rules.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/towards-the-universe-why-gravity-rules.mdx
calcs:
  - id: hydrogen-ratio-reused
    where: 'introduction and Summary: the electron–proton ratio of lesson 6.2, k e²/(G m_p m_e) = 2.3 × 10³⁹ (reused, not worked again)'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27, me: 9.11e-31}
    formula: k * e**2 / (G * mp * me)
    expected: '2.3e39'
    tolerance: '2%'
    shown: ['about $2.3 \times 10^{39}$ times harder', 'Lesson 6.2 found $2.3 \times 10^{39}$ for an electron and a proton', 'two protons and $2.3 \times 10^{39}$ for an electron and a proton']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (2.2 × 10³⁹ with m_p = 1.7 × 10⁻²⁷ kg)'}
    origin: page-own

  - id: k-block
    kind: fact
    where: 'section "Two inverse-square laws": the Block 6 Coulomb constant'
    value: '9.0e9'
    shown: ['$k = 9.0 \times 10^9\ \text{N m}^2/\text{C}^2$']
    source: {cite: reading1, at: 'Sec. 9.2 (electrostatic constant)'}
    origin: mit

  - id: G-value
    kind: fact
    where: 'section "Two inverse-square laws": G = 6.67 × 10⁻¹¹ N m²/kg²'
    value: '6.67e-11'
    shown: ['$G = 6.67 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$']
    source: {cite: reading2, at: 'Sec. 2.4'}
    origin: mit

  - id: e-value
    kind: fact
    where: 'section "Two inverse-square laws": the Block 6 elementary charge'
    value: '1.6e-19'
    shown: ['$e = 1.6 \times 10^{-19}\ \text{C}$']
    source: {cite: mit, at: 'Sec. 2.13.1'}
    origin: mit

  - id: mp-value
    kind: fact
    where: 'section "Two inverse-square laws": the Block 6 proton mass'
    value: '1.67e-27'
    shown: ['$m_p = 1.67 \times 10^{-27}\ \text{kg}$']
    source: {cite: mit, at: 'Sec. 2.13.1 (1.7 × 10⁻²⁷ kg there)'}
    origin: mit

  - id: ratio-distance-free
    kind: identity
    where: 'formula "Electric against gravitational force, two protons": the distance cancels in F_e/F_g'
    formula: (k * e**2 / r**2) / (G * mp**2 / r**2)
    equals: k * e**2 / (G * mp**2)
    samples: {k: [9.0e9, 9.0e9], e: [1.6e-19, 1.6e-19], G: [6.67e-11, 6.67e-11], mp: [1.67e-27, 1.67e-27], r: [1.0e-15, 3.84e8]}
    tolerance: 1e-9
    shown: ['tex="\frac{F_e}{F_g} = \frac{k e^2}{G\, m_p^2}"']
    source: {cite: mit, at: 'Sec. 2.13.1 (c)'}
    origin: page-own

  - id: two-protons-ratio
    where: 'worked example "Two protons", step "The ratio", and the Summary'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: k * e**2 / (G * mp**2)
    expected: '1.2e36'
    tolerance: '4%'
    shown: ['(1.67 \times 10^{-27})^2} = 1.2 \times 10^{36}$', 'about $1.2 \times 10^{36}$ for two protons']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (method)'}
    origin: page-own

  - id: two-protons-ratio-words
    where: 'step "The ratio": "a million million million million million million" = (10⁶)⁶ = 10³⁶'
    inputs: {}
    formula: (1e6)**6
    expected: '1e36'
    shown: ['about a million million million million million million times stronger']
    source: {cite: mit, at: 'Sec. 2.13.1 (c)'}
    origin: page-own

  - id: two-protons-ratio-precise
    where: 'section "How small an imbalance": the same ratio before rounding, 1.24 × 10³⁶, used in the Plot caption and the Earth–Moon example'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: k * e**2 / (G * mp**2)
    expected: '1.24e36'
    tolerance: '0.5%'
    shown: ['$1.24 \times 10^{36}$ before rounding', '= 1.24 × 10³⁶ f² with this block''s constants']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (method)'}
    origin: page-own

  - id: plot-coefficient
    where: 'Plot: the curve 1.2386·x² is f²·ke²/(Gm_p²) with f = x × 10⁻¹⁸'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: k * e**2 / (G * mp**2) * (1e-18)**2
    expected: '1.2386'
    tolerance: '0.01%'
    shown: ['{ expr: "1.2386*x^2", label: "electric ÷ gravity" }']
    source: {cite: mit, at: 'Sec. 2.13.1 (c)'}
    origin: page-own

  - id: electron-lighter
    where: 'step "Compare with the hydrogen atom": the electron is about 1800 times lighter than a proton (1833)'
    inputs: {mp: 1.67e-27, me: 9.11e-31}
    formula: mp / me
    expected: '1800'
    tolerance: '3%'
    shown: ['about 1800 times lighter than a proton']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (masses)'}
    origin: page-own

  - id: balance-mass
    where: 'step "A particle heavy enough to balance": m = e √(k/G)'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11}
    formula: e * sqrt(k / G)
    expected: '1.9e-9'
    tolerance: '3%'
    shown: ['6.67 \times 10^{-11})} = 1.9 \times 10^{-9}\ \text{kg}$', 'That is about 2 micrograms']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (method)'}
    origin: page-own

  - id: balance-mass-protons
    where: 'step "A particle heavy enough to balance": that mass is 1.1 × 10¹⁸ proton masses'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: e * sqrt(k / G) / mp
    expected: '1.1e18'
    tolerance: '2%'
    shown: ['and $1.1 \times 10^{18}$ times the mass of a proton']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (method)'}
    origin: page-own

  - id: imbalance-formula
    kind: identity
    where: 'formula "Repulsion against gravity for two slightly charged bodies": with Q = f e m/m_p, kQ₁Q₂/r² ÷ Gm₁m₂/r² = f² ke²/(Gm_p²)'
    formula: (k * (f * e * m1 / mp) * (f * e * m2 / mp) / r**2) / (G * m1 * m2 / r**2)
    equals: f**2 * k * e**2 / (G * mp**2)
    samples: {k: [9.0e9, 9.0e9], e: [1.6e-19, 1.6e-19], G: [6.67e-11, 6.67e-11], mp: [1.67e-27, 1.67e-27], f: [1e-15, 3e-18], m1: [5.97e24, 0.002], m2: [7.35e22, 0.005], r: [3.84e8, 0.1]}
    tolerance: 1e-9
    shown: ['tex="\frac{F_e}{F_g} = f^2\,\frac{k e^2}{G\, m_p^2}"']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) and (d)'}
    origin: page-own

  - id: critical-f
    where: 'section "How small an imbalance": the forces balance at f = 1/√(ke²/(Gm_p²)) = 9.0 × 10⁻¹⁹; Plot caption 0.90 × 10⁻¹⁸'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: 1 / sqrt(k * e**2 / (G * mp**2))
    expected: '9.0e-19'
    tolerance: '0.5%'
    shown: ['so when $f = 9.0 \times 10^{-19}$', 'crosses the dashed line at f = 0.90 × 10⁻¹⁸']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) and (d)'}
    origin: page-own

  - id: critical-nucleons
    where: 'section "How small an imbalance": one extra charge per 1.1 × 10¹⁸ nucleons (Summary: about 10¹⁸)'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27}
    formula: sqrt(k * e**2 / (G * mp**2))
    expected: '1.1e18'
    tolerance: '2%'
    shown: ['for every $1.1 \times 10^{18}$ nucleons', 'per about $10^{18}$ nucleons would already']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) and (d)'}
    origin: page-own

  - id: earth-mass
    kind: fact
    where: 'worked example "A Moon with a whisper of charge": the Earth''s mass (NASA 5.9722 × 10²⁴ kg)'
    value: 5.97e24 kg
    shown: ['the Earth ($5.97 \times 10^{24}\ \text{kg}$)']
    source: {cite: nasaEarth, at: 'mass 5.9722 × 10²⁴ kg'}
    origin: later-data

  - id: moon-mass
    kind: fact
    where: 'worked example: the Moon''s mass (NASA 0.07346 × 10²⁴ kg)'
    value: 7.35e22 kg
    tolerance: '0.1%'
    shown: ['the Moon ($7.35 \times 10^{22}\ \text{kg}$)']
    source: {cite: nasaMoon, at: 'mass 0.07346 × 10²⁴ kg'}
    origin: later-data

  - id: moon-distance
    kind: fact
    where: 'worked example: the Earth–Moon distance (NASA semimajor axis 0.3844 × 10⁶ km)'
    value: 3.84e8 m
    tolerance: '0.2%'
    shown: ['Their distance is $3.84 \times 10^8\ \text{m}$']
    source: {cite: nasaMoon, at: 'semimajor axis 0.3844 × 10⁶ km'}
    origin: later-data

  - id: earth-nucleons
    where: 'worked example, step "The charges", and section "Gravity only adds up": nucleons in the Earth, M/m_p'
    inputs: {M: 5.97e24, mp: 1.67e-27}
    formula: M / mp
    expected: '3.57e51'
    tolerance: '0.2%'
    shown: ['= 3.57 \times 10^{51}$ nucleons', 'made of about $3.6 \times 10^{51}$ nucleons']
    source: {cite: nasaEarth, at: 'mass'}
    origin: page-own

  - id: earth-charge
    where: 'worked example, step "The charges": the Earth''s charge with f = 10⁻¹⁵'
    inputs: {M: 5.97e24, mp: 1.67e-27, e: 1.6e-19, f: 1e-15}
    formula: f * M / mp * e
    expected: '5.72e17'
    tolerance: '0.2%'
    shown: ['\times 1.6 \times 10^{-19}\ \text{C} = 5.72 \times 10^{17}\ \text{C}$']
    source: {cite: mit, at: 'Sec. 2.13.1 (d)'}
    origin: page-own

  - id: moon-nucleons
    where: 'worked example, step "The charges": nucleons in the Moon'
    inputs: {M: 7.35e22, mp: 1.67e-27}
    formula: M / mp
    expected: '4.40e49'
    tolerance: '0.2%'
    shown: ['with $4.40 \times 10^{49}$ nucleons']
    source: {cite: nasaMoon, at: 'mass'}
    origin: page-own

  - id: moon-charge
    where: 'worked example, step "The charges": the Moon''s charge with f = 10⁻¹⁵'
    inputs: {M: 7.35e22, mp: 1.67e-27, e: 1.6e-19, f: 1e-15}
    formula: f * M / mp * e
    expected: '7.04e15'
    tolerance: '0.2%'
    shown: ['would carry $7.04 \times 10^{15}\ \text{C}$']
    source: {cite: mit, at: 'Sec. 2.13.1 (d)'}
    origin: page-own

  - id: earth-moon-electric
    where: 'worked example, step "The two forces": the electric repulsion'
    inputs: {k: 9.0e9, QE: 5.72e17, QM: 7.04e15, d: 3.84e8}
    formula: k * QE * QM / d**2
    expected: '2.5e26'
    tolerance: '2%'
    shown: ['/(3.84 \times 10^8)^2 = 2.5 \times 10^{26}\ \text{N}$, a repulsion']
    source: {cite: reading1, at: 'Sec. 9.2, Coulomb''s law'}
    origin: page-own

  - id: earth-moon-gravity
    where: 'worked example, step "The two forces": the gravitational attraction'
    inputs: {G: 6.67e-11, ME: 5.97e24, MM: 7.35e22, d: 3.84e8}
    formula: G * ME * MM / d**2
    expected: '2.0e20'
    tolerance: '1%'
    shown: ['/(3.84 \times 10^8)^2 = 2.0 \times 10^{20}\ \text{N}$, an attraction']
    source: {cite: reading2, at: 'Sec. 2.4'}
    origin: page-own

  - id: earth-moon-ratio
    where: 'worked example, step "Compare": F_e/F_g = f² × 1.24 × 10³⁶ = 1.2 × 10⁶'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27, f: 1e-15}
    formula: f**2 * k * e**2 / (G * mp**2)
    expected: '1.2e6'
    tolerance: '4%'
    shown: ['$F_e/F_g = 1.2 \times 10^{6}$', 'a million times harder than gravity holds it']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) and (d)'}
    origin: page-own

  - id: earth-moon-ratio-direct
    where: 'worked example: the same ratio from the two forces themselves'
    inputs: {Fe: 2.458e26, Fg: 1.985e20}
    formula: Fe / Fg
    expected: '1.24e6'
    tolerance: '0.5%'
    shown: ['$F_e/F_g = 1.2 \times 10^{6}$']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) and (d)'}
    origin: page-own

  - id: quiz-two-electrons
    quiz: 0
    where: 'quiz 0: k e²/(G m_e²) for two electrons'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, me: 9.11e-31}
    formula: k * e**2 / (G * me**2)
    expected: '4.2e42'
    tolerance: '1%'
    shown: ['(9.11 \\times 10^{-31})^2) = 4.2 \\times 10^{42}$']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) (method)'}
    origin: page-own

  - id: quiz-imbalance
    quiz: 1
    where: 'quiz 1: f = 10⁻¹⁷ gives F_e/F_g = 124, about 120'
    inputs: {k: 9.0e9, e: 1.6e-19, G: 6.67e-11, mp: 1.67e-27, f: 1e-17}
    formula: f**2 * k * e**2 / (G * mp**2)
    expected: '124'
    tolerance: '4%'
    shown: ['(10^{-17})^2 \\times 1.24 \\times 10^{36} = 124$, about 120']
    source: {cite: mit, at: 'Sec. 2.13.1 (c) and (d)'}
    origin: page-own
