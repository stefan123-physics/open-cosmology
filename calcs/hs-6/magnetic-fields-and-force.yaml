# Calculations on content/year-0/hs-6/magnetic-fields-and-force.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Angles are plain numbers in degrees; trig functions take radians, hence the factors pi/180.
# Directions: x = east, y = north, z = up; the force on a positive charge is along v × B.

page: content/year-0/hs-6/magnetic-fields-and-force.mdx
calcs:
  - id: quiz-force-charge
    where: 'quiz 1: F = qvB with q = 3.2 × 10⁻¹⁹ C, v = 5.0 × 10⁵ m/s, B = 0.20 T'
    inputs: {q: 3.2e-19 C, v: 5.0e5 m/s, B: 0.20 T}
    formula: q * v * B
    expected: 3.2e-14 N
    shown: ['$F = qvB = 3.2 \\times 10^{-19} \\times 5.0 \\times 10^5 \\times 0.20 = 3.2 \\times 10^{-14}\\ \\text{N}$']
    quiz: 1
    source: {cite: reading3, at: 'Sec. 11.2, Electric motors'}
    origin: page-own

  - id: quiz-force-distractor-divide
    where: 'quiz 1 distractor: qv/B'
    inputs: {}
    formula: 3.2e-19 * 5.0e5 / 0.20
    expected: '8.0e-13'
    shown: ['"$8.0 \\times 10^{-13}\\ \\text{N}$"']
    source: {cite: reading3, at: 'Sec. 11.2, Electric motors'}
    origin: page-own

  - id: quiz-force-distractor-qb
    where: 'quiz 1 distractor: qB (speed left out)'
    inputs: {}
    formula: 3.2e-19 * 0.20
    expected: '6.4e-20'
    shown: ['"$6.4 \\times 10^{-20}\\ \\text{N}$"']
    source: {cite: reading3, at: 'Sec. 11.2, Electric motors'}
    origin: page-own

  - id: quiz-direction-east-up
    kind: identity
    where: 'quiz 2: positive charge moving east (x) in a field pointing up (z); the north (y) component of v × B is v_z B_x − v_x B_z = −1: south'
    formula: vz * Bx - vx * Bz
    equals: -1 + 0 * vx
    samples: {vx: [1.0], vz: [0.0], Bx: [0.0], Bz: [1.0]}
    tolerance: 1e-12
    shown: ['first finger east (the velocity of a positive charge), second finger up (the field); the thumb then points south']
    source: {cite: reading3, at: 'Sec. 11.2, Electric motors (right-hand rule)'}
    origin: page-own

  - id: direction-east-north
    kind: identity
    where: 'section "Which way?": positive charge moving east (x) in a field pointing north (y); the up (z) component of v × B is v_x B_y − v_y B_x = +1: up'
    formula: vx * By - vy * Bx
    equals: 1 + 0 * vx
    samples: {vx: [1.0], vy: [0.0], Bx: [0.0], By: [1.0]}
    tolerance: 1e-12
    shown: ['First finger east, second finger north: the thumb points up, so the force is upward']
    source: {cite: reading3, at: 'Sec. 11.2, Electric motors (right-hand rule)'}
    origin: page-own

  - id: quiz-radius-doubles
    kind: identity
    where: 'quiz 3: twice the speed gives twice the radius, the same time per turn'
    formula: (m * (2 * v) / (q * B)) / (m * v / (q * B))
    equals: 2 + 0 * v
    samples: {m: [9.11e-31, 1.67e-27], v: [4.0e6, 1.0e5], q: [1.6e-19, 3.2e-19], B: [1.5e-3, 0.5]}
    tolerance: 1e-12
    quiz: 3
    shown: ['From $r = mv/(qB)$, twice the speed gives twice the radius']
    source: {cite: reading4, at: 'Eq. (8.5.2)'}
    origin: page-own

  - id: quiz-wire-angle
    where: 'quiz 4: F = BIL sin θ with B = 0.050 T, I = 6.0 A, L = 0.40 m, θ = 30°'
    inputs: {B: 0.050 T, I: 6.0 A, L: 0.40 m}
    formula: B * I * L * sin(30 * pi / 180)
    expected: 0.060 N
    shown: ['$F = BIL\\sin\\theta = 0.050 \\times 6.0 \\times 0.40 \\times \\sin 30° = 0.12 \\times 0.50 = 0.060\\ \\text{N}$']
    quiz: 4
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: quiz-wire-perpendicular
    where: 'quiz 4 explanation and distractor: BIL at right angles'
    inputs: {B: 0.050 T, I: 6.0 A, L: 0.40 m}
    formula: B * I * L
    expected: 0.12 N
    shown: ['the full $0.12\\ \\text{N}$', '"$0.12\\ \\text{N}$"']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: quiz-wire-distractor-cos
    where: 'quiz 4 distractor: BIL cos θ instead of sin θ'
    inputs: {}
    formula: 0.050 * 6.0 * 0.40 * cos(30 * pi / 180)
    expected: '0.10'
    tolerance: '5%'
    shown: ['"$0.10\\ \\text{N}$"']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: tesla-unit
    where: 'section "The force on a moving charge": 1 N on 1 C moving at 1 m/s is 1 T, and 1 N/(C m/s) = 1 N/(A m)'
    inputs: {F: 1 N, q: 1 C, v: 1 m/s}
    formula: F / (q * v)
    expected: 1 T
    shown: ['a field of $1\ \text{T}$ pushes with $1\ \text{N}$ on a charge of $1\ \text{C}$ moving at $1\ \text{m/s}$ at right angles to it']
    source: {cite: reading4, at: 'Sec. 8.2, after Eq. (8.2.2)'}
    origin: mit

  - id: tesla-unit-ampere
    where: 'formula "The tesla": N/(A m) is a tesla'
    inputs: {F: 1 N, I: 1 A, L: 1 m}
    formula: F / (I * L)
    expected: 1 T
    shown: ['1\ \frac{\text{N}}{\text{A} \cdot \text{m}}']
    source: {cite: reading4, at: 'Sec. 8.2, after Eq. (8.2.2)'}
    origin: mit

  - id: earth-field
    kind: fact
    where: 'section "The force on a moving charge": the Earth''s field at its surface (MIT Problems 8.11.1, B ~ 5 × 10⁻⁵ T, and 8.11.8, 0.5 × 10⁻⁴ T)'
    value: 5e-5 T
    tolerance: '1%'
    shown: ['The Earth''s field at its surface is only about $5 \times 10^{-5}\ \text{T}$']
    source: {cite: reading4, at: 'Problems 8.11.1 and 8.11.8'}
    origin: mit

  - id: gauss
    kind: fact
    where: 'section "The force on a moving charge": 1 T = 10⁴ gauss (MIT Sec. 8.2)'
    value: '1e4'
    shown: ['$1\ \text{T} = 10^4$ gauss']
    source: {cite: reading4, at: 'Sec. 8.2'}
    origin: mit

  - id: earth-field-gauss
    where: 'section "The force on a moving charge": the Earth''s field is about half a gauss'
    inputs: {}
    formula: 5e-5 * 1e4
    expected: '0.5'
    shown: ['the Earth''s field is about half a gauss']
    source: {cite: reading4, at: 'Sec. 8.2'}
    origin: page-own

  - id: sin-90
    where: 'section "The force on a moving charge": sin 90° = 1'
    inputs: {}
    formula: sin(90 * pi / 180)
    expected: '1'
    tolerance: 1e-12
    shown: ['At $\theta = 90°$, $\sin\theta = 1$']
    source: {cite: reading4, at: 'Eq. (8.2.2)'}
    origin: page-own

  - id: sin-0-180
    where: 'section "The force on a moving charge": sin 0° = sin 180° = 0'
    inputs: {}
    formula: sin(180 * pi / 180) + sin(0)
    expected: '0'
    tolerance: 1e-12
    shown: ['At $\theta = 0°$ (moving along the field) or $180°$ (against it) $\sin\theta = 0$']
    source: {cite: reading4, at: 'Eq. (8.2.2)'}
    origin: page-own

  - id: proton-force-perpendicular
    where: 'worked example "A proton crossing a field", step "(a) At right angles"'
    inputs: {q: 1.6e-19 C, v: 2.0e5 m/s, B: 0.30 T}
    formula: q * v * B
    expected: 9.6e-15 N
    shown: ['$F = qvB = 1.6 \times 10^{-19} \times 2.0 \times 10^5 \times 0.30 = 9.6 \times 10^{-15}\ \text{N}$']
    source: {cite: reading3, at: 'Sec. 11.2, Electric motors'}
    origin: page-own

  - id: proton-force-30
    where: 'worked example, step "(b) At 30°"'
    inputs: {q: 1.6e-19 C, v: 2.0e5 m/s, B: 0.30 T}
    formula: q * v * B * sin(30 * pi / 180)
    expected: 4.8e-15 N
    shown: ['$F = qvB\sin\theta = 9.6 \times 10^{-15} \times \sin 30° = 9.6 \times 10^{-15} \times 0.50 = 4.8 \times 10^{-15}\ \text{N}$: half as much']
    source: {cite: reading4, at: 'Eq. (8.2.2)'}
    origin: page-own

  - id: sin-30
    where: 'worked example step "(b)" and quiz 4: sin 30° = 0.50'
    inputs: {}
    formula: sin(30 * pi / 180)
    expected: '0.50'
    tolerance: 1e-9
    shown: ['\sin 30° = 9.6 \times 10^{-15} \times 0.50']
    source: {cite: reading4, at: 'Eq. (8.2.2)'}
    origin: page-own

  - id: proton-force-along
    where: 'worked example, step "(c) Along the field": sin 0° = 0, no force'
    inputs: {q: 1.6e-19 C, v: 2.0e5 m/s, B: 0.30 T}
    formula: q * v * B * sin(0)
    expected: 0 N
    shown: ['$\sin 0° = 0$, so $F = 0$']
    source: {cite: reading4, at: 'Eq. (8.2.2)'}
    origin: page-own

  - id: centripetal-radius
    kind: identity
    where: 'section "Circles in a uniform field": with r = mv/(qB), mv²/r equals qvB'
    formula: m * v**2 / (m * v / (q * B))
    equals: q * v * B
    samples: {m: [9.11e-31, 1.67e-27], v: [4.0e6, 2.0e5], q: [1.6e-19, 3.2e-19], B: [1.5e-3, 0.30]}
    tolerance: 1e-12
    shown: ['Divide both sides by $v$ and solve for the radius']
    source: {cite: reading4, at: 'Eqs. (8.5.1)–(8.5.2)'}
    origin: mit

  - id: period-without-speed
    kind: identity
    where: 'section "Circles in a uniform field": T = 2πr/v with r = mv/(qB) is 2πm/(qB), independent of v'
    formula: 2 * pi * (m * v / (q * B)) / v
    equals: 2 * pi * m / (q * B)
    samples: {m: [9.11e-31, 1.67e-27], v: [4.0e6, 2.0e5], q: [1.6e-19, 3.2e-19], B: [1.5e-3, 0.30]}
    tolerance: 1e-12
    shown: ['The speed has dropped out']
    source: {cite: reading4, at: 'Eq. (8.5.3)'}
    origin: mit

  - id: millitesla
    where: 'worked example "An electron going round": 1.5 mT in tesla'
    inputs: {B: 1.5 mT}
    formula: B
    expected: 1.5e-3 T
    shown: ['$1.5\ \text{mT}$ ($1.5 \times 10^{-3}\ \text{T}$)']
    source: {cite: reading4, at: 'Eq. (8.5.2)'}
    origin: page-own

  - id: electron-radius
    where: 'worked example "An electron going round", step "Radius" (0.0152 m)'
    inputs: {m: 9.11e-31 kg, v: 4.0e6 m/s, q: 1.6e-19 C, B: 1.5e-3 T}
    formula: m * v / (q * B)
    expected: 0.015 m
    tolerance: '2%'
    shown: ['$r = mv/(qB) = 9.11 \times 10^{-31} \times 4.0 \times 10^6/(1.6 \times 10^{-19} \times 1.5 \times 10^{-3}) = 0.015\ \text{m}$', 'a radius of about $1.5\ \text{cm}$']
    source: {cite: reading4, at: 'Eq. (8.5.2)'}
    origin: page-own

  - id: electron-period
    where: 'worked example, step "Time for one turn" (2.39 × 10⁻⁸ s)'
    inputs: {m: 9.11e-31 kg, q: 1.6e-19 C, B: 1.5e-3 T}
    formula: 2 * pi * m / (q * B)
    expected: 2.4e-8 s
    tolerance: '1%'
    shown: ['$T = 2\pi m/(qB) = 2\pi \times 9.11 \times 10^{-31}/(1.6 \times 10^{-19} \times 1.5 \times 10^{-3}) = 2.4 \times 10^{-8}\ \text{s}$', 'the time for one turn is still $2.4 \times 10^{-8}\ \text{s}$']
    source: {cite: reading4, at: 'Eq. (8.5.3)'}
    origin: page-own

  - id: electron-turns-per-second
    where: 'worked example: about 42 million turns a second'
    inputs: {m: 9.11e-31 kg, q: 1.6e-19 C, B: 1.5e-3 T}
    formula: (q * B) / (2 * pi * m)
    expected: 4.2e7 1/s
    tolerance: '1%'
    shown: ['about 42 million turns a second']
    source: {cite: reading4, at: 'Eq. (8.5.3)'}
    origin: page-own

  - id: electron-radius-faster
    where: 'worked example, step "A faster electron": radius at 8.0 × 10⁶ m/s (0.0304 m)'
    inputs: {m: 9.11e-31 kg, v: 8.0e6 m/s, q: 1.6e-19 C, B: 1.5e-3 T}
    formula: m * v / (q * B)
    expected: 0.030 m
    tolerance: '2%'
    shown: ['the radius doubles to $0.030\ \text{m}$']
    source: {cite: reading4, at: 'Eq. (8.5.2)'}
    origin: page-own

  - id: wire-force-derivation
    kind: identity
    where: 'section "The force on a current-carrying wire": nAL electrons, each e v_d B, give (n e v_d A) L B = BIL'
    formula: (n * A * L) * (e * v * B)
    equals: B * (n * e * v * A) * L
    samples: {n: [8.5e28, 1.0e28], A: [1.5e-6, 1.0e-6], L: [0.05, 0.40], e: [1.6e-19, 1.6e-19], v: [1.5e-4, 1.0e-3], B: [0.04, 0.3]}
    tolerance: 1e-12
    shown: ['$F = nAL \times ev_dB = (nev_dA) \times LB = BIL$']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: mit

  - id: balance-length
    where: 'worked example "Measuring a magnet with a balance": 5.0 cm in metres'
    inputs: {L: 5.0 cm}
    formula: L
    expected: 0.050 m
    shown: ['(2.0 \times 0.050)']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: balance-field
    where: 'worked example, step "(a) The field": B = F/(IL)'
    inputs: {F: 4.0 mN, I: 2.0 A, L: 5.0 cm}
    formula: F / (I * L)
    expected: 0.040 T
    shown: ['$B = F/(IL) = 4.0 \times 10^{-3}/(2.0 \times 0.050) = 0.040\ \text{T}$']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: balance-larger-current
    where: 'worked example, step "(b) A larger current"'
    inputs: {B: 0.040 T, I: 3.5 A, L: 0.050 m}
    formula: B * I * L
    expected: 7.0e-3 N
    shown: ['$F = BIL = 0.040 \times 3.5 \times 0.050 = 7.0 \times 10^{-3}\ \text{N} = 7.0\ \text{mN}$']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: plot-formula
    kind: identity
    where: 'plot: the curve 1000·B·I·0.050·sin(th·π/180) is BIL sin θ in millinewtons for L = 0.050 m and θ in degrees'
    formula: 1000 * B * I * 0.050 * sin(th * pi / 180)
    equals: 1000 * (B * I * L * sin(th * pi / 180))
    samples: {B: [0.04, 0.08, 0.01], I: [2.0, 3.0, 0.5], L: [0.050, 0.050, 0.050], th: [90.0, 30.0, 150.0]}
    tolerance: 1e-12
    shown: ['computed from F = BIL sin θ and given in millinewtons']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: plot-peak
    where: 'plot caption: 4.0 mN at 90° for B = 0.040 T, I = 2.0 A, L = 5.0 cm'
    inputs: {B: 0.040 T, I: 2.0 A, L: 0.050 m}
    formula: B * I * L
    expected: 4.0 mN
    shown: ['4.0 mN for B = 0.040 T and I = 2.0 A']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own

  - id: plot-range-max
    where: 'plot: the largest force for the slider ranges (B = 0.080 T, I = 3.0 A) is 12 mN, inside the range of 13 mN'
    inputs: {B: 0.080 T, I: 3.0 A, L: 0.050 m}
    formula: B * I * L
    expected: 12 mN
    shown: ['range={[0, 13]}']
    source: {cite: reading4, at: 'Eq. (8.3.1)'}
    origin: page-own
