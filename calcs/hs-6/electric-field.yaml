# Calculations on content/year-0/hs-6/electric-field.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# k = 9.0e9 N m^2/C^2 as in the cited sources (Siyavula 9.2, MIT 8.02T Eq. 1.6.2); e = 1.6e-19 C (Block 6 convention, Siyavula 9.2).
# `origin: mit` marks a value taken from a cited source (here Siyavula), as in the Block 5 calcs files: the test allows only mit, page-own, later-data and slip.

page: content/year-0/hs-6/electric-field.mdx
calcs:
  - id: k-coulomb
    kind: fact
    where: 'section "The field of a point charge": Coulomb''s constant as given by the sources'
    value: 9.0e9 N*m**2/C**2
    shown: ['$k = 9.0 \times 10^9\ \text{N m}^2/\text{C}^2$']
    source: {cite: reading2, at: 'Sec. 9.2'}
    origin: mit

  - id: quiz-field-from-force
    where: 'quiz 0: E = F/q for 5.0e-5 N on +2.0 nC'
    inputs: {F: 5.0e-5 N, q: 2.0 nC}
    formula: F / q
    expected: 2.5e4 N/C
    shown: ['$E = F/q = (5.0 \\times 10^{-5})/(2.0 \\times 10^{-9}) = 2.5 \\times 10^4\\ \\text{N/C}$']
    # no `quiz: 0`: choices 0 and 1 have the same number and differ only in direction (east/west), so the quiz check cannot single out the answer
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: quiz-inverse-square
    where: 'quiz 1: 900 N/C at 2.0 m, field at 6.0 m'
    inputs: {E1: 900 N/C, r1: 2.0 m, r2: 6.0 m}
    formula: E1 * (r1 / r2)**2
    expected: 100 N/C
    shown: ['$900/9 = 100\\ \\text{N/C}$']
    quiz: 1
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: quiz-mass-ratio
    where: 'quiz 3 and section "Comparing with the gravitational field": proton mass over electron mass, "about 1800"'
    inputs: {m_p: 1.67e-27 kg, m_e: 9.11e-31 kg}
    formula: m_p / m_e
    expected: 1800
    tolerance: '3%'
    shown: ['electron''s acceleration is about 1800 times larger', 'about 1800 times lighter, accelerates about 1800 times faster']
    source: {cite: mit802, at: 'Eq. (2.6.2)'}
    origin: page-own

  - id: ex1-field
    where: 'worked example "Measuring a field, then using it": E = F/q'
    inputs: {F: 6.0e-4 N, q: 4.0 nC}
    formula: F / q
    expected: 1.5e5 N/C
    shown: ['$E = F/q = (6.0 \times 10^{-4})/(4.0 \times 10^{-9}) = 1.5 \times 10^5\ \text{N/C}$']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: ex1-electron-force
    where: 'worked example "Measuring a field, then using it": force on an electron, F = qE'
    inputs: {e: 1.6e-19 C, E: 1.5e5 N/C}
    formula: e * E
    expected: 2.4e-14 N
    shown: ['$F = qE = 1.6 \times 10^{-19} \times 1.5 \times 10^5 = 2.4 \times 10^{-14}\ \text{N}$']
    source: {cite: mit802ch1, at: 'Sec. 1.6'}
    origin: page-own

  - id: inverse-square-hundredth
    where: 'section "The field of a point charge": ten times as far, a hundredth'
    inputs: {f: 10}
    formula: 1 / f**2
    expected: 0.01
    shown: ['ten times as far, a hundredth']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: plot-formula
    kind: identity
    where: 'Plot: 9.0*Q/r^2 with Q in nC equals kQ/r^2 in N/C'
    formula: 9.0 * Q / r**2
    equals: 9.0e9 * (Q * 1e-9) / r**2
    samples: {Q: [1.0, 4.0, 10.0], r: [0.1, 0.5, 1.0]}
    tolerance: 1e-9
    shown: ['9.0*Q/r^2']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: sphere-field
    where: 'worked example "Near a charged sphere": E = kQ/r^2'
    inputs: {k: 9.0e9 N*m**2/C**2, Q: 2.0e-6 C, r: 0.15 m}
    formula: k * Q / r**2
    expected: 8.0e5 N/C
    shown: ['$E = kQ/r^2 = (9.0 \times 10^9 \times 2.0 \times 10^{-6})/0.15^2 = 8.0 \times 10^5\ \text{N/C}$']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: sphere-bead-force
    where: 'worked example "Near a charged sphere": force on the bead, F = qE'
    inputs: {q: 1.5e-9 C, E: 8.0e5 N/C}
    formula: q * E
    expected: 1.2e-3 N
    shown: ['$F = qE = 1.5 \times 10^{-9} \times 8.0 \times 10^5 = 1.2 \times 10^{-3}\ \text{N}$']
    source: {cite: mit802ch1, at: 'Sec. 1.6'}
    origin: page-own

  - id: midpoint-distance
    where: 'worked example "Halfway between two charges": half of 0.60 m'
    inputs: {s: 0.60 m}
    formula: s / 2
    expected: 0.30 m
    shown: ['Both are $0.30\ \text{m}$ from the midpoint']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: midpoint-E1
    where: 'worked example "Halfway between two charges": field of the +12 nC charge'
    inputs: {k: 9.0e9 N*m**2/C**2, Q: 12e-9 C, r: 0.30 m}
    formula: k * Q / r**2
    expected: 1200 N/C
    shown: ['$E_1 = (9.0 \times 10^9 \times 12 \times 10^{-9})/0.30^2 = 1200\ \text{N/C}$']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: midpoint-E2
    where: 'worked example "Halfway between two charges": field of the -2.0 nC charge'
    inputs: {k: 9.0e9 N*m**2/C**2, Q: 2.0e-9 C, r: 0.30 m}
    formula: k * Q / r**2
    expected: 200 N/C
    shown: ['$E_2 = (9.0 \times 10^9 \times 2.0 \times 10^{-9})/0.30^2 = 200\ \text{N/C}$']
    source: {cite: reading1, at: 'Sec. 9.3'}
    origin: page-own

  - id: midpoint-total
    where: 'worked example "Halfway between two charges": both fields point the same way, sizes add'
    inputs: {k: 9.0e9 N*m**2/C**2, Q1: 12e-9 C, Q2: 2.0e-9 C, r: 0.30 m}
    formula: k * (Q1 + Q2) / r**2
    expected: 1.4e3 N/C
    shown: ['$E = 1200 + 200 = 1.4 \times 10^3\ \text{N/C}$']
    source: {cite: mit802, at: 'Eq. (2.4.3)'}
    origin: page-own

  - id: proton-acceleration
    where: 'worked example "A proton between two plates": a = qE/m'
    inputs: {q: 1.6e-19 C, E: 2.5e4 N/C, m: 1.67e-27 kg}
    formula: q * E / m
    expected: 2.4e12 m/s**2
    shown: ['$a = qE/m = (1.6 \times 10^{-19} \times 2.5 \times 10^4)/(1.67 \times 10^{-27}) = 2.4 \times 10^{12}\ \text{m/s}^2$']
    source: {cite: mit802, at: 'Eq. (2.6.2)'}
    origin: page-own

  - id: proton-vs-g
    where: 'worked example: acceleration more than 10^11 times g (2.4e11)'
    inputs: {a: 2.395e12 m/s**2, g: 9.81 m/s**2}
    formula: a / g
    expected: 2.4e11
    shown: ['more than $10^{11}$ times the acceleration of free fall']
    source: {cite: mit802, at: 'Eq. (2.6.2)'}
    origin: page-own

  - id: proton-speed
    where: 'worked example "A proton between two plates": v = sqrt(2ad)'
    inputs: {q: 1.6e-19 C, E: 2.5e4 N/C, m: 1.67e-27 kg, d: 0.040 m}
    formula: sqrt(2 * q * E * d / m)
    expected: 4.4e5 m/s
    shown: ['$v = \sqrt{2ad} = \sqrt{2 \times 2.4 \times 10^{12} \times 0.040} = 4.4 \times 10^5\ \text{m/s}$', 'about 440 kilometres per second']
    source: {cite: mit802, at: 'Eq. (2.6.3)'}
    origin: page-own

  - id: proton-time
    where: 'worked example "A proton between two plates": t = v/a'
    inputs: {q: 1.6e-19 C, E: 2.5e4 N/C, m: 1.67e-27 kg, d: 0.040 m}
    formula: sqrt(2 * q * E * d / m) / (q * E / m)
    expected: 1.8e-7 s
    shown: ['$t = v/a = (4.4 \times 10^5)/(2.4 \times 10^{12}) = 1.8 \times 10^{-7}\ \text{s}$']
    source: {cite: mit802, at: 'Eqs. (2.6.2)–(2.6.3)'}
    origin: page-own

  - id: proton-weight
    where: 'worked example step "Can we ignore gravity?": mg'
    inputs: {m: 1.67e-27 kg, g: 9.81 m/s**2}
    formula: m * g
    expected: 1.6e-26 N
    shown: ['$mg = 1.67 \times 10^{-27} \times 9.81 = 1.6 \times 10^{-26}\ \text{N}$']
    source: {cite: mit802ch1, at: 'Eq. (1.5.3)'}
    origin: page-own

  - id: proton-electric-force
    where: 'worked example step "Can we ignore gravity?": qE'
    inputs: {q: 1.6e-19 C, E: 2.5e4 N/C}
    formula: q * E
    expected: 4.0e-15 N
    shown: ['$qE = 4.0 \times 10^{-15}\ \text{N}$']
    source: {cite: mit802ch1, at: 'Sec. 1.6'}
    origin: page-own

  - id: proton-force-ratio
    where: 'worked example step "Can we ignore gravity?": electric force over weight, more than 10^11'
    inputs: {q: 1.6e-19 C, E: 2.5e4 N/C, m: 1.67e-27 kg, g: 9.81 m/s**2}
    formula: q * E / (m * g)
    expected: 2.4e11
    shown: ['more than $10^{11}$ times larger']
    source: {cite: mit802ch1, at: 'Sec. 1.5–1.6'}
    origin: page-own

  - id: g-surface
    kind: fact
    where: 'section "Comparing with the gravitational field": g near the Earth''s surface'
    value: 9.81 N/kg
    shown: ['$g = 9.81\ \text{N/kg}$']
    source: {cite: mit802ch1, at: 'Eq. (1.5.3) (9.8 m/s²)'}
    origin: page-own
