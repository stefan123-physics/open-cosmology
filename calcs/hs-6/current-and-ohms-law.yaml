# Calculations on content/year-0/hs-6/current-and-ohms-law.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/current-and-ohms-law.mdx
calcs:
  - id: quiz-charge
    where: 'quiz 0: Q = It with I = 0.40 A, t = 2.0 min'
    inputs: {I: 0.40 A, t: 2.0 min}
    formula: I * t
    expected: 48 C
    shown: ['$Q = It = 0.40 \\times 120 = 48\\ \\text{C}$']
    quiz: 0
    source: {cite: mit, at: 'Eq. (6.1.1)'}
    origin: page-own

  - id: quiz-charge-seconds
    where: 'quiz 0: 2.0 minutes in seconds'
    inputs: {t: 2.0 min}
    formula: t
    expected: 120 s
    shown: ['$2.0$ minutes is $120\\ \\text{s}$']
    source: {cite: mit, at: 'Eq. (6.1.1)'}
    origin: page-own

  - id: quiz-ohm-current
    where: 'quiz 1: I = V/R with V = 5.5 V, R = 220 Ω'
    inputs: {V: 5.5 V, R: 220 ohm}
    formula: V / R
    expected: 0.025 A
    shown: ['$I = V/R = 5.5/220 = 0.025\\ \\text{A}$ (25 milliamperes)']
    quiz: 1
    source: {cite: mit, at: 'Eq. (6.2.7)'}
    origin: page-own

  - id: quiz-ohm-distractor-product
    where: 'quiz 1 distractor: V × R'
    inputs: {}
    formula: 5.5 * 220
    expected: '1210'
    shown: ['"$1210\\ \\text{A}$"']
    source: {cite: mit, at: 'Eq. (6.2.7)'}
    origin: page-own

  - id: quiz-ohm-distractor-ratio
    where: 'quiz 1 distractor: R/V'
    inputs: {}
    formula: 220 / 5.5
    expected: '40'
    shown: ['"$40\\ \\text{A}$"']
    source: {cite: mit, at: 'Eq. (6.2.7)'}
    origin: page-own

  - id: quiz-double-length-area
    kind: identity
    where: 'quiz 2: twice the length and twice the area leave R = ρL/A unchanged'
    formula: rho * (2 * L) / (2 * A)
    equals: rho * L / A
    samples: {rho: [1.7e-8, 1.0e-6], L: [1.0, 20.0], A: [1.5e-6, 1.26e-7]}
    tolerance: 1e-12
    quiz: 2
    shown: ['the doubled length doubles $R$ and the doubled area halves it again, so the resistance does not change']
    source: {cite: mit, at: 'Eq. (6.2.10)'}
    origin: page-own

  - id: elementary-charge
    kind: fact
    where: 'section "Electric current": the size of the charge of an electron, the block''s rounding of MIT''s 1.602 × 10⁻¹⁹ C'
    value: 1.6e-19 C
    tolerance: '1%'
    shown: ['$e = 1.6 \times 10^{-19}\ \text{C}$']
    source: {cite: reading1, at: 'Eq. (2.1.1)'}
    origin: mit

  - id: bulb-time
    where: 'worked example "Counting the electrons through a bulb": 4.0 minutes in seconds'
    inputs: {t: 4.0 min}
    formula: t
    expected: 240 s
    shown: ['$t = 4.0 \times 60 = 240\ \text{s}$']
    source: {cite: mit, at: 'Eq. (6.1.1)'}
    origin: page-own

  - id: bulb-charge
    where: 'worked example "Counting the electrons through a bulb", step "Charge"'
    inputs: {I: 0.15 A, t: 240 s}
    formula: I * t
    expected: 36 C
    shown: ['$Q = It = 0.15 \times 240 = 36\ \text{C}$']
    source: {cite: mit, at: 'Eq. (6.1.1)'}
    origin: page-own

  - id: bulb-electrons
    where: 'worked example, step "Electrons": N = Q/e'
    inputs: {Q: 36 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '2.3e20'
    shown: ['$N = Q/e = 36/(1.6 \times 10^{-19}) = 2.3 \times 10^{20}$ electrons, more than a hundred billion billion']
    source: {cite: reading1, at: 'Eq. (2.1.1)'}
    origin: page-own

  - id: copper-electron-density
    kind: fact
    where: 'section "Electrons drift slowly": free electrons per cubic metre in copper (MIT gives 8.49 × 10²⁸ /m³)'
    value: 8.5e28 1/m**3
    tolerance: '1%'
    shown: ['$n = 8.5 \times 10^{28}$ free electrons per cubic metre']
    source: {cite: mit, at: 'Problem 6.7.4'}
    origin: mit

  - id: drift-area
    where: 'worked example "How fast do the electrons drift?", step "Area in square metres"'
    inputs: {A: 1.5 mm**2}
    formula: A
    expected: 1.5e-6 m**2
    shown: ['so $A = 1.5 \times 10^{-6}\ \text{m}^2$']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: page-own

  - id: drift-speed
    where: 'worked example, step "Drift speed": v_d = I/(neA)'
    inputs: {I: 3.0 A, n: 8.5e28 1/m**3, e: 1.6e-19 C, A: 1.5e-6 m**2}
    formula: I / (n * e * A)
    expected: 1.5e-4 m/s
    shown: ['$v_d = I/(neA) = 3.0/(8.5 \times 10^{28} \times 1.6 \times 10^{-19} \times 1.5 \times 10^{-6}) = 1.5 \times 10^{-4}\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: page-own

  - id: drift-speed-mm
    where: 'worked example: "about a seventh of a millimetre per second"'
    inputs: {I: 3.0 A, n: 8.5e28 1/m**3, e: 1.6e-19 C, A: 1.5e-6 m**2}
    formula: I / (n * e * A)
    expected: 0.143 mm/s
    tolerance: '5%'
    shown: ['about a seventh of a millimetre per second']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: page-own

  - id: drift-speed-unrounded
    where: 'worked example, step "Time for one metre": the unrounded drift speed 1.47 × 10⁻⁴ m/s'
    inputs: {I: 3.0 A, n: 8.5e28 1/m**3, e: 1.6e-19 C, A: 1.5e-6 m**2}
    formula: I / (n * e * A)
    expected: 1.47e-4 m/s
    shown: ['$t = 1.0/(1.47 \times 10^{-4}) = 6.8 \times 10^{3}\ \text{s}$']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: page-own

  - id: drift-time
    where: 'worked example, step "Time for one metre": t = 1.0 m / v_d'
    inputs: {L: 1.0 m, I: 3.0 A, n: 8.5e28 1/m**3, e: 1.6e-19 C, A: 1.5e-6 m**2}
    formula: L / (I / (n * e * A))
    expected: 6.8e3 s
    shown: ['$t = 1.0/(1.47 \times 10^{-4}) = 6.8 \times 10^{3}\ \text{s}$']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: page-own

  - id: drift-time-hours
    where: 'worked example: "almost two hours"'
    inputs: {L: 1.0 m, I: 3.0 A, n: 8.5e28 1/m**3, e: 1.6e-19 C, A: 1.5e-6 m**2}
    formula: L / (I / (n * e * A))
    expected: 1.9 hour
    tolerance: '5%'
    shown: ['almost two hours']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: page-own

  - id: ohm-current
    where: 'worked example "Using Ohm''s law", step "(a) Current"'
    inputs: {V: 9.0 V, R: 330 ohm}
    formula: V / R
    expected: 0.027 A
    shown: ['$I = V/R = 9.0/330 = 0.027\ \text{A}$, or 27 milliamperes']
    source: {cite: mit, at: 'Eq. (6.2.7)'}
    origin: page-own

  - id: ohm-resistance
    where: 'worked example "Using Ohm''s law", step "(b) Resistance"'
    inputs: {V: 3.0 V, I: 0.12 A}
    formula: V / I
    expected: 25 ohm
    shown: ['$R = V/I = 3.0/0.12 = 25\ \text{Ω}$']
    source: {cite: mit, at: 'Eq. (6.2.6)'}
    origin: page-own

  - id: lamp-model-low
    where: 'plot caption: the lamp model I = 0.30 (V/6.0)^0.6 A gives about 0.10 A at 1.0 V, as in the worked example'
    inputs: {}
    formula: 0.30 * (1.0 / 6.0)**0.6
    expected: '0.10'
    tolerance: '3%'
    shown: ['from the simple model I = 0.30 × (V/6.0)^0.6 A']
    source: {cite: mit, at: 'Sec. 6.2, Fig. 6.2.2 and Eq. (6.2.11) (the source shows a non-ohmic curve and says that resistivity grows with temperature; the model and its numbers are the page''s own)'}
    origin: page-own

  - id: lamp-model-high
    where: 'plot caption: the lamp model gives 0.30 A at 6.0 V'
    inputs: {}
    formula: 0.30 * (6.0 / 6.0)**0.6
    expected: '0.30'
    shown: ['a small 6 V lamp']
    source: {cite: mit, at: 'Sec. 6.2, Fig. 6.2.2 and Eq. (6.2.11) (the source shows a non-ohmic curve and says that resistivity grows with temperature; the model and its numbers are the page''s own)'}
    origin: page-own

  - id: lamp-cold
    where: 'worked example "The resistance of a lamp", step "Barely glowing"'
    inputs: {V: 1.0 V, I: 0.10 A}
    formula: V / I
    expected: 10 ohm
    shown: ['$R = V/I = 1.0/0.10 = 10\ \text{Ω}$']
    source: {cite: mit, at: 'Eq. (6.2.6)'}
    origin: page-own

  - id: lamp-hot
    where: 'worked example "The resistance of a lamp", step "Fully lit"'
    inputs: {V: 6.0 V, I: 0.30 A}
    formula: V / I
    expected: 20 ohm
    shown: ['$R = 6.0/0.30 = 20\ \text{Ω}$']
    source: {cite: mit, at: 'Eq. (6.2.6)'}
    origin: page-own

  - id: lamp-ratios
    kind: identity
    where: 'worked example: six times the voltage, three times the current, twice the resistance'
    formula: (6.0 / 1.0) / (0.30 / 0.10)
    equals: 20 / 10
    samples: {x: [1.0]}
    tolerance: 1e-9
    shown: ['Six times the voltage gives only three times the current: the hot filament has twice the resistance of the warm one']
    source: {cite: mit, at: 'Sec. 6.2, Fig. 6.2.2'}
    origin: page-own

  - id: conductance-example
    where: 'section "Ohmic and non-ohmic conductors": conductance of the 25 Ω component, G = 1/R'
    inputs: {R: 25 ohm}
    formula: 1 / R
    expected: 0.040 S
    shown: ['$G = 1/25 = 0.040\ \text{S}$']
    source: {cite: mit6071kirchhoff, at: 'p. 5, Eq. (1.6)'}
    origin: page-own

  - id: rho-silver
    kind: fact
    where: 'section "Resistivity": silver (MIT table 1.59 × 10⁻⁸ Ω m)'
    value: 1.6e-8 ohm*m
    tolerance: '1%'
    shown: ['silver $1.6 \times 10^{-8}\ \text{Ω}\,\text{m}$']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: mit

  - id: rho-copper
    kind: fact
    where: 'section "Resistivity": copper (MIT table 1.72 × 10⁻⁸ Ω m)'
    value: 1.7e-8 ohm*m
    tolerance: '2%'
    shown: ['copper $1.7 \times 10^{-8}\ \text{Ω}\,\text{m}$']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: mit

  - id: rho-aluminium
    kind: fact
    where: 'section "Resistivity": aluminium (MIT table 2.82 × 10⁻⁸ Ω m)'
    value: 2.8e-8 ohm*m
    tolerance: '1%'
    shown: ['aluminium $2.8 \times 10^{-8}\ \text{Ω}\,\text{m}$']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: mit

  - id: rho-nichrome
    kind: fact
    where: 'section "Resistivity": nichrome (MIT table 100 × 10⁻⁸ Ω m)'
    value: 1.0e-6 ohm*m
    shown: ['nichrome, an alloy used in toasters and heaters, $1.0 \times 10^{-6}\ \text{Ω}\,\text{m}$']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: mit

  - id: nichrome-vs-copper
    where: 'section "Resistivity": nichrome is about 60 times copper'
    inputs: {}
    formula: 1.0e-6 / 1.7e-8
    expected: '60'
    tolerance: '3%'
    shown: ['about 60 times copper']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: page-own

  - id: rho-glass
    kind: fact
    where: 'section "Resistivity": glass, 10¹⁰ to 10¹⁴ Ω m (MIT table)'
    value: 1e10 ohm*m
    shown: ['glass, between $10^{10}$ and $10^{14}\ \text{Ω}\,\text{m}$']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: mit

  - id: glass-vs-copper
    where: 'section "Resistivity": glass at least 10¹⁷ times copper (lowest glass value over copper: 5.9 × 10¹⁷)'
    inputs: {}
    formula: 1e10 / 1.7e-8
    expected: '5.9e17'
    tolerance: '1%'
    shown: ['a glass rod resists at least $10^{17}$ times as much as a copper rod of the same shape']
    source: {cite: mit, at: 'Sec. 6.2, table of resistivities'}
    origin: page-own

  - id: cable-resistance
    where: 'worked example "A household cable and a heating wire", step "(a) The copper wire"'
    inputs: {rho: 1.7e-8 ohm*m, L: 20 m, A: 1.5e-6 m**2}
    formula: rho * L / A
    expected: 0.23 ohm
    shown: ['$R = \rho L/A = 1.7 \times 10^{-8} \times 20/(1.5 \times 10^{-6}) = 0.23\ \text{Ω}$']
    source: {cite: mit, at: 'Eq. (6.2.10)'}
    origin: page-own

  - id: nichrome-area
    where: 'worked example, step "(b) Cross-section of the nichrome wire"'
    inputs: {r: 0.20 mm}
    formula: pi * r**2
    expected: 1.26e-7 m**2
    shown: ['$A = \pi r^2 = \pi \times (0.20 \times 10^{-3})^2 = 1.26 \times 10^{-7}\ \text{m}^2$']
    source: {cite: mit, at: 'Eq. (6.2.10)'}
    origin: page-own

  - id: nichrome-length
    where: 'worked example, step "(b) Length": L = RA/ρ'
    inputs: {R: 10 ohm, r: 0.20 mm, rho: 1.0e-6 ohm*m}
    formula: R * pi * r**2 / rho
    expected: 1.3 m
    shown: ['$L = RA/\rho = 10 \times 1.26 \times 10^{-7}/(1.0 \times 10^{-6}) = 1.3\ \text{m}$']
    source: {cite: mit, at: 'Eq. (6.2.10)'}
    origin: page-own

  - id: drift-current-formula
    kind: identity
    where: 'section "Electrons drift slowly": charge n e A v_d t passing in a time t gives I = n e v_d A'
    formula: (n * e * A * v * t) / t
    equals: n * e * v * A
    samples: {n: [8.5e28, 1.0e28], e: [1.6e-19, 1.6e-19], A: [1.5e-6, 1.0e-6], v: [1.5e-4, 1.0e-3], t: [1.0, 60.0]}
    tolerance: 1e-12
    shown: ['with charge $n e A v_d t$']
    source: {cite: mit, at: 'Eq. (6.1.4)'}
    origin: mit
