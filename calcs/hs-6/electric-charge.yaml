# Calculations on content/year-0/hs-6/electric-charge.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-6/electric-charge.mdx
calcs:
  - id: elementary-charge
    kind: fact
    where: 'section "The elementary charge and the coulomb": the elementary charge, to two figures as in the source'
    value: 1.6e-19 C
    shown: ['tex="e = 1.6 \times 10^{-19}\ \text{C}"', 'with $e = 1.6 \times 10^{-19}\ \text{C}$ and']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: mit

  - id: quiz-ball-electrons
    where: 'quiz 1: n = Q/e for +6.4e-18 C'
    inputs: {Q: 6.4e-18 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '40'
    shown: ['$n = Q/e = 6.4 \\times 10^{-18} / 1.6 \\times 10^{-19} = 40$']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: quiz-spheres-total
    where: 'quiz 2: total charge +6 nC + (-10 nC)'
    inputs: {Q1: 6 nC, Q2: -10 nC}
    formula: Q1 + Q2
    expected: -4 nC
    shown: ['$+6 + (-10) = -4\\ \\text{nC}$']
    source: {cite: reading2, at: 'Sec. 16.3, Conservation of charge'}
    origin: page-own

  - id: quiz-spheres-share
    where: 'quiz 2: each identical sphere keeps half of the total'
    inputs: {Q1: 6 nC, Q2: -10 nC}
    formula: (Q1 + Q2) / 2
    expected: -2 nC
    shown: ['$-4/2 = -2\\ \\text{nC}$ each']
    source: {cite: reading2, at: 'Sec. 16.3, Arrangement of charge'}
    origin: page-own

  - id: quiz-spheres-share-size
    where: 'quiz 2: the size of the (negative) charge on each sphere, to match the answer choice -2 nC'
    inputs: {Q1: 6 nC, Q2: -10 nC}
    formula: -(Q1 + Q2) / 2
    expected: 2 nC
    shown: ['$-4/2 = -2\\ \\text{nC}$ each']
    quiz: 2
    source: {cite: reading2, at: 'Sec. 16.3, Arrangement of charge'}
    origin: page-own

  - id: quiz-impossible-charge
    where: 'quiz 3: 4.0e-19 C is 2.5 elementary charges, not a whole number'
    inputs: {e: 1.6e-19 C}
    formula: 2.5 * e
    expected: 4.0e-19 C
    shown: ['two and a half electrons'' worth']
    quiz: 3
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: quiz-possible-2e
    where: 'quiz 3 explanation: 3.2e-19 C is 2 e'
    inputs: {Q: 3.2e-19 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '2'
    shown: ['The others are 2, 5 and 10 times $e$']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: quiz-possible-5e
    where: 'quiz 3 explanation: 8.0e-19 C is 5 e'
    inputs: {Q: 8.0e-19 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '5'
    shown: ['The others are 2, 5 and 10 times $e$']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: quiz-possible-10e
    where: 'quiz 3 explanation: 1.6e-18 C is 10 e'
    inputs: {Q: 1.6e-18 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '10'
    shown: ['The others are 2, 5 and 10 times $e$']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: charges-per-coulomb
    where: 'section "The elementary charge and the coulomb": one coulomb in elementary charges'
    inputs: {Q: 1 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '6.25e18'
    shown: ['$1/(1.6 \times 10^{-19}) = 6.25 \times 10^{18}$', 'more than six billion billion']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: comb-coulombs
    where: 'worked example "Counting the electrons on a comb", step "Convert to coulombs"'
    inputs: {Q: -4.0 nC}
    formula: Q
    expected: -4.0e-9 C
    shown: ['$Q = -4.0\ \text{nC} = -4.0 \times 10^{-9}\ \text{C}$']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: comb-electrons
    where: 'worked example, step "Divide by the elementary charge": n = |Q|/e'
    inputs: {Q: 4.0e-9 C, e: 1.6e-19 C}
    formula: Q / e
    expected: '2.5e10'
    shown: ['$4.0 \times 10^{-9} / 1.6 \times 10^{-19} = 2.5 \times 10^{10}$', 'The comb carries $2.5 \times 10^{10}$ extra electrons, twenty-five billion']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
    origin: page-own

  - id: spheres-total
    where: 'worked example "Two metal spheres touch", step "The total charge is conserved"'
    inputs: {Q1: 7.0 nC, Q2: -3.0 nC}
    formula: Q1 + Q2
    expected: 4.0 nC
    shown: ['$Q_1 + Q_2 = +7.0 + (-3.0) = +4.0\ \text{nC}$']
    source: {cite: reading2, at: 'Sec. 16.3, Conservation of charge'}
    origin: page-own

  - id: spheres-share
    where: 'worked example, step "Share it equally": Q = (Q1 + Q2)/2'
    inputs: {Q1: 7.0 nC, Q2: -3.0 nC}
    formula: (Q1 + Q2) / 2
    expected: 2.0 nC
    shown: ['$Q = +4.0/2 = +2.0\ \text{nC}$ on each sphere']
    source: {cite: reading2, at: 'Sec. 16.3, Arrangement of charge'}
    origin: page-own

  - id: spheres-change-a
    where: 'worked example, step "Which electrons moved?": change of sphere A, +7.0 nC to +2.0 nC'
    inputs: {before: 7.0 nC, after: 2.0 nC}
    formula: before - after
    expected: 5.0 nC
    shown: ['it gained $5.0\ \text{nC}$ of negative charge']
    source: {cite: reading2, at: 'Sec. 16.3, Conservation of charge'}
    origin: page-own

  - id: spheres-change-b
    where: 'worked example, step "Which electrons moved?": change of sphere B, -3.0 nC to +2.0 nC'
    inputs: {before: -3.0 nC, after: 2.0 nC}
    formula: after - before
    expected: 5.0 nC
    shown: ['a loss of $5.0\ \text{nC}$ of negative charge']
    source: {cite: reading2, at: 'Sec. 16.3, Conservation of charge'}
    origin: page-own

  - id: spheres-electrons
    where: 'worked example, step "Which electrons moved?": number of electrons in 5.0 nC'
    inputs: {Q: 5.0 nC, e: 1.6e-19 C}
    formula: Q / e
    expected: '3.1e10'
    shown: ['$5.0 \times 10^{-9} / 1.6 \times 10^{-19} = 3.1 \times 10^{10}$']
    source: {cite: reading3, at: 'Sec. 16.4, Unit of charge'}
