# Calculations on content/year-3/8.06/nondegenerate-perturbation-theory.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 1 transcripts and notes chapter 1, with the page's own example.

page: content/year-3/8.06/nondegenerate-perturbation-theory.mdx
calcs:
  - id: second-order-oscillator
    kind: identity
    where: 'example (a): |δH_10|²/(E_1 − E_0) with |δH_10|² = q²ℰ²ħ/2mω and E_1 − E_0 = ħω equals q²ℰ²/2mω²'
    formula: (q**2*F**2*hb/(2*m*w))/(hb*w)
    equals: q**2*F**2/(2*m*w**2)
    samples: {q: [0.5, 1.7], F: [0.3, 2.0], hb: [0.8, 1.3], m: [0.6, 2.2], w: [0.4, 3.0]}
    tolerance: 1e-12
    shown: ['$E_0^{(2)} = -\frac{q^2\mathcal{E}^2}{2m\omega^2}$']
    source: {cite: reading5, at: 'eq. (1.1.36)'}
    origin: page-own

  - id: complete-square
    kind: identity
    where: 'example (b): ½mω²x² − qℰx = ½mω²(x − qℰ/mω²)² − q²ℰ²/2mω²'
    formula: 0.5*m*w**2*x**2 - q*F*x
    equals: 0.5*m*w**2*(x - q*F/(m*w**2))**2 - q**2*F**2/(2*m*w**2)
    samples: {q: [0.5, 1.7], F: [0.3, 2.0], m: [0.6, 2.2], w: [0.4, 3.0], x: [-1.3, 0.7]}
    tolerance: 1e-12
    shown: ['\left(x - \frac{q\mathcal{E}}{m\omega^2}\right)^2 - \frac{q^2\mathcal{E}^2}{2m\omega^2}']
    source: {cite: reading5, at: 'eq. (1.1.36)'}
    origin: page-own

  - id: omega
    where: 'example (c): ω = 1 eV/ħ'
    inputs: {E: 1 eV}
    formula: E / hbar
    expected: 1.52e15 1/s
    shown: ['\approx 1.52 \times 10^{15}$ s⁻¹']
    source: {cite: reading5, at: 'eq. (1.1.36)'}
    origin: page-own

  - id: shift-J
    where: 'example (c): q²ℰ²/2mω² for an electron, ℰ = 1e7 V/m, ħω = 1 eV'
    inputs: {q: 1.602e-19 C, F: 1e7 V/m, m: 9.109e-31 kg, E: 1 eV}
    formula: q**2 * F**2 / (2 * m * (E / hbar)**2)
    expected: 6.1e-25 J
    shown: ['about $6.1 \times 10^{-25}$ J']
    source: {cite: reading5, at: 'eq. (1.1.36)'}
    origin: page-own

  - id: shift-eV
    where: 'example (c): the same shift in eV'
    inputs: {q: 1.602e-19 C, F: 1e7 V/m, m: 9.109e-31 kg, E: 1 eV}
    formula: q**2 * F**2 / (2 * m * (E / hbar)**2)
    expected: 3.8e-6 eV
    shown: ['or $3.8 \times 10^{-6}$ eV']
    source: {cite: reading5, at: 'eq. (1.1.36)'}
    origin: page-own

  - id: second-order-matrix
    kind: identity
    where: 'formula check: for H = diag(0, 1) + ε[[0, 1], [1, 0]], the exact lower eigenvalue (1 − √(1 + 4ε²))/2 approaches the second-order result −ε² as ε → 0 (the ratio tends to 1)'
    formula: ((1 - sqrt(1 + 4*e**2))/2) / (-e**2)
    equals: 1 + 0*e
    samples: {e: [0.0001, 0.0003]}
    tolerance: 1e-6
    shown: ['E_n^{(2)} = \langle n^{(0)}|\,\delta H\,|n^{(1)}\rangle = -\sum_{k\neq n}\frac{|\delta H_{kn}|^2}{E_k^{(0)} - E_n^{(0)}}']
    source: {cite: reading5, at: 'eq. (1.1.36)'}
    origin: page-own
