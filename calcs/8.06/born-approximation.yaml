    where: 'example (c): σ as k → 0, 4π g²/μ⁴'
    inputs: {}
    formula: 4*pi*0.04/0.49**2
    expected: '2.09'
    shown: ['about 2.09 fm²']
    source: {cite: reading4, at: 'eq. (7.3.37), p. 149'}
