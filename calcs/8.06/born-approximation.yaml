  - id: ex-sigma-high
    kind: limit
    where: 'example (c): for 2k ≫ μ, σ k² tends to π g²/μ² (σ ∝ 1/k²); g = 0.2, μ = 0.7'
    inputs: {}
    formula: kk**2*4*pi*0.04/(0.49*(0.49 + 4*kk**2))
    limit: pi*0.04/0.49
