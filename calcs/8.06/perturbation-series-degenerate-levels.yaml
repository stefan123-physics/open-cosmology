# Calculations on content/year-3/8.06/perturbation-series-degenerate-levels.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 2 transcripts and notes chapter 1, with the page's own example.

page: content/year-3/8.06/perturbation-series-degenerate-levels.mdx
calcs:
  - id: exact-two-state
    kind: identity
    where: 'eq. (1.1.45): the eigenvalues of [[E1, λV], [λV*, E2]] are (E1 + E2)/2 ± ((E1 − E2)/2)√(1 + λ²|V|²/((E1 − E2)/2)²) (upper sign, E1 > E2)'
    formula: (a + b)/2 + sqrt(((a - b)/2)**2 + (l*v)**2)
    equals: (a + b)/2 + (a - b)/2*sqrt(1 + l**2*v**2/((a - b)/2)**2)
    samples: {a: [2.0, 3.5], b: [0.2, 1.1], l: [0.1, 0.9], v: [0.3, 1.4]}
    tolerance: 1e-12
    shown: ['\sqrt{1 + \frac{\lambda^2|V|^2}{\frac14(E_1^{(0)} - E_2^{(0)})^2}}']
    source: {cite: reading5, at: 'eq. (1.1.45)'}
    origin: mit

  - id: sqrt-series
    kind: identity
    where: 'eq. (1.1.46): √(1 + z²) = 1 + z²/2 − z⁴/8 + z⁶/16 − 5z⁸/128 + O(z¹⁰), checked at small z (the lecture and the notes give z⁶/6, and the notes +5z⁸/128: slips)'
    formula: sqrt(1 + z**2)
    equals: 1 + z**2/2 - z**4/8 + z**6/16 - 5*z**8/128
    samples: {z: [0.05, 0.1]}
    tolerance: 1e-10
    shown: ['1 + \frac{z^2}{2} - \frac{z^4}{8} + \frac{z^6}{16} - \frac{5z^8}{128}']
    source: {cite: reading5, at: 'eq. (1.1.46)'}
    origin: mit

  - id: vac-expectation
    where: 'eq. (1.1.55): ⟨0|(a + a†)⁴|0⟩ = 3, from (a + a†)⁴|0⟩ = 3|0⟩ + 6√2|2⟩ + √24|4⟩; the norm² 9 + 72 + 24 = 105 = ⟨0|(a + a†)⁸|0⟩ = 7!! as a check'
    inputs: {}
    formula: 3**2 + (6*sqrt(2))**2 + 24
    expected: '105'
    tolerance: 1e-9
    shown: ['3|0\rangle + 6\sqrt2\,|2\rangle + \sqrt{4!}\,|4\rangle']
    source: {cite: reading5, at: 'eq. (1.1.59)'}
    origin: mit

  - id: first-order
    where: 'eq. (1.1.54): E0(1) = 3/4 ħω'
    inputs: {}
    formula: 3/4
    expected: '0.75'
    tolerance: 1e-12
    shown: ['E_0^{(1)} = \frac34\hbar\omega']
    source: {cite: reading5, at: 'eq. (1.1.54)'}
    origin: mit

  - id: dH20
    where: 'δH_20 = (1/4)·6√2 = 3√2/2 (units ħω)'
    inputs: {}
    formula: 6*sqrt(2)/4 - 3*sqrt(2)/2
    expected: '0'
    tolerance: 1e-12
    shown: ['\delta H_{20} = \frac{3\sqrt2}{2}\hbar\omega']
    source: {cite: reading5, at: 'eq. (1.1.60)'}
    origin: mit

  - id: dH40
    where: 'δH_40 = (1/4)·√24 = √6/2 (units ħω)'
    inputs: {}
    formula: sqrt(24)/4 - sqrt(6)/2
    expected: '0'
    tolerance: 1e-12
    shown: ['\delta H_{40} = \frac{\sqrt6}{2}\hbar\omega']
    source: {cite: reading5, at: 'eq. (1.1.60)'}
    origin: mit

  - id: E2-term1
    where: 'eq. (1.1.61): |δH_20|²/(2ħω) = 9/4 ħω'
    inputs: {}
    formula: (3*sqrt(2)/2)**2/2
    expected: '2.25'
    tolerance: 1e-12
    shown: ['-\frac94\hbar\omega']
    source: {cite: reading5, at: 'eq. (1.1.61)'}
    origin: mit

  - id: E2-term2
    where: 'eq. (1.1.61): |δH_40|²/(4ħω) = 3/8 ħω'
    inputs: {}
    formula: (sqrt(6)/2)**2/4
    expected: '0.375'
    tolerance: 1e-12
    shown: ['- \frac38\hbar\omega']
    source: {cite: reading5, at: 'eq. (1.1.61)'}
    origin: mit

  - id: E2-total
    where: 'eq. (1.1.61): −9/4 − 3/8 = −21/8; times λ² inside ½ħω(…) this is −21/4 λ²'
    inputs: {}
    formula: -9/4 - 3/8
    expected: '-2.625'
    tolerance: 1e-12
    shown: ['= -\frac{21}{8}\hbar\omega', '\frac32\lambda - \frac{21}{4}\lambda^2 + \frac{333}{8}\lambda^3']
    source: {cite: reading5, at: 'eqs. (1.1.61), (1.1.62)'}
    origin: mit

  - id: bw-coef-check
    kind: fact
    where: 'Bender and Wu coefficients 333/8 and 30885/64 as quoted in the notes (transcript says 30,855/64: slip)'
    value: '30885/64'
    shown: ['\frac{30885}{64}\lambda^4 + O(\lambda^5)']
    source: {cite: benderwu, at: 'as quoted in the 8.06 notes, eq. (1.1.63)'}
    origin: mit

  - id: t1
    where: 'example (a): 3/2 λ at λ = 0.1'
    inputs: {}
    formula: 1.5*0.1
    expected: '0.15'
    tolerance: 1e-12
    shown: ['$\frac32\lambda = 0.15$']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: t2
    where: 'example (a): 21/4 λ²'
    inputs: {}
    formula: 21/4*0.1**2
    expected: '0.0525'
    tolerance: 1e-12
    shown: ['$\frac{21}{4}\lambda^2 = 0.0525$']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: t3
    where: 'example (a): 333/8 λ³'
    inputs: {}
    formula: 333/8*0.1**3
    expected: '0.0416'
    shown: ['$\frac{333}{8}\lambda^3 \approx 0.0416$']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: t4
    where: 'example (a): 30885/64 λ⁴'
    inputs: {}
    formula: 30885/64*0.1**4
    expected: '0.0483'
    shown: ['$\frac{30885}{64}\lambda^4 \approx 0.0483$']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: t5
    where: 'example (a): 916731/128 λ⁵ (notes eq. (1.1.63))'
    inputs: {}
    formula: 916731/128*0.1**5
    expected: '0.0716'
    shown: ['is about $0.0716$']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: bracket
    where: 'example (b): 1 + 0.15 − 0.0525 + 0.041625'
    inputs: {}
    formula: 1 + 0.15 - 0.0525 + 333/8*0.001
    expected: '1.139'
    shown: ['+ 0.0416 \approx 1.139$']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: E0-estimate
    where: 'example (b): 1.139125 × ½ (units ħω)'
    inputs: {}
    formula: (1 + 0.15 - 0.0525 + 333/8*0.001)/2
    expected: '0.570'
    shown: ['\approx 0.570\,\hbar\omega']
    source: {cite: benderwu, at: 'eq. (1.1.63)'}
    origin: page-own

  - id: toy-eigen
    kind: identity
    where: 'degenerate toy model: (1, ±1)/√2 are eigenvectors of [[1, λ], [λ, 1]] with eigenvalues 1 ± λ (first component of H v − (1 + λ) v for v = (1, 1))'
    formula: (1*1 + l*1) - (1 + l)*1
    equals: 0*l
    samples: {l: [0.1, 0.7]}
    tolerance: 1e-12
    shown: ['But the exact eigenvalues are $1 \pm \lambda$']
    source: {cite: reading5, at: 'eqs. (1.2.7), (1.2.8)'}
    origin: mit
