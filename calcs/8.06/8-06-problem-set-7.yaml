  # ---- Problem 6: adiabatic spin rotation

  - id: p6-gap
    kind: identity
    answer: p6-gap
    where: 'Problem 6(a), answer box: at t = 0 the eigenvalues of −μ0 σ·B are the two roots of E² = μ0²(B_x² + B_y²), found numerically; B⊥ in the samples equals √(B_x² + B_y²)'
    formula: |-
      2*mu0*Bp
    equals: |-
      solve('s**2 - mu0**2*(Bx**2 + By**2)', 's', 0, 100) - solve('s**2 - mu0**2*(Bx**2 + By**2)', 's', -100, 0)
    samples:
      mu0: [1, 2, 0.5]
      Bx: [3, 0.6, 1.5]
      By: [4, 0.8, 2]
      Bp: [5, 1, 2.5]
    tolerance: 1e-08
    shown: ['id="p6-gap"', '<Formula label="Instantaneous energies of the spin"']
    source: {cite: mit, at: 'Problem 6(a), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-gamma
    kind: identity
    answer: p6-gamma
    where: 'Problem 6(a), answer box: a quarter of the rate at which the coupling criterion ħ|Ḣ₋₊|/(gap)² = ħμ0γ/(2μ0B⊥)² reaches 1, solved numerically for γ (the 4 is the number of order one of this form of the condition)'
    formula: |-
      mu0*Bp**2/hbar
    equals: |-
      solve('hbar*mu0*s/(2*mu0*Bp)**2 - 1', 's', 0.0001, 10000)/4
    samples:
      mu0: [1, 2, 0.5]
      Bp: [0.5, 1, 2]
      hbar: [1, 0.5, 2]
    tolerance: 1e-08
    shown: ['id="p6-gamma"', '<Formula label="The coupling compared with the gap"']
    source: {cite: reading5, at: 'eqs. (3.9), (3.10), for the two spin states'}
    origin: page-own

  - id: p6-gamma-lz
    kind: identity
    where: 'Problem 6(a): the same combination from the Landau–Zener form: twice the rate at which |H12|²/(ħα) = (μ0B⊥)²/(ħ 2μ0γ) falls to 1, solved numerically (the 2 is the number of order one of this form)'
    formula: |-
      mu0*Bp**2/hbar
    equals: |-
      2*solve('(mu0*Bp)**2/(hbar*2*mu0*s) - 1', 's', 0.0001, 10000)
    samples:
      mu0: [1, 2, 0.5]
      Bp: [0.5, 1, 2]
      hbar: [1, 0.5, 2]
    tolerance: 1e-08
    shown: ['<Formula label="Adiabatic condition for the spin"']
    source: {cite: reading5, at: 'eq. (4.12)'}
    origin: page-own

  - id: p6-lnp
    kind: identity
    answer: p6-lnp
    where: 'Problem 6(a), answer box (our addition): the notes'' exponent 2π|H12|²/(ħα), with |H12| = μ0B⊥ and α the numerical time derivative of the difference of the diagonal entries, μ0γt − (−μ0γt)'
    formula: |-
      pi*mu0*Bp**2/(hbar*ga)
    equals: |-
      2*pi*(mu0*Bp)**2/(hbar*deriv('mu0*ga*s - (-mu0*ga*s)', 's', t0))
    samples:
      mu0: [1, 2, 0.5]
      Bp: [0.5, 1, 2]
      hbar: [1, 0.5, 2]
      ga: [0.5, 2, 1]
      t0: [0.3, -1, 2]
    tolerance: 1e-07
    shown: ['id="p6-lnp"', '<Formula label="Probability that the spin fails to follow the field"']
    source: {cite: reading5, at: 'eq. (4.18), with the entries of this problem (our addition)'}
    origin: page-own

  - id: p6-t
    kind: identity
    answer: p6-t
    where: 'Problem 6(b), answer box: the time at which the lower bound B⊥/T on γ meets the upper bound μ0B⊥²/ħ, solved numerically for T'
    formula: |-
      hbar/(mu0*Bp)
    equals: |-
      solve('Bp/s - mu0*Bp**2/hbar', 's', 0.0001, 10000)
    samples:
      mu0: [1, 2, 0.5]
      Bp: [0.5, 1, 2]
      hbar: [1, 0.5, 2]
    tolerance: 1e-08
    shown: ['id="p6-t"', '<Formula label="How long the sweep must take"']
    source: {cite: mit, at: 'Problem 6(b), p. 5 (our own solution)'}
    origin: page-own

  - id: p6-grad
    kind: identity
    answer: p6-grad
    where: 'Problem 6(c), answer box: the gradient at which the rate v|∇B| seen by an atom of speed √(k_BT/m) equals the bound μ0B²/ħ of part (a), solved numerically'
    formula: |-
      mu0*B**2/(hbar*sqrt(kB*T/m))
    equals: |-
      solve('sqrt(kB*T/m)*s - mu0*B**2/hbar', 's', 0.0001, 10000)
    samples:
