    tolerance: 1e-08
    shown: ['id="p6-grad"', '<Formula label="Adiabatic condition in a magnetic trap"']
    source: {cite: mit, at: 'Problem 6(c), p. 6 (our own solution)'}
    origin: page-own

  - id: p6-grad-units
    kind: units
    where: 'Problem 6(c): both sides of ħ v |∇B| ≪ μ0 B² have the same units (SI stand-ins: μ0 in J/T)'
    inputs: {mu: 1 J/T, BB: 1 T, vv: 1 m/s, gB: 1 T/m}
    terms: ['hbar*vv*gB', 'mu*BB**2']
