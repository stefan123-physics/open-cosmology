  # ---- Problem 7: Landau–Zener

  - id: p7-c1
    kind: identity
    answer: p7-c1
    where: 'Problem 7(a), answer box: the rate of change of the phase φ(t) = (1/ħ)∫₀ᵗ α s ds, by numerical integration and differentiation'
    formula: |-
      al*t/hbar
    equals: |-
      (integrate('al*s/hbar', 's', 0, t + 0.001) - integrate('al*s/hbar', 's', 0, t - 0.001))/0.002
    samples:
      al: [0.5, 1, 2]
      t: [0.2, 1.3, 3]
      hbar: [1, 2, 0.5]
    tolerance: 1e-08
    shown: ['id="p7-c1"', '<Formula label="Second-order equation for B"']
    source: {cite: mit, at: 'Problem 7(a), p. 6 (our own solution)'}
    origin: page-own

  - id: p7-c0
    kind: identity
    answer: p7-c0
    where: 'Problem 7(a), answer box: for α = 0 the exact solution is the Rabi oscillation B = cos(|H12| t/ħ); c0 = −(d²B/dt²)/B by a numerical second derivative'
    formula: |-
      h12**2/hbar**2
    equals: |-
      -deriv('cos(h12*s/hbar)', 's', t0, 2)/cos(h12*t0/hbar)
    samples:
      h12: [0.5, 1, 2]
      hbar: [1, 2, 0.5]
      t0: [0.3, 0.7, 0.2]
    tolerance: 1e-05
    shown: ['id="p7-c0"', 'an oscillation at the lesson''s Rabi frequency']
    source: {cite: mit, at: 'Problem 7(a), p. 6 (our own solution)'}
    origin: page-own

  - id: p7-a2
    kind: limit
    answer: p7-a2
    where: 'Problem 7(b), answer box: (|H12|/ħ)² times the squared modulus of ∫e^{iαt²/2ħ}dt, computed numerically with a damping factor e^{−εt²} (cosine and sine parts, twice the integral from 0 to 5/√ε), as ε → 0'
    inputs: {h12: 0.7, hbar: 1.3, al: 2.2}
    formula: |-
      2*pi*h12**2/(hbar*al)
    limit: |-
      (h12/hbar)**2*((2*integrate('exp(-eps*s**2)*cos(al*s**2/(2*hbar))', 's', 0, 5/sqrt(eps)))**2 + (2*integrate('exp(-eps*s**2)*sin(al*s**2/(2*hbar))', 's', 0, 5/sqrt(eps)))**2)
    vary: {eps: [0.4, 0.2, 0.1, 0.05]}
    tolerance: 0.003
    shown: ['id="p7-a2"', '<Formula label="First-order amplitude and probabilities"']
    source: {cite: mit, at: 'Problem 7(b), p. 7 (our own solution)'}
    origin: page-own

  - id: p7-tau
    kind: identity
    answer: p7-tau
    where: 'Problem 7(c), answer box: the coefficient (αt/ħ)(dt/dτ) of dB/dτ, after dividing the equation by (α/|H12|)², must be γτ with γ = |H12|²/(ħα): so τ = that coefficient divided by γ'
    formula: |-
      al*t/h12
    equals: |-
      (al*t/hbar)*(h12/al)/(h12**2/(hbar*al))
    samples:
      al: [0.5, 1, 2]
      t: [0.2, 1.3, 3]
      h12: [2, 0.5, 1]
      hbar: [1, 2, 0.5]
    tolerance: 1e-12
    shown: ['id="p7-tau"', '<Formula label="Changing the time variable"']
    source: {cite: mit, at: 'Problem 7(c), p. 7 (our own solution)'}
    origin: page-own

