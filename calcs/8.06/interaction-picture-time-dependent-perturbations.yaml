# Calculations on content/year-3/8.06/interaction-picture-time-dependent-perturbations.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 9 transcripts and notes chapter 4 (sections 4.1-4.2), with the page's
# own worked example: a two-level system with E_a - E_b = 2.0 eV kicked by a pulse of length t0 = 1.0e-17 s,
# hbar = 6.582e-16 eV s, kick strengths |alpha|/hbar = pi/6 and pi/2.

page: content/year-3/8.06/interaction-picture-time-dependent-perturbations.mdx
calcs:
  - id: regulated-ca-equation
    kind: identity
    where: 'notes eq. (4.1.38): c_a = cos(r t) with r = |α|/(ħ t0) satisfies c_a″ = −r² c_a (second derivative)'
    formula: deriv('cos(rr*s)', 's', tt, 2)
    equals: -rr**2*cos(rr*tt)
    samples: {rr: [0.5, 2.0], tt: [0.3, 1.1]}
    tolerance: 1e-6
    shown: ['gives $\ddot c_a = -\left(|\alpha|/(\hbar t_0)\right)^2c_a$']
    source: {cite: reading5, at: 'eq. (4.1.38)'}
    origin: mit

  - id: regulated-cb-from-ca
    kind: identity
    where: 'notes eqs. (4.1.37), (4.1.42), for real α: c_b = (iħ t0/α) dc_a/dt = −i sin(r t), i.e. the imaginary part −sin(r t) equals (ħ t0/α) dc_a/dt with r = α/(ħ t0)'
    formula: deriv('cos(rr*s)', 's', tt, 1)/rr
    equals: -sin(rr*tt)
    samples: {rr: [0.5, 2.0], tt: [0.3, 1.1]}
    tolerance: 1e-6
    shown: ['c_b(t) = -i\,\frac{\alpha^*}{|\alpha|}\,\sin\left(\frac{|\alpha|\,t}{\hbar\,t_0}\right)']
    source: {cite: reading5, at: 'eqs. (4.1.41), (4.1.42)'}
    origin: mit

  - id: regulator-independence
    kind: identity
    where: 'notes eqs. (4.1.43), (4.1.44): at t = t0 the argument |α| t0/(ħ t0) = |α|/ħ, whatever t0 is'
    formula: cos(aa*t0/(hb*t0))
    equals: cos(aa/hb)
    samples: {aa: [0.4, 1.3], hb: [1.0, 0.7], t0: [1e-3, 2.0]}
    tolerance: 1e-12
    shown: ['at values that, happily, do not depend on $t_0$']
    source: {cite: reading5, at: 'eqs. (4.1.43), (4.1.44)'}
    origin: mit

  - id: probabilities-sum
    kind: identity
    where: 'notes eq. (4.1.49): p_a + p_b = cos²(|α|/ħ) + sin²(|α|/ħ) = 1'
    formula: cos(x)**2 + sin(x)**2
    equals: 1
    samples: {x: [0.2, 1.7]}
    tolerance: 1e-12
    shown: ['They add up to 1, as they must']
    source: {cite: reading5, at: 'eq. (4.1.49)'}
    origin: mit

  - id: first-order-limit
    kind: identity
    where: 'notes p. 80: for small |α|/ħ, sin²(|α|/ħ) ≈ (|α|/ħ)²; the ratio tends to 1 (checked at x = 1e-4)'
    formula: sin(x)**2/x**2
    equals: 1
    samples: {x: [1e-4, -1e-4]}
    tolerance: 1e-7
    shown: ['starting with $p_b \approx |\alpha|^2/\hbar^2$']
    source: {cite: reading5, at: 'p. 80'}
    origin: mit

  - id: omega-ab
    where: 'example (a): ω_ab = (E_a − E_b)/ħ in 1/s'
    inputs: {}
    formula: 2.0/6.582e-16
    expected: '3.04e15'
    shown: ['\approx 3.04 \times 10^{15}$ per second']
    source: {cite: reading5, at: 'eq. (4.1.24)'}
    origin: page-own

  - id: omega-t0
    where: 'example (a): ω_ab t0, the largest phase reached during the pulse'
    inputs: {}
    formula: 2.0/6.582e-16*1.0e-17
    expected: '0.030'
    shown: ['so $\omega_{ab}t_0 \approx 0.030$', 'stay within 0.03 radians of zero']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: one-over-omega
    where: 'example (a): 1/ω_ab in femtoseconds'
    inputs: {}
    formula: 6.582e-16/2.0*1e15
    expected: '0.33'
    shown: ['$1/\omega_{ab} \approx 0.33$ fs']
    source: {cite: reading5, at: 'eq. (4.1.24)'}
    origin: page-own

  - id: pb-pi6
    where: 'example (b): p_b = sin²(π/6)'
    inputs: {}
    formula: sin(pi/6)**2
    expected: '0.25'
    shown: ['$p_b = \sin^2(\pi/6) = 0.25$']
    source: {cite: reading5, at: 'eq. (4.1.49)'}
    origin: page-own

  - id: pa-pi6
    where: 'example (b): p_a = cos²(π/6)'
    inputs: {}
    formula: cos(pi/6)**2
    expected: '0.75'
    shown: ['$p_a = 0.75$']
    source: {cite: reading5, at: 'eq. (4.1.49)'}
    origin: page-own

  - id: first-order-pi6
    where: 'example (b): first-order estimate (π/6)²'
    inputs: {}
    formula: (pi/6)**2
    expected: '0.274'
    shown: ['$|\alpha|^2/\hbar^2 = (\pi/6)^2 \approx 0.274$']
    source: {cite: reading5, at: 'p. 80'}
    origin: page-own

  - id: first-order-error
    where: 'example (b): relative excess of the first-order estimate, in per cent'
    inputs: {}
    formula: ((pi/6)**2/sin(pi/6)**2 - 1)*100
    expected: '10'
    shown: ['is about 10% too high']
    source: {cite: reading5, at: 'p. 80'}
    origin: page-own

  - id: pulse-matrix-element
    where: 'example (b): |α|/t0 = (π/6) ħ/t0 in eV'
    inputs: {}
    formula: pi/6*6.582e-16/1.0e-17
    expected: '34'
    shown: ['(\pi/6)\,\hbar/t_0 \approx 34$ eV']
    source: {cite: reading5, at: 'eq. (4.1.37)'}
    origin: page-own

  - id: pb-pi2
    where: 'example (c): p_b = sin²(π/2)'
    inputs: {}
    formula: sin(pi/2)**2
    expected: '1'
    shown: ['$p_b = \sin^2(\pi/2) = 1$']
    source: {cite: reading5, at: 'eq. (4.1.49)'}
    origin: page-own

  - id: first-order-pi2
    where: 'example (c): first-order estimate (π/2)²'
    inputs: {}
    formula: (pi/2)**2
    expected: '2.47'
    shown: ['$(\pi/2)^2 \approx 2.47$']
    source: {cite: reading5, at: 'p. 80'}
    origin: page-own
