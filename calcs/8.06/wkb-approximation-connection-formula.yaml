# Calculations on content/year-3/8.06/wkb-approximation-connection-formula.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 7 transcripts and notes chapter 3 (sections 3.2-3.3), with the page's
# own worked example: a particle on a hard floor with V = Fx (the neutron in gravity: m = 1.675e-27 kg, g = 9.80665 m/s^2,
# hbar = 1.054571817e-34 J s, 1 eV = 1.602176634e-19 J). Airy zeros from DLMF 9.9.

page: content/year-3/8.06/wkb-approximation-connection-formula.mdx
calcs:
  - id: turning-point-derivative
    kind: identity
    where: 'eq. (3.2.36) with λ = ħ/p: d/dx [ħ/√(2mg(a − x))] = (ħ/√(2mg))·1/(2(a − x)^(3/2))'
    formula: deriv('hb/sqrt(2*mm*gg*(aa - x))', 'x', x0)
    equals: hb/sqrt(2*mm*gg)/(2*(aa - x0)**1.5)
    samples: {hb: [1.0, 0.5], mm: [1.0, 2.0], gg: [0.7, 1.3], aa: [3.0, 5.0], x0: [0.5, 2.0]}
    tolerance: 1e-6
    shown: ['\left|\frac{d\lambda}{dx}\right| = \frac{\hbar}{\sqrt{2mg}}\,\frac{1}{2\,(a - x)^{3/2}}']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: floor-integral
    kind: identity
    where: 'example (a): ∫₀^(E/F) √(2m(E − Fx)) dx = (2/3)√(2m) E^(3/2)/F'
    formula: integrate('sqrt(2*mm*(ee - ff*x))', 'x', 0, ee/ff)
    equals: 2/3*sqrt(2*mm)*ee**1.5/ff
    samples: {mm: [1.0, 2.0], ee: [1.0, 3.0], ff: [0.5, 2.0]}
    tolerance: 1e-4
    shown: ['= \frac23\sqrt{2m}\,E^{3/2}/(\hbar F)$']
    source: {cite: reading5, at: 'eq. (3.3.7)'}
    origin: page-own

  - id: floor-energies
    kind: identity
    where: 'example (a): (2/3)√(2m) E^(3/2)/(ħF) = (n + ¾)π gives E = ε [(3π/2)(n + ¾)]^(2/3), ε = (ħ²F²/2m)^(1/3); check by substituting back'
    formula: 2/3*sqrt(2*mm)*((hb**2*ff**2/(2*mm))**(1/3)*(1.5*pi*(nn + 0.75))**(2/3))**1.5/(hb*ff)
    equals: (nn + 0.75)*pi
    samples: {mm: [1.0, 2.0], hb: [1.0, 0.3], ff: [0.5, 2.0], nn: [0, 3]}
    tolerance: 1e-10
    shown: ['$E_n = \varepsilon\left[\frac{3\pi}{2}\left(n + \frac34\right)\right]^{2/3}$']
    source: {cite: reading5, at: 'eq. (3.3.6)'}
    origin: page-own

  - id: wkb-0
    where: 'example (b): [(3π/2)(¾)]^(2/3)'
    inputs: {}
    formula: (1.5*pi*0.75)**(2/3)
    expected: '2.3203'
    shown: ['is 2.3203, 4.0818 and 5.5172']
    source: {cite: reading5, at: 'eq. (3.3.6)'}
    origin: page-own

  - id: wkb-1
    where: 'example (b): [(3π/2)(7/4)]^(2/3)'
    inputs: {}
    formula: (1.5*pi*1.75)**(2/3)
    expected: '4.0818'
    shown: ['is 2.3203, 4.0818 and 5.5172']
    source: {cite: reading5, at: 'eq. (3.3.6)'}
    origin: page-own

  - id: wkb-2
    where: 'example (b): [(3π/2)(11/4)]^(2/3)'
    inputs: {}
    formula: (1.5*pi*2.75)**(2/3)
    expected: '5.5172'
    shown: ['is 2.3203, 4.0818 and 5.5172']
    source: {cite: reading5, at: 'eq. (3.3.6)'}
    origin: page-own

  - id: airy-zeros
    kind: fact
    where: 'example (b): magnitudes of the first zeros of Ai, 2.33811, 4.08795, 5.52056 (DLMF 9.9); rounded on the page to 2.3381, 4.0879, 5.5206'
    value: '2.33811'
    shown: ['$z_n = 2.33811, 4.08795, 5.52056$', 'against the exact 2.3381, 4.0879 and 5.5206']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own

  - id: error-0
    where: 'example (b): (2.33811 − 2.32033)/2.33811 in per cent'
    inputs: {}
    formula: (2.338107410 - (1.5*pi*0.75)**(2/3))/2.338107410*100
    expected: '0.76'
    shown: ['errors of 0.76%, 0.15% and 0.06%']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own

  - id: error-1
    where: 'example (b): second level, per cent'
    inputs: {}
    formula: (4.087949444 - (1.5*pi*1.75)**(2/3))/4.087949444*100
    expected: '0.15'
    shown: ['errors of 0.76%, 0.15% and 0.06%']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own

  - id: error-2
    where: 'example (b): third level, per cent'
    inputs: {}
    formula: (5.520559828 - (1.5*pi*2.75)**(2/3))/5.520559828*100
    expected: '0.06'
    shown: ['errors of 0.76%, 0.15% and 0.06%']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own

  - id: neutron-scale-joule
    where: 'example (c): ε = (ħ² m g²/2)^(1/3) for a neutron, in J'
    inputs: {}
    formula: (1.054571817e-34**2*1.675e-27*9.80665**2/2)**(1/3)
    expected: '9.64e-32'
    shown: ['\approx 9.64 \times 10^{-32}$ J']
    source: {cite: codata, at: 'neutron mass'}
    origin: page-own

  - id: neutron-scale-peV
    where: 'example (c): ε in pico-electronvolts'
    inputs: {}
    formula: (1.054571817e-34**2*1.675e-27*9.80665**2/2)**(1/3)/1.602176634e-19*1e12
    expected: '0.602'
    shown: ['J $\approx 0.602$ peV']
    source: {cite: codata, at: 'neutron mass'}
    origin: page-own

  - id: neutron-ground-exact
    where: 'example (c): 2.33811 ε in peV'
    inputs: {}
    formula: 2.338107410*(1.054571817e-34**2*1.675e-27*9.80665**2/2)**(1/3)/1.602176634e-19*1e12
    expected: '1.41'
    shown: ['\approx 1.41$ peV']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own

  - id: neutron-ground-wkb
    where: 'example (c): WKB 2.3203 ε in peV'
    inputs: {}
    formula: (1.5*pi*0.75)**(2/3)*(1.054571817e-34**2*1.675e-27*9.80665**2/2)**(1/3)/1.602176634e-19*1e12
    expected: '1.40'
    shown: ['(WKB: 1.40 peV)']
    source: {cite: reading5, at: 'eq. (3.3.6)'}
    origin: page-own

  - id: neutron-height-exact
    where: 'example (c): turning point E0/(mg) in micrometres (exact energy)'
    inputs: {}
    formula: 2.338107410*(1.054571817e-34**2*1.675e-27*9.80665**2/2)**(1/3)/(1.675e-27*9.80665)*1e6
    expected: '13.7'
    shown: ['\approx 13.7$ micrometres']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own

  - id: neutron-height-wkb
    where: 'example (c): turning point with the WKB energy, in micrometres'
    inputs: {}
    formula: (1.5*pi*0.75)**(2/3)*(1.054571817e-34**2*1.675e-27*9.80665**2/2)**(1/3)/(1.675e-27*9.80665)*1e6
    expected: '13.6'
    shown: ['(WKB: 13.6 μm)']
    source: {cite: reading5, at: 'eq. (3.3.6)'}
    origin: page-own

  - id: neutron-mass
    kind: fact
    where: 'example (c): neutron mass'
    value: '1.675e-27'
    shown: ['$m = 1.675 \times 10^{-27}$ kg']
    source: {cite: codata, at: 'neutron mass'}
    origin: page-own

  - id: within-one-percent
    where: 'summary: largest error 0.76% < 1%'
    inputs: {}
    formula: (2.338107410 - (1.5*pi*0.75)**(2/3))/2.338107410*100
    expected: '0.76'
    shown: ['accurate to better than 1% even for the ground state']
    source: {cite: dlmf, at: 'zeros of Ai'}
    origin: page-own
