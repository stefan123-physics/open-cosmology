# Calculations on content/year-3/8.06/8-06-problem-set-4.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 differentiates a real WKB wavefunction numerically for a chosen p(x) (the page works with symbols);
# Problem 2 evaluates the Airy integral on a turned path, finds its zeros with a root finder and tests Airy's equation
# on it; Problem 3 solves the quantization condition with a numerical integral and a root finder (the page uses the
# closed form); Problem 4 does the same for the quartic potential and reads the power and the offset off the solved
# energies; Problem 5 finds the phase for which the two forms of the wavefunction agree with a root finder, tests the
# splitting on two harmonic wells and does the integrals of the straight-line well numerically; Problem 6 compares the
# perturbative splitting with the exact eigenvalues for two, three and four hops.

page: content/year-3/8.06/8-06-problem-set-4.mdx
calcs:
  # ---- Given data

  - id: given-mit
    kind: fact
    where: 'Problems 2, 3 and 4, statements: numbers printed on MIT''s sheet'
    shown: ['MIT gives a number to test your integral with: $\text{Ai}(1) = 0.135292$', 'mass 1 gram from rest from a height of 1 metre', '$e_0 = 0.667986$, $e_1 = 2.39364$, $e_2 = 4.69680$, $e_3 = 7.33573$, $e_4 = 10.2443$ and $e_5 = 13.3793$', '\approx 0.874019" cite="mit" at="Problem 4(c), p. 4" />']
    source: {cite: mit, at: 'Problem 2(b), p. 2; Problem 3(c), p. 3; Problem 4, pp. 3 and 4'}
    origin: mit

  - id: given-codata
    kind: fact
    where: 'Problem 3(b), statement: CODATA 2018 values, rounded (1.67492749804e-27 kg, 1.054571817e-34 J s, 1.602176634e-19 J), our addition'
    shown: ['$m_n = 1.67493\times 10^{-27}$ kg, $\hbar = 1.054572\times 10^{-34}$ J s and $1\ \text{eV} = 1.602177\times 10^{-19}$ J']
    source: {cite: codata, at: 'neutron mass, reduced Planck constant, electron volt'}
    origin: later-data

  - id: given-g
    kind: fact
    where: 'Problem 3(b), statement: the acceleration of gravity used on this page, our choice (MIT gives none)'
    shown: ['Take $g = 9.81\ \text{m/s}^2$ and']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own addition)'}
    origin: page-own

  - id: given-zeros
    kind: fact
    where: 'Problem 2(c), solution: the first two zeros of Ai from NIST''s table (recomputed below in p2-e1 and p2-e2)'
    shown: ['$z_1 = 2.33811$ and $z_2 = 4.08795$']
    source: {cite: dlmf, at: 'Table 9.9.1'}
    origin: later-data

  # ---- Problem 1: the equation that the WKB wavefunction obeys

  # Independent route: take p(x) = 1 + x²/2, whose integral is x + x³/6, and the real WKB solution
  # ψ = p^(-1/2) cos((x + x³/6)/ħ). Its second derivative is taken numerically; −ħ²ψ''/ψ − p² must equal X.
  # The samples give p, p' = x and p'' = 1 at each x.
  - id: p1-x
    kind: identity
    answer: p1-x
    where: 'Problem 1(a), answer box: −ħ²ψ″/ψ − p² for the real WKB solution with p = 1 + x²/2, second derivative taken numerically'
    formula: |-
      hbar**2*(p2/(2*p) - 3*p1**2/(4*p**2))
    equals: |-
      -hbar**2*deriv('(1 + y**2/2)**(-0.5)*cos((y + y**3/6)/hbar)', 'y', x, 2)/((1 + x**2/2)**(-0.5)*cos((x + x**3/6)/hbar)) - (1 + x**2/2)**2
    samples:
      x: [0.3, 0.7, 1.1, 1.6, 2.0]
      hbar: [1, 0.8, 1.2, 0.9, 1.5]
      p: [1.045, 1.245, 1.605, 2.28, 3.0]
      p1: [0.3, 0.7, 1.1, 1.6, 2.0]
      p2: [1, 1, 1, 1, 1]
    tolerance: 1e-5
    shown: ['id="p1-x"', '<Formula label="Exact equation for the WKB solution"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  # The same test function; λ = 2πħ/p, λ' = −2πħp'/p² and λ'' = −2πħp''/p² + 4πħp'²/p³ are given as numbers.
  - id: p1-ratio
    kind: identity
    answer: p1-ratio
    where: 'Problem 1(b), answer box: −ħ²ψ″/(p²ψ) − 1 for the real WKB solution with p = 1 + x²/2, against the formula in λ, λ′, λ″'
    formula: |-
      (l1**2 - 2*lam*l2)/(16*pi**2)
    equals: |-
      -hbar**2*deriv('(1 + y**2/2)**(-0.5)*cos((y + y**3/6)/hbar)', 'y', x, 2)/((1 + x**2/2)**(-0.5)*cos((x + x**3/6)/hbar))/(1 + x**2/2)**2 - 1
    samples:
      x: [0.3, 0.7, 1.1, 1.6, 2.0]
      hbar: [1, 0.8, 1.2, 0.9, 1.5]
      lam: [6.012617518832, 4.037388149192, 4.697708640882, 2.480204726518, 3.14159265359]
      l1: [-1.726110292488, -2.27001743328, -3.219613398735, -1.740494544925, -2.094395102393]
      l2: [-4.76263286444, -0.6902520020876, 1.486255972795, 1.35499027072, 1.745329251994]
    tolerance: 1e-5
    shown: ['id="p1-ratio"', '<Formula label="The extra terms in units of p squared"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-steady
    where: 'Problem 1(b), check: 1/(16π²), the ratio X/p² for a wavelength that grows at the steady rate c = 1'
    formula: 1/(16*pi**2)
    expected: '0.0063'
    shown: ['$1/(16\pi^2) = 0.0063$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-158
    where: 'Problem 1(b), check: 16π²'
    formula: 16*pi**2
    expected: '158'
    shown: ['$16\pi^2 \approx 158$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # ψ = (2mgs)^(-1/4) cos((2/3) sqrt(2mg) s^(3/2)/ħ) is the real WKB solution for p² = 2mgs.
  - id: p1-lin
    kind: identity
    answer: p1-lin
    where: 'Problem 1(c), answer box: −ħ²ψ″/(p²ψ) − 1 for the real WKB solution of the linear potential, second derivative taken numerically'
    formula: |-
      -5*hbar**2/(32*m*g*s**3)
    equals: |-
      -hbar**2*deriv('(2*m*g*y)**(-0.25)*cos((2/3)*sqrt(2*m*g)*y**1.5/hbar)', 'y', s, 2)/((2*m*g*s)**(-0.25)*cos((2/3)*sqrt(2*m*g)*s**1.5/hbar))/(2*m*g*s) - 1
    samples:
      hbar: [1, 0.8, 1.2, 0.9, 1.5]
      m: [1, 0.5, 2, 1.5, 0.7]
      g: [1, 2, 0.5, 1.3, 0.8]
      s: [1, 0.8, 1.5, 0.6, 2]
    tolerance: 1e-5
    shown: ['id="p1-lin"', '<Formula label="Extra terms near a turning point"']
    source: {cite: mit, at: 'Problem 1 (our own addition and solution)'}
    origin: page-own

  - id: p1-dist
    answer: p1-dist
    where: 'Problem 1(c), answer box: the distance s/L at which (5/16)(L/s)³ = 0.01, found with a root finder'
    formula: solve('5/(16*y**3) - 0.01', 'y', 1, 10)
    expected: '3.15'
    shown: ['id="p1-dist"', '$s/L = 31.25^{1/3} = 3.15$']
    source: {cite: mit, at: 'Problem 1 (our own addition and solution)'}
    origin: page-own

  # ---- Problem 2: Airy functions

  # The scaled equation must come out as ψ'' = uψ: (gx − E) divided by the number in front of ψ'', ħ²/(2mL²).
  # L is given as a number for each sample: L = (ħ²/2mg)^(1/3).
  - id: p2-u
    kind: identity
    answer: p2-u
    where: 'Problem 2(a), answer box: (gx − E) over the coefficient ħ²/(2mL²) of the second derivative, with L = (ħ²/2mg)^(1/3) as numbers'
    formula: |-
      x/L - E/(g*L)
    equals: |-
      (g*x - E)/(hbar**2/(2*m*L**2))
    samples:
      hbar: [1, 1, 1, 2, 2]
      m: [0.5, 0.5, 0.5, 0.5, 2]
      g: [1, 8, 0.125, 4, 8]
      L: [1, 0.5, 2, 1, 0.5]
      x: [0.5, 1.2, 2, 0.8, 1.5]
      E: [2, 0.5, 1, 1.5, 0.7]
    tolerance: 1e-12
    shown: ['id="p2-u"', '<Formula label="The pure-number coordinate"']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-arg
    kind: identity
    answer: p2-arg
    where: 'Problem 2(b), answer box: the phase of ψ̃, the numerical integral of k² from 0 to k, plus the phase ku of the inverse transform'
    formula: |-
      k**3/3 + k*u
    equals: |-
      integrate('q**2', 'q', 0, k) + k*u
    samples:
      k: [0.5, 1, 1.5, 2, 0.8]
      u: [2, 1.5, 1, 0.5, -1.2]
    tolerance: 1e-9
    shown: ['id="p2-arg"', '<Formula label="Integral for the Airy function"']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # The function built from the phase k³/3 + ku must solve ψ'' = uψ (this is what the choice box p2-ode leads to):
  # tested on the turned path, where the integral converges.
  - id: p2-airy-equation
    kind: identity
    where: 'Problem 2(b), choice box and check: the second derivative of the integral on the turned path equals u times the integral'
    formula: |-
      deriv('integrate("exp(-t**3/3 - v*t/2)*cos(sqrt(3)*v*t/2 + pi/6)", "t", 0, 12)/pi', 'v', u0, 2)
    equals: |-
      u0*integrate('exp(-t**3/3 - u0*t/2)*cos(sqrt(3)*u0*t/2 + pi/6)', 't', 0, 12)/pi
    samples:
      u0: [1.5, 0.5, -1.0]
    tolerance: 1e-5
    shown: ['id="p2-ode"', 'the second derivative of this integral at $u = 1.5$ equals 1.5 times the integral']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution and addition)'}
    origin: page-own

  - id: p2-ai1
    where: 'Problem 2(b), check: Ai(1) from the integral on the turned path'
    formula: integrate('exp(-t**3/3 - t/2)*cos(sqrt(3)*t/2 + pi/6)', 't', 0, 12)/pi
    expected: '0.135292'
    shown: ['For $u = 1$ it gives 0.135292']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own addition)'}
    origin: page-own

  - id: p2-e1
    answer: p2-e1
    where: 'Problem 2(c), answer box: minus the first zero of the Airy integral on the turned path, found with a root finder'
    formula: -solve('integrate("exp(-t**3/3 - v*t/2)*cos(sqrt(3)*v*t/2 + pi/6)", "t", 0, 12)', 'v', -3, -2)
    expected: '2.338'
    shown: ['id="p2-e1"', '\qquad E = 2.338\left(']
    source: {cite: dlmf, at: 'Table 9.9.1'}
    origin: page-own

  - id: p2-e2
    answer: p2-e2
    where: 'Problem 2(c), answer box: minus the second zero of the Airy integral on the turned path, found with a root finder'
    formula: -solve('integrate("exp(-t**3/3 - v*t/2)*cos(sqrt(3)*v*t/2 + pi/6)", "t", 0, 12)', 'v', -4.5, -3.5)
    expected: '4.088'
    shown: ['id="p2-e2"', '\qquad E = 4.088\left(']
    source: {cite: dlmf, at: 'Table 9.9.1'}
    origin: page-own

  - id: p2-wkb-0
    where: 'Problem 2(c), check: the WKB number for n = 0'
    formula: (1.5*pi*0.75)**(2/3)
    expected: '2.320'
    shown: ['= 2.320$ and $4.082$ for $n = 0$ and 1']
    source: {cite: reading1, at: 'notes eq. (3.3.6)'}
    origin: page-own

  - id: p2-wkb-1
    where: 'Problem 2(c), check: the WKB number for n = 1'
    formula: (1.5*pi*1.75)**(2/3)
    expected: '4.082'
    shown: ['= 2.320$ and $4.082$ for $n = 0$ and 1']
    source: {cite: reading1, at: 'notes eq. (3.3.6)'}
    origin: page-own

  - id: p2-wkb-err-0
    where: 'Problem 2(c), check: how far the WKB number lies below the first zero, in per cent'
    formula: 100*(2.33811 - (1.5*pi*0.75)**(2/3))/2.33811
    expected: '0.8'
    shown: ['within 0.8% and 0.15% of the exact ones']
    source: {cite: reading1, at: 'notes eq. (3.3.6)'}
    origin: page-own

  - id: p2-wkb-err-1
    where: 'Problem 2(c), check: how far the WKB number lies below the second zero, in per cent'
    formula: 100*(4.08795 - (1.5*pi*1.75)**(2/3))/4.08795
    expected: '0.15'
    shown: ['within 0.8% and 0.15% of the exact ones']
    source: {cite: reading1, at: 'notes eq. (3.3.6)'}
    origin: page-own

  # ---- Problem 3: the bouncing ball

  # The quantization condition solved numerically: the phase integral by quadrature, the energy by a root finder.
  - id: p3-en
    kind: identity
    answer: p3-en
    where: 'Problem 3(a), answer box: the energy at which the numerically integrated phase equals (n + 3/4)π'
    formula: |-
      (9*pi**2*m*g**2*hbar**2*(n + 3/4)**2/8)**(1/3)
    equals: |-
      solve('integrate("sqrt(2*m*abs(En - m*g*y))", "y", 0, En/(m*g))/hbar - (n + 0.75)*pi', 'En', 0.01, 200)
    samples:
      m: [1, 0.5, 2, 1.5, 0.7]
      g: [1, 2, 0.5, 1.3, 0.8]
      hbar: [1, 0.8, 1.2, 0.9, 1.5]
      n: [0, 1, 2, 3, 5]
    tolerance: 1e-8
    shown: ['id="p3-en"', '<Formula label="Semiclassical energies of the bouncing ball"']
    source: {cite: reading1, at: 'notes eq. (3.3.6)'}
    origin: page-own

  - id: p3-scale-j
    where: 'Problem 3(b), solution: the energy scale (ħ² m_n g²/2)^(1/3) in joules'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: (hbar**2*mn*g**2/2)**(1/3)
    expected: '9.642e-32 J'
    shown: ['= 9.642\times 10^{-32}\ \text{J} = 6.018\times 10^{-13}\ \text{eV}"']
    source: {cite: codata, at: 'neutron mass, reduced Planck constant'}
    origin: page-own

  - id: p3-scale-ev
    where: 'Problem 3(b), solution: the energy scale in electron volts'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: (hbar**2*mn*g**2/2)**(1/3)
    expected: '6.018e-13 eV'
    shown: ['= 9.642\times 10^{-32}\ \text{J} = 6.018\times 10^{-13}\ \text{eV}"']
    source: {cite: codata, at: 'neutron mass, reduced Planck constant, electron volt'}
    origin: page-own

  - id: p3-front
    where: 'Problem 3(b), solution: the number in front for n = 0, from the quantization condition solved numerically in scaled units'
    formula: solve('integrate("sqrt(abs(z - y))", "y", 0, z) - 0.75*pi', 'z', 1, 4)
    expected: '2.3203'
    shown: ['\cdot\frac34\right]^{2/3} = 2.3203$']
    source: {cite: reading1, at: 'notes eq. (3.3.6)'}
    origin: page-own

  - id: p3-e0-shown
    where: 'Problem 3(b), solution: the semiclassical zero-point energy of the neutron'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: (1.5*pi*0.75)**(2/3)*(hbar**2*mn*g**2/2)**(1/3)
    expected: '1.396e-12 eV'
    shown: ['= 1.396\times 10^{-12}\ \text{eV}"']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-e0
    answer: p3-e0
    where: 'Problem 3(b), answer box: the zero-point energy in units of 1e-12 eV, with the number in front from the numerically solved quantization condition'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: 1e12*solve('integrate("sqrt(abs(z - y))", "y", 0, z) - 0.75*pi', 'z', 1, 4)*(hbar**2*mn*g**2/2)**(1/3)
    expected: '1.40 eV'
    shown: ['id="p3-e0"']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-height
    answer: p3-height
    where: 'Problem 3(b), answer box (our addition): the height E0/(m_n g) of the turning point in micrometres'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: solve('integrate("sqrt(abs(z - y))", "y", 0, z) - 0.75*pi', 'z', 1, 4)*(hbar**2*mn*g**2/2)**(1/3)/(mn*g)
    expected: '13.6 um'
    shown: ['id="p3-height"', '$E_0/(m_ng) = 13.6$ micrometres']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own addition)'}
    origin: page-own

  - id: p3-exact-ev
    where: 'Problem 3(b), check: the exact ground state energy, with the first zero of the Airy function'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: 2.33811*(hbar**2*mn*g**2/2)**(1/3)
    expected: '1.407e-12 eV'
    shown: ['$1.407\times 10^{-12}$ eV and a height of 13.7 micrometres']
    source: {cite: dlmf, at: 'Table 9.9.1'}
    origin: page-own

  - id: p3-exact-height
    where: 'Problem 3(b), check: the exact height of the turning point'
    inputs: {mn: '1.67492749804e-27 kg', g: '9.81 m/s**2'}
    formula: 2.33811*(hbar**2*mn*g**2/2)**(1/3)/(mn*g)
    expected: '13.7 um'
    shown: ['$1.407\times 10^{-12}$ eV and a height of 13.7 micrometres']
    source: {cite: dlmf, at: 'Table 9.9.1'}
    origin: page-own

  - id: p3-low
    where: 'Problem 3(b), check: the semiclassical estimate is 0.8% low'
    formula: 100*(2.33811 - (1.5*pi*0.75)**(2/3))/2.33811
    expected: '0.8'
    shown: ['the semiclassical estimate is 0.8% low']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-energy
    where: 'Problem 3(c), solution: the classical energy mgh of the ball'
    inputs: {m: '1e-3 kg', g: '9.81 m/s**2', h: '1 m'}
    formula: m*g*h
    expected: '9.81e-3 J'
    shown: ['= 9.81\times 10^{-3}$ J']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-speed
    where: 'Problem 3(c), solution: the speed of the ball at the floor'
    inputs: {g: '9.81 m/s**2', h: '1 m'}
    formula: sqrt(2*g*h)
    expected: '4.429 m/s'
    shown: ['$\sqrt{2gh} = 4.429$ m/s']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own solution)'}
    origin: page-own

  # Independent of the closed form: the phase integral over the height by quadrature, in SI numbers.
  - id: p3-n
    answer: p3-n
    where: 'Problem 3(c), answer box: the phase integral over the height (numerical), divided by πħ, in units of 1e30'
    formula: integrate('sqrt(2*0.001*0.001*9.81*(1 - y))', 'y', 0, 1)/(1.054571817e-34*pi)/1e30
    expected: '8.91'
    shown: ['id="p3-n"', '\times 1.054572\times 10^{-34}} = 8.91\times 10^{30}"']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-spacing
    where: 'Problem 3(c), check: the level spacing (2/3)E/n'
    formula: (2/3)*9.81e-3/(integrate('sqrt(2*0.001*0.001*9.81*(1 - y))', 'y', 0, 1)/(1.054571817e-34*pi))
    expected: '7.34e-34'
    shown: ['$dE/dn = \frac23E/n = 7.34\times 10^{-34}$ J']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own addition)'}
    origin: page-own

  - id: p3-period
    where: 'Problem 3(c), check: the classical time of one bounce, 2 sqrt(2h/g)'
    inputs: {g: '9.81 m/s**2', h: '1 m'}
    formula: 2*sqrt(2*h/g)
    expected: '0.903 s'
    shown: ['$2\sqrt{2h/g} = 0.903$ s']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own addition)'}
    origin: page-own

  - id: p3-h-over-t
    where: 'Problem 3(c), check: Planck''s constant 2πħ over the time of one bounce'
    inputs: {g: '9.81 m/s**2', h: '1 m'}
    formula: 2*pi*hbar/(2*sqrt(2*h/g))
    expected: '7.34e-34 J'
    shown: ['Planck''s constant divided by it is $7.34\times 10^{-34}$ J as well']
    source: {cite: mit, at: 'Problem 3(c), p. 3 (our own addition)'}
    origin: page-own

  # ---- Problem 4: the quartic potential

  - id: p4-e
    kind: identity
    answer: p4-e
    where: 'Problem 4(a), answer box: the work done against the force 4αx³ from 0 to x0, integrated numerically'
    formula: |-
      alpha*x0**4
    equals: |-
      integrate('4*alpha*y**3', 'y', 0, x0)
    samples:
      alpha: [0.5, 1, 1.5, 2, 0.8]
      x0: [2, 1.5, 1, 0.5, 1.2]
    tolerance: 1e-9
    shown: ['id="p4-e"', '<Formula label="Energy and turning point"']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-integral
    where: 'Problem 4(c): MIT''s integral, done numerically'
    formula: integrate('sqrt(1 - t**4)', 't', 0, 1)
    expected: '0.874019'
    shown: ['\qquad I = 0.874019"']
    source: {cite: mit, at: 'Problem 4(c), p. 4'}
    origin: mit

  # Γ(1/4) = 4 ∫ exp(−s⁴) ds and Γ(7/4) = 4 ∫ s⁶ exp(−s⁴) ds (substitution t = s⁴ in the gamma integral).
  - id: p4-gamma
    where: 'Problem 4(c): MIT''s closed form sqrt(π) Γ(1/4)/(8 Γ(7/4)), with the gamma functions as numerical integrals'
