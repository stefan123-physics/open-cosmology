    origin: page-own

  # ---- Problem 5: the double well (our own problem)

  # With c = χ − π/4, part (a) reads cos(θ − π/2 − c). The two forms of the wavefunction in region (ii) are
  # proportional when their ratio is the same at two angles c1 and c2: the θ at which that happens is found with a
  # root finder, and its tangent must be 2e^φ (even) or −2e^φ (odd).
  - id: p5-ii
    kind: identity
    where: 'Problem 5(a), choice box: the phase ∫ from x to x2 of k, with k = 1 + y on [x1, x2] = [0.5, 2], against θ − χ, each integrated numerically'
    formula: |-
      integrate('1 + y', 'y', x, 2)
    equals: |-
      integrate('1 + y', 'y', 0.5, 2) - integrate('1 + y', 'y', 0.5, x)
    samples:
      x: [0.6, 0.9, 1.2, 1.5, 1.9]
    tolerance: 1e-9
    shown: ['id="p5-ii"', '<Formula label="Region (ii), seen from region (i)"']
    source: {cite: reading1, at: 'notes eq. (3.3.1)'}
    origin: page-own

  - id: p5-even
    kind: identity
    answer: p5-even
    where: 'Problem 5(b), answer box: the tangent of the phase θ at which the two forms of the even wavefunction have the same ratio at two angles'
    formula: |-
      2*exp(phi)
    equals: |-
      tan(solve('(exp(phi/2)*cos(c1) - 0.5*exp(-phi/2)*sin(c1))*cos(th - pi/2 - c2) - (exp(phi/2)*cos(c2) - 0.5*exp(-phi/2)*sin(c2))*cos(th - pi/2 - c1)', 'th', 0.1, 1.5707))
    samples:
      phi: [0.5, 1, 1.5, 2, 3]
      c1: [0.3, 0.2, 1.0, 0.7, 0.4]
      c2: [1.1, 2.0, 2.5, 1.9, 1.3]
    tolerance: 1e-7
    shown: ['id="p5-even"', '<Formula label="Quantization condition of the double well"']
    source: {cite: reading1, at: 'notes eqs. (3.4.44) to (3.4.46)'}
    origin: page-own

  - id: p5-odd
    kind: identity
    where: 'Problem 5(b), choice box: the same for the odd wavefunction, where the growing exponential has a minus sign'
    formula: |-
      -2*exp(phi)
    equals: |-
      tan(solve('(exp(phi/2)*cos(c1) + 0.5*exp(-phi/2)*sin(c1))*cos(th - pi/2 - c2) - (exp(phi/2)*cos(c2) + 0.5*exp(-phi/2)*sin(c2))*cos(th - pi/2 - c1)', 'th', 1.5709, 3.0))
    samples:
      phi: [0.5, 1, 1.5, 2, 3]
      c1: [0.3, 0.2, 1.0, 0.7, 0.4]
      c2: [1.1, 2.0, 2.5, 1.9, 1.3]
    tolerance: 1e-7
