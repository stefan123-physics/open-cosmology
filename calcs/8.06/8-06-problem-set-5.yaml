  - id: p4-slow
    kind: limit
    where: 'Problem 4(b), choice box: for τ → ∞ the probability goes to zero, faster than 1/τ⁴ (compared as 1 + τ⁴ × probability → 1)'
    inputs: {'Vn0': 0.4, 'w': 1.7, 'hbar': 1.1}
    formula: |-
      1 + 0*tau
    limit: |-
      1 + tau**4*Vn0**2*exp(-w**2*tau**2)/hbar**2
    vary: {tau: [2, 3, 4, 6]}
    tolerance: 1e-09
    shown: ['id="p4-slow"', '<Formula label="The limit of a slow pulse"']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own solution)'}
