      (y1**2 + y2**2 + y3**2)/(2*m)
    equals: |-
      ((y1/sqrt(6) + y2/sqrt(2) + y3/sqrt(3))**2 + (-2*y1/sqrt(6) + y3/sqrt(3))**2 + (y1/sqrt(6) - y2/sqrt(2) + y3/sqrt(3))**2)/(2*m)
