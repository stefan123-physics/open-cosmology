# Calculations on content/year-3/8.06/8-06-problem-set-5.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates the kinetic energy of the well's wavefunction and the decay constant through the barrier
# numerically; Problem 2 integrates the pulse numerically, sums the series of the exact evolution and compares with
# Rabi's exact formula; Problem 3 takes the frequencies from the unperturbed energies and compares the emission
# probability with the exact two-state result; Problem 4 integrates the Gaussian pulse numerically; Problem 5 evaluates
# the original potential and dipole moment at positions built from the normal modes, uses Newton's law for single
# atoms, and integrates the oscillator's ground state.
# Constants (CODATA 2018): hbar = 1.054571817e-34 J s, m_e = 9.1093837015e-31 kg, e = 1.602176634e-19 C.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.06/8-06-problem-set-5.mdx
calcs:
  # ---- How to answer: constants

  - id: intro-constants
    kind: fact
    where: 'How to answer: CODATA 2018 values, rounded (hbar = 1.054571817e-34 J s, m_e = 9.1093837015e-31 kg, e = 1.602176634e-19 C)'
    shown: ['$\hbar = 1.054572 \times 10^{-34}$ J s, the electron mass $m = 9.109384 \times 10^{-31}$ kg and the elementary charge $e = 1.602177 \times 10^{-19}$ C']
    source: {cite: codata, at: 'reduced Planck constant, electron mass, elementary charge'}
    origin: later-data

  # ---- Problem 1: square well in a field. W = V0 − E1; exponent = (2/hbar) ∫ sqrt(2m(W − eℰx)) dx

  - id: p1-given
    kind: fact
    where: 'Problem 1(e), statement: MITs numbers'
    shown: ['$V_0 = 20$ eV, $d = 2 \times 10^{-8}$ cm and a field of $7 \times 10^4$ V/cm']
    source: {cite: mit, at: 'Problem 1(e), p. 2'}
    origin: mit

  - id: p1-age-given
    kind: fact
    where: 'Problem 1(e), statement: the age of the universe, the site''s standard figure (calcs/values.yaml: Planck 2013, rounded); MIT names no value'
    shown: ['Compare the lifetime with the age of the universe, 13.8 billion years.']
    source: {ref: 'Planck 2013 results, rounded: the standard figure of this site (calcs/values.yaml, id age)'}
    origin: later-data

  - id: p1-e1
    kind: identity
    answer: p1-e1
    where: 'Problem 1(a), answer box: the kinetic energy (hbar²/2m) ∫ψ′² / ∫ψ² of the wavefunction cos(πx/d) that vanishes at the walls, by numerical integration'
    formula: |-
      pi**2*hbar**2/(2*m*d**2)
    equals: |-
      hbar**2/(2*m)*integrate('(pi/d*sin(pi*x/d))**2', 'x', -d/2, d/2)/integrate('cos(pi*x/d)**2', 'x', -d/2, d/2)
    samples:
      hbar: [0.5, 1, 2, 1.3]
      m: [2, 1, 0.5, 0.8]
      d: [0.5, 1, 2, 1.7]
    tolerance: 1e-09
    shown: ['id="p1-e1"', '<Formula label="Estimate of the ground state energy above the bottom of the well"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-e1-wall
    kind: identity
    where: 'Problem 1(a): the Schrödinger equation −(hbar²/2m)ψ″ = E1 ψ for ψ = cos(πx/d), checked by a numerical second derivative at a point inside the well'
    formula: |-
      pi**2*hbar**2/(2*m*d**2)*cos(pi*xs/d)
    equals: |-
      -hbar**2/(2*m)*deriv('cos(pi*x/d)', 'x', xs, 2)
    samples:
      hbar: [0.5, 1, 2]
      m: [2, 1, 0.5]
      d: [0.5, 1, 2]
      xs: [0.1, -0.2, 0.6]
    tolerance: 1e-06
    shown: ['The ground state is $\cos(\pi x/d)$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-plot
    where: 'Problem 1(b), graph: with the slope 0.1 V0 per d the line −0.1 x crosses the level −0.5 at x = 5 (in units of d)'
    inputs: {}
    formula: |-
      0.5/0.1
    expected: '5'
    shown: ['The level crosses the falling line at x = 5 d']
    source: {cite: mit, at: 'Problem 1(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-lnt
    kind: identity
    answer: p1-lnt
    where: 'Problem 1(c), answer box: twice the numerical integral of κ = sqrt(2m(W − eℰx))/hbar from the middle of the well to the outer turning point W/(eℰ)'
    formula: |-
      4*sqrt(2*m)*W**(3/2)/(3*hbar*e*Ef)
    equals: |-
      2/hbar*integrate('sqrt(2*m*abs(W - e*Ef*x))', 'x', 0, W/(e*Ef))
    samples:
      m: [0.5, 1, 2, 1.3]
      W: [1, 2, 3, 1.5]
      hbar: [2, 1, 0.5, 0.8]
      e: [0.5, 1, 2, 1.2]
      Ef: [0.1, 0.2, 0.4, 0.3]
    tolerance: 1e-07
    shown: ['id="p1-lnt"', '<Formula label="Barrier penetration factor"']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-lnt-full
    kind: identity
    where: 'Problem 1(c): the exponent before the simplification, against the numerical integral from the wall at d/2 to W/(eℰ)'
    formula: |-
      4*sqrt(2*m)*(W - e*Ef*d/2)**(3/2)/(3*hbar*e*Ef)
    equals: |-
      2/hbar*integrate('sqrt(2*m*abs(W - e*Ef*x))', 'x', d/2, W/(e*Ef))
    samples:
      m: [0.5, 1, 2, 1.3]
      W: [1, 2, 3, 1.5]
      hbar: [2, 1, 0.5, 0.8]
      e: [0.5, 1, 2, 1.2]
      Ef: [0.1, 0.2, 0.4, 0.3]
      d: [0.5, 1, 0.7, 0.9]
    tolerance: 1e-07
    shown: ['<Formula label="The exponent before the simplification"']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-lnt-drop
    kind: limit
    where: 'Problem 1(c): what the simplification drops: simplified minus full exponent → d sqrt(2mW)/hbar as the field goes to zero'
    inputs: {'m': 1.3, 'W': 1.5, 'hbar': 0.8, 'e': 1.2, 'd': 0.9}
    formula: |-
      d*sqrt(2*m*W)/hbar
    limit: |-
      4*sqrt(2*m)*W**(3/2)/(3*hbar*e*Ef) - 4*sqrt(2*m)*(W - e*Ef*d/2)**(3/2)/(3*hbar*e*Ef)
    vary: {Ef: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.001
    shown: ['changes $-\ln T$ by $-d\sqrt{2mW}/\hbar$']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-rect
    kind: identity
    where: 'Problem 1(c), check: the exponent is 2/3 of that of a rectangular barrier of height W and width W/(eℰ)'
    formula: |-
      4*sqrt(2*m)*W**(3/2)/(3*hbar*e*Ef)
    equals: |-
      (2/3)*2*sqrt(2*m*W)*(W/(e*Ef))/hbar
    samples:
      m: [0.5, 1, 2]
      W: [1, 2, 3]
      hbar: [2, 1, 0.5]
      e: [0.5, 1, 2]
      Ef: [0.1, 0.2, 0.4]
    tolerance: 1e-12
    shown: ['The exponent is $\frac23$ of the value']
    source: {cite: mit, at: 'Problem 1(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-dt
    kind: identity
    answer: p1-dt
    where: 'Problem 1(d), answer box: the notes Δt = 2m ∫ dx/p(x) across the well, with the constant momentum p = sqrt(2m E1), by numerical integration'
    formula: |-
      2*m*d**2/(pi*hbar)
    equals: |-
      2*m*integrate('1/sqrt(2*m*pi**2*hbar**2/(2*m*d**2)) + 0*x', 'x', -d/2, d/2)
    samples:
      hbar: [0.5, 1, 2, 1.3]
      m: [2, 1, 0.5, 0.8]
      d: [0.5, 1, 2, 1.7]
    tolerance: 1e-09
    shown: ['id="p1-dt"', '<Formula label="Time between two hits on the right wall"']
    source: {cite: reading1, at: 'eq. (3.5.26), with a constant speed inside the well'}
    origin: page-own

  - id: p1-dt-period
    kind: identity
    where: 'Problem 1(d), check: Δt = π hbar/E1'
    formula: |-
      2*m*d**2/(pi*hbar)
    equals: |-
      pi*hbar/(pi**2*hbar**2/(2*m*d**2))
    samples:
      hbar: [0.5, 1, 2]
      m: [2, 1, 0.5]
      d: [0.5, 1, 2]
    tolerance: 1e-12
    shown: ['$\Delta t = \pi\hbar/E_1$']
    source: {cite: mit, at: 'Problem 1(d), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-speed
    kind: identity
    where: 'Problem 1(d): the speed sqrt(2 E1/m) = π hbar/(m d)'
    formula: |-
      pi*hbar/(m*d)
    equals: |-
      sqrt(2*(pi**2*hbar**2/(2*m*d**2))/m)
    samples:
      hbar: [0.5, 1, 2]
      m: [2, 1, 0.5]
      d: [0.5, 1, 2]
    tolerance: 1e-12
    shown: ['$v = \sqrt{2E_1/m} = \pi\hbar/(md)$']
    source: {cite: mit, at: 'Problem 1(d), p. 2 (our own solution)'}
    origin: page-own

  - id: p1-e1ev
