  # ---- Problem 5: three masses, two springs. Positions from mode displacements: x = R y

  - id: p5-l1
    kind: identity
    answer: p5-l1
    where: 'Problem 5(a), answer box and choice box: the potential energy of the normalized mode (1, −2, 1)/√6, evaluated from the two springs'
    formula: |-
