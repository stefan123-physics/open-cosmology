      y1: [0.5, 1, 2, -0.7]
      y2: [2, 1, 0.5, 1.3]
      y3: [0.3, -1.2, 2.2, 0.9]
    tolerance: 1e-10
    shown: ['id="p5-t"', '<Formula label="The kinetic energy in normal mode momenta"']
    source: {cite: mit, at: 'Problem 5(c), p. 4 (our own solution)'}
    origin: page-own

