  - id: p1-ratio
    where: 'Problem 1(e) and its choice box: log10 of lifetime over age of the universe (our addition)'
    inputs: {'hb': '1.054571817e-34 J*s', 'me': '9.1093837015e-31 kg', 'dd': '2e-10 m', 'V0': '20 eV', 'ee': '1 e', 'F': '7e6 V/m', 'age': '13.8e9 yr'}
