  # ---- Problem 2: two states at +E and −E coupled by v(t)

  - id: p2-pulse
    kind: identity
    answer: p2-pulse
    where: 'Problem 2(a), answer box: (v0/hbar)² |∫ e^(2iEt/hbar) dt|² over the pulse, real and imaginary parts integrated numerically'
    formula: |-
      v0**2*sin(E*t0/hbar)**2/E**2
    equals: |-
      v0**2/hbar**2*(integrate('cos(2*E*x/hbar)', 'x', 0, t0)**2 + integrate('sin(2*E*x/hbar)', 'x', 0, t0)**2)
    samples:
      v0: [0.05, 0.1, 0.3, 0.2]
      E: [0.5, 1, 2, 1.4]
      t0: [2, 1, 0.5, 1.7]
      hbar: [0.5, 1, 2, 1.2]
    tolerance: 1e-08
    shown: ['id="p2-pulse"', '<Formula label="Transition probability for the square test pulse"']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own test pulse and solution)'}
    origin: page-own

  - id: p2-pulse-rabi
    kind: limit
    where: 'Problem 2(a), check: the exact (Rabi) probability for the square pulse goes over into the first-order result for small v0'
    inputs: {'E': 1.3, 't0': 0.9, 'hbar': 1.0}
    formula: |-
      v0**2*sin(E*t0/hbar)**2/E**2
    limit: |-
      v0**2/(E**2 + v0**2)*sin(sqrt(E**2 + v0**2)*t0/hbar)**2
    vary: {v0: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.001
    shown: ['\frac{v_0^2}{E^2 + v_0^2}\sin^2']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own test pulse and solution)'}
    origin: page-own

  - id: p2-const
    kind: identity
    where: 'Problem 2(a): the lesson''s constant-perturbation formula with V_fi = v0 and E_f − E_i = 2E'
    formula: |-
      v0**2*sin(E*t0/hbar)**2/E**2
    equals: |-
      4*v0**2*sin((2*E/hbar)*t0/2)**2/(2*E)**2
    samples:
      v0: [0.05, 0.1, 0.3]
      E: [0.5, 1, 2]
      t0: [2, 1, 0.5]
      hbar: [0.5, 1, 2]
    tolerance: 1e-12
    shown: ['with $V_{fi} = v_0$ and $E_f - E_i = 2E$']
    source: {cite: reading2, at: 'eq. (4.3.20)'}
    origin: page-own

  - id: p2-exact
    kind: identity
    answer: p2-exact
    where: 'Problem 2(b), answer box: the series of exp(−iθσx) between the two states, summed term by term (odd powers of θ up to the 13th), squared'
    formula: |-
      sin(th)**2
    equals: |-
      (th - th**3/6 + th**5/120 - th**7/5040 + th**9/362880 - th**11/39916800 + th**13/6227020800)**2
    samples:
      th: [0.3, 0.8, 1.2, 1.6, 2.0]
    tolerance: 1e-06
    shown: ['id="p2-exact"', '<Formula label="Exact transition amplitude and probability for E = 0"']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-exact-rabi
    kind: limit
    where: 'Problem 2(b), check: Rabi''s formula for the square pulse goes to sin²(v0 t0/hbar) when E goes to zero'
    inputs: {'v0': 0.7, 't0': 1.9, 'hbar': 1.1}
    formula: |-
      sin(v0*t0/hbar)**2 + 0*E
    limit: |-
      v0**2/(E**2 + v0**2)*sin(sqrt(E**2 + v0**2)*t0/hbar)**2
    vary: {E: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.001
    shown: ['becomes $\sin^2(v_0t_0/\hbar)$']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-pert
    kind: limit
    answer: p2-pert
    where: 'Problem 2(b), answer box: the first term of the exact sin²θ for small θ'
    formula: |-
      th**2
    limit: |-
      sin(th)**2
    vary: {th: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.001
    shown: ['id="p2-pert"', '<Formula label="First-order transition probability for E = 0"']
    source: {cite: reading2, at: 'eq. (4.2.22), with E = 0 and the integral over all times'}
    origin: page-own

  - id: p2-series
    kind: limit
    where: 'Problem 2(b): the next term of sin²θ is −θ⁴/3; also the choice box (first order is good for small θ)'
    inputs: {}
    formula: |-
      1/3 + 0*th
    limit: |-
      (th**2 - sin(th)**2)/th**4
    vary: {th: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.001
    shown: ['id="p2-cond"', 'Since $\sin^2\theta = \theta^2 - \frac13\theta^4 + \dots$']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3: atom and one mode of the field; unperturbed energies ±hbar wa/2 + hbar wp (n + 1/2)

  - id: p3-w1
    kind: identity
    answer: p3-w1
    where: 'Problem 3(a), answer box: (energy of |e, n−1⟩ − energy of |g, n⟩)/hbar from H0'
    formula: |-
      wa - wp
    equals: |-
      ((hbar*wa/2 + hbar*wp*(n - 1 + 1/2)) - (-hbar*wa/2 + hbar*wp*(n + 1/2)))/hbar
    samples:
      wa: [2, 2.5, 3]
      wp: [0.5, 1, 1.5]
      n: [1, 4, 7]
      hbar: [0.5, 1, 2]
    tolerance: 1e-12
    shown: ['id="p3-w1"']
    source: {cite: mit, at: 'Problem 3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-w2
    kind: identity
    answer: p3-w2
    where: 'Problem 3(a), answer box: (energy of |e, n+1⟩ − energy of |g, n⟩)/hbar from H0'
    formula: |-
      wa + wp
    equals: |-
      ((hbar*wa/2 + hbar*wp*(n + 1 + 1/2)) - (-hbar*wa/2 + hbar*wp*(n + 1/2)))/hbar
    samples:
      wa: [2, 2.5, 3]
      wp: [0.5, 1, 1.5]
      n: [1, 4, 7]
      hbar: [0.5, 1, 2]
    tolerance: 1e-12
    shown: ['id="p3-w2"', '<Formula label="The atom-photon interaction in the interaction picture"']
    source: {cite: mit, at: 'Problem 3(a), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-size
    kind: identity
    answer: p3-size
    where: 'Problem 3(b), answer box: |∫₀ᵗ e^(2iωt′) dt′| from the numerically integrated real and imaginary parts'
    formula: |-
      abs(sin(w*t))/w
    equals: |-
      sqrt(integrate('cos(2*w*x)', 'x', 0, t)**2 + integrate('sin(2*w*x)', 'x', 0, t)**2)
    samples:
      w: [1, 1.1, 1.2, 0.7, 2.3]
      t: [3.2, 4, 5, 1.1, 0.9]
    tolerance: 1e-07
    shown: ['id="p3-size"', '<Formula label="Size of the coefficient of the fast terms"']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-keep
    kind: identity
    where: 'Problem 3(b), choice box: the terms that keep the unperturbed energy at resonance are σ₊â and σ₋â† (frequency wa − wp = 0), the others have 2ω'
    formula: |-
      2*w
    equals: |-
      ((hbar*w/2 + hbar*w*(n + 1 + 1/2)) - (-hbar*w/2 + hbar*w*(n + 1/2)))/hbar + ((hbar*w/2 + hbar*w*(n - 1 + 1/2)) - (-hbar*w/2 + hbar*w*(n + 1/2)))/hbar
    samples:
      w: [1, 2.5, 0.3]
      n: [1, 4, 7]
      hbar: [0.5, 1, 2]
    tolerance: 1e-12
    shown: ['id="p3-keep"', '<Formula label="The integrated interaction at resonance"']
    source: {cite: mit, at: 'Problem 3(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p3-emit
    kind: limit
    answer: p3-emit
    where: 'Problem 3(b), answer box: the first term of the exact probability sin²(α sqrt(n+1) t/hbar) of the two-state system |e, n⟩, |g, n+1⟩'
    inputs: {'n': 3, 't': 1.1, 'hbar': 0.9}
    formula: |-
      al**2*(n + 1)*t**2/hbar**2
    limit: |-
      sin(al*sqrt(n + 1)*t/hbar)**2
    vary: {al: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.001
    shown: ['id="p3-emit"', 'The exact probability is then $\sin^2\left(\alpha\sqrt{n+1}\,t/\hbar\right)$']
    source: {cite: reading2, at: 'eq. (4.2.12), with the two terms that remain (our own addition)'}
    origin: page-own

  - id: p3-absorb
    kind: limit
    where: 'Problem 3(b): the absorption probability, first term of sin²(α sqrt(n) t/hbar)'
    inputs: {'n': 3, 't': 1.1, 'hbar': 0.9}
    formula: |-
      al**2*n*t**2/hbar**2
    limit: |-
      sin(al*sqrt(n)*t/hbar)**2
    vary: {al: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.001
    shown: ['<Formula label="First-order emission and absorption probabilities"']
    source: {cite: reading2, at: 'eq. (4.2.12), with the two terms that remain (our own addition)'}
    origin: page-own

  # ---- Problem 4: Gaussian pulse

  - id: p4-p
    kind: identity
    answer: p4-p
    where: 'Problem 4(a), answer box: (|V_n0|/hbar)² times the square of the numerically integrated Fourier transform of the pulse (the cosine part; the sine part vanishes by symmetry)'
    formula: |-
      Vn0**2*exp(-w**2*tau**2)/hbar**2
    equals: |-
      (Vn0/hbar*integrate('exp(-x**2/(2*tau**2))/sqrt(2*pi*tau**2)*cos(w*x)', 'x', -12*tau, 12*tau))**2
    samples:
      Vn0: [0.5, 1, 2, 1.3]
      w: [0.5, 1, 1.5, 0.8]
      tau: [1.5, 1, 0.5, 1.2]
      hbar: [2, 1, 0.5, 0.7]
    tolerance: 1e-07
    shown: ['id="p4-p"', '<Formula label="Transition probability for the Gaussian pulse"']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own solution)'}
    origin: page-own

  - id: p4-amp
    kind: identity
    where: 'Problem 4(a): the amplitude factor exp(−ω²τ²/2), by numerical integration'
    formula: |-
      exp(-w**2*tau**2/2)
    equals: |-
      integrate('exp(-x**2/(2*tau**2))/sqrt(2*pi*tau**2)*cos(w*x)', 'x', -12*tau, 12*tau)
    samples:
      w: [0.5, 1, 1.5, 0.8]
      tau: [1.5, 1, 0.5, 1.2]
    tolerance: 1e-07
    shown: ['<Formula label="First-order amplitude for the Gaussian pulse"']
    source: {cite: reading2, at: 'eq. (4.2.33), with the integral over all times'}
    origin: page-own

  - id: p4-norm
    kind: identity
    where: 'Problem 4(a): the pulse has area 1 for every τ'
    formula: |-
      1 + 0*tau
    equals: |-
      integrate('exp(-x**2/(2*tau**2))/sqrt(2*pi*tau**2)', 'x', -12*tau, 12*tau)
    samples:
      tau: [0.2, 1, 3.5]
    tolerance: 1e-08
    shown: ['Without the phase it is 1.']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own solution)'}
    origin: page-own

  - id: p4-fast
    kind: limit
    where: 'Problem 4(b), choice box: for τ → 0 the probability goes to |V_n0|²/hbar²'
