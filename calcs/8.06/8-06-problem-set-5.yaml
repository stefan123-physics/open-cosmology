      Vn0**2/hbar**2 + 0*tau
    limit: |-
      Vn0**2*exp(-w**2*tau**2)/hbar**2
    vary: {tau: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 0.001
    shown: ['id="p4-fast"', '<Formula label="The limit of a sudden kick"']
    source: {cite: mit, at: 'Problem 4, p. 3 (our own solution)'}
