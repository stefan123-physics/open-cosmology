  - id: p1-expo-numint
    where: 'Problem 1(e): the same exponent by numerical integration of κ through the barrier, in units of the outer turning point (independent of the closed form)'
    inputs: {'hb': '1.054571817e-34 J*s', 'me': '9.1093837015e-31 kg', 'dd': '2e-10 m', 'V0': '20 eV', 'ee': '1 e', 'F': '7e6 V/m'}
