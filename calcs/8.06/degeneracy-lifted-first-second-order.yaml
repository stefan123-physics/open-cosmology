# Calculations on content/year-3/8.06/degeneracy-lifted-first-second-order.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 3 transcripts and notes chapter 1 (section 1.2), with the page's own
# worked example: a degenerate pair (energy 0) coupled to a third state (Δ = 1 eV) by 0.03 eV and 0.04 eV.

page: content/year-3/8.06/degeneracy-lifted-first-second-order.mdx
calcs:
  - id: commutator-rule
    kind: identity
    where: 'eq. (1.2.29): ⟨p|[δH, K]|q⟩ = (κ_q − κ_p)⟨p|δH|q⟩ for K diagonal with entries κ (2×2 check of the (1,2) entry: (δH K − K δH)_12 = d12 κ2 − κ1 d12)'
    formula: d12*k2 - k1*d12
    equals: (k2 - k1)*d12
    samples: {d12: [0.3, 1.7], k1: [0.5, 2.0], k2: [-1.0, 3.0]}
    tolerance: 1e-12
    shown: ['= (\kappa_q - \kappa_p)\,\langle n^{(0)};p|\,\delta H\,|n^{(0)};q\rangle']
    source: {cite: reading5, at: 'eq. (1.2.29)'}
    origin: mit

  - id: second-order-vs-exact
    kind: identity
    where: 'eq. (1.2.37) checked on a 2-state case: level 0 coupled by v to a level at e > 0; exact lower eigenvalue (e − √(e² + 4v²))/2 = −v²/e + O(v⁴), so the difference from −v²/e is of order v⁴ (checked as ≈ 0 for v ≪ e)'
    formula: (e - sqrt(e**2 + 4*v**2))/2 + v**2/e
    equals: 0*v
    samples: {e: [1.0, 2.0], v: [0.001, 0.002]}
    tolerance: 1e-10
    shown: ['E_{n,k}^{(2)} = -\sum_p \frac{|\delta H_{p,nk}|^2}{E_p^{(0)} - E_n^{(0)}}']
    source: {cite: reading5, at: 'eq. (1.2.37)'}
    origin: mit

  - id: M11
    where: 'example (b): λ²M⁽²⁾_11 = −(0.03)²/1 eV'
    inputs: {g1: 0.03, D: 1.0}
    formula: -g1**2/D
    expected: '-0.0009'
    tolerance: 1e-12
    shown: ['$-(0.03)^2 = -0.0009$']
    source: {cite: reading5, at: 'eq. (1.2.60)'}
    origin: page-own

  - id: M12
    where: 'example (b): λ²M⁽²⁾_12 = −(0.03)(0.04)/1 eV'
    inputs: {g1: 0.03, g2: 0.04, D: 1.0}
    formula: -g1*g2/D
    expected: '-0.0012'
    tolerance: 1e-12
    shown: ['$-(0.03)(0.04) = -0.0012$']
    source: {cite: reading5, at: 'eq. (1.2.60)'}
    origin: page-own

  - id: M22
    where: 'example (b): λ²M⁽²⁾_22 = −(0.04)²/1 eV'
    inputs: {g2: 0.04, D: 1.0}
    formula: -g2**2/D
    expected: '-0.0016'
    tolerance: 1e-12
    shown: ['$-(0.04)^2 = -0.0016$']
    source: {cite: reading5, at: 'eq. (1.2.60)'}
    origin: page-own

  - id: eig-lower
    where: 'example (b) and quiz 4: the nonzero eigenvalue of −(1/Δ)[[g1², g1g2], [g1g2, g2²]] is −(g1² + g2²)/Δ (the other is 0, since the matrix has rank 1)'
    inputs: {g1: 0.03, g2: 0.04, D: 1.0}
    formula: -(g1**2 + g2**2)/D
    expected: '-0.0025'
    tolerance: 1e-12
    shown: ['Its eigenvalues are $0$ and $-0.0025$ eV', 'which moves down by 2.5 meV', '0 and −2.5 meV']
    source: {cite: reading5, at: 'eqs. (1.2.61), (1.2.62)'}
    origin: page-own

  - id: eig-zero
    where: 'example (b): the determinant of the 2×2 matrix vanishes, so 0 is an eigenvalue'
    inputs: {g1: 0.03, g2: 0.04}
    formula: g1**2*g2**2 - (g1*g2)**2
    expected: '0'
    tolerance: 1e-15
    shown: ['Its eigenvalues are $0$']
    source: {cite: reading5, at: 'eqs. (1.2.61), (1.2.62)'}
    origin: page-own

  - id: dark-combination
    where: 'example (b): the combination (4, −3)/5 does not couple to |3⟩: 0.03 × 4 − 0.04 × 3 = 0'
    inputs: {g1: 0.03, g2: 0.04}
    formula: g1*4 - g2*3
    expected: '0'
    tolerance: 1e-12
    shown: ['$0.03 \times 4 - 0.04 \times 3 = 0$']
    source: {cite: reading5, at: 'eq. (1.2.60)'}
    origin: page-own

  - id: bright-coupling
    where: 'example (b): the combination (3, 4)/5 couples with 0.03 × 0.6 + 0.04 × 0.8 = 0.05 eV = √(g1² + g2²)'
    inputs: {g1: 0.03, g2: 0.04}
    formula: g1*0.6 + g2*0.8
    expected: '0.05'
    tolerance: 1e-12
    shown: ['$0.03 \times 0.6 + 0.04 \times 0.8 = 0.05$ eV', 'off-diagonal element 0.05 eV']
    source: {cite: reading5, at: 'eq. (1.2.53)'}
    origin: page-own

  - id: bright-eigenvector
    where: 'example (b): (3, 4)/5 is an eigenvector of [[−0.0009, −0.0012], [−0.0012, −0.0016]] with eigenvalue −0.0025 (first component: −0.0009·0.6 − 0.0012·0.8 = −0.0025·0.6)'
    inputs: {}
    formula: (-0.0009*0.6 - 0.0012*0.8) - (-0.0025*0.6)
    expected: '0'
    tolerance: 1e-12
    shown: ['normalized eigenvectors $(4, -3)/5$ and $(3, 4)/5$']
    source: {cite: reading5, at: 'eq. (1.2.62)'}
    origin: page-own

  - id: admixture
    where: 'example (b): first-order admixture of |3⟩ in the coupled state, −0.05 eV / 1 eV (eq. (1.2.54))'
    inputs: {c: 0.05, D: 1.0}
    formula: -c/D
    expected: '-0.05'
    tolerance: 1e-12
    shown: ['admixture of about $-0.05\,|3\rangle$']
    source: {cite: reading5, at: 'eq. (1.2.54)'}
    origin: page-own

  - id: exact-lower
    where: 'example (c): lower eigenvalue of [[0, 0.05], [0.05, 1]] = (1 − √(1 + 4 × 0.0025))/2 eV'
    inputs: {}
    formula: (1 - sqrt(1 + 4*0.0025))/2
    expected: '-0.00249'
    shown: ['$\frac12\left(1 - \sqrt{1 + 4 \times 0.0025}\right)$ eV $\approx -0.00249$ eV']
    source: {cite: reading5, at: 'eq. (1.2.62)'}
    origin: page-own

  - id: agreement
    where: 'example (c): second order −0.0025 vs exact −0.0024938: relative difference about 0.25%'
    inputs: {}
    formula: (0.0025/((sqrt(1 + 4*0.0025) - 1)/2) - 1)*100
    expected: '0.25'
    shown: ['agreement to about 0.25%']
    source: {cite: reading5, at: 'eq. (1.2.62)'}
    origin: page-own

  - id: coupling-ratio
    where: 'example (c): gap / coupling = 1 / 0.05 = 20'
    inputs: {}
    formula: 1/0.05
    expected: '20'
    tolerance: 1e-12
    shown: ['a coupling twenty times smaller than the gap']
    source: {cite: reading5, at: 'eq. (1.2.62)'}
    origin: page-own

  - id: quiz-wrong-diagonals
    where: 'quiz 4 distractor: the diagonal entries alone, −0.9 meV and −1.6 meV (not the eigenvalues)'
    inputs: {}
    formula: -(0.03**2)*1000
    expected: '-0.9'
    tolerance: 1e-9
    shown: ['−0.9 meV and −1.6 meV']
    source: {cite: reading5, at: 'eq. (1.2.60)'}
    origin: page-own
