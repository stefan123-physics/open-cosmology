# Calculations on content/year-3/8.06/8-06-problem-set-6.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates the oscillator's wavefunctions numerically and compares the rate with Larmor's classical formula;
# Problem 2 differentiates the count of box states numerically and integrates the Fourier integral over the well
# numerically; Problem 3 solves the balance of the two levels numerically without Planck's formula and differentiates
# ln Z numerically; Problems 4 and 5 (our own) integrate the hydrogen wavefunctions numerically, in units of the Bohr
# radius, check that they are normalized, and rebuild the rates from Einstein's A.
# Constants (CODATA 2018): alpha = 7.2973525693e-3, m_e c² = 510998.95 eV, hbar = 6.582119569e-16 eV s,
# h = 6.62607015e-34 J s, k_B = 1.380649e-23 J/K, c = 299792458 m/s, m_p/m_e = 1836.15267343.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.06/8-06-problem-set-6.mdx
calcs:
  # ---- How to answer: constants

  - id: intro-constants
    kind: fact
    where: 'How to answer: CODATA 2018 values, rounded (alpha = 7.2973525693e-3, m_e c² = 0.51099895 MeV, hbar = 6.582119569e-16 eV s, h = 6.62607015e-34 J s, k_B = 1.380649e-23 J/K, c = 299792458 m/s)'
    shown: ['$\alpha = 1/137.036$, the electron''s rest energy $mc^2 = 510{,}999$ eV, $\hbar = 6.582120 \times 10^{-16}$ eV s, $h = 6.62607 \times 10^{-34}$ J s, $k_B = 1.380649 \times 10^{-23}$ J/K and $c = 2.997925 \times 10^{8}$ m/s']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s, Planck constant, Boltzmann constant, speed of light'}
    origin: later-data

  - id: intro-inverse-alpha
    where: 'How to answer: 1/alpha'
    inputs: {'al': 0.0072973525693}
    formula: |-
      1/al
    expected: '137.036'
    shown: ['The units are Gaussian, as in the lectures']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: intro-rydberg
    where: 'How to answer: the Rydberg energy alpha² m c²/2'
    inputs: {'al': 0.0072973525693, 'mc2': '510998.95 eV', 'hb': '6.582119569e-16 eV*s'}
    formula: |-
      al**2*mc2/2
    expected: '13.6057 eV'
    shown: ['= 13.6057$ eV and']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: intro-hc
    where: 'How to answer: h c in eV nm'
    inputs: {'hP': '6.62607015e-34 J*s', 'cc': '299792458 m/s'}
    formula: |-
      hP*cc
    expected: '1239.84 eV*nm'
    shown: ['$hc = 1239.84$ eV nm']
    source: {cite: codata, at: 'Planck constant, speed of light'}
    origin: page-own

  # ---- Problem 1: charged three-dimensional oscillator. <0|x|1> = sqrt(hbar/(2 m w)); A = (4/3) w³ |d|²/(hbar c³)

  - id: p1-given
    kind: fact
    where: 'Problem 1(b), statement: MITs value of the Rydberg energy and of the photon energy'
    shown: ['$R_y = 13.6$ eV is the Rydberg energy']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: mit

  - id: p1-d2
    kind: identity
    answer: p1-d2
    where: 'Problem 1(a), answer box: q² times the square of the integral of the oscillator ground state times x times the first excited state, by numerical integration'
    formula: |-
      q**2*hbar/(2*m*w)
    equals: |-
      q**2*integrate('sqrt(m*w/(pi*hbar))*sqrt(2*m*w/hbar)*x**2*exp(-m*w*x**2/hbar)', 'x', -12, 12)**2
    samples:
      q: [0.5, 1, 2, 1.3]
      hbar: [1, 1.2, 0.8, 1.5]
      m: [1, 0.8, 1.2, 1.5]
      w: [1, 1.3, 0.9, 0.7]
    tolerance: 1e-08
    shown: ['id="p1-d2"', '<Formula label="Dipole matrix element of the oscillator state with m = 0"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-dir
    kind: identity
    where: 'Problem 1(a), choice box: for m = ±1 the squared length is (|x element|² + |y element|²)/2, with both elements equal to the integral above; the same as for m = 0'
    formula: |-
      q**2*hbar/(2*m*w)
    equals: |-
      q**2*(integrate('sqrt(m*w/(pi*hbar))*sqrt(2*m*w/hbar)*x**2*exp(-m*w*x**2/hbar)', 'x', -12, 12)**2 + integrate('sqrt(m*w/(pi*hbar))*sqrt(2*m*w/hbar)*x**2*exp(-m*w*x**2/hbar)', 'x', -12, 12)**2)/2
    samples:
      q: [0.5, 1, 2, 1.3]
      hbar: [1, 1.2, 0.8, 1.5]
      m: [1, 0.8, 1.2, 1.5]
      w: [1, 1.3, 0.9, 0.7]
    tolerance: 1e-08
    shown: ['id="p1-dir"', '<Formula label="Dipole matrix elements of the oscillator states with m = ±1"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-gamma
    kind: identity
    answer: p1-gamma
    where: 'Problem 1(a), answer box: Einsteins A with omega_ba = w and the numerically integrated matrix element'
    formula: |-
      2*q**2*w**2/(3*m*c**3)
    equals: |-
      4/3*w**3/(hbar*c**3)*q**2*integrate('sqrt(m*w/(pi*hbar))*sqrt(2*m*w/hbar)*x**2*exp(-m*w*x**2/hbar)', 'x', -12, 12)**2
    samples:
      q: [0.5, 1, 2, 1.3]
      hbar: [1, 1.2, 0.8, 1.5]
      m: [1, 0.8, 1.2, 1.5]
      w: [1, 1.3, 0.9, 0.7]
      c: [1, 2, 0.5, 1.4]
    tolerance: 1e-08
    shown: ['id="p1-gamma"', '<Formula label="Spontaneous decay rate of the 2p level of the oscillator"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-larmor
    kind: identity
    where: 'Problem 1(a), check: Larmor power 2q²<a²>/(3c³) with <a²> = w⁴X²/2, divided by the energy m w² X²/2'
    formula: |-
      2*q**2*w**2/(3*m*c**3)
    equals: |-
      (2*q**2*(w**4*X**2/2)/(3*c**3))/(m*w**2*X**2/2)
    samples:
      q: [0.5, 1, 2]
      m: [1, 0.8, 1.2]
      w: [1, 1.3, 0.9]
      c: [1, 2, 0.5]
      X: [0.3, 1, 2]
    tolerance: 1e-12
    shown: ['$P/E = 2q^2\omega^2/(3mc^3)$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-hw
    where: 'Problem 1(b): the photon energy, three quarters of 13.6 eV'
    inputs: {'Ry': '13.6 eV'}
    formula: |-
      0.75*Ry
    expected: '10.2 eV'
    shown: ['= 10.2$ eV, so']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: page-own

  - id: p1-omega
    where: 'Problem 1(b): the angular frequency, 10.2 eV over hbar'
    inputs: {'al': 0.0072973525693, 'mc2': '510998.95 eV', 'hb': '6.582119569e-16 eV*s', 'Ry': '13.6 eV'}
    formula: |-
      0.75*Ry/hb
    expected: '1.550e16 1/s'
    shown: ['$= 1.550 \times 10^{16}$ per second']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: p1-tau
    answer: p1-tau
    where: 'Problem 1(b), answer box: tau = 3 mc² hbar/(2 alpha (hbar w)²), in units of 1e-10 s'
    inputs: {'al': 0.0072973525693, 'mc2': '510998.95 eV', 'hb': '6.582119569e-16 eV*s', 'Ry': '13.6 eV', 'u': '1e-10 s'}
    formula: |-
      3*mc2*hb/(2*al*(0.75*Ry)**2)/u
    expected: '6.65'
    shown: ['id="p1-tau"', '= 6.65 \times 10^{-10}\ \text{s}"']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: p1-tau-4
    where: 'Problem 1(b): the same to four digits, as used in the product'
    inputs: {'al': 0.0072973525693, 'mc2': '510998.95 eV', 'hb': '6.582119569e-16 eV*s', 'Ry': '13.6 eV'}
    formula: |-
      3*mc2*hb/(2*al*(0.75*Ry)**2)
    expected: '6.645e-10 s'
    shown: ['1.550 \times 10^{16} \times 6.645 \times 10^{-10}']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: p1-rate
    where: 'Problem 1(b): the rate, one over the lifetime'
    inputs: {'al': 0.0072973525693, 'mc2': '510998.95 eV', 'hb': '6.582119569e-16 eV*s', 'Ry': '13.6 eV'}
    formula: |-
      1/(3*mc2*hb/(2*al*(0.75*Ry)**2))
    expected: '1.505e9 1/s'
    shown: ['$\Gamma = 1.505 \times 10^{9}$ per second']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: p1-wtau
    answer: p1-wtau
    where: 'Problem 1(b), answer box: omega tau in units of 1e7 (our addition)'
    inputs: {'al': 0.0072973525693, 'mc2': '510998.95 eV', 'hb': '6.582119569e-16 eV*s', 'Ry': '13.6 eV'}
    formula: |-
      0.75*Ry/hb*3*mc2*hb/(2*al*(0.75*Ry)**2)/1e7
    expected: '1.03'
    shown: ['id="p1-wtau"', '= 1.03 \times 10^{7}$']
    source: {cite: codata, at: 'fine-structure constant, electron mass energy equivalent in MeV, reduced Planck constant in eV s'}
    origin: page-own

  - id: p1-alpha3
    kind: identity
    where: 'Problem 1(b), check: with hbar w = (3/8) alpha² mc², omega tau = 3 mc²/(2 alpha hbar w) equals 4/alpha³'
    formula: |-
      4/al**3
    equals: |-
      3*mc2/(2*al*(3/8*al**2*mc2))
    samples:
      al: [0.0073, 0.1, 0.5]
      mc2: [1, 2, 5]
    tolerance: 1e-12
    shown: ['this is $4/\alpha^3$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: ionization of a one-dimensional well. I(k) = ∫ x sin(πx/a) exp(−ikx) dx from 0 to a

  - id: p2-rho
    kind: identity
    answer: p2-rho
    where: 'Problem 2(a), answer box: the derivative with respect to energy of the number of box states below E, N(E) = 2 (L/2π) sqrt(2mE)/hbar, taken numerically at E = hbar²k²/2m'
    formula: |-
      L*m/(pi*hbar**2*k)
    equals: |-
      deriv('L*sqrt(2*m*En)/(pi*hbar)', 'En', hbar**2*k**2/(2*m))
    samples:
      L: [1, 2, 0.5, 3]
      m: [1, 0.8, 1.5, 2]
      hbar: [1, 1.2, 0.7, 1.5]
      k: [1, 2, 0.6, 1.4]
    tolerance: 1e-06
    shown: ['id="p2-rho"', '<Formula label="Density of states of a free particle in one dimension, both directions"']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-i2
    kind: identity
    where: 'Problem 2(b): the exact squared modulus of I(k), against the squares of its real and imaginary parts by numerical integration'
    formula: |-
      (pi**2/(k**2 - pi**2/a**2)**2 + 4*pi**2*k*sin(k*a)/(a*(k**2 - pi**2/a**2)**3) + 16*pi**2*k**2*cos(k*a/2)**2/(a**2*(k**2 - pi**2/a**2)**4))
    equals: |-
      integrate('x*sin(pi*x/a)*cos(k*x)', 'x', 0, a)**2 + integrate('x*sin(pi*x/a)*sin(k*x)', 'x', 0, a)**2
    samples:
      a: [1, 2, 0.7, 1.5]
      k: [7.3, 5.1, 20.1, 0.9]
    tolerance: 1e-07
    shown: ['<Formula label="Squared modulus of the integral, exact"', '<Formula label="The integral over the well, exact"']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-elementary
    kind: identity
    where: 'Problem 2(b): the integral without the factor x, real part, against numerical integration'
    formula: |-
      -(pi/a)*(1 + cos(k*a))/(k**2 - pi**2/a**2)
    equals: |-
      integrate('sin(pi*x/a)*cos(k*x)', 'x', 0, a)
    samples:
      a: [1, 2, 0.7, 1.5]
      k: [7.3, 5.1, 20.1, 0.9]
    tolerance: 1e-07
    shown: ['$\int_0^a\sin(\pi x/a)\,e^{-ikx}\,dx = -(\pi/a)\left(1 + e^{-ika}\right)/\left(k^2 - \pi^2/a^2\right)$']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-m2
    kind: limit
    answer: p2-m2
    where: 'Problem 2(b), answer box: the leading form for ka ≫ 1, approached by the exact squared matrix element 2e²E0²|I|²/(aL) as k grows'
    inputs: {'e': 100.0, 'E0': 100.0, 'a': 1.0, 'L': 3.0}
    formula: |-
      2*pi**2*e**2*E0**2/(a*L*k**4)
    limit: |-
      2*e**2*E0**2/(a*L)*(pi**2/(k**2 - pi**2/a**2)**2 + 4*pi**2*k*sin(k*a)/(a*(k**2 - pi**2/a**2)**3) + 16*pi**2*k**2*cos(k*a/2)**2/(a**2*(k**2 - pi**2/a**2)**4))
    vary: {k: [10.0, 160.0, 640.0, 10240.0]}
    tolerance: 0.001
    shown: ['id="p2-m2"', '<Formula label="The squared matrix element for a fast electron"']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-w
    kind: identity
    answer: p2-w
    where: 'Problem 2(b), answer box: the golden rule 2π/hbar times the numerically differentiated count of states times the leading squared matrix element'
    formula: |-
      4*pi**2*m*e**2*E0**2/(hbar**3*a*k**5)
    equals: |-
      2*pi/hbar*deriv('L*sqrt(2*m*En)/(pi*hbar)', 'En', hbar**2*k**2/(2*m))*2*pi**2*e**2*E0**2/(a*L*k**4)
    samples:
      L: [1, 2, 0.5, 3]
      m: [1, 0.8, 1.5, 2]
      hbar: [1, 1.2, 0.7, 1.5]
      k: [1, 2, 0.6, 1.4]
      e: [1, 0.5, 2, 1.2]
      E0: [1, 2, 0.5, 0.7]
      a: [1, 0.6, 2, 1.3]
    tolerance: 1e-06
    shown: ['id="p2-w"', '<Formula label="Ionization rate of the one-dimensional well"']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-scale
    where: 'Problem 2(b), choice box: with k ∝ sqrt(omega), doubling the frequency changes k⁻⁵ by 2^(−5/2); the power of omega is −5/2'
    inputs: {}
    formula: |-
      log((sqrt(2))**(-5))/log(2)
    expected: '-2.5'
    shown: ['id="p2-scale"', 'that is as $\omega^{-5/2}$']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-corrections
    where: 'Problem 2(b): the two correction terms relative to the first are 4/(ka) and 16/(ka)² in size. At ka = 50.3 the exact squared modulus over the leading form, minus 1, is 0.017, below the bound 4/(ka) + 16/(ka)² = 0.086'
    inputs: {'a': 1.0, 'k': 50.3}
    formula: |-
      (pi**2/(k**2 - pi**2/a**2)**2 + 4*pi**2*k*sin(k*a)/(a*(k**2 - pi**2/a**2)**3) + 16*pi**2*k**2*cos(k*a/2)**2/(a**2*(k**2 - pi**2/a**2)**4))*k**4/pi**2 - 1
    expected: '0.017'
    shown: ['by a factor of order $4/(ka)$ and the third by $16/(ka)^2$']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3: spontaneous over stimulated emission. x = hbar w0/(kB T)

  - id: p3-r
    kind: identity
    answer: p3-r
    where: 'Problem 3(a), answer box: detailed balance without Plancks formula. With the Boltzmann ratio N_b/N_a = exp(−x) and equal B coefficients, N_b (A + BU) = N_a BU fixes r = A/(BU); solved numerically'
    formula: |-
      exp(hbar*w0/(kB*T)) - 1
    equals: |-
      solve('exp(-hbar*w0/(kB*T))*(rr + 1) - 1', 'rr', 0, 1e5)
    samples:
      hbar: [1, 1.2, 0.7, 1.5]
      w0: [1, 0.8, 1.5, 2]
      kB: [1, 1.5, 0.6, 1.2]
      T: [1, 2, 0.9, 1.4]
    tolerance: 1e-08
    shown: ['id="p3-r"', '<Formula label="Spontaneous over stimulated emission in black-body radiation"']
    source: {cite: reading1, at: 'p. 107, unnumbered equation'}
    origin: page-own

  - id: p3-n
    kind: identity
    answer: p3-n
    where: 'Problem 3(b), answer box: minus the derivative of ln Z with respect to x, with Z = 1/(1 − exp(−x)), taken numerically'
    formula: |-
      1/(exp(hbar*w0/(kB*T)) - 1)
    equals: |-
      -deriv('log(1/(1 - exp(-xx)))', 'xx', hbar*w0/(kB*T))
    samples:
      hbar: [1, 1.2, 0.7, 1.5]
      w0: [1, 0.8, 1.5, 2]
      kB: [1, 1.5, 0.6, 1.2]
      T: [1, 2, 0.9, 1.4]
    tolerance: 1e-06
    shown: ['id="p3-n"', '<Formula label="Mean number of photons in one mode"']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-rn
    kind: identity
    answer: p3-rn
    where: 'Problem 3(b), answer box: invert the photon number, x = ln(1 + 1/n), and put it into r = exp(x) − 1'
    formula: |-
      1/nb
    equals: |-
      exp(log(1 + 1/nb)) - 1
    samples:
      nb: [0.5, 1, 2.5, 5]
    tolerance: 1e-10
    shown: ['id="p3-rn"', '<Formula label="The ratio is one over the photon number"']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-mean
    kind: identity
    where: 'Problem 3(b), choice box and a listed mistake: the spontaneous share of all emission, r/(r + 1) with r = 1/n, is 1/(n + 1); the stimulated rate is n times the spontaneous one'
    formula: |-
      1/(nb + 1)
    equals: |-
      (1/nb)/(1/nb + 1)
    samples:
      nb: [0.5, 1, 2.5, 5]
    tolerance: 1e-12
    shown: ['id="p3-mean"']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-classical
    kind: limit
    where: 'Problem 3(b), check: the photon number approaches k_B T/(hbar w0) = 1/x at high temperature'
    inputs: {}
    formula: |-
      1/xx
    limit: |-
      1/(exp(xx) - 1)
    vary: {xx: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 0.001
    shown: ['$\bar n \rightarrow k_BT/\hbar\omega_0$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-wien
    kind: limit
    where: 'Problem 3(b), check: the photon number approaches exp(−x) at low temperature'
    inputs: {}
    formula: |-
      exp(-xx)
    limit: |-
      1/(exp(xx) - 1)
    vary: {xx: [3, 6, 10, 15]}
    tolerance: 0.001
    shown: ['$\bar n \rightarrow e^{-x}$']
    source: {cite: mit, at: 'Problem 3(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-given
    kind: fact
    where: 'Problem 3(c), statement: the maser frequency is MITs'
    shown: ['at $10^{10}$ Hz, a frequency used in masers']
    source: {cite: mit, at: 'Problem 3(c), p. 2'}
    origin: mit

  - id: p3-chosen
    kind: fact
    where: 'Problem 3(c), statement: room temperature and the visible frequency are our choices (MIT names neither)'
    shown: ['Take $T = 300$ K, and for visible light take $5 \times 10^{14}$ Hz']
    source: {cite: mit, at: 'Problem 3(c), p. 2 (values chosen by us)'}
    origin: page-own

  - id: p3-nu0
    answer: p3-nu0
    where: 'Problem 3(c), answer box: k_B T ln 2/h at 300 K, in units of 1e12 Hz'
    inputs: {'kB': '1.380649e-23 J/K', 'hP': '6.62607015e-34 J*s', 'T3': '300 K', 'u': '1e12 Hz'}
    formula: |-
      kB*T3*log(2)/hP/u
    expected: '4.33'
    shown: ['id="p3-nu0"', '= 4.33 \times 10^{12}\ \text{Hz}"']
    source: {cite: codata, at: 'Boltzmann constant, Planck constant'}
    origin: page-own

  - id: p3-ln2
    where: 'Problem 3(c): ln 2'
    inputs: {}
    formula: |-
      log(2)
    expected: '0.6931'
    shown: ['\times 300 \times 0.6931}']
    source: {cite: codata, at: 'Boltzmann constant, Planck constant'}
    origin: page-own

  - id: p3-wavelength
    where: 'Problem 3(c): the wavelength c/nu0'
    inputs: {'kB': '1.380649e-23 J/K', 'hP': '6.62607015e-34 J*s', 'T3': '300 K', 'cc': '299792458 m/s'}
    formula: |-
      cc/(kB*T3*log(2)/hP)
    expected: '69 um'
    shown: ['a wavelength of about 69 micrometres']
    source: {cite: codata, at: 'Boltzmann constant, Planck constant'}
    origin: page-own

  - id: p3-xvis
    answer: p3-xvis
    where: 'Problem 3(c), answer box: h nu/(k_B T) at 5e14 Hz and 300 K'
    inputs: {'kB': '1.380649e-23 J/K', 'hP': '6.62607015e-34 J*s', 'T3': '300 K', 'nu': '5e14 Hz'}
    formula: |-
