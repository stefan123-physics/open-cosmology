# Calculations on content/year-3/8.06/berry-phase-molecules-energy-scales.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 17 transcripts (L17.1-L17.4) and notes chapter 6 (sections 5 and 6),
# with the page's own worked examples: (1) an electron spin in B = 10 mT whose direction goes once round a cone of
# half-angle 60° in 1.0 μs; (2) energy scales of a molecule of size 0.10 nm with proton nuclei.
# Constants (CODATA): μ_B = 5.7883818060e-5 eV/T, ħ = 6.582119569e-16 eV s, ħc = 197.3269804 eV nm,
# m_e c² = 0.51099895 MeV, m_p/m_e = 1836.15267, m_e = 5.48579909065e-4 u.

page: content/year-3/8.06/berry-phase-molecules-energy-scales.mdx
calcs:
  # ---------------------------------------------------------------- derivations
  - id: spin-berry-phase
    kind: identity
    where: 'spin up along n̂ on a cone of half-angle α: ∫₀^{2π} (−sin²(α/2)) dφ = −2π sin²(α/2) = −π(1 − cos α)'
    formula: integrate('-sin(aa/2)**2', 'x', 0, 2*pi)
    equals: -pi*(1 - cos(aa))
    samples: {aa: [0.3, 1.0471976, 2.5]}
    tolerance: 1e-6
    shown: ['$\gamma_+ = -2\pi\sin^2\frac{\alpha}{2} = -\pi(1 - \cos\alpha) = -\pi/2$']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: page-own

  - id: cap-solid-angle
    kind: identity
    where: 'solid angle of the cap inside a cone of half-angle α: 2π ∫₀^α sin θ dθ = 2π(1 − cos α)'
    formula: 2*pi*integrate('sin(x)', 'x', 0, aa)
    equals: 2*pi*(1 - cos(aa))
    samples: {aa: [0.3, 1.0471976, 2.5]}
    tolerance: 1e-6
    shown: ['$\Omega = 2\pi(1 - \cos\alpha) = \pi$']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: page-own

  - id: spin-minus-half-solid-angle
    kind: identity
    where: 'the connection result −π(1 − cos α) equals −Ω/2 with Ω = 2π(1 − cos α)'
    formula: -pi*(1 - cos(aa))
    equals: -(2*pi*(1 - cos(aa)))/2
    samples: {aa: [0.3, 1.0471976, 2.5]}
    tolerance: 1e-12
    shown: ['so indeed $\gamma_+ = -\Omega/2$']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: mit

  - id: other-gauge
    kind: identity
    where: 'with the eigenstates times e^{−iφ}: 2π cos²(α/2) = π(1 + cos α) = −π(1 − cos α) + 2π'
    formula: 2*pi*cos(aa/2)**2
    equals: -pi*(1 - cos(aa)) + 2*pi
    samples: {aa: [0.3, 1.0471976, 2.5]}
    tolerance: 1e-12
    shown: ['$2\pi\cos^2\frac{\alpha}{2} = \pi(1 + \cos\alpha) = 3\pi/2$']
    source: {cite: reading5, at: 'eqs. (5.17), (5.18), p. 14'}
    origin: page-own

  - id: curvature-flux
    kind: identity
    where: 'notes (5.27): flux of r̂/(2r²) through the part of a sphere of radius r with solid angle Ω is Ω/2'
    formula: (1/(2*rr**2))*rr**2*om
    equals: om/2
    samples: {rr: [0.5, 3.0], om: [0.4, 6.0]}
    tolerance: 1e-12
    shown: ['$\vec D_\pm = \mp\hat r/(2r^2)$']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: mit

  - id: vib-frequency
    kind: identity
    where: 'eq. (6.4): ħ√(k/M) with k = ħ²/(m a⁴) equals √(m/M) ħ²/(m a²)'
    formula: hb*sqrt(hb**2/(me*aa**4)/mm)
    equals: sqrt(me/mm)*hb**2/(me*aa**2)
    samples: {hb: [1.0, 0.3], me: [1.0, 0.002], mm: [1836.0, 5.0], aa: [0.7, 2.0]}
    tolerance: 1e-9
    shown: ['\hbar\omega \sim \sqrt{\frac{m}{M}}\;\frac{\hbar^2}{ma^2}']
    source: {cite: reading5, at: 'eq. (6.4), p. 16'}
    origin: mit

  - id: vib-frequency-squared
    kind: identity
    where: 'eq. (6.4): ħ²/(M m a⁴) = (m/M) ħ²/(m² a⁴)'
    formula: hb**2/(mm*me*aa**4)
    equals: (me/mm)*hb**2/(me**2*aa**4)
    samples: {hb: [1.0, 0.3], me: [1.0, 0.002], mm: [1836.0, 5.0], aa: [0.7, 2.0]}
    tolerance: 1e-9
    shown: ['\omega^2 \sim \frac{m}{M}\,\frac{\hbar^2}{m^2a^4}']
    source: {cite: reading5, at: 'eq. (6.4), p. 16'}
    origin: mit

  - id: nuclear-electronic-frequency
    kind: identity
    where: 'ω = √(m/M) ħ/(m a²) and ω_el = E_el/ħ = ħ/(m a²), so ω/ω_el = √(m/M) (the transcript says m/M)'
    formula: (sqrt(me/mm)*hb/(me*aa**2))/(hb/(me*aa**2))
    equals: sqrt(me/mm)
    samples: {hb: [1.0, 0.3], me: [1.0, 0.002], mm: [1836.0, 5.0], aa: [0.7, 2.0]}
    tolerance: 1e-12
    shown: ['\omega \sim \sqrt{\frac{m}{M}}\;\omega_{el}']
    source: {cite: reading4, at: 'p. 4'}
    origin: mit

  - id: rotation-scale
    kind: identity
    where: 'eq. (6.6): ħ²/(M a²) = (m/M) ħ²/(m a²)'
    formula: hb**2/(mm*aa**2)
    equals: (me/mm)*hb**2/(me*aa**2)
    samples: {hb: [1.0, 0.3], me: [1.0, 0.002], mm: [1836.0, 5.0], aa: [0.7, 2.0]}
    tolerance: 1e-12
    shown: ['\sim \frac{m}{M}\,\frac{\hbar^2}{ma^2} \quad\Rightarrow\quad E_{rot} \sim \frac{m}{M}\,E_{el}']
    source: {cite: reading5, at: 'eq. (6.6), p. 16'}
    origin: mit

  # ---------------------------------------------------------------- quiz and mass ratios
  - id: quiz-equator
    where: 'quiz 3: equator, Ω = 2π(1 − cos 90°) = 2π, γ₊ = −Ω/2 = −π'
    inputs: {}
    formula: -(2*pi*(1 - cos(pi/2)))/2
    expected: '-3.1416'
    shown: ['$\\gamma_+ = -\\Omega/2 = -\\pi$']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: page-own

  - id: proton-ratio
    where: 'mass-ratio remark: m_e/m_p = 1/1836.15'
    inputs: {}
    formula: 1/1836.15267
    expected: '5.4e-4'
    shown: ['$1/1836 \approx 5.4 \times 10^{-4}$']
    source: {cite: codata-mpme, at: 'm_p/m_e'}
    origin: page-own

  - id: carbon-ratio
    where: 'mass-ratio remark: m_e/(12 u) for a carbon-12 nucleus (electron masses of the atom neglected)'
    inputs: {}
    formula: 5.48579909065e-4/12
    expected: '4.6e-5'
    shown: ['$4.6 \times 10^{-5}$']
    source: {cite: codata-meu, at: 'm_e in u'}
    origin: page-own

  # ---------------------------------------------------------------- worked example 1: spin round a cone
  - id: ex1-splitting
    where: 'example 1 (a): μ_B B for B = 0.010 T, eV'
    inputs: {}
    formula: 5.7883818060e-5*0.010
    expected: '5.79e-7'
    shown: ['about $5.79 \times 10^{-7}$ eV']
    source: {cite: codata-mub, at: 'μ_B in eV/T'}
    origin: page-own

  - id: ex1-timescale
    where: 'example 1 (a): ħ/(μ_B B), ns'
    inputs: {}
    formula: 6.582119569e-16/(5.7883818060e-5*0.010)*1e9
    expected: '1.14'
    shown: ['$\hbar/(\mu_B B) \approx 1.14$ ns']
    source: {cite: codata-hbar, at: 'ħ in eV s'}
    origin: page-own

  - id: ex1-ratio
    where: 'example 1 (a): T = 1.0 μs divided by ħ/(μ_B B)'
    inputs: {}
    formula: 1.0e-6/(6.582119569e-16/(5.7883818060e-5*0.010))
    expected: '880'
    tolerance: 1%
    shown: ['about 880 times longer']
    source: {cite: codata-hbar, at: 'ħ in eV s'}
    origin: page-own

  - id: ex1-gamma
    where: 'example 1 (b): γ₊ = −2π sin²(30°) = −π/2'
    inputs: {}
    formula: -2*pi*sin(pi/6)**2
    expected: '-1.5708'
    shown: ['for $\alpha = 60°$.']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: page-own

  - id: ex1-omega
    where: 'example 1 (b): Ω = 2π(1 − cos 60°) = π'
    inputs: {}
    formula: 2*pi*(1 - cos(pi/3))
    expected: '3.1416'
    shown: ['The cap of the sphere inside the cone has solid angle']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: page-own

  - id: ex1-theta
    where: 'example 1 (c): dynamical phase −μ_B B T/ħ for T = 1.0 μs, rad'
    inputs: {}
    formula: -(5.7883818060e-5*0.010)*1.0e-6/6.582119569e-16
    expected: '-879'
    shown: ['$\theta_+ = -\mu_B BT/\hbar \approx -879$']
    source: {cite: reading5, at: 'eq. (5.2), p. 12'}
    origin: page-own

  - id: ex1-turns
    where: 'example 1 (c): 879 rad is about 140 turns of 2π, more than a hundred'
    inputs: {}
    formula: (5.7883818060e-5*0.010)*1.0e-6/6.582119569e-16/(2*pi)
    expected: '140'
    tolerance: 1%
    shown: ['more than a hundred full turns']
    source: {cite: reading5, at: 'eq. (5.2), p. 12'}
    origin: page-own

  - id: ex1-theta-double
    where: 'example 1 (c): dynamical phase for T = 2.0 μs, rad'
    inputs: {}
    formula: -(5.7883818060e-5*0.010)*2.0e-6/6.582119569e-16
    expected: '-1759'
    shown: ['about $-1759$ rad']
    source: {cite: reading5, at: 'eq. (5.2), p. 12'}
    origin: page-own

  - id: ex1-relative
    where: 'example 1 (c): γ₊ − γ₋ = −Ω/2 − Ω/2 = −Ω = −π'
    inputs: {}
    formula: -pi/2 - pi/2
    expected: '-3.1416'
    shown: ['$\gamma_+ - \gamma_- = -\Omega = -\pi$']
    source: {cite: reading5, at: 'eq. (5.27), p. 15'}
    origin: page-own

  - id: ex1-other-gauge
    where: 'example 1 (d): 2π cos²(30°) = 3π/2'
    inputs: {}
    formula: 2*pi*cos(pi/6)**2
    expected: '4.7124'
    shown: ['That is $-\pi/2 + 2\pi$']
    source: {cite: reading5, at: 'eqs. (5.17), (5.18), p. 14'}
    origin: page-own

  # ---------------------------------------------------------------- worked example 2: molecular energy scales
  - id: ex2-Eel
    where: 'example 2: E_el = (ħc)²/(mc² a²) for a = 0.10 nm, eV'
    inputs: {}
    formula: 197.3269804**2/(0.51099895e6*0.10**2)
    expected: '7.6'
    shown: ['about 7.6 eV']
    source: {cite: reading5, at: 'eq. (6.1), p. 15'}
    origin: page-own

  - id: ex2-Eel-shown
    where: 'example 2: the same, to three figures, used in later steps'
    inputs: {}
    formula: 197.3269804**2/(0.51099895e6*0.10**2)
    expected: '7.62'
    shown: ['$2\pi \times 197.33/7.62$']
    source: {cite: reading5, at: 'eq. (6.1), p. 15'}
    origin: page-own

  - id: ex2-lambda-el
    where: 'example 2: λ = 2πħc/E_el, nm'
    inputs: {}
    formula: 2*pi*197.3269804/(197.3269804**2/(0.51099895e6*0.10**2))
    expected: '163'
    shown: ['is about 163 nm']
    source: {cite: codata-hbarc, at: 'ħc'}
    origin: page-own

  - id: ex2-sqrt
    where: 'example 2: √(m/M) = 1/√1836.15'
    inputs: {}
    formula: 1/sqrt(1836.15267)
    expected: '0.0233'
    shown: ['$\sqrt{m/M} = 1/\sqrt{1836} \approx 0.0233$']
    source: {cite: codata-mpme, at: 'm_p/m_e'}
    origin: page-own

  - id: ex2-Evib
    where: 'example 2: E_vib = √(m/M) E_el, eV'
    inputs: {}
    formula: 197.3269804**2/(0.51099895e6*0.10**2)/sqrt(1836.15267)
    expected: '0.18'
    shown: ['about 0.18 eV']
    source: {cite: reading5, at: 'eq. (6.5), p. 16'}
    origin: page-own

  - id: ex2-lambda-vib
    where: 'example 2: λ = 2πħc/E_vib, μm'
    inputs: {}
    formula: 2*pi*197.3269804/(197.3269804**2/(0.51099895e6*0.10**2)/sqrt(1836.15267))/1000
    expected: '7.0'
    shown: ['a wavelength near 7.0 μm']
    source: {cite: codata-hbarc, at: 'ħc'}
    origin: page-own

  - id: ex2-ratio
    where: 'example 2: m/M = 1/1836.15'
    inputs: {}
    formula: 1/1836.15267
    expected: '5.4e-4'
    shown: ['$m/M \approx 5.4 \times 10^{-4}$']
    source: {cite: codata-mpme, at: 'm_p/m_e'}
    origin: page-own

  - id: ex2-Erot
    where: 'example 2: E_rot = (m/M) E_el, meV'
    inputs: {}
    formula: 197.3269804**2/(0.51099895e6*0.10**2)/1836.15267*1000
    expected: '4.15'
    shown: ['$E_{rot} \sim 4.15$ meV']
    source: {cite: reading5, at: 'eq. (6.6), p. 16'}
    origin: page-own

  - id: ex2-lambda-rot
    where: 'example 2: λ = 2πħc/E_rot, mm'
    inputs: {}
    formula: 2*pi*197.3269804/(197.3269804**2/(0.51099895e6*0.10**2)/1836.15267)/1e6
    expected: '0.30'
    shown: ['a wavelength near 0.30 mm']
    source: {cite: codata-hbarc, at: 'ħc'}
    origin: page-own

  - id: ex2-period-el
    where: 'example 2: electronic period 2πħ/E_el, s'
    inputs: {}
    formula: 2*pi*6.582119569e-16/(197.3269804**2/(0.51099895e6*0.10**2))
    expected: '5.4e-16'
    shown: ['$5.4 \times 10^{-16}$']
    source: {cite: codata-hbar, at: 'ħ in eV s'}
    origin: page-own

  - id: ex2-period-vib
    where: 'example 2: vibrational period 2πħ/E_vib, s'
    inputs: {}
    formula: 2*pi*6.582119569e-16/(197.3269804**2/(0.51099895e6*0.10**2)/sqrt(1836.15267))
    expected: '2.3e-14'
    shown: ['$2.3 \times 10^{-14}$']
    source: {cite: codata-hbar, at: 'ħ in eV s'}
    origin: page-own

  - id: ex2-period-ratio
    where: 'example 2: ratio of the periods = √(m/M)'
    inputs: {}
    formula: (2*pi*6.582119569e-16/(197.3269804**2/(0.51099895e6*0.10**2)))/(2*pi*6.582119569e-16/(197.3269804**2/(0.51099895e6*0.10**2)/sqrt(1836.15267)))
    expected: '0.023'
    shown: ['$\sqrt{m/M} \approx 0.023$']
    source: {cite: reading5, at: 'eq. (6.5), p. 16'}
    origin: page-own

  - id: ex2-cycles
    where: 'example 2: electronic cycles per vibration = √(M/m)'
    inputs: {}
    formula: sqrt(1836.15267)
    expected: '43'
    shown: ['about 43 cycles during one vibration']
    source: {cite: reading5, at: 'eq. (6.5), p. 16'}
    origin: page-own

  # ---------------------------------------------------------------- quoted constants
  - id: mub
    kind: fact
    where: 'example 1: Bohr magneton in eV/T (CODATA 5.7883818060e-5)'
    value: '5.788e-5'
    shown: ['Take $\mu_B = 5.788 \times 10^{-5}$ eV/T']
    source: {cite: codata-mub, at: 'μ_B in eV/T'}
    origin: page-own


  - id: hbar-ev
    kind: fact
    where: 'example 1: ħ in eV s (CODATA 6.582119569e-16, exact)'
    value: '6.582e-16'
    shown: ['$\hbar = 6.582 \times 10^{-16}$ eV s']
    source: {cite: codata-hbar, at: 'ħ in eV s'}
    origin: page-own


  - id: hbarc
    kind: fact
    where: 'example 2: ħc = 197.3269804 eV nm (CODATA, exact)'
    value: '197.33'
    shown: ['Use $\hbar c = 197.33$ eV nm']
    source: {cite: codata-hbarc, at: 'ħc'}
    origin: page-own


  - id: mec2
    kind: fact
    where: 'example 2: electron rest energy 0.51099895 MeV (CODATA)'
    value: '0.5110'
    shown: ['$mc^2 = 0.5110$ MeV']
    source: {cite: codata-me, at: 'm_e c²'}
    origin: page-own


  - id: mp-me
    kind: fact
    where: 'example 2: m_p/m_e = 1836.15267 (CODATA)'
    value: '1836'
    shown: ['$m_p/m = 1836$']
    source: {cite: codata-mpme, at: 'm_p/m_e'}
    origin: page-own


  - id: lecture-ratio
    kind: fact
    where: 'lecture and notes: m/M of order 1e-4 (a typical value, quoted)'
    value: '1e-4'
    shown: ['take the ratio $m/M$ to be of order $10^{-4}$']
    source: {cite: reading5, at: 'p. 15'}
    origin: mit

