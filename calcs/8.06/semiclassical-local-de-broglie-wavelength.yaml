# Calculations on content/year-3/8.06/semiclassical-local-de-broglie-wavelength.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 6 transcript L6.5 and notes chapter 3 (section 3.1), with the page's
# own worked example: an electron (mc^2 = 511.0 keV) with E = 10 eV; hc = 1239.84 eV nm, hbar c = 197.33 eV nm.

page: content/year-3/8.06/semiclassical-local-de-broglie-wavelength.mdx
calcs:
  - id: wkb-years
    kind: fact
    where: 'section "WKB and the semiclassical idea": Wentzel, Kramers, Brillouin 1926; Jeffreys 1923 (notes section 3.1, L6.5 p. 1)'
    value: '1926'
    shown: ['who found it in 1926', 'in 1923, without much notice']
    source: {cite: reading2, at: 'section 3.1'}
    origin: mit

  - id: root-10
    where: 'example (a): √(2 × 511,000 × 10) eV'
    inputs: {}
    formula: sqrt(2*511000*10)
    expected: '3197'
    shown: ['$\sqrt{2 \times 511{,}000 \times 10}$ eV $\approx 3{,}197$ eV']
    source: {cite: reading2, at: 'eq. (3.1.3)'}
    origin: page-own

  - id: lambda-10
    where: 'example (a): λ = hc/√(2mc² × 10 eV) in nm'
    inputs: {}
    formula: 1239.84/sqrt(2*511000*10)
    expected: '0.388'
    shown: ['so $\lambda \approx 0.388$ nm']
    source: {cite: reading2, at: 'eq. (3.1.3)'}
    origin: page-own

  - id: kinetic-2-5
    where: 'example (a): kinetic energy 10 − 7.5 = 2.5 eV'
    inputs: {}
    formula: 10 - 7.5
    expected: '2.5'
    tolerance: 1e-12
    shown: ['the kinetic energy is 2.5 eV']
    source: {cite: reading2, at: 'eq. (3.1.2)'}
    origin: page-own

  - id: lambda-2-5
    where: 'example (a): λ = hc/√(2mc² × 2.5 eV) in nm (twice the value at 10 eV)'
    inputs: {}
    formula: 1239.84/sqrt(2*511000*2.5)
    expected: '0.776'
    shown: ['$\lambda \approx 0.776$ nm']
    source: {cite: reading2, at: 'eq. (3.1.3)'}
    origin: page-own

  - id: kappa-root
    where: 'example (b): ħκc = √(2 × 511,000 × 2) eV'
    inputs: {}
    formula: sqrt(2*511000*2)
    expected: '1430'
    shown: ['\sqrt{2 \times 511{,}000 \times 2}$ eV $\approx 1{,}430$ eV']
    source: {cite: reading2, at: 'eq. (3.1.8)'}
    origin: page-own

  - id: kappa
    where: 'example (b): κ = 1430 eV / (ħc = 197.33 eV nm) per nm'
    inputs: {}
    formula: sqrt(2*511000*2)/197.33
    expected: '7.25'
    shown: ['$\kappa \approx 7.25$ per nm']
    source: {cite: reading2, at: 'eq. (3.1.8)'}
    origin: page-own

  - id: decay-length
    where: 'example (b): 1/κ in nm'
    inputs: {}
    formula: 197.33/sqrt(2*511000*2)
    expected: '0.14'
    shown: ['$1/\kappa \approx 0.14$ nm']
    source: {cite: reading2, at: 'eq. (3.1.8)'}
    origin: page-own

  - id: range-low
    where: 'example (c): wavelengths between about 0.4 nm (0.388) and 0.8 nm (0.776)'
    inputs: {}
    formula: 1239.84/sqrt(2*511000*10)
    expected: '0.4'
    shown: ['between about 0.4 and 0.8 nm']
    source: {cite: reading2, at: 'eq. (3.1.3)'}
    origin: page-own

  - id: range-high
    where: 'example (c): upper end of the range, 0.776 nm ≈ 0.8 nm'
    inputs: {}
    formula: 1239.84/sqrt(2*511000*2.5)
    expected: '0.8'
    shown: ['between about 0.4 and 0.8 nm']
    source: {cite: reading2, at: 'eq. (3.1.3)'}
    origin: page-own

  - id: one-wavelength
    kind: fact
    where: 'example (c): 0.5 nm is about one wavelength (0.39-0.78 nm), the case where the semiclassical picture fails'
    value: '0.5'
    shown: ['If the same rise happened over 0.5 nm']
    source: {cite: reading1, at: 'p. 2 (λ compared with the length scale L)'}
    origin: page-own
