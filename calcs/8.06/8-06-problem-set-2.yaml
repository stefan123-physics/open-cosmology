# Calculations on content/year-3/8.06/8-06-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 expands the exact eigenvalue and eigenvector of the two-state test system numerically; Problem 2 solves the
# exact (truncated continued-fraction) eigenvalue equations of the odd and the even states on the ring for a weak field;
# Problem 3 solves the unfactored cubic numerically; Problem 4 integrates explicit hydrogen radial functions (the
# circular states l = n − 1 for any n, and 2s, 3p); Problem 5 integrates the hydrogen wavefunctions numerically.
# Constants (CODATA 2018): alpha = 7.2973525693e-3, m_e c² = 0.51099895000 MeV, a0 = 5.29177210903e-11 m.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.06/8-06-problem-set-2.mdx
calcs:
  # ---- How to answer: constants

  - id: intro-constants
    kind: fact
    where: 'How to answer: the constants of Problem 5(f), CODATA 2018 rounded (1/alpha = 137.035999084, m_e c² = 0.51099895000 MeV, a0 = 5.29177210903e-11 m)'
    shown: ['$\alpha = 1/137.036$, $mc^2 = 510{,}998.95$ eV for the electron, and $a_0 = 5.29177 \times 10^{-11}$ m']
    source: {cite: codata, at: 'inverse fine-structure constant, electron mass energy equivalent in MeV, Bohr radius'}
    origin: later-data

  - id: intro-volt
    where: 'How to answer: e times 1 V/m times the Bohr radius, in eV'
    inputs: {'ee': '1 e', 'field': '1 V/m', 'a0': '5.29177210903e-11 m'}
    formula: |-
      ee*field*a0
    expected: '5.29177e-11 eV'
    shown: ['gives $5.29177 \times 10^{-11}$ eV']
    source: {cite: codata, at: 'Bohr radius'}
    origin: later-data

  # ---- Problem 1: two-state test system, H0 = diag(0, D), dH = [[w1, v], [v, w2]]

  # Exact lower eigenvalue: (A + B)/2 - sqrt(((B - A)/2)² + lam² v²), with A = lam w1 and B = D + lam w2.

  # Exact lower eigenvector (1, c) with c = (E - A)/(lam v); Z = 1/(1 + c²).

  - id: p1-e3
    kind: limit
    answer: p1-e3
    where: 'Problem 1(a), answer box: the third-order coefficient of the exact lower eigenvalue of the test system, (E − lam w1 + lam² v²/D)/lam³ for lam → 0'
    inputs: {'v': 0.8, 'w1': 0.5, 'w2': 1.7, 'D': 2.0}
    formula: |-
      v**2*(w2 - w1)/D**2
    limit: |-
      (((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)) - lam*w1 + lam**2*v**2/D)/lam**3
    vary: {lam: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.01
    shown: ['id="p1-e3"', '<Formula label="Third-order energy of the lower state of the test system"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-e3-other
    kind: limit
    where: 'Problem 1(a): the same check with w1 above w2 (a negative third-order energy)'
    inputs: {'v': 1.3, 'w1': 2.1, 'w2': 0.4, 'D': 1.5}
    formula: |-
      v**2*(w2 - w1)/D**2
    limit: |-
      (((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)) - lam*w1 + lam**2*v**2/D)/lam**3
    vary: {lam: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.02
    shown: ['<Formula label="Third-order energy"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-state2
    kind: limit
    where: 'Problem 1(a): the second-order state of the test system, from the exact eigenvector (1, c): (c + lam v/D)/lam² → v(w2 − w1)/D²'
    inputs: {'v': 0.8, 'w1': 0.5, 'w2': 1.7, 'D': 2.0}
    formula: |-
      v*(w2 - w1)/D**2
    limit: |-
      (((((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)) - lam*w1)/(lam*v)) + lam*v/D)/lam**2
    vary: {lam: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.01
    shown: ['<Formula label="Second-order state"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-exact-rel
    kind: identity
    where: 'Problem 1(a), check: the exact lower eigenvalue obeys E = lam w1 − lam² v²/(D + lam w2 − E)'
    formula: |-
      ((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2))
    equals: |-
      lam*w1 - lam**2*v**2/(D + lam*w2 - ((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)))
    samples:
      lam: [0.1, 0.3, 0.5, 0.8, 1.0]
      v: [0.8, 1.3, 0.5, 2.0, 1.1]
      w1: [0.5, 2.1, 0.3, 1.2, 0.7]
      w2: [1.7, 0.4, 3.0, 1.5, 2.2]
      D: [2.0, 1.5, 3.0, 1.0, 2.5]
    tolerance: 1e-10
    shown: ['obeys $E = \lambda w_1 - \lambda^2v^2/\left(\Delta + \lambda w_2 - E\right)$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-z
    kind: identity
    answer: p1-z
    where: 'Problem 1(b), answer box: Z to order lam² against the exact 1/(1 + c²) of the test system, at small lam'
    formula: |-
      1 - lam**2*v**2/D**2
    equals: |-
      (1/(1 + ((((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)) - lam*w1)/(lam*v))**2))
    samples:
      lam: [0.01, 0.02, 0.015, 0.01, 0.02]
      v: [0.8, 1.3, 0.5, 2.0, 1.1]
      w1: [0.5, 2.1, 0.3, 1.2, 0.7]
      w2: [1.7, 0.4, 3.0, 1.5, 2.2]
      D: [2.0, 1.5, 3.0, 1.0, 2.5]
    tolerance: 5e-05
    shown: ['id="p1-z"', 'For the test system the sum has one term, $v^2/\Delta^2$.']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-z-coeff
    kind: limit
    where: 'Problem 1(b): the coefficient of lam² in 1 − Z, from the exact eigenvector, for lam → 0'
    inputs: {'v': 0.8, 'w1': 0.5, 'w2': 1.7, 'D': 2.0}
    formula: |-
      v**2/D**2
    limit: |-
      (1 - (1/(1 + ((((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)) - lam*w1)/(lam*v))**2)))/lam**2
    vary: {lam: [0.1, 0.03, 0.01, 0.003]}
    tolerance: 0.01
    shown: ['<Formula label="Norm of the perturbed state"']
    source: {cite: reading1, at: 'eq. (1.1.34), used in the norm'}
    origin: page-own

  - id: p1-prob
    kind: identity
    where: 'Problem 1(b), choice box and check: the probability Z = 1/(1 + c²) equals the derivative of the exact eigenvalue with respect to the unperturbed energy of the state (Feynman–Hellmann), for any lam'
    formula: |-
      (1/(1 + ((((lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - lam*w1)/2)**2 + lam**2*v**2)) - lam*w1)/(lam*v))**2))
    equals: |-
      deriv('((e0 + lam*w1 + D + lam*w2)/2 - sqrt(((D + lam*w2 - e0 - lam*w1)/2)**2 + lam**2*v**2))', 'e0', 0)
    samples:
      lam: [0.1, 0.3, 0.5, 0.8, 1.0]
      v: [0.8, 1.3, 0.5, 2.0, 1.1]
      w1: [0.5, 2.1, 0.3, 1.2, 0.7]
      w2: [1.7, 0.4, 3.0, 1.5, 2.2]
      D: [2.0, 1.5, 3.0, 1.0, 2.5]
    tolerance: 1e-06
    shown: ['id="p1-prob"', 'So $Z_n = \partial E_n/\partial E_n^{(0)}$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: particle on a ring in a field; units of E1 inside the solves, vv = q Ef a/(2 E1) small

  # Odd states sin(n phi): (n² − x) c_n − vv (c_(n−1) + c_(n+1)) = 0, a continued fraction for the root near 1.

  # Even states 1, cos(n phi): the constant couples to cos(phi) with sqrt(2) vv, which adds the term 2 vv²/x.

  - id: p2-me
    kind: identity
    answer: p2-me
    where: 'Problem 2(a), answer box: <n+1|dH|n> = −q Ef a (1/2π) ∫ e^(−i phi) cos(phi) d phi, whose real part is the integral of cos²'
    formula: |-
      -q*Ef*a/2
    equals: |-
      -q*Ef*a*integrate('cos(x)*cos(x)', 'x', 0, 2*pi)/(2*pi)
    samples:
      q: [0.5, 1, 2]
      Ef: [2, 1, 0.5]
      a: [0.7, 1.5, 2]
    tolerance: 1e-09
    shown: ['id="p2-me"', '<Formula label="Matrix elements of the perturbation on the ring"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-me-diag
    kind: identity
    where: 'Problem 2(a), check: the average of cos(phi) over the ring is zero (compared as 1 + average = 1)'
    formula: |-
      1
    equals: |-
      1 + integrate('cos(x)', 'x', 0, 2*pi)/(2*pi)
    samples:
      q: [1]
    tolerance: 1e-09
    shown: ['the average of $\cos\phi$ over the ring is zero']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-m11
    kind: identity
    answer: p2-m11
    where: 'Problem 2(b), answer box: the diagonal entry as the mean of the two exact second-order shifts (even and odd state) for a weak field'
    formula: |-
      q**2*Ef**2*a**2/(6*E1)
    equals: |-
      E1*((solve('x - 1 - 2*(q*Ef*a/(2*E1))**2/x - (q*Ef*a/(2*E1))**2/(x - 4 - (q*Ef*a/(2*E1))**2/(x - 9 - (q*Ef*a/(2*E1))**2/(x - 16)))', 'x', 0.9, 1.1) - 1) + (solve('x - 1 - (q*Ef*a/(2*E1))**2/(x - 4 - (q*Ef*a/(2*E1))**2/(x - 9 - (q*Ef*a/(2*E1))**2/(x - 16)))', 'x', 0.9, 1.1) - 1))/2
    samples:
      q: [0.2, 0.3, 0.1, 0.25, 0.15]
      Ef: [0.1, 0.05, 0.2, 0.08, 0.1]
      a: [1, 1.5, 0.8, 1.2, 2]
      E1: [1, 1.5, 0.8, 2, 1.2]
    tolerance: 0.001
    shown: ['id="p2-m11"', '<Formula label="Diagonal element of the second-order matrix"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-m12
    kind: identity
    answer: p2-m12
    where: 'Problem 2(b), answer box: the off-diagonal entry as half the difference of the two exact second-order shifts for a weak field'
    formula: |-
      q**2*Ef**2*a**2/(4*E1)
    equals: |-
      E1*(solve('x - 1 - 2*(q*Ef*a/(2*E1))**2/x - (q*Ef*a/(2*E1))**2/(x - 4 - (q*Ef*a/(2*E1))**2/(x - 9 - (q*Ef*a/(2*E1))**2/(x - 16)))', 'x', 0.9, 1.1) - solve('x - 1 - (q*Ef*a/(2*E1))**2/(x - 4 - (q*Ef*a/(2*E1))**2/(x - 9 - (q*Ef*a/(2*E1))**2/(x - 16)))', 'x', 0.9, 1.1))/2
    samples:
      q: [0.2, 0.3, 0.1, 0.25, 0.15]
      Ef: [0.1, 0.05, 0.2, 0.08, 0.1]
      a: [1, 1.5, 0.8, 1.2, 2]
      E1: [1, 1.5, 0.8, 2, 1.2]
    tolerance: 0.001
    shown: ['id="p2-m12"', '<Formula label="Off-diagonal element of the second-order matrix"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-up
    kind: identity
    answer: p2-up
    where: 'Problem 2(c), answer box and choice box: the exact energy of the even state cos(phi), minus E1, for a weak field'
    formula: |-
      5*q**2*Ef**2*a**2/(12*E1)
    equals: |-
      E1*(solve('x - 1 - 2*(q*Ef*a/(2*E1))**2/x - (q*Ef*a/(2*E1))**2/(x - 4 - (q*Ef*a/(2*E1))**2/(x - 9 - (q*Ef*a/(2*E1))**2/(x - 16)))', 'x', 0.9, 1.1) - 1)
    samples:
      q: [0.2, 0.3, 0.1, 0.25, 0.15]
      Ef: [0.1, 0.05, 0.2, 0.08, 0.1]
      a: [1, 1.5, 0.8, 1.2, 2]
      E1: [1, 1.5, 0.8, 2, 1.2]
    tolerance: 0.001
    shown: ['id="p2-up"', 'id="p2-state"', '<Formula label="Second-order energies of the first excited level on the ring"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-down
    kind: identity
    answer: p2-down
    where: 'Problem 2(c), answer box: the exact energy of the odd state sin(phi), minus E1, for a weak field'
    formula: |-
      -q**2*Ef**2*a**2/(12*E1)
    equals: |-
      E1*(solve('x - 1 - (q*Ef*a/(2*E1))**2/(x - 4 - (q*Ef*a/(2*E1))**2/(x - 9 - (q*Ef*a/(2*E1))**2/(x - 16)))', 'x', 0.9, 1.1) - 1)
    samples:
      q: [0.2, 0.3, 0.1, 0.25, 0.15]
      Ef: [0.1, 0.05, 0.2, 0.08, 0.1]
      a: [1, 1.5, 0.8, 1.2, 2]
      E1: [1, 1.5, 0.8, 2, 1.2]
    tolerance: 0.001
    shown: ['id="p2-down"', '<Formula label="The second-order matrix of the ring and its eigenvalues"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-sin-element
    kind: identity
    where: 'Problem 2(c), check: <sin 2phi|cos phi|sin phi> with states sin(n phi)/sqrt(pi) is 1/2, so the element of dH is −V'
    formula: |-
      1/2
    equals: |-
      integrate('sin(2*x)*cos(x)*sin(x)', 'x', 0, 2*pi)/pi
    samples:
      q: [1]
    tolerance: 1e-09
    shown: ['is linked only to $\sin2\phi$, with matrix element $-V$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-cos-element
    kind: identity
    where: 'Problem 2(c), check: <1/sqrt(2π)|cos phi|cos phi/sqrt(π)> = 1/sqrt 2, so the element of dH is −sqrt(2) V; and <cos 2phi|cos phi|cos phi> = 1/2'
    formula: |-
      1/sqrt(2) + 1/2
    equals: |-
      integrate('cos(x)*cos(x)', 'x', 0, 2*pi)/(pi*sqrt(2)) + integrate('cos(2*x)*cos(x)*cos(x)', 'x', 0, 2*pi)/pi
    samples:
      q: [1]
    tolerance: 1e-09
    shown: ['and to the constant ground state (element $-\sqrt2\,V$)']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-check-sums
    kind: identity
    where: 'Problem 2(c), check: −V²/3E1 + 2V²/E1 = 5V²/3E1 = 5 q² Ef² a²/12E1 with V = q Ef a/2'
    formula: |-
      -(q*Ef*a/2)**2/(3*E1) + 2*(q*Ef*a/2)**2/E1
    equals: |-
      5*q**2*Ef**2*a**2/(12*E1)
    samples:
      q: [0.2, 0.3, 0.1, 0.25, 0.15]
      Ef: [0.1, 0.05, 0.2, 0.08, 0.1]
      a: [1, 1.5, 0.8, 1.2, 2]
      E1: [1, 1.5, 0.8, 2, 1.2]
    tolerance: 1e-12
    shown: ['which gives $-V^2/3E_1 + 2V^2/E_1 = 5V^2/3E_1 = 5q^2\mathcal{E}^2a^2/12E_1$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3: the three-by-three matrix, real perturbations; the cubic det(H − x) is solved without factoring it

  - id: p3-exact
    kind: identity
    answer: p3-exact
    where: 'Problem 3(a), answer box: the root of the cubic above E1'
    formula: |-
      (E1 + E2)/2 + sqrt((E1 - E2)**2/4 + e1**2 + e2**2)
    equals: |-
      solve('(E1 - x)*((E1 - x)*(E2 - x) - e2**2) - e1**2*(E1 - x)', 'x', E1 + 0.0000001, E1 + 20)
    samples:
      E1: [3, 4, 5, 3.5, 4.5]
      E2: [0.5, 1, 2, 1.5, 0.8]
      e1: [0.3, 0.6, 1.2, 0.9, 0.5]
      e2: [1.2, 0.4, 0.7, 0.3, 1.0]
    tolerance: 1e-09
    shown: ['id="p3-exact"', '<Formula label="Exact eigenvalues of the three-by-three matrix"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-exact-c
    kind: identity
    where: 'Problem 3(a): the root of the cubic below E2 is the other sign of the square root'
    formula: |-
      (E1 + E2)/2 - sqrt((E1 - E2)**2/4 + e1**2 + e2**2)
    equals: |-
      solve('(E1 - x)*((E1 - x)*(E2 - x) - e2**2) - e1**2*(E1 - x)', 'x', E2 - 20, E2)
    samples:
      E1: [3, 4, 5, 3.5, 4.5]
      E2: [0.5, 1, 2, 1.5, 0.8]
      e1: [0.3, 0.6, 1.2, 0.9, 0.5]
      e2: [1.2, 0.4, 0.7, 0.3, 1.0]
    tolerance: 1e-09
    shown: ['<Formula label="Characteristic equation of the three-by-three matrix"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-trace
    kind: identity
    where: 'Problem 3(a), choice box and check: E1 itself is a root, and with the two other roots of the cubic the sum is the trace 2 E1 + E2'
    formula: |-
      2*E1 + E2
    equals: |-
      E1 + solve('(E1 - x)*((E1 - x)*(E2 - x) - e2**2) - e1**2*(E1 - x)', 'x', E1 + 0.0000001, E1 + 20) + solve('(E1 - x)*((E1 - x)*(E2 - x) - e2**2) - e1**2*(E1 - x)', 'x', E2 - 20, E2)
    samples:
      E1: [3, 4, 5, 3.5, 4.5]
      E2: [0.5, 1, 2, 1.5, 0.8]
      e1: [0.3, 0.6, 1.2, 0.9, 0.5]
      e2: [1.2, 0.4, 0.7, 0.3, 1.0]
    tolerance: 1e-09
    shown: ['id="p3-count"', 'The three eigenvalues add up to $2E_1 + E_2$']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-s1
    kind: identity
    answer: p3-s1
    where: 'Problem 3(a), answer box: the root of the cubic above E1, minus E1, for a weak perturbation'
    formula: |-
      (e1**2 + e2**2)/(E1 - E2)
    equals: |-
      solve('(E1 - x)*((E1 - x)*(E2 - x) - e2**2) - e1**2*(E1 - x)', 'x', E1 + 0.0000001, E1 + 20) - E1
    samples:
      E1: [3, 4, 5, 3.5, 4.5]
      E2: [0.5, 1, 2, 1.5, 0.8]
      e1: [0.01, 0.02, 0.03, 0.015, 0.02]
      e2: [0.02, 0.01, 0.02, 0.03, 0.025]
    tolerance: 0.001
    shown: ['id="p3-s1"', '<Formula label="Eigenvalues of the three-by-three matrix to second order"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-s2
    kind: identity
    answer: p3-s2
    where: 'Problem 3(a), answer box, and Problem 3(b): the root of the cubic below E2, minus E2, for a weak perturbation'
    formula: |-
      -(e1**2 + e2**2)/(E1 - E2)
    equals: |-
      solve('(E1 - x)*((E1 - x)*(E2 - x) - e2**2) - e1**2*(E1 - x)', 'x', E2 - 20, E2) - E2
    samples:
      E1: [3, 4, 5, 3.5, 4.5]
      E2: [0.5, 1, 2, 1.5, 0.8]
      e1: [0.01, 0.02, 0.03, 0.015, 0.02]
      e2: [0.02, 0.01, 0.02, 0.03, 0.025]
    tolerance: 0.001
    shown: ['id="p3-s2"', '<Formula label="Second-order energy of the third state"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-vec-a
    kind: identity
    where: 'Problem 3(a), choice box: H on (e2, −e1, 0) gives E1 times it; the third component e1 e2 − e2 e1 vanishes (compared as 1 + component = 1)'
    formula: |-
      1
    equals: |-
      1 + e1*e2 - e2*e1
    samples:
      E1: [3, 4, 5, 3.5, 4.5]
      E2: [0.5, 1, 2, 1.5, 0.8]
      e1: [0.3, 0.6, 1.2, 0.9, 0.5]
      e2: [1.2, 0.4, 0.7, 0.3, 1.0]
    tolerance: 1e-12
    shown: ['id="p3-vec"']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-vec-b
    kind: identity
    where: 'Problem 3(a): H on u_b = (e1, e2, z) with z = η²/(E1 − E2): third component η² + E2 z equals E1 z'
