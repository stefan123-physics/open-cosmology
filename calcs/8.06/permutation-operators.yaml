# Calculations on content/year-3/8.06/permutation-operators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 23 transcripts L23.1-L23.4 and lecture notes chapter 8
# ("Identical particles"), section 8.2.2, pp. 154-158, eqs. (8.2.5)-(8.2.33).
# Convention: P_alpha |x_1 ... x_N> = |x_alpha(1) ... x_alpha(N)>; in a product the right-hand operator acts first.
# The permutation results on the page (P3142 abcd = cadb, P2413 P3142 = 1, P231 P213 = P132, P213 P231 = P321,
# P2341 abcd = bcda with inverse P4123, P4312 abcd = dcab, P231 P312 = 1) and the parities were checked by acting
# on lists of letters (they agree with Table 8.1 of the notes); the harness has no permutations, so only their
# numerical consequences are stored here.
# Spin kets in the z basis, two-spin product basis order ++, +-, -+, --: |psi> = 0.8|+-> + 0.6|-+> has components
# (0, 0.8, 0.6, 0); P21 swaps the +- and -+ components.

page: content/year-3/8.06/permutation-operators.mdx
calcs:
  - id: projector-square
    kind: identity
    where: 'S and A square to themselves: (1/4)(1 ± 2p + p²) = (1/2)(1 ± p) when p² = 1 (p an eigenvalue ±1 of P21; sg the sign, +1 for S, −1 for A)'
    formula: 0.25*(1 + 2*sg*pv + pv**2)
    equals: 0.5*(1 + sg*pv)
    samples: {sg: [1, 1, -1, -1], pv: [1, -1, 1, -1]}
    tolerance: 1e-12
    shown: ['\frac14\left(1 \pm 2P_{21} + P_{21}P_{21}\right) = \frac12\left(1 \pm P_{21}\right)']
    source: {cite: reading1, at: 'p. 6'}
    origin: mit

  - id: s3-order
    kind: value
    where: 'three particles: 3! = 6 permutation operators'
    inputs: {}
    formula: 3*2*1
    expected: '6'
    shown: ['$3! = 6$ permutation operators']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: s3-even-odd
    kind: value
    where: 'S3: 3!/2 = 3 even (identity and two cycles) and 3 odd (the transpositions)'
    inputs: {}
    formula: 3*2*1/2
    expected: '3'
    shown: ['Three even and three odd is no coincidence']
    source: {cite: reading3, at: 'p. 5'}
    origin: mit

  # ---------------------------------------------------------------- worked example
  - id: ex-b-order
    kind: value
    where: 'example (b): 4! = 24 permutations of four particles'
    inputs: {}
    formula: 4*3*2*1
    expected: '24'
    shown: ['$4! = 24$ permutations of four particles']
    source: {cite: reading3, at: 'p. 1'}
    origin: page-own

  - id: ex-b-even
    kind: value
    where: 'example (b): half of 4! are even (Theorem 8.2.1)'
    inputs: {}
    formula: 4*3*2*1/2
    expected: '12'
    shown: ['half, 12, are even']
    source: {cite: reading5, at: 'Theorem 8.2.1, p. 158'}
    origin: page-own

  - id: ex-b-parity
    kind: value
    where: 'example (b): P2341 is three neighbour exchanges, sign (−1)³ = −1 (odd); by inversion count 1 > ... 4 > 1 gives 3 inversions'
    inputs: {}
    formula: (-1)**3
    expected: '-1'
    shown: ['so $P_{2341}$ is odd']
    source: {cite: reading3, at: 'p. 4'}
    origin: page-own

  - id: ex-c-norm-psi
    kind: value
    where: 'example (c): |psi> = 0.8|+-> + 0.6|-+> is normalized: 0.8² + 0.6² = 1'
    inputs: {}
    formula: 0.8**2 + 0.6**2
    expected: '1'
    shown: ['the squared norm of $|\psi\rangle$']
    source: {cite: reading5, at: 'eq. (8.2.5), p. 154'}
    origin: page-own

  - id: ex-c-s
    kind: value
    where: 'example (c): S|psi> coefficient (0.8 + 0.6)/2'
    inputs: {}
    formula: (0.8 + 0.6)/2
    expected: '0.7'
    shown: ['= 0.7\left(']
    source: {cite: reading5, at: 'eq. (8.2.13), p. 155'}
    origin: page-own

  - id: ex-c-a
    kind: value
    where: 'example (c): A|psi> coefficient (0.8 − 0.6)/2 (coefficient of |+->; that of |-+> is −0.1)'
    inputs: {}
    formula: (0.8 - 0.6)/2
    expected: '0.1'
    shown: ['= 0.1\left(']
    source: {cite: reading5, at: 'eq. (8.2.13), p. 155'}
    origin: page-own

  - id: ex-c-sum
    kind: identity
    where: 'example (c): S|psi> + A|psi> = |psi>, component by component: (a + b)/2 + (a − b)/2 = a for the |+-> part and (a + b)/2 − (a − b)/2 = b for the |-+> part'
    formula: (aa + bb)/2 + (aa - bb)/2 + 10*((aa + bb)/2 - (aa - bb)/2)
    equals: aa + 10*bb
    samples: {aa: [0.8, 0.3], bb: [0.6, -0.5]}
    tolerance: 1e-12
    shown: ['as $S + A = 1$ requires']
    source: {cite: reading5, at: 'eq. (8.2.15), p. 155'}
    origin: page-own

  - id: ex-c-orthogonal
    kind: value
    where: 'example (c): <S psi|A psi> = 0.7·0.1 + 0.7·(−0.1)'
    inputs: {}
    formula: 0.7*0.1 + 0.7*(-0.1)
    expected: '0'
    shown: ['$0.7 \times 0.1 - 0.7 \times 0.1 = 0$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: ex-c-norm-s
    kind: value
    where: 'example (c): squared norm of S|psi>: 2 × 0.7²'
    inputs: {}
    formula: 2*0.7**2
    expected: '0.98'
    shown: ['$2 \times 0.7^2 = 0.98$']
    source: {cite: reading5, at: 'eq. (8.2.13), p. 155'}
    origin: page-own

  - id: ex-c-norm-a
    kind: value
    where: 'example (c): squared norm of A|psi>: 2 × 0.1²'
    inputs: {}
    formula: 2*0.1**2
    expected: '0.02'
    shown: ['$2 \times 0.1^2 = 0.02$']
    source: {cite: reading5, at: 'eq. (8.2.13), p. 155'}
    origin: page-own

  - id: ex-c-norm-sum
    kind: value
    where: 'example (c): 0.98 + 0.02 = 1 (Pythagoras for the orthogonal parts)'
    inputs: {}
    formula: 2*0.7**2 + 2*0.1**2
    expected: '1'
    shown: ['which add up to 1']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  # ---------------------------------------------------------------- quiz
  - id: quiz-a-norm
    kind: value
    where: 'quiz 3: A|u1 u2> = (1/2)(|u1 u2> − |u2 u1>), squared norm (1/2)² + (1/2)²'
    inputs: {}
    formula: (1/2)**2 + (1/2)**2
    expected: '0.5'
    shown: ['so the squared norm is $\\frac14 + \\frac14 = \\frac12$']
    source: {cite: reading5, at: 'eq. (8.2.13), p. 155'}
    origin: page-own
