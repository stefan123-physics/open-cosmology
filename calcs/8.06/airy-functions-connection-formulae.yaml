# Calculations on content/year-3/8.06/airy-functions-connection-formulae.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 8 transcripts and notes chapter 3 (sections 3.4-3.5), with the page's
# own worked example: an electron (mc^2 = 511.0 keV, hbar c = 197.33 eV nm) near a turning point with g = 1 eV/nm, and
# tunnelling at E = 1 eV through a 2 eV barrier.

page: content/year-3/8.06/airy-functions-connection-formulae.mdx
calcs:
  - id: airy-years
    kind: fact
    where: 'section "Airy''s equation": Airy was the seventh Astronomer Royal, 1835 to 1881 (L8.1 p. 1)'
    value: '1835'
    shown: ['seventh Astronomer Royal from 1835 to 1881']
    source: {cite: reading1, at: 'p. 1'}
    origin: mit

  - id: wkb-integral-in-u
    kind: identity
    where: 'notes eqs. (3.4.30)-(3.4.31): ∫_a^x √(2mg(x′ − a))/ħ dx′ = (2/3)(η(x − a))^(3/2) with η = (2mg/ħ²)^(1/3)'
    formula: integrate('sqrt(2*mm*gg*(s - aa))/hb', 's', aa, xx)
    equals: 2/3*(((2*mm*gg/hb**2)**(1/3))*(xx - aa))**1.5
    samples: {mm: [1.0, 2.0], gg: [0.5, 1.5], hb: [1.0, 0.7], aa: [0.0, 1.0], xx: [2.0, 3.5]}
    tolerance: 1e-4
    shown: ['\int_a^x\kappa\,dx'' = \int_x^ak\,dx'' = \frac23|u|^{3/2} = \xi']
    source: {cite: reading5, at: 'eqs. (3.4.30), (3.4.31)'}
    origin: mit

  - id: half-factor
    kind: identity
    where: 'L8.2 p. 3: (1/2π) e^(−ξ) √π / u^(1/4) (the Gaussian integral √(π/√u)) equals (1/(2√π)) u^(−1/4) e^(−ξ)'
    formula: 1/(2*pi)*exp(-2/3*uu**1.5)*sqrt(pi/sqrt(uu))
    equals: 1/(2*sqrt(pi))*uu**(-0.25)*exp(-2/3*uu**1.5)
    samples: {uu: [1.5, 4.0]}
    tolerance: 1e-12
    shown: ['\text{Ai}(u) \simeq \frac{1}{2\sqrt\pi}\,|u|^{-1/4}e^{-\xi} \quad (u \gg 1)']
    source: {cite: reading2, at: 'p. 3'}
    origin: mit

  - id: wkb-form-equation
    kind: identity
    where: 'notes eqs. (3.4.24), (3.4.25): ψ = u^(−1/4) e^(−(2/3)u^(3/2)) satisfies ψ″ = (u + 5/(16u²))ψ; second derivative by central differences, h = 1e-3'
    formula: ((u0 + 0.001)**(-0.25)*exp(-2/3*(u0 + 0.001)**1.5) - 2*u0**(-0.25)*exp(-2/3*u0**1.5) + (u0 - 0.001)**(-0.25)*exp(-2/3*(u0 - 0.001)**1.5))/0.001**2
    equals: (u0 + 5/(16*u0**2))*u0**(-0.25)*exp(-2/3*u0**1.5)
    samples: {u0: [1.0, 2.0]}
    tolerance: 1e-5
    shown: ['solves not Airy''s equation but $\psi'''' = \left(u + \frac{5}{16u^2}\right)\psi$']
    source: {cite: reading5, at: 'eqs. (3.4.24), (3.4.25)'}
    origin: mit

  - id: point-63
    where: 'notes eq. (3.4.29): |u|^(3/2) ≫ 1/2, i.e. |u| ≫ (1/2)^(2/3) ≈ 0.63'
    inputs: {}
    formula: 0.5**(2/3)
    expected: '0.63'
    shown: ['becomes $|u| \gg (1/2)^{2/3} \approx 0.63$']
    source: {cite: reading5, at: 'eq. (3.4.29)'}
    origin: mit

  - id: eta-cubed
    where: 'example (a): η³ = 2mc² g/(ħc)² in nm⁻³'
    inputs: {}
    formula: 2*511000*1/197.33**2
    expected: '26.2'
    shown: ['\approx 26.2$ nm⁻³']
    source: {cite: reading5, at: 'eq. (3.4.18)'}
    origin: page-own

  - id: eta
    where: 'example (a): η per nm'
    inputs: {}
    formula: (2*511000*1/197.33**2)**(1/3)
    expected: '2.97'
    shown: ['so $\eta \approx 2.97$ per nm']
    source: {cite: reading5, at: 'eq. (3.4.18)'}
    origin: page-own

  - id: bad-region
    where: 'example (a): |x − a| = 0.63/η in nm'
    inputs: {}
    formula: 0.63/(2*511000*1/197.33**2)**(1/3)
    expected: '0.21'
    shown: ['$|x - a| = 0.63/\eta \approx 0.21$ nm']
    source: {cite: reading5, at: 'eq. (3.4.29)'}
    origin: page-own

  - id: kappa-barrier
    where: 'example (b): κ = √(2mc² × 1 eV)/ħc per nm'
    inputs: {}
    formula: sqrt(2*511000*1)/197.33
    expected: '5.12'
    shown: ['so $\kappa \approx 5.12$ per nm']
    source: {cite: reading5, at: 'eq. (3.5.11)'}
    origin: page-own

  - id: exponent-half
    where: 'example (b): 2κw for w = 0.5 nm'
    inputs: {}
    formula: 2*sqrt(2*511000*1)/197.33*0.5
    expected: '5.12'
    shown: ['$e^{-5.12} \approx 6.0 \times 10^{-3}$']
    source: {cite: reading5, at: 'eq. (3.5.11)'}
    origin: page-own

  - id: T-half
    where: 'example (b) and quiz 4: T for 0.5 nm'
    inputs: {}
    formula: exp(-2*sqrt(2*511000*1)/197.33*0.5)
    expected: '6.0e-3'
    shown: ['\approx 6.0 \times 10^{-3}$ for 0.5 nm', 'from $6 \\times 10^{-3}$ to']
    source: {cite: reading5, at: 'eq. (3.5.11)'}
    origin: page-own

  - id: exponent-one
    where: 'example (b): 2κw for w = 1 nm'
    inputs: {}
    formula: 2*sqrt(2*511000*1)/197.33*1
    expected: '10.25'
    shown: ['$e^{-10.25} \approx 3.5 \times 10^{-5}$']
    source: {cite: reading5, at: 'eq. (3.5.11)'}
    origin: page-own

  - id: T-one
    where: 'example (b) and quiz 4: T for 1 nm'
    inputs: {}
    formula: exp(-2*sqrt(2*511000*1)/197.33)
    expected: '3.5e-5'
    shown: ['\approx 3.5 \times 10^{-5}$ for 1 nm', 'to $3.5 \\times 10^{-5}$)']
    source: {cite: reading5, at: 'eq. (3.5.11)'}
    origin: page-own

  - id: doubling-squares
    where: 'example (b) and quiz 4: e^(−2κ·2w) = (e^(−2κw))²; ratio 1'
    inputs: {}
    formula: exp(-2*sqrt(2*511000*1)/197.33)/exp(-2*sqrt(2*511000*1)/197.33*0.5)**2
    expected: '1'
    tolerance: 1e-9
    shown: ['Doubling the width squares $T$.']
    source: {cite: reading5, at: 'eq. (3.5.10)'}
    origin: page-own
