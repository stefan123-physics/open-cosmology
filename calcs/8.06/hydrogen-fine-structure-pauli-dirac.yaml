# Calculations on content/year-3/8.06/hydrogen-fine-structure-pauli-dirac.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 4 transcripts and notes chapter 2 (sections 2.1-2.3), with the page's
# own worked example on hydrogen-like ions. Constants: alpha = 1/137.036, mc^2 = 510999 eV (page: 511.0 keV),
# hbar = 1.054571817e-34 J s, m_e = 9.1093837e-31 kg, c = 2.99792458e8 m/s, k = 8.617333e-5 eV/K.

page: content/year-3/8.06/hydrogen-fine-structure-pauli-dirac.mdx
calcs:
  - id: bohr-radius
    where: 'eq. (2.1.2): a0 = ħ²/(me²) = ħ/(mcα) ≈ 53 pm'
    inputs: {}
    formula: 1.054571817e-34/(9.1093837e-31*2.99792458e8/137.036)*1e12
    expected: '53'
    shown: ['a_0 = \frac{\hbar^2}{me^2} \approx 53\ \text{pm}', 'a_0 = \hbar^2/(me^2) \approx 53$ pm']
    source: {cite: reading5, at: 'eq. (2.1.2)'}
    origin: mit

  - id: ground-state
    where: 'eq. (2.1.6): E1 = −½α²mc² ≈ −13.6 eV'
    inputs: {}
    formula: -0.5*510999/137.036**2
    expected: '-13.6'
    shown: ['about $-13.6$ eV for the ground state', '= 13.6$ eV is hydrogen']
    source: {cite: reading5, at: 'eqs. (2.1.3), (2.1.6)'}
    origin: mit

  - id: alpha
    where: 'eq. (2.1.4): α = e²/(ħc) ≈ 1/137'
    inputs: {}
    formula: 137.036
    expected: '137'
    shown: ['\alpha = \frac{e^2}{\hbar c} \approx \frac{1}{137}', 'or $c/137$: slow enough']
    source: {cite: reading5, at: 'eq. (2.1.4)'}
    origin: mit

  - id: alpha-squared
    where: 'after eq. (2.1.5): α² ≈ 1/19,000 (137.036² = 18779)'
    inputs: {}
    formula: 137.036**2
    expected: '19000'
    shown: ['\alpha^2 \approx 1/19{,}000$ below the electron', '\alpha^2 \approx 1/19{,}000$ below the levels themselves', 'about 19,000 times smaller']
    source: {cite: reading5, at: 'after eq. (2.1.5)'}
    origin: mit

  - id: energy-unit
    kind: identity
    where: 'eq. (2.1.5): e²/a0 = me⁴/ħ² = α²mc² (with a0 = ħ²/(me²), α = e²/(ħc))'
    formula: e2/(h**2/(m*e2))
    equals: (e2/(h*c))**2*m*c**2
    samples: {e2: [1.3, 2.1], h: [0.7, 1.9], m: [0.5, 3.0], c: [2.0, 5.0]}
    tolerance: 1e-12
    shown: ['$e^2/a_0 = me^4/\hbar^2 = \alpha^2mc^2$']
    source: {cite: reading5, at: 'eq. (2.1.5)'}
    origin: mit

  - id: momentum
    kind: identity
    where: 'eq. (2.1.7): ħ/a0 = me²/ħ = αmc'
    formula: h/(h**2/(m*e2))
    equals: (e2/(h*c))*m*c
    samples: {e2: [1.3, 2.1], h: [0.7, 1.9], m: [0.5, 3.0], c: [2.0, 5.0]}
    tolerance: 1e-12
    shown: ['p \sim \frac{\hbar}{a_0} = \frac{me^2}{\hbar} = \alpha\,mc']
    source: {cite: reading5, at: 'eq. (2.1.7)'}
    origin: mit

  - id: degeneracy-n3
    where: 'after eq. (2.1.9): sum of (2l + 1) for l = 0..n−1 equals n² (n = 3: 1 + 3 + 5 = 9)'
    inputs: {}
    formula: 1 + 3 + 5
    expected: '9'
    tolerance: 1e-12
    shown: ['"9: $3S$, $3P$ and $3D$"', 'There are $n^2 = 9$ orbital states']
    source: {cite: reading5, at: 'after eq. (2.1.9)'}
    origin: page-own

  - id: states-n3
    where: 'quiz 1: 3S1/2 (2) + 3P1/2 (2) + 3P3/2 (4) + 3D3/2 (4) + 3D5/2 (6) = 18 = 2n²'
    inputs: {}
    formula: 2 + 2 + 4 + 4 + 6
    expected: '18'
    tolerance: 1e-12
    shown: ['$2 + 2 + 4 + 4 + 6 = 18$', 'so 18']
    source: {cite: reading5, at: 'diagram after eq. (2.1.20)'}
    origin: page-own

  - id: quiz-wrong-12
    where: 'quiz 1 distractor "12": not 2 × 6; the right count is 2n² = 18'
    inputs: {}
    formula: 2*3**2
    expected: '18'
    tolerance: 1e-12
    shown: ['"12: two states for each $l$ and $m$"']
    source: {cite: reading5, at: 'after eq. (2.1.9)'}
    origin: page-own

  - id: states-n2
    where: 'coupled basis at n = 2: 2S1/2 (2) + 2P1/2 (2) + 2P3/2 (4) = 8 = 2n²'
    inputs: {}
    formula: 2 + 2 + 4
    expected: '8'
    tolerance: 1e-12
    shown: ['$2 + 2 + 4 = 8 = 2n^2$']
    source: {cite: reading5, at: 'diagram after eq. (2.1.20)'}
    origin: mit

  - id: relativistic-expansion
    kind: identity
    where: 'eq. (2.3.4): √(p²c² + m²c⁴) = mc² + p²/2m − p⁴/(8m³c²) + O(p⁶), checked at small p'
    formula: sqrt(p**2*c**2 + m**2*c**4)
    equals: m*c**2 + p**2/(2*m) - p**4/(8*m**3*c**2)
    samples: {p: [0.001, 0.002], m: [1.0, 2.0], c: [1.0, 3.0]}
    tolerance: 1e-14
    shown: ['= mc^2 + \frac{\hat p^2}{2m} - \frac{\hat p^4}{8m^3c^2} + \dots']
    source: {cite: reading5, at: 'eq. (2.3.4)'}
    origin: mit

  - id: hydrogen-fs-scale
    where: 'example (b): α⁴mc² for hydrogen'
    inputs: {}
    formula: 510999/137.036**4
    expected: '0.00145'
    shown: ['\alpha^4mc^2 \approx 0.00145$ eV']
    source: {cite: reading5, at: 'eqs. (2.3.15), (2.3.18), (2.3.20)'}
    origin: page-own

  - id: heplus-fs-scale
    where: 'example (b): (2α)⁴mc² for He⁺'
    inputs: {}
    formula: 16*510999/137.036**4
    expected: '0.0232'
    shown: ['(2\alpha)^4mc^2 \approx 0.0232$ eV']
    source: {cite: reading5, at: 'eqs. (2.3.15), (2.3.18), (2.3.20)'}
    origin: page-own

  - id: heplus-ratio
    where: 'example (b): Z⁴ = 16'
    inputs: {}
    formula: 2**4
    expected: '16'
    tolerance: 1e-12
    shown: ['16 times larger']
    source: {cite: reading5, at: 'eq. (2.3.14)'}
    origin: page-own

  - id: heplus-E2
    where: 'example (b): He⁺ E2 = −½(2α)²mc²/4 = −½α²mc²'
    inputs: {}
    formula: -0.5*(2/137.036)**2*510999/4
    expected: '-13.6'
    shown: ['= -\frac12\alpha^2mc^2 \approx -13.6$ eV']
    source: {cite: reading5, at: 'eq. (2.1.6)'}
    origin: page-own

  - id: heplus-relative
    where: 'example (b): (Zα)² for He⁺'
    inputs: {}
    formula: (2/137.036)**2
    expected: '2.1e-4'
    shown: ['(Z\alpha)^2 \approx 2.1 \times 10^{-4}$ for He⁺']
    source: {cite: reading5, at: 'eq. (2.3.14)'}
    origin: page-own

  - id: hydrogen-relative
    where: 'example (b): α² for hydrogen'
    inputs: {}
    formula: (1/137.036)**2
    expected: '5.3e-5'
    shown: ['four times hydrogen''s $5.3 \times 10^{-5}$']
    source: {cite: reading5, at: 'eq. (2.3.14)'}
    origin: page-own

  - id: heplus-speed
    where: 'example (b): Zα for He⁺ (speed in units of c)'
    inputs: {}
    formula: 2/137.036
    expected: '0.015'
    shown: ['Z\alpha c \approx 0.015c']
    source: {cite: reading5, at: 'eq. (2.1.7)'}
    origin: page-own

  - id: heavy-atom
    where: 'example (b): for Z near 80, Zα ≈ 0.58: inner electrons are relativistic'
    inputs: {}
    formula: 80/137.036
    expected: '0.58'
    shown: ['and $Z$ near 80, relativity is no longer a small correction']
    source: {cite: reading5, at: 'eq. (2.1.7)'}
    origin: page-own

  - id: binding-temperature
    where: 'callout: 13.6 eV / k ≈ 158,000 K, the temperature at which kT = 13.6 eV'
    inputs: {}
    formula: 13.6057/8.617333e-5
    expected: '158000'
    shown: ['far below the 158,000 K']
    source: {cite: reading5, at: 'eq. (2.1.6)'}
    origin: page-own

  - id: recombination-temperature
    kind: fact
    where: 'callout: recombination at about 4,000 K, as on the 8.286 page temperature-and-decoupling (Guth, 8.286 Lecture 17)'
    value: '4000'
    shown: ['cooled to about 4,000 K, in Guth']
    source: {cite: guth17, at: 'recombination at about 4,000 K'}
    origin: page-own

  - id: photons-per-atom
    kind: fact
    where: 'callout: photons outnumber atoms by more than a billion to one: 1/η = 2 × 10⁹ for 8.902''s fiducial η ≈ 5 × 10⁻¹⁰'
    value: '1e9'
    shown: ['Photons outnumber atoms by more than a billion to one']
    source: {cite: vogelsberger20, at: 'eq. (489), p. 111'}
    origin: page-own

  - id: photons-per-baryon
    where: 'callout: 1/η for η = 5 × 10⁻¹⁰ is 2 × 10⁹, more than a billion'
    inputs: {}
    formula: 1/5e-10
    expected: '2e9'
    shown: ['by more than a billion to one (8.902']
    source: {cite: vogelsberger20, at: 'eq. (489), p. 111'}
    origin: page-own

  - id: eta-quoted
    kind: fact
    where: 'callout: 8.902''s fiducial baryon-to-photon ratio'
    value: '5e-10'
    shown: ['baryon-to-photon ratio of about $5 \times 10^{-10}$']
    source: {cite: vogelsberger20, at: 'eq. (489), p. 111'}
    origin: page-own
