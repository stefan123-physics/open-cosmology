# Calculations on content/year-3/8.06/identical-particles-exchange-degeneracy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 22 transcript L22.4 and lecture notes chapter 8
# ("Identical particles"), pp. 151-153, eqs. (8.1.1), (8.2.1)-(8.2.4).
# Spin kets in the z basis: |+> = (1, 0), |-> = (0, 1); |+,x> = (|+> + |->)/sqrt2.
# Two-spin product basis order: ++, +-, -+, --. |psi> = alpha |+-> + beta |-+> has components (0, alpha, beta, 0);
# |psi0> = |+,x>|+,x> has components (1/2, 1/2, 1/2, 1/2). The harness has no complex numbers, so complex alpha, beta
# are handled through real and imaginary parts (a1 + i a2, b1 + i b2).

page: content/year-3/8.06/identical-particles-exchange-degeneracy.mdx
calcs:
  - id: psi0-expansion
    kind: value
    where: 'eq. (8.2.3): each component of (1/√2)(1, 1) ⊗ (1/√2)(1, 1) is 1/2'
    inputs: {}
    formula: (1/sqrt(2))*(1/sqrt(2))
    expected: '0.5'
    shown: ['= \frac12\left(|+\rangle\otimes|+\rangle + |+\rangle\otimes|-\rangle']
    source: {cite: reading2, at: 'eq. (8.2.3), p. 153'}
    origin: mit

  - id: overlap
    kind: identity
    where: 'eq. (8.2.4): <psi0|psi> = (1/2)(0) + (1/2)α + (1/2)β + (1/2)(0) = (α + β)/2 (real α, β)'
    formula: 0.5*0 + 0.5*al + 0.5*be + 0.5*0
    equals: (al + be)/2
    samples: {al: [0.6, 0.3, -0.5], be: [0.8, -0.9, 0.2]}
    tolerance: 1e-12
    shown: ['$\langle\psi_0|\psi\rangle = \frac12(\alpha + \beta)$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: mit

  - id: probability-expanded
    kind: identity
    where: 'page: |(α + β)/2|² = 1/4 + (1/2) Re(α β*) when |α|² + |β|² = 1; α = a1 + i a2, β = b1 + i b2 with a2 fixed by normalization'
    formula: ((a1 + b1)**2 + (sqrt(1 - a1**2 - b1**2 - b2**2) + b2)**2)/4
    equals: 0.25 + 0.5*(a1*b1 + sqrt(1 - a1**2 - b1**2 - b2**2)*b2)
    samples: {a1: [0.3, -0.2, 0.5], b1: [0.4, 0.6, -0.1], b2: [0.5, -0.3, 0.2]}
    tolerance: 1e-12
    shown: ['so the probability is $\frac14$ plus half the real part of $\alpha\beta^*$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: lecture-slip
    kind: value
    where: 'lecture slip (L22.4 p. 5): "1/2 + Re(α β*)" would give 1 for α = β = 1/√2, but the probability is |(α + β)/2|² = 1/2'
    inputs: {}
    formula: ((1/sqrt(2) + 1/sqrt(2))/2)**2
    expected: '0.5'
    shown: ['[The lecture squares only the $\alpha + \beta$ and not the $\frac12$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: range-min
    kind: value
    where: 'page: probability 0 for β = −α'
    inputs: {}
    formula: ((0.6 - 0.6)/2)**2
    expected: '0'
    shown: ['from 0, for $\beta = -\alpha$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: range-max
    kind: value
    where: 'page and flashcard: maximum 1/2 for β = α = 1/√2 (by Cauchy-Schwarz |α + β|² ≤ 2(|α|² + |β|²) = 2)'
    inputs: {}
    formula: 2*(1/sqrt(2))**2*2/4
    expected: '0.5'
    shown: ['to $\frac12$, for $\beta = \alpha$', 'from 0 (for $\\beta = -\\alpha$) to ½ (for $\\beta = \\alpha$)', 'which ranges from 0 to $\frac12$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: max-is-max
    kind: identity
    where: 'page: for real normalized α = cos t, β = sin t, |α + β|²/4 = (1 + sin 2t)/4 ≤ 1/2'
    formula: (cos(t) + sin(t))**2/4
    equals: (1 + sin(2*t))/4
    samples: {t: [0.2, 0.785398, 2.0, 4.0]}
    tolerance: 1e-12
    shown: ['the largest possible value']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  # ---------------------------------------------------------------- worked example
  - id: ex-a-1
    kind: value
    where: 'example (a): (α, β) = (0.6, 0.8): (1.4)²/4'
    inputs: {}
    formula: (0.6 + 0.8)**2/4
    expected: '0.49'
    shown: ['$\frac14(1.4)^2 = 0.49$', 'With $\\beta = +0.8$ it would be 0.49']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: ex-a-2
    kind: value
    where: 'example (a) and quiz 3: (0.6, −0.8): (0.2)²/4'
    inputs: {}
    formula: (0.6 - 0.8)**2/4
    expected: '0.01'
    shown: ['$\frac14(0.2)^2 = 0.01$', 'so the probability is $|{-0.1}|^2 = 0.01$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: quiz-overlap
    kind: value
    where: 'quiz 3: (α + β)/2 with α = 0.6, β = −0.8'
    inputs: {}
    formula: (0.6 - 0.8)/2
    expected: '-0.1'
    shown: ['$\\frac12(\\alpha + \\beta) = -0.1$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: ex-normalized
    kind: value
    where: 'example (a): 0.6² + 0.8² = 1, so all three pairs with 0.6 and ±0.8 or 0.8i are normalized'
    inputs: {}
    formula: 0.6**2 + 0.8**2
    expected: '1'
    shown: ['$|0.6 + 0.8i|^2 = 0.36 + 0.64 = 1$']
    source: {cite: reading2, at: 'eq. (8.2.2), p. 152'}
    origin: page-own

  - id: ex-a-3
    kind: value
    where: 'example (a): (0.6, 0.8i): |0.6 + 0.8i|²/4'
    inputs: {}
    formula: (0.6**2 + 0.8**2)/4
    expected: '0.25'
    shown: ['so 0.25']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: ex-a-4
    kind: value
    where: 'example (a): α = β = 1/√2: |√2|²/4'
    inputs: {}
    formula: (2/sqrt(2))**2/4
    expected: '0.5'
    shown: ['$\frac14 \times 2 = 0.5$']
    source: {cite: reading2, at: 'eq. (8.2.4), p. 153'}
    origin: page-own

  - id: ex-b
    kind: value
    where: 'example (b): <++|psi> = 0·1 + α·0 + β·0 + 0·0 = 0'
    inputs: {}
    formula: 1*0 + 0*0.6 + 0*0.8 + 0*0
    expected: '0'
    shown: ['so the probability is 0 for every choice']
    source: {cite: reading2, at: 'eq. (8.2.1), p. 152'}
    origin: page-own

  - id: ex-c-4
    kind: value
    where: 'example (c): 4! = 4 × 3 × 2 × 1'
    inputs: {}
    formula: 4*3*2*1
    expected: '24'
    shown: ['$4! = 24$ kets']
    source: {cite: reading2, at: 'p. 153'}
    origin: page-own

  - id: ex-c-3
    kind: value
    where: 'example (c): two up, one down: 3!/2! = 3'
    inputs: {}
    formula: (3*2*1)/(2*1)
    expected: '3'
    shown: ['three kets, which is $3!/2!$']
    source: {cite: reading2, at: 'p. 153'}
    origin: page-own

  - id: three-particles
    kind: value
    where: 'notes p. 153 and quiz 4: three particles in three different states give 3! = 6 kets'
    inputs: {}
    formula: 3*2*1
    expected: '6'
    shown: ['can be written in six ways', '$3! = 6$ orderings']
    source: {cite: reading2, at: 'p. 153'}
    origin: mit

  - id: fermion-factor
    kind: fact
    where: 'callout: fermions weighted by 7/8 relative to photons (8.286 Lecture 17, page neutrinos-and-particle-counting)'
    value: '7/8'
    shown: ['with fermions weighted by 7/8 relative to photons']
    source: {cite: guth-l17, at: 'fermion factor 7/8'}
    origin: page-own
