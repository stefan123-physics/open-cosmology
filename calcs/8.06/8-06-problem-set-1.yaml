  # 2s: |ψ200(0)|² = 1/(8π a0³), so the coefficient of e²R²/a0³ is (1/2) ∫ (s − 3s²/2 + s⁴/2) ds = 1/20.
  - id: p5-2s
    where: 'Problem 5(c), check (our addition): the coefficient 1/20 of e²R²/a0³ for the 2s state'
    formula: (1/2)*integrate('s - 3*s**2/2 + s**4/2', 's', 0, 1)
    expected: '0.05'
    tolerance: 1e-9
    shown: ['$\Delta E_{2s} = \frac{e^2R^2}{20\,a_0^3}$']
    source: {cite: mit, at: 'Problem 5(c), p. 5 (our own addition)'}
    origin: page-own

  # 2p: the radial density near the centre is r²/(24 a0⁵) (times r² dr), so the coefficient of e²R⁴/a0⁵ is
  # (1/24) ∫ s⁴ (1/s − 3/2 + s²/2) ds = 1/1120 = 8.92857e-4.
  - id: p5-2p
    where: 'Problem 5(c), check (our addition): the coefficient 1/1120 of e²R⁴/a0⁵ for a 2p state'
    formula: (1/24)*integrate('s**3 - 3*s**4/2 + s**6/2', 's', 0, 1) - 1/1120
    expected: '0'
    tolerance: 1e-12
    shown: ['$\Delta E_{2p} = \frac{e^2R^4}{1120\,a_0^5}$']
    source: {cite: mit, at: 'Problem 5(c), p. 5 (our own addition)'}
    origin: page-own

  # The ratio with the full 2s and 2p wavefunctions (exponentials and the factor (1 − r/2a0)² kept), s = r/R:
  # 2p: (ρ⁴/24) ∫ e^(−ρs) (s³ − 3s⁴/2 + s⁶/2) ds; 2s: (ρ²/2) ∫ (1 − ρs/2)² e^(−ρs) (s − 3s²/2 + s⁴/2) ds; ρ = R/a0.
  - id: p5-2p-2s
    where: 'Problem 5(c), check (our addition): the ratio of the 2p and 2s shifts with the full wavefunctions, in units of 1e-12'
    formula: 1e12*((1e-13/0.529177e-8)**4/24*integrate('exp(-(1e-13/0.529177e-8)*s)*(s**3 - 3*s**4/2 + s**6/2)', 's', 0, 1))/((1e-13/0.529177e-8)**2/2*integrate('(1 - (1e-13/0.529177e-8)*s/2)**2*exp(-(1e-13/0.529177e-8)*s)*(s - 3*s**2/2 + s**4/2)', 's', 0, 1))
    expected: '6.4'
    shown: ['$\frac{1}{56}\left(R/a_0\right)^2 = 6.4\times 10^{-12}$']
    source: {cite: mit, at: 'Problem 5(c), p. 5 (our own addition)'}
    origin: page-own

  - id: p5-mu
    answer: p5-mu
    where: 'Problem 5(d), answer box: the square of MIT''s mass ratio, in units of 1e4'
