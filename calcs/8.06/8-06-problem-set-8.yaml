# Calculations on content/year-3/8.06/8-06-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates the geometric phase of a test state numerically for two choices of phase; Problem 2 builds
# |f|² from the real and imaginary parts and integrates it over all directions (which also tests the optical theorem);
# Problem 3 checks the matching condition with the answer put in, takes the scattering length as a numerical limit,
# solves the bound-state condition numerically and compares the cross section near threshold with the exact one;
# Problem 4 checks the jump of the slope with the answer put in; Problem 5 integrates the Born integral and the cross
# section numerically, compares with the classical Rutherford orbit, and recomputes the gold-foil numbers with units;
# Problem 6 tests the Green's function by numerical derivatives, and takes the delta function as the limit of a narrow
# Gaussian (Born) and of a narrow square well (exact).
# Constants (CODATA 2018): e = 1.602176634e-19 C, N_A = 6.02214076e23 1/mol, eps0 = 8.8541878128e-12 F/m.
# Gold (NIST): density 19.32 g/cm3, atomic weight 196.966569, rounded to 196.97.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

