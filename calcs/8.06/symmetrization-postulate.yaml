# Calculations on content/year-3/8.06/symmetrization-postulate.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 24 transcripts L24.1-L24.4 and lecture notes chapter 8
# ("Identical particles"), pp. 158-164, eqs. (8.2.34)-(8.4.10).
# Convention (as on permutation-operators): P_alpha |x_1 ... x_N> = |x_alpha(1) ... x_alpha(N)>.
# The permutation results of the worked example were checked by acting on lists of letters:
#   on aab: P123, P213 -> aab; P231, P132 -> aba; P312, P321 -> baa;
#   on abc: P312 -> cab, P231 -> bca (even); P132 -> acb, P213 -> bac, P321 -> cba (odd);
# and the six terms of the 3x3 determinant with rows phi, chi, omega and columns particles 1, 2, 3 were matched
# to these (diagonal = identity). The harness has no permutations, so only their numerical consequences are stored.
# Kets |a>, |b>, |c> orthonormal, so different product kets are orthonormal and squared norms are sums of squares.

page: content/year-3/8.06/symmetrization-postulate.mdx
calcs:
  - id: s3-sign-sum
    kind: value
    where: 'AS = 0: the sum of the signs over S_3, three even (+1) and three odd (-1) permutations'
    inputs: {}
    formula: 1 + 1 + 1 - 1 - 1 - 1
    expected: '0'
    shown: ['The sum of the signs vanishes because the symmetric group has as many even permutations as odd ones']
    source: {cite: reading5, at: 'eq. (8.2.43), p. 159'}
    origin: mit

  - id: s-plus-a-three
    kind: value
    where: 'S + A for three particles: the even terms appear with 1/6 + 1/6 = 1/3, the odd ones cancel'
    inputs: {}
    formula: 1/6 + 1/6
    expected: '1/3'
    shown: ['S + A = \frac13\left(1 + P_{312} + P_{231}\right)" cite="reading5"']
    source: {cite: reading5, at: 'eq. (8.2.49), p. 160'}
    origin: mit

  - id: s-plus-a-two
    kind: identity
    where: 'two particles: S + A = (1/2)(1 + p) + (1/2)(1 - p) = 1 for either eigenvalue p = ±1 of P21 (and as operators)'
    formula: 0.5*(1 + pv) + 0.5*(1 - pv)
    equals: 1
    samples: {pv: [1, -1, 0.3]}
    tolerance: 1e-12
    shown: ['and $S + A = 1$ (L24.2 transcript p. 4']
    source: {cite: reading2, at: 'p. 4'}
    origin: mit

  - id: hydrogen-sign
    kind: value
    where: 'comment 4: exchanging two hydrogen atoms exchanges two protons and two electrons, (-1)(-1)'
    inputs: {}
    formula: (-1)*(-1)
    expected: '1'
    shown: ['$(-1) \times (-1) = +1$']
    source: {cite: reading3, at: 'p. 3'}
    origin: mit

  - id: vu-aab-dim
    kind: value
    where: 'comment 5: |a a b> has 3!/2! = 3 different permutations (aab, baa, aba)'
    inputs: {}
    formula: (3*2*1)/(2*1)
    expected: '3'
    shown: ['so $V_u$ has dimension 3']
    source: {cite: reading4, at: 'p. 2'}
    origin: mit

  # ---------------------------------------------------------------- worked example
  - id: ex-a-coeff
    kind: value
    where: 'example (a): each of the three kets appears twice among the six terms of S, coefficient 2/6'
    inputs: {}
    formula: 2/6
    expected: '1/3'
    shown: ['= \frac26\left(|a\,a\,b\rangle']
    source: {cite: reading5, at: 'eq. (8.2.47), p. 160'}
    origin: page-own

  - id: ex-a-norm
    kind: value
    where: 'example (a): squared norm of S|aab> = 3 × (1/3)²'
    inputs: {}
    formula: 3*(1/3)**2
    expected: '1/3'
    shown: ['$3 \times \frac19 = \frac13$']
    source: {cite: reading5, at: 'eq. (8.2.47), p. 160'}
    origin: page-own

  - id: ex-a-normalized
    kind: value
    where: 'example (a): normalized symmetric state, coefficient (1/3)/sqrt(1/3) = 1/sqrt(3); its squared norm 3 × (1/sqrt3)² = 1'
    inputs: {}
    formula: 3*((1/3)/(1/3)**0.5)**2
    expected: '1'
    shown: ['$\frac{1}{\sqrt3}\left(|a\,a\,b\rangle']
    source: {cite: reading5, at: 'eq. (8.4.5), p. 164'}
    origin: page-own

  - id: ex-a-anti
    kind: value
    where: 'example (a): in A|aab> each ket appears once with +1/6 and once with -1/6'
    inputs: {}
    formula: 1/6 - 1/6
    expected: '0'
    shown: ['so $A|a\,a\,b\rangle = 0$']
    source: {cite: reading4, at: 'p. 2'}
    origin: page-own

  - id: ex-b-norm
    kind: value
    where: 'example (b): squared norm of A|abc> = 6 × (1/6)²'
    inputs: {}
    formula: 6*(1/6)**2
    expected: '1/6'
    shown: ['$6 \times \frac{1}{36} = \frac16$']
    source: {cite: reading5, at: 'eq. (8.3.8), p. 162'}
    origin: page-own

  - id: ex-b-normalized
    kind: value
    where: 'example (b): sqrt(6) × 1/6 = 1/sqrt(6), the coefficients of the normalized state'
    inputs: {}
    formula: 6**0.5*(1/6)
    expected: '0.40825'
    shown: ['coefficients $\pm\frac{1}{\sqrt6}$']
    source: {cite: reading5, at: 'eq. (8.4.10), p. 164'}
    origin: page-own

  - id: ex-b-matrix-element
    kind: value
    where: 'example (b): <abc|A|abc> = (1/6) × (sign of the identity) = 1/6, equal to the squared norm since A is a Hermitian projector'
    inputs: {}
    formula: (1/6)*1
    expected: '1/6'
    shown: ['only the identity term contributes to it, giving $\frac16$ again']
    source: {cite: reading5, at: 'eq. (8.2.40), p. 159'}
    origin: page-own

  - id: ex-c-sym2
    kind: value
    where: 'example (c): symmetric states of two particles, d = 3: d(d+1)/2 (3 doubly occupied + 3 singly occupied pairs)'
    inputs: {}
    formula: 3*4/2
    expected: '6'
    shown: ['$3 \times 4/2 = 6$']
    source: {cite: reading5, at: 'eq. (8.4.8), p. 164'}
    origin: page-own

  - id: ex-c-anti2
    kind: value
    where: 'example (c): antisymmetric states of two particles, d = 3: choose 2 of 3, d(d-1)/2'
    inputs: {}
    formula: 3*2/2
    expected: '3'
    shown: ['the three ways to choose 2 of the 3 states']
    source: {cite: reading5, at: 'eq. (8.4.9), p. 164'}
    origin: page-own

  - id: ex-c-total2
    kind: value
    where: 'example (c): 6 + 3 = 9 = 3², the dimension of V ⊗ V'
    inputs: {}
    formula: 6 + 3
    expected: '9'
    shown: ['$6 + 3 = 9 = 3^2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  - id: ex-c-sym3
    kind: value
    where: 'example (c): symmetric states of three particles, d = 3: (3,0,0) 3 ways + (2,1,0) 3·2 = 6 ways + (1,1,1) 1 way = 10 = C(5,3), the number of (n_a, n_b, n_c) >= 0 adding up to 3'
    inputs: {}
    formula: 3 + 3*2 + 1
    expected: '10'
    shown: ['10 in all']
    source: {cite: reading5, at: 'eq. (8.4.8), p. 164'}
    origin: page-own

  - id: ex-c-total3
    kind: value
    where: 'example (c): 10 symmetric + 1 antisymmetric = 11 of the 3³ = 27 dimensions of V⊗V⊗V'
    inputs: {}
    formula: 10 + 1
    expected: '11'
    shown: ['Together $10 + 1 = 11$']
    source: {cite: reading5, at: 'eq. (8.2.50), p. 160'}
    origin: page-own

  - id: ex-c-dim3
    kind: value
    where: 'example (c): dimension of the three-particle space, 3³'
    inputs: {}
    formula: 3**3
    expected: '27'
    shown: ['$3^3 = 27$']
    source: {cite: reading5, at: 'eq. (8.2.50), p. 160'}
    origin: page-own

  - id: ex-c-mixed
    kind: value
    where: 'example (c): 27 - 11 = 16 dimensions of mixed symmetry'
    inputs: {}
    formula: 27 - 11
    expected: '16'
    shown: ['the other 16 dimensions are states of mixed symmetry']
    source: {cite: reading2, at: 'p. 5'}
    origin: page-own

  # ---------------------------------------------------------------- quiz
  - id: quiz-deuterium
    kind: value
    where: 'quiz 3: exchanging two deuterium atoms exchanges three pairs of fermions, (-1)³'
    inputs: {}
    formula: (-1)**3
    expected: '-1'
    shown: ['a factor $(-1)^3 = -1$']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: quiz-hydrogen
    kind: value
    where: 'quiz 3 explanation: hydrogen, two fermions, (-1)²'
    inputs: {}
    formula: (-1)**2
    expected: '1'
    shown: ['$(-1)^2 = +1$']
    source: {cite: reading3, at: 'p. 3'}
    origin: page-own

  - id: quiz-anti-d4
    kind: value
    where: 'quiz 4: two fermions, dim V = 4: choose 2 of 4'
    inputs: {}
    formula: 4*3/2
    expected: '6'
    shown: ['choose 2 of the 4 basis states, $4 \\times 3/2 = 6$']
    source: {cite: reading5, at: 'eq. (8.4.9), p. 164'}
    origin: page-own

  - id: quiz-sym-d4
    kind: value
    where: 'quiz 4: two bosons, dim V = 4: d(d+1)/2'
    inputs: {}
    formula: 4*5/2
    expected: '10'
    shown: ['$4 \\times 5/2 = 10$']
    source: {cite: reading5, at: 'eq. (8.4.8), p. 164'}
    origin: page-own

  - id: quiz-total-d4
    kind: value
    where: 'quiz 4: 6 + 10 = 16 = 4², the dimension of V ⊗ V'
    inputs: {}
    formula: 6 + 10
    expected: '16'
    shown: ['$6 + 10 = 16 = 4^2$']
    source: {cite: reading2, at: 'p. 4'}
    origin: page-own

  # ---------------------------------------------------------------- cosmology callout
  - id: fermion-energy-factor
    kind: fact
    where: 'callout: fermion species count 7/8 of a boson species in energy density (8.286 Lecture 17, recomputed on the site page neutrinos-and-particle-counting)'
    value: '7/8'
    shown: ['contributes 7/8 as much energy density']
    source: {cite: guth17, at: 'p. 8 (board)'}
    origin: page-own

  - id: fermion-number-factor
    kind: fact
    where: 'callout: fermion species count 3/4 of a boson species in number density (8.286 Lecture 17)'
    value: '3/4'
    shown: ['and 3/4 as many particles']
    source: {cite: guth17, at: 'p. 8 (board)'}
    origin: page-own
