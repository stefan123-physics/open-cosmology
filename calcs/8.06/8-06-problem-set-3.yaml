# Calculations on content/year-3/8.06/8-06-problem-set-3.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates numerically (the operator applied by numerical differentiation, and the form <p²f|p²g>);
# Problem 2 tests the relation on the three-dimensional oscillator and on explicit 1S, 2S and 3S radial functions;
# Problem 3 repeats the numbers in SI units and through the spin-orbit term alone; Problem 4 uses the ladder
# operators, the Clebsch-Gordan table and the lesson's relativistic and spin-orbit shifts in the uncoupled basis;
# Problem 5 fixes the constant from matrix elements between states of different j.
# Constants (CODATA 2018): 1/alpha = 137.035999084, m_e c² = 0.51099895000 MeV, mu_B = 5.7883818060e-5 eV/T
# = 9.2740100783e-24 J/T, a0 = 5.29177210903e-11 m.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-3/8.06/8-06-problem-set-3.mdx
calcs:
  # ---- How to answer: constants

  - id: intro-constants
    kind: fact
    where: 'How to answer: CODATA 2018 values, rounded (1/alpha = 137.035999084, m_e c² = 0.51099895000 MeV, mu_B = 5.7883818060e-5 eV/T = 9.2740100783e-24 J/T, a0 = 5.29177210903e-11 m)'
    shown: ['$\alpha = 1/137.036$, $mc^2 = 510{,}998.95$ eV for the electron', '$\mu_B = e\hbar/(2mc) = 5.7883818 \times 10^{-9}$ eV/gauss $= 9.2740101 \times 10^{-21}$ erg/gauss', 'and $a_0 = 5.29177 \times 10^{-9}$ cm']
    source: {cite: codata, at: 'inverse fine-structure constant, electron mass energy equivalent in MeV, Bohr magneton in eV/T and in J/T, Bohr radius'}
    origin: later-data

  - id: intro-mub-units
    where: 'How to answer: the Bohr magneton in eV/gauss against its value in erg/gauss (1 eV = 1.602176634e-12 erg, exact)'
    inputs: {mub: '9.2740101e-24 J/T'}
    formula: |-
      mub
    expected: '5.7883818e-5 eV/T'
    tolerance: 1e-11 eV/T
    shown: ['One tesla is $10^4$ gauss.']
    source: {cite: codata, at: 'Bohr magneton in eV/T and in J/T'}
    origin: later-data

  # ---- Problem 1: p² and p⁴ between e^(-qr) and e^(-kr) (q stands for k')

  # p² g = -hbar² (1/r²) d/dr (r² dg/dr), applied by numerical differentiation of r² g'.

  - id: p1-p2
    kind: identity
    answer: p1-p2
    where: 'Problem 1(a), answer box: the operator applied numerically to e^(-kr), then integrated against e^(-qr)'
    formula: |-
      8*pi*hbar**2*k*q/(k+q)**3
    equals: |-
      -4*pi*hbar**2*integrate("exp(-q*x)*deriv('y**2*(-k)*exp(-k*y)', 'y', x)", 'x', 0, 80)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [0.5, 1.3, 2, 0.9, 1.6]
      q: [1.7, 0.6, 1.1, 2, 0.5]
    tolerance: 1e-6
    shown: ['id="p1-p2"', '<Formula label="Matrix element of p² between two exponentials"']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-p2-shared
    kind: identity
    where: 'Problem 1(a), check: the integral both sides share, 4 pi hbar² times the integral of r² f'' g'''
    formula: |-
      4*pi*hbar**2*k*q*2/(k+q)**3
    equals: |-
      4*pi*hbar**2*integrate('x**2*q*exp(-q*x)*k*exp(-k*x)', 'x', 0, 80)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [0.5, 1.3, 2, 0.9, 1.6]
      q: [1.7, 0.6, 1.1, 2, 0.5]
    tolerance: 1e-8
    shown: ['$4\pi\hbar^2\int r^2f''g''\,dr = 4\pi\hbar^2kk''\cdot 2/K^3$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lap1
    kind: identity
    where: 'Problem 1(b), solution: the Laplacian h″ + 2h′/r of e^(-kr), by numerical differentiation'
    formula: |-
      (k**2 - 2*k/r0)*exp(-k*r0)
    equals: |-
      deriv('exp(-k*y)', 'y', r0, 2) + 2/r0*deriv('exp(-k*y)', 'y', r0)
    samples:
      k: [0.5, 1.3, 2, 0.9, 1.6]
      r0: [0.7, 1.9, 0.4, 2.5, 1.1]
    tolerance: 1e-6
    shown: ['<Formula label="The Laplacian of an exponential"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lap2
    kind: identity
    where: 'Problem 1(b), statement and solution: the Laplacian applied twice, away from the origin (numerical Laplacian of the first result)'
    formula: |-
      (-4*k**3/r0 + k**4)*exp(-k*r0)
    equals: |-
      deriv('(k**2 - 2*k/y)*exp(-k*y)', 'y', r0, 2) + 2/r0*deriv('(k**2 - 2*k/y)*exp(-k*y)', 'y', r0)
    samples:
      k: [0.5, 1.3, 2, 0.9, 1.6]
      r0: [0.7, 1.9, 0.4, 2.5, 1.1]
    tolerance: 1e-6
    shown: ['<Formula label="The Laplacian applied twice to an exponential"', '<Formula label="Adding the two pieces"']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: page-own

  - id: p1-delta
    kind: identity
    where: 'Problem 1(b), solution: the delta function in the Laplacian of e^(-kr)/r, by Gauss: the flux of the gradient through a sphere of radius R equals the volume integral of k² e^(-kr)/r minus 4 pi'
    formula: |-
      4*pi*R**2*deriv('exp(-k*y)/y', 'y', R)
    equals: |-
      4*pi*k**2*integrate('x*exp(-k*x)', 'x', 0, R) - 4*pi
    samples:
      k: [0.5, 1.3, 2, 0.9, 1.6]
      R: [0.7, 1.9, 0.4, 2.5, 1.1]
    tolerance: 1e-6
    shown: ['<Formula label="The Laplacian of the screened 1/r"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-p4
    kind: identity
    answer: p1-p4
    where: 'Problem 1(b), answer box: against the form <p² f|p² g>, integrated numerically'
    formula: |-
      8*pi*hbar**4*k*q*(k**2+3*k*q+q**2)/(k+q)**3
    equals: |-
      4*pi*hbar**4*integrate('x**2*(q**2 - 2*q/x)*(k**2 - 2*k/x)*exp(-(k+q)*x)', 'x', 0, 80)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [0.5, 1.3, 2, 0.9, 1.6]
      q: [1.7, 0.6, 1.1, 2, 0.5]
    tolerance: 1e-7
    shown: ['id="p1-p4"', '<Formula label="Matrix element of p⁴ between two exponentials"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-p4-second
    kind: identity
    where: 'Problem 1(b), check: the closed form of <p² f|p² g> quoted in the solution'
    formula: |-
      4*pi*hbar**4*k*q*(2*k*q + 2*(k+q)**2)/(k+q)**3
    equals: |-
      8*pi*hbar**4*k*q*(k**2+3*k*q+q**2)/(k+q)**3
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [0.5, 1.3, 2, 0.9, 1.6]
      q: [1.7, 0.6, 1.1, 2, 0.5]
    tolerance: 1e-12
    shown: ['$4\pi\hbar^4kk''\left(2kk'' + 2K^2\right)/K^3$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nodelta
    kind: identity
    where: 'Problem 1(b), solution and listed mistake: the result without the delta function, integrated numerically'
    formula: |-
      -8*pi*hbar**4*k**3*(k+2*q)/(k+q)**3
    equals: |-
      4*pi*hbar**4*integrate('x**2*exp(-q*x)*(k**4 - 4*k**3/x)*exp(-k*x)', 'x', 0, 80)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [0.5, 1.3, 2, 0.9, 1.6]
      q: [1.7, 0.6, 1.1, 2, 0.5]
    tolerance: 1e-7
    shown: ['$-8\pi\hbar^4k^3(k + 2k'')/K^3$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-nodelta-diff
    kind: identity
    where: 'Problem 1(b), solution: the result without the delta function differs from the right one by -8 pi k hbar⁴'
    formula: |-
      -8*pi*hbar**4*k**3*(k+2*q)/(k+q)**3 - 8*pi*hbar**4*k*q*(k**2+3*k*q+q**2)/(k+q)**3
    equals: |-
      -8*pi*k*hbar**4
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      k: [0.5, 1.3, 2, 0.9, 1.6]
      q: [1.7, 0.6, 1.1, 2, 0.5]
    tolerance: 1e-10
    shown: ['It differs from the right result by exactly $-8\pi k\hbar^4$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-1s
    answer: p1-1s
    where: 'Problem 1(b), answer box: <p⁴> in the 1S state in units of hbar⁴/a0⁴, as the norm of p² psi integrated numerically (a0 = 1)'
    formula: |-
      (1/pi)*4*pi*integrate('x**2*(1 - 2/x)**2*exp(-2*x)', 'x', 0, 60)
    expected: '5'
    tolerance: 1e-6
    shown: ['id="p1-1s"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-1s-form
    where: 'Problem 1(b), solution: the same from the answer formula with k = q = 1/a0 and the normalization 1/(pi a0³)'
    formula: |-
      (1/pi)*8*pi*1*1*(1+3+1)/(1+1)**3
    expected: '5'
    tolerance: 1e-9
    shown: ['<Formula label="Mean of p⁴ in the ground state"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-rel
    where: 'Problem 1(b), check: the relativistic shift -<p⁴>/(8 m³ c²) = -(5/8) alpha⁴ m c², against the lesson''s formula for n = 1, l = 0'
    formula: |-
      (1/8)*(4*1/(0 + 1/2) - 3)/1**4
    expected: '0.625'
    tolerance: 1e-9
    shown: ['-\frac58\,\alpha^4mc^2$']
    source: {cite: reading1, at: 'eq. (2.4.46)'}
    origin: page-own

  - id: p1-1s-naive
    where: 'Problem 1(b), check: <p⁴> in 1S without the delta function, in units of hbar⁴/a0⁴'
    formula: |-
      (1/pi)*(-8*pi*1*(1+2)/(1+1)**3)
    expected: '-3'
    tolerance: 1e-9
    shown: ['$-3\hbar^4/a_0^4$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: |psi(0)|² = C <dV/dr>

  - id: p2-c
    kind: identity
    answer: p2-c
    where: 'Problem 2(a), answer box: C = |psi(0)|²/<dV/dr> for the ground state of the three-dimensional oscillator, with <r> integrated numerically'
    formula: |-
      m/(2*pi*hbar**2)
    equals: |-
      (m*omega/(pi*hbar))**(3/2)/(m*omega**2*integrate('4*pi*x**3*(m*omega/(pi*hbar))**(3/2)*exp(-m*omega*x**2/hbar)', 'x', 0, 60))
    samples:
      m: [0.5, 1, 1.5, 2, 0.8]
      hbar: [1, 0.5, 2, 1.5, 1.2]
      omega: [1, 2, 0.5, 1.5, 0.7]
    tolerance: 1e-7
    shown: ['id="p2-c"', '<Formula label="The wavefunction at the origin from the slope of the potential"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-osc-r
    kind: identity
    where: 'Problem 2(a), check: the mean radius in the oscillator ground state'
    formula: |-
      2/sqrt(pi)*sqrt(hbar/(m*omega))
    equals: |-
      integrate('4*pi*x**3*(m*omega/(pi*hbar))**(3/2)*exp(-m*omega*x**2/hbar)', 'x', 0, 60)
    samples:
      m: [0.5, 1, 1.5, 2, 0.8]
      hbar: [1, 0.5, 2, 1.5, 1.2]
      omega: [1, 2, 0.5, 1.5, 0.7]
    tolerance: 1e-7
    shown: ['$\langle r\rangle = \frac{2}{\sqrt\pi}\sqrt{\hbar/m\omega}$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-osc-norm
    kind: identity
    where: 'Problem 2(a), check: the oscillator ground state is normalized'
    formula: |-
      1
    equals: |-
      integrate('4*pi*x**2*(m*omega/(pi*hbar))**(3/2)*exp(-m*omega*x**2/hbar)', 'x', 0, 60)
    samples:
      m: [0.5, 1, 1.5, 2, 0.8]
      hbar: [1, 0.5, 2, 1.5, 1.2]
      omega: [1, 2, 0.5, 1.5, 0.7]
    tolerance: 1e-7
    shown: ['$\psi = \left(m\omega/\pi\hbar\right)^{3/4}e^{-m\omega r^2/2\hbar}$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  # Hydrogen in units a0 = 1: u_10 = 2 r e^(-r), u_20 = r (1 - r/2) e^(-r/2)/sqrt 2, u_30 = (2/(3 sqrt 3)) r (1 - 2r/3 + 2r²/27) e^(-r/3).

  # The answer for n = 1, 2, 3 against (1/2 pi) <1/r²> with <1/r²> integrated numerically; the brackets with n pick the integral of that n.

  - id: p2-n
    kind: identity
    answer: p2-n
    where: 'Problem 2(b), answer box: (1/2 pi) <1/r²> from the explicit 1S, 2S and 3S radial functions'
    formula: |-
      1/(pi*n**3)
    equals: |-
      (1/(2*pi))*((n-2)*(n-3)/2*integrate('4*exp(-2*x)', 'x', 0, 80) - (n-1)*(n-3)*integrate('(1/2)*(1 - x/2)**2*exp(-x)', 'x', 0, 120) + (n-1)*(n-2)/2*integrate('(4/27)*(1 - 2*x/3 + 2*x**2/27)**2*exp(-2*x/3)', 'x', 0, 200))
    samples:
      n: [1, 2, 3]
    tolerance: 1e-7
    shown: ['id="p2-n"', '<Formula label="Hydrogen''s S wavefunctions at the origin"']
    source: {cite: reading1, at: 'eq. (2.4.23)'}
    origin: page-own

  - id: p2-n-direct
    kind: identity
    where: 'Problem 2(b), check: the same from the radial functions at the origin, R_n0(0)²/(4 pi) with R_10(0) = 2, R_20(0) = 1/sqrt 2, R_30(0) = 2/(3 sqrt 3)'
    formula: |-
      1/(pi*n**3)
    equals: |-
      ((n-2)*(n-3)/2*2**2 - (n-1)*(n-3)*(1/sqrt(2))**2 + (n-1)*(n-2)/2*(2/(3*sqrt(3)))**2)/(4*pi)
    samples:
      n: [1, 2, 3]
    tolerance: 1e-12
    shown: ['For $n = 1$ this is $1/(\pi a_0^3)$']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own solution)'}
    origin: page-own

  - id: p2-r2
    kind: identity
    where: 'Problem 2(b), statement: <1/r²> = 1/(n³ a0² (l + 1/2)) for l = 0, against the numerical integrals (a0 = 1)'
    formula: |-
      2/n**3
    equals: |-
      (n-2)*(n-3)/2*integrate('4*exp(-2*x)', 'x', 0, 80) - (n-1)*(n-3)*integrate('(1/2)*(1 - x/2)**2*exp(-x)', 'x', 0, 120) + (n-1)*(n-2)/2*integrate('(4/27)*(1 - 2*x/3 + 2*x**2/27)**2*exp(-2*x/3)', 'x', 0, 200)
    samples:
      n: [1, 2, 3]
    tolerance: 1e-7
    shown: ['$\langle 1/r^2\rangle = 2/(n^3a_0^2)$']
    source: {cite: reading1, at: 'eq. (2.4.45)'}
    origin: page-own

  # ---- Problem 3: numbers

  - id: p3-a4
    where: 'Problem 3(i), solution: alpha⁴ m c² in eV'
    inputs: {mc2: 510998.95, ainv: 137.036}
    formula: |-
      mc2/ainv**4
    expected: '1.4490e-3'
    shown: ['= 1.4490 \times 10^{-3}$ eV']
    source: {cite: codata, at: 'inverse fine-structure constant, electron mass energy equivalent in MeV, Bohr magneton in eV/T and in J/T, Bohr radius'}
    origin: later-data

  - id: p3-de
    answer: p3-de
    where: 'Problem 3(i), answer box: the difference of the fine-structure shifts of n = 3, j = 3/2 and j = 1/2, in units of 1e-5 eV'
    inputs: {mc2: 510998.95, ainv: 137.036}
    formula: |-
      mc2/ainv**4*(-(3/(3/2 + 1/2) - 3/4) + (3/(1/2 + 1/2) - 3/4))/(2*3**4)/1e-5
    expected: '1.342'
    shown: ['id="p3-de"', '<Formula label="Splitting of the 3P states"']
    source: {cite: reading1, at: 'eqs. (2.4.62), (2.4.63)'}
    origin: page-own

  - id: p3-de-so
    where: 'Problem 3(i), independent route: the spin-orbit term alone (the relativistic term is the same for both states), 3 e² hbar²/(4 m² c²) <1/r³> = (3/4)(1/81) alpha⁴ m c², in units of 1e-5 eV'
    inputs: {mc2: 510998.95, ainv: 137.036}
    formula: |-
      (3/4)*mc2/ainv**4/(3**3*1*(1 + 1/2)*(1 + 1))/1e-5
    expected: '1.342'
    shown: ['this is $\Delta E = 1.342 \times 10^{-5}$ eV.']
    source: {cite: reading1, at: 'eqs. (2.4.52), (2.4.53)'}
    origin: page-own

  - id: p3-b
    answer: p3-b
    where: 'Problem 3(i), answer box: B = Delta E/(2 mu_B) in gauss'
    inputs: {mc2: 510998.95, ainv: 137.036, mub: 5.7883818e-09}
    formula: |-
      mc2/ainv**4/108/(2*mub)
    expected: '1159'
    shown: ['id="p3-b"', 'this gives $B = 1159$ gauss']
    source: {cite: mit, at: 'Problem 3(i), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-b-si
    where: 'Problem 3(i), independent route in SI units: Delta E in joules over twice the Bohr magneton in J/T'
    inputs: {dE: '1.3417e-5 eV', mub: '9.2740101e-24 J/T'}
    formula: |-
      dE/(2*mub)
    expected: '0.1159 T'
    shown: ['That is 0.1159 tesla']
    source: {cite: mit, at: 'Problem 3(i), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-lesson
    where: 'Problem 3(i), check: scaled from the lesson''s worked example (7,800 gauss where mu_B B matches the n = 2 gap)'
    formula: |-
      7800*(8/27)*(1/2)
    expected: '1160'
    shown: ['$7{,}800 \times \frac{8}{27} \times \frac12 \approx 1{,}160$ gauss']
    source: {cite: mit, at: 'Problem 3(i), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-denominator
    where: 'Problem 3(ii), solution: 81 a0³ in cm³'
    formula: |-
      81*(5.29177e-9)**3
    expected: '1.2003e-23'
    shown: ['= 1.2003 \times 10^{-23}$ cm³']
    source: {cite: codata, at: 'Bohr radius'}
    origin: later-data

  - id: p3-bint
    answer: p3-bint
    where: 'Problem 3(ii), answer box: 2 mu_B/(81 a0³) in Gaussian units (erg/gauss over cm³ = gauss)'
    formula: |-
      2*9.2740101e-21/(81*(5.29177e-9)**3)
    expected: '1545'
    shown: ['id="p3-bint"', 'so $B_\text{int} \approx 1545$ gauss']
    source: {cite: mit, at: 'Problem 3(ii), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-bint-si
    where: 'Problem 3(ii), independent route in SI units: (mu0/4 pi) 2 mu_B/(81 a0³), with mu0/4 pi = 1e-7 T m/A'
    inputs: {km: '1e-7 T*m/A', mub: '9.2740101e-24 J/T', a0: '5.29177e-11 m'}
    formula: |-
      km*2*mub/(81*a0**3)
    expected: '0.1545 T'
    shown: ['<Formula label="Internal magnetic field in the 3P states"']
    source: {cite: mit, at: 'Problem 3(ii), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-ratio
    where: 'Problem 3(ii), check: the field of part (i) over the internal field is 3/4 (eV/gauss and erg/gauss values, 1 eV = 1.602176634e-12 erg)'
    inputs: {mc2: 510998.95, ainv: 137.036, mubev: 5.7883818e-09, muberg: 9.2740101e-21, a0: 5.29177e-09, everg: 1.602176634e-12}
    formula: |-
      (mc2/ainv**4/108/(2*mubev))/(2*muberg/(81*a0**3))
    expected: '0.75'
    tolerance: 1e-4
    shown: ['$0.75 \times 1545 = 1159$ gauss']
    source: {cite: mit, at: 'Problem 3(ii), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-ratio-exact
    where: 'Problem 3(ii), check: Delta E = (3/2) mu_B B_int, in units of alpha⁴ m c² (mu_B B_int = alpha⁴ m c²/(2·81), Delta E = alpha⁴ m c²/108)'
    formula: |-
      (1/108)/((3/2)*(1/(2*81)))
    expected: '1'
    tolerance: 1e-12
    shown: ['\Delta E = \frac{3e^2\hbar^2}{4m^2c^2}\langle 1/r^3\rangle = \frac32\,\mu_BB_\text{int}']
    source: {cite: reading1, at: 'eqs. (2.4.52), (2.4.53)'}
    origin: page-own

  - id: p3-sqrt2
    where: 'Problem 3(ii), check: the estimate with |L| = sqrt 2 hbar'
    formula: |-
      sqrt(2)*2*9.2740101e-21/(81*(5.29177e-9)**3)
    expected: '2185'
    shown: ['the estimate would be 2185 gauss']
    source: {cite: mit, at: 'Problem 3(ii), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 4

  - id: p4-ls-plus
    kind: identity
    where: 'Problem 4(a), solution: the eigenvalue of L·S/hbar² for j = l + 1/2'
    formula: |-
      l/2
    equals: |-
      ((l + 1/2)*(l + 3/2) - l*(l + 1) - 3/4)/2
    samples:
      l: [0, 1, 2, 3, 5]
    tolerance: 1e-12
    shown: ['<Formula label="Eigenvalues of L·S"']
    source: {cite: reading1, at: 'eq. (2.4.52)'}
    origin: page-own

  - id: p4-ls-minus
    kind: identity
    where: 'Problem 4(a), solution: the eigenvalue of L·S/hbar² for j = l − 1/2'
    formula: |-
      -(l + 1)/2
    equals: |-
      ((l - 1/2)*(l + 1/2) - l*(l + 1) - 3/4)/2
    samples:
      l: [1, 2, 3, 4, 5]
    tolerance: 1e-12
    shown: ['-\frac{\hbar^2}{2}\,(l + 1) & j = l - \frac12']
    source: {cite: reading1, at: 'eq. (2.4.52)'}
    origin: page-own

  - id: p4-ls-v
    kind: identity
    where: 'Problem 4(a), set (v): L·S/hbar² for l = j − 1/2 and for l = j + 1/2'
    formula: |-
      (j - 1/2)/2 - (-(j + 3/2)/2)
    equals: |-
      (j*(j + 1) - (j - 1/2)*(j + 1/2) - 3/4)/2 - (j*(j + 1) - (j + 1/2)*(j + 3/2) - 3/4)/2
    samples:
      j: [0.5, 1.5, 2.5, 3.5, 4.5]
    tolerance: 1e-12
    shown: ['$\vec L\cdot\vec S = \frac{\hbar^2}{2}\left(j - \frac12\right)$ and $-\frac{\hbar^2}{2}\left(j + \frac32\right)$']
    source: {cite: reading1, at: 'eq. (2.4.52)'}
    origin: page-own

  - id: p4-j2
    kind: identity
    answer: p4-j2
    where: 'Problem 4(b)(i), answer box: <J²>/hbar² from J² = J−J+ + Jz² + hbar Jz, with <J−J+> the squared norm of (L+ + S+) on the uncoupled state'
    formula: |-
      l*(l+1)+3/4+2*ml*ms
    equals: |-
      (l*(l + 1) - ml*(ml + 1)) + (3/4 - ms*(ms + 1)) + (ml + ms)**2 + (ml + ms)
    samples:
      l: [1, 2, 3, 2, 4]
      ml: [1, -2, 0, 2, -3]
      ms: [0.5, -0.5, 0.5, -0.5, 0.5]
    tolerance: 1e-12
    shown: ['id="p4-j2"', '<Formula label="Mean of J² in an uncoupled state"']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-pp
    kind: identity
    answer: p4-pp
    where: 'Problem 4(b)(i), answer box: the squared Clebsch-Gordan coefficient (l + 1/2 ± m_j)/(2l + 1) for m_s = ±1/2, with m_j = m_l + m_s'
    formula: |-
      (l+1+2*ml*ms)/(2*l+1)
    equals: |-
      (l + 1/2 + 2*ms*(ml + ms))/(2*l + 1)
    samples:
      l: [1, 2, 3, 2, 4]
      ml: [1, -2, 0, 2, -3]
      ms: [0.5, -0.5, 0.5, -0.5, 0.5]
    tolerance: 1e-12
    shown: ['id="p4-pp"', '<Formula label="Probabilities of the two values of j"']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-inv
    kind: identity
    answer: p4-inv
    where: 'Problem 4(b)(i), answer box: from the lesson''s relativistic and spin-orbit shifts taken directly in the uncoupled state (<L·S> = hbar² m_l m_s): 1/(l + 1/2) − m_l m_s/(l (l + 1/2)(l + 1))'
    formula: |-
      (l*(l+1)-ml*ms)/(l*(l+1/2)*(l+1))
    equals: |-
      1/(l + 1/2) - ml*ms/(l*(l + 1/2)*(l + 1))
    samples:
      l: [1, 2, 3, 2, 4]
      ml: [1, -2, 0.3, 2, -3]
      ms: [0.5, -0.5, 0.5, -0.2, 0.5]
    tolerance: 1e-12
    shown: ['id="p4-inv"', '<Formula label="Mean of 1/(j + ½) in an uncoupled state"']
    source: {cite: reading1, at: 'eqs. (2.4.46), (2.4.52), (2.4.53)'}
    origin: page-own

  - id: p4-inv-weights
    kind: identity
    where: 'Problem 4(b)(i), solution: the same from the Clebsch-Gordan weights, P+/(l + 1) + P−/l'
    formula: |-
      (l*(l+1)-ml*ms)/(l*(l+1/2)*(l+1))
    equals: |-
      ((l + 1/2 + 2*ms*(ml + ms))/(2*l + 1))/(l + 1) + (1 - (l + 1/2 + 2*ms*(ml + ms))/(2*l + 1))/l
    samples:
      l: [1, 2, 3, 2, 4]
      ml: [1, -2, 0, 2, -3]
      ms: [0.5, -0.5, 0.5, -0.5, 0.5]
    tolerance: 1e-12
    shown: ['\frac{P_+}{l + 1} + \frac{P_-}{l} = \frac{l\left(l + 1 + 2m_lm_s\right)']
    source: {cite: mit, at: 'Problem 4(b)(i), eqs. (1) and (2), p. 3'}
    origin: page-own

  - id: p4-efs
    kind: identity
    where: 'Problem 4(b)(i), solution: the strong-field fine-structure shift in units of alpha⁴ m c², against the relativistic shift plus the spin-orbit shift of the uncoupled state'
    formula: |-
      (1/(2*n**3))*(3/(4*n) - (l*(l+1) - ml*ms)/(l*(l + 1/2)*(l + 1)))
    equals: |-
      -(1/(8*n**4))*(4*n/(l + 1/2) - 3) + ml*ms/(2*n**3*l*(l + 1/2)*(l + 1))
    samples:
      n: [2, 3, 4, 3, 5]
      l: [1, 2, 3, 1, 4]
      ml: [1, -2, 0, -1, -3]
      ms: [0.5, -0.5, 0.5, -0.5, 0.5]
    tolerance: 1e-12
    shown: ['<Formula label="Fine-structure shift in a strong field"']
    source: {cite: reading1, at: 'eqs. (2.4.46), (2.4.52), (2.4.53)'}
    origin: page-own

  - id: p4-n2
    answer: p4-n2
    where: 'Problem 4(b)(i), answer box: one third of the 2P3/2 shift plus two thirds of the 2P1/2 shift (the lesson''s coupled energies), in units of alpha⁴ m c²'
    formula: |-
      (1/3)*(-(1/(2*2**4))*(2/(3/2 + 1/2) - 3/4)) + (2/3)*(-(1/(2*2**4))*(2/(1/2 + 1/2) - 3/4))
    expected: '-0.02865'
    shown: ['id="p4-n2"', '-\frac{11}{384}\,\alpha^4mc^2 = -0.02865\,\alpha^4mc^2$']
    source: {cite: reading1, at: 'eqs. (2.4.62), (2.4.63)'}
    origin: page-own

  - id: p4-n2-formula
    where: 'Problem 4(b)(i), solution: the same from the strong-field formula with n = 2, l = 1, m_l m_s = −1/2'
    formula: |-
      (1/(2*2**3))*(3/(4*2) - (1*2 + 1/2)/(1*(1 + 1/2)*2))
    expected: '-0.02865'
    shown: ['$\frac{1}{16}\left(\frac38 - \frac56\right)\alpha^4mc^2']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-n2-384
    where: 'Problem 4(b)(i), solution: −11/384 as a decimal'
    formula: |-
      -11/384
    expected: '-0.02865'
    shown: ['= -\frac{11}{384}\,\alpha^4mc^2 = -0.02865\,\alpha^4mc^2']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own
  - id: p4-n2-p-plus
    where: 'Problem 4(b)(i), solution: P₊ for l = 1, m_l = 1, m_s = −½'
    formula: |-
      (1+1+2*1*(-1/2))/3
    expected: '1/3'
    shown: ['so $P_+ = \frac13$']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own
  - id: p4-n2-fraction
    where: 'Problem 4(b)(i), solution: the fraction for l = 1, m_l·m_s = −½'
    formula: |-
      (1*2 + 1/2)/(1*(1+1/2)*2)
    expected: '5/6'
    shown: ['the fraction is $\frac{2 + 1/2}{3} = \frac56$']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-n2-coupled
    kind: identity
    where: 'Problem 4(b)(i), check: the 2P3/2 and 2P1/2 shifts in units of alpha⁴ m c²/128'
    formula: |-
      -(1/(2*2**4))*(2/(j + 1/2) - 3/4)*128
    equals: |-
      -(1 + 4*(3/2 - j))
    samples:
      j: [1.5, 0.5]
    tolerance: 1e-12
    shown: ['$-\frac{1}{128}\alpha^4mc^2$ plus $\frac23$ of the $2P_{1/2}$ shift $-\frac{5}{128}\alpha^4mc^2$']
    source: {cite: reading1, at: 'eqs. (2.4.62), (2.4.63)'}
    origin: page-own

  - id: p4-levels
    answer: p4-levels
    where: 'Problem 4(b)(ii), answer box: m_l + 2 m_s runs from −(l + 1) to l + 1 in whole steps for l = 1 (and the 2S values ±1 lie among them): 2(l + 1) + 1 values'
    formula: |-
      2*(1 + 1) + 1
    expected: '5'
    tolerance: 1e-9
    shown: ['id="p4-levels"', 'So the eight states have five energies']
    source: {cite: mit, at: 'Problem 4(b)(ii), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-levels-count
    where: 'Problem 4(b)(ii), solution: the numbers of states at the five energies add up to 8'
    formula: |-
      1 + 2 + 2 + 2 + 1
    expected: '8'
    tolerance: 1e-9
    shown: ['with $1, 2, 2, 2, 1$ states']
    source: {cite: mit, at: 'Problem 4(b)(ii), p. 3 (our own solution)'}
    origin: page-own

  # ---- Problem 5

  - id: p5-alpha
    kind: identity
    answer: p5-alpha
    where: 'Problem 5(d), answer box: from matrix elements between j and j′ = j + 1: hbar⁴ [j(j+1) − j′(j′+1)]² = −(alpha/2) hbar² [j(j+1) + j′(j′+1)]'
    formula: |-
      -4*hbar**2
    equals: |-
      -2*hbar**2*(j*(j + 1) - (j + 1)*(j + 2))**2/(j*(j + 1) + (j + 1)*(j + 2))
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      j: [0.5, 1, 1.5, 2, 3]
    tolerance: 1e-12
    shown: ['id="p5-alpha"', '<Formula label="The double commutator, with its constant"']
    source: {cite: reading1, at: 'eq. (2.5.12)'}
    origin: page-own

  - id: p5-alpha-check
    kind: identity
    where: 'Problem 5(d), check: for j′ = j + 1 the difference of j(j+1) is −2(j + 1) and the sum is 2(j + 1)²'
    formula: |-
      (-2*(j + 1))**2/(2*(j + 1)**2)
    equals: |-
      (j*(j + 1) - (j + 1)*(j + 2))**2/(j*(j + 1) + (j + 1)*(j + 2))
    samples:
      j: [0.5, 1, 1.5, 2, 3]
    tolerance: 1e-12
    shown: ['the difference is $-2(j + 1)$ and the sum is $2(j + 1)^2$']
    source: {cite: mit, at: 'Problem 5(d), p. 4 (our own solution)'}
    origin: page-own

  - id: p5-c-test
    where: 'Problem 5(c), check: L² on z f(r), an l = 1 function, gives l(l + 1) hbar² = 2 hbar²'
    formula: |-
      1*(1 + 1)
    expected: '2'
    tolerance: 1e-9
    shown: ['$\vec L^2\left(zf\right) = 2\hbar^2zf$']
    source: {cite: mit, at: 'Problem 5(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p5-sz
    answer: p5-sz
    where: 'Problem 5(d), answer box: <S_z>/hbar in 2P1/2, m_j = 1/2, from the Clebsch-Gordan weights 2/3 (m_s = −1/2) and 1/3 (m_s = +1/2)'
    formula: |-
      (2/3)*(-1/2) + (1/3)*(1/2)
    expected: '-0.1667'
    shown: ['id="p5-sz"']
    source: {cite: mit, at: 'Problem 5(d), p. 4 (our own solution)'}
    origin: page-own

  - id: p5-sz-lemma
    where: 'Problem 5(d), solution: the same from the lesson''s projection-lemma formula with l = 1, j = 1/2, m_j = 1/2'
    formula: |-
      (1/2)*((1/2)*(3/2) - 1*2 + 3/4)/(2*(1/2)*(3/2))
    expected: '-0.1667'
    shown: ['<Formula label="Mean spin component in the state 2P½ with m_j = +½"']
    source: {cite: reading1, at: 'eqs. (2.5.17)–(2.5.19)'}
    origin: page-own

  - id: p5-sz-weights
    kind: identity
    where: 'Problem 5(d), check: the weights of the 2P1/2, m_j = 1/2 state from the probability formula of Problem 4, P− = (l − 2 m_l m_s)/(2l + 1)'
    formula: |-
      (1 - 2*ml*ms)/3
    equals: |-
      (1 + 1/2 - 2*ms*(ml + ms))/(2*1 + 1)
    samples:
      ml: [1, 0]
      ms: [-0.5, 0.5]
    tolerance: 1e-12
    shown: ['the state is $\frac23$ of $|m_l = 1, m_s = -\frac12\rangle$ and $\frac13$ of $|m_l = 0, m_s = +\frac12\rangle$']
    source: {cite: mit, at: 'Problem 4(b)(i), p. 3 (our own solution)'}
    origin: page-own
