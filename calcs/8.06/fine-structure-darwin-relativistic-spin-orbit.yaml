# Calculations on content/year-3/8.06/fine-structure-darwin-relativistic-spin-orbit.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 5 transcripts and notes chapter 2 (section 2.4), with the page's own
# worked example on hydrogen's ground state and 2P doublet. Constants: alpha = 1/137.036, mc^2 = 511.0 keV,
# h = 4.135667696e-15 eV s, c = 2.99792458e8 m/s. In identities, E = E_n^(0) = -al^2 mc2/(2 nn^2) and a0 = hb^2/(m e2).

page: content/year-3/8.06/fine-structure-darwin-relativistic-spin-orbit.mdx
calcs:
  - id: darwin-shift
    kind: identity
    where: 'eqs. (2.4.22)-(2.4.24): (π e² ħ²/(2m²c²))·1/(π n³ a0³) = α⁴mc²/(2n³), with a0 = ħ²/(me²), α = e²/(ħc)'
    formula: e2*hb**2/(2*m**2*cc**2)/(nn**3*(hb**2/(m*e2))**3)
    equals: (e2/(hb*cc))**4*m*cc**2/(2*nn**3)
    samples: {e2: [1.3, 2.2], hb: [0.8, 1.7], m: [0.6, 2.5], cc: [2.0, 4.0], nn: [1, 3]}
    tolerance: 1e-10
    shown: ['E^{(1)} = \frac{\alpha^4mc^2}{2n^3}']
    source: {cite: reading6, at: 'eq. (2.4.24)'}
    origin: mit

  - id: ball-integral
    kind: identity
    where: 'eq. (2.4.37): uniform ball of radius u0, ∫ d³u ρ0 u² = (3/(4π u0³)) ∫ 4π u⁴ du = (3/5) u0²'
    formula: integrate('3/u0**3*u**4', 'u', 0, u0)
    equals: 3/5*u0**2
    samples: {u0: [0.5, 2.0]}
    tolerance: 1e-8
    shown: ['the integral is $\frac35u_0^2$']
    source: {cite: reading6, at: 'eq. (2.4.37)'}
    origin: mit

  - id: one-tenth
    where: 'eq. (2.4.38): (1/6)·(3/5) = 1/10'
    inputs: {}
    formula: 1/6*3/5
    expected: '0.1'
    tolerance: 1e-12
    shown: ['so $\delta V = \frac{1}{10}u_0^2\nabla^2V$']
    source: {cite: reading6, at: 'eq. (2.4.38)'}
    origin: mit

  - id: relativistic
    kind: identity
    where: 'eqs. (2.4.44)-(2.4.46): −(1/2mc²)[E² − 2E⟨V⟩ + ⟨V²⟩] with ⟨V⟩ = 2E, ⟨V²⟩ = E²·4n/(l + ½) equals −(α⁴mc²/8n⁴)(4n/(l + ½) − 3)'
    formula: -1/(2*mc2)*((-al**2*mc2/(2*nn**2))**2*(1 - 4 + 4*nn/(ll + 0.5)))
    equals: -al**4*mc2/(8*nn**4)*(4*nn/(ll + 0.5) - 3)
    samples: {al: [0.007, 0.05], mc2: [1.0, 3.0], nn: [1, 4], ll: [0, 2]}
    tolerance: 1e-14
    shown: ['= -\frac{\alpha^4mc^2}{8}\,\frac{1}{n^4}\left(\frac{4n}{l + \frac12} - 3\right)']
    source: {cite: reading6, at: 'eq. (2.4.46)'}
    origin: mit

  - id: spin-orbit-constants
    kind: identity
    where: 'eqs. (2.4.55), (2.4.56): e²ħ²/(4m²c² n³ a0³) = (E_n⁽⁰⁾)² n/(mc²)'
    formula: e2*hb**2/(4*m**2*cc**2*nn**3*(hb**2/(m*e2))**3)
    equals: ((e2/(hb*cc))**2*m*cc**2/(2*nn**2))**2*nn/(m*cc**2)
    samples: {e2: [1.3, 2.2], hb: [0.8, 1.7], m: [0.6, 2.5], cc: [2.0, 4.0], nn: [1, 3]}
    tolerance: 1e-10
    shown: ['E^{(1)} = \frac{(E_n^{(0)})^2}{mc^2}\;n\;\frac{j(j+1) - l(l+1) - \frac34}{l\left(l + \frac12\right)(l + 1)}']
    source: {cite: reading6, at: 'eq. (2.4.56)'}
    origin: mit

  - id: spin-orbit-limit
    kind: identity
    where: 'eq. (2.4.58): with j = l + ½ the spin–orbit bracket is n/((l + ½)(l + 1)), which tends to 2n as l → 0, giving (E²/mc²)·2n = α⁴mc²/(2n³), the Darwin shift (checked at l = 1e-6)'
    formula: (al**2/(2*nn**2))**2*nn*((ll + 0.5)*(ll + 1.5) - ll*(ll + 1) - 0.75)/(ll*(ll + 0.5)*(ll + 1))
    equals: al**4/(2*nn**3)
    samples: {al: [0.007, 0.05], nn: [1, 3], ll: [1e-6, 2e-6]}
    tolerance: 1e-5
    shown: ['the formula tends to $\alpha^4mc^2/(2n^3)$, **exactly the Darwin shift**']
    source: {cite: reading6, at: 'eq. (2.4.58)'}
    origin: mit

  - id: f-lower
    kind: identity
    where: 'eq. (2.4.61): f(j, j − ½) = −2/(j + ½)'
    formula: (jj*(jj + 1) - 3*(jj - 0.5)*(jj + 0.5) - 0.75)/((jj - 0.5)*jj*(jj + 0.5))
    equals: -2/(jj + 0.5)
    samples: {jj: [1.5, 2.5, 4.5]}
    tolerance: 1e-12
    shown: ['f\left(j, j - \tfrac12\right) = f\left(j, j + \tfrac12\right) = -\frac{2}{j + \frac12}']
    source: {cite: reading6, at: 'eq. (2.4.61)'}
    origin: mit

  - id: f-upper
    kind: identity
    where: 'eq. (2.4.61): f(j, j + ½) = −2/(j + ½)'
    formula: (jj*(jj + 1) - 3*(jj + 0.5)*(jj + 1.5) - 0.75)/((jj + 0.5)*(jj + 1)*(jj + 1.5))
    equals: -2/(jj + 0.5)
    samples: {jj: [0.5, 1.5, 3.5]}
    tolerance: 1e-12
    shown: ['f\left(j, j - \tfrac12\right) = f\left(j, j + \tfrac12\right) = -\frac{2}{j + \frac12}']
    source: {cite: reading6, at: 'eq. (2.4.61)'}
    origin: mit

  - id: combined
    kind: identity
    where: 'eqs. (2.4.59)-(2.4.62): (E²/2mc²)(3 + 2n f) with f = −2/(j + ½) equals −(α⁴mc²/2n⁴)(n/(j + ½) − ¾)'
    formula: (al**2*mc2/(2*nn**2))**2/(2*mc2)*(3 + 2*nn*(-2/(jj + 0.5)))
    equals: -al**4*mc2/(2*nn**4)*(nn/(jj + 0.5) - 0.75)
    samples: {al: [0.007, 0.05], mc2: [1.0, 3.0], nn: [1, 4], jj: [0.5, 2.5]}
    tolerance: 1e-14
    shown: ['E^{(1)} = -\frac{\alpha^4mc^2}{2n^4}\left(\frac{n}{j + \frac12} - \frac34\right)" cite']
    source: {cite: reading6, at: 'eqs. (2.4.62), (2.4.63)'}
    origin: mit

  - id: table-1s
    where: 'table: n = 1, j = ½: (1/2)(1 − ¾) = 1/8'
    inputs: {}
    formula: 1/(2*1**4)*(1/1 - 0.75) - 1/8
    expected: '0'
    tolerance: 1e-12
    shown: ['| $1S_{1/2}$ | 1 | ½ | $-1/8$ |']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: mit

  - id: table-2-half
    where: 'table: n = 2, j = ½: (1/32)(2 − ¾) = 5/128'
    inputs: {}
    formula: 1/(2*2**4)*(2/1 - 0.75) - 5/128
    expected: '0'
    tolerance: 1e-12
    shown: ['| 2 | ½ | $-5/128$ |']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: mit

  - id: table-2-3half
    where: 'table: n = 2, j = 3/2: (1/32)(1 − ¾) = 1/128'
    inputs: {}
    formula: 1/(2*2**4)*(2/2 - 0.75) - 1/128
    expected: '0'
    tolerance: 1e-12
    shown: ['| 2 | 3/2 | $-1/128$ |']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: mit

  - id: table-3-half
    where: 'table: n = 3, j = ½: (1/162)(3 − ¾) = 1/72'
    inputs: {}
    formula: 1/(2*3**4)*(3/1 - 0.75) - 1/72
    expected: '0'
    tolerance: 1e-12
    shown: ['| 3 | ½ | $-1/72$ |']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: mit

  - id: table-3-3half
    where: 'table: n = 3, j = 3/2: (1/162)(3/2 − ¾) = 1/216'
    inputs: {}
    formula: 1/(2*3**4)*(3/2 - 0.75) - 1/216
    expected: '0'
    tolerance: 1e-12
    shown: ['| 3 | 3/2 | $-1/216$ |']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: mit

  - id: table-3-5half
    where: 'table: n = 3, j = 5/2: (1/162)(1 − ¾) = 1/648'
    inputs: {}
    formula: 1/(2*3**4)*(3/3 - 0.75) - 1/648
    expected: '0'
    tolerance: 1e-12
    shown: ['| 3 | 5/2 | $-1/648$ |']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: mit

  - id: alpha-squared
    where: 'introduction: α² ≈ 1/19,000'
    inputs: {}
    formula: 137.036**2
    expected: '19000'
    shown: ['about 19,000 times smaller']
    source: {cite: reading6, at: 'eq. (2.3.15)'}
    origin: mit

  - id: alpha4mc2
    where: 'example (a): α⁴mc² = 511,000 eV/137.036⁴'
    inputs: {}
    formula: 511000/137.036**4
    expected: '1.449e-3'
    shown: ['511{,}000\ \text{eV}/137.036^4 \approx 1.449 \times 10^{-3}$ eV']
    source: {cite: reading6, at: 'eq. (2.4.63)'}
    origin: page-own

  - id: ground-shift
    where: 'example (a): −α⁴mc²/8'
    inputs: {}
    formula: -511000/137.036**4/8
    expected: '-1.81e-4'
    shown: ['\approx -1.81 \times 10^{-4}$ eV']
    source: {cite: reading6, at: 'eq. (2.4.63)'}
    origin: page-own

  - id: ground-relative
    where: 'example (a): (α⁴mc²/8)/(α²mc²/2) = α²/4, compared with 13.6 eV'
    inputs: {}
    formula: (1/137.036)**2/4
    expected: '1.3e-5'
    shown: ['Next to 13.6 eV this is about $1.3 \times 10^{-5}$']
    source: {cite: reading6, at: 'eq. (2.4.63)'}
    origin: page-own

  - id: doublet-fraction
    where: 'example (b): 5/128 − 1/128 = 1/32'
    inputs: {}
    formula: 5/128 - 1/128 - 1/32
    expected: '0'
    tolerance: 1e-12
    shown: ['$\frac{4}{128} = \frac{1}{32}$ of $\alpha^4mc^2$ apart']
    source: {cite: reading6, at: 'table after eq. (2.4.64)'}
    origin: page-own

  - id: doublet-energy
    where: 'example (b): α⁴mc²/32'
    inputs: {}
    formula: 511000/137.036**4/32
    expected: '4.53e-5'
    shown: ['about $4.53 \times 10^{-5}$ eV']
    source: {cite: reading6, at: 'eq. (2.4.63)'}
    origin: page-own

  - id: doublet-frequency
    where: 'example (b) and summary: (α⁴mc²/32)/h in GHz'
    inputs: {}
    formula: 511000/137.036**4/32/4.135667696e-15/1e9
    expected: '10.95'
    shown: ['a frequency of about 10.95 GHz', 'splits by α⁴mc²/32, about 11 GHz']
    source: {cite: reading6, at: 'eq. (2.4.63)'}
    origin: page-own

  - id: doublet-wavelength
    where: 'example (b): c/f in cm'
    inputs: {}
    formula: 2.99792458e8/(511000/137.036**4/32/4.135667696e-15)*100
    expected: '2.7'
    shown: ['$c/f \approx 2.7$ cm']
    source: {cite: reading6, at: 'eq. (2.4.63)'}
    origin: page-own

  - id: lyman-alpha
    where: 'example (b): Lyman alpha 13.6 × (1 − ¼) = 10.2 eV; doublet splitting 4.53e-5/10.2 ≈ 4.4e-6, about four parts in a million'
    inputs: {}
    formula: (511000/137.036**4/32)/(13.6057*0.75)*1e6
    expected: '4'
    shown: ['($n = 2 \to 1$, at 10.2 eV) this splitting appears as a doublet only about four parts in a million apart']
    source: {cite: reading6, at: 'eq. (2.1.6)'}
    origin: page-own

  - id: lyman-energy
    where: 'example (b): Lyman alpha energy 13.6057 × ¾'
    inputs: {}
    formula: 13.6057*0.75
    expected: '10.2'
    shown: ['at 10.2 eV)']
    source: {cite: reading6, at: 'eq. (2.1.6)'}
    origin: page-own
