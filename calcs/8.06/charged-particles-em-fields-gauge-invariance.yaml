# Calculations on content/year-3/8.06/charged-particles-em-fields-gauge-invariance.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.06 (Spring 2018, Zwiebach) Lecture 13 transcripts L13.4 and L13.5 (the notes' chapter 5 is not on OCW).
# Gaussian units. The page's own worked example: a uniform B along z in the symmetric gauge and the gauge (−By, 0, 0),
# B = 1 T, an electron at x = y = 100 nm, ħ = 1.0546e-34 J s, e = 1.602e-19 C; a constant shift of Φ by 1 volt.

page: content/year-3/8.06/charged-particles-em-fields-gauge-invariance.mdx
calcs:
  # ---------------------------------------------------------------- potentials and gauge transformations
  - id: e-field-gauge-invariant
    kind: identity
    where: 'L13.4 pp. 2-3: with Λ = a x²t³, the x component of E′ − E = −∂x(Φ′ − Φ) − (1/c)∂t(A′_x − A_x) = (1/c)∂x∂tΛ − (1/c)∂t∂xΛ = 0 (checked as 1 + it)'
    formula: 1 + deriv('3*aa*s**2*tt**2/cc', 's', xx) - deriv('2*aa*xx*s**3/cc', 's', tt)
    equals: 1 + 0*xx
    samples: {aa: [0.7, 1.3], tt: [0.5, 1.2], cc: [1.0, 3.0], xx: [0.4, 2.0]}
    tolerance: 1e-7
    shown: ['\vec E(\Phi'', \vec A'') = \vec E(\Phi, \vec A)']
    source: {cite: reading1, at: 'p. 3'}
    origin: mit

  - id: phi-prime-sign
    kind: fact
    where: 'L13.4 p. 2: Φ′ = Φ − (1/c)∂Λ/∂t (with A′ = A + ∇Λ) keeps E unchanged'
    value: 'Φ′ = Φ − (1/c)∂Λ/∂t'
    shown: ['\vec A'' = \vec A + \nabla\Lambda, \qquad \Phi'' = \Phi - \frac{1}{c}\frac{\partial\Lambda}{\partial t}']
    source: {cite: reading1, at: 'p. 2'}
    origin: mit

  - id: e-sign-slip
    kind: fact
    where: 'L13.4 p. 2: the transcript says E + (1/c)∂A/∂t "is the gradient of phi", then writes E = −∇Φ − (1/c)∂A/∂t; the combination is −∇Φ'
    value: 'gradient of phi'
    shown: ['[The transcript first says the combination "is the gradient of phi"']
    source: {cite: reading1, at: 'p. 2'}
    origin: slip

  - id: kinetic-energy
    kind: identity
    where: 'L13.5 p. 1: (mv)²/2m = mv²/2, so p − qA/c plays the role of mv'
    formula: (mm*vv)**2/(2*mm)
    equals: mm*vv**2/2
    samples: {mm: [1.0, 9.1], vv: [0.3, 2.0]}
    tolerance: 1e-12
    shown: ['the kinetic energy $\frac{1}{2}mv^2 = (mv)^2/2m$ must come from the first term']
    source: {cite: reading2, at: 'p. 1'}
    origin: mit

  # ---------------------------------------------------------------- worked example
  - id: ex-curl-symmetric
    kind: identity
    where: 'example (a): for A = (B/2)(−y, x, 0), ∂A_y/∂x − ∂A_x/∂y = B/2 + B/2 = B'
    formula: deriv('bb/2*s', 's', xx) - deriv('-bb/2*s', 's', yy)
    equals: bb
    samples: {bb: [1.0, 2.5], xx: [0.3, 1.1], yy: [0.7, -0.4]}
    tolerance: 1e-8
    shown: ['= \frac{B}{2} + \frac{B}{2} = B$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-curl-landau
    kind: identity
    where: 'example (a): for A′ = (−By, 0, 0), −∂(−By)/∂y = B'
    formula: -deriv('-bb*s', 's', yy)
    equals: bb
    samples: {bb: [1.0, 2.5], yy: [0.7, -0.4]}
    tolerance: 1e-8
    shown: ['$-\partial(-By)/\partial y = B$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-gauge-function-x
    kind: identity
    where: 'example (a): with Λ = −Bxy/2, ∂Λ/∂x = −By/2 = A′_x − A_x = −By − (−By/2)'
    formula: deriv('-bb*s*yy/2', 's', xx)
    equals: -bb*yy - (-bb*yy/2)
    samples: {bb: [1.0, 2.5], xx: [0.3, 1.1], yy: [0.7, -0.4]}
    tolerance: 1e-8
    shown: ['the gradient of $\Lambda = -\frac{1}{2}Bxy$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-gauge-function-y
    kind: identity
    where: 'example (a): ∂Λ/∂y = −Bx/2 = A′_y − A_y = 0 − Bx/2'
    formula: deriv('-bb*xx*s/2', 's', yy)
    equals: 0 - bb*xx/2
    samples: {bb: [1.0, 2.5], xx: [0.3, 1.1], yy: [0.7, -0.4]}
    tolerance: 1e-8
    shown: ['\vec A'' - \vec A = \left(-\frac{B}{2}y, -\frac{B}{2}x, 0\right)']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-phase-exponent
    kind: identity
    where: 'example (b): qΛ/ħc with q = −e and Λ = −Bxy/2 is eBxy/(2ħc)'
    formula: (-ee)*(-bb*xx*yy/2)/(hb*cc)
    equals: ee*bb*xx*yy/(2*hb*cc)
    samples: {ee: [1.0, 4.8], bb: [1.0, 3.0], xx: [0.2, 1.0], yy: [0.5, 2.0], hb: [1.0, 0.3], cc: [1.0, 3.0]}
    tolerance: 1e-12
    shown: ['= e^{ieBxy/2\hbar c}\psi$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-ell-squared
    where: 'example (b): ℓ² = ħ/(eB) in SI, B = 1 T, in m²'
    inputs: {}
    formula: 1.0546e-34/(1.602e-19*1)
    expected: '6.58e-16'
    shown: ['\ell^2 = \hbar/eB = 1.0546 \times 10^{-34}/(1.602 \times 10^{-19} \times 1) \approx 6.58 \times 10^{-16}$ m²']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-ell-gaussian
    where: 'example (b): the same ℓ² from ħc/(eB) in Gaussian units (ħ = 1.0546e-27 erg s, c = 2.998e10 cm/s, e = 4.803e-10 esu, B = 1e4 G), cm² converted to m²'
    inputs: {}
    formula: 1.0546e-27*2.998e10/(4.803e-10*1e4)*1e-4
    expected: '6.58e-16'
    shown: ['A convenient length is $\ell = \sqrt{\hbar c/eB}$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-ell
    where: 'example (b): ℓ in nm'
    inputs: {}
    formula: sqrt(1.0546e-34/1.602e-19)*1e9
    expected: '25.7'
    shown: ['so $\ell \approx 25.7$ nm at 1 T']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-phase
    where: 'example (b): xy/(2ℓ²) at x = y = 100 nm, in radians'
    inputs: {}
    formula: (1e-7)**2/(2*1.0546e-34/1.602e-19)
    expected: '7.6'
    shown: ['(10^{-7})^2/(2 \times 6.58 \times 10^{-16}) \approx 7.6$ radians']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-constant-shift
    kind: identity
    where: 'example (c): Λ = −cV₀t gives Φ′ = Φ − (1/c)∂Λ/∂t = Φ + V₀'
    formula: ph - deriv('-cc*v0*s', 's', tt)/cc
    equals: ph + v0
    samples: {ph: [0.2, -1.0], cc: [1.0, 3.0], v0: [0.5, 2.0], tt: [0.3, 1.7]}
    tolerance: 1e-8
    shown: ['\Phi'' = \Phi - \frac{1}{c}\frac{\partial\Lambda}{\partial t} = \Phi + V_0$']
    source: {cite: reading1, at: 'p. 2'}
    origin: page-own

  - id: ex-energy-shift
    kind: identity
    where: 'example (c): e^(−iqV₀t/ħ) e^(−iEt/ħ) = e^(−i(E + qV₀)t/ħ), checked on the real part: cos a cos b − sin a sin b = cos(a + b)'
    formula: cos(qv*tt/hb)*cos(en*tt/hb) - sin(qv*tt/hb)*sin(en*tt/hb)
    equals: cos((en + qv)*tt/hb)
    samples: {qv: [-1.0, 0.4], en: [2.0, 3.3], tt: [0.7, 1.9], hb: [1.0, 0.6]}
    tolerance: 1e-9
    shown: ['\propto e^{-i(E + qV_0)t/\hbar}$']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-statvolt
    where: 'example (c): 1 statvolt = 299.8 V (c in cm/s times 1e-8)'
    inputs: {}
    formula: 2.99792458e10*1e-8
    expected: '299.8'
    shown: ['(1/299.8 statvolt)']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own

  - id: ex-phase-rate
    where: 'example (c): 1 eV/ħ in radians per second'
    inputs: {}
    formula: 1.602e-19/1.0546e-34
    expected: '1.52e15'
    shown: ['\approx 1.52 \times 10^{15}$ radians per second']
    source: {cite: reading2, at: 'p. 2'}
    origin: page-own
