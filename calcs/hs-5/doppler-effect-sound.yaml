# Calculations on content/year-0/hs-5/doppler-effect-sound.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/doppler-effect-sound.mdx
calcs:
  - id: speed-of-sound
    kind: fact
    where: 'section "One formula with a sign rule": the speed of sound used throughout, as in the source''s worked examples'
    value: 340 m/s
    shown: ['this lesson takes the speed of sound in air as $v = 340\ \text{m/s}$']
    source: {cite: reading1, at: 'Sec. 6.2, Worked examples 1 to 3'}
    origin: mit

  - id: ultrasound-threshold
    kind: fact
    where: 'section "Using the Doppler effect": ultrasound is sound above 20 000 Hz'
    value: 20000 1/s
    shown: ['sound above $20\,000\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, Ultrasound and the Doppler effect'}
    origin: mit

  - id: wavelength-gives-source-formula
    kind: identity
    where: 'section "A moving source": f_L = v/λ with λ = (v − v_s)/f_s gives f_s v/(v − v_s)'
    formula: v / ((v - vs) / fs)
    equals: fs * v / (v - vs)
    samples: {v: [340.0, 340.0, 1500.0], vs: [0.0, 34.0, 200.0], fs: [600.0, 450.0, 1000.0]}
    tolerance: 1e-12
    shown: ['f_L = \frac{v}{\lambda} = f_s\,\frac{v}{v - v_s}']
    source: {cite: mit8286, at: 'Lecture 3 transcript, source moving'}
    origin: page-own

  - id: general-formula-reduces
    kind: identity
    where: 'the Doppler formula with both upper signs and v_L = 0 is the moving-source case; with v_s = 0 the moving-listener case'
    formula: fs * (v + vL) / (v - vs)
    equals: fs * v / (v - vs) * (v + vL) / v
    samples: {fs: [600.0, 350.0, 500.0], v: [340.0, 340.0, 340.0], vL: [0.0, 20.0, 17.0], vs: [34.0, 40.0, 0.0]}
    tolerance: 1e-12
    shown: ['f_L = f_s\,\frac{v \pm v_L}{v \mp v_s}']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula'}
    origin: page-own

  - id: quiz-drone
    where: 'quiz 1: 450 Hz buzzer moving away at 30 m/s'
    inputs: {fs: 450 1/s, v: 340 m/s, vs: 30 m/s}
    formula: fs * v / (v + vs)
    expected: 414 1/s
    shown: ['$f_L = f_s\\,v/(v + v_s) = 450 \\times 340/370 = 414\\ \\text{Hz}$']
    quiz: 1
    source: {cite: reading1, at: 'Sec. 6.2'}
    origin: page-own

  - id: quiz-cyclist
    where: 'quiz 2: cyclist moving away at 10 m/s from a 680 Hz alarm'
    inputs: {fs: 680 1/s, v: 340 m/s, vL: 10 m/s}
    formula: fs * (v - vL) / v
    expected: 660 1/s
    shown: ['$f_L = f_s\\,(v - v_L)/v = 680 \\times 330/340 = 660\\ \\text{Hz}$']
    quiz: 2
    source: {cite: reading1, at: 'Sec. 6.2'}
    origin: page-own

  - id: police-speed-kmh
    where: 'worked example "A passing police car": 34 m/s in km/h'
    inputs: {v: 34 m/s}
    formula: v
    expected: 122 km/hour
    shown: ['$34\ \text{m/s}$ (about $122\ \text{km/h}$)']
    source: {cite: reading1, at: 'Sec. 6.2'}
    origin: page-own

  - id: police-approach
    where: 'worked example "A passing police car", step "Approaching"'
    inputs: {fs: 600 1/s, v: 340 m/s, vs: 34 m/s}
    formula: fs * v / (v - vs)
    expected: 667 1/s
    shown: ['$f_L = 600 \times \dfrac{340}{340 - 34} = 600 \times \dfrac{340}{306} = 667\ \text{Hz}$', 'you heard $667\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own

  - id: police-recede
    where: 'worked example "A passing police car", step "Moving away"'
    inputs: {fs: 600 1/s, v: 340 m/s, vs: 34 m/s}
    formula: fs * v / (v + vs)
    expected: 545 1/s
    shown: ['$f_L = 600 \times \dfrac{340}{340 + 34} = 600 \times \dfrac{340}{374} = 545\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own

  - id: police-drop
    where: 'worked example "A passing police car", step "What you hear": the drop in pitch'
    inputs: {fs: 600 1/s, v: 340 m/s, vs: 34 m/s}
    formula: fs * v / (v - vs) - fs * v / (v + vs)
    expected: 120 1/s
    shown: ['The pitch drops by about $120\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own

  - id: factory-towards
    where: 'worked example "Driving past a factory siren", step "Towards the siren"'
    inputs: {fs: 500 1/s, v: 340 m/s, vL: 17 m/s}
    formula: fs * (v + vL) / v
    expected: 525 1/s
    shown: ['$f_L = 500 \times \dfrac{340 + 17}{340} = 525\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own

  - id: factory-away
    where: 'worked example "Driving past a factory siren", step "Away from the siren"'
    inputs: {fs: 500 1/s, v: 340 m/s, vL: 17 m/s}
    formula: fs * (v - vL) / v
    expected: 475 1/s
    shown: ['$f_L = 500 \times \dfrac{340 - 17}{340} = 475\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own

  - id: train-car-approach
    where: 'worked example "Both moving", step "Approaching each other"'
    inputs: {fs: 350 1/s, v: 340 m/s, vL: 20 m/s, vs: 40 m/s}
    formula: fs * (v + vL) / (v - vs)
    expected: 420 1/s
    shown: ['$f_L = 350 \times \dfrac{340 + 20}{340 - 40} = 350 \times \dfrac{360}{300} = 420\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula'}
    origin: page-own

  - id: train-car-apart
    where: 'worked example "Both moving", step "Moving apart"'
    inputs: {fs: 350 1/s, v: 340 m/s, vL: 20 m/s, vs: 40 m/s}
    formula: fs * (v - vL) / (v + vs)
    expected: 295 1/s
    shown: ['$f_L = 350 \times \dfrac{340 - 20}{340 + 40} = 350 \times \dfrac{320}{380} = 295\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula'}
    origin: page-own

  - id: listener-runs-to-parked-car
    where: 'section "Who moves matters": a listener moving at 34 m/s towards a 600 Hz siren at rest'
    inputs: {fs: 600 1/s, v: 340 m/s, vL: 34 m/s}
    formula: fs * (v + vL) / v
    expected: 660 1/s
    shown: ['$600 \times 374/340 = 660\ \text{Hz}$']
    source: {cite: mit8286, at: 'Doppler shift for sound, source moving versus observer moving'}
    origin: page-own

  - id: horn-ratio
    where: 'worked example "Speed from the drop in pitch", step "Solve for the speed": v_s = v (530 − 470)/(530 + 470) = 0.060 v'
    inputs: {f1: 530 1/s, f2: 470 1/s}
    formula: (f1 - f2) / (f1 + f2)
    expected: '0.060'
    tolerance: 1e-9
    shown: ['$60\,v = 1000\,v_s$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula'}
    origin: page-own

  - id: horn-speed
    where: 'worked example "Speed from the drop in pitch": the car''s speed'
    inputs: {f1: 530 1/s, f2: 470 1/s, v: 340 m/s}
    formula: v * (f1 - f2) / (f1 + f2)
    expected: 20.4 m/s
    shown: ['$v_s = 0.060 \times 340 = 20.4\ \text{m/s}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula'}
    origin: page-own

  - id: horn-speed-kmh
    where: 'worked example "Speed from the drop in pitch": 20.4 m/s in km/h'
    inputs: {v: 20.4 m/s}
    formula: v
    expected: 73 km/hour
    shown: ['about $73\ \text{km/h}$']
    source: {cite: reading1, at: 'Sec. 6.2'}
    origin: page-own

  - id: horn-own-frequency
    where: 'worked example "Speed from the drop in pitch", step "The horn''s own frequency"'
    inputs: {f1: 530 1/s, v: 340 m/s, vs: 20.4 m/s}
    formula: f1 * (v - vs) / v
    expected: 498 1/s
    shown: ['$f_s = 530 \times \dfrac{340 - 20.4}{340} = 498\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own

  - id: plot-siren
    kind: fact
    where: 'second plot caption: a 600 Hz siren and v = 340 m/s, set in the plotted formulas'
    value: 600 1/s
    shown: ['Frequency heard by a listener at rest from a 600 Hz siren']
    source: {cite: reading1, at: 'Sec. 6.2, the Doppler formula, note on the sign choice'}
    origin: page-own
