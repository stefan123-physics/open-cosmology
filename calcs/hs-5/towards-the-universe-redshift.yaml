# Calculations on content/year-0/hs-5/towards-the-universe-redshift.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/towards-the-universe-redshift.mdx
calcs:
  - id: c-km-s
    kind: fact
    where: 'section "From redshift to speed": the rounded speed of light in km/s, used in every calculation'
    value: 3.00e5 km/s
    shown: ['$c = 3.00 \times 10^{5}\ \text{km/s}$']
    source: {cite: reading1, at: 'Sec. 6.3 (c = 3 × 10⁸ m/s)'}
    origin: mit

  - id: c-m-to-km
    where: 'the speed of light 3.00 × 10⁸ m/s (lesson 5.8) expressed in km/s'
    inputs: {c: 3.00e8 m/s}
    formula: c
    expected: 3.00e5 km/s
    shown: ['$c = 3.00 \times 10^{5}\ \text{km/s}$']
    source: {cite: reading1, at: 'Sec. 6.3'}
    origin: page-own

  - id: h-alpha
    kind: fact
    where: 'red hydrogen line (H-alpha), laboratory wavelength in air 6562.85 Å, rounded'
    value: 656.3 nm
    shown: ['at $656.3\ \text{nm}$ (red)', 'the red hydrogen line lies at $656.3\ \text{nm}$']
    source: {cite: nist, at: 'Strong Lines of Hydrogen, 6562.85 Å'}
    origin: mit

  - id: h-beta
    kind: fact
    where: 'blue-green hydrogen line (H-beta), laboratory wavelength in air 4861.3 Å, rounded'
    value: 486.1 nm
    shown: ['$486.1\ \text{nm}$ (blue-green)']
    source: {cite: nist, at: 'Strong Lines of Hydrogen, 4861.3 Å'}
    origin: mit

  - id: hydrogen-lines-list
    kind: fact
    where: 'section "Fingerprints of elements": the four visible hydrogen lines, rounded to the nanometre'
    value: 434 nm
    shown: ['visible lines at about $410$, $434$, $486$ and $656\ \text{nm}$']
    source: {cite: nasaSpectroscopy, at: 'hydrogen lines 410, 434, 486 and 656 nm'}
    origin: mit

  - id: z-ratio-form
    kind: identity
    where: 'section "Measuring the shift": adding 1 to z = (λ_obs − λ_em)/λ_em gives 1 + z = λ_obs/λ_em'
    formula: (lo - le) / le + 1
    equals: lo / le
    samples: {lo: [656.1, 672.7, 1300.0], le: [656.3, 656.3, 434.0]}
    tolerance: 1e-12
    shown: ['1 + z = \frac{\lambda_\text{obs}}{\lambda_\text{em}}']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: mit

  - id: sound-source-gives-z
    kind: identity
    where: 'section "From redshift to speed": the sound formula for a source moving away, λ = (v + v_s)/f_s, gives z = v_s/v exactly, the same form as z ≈ v/c'
    formula: ((v + vs) / fs) / (v / fs) - 1
    equals: vs / v
    samples: {v: [340.0, 340.0, 300000.0], vs: [30.0, 3.4, 7500.0], fs: [450.0, 600.0, 4.57e14]}
    tolerance: 1e-12
    shown: ['z \approx \frac{v}{c}']
    source: {cite: reading1, at: 'Sec. 6.3'}
    origin: page-own

  - id: star-z
    where: 'worked example "A star coming closer", step "The redshift"'
    inputs: {lo: 656.1 nm, le: 656.3 nm}
    formula: (lo - le) / le
    expected: '-3.0e-4'
    tolerance: '3%'
    shown: ['\dfrac{-0.2}{656.3} = -3.0 \times 10^{-4}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: star-v
    where: 'worked example "A star coming closer", step "The speed"'
    inputs: {lo: 656.1 nm, le: 656.3 nm, c: 3.00e5 km/s}
    formula: (lo - le) / le * c
    expected: -90 km/s
    tolerance: '2%'
    shown: ['= -90\ \text{km/s}$', 'about $90\ \text{km/s}$']
    source: {cite: mit3, at: 'pp. 3–5 (slow motion), p. 19'}
    origin: page-own

  - id: star-hbeta
    where: 'worked example "A star coming closer", step "Check with another line": the blue-green line shifted by the same z'
    inputs: {lb: 486.1 nm, z: -3.0e-4}
    formula: lb * (1 + z)
    expected: 485.95 nm
    tolerance: '0.001%'
    shown: ['486.1 \times (1 - 3.0 \times 10^{-4}) = 485.95\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: star-hbeta-shift
    where: 'worked example "A star coming closer": the shift of the blue-green line'
    inputs: {lb: 486.1 nm, z: 3.0e-4}
    formula: lb * z
    expected: 0.15 nm
    tolerance: '3%'
    shown: ['a shift of only $0.15\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: mpc-in-ly
    where: 'section "Hubble''s discovery": one megaparsec in light-years'
    inputs: {d: 1 megaparsec}
    formula: d
    expected: 3.3e6 light_year
    tolerance: '2%'
    shown: ['one megaparsec is about $3.3$ million light-years']
    source: {cite: reading1, at: 'Sec. 6.3 (1 Mpc = 3.3 million light years)'}
    origin: mit

  - id: H0-round
    kind: fact
    where: 'section "Hubble''s discovery": the round example value of the Hubble constant used for worked examples and quizzes (calcs/values.yaml role "example")'
    value: 70 km/s/Mpc
    shown: ['close to $70\ \text{km/s/Mpc}$', 'the round value $70\ \text{km/s/Mpc}$', 'about $70\ \text{km/s}$ faster', '$H_0 \approx 70\ \text{km/s/Mpc}$']
    source: {cite: reading1, at: 'Sec. 6.3'}
    origin: page-own

  - id: H0-planck-2013
    kind: fact
    where: 'section "Hubble''s discovery": the Planck 2013 value quoted by the main source (67.15 km/s/Mpc), rounded'
    value: 67 km/s/Mpc
    tolerance: '1%'
    shown: ['about $67\ \text{km/s/Mpc}$']
    source: {cite: reading1, at: 'Sec. 6.3 (H₀ = 67.15 km/s/Mpc, Planck 2013)'}
    origin: mit

  - id: galaxy-observed
    where: 'worked example "How far is the galaxy?": the observed wavelength 672.7 nm corresponds to z = 0.025'
    inputs: {le: 656.3 nm, z: 0.025}
    formula: le * (1 + z)
    expected: 672.7 nm
    tolerance: '0.01%'
    shown: ['is found at $672.7\ \text{nm}$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: galaxy-z
    where: 'worked example "How far is the galaxy?", step "The redshift"'
    inputs: {lo: 672.7 nm, le: 656.3 nm}
    formula: (lo - le) / le
    expected: '0.025'
    tolerance: '0.5%'
    shown: ['\dfrac{16.4}{656.3} = 0.025$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: galaxy-v
    where: 'worked example "How far is the galaxy?", step "The speed"'
    inputs: {z: 0.025, c: 3.00e5 km/s}
    formula: z * c
    expected: 7500 km/s
    shown: ['v \approx zc = 0.025 \times 3.00 \times 10^{5}\ \text{km/s} = 7500\ \text{km/s}$']
    source: {cite: mit3, at: 'pp. 3–5 (slow motion), p. 19'}
    origin: page-own

  - id: galaxy-relativistic
    where: 'worked example "How far is the galaxy?": the relativistic Doppler formula 1 + z = √((1 + β)/(1 − β)) gives β = 0.02469, about 1 % (1.25 %) below z'
    inputs: {z: 0.025}
    formula: 1 - (((1 + z)**2 - 1) / ((1 + z)**2 + 1)) / z
    expected: '0.0125'
    tolerance: '1%'
    shown: ['a speed only about 1 % lower']
    source: {cite: mit3, at: 'pp. 15–19'}
    origin: page-own

  - id: galaxy-d
    where: 'worked example "How far is the galaxy?", step "The distance"'
    inputs: {v: 7500 km/s, H: 70 km/s/Mpc}
    formula: v / H
    expected: 107 megaparsec
    tolerance: '0.5%'
    shown: ['\dfrac{7500}{70}\ \text{Mpc} = 107\ \text{Mpc}$']
    source: {cite: reading1, at: 'Sec. 6.3, Hubble''s law'}
    origin: page-own

  - id: galaxy-d-ly
    where: 'worked example "How far is the galaxy?": 107 Mpc in light-years (349 million with 1 Mpc = 3.26 million ly, 353 million with the source''s 3.3 million)'
    inputs: {v: 7500 km/s, H: 70 km/s/Mpc}
    formula: v / H
    expected: 350e6 light_year
    tolerance: '2%'
    shown: ['or about $350$ million light-years']
    source: {cite: reading1, at: 'Sec. 6.3'}
    origin: page-own

  - id: universe-smaller
    where: 'section "Stretched by space itself": at z = 0.025 distances were 1/1.025 of today''s, 2.4 % smaller'
    inputs: {z: 0.025}
    formula: 1 - 1 / (1 + z)
    expected: '0.024'
    tolerance: '2%'
    shown: ['about 2.4 % smaller']
    source: {cite: mit5, at: 'cosmological redshift'}
    origin: page-own

  - id: z2-factor
    where: 'section "Stretched by space itself": z = 2 means distances between galaxies were 1/(1 + z) = a third of today''s'
    inputs: {z: 2}
    formula: 1 + z
    expected: '3'
    shown: ['were a third of today''s']
    source: {cite: mit5, at: 'cosmological redshift'}
    origin: page-own

  - id: quiz-star-z
    where: 'quiz 1: a 434.0 nm line observed at 434.6 nm'
    inputs: {lo: 434.6 nm, le: 434.0 nm}
    formula: (lo - le) / le
    expected: '0.00138'
    tolerance: '0.5%'
    shown: ['$z = 0.6/434.0 = 0.00138$']
    source: {cite: mit3, at: 'pp. 2–3'}
    origin: page-own

  - id: quiz-star-v
    where: 'quiz 1: the star''s speed'
    inputs: {lo: 434.6 nm, le: 434.0 nm, c: 3.00e5 km/s}
    formula: (lo - le) / le * c
    expected: 415 km/s
    tolerance: '0.5%'
    shown: ['$v \\approx zc = 0.00138 \\times 3.00 \\times 10^{5}\\ \\text{km/s} = 415\\ \\text{km/s}$']
    source: {cite: mit3, at: 'pp. 3–5 (slow motion), p. 19'}
    origin: page-own

  - id: quiz-galaxy-v
    where: 'quiz 2: a galaxy with z = 0.004'
    inputs: {z: 0.004, c: 3.00e5 km/s}
    formula: z * c
    expected: 1200 km/s
    shown: ['$v \\approx zc = 0.004 \\times 3.00 \\times 10^{5}\\ \\text{km/s} = 1200\\ \\text{km/s}$']
    quiz: 2
    source: {cite: mit3, at: 'pp. 3–5 (slow motion), p. 19'}
    origin: page-own

  - id: quiz-hubble-v
    where: 'quiz 3: Hubble''s law for a galaxy 200 Mpc away'
    inputs: {H: 70 km/s/Mpc, d: 200 megaparsec}
    formula: H * d
    expected: 14000 km/s
    shown: ['$v = H_0 d = 70 \\times 200 = 14\\,000\\ \\text{km/s}$']
    source: {cite: reading1, at: 'Sec. 6.3, Hubble''s law'}
    origin: page-own

  - id: quiz-hubble-z
    where: 'quiz 3: the expected redshift'
    inputs: {H: 70 km/s/Mpc, d: 200 megaparsec, c: 3.00e5 km/s}
    formula: H * d / c
    expected: '0.047'
    tolerance: '1%'
    shown: ['$z \\approx v/c = 14\\,000/(3.00 \\times 10^{5}) = 0.047$']
    quiz: 3
    source: {cite: mit3, at: 'pp. 3–5 (slow motion), p. 19'}
    origin: page-own
