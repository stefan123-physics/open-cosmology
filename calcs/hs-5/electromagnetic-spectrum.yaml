# Calculations on content/year-0/hs-5/electromagnetic-spectrum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/electromagnetic-spectrum.mdx
calcs:
  - id: c-rounded
    kind: fact
    where: 'section "A wave without a medium": the rounded speed of light used in all calculations'
    value: 3.00e8 m/s
    shown: ['tex="c = 3.00 \times 10^{8}\ \text{m/s}"']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: mit

  - id: c-exact
    kind: fact
    where: 'section "A wave without a medium": the exact value of c'
    value: 299792458 m/s
    shown: ['Its value is $299\,792\,458\ \text{m/s}$']
    source: {cite: nasa2, at: 'constants'}
    origin: mit

  - id: c-rounding
    where: 'the exact c rounds to 3.00 × 10⁸ m/s'
    inputs: {c: 299792458 m/s}
    formula: c
    expected: 3.00e8 m/s
    shown: ['in calculations we round it to']
    source: {cite: nasa2, at: 'constants'}
    origin: page-own

  - id: light-vs-sound
    where: 'section "A wave without a medium": c over the speed of sound in air (340 m/s, lesson 5.3)'
    inputs: {c: 3.00e8 m/s, v: 340 m/s}
    formula: c / v
    expected: '900000'
    tolerance: '3%'
    shown: ['almost 900 000 times slower than light']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: moon-distance
    kind: fact
    where: 'worked example "A radio echo from the Moon": the Moon''s average distance (semimajor axis 0.3844 × 10⁶ km)'
    value: 3.84e8 m
    shown: ['which is $3.84 \times 10^{8}\ \text{m}$ away (its average distance, from NASA''s Moon Fact Sheet)']
    source: {cite: moon, at: 'semimajor axis'}
    origin: mit

  - id: moon-round-trip
    where: 'worked example, step "Distance there and back"'
    inputs: {d: 3.84e8 m}
    formula: 2 * d
    expected: 7.68e8 m
    shown: ['$2d = 2 \times 3.84 \times 10^{8} = 7.68 \times 10^{8}\ \text{m}$']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: moon-echo-time
    where: 'worked example, step "Time at the speed of light"'
    inputs: {d: 3.84e8 m, c: 3.00e8 m/s}
    formula: 2 * d / c
    expected: 2.56 s
    shown: ['$t = 2d/c = (7.68 \times 10^{8})/(3.00 \times 10^{8}) = 2.56\ \text{s}$', 'a pause of two and a half seconds']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: double-f-halves-lambda
    kind: identity
    where: 'section "The wave equation for light": at fixed c, doubling f halves λ'
    formula: c / (2 * f)
    equals: 0.5 * c / f
    samples: {c: [3.0e8, 3.0e8], f: [1.0e9, 5.0e14]}
    tolerance: 1e-12
    shown: ['Doubling the frequency halves the wavelength.']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: green-wavelength-m
    where: 'worked example "The frequency of green light", step "Wavelength in metres"'
    inputs: {lam: 530 nm}
    formula: lam
    expected: 5.30e-7 m
    shown: ['$\lambda = 530\ \text{nm} = 530 \times 10^{-9}\ \text{m} = 5.30 \times 10^{-7}\ \text{m}$']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: green-frequency
    where: 'worked example, step "Rearrange the wave equation": f = c/λ'
    inputs: {c: 3.00e8 m/s, lam: 5.30e-7 m}
    formula: c / lam
    expected: 5.66e14 1/s
    shown: ['$f = c/\lambda = (3.00 \times 10^{8})/(5.30 \times 10^{-7}) = 5.66 \times 10^{14}\ \text{Hz}$', 'more than half a million billion oscillations every second']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: fm-wavelength
    where: 'worked example "The wavelength of an FM station": λ = c/f'
    inputs: {c: 3.00e8 m/s, f: 96.0e6 1/s}
    formula: c / f
    expected: 3.1 m
    shown: ['$\lambda = c/f = (3.00 \times 10^{8})/(96.0 \times 10^{6}) \approx 3.1\ \text{m}$']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

  - id: green-half-millionth
    where: 'worked example "The wavelength of an FM station": green light (530 nm) is about half a millionth of a metre'
    inputs: {lam: 530 nm}
    formula: lam
    expected: 0.5e-6 m
    tolerance: '10%'
    shown: ['green light was half a millionth of a metre']
    source: {cite: reading1, at: 'Sec. 11.2'}
    origin: page-own

