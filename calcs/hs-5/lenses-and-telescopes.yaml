# Calculations on content/year-0/hs-5/lenses-and-telescopes.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/lenses-and-telescopes.mdx
calcs:
  - id: reading-glasses-f
    where: 'section "Converging and diverging lenses": +2.5 dioptres gives f = 1/P'
    inputs: {P: 2.5 1/m}
    formula: 1 / P
    expected: 0.40 m
    shown: ['$f = 1/2.5 = 0.40\ \text{m}$']
    source: {cite: reading1, at: 'Lecture 4, slide 7'}
    origin: page-own

  - id: diverging-glasses-f
    where: 'section "Converging and diverging lenses": −4.0 dioptres gives f = 1/P'
    inputs: {P: -4.0 1/m}
    formula: 1 / P
    expected: -0.25 m
    shown: ['$f = -0.25\ \text{m}$']
    source: {cite: reading1, at: 'Lecture 4, slide 7'}
    origin: page-own

  - id: plot-two-f
    kind: identity
    where: 'plot caption: with f = 0.10 m, at d_o = 2f = 0.20 m the image distance f d_o/(d_o − f) equals d_o'
    formula: f * x / (x - f)
    equals: x
    samples: {f: [0.10, 0.05, 0.2], x: [0.20, 0.10, 0.4]}
    tolerance: 1e-12
    shown: ['At d_o = 2f = 0.20 m the image is just as far away as the object']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: plot-lens-formula-form
    kind: identity
    where: 'plot caption: d_i = f d_o/(d_o − f) is the lens formula 1/f = 1/d_o + 1/d_i solved for d_i'
    formula: 1 / (1 / f - 1 / x)
    equals: f * x / (x - f)
    samples: {f: [0.10, 0.10, 0.15], x: [0.05, 0.3, 0.6]}
    tolerance: 1e-12
    shown: ['computed from the lens formula as d_i = f d_o/(d_o − f)']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: camera-inverse
    where: 'worked example "Focusing a camera", step "Image distance": 1/d_i = 1/f − 1/d_o'
    inputs: {f: 0.050 m, d_o: 3.0 m}
    formula: 1 / f - 1 / d_o
    expected: 19.67 1/m
    shown: ['$1/d_i = 1/f - 1/d_o = 1/0.050 - 1/3.0 = 20 - 0.33 = 19.67$ per metre']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: camera-di
    where: 'worked example "Focusing a camera": d_i'
    inputs: {f: 0.050 m, d_o: 3.0 m}
    formula: 1 / (1 / f - 1 / d_o)
    expected: 0.0508 m
    shown: ['$d_i = 0.0508\ \text{m} = 50.8\ \text{mm}$']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: camera-M
    where: 'worked example "Focusing a camera", step "Magnification": M = −d_i/d_o'
    inputs: {f: 0.050 m, d_o: 3.0 m}
    formula: -(1 / (1 / f - 1 / d_o)) / d_o
    expected: '-0.0169'
    shown: ['$M = -d_i/d_o = -0.0508/3.0 = -0.0169$']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: camera-hi
    where: 'worked example "Focusing a camera": h_i = |M| h_o'
    inputs: {f: 0.050 m, d_o: 3.0 m, h_o: 1.80 m}
    formula: h_o * (1 / (1 / f - 1 / d_o)) / d_o
    expected: 0.0305 m
    shown: ['$h_i = 0.0169 \times 1.80 = 0.0305\ \text{m} = 30.5\ \text{mm}$']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: camera-shift
    where: 'worked example "Focusing a camera", step "What focusing means": the lens moves from 50.0 mm to 50.8 mm'
    inputs: {f: 0.050 m, d_o: 3.0 m}
    formula: 1 / (1 / f - 1 / d_o) - f
    expected: 0.85 mm
    shown: ['the camera moves the lens about $0.85\ \text{mm}$ further from the sensor']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: magnifier-f
    where: 'worked example "A magnifying glass", step "Focal length": f = 1/P'
    inputs: {P: 12.5 1/m}
    formula: 1 / P
    expected: 0.080 m
    shown: ['$f = 1/P = 1/12.5 = 0.080\ \text{m}$']
    source: {cite: reading1, at: 'Lecture 4, slide 7'}
    origin: page-own

  - id: magnifier-inverse
    where: 'worked example "A magnifying glass", step "Image distance": 1/d_i'
    inputs: {f: 0.080 m, d_o: 0.060 m}
    formula: 1 / f - 1 / d_o
    expected: -4.2 1/m
    shown: ['$1/d_i = 1/0.080 - 1/0.060 = 12.5 - 16.7 = -4.2$ per metre']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: magnifier-di
    where: 'worked example "A magnifying glass": d_i'
    inputs: {f: 0.080 m, d_o: 0.060 m}
    formula: 1 / (1 / f - 1 / d_o)
    expected: -0.24 m
    shown: ['so $d_i = -0.24\ \text{m}$']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: magnifier-M
    where: 'worked example "A magnifying glass", step "Magnification": M = −d_i/d_o'
    inputs: {f: 0.080 m, d_o: 0.060 m}
    formula: -(1 / (1 / f - 1 / d_o)) / d_o
    expected: '4.0'
    shown: ['$M = -d_i/d_o = -(-0.24)/0.060 = +4.0$']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: telescope-M
    where: 'worked example "A small refracting telescope", step "Magnification": M_a = f_o/f_e'
    inputs: {fo: 0.900 m, fe: 0.025 m}
    formula: fo / fe
    expected: '36'
    shown: ['$M_a = f_o/f_e = 0.900/0.025 = 36$']
    source: {cite: reading2, at: 'Lecture 8, slide 13'}
    origin: page-own

  - id: telescope-length
    where: 'worked example "A small refracting telescope", step "Length": f_o + f_e'
    inputs: {fo: 0.900 m, fe: 0.025 m}
    formula: fo + fe
    expected: 0.925 m
    shown: ['$f_o + f_e = 0.900 + 0.025 = 0.925\ \text{m}$']
    source: {cite: reading2, at: 'Lecture 8, slide 13'}
    origin: page-own

  - id: telescope-M-10mm
    where: 'worked example "A small refracting telescope": a 10 mm eyepiece'
    inputs: {fo: 0.900 m, fe: 0.010 m}
    formula: fo / fe
    expected: '90'
    shown: ['Swapping to a $10\ \text{mm}$ eyepiece gives $M_a = 90$']
    source: {cite: reading2, at: 'Lecture 8, slide 13'}
    origin: page-own

  - id: hubble-mirror
    kind: fact
    where: 'section "Telescopes": Hubble''s mirror is 2.4 m across'
    value: 2.4 m
    shown: ['with a mirror $2.4\ \text{m}$ across']
    source: {cite: webb, at: 'Telescope Overview, comparison table'}
    origin: mit

  - id: webb-area
    kind: fact
    where: 'section "Why bigger is better": Webb''s collecting area 25.37 m², 5.6 times Hubble''s'
    value: 25 m**2
    tolerance: '2%'
    shown: ['a collecting area of about $25\ \text{m}^2$, more than five times that of Hubble']
    source: {cite: webb, at: 'Telescope Overview, comparison table: 25.37 m², 5.6 times Hubble'}
    origin: mit

  - id: eye-vs-telescope
    where: 'worked example "A telescope against your eye": (D_telescope/D_pupil)²'
    inputs: {D: 0.10 m, d: 0.0070 m}
    formula: (D / d)**2
    expected: '204'
    shown: ['$(0.10/0.0070)^2 = 14.3^2 = 204$']
    source: {cite: webb, at: 'NASA: a larger mirror collects more light in a given time (paraphrase); area grows with D²'}
    origin: page-own

  - id: eye-vs-telescope-ratio
    where: 'worked example "A telescope against your eye": D_telescope/D_pupil'
    inputs: {D: 0.10 m, d: 0.0070 m}
    formula: D / d
    expected: '14.3'
    shown: ['$(0.10/0.0070)^2 = 14.3^2 = 204$']
    source: {cite: webb, at: 'NASA: a larger mirror collects more light in a given time (paraphrase); area grows with D²'}
    origin: page-own

  - id: quiz-strength
    where: 'quiz 0: P = 1/f for f = 0.20 m'
    inputs: {f: 0.20 m}
    formula: 1 / f
    expected: 5.0 1/m
    shown: ['$P = 1/f = 1/0.20 = 5.0$ dioptres']
    quiz: 0
    source: {cite: reading1, at: 'Lecture 4, slide 7'}
    origin: page-own

  - id: quiz-candle
    where: 'quiz 1: f = 15 cm, d_o = 30 cm gives d_i = 30 cm'
    inputs: {f: 15 cm, d_o: 30 cm}
    formula: 1 / (1 / f - 1 / d_o)
    expected: 30 cm
    shown: ['$1/d_i = 1/15 - 1/30 = 1/30$, so $d_i = 30\\ \\text{cm}$']
    quiz: 1
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: quiz-candle-M
    where: 'quiz 1: M = −d_i/d_o = −1'
    inputs: {di: 30 cm, d_o: 30 cm}
    formula: -di / d_o
    expected: '-1'
    shown: ['$M = -30/30 = -1$']
    source: {cite: mit, at: 'Lecture 5, slide 2'}
    origin: page-own

  - id: quiz-telescope
    where: 'quiz 3: M_a = f_o/f_e = 1.2/0.020'
    inputs: {fo: 1.2 m, fe: 0.020 m}
    formula: fo / fe
    expected: '60'
    shown: ['$M_a = f_o/f_e = 1.2/0.020 = 60$']
    quiz: 3
    source: {cite: reading2, at: 'Lecture 8, slide 13'}
    origin: page-own

  - id: quiz-aperture
    where: 'quiz 4: twice the diameter collects 2² = 4 times the light'
    inputs: {r: 2}
    formula: r**2
    expected: '4'
    shown: ['$2^2 = 4$ times as much']
    source: {cite: webb, at: 'NASA: a larger mirror collects more light in a given time (paraphrase); area grows with D²'}
    origin: page-own
