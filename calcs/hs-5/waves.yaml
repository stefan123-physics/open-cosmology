# Calculations on content/year-0/hs-5/waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/waves.mdx
calcs:
  - id: quiz-guitar-wavelength
    where: 'quiz 1: λ = v/f for 308 m/s at 220 Hz'
    inputs: {v: 308 m/s, f: 220 1/s}
    formula: v / f
    expected: 1.4 m
    shown: ['$\\lambda = v/f = 308/220 = 1.4\\ \\text{m}$']
    quiz: 1
    source: {cite: mit, at: 'Sec. 8.7'}
    origin: page-own

  - id: quiz-double-frequency
    kind: identity
    where: 'quiz 3: at fixed v, doubling f halves λ = v/f'
    formula: v / (2 * f)
    equals: 0.5 * v / f
    samples: {v: [1.5, 340.0], f: [2.0, 256.0]}
    tolerance: 1e-12
    shown: ['doubling $f$ halves $\\lambda$']
    source: {cite: mit, at: 'Sec. 8.7'}
    origin: page-own

  - id: ripple-wavelength-m
    where: 'worked example "Ripples in a tank", step "Read off frequency and wavelength": 1.5 cm in metres'
    inputs: {d: 1.5 cm}
    formula: d
    expected: 0.015 m
    shown: ['$\lambda = 1.5\ \text{cm} = 0.015\ \text{m}$']
    source: {cite: mit, at: 'Sec. 8.4–8.5'}
    origin: page-own

  - id: ripple-speed
    where: 'worked example, step "Use the wave equation": v = fλ'
    inputs: {f: 12 1/s, lam: 0.015 m}
    formula: f * lam
    expected: 0.18 m/s
    shown: ['$v = f\lambda = 12 \times 0.015 = 0.18\ \text{m/s}$', 'each crest moves 18 centimetres every second']
    source: {cite: mit, at: 'Sec. 8.7'}
    origin: page-own

  - id: swell-frequency
    where: 'worked example "Ocean swell", step "Frequency": f = 1/T'
    inputs: {T: 10 s}
    formula: 1 / T
    expected: 0.10 1/s
    shown: ['$f = 1/T = 1/10 = 0.10\ \text{Hz}$']
    source: {cite: mit, at: 'Sec. 8.6'}
    origin: page-own

  - id: swell-speed
    where: 'worked example, step "Speed": v = λ/T'
    inputs: {lam: 150 m, T: 10 s}
    formula: lam / T
    expected: 15 m/s
    shown: ['$v = \lambda/T = 150/10 = 15\ \text{m/s}$']
    source: {cite: mit, at: 'Sec. 8.7'}
    origin: page-own

  - id: swell-speed-kmh
    where: 'worked example: "about 54 km/h"'
    inputs: {v: 15 m/s}
    formula: v
    expected: 54 km/hour
    shown: ['about $54\ \text{km/h}$']
    source: {cite: mit, at: 'Sec. 8.7'}
    origin: page-own

  - id: fork-wavelength
    where: 'worked example "The wavelength of a sound": λ = v/f'
    inputs: {v: 340 m/s, f: 256 1/s}
    formula: v / f
    expected: 1.33 m
    shown: ['$\lambda = v/f = 340/256 = 1.33\ \text{m}$']
    source: {cite: reading2, at: 'Sec. 9.5'}
    origin: page-own

  - id: plot-speed
    kind: fact
    where: 'plot caption: the wave in the plot travels at 1.5 m/s with amplitude 0.10 m (set in the plotted formula)'
    value: 1.5 m/s
    shown: ['travelling to the right at 1.5 m/s']
    source: {cite: mit, at: 'Sec. 8.7'}
    origin: page-own
