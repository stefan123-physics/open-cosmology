# Calculations on content/year-0/hs-5/polarization.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Angles are plain numbers in degrees; trig functions take radians, hence the factors pi/180 and 180/pi.

page: content/year-0/hs-5/polarization.mdx
calcs:
  - id: malus-from-amplitude
    kind: identity
    where: 'section "A second filter": amplitude times cos θ, intensity proportional to amplitude squared, gives I₀cos²θ'
    formula: (A * cos(t * pi / 180))**2 / A**2
    equals: cos(t * pi / 180)**2
    samples: {A: [1.0, 2.5, 0.3], t: [0.0, 35.0, 80.0]}
    tolerance: 1e-12
    shown: ['the intensity is multiplied by $\cos^2\theta$']
    source: {cite: reading1, at: 'p. 5'}
    origin: mit

  - id: malus-zero
    where: 'section "A second filter": cos 0° = 1, all light passes'
    inputs: {}
    formula: cos(0)
    expected: '1'
    shown: ['$\cos 0° = 1$, so all of it passes']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: malus-crossed
    where: 'section "A second filter" and worked example step "Crossed": cos 90° = 0'
    inputs: {}
    formula: cos(90 * pi / 180)
    expected: '0'
    tolerance: 1e-12
    shown: ['$\cos 90° = 0$, so nothing passes', 'At $90°$, $\cos^2 90° = 0$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: plot-formula
    kind: identity
    where: 'plot: the curve cos(th·π/180)² is cos²θ with θ in degrees'
    formula: cos(th * pi / 180)**2
    equals: (cos(th * pi / 180))**2
    samples: {th: [0.0, 45.0, 90.0, 135.0, 180.0]}
    tolerance: 1e-12
    shown: ['{ expr: "cos(th*pi/180)^2", label: "cos²θ" }']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: plot-half-at-45
    where: 'plot: the point at 45° and the caption ("half at 45°")'
    inputs: {}
    formula: cos(45 * pi / 180)**2
    expected: '0.5'
    shown: ['{ x: 45, y: 0.5, label: "half at 45°" }', 'half at 45°, and none at 90°']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: plot-all-at-180
    where: 'plot caption: all passes at 180°'
    inputs: {}
    formula: cos(180 * pi / 180)**2
    expected: '1'
    shown: ['All of it passes at 0° and at 180°']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: we-first-filter
    where: 'worked example "A lamp and two filters", step "The first filter"'
    inputs: {I0: 240 W/m**2}
    formula: I0 / 2
    expected: 120 W/m**2
    shown: ['$I_1 = 240/2 = 120\ \text{W/m}^2$']
    source: {cite: reading2, at: 'pp. 18–19'}
    origin: page-own

  - id: we-cos2-35
    where: 'worked example, step "The second filter": cos² 35°'
    inputs: {}
    formula: cos(35 * pi / 180)**2
    expected: '0.671'
    shown: ['\cos^2 35° = 120 \times 0.671']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: we-second-filter
    where: 'worked example, step "The second filter": I₂ = 120 cos² 35°'
    inputs: {I1: 120 W/m**2}
    formula: I1 * cos(35 * pi / 180)**2
    expected: 80.5 W/m**2
    shown: ['$I_2 = 120 \times \cos^2 35° = 120 \times 0.671 = 80.5\ \text{W/m}^2$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: we-about-a-third
    where: 'worked example: 80.5 of 240 W/m² is about a third'
    inputs: {I2: 80.5 W/m**2, I0: 240 W/m**2}
    formula: I2 / I0
    expected: '0.333'
    tolerance: '3%'
    shown: ['Together the two filters pass about a third of the lamp''s light.']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: dim-cos
    where: 'worked example "Dimming to a tenth", step "Set up Malus''s law": cos θ = √0.10'
    inputs: {}
    formula: sqrt(0.10)
    expected: '0.316'
    shown: ['$\cos\theta = \sqrt{0.10} = 0.316$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: dim-angle
    where: 'worked example, step "Find the angle": the angle whose cosine is 0.316'
    inputs: {}
    formula: acos(sqrt(0.10)) * 180 / pi
    expected: '71.6'
    shown: ['$\theta = 71.6°$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-unpolarized-half
    where: 'quiz 1: unpolarized 500 W/m² through one filter'
    inputs: {I0: 500 W/m**2}
    formula: I0 / 2
    expected: 250 W/m**2
    shown: ['$500/2 = 250\\ \\text{W/m}^2$']
    quiz: 1
    source: {cite: reading2, at: 'pp. 18–19'}
    origin: page-own

  - id: quiz-malus-50
    where: 'quiz 2: 80 W/m² at 50°'
    inputs: {I0: 80 W/m**2}
    formula: I0 * cos(50 * pi / 180)**2
    expected: 33 W/m**2
    tolerance: '1%'
    shown: ['$I = I_0\\cos^2 50° = 80 \\times 0.413 = 33\\ \\text{W/m}^2$']
    quiz: 2
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-cos2-50
    where: 'quiz 2: cos² 50°'
    inputs: {}
    formula: cos(50 * pi / 180)**2
    expected: '0.413'
    shown: ['80 \\times 0.413']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-wrong-unsquared
    where: 'quiz 2: the wrong choice 80 cos 50° (cosine not squared)'
    inputs: {I0: 80 W/m**2}
    formula: I0 * cos(50 * pi / 180)
    expected: 51 W/m**2
    tolerance: '1%'
    shown: ['($51$ would be $80\\cos 50°$: the cosine must be squared.)']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-fifth-cos
    where: 'quiz 4: cos θ = √0.20'
    inputs: {}
    formula: sqrt(0.20)
    expected: '0.447'
    shown: ['$\\cos\\theta = \\sqrt{0.20} = 0.447$']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-fifth-angle
    where: 'quiz 4: cos²θ = 0.20 gives θ = 63.4° (63.4° is also a wrong choice, so no quiz field here)'
    inputs: {}
    formula: acos(sqrt(0.20)) * 180 / pi
    expected: '63.4'
    shown: ['$\\theta = 63.4°$ between the two directions']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-fifth-wrong-linear
    where: 'quiz 4: the wrong choice 18° is a fifth of 90°; turned 18° from crossed, θ = 72° and cos²72° is about 0.095, not 0.20'
    inputs: {}
    formula: cos((90 - 90 / 5) * pi / 180)**2
    expected: '0.0955'
    tolerance: '1%'
    shown: ['($18°$ is a fifth of the quarter turn, but the intensity does not grow in step with the angle.)']
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: quiz-fifth-turn
    where: 'quiz 4: from crossed (90°) to 63.4° is a turn of 26.6°'
    inputs: {}
    formula: 90 - acos(sqrt(0.20)) * 180 / pi
    expected: '26.6'
    shown: ['$90° - 63.4° = 26.6°$']
    quiz: 4
    source: {cite: reading1, at: 'p. 5'}
    origin: page-own

  - id: sky-90
    kind: fact
    where: 'section "Polarization in nature": skylight most strongly polarized 90° from the Sun'
    value: 90 deg
    shown: ['most strongly in the part of the sky $90°$ away from the Sun']
    source: {cite: rayleigh, at: 'degree of polarization'}
    origin: mit
