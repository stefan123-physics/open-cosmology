# Calculations on content/year-0/hs-5/simple-harmonic-motion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/simple-harmonic-motion.mdx
calcs:
  - id: quiz-period
    where: 'quiz 0: 20 oscillations in 8.0 s, period'
    inputs: {t: 8.0 s}
    formula: t / 20
    expected: 0.40 s
    shown: ['$T = 8.0/20 = 0.40\\ \\text{s}$']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: quiz-frequency
    where: 'quiz 0: frequency f = 1/T'
    inputs: {t: 8.0 s}
    formula: 20 / t
    expected: 2.5 1/s
    shown: ['$f = 1/T = 2.5\\ \\text{Hz}$']
    quiz: 0
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: quiz-half-period
    kind: identity
    where: 'quiz 2: four times the spring constant halves T = 2π√(m/k)'
    formula: 2 * pi * sqrt(m / (4 * k))
    equals: 0.5 * 2 * pi * sqrt(m / k)
    samples: {m: [0.4, 2.0], k: [25.0, 316.0]}
    tolerance: 1e-12
    shown: ['so $k$ must become four times as large']
    source: {cite: mit, at: 'Eqs. (19) and (49)'}
    origin: page-own

  - id: block-omega
    where: 'worked example "A block on a spring", step "Angular frequency": ω = √(25/0.40)'
    inputs: {k: 25 N/m, m: 0.40 kg}
    formula: sqrt(k / m)
    expected: 7.91 1/s
    shown: ['$\omega = \sqrt{k/m} = \sqrt{25/0.40} = \sqrt{62.5} = 7.91\ \text{rad/s}$']
    source: {cite: mit, at: 'Eq. (19)'}
    origin: page-own

  - id: block-omega-squared
    where: 'worked example, step "Angular frequency": k/m = 62.5'
    inputs: {k: 25 N/m, m: 0.40 kg}
    formula: k / m
    expected: 62.5 1/s**2
    shown: ['\sqrt{62.5}']
    source: {cite: mit, at: 'Eq. (19)'}
    origin: page-own

  - id: block-period
    where: 'worked example, step "Period and frequency": T = 2π/ω'
    inputs: {k: 25 N/m, m: 0.40 kg}
    formula: 2 * pi * sqrt(m / k)
    expected: 0.79 s
    shown: ['$T = 2\pi/\omega = 2\pi/7.91 = 0.79\ \text{s}$']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: block-frequency
    where: 'worked example, step "Period and frequency": f = 1/T'
    inputs: {k: 25 N/m, m: 0.40 kg}
    formula: sqrt(k / m) / (2 * pi)
    expected: 1.26 1/s
    shown: ['$f = \omega/2\pi = 1.26\ \text{Hz}$']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: block-vmax
    where: 'worked example, step "Largest speed": v_max = ωA'
    inputs: {k: 25 N/m, m: 0.40 kg, A: 0.050 m}
    formula: sqrt(k / m) * A
    expected: 0.40 m/s
    shown: ['$v_\text{max} = \omega A = 7.91 \times 0.050 = 0.40\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (58)'}
    origin: page-own

  - id: block-amax
    where: 'worked example, step "Largest acceleration": a_max = ω²A'
    inputs: {k: 25 N/m, m: 0.40 kg, A: 0.050 m}
    formula: k / m * A
    expected: 3.1 m/s**2
    shown: ['$a_\text{max} = \omega^2 A = 62.5 \times 0.050 = 3.1\ \text{m/s}^2$']
    source: {cite: mit, at: 'Eq. (20)'}
    origin: page-own

  - id: stopwatch-period
    where: 'worked example "Measuring a spring constant with a stopwatch", step "Period": 10 oscillations in 5.0 s'
    inputs: {t: 5.0 s}
    formula: t / 10
    expected: 0.50 s
    shown: ['$T = 5.0/10 = 0.50\ \text{s}$']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: stopwatch-k
    where: 'worked example, step "Calculate": k = 4π²m/T²'
    inputs: {m: 2.0 kg, T: 0.50 s}
    formula: 4 * pi**2 * m / T**2
    expected: 316 N/m
    shown: ['$k = 4\pi^2 \times 2.0/0.50^2 = 316\ \text{N/m}$', 'about $3.2 \times 10^2\ \text{N/m}$']
    source: {cite: mit, at: 'Eqs. (19) and (49)'}
    origin: page-own

  - id: period-from-omega
    kind: identity
    where: 'T = 2π√(m/k) from ω = √(k/m) and T = 2π/ω'
    formula: 2 * pi / sqrt(k / m)
    equals: 2 * pi * sqrt(m / k)
    samples: {m: [0.4, 2.0, 7.5], k: [3.0, 25.0, 316.0]}
    tolerance: 1e-12
    shown: ['tex="T = 2\pi\sqrt{\frac{m}{k}}"']
    source: {cite: mit, at: 'Eqs. (19) and (49)'}
    origin: mit

  - id: acceleration-slope
    kind: identity
    where: 'the slope of the slope of A cos(ωt) is −ω²A cos(ωt) = −ω²x'
    formula: deriv('0.08*cos(4.2*s)', 's', t, 2)
    equals: -4.2**2 * 0.08 * cos(4.2 * t)
    samples: {t: [0.0, 0.3, 1.1]}
    tolerance: 1e-5
    shown: ['tex="a = -\omega^2 x, \qquad a_\text{max} = \omega^2 A"']
    source: {cite: mit, at: 'Eq. (20)'}
    origin: mit
