# Calculations on content/year-0/hs-5/reflection-and-refraction.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Angles are plain numbers in degrees; trig functions take radians, hence the factors pi/180 and 180/pi.

page: content/year-0/hs-5/reflection-and-refraction.mdx
calcs:
  - id: c-vacuum
    kind: fact
    where: 'section "Refraction and the refractive index": the speed of light in a vacuum used on the page'
    value: 3.00e8 m/s
    shown: ['$c = 3.00 \times 10^8\ \text{m/s}$']
    source: {cite: reading2, at: 'Sec. 5.5, refractive index'}
    origin: mit

  - id: n-air
    kind: fact
    where: 'section "Refraction and the refractive index": air, n = 1.0003 (Table 5.1: 1.0002926), used as 1.00'
    value: 1.0003
    shown: ['$n = 1.0003$', '| air | $1.0003$ |']
    source: {cite: reading2, at: 'Sec. 5.5, Table 5.1'}
    origin: mit

  - id: n-water
    kind: fact
    where: 'table and examples: water, n = 1.33 (Table 5.1: 1.333; the source''s own examples use 1.33)'
    value: 1.33
    shown: ['| water (liquid) | $1.33$ |']
    source: {cite: reading2, at: 'Sec. 5.5, Table 5.1'}
    origin: mit

  - id: n-crown-glass
    kind: fact
    where: 'table and examples: crown glass, n = 1.52'
    value: 1.52
    shown: ['| crown glass | $1.52$ |']
    source: {cite: reading2, at: 'Sec. 5.5, Table 5.1'}
    origin: mit

  - id: n-sapphire
    kind: fact
    where: 'table and quiz 3: sapphire, n = 1.77'
    value: 1.77
    shown: ['| sapphire | $1.77$ |']
    source: {cite: reading2, at: 'Sec. 5.5, Table 5.1'}
    origin: mit

  - id: n-diamond
    kind: fact
    where: 'table and examples: diamond, n = 2.42 (Table 5.1: 2.419)'
    value: 2.42
    shown: ['| diamond | $2.42$ |']
    source: {cite: reading2, at: 'Sec. 5.5, Table 5.1'}
    origin: mit

  - id: quiz-mirror-angle
    where: 'quiz 0: a ray at 20° to the mirror surface makes 70° with the normal'
    inputs: {a: 20}
    formula: 90 - a
    expected: '70'
    shown: ['$90^\\circ - 20^\\circ = 70^\\circ$']
    quiz: 0
    source: {cite: reading1, at: 'Sec. 5.3, law of reflection'}
    origin: page-own

  - id: mirror-30
    where: 'section "Reflection": a ray at 30° to the mirror makes 60° with the normal'
    inputs: {a: 30}
    formula: 90 - a
    expected: '60'
    shown: ['$90^\circ - 30^\circ = 60^\circ$']
    source: {cite: reading1, at: 'Sec. 5.3, law of reflection'}
    origin: page-own

  - id: quiz-plastic-index
    where: 'quiz 1: n = c/v for v = 2.00 × 10^8 m/s'
    inputs: {c: 3.00e8 m/s, v: 2.00e8 m/s}
    formula: c / v
    expected: '1.50'
    shown: ['$n = c/v = (3.00 \\times 10^8)/(2.00 \\times 10^8) = 1.50$']
    quiz: 1
    source: {cite: reading2, at: 'Sec. 5.5, refractive index'}
    origin: page-own

  - id: diamond-speed
    where: 'worked example "Light inside a diamond": v = c/n'
    inputs: {c: 3.00e8 m/s, n: 2.42}
    formula: c / n
    expected: 1.24e8 m/s
    shown: ['$v = c/n = (3.00 \times 10^8)/2.42 = 1.24 \times 10^8\ \text{m/s}$']
    source: {cite: reading2, at: 'Sec. 5.5, refractive index'}
    origin: page-own

  - id: diamond-speed-under-half
    where: 'worked example: 1.24 × 10^8 m/s is "well under half" of c (v/c = 1/2.42 = 0.41)'
    inputs: {n: 2.42}
    formula: 1 / n
    expected: '0.41'
    shown: ['well under half its speed in a vacuum']
    source: {cite: reading2, at: 'Sec. 5.5'}
    origin: page-own

  - id: green-in-water
    where: 'section "Refraction and the refractive index": wavelength of 530 nm light in water, λ/n'
    inputs: {lam: 530 nm, n: 1.33}
    formula: lam / n
    expected: 398 nm
    shown: ['$530/1.33 = 398\ \text{nm}$']
    source: {cite: reading2, at: 'Sec. 5.5 (frequency unchanged) with v = fλ'}
    origin: page-own

  - id: glass-sin50
    where: 'worked example "Into a glass block", step "Snell''s law": sin 50° = 0.766'
    inputs: {a: 50}
    formula: sin(a * pi / 180)
    expected: '0.766'
    shown: ['$\sin\theta_2 = 0.766/1.52 = 0.504$']
    source: {cite: reading3, at: 'Sec. 5.6, Snell''s law'}
    origin: page-own

  - id: glass-sin-theta2
    where: 'worked example, step "Snell''s law": sin θ2 = sin 50° / 1.52'
    inputs: {a: 50, n: 1.52}
    formula: sin(a * pi / 180) / n
    expected: '0.504'
    shown: ['$\sin\theta_2 = 0.766/1.52 = 0.504$']
    source: {cite: reading3, at: 'Sec. 5.6, Snell''s law'}
    origin: page-own

  - id: glass-theta2
    where: 'worked example, step "The angle": θ2 = asin(sin 50° / 1.52)'
    inputs: {a: 50, n: 1.52}
    formula: asin(sin(a * pi / 180) / n) * 180 / pi
    expected: '30.3'
    shown: ['$\theta_2 = \sin^{-1}(0.504) = 30.3^\circ$']
    source: {cite: reading3, at: 'Sec. 5.6, Snell''s law'}
    origin: page-own

  - id: pool-sin-theta2
    where: 'worked example "Out of a swimming pool", step "Snell''s law, from water into air"'
    inputs: {a: 30, n: 1.33}
    formula: n * sin(a * pi / 180)
    expected: '0.665'
    shown: ['$\sin\theta_2 = 1.33 \times \sin 30^\circ = 1.33 \times 0.500 = 0.665$']
    source: {cite: reading3, at: 'Sec. 5.6, Snell''s law'}
    origin: page-own

  - id: pool-theta2
    where: 'worked example, step "The angle"'
    inputs: {a: 30, n: 1.33}
    formula: asin(n * sin(a * pi / 180)) * 180 / pi
    expected: '41.7'
    shown: ['$\theta_2 = \sin^{-1}(0.665) = 41.7^\circ$']
    source: {cite: reading3, at: 'Sec. 5.6, Snell''s law'}
    origin: page-own

  - id: glass-limit-angle
    where: 'text before the plot (largest refraction angle in glass, sine 1/n) and the diamond example (critical angle of crown glass): asin(1/1.52)'
    inputs: {n: 1.52}
    formula: asin(1 / n) * 180 / pi
    expected: '41.1'
    shown: ['$41.1^\circ$ in crown glass', 'For crown glass the critical angle is $41.1^\circ$']
    source: {cite: reading4, at: 'Sec. 5.7, critical angle'}
    origin: page-own

  - id: plot-indices
    kind: fact
    where: 'plot caption: the indices set in the plotted formulas (water 1.33, crown glass 1.52, slider start 2.42)'
    value: 1.52
    shown: ['crown glass (n = 1.52)', 'it starts at diamond, n = 2.42']
    source: {cite: reading2, at: 'Sec. 5.5, Table 5.1'}
    origin: page-own

  - id: glass-50-tir
    where: 'section "Total internal reflection": a ray inside glass at 50° would need sin θ2 = 1.52 sin 50° > 1'
    inputs: {a: 50, n: 1.52}
    formula: n * sin(a * pi / 180)
    expected: '1.16'
    shown: ['$\sin\theta_2 = 1.52 \times \sin 50^\circ = 1.16$']
    source: {cite: reading4, at: 'Sec. 5.7, total internal reflection'}
    origin: page-own

  - id: diamond-sin-crit
    where: 'worked example "Why diamonds sparkle", step "Critical angle": sin θc = 1/2.42'
    inputs: {n: 2.42}
    formula: 1 / n
    expected: '0.413'
    shown: ['$\sin\theta_c = 1.00/2.42 = 0.413$']
    source: {cite: reading4, at: 'Sec. 5.7, critical angle'}
    origin: page-own

  - id: diamond-crit
    where: 'worked example, step "Critical angle": θc = asin(1/2.42)'
    inputs: {n: 2.42}
    formula: asin(1 / n) * 180 / pi
    expected: '24.4'
    shown: ['$\theta_c = \sin^{-1}(0.413) = 24.4^\circ$', 'more than $24.4^\circ$ to the normal']
    source: {cite: reading4, at: 'Sec. 5.7, critical angle'}
    origin: page-own

  - id: fibre-crit
    where: 'section "Total internal reflection", optical fibres: core 1.48, cladding 1.46'
    inputs: {n1: 1.48, n2: 1.46}
    formula: asin(n2 / n1) * 180 / pi
    expected: '80.6'
    shown: ['$\sin^{-1}(1.46/1.48) = 80.6^\circ$']
    source: {cite: reading4, at: 'Sec. 5.7, critical angle'}
    origin: page-own

  - id: quiz-sapphire-sin
    where: 'quiz 3: sin θc = 1.00/1.77'
    inputs: {n: 1.77}
    formula: 1 / n
    expected: '0.565'
    shown: ['$\\sin\\theta_c = n_2/n_1 = 1.00/1.77 = 0.565$']
    source: {cite: reading4, at: 'Sec. 5.7, critical angle'}
    origin: page-own

  - id: quiz-sapphire-crit
    where: 'quiz 3: θc = asin(1/1.77)'
    inputs: {n: 1.77}
    formula: asin(1 / n) * 180 / pi
    expected: '34.4'
    shown: ['so $\\theta_c = 34.4^\\circ$']
    quiz: 3
    source: {cite: reading4, at: 'Sec. 5.7, critical angle'}
    origin: page-own

  - id: quiz-sapphire-distractor-complement
    where: 'quiz 3, wrong choice: 90° − 34.4° (the angle measured from the surface)'
    inputs: {n: 1.77}
    formula: 90 - asin(1 / n) * 180 / pi
    expected: '55.6'
    shown: ['"$55.6^\\circ$"']
    source: {cite: reading4, at: 'Sec. 5.7'}
    origin: page-own

  - id: quiz-sapphire-distractor-water
    where: 'quiz 3, wrong choice: the critical angle from sapphire into water, asin(1.33/1.77)'
    inputs: {n1: 1.77, n2: 1.33}
    formula: asin(n2 / n1) * 180 / pi
    expected: '48.7'
    shown: ['"$48.7^\\circ$"']
    source: {cite: reading4, at: 'Sec. 5.7'}
    origin: page-own

  - id: quiz-sapphire-distractor-tan
    where: 'quiz 3, wrong choice: tan⁻¹(1/1.77) instead of sin⁻¹ (wrong calculator key)'
    inputs: {n: 1.77}
    formula: atan(1 / n) * 180 / pi
    expected: '29.5'
    shown: ['"$29.5^\\circ$"']
    source: {cite: reading4, at: 'Sec. 5.7'}
    origin: page-own
