# Calculations on content/year-0/hs-5/interference-and-diffraction-of-light.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Angles are plain numbers in degrees; trig functions take radians, hence the factors pi/180 and 180/pi.

page: content/year-0/hs-5/interference-and-diffraction-of-light.mdx
calcs:
  - id: quiz-fringe-spacing
    where: 'quiz 2: Δy = λL/d for 480 nm, 3.0 m, 0.40 mm'
    inputs: {lam: 480 nm, L: 3.0 m, d: 0.40 mm}
    formula: lam * L / d
    expected: 3.6 mm
    shown: ['$\\Delta y = \\lambda L/d = (480 \\times 10^{-9} \\times 3.0)/(0.40 \\times 10^{-3}) = 3.6 \\times 10^{-3}\\ \\text{m} = 3.6\\ \\text{mm}$']
    quiz: 2
    source: {cite: mit802, at: 'Eq. (14.2.8)'}
    origin: page-own

  - id: quiz-grating-d
    where: 'quiz 4: slit spacing of a grating with 600 lines per mm'
    inputs: {N: 600 1/mm}
    formula: 1 / N
    expected: 1.67e-6 m
    shown: ['$d = 1/600\\ \\text{mm} = 1.67 \\times 10^{-6}\\ \\text{m}$']
    source: {cite: mit802, at: 'Sec. 14.8'}
    origin: page-own

  - id: quiz-grating-sin
    where: 'quiz 4: sin θ = λ/d for 540 nm'
    inputs: {lam: 540 nm, N: 600 1/mm}
    formula: lam * N
    expected: '0.324'
    tolerance: 1e-9
    shown: ['$\\sin\\theta = \\lambda/d = 540 \\times 10^{-9}/1.67 \\times 10^{-6} = 0.324$']
    source: {cite: mit802, at: 'Eq. (14.8.1)'}
    origin: page-own

  - id: quiz-grating-angle
    where: 'quiz 4: θ = asin(0.324)'
    inputs: {s: '0.324'}
    formula: asin(s) * 180 / pi
    expected: '18.9'
    shown: ['$\\theta = 18.9^\\circ$']
    quiz: 4
    source: {cite: mit802, at: 'Eq. (14.8.1)'}
    origin: page-own

  - id: speakers-lambda
    where: 'worked example "Two loudspeakers", step "Wavelength": λ = v/f'
    inputs: {v: 343 m/s, f: 686 1/s}
    formula: v / f
    expected: 0.500 m
    shown: ['$\lambda = v/f = 343/686 = 0.500\ \text{m}$']
    source: {cite: mit802, at: 'Sec. 14.2'}
    origin: page-own

  - id: speakers-path-difference
    where: 'worked example, step "Path difference": (3.75 − 3.00)/λ = 1.5'
    inputs: {r2: 3.75 m, r1: 3.00 m, lam: 0.500 m}
    formula: (r2 - r1) / lam
    expected: '1.5'
    tolerance: 1e-9
    shown: ['$r_2 - r_1 = 3.75 - 3.00 = 0.75\ \text{m} = 1.5\lambda$']
    source: {cite: mit802, at: 'Eq. (14.2.6)'}
    origin: page-own

  - id: speakers-loud-spot
    where: 'worked example: a path difference of 1.00 m is 2λ'
    inputs: {s: 1.00 m, lam: 0.500 m}
    formula: s / lam
    expected: '2'
    tolerance: 1e-9
    shown: ['$1.00\ \text{m} = 2\lambda$']
    source: {cite: mit802, at: 'Eq. (14.2.5)'}
    origin: page-own

  - id: laser-sin
    where: 'worked example "Fringes from a laser pointer", step "Angle of the first fringe": sin θ = λ/d'
    inputs: {lam: 635 nm, d: 0.30 mm}
    formula: lam / d
    expected: '2.1e-3'
    shown: ['$\sin\theta = \lambda/d = (635 \times 10^{-9})/(0.30 \times 10^{-3}) = 2.1 \times 10^{-3}$']
    source: {cite: mit802, at: 'Eq. (14.2.5)'}
    origin: page-own

  - id: laser-angle
    where: 'worked example, step "Angle of the first fringe": θ = asin(λ/d) in degrees'
    inputs: {lam: 635 nm, d: 0.30 mm}
    formula: asin(lam / d) * 180 / pi
    expected: '0.12'
    shown: ['so $\theta = 0.12^\circ$']
    source: {cite: mit802, at: 'Eq. (14.2.5)'}
    origin: page-own

  - id: laser-spacing
    where: 'worked example, step "Fringe spacing", and the plot caption: Δy = λL/d'
    inputs: {lam: 635 nm, L: 2.5 m, d: 0.30 mm}
    formula: lam * L / d
    expected: 5.3 mm
    shown: ['$\Delta y = \lambda L/d = (635 \times 10^{-9} \times 2.5)/(0.30 \times 10^{-3}) = 5.3 \times 10^{-3}\ \text{m} = 5.3\ \text{mm}$', 'the bright fringes are 5.3 mm apart']
    source: {cite: mit802, at: 'Eq. (14.2.8)'}
    origin: page-own

  - id: plot-bright-fringes
    kind: identity
    where: 'plot: with λ = 635 nm, d = 0.30 mm, L = 2.5 m the curve cos²(πdy/λL) is 1 at y = nλL/d (y in mm, λ in nm, d in mm)'
    formula: cos(pi * 0.3 * (n * 635 * 2.5 / 300) * 1000 / (635 * 2.5))**2
    equals: 1 + 0 * n
    samples: {n: [-2.0, -1.0, 0.0, 1.0, 2.0]}
    tolerance: 1e-9
    shown: ['computed from I = I0 cos²(πdy/λL)']
    source: {cite: mit802, at: 'Eq. (14.3.15)'}
    origin: page-own

  - id: plot-dark-fringes
    kind: identity
    where: 'plot: the curve is 0 halfway between bright fringes, y = (n + 1/2)λL/d'
    formula: cos(pi * 0.3 * ((n + 0.5) * 635 * 2.5 / 300) * 1000 / (635 * 2.5))**2
    equals: 0 * n
    samples: {n: [-2.0, -1.0, 0.0, 1.0]}
    tolerance: 1e-9
    shown: ['I = I_0\cos^2\left(\frac{\pi d y}{\lambda L}\right)']
    source: {cite: mit802, at: 'Eqs. (14.2.9), (14.3.15)'}
    origin: page-own

  - id: measure-spacing
    where: 'worked example "Measuring a wavelength", step "Fringe spacing": 39.6 mm over 10 spacings'
    inputs: {s: 39.6 mm}
    formula: s / 10
    expected: 3.96 mm
    shown: ['$\Delta y = 39.6/10 = 3.96\ \text{mm}$']
    source: {cite: mit802, at: 'Eq. (14.2.8)'}
    origin: page-own

  - id: measure-wavelength
    where: 'worked example, step "Wavelength": λ = Δy d/L'
    inputs: {dy: 3.96 mm, d: 0.25 mm, L: 1.80 m}
    formula: dy * d / L
    expected: 550 nm
    shown: ['$\lambda = \Delta y\, d/L = (3.96 \times 10^{-3} \times 0.25 \times 10^{-3})/1.80 = 5.5 \times 10^{-7}\ \text{m} = 550\ \text{nm}$']
    source: {cite: mit802, at: 'Eq. (14.2.8)'}
    origin: page-own

  - id: slit-sin
    where: 'worked example "One narrow slit", step "First dark place": sin θ = λ/a'
    inputs: {lam: 635 nm, a: 0.050 mm}
    formula: lam / a
    expected: '0.0127'
    shown: ['$\sin\theta = \lambda/a = (635 \times 10^{-9})/(0.050 \times 10^{-3}) = 0.0127$']
    source: {cite: mit802, at: 'Eq. (14.5.4)'}
    origin: page-own

  - id: slit-y
    where: 'worked example, step "First dark place": y = L sin θ'
    inputs: {lam: 635 nm, a: 0.050 mm, L: 2.0 m}
    formula: L * lam / a
    expected: 0.0254 m
    shown: ['$y = L\sin\theta = 2.0 \times 0.0127 = 0.0254\ \text{m}$']
    source: {cite: mit802, at: 'Eqs. (14.2.7), (14.5.4)'}
    origin: page-own

  - id: slit-band
    where: 'worked example, step "Width of the band": 2y'
    inputs: {lam: 635 nm, a: 0.050 mm, L: 2.0 m}
    formula: 2 * L * lam / a
    expected: 5.1 cm
    shown: ['$2 \times 2.54 = 5.1\ \text{cm}$ wide']
    source: {cite: mit802, at: 'Eq. (14.5.4)'}
    origin: page-own

  - id: slit-band-ratio
    where: 'worked example, step "Width of the band": the band is a thousand times wider than the slit'
    inputs: {lam: 635 nm, a: 0.050 mm, L: 2.0 m}
    formula: (2 * L * lam / a) / a
    expected: '1000'
    tolerance: '5%'
    shown: ['a thousand times wider than the slit itself']
    source: {cite: mit802, at: 'Eq. (14.5.4)'}
    origin: page-own

  - id: eye-resolution
    where: 'worked example "Eye against telescope", step "The eye": θ_R ≈ 1.22 λ/D'
    inputs: {lam: 550 nm, D: 7.0 mm}
    formula: 1.22 * lam / D
    expected: '9.6e-5'
    shown: ['$\theta_R \approx 1.22 \times (550 \times 10^{-9})/(7.0 \times 10^{-3}) = 9.6 \times 10^{-5}$ radians']
    source: {cite: mit803, at: 'p. 6'}
    origin: page-own

  - id: telescope-resolution
    where: 'worked example, step "The telescope": θ_R ≈ 1.22 λ/D'
    inputs: {lam: 550 nm, D: 0.10 m}
    formula: 1.22 * lam / D
    expected: '6.7e-6'
    shown: ['$\theta_R \approx 1.22 \times (550 \times 10^{-9})/0.10 = 6.7 \times 10^{-6}$ radians']
    source: {cite: mit803, at: 'p. 6'}
    origin: page-own

  - id: telescope-vs-eye
    where: 'worked example, step "The telescope": about 14 times finer, the ratio of the diameters'
    inputs: {D: 0.10 m, p: 7.0 mm}
    formula: D / p
    expected: '14'
    tolerance: '3%'
    shown: ['about 14 times finer, the same factor as the ratio of the diameters']
    source: {cite: mit803, at: 'p. 6'}
    origin: page-own

  - id: door-vs-light
    where: 'section "Diffraction": visible light is roughly a million times smaller than a door (door about 0.9 m, light 400–700 nm)'
    inputs: {door: 0.9 m, lam: 550 nm}
    formula: door / lam
    expected: '1e6'
    tolerance: '70%'
    shown: ['roughly a million times smaller than a door']
    source: {cite: reading3, at: 'Sec. 6.5, Wave nature of light'}
    origin: page-own
