# Calculations on content/year-0/hs-5/the-pendulum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/the-pendulum.mdx
calcs:
  - id: quiz-four-times-length
    kind: identity
    where: 'quiz 0: four times the length doubles T = 2π√(ℓ/g)'
    formula: 2 * pi * sqrt(4 * l / g)
    equals: 2 * 2 * pi * sqrt(l / g)
    samples: {l: [0.25, 1.0, 3.0], g: [9.81, 1.62, 9.81]}
    tolerance: 1e-12
    shown: ['$\\sqrt{4} = 2$, so the period doubles']
    source: {cite: mit, at: 'Eq. (84)'}
    origin: page-own

  - id: quiz-energy-half-amplitude
    kind: identity
    where: 'quiz 2: at x = A/2 the spring energy is E/4 and the kinetic energy 3E/4'
    formula: 0.5 * k * A**2 - 0.5 * k * (A / 2)**2
    equals: 0.75 * 0.5 * k * A**2
    samples: {k: [10.0, 25.0], A: [0.02, 0.05]}
    tolerance: 1e-12
    shown: ['so the kinetic energy is the rest: $3E/4$']
    source: {cite: mit, at: 'Eqs. (56) and (58)'}
    origin: page-own

  - id: quiz-energy-double-amplitude
    kind: identity
    where: 'quiz 3: twice the amplitude gives four times E = ½kA²'
    formula: 0.5 * k * (2 * A)**2
    equals: 4 * 0.5 * k * A**2
    samples: {k: [10.0, 25.0], A: [0.02, 0.05]}
    tolerance: 1e-12
    shown: ['twice the amplitude gives four times the energy']
    source: {cite: mit, at: 'Eq. (58)'}
    origin: page-own

  - id: small-angle-10-rad
    where: 'section "The pendulum is an oscillator too": 10° in radians'
    inputs: {}
    formula: 10 * pi / 180
    expected: '0.1745'
    shown: ['At $10^\circ = 0.1745$ rad']
    source: {cite: mit, at: 'Eq. (68)'}
    origin: page-own

  - id: small-angle-10-sin
    where: 'sin 10°'
    inputs: {}
    formula: sin(10 * pi / 180)
    expected: '0.1736'
    shown: ['$\sin\theta = 0.1736$']
    source: {cite: mit, at: 'Eq. (68)'}
    origin: page-own

  - id: small-angle-10-diff
    where: 'difference between θ and sin θ at 10°, as a percentage of sin θ'
    inputs: {}
    formula: (10 * pi / 180 - sin(10 * pi / 180)) / sin(10 * pi / 180) * 100
    expected: '0.5'
    shown: ['a difference of only 0.5%']
    source: {cite: mit, at: 'Eq. (68)'}
    origin: page-own

  - id: small-angle-30-rad
    where: '30° in radians'
    inputs: {}
    formula: 30 * pi / 180
    expected: '0.524'
    shown: ['$0.524$ rad, $\sin\theta = 0.500$']
    source: {cite: mit, at: 'Eq. (68)'}
    origin: page-own

  - id: small-angle-30-diff
    where: 'difference at 30°, "about 5%"'
    inputs: {}
    formula: (30 * pi / 180 - sin(30 * pi / 180)) / sin(30 * pi / 180) * 100
    expected: '5'
    tolerance: '15%'
    shown: ['it is about 5%']
    source: {cite: mit, at: 'Eq. (68)'}
    origin: page-own

  - id: clock-length
    where: 'worked example "A clock pendulum": ℓ = gT²/(4π²)'
    inputs: {g: 9.81 m/s**2, T: 2.0 s}
    formula: g * T**2 / (4 * pi**2)
    expected: 0.99 m
    shown: ['$\ell = 9.81 \times 2.0^2/(4\pi^2) = 0.99\ \text{m}$']
    source: {cite: mit, at: 'Eq. (84)'}
    origin: page-own

  - id: earth-period
    where: 'worked example "The same pendulum on the Moon", step "On Earth"'
    inputs: {g: 9.81 m/s**2, l: 1.0 m}
    formula: 2 * pi * sqrt(l / g)
    expected: 2.0 s
    shown: ['$T = 2\pi\sqrt{1.0/9.81} = 2.0\ \text{s}$']
    source: {cite: mit, at: 'Eq. (84)'}
    origin: page-own

  - id: moon-g
    kind: fact
    where: 'worked example "The same pendulum on the Moon": g on the Moon'
    value: 1.62 m/s**2
    shown: ['where $g = 1.62\ \text{m/s}^2$ (NASA''s Moon Fact Sheet)']
    source: {cite: moon, at: 'surface gravity'}
    origin: later-data

  - id: moon-period
    where: 'worked example, step "On the Moon"'
    inputs: {g: 1.62 m/s**2, l: 1.0 m}
    formula: 2 * pi * sqrt(l / g)
    expected: 4.9 s
    shown: ['$T = 2\pi\sqrt{1.0/1.62} = 4.9\ \text{s}$']
    source: {cite: mit, at: 'Eq. (84)'}
    origin: page-own

  - id: moon-ratio
    where: 'worked example: "about two and a half times more slowly"'
    inputs: {}
    formula: sqrt(9.81 / 1.62)
    expected: '2.5'
    shown: ['about two and a half times more slowly']
    source: {cite: mit, at: 'Eq. (84)'}
    origin: page-own

  - id: share-total
    where: 'worked example "Sharing the energy", step "Total energy"'
    inputs: {k: 25 N/m, A: 0.050 m}
    formula: 0.5 * k * A**2
    expected: 0.031 J
    shown: ['$E = \tfrac12 kA^2 = \tfrac12 \times 25 \times 0.050^2 = 0.031\ \text{J}$']
    source: {cite: mit, at: 'Eq. (58)'}
    origin: page-own

  - id: share-spring
    where: 'worked example, step "Energy in the spring now"'
    inputs: {k: 25 N/m, x: 0.030 m}
    formula: 0.5 * k * x**2
    expected: 0.011 J
    shown: ['$U = \tfrac12 kx^2 = \tfrac12 \times 25 \times 0.030^2 = 0.011\ \text{J}$']
    source: {cite: mit, at: 'Eq. (55)'}
    origin: page-own

  - id: share-kinetic
    where: 'worked example, step "Kinetic energy and speed": K = E − U'
    inputs: {k: 25 N/m, A: 0.050 m, x: 0.030 m}
    formula: 0.5 * k * (A**2 - x**2)
    expected: 0.020 J
    shown: ['$K = E - U = 0.020\ \text{J}$']
    source: {cite: mit, at: 'Eq. (56)'}
    origin: page-own

  - id: share-speed
    where: 'worked example, step "Kinetic energy and speed": v = √(2K/m)'
    inputs: {k: 25 N/m, A: 0.050 m, x: 0.030 m, m: 0.40 kg}
    formula: sqrt(k * (A**2 - x**2) / m)
    expected: 0.32 m/s
    shown: ['$v = \sqrt{2K/m} = \sqrt{2 \times 0.020/0.40} = 0.32\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (56)'}
    origin: page-own

  - id: share-vmax
    where: 'worked example: "the largest speed of 0.40 m/s"'
    inputs: {k: 25 N/m, A: 0.050 m, m: 0.40 kg}
    formula: A * sqrt(k / m)
    expected: 0.40 m/s
    shown: ['the largest speed of $0.40\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (58)'}
    origin: page-own

  - id: bottom-height
    where: 'worked example "Speed at the bottom of the swing", step "Height of the release point"'
    inputs: {l: 1.0 m}
    formula: l * (1 - cos(20 * pi / 180))
    expected: 0.060 m
    shown: ['$h = \ell(1 - \cos\theta_0) = 1.0 \times (1 - \cos 20^\circ) = 0.060\ \text{m}$']
    source: {cite: mit, at: 'Eq. (65)'}
    origin: page-own

  - id: bottom-speed
    where: 'worked example, step "Speed": v = √(2gh)'
    inputs: {g: 9.81 m/s**2, l: 1.0 m}
    formula: sqrt(2 * g * l * (1 - cos(20 * pi / 180)))
    expected: 1.09 m/s
    shown: ['$v = \sqrt{2gh} = \sqrt{2 \times 9.81 \times 0.060} = 1.09\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (65)'}
    origin: page-own

  - id: vmax-from-energy
    kind: identity
    where: '½ m v_max² = ½ k A² gives v_max = A√(k/m) = ωA'
    formula: sqrt(k * A**2 / m)
    equals: sqrt(k / m) * A
    samples: {k: [10.0, 25.0], A: [0.02, 0.05], m: [0.4, 2.0]}
    tolerance: 1e-12
    shown: ['$v_\text{max} = A\sqrt{k/m} = \omega A$']
    source: {cite: mit, at: 'Eqs. (19) and (58)'}
    origin: mit
