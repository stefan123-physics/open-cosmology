  # Independent route: from the ratio form 1 + z = λ_obs/λ_em, v = c z = c (λ_obs/λ_em − 1).
  - id: p11-b-ratio
    kind: identity
    answer: p11-b
    where: 'Problem 11(b), answer box: c (λ_obs − λ_em)/λ_em against c (λ_obs/λ_em − 1)'
    formula: c*(lo - le)/le
    equals: c * (lo / le - 1)
    samples:
      c: [3.0e8, 2.9e8, 3.1e8]
      lo: [501.2, 450, 700]
      le: [486.1, 400, 650]
    tolerance: 1e-12
    shown: ['v \approx c\,z = c\,\frac{\lambda_\text{obs} - \lambda_\text{em}}{\lambda_\text{em}}']
    source: {cite: mit3, at: 'pp. 2–3 and 4–5'}
    origin: page-own

  - id: p11-c
    answer: p11-c
    where: 'Problem 11(c), answer box: v = c z'
