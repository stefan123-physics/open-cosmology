# Calculations on content/year-0/hs-5/hs-5-practice.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# Angles are plain numbers in degrees; trig functions take radians, hence the factors pi/180 and 180/pi.

page: content/year-0/hs-5/hs-5-practice.mdx
calcs:
  # ---------------------------------------------------------------- Problem 1
  - id: p1-omega
    where: 'Problem 1(a): ω = √(k/m) for m = 0.30 kg, k = 12 N/m'
    inputs: {m: 0.30 kg, k: 12 N/m}
    formula: sqrt(k / m)
    expected: 6.32 1/s
    shown: ['\sqrt{12/0.30} = \sqrt{40} = 6.32\ \text{rad/s}$']
    source: {cite: reading1, at: 'Eq. (19)'}
    origin: page-own

  - id: p1-a
    answer: p1-a
    where: 'Problem 1(a), answer box: the period T = 2π√(m/k)'
    inputs: {m: 0.30 kg, k: 12 N/m}
    formula: 2 * pi * sqrt(m / k)
    expected: 0.993 s
    shown: ['$T = 2\pi/\omega = 2\pi/6.32 = 0.993\ \text{s}$']
    source: {cite: reading1, at: 'Eqs. (19) and (49) combined'}
    origin: page-own

  - id: p1-b
    answer: p1-b
    where: 'Problem 1(b), answer box: v_max = ωA with A = 4.0 cm'
    inputs: {m: 0.30 kg, k: 12 N/m, A: 0.040 m}
    formula: sqrt(k / m) * A
    expected: 0.253 m/s
    shown: ['$v_\text{max} = 6.32 \times 0.040 = 0.253\ \text{m/s}$']
    source: {cite: reading1, at: 'Eq. (58)'}
    origin: page-own

  - id: p1-b-average
    where: 'Problem 1(b), check: average speed 4A/T over one period'
    inputs: {m: 0.30 kg, k: 12 N/m, A: 0.040 m}
    formula: 4 * A / (2 * pi * sqrt(m / k))
    expected: 0.161 m/s
    shown: ['$0.16/0.993 = 0.161\ \text{m/s}$']
    source: {cite: reading1, at: 'Eq. (58), second line (our own check)'}
    origin: page-own

  # Independent route: the length of a pendulum with period T is g (T/2π)², with T the spring's period.
  - id: p1-c-identity
    kind: identity
    answer: p1-c
    where: 'Problem 1(c), answer box: ℓ = mg/k against the pendulum length g (T/2π)² for the spring period T = 2π√(m/k)'
    formula: m*g/k
    equals: g * (2*pi*sqrt(m/k) / (2*pi))**2
    samples:
      m: [0.30, 0.1, 2, 0.75]
      g: [9.81, 1.62, 20, 3.71]
      k: [12, 1, 100, 40]
    tolerance: 1e-12
    shown: ['2\pi\sqrt{\frac{\ell}{g}} = 2\pi\sqrt{\frac{m}{k}} \quad\Longrightarrow\quad \ell = \frac{m g}{k}']
    source: {cite: reading1, at: 'Eqs. (49) and (84), set equal (our own step)'}
    origin: page-own

  - id: p1-c-number
    where: 'Problem 1(c): ℓ = mg/k for this block'
    inputs: {m: 0.30 kg, k: 12 N/m, g: 9.81 m/s**2}
    formula: m * g / k
    expected: 0.245 m
    shown: ['$\ell = 0.30 \times 9.81/12 = 0.245\ \text{m}$']
    source: {cite: reading1, at: 'Eqs. (49) and (84), set equal (our own step)'}
    origin: page-own

  - id: p1-d-double-mass
    where: 'Problem 1(d): the spring period with 0.60 kg'
    inputs: {m: 0.60 kg, k: 12 N/m}
    formula: 2 * pi * sqrt(m / k)
    expected: 1.40 s
    shown: ['$0.993 \times \sqrt{2} = 1.40\ \text{s}$']
    source: {cite: reading1, at: 'Eqs. (19) and (49) combined'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 2
  - id: p2-mu
    kind: identity
    where: 'Problem 2(a): F/μ = 150/(1.2 × 10⁻³) = 1.25 × 10⁵ m²/s²'
    formula: F / mu
    equals: 1.25e5
    samples: {F: [150], mu: [1.2e-3]}
    tolerance: 1e-12
    shown: ['$v = \sqrt{150/(1.2 \times 10^{-3})} = \sqrt{1.25 \times 10^{5}} = 354\ \text{m/s}$']
    source: {cite: reading3, at: 'Eq. (15)'}
    origin: page-own

  - id: p2-a
    answer: p2-a
    where: 'Problem 2(a), answer box: v = √(F/μ)'
    inputs: {F: 150 N, mu: 1.2e-3 kg/m}
    formula: sqrt(F / mu)
    expected: 354 m/s
    shown: ['= \sqrt{1.25 \times 10^{5}} = 354\ \text{m/s}$']
    source: {cite: reading3, at: 'Eq. (15)'}
    origin: page-own

  - id: p2-b
    answer: p2-b
    where: 'Problem 2(b), answer box: f₁ = v/2L with L = 0.70 m'
    inputs: {F: 150 N, mu: 1.2e-3 kg/m, L: 0.70 m}
    formula: sqrt(F / mu) / (2 * L)
    expected: 253 1/s
    shown: ['$f_1 = 354/(2 \times 0.70) = 354/1.40 = 253\ \text{Hz}$']
    source: {cite: reading3, at: 'Eq. (31)'}
    origin: page-own

  - id: p2-b-check
    where: 'Problem 2(b), check: f λ = 253 Hz × 1.40 m'
    inputs: {f: 253 1/s, lam: 1.40 m}
    formula: f * lam
    expected: 354 m/s
    shown: ['$f\lambda = 253 \times 1.40 = 354\ \text{m/s}$']
    source: {cite: reading4, at: 'Sec. 8.7'}
    origin: page-own

  - id: p2-c
    answer: p2-c
    where: 'Problem 2(c), answer box: wavelength in air λ = 343/f₁'
    inputs: {F: 150 N, mu: 1.2e-3 kg/m, L: 0.70 m, vs: 343 m/s}
    formula: vs / (sqrt(F / mu) / (2 * L))
    expected: 1.36 m
    shown: ['$\lambda = v/f = 343/253 = 1.36\ \text{m}$']
    source: {cite: reading4, at: 'Sec. 8.7'}
    origin: page-own

  # Independent route: the fundamental has λ = 2L, so the wave speed is v = λ f, and v² = F/μ gives F.
  - id: p2-d-identity
    kind: identity
    answer: p2-d
    where: 'Problem 2(d), answer box: F = 4μL²f² against F = μ v² with v = λ f and λ = 2L'
    formula: 4*mu*L**2*f**2
    equals: mu * ((2*L) * f)**2
    samples:
      mu: [1.2e-3, 5e-4, 1e-2, 3e-3]
      L: [0.70, 0.3, 1.2, 0.65]
      f: [220, 50, 1000, 440]
    tolerance: 1e-12
    shown: ['F = \mu\,(2Lf)^2 = 4\mu L^2 f^2']
    source: {cite: reading3, at: 'Eqs. (15) and (31) combined, solved for the tension (our own step)'}
    origin: page-own

  - id: p2-d-round-trip
    kind: identity
    where: 'Problem 2(d): putting F = 4μL²f² back into f₁ = √(F/μ)/2L returns f'
    formula: sqrt(4*mu*L**2*f**2 / mu) / (2*L)
    equals: f
    samples:
      mu: [1.2e-3, 5e-4, 1e-2]
      L: [0.70, 0.3, 1.2]
      f: [220, 50, 1000]
    tolerance: 1e-12
    shown: ['f = \frac{1}{2L}\sqrt{\frac{F}{\mu}}']
    source: {cite: reading3, at: 'Eqs. (15) and (31)'}
    origin: page-own

  - id: p2-d-number
    where: 'Problem 2(d), check: F for f = 220 Hz'
    inputs: {mu: 1.2e-3 kg/m, L: 0.70 m, f: 220 1/s}
    formula: 4 * mu * L**2 * f**2
    expected: 114 N
    shown: ['$F = 4 \times 1.2 \times 10^{-3} \times 0.70^2 \times 220^2 = 114\ \text{N}$']
    source: {cite: reading3, at: 'Eqs. (15) and (31) combined, solved for the tension (our own step)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 3
  - id: p3-a
    answer: p3-a
    where: 'Problem 3(a), answer box: L = v/4f₁ for f₁ = 196 Hz'
    inputs: {v: 343 m/s, f: 196 1/s}
    formula: v / (4 * f)
    expected: 0.438 m
    tolerance: '0.2%'
    shown: ['$L = v/(4f_1) = 343/(4 \times 196) = 343/784 = 0.438\ \text{m}$']
    source: {cite: mit803s11, at: 'pp. 4–5, case (B)'}
    origin: page-own

  - id: p3-a-wavelength
    where: 'Problem 3(a), check: λ = 4L'
    inputs: {v: 343 m/s, f: 196 1/s}
    formula: 4 * v / (4 * f)
    expected: 1.75 m
    shown: ['The wavelength is $4L = 1.75\ \text{m}$']
    source: {cite: mit803s11, at: 'pp. 4–5, case (B)'}
    origin: page-own

  - id: p3-a-check
    where: 'Problem 3(a), check: f λ = 196 × 1.75'
    inputs: {f: 196 1/s, lam: 1.75 m}
    formula: f * lam
    expected: 343 m/s
    shown: ['$196 \times 1.75 = 343\ \text{m/s}$']
    source: {cite: reading4, at: 'Sec. 8.7'}
    origin: page-own

  - id: p3-b
    answer: p3-b
    where: 'Problem 3(b), answer box: the third harmonic, 3 f₁'
    inputs: {f: 196 1/s}
    formula: 3 * f
    expected: 588 1/s
    shown: ['$f_3 = 3 \times 196 = 588\ \text{Hz}$']
    source: {cite: mit803s11, at: 'pp. 4–5, case (B)'}
    origin: page-own

  - id: p3-c
    answer: p3-c
    where: 'Problem 3(c), answer box: the same tube open at both ends, f₁ = v/2L'
    inputs: {v: 343 m/s, f: 196 1/s}
    formula: v / (2 * (v / (4 * f)))
    expected: 392 1/s
    shown: ['$f_1 = 343/(2 \times 0.438) = 392\ \text{Hz}$']
    source: {cite: mit803s11, at: 'p. 5, case (C)'}
    origin: page-own

  - id: p3-c-check
    where: 'Problem 3(c), check: twice 196 Hz'
    inputs: {f: 196 1/s}
    formula: 2 * f
    expected: 392 1/s
    shown: ['$2 \times 196 = 392\ \text{Hz}$']
    source: {cite: mit803s11, at: 'p. 5, case (C)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 4
  - id: p4-area
    where: 'Problem 4(a): area of a sphere of radius 50 m'
    inputs: {r: 50 m}
    formula: 4 * pi * r**2
    expected: 31400 m**2
    tolerance: '0.1%'
    shown: ['8.0/31\,400']
    source: {cite: nasaInverse, at: 'The Inverse Square Law'}
    origin: page-own

  - id: p4-a
    answer: p4-a
    where: 'Problem 4(a), answer box: I = P/4πr²'
    inputs: {P: 8.0 W, r: 50 m}
    formula: P / (4 * pi * r**2)
    expected: 2.55e-4 W/m**2
    shown: ['$I = 8.0/(4\pi \times 50^2) = 8.0/31\,400 = 2.55 \times 10^{-4}\ \text{W/m}^2$']
    source: {cite: nasaInverse, at: 'The Inverse Square Law'}
    origin: page-own

  - id: p4-b-log
    where: 'Problem 4(b): log of I/I₀'
    inputs: {P: 8.0 W, r: 50 m, I0: 1.0e-12 W/m**2}
    formula: log10(P / (4 * pi * r**2) / I0)
    expected: '8.41'
    shown: ['$\log(2.55 \times 10^8) = 8.41$']
    source: {cite: openlearnDb, at: 'Box 3'}
    origin: page-own

  - id: p4-b
    answer: p4-b
    where: 'Problem 4(b), answer box: β = 10 log(I/I₀)'
    inputs: {P: 8.0 W, r: 50 m, I0: 1.0e-12 W/m**2}
    formula: 10 * log10(P / (4 * pi * r**2) / I0)
    expected: '84.1'
    shown: ['so $\beta = 84.1\ \text{dB}$']
    source: {cite: openlearnDb, at: 'Box 3'}
    origin: page-own

  - id: p4-c-inside
    where: 'Problem 4(c): P/(4π I) at I = 10⁻⁶ W/m²'
    inputs: {P: 8.0 W, I: 1.0e-6 W/m**2}
    formula: P / (4 * pi * I)
    expected: 6.37e5 m**2
    shown: ['= \sqrt{6.37 \times 10^{5}} = 798\ \text{m}$']
    source: {cite: nasaInverse, at: 'The Inverse Square Law, solved for the distance (our own step)'}
    origin: page-own

  - id: p4-c
    answer: p4-c
    where: 'Problem 4(c), answer box: r where β = 60 dB, from I = I₀ 10^(β/10) and r = √(P/4πI)'
    inputs: {P: 8.0 W, I0: 1.0e-12 W/m**2, beta: 60}
    formula: sqrt(P / (4 * pi * I0 * 10**(beta / 10)))
    expected: 798 m
    shown: ['$r = \sqrt{8.0/(4\pi \times 1.0 \times 10^{-6})} = \sqrt{6.37 \times 10^{5}} = 798\ \text{m}$']
    source: {cite: nasaInverse, at: 'The Inverse Square Law, solved for the distance (our own step)'}
    origin: page-own

  - id: p4-c-distance-ratio
    where: 'Problem 4(c), check: 798 m / 50 m'
    inputs: {r1: 50 m, r2: 798 m}
    formula: r2 / r1
    expected: '16.0'
    shown: ['is a factor $16.0$ in distance']
    source: {cite: nasaInverse, at: 'The Inverse Square Law, solved for the distance (our own step)'}
    origin: page-own

  - id: p4-c-intensity-ratio
    where: 'Problem 4(c), check: 16.0²'
    inputs: {x: 16.0}
    formula: x**2
    expected: '255'
    tolerance: '0.5%'
    shown: ['$16.0^2 = 255$']
    source: {cite: nasaInverse, at: 'The Inverse Square Law, solved for the distance (our own step)'}
    origin: page-own

  - id: p4-c-db-drop
    where: 'Problem 4(c), check: 10 log(255) equals 84.1 − 60 dB'
    inputs: {x: 255}
    formula: 10 * log10(x)
    expected: '24.1'
    shown: ['$10\log(255) = 24.1\ \text{dB}$']
    source: {cite: openlearnDb, at: 'Box 3'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 5
  - id: p5-a
    answer: p5-a
    where: 'Problem 5(a), answer box: source moving towards a listener at rest, f_s v/(v − v_b)'
    inputs: {fs: 40.0 kHz, v: 343 m/s, vb: 6.0 m/s}
    formula: fs * v / (v - vb)
    expected: 40.7 kHz
    shown: ['$f_L = 40.0 \times 343/(343 - 6.0) = 40.0 \times 343/337 = 40.7\ \text{kHz}$']
    source: {cite: reading6, at: 'Sec. 6.2, the Doppler formula'}
    origin: page-own

  # Independent route: follow two calls. The bat starts at distance D from the wall; a call sent at time t0 from
  # distance D - vb*t0 returns to the bat at t0 + 2*(D - vb*t0)/(v + vb). Calls are sent 1/fs apart; the echo
  # frequency is 1 over the difference of the two arrival times.
  - id: p5-b-two-calls
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box and formula "Echo heard by a moving bat": against following two calls to the wall and back'
    formula: fs*(v + vb)/(v - vb)
    equals: 1 / ((1/fs + 2*(D - vb/fs)/(v + vb)) - 2*D/(v + vb))
    samples:
      fs: [40000, 1000, 100000, 25000]
      v: [343, 300, 400, 340]
      vb: [6.0, 1, 30, 12]
      D: [20, 5, 100, 3]
    tolerance: 1e-9
    shown: ['f_L = \left(f_s\,\frac{v}{v - v_b}\right)\frac{v + v_b}{v} = f_s\,\frac{v + v_b}{v - v_b}']
    source: {cite: reading6, at: 'Sec. 6.2, the Doppler formula applied twice (our own step)'}
    origin: page-own

  - id: p5-b-number
    where: 'Problem 5(b): the echo for this bat'
    inputs: {fs: 40.0 kHz, v: 343 m/s, vb: 6.0 m/s}
    formula: fs * (v + vb) / (v - vb)
    expected: 41.4 kHz
    shown: ['$f_L = 40.0 \times 349/337 = 41.4\ \text{kHz}$']
    source: {cite: reading6, at: 'Sec. 6.2, the Doppler formula applied twice (our own step)'}
    origin: page-own

  - id: p5-b-small-speed
    where: 'Problem 5(b), check: the approximate shift 2 v_b/v × f_s'
    inputs: {fs: 40.0 kHz, v: 343 m/s, vb: 6.0 m/s}
    formula: 2 * vb / v * fs
    expected: 1.40 kHz
    shown: ['$2 \times 6.0/343 \times 40.0 = 1.40\ \text{kHz}$']
    source: {cite: reading6, at: 'Sec. 6.2, the Doppler formula applied twice (our own step)'}
    origin: page-own

  - id: p5-c
    answer: p5-c
    where: 'Problem 5(c), answer box: bat flying away, f_s (v − v_b)/(v + v_b)'
    inputs: {fs: 40.0 kHz, v: 343 m/s, vb: 6.0 m/s}
    formula: fs * (v - vb) / (v + vb)
    expected: 38.6 kHz
    shown: ['$f_L = f_s\,(v - v_b)/(v + v_b) = 40.0 \times 337/349 = 38.6\ \text{kHz}$']
    source: {cite: reading6, at: 'Sec. 6.2, the Doppler formula applied twice (our own step)'}
    origin: page-own

  - id: p5-c-shift
    where: 'Problem 5(c), check: 40.0 − 38.6 kHz'
    inputs: {fs: 40.0 kHz, v: 343 m/s, vb: 6.0 m/s}
    formula: fs - fs * (v - vb) / (v + vb)
    expected: 1.4 kHz
    shown: ['$40.0 - 38.6 = 1.4\ \text{kHz}$']
    source: {cite: reading6, at: 'Sec. 6.2, the Doppler formula applied twice (our own step)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 6
  - id: p6-omega
    where: 'Problem 6(a): ω₀ = √(k/m) for 1000 kg on 3.6 × 10⁴ N/m'
    inputs: {m: 1000 kg, k: 3.6e4 N/m}
    formula: sqrt(k / m)
    expected: 6.0 1/s
    shown: ['$\omega_0 = \sqrt{3.6 \times 10^4/1000} = \sqrt{36} = 6.0\ \text{rad/s}$']
    source: {cite: reading2, at: 'Eq. (4)'}
    origin: page-own

  - id: p6-a
    answer: p6-a
    where: 'Problem 6(a), answer box: f₀ = ω₀/2π'
    inputs: {m: 1000 kg, k: 3.6e4 N/m}
    formula: sqrt(k / m) / (2 * pi)
    expected: 0.955 1/s
    shown: ['$f_0 = \omega_0/(2\pi) = 6.0/(2\pi) = 0.955\ \text{Hz}$']
    source: {cite: reading2, at: 'Eq. (4)'}
    origin: page-own

  - id: p6-b
    answer: p6-b
    where: 'Problem 6(b), answer box: ridges every 12 m crossed at the rate f₀, v = 12 m × f₀'
    inputs: {m: 1000 kg, k: 3.6e4 N/m, s: 12 m}
    formula: s * sqrt(k / m) / (2 * pi)
    expected: 11.5 m/s
    shown: ['$12 \times 0.955 = 11.5\ \text{m/s}$']
    source: {cite: reading2, at: 'Eqs. (46)–(47)'}
    origin: page-own

  - id: p6-b-kmh
    where: 'Problem 6(b): the same speed in km/h'
    inputs: {m: 1000 kg, k: 3.6e4 N/m, s: 12 m}
    formula: s * sqrt(k / m) / (2 * pi)
    expected: 41 km/hour
    shown: ['about $41\ \text{km/h}$']
    source: {cite: reading2, at: 'Eqs. (46)–(47), driving frequency set equal to the natural frequency (our own step)'}
    origin: page-own

  # ---------------------------------------------------------------- Problem 7
  - id: p7-a
    answer: p7-a
    where: 'Problem 7(a), answer box: f = c/λ for 1550 nm'
    inputs: {c: 3.00e8 m/s, lam: 1550e-9 m}
    formula: c / lam
    expected: 1.94e14 1/s
    shown: ['$f = c/\lambda = 3.00 \times 10^8/(1550 \times 10^{-9}) = 1.94 \times 10^{14}\ \text{Hz}$']
    source: {cite: reading7, at: 'Sec. 11.2'}
    origin: page-own

  - id: p7-a-red
    where: 'Problem 7(a), check: frequency of red light of 700 nm'
    inputs: {c: 3.00e8 m/s, lam: 700e-9 m}
    formula: c / lam
    expected: 4.3e14 1/s
    shown: ['Red light of $700\ \text{nm}$ has $4.3 \times 10^{14}\ \text{Hz}$']
    source: {cite: reading7, at: 'Sec. 11.2'}
    origin: page-own

  - id: p7-b-sine
    where: 'Problem 7(b): sin θ₂ = sin 30.0° / 1.50'
    inputs: {a: 30.0, n: 1.50}
    formula: sin(a * pi / 180) / n
    expected: '0.333'
    shown: ['$\sin\theta_2 = 1.00 \times \sin 30.0^\circ/1.50 = 0.500/1.50 = 0.333$']
    source: {cite: reading8, at: 'Sec. 5.6'}
    origin: page-own

  - id: p7-b
    answer: p7-b
    where: 'Problem 7(b), answer box: θ₂ = asin(sin 30.0° / 1.50), in degrees'
    inputs: {a: 30.0, n: 1.50}
    formula: asin(sin(a * pi / 180) / n) * 180 / pi
    expected: '19.5'
    shown: ['so $\theta_2 = 19.5^\circ$']
    source: {cite: reading8, at: 'Sec. 5.6'}
    origin: page-own

  - id: p7-c-sine
    where: 'Problem 7(c): sin θc = 1.40/1.50'
    inputs: {n1: 1.50, n2: 1.40}
    formula: n2 / n1
    expected: '0.933'
    shown: ['$\sin\theta_c = 1.40/1.50 = 0.933$']
    source: {cite: reading8, at: 'Sec. 5.7'}
    origin: page-own

  - id: p7-c
    answer: p7-c
    where: 'Problem 7(c), answer box: θc = asin(1.40/1.50), in degrees'
    inputs: {n1: 1.50, n2: 1.40}
    formula: asin(n2 / n1) * 180 / pi
    expected: '69.0'
    shown: ['so $\theta_c = 69.0^\circ$']
    source: {cite: reading8, at: 'Sec. 5.7'}
    origin: page-own

  - id: p7-d-wall
    where: 'Problem 7(d): angle of incidence on the side wall, 90° − θ₂'
    inputs: {a: 30.0, n: 1.50}
    formula: 90 - asin(sin(a * pi / 180) / n) * 180 / pi
    expected: '70.5'
    shown: ['$90^\circ - 19.5^\circ = 70.5^\circ$']
    source: {cite: reading8, at: 'Secs. 5.6 and 5.7, Snell''s law and the critical angle (our own step)'}
    origin: page-own

  - id: p7-d-largest-inside
    where: 'Problem 7(d), check: largest angle with the axis inside the core, 90° − θc'
    inputs: {n1: 1.50, n2: 1.40}
    formula: 90 - asin(n2 / n1) * 180 / pi
    expected: '21.0'
    shown: ['$90^\circ - 69.0^\circ = 21.0^\circ$']
    source: {cite: reading8, at: 'Secs. 5.6 and 5.7, Snell''s law and the critical angle (our own step)'}
    origin: page-own

  - id: p7-d-largest-air
