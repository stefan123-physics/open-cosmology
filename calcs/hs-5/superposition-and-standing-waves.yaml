# Calculations on content/year-0/hs-5/superposition-and-standing-waves.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/superposition-and-standing-waves.mdx
calcs:
  - id: quiz-superposition
    where: 'quiz 0: a 3 cm crest and a 2 cm trough overlap: +3 + (−2) = +1 cm'
    inputs: {a: 3 cm, b: -2 cm}
    formula: a + b
    expected: 1 cm
    shown: ['$+3 + (-2) = +1\\ \\text{cm}$']
    source: {cite: siyavula7, at: 'Sec. 7.3'}
    origin: page-own

  - id: quiz-second-harmonic
    where: 'quiz 2: λ₂ = 2L/2 for L = 0.80 m'
    inputs: {L: 0.80 m}
    formula: 2 * L / 2
    expected: 0.80 m
    shown: ['$\\lambda_2 = 2 \\times 0.80/2 = 0.80\\ \\text{m}$']
    quiz: 2
    source: {cite: mit, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: standing-wave-identity
    kind: identity
    where: 'A sin(kx − ωt) + A sin(kx + ωt) = 2A sin(kx) cos(ωt)'
    formula: 0.1 * sin(2 * pi * (x - t)) + 0.1 * sin(2 * pi * (x + t))
    equals: 2 * 0.1 * sin(2 * pi * x) * cos(2 * pi * t)
    samples: {x: [0.1, 0.37, 1.2], t: [0.0, 0.2, 0.9]}
    tolerance: 1e-12
    shown: ['A\sin(kx - \omega t) + A\sin(kx + \omega t) = 2A\sin(kx)\cos(\omega t)']
    source: {cite: reading1, at: 'Sec. 2.1, Eqs. (5)–(6)'}
    origin: mit

  - id: plot-nodes
    kind: identity
    where: 'plot caption: the sum is zero at x = 0, 0.5, 1, 1.5 and 2 m for every t'
    formula: 0.1 * sin(2 * pi * (x - t)) + 0.1 * sin(2 * pi * (x + t))
    equals: 0 * x
    samples: {x: [0.0, 0.5, 1.0, 1.5, 2.0], t: [0.13, 0.4, 0.71, 0.05, 0.9]}
    tolerance: 1e-9
    shown: ['the sum stays zero at x = 0, 0.5, 1, 1.5 and 2 m']
    source: {cite: reading1, at: 'Sec. 2.1, Eq. (6)'}
    origin: page-own

  - id: guitar-f1
    where: 'worked example "The notes of a guitar string", step "Fundamental": f₁ = v/2L'
    inputs: {v: 286 m/s, L: 0.65 m}
    formula: v / (2 * L)
    expected: 220 1/s
    shown: ['$f_1 = v/2L = 286/(2 \times 0.65) = 220\ \text{Hz}$']
    source: {cite: mit, at: 'Eq. (31)'}
    origin: page-own

  - id: guitar-f2
    where: 'worked example, step "Higher harmonics": f₂ = 2f₁'
    inputs: {v: 286 m/s, L: 0.65 m}
    formula: 2 * v / (2 * L)
    expected: 440 1/s
    shown: ['$f_2 = 2f_1 = 440\ \text{Hz}$']
    source: {cite: mit, at: 'Eq. (31)'}
    origin: page-own

  - id: guitar-f3
    where: 'worked example, step "Higher harmonics": f₃ = 3f₁'
    inputs: {v: 286 m/s, L: 0.65 m}
    formula: 3 * v / (2 * L)
    expected: 660 1/s
    shown: ['$f_3 = 3f_1 = 660\ \text{Hz}$']
    source: {cite: mit, at: 'Eq. (31)'}
    origin: page-own

  - id: guitar-lambda1
    where: 'worked example: λ₁ = 2L'
    inputs: {L: 0.65 m}
    formula: 2 * L
    expected: 1.30 m
    shown: ['$\lambda_1 = 1.30\ \text{m}$']
    source: {cite: mit, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: guitar-lambda2
    where: 'worked example: λ₂ = 2L/2'
    inputs: {L: 0.65 m}
    formula: L
    expected: 0.65 m
    shown: ['$\lambda_2 = 0.65\ \text{m}$']
    source: {cite: mit, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: guitar-lambda3
    where: 'worked example: λ₃ = 2L/3'
    inputs: {L: 0.65 m}
    formula: 2 * L / 3
    expected: 0.43 m
    shown: ['$\lambda_3 = 0.43\ \text{m}$']
    source: {cite: mit, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: tension-speed
    where: 'worked example "Tuning by tension", step "Wave speed": v = √(F/μ)'
    inputs: {F: 80 N, mu: 0.0050 kg/m}
    formula: sqrt(F / mu)
    expected: 126 m/s
    shown: ['$v = \sqrt{F/\mu} = \sqrt{80/0.0050} = 126\ \text{m/s}$']
    source: {cite: mit, at: 'Eq. (15)'}
    origin: page-own

  - id: tension-mu
    where: 'worked example: 5.0 g per metre in kg/m'
    inputs: {m: 5.0 g}
    formula: m
    expected: 0.0050 kg
    shown: ['$\mu = 0.0050\ \text{kg/m}$']
    source: {cite: mit, at: 'Eq. (15)'}
    origin: page-own

  - id: tension-f1
    where: 'worked example, step "Fundamental": f₁ = v/2L'
    inputs: {F: 80 N, mu: 0.0050 kg/m, L: 0.40 m}
    formula: sqrt(F / mu) / (2 * L)
    expected: 158 1/s
    shown: ['$f_1 = v/2L = 126/(2 \times 0.40) = 158\ \text{Hz}$']
    source: {cite: mit, at: 'Eqs. (15) and (31)'}
    origin: page-own

  - id: tension-four-times
    where: 'worked example: four times the tension, 4 × 80 N, doubles the frequency'
    inputs: {F: 80 N}
    formula: 4 * F
    expected: 320 N
    shown: ['four times the tension, $320\ \text{N}$']
    source: {cite: mit, at: 'Eq. (15)'}
    origin: page-own
