# Calculations on content/year-0/hs-5/resonance.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/resonance.mdx
calcs:
  - id: quiz-swing-period
    where: 'quiz 0: natural period of a swing with 2.0 m chains, T = 2π√(ℓ/g)'
    inputs: {l: 2.0 m, g: 9.81 m/s**2}
    formula: 2 * pi * sqrt(l / g)
    expected: 2.8 s
    shown: ['$T = 2\\pi\\sqrt{\\ell/g} = 2\\pi\\sqrt{2.0/9.81} = 2.8\\ \\text{s}$']
    quiz: 0
    source: {cite: mit, at: 'Eq. (2), ω₀² = g/ℓ'}
    origin: page-own

  - id: quiz-swing-distractor-f
    where: 'quiz 0, wrong choice: the natural frequency 1/T taken as a time'
    inputs: {l: 2.0, g: 9.81}
    formula: 1 / (2 * pi * sqrt(l / g))
    expected: '0.35'
    shown: ['Every $0.35\\ \\text{s}$']
    source: {cite: mit, at: 'Eq. (2)'}
    origin: page-own

  - id: quiz-swing-distractor-half
    where: 'quiz 0, wrong choice: half the period'
    inputs: {l: 2.0 m, g: 9.81 m/s**2}
    formula: pi * sqrt(l / g)
    expected: 1.4 s
    shown: ['Every $1.4\\ \\text{s}$']
    source: {cite: mit, at: 'Eq. (2)'}
    origin: page-own

  - id: quiz-swing-distractor-sqrt-l
    where: 'quiz 0, wrong choice: 2π√ℓ without g'
    inputs: {l: 2.0}
    formula: 2 * pi * sqrt(l)
    expected: '8.9'
    shown: ['Every $8.9\\ \\text{s}$']
    source: {cite: mit, at: 'Eq. (2)'}
    origin: page-own

  - id: quiz-string-f1
    where: 'quiz 2: f₁ = v/2L for L = 1.5 m, v = 30 m/s'
    inputs: {v: 30 m/s, L: 1.5 m}
    formula: v / (2 * L)
    expected: 10 1/s
    shown: ['$f_n = n\\,v/2L = n \\times 30/3.0 = n \\times 10\\ \\text{Hz}$']
    source: {cite: reading1, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: quiz-string-f2
    where: 'quiz 2: the second harmonic 2v/2L = 20 Hz is the only choice that is a harmonic'
    inputs: {v: 30 m/s, L: 1.5 m}
    formula: 2 * v / (2 * L)
    expected: 20 1/s
    tolerance: '1%'
    shown: ['Only $20\\ \\text{Hz}$, the second harmonic']
    quiz: 2
    source: {cite: reading1, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: quiz-half-damping
    kind: identity
    where: 'quiz 3: halving γ doubles A_max = F₀/(2mγω₀)'
    formula: F0 / (2 * m * (g / 2) * w0)
    equals: 2 * F0 / (2 * m * g * w0)
    samples: {F0: [0.2, 1.0], m: [0.5, 2.0], g: [0.5, 0.1], w0: [10.0, 3.0]}
    tolerance: 1e-12
    shown: ['so half the damping gives twice the amplitude']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: block-omega0
    where: 'worked example "The rhythm of a mass on a spring", step "Angular frequency"'
    inputs: {k: 50 N/m, m: 0.50 kg}
    formula: sqrt(k / m)
    expected: 10 1/s
    shown: ['$\omega_0 = \sqrt{k/m} = \sqrt{50/0.50} = 10\ \text{rad/s}$']
    source: {cite: mit, at: 'Eq. (4)'}
    origin: page-own

  - id: block-f0
    where: 'worked example, step "Frequency and period": f₀ = ω₀/2π'
    inputs: {k: 50 N/m, m: 0.50 kg}
    formula: sqrt(k / m) / (2 * pi)
    expected: 1.59 1/s
    shown: ['$f_0 = \omega_0/2\pi = 1.59\ \text{Hz}$']
    source: {cite: mit, at: 'Eq. (4)'}
    origin: page-own

  - id: block-T
    where: 'worked example, step "Frequency and period": T = 2π/ω₀'
    inputs: {k: 50 N/m, m: 0.50 kg}
    formula: 2 * pi / sqrt(k / m)
    expected: 0.63 s
    shown: ['$T = 2\pi/\omega_0 = 0.63\ \text{s}$']
    source: {cite: mit, at: 'Eq. (4)'}
    origin: page-own

  - id: undamped-resonance-limit
    kind: identity
    where: 'Eq. (24) is the limit of Eq. (14) for ω close to ω₀ (checked with ω = ω₀(1 + 1e-7))'
    formula: (F0 / m) / (w0**2 - (w0 * (1 + 1e-7))**2) * (cos(w0 * (1 + 1e-7) * t) - cos(w0 * t))
    equals: F0 / (2 * m * w0) * t * sin(w0 * t)
    samples: {F0: [0.2, 1.0], m: [0.5, 2.0], w0: [10.0, 3.0], t: [1.3, 4.0]}
    tolerance: 1e-4
    shown: ['x(t) = \frac{F_0}{2m\omega_0}\,t\,\sin(\omega_0 t)']
    source: {cite: mit, at: 'Eqs. (14) and (24)'}
    origin: mit

  - id: peak-height-identity
    kind: identity
    where: 'A at ω = ω₀ from the full formula equals F₀/(2mγω₀)'
    formula: (F0 / m) / sqrt((w0**2 - w0**2)**2 + 4 * g**2 * w0**2)
    equals: F0 / (2 * m * g * w0)
    samples: {F0: [0.2, 1.0], m: [0.5, 2.0], g: [0.5, 2.0], w0: [10.0, 3.0]}
    tolerance: 1e-12
    shown: ['A_\text{max} \approx \frac{F_0}{2m\gamma\omega_0}']
    source: {cite: mit, at: 'Eqs. (43) and (49)'}
    origin: mit

  - id: plot-low-frequency
    where: 'plot caption: all curves start at F₀/k = 0.4 cm'
    inputs: {F0: 0.20 N, k: 50 N/m}
    formula: F0 / k
    expected: 0.4 cm
    shown: ['All three start at F₀/k = 0.4 cm']
    source: {cite: mit, at: 'Sec. 3.2'}
    origin: page-own

  - id: plot-peak-05
    where: 'plot caption: peak for γ = 0.5 /s, computed at the true maximum ω_res = √(ω₀² − 2γ²)'
    inputs: {F0: 0.20 N, m: 0.50 kg, w0: 10 1/s, g: 0.5 1/s}
    formula: (F0 / m) / sqrt((w0**2 - (w0**2 - 2 * g**2))**2 + 4 * g**2 * (w0**2 - 2 * g**2))
    expected: 4.0 cm
    tolerance: '2%'
    shown: ['the peak near ω₀ is about 4.0, 2.0 and 1.0 cm high']
    source: {cite: mit, at: 'Eqs. (43) and (46)'}
    origin: page-own

  - id: plot-peak-1
    where: 'plot caption: peak for γ = 1 /s'
    inputs: {F0: 0.20 N, m: 0.50 kg, w0: 10 1/s, g: 1 1/s}
    formula: (F0 / m) / sqrt((w0**2 - (w0**2 - 2 * g**2))**2 + 4 * g**2 * (w0**2 - 2 * g**2))
    expected: 2.0 cm
    tolerance: '2%'
    shown: ['about 4.0, 2.0 and 1.0 cm high']
    source: {cite: mit, at: 'Eqs. (43) and (46)'}
    origin: page-own

  - id: plot-peak-2
    where: 'plot caption: peak for γ = 2 /s'
    inputs: {F0: 0.20 N, m: 0.50 kg, w0: 10 1/s, g: 2 1/s}
    formula: (F0 / m) / sqrt((w0**2 - (w0**2 - 2 * g**2))**2 + 4 * g**2 * (w0**2 - 2 * g**2))
    expected: 1.0 cm
    tolerance: '3%'
    shown: ['2.0 and 1.0 cm high']
    source: {cite: mit, at: 'Eqs. (43) and (46)'}
    origin: page-own

  - id: plot-curve-matches-formula
    kind: identity
    where: 'plot curves: 40/√((100 − w²)² + 4γ²w²) in cm is (F₀/m)/√(…) with F₀/m = 0.40 m/s², ω₀² = 100'
    formula: 40 / sqrt((100 - w**2)**2 + 4 * g**2 * w**2)
    equals: 100 * (0.20 / 0.50) / sqrt((10**2 - w**2)**2 + 4 * g**2 * w**2)
    samples: {w: [0.0, 5.0, 10.0, 17.0], g: [0.5, 1.0, 2.0, 0.5]}
    tolerance: 1e-12
    shown: ['40 / sqrt((100 - w^2)^2 + 4*0.25*w^2)']
    source: {cite: mit, at: 'Eq. (43)'}
    origin: page-own

  - id: drive-slow
    where: 'worked example "Driving the block", step "Driven very slowly": F₀/k'
    inputs: {F0: 0.20 N, k: 50 N/m}
    formula: F0 / k
    expected: 0.0040 m
    shown: ['$A \approx F_0/k = 0.20/50 = 0.0040\ \text{m} = 4.0\ \text{mm}$']
    source: {cite: mit, at: 'Sec. 3.2'}
    origin: page-own

  - id: drive-resonance
    where: 'worked example, step "At resonance": F₀/(2mγω₀)'
    inputs: {F0: 0.20 N, m: 0.50 kg, g: 0.50 1/s, w0: 10 1/s}
    formula: F0 / (2 * m * g * w0)
    expected: 0.040 m
    shown: ['$A_\text{max} \approx F_0/(2m\gamma\omega_0) = 0.20/(2 \times 0.50 \times 0.50 \times 10) = 0.040\ \text{m} = 4.0\ \text{cm}$']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: drive-ratio
    where: 'worked example, step "At resonance": ten times the slow amplitude'
    inputs: {F0: 0.20 N, m: 0.50 kg, g: 0.50 1/s, w0: 10 1/s, k: 50 N/m}
    formula: (F0 / (2 * m * g * w0)) / (F0 / k)
    expected: '10'
    shown: ['ten times as much, with the same force']
    source: {cite: mit, at: 'Eq. (49) and Sec. 3.2'}
    origin: page-own

  - id: drive-F0-over-m
    where: 'worked example, step "Driven at twice the natural frequency": F₀/m'
    inputs: {F0: 0.20 N, m: 0.50 kg}
    formula: F0 / m
    expected: 0.40 m/s**2
    shown: ['$F_0/m = 0.40\ \text{m/s}^2$']
    source: {cite: mit, at: 'Eq. (43)'}
    origin: page-own

  - id: drive-fast-diff
    where: 'worked example: ω₀² − ω² at ω = 20 rad/s'
    inputs: {w0: 10, w: 20}
    formula: w0**2 - w**2
    expected: '-300'
    shown: ['$\omega_0^2 - \omega^2 = 100 - 400 = -300$']
    source: {cite: mit, at: 'Eq. (43)'}
    origin: page-own

  - id: drive-fast-damp
    where: 'worked example: 4γ²ω² at ω = 20 rad/s, γ = 0.50 /s'
    inputs: {g: 0.50, w: 20}
    formula: 4 * g**2 * w**2
    expected: '400'
    shown: ['$4\gamma^2\omega^2 = 4 \times 0.25 \times 400 = 400$']
    source: {cite: mit, at: 'Eq. (43)'}
    origin: page-own

  - id: drive-fast
    where: 'worked example: amplitude at ω = 20 rad/s'
    inputs: {F0: 0.20 N, m: 0.50 kg, g: 0.50 1/s, w0: 10 1/s, w: 20 1/s}
    formula: (F0 / m) / sqrt((w0**2 - w**2)**2 + 4 * g**2 * w**2)
    expected: 0.0013 m
    shown: ['$A = 0.40/\sqrt{300^2 + 400} = 0.0013\ \text{m} = 1.3\ \text{mm}$']
    source: {cite: mit, at: 'Eq. (43)'}
    origin: page-own

  - id: drive-heavy-damping
    where: 'worked example, step "With four times the damping": γ = 2.0 /s'
    inputs: {F0: 0.20 N, m: 0.50 kg, g: 2.0 1/s, w0: 10 1/s}
    formula: F0 / (2 * m * g * w0)
    expected: 0.010 m
    shown: ['$0.20/(2 \times 0.50 \times 2.0 \times 10) = 0.010\ \text{m} = 1.0\ \text{cm}$']
    source: {cite: mit, at: 'Eq. (49)'}
    origin: page-own

  - id: string-f1
    where: 'worked example "A string driven by a vibrator", step "Natural frequencies"'
    inputs: {v: 72 m/s, L: 0.90 m}
    formula: v / (2 * L)
    expected: 40 1/s
    shown: ['$f_1 = v/2L = 72/(2 \times 0.90) = 40\ \text{Hz}$']
    source: {cite: reading1, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: string-third-harmonic
    where: 'worked example, step "Compare": 120 Hz is 3f₁'
    inputs: {v: 72 m/s, L: 0.90 m}
    formula: 3 * v / (2 * L)
    expected: 120 1/s
    shown: ['$120\ \text{Hz}$ is the third harmonic']
    source: {cite: reading1, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: string-lambda3
    where: 'worked example: λ₃ = 2L/3'
    inputs: {L: 0.90 m}
    formula: 2 * L / 3
    expected: 0.60 m
    shown: ['$\lambda_3 = 2L/3 = 0.60\ \text{m}$']
    source: {cite: reading1, at: 'Sec. 3.1.1'}
    origin: page-own

  - id: string-loop
    where: 'worked example: each loop is L/3 = λ₃/2'
    inputs: {L: 0.90 m}
    formula: L / 3
    expected: 0.30 m
    shown: ['each $0.30\ \text{m}$ long']
    source: {cite: reading1, at: 'Sec. 3.1.1'}
    origin: page-own
