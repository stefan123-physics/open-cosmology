  - id: quiz-decibels
    where: 'quiz 3: 50 dB → 70 dB is 100 times the intensity'
    inputs: {b1: 70, b2: 50}
    formula: 10**((b1 - b2) / 10)
    expected: '100'
    shown: ['$20\\ \\text{dB}$ more is $10 \\times 10 = 100$ times the intensity']
    quiz: 3
    source: {cite: reading2, at: 'Box 3'}
    origin: page-own

  - id: open-pipe-identity
    kind: identity
    where: 'open–open pipe: k_m = mπ/L (MIT case C) gives λ = 2π/k = 2L/n'
    formula: 2 * pi / (n * pi / L)
    equals: 2 * L / n
    samples: {n: [1, 2, 3, 4], L: [0.6, 1.0, 0.85, 2.0]}
    tolerance: 1e-12
    shown: ['\lambda_n = \frac{2L}{n}, \qquad f_n = n\,\frac{v}{2L}, \qquad n = 1, 2, 3, \dots']
    source: {cite: reading1, at: 'p. 5, case (C)'}
    origin: mit

  - id: closed-pipe-identity
    kind: identity
    where: 'closed–open pipe: k_m = (m − ½)π/L (MIT case B) gives λ = 2π/k = 4L/n with n = 2m − 1'
    formula: 2 * pi / ((m - 0.5) * pi / L)
    equals: 4 * L / (2 * m - 1)
    samples: {m: [1, 2, 3, 4], L: [0.6, 1.0, 0.85, 2.0]}
    tolerance: 1e-12
    shown: ['\lambda_n = \frac{4L}{n}, \qquad f_n = n\,\frac{v}{4L}, \qquad n = 1, 3, 5, \dots']
    source: {cite: reading1, at: 'pp. 4–5, case (B)'}
    origin: mit

  - id: plot-closed-end
    kind: identity
    where: 'plot: sin(nπx/2L) is zero at the closed end x = 0 and ±1 (largest) at the open end x = 1 m, for n = 1, 3, 5'
    formula: sin(n * pi * 1 / 2)**2 + sin(n * pi * 0 / 2)
    equals: 1 + 0 * n
    samples: {n: [1, 3, 5]}
    tolerance: 1e-12
    shown: ['computed as sin(nπx/2L) for n = 1, 3 and 5']
    source: {cite: reading1, at: 'pp. 4–5, case (B)'}
    origin: page-own

  - id: pipe-open-f1
    where: 'worked example "Open or closed?", step (a): f₁ = v/2L'
    inputs: {v: 343 m/s, L: 0.60 m}
    formula: v / (2 * L)
    expected: 286 1/s
    shown: ['$f_1 = v/2L = 343/(2 \times 0.60) = 286\ \text{Hz}$']
    source: {cite: reading1, at: 'p. 5, case (C)'}
