# Calculations on content/year-0/hs-5/sound.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-0/hs-5/sound.mdx
calcs:
  - id: speed-air-0c
    kind: fact
    where: 'table of speeds: air at 0 °C'
    value: 331 m/s
    shown: ['| Air at 0 °C | 331 m/s |']
    source: {cite: mit, at: 'Sec. 10.2, Table 10.1'}
    origin: mit

  - id: speed-air-20c
    kind: fact
    where: 'table of speeds: air at 20 °C, used throughout the page'
    value: 343 m/s
    shown: ['| Air at 20 °C | 343 m/s |', 'In this lesson we use $343\ \text{m/s}$ for sound in air at room temperature']
    source: {cite: mit, at: 'Sec. 10.2, Table 10.1'}
    origin: mit

  - id: speed-sea-water
    kind: fact
    where: 'table of speeds: sea water, also used in the ultrasound example'
    value: 1531 m/s
    shown: ['| Sea water | 1531 m/s |', 'where sound travels at $1531\ \text{m/s}$']
    source: {cite: mit, at: 'Sec. 10.2, Table 10.1'}
    origin: mit

  - id: speed-solids
    kind: fact
    where: 'table of speeds: copper, glass, aluminium'
    value: '4760, 5100, 6420 m/s'
    shown: ['| Copper | 4760 m/s |', '| Glass | 5100 m/s |', '| Aluminium | 6420 m/s |']
    source: {cite: mit, at: 'Sec. 10.2, Table 10.1'}
    origin: mit

  - id: speed-lead
    kind: fact
    where: 'table of speeds: lead; compared with aluminium in "The speed of sound" (heavier material, slower sound)'
    value: 2160 m/s
    shown: ['| Lead | 2160 m/s |', 'sound is slower in lead (2160 m/s), a very heavy metal, than in aluminium (6420 m/s), a light one']
    source: {cite: mit, at: 'Sec. 10.2, Table 10.1'}
    origin: mit

  - id: hearing-range
    kind: fact
    where: 'section "Pitch, loudness and what we can hear": human and animal hearing ranges'
    value: '20 Hz to 20 kHz (humans); dogs 45 kHz, bats 120 kHz, elephants 5 Hz'
    shown: ['The human ear hears frequencies from about $20\ \text{Hz}$ to $20\,000\ \text{Hz}$ ($20\ \text{kHz}$)', 'dogs up to about $45\ \text{kHz}$, bats up to about $120\ \text{kHz}$, while elephants hear infrasound down to about $5\ \text{Hz}$']
    source: {cite: mit, at: 'Sec. 10.3, Table 10.2'}
    origin: mit

  - id: thunder-distance
    where: 'worked example "How far away is the storm?", step "Distance": 343 m/s × 4.5 s'
    inputs: {v: 343 m/s, t: 4.5 s}
    formula: v * t
    expected: 1.5e3 m
    shown: ['distance $= v \times 4.5 = 343 \times 4.5 = 1.5 \times 10^3\ \text{m}$']
    source: {cite: mit, at: 'Sec. 10.2'}
    origin: page-own

  - id: thunder-rule
    where: 'worked example "How far away is the storm?": every three seconds is about a kilometre'
    inputs: {v: 343 m/s, t: 3 s}
    formula: v * t
    expected: 1 km
    tolerance: '5%'
    shown: ['every three seconds is about a kilometre']
    source: {cite: mit, at: 'Sec. 10.2'}
    origin: page-own

  - id: quiz-echo
    where: 'quiz 0: echo after 0.40 s at 343 m/s: distance = v t/2'
    inputs: {v: 343 m/s, t: 0.40 s}
    formula: v * t / 2
    expected: 69 m
    shown: ['$343 \\times 0.40/2 = 69\\ \\text{m}$']
    quiz: 0
    source: {cite: mit, at: 'Sec. 10.2, SONAR'}
    origin: page-own

  - id: ultrasound-wavelength
    where: 'worked example "The wavelength of ultrasound", step "Ultrasound in water": λ = v/f'
    inputs: {v: 1531 m/s, f: 1.5e6 1/s}
    formula: v / f
    expected: 1.0e-3 m
    shown: ['$\lambda = v/f = 1531/(1.5 \times 10^6) = 1.0 \times 10^{-3}\ \text{m}$']
    source: {cite: mit, at: 'Sec. 10.3'}
    origin: page-own

  - id: audible-wavelength
    where: 'worked example "The wavelength of ultrasound", step "An audible tone in air"'
    inputs: {v: 343 m/s, f: 1000 1/s}
    formula: v / f
    expected: 0.343 m
    shown: ['$\lambda = 343/1000 = 0.343\ \text{m}$']
    source: {cite: mit, at: 'Sec. 10.3'}
    origin: page-own

  - id: wavelength-ratio
    where: 'worked example "The wavelength of ultrasound": the audible wavelength is over three hundred times longer'
    inputs: {v1: 343 m/s, f1: 1000 1/s, v2: 1531 m/s, f2: 1.5e6 1/s}
    formula: (v1 / f1) / (v2 / f2)
    expected: '336'
    tolerance: '5%'
    shown: ['over three hundred times longer']
    source: {cite: mit, at: 'Sec. 10.3'}
    origin: page-own

  - id: speaker-area
    where: 'worked example "A loudspeaker in a field", step "At 3.0 m": 4π × 3.0² = 113 m²'
    inputs: {r: 3.0 m}
    formula: 4 * pi * r**2
    expected: 113 m**2
    shown: ['$I = P/4\pi r^2 = 0.50/(4\pi \times 3.0^2) = 0.50/113 = 4.4 \times 10^{-3}\ \text{W/m}^2$']
    source: {cite: nasa, at: 'The Inverse Square Law'}
    origin: page-own

  - id: speaker-3m
    where: 'worked example "A loudspeaker in a field", step "At 3.0 m": I = P/4πr²'
    inputs: {P: 0.50 W, r: 3.0 m}
    formula: P / (4 * pi * r**2)
    expected: 4.4e-3 W/m**2
    shown: ['$I = P/4\pi r^2 = 0.50/(4\pi \times 3.0^2) = 0.50/113 = 4.4 \times 10^{-3}\ \text{W/m}^2$']
    source: {cite: nasa, at: 'The Inverse Square Law'}
    origin: page-own

  - id: speaker-6m
    where: 'worked example "A loudspeaker in a field", step "At 6.0 m"'
    inputs: {P: 0.50 W, r: 6.0 m}
    formula: P / (4 * pi * r**2)
    expected: 1.1e-3 W/m**2
    shown: ['$4.4 \times 10^{-3}/4 = 1.1 \times 10^{-3}\ \text{W/m}^2$']
    source: {cite: nasa, at: 'The Inverse Square Law'}
    origin: page-own

  - id: inverse-square-identity
    kind: identity
    where: 'I = P/4πr²: twice as far gives a quarter of the intensity, three times as far a ninth'
    formula: (1 / (4 * pi * (k * r)**2)) / (1 / (4 * pi * r**2))
    equals: 1 / k**2
    samples: {r: [1.0, 2.5, 7.0], k: [2.0, 3.0, 2.0]}
    tolerance: 1e-12
    shown: ['I = \frac{P}{4\pi r^2}']
    source: {cite: nasa, at: 'The Inverse Square Law'}
    origin: page-own

  - id: quiz-inverse-square
    where: 'quiz 2: from 2 m to 6 m, the intensity becomes 3² = 9 times smaller'
    inputs: {r1: 2 m, r2: 6 m}
    formula: (r2 / r1)**2
    expected: '9'
    shown: ['Three times as far means $3^2 = 9$ times less intensity.']
    source: {cite: nasa, at: 'The Inverse Square Law'}
    origin: page-own

  - id: pain-ratio
    kind: fact
    where: 'section "The decibel scale": a painful sound is about 10¹² times as intense as the faintest audible one; table of sound levels'
    value: '1e12 (120 dB)'
    shown: ['A sound loud enough to hurt is about $10^{12}$ times (a million million times) as intense', '| Threshold of pain | 120 dB | $10^{12}$ times |']
    source: {cite: reading2, at: 'Box 3; Siyavula Sec. 10.4, Table 10.3'}
    origin: mit

  - id: decibel-table
    kind: identity
    where: 'table of sound levels: intensity ratio = 10^(β/10) for 20, 60, 70, 110 dB'
    formula: 10**(beta / 10)
    equals: 10**n
    samples: {beta: [20, 60, 70, 110, 120], n: [2, 6, 7, 11, 12]}
    tolerance: 1e-6
    shown: ['| Whisper | 20 dB | $10^2$ times |', '| Normal conversation | 60 dB | $10^6$ times |', '| City traffic | 70 dB | $10^7$ times |', '| Rock band | 110 dB | $10^{11}$ times |']
    source: {cite: mit, at: 'Sec. 10.4, Table 10.3'}
    origin: mit

  - id: decibel-inverse-identity
    kind: identity
    where: 'β = 10 log(I/I₀) and I/I₀ = 10^(β/10) are the same relation'
    formula: 10 * log10(10**(beta / 10))
    equals: beta
    samples: {beta: [0, 3, 37, 120]}
    tolerance: 1e-9
    shown: ['\beta = 10\log\left(\frac{I}{I_0}\right) \quad\Longleftrightarrow\quad \frac{I}{I_0} = 10^{\beta/10}']
    source: {cite: reading2, at: 'Box 3'}
    origin: mit

  - id: hearing-damage
    kind: fact
    where: 'section "The decibel scale": 80 dB and above can damage hearing over time'
    value: '80 dB'
    shown: ['Sounds of $80\ \text{dB}$ and above can damage your hearing']
    source: {cite: mit, at: 'Sec. 10.6'}
    origin: mit

  - id: mower-ratio
    where: 'worked example "Working with decibels", step (a): 90 − 60 = 30 dB is 10³ times the intensity'
    inputs: {b1: 90, b2: 60}
    formula: 10**((b1 - b2) / 10)
    expected: '1000'
    shown: ['$10^{30/10} = 10^3 = 1000$ times the intensity']
    source: {cite: reading2, at: 'Box 3'}
    origin: page-own

  - id: two-mowers
    where: 'worked example "Working with decibels", step (b): 10 log 2'
    inputs: {}
    formula: 10 * log10(2)
    expected: '3.0'
    shown: ['$10\log 2 = 3.0\ \text{dB}$, to $93\ \text{dB}$']
    source: {cite: reading2, at: 'Box 3'}
    origin: page-own

  - id: twice-as-far-db
    where: 'worked example "Working with decibels", step (c): 10 log(1/4)'
    inputs: {}
    formula: 10 * log10(1 / 4)
    expected: '-6.0'
    shown: ['$10\log(1/4) = -6.0\ \text{dB}$']
