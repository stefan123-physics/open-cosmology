# Calculations on content/year-2/8.04/resonant-transmission.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 17, with the page's own example.

page: content/year-2/8.04/resonant-transmission.mdx
calcs:
  - id: unitless-form
    kind: identity
    where: 'V0²/(4E(E + V0)) = 1/(4e(1 + e)) with e = E/V0'
    formula: V**2/(4*E*(E + V))
    equals: 1/(4*(E/V)*(1 + E/V))
    samples: {V: [10.0, 3.0], E: [5.0, 0.4]}
    tolerance: 1e-12
    shown: ['\frac1T = 1 + \frac{1}{4e(1 + e)}']
    source: {cite: mit, at: 'notes p. 2, eq. (1.10)'}
    origin: mit

  - id: notes-z0
    where: 'notes example: 2z0/π for z0 = 13π/4'
    inputs: {}
    formula: 2*(13*pi/4)/pi
    expected: '6.5'
    tolerance: 1e-12
    shown: ['needs $n \ge 13/2$']
    source: {cite: mit, at: 'notes p. 3'}
    origin: mit

  - id: notes-z0-value
    where: 'plot default: 13π/4'
    inputs: {}
    formula: 13*pi/4
    expected: '10.21'
    tolerance: 0.005
    shown: ['z₀ = 13π/4 ≈ 10.21']
    source: {cite: mit, at: 'notes p. 3'}
    origin: mit

  - id: notes-speed
    where: '1 eV electron: c √(2/511000) in km/s'
    inputs: {}
    formula: 299792.458*sqrt(2/511000)
    expected: '593'
    tolerance: 0.5
    shown: ['\approx 593$ km/s']
    source: {cite: mit, at: 'notes p. 4'}
    origin: mit

  - id: ex-threshold
    where: 'example (a): 2z0/π with z0 = 3.240'
    inputs: {}
    formula: 2*(0.20*sqrt(2*511000*10)/197.33)/pi
    expected: '2.06'
    tolerance: 0.005
    shown: ['$n \ge 2z_0/\pi \approx 2.06$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.12)'}
    origin: page-own

  - id: ex-E3
    where: 'example (a): 9 × π²ħ²c²/(2mc²(0.40)²) − 10 eV'
    inputs: {}
    formula: 9*pi**2*197.33**2/(2*511000*0.40**2) - 10
    expected: '11.2'
    tolerance: 0.05
    shown: ['- 10 \approx 11.2$ eV']
    source: {cite: mit, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own

  - id: ex-E4
    where: 'example (a): 16 × 2.350 − 10 eV'
    inputs: {}
    formula: 16*pi**2*197.33**2/(2*511000*0.40**2) - 10
    expected: '27.6'
    tolerance: 0.05
    shown: ['- 10 \approx 27.6$ eV']
    source: {cite: mit, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own

  - id: ex-n2-level
    where: 'example (a): 4 × 2.350 eV'
    inputs: {}
    formula: 4*pi**2*197.33**2/(2*511000*0.40**2)
    expected: '9.40'
    tolerance: 0.005
    shown: ['at $9.40$ eV from the bottom']
    source: {cite: mit, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own

  - id: ex-phase
    where: 'example (b): 2z0√1.5'
    inputs: {}
    formula: 2*(0.20*sqrt(2*511000*10)/197.33)*sqrt(1.5)
    expected: '7.94'
    tolerance: 0.005
    shown: ['$2z_0\sqrt{1.5} \approx 7.94$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.9)'}
    origin: page-own

  - id: ex-sin2
    where: 'example (b): sin²(7.936)'
    inputs: {}
    formula: sin(2*(0.20*sqrt(2*511000*10)/197.33)*sqrt(1.5))**2
    expected: '0.993'
    tolerance: 0.0005
    shown: ['$\sin^2 7.94 \approx 0.993$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.10)'}
    origin: page-own

  - id: ex-invT
    where: 'example (b): 1 + 0.9932/(4 × 0.5 × 1.5)'
    inputs: {}
    formula: 1 + sin(2*(0.20*sqrt(2*511000*10)/197.33)*sqrt(1.5))**2/(4*0.5*1.5)
    expected: '1.331'
    tolerance: 0.0005
    shown: ['\approx 1.331$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.10)'}
    origin: page-own

  - id: ex-T
    where: 'example (b): T'
    inputs: {}
    formula: 1/(1 + sin(2*(0.20*sqrt(2*511000*10)/197.33)*sqrt(1.5))**2/(4*0.5*1.5))
    expected: '0.75'
    tolerance: 0.005
    shown: ['$T \approx 0.75$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.10)'}
    origin: page-own

  - id: ex-third-bound-state
    where: 'example (a): the well''s third bound state, −10(1 − ξ²/z0²) with ξ from ξ tan ξ = √(z0² − ξ²) on (π, z0)'
    inputs: {}
    formula: -10*(1 - solve('q*tan(q) - sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - q**2)', 'q', 3.15, 3.2401)**2/(0.20*sqrt(2*511000*10)/197.33)**2)
    expected: '-0.07'
    tolerance: 0.01
    shown: ['least bound state, at $-0.07$ eV']
    source: {cite: mit, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own
