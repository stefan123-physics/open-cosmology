# Calculations on content/year-2/8.04/levinson-resonances-breit-wigner.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 19, with the page's own example.

page: content/year-2/8.04/levinson-resonances-breit-wigner.mdx
calcs:
  - id: notes-resonance-energy
    where: 'notes: u* = 1.8523 with z1² = 5 gives E/V1 = u²/z1²'
    inputs: {}
    formula: 1.8523**2/5
    expected: '0.69'
    tolerance: 0.005
    shown: ['($E \approx 0.69V_1$)']
    source: {cite: mit, at: 'notes p. 5'}
    origin: mit

  - id: notes-delay
    kind: fact
    where: 'notes: peak delay about 14 free transit times (read from their plot)'
    value: '14'
    shown: ['peaks at about 14 free transit times']
    source: {cite: mit, at: 'notes p. 6'}
    origin: mit

  - id: model-derivative
    kind: identity
    where: 'dδ/dk at k = α for δ = atan(β/(α − k)) equals 1/β (finite difference)'
    formula: (atan(b/(a - (a + 1e-6))) - atan(b/(a - (a - 1e-6))) + pi)/2e-6
    equals: 1/b
    samples: {a: [2.0, 5.0], b: [0.1, 0.3]}
    tolerance: 1e-4
    shown: ['\left.\frac{d\delta}{dk}\right|_{k = \alpha} = \frac1\beta']
    source: {cite: mit, at: 'notes p. 7, eq. (3.2)'}
    origin: mit

  - id: model-sin2
    kind: identity
    where: 'sin²(atan(β/(α − k))) = β²/(β² + (α − k)²)'
    formula: sin(atan(b/(a - k)))**2
    equals: b**2/(b**2 + (a - k)**2)
    samples: {a: [2.0, 5.0], b: [0.1, 0.3], k: [1.7, 4.9]}
    tolerance: 1e-12
    shown: ['= \frac{\beta^2}{\beta^2 + (\alpha - k)^2}']
    source: {cite: mit, at: 'notes p. 7, eq. (3.2)'}
    origin: mit

  - id: lifetime-quarter-delay
    kind: identity
    where: 'Δt = 2m/(ħαβ) and τ = m/(2ħαβ): τ = Δt/4'
    formula: (m/(2*h*a*b))/(2*m/(h*a*b))
    equals: 0.25 + 0*m
    samples: {m: [1.0, 3.0], h: [1.0, 0.4], a: [2.0, 5.0], b: [0.1, 0.3]}
    tolerance: 1e-12
    shown: ['\tau = \frac{\hbar}{\Gamma} = \frac14\,\Delta t']
    source: {cite: mit, at: 'notes p. 8, eq. (3.10)'}
    origin: mit

  - id: amplitude-forms
    kind: identity
    where: 'e^{iδ} sin δ = tan δ/(1 − i tan δ): real parts, cos δ sin δ = tan δ/(1 + tan² δ)'
    formula: tan(d)/(1 + tan(d)**2)
    equals: cos(d)*sin(d)
    samples: {d: [0.3, 1.1, -0.7]}
    tolerance: 1e-12
    shown: ['= \frac{\tan\delta}{1 - i\tan\delta}']
    source: {cite: mit, at: 'notes p. 8, eq. (3.11)'}
    origin: mit

  - id: plot-half
    where: 'plot: 1/(1 + 4 × 0.5²)'
    inputs: {}
    formula: 1/(1 + 4*0.5**2)
    expected: '0.5'
    tolerance: 1e-12
    shown: ['falls to one half at ±Γ/2']
    source: {cite: mit, at: 'notes p. 7, eq. (3.7)'}
    origin: page-own

  - id: higgs-width
    kind: fact
    where: 'Higgs width as quoted in the notes (Standard Model prediction)'
    value: '4.07 MeV'
    shown: ['with a width of 4.07 MeV']
    source: {cite: mit, at: 'notes p. 8'}
    origin: mit

  - id: higgs-mass
    kind: fact
    where: 'Higgs mass as quoted in the notes'
    value: '125 GeV'
    shown: ['with a mass of 125 GeV']
    source: {cite: mit, at: 'notes p. 8'}
    origin: mit

  - id: ex-higgs-lifetime
    where: 'example (b): 6.582e-22 MeV s / 4.07 MeV'
    inputs: {}
    formula: 6.582e-22/4.07
    expected: '1.62e-22'
    tolerance: 0.005e-22
    shown: ['/4.07 \approx 1.62 \times 10^{-22}$ s']
    source: {cite: mit, at: 'notes p. 8'}
    origin: mit

  - id: ex-higgs-distance
    where: 'example (b): c τ in m'
    inputs: {}
    formula: 3.0e8*1.62e-22
    expected: '4.9e-14'
    tolerance: 0.05e-14
    shown: ['\approx 4.9 \times 10^{-14}$ m']
    source: {cite: mit, at: 'notes p. 8'}
    origin: page-own

  - id: ex-z0
    where: 'example (a): √3.40'
    inputs: {}
    formula: sqrt(3.40)
    expected: '1.84'
    tolerance: 0.005
    shown: ['$z_0 = \sqrt{3.40} \approx 1.84$']
    source: {cite: mit, at: 'notes p. 1, eq. (1.1)'}
    origin: page-own

  - id: ex-off-peak
    where: 'example (c): (1/4)/(1 + 1/4)'
    inputs: {}
    formula: 0.25/(1 + 0.25)
    expected: '0.2'
    tolerance: 1e-12
    shown: ['= 0.2$: one width away']
    source: {cite: mit, at: 'notes p. 7, eq. (3.7)'}
    origin: page-own

  - id: barrier-matching
    kind: identity
    where: 'eq. (2.8): with ψ = A sin k′x in the well, the slope match at x = a gives B = A (k′/κ) cos k′a; then ψ′/ψ at x = 2a equals κ[sin k′a sinh κa + (k′/κ) cos k′a cosh κa]/[sin k′a cosh κa + (k′/κ) cos k′a sinh κa] (checked by a finite difference of the barrier solution)'
    formula: ((sin(p)*cosh(q*(1 + 1e-6)) + (p/q)*cos(p)*sinh(q*(1 + 1e-6))) - (sin(p)*cosh(q*(1 - 1e-6)) + (p/q)*cos(p)*sinh(q*(1 - 1e-6))))/2e-6/(sin(p)*cosh(q) + (p/q)*cos(p)*sinh(q))
    equals: q*(sin(p)*sinh(q) + (p/q)*cos(p)*cosh(q))/(sin(p)*cosh(q) + (p/q)*cos(p)*sinh(q))
    samples: {p: [1.2, 2.1], q: [0.8, 1.6]}
    tolerance: 1e-6
    shown: ['\frac{k}{\kappa}\,\frac{\sin k''a\cosh\kappa a + \frac{k''}{\kappa}']
    source: {cite: mit, at: 'notes p. 4, eq. (2.8)'}
    origin: mit

  - id: ex-proton-radii
    where: 'example (b): cτ / 0.84 fm'
    inputs: {}
    formula: 3.0e8*1.62e-22/0.84e-15
    expected: '58'
    tolerance: 1
    shown: ['nearly sixty times the radius of a proton']
    source: {cite: mit, at: 'notes p. 8'}
    origin: page-own
