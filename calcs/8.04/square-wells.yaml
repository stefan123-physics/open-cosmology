# Calculations on content/year-2/8.04/square-wells.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 11, with the page's own example.

page: content/year-2/8.04/square-wells.mdx
calcs:
  - id: sine-normalization
    where: '∫_0^a sin²(nπx/a) dx = a/2 (a = 1.3, n = 3)'
    inputs: {}
    formula: 'integrate("sin(3*pi*x/1.3)**2", "x", 0, 1.3)'
    expected: '0.65'
    tolerance: 1e-6
    shown: ['= N^2a/2 = 1$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.10)'}
    origin: mit

  - id: quiz-ratio
    where: 'quiz 2: E_3/E_1 = 9'
    inputs: {}
    formula: 3**2/1**2
    expected: '9'
    tolerance: 1e-12
    shown: ['$E_3/E_1 = 9$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.11)'}
    origin: page-own

  - id: quiz-odd-threshold
    where: 'quiz 3: π/2'
    inputs: {}
    formula: pi/2
    expected: '1.57'
    tolerance: 0.005
    shown: ['$z_0 > \\pi/2 \\approx 1.57$']
    source: {cite: mit, at: 'notes p. 9'}
    origin: page-own

  - id: energy-from-eta
    kind: identity
    where: 'η² = 2m|E|a²/ħ² and z₀² = 2mV₀a²/ħ² give |E|/V₀ = η²/z₀²'
    formula: (2*m*E*a**2/h**2)/(2*m*V*a**2/h**2)
    equals: E/V
    samples: {m: [1.0, 2.0], E: [0.3, 1.5], a: [0.7, 2.0], h: [1.0, 0.5], V: [2.0, 5.0]}
    tolerance: 1e-12
    shown: ['\frac{|E|}{V_0} = \frac{\eta^2}{z_0^2}']
    source: {cite: mit, at: 'notes p. 7, eq. (2.29)'}
    origin: mit

  - id: ex-z0
    where: 'example (a): 0.20 √(2 × 511000 × 10) / 197.33'
    inputs: {}
    formula: 0.20*sqrt(2*511000*10)/197.33
    expected: '3.24'
    tolerance: 0.005
    shown: ['{197.33} \approx 3.24$']
    source: {cite: mit, at: 'notes p. 7, eq. (2.26)'}
    origin: page-own

  - id: ex-xi1
    where: 'example (b): ground state, solve ξ tan ξ = √(z₀² − ξ²) on (0, π/2)'
    inputs: {}
    formula: solve('q*tan(q) - sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - q**2)', 'q', 0.1, 1.5)
    expected: '1.194'
    tolerance: 0.0005
    shown: ['$\xi \approx 1.194$']
    source: {cite: mit, at: 'notes p. 8, eq. (2.34)'}
    origin: page-own

  - id: ex-xi2
    where: 'example (b): odd state, solve −ξ cot ξ = √(z₀² − ξ²) on (π/2, π)'
    inputs: {}
    formula: solve('-q/tan(q) - sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - q**2)', 'q', 1.6, 3.1)
    expected: '2.336'
    tolerance: 0.0005
    shown: ['$2.336$ and']
    source: {cite: mit, at: 'notes p. 8, eq. (2.36)'}
    origin: page-own

  - id: ex-xi3
    where: 'example (b): second even state, on (π, z₀)'
    inputs: {}
    formula: solve('q*tan(q) - sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - q**2)', 'q', 3.15, 3.2401)
    expected: '3.228'
    tolerance: 0.0005
    shown: ['$3.228$ (found numerically)']
    source: {cite: mit, at: 'notes p. 8, eq. (2.34)'}
    origin: page-own

  - id: ex-E1
    where: 'example (b): E = −10 (z₀² − 1.1935²)/z₀²'
    inputs: {}
    formula: -10*(1 - 1.19355**2/(0.20*sqrt(2*511000*10)/197.33)**2)
    expected: '-8.64'
    tolerance: 0.005
    shown: ['$E \approx -8.64$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.29)'}
    origin: page-own

  - id: ex-eta1
    where: 'example (b): η = √(z₀² − 1.1935²)'
    inputs: {}
    formula: sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - 1.19355**2)
    expected: '3.01'
    tolerance: 0.005
    shown: ['$\eta \approx 3.01$']
    source: {cite: mit, at: 'notes p. 7, eq. (2.27)'}
    origin: page-own

  - id: ex-E2
    where: 'example (b): E for ξ = 2.3363'
    inputs: {}
    formula: -10*(1 - 2.33628**2/(0.20*sqrt(2*511000*10)/197.33)**2)
    expected: '-4.80'
    tolerance: 0.005
    shown: ['$E \approx -4.80$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.29)'}
    origin: page-own

  - id: ex-eta2
    where: 'example (b): η for ξ = 2.3363'
    inputs: {}
    formula: sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - 2.33628**2)
    expected: '2.25'
    tolerance: 0.005
    shown: ['$\eta \approx 2.25$']
    source: {cite: mit, at: 'notes p. 7, eq. (2.27)'}
    origin: page-own

  - id: ex-E3
    where: 'example (b): E for ξ = 3.2280'
    inputs: {}
    formula: -10*(1 - 3.22803**2/(0.20*sqrt(2*511000*10)/197.33)**2)
    expected: '-0.07'
    tolerance: 0.01
    shown: ['$E \approx -0.07$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.29)'}
    origin: page-own

  - id: ex-eta3
    where: 'example (b): η for ξ = 3.2280'
    inputs: {}
    formula: sqrt((0.20*sqrt(2*511000*10)/197.33)**2 - 3.22803**2)
    expected: '0.28'
    tolerance: 0.005
    shown: ['$\eta \approx 0.28$']
    source: {cite: mit, at: 'notes p. 7, eq. (2.27)'}
    origin: page-own

  - id: ex-Etilde
    where: 'example (c): 10 − 8.64 eV'
    inputs: {}
    formula: 10 - 8.643
    expected: '1.36'
    tolerance: 0.005
    shown: ['$\tilde E = 10 - 8.64 \approx 1.36$ eV']
    source: {cite: mit, at: 'notes p. 5, eq. (2.14)'}
    origin: page-own

  - id: ex-infinite-E1
    where: 'example (c): π² × 197.33² / (2 × 511000 × 0.40²) eV'
    inputs: {}
    formula: pi**2*197.33**2/(2*511000*0.40**2)
    expected: '2.35'
    tolerance: 0.005
    shown: ['\approx 2.35$ eV']
    source: {cite: mit, at: 'notes p. 3, eq. (1.11)'}
    origin: page-own
