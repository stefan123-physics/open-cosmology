# Calculations on content/year-2/8.04/schrodinger-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 5, with the page's own example.

page: content/year-2/8.04/schrodinger-equation.mdx
calcs:
  - id: commutator-x-p
    kind: identity
    where: '[x, p] ψ for ψ = sin(q x) + x² (ħ = 1): x(−i)ψ′ − (−i)(xψ)′ = iψ; checked on the real coefficient: x ψ′ − (xψ)′ = −ψ'
    formula: x*(q*cos(q*x) + 2*x) - ((sin(q*x) + x**2) + x*(q*cos(q*x) + 2*x))
    equals: -(sin(q*x) + x**2)
    samples: {x: [0.3, 1.1, -2.0], q: [1.0, 2.5, 0.7]}
    tolerance: 1e-12
    shown: ['= i\hbar\,\psi" cite="mit" at="notes p. 5']
    source: {cite: mit, at: 'notes p. 5, eqs. (2.11)–(2.12)'}
    origin: mit

  - id: free-dispersion
    kind: identity
    where: 'plane wave solves the free equation when ħω = ħ²k²/2m: i(−iω) = −(ħ/2m)(ik)² with ω = ħk²/2m (ħ = h, m free)'
    formula: (h*k**2/(2*m))
    equals: -(h/(2*m))*(-(k**2))
    samples: {h: [1.0, 0.5], k: [2.0, 3.0], m: [1.0, 4.0]}
    tolerance: 1e-12
    shown: ['which is $E = p^2/(2m)$ (notes p. 3']
    source: {cite: mit, at: 'notes p. 3, eqs. (1.13)–(1.14)'}
    origin: mit

  - id: pauli-12
    kind: identity
    where: '[σ1, σ2] = 2iσ3: top-left entry of σ1σ2 − σ2σ1 is i − (−i) = 2i (imaginary parts)'
    formula: 1 - (-1) + 0*q
    equals: 2 + 0*q
    samples: {q: [0]}
    tolerance: 1e-12
    shown: ['\left[\sigma_1, \sigma_2\right] = 2i\sigma_3']
    source: {cite: mit, at: 'notes p. 6, eq. (2.17)'}
    origin: mit

  - id: trace-of-commutator
    kind: identity
    where: 'trace(AB) = trace(BA) for 2×2 matrices (so a commutator of finite matrices has zero trace)'
    formula: (a*e + b*g) + (c*f + d*h)
    equals: (e*a + f*c) + (g*b + h*d)
    samples: {a: [1.0, 2.0], b: [3.0, -1.0], c: [0.5, 4.0], d: [2.0, 1.5], e: [1.0, -2.0], f: [0.3, 2.0], g: [5.0, 1.0], h: [-1.0, 0.7]}
    tolerance: 1e-12
    shown: ['the trace of any commutator of finite matrices is zero']
    source: {cite: mit, at: 'notes p. 6'}
    origin: page-own

  - id: ex-wavelength
    where: 'example (a): 2π/20 nm'
    inputs: {}
    formula: 2*pi/20
    expected: '0.314'
    tolerance: 0.0005
    shown: ['$\lambda = 2\pi/k = 2\pi/20 \approx 0.314$ nm']
    source: {cite: mit, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own

  - id: ex-energy
    where: 'example (a): 197.33² × 400 / 1,022,000 eV'
    inputs: {}
    formula: 197.33**2*400/1022000
    expected: '15.2'
    tolerance: 0.05
    shown: ['197.33^2 \times 400/1{,}022{,}000 \approx 15.2$ eV']
    source: {cite: mit, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own

  - id: ex-commutator-x2
    kind: identity
    where: 'example (b): x²ψ′ − (x²ψ)′ = −2xψ for ψ = sin(qx) + x'
    formula: x**2*(q*cos(q*x) + 1) - (2*x*(sin(q*x) + x) + x**2*(q*cos(q*x) + 1))
    equals: -2*x*(sin(q*x) + x)
    samples: {x: [0.3, 1.1, -2.0], q: [1.0, 2.5, 0.7]}
    tolerance: 1e-12
    shown: ['$[\hat x^2, \hat p] = 2i\hbar\,\hat x$']
    source: {cite: mit, at: 'notes p. 5, eq. (2.10)'}
    origin: page-own
