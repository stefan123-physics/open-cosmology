# Calculations on content/year-2/8.04/key-features-of-quantum-mechanics.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 1, with the page's own example.

page: content/year-2/8.04/key-features-of-quantum-mechanics.mdx
calcs:
  - id: quiz-polarizer
    where: 'quiz: cos² 30°'
    inputs: {}
    formula: cos(30*pi/180)**2
    expected: '0.75'
    tolerance: 1e-9
    shown: ['$\\cos^2 30° = 0.75$']
    source: {cite: mit, at: 'notes p. 7'}
    origin: page-own

  - id: quiz-born
    where: 'quiz: |1 + i|² / (|1 + i|² + |2|²)'
    inputs: {}
    formula: 2/(2 + 4)
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['$P(a) = 2/(2 + 4) = 1/3$']
    source: {cite: mit, at: 'notes p. 10, eq. (4.3)'}
    origin: page-own

  - id: euler-identity
    kind: identity
    where: '|e^(iθ)|² = cos²θ + sin²θ = 1 (a pure phase has norm 1)'
    formula: cos(q)**2 + sin(q)**2
    equals: 1 + 0*q
    samples: {q: [0.3, 1.2, 2.5]}
    tolerance: 1e-12
    shown: ['e^{i\theta} = \cos\theta + i\sin\theta']
    source: {cite: mit, at: 'notes p. 5, eq. (2.6)'}
    origin: mit

  - id: ex-first-polarizer
    where: 'example: cos² 45°'
    inputs: {}
    formula: cos(45*pi/180)**2
    expected: '0.5'
    tolerance: 1e-9
    shown: ['with probability $\cos^2 45° = 0.5$, and then']
    source: {cite: mit, at: 'notes p. 7'}
    origin: page-own

  - id: ex-two-polarizers
    where: 'example: cos² 45° × cos² 45°'
    inputs: {}
    formula: cos(45*pi/180)**4
    expected: '0.25'
    tolerance: 1e-9
    shown: ['So 0.25 of the photons get through']
    source: {cite: mit, at: 'notes p. 7'}
    origin: page-own

  - id: ex-norm
    where: 'example: |3 + 4i|'
    inputs: {}
    formula: sqrt(3**2 + 4**2)
    expected: '5'
    tolerance: 1e-9
    shown: ['$|z| = \sqrt{9 + 16} = 5$']
    source: {cite: mit, at: 'notes p. 4, eq. (2.4)'}
    origin: page-own

  - id: ex-phase
    where: 'example: arctan(4/3) in rad'
    inputs: {}
    formula: atan(4/3)
    expected: '0.927'
    tolerance: 0.0005
    shown: ['\arctan(4/3) \approx 0.927$ rad']
    source: {cite: mit, at: 'notes p. 5, eq. (2.6)'}
    origin: page-own

  - id: ex-phase-deg
    where: 'example: arctan(4/3) in degrees'
    inputs: {}
    formula: atan(4/3)*180/pi
    expected: '53.1'
    tolerance: 0.05
    shown: ['(about $53.1°$)']
    source: {cite: mit, at: 'notes p. 5, eq. (2.6)'}
    origin: page-own

  - id: ex-prob-a
    where: 'example: P(a) = 2/6'
    inputs: {}
    formula: 2/6
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['so $P(a) = 2/6 = 1/3$']
    source: {cite: mit, at: 'notes p. 10, eq. (4.3)'}
    origin: page-own

  - id: ex-prob-b
    where: 'example: P(b) = 4/6'
    inputs: {}
    formula: 4/6
    expected: '0.6667'
    tolerance: 0.0001
    shown: ['$P(b) = 4/6 = 2/3$']
    source: {cite: mit, at: 'notes p. 10, eq. (4.3)'}
    origin: page-own

  - id: history-years
    kind: fact
    where: 'dates in the notes'
    value: 'Einstein 1905; Compton 1923; Schrödinger 1925; Solvay 1927; Bell 1964'
    shown: ['Einstein proposed in 1905 that light''s energy comes in packets']
    source: {cite: mit, at: 'notes pp. 3, 5, 8, 14'}
    origin: mit
