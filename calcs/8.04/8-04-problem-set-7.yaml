    where: 'Problem 3(c): the closed form (2c³ + c) e^(-c²)/sqrt(pi) + erfc(c) at c = sqrt(5)'
    formula: (2*5**1.5 + sqrt(5))*exp(-5)/sqrt(pi) + erfc(sqrt(5))
    expected: '0.0951'
    shown: ['$P_2 = 0.0951$: the probability']
    source: {cite: mit, at: 'Problem 3, p. 1 (our own solution)'}
    origin: page-own

  - id: p3-parts
    kind: identity
    where: 'Problem 3(b): the integration by parts for u² e^(-u²), against the numerical integral'
