  # H_2 is the second s-derivative of the generating function at s = 0.
  - id: p4-hermite-2
    kind: identity
    where: 'Problem 4(c), check: the second derivative of e^(-s² + 2 s xi) with respect to s at s = 0 is H_2 = 4 xi² - 2'
    formula: deriv('exp(-s**2 + 2*s*x0)', 's', 0, 2)
    equals: 4*x0**2 - 2
    samples:
      x0: [-1.3, 0.2, 0.9, 1.5, 2.1]
    tolerance: 1e-6
    shown: ['$H_2 = 4\xi^2 - 2$ and $H_3']
    source: {cite: reading2, at: 'notes p. 12, eqs. (3.67)–(3.68)'}
    origin: page-own

  # The partial sum of the series up to s³ with the four polynomials, against the generating function for small s.
  - id: p4-hermite-series
    kind: limit
    where: 'Problem 4(c), check: 1 + 2 xi s + (2 xi² - 1) s² + (4 xi³/3 - 2 xi) s³ approaches the generating function as s -> 0 (xi = 1.5; the difference is of order s⁴)'
    inputs: {x0: 1.5}
    formula: (1 + 2*x0*sv + (2*x0**2 - 1)*sv**2 + (4*x0**3/3 - 2*x0)*sv**3 - 1 - 2*x0*sv)/sv**2
    limit: (exp(-sv**2 + 2*sv*x0) - 1 - 2*x0*sv)/sv**2
    vary: {sv: [0.3, 0.1, 0.03, 0.01]}
    tolerance: 1e-3
    shown: ['$1 + 2\xi s + \left(2\xi^2 - 1\right)s^2 + \left(\frac43\xi^3 - 2\xi\right)s^3$']
    source: {cite: mit, at: 'Problem 4(c), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 5: oscillator with a wall (our own problem)

  # The odd states u e^(-u²/2) (k = 0) and (8u³ - 12u) e^(-u²/2) (k = 1) vanish at the wall. Their energy follows
  # from the unit-free equation psi'' = (u² - eps) psi with eps = 2E/(hbar omega), by a numerical second derivative.
  - id: p5-energy
    kind: identity
    answer: p5-energy
    where: 'Problem 5(a), answer box: the energy of the two lowest odd oscillator states from eps = u² - psi''''/psi, by numerical differentiation at a point u0'
    formula: hbar*omega*(2*k + 3/2)
    equals: (hbar*omega/2)*(u0**2 - deriv('((1-k)*s + k*(8*s**3-12*s))*exp(-s**2/2)', 's', u0, 2)/(((1-k)*u0 + k*(8*u0**3-12*u0))*exp(-u0**2/2)))
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      omega: [0.5, 1, 1.5, 2, 1.2]
      k: [0, 1, 0, 1, 1]
      u0: [0.5, 0.7, 1.3, 2.0, 0.4]
    tolerance: 1e-6
    shown: ['id="p5-energy"']
    source: {cite: reading2, at: 'notes p. 9, eq. (3.38), and p. 12, eq. (3.64)'}
    origin: page-own

  - id: p5-x
    kind: identity
    answer: p5-x
    where: 'Problem 5(b), answer box: against the numerical integral of x times the density 4u² e^(-u²)/sqrt(pi) on the half line'
    formula: 2*sqrt(hbar/(pi*m*omega))
    equals: sqrt(hbar/(m*omega))*integrate('u*4*u**2*exp(-u**2)/sqrt(pi)', 'u', 0, 15)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      m: [0.5, 1, 1.5, 2, 0.7]
      omega: [0.5, 1, 1.5, 2, 1.2]
    tolerance: 1e-8
