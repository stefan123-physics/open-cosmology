    equals: hbar*sqrt(integrate('u**2*((1-n)*(2-n)*(3-n)/6 + n*(2-n)*(3-n)/2*2*u**2 + n*(n-1)*(3-n)/2*(4*u**2-2)**2/8 + n*(n-1)*(n-2)/6*(8*u**3-12*u)**2/48)*exp(-u**2)/sqrt(pi)', 'u', -12, 12))*sqrt(integrate('((1-n)*(2-n)*(3-n)/6*u**2 + n*(2-n)*(3-n)/2*(2-2*u**2)**2/2 + n*(n-1)*(3-n)/2*(10*u-4*u**3)**2/8 + n*(n-1)*(n-2)/6*(36*u**2-12-8*u**4)**2/48)*exp(-u**2)/sqrt(pi)', 'u', -12, 12))
    samples:
