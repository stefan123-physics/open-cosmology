  # ---- Problem 4: oscillator computations

  - id: p4-x4
    kind: identity
    answer: p4-x4
    where: 'Problem 4(a), answer box: against the numerical integral of x⁴ |psi_n|² with the explicit Hermite polynomials, n = 0 to 3'
    formula: 3*hbar**2*(2*n**2 + 2*n + 1)/(4*m**2*omega**2)
    equals: (hbar/(m*omega))**2*integrate('u**4*((1-n)*(2-n)*(3-n)/6 + n*(2-n)*(3-n)/2*2*u**2 + n*(n-1)*(3-n)/2*(4*u**2-2)**2/8 + n*(n-1)*(n-2)/6*(8*u**3-12*u)**2/48)*exp(-u**2)/sqrt(pi)', 'u', -12, 12)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      m: [0.5, 1, 1.5, 2, 0.7]
      omega: [0.5, 1, 1.5, 2, 1.2]
      n: [0, 1, 2, 3, 2]
    tolerance: 1e-8
    shown: ['id="p4-x4"']
    source: {cite: mit, at: 'Problem 4(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p4-x4-n0
    where: 'Problem 4(a), check: the integral of u⁴ |psi_0|², in units of (hbar/m omega)²'
    formula: integrate('u**4*exp(-u**2)/sqrt(pi)', 'u', -12, 12)
    expected: '0.75'
    tolerance: 1e-8
    shown: ['gives $\frac34$, $\frac{15}{4}$, $\frac{39}{4}$ and $\frac{75}{4}$ times']
