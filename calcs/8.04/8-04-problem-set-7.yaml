    equals: sqrt(hbar*m*omega*integrate('((1-n)*(2-n)*(3-n)/6*u**2 + n*(2-n)*(3-n)/2*(2-2*u**2)**2/2 + n*(n-1)*(3-n)/2*(10*u-4*u**3)**2/8 + n*(n-1)*(n-2)/6*(36*u**2-12-8*u**4)**2/48)*exp(-u**2)/sqrt(pi)', 'u', -12, 12))
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
