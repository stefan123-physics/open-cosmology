  # ---- Problem 6: the oscillating state

  # |Psi|² = (1/2)[(psi0 + psi1 cos wt)² + (psi1 sin wt)²] from the real and imaginary parts, psi1 = sqrt(2) u psi0.
  - id: p6-x
    kind: identity
    answer: p6-x
    where: 'Problem 6(b), answer box: against the numerical integral of x |Psi(x, t)|², with the density built from the real and imaginary parts of the state'
    formula: sqrt(hbar/(2*m*omega))*cos(omega*t)
    equals: sqrt(hbar/(m*omega))*integrate('u*(1/2)*((1 + sqrt(2)*u*cos(omega*t))**2 + 2*u**2*sin(omega*t)**2)*exp(-u**2)/sqrt(pi)', 'u', -12, 12)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      m: [0.5, 1, 1.5, 2, 0.7]
      omega: [0.5, 1, 1.5, 0.7, 1.2]
      t: [0.2, 0.9, 1.7, 3.0, 2.4]
    tolerance: 1e-8
    shown: ['id="p6-x"']
    source: {cite: mit, at: 'Problem 6(b), p. 2 (our own solution)'}
    origin: page-own

  # <p> = hbar ∫ (Re Psi d Im Psi/dx - Im Psi d Re Psi/dx) dx, with Re Psi ∝ psi0 + psi1 cos wt and Im Psi ∝ -psi1 sin wt
  # (the common phase e^(-i w t/2) removed), psi0' = -u psi0 and psi1' = sqrt(2)(1 - u²) psi0.
  - id: p6-p
    kind: identity
    answer: p6-p
    where: 'Problem 6(c), answer box: against the numerical integral of Re Psi d(Im Psi)/dx - Im Psi d(Re Psi)/dx'
    formula: -sqrt(m*omega*hbar/2)*sin(omega*t)
    equals: sqrt(hbar*m*omega)*(1/2)*integrate('((1 + sqrt(2)*u*cos(omega*t))*(-sqrt(2)*(1-u**2)*sin(omega*t)) + sqrt(2)*u*sin(omega*t)*(-u + sqrt(2)*(1-u**2)*cos(omega*t)))*exp(-u**2)/sqrt(pi)', 'u', -12, 12)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      m: [0.5, 1, 1.5, 2, 0.7]
      omega: [0.5, 1, 1.5, 0.7, 1.2]
      t: [0.2, 0.9, 1.7, 1.2, 1.5]
    tolerance: 1e-8
    shown: ['id="p6-p"']
    source: {cite: mit, at: 'Problem 6(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p6-ehrenfest
    kind: identity
    where: 'Problem 6(c), check: m times the numerical time derivative of <x>(t) equals <p>(t)'
    formula: m*deriv('sqrt(hbar/(2*m*omega))*cos(omega*s)', 's', t)
    equals: -sqrt(m*omega*hbar/2)*sin(omega*t)
    samples:
      hbar: [0.5, 1, 1.5, 2, 0.8]
      m: [0.5, 1, 1.5, 2, 0.7]
      omega: [0.5, 1, 1.5, 0.7, 1.2]
      t: [0.2, 0.9, 1.7, 1.2, 1.5]
    tolerance: 1e-7
    shown: ['$\langle\hat p\rangle = m\,d\langle\hat x\rangle/dt = -m\omega\sqrt{\hbar/(2m\omega)}\,\sin\omega t']
    source: {cite: mit, at: 'Problem 6(c), p. 2 (our own solution)'}
    origin: page-own

  - id: p6-x-start
    where: 'Problem 6(b), check: <x> at t = 0 by direct integration of x (psi0 + psi1)²/2, in units of a: 1/sqrt(2) (1 is added and the result compared with 1 + 1/sqrt 2)'
    formula: integrate('u*(1/2)*(1 + sqrt(2)*u)**2*exp(-u**2)/sqrt(pi)', 'u', -12, 12) - 1/sqrt(2) + 1
    expected: '1'
