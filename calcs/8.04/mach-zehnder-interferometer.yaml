# Calculations on content/year-2/8.04/mach-zehnder-interferometer.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 2, with the page's own example.

page: content/year-2/8.04/mach-zehnder-interferometer.mdx
calcs:
  - id: quiz-lower-beam
    where: 'quiz: |0.8 i|²'
    inputs: {}
    formula: 0.8**2
    expected: '0.64'
    tolerance: 1e-9
    shown: ['$\\left|\\beta\\right|^2 = \\left|0.8i\\right|^2 = 0.64$']
    source: {cite: mit, at: 'notes p. 1, eq. (1.2)'}
    origin: page-own

  - id: bs2-normalization
    kind: identity
    where: 'BS2 conserves probability: (|α + β|² + |α − β|²)/2 = |α|² + |β|² (real α, β as a check)'
    formula: ((a + b)**2 + (a - b)**2)/2
    equals: a**2 + b**2
    samples: {a: [0.6, 0.3, -0.7], b: [0.8, 0.2, 0.5]}
    tolerance: 1e-12
    shown: ['\frac12\left(|\alpha + \beta|^2 + |\alpha - \beta|^2\right) = |\alpha|^2 + |\beta|^2']
    source: {cite: mit, at: 'notes p. 4, eq. (1.16)'}
    origin: mit

  - id: interferometer-d0-entry
    kind: identity
    where: 'BS2·BS1, top-right entry: (1·1 + 1·1)/2 = 1; top-left: (1·(−1) + 1·1)/2 = 0'
    formula: (1*1 + 1*1)/2 + 0*a
    equals: 1 + 0*a
    samples: {a: [0]}
    tolerance: 1e-12
    shown: ['\begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}']
    source: {cite: mit, at: 'notes p. 4, eq. (1.19)'}
    origin: mit

  - id: blocked-d1
    where: 'blocked lower path: amplitude at D1 = (1/√2)(1/√2), probability squared'
    inputs: {}
    formula: ((1/sqrt(2))*(1/sqrt(2)))**2
    expected: '0.25'
    tolerance: 1e-9
    shown: ['and D1 with probability $1/4$ (notes p. 6']
    source: {cite: mit, at: 'notes p. 6, table (1.23)'}
    origin: mit

  - id: blocked-block
    where: 'blocked lower path: probability absorbed = |1/√2|²'
    inputs: {}
    formula: (1/sqrt(2))**2
    expected: '0.5'
    tolerance: 1e-9
    shown: ['with probability $1/2$ the photon ends in the block']
    source: {cite: mit, at: 'notes p. 6, table (1.23)'}
    origin: mit

  - id: phase-shifter-d0
    kind: identity
    where: '|1 + e^(iδ)|²/4 = cos²(δ/2) (plot and example)'
    formula: ((1 + cos(q))**2 + sin(q)**2)/4
    equals: cos(q/2)**2
    samples: {q: [0.4, 1.0472, 2.5, 4.0]}
    tolerance: 1e-12
    shown: ['D0 gets cos²(δ/2)']
    source: {cite: mit, at: 'notes p. 4, eq. (1.18)'}
    origin: page-own

  - id: phase-shifter-d1
    kind: identity
    where: '|1 − e^(iδ)|²/4 = sin²(δ/2)'
    formula: ((1 - cos(q))**2 + sin(q)**2)/4
    equals: sin(q/2)**2
    samples: {q: [0.4, 1.0472, 2.5, 4.0]}
    tolerance: 1e-12
    shown: ['D1 gets sin²(δ/2)']
    source: {cite: mit, at: 'notes p. 4, eq. (1.18)'}
    origin: page-own

  - id: ex-bs1-entry
    where: 'example (a): |−0.6 + 0.8i|²/2'
    inputs: {}
    formula: (0.6**2 + 0.8**2)/2
    expected: '0.5'
    tolerance: 1e-9
    shown: ['$(0.36 + 0.64)/2 = 0.5$']
    source: {cite: mit, at: 'notes p. 4, eq. (1.18)'}
    origin: page-own

  - id: ex-phase-d0
    where: 'example (b): cos²(π/6)'
    inputs: {}
    formula: cos(pi/6)**2
    expected: '0.75'
    tolerance: 1e-9
    shown: ['\cos^2 30° = 0.75$, and at D1']
    source: {cite: mit, at: 'notes p. 4, eq. (1.18)'}
    origin: page-own

  - id: ex-phase-d1
    where: 'example (b): sin²(π/6)'
    inputs: {}
    formula: sin(pi/6)**2
    expected: '0.25'
    tolerance: 1e-9
    shown: ['$\sin^2 30° = 0.25$']
    source: {cite: mit, at: 'notes p. 4, eq. (1.18)'}
    origin: page-own

  - id: ex-repeated-tests
    where: 'example (c): (1/4)/(1/4 + 1/2)'
    inputs: {}
    formula: 0.25/(0.25 + 0.5)
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['$\frac{1/4}{1/4 + 1/2} = 1/3$']
    source: {cite: mit, at: 'notes p. 7, table (2.25)'}
    origin: page-own
