# Calculations on content/year-2/8.04/phase-shifts-time-delay.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 18, with the page's own example.

page: content/year-2/8.04/phase-shifts-time-delay.mdx
calcs:
  - id: canonical-form
    kind: identity
    where: '(−e^{−ikx} + e^{ikx+2iδ})/2i = e^{iδ} sin(kx + δ): real parts, sin(kx + 2δ)/2 + sin(kx)/2 = cos δ sin(kx + δ)'
    formula: (sin(q + 2*d) + sin(q))/2
    equals: cos(d)*sin(q + d)
    samples: {q: [0.3, 1.7, 4.0], d: [0.2, -1.1, 2.5]}
    tolerance: 1e-12
    shown: ['= e^{i\delta}\sin\left(kx + \delta\right), \qquad x > R']
    source: {cite: mit, at: 'notes p. 3, eq. (1.8)'}
    origin: mit

  - id: scattered-wave
    kind: identity
    where: '(e^{2iδ} − 1)/2i = e^{iδ} sin δ: real parts, sin(2δ)/2 = cos δ sin δ'
    formula: sin(2*d)/2
    equals: cos(d)*sin(d)
    samples: {d: [0.2, -1.1, 2.5]}
    tolerance: 1e-12
    shown: ['= e^{i\delta}\sin\delta\;e^{ikx}']
    source: {cite: mit, at: 'notes p. 3, eq. (1.11)'}
    origin: mit

  - id: ex-delta-well
    where: 'example (b): δ = atan((0.5/√3.65) tan √3.65) − 0.5'
    inputs: {}
    formula: atan((0.5/sqrt(3.65))*tan(sqrt(3.65))) - 0.5
    expected: '-1.137'
    tolerance: 0.0005
    shown: ['- 0.50 \approx -1.137$']
    source: {cite: mit, at: 'notes p. 6, eq. (1.28)'}
    origin: page-own

  - id: ex-kprime
    where: 'example (b): √(3.40 + 0.25)'
    inputs: {}
    formula: sqrt(3.40 + 0.25)
    expected: '1.910'
    tolerance: 0.0005
    shown: ['\approx 1.910$, and']
    source: {cite: mit, at: 'notes p. 6, eq. (1.33)'}
    origin: page-own

  - id: ex-sin2
    where: 'example (b): sin²δ'
    inputs: {}
    formula: sin(atan((0.5/sqrt(3.65))*tan(sqrt(3.65))) - 0.5)**2
    expected: '0.82'
    tolerance: 0.005
    shown: ['$\sin^2\delta \approx 0.82$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.12)'}
    origin: page-own

  - id: ex-delay-ratio
    where: 'example (b): dδ/d(ka) at ka = 0.5 by central difference'
    inputs: {}
    formula: ((atan((0.500001/sqrt(3.4 + 0.500001**2))*tan(sqrt(3.4 + 0.500001**2))) - 0.500001) - (atan((0.499999/sqrt(3.4 + 0.499999**2))*tan(sqrt(3.4 + 0.499999**2))) - 0.499999))/0.000002
    expected: '-1.49'
    tolerance: 0.005
    shown: ['\approx -1.49$ (found numerically)']
    source: {cite: mit, at: 'notes p. 5, eq. (1.22)'}
    origin: page-own

  - id: ex-hard-core
    where: 'example (a): −2a/v0 for a = 1e-10 m, v0 = 5.93e5 m/s'
    inputs: {}
    formula: -2*1.0e-10/5.93e5
    expected: '-3.4e-16'
    tolerance: 0.05e-16
    shown: ['\approx -3.4 \times 10^{-16}$ s']
    source: {cite: mit, at: 'notes p. 4, eq. (1.18)'}
    origin: page-own

  - id: ex-speed
    where: 'example (a): 1 eV electron speed, km/s'
    inputs: {}
    formula: 299792.458*sqrt(2/511000)
    expected: '593'
    tolerance: 0.5
    shown: ['$v_0 \approx 593$ km/s']
    source: {cite: mit, at: 'notes p. 4'}
    origin: page-own

  - id: plot-branch
    where: 'plot: k′a stays between π/2 and 3π/2 for 0 ≤ ka ≤ 4 (√3.4 and √19.4)'
    inputs: {}
    formula: sqrt(3.4 + 16)
    expected: '4.405'
    tolerance: 0.0005
    shown: ['since k′a stays between π/2 and 3π/2']
    source: {cite: mit, at: 'notes p. 6, eq. (1.33)'}
    origin: page-own
