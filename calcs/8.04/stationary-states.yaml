# Calculations on content/year-2/8.04/stationary-states.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 10, with the page's own example.

page: content/year-2/8.04/stationary-states.mdx
calcs:
  - id: circle-energy
    kind: identity
    where: 'ħ²k_n²/2m with k_n = 2πn/L equals 2π²ħ²n²/(mL²)'
    formula: h**2*(2*pi*n/L)**2/(2*m)
    equals: 2*pi**2*h**2*n**2/(m*L**2)
    samples: {h: [1.0, 0.7], n: [1.0, 3.0], L: [2.0, 0.5], m: [1.0, 4.0]}
    tolerance: 1e-9
    shown: ['= \frac{2\pi^2\hbar^2n^2}{mL^2}, \qquad n \in \mathbb{Z}']
    source: {cite: mit, at: 'notes p. 8, eq. (3.18)'}
    origin: mit

  - id: superposition-density
    kind: identity
    where: '|e^{iA} + e^{iB}|²/2 = 1 + cos(B − A)'
    formula: ((cos(A) + cos(B))**2 + (sin(A) + sin(B))**2)/2
    equals: 1 + cos(B - A)
    samples: {A: [0.3, 1.9, -2.0], B: [1.1, 0.2, 2.6]}
    tolerance: 1e-12
    shown: ['|\Psi|^2 = \frac1L\left(1 + \cos\left((k_2 - k_1)x - (E_2 - E_1)t/\hbar\right)\right)$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.18)'}
    origin: page-own

  - id: ex-E1
    where: 'example (a): 2π² × 197.33² / (511000 × 1²) eV'
    inputs: {}
    formula: 2*pi**2*197.33**2/(511000*1.0**2)
    expected: '1.50'
    tolerance: 0.005
    shown: ['\approx 1.50$ eV, and']
    source: {cite: mit, at: 'notes p. 8, eq. (3.18)'}
    origin: page-own

  - id: ex-E2
    where: 'example (a): 4 E_1 eV'
    inputs: {}
    formula: 4*2*pi**2*197.33**2/511000
    expected: '6.02'
    tolerance: 0.005
    shown: ['$E_2 = 4E_1 \approx 6.02$ eV']
    source: {cite: mit, at: 'notes p. 8, eq. (3.18)'}
    origin: page-own

  - id: ex-period
    where: 'example (b): 2π × 6.582e-16 / (E_2 − E_1) s'
    inputs: {}
    formula: 2*pi*6.582e-16/(3*2*pi**2*197.33**2/511000)
    expected: '9.2e-16'
    tolerance: 0.05e-16
    shown: ['\approx 9.2 \times 10^{-16}$ s']
    source: {cite: mit, at: 'notes p. 3, eq. (1.18)'}
    origin: page-own

  - id: ex-energy-gap
    where: 'example (b): E_2 − E_1 = 3 E_1 eV'
    inputs: {}
    formula: 3*2*pi**2*197.33**2/511000
    expected: '4.51'
    tolerance: 0.005
    shown: ['/4.51 \approx']
    source: {cite: mit, at: 'notes p. 8, eq. (3.18)'}
    origin: page-own
