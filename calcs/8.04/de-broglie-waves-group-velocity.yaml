# Calculations on content/year-2/8.04/de-broglie-waves-group-velocity.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 4, with the page's own examples.

page: content/year-2/8.04/de-broglie-waves-group-velocity.mdx
calcs:
  - id: galilean-phase
    kind: identity
    where: 'phase invariance: (2π/λ)(x − Vt) with x = x′ + vt′ equals (2π/λ)x′ − (2π/λ)(V − v)t′'
    formula: (2*pi/L)*((xp + v*tp) - V*tp)
    equals: (2*pi/L)*xp - (2*pi/L)*(V - v)*tp
    samples: {L: [0.5, 2.0], xp: [1.3, -0.4], v: [3.0, 0.7], tp: [0.2, 1.5], V: [340.0, 5.0]}
    tolerance: 1e-9
    shown: ['\phi'' = \frac{2\pi}{\lambda}\left(x'' + vt'' - Vt''\right)']
    source: {cite: mit, at: 'notes p. 3, eq. (1.10)'}
    origin: mit

  - id: omega-prime
    kind: identity
    where: 'ω′ = (2π/λ)(V − v) = ω(1 − v/V) with ω = 2πV/λ'
    formula: (2*pi/L)*(V - v)
    equals: (2*pi*V/L)*(1 - v/V)
    samples: {L: [0.5, 2.0], v: [3.0, 0.7], V: [340.0, 5.0]}
    tolerance: 1e-9
    shown: ['\omega\left(1 - \frac{v}{V}\right)']
    source: {cite: mit, at: 'notes p. 3, eq. (1.12)'}
    origin: mit

  - id: group-velocity-free
    kind: identity
    where: 'd/dp (p²/2m) = p/m (numerical derivative)'
    formula: (((p + 1e-6)**2 - (p - 1e-6)**2)/(2*m))/(2e-6)
    equals: p/m
    samples: {p: [1.0, 2.5, 7.0], m: [1.0, 3.0, 0.5]}
    tolerance: 1e-6
    shown: ['= \frac{p}{m} = v']
    source: {cite: mit, at: 'notes p. 3, eq. (1.17)'}
    origin: mit

  - id: sine-superposition
    kind: identity
    where: 'sin(kx − ωt) + sin(kx + ωt) = 2 sin kx cos ωt'
    formula: sin(a - b) + sin(a + b)
    equals: 2*sin(a)*cos(b)
    samples: {a: [0.3, 1.7, -2.2], b: [0.9, 2.4, 0.1]}
    tolerance: 1e-12
    shown: ['$\sin(kx - \omega t) + \sin(kx + \omega t) = 2\sin kx\cos\omega t$']
    source: {cite: mit, at: 'notes p. 6, eqs. (3.1)–(3.2)'}
    origin: mit

  - id: cosine-superposition
    kind: identity
    where: 'cos(kx − ωt) + cos(kx + ωt) = 2 cos kx cos ωt'
    formula: cos(a - b) + cos(a + b)
    equals: 2*cos(a)*cos(b)
    samples: {a: [0.3, 1.7, -2.2], b: [0.9, 2.4, 0.1]}
    tolerance: 1e-12
    shown: ['$\cos(kx - \omega t) + \cos(kx + \omega t) = 2\cos kx\cos\omega t$']
    source: {cite: mit, at: 'notes p. 6, eq. (3.4)'}
    origin: mit

  - id: exp-superposition
    kind: identity
    where: 'Re of e^(i(kx − ωt)) + e^(i(−kx − ωt)) = 2 cos kx cos ωt (real part of 2 cos kx e^(−iωt))'
    formula: cos(a - b) + cos(-a - b)
    equals: 2*cos(a)*cos(b)
    samples: {a: [0.3, 1.7], b: [0.9, 2.4]}
    tolerance: 1e-12
    shown: ['= 2\cos kx\,e^{-i\omega t}$, never zero']
    source: {cite: mit, at: 'notes p. 6, eqs. (3.5)–(3.7)'}
    origin: mit

  - id: ex-electron-p
    where: 'example (a): m_e v = 9.109e-31 × 1.00e6'
    inputs: {}
    formula: 9.109e-31*1.00e6
    expected: '9.109e-25'
    tolerance: 1e-29
    shown: ['$p = m_ev = 9.109 \times 10^{-25}$ kg m/s']
    source: {cite: mit, at: 'notes p. 2, eq. (1.7)'}
    origin: page-own

  - id: ex-electron-lambda
    where: 'example (a): λ = h/p in nm'
    inputs: {}
    formula: 6.626e-34/(9.109e-31*1.00e6)*1e9
    expected: '0.727'
    tolerance: 0.0005
    shown: ['\approx 7.27 \times 10^{-10}$ m $= 0.727$ nm']
    source: {cite: mit, at: 'notes p. 2, eq. (1.7)'}
    origin: page-own

  - id: ex-electron-speed-prime
    where: 'example (a): 1.00e6 − 4.0e5 m/s'
    inputs: {}
    formula: 1.00e6 - 4.0e5
    expected: '6.0e5'
    tolerance: 1
    shown: ['In S′ the electron moves at $6.0 \times 10^5$ m/s']
    source: {cite: mit, at: 'notes p. 2, eq. (1.5)'}
    origin: page-own

  - id: ex-electron-lambda-prime
    where: 'example (a): λ′ = h/(m_e × 6.0e5) in nm'
    inputs: {}
    formula: 6.626e-34/(9.109e-31*6.0e5)*1e9
    expected: '1.21'
    tolerance: 0.005
    shown: ['\approx 1.21$ nm']
    source: {cite: mit, at: 'notes p. 2, eq. (1.7)'}
    origin: page-own

  - id: ex-sound-lambda
    where: 'example (b): 340/680 m'
    inputs: {}
    formula: 340/680
    expected: '0.50'
    tolerance: 1e-9
    shown: ['$\lambda = 340/680 = 0.50$ m']
    source: {cite: mit, at: 'notes p. 3, eq. (1.11)'}
    origin: page-own

  - id: ex-sound-frequency
    where: 'example (b): 680 (1 − 34/340) Hz'
    inputs: {}
    formula: 680*(1 - 34/340)
    expected: '612'
    tolerance: 1e-9
    shown: ['$680 \times \left(1 - 34/340\right) = 612$ Hz']
    source: {cite: mit, at: 'notes p. 3, eq. (1.12)'}
    origin: page-own

  - id: ex-phase-velocity
    where: 'example (c): v/2 for v = 1.00e6 m/s'
    inputs: {}
    formula: 1.00e6/2
    expected: '5.0e5'
    tolerance: 1
    shown: ['= v/2 = 5.0 \times 10^5$ m/s']
    source: {cite: mit, at: 'notes p. 3, eq. (1.17)'}
    origin: page-own

  - id: phase-velocity-free
    kind: identity
    where: 'ω/k = ħk/2m and dω/dk = ħk/m for ω = ħk²/2m: ratio 1/2 (plot uses 1 and 2)'
    formula: ((hb*k**2/(2*m))/k)/(hb*k/m)
    equals: 0.5 + 0*k
    samples: {hb: [1.0, 2.0], k: [3.0, 0.5], m: [1.0, 4.0]}
    tolerance: 1e-12
    shown: ['units where the group velocity is 2 and the phase velocity is 1']
    source: {cite: mit, at: 'notes p. 5, eq. (2.26)'}
    origin: page-own
