# Calculations on content/year-2/8.04/shape-of-wavefunctions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 12 sections 1–3, with the page's own example.

page: content/year-2/8.04/shape-of-wavefunctions.mdx
calcs:
  - id: sin2-average
    where: 'average of (2/a) sin²(nπx/a) over [0, a] is 1/a (a = 1, n = 7)'
    inputs: {}
    formula: 'integrate("2*sin(7*pi*x)**2", "x", 0, 1)'
    expected: '1'
    tolerance: 1e-6
    shown: ['\simeq \frac2a \cdot \frac12 = \frac1a = P_{cl}(x)']
    source: {cite: mit, at: 'notes p. 7, eq. (2.12)'}
    origin: mit

  - id: ex-quantum-prob
    where: 'example (a): ∫_0^0.125 2 sin²(50πx) dx'
    inputs: {}
    formula: 'integrate("2*sin(50*pi*x)**2", "x", 0, 0.125)'
    expected: '0.1218'
    tolerance: 0.0001
    shown: ['\frac{1}{100\pi} \approx 0.1218$']
    source: {cite: mit, at: 'notes p. 7, eq. (2.11)'}
    origin: page-own

  - id: ex-closed-form
    where: 'example (a): 0.125 − 1/(100π)'
    inputs: {}
    formula: 0.125 - 1/(100*pi)
    expected: '0.1218'
    tolerance: 0.0001
    shown: ['within 3%']
    source: {cite: mit, at: 'notes p. 7'}
    origin: page-own

  - id: ex-lambda1
    where: 'example (b): 1239.8/√(2 × 511000 × 4.0) nm'
    inputs: {}
    formula: 1239.8/sqrt(2*511000*4.0)
    expected: '0.613'
    tolerance: 0.0005
    shown: ['\approx 0.613$ nm']
    source: {cite: mit, at: 'notes p. 4, eq. (2.3)'}
    origin: page-own

  - id: ex-lambda2
    where: 'example (b): 1239.8/√(2 × 511000 × 1.0) nm'
    inputs: {}
    formula: 1239.8/sqrt(2*511000*1.0)
    expected: '1.23'
    tolerance: 0.005
    shown: ['$\approx 1.23$ nm']
    source: {cite: mit, at: 'notes p. 4, eq. (2.3)'}
    origin: page-own

  - id: ex-amplitude
    where: 'example (b) and quiz 2: amplitude ratio √(λ2/λ1) = (4/1)^(1/4)'
    inputs: {}
    formula: (4.0/1.0)**0.25
    expected: '1.41'
    tolerance: 0.005
    shown: ['$\sqrt2 \approx 1.41$ times larger']
    source: {cite: mit, at: 'notes p. 6, eq. (2.8)'}
    origin: page-own
