# Calculations on content/year-2/8.04/simplest-quantum-system-spin.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) Lecture 24, transcripts of the video segments "The simplest quantum system"
# (reading1), "Hamiltonian and emerging spin angular momentum" (reading2) and "Eigenstates of the Hamiltonian" (reading3),
# with the page's own worked example (the state 3/5 up + 4/5 down).
# The harness has no complex numbers: matrix products are checked entry by entry, with i² = −1 written out.

page: content/year-2/8.04/simplest-quantum-system-spin.mdx
calcs:
  # ---------------------------------------------------------------- Pauli algebra
  - id: sigma1-sigma2
    where: 'σ1σ2: (0,1;1,0)(0,−i;i,0) = (i, 0; 0, −i), imaginary parts only: top-left 0·0 + 1·1 = 1, bottom-right 1·(−1) + 0·0 = −1; their difference (the 2 of [σ1, σ2] = 2iσ3)'
    inputs: {}
    formula: (0*0 + 1*1) - (1*(-1) + 0*0)
    expected: '2'
    tolerance: 1e-12
    shown: ['$\sigma_1\sigma_2 = \begin{pmatrix}i & 0\\ 0 & -i\end{pmatrix} = i\sigma_3$']
    source: {cite: reading2, at: 'transcript p. 3, board'}
    origin: mit

  - id: commutator-factor
    kind: identity
    where: '[S_x, S_y] = (ħ/2)² · 2iσ3 = iħ (ħ/2)σ3 = iħ S_z: the factors (ħ/2)²·2 and ħ·(ħ/2) agree'
    formula: (hb/2)**2*2
    equals: hb*(hb/2)
    samples: {hb: [1.0, 0.37]}
    tolerance: 1e-12
    shown: ['= i\hbar\,S_z']
    source: {cite: reading2, at: 'transcript p. 3, board'}
    origin: mit

  - id: sy-eigen
    where: 'S_y on (1, i): first entry −i·i = −i² = 1 (i² = −1 written out), second entry i·1 = i: eigenvalue +ħ/2'
    inputs: {}
    formula: -(-1)
    expected: '1'
    tolerance: 1e-12
    shown: ['\frac{\hbar}{2}(-i \cdot i, i) = \frac{\hbar}{2}(1, i)']
    source: {cite: reading3, at: 'transcript p. 3, board'}
    origin: mit

  - id: norm-x
    where: 'normalization of (up ± down)/√2'
    inputs: {}
    formula: (1/sqrt(2))**2 + (1/sqrt(2))**2
    expected: '1'
    tolerance: 1e-12
    shown: ['\frac{1}{\sqrt2}\left(|{\uparrow}\rangle \pm |{\downarrow}\rangle\right)']
    source: {cite: reading3, at: 'transcript p. 2, board'}
    origin: mit

  # ---------------------------------------------------------------- worked example
  - id: ex-norm
    where: 'example (a): 9/25 + 16/25'
    inputs: {}
    formula: (3/5)**2 + (4/5)**2
    expected: '1'
    tolerance: 1e-12
    shown: ['\frac{9}{25} + \frac{16}{25} = 1']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: page-own

  - id: ex-pz
    where: 'example (b): probabilities 0.36 and 0.64'
    inputs: {}
    formula: (3/5)**2
    expected: '0.36'
    shown: ['The probabilities are $0.36$ and $0.64$']
    source: {cite: reading3, at: 'transcript p. 1'}
    origin: page-own

  - id: ex-sz
    where: 'example (b): <S_z> in units of ħ'
    inputs: {}
    formula: (0.36 - 0.64)/2
    expected: '-0.14'
    shown: ['= -0.14\,\hbar$']
    source: {cite: reading3, at: 'transcript p. 1'}
    origin: page-own

  - id: ex-px
    where: 'example (c): |(3/5 + 4/5)/√2|² = 49/50'
    inputs: {}
    formula: ((3/5 + 4/5)/sqrt(2))**2
    expected: '0.98'
    shown: ['\frac{49}{50} = 0.98']
    source: {cite: reading3, at: 'transcript p. 2'}
    origin: page-own

  - id: ex-px-minus
    where: 'example (c): |(3/5 − 4/5)/√2|² = 1/50'
    inputs: {}
    formula: ((3/5 - 4/5)/sqrt(2))**2
    expected: '0.02'
    shown: ['\frac{1}{50} = 0.02']
    source: {cite: reading3, at: 'transcript p. 2'}
    origin: page-own

  - id: ex-sx
    where: 'example (c): <S_x> = (ħ/2)(0.98 − 0.02) = ħ·(3/5)(4/5)'
    inputs: {}
    formula: (3/5)*(4/5)
    expected: '0.48'
    shown: ['= 0.48\,\hbar$']
    source: {cite: reading3, at: 'transcript p. 2'}
    origin: page-own

  - id: ex-py
    where: 'example (d): |(3/5 − 4i/5)/√2|² = ((3/5)² + (4/5)²)/2'
    inputs: {}
    formula: ((3/5)**2 + (4/5)**2)/2
    expected: '0.5'
    shown: ['whose squared size is $\frac12$']
    source: {cite: reading3, at: 'transcript p. 3'}
    origin: page-own

  - id: ex-direction
    where: 'example (d): average spin (ħ/2)(0.96, 0, −0.28) has length ħ/2'
    inputs: {}
    formula: 0.96**2 + 0.28**2
    expected: '1'
    tolerance: 1e-12
    shown: ['$0.96^2 + 0.28^2 = 1$', '\frac{\hbar}{2}(0.96, 0, -0.28)']
    source: {cite: reading3, at: 'transcript p. 3'}
    origin: page-own

  # ---------------------------------------------------------------- quoted facts
  - id: line-21cm
    kind: fact
    where: 'cosmology callout: the hyperfine line of hydrogen, wavelength about 21 cm (1420.4 MHz)'
    shown: ['wavelength about 21 cm']
    source: {ref: 'The hydrogen hyperfine line, 1420.405751768 MHz (wavelength 21.1 cm); 8.05 Lecture 25 page hyperfine-21cm-adding-angular-momenta'}
    origin: later-data
