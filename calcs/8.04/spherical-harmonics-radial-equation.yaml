# Calculations on content/year-2/8.04/spherical-harmonics-radial-equation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes for Lectures 20–21, sections 3–4, with the page's own example.

page: content/year-2/8.04/spherical-harmonics-radial-equation.mdx
calcs:
  - id: Y00-norm
    where: '∫ dΩ |Y00|² = 4π/(4π)'
    inputs: {}
    formula: 4*pi/(4*pi)
    expected: '1'
    tolerance: 1e-12
    shown: ['Y_{00} = \frac{1}{\sqrt{4\pi}}']
    source: {cite: mit, at: 'notes p. 10, eq. (3.29)'}
    origin: mit

  - id: Y11-norm
    where: '∫ dΩ |Y1,1|² = (3/8π) 2π ∫ sin³θ dθ = 1'
    inputs: {}
    formula: '(3/(8*pi))*2*pi*integrate("sin(t)**3", "t", 0, pi)'
    expected: '1'
    tolerance: 1e-6
    shown: ['Y_{1,\pm1} = \mp\sqrt{\frac{3}{8\pi}}']
    source: {cite: mit, at: 'notes p. 10, eq. (3.30)'}
    origin: mit

  - id: ex-Y10-norm
    where: 'example (b): (3/4π) 2π ∫ cos²θ sinθ dθ'
    inputs: {}
    formula: '(3/(4*pi))*2*pi*integrate("cos(t)**2*sin(t)", "t", 0, pi)'
    expected: '1'
    tolerance: 1e-6
    shown: ['\times 2\pi \times \frac23 = 1$']
    source: {cite: mit, at: 'notes p. 10, eqs. (3.31)–(3.33)'}
    origin: page-own

  - id: ex-P21
    kind: identity
    where: 'example (a): √(1 − x²) d/dx (3x² − 1)/2 = 3x√(1 − x²), with x = cos θ: 3 cos θ sin θ'
    formula: sqrt(1 - cos(t)**2)*3*cos(t)
    equals: 3*cos(t)*sin(t)
    samples: {t: [0.3, 1.2, 2.5]}
    tolerance: 1e-12
    shown: ['= 3\cos\theta\sin\theta$']
    source: {cite: mit, at: 'notes p. 9, eq. (3.24)'}
    origin: page-own

  - id: ex-centrifugal
    where: 'example (c): 197.33² × 2 / (2 × 511000 × 0.010) eV'
    inputs: {}
    formula: 197.33**2*2/(2*511000*0.010)
    expected: '7.6'
    tolerance: 0.05
    shown: ['\approx 7.6$ eV']
    source: {cite: mit, at: 'notes p. 11, eq. (4.7)'}
    origin: page-own

  - id: ex-exponents
    kind: identity
    where: 'example (d): s(s − 1) = l(l + 1) for s = l + 1 and s = −l'
    formula: (l + 1)*l + (-l)*(-l - 1)
    equals: 2*l*(l + 1)
    samples: {l: [0, 1, 2, 5]}
    tolerance: 1e-12
    shown: ['For $s = 3$: $3 \times 2 = 6 = 2 \times 3$']
    source: {cite: mit, at: 'notes p. 11, eq. (4.13)'}
    origin: page-own

  - id: count-m
    where: 'quiz 1: 2 × 3 + 1'
    inputs: {}
    formula: 2*3 + 1
    expected: '7'
    tolerance: 1e-12
    shown: ['there are $2l + 1 = 7$ values']
    source: {cite: mit, at: 'notes p. 9, eq. (3.25)'}
    origin: page-own
