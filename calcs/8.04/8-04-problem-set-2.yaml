# Calculations on content/year-2/8.04/8-04-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# SI values of h, m_e, c and the electronvolt for the two wavelength constants, numerical solves for the Lorentz
# factors of Problem 1(d), the minimum of the energy of the atom for the Bohr radius, the amplitudes r and t and
# conservation of probability for the bomb tester, a long partial sum for the geometric series, and the real and
# imaginary parts of the shifted wave for Problem 5.

page: content/year-2/8.04/8-04-problem-set-2.mdx
calcs:
  # ---- Introduction: constants

  - id: intro-points
    where: 'Frontmatter and exercises: the points of the five problems'
    formula: 20 + 10 + 10 + 15 + 10
    expected: '65'
    shown: ['points={20} mit="Problem 1"', 'points={10} mit="Problem 2"', 'points={10} mit="Problem 3"', 'points={15} mit="Problem 4"', 'points={10} mit="Problem 5"']
    source: {cite: mit, at: 'pp. 1–4 (points per problem)'}
    origin: mit

  - id: const-hbarc
    kind: fact
    where: 'How to answer: ħc (CODATA 2018: 197.3269804 MeV fm)'
    value: '197.327 MeV fm'
    shown: ['$\hbar c = 197.327$ MeV fm']
    source: {ref: 'CODATA 2018 recommended values (NIST)'}
    origin: later-data

  - id: const-hc
    where: 'How to answer: hc = 2π ħc in MeV fm'
    formula: 2 * pi * 197.3269804
    expected: '1239.84'
    shown: ['$hc = 2\pi\hbar c = 1239.84$ MeV fm']
    source: {cite: reading1, at: 'notes p. 2, eq. (1.3) (ħc; our own value of hc)'}
    origin: page-own

  - id: const-hc-ev-angstrom
    where: 'How to answer: hc in eV Å (1 MeV fm = 10 eV Å)'
    formula: 2 * pi * 197.3269804 * 10
    expected: '12398.4'
    shown: ['$= 12{,}398.4$ eV Å']
    source: {cite: reading1, at: 'notes p. 2, eq. (1.3) (our own conversion)'}
    origin: page-own

  - id: const-me
    kind: fact
    where: 'How to answer: electron rest energy (CODATA 2018: 0.51099895 MeV)'
    value: '0.510999 MeV'
    shown: ['$m_ec^2 = 0.510999$ MeV']
    source: {ref: 'CODATA 2018 recommended values (NIST)'}
    origin: later-data

  - id: const-mp
    kind: fact
    where: 'How to answer: proton rest energy (CODATA 2018: 938.27208816 MeV)'
    value: '938.272 MeV'
    shown: ['$m_pc^2 = 938.272$ MeV']
    source: {ref: 'CODATA 2018 recommended values (NIST)'}
    origin: later-data

  - id: const-alpha
    kind: fact
    where: 'How to answer: inverse fine-structure constant (CODATA 2018: 137.035999084)'
    value: '137.036'
    shown: ['$\alpha = 1/137.036$']
    source: {ref: 'CODATA 2018 recommended values (NIST)'}
    origin: later-data

  # ---- Problem 1: de Broglie wavelength

  - id: p1-two-me
    where: 'Problem 1(a): 2 m_e c² in eV'
    formula: 2 * 510999
    expected: '1021998'
    shown: ['$2m_ec^2 = 1{,}021{,}998$ eV']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-root
    where: 'Problem 1(a): the square root of 2 m_e c² in eV'
    formula: sqrt(2 * 510999)
    expected: '1010.9'
    shown: ['whose square root is $1010.9$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-delta
    answer: p1-delta
    where: 'Problem 1(a), answer box: δ = hc/√(2 m_e c²), with hc in eV Å and the rest energy in eV'
    formula: 12398.4 / sqrt(2 * 510999)
    expected: '12.26'
    shown: ['id="p1-delta"', '\delta = \frac{12{,}398.4}{1010.9} = 12.26']
    source: {cite: reading1, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  # Independent route: SI values (h and the electronvolt exact, m_e CODATA 2018), wavelength of a 1 eV electron in Å.
  - id: p1-delta-si
    where: 'Problem 1(a), check: the same δ from SI values of h, m_e and the electronvolt'
    formula: 6.62607015e-34 / sqrt(2 * 9.1093837015e-31 * 1.602176634e-19) / 1e-10
    expected: '12.26'
    shown: ['A second route, with SI values of $h$, $m_e$ and the electronvolt, gives the same $\delta$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own check)'}
    origin: page-own

  - id: p1-100ev
    where: 'Problem 1(a), check: a 100 eV electron, in Å'
    formula: 12398.4 / sqrt(2 * 510999 * 100)
    expected: '1.226'
    shown: ['$\lambda_{\text{nr}} = 12.26/\sqrt{100} = 1.226$ Å $= 0.1226$ nm']
    source: {cite: reading1, at: 'notes p. 6, eq. (3.23) (the lesson''s worked example has 0.123 nm)'}
    origin: page-own

  - id: p1-ell
    answer: p1-ell
    where: 'Problem 1(b), answer box: ℓ = hc/(m_e c²) in fm'
    formula: 1239.84 / 0.510999
    expected: '2426'
    shown: ['id="p1-ell"', '= 2426\ \text{fm}"']
    source: {cite: reading1, at: 'notes p. 3, eq. (1.10)'}
    origin: page-own

  # Independent route: h/(m_e c) in SI, converted to fm.
  - id: p1-ell-si
    where: 'Problem 1(b), check: h/(m_e c) from SI values, in fm; the lesson quotes 0.002426 nm'
    formula: 6.62607015e-34 / (9.1093837015e-31 * 299792458) / 1e-15
    expected: '2426'
    shown: ['The lesson quotes $\lambda_C = 0.002426$ nm for the electron, and 0.002426 nm is 2426 fm.']
    source: {cite: reading1, at: 'notes p. 3, eq. (1.12)'}
    origin: page-own

  # The relativistic formula against a direct computation: an electron of speed b (in units of c) has
  # p = g m b, so lambda = h/p = l/(g b).
  - id: p1-rel-formula
    kind: identity
    where: 'Problem 1(b), formula: ℓ/√(γ² − 1) against h/p with p = γ m v'
    formula: l / sqrt((1/sqrt(1 - b**2))**2 - 1)
    equals: l / ((1/sqrt(1 - b**2)) * b)
    samples:
      l: [1, 2, 3, 1.5, 2.5]
      b: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-9
    shown: ['<Formula label="The length in the formula"']
    source: {cite: reading1, at: 'notes p. 3, eq. (2.13) and p. 4, eq. (2.14)'}
    origin: page-own

  # Independent route for the box: the slow formula h/sqrt(2 m K) written with the speed b:
  # h = l m c and K = (g - 1) m c^2, for any mass m and speed of light c.
  - id: p1-nr
    kind: identity
    answer: p1-nr
    where: 'Problem 1(c), answer box: against h/√(2mK) with h = ℓmc and K = (γ − 1)mc²'
    formula: l / sqrt(2 * (g - 1))
    equals: (l * m * c) / sqrt(2 * m * ((g - 1) * m * c**2))
    samples:
      l: [1, 2, 3, 1.5, 2.5]
      g: [1.005, 1.42, 2, 3.5, 7.1]
      m: [0.5, 1, 2, 1.5, 3]
      c: [1, 2, 0.7, 3, 1.3]
    tolerance: 1e-9
    shown: ['id="p1-nr"', '<Formula label="Ratio of the two wavelengths"']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  # The slow limit: at 1% of the speed of light the two formulas agree to better than 1e-4.
  - id: p1-slow-limit
    where: 'Problem 1(c), check: the ratio of the two wavelengths at v = 0.01c'
    inputs: {b: 0.01}
    formula: sqrt((1/sqrt(1 - b**2) + 1) / 2)
    expected: '1.0000'
    shown: ['For a slow electron $\gamma \to 1$, the ratio goes to 1']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own check)'}
    origin: page-own

  - id: p1-e
    answer: p1-e
    where: 'Problem 1(d)(i), answer box: total energy √2 m_e c² in MeV'
    formula: sqrt(2) * 0.510999
    expected: '0.7227'
    shown: ['id="p1-e"', '= 0.7227\ \text{MeV}']
    source: {cite: mit, at: 'Problem 1(d)(i), p. 1 (our own solution)'}
    origin: page-own

  # Independent route: solve 1/sqrt(g^2 - 1) = 1 numerically.
  - id: p1-e-solve
    where: 'Problem 1(d)(i), check: the Lorentz factor from a numerical solve of λ_r = ℓ'
    formula: solve('1/sqrt(g**2 - 1) - 1', 'g', 1.01, 3)
    expected: '1.4142'
    shown: ['E = \sqrt 2\,m_ec^2 = 1.4142 \times 0.510999\ \text{MeV}']
    source: {cite: mit, at: 'Problem 1(d)(i), p. 1 (our own check)'}
    origin: page-own

  - id: p1-beta1
    answer: p1-beta1
    where: 'Problem 1(d)(i), answer box: the speed for γ = √2'
    formula: sqrt(1 - 1/sqrt(2)**2)
    expected: '0.7071'
    shown: ['id="p1-beta1"', '\frac{1}{\sqrt 2} = 0.7071']
    source: {cite: mit, at: 'Problem 1(d)(i), p. 1 (our own solution)'}
    origin: page-own

  # Independent route: p = m c, so beta = pc/E = 1/sqrt(1 + 1).
  - id: p1-beta1-pe
    where: 'Problem 1(d)(i), check: the speed as pc/E for p = m_e c'
    formula: 1 / sqrt(1**2 + 1**2)
    expected: '0.71'
    shown: ['It moves at 71% of the speed of light']
    source: {cite: reading1, at: 'notes p. 3, eq. (2.13)'}
    origin: page-own

  - id: p1-kin1
    where: 'Problem 1(d)(i): the kinetic energy in MeV'
    formula: (sqrt(2) - 1) * 0.510999
    expected: '0.2117'
    shown: ['$(\sqrt 2 - 1)\,m_ec^2 = 0.2117$ MeV']
    source: {cite: mit, at: 'Problem 1(d)(i), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-given-colliders
    kind: fact
    where: 'Problem 1(d)(ii), statement: the two energies'
    shown: ['electrons to an energy of 1 TeV $= 1000$ GeV', 'protons of 7 TeV']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1'}
    origin: mit

  - id: p1-gamma-e
    where: 'Problem 1(d)(ii): the Lorentz factor of a 1 TeV electron, in units of 10^6'
    formula: 1e6 / 0.510999 / 1e6
    expected: '1.957'
    shown: ['= 1.957 \times 10^{6}$']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-gamma-e-figures
    where: 'Problem 1(d)(ii): 1 − √(γ² − 1)/γ is about 1/(2γ²) for the electron, in units of 10^-13'
    formula: 1 / (2 * (1e6 / 0.510999)**2) / 1e-13
    expected: '1.3'
    shown: ['equals $\gamma$ to 13 figures']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-gamma-p
    where: 'Problem 1(d)(ii): the Lorentz factor of a 7 TeV proton'
    formula: 7e6 / 938.272
    expected: '7460'
    tolerance: 1
    shown: ['$\gamma = 7 \times 10^{6}/938.272 = 7460$']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-gamma-p-figures
    where: 'Problem 1(d)(ii): 1/(2γ²) for the proton, in units of 10^-7 (below 1)'
    formula: 1 / (2 * (7e6 / 938.272)**2) / 1e-7
    expected: '0.09'
    shown: ['to better than one part in $10^{7}$']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own solution)'}
    origin: page-own

  # Both boxes are computed with the exact momentum, pc = sqrt(E^2 - m^2 c^4), not with pc = E.
  - id: p1-lam-e
    answer: p1-lam-e
    where: 'Problem 1(d)(ii), answer box: wavelength of a 1 TeV electron in am, with the exact momentum'
    formula: 1239.84 / sqrt(1e6**2 - 0.510999**2) * 1e3
    expected: '1.240'
    shown: ['id="p1-lam-e"', '= 1.240 \times 10^{-3}\ \text{fm} = 1.240\ \text{am}']
    source: {cite: reading1, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  - id: p1-lam-p
    answer: p1-lam-p
    where: 'Problem 1(d)(ii), answer box: wavelength of a 7 TeV proton in am, with the exact momentum'
    formula: 1239.84 / sqrt(7e6**2 - 938.272**2) * 1e3
    expected: '0.1771'
    shown: ['id="p1-lam-p"', '= 0.1771\ \text{am}"']
    source: {cite: reading1, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  # If 7 TeV were the kinetic energy the proton's wavelength would change in the fifth figure only.
  - id: p1-lam-p-kinetic
    where: 'Problem 1(d)(ii), check: the proton wavelength in am if 7 TeV is the kinetic energy'
    formula: 1239.84 / sqrt((7e6 + 938.272)**2 - 938.272**2) * 1e3
    expected: '0.1771'
    shown: ['it does not matter whether the quoted energy is the total or the kinetic one']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own check)'}
    origin: page-own

  - id: p1-lam-ratio
    where: 'Problem 1(d)(ii): ratio of the two wavelengths'
    formula: (1239.84 / sqrt(1e6**2 - 0.510999**2)) / (1239.84 / sqrt(7e6**2 - 938.272**2))
    expected: '7'
    tolerance: 0.001
    shown: ['the proton''s wavelength is 7 times shorter']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-proton-size
    where: 'Problem 1(d)(ii): 1 fm over the electron''s wavelength'
    formula: 1 / (1239.84 / 1e6)
    expected: '800'
    tolerance: 10
    shown: ['the electron''s by a factor of about 800']
    source: {cite: mit, at: 'Problem 1(d)(ii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-gmax
    where: 'Problem 1(d)(iii): the Lorentz factor at which the error is 10%'
    formula: 2 * 1.10**2 - 1
    expected: '1.42'
    shown: ['\gamma = 2 \times 1.10^2 - 1 = 1.42']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own solution)'}
    origin: page-own

  # Independent route: solve (lambda_nr - lambda_r)/lambda_r = 0.10 numerically from the two wavelength formulas.
  - id: p1-kmax
    answer: p1-kmax
    where: 'Problem 1(d)(iii), answer box: kinetic energy in keV, from a numerical solve of the two wavelength formulas'
    formula: (solve('(1/sqrt(2*(g - 1)) - 1/sqrt(g**2 - 1))/(1/sqrt(g**2 - 1)) - 0.10', 'g', 1.01, 3) - 1) * 510.999
    expected: '214.6'
    shown: ['id="p1-kmax"', 'E_{\text{kin}} = 0.42\,m_ec^2 = 0.2146\ \text{MeV} = 214.6\ \text{keV}']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-kmax-direct
    where: 'Problem 1(d)(iii): 0.42 m_e c² in MeV'
    formula: 0.42 * 0.510999
    expected: '0.2146'
    shown: ['= 0.2146\ \text{MeV}']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-beta3
    answer: p1-beta3
    where: 'Problem 1(d)(iii), answer box: the speed for γ = 1.42'
    formula: sqrt(1 - 1/1.42**2)
    expected: '0.7100'
    shown: ['id="p1-beta3"', '\beta = \sqrt{1 - \frac{1}{1.42^2}} = 0.7100']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own solution)'}
    origin: page-own

  # Independent route for the speed: beta = pc/E = sqrt(g^2 - 1)/g with g from the numerical solve.
  - id: p1-beta3-solve
    where: 'Problem 1(d)(iii), check: the speed as pc/E with γ from the numerical solve'
    formula: sqrt(solve('sqrt((g + 1)/2) - 1.10', 'g', 1, 3)**2 - 1) / solve('sqrt((g + 1)/2) - 1.10', 'g', 1, 3)
    expected: '0.7100'
    shown: ['even at 71% of the speed of light']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own check)'}
    origin: page-own

  - id: p1-check-nr
    where: 'Problem 1(d)(iii), check: λ_nr/ℓ at γ = 1.42'
    formula: 1 / sqrt(2 * 0.42)
    expected: '1.0911'
    shown: ['$\lambda_{\text{nr}}/\ell = 1/\sqrt{0.84} = 1.0911$']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own check)'}
    origin: page-own

  - id: p1-check-r
    where: 'Problem 1(d)(iii), check: λ_r/ℓ at γ = 1.42'
    formula: 1 / sqrt(1.42**2 - 1)
    expected: '0.9919'
    shown: ['$\lambda_{\text{r}}/\ell = 1/\sqrt{1.42^2 - 1} = 0.9919$']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own check)'}
    origin: page-own

  - id: p1-check-ratio
    where: 'Problem 1(d)(iii), check: the ratio of the two'
    formula: (1 / sqrt(2 * 0.42)) / (1 / sqrt(1.42**2 - 1))
    expected: '1.100'
    shown: ['with ratio $1.100$']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own check)'}
    origin: page-own

  - id: p1-other-gamma
    where: 'Problem 1(d)(iii), check: the Lorentz factor if the error is taken as a fraction of λ_nr'
    formula: 2 / 0.81 - 1
    expected: '1.469'
    shown: ['$\gamma = 2/0.81 - 1 = 1.469$']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own check)'}
    origin: page-own

  - id: p1-other-k
    where: 'Problem 1(d)(iii), check: the kinetic energy in keV for that other definition'
    formula: (2 / 0.81 - 1 - 1) * 510.999
    expected: '239.7'
    shown: ['and 239.7 keV']
    source: {cite: mit, at: 'Problem 1(d)(iii), p. 1 (our own check)'}
    origin: page-own

  # ---- Problem 2: three lengths

  # Independent route: the Bohr radius as the radius that minimises the energy hbar^2/(2 m s^2) - e2/s
  # (kinetic energy of an electron confined to a size s plus its potential energy): the derivative vanishes there.
  - id: p2-a0
    kind: identity
    answer: p2-a0
    where: 'Problem 2(a), answer box: against the radius at which d/ds [ħ²/(2 m s²) − e²/s] = 0, solved numerically'
    formula: hbar**2 / (m * e2)
    equals: solve('-hbar**2/(m*s**3) + e2/s**2', 's', 0.05, 10)
    samples:
      hbar: [1, 1.2, 1.5, 1.8, 2]
      m: [1, 3, 2, 1.5, 2.5]
      e2: [1, 2, 1.5, 1.2, 1.8]
    tolerance: 1e-7
    shown: ['id="p2-a0"', '<Formula label="Bohr radius"']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-a0-fm
    answer: p2-a0-fm
    where: 'Problem 2(a), answer box: a0 = ħc/(α m_e c²) in fm'
    formula: 197.327 * 137.036 / 0.510999
    expected: '52918'
    shown: ['id="p2-a0-fm"', '= 52{,}918\ \text{fm}"']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own solution)'}
    origin: page-own

  # Independent route: 4 pi eps0 hbar^2/(m e^2) in SI (CODATA 2018 values), in fm.
  - id: p2-a0-si
    where: 'Problem 2(a), check: the Bohr radius from SI values, in Å'
    formula: 4 * pi * 8.8541878128e-12 * (1.054571817e-34)**2 / (9.1093837015e-31 * (1.602176634e-19)**2) / 1e-10
    expected: '0.529'
    shown: ['52,918 fm is 0.529 Å']
    source: {cite: mit, at: 'Problem 2(a), p. 2 (our own check)'}
    origin: page-own

  - id: p2-lc
    answer: p2-lc
    where: 'Problem 2(b), answer box: the reduced Compton wavelength α a0 in fm'
    formula: (197.327 * 137.036 / 0.510999) / 137.036
    expected: '386.2'
    shown: ['id="p2-lc"', '\bar\lambda_C = \frac{52{,}918\ \text{fm}}{137.036} = 386.2\ \text{fm}']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # Independent route: hbar/(m_e c) in SI, in fm.
  - id: p2-lc-si
    where: 'Problem 2(b), check: ħ/(m_e c) from SI values, in fm'
    formula: 1.054571817e-34 / (9.1093837015e-31 * 299792458) / 1e-15
    expected: '386.2'
    shown: ['$\bar\lambda_C = \hbar c/(m_ec^2) = 197.327/0.510999 = 386.2$ fm']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own check)'}
    origin: page-own

  - id: p2-r0
    answer: p2-r0
    where: 'Problem 2(b), answer box: the classical electron radius α² a0 in fm'
    formula: 197.327 / 0.510999 / 137.036
    expected: '2.818'
    shown: ['id="p2-r0"', 'r_0 = \frac{386.2\ \text{fm}}{137.036} = 2.818\ \text{fm}']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # Independent route: e^2/(4 pi eps0 m c^2) in SI, in fm.
  - id: p2-r0-si
    where: 'Problem 2(b), check: the classical electron radius from SI values, in fm'
    formula: (1.602176634e-19)**2 / (4 * pi * 8.8541878128e-12 * 9.1093837015e-31 * 299792458**2) / 1e-15
    expected: '2.818'
    shown: ['<Formula label="The two smaller lengths"']
    source: {cite: mit, at: 'Problem 2, p. 2 (our own check)'}
    origin: page-own

  - id: p2-two-pi
    where: 'Problem 2(b), check: 2π times the reduced Compton wavelength, in fm'
    formula: 2 * pi * 386.16
    expected: '2426'
    shown: ['$2\pi \times 386.16$ fm $= 2426$ fm']
    source: {cite: reading1, at: 'notes p. 3, eq. (1.10)'}
    origin: page-own

  # ---- Problem 3: unitarity

  # The lesson's first guess, the matrix [[1,1],[1,1]]/sqrt2, sends (1, 1)/sqrt2 to a column whose
  # probabilities add up to 2, so it is not unitary.
  - id: p3-first-guess
    where: 'Problem 3(b), check: the lesson''s first guess sends (1, 1)/√2 to a column of total probability 2'
    formula: ((1/sqrt(2)) * (1/sqrt(2) + 1/sqrt(2)))**2 + ((1/sqrt(2)) * (1/sqrt(2) + 1/sqrt(2)))**2
    expected: '2'
    tolerance: 1e-9
    shown: ['to a column of total probability 2']
    source: {cite: reading2, at: 'notes p. 3, eqs. (1.12)–(1.13)'}
    origin: mit

  - id: p3-balanced
    where: 'Problem 3(b), check: the balanced beam splitter squared, diagonal and off-diagonal entries'
    formula: (1/sqrt(2))**2 * (1*1 + 1*1) + (1/sqrt(2))**2 * (1*1 + 1*(-1))
    expected: '1'
    tolerance: 1e-9
    shown: ['and its square is $\frac12\begin{pmatrix} 2 & 0 \\ 0 & 2 \end{pmatrix} = \mathbf{1}$']
    source: {cite: reading2, at: 'notes p. 3, eq. (1.14)'}
    origin: page-own

  # ---- Problem 4: the unbalanced beam splitter

  # Unitarity of U = [[r, t], [t, -r]] with r = sqrt(R), t = sqrt(1 - R): the diagonal entry of U^T U is 1
  # and the off-diagonal entry is 0 (added here, so the identity is "1 + 0 = 1").
  - id: p4-unitary
    kind: identity
    where: 'Problem 4(a), formula: UᵀU has diagonal entries r² + t² = 1 and off-diagonal entries rt − tr = 0'
    formula: (sqrt(R)*sqrt(R) + sqrt(1 - R)*sqrt(1 - R)) + (sqrt(R)*sqrt(1 - R) + sqrt(1 - R)*(-sqrt(R)))
    equals: 1 + 0*R
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['<Formula label="The unbalanced beam splitter"']
    source: {cite: mit, at: 'Problem 4(a), p. 3 (our own solution)'}
    origin: page-own

  # Defective bomb: the output U U (1, 0), entry by entry, with the amplitudes r and t.
  - id: p4-defect
    kind: identity
    where: 'Problem 4(b), defective bomb: P0 − P1 from the amplitudes equals 1 (P0 = 1, P1 = 0)'
    formula: (sqrt(R)*sqrt(R) + sqrt(1 - R)*sqrt(1 - R))**2 - (sqrt(1 - R)*sqrt(R) - sqrt(R)*sqrt(1 - R))**2
    equals: 1 + 0*R
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['<Formula label="Output with a defective bomb"']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own solution)'}
    origin: page-own

  # Working bomb, each box against the amplitudes r = sqrt(R), t = sqrt(1 - R) of the path it belongs to.
  - id: p4-boom
    kind: identity
    answer: p4-boom
    where: 'Problem 4(b), answer box: explosion = the squared amplitude t in the lower branch'
    formula: 1 - R
    equals: sqrt(1 - R)**2
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['id="p4-boom"', '<Formula label="Chance of an explosion"']
    source: {cite: reading2, at: 'notes p. 7, table (2.25)'}
    origin: page-own

  - id: p4-p0
    kind: identity
    answer: p4-p0
    where: 'Problem 4(b), answer box: P0 against conservation of probability, 1 − P_boom − P1 with P1 = (r t)²'
    formula: R**2
    equals: 1 - sqrt(1 - R)**2 - (sqrt(R)*sqrt(1 - R))**2
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['id="p4-p0"', '$T + R^2 + RT = T + R\,(R + T) = T + R = 1$']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-p1
    kind: identity
    answer: p4-p1
    where: 'Problem 4(b), answer box: P1 = (amplitude r at the first plate × amplitude t at the second)²'
    formula: R * (1 - R)
    equals: (sqrt(R) * sqrt(1 - R))**2
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['id="p4-p1"', '<Formula label="Output with a working bomb"']
    source: {cite: mit, at: 'Problem 4(b), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-balanced
    where: 'Problem 4(b), check: P1 for R = 1/2, as in the lesson''s table'
    inputs: {R: 0.5}
    formula: R * (1 - R)
    expected: '0.25'
    shown: ['For $R = \tfrac12$ they are $\tfrac12$, $\tfrac14$ and $\tfrac14$']
    source: {cite: reading2, at: 'notes p. 7, table (2.25)'}
    origin: mit

  # Independent route: a long partial sum of the geometric series (400 photons), not its closed form.
  - id: p4-f
    kind: identity
    answer: p4-f
    where: 'Problem 4(c), answer box: against the partial sum P1 (1 + P0 + … + P0^399) with P0 = R², P1 = R(1 − R)'
    formula: R / (1 + R)
    equals: R * (1 - R) * (1 - (R**2)**400) / (1 - R**2)
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-9
    shown: ['id="p4-f"', '<Formula label="Fraction of working bombs certified"']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-f-ratio
    kind: identity
    where: 'Problem 4(c), second route: f = P1/(P1 + P_boom)'
    formula: R / (1 + R)
    equals: R * (1 - R) / (R * (1 - R) + (1 - R))
    samples:
      R: [0.1, 0.3, 0.5, 0.7, 0.9]
    tolerance: 1e-12
    shown: ['$f = P_1/(P_1 + P_{\text{boom}}) = RT/(RT + T)$']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-fmax
    answer: p4-fmax
    where: 'Problem 4(c), answer box: the limit of f for R → 1'
    inputs: {R: 1}
    formula: R / (1 + R)
    expected: '0.5'
    shown: ['id="p4-fmax"', 'so $f$ stays below $\tfrac12$']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p4-f-half
    where: 'Problem 4(c), check: the balanced beam splitter'
    inputs: {R: 0.5}
    formula: R / (1 + R)
    expected: '0.333'
    shown: ['$R = \tfrac12$ gives $f = \tfrac13$']
    source: {cite: reading2, at: 'notes p. 7, tables (2.24)–(2.25) (the lesson''s worked example)'}
    origin: page-own

  - id: p4-f-09
    where: 'Problem 4(c), check: R = 0.9'
    inputs: {R: 0.9}
    formula: R / (1 + R)
    expected: '0.474'
    shown: ['With $R = 0.9$, $f = 0.9/1.9 = 0.474$']
    source: {cite: mit, at: 'Problem 4(c), p. 3 (our own check)'}
    origin: page-own

  # ---- Problem 5: plane waves

  # The expansion of the shifted wave, for a real trial constant g.
  - id: p5-expansion
    kind: identity
    where: 'Problem 5(a), formula: the shifted wave expanded with the addition formulas'
    formula: cos(p + e) + g * sin(p + e)
    equals: (cos(e) + g * sin(e)) * cos(p) + (g * cos(e) - sin(e)) * sin(p)
    samples:
      p: [0.3, 1.1, 2.0, -0.7, 4.0]
      e: [0.5, -1.2, 2.5, 0.9, 3.3]
      g: [0.4, -1.5, 2.0, 1.0, -0.3]
    tolerance: 1e-12
    shown: ['<Formula label="The shifted wave, expanded"']
    source: {cite: mit, at: 'Problem 5, p. 4 (our own solution)'}
    origin: page-own

  # Eliminating a: g (cos e + g sin e) = g cos e - sin e gives g^2 = -sin e / sin e.
  - id: p5-g2
    answer: p5-g2
    where: 'Problem 5(b), answer box: γ² from the two conditions with a removed, at a shift where sin ε is not zero'
    inputs: {e: 0.7}
    formula: -sin(e) / sin(e)
    expected: '-1'
    tolerance: 1e-12
    shown: ['id="p5-g2"', 'so $\gamma^2 = -1$']
    source: {cite: mit, at: 'Problem 5, p. 4 (our own solution)'}
    origin: page-own

  # Independent check of the solution g = i, a = e^(i e), by real and imaginary parts:
  # a (cos p + i sin p) has real part cos e cos p - sin e sin p and imaginary part sin e cos p + cos e sin p,
  # and the shifted wave cos(p + e) + i sin(p + e) has real part cos(p + e) and imaginary part sin(p + e).
  - id: p5-real-part
    kind: identity
    where: 'Problem 5(b), check: real part of e^(iε) e^(iφ) equals the real part of the shifted wave'
    formula: cos(e) * cos(p) - sin(e) * sin(p)
    equals: cos(p + e)
    samples:
      p: [0.3, 1.1, 2.0, -0.7, 4.0]
      e: [0.5, -1.2, 2.5, 0.9, 3.3]
    tolerance: 1e-12
    shown: ['$e^{i(\phi + \epsilon)} = e^{i\epsilon}e^{i\phi}$']
    source: {cite: mit, at: 'Problem 5, p. 4 (our own check)'}
    origin: page-own

  - id: p5-imaginary-part
    kind: identity
    where: 'Problem 5(b), check: imaginary part of e^(iε) e^(iφ) equals the imaginary part of the shifted wave'
    formula: sin(e) * cos(p) + cos(e) * sin(p)
    equals: sin(p + e)
    samples:
      p: [0.3, 1.1, 2.0, -0.7, 4.0]
      e: [0.5, -1.2, 2.5, 0.9, 3.3]
    tolerance: 1e-12
    shown: ['<Formula label="Solutions"']
    source: {cite: mit, at: 'Problem 5, p. 4 (our own check)'}
    origin: page-own

  # A real mixture fails: a pure cosine shifted by a quarter of a wavelength (e = -pi/2) is a sine.
  - id: p5-quarter
    kind: identity
    where: 'Problem 5(b), check: a cosine shifted by a quarter of a wavelength is a sine'
    formula: cos(p - pi/2)
    equals: sin(p)
    samples:
      p: [0.3, 1.1, 2.0, -0.7, 4.0]
    tolerance: 1e-12
    shown: ['a shift by a quarter of a wavelength turns a pure cosine into a sine']
    source: {cite: mit, at: 'Problem 5, p. 4 (our own check)'}
    origin: page-own
