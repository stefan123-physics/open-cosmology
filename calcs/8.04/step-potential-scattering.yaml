# Calculations on content/year-2/8.04/step-potential-scattering.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 16, with the page's own example.

page: content/year-2/8.04/step-potential-scattering.mdx
calcs:
  - id: r-plus-t
    kind: identity
    where: '((k − kb)/(k + kb))² + 4 k kb/(k + kb)² = 1'
    formula: ((k - b)/(k + b))**2 + 4*k*b/(k + b)**2
    equals: 1 + 0*k
    samples: {k: [1.0, 2.5, 0.7], b: [0.3, 2.0, 0.1]}
    tolerance: 1e-12
    shown: ['\qquad R + T = 1" cite']
    source: {cite: mit, at: 'notes p. 4, eq. (2.16)'}
    origin: mit

  - id: phase-identity
    kind: identity
    where: '(k − iκ)/(k + iκ) = −e^(2iδ), δ = atan(k/κ): real part check, (k² − κ²)/(k² + κ²) = −cos 2δ'
    formula: (k**2 - q**2)/(k**2 + q**2)
    equals: -cos(2*atan(k/q))
    samples: {k: [1.0, 0.4, 2.0], q: [0.5, 1.3, 2.0]}
    tolerance: 1e-12
    shown: ['= -e^{2i\delta(E)}, \qquad']
    source: {cite: mit, at: 'notes p. 5, eqs. (3.20)–(3.22)'}
    origin: mit

  - id: phase-derivative
    kind: identity
    where: 'd/dE atan(√(E/(V − E))) = 1/(2√(E(V − E))) (numerical, V = 4)'
    formula: (atan(sqrt((E + 1e-6)/(4 - E - 1e-6))) - atan(sqrt((E - 1e-6)/(4 - E + 1e-6))))/2e-6
    equals: 1/(2*sqrt(E*(4 - E)))
    samples: {E: [0.5, 2.0, 3.3]}
    tolerance: 1e-6
    shown: ['\frac{1}{2\sqrt{E\left(V_0 - E\right)}}']
    source: {cite: mit, at: 'notes p. 6, eq. (3.25)'}
    origin: mit

  - id: ex-ratio
    where: 'example (a) and quiz 2: √(1 − 4/5)'
    inputs: {}
    formula: sqrt(1 - 4.0/5.0)
    expected: '0.447'
    tolerance: 0.0005
    shown: ['$\bar k/k = \sqrt{(E - V_0)/E} = \sqrt{0.2} \approx 0.447$']
    source: {cite: mit, at: 'notes p. 2, eq. (2.4)'}
    origin: page-own

  - id: ex-R
    where: 'example (a): ((1 − √0.2)/(1 + √0.2))²'
    inputs: {}
    formula: ((1 - sqrt(0.2))/(1 + sqrt(0.2)))**2
    expected: '0.146'
    tolerance: 0.0005
    shown: ['\right)^2 \approx 0.146$ and']
    source: {cite: mit, at: 'notes p. 4, eq. (2.14)'}
    origin: page-own

  - id: ex-T
    where: 'example (a): 4√0.2/(1 + √0.2)²'
    inputs: {}
    formula: 4*sqrt(0.2)/(1 + sqrt(0.2))**2
    expected: '0.854'
    tolerance: 0.0005
    shown: ['\approx 0.854$; they add up to 1']
    source: {cite: mit, at: 'notes p. 4, eq. (2.15)'}
    origin: page-own

  - id: ex-delta
    where: 'example (b): atan(√(2/2)) = π/4'
    inputs: {}
    formula: atan(sqrt(2.0/2.0))
    expected: '0.7854'
    tolerance: 0.0001
    shown: ['$\delta = \tan^{-1}\sqrt{2/2} = \pi/4$']
    source: {cite: mit, at: 'notes p. 5, eq. (3.22)'}
    origin: page-own

  - id: ex-kappa
    where: 'example (b): √(2 × 511000 × 2.0)/197.33 per nm'
    inputs: {}
    formula: sqrt(2*511000*2.0)/197.33
    expected: '7.25'
    tolerance: 0.005
    shown: ['\approx 7.25\ \text{nm}^{-1}$']
    source: {cite: mit, at: 'notes p. 5, eq. (3.18)'}
    origin: page-own

  - id: ex-depth
    where: 'example (b): 1/κ nm'
    inputs: {}
    formula: 197.33/sqrt(2*511000*2.0)
    expected: '0.138'
    tolerance: 0.0005
    shown: ['$1/\kappa \approx 0.138$ nm']
    source: {cite: mit, at: 'notes p. 10, eq. (4.41)'}
    origin: page-own

  - id: ex-delay
    where: 'example (b): ħ/√(E(V0 − E)) = 6.582e-16/2.0 s'
    inputs: {}
    formula: 6.582e-16/sqrt(2.0*(4.0 - 2.0))
    expected: '3.3e-16'
    tolerance: 0.05e-16
    shown: ['\approx 3.3 \times 10^{-16}$ s']
    source: {cite: mit, at: 'notes p. 9, eq. (4.40)'}
    origin: page-own
