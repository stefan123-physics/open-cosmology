# Calculations on content/year-2/8.04/hydrogen-spectrum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes "Hydrogen Atom" (Lectures 21–22), section 2, with the page's own example.

page: content/year-2/8.04/hydrogen-spectrum.mdx
calcs:
  - id: degeneracy
    kind: identity
    where: 'Σ_{l=0}^{n−1}(2l + 1) = (n − 1)n + n = n² (closed form)'
    formula: (n - 1)*n + n
    equals: n**2
    samples: {n: [1, 2, 3, 7]}
    tolerance: 1e-12
    shown: ['= \frac{2(n - 1)n}{2} + n = n^2']
    source: {cite: mit, at: 'notes p. 8, eq. (2.32)'}
    origin: mit

  - id: ground-norm
    where: '∫ |ψ100|² d³x = (4π/πa0³) ∫ r² e^{−2r/a0} dr = 1 (a0 = 1)'
    inputs: {}
    formula: '4*integrate("r**2*exp(-2*r)", "r", 0, 60)'
    expected: '1'
    tolerance: 1e-6
    shown: ['\frac{1}{\sqrt{\pi a_0^3}}\,e^{-r/a_0}']
    source: {cite: mit, at: 'notes p. 10, eq. (2.36)'}
    origin: mit

  - id: norm-2s
    where: 'plot: ∫ r²(2 − r)² e^{−r}/8 dr = 1'
    inputs: {}
    formula: 'integrate("r**2*(2 - r)**2*exp(-r)/8", "r", 0, 80)'
    expected: '1'
    tolerance: 1e-6
    shown: ['normalized here so that each curve has area 1']
    source: {cite: mit, at: 'notes p. 10, eq. (2.35)'}
    origin: page-own

  - id: norm-2p
    where: 'plot: ∫ r⁴ e^{−r}/24 dr = 1'
    inputs: {}
    formula: 'integrate("r**4*exp(-r)/24", "r", 0, 80)'
    expected: '1'
    tolerance: 1e-6
    shown: ['the 2p state has none (N = 0) and peaks at 4a₀']
    source: {cite: mit, at: 'notes p. 10, eq. (2.35)'}
    origin: page-own

  - id: peak-2p
    where: 'plot: d/dr (r⁴ e^{−r}) = 0 at r = 4'
    inputs: {}
    formula: solve('4*r**3*exp(-r) - r**4*exp(-r)', 'r', 2, 6)
    expected: '4'
    tolerance: 1e-6
    shown: ['peaks at 4a₀']
    source: {cite: mit, at: 'notes p. 10'}
    origin: page-own

  - id: quiz-n3
    where: 'quiz 1: 1 + 3 + 5'
    inputs: {}
    formula: 1 + 3 + 5
    expected: '9'
    tolerance: 1e-12
    shown: ['$1 + 3 + 5 = 9 = n^2$ states']
    source: {cite: mit, at: 'notes p. 8, eq. (2.32)'}
    origin: page-own

  - id: ex-n4
    where: 'example (a): 1 + 3 + 5 + 7'
    inputs: {}
    formula: 1 + 3 + 5 + 7
    expected: '16'
    tolerance: 1e-12
    shown: ['$1 + 3 + 5 + 7 = 16 = 4^2$']
    source: {cite: mit, at: 'notes p. 8, eq. (2.32)'}
    origin: page-own

  - id: ex-lyman-energy
    where: 'example (b): 13.606 × 3/4 eV'
    inputs: {}
    formula: 13.606*(1 - 1/4)
    expected: '10.20'
    tolerance: 0.005
    shown: ['\right) \approx 10.20$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: ex-lyman-wavelength
    where: 'example (b): 1239.8/10.2045 nm'
    inputs: {}
    formula: 1239.8/(13.606*0.75)
    expected: '121.5'
    tolerance: 0.05
    shown: ['$\lambda = 1239.8/10.20 \approx 121.5$ nm']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: ex-redshifted
    where: 'example (b): (1 + 3) × 121.5 nm'
    inputs: {}
    formula: 4*121.5
    expected: '486'
    tolerance: 0.5
    shown: ['$4 \times 121.5 \approx 486$ nm']
    source: {cite: mit, at: 'notes p. 7'}
    origin: page-own

  - id: ex-mean-r
    where: 'example (c): ⟨r⟩ = 4 ∫ r³ e^{−2r} dr (a0 = 1)'
    inputs: {}
    formula: '4*integrate("r**3*exp(-2*r)", "r", 0, 60)'
    expected: '1.5'
    tolerance: 1e-6
    shown: ['= \frac32a_0$, larger']
    source: {cite: mit, at: 'notes p. 10, eq. (2.36)'}
    origin: page-own

  - id: quiz-lyman
    where: 'quiz 4: 1239.8/10.2 nm'
    inputs: {}
    formula: 1239.8/10.2
    expected: '122'
    tolerance: 0.5
    shown: ['\\approx 1239.8/10.2 \\approx 122$ nm']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: lyman-measured
    where: 'measured Lyman alpha: 121.5 nm divided by μ/m_e = 0.999456'
    inputs: {}
    formula: 1239.8/(13.606*0.75*0.999456)
    expected: '121.6'
    tolerance: 0.05
    shown: ['The measured line is at 121.6 nm']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own
