# Calculations on content/year-2/8.04/hydrogen-atom.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes "Hydrogen Atom" (Lectures 21–22), sections 1–2, with the page's own example.

page: content/year-2/8.04/hydrogen-atom.mdx
calcs:
  - id: kinetic-separation
    kind: identity
    where: 'pp²/2mp + pe²/2me = P²/2M + p²/2μ with pp = (mp/M)P − p, pe = (me/M)P + p (one dimension)'
    formula: ((mp/(me + mp))*P - p)**2/(2*mp) + ((me/(me + mp))*P + p)**2/(2*me)
    equals: P**2/(2*(me + mp)) + p**2/(2*(me*mp/(me + mp)))
    samples: {mp: [1836.0, 3.0], me: [1.0, 2.0], P: [0.7, -1.3], p: [2.1, 0.4]}
    tolerance: 1e-9
    shown: ['+ \frac{\hat{\vec p}^{\,2}}{2\mu} + V\left(|\hat{\vec x}|\right)']
    source: {cite: mit, at: 'notes p. 3, eq. (1.17)'}
    origin: mit

  - id: bohr-radius
    where: 'a0 = ħc/(α mc²) in Å, notes'' rounding (1970 eV Å, 0.51 MeV, 137)'
    inputs: {}
    formula: 1970*137/0.51e6
    expected: '0.529'
    tolerance: 0.002
    shown: ['\approx 0.529\ \text{Å} \approx 53\ \text{pm}']
    source: {cite: mit, at: 'notes p. 4, eq. (2.3)'}
    origin: mit

  - id: energy-scale
    where: 'e²/a0 = α² mc² = 511000/137² eV'
    inputs: {}
    formula: 511000/137**2
    expected: '27.2'
    tolerance: 0.05
    shown: ['\approx 27.2\ \text{eV}" cite']
    source: {cite: mit, at: 'notes p. 4, eq. (2.4)'}
    origin: mit

  - id: reduced-compton
    where: 'α a0 = ħc/mc² in fm'
    inputs: {}
    formula: 197.327e6/511000
    expected: '386'
    tolerance: 0.5
    shown: ['\approx 386$ fm']
    source: {cite: mit, at: 'notes p. 5, eq. (2.5)'}
    origin: page-own

  - id: classical-radius
    where: 'α² a0 in fm'
    inputs: {}
    formula: 197.327e6/511000/137.036
    expected: '2.8'
    tolerance: 0.05
    shown: ['\approx 2.8$ fm, the classical electron radius']
    source: {cite: mit, at: 'notes p. 5, eq. (2.5)'}
    origin: mit

  - id: rydberg
    where: 'e²/(2a0) = 27.211/2 eV'
    inputs: {}
    formula: 511000/137.036**2/2
    expected: '13.6'
    tolerance: 0.05
    shown: ['$\frac{e^2}{2a_0} \approx 13.6$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: ex-a0
    where: 'example (a): 197.327 × 137.036 / 511000 nm'
    inputs: {}
    formula: 197.327*137.036/511000
    expected: '0.0529'
    tolerance: 0.00005
    shown: ['\approx 0.0529$ nm']
    source: {cite: mit, at: 'notes p. 4, eq. (2.3)'}
    origin: page-own

  - id: ex-mu-ratio
    where: 'example (b): 1836.15/1837.15'
    inputs: {}
    formula: 1836.15/1837.15
    expected: '0.999456'
    tolerance: 0.000001
    shown: ['\approx 0.999456$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.13)'}
    origin: page-own

  - id: ex-binding
    where: 'example (b): 13.606 × 0.999456'
    inputs: {}
    formula: 13.606*1836.15/1837.15
    expected: '13.599'
    tolerance: 0.0005
    shown: ['\approx 13.599$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: ex-binding-diff
    where: 'example (b): 13.606 − 13.5986'
    inputs: {}
    formula: 13.606*(1 - 1836.15/1837.15)
    expected: '0.0074'
    tolerance: 0.00005
    shown: ['lower by about $0.0074$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: ex-positronium
    where: 'example (c) and quiz 4: 13.606/2'
    inputs: {}
    formula: 13.606/2
    expected: '6.80'
    tolerance: 0.005
    shown: ['halves to about $6.80$ eV']
    source: {cite: mit, at: 'notes p. 7, eq. (2.31)'}
    origin: page-own

  - id: ex-positronium-radius
    where: 'example (c): 2 a0 nm'
    inputs: {}
    formula: 2*197.327*137.036/511000
    expected: '0.106'
    tolerance: 0.0005
    shown: ['doubles to about $0.106$ nm']
    source: {cite: mit, at: 'notes p. 4, eq. (2.3)'}
    origin: page-own

  - id: ex-2s
    where: 'example (d): a1/a0 = (2 − 4)/(1 × 2)'
    inputs: {}
    formula: (2*(0 + 0 + 1) - 4)/(1*2)
    expected: '-1'
    tolerance: 1e-12
    shown: ['= -1$, and then']
    source: {cite: mit, at: 'notes p. 6, eq. (2.21)'}
    origin: page-own

  - id: callout-kT
    where: 'callout: k_B × 4000 K in eV (roughly a third of an electronvolt)'
    inputs: {}
    formula: 8.617e-5*4000
    expected: '0.34'
    tolerance: 0.01
    shown: ['roughly a third of an electronvolt']
    source: {cite: mit, at: 'notes p. 4, eq. (2.4): the energy scale; the temperature is the page''s own'}
    origin: page-own

