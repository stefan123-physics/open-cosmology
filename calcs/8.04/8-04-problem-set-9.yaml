    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-drop
    where: 'Problem 1(d), check: how much the quadratic phase lowers the magnitude, in per cent'
    formula: |-
      100*(1 - sqrt(integrate('exp(-100*t**2)*cos(37.5*t**2)', 't', -0.6, 0.6)**2 + integrate('exp(-100*t**2)*sin(37.5*t**2)', 't', -0.6, 0.6)**2)/integrate('exp(-100*t**2)', 't', -0.6, 0.6))
    expected: '3.2'
