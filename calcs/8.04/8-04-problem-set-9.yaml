  - id: p1-mag0
    answer: p1-mag0
    where: 'Problem 1(c), answer box: the area of the Gaussian by numerical integration'
    formula: |-
      integrate('exp(-100*(x - 2)**2)', 'x', 1.4, 2.6)
    expected: '0.1772'
    shown: ['id="p1-mag0"', '= 0.1772\;e^{75i}']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-turns
    where: 'Problem 1(c), check: twelve full turns minus 75 radians'
    formula: |-
      12*2*pi - 75
    expected: '0.398'
    shown: ['twelve full turns less 0.398 radians', '$e^{-0.398i}$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-mag2
    answer: p1-mag2
    where: 'Problem 1(d), answer box: the size of the numerical integral of exp(-100 t^2) exp(-37.5 i t^2), real and imaginary parts separately'
    formula: |-
      sqrt(integrate('exp(-100*t**2)*cos(37.5*t**2)', 't', -0.6, 0.6)**2 + integrate('exp(-100*t**2)*sin(37.5*t**2)', 't', -0.6, 0.6)**2)
    expected: '0.1715'
    shown: ['id="p1-mag2"', '= 0.1715\;e^{74.82i}']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-ph2
    answer: p1-ph2
    where: 'Problem 1(d), answer box: the phase of the same numerical integral (its imaginary part is minus the sine integral)'
    formula: |-
      -atan(integrate('exp(-100*t**2)*sin(37.5*t**2)', 't', -0.6, 0.6)/integrate('exp(-100*t**2)*cos(37.5*t**2)', 't', -0.6, 0.6))
    expected: '-0.179'
    shown: ['id="p1-ph2"', 'e^{i\left(75 - 0.179\right)}']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-csize
    where: 'Problem 1(d): the size of 100 + 37.5 i'
    formula: |-
      sqrt(100**2 + 37.5**2)
    expected: '106.8'
    shown: ['\sqrt{100^2 + 37.5^2} = 106.8', '\sqrt{\frac{\pi}{106.8}}']
    source: {cite: mit, at: 'Problem 1(d), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-cangle
