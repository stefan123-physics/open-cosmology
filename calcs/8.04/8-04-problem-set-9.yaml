# Calculations on content/year-2/8.04/8-04-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# Problem 1 integrates real and imaginary parts numerically and differentiates the phase numerically; Problems 2 to 4
# solve the matching condition at x = a numerically for the phase shift, and integrate or differentiate the phase
# shift numerically (MIT's own route for Problem 2); Problem 5 applies the commutators to a test function; Problem 6
# differentiates in Cartesian coordinates numerically.
# This file is generated by a script (kept outside the repository); edit it by hand if a number on the page changes.

page: content/year-2/8.04/8-04-problem-set-9.mdx
calcs:
  # ---- Problem 1: f(lambda) = integral of exp(-100 (x-2)^2) exp(i phi), phi = 50 (x - lambda x^4/32)
  # All integrals run from 1.4 to 2.6, where the Gaussian has fallen to exp(-36).

  - id: p1-width
    answer: p1-width
    where: 'Problem 1(a), answer box: twice the distance at which the Gaussian is 1/2, solved numerically'
    formula: |-
      2*solve('exp(-100*s**2) - 0.5', 's', 0, 1)
    expected: '0.1665'
    shown: ['id="p1-width"', '\Delta = 2\,\frac{\sqrt{\ln 2}}{10} = 0.1665']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-half
    where: 'Problem 1(a): the distance from the peak to half maximum'
    formula: |-
      sqrt(log(2))/10
    expected: '0.0833'
    shown: ['$\sqrt{\ln 2}/10 = 0.0833$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-safe
    where: 'Problem 1(a), choice box: the Gaussian at x = 1 and x = 3'
    formula: |-
      exp(-100)
    expected: '3.7e-44'
    shown: ['id="p1-safe"', 'e^{-100} \approx 3.7\times10^{-44}']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-range
    where: 'Problem 1(a), check: the range 1 to 3 in units of the width'
    formula: |-
      2/(2*solve('exp(-100*s**2) - 0.5', 's', 0, 1))
    expected: '12'
    tolerance: 0.1
    shown: ['about 12 times the width']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lam
    answer: p1-lam
    where: 'Problem 1(b), answer box: the lambda for which the numerical derivative of the phase at x = 2 vanishes'
    formula: |-
      solve("deriv('50*(s - LAM*s**4/32)', 's', 2)", 'LAM', 0, 3)
    expected: '1'
    tolerance: 1e-06
    shown: ['id="p1-lam"', '<Formula label="Stationary phase at the peak of the Gaussian"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-taylor
    kind: identity
    answer: p1-taylor
    where: 'Problem 1(b), answer box: the Taylor polynomial built from numerical first and second derivatives of the phase at x = 2 (lambda = 1)'
    formula: |-
      75 - 37.5*(x - 2)**2
    equals: |-
      50*(2 - 2**4/32) + deriv('50*(s - s**4/32)', 's', 2)*(x - 2) + deriv('50*(s - s**4/32)', 's', 2, 2)*(x - 2)**2/2
    samples:
      x: [1.5, 1.8, 2.1, 2.3, 2.5]
    tolerance: 1e-06
    shown: ['id="p1-taylor"', '<Formula label="The phase near the peak, at the critical value"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-phi0
    where: 'Problem 1(b): the phase at x = 2 for lambda = 1'
    formula: |-
      50*(2 - 16/32)
    expected: '75'
    shown: ['\phi(1, 2) = 50\left(2 - \frac{16}{32}\right) = 75']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-phi2
    where: 'Problem 1(b): the second derivative of the phase at x = 2, numerically'
    formula: |-
      deriv('50*(s - s**4/32)', 's', 2, 2)
    expected: '-75'
    tolerance: 0.0001
    shown: ['-50\cdot\frac{12x^2}{32} = -75']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-lam0
    where: 'Problem 1(b), check: the change of the phase 50x across the width, in radians'
    formula: |-
      50*2*solve('exp(-100*s**2) - 0.5', 's', 0, 1)
    expected: '8.3'
    shown: ['$50\Delta \approx 8.3$']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-exc
    answer: p1-exc
    where: 'Problem 1(c), answer box: half the numerical second derivative times (Delta/2)^2, in units of pi'
    formula: |-
      -deriv('50*(s - s**4/32)', 's', 2, 2)/2*solve('exp(-100*s**2) - 0.5', 's', 0, 1)**2/pi
    expected: '0.0827'
    shown: ['id="p1-exc"']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-exc-rad
