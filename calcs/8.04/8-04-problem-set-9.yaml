    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-exc-lo
    where: 'Problem 1(c): the change of the full phase between x = 2 and the lower edge of the width'
    formula: |-
      75 - 50*((2 - sqrt(log(2))/10) - (2 - sqrt(log(2))/10)**4/32)
    expected: '0.253'
    shown: ['the change is 0.253 on one side']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-exc-hi
    where: 'Problem 1(c): the change of the full phase between x = 2 and the upper edge of the width'
    formula: |-
