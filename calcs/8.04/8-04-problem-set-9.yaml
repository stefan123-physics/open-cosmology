    origin: page-own

  - id: p1-exc-lo-box
    where: 'Problem 1(c): the smaller exact excursion in units of pi lies inside the 5% tolerance of the box (above 0.0827 x 0.95 = 0.0786)'
    formula: |-
      (75 - 50*((2 - sqrt(log(2))/10) - (2 - sqrt(log(2))/10)**4/32))/pi
    expected: '0.0805'
    shown: ['The box accepts those values too.']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-exc-hi-box
    where: 'Problem 1(c): the larger exact excursion in units of pi lies inside the 5% tolerance of the box (below 0.0827 x 1.05 = 0.0868)'
    formula: |-
      (75 - 50*((2 + sqrt(log(2))/10) - (2 + sqrt(log(2))/10)**4/32))/pi
    expected: '0.0851'
    shown: ['The box accepts those values too.']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-twelfth
    where: 'Problem 1(c): pi divided by the excursion'
    formula: |-
      pi/(37.5*log(2)/100)
    expected: '12'
    tolerance: 0.2
    shown: ['This is a twelfth of $\pi$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
