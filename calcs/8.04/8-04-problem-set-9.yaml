  # ---- Problem 3: a step in front of a wall. Independent route: the matching condition solved numerically for delta.

  - id: p3-above
    kind: identity
    answer: p3-above
    where: 'Problem 3(a), answer box: cot of the delta that solves k cot(ka + delta) = k'' cot(k''a) numerically'
    formula: |-
      (tan(k*a) + kp/(k*tan(kp*a)))/(1 - kp*tan(k*a)/(k*tan(kp*a)))
    equals: |-
