# Calculations on content/year-2/8.04/wave-packets-uncertainty.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 7, with the page's own example.

page: content/year-2/8.04/wave-packets-uncertainty.mdx
calcs:
  - id: flat-packet
    where: 'flat distribution: (1/sqrt(2πΔk)) ∫ e^{ikx} dk over (−Δk/2, Δk/2) = sqrt(Δk/2π) sin(Δk x/2)/(Δk x/2) (real part, as the integrand is even)'
    inputs: {D: 2.0, x: 1.3}
    formula: '(1/sqrt(2*pi*D))*integrate("cos(k*x)", "k", -D/2, D/2)'
    expected: '0.4182'
    tolerance: 0.0005
    shown: ['\sqrt{\frac{\Delta k}{2\pi}}\;\frac{\sin\left(\Delta k\,x/2\right)}{\Delta k\,x/2}']
    source: {cite: mit, at: 'notes p. 4, eq. (1.16)'}
    origin: mit

  - id: flat-packet-closed
    where: 'closed form at the same point: sqrt(2/2π) sin(1.3)/1.3'
    inputs: {D: 2.0, x: 1.3}
    formula: sqrt(D/(2*pi))*sin(D*x/2)/(D*x/2)
    expected: '0.4182'
    tolerance: 0.0005
    shown: ['the first zeros sit at ±2π/Δk']
    source: {cite: mit, at: 'notes p. 4, eq. (1.16)'}
    origin: mit

  - id: free-curvature
    kind: identity
    where: 'second derivative of ħk²/2m is ħ/m (numerical, ħ = h)'
    formula: (h*(k + 1e-3)**2/(2*m) - 2*h*k**2/(2*m) + h*(k - 1e-3)**2/(2*m))/1e-6
    equals: h/m
    samples: {h: [1.0, 2.0], k: [1.5, 3.0], m: [1.0, 0.5]}
    tolerance: 1e-6
    shown: ['$d^2\omega/dk^2 = \hbar/m$; all higher']
    source: {cite: mit, at: 'notes p. 5, eq. (2.20)'}
    origin: mit

  - id: electron-exercise
    where: 'notes exercise: m(Δx)²/ħ for an electron, Δx = 1e-10 m'
    inputs: {}
    formula: 9.109e-31*1e-20/1.0546e-34
    expected: '8.6e-17'
    tolerance: 0.1e-17
    shown: ['\approx 10^{-16}$ s, while']
    source: {cite: mit, at: 'notes p. 6, eq. (2.28)'}
    origin: mit

  - id: electron-exercise-cm
    where: 'notes exercise: m(Δx)²/ħ for Δx = 1e-2 m (about a second)'
    inputs: {}
    formula: 9.109e-31*1e-4/1.0546e-34
    expected: '0.86'
    tolerance: 0.01
    shown: ['it would stay so for about a second']
    source: {cite: mit, at: 'notes p. 6'}
    origin: mit

  - id: gaussian-norm
    where: '∫ |Ψ_a|² dx = 1 (a = 0.7)'
    inputs: {a: 0.7}
    formula: '(1/(sqrt(2*pi)*a))*integrate("exp(-x**2/(2*a**2))", "x", -20, 20)'
    expected: '1'
    tolerance: 1e-6
    shown: ['The normalized Gaussian']
    source: {cite: mit, at: 'notes p. 6, eq. (3.4)'}
    origin: mit

  - id: ex-dp
    where: 'example (a): ħ/(2 × 1e-10)'
    inputs: {}
    formula: 1.0546e-34/(2*1.0e-10)
    expected: '5.27e-25'
    tolerance: 0.005e-25
    shown: ['\approx 5.27 \times 10^{-25}$ kg m/s']
    source: {cite: mit, at: 'notes p. 3, eq. (1.15)'}
    origin: page-own

  - id: ex-dv
    where: 'example (a): Δp/m_e'
    inputs: {}
    formula: 1.0546e-34/(2*1.0e-10)/9.109e-31
    expected: '5.8e5'
    tolerance: 0.05e5
    shown: ['\ge 5.8 \times 10^5$ m/s']
    source: {cite: mit, at: 'notes p. 3, eq. (1.15)'}
    origin: page-own

  - id: ex-proton-time
    where: 'example (b): m_p (Δx)²/ħ'
    inputs: {}
    formula: 1.6726e-27*1e-20/1.0546e-34
    expected: '1.6e-13'
    tolerance: 0.05e-13
    shown: ['\approx 1.6 \times 10^{-13}$ s']
    source: {cite: mit, at: 'notes p. 5, eq. (2.25)'}
    origin: page-own

  - id: ex-proton-ratio
    where: 'example (b): m_p/m_e (nearly two thousand)'
    inputs: {}
    formula: 1.6726e-27/9.109e-31
    expected: '1836'
    tolerance: 1
    shown: ['nearly two thousand times longer']
    source: {cite: mit, at: 'notes p. 5'}
    origin: page-own

  - id: ex-tau
    where: 'example (c): 2 m_e a²/ħ, a = 1 nm'
    inputs: {}
    formula: 2*9.109e-31*1e-18/1.0546e-34
    expected: '1.7e-14'
    tolerance: 0.05e-14
    shown: ['\approx 1.7 \times 10^{-14}$ s']
    source: {cite: mit, at: 'notes p. 7, eq. (3.6)'}
    origin: page-own

  - id: ex-zeros
    where: 'example (d): 2π/Δk, Δk = 2e10 /m'
    inputs: {}
    formula: 2*pi/2.0e10
    expected: '3.1e-10'
    tolerance: 0.05e-10
    shown: ['$x = \pm 2\pi/\Delta k = \pm 3.1 \times 10^{-10}$ m']
    source: {cite: mit, at: 'notes p. 4, eq. (1.17)'}
    origin: page-own
