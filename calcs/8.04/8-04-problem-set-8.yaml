  # ---- Problem 5: the rectangular barrier
  # Independent route: add up the repeated reflections inside the barrier. A wave entering a region where it decays
  # as e^(−κx) is transmitted with amplitude 2k/(k + iκ), leaves with 2iκ/(k + iκ) and is reflected inside with
  # (iκ − k)/(iκ + k), a pure phase e^(i(π − 2 arctan(κ/k)))... The sum of the geometric series gives
  # T = [16k²κ²/(k² + κ²)²] e^(−4κa) / [1 − 2e^(−4κa) cos(4 arctan(κ/k)) + e^(−8κa)], with k²/κ² = E/(V0 − E).
  # Above the top, with k₂ real and r = (k₂ − k)/(k₂ + k): T = [16k²k₂²/(k + k₂)⁴] / [1 − 2r² cos(4k₂a) + r⁴].

  - id: p5-below
    kind: identity
    answer: p5-below
    where: 'Problem 5(a), answer box: 1/T from the sum over repeated reflections inside the barrier'
    formula: |-
      1 + V0**2*sinh(2*kappa*a)**2/(4*E*(V0 - E))
    equals: |-
      1/((16*(E)*((V0) - (E))/(V0)**2)*exp(-4*(kappa*a))/(1 - 2*exp(-4*(kappa*a))*cos(4*atan(sqrt(((V0) - (E))/(E)))) + exp(-8*(kappa*a))))
    samples:
      V0: [2, 2.5, 3, 3.5, 4]
      E: [0.3, 1.5, 0.8, 1.2, 0.5]
      kappa: [0.3, 0.5, 0.7, 0.9, 1.0]
      a: [1.0, 0.3, 0.6, 0.8, 0.5]
    tolerance: 1e-9
    shown: ['id="p5-below"', '<Formula label="Transmission through a barrier, below its top"']
    source: {cite: mit, at: 'Problem 5, p. 4 (our own solution)'}
    origin: page-own

