  # ---- Problem 3: the forbidden region of a deep finite well
  # Exact route: solve η tan η = sqrt(z0² − η²) for η = ka of the ground state (the lesson's even condition), set
  # κa = η tan η, and normalize exactly: the norm of (1/√a) cos kx inside with the tail matched at x = a is
  # 1 + sin 2η/(2η) + cos²η/(κa). The contribution of x > a is then −(ħ²/(4ma²)) κa cos²η / norm.

