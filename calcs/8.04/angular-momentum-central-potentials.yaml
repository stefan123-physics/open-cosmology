# Calculations on content/year-2/8.04/angular-momentum-central-potentials.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes for Lectures 20–21, sections 1–3, with the page's own example.

page: content/year-2/8.04/angular-momentum-central-potentials.mdx
calcs:
  - id: translation
    kind: identity
    where: 'Taylor series: e^{a d/dx} applied to sin(x) gives sin(x + a) (summed to 30 terms via the closed form sin x cos a + cos x sin a)'
    formula: sin(x)*cos(a) + cos(x)*sin(a)
    equals: sin(x + a)
    samples: {x: [0.3, 2.0], a: [0.5, -1.2]}
    tolerance: 1e-12
    shown: ['= \psi(x + a)" cite']
    source: {cite: mit, at: 'notes p. 1, eq. (1.3)'}
    origin: mit

  - id: lz-chain-rule
    kind: identity
    where: '∂/∂φ of f = x² y (with x = r sinθ cosφ, y = r sinθ sinφ) equals x ∂f/∂y − y ∂f/∂x'
    formula: (( (s*cos(p + 1e-6))**2*(s*sin(p + 1e-6)) ) - ( (s*cos(p - 1e-6))**2*(s*sin(p - 1e-6)) ))/2e-6
    equals: (s*cos(p))*(s*cos(p))**2 - (s*sin(p))*2*(s*cos(p))*(s*sin(p))
    samples: {s: [0.7, 1.5], p: [0.4, 2.2]}
    tolerance: 1e-6
    shown: ['\hat L_z = \frac{\hbar}{i}\frac{\partial}{\partial\phi}, \qquad']
    source: {cite: mit, at: 'notes p. 6, eqs. (2.17)–(2.18)'}
    origin: mit

  - id: legendre-P2
    kind: identity
    where: '(1 − x²)P″ − 2xP′ + 6P = 0 for P2 = (3x² − 1)/2'
    formula: (1 - x**2)*3 - 2*x*3*x + 6*(3*x**2 - 1)/2
    equals: 0*x
    samples: {x: [0.2, 0.7, -0.5]}
    tolerance: 1e-12
    shown: ['= 3 - 9x^2 + 9x^2 - 3 = 0$']
    source: {cite: mit, at: 'notes p. 8, eq. (3.16)'}
    origin: page-own

  - id: legendre-P3
    kind: identity
    where: 'plot: P3 = (5x³ − 3x)/2 solves Legendre with l = 3'
    formula: (1 - x**2)*15*x - 2*x*(15*x**2 - 3)/2 + 12*(5*x**3 - 3*x)/2
    equals: 0*x
    samples: {x: [0.2, 0.7, -0.5]}
    tolerance: 1e-12
    shown: ['P₃ = (5x³ − 3x)/2 is the page''s addition']
    source: {cite: mit, at: 'notes p. 9, eq. (3.21)'}
    origin: page-own

  - id: recursion-a2
    where: 'example (b): a2 = −(6 − 0)/(1 × 2)'
    inputs: {}
    formula: -(6 - 0)/(1*2)
    expected: '-3'
    tolerance: 1e-12
    shown: ['$a_2 = -\frac{6 - 0}{1 \times 2}a_0 = -3$']
    source: {cite: mit, at: 'notes p. 9, eq. (3.19)'}
    origin: page-own

  - id: rodrigues-P2
    kind: identity
    where: 'example (c): (1/8)(12x² − 4) = (3x² − 1)/2'
    formula: (12*x**2 - 4)/8
    equals: (3*x**2 - 1)/2
    samples: {x: [0.2, 0.9]}
    tolerance: 1e-12
    shown: ['\frac18(12x^2 - 4) = \frac12(3x^2 - 1)$']
    source: {cite: mit, at: 'notes p. 9, eq. (3.21)'}
    origin: page-own

  - id: L-size
    where: 'example (d) and quiz 4: √6'
    inputs: {}
    formula: sqrt(6)
    expected: '2.45'
    tolerance: 0.005
    shown: ['$\sqrt6\,\hbar \approx 2.45\hbar$, more than the largest $L_z = l\hbar = 2\hbar$']
    source: {cite: mit, at: 'notes p. 7, eq. (3.1)'}
    origin: page-own
