# Calculations on content/year-2/8.04/momentum-space-expectation-values.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 8, with the page's own example.

page: content/year-2/8.04/momentum-space-expectation-values.mdx
calcs:
  - id: gaussian-norm
    where: 'example: ∫ |Ψ|² dx = 1 for (2πa²)^(−1/4) e^(−x²/4a²), a = 0.6'
    inputs: {a: 0.6}
    formula: '(2*pi*a**2)**(-0.5)*integrate("exp(-x**2/(2*a**2))", "x", -20, 20)'
    expected: '1'
    tolerance: 1e-6
    shown: ['Take the normalized Gaussian']
    source: {cite: mit, at: 'notes p. 4, eq. (2.20)'}
    origin: page-own

  - id: gaussian-x2
    where: 'example (a): ⟨x²⟩ = a² (a = 0.6, so 0.36)'
    inputs: {a: 0.6}
    formula: '(2*pi*a**2)**(-0.5)*integrate("x**2*exp(-x**2/(2*a**2))", "x", -20, 20)'
    expected: '0.36'
    tolerance: 1e-6
    shown: ['so $\langle\hat x^2\rangle = a^2$']
    source: {cite: mit, at: 'notes p. 4, eq. (2.20)'}
    origin: page-own

  - id: gaussian-derivative-square
    where: 'example (b): ∫ |Ψ′|² dx = 1/(4a²) (a = 0.6, so 0.6944)'
    inputs: {a: 0.6}
    formula: '(2*pi*a**2)**(-0.5)*integrate("(x/(2*a**2))**2*exp(-x**2/(2*a**2))", "x", -20, 20)'
    expected: '0.6944'
    tolerance: 0.0001
    shown: ['= \frac{1}{4a^2}$ and']
    source: {cite: mit, at: 'notes p. 5, eq. (2.31)'}
    origin: page-own

  - id: ex-kinetic-eV
    where: 'example (b): 197.33² / (8 × 511000 × 0.01) eV'
    inputs: {}
    formula: 197.33**2/(8*511000*0.01)
    expected: '0.95'
    tolerance: 0.005
    shown: ['\approx 0.95$ eV']
    source: {cite: mit, at: 'notes p. 5, eq. (2.31)'}
    origin: page-own

  - id: delta-scaling
    where: 'quiz 2: ∫ of a narrow normalized spike g(3x) is 1/3 (g = Gaussian of width 0.01)'
    inputs: {}
    formula: 'integrate("exp(-(3*x)**2/(2*0.01**2))/(sqrt(2*pi)*0.01)", "x", -1, 1)'
    expected: '0.3333'
    tolerance: 0.0001
    shown: ['$\\int\\delta(3x)dx = \\frac13\\int\\delta(u)du$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.6)'}
    origin: mit

  - id: commutator-product
    kind: identity
    where: 'example (d): [x, p²] = 2iħ p; checked on ψ = sin(qx) with ħ = 1, p = −i d/dx: x(−ψ″) − (−(xψ)″) = 2ψ′, i.e. [x, p²]ψ = 2i(−iψ′)... real form: −xψ″ + (xψ)″ = 2ψ′'
    formula: -x*(-q**2*sin(q*x)) + (2*q*cos(q*x) - x*q**2*sin(q*x))
    equals: 2*q*cos(q*x)
    samples: {x: [0.3, 1.7, -0.9], q: [1.0, 2.2, 0.6]}
    tolerance: 1e-12
    shown: ['= 2i\hbar\,\hat p$. So']
    source: {cite: mit, at: 'notes p. 6, eq. (3.41)'}
    origin: page-own
