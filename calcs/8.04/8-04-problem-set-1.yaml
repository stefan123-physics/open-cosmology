  # ---- Problem 6: Mach-Zehnder interferometer
  # The general formulas are checked against the amplitudes multiplied out in real and imaginary parts, for an
  # input alpha = ar + i ai, beta = br + i bi of any size (both sides divided by the norm).

  - id: p6-general-lower
    kind: identity
    where: 'Problem 6(a), formula for P0: against |(beta - alpha) + e^(i dl)(beta + alpha)|^2 / 4, real and imaginary parts written out'
    formula: 0.5 + 0.5*(((br**2 + bi**2) - (ar**2 + ai**2))*cos(dl) - 2*(ai*br - ar*bi)*sin(dl))/(ar**2 + ai**2 + br**2 + bi**2)
    equals: 0.25*(((br - ar) + cos(dl)*(br + ar) - sin(dl)*(bi + ai))**2 + ((bi - ai) + sin(dl)*(br + ar) + cos(dl)*(bi + ai))**2)/(ar**2 + ai**2 + br**2 + bi**2)
    samples:
      ar: [0.6, 0.3, -0.5, 1.0, 0.2]
      ai: [0.0, 0.4, 0.7, -0.3, 0.9]
      br: [0.0, 0.8, 0.1, 0.5, -0.6]
      bi: [0.8, -0.2, 0.6, 0.4, 0.3]
      dl: [1.0471976, 0.3, 2.0, 4.0, 5.5]
    tolerance: 1e-9
    shown: ['<Formula label="Detection probabilities with a shifter in the lower leg"']
    source: {cite: reading2, at: 'notes p. 4, eqs. (1.17)–(1.18)'}
    origin: page-own

  - id: p6-general-upper
    kind: identity
    where: 'Problem 6(b), formula for P0: against |e^(i du)(beta - alpha) + (beta + alpha)|^2 / 4'
    formula: 0.5 + 0.5*(((br**2 + bi**2) - (ar**2 + ai**2))*cos(du) + 2*(ai*br - ar*bi)*sin(du))/(ar**2 + ai**2 + br**2 + bi**2)
    equals: 0.25*((cos(du)*(br - ar) - sin(du)*(bi - ai) + (br + ar))**2 + (sin(du)*(br - ar) + cos(du)*(bi - ai) + (bi + ai))**2)/(ar**2 + ai**2 + br**2 + bi**2)
    samples:
      ar: [0.6, 0.3, -0.5, 1.0, 0.2]
      ai: [0.0, 0.4, 0.7, -0.3, 0.9]
      br: [0.0, 0.8, 0.1, 0.5, -0.6]
      bi: [0.8, -0.2, 0.6, 0.4, 0.3]
      du: [1.0471976, 0.3, 2.0, 4.0, 5.5]
    tolerance: 1e-9
    shown: ['<Formula label="Detection probabilities with a shifter in the upper leg"']
    source: {cite: reading2, at: 'notes p. 4, eqs. (1.17)–(1.18)'}
    origin: page-own

  - id: p6-general-both
    kind: identity
    where: 'Problem 6(c), formula for P0: against |e^(i du)(beta - alpha) + e^(i dl)(beta + alpha)|^2 / 4'
    formula: 0.5 + 0.5*(((br**2 + bi**2) - (ar**2 + ai**2))*cos(dl - du) - 2*(ai*br - ar*bi)*sin(dl - du))/(ar**2 + ai**2 + br**2 + bi**2)
    equals: 0.25*((cos(du)*(br - ar) - sin(du)*(bi - ai) + cos(dl)*(br + ar) - sin(dl)*(bi + ai))**2 + (sin(du)*(br - ar) + cos(du)*(bi - ai) + sin(dl)*(br + ar) + cos(dl)*(bi + ai))**2)/(ar**2 + ai**2 + br**2 + bi**2)
    samples:
