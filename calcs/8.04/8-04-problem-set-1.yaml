    source: {cite: mit, at: 'Problem 4(c), p. 3'}
    origin: page-own

  # Independent route: the real part of (a + ib)(p + iq) is a p - b q, with p = a and q = -b for the conjugate;
  # the imaginary part a q + b p must vanish.
  - id: p4-zz
    kind: identity
    answer: p4-zz
    where: 'Problem 4(d), answer box: against the product rule, real part a p - b q plus the imaginary part a q + b p (zero), with p = a, q = -b'
    formula: a**2 + b**2
