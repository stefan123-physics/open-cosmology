  # ---- Problem 4: complex numbers

  # Independent route: Euler's formula from the Taylor series of part (a), summed to the term theta^10 (theta^11).
  - id: p4-a
    kind: identity
    answer: p4-a
    where: 'Problem 4(b), answer box a: against the real part of the exponential series'
    formula: r*cos(theta)
    equals: r*(1 - theta**2/2 + theta**4/24 - theta**6/720 + theta**8/40320 - theta**10/3628800)
    samples:
      r: [0.5, 1, 2, 3, 1.5]
      theta: [0.2, 0.5, 0.8, 1.1, 1.3]
    tolerance: 1e-6
    shown: ['id="p4-a"']
    source: {cite: mit, at: 'Problem 4(b), p. 3'}
    origin: page-own

  - id: p4-b
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), answer box b: against the imaginary part of the exponential series'
    formula: r*sin(theta)
    equals: r*(theta - theta**3/6 + theta**5/120 - theta**7/5040 + theta**9/362880 - theta**11/39916800)
    samples:
      r: [0.5, 1, 2, 3, 1.5]
      theta: [0.2, 0.5, 0.8, 1.1, 1.3]
    tolerance: 1e-6
    shown: ['id="p4-b"']
    source: {cite: mit, at: 'Problem 4(b), p. 3'}
    origin: page-own

  # Independent route: the magnitude is the number s that makes (a/s, b/s) a point of the unit circle.
  - id: p4-r
    kind: identity
    answer: p4-r
    where: 'Problem 4(b), answer box r: against the numerical solution of (a/s)^2 + (b/s)^2 = 1'
    formula: sqrt(a**2 + b**2)
    equals: solve('(a/s)**2 + (b/s)**2 - 1', 's', 0.1, 100)
    samples:
