# Calculations on content/year-2/8.04/8-04-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this problem set, so every answer is checked here by a route independent of the page:
# the Larmor power times the period built from mass, radius and speed; the spiral time as a numerical integral of
# (dE/dr)/power in MeV and fm; the classical electron radius from SI constants; the orbit conditions of Problem 2
# solved numerically; Euler's formula against its Taylor series; the interferometer amplitudes multiplied out in
# real and imaginary parts for a general input; the bomb fractions counted two ways.
# Constants: CODATA 2018 (hbar c = 197.3269804 MeV fm, m_e c^2 = 0.51099895 MeV, 1/alpha = 137.035999084).

page: content/year-2/8.04/8-04-problem-set-1.mdx
calcs:
  # ---- Introduction

  - id: intro-constants
    kind: fact
    where: 'How to answer: the constants of Problems 1 and 2, CODATA 2018 rounded (197.3269804 MeV fm, 0.51099895 MeV, 137.035999084, 299792458 m/s)'
    shown: ['$\hbar c = 197.327$ MeV fm, $m_ec^2 = 0.510999$ MeV, $\alpha = 1/137.036$ and $c = 2.998\times 10^{8}$ m/s']
    source: {cite: codata, at: 'hbar c in MeV fm, electron mass energy equivalent in MeV, inverse fine-structure constant'}
    origin: later-data

  - id: intro-constants-p3
    kind: fact
    where: 'How to answer: MIT''s rounded h and k_B for Problem 3, and our atomic mass unit and electronvolt (CODATA: 1.66053907e-27 kg, 1.602176634e-19 J)'
    shown: ['$h = 6.6\times 10^{-34}$ J s and $k_B = 1.38\times 10^{-23}$ J/K, and from us the atomic mass unit $1.66\times 10^{-27}$ kg and 1 eV $= 1.602\times 10^{-19}$ J']
    source: {cite: mit, at: 'Problem 3, p. 2 (h and k_B); the other two are ours'}
    origin: mit

  # ---- Problem 1: radiative collapse

  # Independent route: build the loss from mass, radius and speed. With v = b cc the force equation gives
  # e^2 = mm (b cc)^2 rr and a = (b cc)^2 / rr; then Larmor power times period over (1/2) mm v^2.
  - id: p1-ratio
    kind: identity
    answer: p1-ratio
    where: 'Problem 1(a), answer box: against Larmor power times period over kinetic energy, built from mass, radius and speed'
    formula: (8*pi/3)*b**3
    equals: (2*(mm*(b*cc)**2*rr)*((b*cc)**2/rr)**2/(3*cc**3))*(2*pi*rr/(b*cc))/(0.5*mm*(b*cc)**2)
    samples:
      b: [0.01, 0.05, 0.1, 0.2, 0.3]
      mm: [1, 2, 0.5, 3, 1.5]
      rr: [1, 0.3, 5, 2, 0.7]
      cc: [1, 3, 10, 2, 5]
    tolerance: 1e-9
    shown: ['id="p1-ratio"']
    source: {cite: mit, at: 'Problem 1(a), p. 1'}
    origin: page-own

  - id: p1-ratio-example
    where: 'Problem 1(a), check: the ratio for beta = 0.01'
    formula: (8*pi/3)*0.01**3
    expected: '8.4e-6'
    shown: ['it is $8.4\times 10^{-6}$']
    source: {cite: mit, at: 'Problem 1(a), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-re
    where: 'Problem 1(b), formula: the classical electron radius in fm'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: hc/(ainv*me)
    expected: '2.818'
    shown: ['= 2.818\ \text{fm}"']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  # Independent route: the same length from SI constants, hbar/(m_e c) times alpha, with m_e = 9.1093837e-31 kg.
  - id: p1-re-si
    where: 'Problem 1(c), solution: the classical electron radius in metres, from SI constants'
    inputs: {mkg: 9.1093837e-31 kg, ainv: 137.036}
    formula: hbar/(ainv*mkg*c)
    expected: 2.818e-15 m
    shown: ['$r_e = 2.818\times 10^{-15}$ m']
    source: {cite: codata, at: 'electron mass in kg, reduced Planck constant, inverse fine-structure constant'}
    origin: page-own

  - id: p1-beta-50pm
    answer: p1-b50
    where: 'Problem 1(b), answer box: v/c at 50 pm = 50,000 fm'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: sqrt(hc/(ainv*me)/50000)
    expected: '0.00751'
    shown: ['id="p1-b50"']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: page-own

  - id: p1-beta-1pm
    answer: p1-b1pm
    where: 'Problem 1(b), answer box: v/c at 1 pm = 1000 fm'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: sqrt(hc/(ainv*me)/1000)
    expected: '0.0531'
    shown: ['id="p1-b1pm"']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: page-own

  - id: p1-beta-1fm
    answer: p1-b1fm
    where: 'Problem 1(b), answer box: v/c at 1 fm (above 1: the model has failed)'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: sqrt(hc/(ainv*me)/1)
    expected: '1.68'
    shown: ['id="p1-b1fm"']
    source: {cite: mit, at: 'Problem 1(b), p. 1'}
    origin: page-own

  # Independent route for the speed at 50 pm: SI constants, v^2 = alpha hbar c / (m_e r).
  - id: p1-beta-50pm-si
    where: 'Problem 1(b), formula: v/c at 50 pm from SI constants'
    inputs: {mkg: 9.1093837e-31 kg, ainv: 137.036, rr: 50e-12 m}
    formula: sqrt(hbar/(ainv*mkg*c*rr))
    expected: '0.00751'
    shown: ['= 0.00751\ \text{(50 pm)}']
    source: {cite: mit, at: 'Problem 1(b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-loss-50pm
    where: 'Problem 1(b), solution: the loss per revolution over K at 50 pm'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: (8*pi/3)*sqrt(hc/(ainv*me)/50000)**3
    expected: '3.5e-6'
    shown: ['= 3.5\times 10^{-6}$ of the kinetic energy']
    source: {cite: mit, at: 'Problem 1(a) and (b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-loss-1pm
    where: 'Problem 1(b), solution: the loss per revolution over K at 1 pm'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: (8*pi/3)*sqrt(hc/(ainv*me)/1000)**3
    expected: '1.3e-3'
    shown: ['at 1 pm it is $1.3\times 10^{-3}$']
    source: {cite: mit, at: 'Problem 1(a) and (b), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-time
    answer: p1-time
    where: 'Problem 1(c), answer box: the time from 50 pm to 1 pm, in seconds, from t = (ri^3 - rf^3)/(4 re^2 c)'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036, ri: 5.0e-11, rf: 1.0e-12, cl: 2.998e8}
    formula: (ri**3 - rf**3)/(4*(hc/(ainv*me)*1e-15)**2*cl)
    expected: '1.31e-11'
    shown: ['id="p1-time"']
    source: {cite: mit, at: 'Problem 1(c), p. 1'}
    origin: page-own

  # Independent route: integrate dt = (dE/dr) dr / (Larmor power) numerically, in MeV and fm, without the formula
  # for t and without r_e. dE/dr = alpha hc/(2 s^2); power = (2/3) alpha hc (a/c^2)^2 c with a/c^2 = alpha hc/(me s^2).
  - id: p1-time-integral
    where: 'Problem 1(c), check: the same time as a numerical integral of (dE/dr)/(Larmor power) from 1000 fm to 50,000 fm'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036, cf: 2.998e23}
    formula: integrate('(hc/ainv/(2*s**2))/((2/3)*(hc/ainv)*(hc/ainv/(me*s**2))**2*cf)', 's', 1000, 50000)
    expected: '1.31e-11'
    shown: ['$t = 1.31\times 10^{-11}$ s, about 13 picoseconds']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-beta-squared
    where: 'Problem 1(c), solution: the size of relativistic corrections at 1 pm, beta^2 in percent'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: 100*hc/(ainv*me)/1000
    expected: '0.3'
    shown: ['which is at most 0.3% here']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-last-fraction
    where: 'Problem 1(c), solution and choice box: the fraction of the time spent below 1 pm'
    formula: (1/50)**3
    expected: '8e-6'
    shown: ['$(1\ \text{pm}/50\ \text{pm})^3 = 8\times 10^{-6}$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-last-stage
    where: 'Problem 1(c), solution: the time from 1 pm to the centre, in seconds'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036, rf: 1.0e-12, cl: 2.998e8}
    formula: rf**3/(4*(hc/(ainv*me)*1e-15)**2*cl)
    expected: '1e-16'
    shown: ['the stretch below 1 pm takes about $10^{-16}$ s']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-light-time
    where: 'Problem 1(c), check: the time light takes to cross 50 pm'
    inputs: {ri: 5.0e-11 m, cl: 2.998e8 m/s}
    formula: ri/cl
    expected: 1.7e-19 s
    shown: ['Light crosses $r_i$ in $1.7\times 10^{-19}$ s']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  - id: p1-size-ratio
    where: 'Problem 1(c), check: (ri/re)^2/4'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: (50000/(hc/(ainv*me)))**2/4
    expected: '7.9e7'
    shown: ['$(r_i/r_e)^2/4 = 7.9\times 10^{7}$']
    source: {cite: mit, at: 'Problem 1(c), p. 1 (our own solution)'}
    origin: page-own

  # ---- Problem 2: quantized energies

  # Independent route for (a): for a given E, solve K + V = E for the radius of the circular orbit numerically
  # (K = e2/(2 s), V = -e2/s), then read off K and V at that radius.
  - id: p2-k
    kind: identity
    answer: p2-k
    where: 'Problem 2(a), answer box K: against the kinetic energy at the radius where K + V = E'
    formula: -E
    equals: e2/(2*solve('e2/(2*s) - e2/s - E', 's', 0.001, 1000))
    samples:
      E: [-5, -3, -1, -0.5, -2]
      e2: [1, 2, 0.5, 3, 1.5]
    tolerance: 1e-9
    shown: ['id="p2-k"']
    source: {cite: mit, at: 'Problem 2(a), p. 2'}
    origin: page-own

  - id: p2-v
    kind: identity
    answer: p2-v
    where: 'Problem 2(a), answer box V: against the potential energy at the radius where K + V = E'
    formula: 2*E
    equals: -e2/solve('e2/(2*s) - e2/s - E', 's', 0.001, 1000)
    samples:
      E: [-5, -3, -1, -0.5, -2]
      e2: [1, 2, 0.5, 3, 1.5]
    tolerance: 1e-9
    shown: ['id="p2-v"']
    source: {cite: mit, at: 'Problem 2(a), p. 2'}
    origin: page-own

  # Independent route for (b), in units hbar = c = 1 (mass = Ee, e^2 = alpha, L = n): put v = n/(Ee s) into the
  # force equation Ee v^2 = alpha/s and solve for the radius s numerically; then E = K + V at that radius.
  - id: p2-en
    kind: identity
    answer: p2-en
    where: 'Problem 2(b), answer box E_n: against K + V at the numerically solved radius, in units hbar = c = 1'
    formula: -alpha**2*Ee/(2*n**2)
    equals: 0.5*Ee*(n/(Ee*solve('n**2/(Ee*s**2) - alpha/s', 's', 1, 1e7)))**2 - alpha/solve('n**2/(Ee*s**2) - alpha/s', 's', 1, 1e7)
    samples:
      alpha: [0.005, 0.0073, 0.01, 0.006, 0.009]
      Ee: [0.4, 0.511, 0.6, 0.45, 0.55]
      n: [1, 2, 3, 4, 5]
    tolerance: 1e-9
    shown: ['id="p2-en"']
    source: {cite: mit, at: 'Problem 2(b), p. 2'}
    origin: page-own

  - id: p2-rn
    kind: identity
    answer: p2-rn
    where: 'Problem 2(b), answer box r_n: against the numerically solved radius (mass = 1/lam in units hbar = c = 1)'
    formula: n**2*lam/alpha
    equals: solve('n**2*lam/s**2 - alpha/s', 's', 1, 1e7)
    samples:
      alpha: [0.005, 0.0073, 0.01, 0.006, 0.009]
      lam: [0.5, 1, 2, 1.5, 0.8]
      n: [1, 2, 3, 4, 5]
    tolerance: 1e-9
    shown: ['id="p2-rn"']
    source: {cite: mit, at: 'Problem 2(b), p. 2'}
    origin: page-own

  - id: p2-lambda-e
    where: 'Problem 2(b), check: hbar c / (m_e c^2) in fm'
    inputs: {hc: 197.327, me: 0.510999}
    formula: hc/me
    expected: '386.16'
    shown: ['= 386.16$ fm']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  - id: p2-r1
    where: 'Problem 2(b), check: the radius for n = 1, in units of 1e-10 m (1 fm = 1e-5 of that)'
    inputs: {hc: 197.327, me: 0.510999, ainv: 137.036}
    formula: ainv*hc/me*1e-5
    expected: '0.5292'
    shown: ['= 0.5292\times 10^{-10}$ m']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # Independent route: the Bohr radius from SI constants, hbar/(alpha m_e c).
  - id: p2-r1-si
    kind: identity
    where: 'Problem 2(b), check: the n = 1 radius from MeV fm values against hbar/(alpha m_e c) from SI constants (both in fm)'
    formula: ainv*197.327/0.510999
    equals: ainv*1.054571817e-34/(9.1093837e-31*299792458)*1e15
    samples:
      ainv: [137.036]
    tolerance: 1e-5
    shown: ['$r_1 = 137.036 \times 386.16\ \text{fm}']
    source: {cite: codata, at: 'electron mass in kg, reduced Planck constant'}
    origin: page-own

  - id: p2-e1
    where: 'Problem 2(b), check: the energy for n = 1, in eV'
    inputs: {meev: 510999, ainv: 137.036}
    formula: -meev/(2*ainv**2)
    expected: '-13.606'
    shown: ['= -13.606$ eV']
    source: {cite: mit, at: 'Problem 2(b), p. 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3: de Broglie wavelengths and photons

  - id: p3-given
    kind: fact
    where: 'Problem 3, statement: MIT''s data'
    shown: ['A car of mass 2000 kg moving at 22 m/s (50 miles per hour).', 'A marble of mass 10 g moving at 10 cm/s.', 'a diameter of 100 nm and a mass of 1 fg', 'Visible light has wavelengths from 400 nm to 700 nm.', 'works at about 2.5 GHz with a power of at most 300 W', '(10 mW at 633 nm) and for a mobile phone (0.25 W at 850 MHz)', '200 ml of water by 10 °C']
    source: {cite: mit, at: 'Problem 3, p. 2'}
    origin: mit

  - id: p3-car-momentum
    where: 'Problem 3(a), solution: the momentum of the car'
    inputs: {mcar: 2000 kg, vcar: 22 m/s}
    formula: mcar*vcar
    expected: 4.4e4 kg*m/s
    shown: ['$2000 \times 22 = 4.4\times 10^{4}$ kg m/s']
    source: {cite: mit, at: 'Problem 3(a), p. 2'}
    origin: page-own

  - id: p3-car
    answer: p3-car
    where: 'Problem 3(a), answer box: the de Broglie wavelength of the car'
    inputs: {hh: 6.6e-34 J*s, mcar: 2000 kg, vcar: 22 m/s}
    formula: hh/(mcar*vcar)
    expected: 1.5e-38 m
    shown: ['id="p3-car"']
    source: {cite: reading3, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  - id: p3-marble
    answer: p3-marble
    where: 'Problem 3(a), answer box: the de Broglie wavelength of the marble'
    inputs: {hh: 6.6e-34 J*s, mmar: 10 g, vmar: 10 cm/s}
    formula: hh/(mmar*vmar)
    expected: 6.6e-31 m
    shown: ['id="p3-marble"']
    source: {cite: reading3, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  - id: p3-smoke-energy
    where: 'Problem 3(a), solution: the thermal kinetic energy at 300 K'
    inputs: {kk: 1.38e-23 J/K, temp: 300 K}
    formula: 1.5*kk*temp
    expected: 6.21e-21 J
    shown: ['$K = 6.21\times 10^{-21}$ J']
    source: {cite: mit, at: 'Problem 3(a), p. 2'}
    origin: page-own

  - id: p3-smoke-momentum
    where: 'Problem 3(a), solution: the momentum of the smoke particle'
    inputs: {kk: 1.38e-23 J/K, temp: 300 K, msm: 1e-18 kg}
    formula: sqrt(3*msm*kk*temp)
    expected: 1.11e-19 kg*m/s
    shown: ['$p = 1.11\times 10^{-19}$ kg m/s']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-smoke
    answer: p3-smoke
    where: 'Problem 3(a), answer box: the de Broglie wavelength of the smoke particle'
    inputs: {hh: 6.6e-34 J*s, kk: 1.38e-23 J/K, temp: 300 K, msm: 1e-18 kg}
    formula: hh/sqrt(3*msm*kk*temp)
    expected: 5.92e-15 m
    shown: ['id="p3-smoke"']
    source: {cite: mit, at: 'Problem 3(a), p. 2'}
    origin: page-own

  # Independent route: speed first (from K = m v^2 / 2), then h/(m v).
  - id: p3-smoke-via-speed
    where: 'Problem 3(a), solution: the same wavelength through the speed, sqrt(2K/m)'
    inputs: {hh: 6.6e-34 J*s, kin: 6.21e-21 J, msm: 1e-18 kg}
    formula: hh/(msm*sqrt(2*kin/msm))
    expected: 5.92e-15 m
    shown: ['so $\lambda = 5.92\times 10^{-15}$ m']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-rb-mass
    where: 'Problem 3(a), solution: the mass of a rubidium-87 atom'
    inputs: {amu: 1.66e-27 kg}
    formula: 87*amu
    expected: 1.444e-25 kg
    shown: ['= 1.444\times 10^{-25}$ kg']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (the atomic mass unit is ours)'}
    origin: page-own

  - id: p3-rb-energy
    where: 'Problem 3(a), solution: the thermal kinetic energy at 100 microkelvin'
    inputs: {kk: 1.38e-23 J/K, temp: 1.0e-4 K}
    formula: 1.5*kk*temp
    expected: 2.07e-27 J
    shown: ['$K = 2.07\times 10^{-27}$ J']
    source: {cite: mit, at: 'Problem 3(a), p. 2'}
    origin: page-own

  - id: p3-rb-momentum
    where: 'Problem 3(a), solution: the momentum of the atom'
    inputs: {kk: 1.38e-23 J/K, temp: 1.0e-4 K, amu: 1.66e-27 kg}
    formula: sqrt(3*87*amu*kk*temp)
    expected: 2.45e-26 kg*m/s
    shown: ['$p = 2.45\times 10^{-26}$ kg m/s']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-rb
    answer: p3-rb
    where: 'Problem 3(a), answer box: the de Broglie wavelength of the rubidium atom'
    inputs: {hh: 6.6e-34 J*s, kk: 1.38e-23 J/K, temp: 1.0e-4 K, amu: 1.66e-27 kg}
    formula: hh/sqrt(3*87*amu*kk*temp)
    expected: 2.70e-8 m
    shown: ['id="p3-rb"']
    source: {cite: mit, at: 'Problem 3(a), p. 2'}
    origin: page-own

  - id: p3-rb-via-speed
    where: 'Problem 3(a), solution: the same wavelength through the speed, sqrt(2K/m)'
    inputs: {hh: 6.6e-34 J*s, kin: 2.07e-27 J, mrb: 1.4442e-25 kg}
    formula: hh/(mrb*sqrt(2*kin/mrb))
    expected: 2.70e-8 m
    shown: ['so $\lambda = 2.70\times 10^{-8}$ m, or 27 nm']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-smoke-speed
    where: 'Problem 3(a), check: the speed of the smoke particle'
    inputs: {kin: 6.21e-21 J, msm: 1e-18 kg}
    formula: sqrt(2*kin/msm)
    expected: 0.11 m/s
    shown: ['0.11 m/s for the smoke particle']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-rb-speed
    where: 'Problem 3(a), check: the speed of the atom'
    inputs: {kin: 2.07e-27 J, mrb: 1.4442e-25 kg}
    formula: sqrt(2*kin/mrb)
    expected: 0.17 m/s
    shown: ['0.17 m/s for the atom']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-smoke-size-ratio
    where: 'Problem 3(a), solution: the diameter of the smoke particle over its wavelength (order of magnitude)'
    formula: 1e-7/5.92e-15
    expected: '1e7'
    tolerance: 100%
    shown: ['some $10^{7}$ times smaller than its own diameter']
    source: {cite: mit, at: 'Problem 3(a), p. 2 (our own solution)'}
    origin: page-own

  - id: p3-e400
    answer: p3-e400
    where: 'Problem 3(b), answer box: the energy of a 400 nm photon in eV'
    inputs: {hh: 6.6e-34, cl: 2.998e8, ev: 1.602e-19}
    formula: hh*cl/400e-9/ev
    expected: '3.09'
    shown: ['id="p3-e400"']
    source: {cite: reading1, at: 'notes p. 6, eq. (3.1)'}
    origin: page-own

  - id: p3-e700
    answer: p3-e700
    where: 'Problem 3(b), answer box: the energy of a 700 nm photon in eV'
    inputs: {hh: 6.6e-34, cl: 2.998e8, ev: 1.602e-19}
    formula: hh*cl/700e-9/ev
    expected: '1.76'
    shown: ['id="p3-e700"']
    source: {cite: reading1, at: 'notes p. 6, eq. (3.1)'}
    origin: page-own

  - id: p3-nu400
    where: 'Problem 3(b), solution: the frequency of 400 nm light'
    inputs: {lam: 400 nm, cl: 2.998e8 m/s}
    formula: cl/lam
