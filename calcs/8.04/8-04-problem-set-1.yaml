    origin: page-own

  # Independent route: the real part of a product (p + iq)(a + ib) is p a - q b; for i, p = 0 and q = 1.
  # A second route: the real part of r e^(i(theta + pi/2)) with r and theta such that a = r cos, b = r sin.
  - id: p4-reiz
    kind: identity
    answer: p4-reiz
    where: 'Problem 4(c), answer box: against the product rule for real parts with the factor 0 + 1i'
    formula: -b
    equals: 0*a - 1*b
    samples:
      a: [0.5, 1, 2, 3, 1.5]
      b: [3, 0.5, 1, 2, 2.5]
    tolerance: 1e-12
    shown: ['id="p4-reiz"']
    source: {cite: mit, at: 'Problem 4(c), p. 3'}
    origin: page-own

  - id: p4-rotation
    kind: identity
    where: 'Problem 4(c), check: with a = r cos(theta) and b = r sin(theta), the real part of r e^(i(theta + pi/2)) is -b and the imaginary part is a'
    formula: rr*cos(th + pi/2) + 7*rr*sin(th + pi/2)
    equals: -rr*sin(th) + 7*rr*cos(th)
    samples:
