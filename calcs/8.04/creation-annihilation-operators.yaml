# Calculations on content/year-2/8.04/creation-annihilation-operators.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes for Lectures 14–15, with the page's own example.

page: content/year-2/8.04/creation-annihilation-operators.mdx
calcs:
  - id: ground-state-norm
    where: '∫ ψ0² dx = 1 with ψ0 = (mω/πħ)^(1/4) e^(−mωx²/2ħ), mω/ħ = 2.3'
    inputs: {}
    formula: 'sqrt(2.3/pi)*integrate("exp(-2.3*x**2)", "x", -20, 20)'
    expected: '1'
    tolerance: 1e-6
    shown: ['\left(\frac{m\omega}{\pi\hbar}\right)^{1/4}']
    source: {cite: mit, at: 'notes p. 3, eq. (1.22)'}
    origin: mit

  - id: ground-state-equation
    kind: identity
    where: '(x + (ħ/mω) d/dx) ψ0 = 0 for ψ0 = e^(−s x²/2), s = mω/ħ'
    formula: x*exp(-s*x**2/2) + (1/s)*(-s*x*exp(-s*x**2/2))
    equals: 0*x
    samples: {x: [0.3, 1.2, -0.8], s: [1.0, 2.3, 0.4]}
    tolerance: 1e-12
    shown: ['E_0 = \frac12\hbar\omega" cite']
    source: {cite: mit, at: 'notes p. 3, eq. (1.21)'}
    origin: mit

  - id: x-variance
    where: '(Δx)² in ψ0 from the Gaussian: ∫ x² ψ0² dx = (ħ/mω)/2 with ħ/mω = 1/2.3'
    inputs: {}
    formula: 'sqrt(2.3/pi)*integrate("x**2*exp(-2.3*x**2)", "x", -20, 20)'
    expected: '0.2174'
    tolerance: 0.0001
    shown: ['\left(\Delta x\right)_n^2 = \frac{\hbar}{m\omega}\left(n + \frac12\right)']
    source: {cite: mit, at: 'notes p. 8, eq. (2.31)'}
    origin: mit

  - id: quiz-ladder
    where: 'quiz 3: √4'
    inputs: {}
    formula: sqrt(4)
    expected: '2'
    tolerance: 1e-12
    shown: ['= \\sqrt4\\,\\psi_3 = 2\\psi_3$']
    source: {cite: mit, at: 'notes p. 7, eq. (2.25)'}
    origin: page-own

  - id: ex-dx0-squared
    where: 'example (b): 197.33² / (2 × 511000 × 1.0) nm²'
    inputs: {}
    formula: 197.33**2/(2*511000*1.0)
    expected: '0.0381'
    tolerance: 0.00005
    shown: ['\approx 0.0381$ nm²']
    source: {cite: mit, at: 'notes p. 8, eq. (2.31)'}
    origin: page-own

  - id: ex-dx0
    where: 'example (b): √0.0381 nm'
    inputs: {}
    formula: sqrt(197.33**2/(2*511000*1.0))
    expected: '0.195'
    tolerance: 0.0005
    shown: ['$(\Delta x)_0 \approx 0.195$ nm']
    source: {cite: mit, at: 'notes p. 8, eq. (2.31)'}
    origin: page-own

  - id: ex-dx3
    where: 'example (b): √7 × 0.1952 nm'
    inputs: {}
    formula: sqrt(7)*sqrt(197.33**2/(2*511000*1.0))
    expected: '0.516'
    tolerance: 0.0005
    shown: ['$(\Delta x)_3 \approx 0.516$ nm']
    source: {cite: mit, at: 'notes p. 8, eq. (2.31)'}
    origin: page-own

  - id: ex-uncertainty-product
    kind: identity
    where: 'example (a): √((ħ/mω)(n + ½)) √(mωħ(n + ½)) = ħ(n + ½)'
    formula: sqrt((h/(m*w))*(n + 0.5))*sqrt(m*w*h*(n + 0.5))
    equals: h*(n + 0.5)
    samples: {h: [1.0, 0.3], m: [2.0, 1.0], w: [0.5, 3.0], n: [0, 3]}
    tolerance: 1e-12
    shown: ['$\Delta x\,\Delta p = \hbar\left(n + \frac12\right)$']
    source: {cite: mit, at: 'notes p. 8, eq. (2.31)'}
    origin: page-own

  - id: ex-virial
    kind: identity
    where: 'example (c): ½ m ω² (ħ/mω)(n + ½) = ½ ħω(n + ½)'
    formula: 0.5*m*w**2*(h/(m*w))*(n + 0.5)
    equals: 0.5*h*w*(n + 0.5)
    samples: {h: [1.0, 0.3], m: [2.0, 1.0], w: [0.5, 3.0], n: [0, 3]}
    tolerance: 1e-12
    shown: ['= \frac12\hbar\omega\left(n + \frac12\right) = \frac12E_n$']
    source: {cite: mit, at: 'notes p. 8, eq. (2.31)'}
    origin: page-own
