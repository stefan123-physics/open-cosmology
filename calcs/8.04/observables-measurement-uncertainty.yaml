# Calculations on content/year-2/8.04/observables-measurement-uncertainty.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 9, with the page's own example.

page: content/year-2/8.04/observables-measurement-uncertainty.mdx
calcs:
  - id: quiz-expectation
    where: 'quiz 2: (1/5)·1 + (4/5)·4'
    inputs: {}
    formula: 1/5*1 + 4/5*4
    expected: '3.4'
    tolerance: 1e-9
    shown: ['\\frac15 \\times 1 + \\frac45 \\times 4 = 3.4$']
    source: {cite: mit, at: 'notes p. 4, eq. (1.26)'}
    origin: page-own

  - id: variance-identity
    kind: identity
    where: 'Σp(Q − ⟨Q⟩)² = Σp Q² − ⟨Q⟩² for two values with probabilities p, 1 − p'
    formula: p*(a - (p*a + (1 - p)*b))**2 + (1 - p)*(b - (p*a + (1 - p)*b))**2
    equals: p*a**2 + (1 - p)*b**2 - (p*a + (1 - p)*b)**2
    samples: {p: [0.2, 0.5, 0.9], a: [1.0, -2.0, 3.5], b: [4.0, 0.5, -1.0]}
    tolerance: 1e-12
    shown: ['\left(\Delta Q\right)^2 = \langle Q^2\rangle - \langle Q\rangle^2 \ge 0']
    source: {cite: mit, at: 'notes p. 6, eq. (2.40)'}
    origin: mit

  - id: ex-normalization
    where: 'example (a): (2/L)∫cos²(2πx/L) = 1 times 0.36 plus (2/L)∫sin²(4πx/L) times 0.64, L = 1'
    inputs: {}
    formula: '0.36*2*integrate("cos(2*pi*x)**2", "x", 0, 1) + 0.64*2*integrate("sin(4*pi*x)**2", "x", 0, 1)'
    expected: '1'
    tolerance: 1e-6
    shown: ['$0.36 + 0.64 = 1$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.20)'}
    origin: page-own

  - id: ex-orthogonal
    where: 'example (a): ∫ cos(2πx) sin(4πx) dx over [0, 1] = 0'
    inputs: {}
    formula: 'integrate("cos(2*pi*x)*sin(4*pi*x)", "x", 0, 1)'
    expected: '0'
    tolerance: 1e-9
    shown: ['so they are orthogonal on $[0, L]$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.12)'}
    origin: page-own

  - id: ex-prob-1
    where: 'example (b): |0.6/√2|²'
    inputs: {}
    formula: (0.6/sqrt(2))**2
    expected: '0.18'
    tolerance: 1e-9
    shown: ['probability $0.36/2 = 0.18$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.21)'}
    origin: page-own

  - id: ex-prob-2
    where: 'example (b): |0.8/√2|²'
    inputs: {}
    formula: (0.8/sqrt(2))**2
    expected: '0.32'
    tolerance: 1e-9
    shown: ['probability $0.64/2 = 0.32$']
    source: {cite: mit, at: 'notes p. 3, eq. (1.21)'}
    origin: page-own

  - id: ex-coefficient
    where: 'example (b): projecting the state on ψ₁ = e^{2πix}/√L, L = 1: (1/√L)∫ e^{−2πix} √2 · 0.6 cos(2πx) dx = 0.6/√2 (real part)'
    inputs: {}
    formula: 'integrate("cos(2*pi*x)*sqrt(2)*0.6*cos(2*pi*x)", "x", 0, 1)'
    expected: '0.4243'
    tolerance: 0.0001
    shown: ['\Psi = \frac{0.6}{\sqrt2}\left(\psi_1 + \psi_{-1}\right)']
    source: {cite: mit, at: 'notes p. 3, eq. (1.17)'}
    origin: page-own

  - id: ex-p2
    where: 'example (c): 0.36 × 1 + 0.64 × 4'
    inputs: {}
    formula: 0.36*1 + 0.64*4
    expected: '2.92'
    tolerance: 1e-9
    shown: ['\left(0.36 \times 1 + 0.64 \times 4\right) = 2.92']
    source: {cite: mit, at: 'notes p. 6, eq. (2.42)'}
    origin: page-own

  - id: ex-dp
    where: 'example (c): √2.92'
    inputs: {}
    formula: sqrt(2.92)
    expected: '1.71'
    tolerance: 0.005
    shown: ['\approx 1.71\,\frac{2\pi\hbar}{L}$']
    source: {cite: mit, at: 'notes p. 6, eq. (2.42)'}
    origin: page-own
