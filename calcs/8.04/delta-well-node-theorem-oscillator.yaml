# Calculations on content/year-2/8.04/delta-well-node-theorem-oscillator.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 13, with the page's own example.

page: content/year-2/8.04/delta-well-node-theorem-oscillator.mdx
calcs:
  - id: delta-energy
    kind: identity
    where: '−ħ²κ²/2m with κ = mα/ħ² equals −mα²/(2ħ²)'
    formula: -(h**2*(m*al/h**2)**2)/(2*m)
    equals: -m*al**2/(2*h**2)
    samples: {h: [1.0, 0.6], m: [1.0, 2.5], al: [0.7, 3.0]}
    tolerance: 1e-12
    shown: ['= -\frac12\,\frac{m\alpha^2}{\hbar^2}']
    source: {cite: mit, at: 'notes p. 4, eq. (1.17)'}
    origin: mit

  - id: hermite-H2
    kind: identity
    where: 'H2 = 4u² − 2 solves H″ − 2uH′ + 4H = 0'
    formula: 8 - 2*u*8*u + 4*(4*u**2 - 2)
    equals: 0*u
    samples: {u: [0.3, 1.7, -2.2]}
    tolerance: 1e-12
    shown: ['$H_2'''' = 8$ and $-2uH_2'' = -16u^2$']
    source: {cite: mit, at: 'notes p. 12, eqs. (3.66)–(3.67)'}
    origin: page-own

  - id: hermite-H3
    kind: identity
    where: 'H3 = 8u³ − 12u solves H″ − 2uH′ + 6H = 0'
    formula: 48*u - 2*u*(24*u**2 - 12) + 6*(8*u**3 - 12*u)
    equals: 0*u
    samples: {u: [0.3, 1.7, -2.2]}
    tolerance: 1e-12
    shown: ['H_3 = 8u^3 - 12u" cite']
    source: {cite: mit, at: 'notes p. 12, eq. (3.67)'}
    origin: mit

  - id: ground-state-equation
    kind: identity
    where: 'ψ0 = e^(−u²/2) solves ψ″ = (u² − 1)ψ, i.e. ε = 1 and E0 = ħω/2 (second derivative by finite differences)'
    formula: (exp(-(u + 1e-4)**2/2) - 2*exp(-u**2/2) + exp(-(u - 1e-4)**2/2))/1e-8
    equals: (u**2 - 1)*exp(-u**2/2)
    samples: {u: [0.0, 0.7, 1.3, 2.1]}
    tolerance: 1e-6
    shown: ['E_n = \hbar\omega\left(n + \frac12\right)']
    source: {cite: mit, at: 'notes p. 12, eq. (3.64)'}
    origin: mit

  - id: oscillator-norm
    where: 'plot: ∫ (π^(−1/4) √2 u e^(−u²/2))² du = 1 (n = 1 normalization)'
    inputs: {}
    formula: 'integrate("2/sqrt(pi)*u**2*exp(-u**2)", "u", -12, 12)'
    expected: '1'
    tolerance: 1e-6
    shown: ['standard normalization 1/√(2ⁿ n! √π)']
    source: {cite: mit, at: 'notes p. 12, eq. (3.70)'}
    origin: page-own

  - id: ex-binding
    where: 'example (a): 511000 × 1.0² / (2 × 197.33²) eV'
    inputs: {}
    formula: 511000*1.0**2/(2*197.33**2)
    expected: '6.56'
    tolerance: 0.005
    shown: ['\approx 6.56$ eV']
    source: {cite: mit, at: 'notes p. 4, eq. (1.17)'}
    origin: page-own

  - id: ex-decay-length
    where: 'example (a): 197.33² / (511000 × 1.0) nm'
    inputs: {}
    formula: 197.33**2/(511000*1.0)
    expected: '0.0762'
    tolerance: 0.00005
    shown: ['\approx 0.0762$ nm']
    source: {cite: mit, at: 'notes p. 4, eq. (1.16)'}
    origin: page-own

  - id: ex-within
    where: 'example (a): 1 − e^(−2)'
    inputs: {}
    formula: 1 - exp(-2)
    expected: '0.865'
    tolerance: 0.0005
    shown: ['= 1 - e^{-2} \approx 0.865$']
    source: {cite: mit, at: 'notes p. 4'}
    origin: page-own

  - id: ex-recursion
    where: 'example (b): a2 = (1 − 5)/2 with a0 = 1'
    inputs: {}
    formula: (2*0 + 1 - 5)/((0 + 2)*(0 + 1))
    expected: '-2'
    tolerance: 1e-12
    shown: ['a_2 = \frac{1 - 5}{2}a_0 = -2$']
    source: {cite: mit, at: 'notes p. 10, eq. (3.52)'}
    origin: page-own

  - id: ex-levels
    where: 'example (c) and quiz 4: 0.50 × (2 + ½) eV'
    inputs: {}
    formula: 0.50*(2 + 0.5)
    expected: '1.25'
    tolerance: 1e-9
    shown: ['$0.50 \\times 2.5 = 1.25$ eV']
    source: {cite: mit, at: 'notes p. 12, eq. (3.64)'}
    origin: page-own
