# Calculations on content/year-2/8.04/photoelectric-compton-de-broglie.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 3, with the page's own example.

page: content/year-2/8.04/photoelectric-compton-de-broglie.mdx
calcs:
  - id: hc
    where: 'hc = 2π × 197.33 eV nm'
    inputs: {}
    formula: 2*pi*197.33
    expected: '1239.8'
    tolerance: 0.1
    shown: ['$hc = 2\pi\hbar c \approx 1239.8$ eV nm']
    source: {cite: mit, at: 'notes p. 2, eq. (1.3)'}
    origin: page-own

  - id: hbar-c
    kind: fact
    where: 'ħc as quoted in the notes'
    value: '197.33 MeV fm'
    shown: ['\hbar c = 197.33\ \text{eV}\,\text{nm}']
    source: {cite: mit, at: 'notes p. 2, eq. (1.3)'}
    origin: mit

  - id: unit-conversion
    where: 'MeV fm = 10^6 eV × 10^-15 m = 10^-9 eV m = eV nm'
    inputs: {}
    formula: 1e6*1e-15
    expected: '1e-9'
    tolerance: 1e-20
    shown: ['$10^6 \times 10^{-15} = 10^{-9}$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.3)'}
    origin: page-own

  - id: compton-electron
    where: 'λ_C(e) = 2π × 197.33 / 511000 nm'
    inputs: {}
    formula: 2*pi*197.33/511000
    expected: '0.002426'
    tolerance: 0.0000005
    shown: ['= 0.002426\ \text{nm}']
    source: {cite: mit, at: 'notes p. 3, eq. (1.12)'}
    origin: mit

  - id: compton-vs-bohr
    where: 'Bohr radius / Compton wavelength = 53 / 2.426 (about 20)'
    inputs: {}
    formula: 53/2.426
    expected: '21.8'
    tolerance: 0.1
    shown: ['about 20 times smaller than the Bohr radius']
    source: {cite: mit, at: 'notes p. 3'}
    origin: mit

  - id: compton-vs-proton
    where: 'Compton wavelength / proton size = 2426 fm / 1 fm (about two thousand)'
    inputs: {}
    formula: 2426/1
    expected: '2426'
    tolerance: 1
    shown: ['about two thousand times the size of a proton']
    source: {cite: mit, at: 'notes p. 3'}
    origin: mit

  - id: classical-radius
    where: 'classical electron radius e²/(m c²) = α ħc / (m c²) = 197.33 MeV fm /137.036/0.511 MeV, in fm'
    inputs: {}
    formula: 197.327/137.036/0.511
    expected: '2.818'
    tolerance: 0.002
    shown: ['is about 2.8 fm']
    source: {cite: mit, at: 'notes p. 4'}
    origin: mit

  - id: compton-max
    where: 'maximum shift 2 λ_C = 2 × 2.426 pm'
    inputs: {}
    formula: 2*2.426
    expected: '4.852'
    tolerance: 0.001
    shown: ['2λ_C ≈ 4.85 pm for a photon', '$2\\lambda_C = 2 \\times 2.426 \\approx 4.85$ pm']
    source: {cite: mit, at: 'notes p. 5, eq. (2.19)'}
    origin: page-own

  - id: compton-90
    kind: identity
    where: 'at θ = 90°, 1 − cos θ = 1'
    formula: 1 - cos(pi/2) + 0*q
    equals: 1 + 0*q
    samples: {q: [0]}
    tolerance: 1e-12
    shown: ['λ_C at 90°']
    source: {cite: mit, at: 'notes p. 5, eq. (2.20)'}
    origin: mit

  - id: molybdenum-energy
    where: 'E = hc/λ for λ = 0.0709 nm, in keV'
    inputs: {}
    formula: 1239.84/0.0709/1000
    expected: '17.49'
    tolerance: 0.01
    shown: ['$E \approx 17.5$ keV']
    source: {cite: mit, at: 'notes p. 5, eq. (2.21)'}
    origin: mit

  - id: compton-measured-shift
    where: '0.0731 − 0.0709 nm, in pm'
    inputs: {}
    formula: (0.0731 - 0.0709)*1000
    expected: '2.2'
    tolerance: 0.001
    shown: ['a shift of about 2.2 pm']
    source: {cite: mit, at: 'notes p. 5'}
    origin: mit

  - id: molecule-mass
    where: '10,000 amu in electron masses (1822.9 each): about 18 million (the notes round to 20 million; not quoted on the page)'
    inputs: {}
    formula: 10000*1822.888
    expected: '1.823e7'
    tolerance: 1e4
    shown: ['masses above 10,000 atomic mass units']
    source: {cite: mit, at: 'notes p. 6'}
    origin: mit

  - id: quiz-threshold
    where: 'quiz 2: λ₀ = 1239.8/2.30 nm'
    inputs: {}
    formula: 1239.8/2.30
    expected: '539'
    tolerance: 0.5
    shown: ['$\\lambda_0 = hc/W = 1239.8/2.30 \\approx 539$ nm']
    source: {cite: mit, at: 'notes p. 2, eq. (1.2)'}
    origin: page-own

  - id: ex-photon-energy
    where: 'example (a): 1239.8/400 eV'
    inputs: {}
    formula: 1239.8/400
    expected: '3.10'
    tolerance: 0.005
    shown: ['$hc/\lambda = 1239.8/400 \approx 3.10$ eV']
    source: {cite: mit, at: 'notes p. 2, eq. (1.1)'}
    origin: page-own

  - id: ex-kinetic
    where: 'example (a): 3.10 − 2.30 eV'
    inputs: {}
    formula: 3.10 - 2.30
    expected: '0.80'
    tolerance: 1e-9
    shown: ['$3.10 - 2.30 = 0.80$ eV']
    source: {cite: mit, at: 'notes p. 2, eq. (1.1)'}
    origin: page-own

  - id: ex-beta
    where: 'example (a): v/c = sqrt(2 × 0.80/511000)'
    inputs: {}
    formula: sqrt(2*0.80/511000)
    expected: '1.77e-3'
    tolerance: 0.005e-3
    shown: ['$v/c \approx 1.77 \times 10^{-3}$']
    source: {cite: mit, at: 'notes p. 2'}
    origin: page-own

  - id: ex-speed
    where: 'example (a): v = c sqrt(1.6/511000), km/s'
    inputs: {}
    formula: 299792.458*sqrt(2*0.80/511000)
    expected: '530'
    tolerance: 1
    shown: ['$v \approx 530$ km/s']
    source: {cite: mit, at: 'notes p. 2'}
    origin: page-own

  - id: ex-compton
    where: 'example (b): 2.426 (1 − cos 60°) pm'
    inputs: {}
    formula: 2.426*(1 - cos(pi/3))
    expected: '1.21'
    tolerance: 0.005
    shown: ['$\lambda_C(1 - \cos 60°) = 2.426 \times 0.5 \approx 1.21$ pm']
    source: {cite: mit, at: 'notes p. 5, eq. (2.18)'}
    origin: page-own

  - id: ex-compton-final
    where: 'example (b): 0.0500 + 0.001213 nm'
    inputs: {}
    formula: 0.0500 + 0.002426*(1 - cos(pi/3))
    expected: '0.0512'
    tolerance: 0.00005
    shown: ['$\lambda_f \approx 0.0512$ nm']
    source: {cite: mit, at: 'notes p. 5, eq. (2.18)'}
    origin: page-own

  - id: ex-electron-pc
    where: 'example (c): pc = sqrt(2 × 511000 × 100) eV'
    inputs: {}
    formula: sqrt(2*511000*100)
    expected: '10110'
    tolerance: 5
    shown: ['\sqrt{2 \times 511{,}000 \times 100} \approx 10{,}110$ eV']
    source: {cite: mit, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  - id: ex-electron-lambda
    where: 'example (c): 1239.8/10110 nm'
    inputs: {}
    formula: 1239.8/sqrt(2*511000*100)
    expected: '0.123'
    tolerance: 0.0005
    shown: ['$\lambda = hc/(pc) = 1239.8/10{,}110 \approx 0.123$ nm']
    source: {cite: mit, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  - id: ex-ball-p
    where: 'example (c): 0.145 × 40 kg m/s'
    inputs: {}
    formula: 0.145*40
    expected: '5.8'
    tolerance: 1e-9
    shown: ['$p = 0.145 \times 40 = 5.8$ kg m/s']
    source: {cite: mit, at: 'notes p. 6'}
    origin: page-own

  - id: ex-ball-lambda
    where: 'example (c): 6.626e-34/5.8 m'
    inputs: {}
    formula: 6.626e-34/5.8
    expected: '1.1e-34'
    tolerance: 0.05e-34
    shown: ['\approx 1.1 \times 10^{-34}$ m']
    source: {cite: mit, at: 'notes p. 6, eq. (3.23)'}
    origin: page-own

  - id: carbon-electron-mass-ratio
    where: 'carbon-12 atom mass in electron masses: 12 × 1822.888 (notes: several thousand)'
    inputs: {}
    formula: 12*1822.888
    expected: '21900'
    tolerance: 50
    shown: ['$12 \times 1823 \approx 21{,}900$']
    source: {cite: mit, at: 'notes p. 6'}
    origin: slip
