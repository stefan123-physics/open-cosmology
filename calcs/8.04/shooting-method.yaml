# Calculations on content/year-2/8.04/shooting-method.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 12 section 4, with the page's own square-well example.

page: content/year-2/8.04/shooting-method.mdx
calcs:
  - id: matching
    kind: identity
    where: 'B + C = cos ξ and η(B − C) = −ξ sin ξ at u = 1'
    formula: (cos(q) - (q/sqrt(10.5 - q**2))*sin(q))/2 + (cos(q) + (q/sqrt(10.5 - q**2))*sin(q))/2
    equals: cos(q)
    samples: {q: [0.9, 1.2, 1.5]}
    tolerance: 1e-12
    shown: ['C = \frac12\left(\cos\xi + \frac{\xi}{\eta}\sin\xi\right)']
    source: {cite: notes11, at: 'p. 8, eq. (2.32)'}
    origin: page-own

  - id: matching-slope
    kind: identity
    where: 'η(B − C) = −ξ sin ξ'
    formula: sqrt(10.5 - q**2)*((cos(q) - (q/sqrt(10.5 - q**2))*sin(q))/2 - (cos(q) + (q/sqrt(10.5 - q**2))*sin(q))/2)
    equals: -q*sin(q)
    samples: {q: [0.9, 1.2, 1.5]}
    tolerance: 1e-12
    shown: ['B = \frac12\left(\cos\xi - \frac{\xi}{\eta}\sin\xi\right)']
    source: {cite: notes11, at: 'p. 8, eq. (2.32)'}
    origin: page-own

  - id: ex-eta
    where: 'example (a): √(10.5 − 1.15²)'
    inputs: {}
    formula: sqrt(10.5 - 1.15**2)
    expected: '3.029'
    tolerance: 0.0005
    shown: ['\approx 3.029$']
    source: {cite: notes11, at: 'p. 7, eq. (2.27)'}
    origin: page-own

  - id: ex-B-up
    where: 'example (a): B at ξ = 1.15'
    inputs: {}
    formula: (cos(1.15) - (1.15/sqrt(10.5 - 1.15**2))*sin(1.15))/2
    expected: '0.031'
    tolerance: 0.0005
    shown: ['\approx +0.031$']
    source: {cite: mit, at: 'notes p. 11'}
    origin: page-own

  - id: ex-B-down
    where: 'example (a): B at ξ = 1.25'
    inputs: {}
    formula: (cos(1.25) - (1.25/sqrt(10.5 - 1.25**2))*sin(1.25))/2
    expected: '-0.041'
    tolerance: 0.0005
    shown: ['$B \approx -0.041$']
    source: {cite: mit, at: 'notes p. 11'}
    origin: page-own

  - id: ex-root
    where: 'example (b): B = 0 between 1.15 and 1.25'
    inputs: {}
    formula: solve('cos(q) - (q/sqrt(10.5 - q**2))*sin(q)', 'q', 1.15, 1.25)
    expected: '1.1936'
    tolerance: 0.00005
    shown: ['converges to $\xi \approx 1.1936$']
    source: {cite: mit, at: 'notes pp. 11–12'}
    origin: page-own

  - id: ex-energy-fraction
    where: 'example (b): (10.5 − 1.1936²)/10.5'
    inputs: {}
    formula: (10.5 - 1.19357**2)/10.5
    expected: '0.864'
    tolerance: 0.0005
    shown: ['\approx 0.864$']
    source: {cite: notes11, at: 'p. 7, eq. (2.29)'}
    origin: page-own

  - id: ex-odd-root
    where: 'example (c): odd shot, sin ξ + (ξ/η) cos ξ = 0 on (π/2, π)'
    inputs: {}
    formula: solve('sin(q) + (q/sqrt(10.5 - q**2))*cos(q)', 'q', 1.6, 3.1)
    expected: '2.336'
    tolerance: 0.0005
    shown: ['at $\xi \approx 2.336$']
    source: {cite: mit, at: 'notes p. 12, eq. (4.4)'}
    origin: page-own

  - id: plot-crossover
    where: 'plot caption: B changes sign near ξ ≈ 1.19'
    inputs: {}
    formula: solve('cos(q) - (q/sqrt(10.5 - q**2))*sin(q)', 'q', 1.0, 1.5)
    expected: '1.19'
    tolerance: 0.005
    shown: ['Below ξ ≈ 1.19 the shot']
    source: {cite: mit, at: 'notes p. 11'}
    origin: page-own
