  # ---- Problem 6: virial theorem
  # Independent of the virial theorem: in units ħ = m = e = 1 the state with l = n − 1 has u = r^n e^(−r/n), and
  # <v²> = 2<T> = ∫(u′² + l(l+1)u²/r²)/∫u², a speed in units of alpha c.

  - id: p6-v
    kind: identity
    answer: p6-v
    where: 'Problem 6(c), answer box: the root-mean-square speed from the kinetic-energy integral of the states with l = n − 1'
    formula: |-
      alpha/n
    equals: |-
      alpha*sqrt(integrate("deriv('s**n*exp(-s/n)', 's', r)**2 + n*(n - 1)*r**(2*n - 2)*exp(-2*r/n)", 'r', 0, 80*n)/integrate('r**(2*n)*exp(-2*r/n)', 'r', 0, 80*n))
    samples:
      alpha: [0.0073, 0.01, 0.05, 0.1, 0.02]
      n: [1, 2, 3, 4, 2]
    tolerance: 1e-5
    shown: ['id="p6-v"', '<Formula label="Root-mean-square speed of the electron"']
    source: {cite: mit, at: 'Problem 6(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p6-v-2s
    where: 'Problem 6(c), check: the 2s state, u = r(2 − r)e^(−r/2), has the same speed alpha c/2 as the 2p state (value in units of alpha c)'
    formula: |-
      sqrt(integrate("deriv('s*(2 - s)*exp(-s/2)', 's', r)**2", 'r', 0, 120)/integrate('(r*(2 - r)*exp(-r/2))**2', 'r', 0, 120))
    expected: '0.5000'
    shown: ['The result does not depend on $l$ or $m$, only on $n$']
    source: {cite: mit, at: 'Problem 6(c), p. 3 (our own solution)'}
    origin: page-own

  - id: p6-vz
    kind: identity
    answer: p6-vz
    where: 'Problem 6(c), answer box: the ground state u = r e^(−Zr) of a nucleus with Z protons, kinetic-energy integral'
    formula: |-
      Z*alpha
    equals: |-
      alpha*sqrt(integrate("deriv('s*exp(-Z*s)', 's', r)**2", 'r', 0, 60/Z)/integrate('r**2*exp(-2*Z*r)', 'r', 0, 60/Z))
    samples:
      alpha: [0.0073, 0.01, 0.005, 0.008, 0.006]
      Z: [1, 2, 26, 92, 10]
    tolerance: 1e-5
    shown: ['id="p6-vz"', '<Formula label="Root-mean-square speed of the electron"']
    source: {cite: mit, at: 'Problem 6(c), p. 3 (our own solution)'}
    origin: page-own

