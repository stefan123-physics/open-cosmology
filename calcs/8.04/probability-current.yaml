# Calculations on content/year-2/8.04/probability-current.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) lecture notes, Chapter 6, with the page's own example.

page: content/year-2/8.04/probability-current.mdx
calcs:
  - id: quiz-segment
    where: 'quiz 3: −J(b) + J(a) = −0.5 + 0.2'
    inputs: {}
    formula: -0.5 + 0.2
    expected: '-0.3'
    tolerance: 1e-9
    shown: ['$dP_{ab}/dt = -J(b) + J(a) = -0.5 + 0.2 = -0.3$ per second']
    source: {cite: mit, at: 'notes p. 6, eq. (3.13)'}
    origin: page-own

  - id: quiz-normalize
    where: 'quiz 1: 1/sqrt(4) squared = 1/4'
    inputs: {}
    formula: (1/sqrt(4))**2
    expected: '0.25'
    tolerance: 1e-12
    shown: ['$\\Psi/\\sqrt N = \\Psi/2$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.10)'}
    origin: page-own

  - id: ex-norm-integral
    where: 'example (a): ∫ e^(−2|x|/a) dx = a (a = 1.7)'
    inputs: {a: 1.7}
    formula: 'integrate("exp(-2*abs(x)/a)", "x", -60, 60)'
    expected: '1.7'
    tolerance: 1e-6
    shown: ['= 2 \times \frac{a}{2} = a$']
    source: {cite: mit, at: 'notes p. 2, eq. (1.7)'}
    origin: page-own

  - id: ex-within-a
    where: 'example (a) and plot: (2/a)∫_0^a e^(−2x/a) dx = 1 − e^(−2)'
    inputs: {a: 1.0}
    formula: '(2/a)*integrate("exp(-2*x/a)", "x", 0, a)'
    expected: '0.865'
    tolerance: 0.0005
    shown: ['= 1 - e^{-2} \approx 0.865$', 'is 1 − e^(−2) ≈ 0.865']
    source: {cite: mit, at: 'notes p. 6, eq. (3.12)'}
    origin: page-own

  - id: plot-point
    where: 'plot: density at x = ±a is e^(−2)'
    inputs: {}
    formula: exp(-2)
    expected: '0.1353'
    tolerance: 0.0001
    shown: ['y: 0.1353, label: "x = a"']
    source: {cite: mit, at: 'notes p. 6'}
    origin: page-own

  - id: ex-velocity
    where: 'example (b): ħk/m_e for k = 1.0e10 /m'
    inputs: {}
    formula: 1.0546e-34*1.0e10/9.109e-31
    expected: '1.16e6'
    tolerance: 0.005e6
    shown: ['$\hbar k/m_e \approx 1.16 \times 10^6$ m/s', '$J \approx 1.16 \times 10^6$ per second']
    source: {cite: mit, at: 'notes p. 5, eq. (3.6)'}
    origin: page-own

  - id: ex-two-waves
    kind: identity
    where: 'example (c): Ψ = (A + B)cos kx + i(A − B)sin kx, Ψ′ = k[−(A + B)sin kx + i(A − B)cos kx]; Im(Ψ*Ψ′) = Re Ψ · Im Ψ′ − Im Ψ · Re Ψ′ = k(A² − B²)'
    formula: (A + B)*cos(k*x)*k*(A - B)*cos(k*x) - (A - B)*sin(k*x)*(-k*(A + B)*sin(k*x))
    equals: k*A**2 - k*B**2
    samples: {k: [1.0, 2.5], A: [1.0, 0.3], B: [0.4, 0.9], x: [0.2, 1.4]}
    tolerance: 1e-12
    shown: ['J = \frac{\hbar k}{m}\left(A^2 - B^2\right)$']
    source: {cite: mit, at: 'notes p. 5, eq. (3.6)'}
    origin: page-own

  - id: current-sign
    kind: identity
    where: 'eq. (3.3) sign: with Ψ_t = (iħ/2m)Ψ″ (ħ = h), ∂ρ/∂t = (iħ/2m)(Ψ*Ψ″ − ΨΨ*″); for z = Ψ*Ψ′ = a + ib, −(ħ/2im)(z − z*) = −(ħ/m) b. Checked on the real numbers: −(h/(2m))·(2b) equals −(h/m)·b'
    formula: -(h/(2*m))*(2*b)
    equals: -(h/m)*b
    samples: {h: [1.0, 0.5], m: [1.0, 3.0], b: [0.7, -1.2]}
    tolerance: 1e-12
    shown: ['= -\frac{\partial}{\partial x}\left(\frac{\hbar}{m}\,\text{Im}']
    source: {cite: mit, at: 'notes p. 5, eq. (3.3)'}
    origin: mit
