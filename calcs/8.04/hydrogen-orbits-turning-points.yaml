# Calculations on content/year-2/8.04/hydrogen-orbits-turning-points.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Source: MIT 8.04 (Spring 2016, Zwiebach) Lecture 24, transcript of the video segment
# "More on the hydrogen atom degeneracies and orbits" (reading1), with the page's own plot and worked example (n = 10).
# Units: r in a0, energies in e²/(2a0); L stands for l(l + 1).

page: content/year-2/8.04/hydrogen-orbits-turning-points.mdx
calcs:
  # ---------------------------------------------------------------- derivation
  - id: coefficient
    kind: identity
    where: 'ħ²/(2 m a0²) with a0 = ħ²/(m e²) equals e²/(2 a0)'
    formula: hb**2/(2*m*(hb**2/(m*q**2))**2)
    equals: q**2/(2*(hb**2/(m*q**2)))
    samples: {hb: [1.0, 0.7], m: [1.0, 2.3], q: [1.0, 1.9]}
    tolerance: 1e-12
    shown: ['\frac{\hbar^2}{2ma_0^2} = \frac{e^2}{2a_0}']
    source: {cite: reading1, at: 'transcript p. 3, board'}
    origin: mit

  - id: quadratic-root
    kind: identity
    where: '1/x = (1 + √(1 − L/n²))/L solves L/x² − 2/x + 1/n² = 0'
    formula: L*((1 + sqrt(1 - L/n**2))/L)**2 - 2*(1 + sqrt(1 - L/n**2))/L + 1/n**2
    equals: '0'
    samples: {L: [2, 6, 12], n: [5, 7, 10]}
    tolerance: 1e-12
    shown: ['\frac{1}{x} = \frac{1 \pm \sqrt{1 - \frac{l(l + 1)}{n^2}}}{l(l + 1)}']
    source: {cite: reading1, at: 'transcript p. 4, board'}
    origin: mit

  - id: inverted-root
    kind: identity
    where: 'x = L/(1 − √(1 − L/n²)) equals n²(1 + √(1 − L/n²)) (the outer turning point)'
    formula: L/(1 - sqrt(1 - L/n**2))
    equals: n**2*(1 + sqrt(1 - L/n**2))
    samples: {L: [2, 6, 12], n: [5, 7, 10]}
    tolerance: 1e-10
    shown: ['r_\pm = n^2a_0\left(1 \pm \sqrt{1 - \frac{l(l + 1)}{n^2}}\right)']
    source: {cite: reading1, at: 'transcript p. 4, board'}
    origin: mit

  - id: semi-major
    kind: identity
    where: '(r+ + r−)/2 = n² a0 for every l'
    formula: (n**2*(1 + sqrt(1 - L/n**2)) + n**2*(1 - sqrt(1 - L/n**2)))/2
    equals: n**2
    samples: {L: [0, 2, 12], n: [4, 7, 10]}
    tolerance: 1e-12
    shown: ['\frac{r_+ + r_-}{2} = n^2a_0']
    source: {cite: reading1, at: 'transcript p. 5, board'}
    origin: mit

  - id: largest-l
    kind: identity
    where: 'l = n − 1: l(l + 1)/n² = 1 − 1/n, so the eccentricity is 1/√n'
    formula: sqrt(1 - (n - 1)*n/n**2)
    equals: 1/sqrt(n)
    samples: {n: [2, 10, 100]}
    tolerance: 1e-12
    shown: ['$\frac{l(l + 1)}{n^2} = 1 - \frac1n$', '$1/\sqrt n$ for $l = n - 1$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  # ---------------------------------------------------------------- Rydberg example (lecture)
  - id: rydberg-bracket
    where: 'n = 100, l = 60: √(1 − 3660/10000)'
    inputs: {}
    formula: sqrt(1 - 60*61/100**2)
    expected: '0.80'
    shown: ['the bracket is $1 \pm 0.80$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit

  - id: rydberg-outer
    where: 'n = 100, l = 60: r+ in a0 (lecture: about 18,000)'
    inputs: {}
    formula: 100**2*(1 + sqrt(1 - 60*61/100**2))
    expected: '18000'
    tolerance: 100
    shown: ['$r_+ \approx 18{,}000\,a_0$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit

  - id: rydberg-inner
    where: 'n = 100, l = 60: r− in a0 (lecture: about 2,000)'
    inputs: {}
    formula: 100**2*(1 - sqrt(1 - 60*61/100**2))
    expected: '2000'
    tolerance: 100
    shown: ['$r_- \approx 2{,}000\,a_0$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: mit

  - id: rydberg-size
    where: 'n² a0 for n = 100 with a0 = 0.0529 nm'
    inputs: {a0: 0.0529177 nm}
    formula: 100**2*a0
    expected: 529 nm
    shown: ['$a_0 = 0.0529$ nm, the semi-major axis is about 529 nm']
    source: {cite: reading1, at: 'transcript p. 5 (a0 = 0.0529177 nm, CODATA 2018)'}
    origin: page-own

  - id: rydberg-ratio
    where: 'n² = ten thousand times the ground-state size a0'
    inputs: {}
    formula: 100**2
    expected: '10000'
    shown: ['some ten thousand times the size of the atom in its ground state', 'n^2a_0 = 10{,}000\,a_0']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own

  # ---------------------------------------------------------------- plot (n = 3)
  - id: plot-l1-inner
    where: 'plot: l = 1, n = 3 inner turning point 9(1 − √(7/9))'
    inputs: {}
    formula: 9*(1 - sqrt(7/9))
    expected: '1.06'
    shown: ['about 1.06 and 16.9 (marked)', '{ x: 1.063, y: -0.1111, label: "r₋" }']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: plot-l1-outer
    where: 'plot: l = 1, n = 3 outer turning point 9(1 + √(7/9))'
    inputs: {}
    formula: 9*(1 + sqrt(7/9))
    expected: '16.9'
    shown: ['about 1.06 and 16.9 (marked)', '{ x: 16.94, y: -0.1111, label: "r₊" }']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: plot-l1-check
    where: 'plot: V_eff(l = 1) at x = 16.94 equals −1/9'
    inputs: {}
    formula: 2/16.937**2 - 2/16.937
    expected: '-0.1111'
    shown: ['{ expr: "-1/9", label: "E₃", dash: true }']
    source: {cite: reading1, at: 'transcript p. 3'}
    origin: page-own

  - id: plot-l2-inner
    where: 'plot: l = 2, n = 3: 9(1 − √(1/3))'
    inputs: {}
    formula: 9*(1 - sqrt(1/3))
    expected: '3.80'
    shown: ['about 3.80 and 14.2']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: plot-l2-outer
    where: 'plot: l = 2, n = 3: 9(1 + √(1/3))'
    inputs: {}
    formula: 9*(1 + sqrt(1/3))
    expected: '14.2'
    shown: ['about 3.80 and 14.2']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: plot-l0
    where: 'plot: l = 0, n = 3: −2/x = −1/9 at x = 2n² = 18'
    inputs: {}
    formula: 2*3**2
    expected: '18'
    shown: ['turns at x = 18']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  # ---------------------------------------------------------------- worked example (n = 10)
  - id: ex-l0
    where: 'example, l = 0: r+ = 2n² a0'
    inputs: {}
    formula: 2*10**2
    expected: '200'
    shown: ['$r_+ = 2 \times 100\,a_0 = 200\,a_0$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-l5-root
    where: 'example, l = 5: √0.7'
    inputs: {}
    formula: sqrt(1 - 30/100)
    expected: '0.837'
    shown: ['\sqrt{0.7} \approx 0.837', '$\varepsilon \approx 0.837$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-l5-outer
    where: 'example, l = 5: r+'
    inputs: {}
    formula: 100*(1 + sqrt(0.7))
    expected: '183.7'
    shown: ['$r_+ \approx 183.7\,a_0$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-l5-inner
    where: 'example, l = 5: r−'
    inputs: {}
    formula: 100*(1 - sqrt(0.7))
    expected: '16.3'
    shown: ['$r_- \approx 16.3\,a_0$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-l9-root
    where: 'example, l = 9: √0.1'
    inputs: {}
    formula: sqrt(1 - 90/100)
    expected: '0.316'
    shown: ['\sqrt{0.1} \approx 0.316', '$\varepsilon \approx 0.316$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-l9-outer
    where: 'example, l = 9: r+'
    inputs: {}
    formula: 100*(1 + sqrt(0.1))
    expected: '131.6'
    shown: ['$r_+ \approx 131.6\,a_0$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-l9-inner
    where: 'example, l = 9: r−'
    inputs: {}
    formula: 100*(1 - sqrt(0.1))
    expected: '68.4'
    shown: ['$r_- \approx 68.4\,a_0$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  - id: ex-n100
    where: 'example: l = 99 at n = 100 has eccentricity 1/√100'
    inputs: {}
    formula: sqrt(1 - 99*100/100**2)
    expected: '0.1'
    shown: ['$\varepsilon = 1/\sqrt{100} = 0.1$']
    source: {cite: reading1, at: 'transcript p. 4'}
    origin: page-own

  # ---------------------------------------------------------------- quiz
  - id: quiz-n4
    where: 'quiz 2: n² a0 for n = 4'
    inputs: {}
    formula: 4**2
    expected: '16'
    shown: ['= n^2a_0 = 16a_0$ for every $l$']
    source: {cite: reading1, at: 'transcript p. 5'}
    origin: page-own
