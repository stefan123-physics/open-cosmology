# Calculations on content/year-4/8.286/age-with-vacuum-energy.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Flat matter + vacuum: H0 t0 = (2/3) atanh(√Ωv)/√Ωv; age at scale factor x: t = (2/(3 H0 √Ωv)) asinh(√(Ωv/Ωm) x^(3/2)).

page: content/year-4/8.286/age-with-vacuum-energy.mdx
calcs:
  - id: hubble-time
    where: 'worked example "Ages in a Planck-like universe", step "The Hubble time"; quiz 4 explanation'
    inputs: {H0: 68 km/s/Mpc}
    formula: 1 / H0
    expected: 14.38e9 yr
    shown: ['$1/H_0 = 977.8/68$ billion years $= 14.38$ billion years', '$1/H_0 = 14.38$ billion years']
    source: {cite: reading1, at: 'Lecture 19 (age integral)'}
    origin: page-own

  - id: matter-only-age
    where: 'worked example, step "The Hubble time": 2/3 of it is 9.59 billion years'
    inputs: {H0: 68 km/s/Mpc}
    formula: 2 / (3 * H0)
    expected: 9.59e9 yr
    shown: ['9.59 billion years']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: sqrt-ov
    where: 'worked example, step "(a) The age"'
    inputs: {Om: 0.31}
    formula: sqrt(1 - Om)
    expected: '0.8307'
    shown: ['$\sqrt{1 - 0.31} = 0.8307$']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: atanh-ov
    where: 'worked example, step "(a) The age"'
    inputs: {s: 0.8307}
    formula: log((1 + s) / (1 - s)) / 2
    expected: '1.190'
    shown: ['$\tanh^{-1}(0.8307) = 1.190$']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: h0-t0
    where: 'worked example, step "(a) The age"; quiz 4 explanation'
    inputs: {Ov: 0.69}
    formula: 2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov)
    expected: '0.955'
    shown: ['$H_0t_0 = \frac{2}{3} \times 1.190/0.8307 = 0.955$', '= 0.955/H_0$']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: t0
    where: 'worked example, step "(a) The age"'
    inputs: {Ov: 0.69, H0: 68 km/s/Mpc}
    formula: 2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov) / H0
    expected: 13.74e9 yr
    shown: ['$t_0 = 13.74$ billion years']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: quiz-age
    where: 'quiz 4 (answer "13.7 billion years"); plot caption'
    inputs: {Ov: 0.69, H0: 68 km/s/Mpc}
    formula: 2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov) / H0
    expected: 13.7e9 yr
    shown: ['$t_0 \\approx 13.7$ billion years', 'the solid curve gives 13.7 billion years']
    quiz: 3
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: t0-with-radiation
    where: 'worked example, step "(b) Radiation": numerically 13.732 billion years'
    inputs: {H0: 68 km/s/Mpc, Or: 9.0e-5, Om: 0.30991, Ov: 0.69}
    formula: integrate('x / sqrt(Or + Om * x + Ov * x**4)', 'x', 0, 1) / H0
    expected: 13.732e9 yr
    shown: ['gives $t_0 = 13.732$ billion years']
    source: {cite: reading1, at: 'Lecture 19 (age integral)'}
    origin: page-own

  - id: radiation-shift
    where: 'worked example, step "(b) Radiation": about 4 million years less'
    inputs: {H0: 68 km/s/Mpc, Or: 9.0e-5, Om: 0.30991, Ov: 0.69}
    formula: (2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov) - integrate('x / sqrt(Or + Om * x + Ov * x**4)', 'x', 0, 1)) / H0
    expected: 4e6 yr
    shown: ['about 4 million years less']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: asinh-argument-z1
    where: 'worked example, step "(c) Age at z = 1"'
    inputs: {Om: 0.31, Ov: 0.69, x: 0.5}
    formula: sqrt(Ov / Om) * x**1.5
    expected: '0.5275'
    shown: ['= 1.492 \times 0.3536 = 0.5275$', '\sinh^{-1}(0.5275) = 0.5056$']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: age-at-z1
    where: 'worked example, step "(c) Age at z = 1"'
    inputs: {Om: 0.31, Ov: 0.69, x: 0.5, H0: 68 km/s/Mpc}
    formula: 2 / (3 * H0 * sqrt(Ov)) * asinh(sqrt(Ov / Om) * x**1.5)
    expected: 5.84e9 yr
    shown: ['= 5.84$ billion years']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: lookback-z1
    where: 'worked example, step "(c)": light has travelled 13.74 − 5.84 = 7.9 billion years'
    inputs: {Om: 0.31, Ov: 0.69, x: 0.5, H0: 68 km/s/Mpc}
    formula: (2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov) - 2 / (3 * sqrt(Ov)) * asinh(sqrt(Ov / Om) * x**1.5)) / H0
    expected: 7.9e9 yr
    shown: ['$13.74 - 5.84 = 7.9$ billion years']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: plot-dashed-open
    where: 'plot caption: the dashed (matter-only, open) curve gives 11.6 billion years for Ω_m,0 = 0.31, H₀ = 68'
    inputs: {Om: 0.31, H0: 68 km/s/Mpc}
    formula: Om / (2 * (1 - Om)**1.5) * (2 * sqrt(1 - Om) / Om - asinh(2 * sqrt(1 - Om) / Om)) / H0
    expected: 11.6e9 yr
    shown: ['the dashed one 11.6']
    source: {cite: reading1, at: 'Lectures 9–10 (open universe)'}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: age-integral-matches-closed-form
    kind: identity
    where: 'formula "Age of the universe" (the integral) must equal the closed form of "Age at an earlier time" at x = 1 for a flat universe (Ω_m = 1 − Ω_vac), including nearly empty and nearly vacuum-dominated cases'
    formula: integrate('x / sqrt((1 - Ov) * x + Ov * x**4)', 'x', 0, 1)
    equals: 2 / (3 * sqrt(Ov)) * asinh(sqrt(Ov / (1 - Ov)))
    samples: {Ov: [0.001, 0.1, 0.5, 0.69, 0.9, 0.999]}
    tolerance: 1e-8
    shown: ['t_0 = \frac{1}{H_0}\int_0^1 \frac{x\,dx}{\sqrt{\Omega_{m,0}\,x', 'sinh^{-1}\!\left(\sqrt{\frac{\Omega_{\text{vac},0}}{\Omega_{m,0}}}\;x^{3/2}\right)']
    source: {cite: reading1, at: 'pp. 8–9 (board)'}
    origin: mit

  - id: vacuum-age-flat-matter-limit
    kind: limit
    where: 'the same closed form must approach the matter-only H₀t₀ = 2/3 as Ω_vac → 0'
    formula: 2 / (3 * sqrt(Ov)) * asinh(sqrt(Ov / (1 - Ov)))
    limit: 2 / 3
    vary: {Ov: [0.1, 0.01, 0.001, 0.0001, 0.00001]}
    tolerance: 1e-5
    shown: ['t(x) = \frac{2}{3H_0\sqrt{\Omega_{\text{vac},0}}}']
    source: {cite: reading1, at: 'pp. 8–9 (board)'}
    origin: page-own
