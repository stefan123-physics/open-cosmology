# Calculations on content/year-4/8.286/doppler-effect.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/doppler-effect.mdx
calcs:
  - id: quiz-line-redshift
    where: 'quiz 1: line at 500 nm observed at 550 nm'
    inputs: {lam_S: 500 nm, lam_O: 550 nm}
    formula: lam_O / lam_S - 1
    expected: '0.1'
    tolerance: '0.001'
    shown: ['= 550/500 = 1.1$, so $z = 0.1$']
    quiz: 0
    source: {cite: reading2, at: 'pp. 2–3 ("Definition of redshift")'}
    origin: page-own

  - id: quiz-relativistic-z
    where: 'quiz 4: beta = 0.6; plot point "β = 0.6, z = 1"'
    inputs: {beta: 0.6}
    formula: sqrt((1 + beta) / (1 - beta)) - 1
    expected: '1'
    tolerance: '0.001'
    shown: ['\\sqrt{1.6/0.4} = \\sqrt{4} = 2$, so $z = 1$', '{ x: 0.6, y: 1, label: "β = 0.6, z = 1" }']
    quiz: 3
    source: {cite: reading2, at: 'pp. 15–19 ("Relativistic Doppler shift")'}
    origin: page-own

  - id: siren-source-moving-1pz
    where: 'worked example "A passing siren", step "Source moving"'
    inputs: {v: 30 m/s, u: 343 m/s}
    formula: 1 + v / u
    expected: '1.0875'
    shown: ['= 1 + 30/343 = 1.0875$']
    source: {cite: reading2, at: 'pp. 1–2 ("Sound, source moving")'}
    origin: page-own

  - id: siren-source-moving-f
    where: 'worked example "A passing siren", step "Source moving"'
    inputs: {f: 440 Hz, v: 30 m/s, u: 343 m/s}
    formula: f / (1 + v / u)
    expected: 405 Hz
    shown: ['f_O = 440/1.0875 = 405$ Hz']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: siren-observer-moving-1pz
    where: 'worked example "A passing siren", step "Observer moving"'
    inputs: {v: 30 m/s, u: 343 m/s}
    formula: 1 / (1 - v / u)
    expected: '1.0958'
    shown: ['= 1/(1 - 30/343) = 1.0958$']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: siren-observer-moving-f
    where: 'worked example "A passing siren", step "Observer moving"'
    inputs: {f: 440 Hz, v: 30 m/s, u: 343 m/s}
    formula: f * (1 - v / u)
    expected: 402 Hz
    shown: ['f_O = 440 \times (1 - 30/343) = 402$ Hz']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: siren-semitones
    where: 'worked example "A passing siren", step "Compare": about a semitone and a half'
    inputs: {v: 30 m/s, u: 343 m/s}
    formula: 12 * log10(1 + v / u) / log10(2)
    expected: '1.5'
    shown: ['about a semitone and a half']
    source: {cite: reading2, at: 'pp. 1–2'}
    origin: page-own

  - id: h-alpha-1pz
    where: 'worked example "From a measured line to a speed", step "Redshift"'
    inputs: {lam_S: 656.3 nm, lam_O: 662.9 nm}
    formula: lam_O / lam_S
    expected: '1.0101'
    shown: ['1 + z = 662.9/656.3 = 1.0101$, so $z = 0.0101$']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: h-alpha-speed
    where: 'worked example, step "Speed (slow motion)"'
    inputs: {lam_S: 656.3 nm, lam_O: 662.9 nm}
    formula: (lam_O / lam_S - 1) * c
    expected: 3000 km/s
    shown: ['v \approx 0.0101\,c \approx 3000$ km/s']
    source: {cite: reading2, at: 'pp. 2–3'}
    origin: page-own

  - id: beta-for-z1
    where: 'worked example, step "z = 1 needs the full formula"'
    inputs: {z: 1}
    formula: ((1 + z)**2 - 1) / ((1 + z)**2 + 1)
    expected: '0.6'
    tolerance: '0.001'
    shown: ['gives $\beta = 3/5 = 0.6$']
    source: {cite: reading2, at: 'pp. 15–19'}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: relativistic-doppler-low-speed-limit
    kind: limit
    where: 'formula "Relativistic Doppler shift": at low speed z = √((1 + β)/(1 − β)) − 1 must approach the classical z ≈ β (checked as z/β → 1)'
    formula: (sqrt((1 + b) / (1 - b)) - 1) / b
    limit: '1'
    vary: {b: [0.1, 0.01, 0.001, 0.0001, 0.00001]}
    tolerance: 1e-4
    shown: ['1 + z = \frac{\Delta t_O}{\Delta t_S} = \sqrt{\frac{1 + \beta}{1 - \beta}}']
    source: {cite: reading2, at: 'pp. 15–19'}
    origin: mit

  - id: relativistic-doppler-is-dilated-classical
    kind: identity
    where: 'formula "Relativistic Doppler shift": time dilation γ times the classical source-moving factor (1 + β) must give √((1 + β)/(1 − β)), up to β = 0.999'
    formula: (1 + b) / sqrt(1 - b**2)
    equals: sqrt((1 + b) / (1 - b))
    samples: {b: [0.01, 0.3, 0.6, 0.9, 0.999]}
    tolerance: 1e-9
    shown: ['\gamma \equiv \frac{1}{\sqrt{1 - \beta^2}}']
    source: {cite: reading2, at: 'pp. 15–19'}
    origin: page-own
