  # ---- Problem 6

  # a ∝ t^(2/5) must satisfy ȧ ∝ a^(−3/2), so a(t)/a(t1) = (ȧ(t1)/ȧ(t))^(2/3).
  - id: p6-a-scale-factor
    kind: identity
    answer: p6-a
    where: 'Problem 6(a), answer box and formula "Scale factor for the mysterious stuff": the flat Friedmann equation ȧ ∝ a^(−3/2) checked with numerical derivatives'
    formula: (t/t1)**(2/5)
    equals: (deriv('(x/t1)**(2/5)', 'x', t1) / deriv('(x/t1)**(2/5)', 'x', t))**(2/3)
    samples:
      t: [1, 10, 4.2, 7]
      t1: [0.5, 5, 1.3, 2]
    tolerance: 1e-7
    shown: ['a(t) \propto t^{2/5}']
    source: {cite: mit, at: 'Problem 6(a) (our own solution)'}
    origin: page-own

  - id: p6-b-hubble
    kind: identity
    answer: p6-b
    where: 'Problem 6(b), answer box and formula "Hubble expansion rate for the mysterious stuff": the numerical derivative of t^(2/5), divided by t^(2/5)'
    formula: 2/(5*t)
    equals: deriv('x**(2/5)', 'x', t) / t**(2/5)
    samples:
      t: [0.5, 10, 4.2, 1]
    tolerance: 1e-7
    shown: ['= \frac{2}{5t}']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
    origin: page-own

  # The horizon integral with the substitution t' = s^(5/3) (so that the integrand is smooth at 0):
  # ∫ c dt'/t'^(2/5) from 0 to t = ∫ (5/3) c ds from 0 to t^(3/5).
  - id: p6-c-horizon
    kind: identity
    answer: p6-c
    where: 'Problem 6(c), answer box and formula "Horizon distance for the mysterious stuff": a(t) ∫ c dt′/a(t′), integrated numerically after the substitution t′ = s^(5/3)'
    formula: 5*c*t/3
    equals: t**(2/5) * integrate('c * (5/3) * s**(2/3) / (s**(5/3))**(2/5)', 's', 0, t**(3/5))
    samples:
      c: [1, 3, 2, 299792.458]
      t: [0.5, 10, 4.2, 1]
    tolerance: 1e-7
    shown: ['= \frac53\,c\,t']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  - id: p6-d-density
