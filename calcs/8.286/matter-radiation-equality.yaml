# Calculations on content/year-4/8.286/matter-radiation-equality.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/matter-radiation-equality.mdx
calcs:
  - id: rho-r-si
    where: 'formula "Radiation today"; flashcard 1'
    inputs: {u_r: 7.01e-14 J/m**3}
    formula: u_r / c**2
    expected: 7.80e-31 kg/m**3
    shown: ['\rho_r = \frac{u_r}{c^2} = 7.80 \times 10^{-31}']
    source: {cite: reading1, at: "pp. 15–16 (board)"}
    origin: mit

  - id: rho-r-cgs
    where: 'formula "Radiation today"'
    inputs: {u_r: 7.01e-14 J/m**3}
    formula: u_r / c**2
    expected: 7.80e-34 g/cm**3
    shown: ['= 7.80 \times 10^{-34}\ \tfrac{\text{g}}{\text{cm}^3}']
    source: {cite: reading1, at: "pp. 15–16 (board)"}
    origin: mit

  - id: rho-crit-coefficient
    where: 'formula "Critical density": rho_c = 1.88 h0^2 x 10^-29 g/cm^3 (value for h0 = 1)'
    inputs: {H100: 100 km/s/Mpc}
    formula: 3 * H100**2 / (8 * pi * G)
    expected: 1.88e-29 g/cm**3
    shown: ['\rho_c = 1.88\,h_0^2 \times 10^{-29}']
    source: {cite: reading1, at: "p. 16 (board)"}
    origin: mit

  - id: omega-r-coefficient
    where: 'formula "Radiation density parameter": Omega_r h0^2'
    inputs: {rho_r: 7.80e-34 g/cm**3, rho_c1: 1.88e-29 g/cm**3}
    formula: rho_r / rho_c1
    expected: 4.15e-5
    shown: ['= 4.15 \times 10^{-5}\,h_0^{-2}']
    source: {cite: reading1, at: "p. 17 (board)"}
    origin: mit

  - id: omega-r-planck2013
    where: 'formula "Radiation density parameter"; flashcard 1'
    inputs: {h0: 0.67}
    formula: 4.15e-5 / h0**2
    expected: 9.2e-5
    shown: ['\approx 9.2 \times 10^{-5} \quad (h_0 = 0.67)']
    source: {cite: reading1, at: "p. 17 (board)"}
    origin: mit

  - id: ratio-today
    where: '"Back to equality": Omega_r/Omega_m; quiz 1 and 2'
    inputs: {h0: 0.67, Omega_m: 0.30}
    formula: (4.15e-5 / h0**2) / Omega_m
    expected: 3.1e-4
    shown: ['\Omega_r/\Omega_m \approx 3.1 \times 10^{-4}', 'ratio $3.1 \\times 10^{-4}$']
    source: {cite: reading1, at: "p. 18 (board)"}
    origin: mit

  - id: z-eq
    where: 'formula "Redshift of equality"; quiz 2 (answer "About 3,200")'
    inputs: {ratio: 3.1e-4}
    formula: 1 / ratio - 1
    expected: '3200'
    shown: ['z_\text{eq} \approx 3{,}200"', 'z_\text{eq} \approx 3{,}200$']
    quiz: 1
    source: {cite: reading1, at: "p. 19 (board)"}
    origin: mit

  - id: one-plus-z-eq-quiz
    where: 'quiz 2 explanation: 1 + z_eq = 1/(3.1e-4) = 3,226'
    inputs: {ratio: 3.1e-4}
    formula: 1 / ratio
    expected: '3226'
    shown: ['\\approx 3{,}226']
    source: {cite: reading1, at: "p. 19 (board)"}
    origin: mit

  - id: t-eq
    where: 'formula "Time of equality (estimate)"; flashcard 2'
    inputs: {t0: 13.8e9 yr, ratio: 3.1e-4}
    formula: t0 * (1 / ratio)**(-3/2)
    expected: 75000 yr
    shown: ['\approx 75{,}000\ \text{years}', 't_\\text{eq} \\approx 75{,}000$ years']
    source: {cite: reading1, at: "pp. 19–20"}
    origin: mit

  - id: plot-equality-a
    where: 'plot point "equality" (x = log10 a) and caption a = 3.08e-4'
    inputs: {Omega_m: 0.30, Omega_r: 9.24e-5}
    formula: log10(Omega_r / Omega_m)
    expected: '-3.511'
    shown: ['{ x: -3.511, y: 10.01, label: "equality: a ≈ 1/3,250" }', 'a = 3.08 × 10⁻⁴']
    source: {cite: reading1, at: "p. 18 (board)"}
    origin: page-own

  - id: plot-equality-1pz
    where: 'plot caption: 1 + z = 3,245'
    inputs: {Omega_m: 0.30, h0: 0.67}
    formula: Omega_m / (4.15e-5 / h0**2)
    expected: '3245'
    shown: ['1 + z = 3,245']
    source: {cite: reading1, at: "p. 18 (board)"}
    origin: page-own

  - id: plot-equality-density
    where: 'plot point "equality" (y = log10 of Omega_m / a^3)'
    inputs: {Omega_m: 0.30, Omega_r: 9.24e-5}
    formula: log10(Omega_m) - 3 * log10(Omega_r / Omega_m)
    expected: '10.01'
    shown: ['y: 10.01']
    source: {cite: reading1, at: "p. 18 (board)"}
    origin: page-own

  - id: we-omega-r-2018
    where: 'worked example "Equality with later measurements", step "Radiation"'
    inputs: {h0: 0.674}
    formula: 4.15e-5 / h0**2
    expected: 9.14e-5
    shown: ['= 9.14 \times 10^{-5}$']
    source: {cite: planck2018, at: "Table 2 (h0); method from reading1 p. 17"}
    origin: later-data

  - id: we-ratio-2018
    where: 'worked example, step "Ratio and redshift"'
    inputs: {h0: 0.674, Omega_m: 0.315}
    formula: (4.15e-5 / h0**2) / Omega_m
    expected: 2.90e-4
    shown: ['= 2.90 \times 10^{-4}$']
    source: {cite: planck2018, at: "Table 2"}
    origin: later-data

  - id: we-one-plus-z-2018
    where: 'worked example, step "Ratio and redshift"'
    inputs: {h0: 0.674, Omega_m: 0.315}
    formula: Omega_m / (4.15e-5 / h0**2)
    expected: '3448'
    shown: ['1 + z_\text{eq} = 3{,}448$']
    source: {cite: planck2018, at: "Table 2"}
    origin: later-data

  - id: we-z-eq-2018
    where: 'worked example, step "Ratio and redshift"'
    inputs: {h0: 0.674, Omega_m: 0.315}
    formula: Omega_m / (4.15e-5 / h0**2) - 1
    expected: '3450'
    shown: ['z_\text{eq} \approx 3{,}450$']
    source: {cite: planck2018, at: "Table 2"}
    origin: later-data

  - id: we-t-eq-2018
    where: 'worked example, step "Time"'
    inputs: {h0: 0.674, Omega_m: 0.315, t0: 13.8e9 yr}
    formula: t0 * (Omega_m / (4.15e-5 / h0**2))**(-3/2)
    expected: 68000 yr
    shown: ['\approx 68{,}000$ years']
    source: {cite: planck2018, at: "Table 2"}
    origin: later-data

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: radiation-energy-balance
    kind: identity
    where: 'formula "Energy balance of a comoving box" with p = ρc²/3: ρ ∝ a⁻⁴ must satisfy ρ̇ = −3(ȧ/a)(ρ + p/c²) for any expansion history (checked with a(t) = 1 + t + t²)'
    formula: deriv('(1 + x + x**2)**-4', 'x', t)
    equals: -3 * (deriv('1 + x + x**2', 'x', t) / (1 + t + t**2)) * (4 / 3) * (1 + t + t**2)**-4
    samples: {t: [0.01, 0.5, 2, 30]}
    tolerance: 1e-6
    shown: ['\dot\rho = -3\,\frac{\dot a}{a}\left(\rho + \frac{p}{c^2}\right)']
    source: {cite: reading1, at: 'p. 25 (board)'}
    origin: mit
