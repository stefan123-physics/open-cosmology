page: content/year-4/8.286/inflation-overview.mdx
calcs:
  - id: doublings
    where: 'worked example "Counting doublings", step "Doublings"'
    inputs: {start: 1e-26 cm, end: 3 cm}
    formula: log(end / start) / log(2)
    expected: '88'
    shown: ['$\log_2(3 \times 10^{26}) = 88$']
    source: {cite: reading2, at: 'slide 10 (Guth''s sample numbers)'}
    origin: page-own

  - id: doublings-guth
    where: 'worked example, step "Doublings": Guth''s own figures give 93'
    inputs: {start: 1e-28 cm, end: 1 cm}
    formula: log(end / start) / log(2)
    expected: '93'
    shown: ['$\log_2 10^{28} = 93$']
    source: {cite: reading2, at: 'slide 10'}
    origin: page-own

  - id: duration
    where: 'worked example, step "Time"'
    inputs: {n: 88, t: 5e-37 s}
    formula: n * t
    expected: 4.4e-35 s
    shown: ['$88 \times 5 \times 10^{-37}$ s $= 4.4 \times 10^{-35}$ s']
    source: {cite: reading2, at: 'slide 10'}
    origin: page-own
