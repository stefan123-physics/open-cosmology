# Calculations on content/year-4/8.286/spacetime-interval.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/spacetime-interval.mdx
calcs:
  - id: interval-squared
    where: 'quiz 1 explanation; worked example "Finding the special frame", step "Interval"; plot caption'
    inputs: {dx: 5, cdt: 3}
    formula: dx**2 - cdt**2
    expected: '16'
    tolerance: '0.001'
    shown: ['$s^2 = 25 - 9 = 16 > 0$', '$s^2 = 5^2 - 3^2 = 16 > 0$', 's² = 16, spacelike']
    source: {cite: reading1, at: 'p. 23 ("The spacetime interval")'}
    origin: page-own

  - id: proper-distance
    where: 'worked example, step "Interval"'
    inputs: {dx: 5, cdt: 3}
    formula: sqrt(dx**2 - cdt**2)
    expected: '4'
    tolerance: '0.001'
    shown: ['with proper distance $s = 4$ light-seconds']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: simultaneity-beta
    where: 'worked example, step "The frame"; plot caption'
    inputs: {dx: 5, cdt: 3}
    formula: cdt / dx
    expected: '0.6'
    tolerance: '0.001'
    shown: ['$3 - 5\beta = 0$, so $\beta = 0.6$', 'At β = 0.6 the line passes through b']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: gamma
    where: 'worked example, step "Check"'
    inputs: {beta: 0.6}
    formula: 1 / sqrt(1 - beta**2)
    expected: '1.25'
    tolerance: '0.001'
    shown: ['$\gamma = 1.25$']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: x-prime
    where: 'worked example, step "Check"'
    inputs: {beta: 0.6, dx: 5, cdt: 3}
    formula: (dx - beta * cdt) / sqrt(1 - beta**2)
    expected: '4'
    tolerance: '0.001'
    shown: ['= 1.25(5 - 1.8) = 4$']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: interval-is-lorentz-invariant
    kind: identity
    where: 'formula "The interval between nearby events": a Lorentz transformation x′ = γ(x − βct), ct′ = γ(ct − βx) leaves x² − (ct)² unchanged, also close to the speed of light'
    formula: (1 / sqrt(1 - b**2) * (x - b * ct))**2 - (1 / sqrt(1 - b**2) * (ct - b * x))**2
    equals: x**2 - ct**2
    samples: {b: [0.1, 0.6, 0.99, 0.999, -0.5], x: [3, 4, 1, 2, 7], ct: [5, 1, 3, 0.5, 2]}
    tolerance: 1e-8
    shown: ['ds^2 = dx^2 + dy^2 + dz^2 - c^2\,dt^2']
    source: {cite: reading1, at: 'p. 27'}
    origin: page-own
