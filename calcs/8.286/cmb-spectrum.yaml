# Calculations on content/year-4/8.286/cmb-spectrum.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# The quiz on the peak frequency offers "160 GHz" and "160 THz": the same number, so it is checked through the explanation.

page: content/year-4/8.286/cmb-spectrum.mdx
calcs:
  - id: peak-today
    where: 'worked example "The afterglow then and now", step "Today"; quiz 3 explanation; plot caption'
    inputs: {T: 2.725 K, x: 2.82}
    formula: x * k_B * T / (2 * pi * hbar)
    expected: 1.60e11 Hz
    shown: ['$= 1.60 \times 10^{11}$ Hz $= 160$ GHz', 'for $T = 2.725$ K that is 160 GHz', 'At 2.725 K the curve peaks at 160 GHz']
    source: {cite: reading1, at: 'Lecture 18 (black-body spectrum)'}
    origin: page-own

  - id: wavelength-today
    where: 'worked example, step "Today": c/ν = 1.87 mm'
    inputs: {T: 2.725 K, x: 2.82}
    formula: c / (x * k_B * T / (2 * pi * hbar))
    expected: 1.87 mm
    shown: ['$c/\nu = 1.87$ mm']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: plot-peak-frequency
    where: 'plot point "peak: 160 GHz" (exact peak x = 2.8214)'
    inputs: {T: 2.725 K, x: 2.821439}
    formula: x * k_B * T / (2 * pi * hbar)
    expected: 160.2 GHz
    shown: ['{ x: 160.2, y: 1003.8, label: "peak: 160 GHz" }']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: plot-peak-height
    where: 'plot point (y): energy density per GHz at the peak, about 1,000 eV/m³/GHz'
    inputs: {T: 2.725 K, x: 2.821439}
    formula: 8 * pi * (2 * pi * hbar) * (x * k_B * T / (2 * pi * hbar))**3 / c**3 / (exp(x) - 1)
    expected: 1003.8 eV/m**3/GHz
    shown: ['y: 1003.8', 'at about 1,000 eV/m³/GHz']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: plot-area
    where: 'plot caption: area 2.60e5 eV/m³ = 4.17e-14 J/m³'
    inputs: {T: 2.725 K}
    formula: pi**2 / 15 * (k_B * T)**4 / (hbar * c)**3
    expected: 2.60e5 eV/m**3
    shown: ['its area is 2.60 × 10⁵ eV/m³ = 4.17 × 10⁻¹⁴ J/m³']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: peak-decoupling
    where: 'worked example, step "At decoupling"'
    inputs: {T: 2970 K, x: 2.82}
    formula: x * k_B * T / (2 * pi * hbar)
    expected: 1.75e14 Hz
    shown: ['$1.75 \times 10^{14}$ Hz']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: wavelength-decoupling
    where: 'worked example, step "At decoupling"'
    inputs: {T: 2970 K, x: 2.82}
    formula: c / (x * k_B * T / (2 * pi * hbar))
    expected: 1.72 micrometer
    shown: ['a wavelength of $1.72\ \mu$m']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: photon-energy-decoupling
    where: 'worked example, step "At decoupling": photons of about 0.72 eV at the peak'
    inputs: {T: 2970 K, x: 2.82}
    formula: x * k_B * T
    expected: 0.72 eV
    shown: ['photons of about 0.72 eV at the peak']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: stretch-factor
    where: 'worked example, step "Then and now": 1.87 mm / 1.72 µm ≈ 1,090'
    inputs: {a: 1.87 mm, b: 1.72 micrometer}
    formula: a / b
    expected: '1090'
    shown: ['(Check: $1.87\ \text{mm}/1.72\ \mu\text{m} \approx 1{,}090$.)']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: wien-peak-factor
    where: 'worked example: the spectrum ν³/(e^(hν/kT) − 1) peaks where x = hν/kT solves x = 3(1 − e⁻ˣ), x ≈ 2.82'
    inputs: {}
    formula: solve('3 * (1 - exp(-q)) - q', 'q', 1, 5)
    expected: '2.82'
    shown: ['Using $h\nu_\text{peak} \approx 2.82\,kT$']
    source: {cite: reading1, at: 'p. 15 (board)'}
    origin: page-own
