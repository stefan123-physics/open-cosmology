# Calculations on content/year-4/8.286/radiation-dominated-universe.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Flat radiation-dominated universe: ρ = 3/(32πGt²), horizon 2ct.

page: content/year-4/8.286/radiation-dominated-universe.mdx
calcs:
  - id: rho-1s
    where: 'worked example "The universe at one second, three minutes and one year", step "One second"; quiz 4 explanation'
    inputs: {t: 1 s}
    formula: 3 / (32 * pi * G * t**2)
    expected: 4.47e8 kg/m**3
    shown: ['= 4.47 \times 10^{8}$ kg/m³', '= 4.47 \\times 10^8$ kg/m³']
    source: {cite: reading1, at: 'Lecture 16 (flat radiation-dominated solution)'}
    origin: page-own

  - id: quiz-rho-1s
    where: 'quiz 4: answer "About 4.5 × 10^8 kg/m³"'
    inputs: {t: 1 s}
    formula: 3 / (32 * pi * G * t**2)
    expected: 4.5e8 kg/m**3
    shown: ['About $4.5 \\times 10^{8}$ kg/m³']
    quiz: 4
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: water-ratio-1s
    where: 'step "One second" and quiz 5 explanation: about 450,000 times the density of water (corrected 2026-11-15 from "450 times")'
    inputs: {t: 1 s, water: 1000 kg/m**3}
    formula: 3 / (32 * pi * G * t**2) / water
    expected: '450000'
    shown: ['about 450,000 times the density of water. The horizon', 'about 450,000 times the density of water, whatever']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: horizon-1s
    where: 'step "One second": horizon 2ct'
    inputs: {t: 1 s}
    formula: 2 * c * t
    expected: 6.0e8 m
    shown: ['The horizon is $2ct = 6.0 \times 10^{8}$ m']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: horizon-1s-moon
    where: 'step "One second": about one and a half times the Earth–Moon distance'
    inputs: {t: 1 s, d_moon: 3.844e8 m}
    formula: 2 * c * t / d_moon
    expected: '1.5'
    tolerance: '0.1'
    shown: ['about one and a half times the Earth–Moon distance']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: rho-3min
    where: 'step "Three minutes"'
    inputs: {t: 180 s}
    formula: 3 / (32 * pi * G * t**2)
    expected: 1.38e4 kg/m**3
    shown: ['= 1.38 \times 10^4$ kg/m³']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: water-ratio-3min
    where: 'step "Three minutes": still almost 14 times water'
    inputs: {t: 180 s, water: 1000 kg/m**3}
    formula: 3 / (32 * pi * G * t**2) / water
    expected: '14'
    shown: ['still almost 14 times water']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: horizon-3min
    where: 'step "Three minutes"'
    inputs: {t: 180 s}
    formula: 2 * c * t
    expected: 1.08e11 m
    shown: ['The horizon is $1.08 \times 10^{11}$ m']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: horizon-3min-au
    where: 'step "Three minutes": about 0.7 AU'
    inputs: {t: 180 s}
    formula: 2 * c * t
    expected: 0.7 au
    shown: ['about 0.7 AU']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: rho-1yr
    where: 'step "One year"'
    inputs: {t: 3.156e7 s}
    formula: 3 / (32 * pi * G * t**2)
    expected: 4.49e-7 kg/m**3
    shown: ['$\rho = 4.49 \times 10^{-7}$ kg/m³']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: horizon-1yr
    where: 'step "One year"'
    inputs: {t: 3.156e7 s}
    formula: 2 * c * t
    expected: 1.89e16 m
    shown: ['a horizon of $1.89 \times 10^{16}$ m, about two light-years']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  # ---- formula checks (docs/CALC_TESTS_PLAN.md §6–7)
  - id: radiation-solution-solves-friedmann
    kind: identity
    where: 'formula "Scale factor, flat radiation-dominated universe": a ∝ t^(1/2) with the page''s ρ = 3/(32πGt²) must satisfy H² = (8π/3)Gρ at every time'
    inputs: {s1: 1 s}
    formula: (deriv('x**(1/2)', 'x', t) / t**(1/2))**2 / s1**2
    equals: 8 * pi / 3 * G * 3 / (32 * pi * G * (t * s1)**2)
    samples: {t: [1, 180, 3.15e7]}
    shown: ['a(t) \propto t^{1/2}']
    source: {cite: reading1, at: 'p. 14 (board)'}
    origin: mit

  - id: radiation-density-falls-as-a4
    kind: identity
    where: 'the same solution must have ρ ∝ 1/a⁴: ρ·a⁴ is the same at every time (a = t^(1/2) in seconds)'
    formula: 3 / (32 * pi * t**2) * (t**(1/2))**4
    equals: 3 / (32 * pi)
    samples: {t: [1, 180, 3.15e7]}
    shown: ['a(t) \propto t^{1/2}']
    source: {cite: reading1, at: 'p. 14 (board)'}
    origin: mit
