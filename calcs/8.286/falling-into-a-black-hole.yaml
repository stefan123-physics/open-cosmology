# Calculations on content/year-4/8.286/falling-into-a-black-hole.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Fall from rest at r0 = R r_s with R = 10, in units r_s = c = 1, r = (r0/2)(1 + cos η).
# Proper time to the centre (π/2)R^(3/2); to the horizon √R [R atan√(R − 1) + √(R − 1)] (the page's formulas).
# Schwarzschild time t = ln|(s + tan(η/2))/(s − tan(η/2))| + s[η + (R/2)(η + sin η)], s = √(R − 1);
# checked independently against a numerical integration of dt/dr (53.467, 59.836, 62.152 at r = 2, 1.01, 1.001).

page: content/year-4/8.286/falling-into-a-black-hole.mdx
calcs:
  - id: rs-sun
    where: 'quiz 1 and 2: r_s ≈ 2.95 km for the Sun'
    inputs: {}
    formula: 2 * G * M_sun / c**2
    expected: 2.95 km
    shown: ['about 2.95 km for the Sun', 'its Schwarzschild radius is 2.95 km']
    source: {cite: reading1, at: 'Lecture 14 (Schwarzschild radius)'}
    origin: page-own

  - id: rs-ten-suns
    where: 'quiz 3; worked example "Dropped towards a ten-solar-mass black hole", step "Scale"'
    inputs: {}
    formula: 2 * G * 10 * M_sun / c**2
    expected: 29.5 km
    shown: ['$r_s = 2GM/c^2 = 29.5$ km', '($r_s \\approx 29.5$ km)']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: rs-over-c
    where: 'worked example, step "Scale"'
    inputs: {}
    formula: 2 * G * 10 * M_sun / c**3
    expected: 9.85e-5 s
    shown: ['$r_s/c = 9.85 \times 10^{-5}$ s']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: tau-centre-units
    where: 'worked example, step "To the centre"; quiz 3; plot caption'
    inputs: {R: 10}
    formula: pi / 2 * R**1.5
    expected: '49.67'
    shown: ['= 49.67\,r_s/c \approx 4.89$ ms', '49.67 r_s/c at r = 0']
    source: {cite: reading1, at: 'Lecture 14 (radial infall)'}
    origin: page-own

  - id: tau-centre-ms
    where: 'worked example, step "To the centre"; quiz 3 answer "About 4.9 ms"'
    inputs: {R: 10}
    formula: pi / 2 * R**1.5 * 2 * G * 10 * M_sun / c**3
    expected: 4.89 ms
    shown: ['\\approx 4.89$ ms']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: quiz-fall-time
    where: 'quiz 3: roughly how long to reach r = 0 (answer "About 4.9 ms")'
    inputs: {R: 10}
    formula: pi / 2 * R**1.5 * 2 * G * 10 * M_sun / c**3
    expected: 4.9 ms
    shown: ['About 4.9 ms']
    quiz: 3
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: tau-horizon-units
    where: 'worked example, step "To the horizon"; plot caption'
    inputs: {R: 10}
    formula: sqrt(R) * (R * atan(sqrt(R - 1)) + sqrt(R - 1))
    expected: '48.99'
    shown: ['= 48.99\,r_s/c \approx 4.83$ ms', '48.99 r_s/c at the horizon']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: tau-horizon-ms
    where: 'worked example, step "To the horizon"; quiz 3 explanation'
    inputs: {R: 10}
    formula: sqrt(R) * (R * atan(sqrt(R - 1)) + sqrt(R - 1)) * 2 * G * 10 * M_sun / c**3
    expected: 4.83 ms
    shown: ['The horizon is crossed at 4.83 ms']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: horizon-to-centre
    where: 'worked example: about 0.068 ms; quiz 3 explanation: the last 0.07 ms'
    inputs: {R: 10}
    formula: (pi / 2 * R**1.5 - sqrt(R) * (R * atan(sqrt(R - 1)) + sqrt(R - 1))) * 2 * G * 10 * M_sun / c**3
    expected: 0.068 ms
    shown: ['takes only about 0.068 ms', 'the last 0.07 ms is the trip']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: outside-time-2rs
    where: 'worked example, step "Outside": reaches 2 r_s after 5.27 ms; plot caption 53.5'
    inputs: {R: 10, x: 2}
    formula: (log(abs((sqrt(R - 1) + tan(acos(2 * x / R - 1) / 2)) / (sqrt(R - 1) - tan(acos(2 * x / R - 1) / 2)))) + sqrt(R - 1) * (acos(2 * x / R - 1) + R / 2 * (acos(2 * x / R - 1) + sin(acos(2 * x / R - 1))))) * 2 * G * 10 * M_sun / c**3
    expected: 5.27 ms
    shown: ['reach $2\,r_s$ after 5.27 ms', '53.5 at r = 2 r_s']
    source: {cite: reading1, at: 'Lecture 14 (dt/dτ from the metric)'}
    origin: page-own

  - id: outside-time-101rs
    where: 'worked example, step "Outside": 1.01 r_s after 5.89 ms; plot caption 59.8'
    inputs: {R: 10, x: 1.01}
    formula: (log(abs((sqrt(R - 1) + tan(acos(2 * x / R - 1) / 2)) / (sqrt(R - 1) - tan(acos(2 * x / R - 1) / 2)))) + sqrt(R - 1) * (acos(2 * x / R - 1) + R / 2 * (acos(2 * x / R - 1) + sin(acos(2 * x / R - 1))))) * 2 * G * 10 * M_sun / c**3
    expected: 5.89 ms
    shown: ['$1.01\,r_s$ after 5.89 ms', '59.8 at 1.01 r_s']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: outside-time-1001rs-units
    where: 'plot caption: 62.2 at 1.001 r_s'
    inputs: {R: 10, x: 1.001}
    formula: log(abs((sqrt(R - 1) + tan(acos(2 * x / R - 1) / 2)) / (sqrt(R - 1) - tan(acos(2 * x / R - 1) / 2)))) + sqrt(R - 1) * (acos(2 * x / R - 1) + R / 2 * (acos(2 * x / R - 1) + sin(acos(2 * x / R - 1))))
    expected: '62.2'
    shown: ['62.2 at']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: factor-ten-closer
    where: 'worked example, step "Outside": every factor of 10 closer costs (r_s/c) ln 10 ≈ 0.23 ms'
    inputs: {}
    formula: log(10) * 2 * G * 10 * M_sun / c**3
    expected: 0.23 ms
    shown: ['(r_s/c)\ln 10 \approx 0.23$ ms']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own
