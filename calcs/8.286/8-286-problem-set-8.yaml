# Calculations on content/year-4/8.286/8-286-problem-set-8.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route
# (a closed form, a limit, or the physical rule written another way), and every number by numerical integration.
# Names in the formulas: Om, Or, Ov, Oms, Ok are the density fractions today; s, x, y, u are integration variables.

page: content/year-4/8.286/8-286-problem-set-8.mdx
calcs:
  # ---- quoted facts

  - id: p3-paper-redshift
    kind: fact
    where: 'Problem 3, statement: the redshift MIT''s set quotes from Friedman, Kaiser and Gallicchio'
    shown: ['the authors found $z = 3.65$']
    source: {cite: mit, at: 'Problem 3, p. 2'}
    origin: mit

  - id: p3-paper-parameters
    kind: fact
    where: 'Problem 3, statement: the parameters MIT''s set gives'
    shown: ['$\Omega_{\text{vac},0} = 0.685$, $\Omega_{m,0} = 0.315$, $\Omega_{\text{rad},0} = 0$ and $H_0 = 67.3$ km/s/Mpc']
    source: {cite: mit, at: 'Problem 3, p. 2'}
    origin: mit

  - id: p3-event-horizon-abstract
    kind: fact
    where: 'Problem 3(c): the event-horizon redshift in the paper''s abstract'
    shown: ['event horizon at a present redshift of 1.87']
    source: {cite: friedman2013, at: 'Abstract (arXiv:1305.3943)'}
    origin: mit

  - id: p5-guth-h0
    kind: fact
    where: 'Problem 5, statement: the Hubble constant that Guth found to match the paper''s curve'
    shown: ['matched best with $H_0 = 66$ km/s/Mpc']
    source: {cite: mit, at: 'Problem 5, p. 5'}
    origin: mit

  - id: p5-usual-h0
    kind: fact
    where: 'Problem 5, statement: the usual values MIT''s set mentions'
    shown: ['the values of 70 to 72 that were usual at the time']
    source: {cite: mit, at: 'Problem 5, p. 5'}
    origin: mit

  - id: p5-gold-count
    kind: fact
    where: 'Problem 5(b) and the first graph: the number of rows marked gold in MIT''s table of the Riess 2004 data (counted by script)'
    shown: ['Our own calculation with the 157 gold supernovae of MIT''s table', 'of the 157 gold supernovae, every sixth one']
    source: {cite: goldata, at: 'the rows marked gold'}
    origin: mit

  - id: p5-gold-above-one
    kind: fact
    where: 'First graph, caption: the number of gold supernovae with z above 1 in MIT''s table (counted by script)'
    shown: ['all nine above z = 1']
    source: {cite: goldata, at: 'the rows marked gold'}
    origin: mit

  - id: p5-gold-uncertainties
    kind: fact
    where: 'First graph, caption: the smallest and largest uncertainty of the gold rows of MIT''s table (93 of the 157 lie between 0.2 and 0.3)'
    shown: ['the listed uncertainties run from 0.17 to 0.81 magnitudes']
    source: {cite: goldata, at: 'the rows marked gold'}
    origin: mit

  # ---- the chi-squared fit of Problem 5(b): computed by a script from the 157 gold rows of MIT's table, which the harness cannot read.

  # ---- Method: mu_model from the formulas of Problem 1 with H0 = 66 km/s/Mpc; shift = weighted mean residual; chi2 after the shift.

  # ---- Unrounded: model 1: 0.2983, 324.70; model 2: 0.1767, 211.03; model 3: 0.0517, 177.13.

  - id: p5-fit-model1
    kind: fact
    where: 'Problem 5(b), table of the fit: model 1'
    shown: ['| 1: flat, matter only | 0.30 | 325 |']
    source: {cite: goldata, at: 'the rows marked gold (our own calculation)'}
    origin: page-own

  - id: p5-fit-model2
    kind: fact
    where: 'Problem 5(b), table of the fit: model 2'
    shown: ['| 2: open, matter only | 0.18 | 211 |']
    source: {cite: goldata, at: 'the rows marked gold (our own calculation)'}
    origin: page-own

  - id: p5-fit-model3
    kind: fact
    where: 'Problem 5(b), table of the fit: model 3'
    shown: ['| 3: flat, with vacuum energy | 0.05 | 177 |']
    source: {cite: goldata, at: 'the rows marked gold (our own calculation)'}
    origin: page-own

  # ---- Problem 1

  # ---- The open-universe flux against a known closed form: for matter only, H0 d_L/c = 2[Ωz + (Ω−2)(√(1+Ωz) − 1)]/Ω² (Mattig).

  # ---- psi is a free name in the answer box, so the samples carry psi = √(1−Ω_m) ∫ dz/((1+z)√(1+Ω_m z)), precomputed to 14 digits;

  # ---- the next entry checks that integral against the closed form by numerical integration.

  - id: p1-open-flux-against-closed-form
    kind: identity
    answer: p1-a
    where: 'Problem 1(a), answer box and formula "Flux in an open universe": against J = P/(4π d_L²) with the closed-form luminosity distance of an open matter-only universe'
    formula: P*H0**2*Ok/(4*pi*(1 + z)**2*c**2*sinh(psi)**2)
    equals: P/(4*pi*((c/H0)*2*(Om*z + (Om - 2)*(sqrt(1 + Om*z) - 1))/Om**2)**2)
    samples:
      P: [1, 5, 3.3, 1e36]
      H0: [0.5, 2, 1.3, 67]
      c: [1, 3, 2, 299792.458]
      z: [1.0, 0.5, 2.5, 0.2]
      Om: [0.3, 0.1, 0.6, 0.9]
      Ok: [0.7, 0.9, 0.4, 0.1]
      psi: [0.54605000014448, 0.38027896366408, 0.64369844860760, 0.05534033226813]
    tolerance: 1e-9
    shown: ['tex="J = \frac{P\,H_0^2\,\Omega_{k,0}}{4\pi\,(1+z_S)^2\,c^2\,\sinh^2\psi_D}"']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-open-psi-closed-form
    kind: identity
    where: 'Problem 1(a), check: the integral for ψ_D in an open matter-only universe against the closed form sinh ψ_D = √(1−Ω) H0 d_L/(c(1+z))'
    formula: sqrt(1 - Om)*integrate('1/sqrt(Om*(1 + s)**3 + (1 - Om)*(1 + s)**2)', 's', 0, z)
    equals: asinh(2*sqrt(1 - Om)*(Om*z + (Om - 2)*(sqrt(1 + Om*z) - 1))/(Om**2*(1 + z)))
    samples:
      Om: [0.3, 0.1, 0.6, 0.9]
      z: [1.0, 0.5, 2.5, 0.2]
    tolerance: 1e-9
    shown: ['$H_0\,d_L/c = 2\left[\Omega z + (\Omega - 2)(\sqrt{1 + \Omega z} - 1)\right]/\Omega^2$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  - id: p1-open-psi-sample
    where: 'Problem 1(a), check: ψ_D for Ω_m,0 = 0.3, no vacuum energy, z_S = 1 (the first psi sample above is this number)'
    formula: sqrt(0.7)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.7*(1 + s)**2)', 's', 0, 1)
    expected: '0.5461'
    shown: ['Integrating numerically, $\psi_D = 0.5461$']
    source: {cite: mit, at: 'Problem 1(a) (our own numbers)'}
    origin: page-own

  - id: p1-open-sinh-sample
    where: 'Problem 1(a), check: sinh ψ_D'
    formula: sinh(sqrt(0.7)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.7*(1 + s)**2)', 's', 0, 1))
    expected: '0.5736'
    shown: ['$\sinh\psi_D = 0.5736$, so']
    source: {cite: mit, at: 'Problem 1(a) (our own numbers)'}
    origin: page-own

  - id: p1-open-dl-sample
    where: 'Problem 1(a), check: H0 d_L/c from our formula'
    formula: 2*sinh(sqrt(0.7)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.7*(1 + s)**2)', 's', 0, 1))/sqrt(0.7)
    expected: '1.3712'
    shown: ['= 2 \times 0.5736/\sqrt{0.7} = 1.3712$ as well']
    source: {cite: mit, at: 'Problem 1(a) (our own numbers)'}
    origin: page-own

  - id: p1-open-dl-closed-form
    where: 'Problem 1(a), check: the closed form for Ω = 0.3, z = 1'
    inputs: {Om: 0.3, z: 1}
    formula: 2*(Om*z + (Om - 2)*(sqrt(1 + Om*z) - 1))/Om**2
    expected: '1.3712'
    shown: ['For $z_S = 1$ it gives 1.3712.']
    source: {cite: mit, at: 'Problem 1(a) (our own numbers)'}
    origin: page-own

  - id: p1-open-nearby-source
    kind: limit
    where: 'Problem 1(a), check: for small z_S, with ψ_D ≈ √Ω_k z_S, the flux becomes the inverse-square law at the distance c z_S/H0'
    inputs: {P: 3.3, H0: 1.3, c: 2, Ok: 0.4}
    formula: P*H0**2*Ok/(4*pi*(1 + z)**2*c**2*sinh(sqrt(Ok)*z)**2)
    limit: P/(4*pi*(c*z/H0)**2)
    vary: {z: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-3
    shown: ['$J \approx P/[4\pi\,(c\,z_S/H_0)^2]$']
    source: {cite: mit, at: 'Problem 1(a) (our own solution)'}
    origin: page-own

  # ---- The flat-universe flux as the limit Ω_k → 0 of the open-universe flux with ψ_D = √Ω_k I.

  - id: p1-flat-flux-as-limit
    kind: limit
    answer: p1-b
    where: 'Problem 1(b), answer box and formula "Flux in a flat universe": the limit of the open result as the curvature fraction goes to zero'
    inputs: {P: 3.3, H0: 1.3, c: 2, z: 1.25, I: 0.9}
    formula: P*H0**2/(4*pi*(1 + z)**2*c**2*I**2)
    limit: P*H0**2*Ok/(4*pi*(1 + z)**2*c**2*sinh(sqrt(Ok)*I)**2)
    vary: {Ok: [0.1, 0.01, 0.001, 0.00001]}
    tolerance: 1e-5
    shown: ['tex="J = \frac{P\,H_0^2}{4\pi\,(1+z_S)^2\,c^2\,I^2(z_S)}"']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-flat-flux-as-closed-limit
    kind: limit
    where: 'Problem 1(b), check: the closed universe gives the same limit'
    inputs: {P: 3.3, H0: 1.3, c: 2, z: 1.25, I: 0.9}
    formula: P*H0**2/(4*pi*(1 + z)**2*c**2*I**2)
    limit: P*H0**2*Ok/(4*pi*(1 + z)**2*c**2*sin(sqrt(Ok)*I)**2)
    vary: {Ok: [0.1, 0.01, 0.001, 0.00001]}
    tolerance: 1e-5
    shown: ['since $\sin\psi_D \approx \psi_D$ too']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-small-curvature-integral
    where: 'Problem 1(b), check: I_k for Ω_m,0 = 0.3, Ω_vac,0 = 0.6, z_S = 1'
    formula: integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1)
    expected: '0.7495'
    shown: ['Then $I_k = 0.7495$']
    source: {cite: mit, at: 'Problem 1(b) (our own numbers)'}
    origin: page-own

  - id: p1-small-curvature-psi
    where: 'Problem 1(b), check: ψ_D = √0.1 I_k'
    formula: sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1)
    expected: '0.2370'
    shown: ['$\psi_D = 0.2370$ and $\sinh\psi_D/\psi_D']
    source: {cite: mit, at: 'Problem 1(b) (our own numbers)'}
    origin: page-own

  - id: p1-small-curvature-ratio
    where: 'Problem 1(b), check: sinh ψ_D/ψ_D'
    formula: sinh(sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1))/(sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1))
    expected: '1.0094'
    shown: ['$\sinh\psi_D/\psi_D = 1.0094$']
    source: {cite: mit, at: 'Problem 1(b) (our own numbers)'}
    origin: page-own

  - id: p1-small-curvature-radius
    where: 'Problem 1(b), check: the open sphere is larger in radius, in percent'
    formula: 100*(sinh(sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1))/(sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1)) - 1)
    expected: '0.94'
    shown: ['the open sphere is 0.94% larger in radius']
    source: {cite: mit, at: 'Problem 1(b) (our own numbers)'}
    origin: page-own

  - id: p1-small-curvature-flux
    where: 'Problem 1(b), check: the flux is smaller, in percent'
    formula: 100*(1 - ((sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1))/sinh(sqrt(0.1)*integrate('1/sqrt(0.3*(1 + s)**3 + 0.6 + 0.1*(1 + s)**2)', 's', 0, 1)))**2)
    expected: '1.9'
    shown: ['and the flux is 1.9% smaller']
    source: {cite: mit, at: 'Problem 1(b) (our own numbers)'}
    origin: page-own

  - id: p1-matter-only-integral
    kind: identity
    where: 'Problem 1(b), check: the integral I for a flat matter-only universe in closed form'
    formula: integrate('(1 + s)**(-1.5)', 's', 0, z)
    equals: 2*(1 - 1/sqrt(1 + z))
    samples:
      z: [0.1, 0.5, 1.0, 2.5, 8.55]
    tolerance: 1e-9
    shown: ['$I = 2\left[1 - 1/\sqrt{1+z_S}\right]$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  - id: p1-matter-only-flux
    kind: identity
    where: 'Problem 1(b), check: with that integral the flat flux is the result of Problem Set 2, Problem 6'
    formula: P*H0**2/(4*pi*(1 + z)**2*c**2*integrate('(1 + s)**(-1.5)', 's', 0, z)**2)
    equals: P*H0**2/(16*pi*c**2*(1 + z)**2*(1 - 1/sqrt(1 + z))**2)
    samples:
      P: [1, 5, 3.3]
      H0: [0.5, 2, 67]
      c: [1, 3, 299792.458]
      z: [0.1, 1.25, 8.55]
    tolerance: 1e-9
    shown: ['$P\,H_0^2/\{16\pi\,c^2(1+z_S)^2[1 - 1/\sqrt{1+z_S}]^2\}$']
    source: {cite: mit, at: 'Problem 1(b) (our own solution)'}
    origin: page-own

  # ---- Problem 2

  # ---- The density against the rule each ingredient obeys in terms of the volume V = x³: 1/V, 1/V^(4/3), constant, 1/√V.

  - id: p2-density-by-volume
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Total mass density with mysterious stuff": each ingredient written with the volume x³'
    formula: 3*H0**2/(8*pi*G)*(Om/x**3 + Or/x**4 + Ov + Oms/x**(3/2))
    equals: 3*H0**2/(8*pi*G)*(Om/(x**3) + Or/(x**3)**(4/3) + Ov + Oms/sqrt(x**3))
    samples:
      H0: [0.5, 2, 1.3, 67]
      G: [1, 3, 2, 6.674e-11]
      Om: [0.1, 0.4, 0.3, 0.315]
      Or: [0.01, 0.1, 0.05, 9.2e-5]
      Ov: [0.1, 0.4, 0.3, 0.5]
      Oms: [0.1, 0.4, 0.2, 0.15]
      x: [0.1, 0.9, 0.5, 0.001]
    tolerance: 1e-12
    shown: ['tex="\rho(t) = \frac{3H_0^2}{8\pi G}\left[']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-density-today
    kind: identity
    where: 'Problem 2(a), check: at x = 1 the density is the sum of the four fractions times the critical density'
    formula: 3*H0**2/(8*pi*G)*(Om/x**3 + Or/x**4 + Ov + Oms/x**(3/2))
    equals: (Om + Or + Ov + Oms)*3*H0**2/(8*pi*G)
    samples:
      H0: [0.5, 2, 67]
      G: [1, 3, 6.674e-11]
      Om: [0.1, 0.4, 0.315]
      Or: [0.01, 0.1, 9.2e-5]
      Ov: [0.1, 0.4, 0.5]
      Oms: [0.1, 0.4, 0.15]
      x: [1, 1, 1]
    tolerance: 1e-12
    shown: ['At $x = 1$ the bracket is the sum of the four Ω''s']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  # ---- The integrand against dt = dx/(x H), with H from the Friedmann equation written with the densities of part (a).

  - id: p2-integrand-from-hubble-rate
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "Age of a universe with mysterious stuff": f(x) = H0/(x H(x))'
    formula: x/sqrt(Om*x + Or + Ov*x**4 + Oms*x**(5/2) + (1 - Om - Or - Ov - Oms)*x**2)
    equals: 1/(x*sqrt(Om/x**3 + Or/x**4 + Ov + Oms/x**(3/2) + (1 - Om - Or - Ov - Oms)/x**2))
    samples:
      Om: [0.1, 0.3, 0.2, 0.315]
      Or: [0.01, 0.05, 0.03, 9.2e-5]
      Ov: [0.1, 0.3, 0.2, 0.5]
      Oms: [0.1, 0.3, 0.25, 0.15]
      x: [0.1, 0.9, 0.5, 0.01]
    tolerance: 1e-12
    shown: ['tex="t_0 = \frac{1}{H_0}\int_0^1 \frac{x\,dx}{\sqrt{\Omega_{m,0}\,x + \Omega_{\text{rad},0} + \Omega_{\text{vac},0}\,x^4 + \Omega_{\text{ms},0}\,x^{5/2}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-age-matter-only
    where: 'Problem 2(b), check: matter only, the integral of x/√x from 0 to 1'
    inputs: {Om: 1, Or: 0, Ov: 0, Oms: 0}
    formula: integrate('x/sqrt(Om*x + Or + Ov*x**4 + Oms*x**(5/2) + (1 - Om - Or - Ov - Oms)*x**2)', 'x', 0, 1)
    expected: '0.66667'
    shown: ['the integral is $2/3$']
    source: {cite: mit, at: 'Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-age-mysterious-only
    where: 'Problem 2(b), check: mysterious stuff only, the integral of x/x^(5/4) from 0 to 1'
    inputs: {Om: 0, Or: 0, Ov: 0, Oms: 1}
    formula: integrate('x/sqrt(Om*x + Or + Ov*x**4 + Oms*x**(5/2) + (1 - Om - Or - Ov - Oms)*x**2)', 'x', 0, 1)
    expected: '1.33333'
    shown: ['and the integral is $4/3$']
    source: {cite: mit, at: 'Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-mysterious-power-law
    kind: identity
    where: 'Problem 2(b), check: a ∝ t^(4/3) has H = ȧ/a = 4/(3t), and then H ∝ a^(−3/4) as the Friedmann equation with ρ ∝ a^(−3/2) requires'
    formula: deriv('x**(4/3)', 'x', t)/t**(4/3)
    equals: 4/(3*t)
    samples:
      t: [0.5, 1, 2.5, 13.8]
    tolerance: 1e-7
    shown: ['and then $H = 4/(3t)$']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-mysterious-pressure
    where: 'Problem 2(b), check: ρ ∝ a^(−3/2) in ρ̇ = −3H(ρ + p/c²) gives p/(ρc²) = (3/2)/3 − 1'
    formula: (3/2)/3 - 1
    expected: '-0.5'
    shown: ['gives the pressure $p = -\tfrac12\rho c^2$']
    source: {cite: reading4, at: 'pp. 20–21 (board), applied to the mysterious stuff'}
    origin: page-own

  # ---- Problem 3

  - id: p3-substitution
    kind: identity
    where: 'Problem 3(b), formula "A well-behaved form of the integral": x = u² in the total integral'
    formula: integrate('1/sqrt(Om*x + Ov*x**4)', 'x', 0, 1)
    equals: integrate('2/sqrt(Om + Ov*u**6)', 'u', 0, 1)
    samples:
      Om: [0.315, 0.3, 1.0, 0.1]
      Ov: [0.685, 0.7, 0.0, 0.9]
    tolerance: 1e-7
    shown: ['= \int_0^1\frac{2\,du}{\sqrt{\Omega_{m,0} + \Omega_{\text{vac},0}\,u^6}}"']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-integrand-maximum
    where: 'Problem 3(b): the largest value of the new integrand, at u = 0'
    formula: 2/sqrt(0.315)
    expected: '3.56'
    shown: ['$2/\sqrt{0.315} = 3.56$']
    source: {cite: mit, at: 'Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-total-integral
    where: 'Problem 3(b): the total integral, without radiation'
    formula: integrate('2/sqrt(0.315 + 0.685*u**6)', 'u', 0, 1)
    expected: '3.2402'
    shown: ['numerical integration gives 3.2402']
    source: {cite: mit, at: 'Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-half-integral
    where: 'Problem 3(b): half of the total'
    formula: 0.5*integrate('2/sqrt(0.315 + 0.685*u**6)', 'u', 0, 1)
    expected: '1.6201'
    shown: ['Half of that is 1.6201.']
    source: {cite: mit, at: 'Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-lower-limit-u
    where: 'Problem 3(b): the lower limit in u'
    formula: solve("integrate('2/sqrt(0.315 + 0.685*u**6)', 'u', y, 1) - 0.5*integrate('2/sqrt(0.315 + 0.685*u**6)', 'u', 0, 1)", 'y', 0.05, 0.95)
    expected: '0.4553'
    shown: ['gives $u = 0.4553$ for it']
    source: {cite: mit, at: 'Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-lower-limit-x
    where: 'Problem 3(b): the scale factor when the signal reaches the quasar'
    formula: solve("integrate('1/sqrt(0.315*y + 0.685*y**4)', 'y', x, 1) - 0.5*integrate('2/sqrt(0.315 + 0.685*u**6)', 'u', 0, 1)", 'x', 0.05, 0.95)
    expected: '0.2073'
    shown: ['so $x_1 = 0.4553^2 = 0.2073$']
    source: {cite: mit, at: 'Problem 3 (our own numbers)'}
    origin: page-own

  - id: p3-redshift-no-radiation
    answer: p3-b
    where: 'Problem 3(b), answer box: the redshift at which I(z) is half the total, flat universe with Ω_m,0 = 0.315 and no radiation'
    formula: solve("integrate('1/sqrt(0.315*(1 + s)**3 + 0.685)', 's', 0, z) - 0.5*integrate('2/sqrt(0.315 + 0.685*u**6)', 'u', 0, 1)", 'z', 1, 10)
    expected: '3.82'
    shown: ['$z = 1/0.2073 - 1 = 3.82$.']
