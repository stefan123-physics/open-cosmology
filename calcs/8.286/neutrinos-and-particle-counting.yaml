# Calculations on content/year-4/8.286/neutrinos-and-particle-counting.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Quiz answers here are fractions (21/4, 10¾), which number-matching cannot read, so they are checked through the explanation text.

page: content/year-4/8.286/neutrinos-and-particle-counting.mdx
calcs:
  - id: g-neutrinos
    where: 'quiz 2 explanation: 7/8 × 3 flavours × 2 × 1 = 21/4'
    inputs: {}
    formula: 7/8 * 3 * 2 * 1
    expected: '5.25'
    shown: ['$\\frac78 \\times 3$ flavours $\\times\\ 2$ (particle and antiparticle) $\\times\\ 1$ spin state $= 21/4$']
    source: {cite: reading1, at: 'Lecture 17 (counting states)'}
    origin: mit

  - id: g-total
    where: 'quiz 3 explanation: 2 + 5.25 + 3.5 = 10.75'
    inputs: {}
    formula: 2 + 7/8 * 3 * 2 + 7/8 * 1 * 2 * 2
    expected: '10.75'
    shown: ['$2 + 5.25 + 3.5 = 10.75$']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: mit

  - id: radiation-today
    where: 'formula "Radiation energy density today"'
    inputs: {T: 2.725 K}
    formula: (2 + 21/4 * (4/11)**(4/3)) * pi**2 / 30 * (k_B * T)**4 / (hbar * c)**3
    expected: 7.01e-14 J/m**3
    shown: ['= 7.01 \times 10^{-14}\ \tfrac{\text{J}}{\text{m}^3}']
    source: {cite: reading1, at: '"Radiation energy density today" formula'}
    origin: mit

  - id: t-nu-factor
    where: 'worked example "The neutrino sea", step "Temperature"'
    inputs: {}
    formula: (4/11)**(1/3)
    expected: '0.714'
    shown: ['$T_\nu = (4/11)^{1/3} \times 2.725$ K $= 0.714 \times 2.725$ K $= 1.95$ K']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own

  - id: t-nu
    where: 'worked example, step "Temperature"; quiz 4 explanation (about 1.95 K)'
    inputs: {T: 2.725 K}
    formula: (4/11)**(1/3) * T
    expected: 1.95 K
    shown: ['= 1.95$ K.]', '4 \times 2.725$ K $= 1.95$ K.', 'about 1.95 K today']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own

  - id: n-nu-ratio
    where: 'worked example, step "Number density": (9/2)/2 × 4/11 = 9/11'
    inputs: {}
    formula: (9/2) / 2 * (4/11)
    expected: '0.8182'
    shown: ['= \dfrac{9}{11}$']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own

  - id: n-nu
    where: 'worked example, step "Number density": about 336 per cm³'
    inputs: {T: 2.725 K, zeta3: 1.2020569}
    formula: 9 / 11 * 2 * zeta3 / pi**2 * (k_B * T / (hbar * c))**3
    expected: 336 1/cm**3
    shown: ['\approx 336$ per cm³']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own

  - id: n-nu-per-flavour
    where: 'worked example, step "Number density": about 112 per flavour'
    inputs: {T: 2.725 K, zeta3: 1.2020569}
    formula: 9 / 11 * 2 * zeta3 / pi**2 * (k_B * T / (hbar * c))**3 / 3
    expected: 112 1/cm**3
    shown: ['about 112 per flavour']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own

  - id: u-nu-ratio
    where: 'worked example, step "Energy density": 0.681, neutrinos add 68%'
    inputs: {}
    formula: (21/4) / 2 * (4/11)**(4/3)
    expected: '0.681'
    shown: ['= 0.681$, so neutrinos add 68%']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own

  - id: u-total
    where: 'worked example, step "Energy density": total 7.01e-14 J/m³'
    inputs: {u_gamma: 4.17e-14 J/m**3}
    formula: u_gamma * (1 + (21/4) / 2 * (4/11)**(4/3))
    expected: 7.01e-14 J/m**3
    shown: ['giving $7.01 \times 10^{-14}$ J/m³ in total']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: page-own
