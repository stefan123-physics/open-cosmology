# Calculations on content/year-4/8.286/8-286-problem-set-10.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# the Friedmann equation by numerical differentiation (Problem 2), numerical integration (Problem 3),
# and a direct evaluation of the entropy and density formulas (Problem 4).

page: content/year-4/8.286/8-286-problem-set-10.mdx
calcs:
  # ---- Problem 2

  # a(t) for k > 0 must satisfy (da/dt)^2 = chi^2 a^2 − k c^2 at every time.
  - id: p2-closed-solves-friedmann
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box: the right side of the Friedmann equation, χ²a² − kc², against the square of the numerical derivative of a(t)'
    formula: sqrt(k)*c/chi*cosh(chi*t)
    equals: sqrt(deriv('sqrt(k)*c/chi*cosh(chi*x)', 'x', t)**2 + k*c**2) / chi
    samples:
      k: [0.5, 3, 1.7, 1, 2.2]
      c: [1, 3, 2, 299792.458, 1.3]
      chi: [0.5, 2, 1.1, 0.8, 1.6]
      t: [0.3, 2, 1.2, 0.7, 1.5]
    tolerance: 1e-6
    shown: ['a(t) = \frac{\sqrt{k}\,c}{\chi}\,\cosh\!\big(\chi\,(t - t_*)\big)']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-closed-minimum
    kind: identity
    where: 'Problem 2(a): at t = 0 the scale factor has its smallest value, √k c/χ, where χ²a² − kc² = 0'
    formula: chi**2 * (sqrt(k)*c/chi*cosh(chi*0))**2
    equals: k * c**2
    samples:
      k: [0.5, 3, 1.7]
      c: [1, 3, 2]
      chi: [0.5, 2, 1.1]
    shown: ['So $a$ can never be smaller than that, and at that value $\dot a = 0$.']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # a(t) for k < 0 must satisfy (da/dt)^2 = chi^2 a^2 + kappa c^2.
  - id: p2-open-solves-friedmann
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box: against the numerical derivative of a(t) in the Friedmann equation with k = −κ'
    formula: sqrt(kappa)*c/chi*sinh(chi*t)
    equals: sqrt(deriv('sqrt(kappa)*c/chi*sinh(chi*x)', 'x', t)**2 - kappa*c**2) / chi
    samples:
      kappa: [0.5, 3, 1.7, 1, 2.2]
      c: [1, 3, 2, 299792.458, 1.3]
      chi: [0.5, 2, 1.1, 0.8, 1.6]
      t: [0.3, 2, 1.2, 0.7, 1.5]
    tolerance: 1e-6
    shown: ['a(t) = \frac{\sqrt{\kappa}\,c}{\chi}\,\sinh\!\big(\chi\,(t - t_*)\big)']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-open-early
    kind: limit
    where: 'Problem 2(b), check: for small times a ≈ √κ c t'
    formula: sqrt(kappa)*c/chi*sinh(chi*t) / (sqrt(kappa)*c*t)
    limit: '1'
    inputs: {kappa: 1.7, c: 2, chi: 1.1}
    vary: {t: [0.1, 0.01, 0.001, 0.0001]}
    tolerance: 1e-6
    shown: ['so $a \approx \sqrt{\kappa}\,c\,(t - t_*)$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # The constant A: a(t) e^(−chi t) at large times.
  - id: p2-late-constant
    kind: identity
    answer: p2-c
    where: 'Problem 2(c), answer box: against a(t) e^(−χt) of the k > 0 solution at χt = 20'
    formula: sqrt(k)*c/(2*chi)
    equals: sqrt(k)*c/chi*cosh(20) * exp(-20)
    samples:
      k: [0.5, 3, 1.7, 1]
      c: [1, 3, 2, 299792.458]
      chi: [0.5, 2, 1.1, 0.8]
    tolerance: 1e-9
    shown: ['the constant is $A = \sqrt{k}\,c/(2\chi)$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-late-open
    kind: limit
    where: 'Problem 2(c): the k < 0 solution approaches the same exponential'
    formula: sinh(u) / (exp(u) / 2)
    limit: '1'
    vary: {u: [2, 5, 10, 20]}
    tolerance: 1e-9
    shown: ['The plus sign is for $k > 0$ and the minus sign for $k < 0$.']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-cosh-3
    where: 'Problem 2(c), check with numbers'
    inputs: {}
    formula: cosh(3)
    expected: '10.068'
    shown: ['$\cosh 3 = 10.068$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-half-exp-3
    where: 'Problem 2(c), check with numbers'
    inputs: {}
    formula: exp(3) / 2
    expected: '10.043'
    shown: ['$\tfrac12e^3 = 10.043$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-cosh-difference
    where: 'Problem 2(c), check with numbers: the two differ by 0.25%, which is e^(−6)'
    inputs: {}
    formula: (cosh(3) / (exp(3) / 2) - 1) * 100
    expected: '0.25'
    shown: ['They differ by 0.25%, which is $e^{-6}$.']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-exp-minus-6
    where: 'Problem 2(c), check with numbers: e^(−6) in percent'
    inputs: {}
    formula: exp(-6) * 100
    expected: '0.25'
    shown: ['They differ by 0.25%, which is $e^{-6}$.']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-tanh-3
    where: 'Problem 2(c), check with numbers: the Hubble rate in units of χ'
    inputs: {}
    formula: tanh(3)
    expected: '0.9951'
    shown: ['$\dot a/a = \chi\tanh 3 = 0.9951\,\chi$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-curvature-term
    kind: limit
    where: 'Problem 2(c): 1/cosh² falls as 4 e^(−2u)'
    formula: (1 / cosh(u)**2) / (4 * exp(-2*u))
    limit: '1'
    vary: {u: [2, 5, 10, 20]}
    tolerance: 1e-9
    shown: ['which falls as $4e^{-2\chi(t - t_*)}$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

