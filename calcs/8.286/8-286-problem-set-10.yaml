  # ---- Problem 4

  # kT_RH against a direct solution of rho_RH = rho_f for the temperature.
  - id: p4-reheat-formula
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), formula box: the black-body mass density at this temperature, g (π²/30) (kT)⁴, must give back E_f⁴ (the common factor ħ³c⁵ left out)'
    formula: Ef*(30/(pi**2*g))**(1/4)
    equals: solve('g * pi**2 / 30 * x**4 - Ef**4', 'x', 0.001, 10)
    samples:
      Ef: [0.5, 3, 1, 2.2]
      g: [50, 500, 300, 106.75]
    tolerance: 1e-6
    shown: ['kT_\text{RH} = \left(\frac{30}{\pi^2g_\text{RH}}\right)^{1/4}E_f']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-reheat-bracket
    where: 'Problem 4(a), step "The number"'
    inputs: {g: 300}
    formula: 30 / (pi**2 * g)
    expected: '0.01013'
    shown: ['$30/(9.870 \times 300) = 0.01013$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-pi-squared
    where: 'Problem 4(a), step "The number"'
    inputs: {}
    formula: pi**2
    expected: '9.870'
    shown: ['$30/(9.870 \times 300) = 0.01013$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-reheat-root
    where: 'Problem 4(a), step "The number"'
    inputs: {g: 300}
    formula: (30 / (pi**2 * g))**(1/4)
    expected: '0.3173'
    shown: ['its fourth root is 0.3173']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-reheat-energy
    answer: p4-a-num
    where: 'Problem 4(a), number box: kT_RH for E_f = 1e16 GeV and g_RH = 300, in units of 1e15 GeV'
    inputs: {Ef: 1e16 GeV, g: 300}
    formula: Ef * (30 / (pi**2 * g))**(1/4) / (1e15 * GeV)
    expected: '3.17'
    shown: ['$kT_\text{RH} = 3.17 \times 10^{15}$ GeV']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # a(t0)/a(te) against the cube root of the ratio of entropy densities, written out with all constants.
  - id: p4-expansion-formula
    kind: identity
    answer: p4-b
    where: 'Problem 4(b), formula box: against (s_RH/s_0)^(1/3) with s_0 the sum of photons and of neutrinos at T_ν = (4/11)^(1/3) T_γ'
    formula: (11*g/43)**(1/3)*TRH/T0
    equals: ((g * TRH**3) / (2 * T0**3 + (21/4) * ((4/11)**(1/3) * T0)**3))**(1/3)
    samples:
      g: [50, 500, 300, 106.75]
      TRH: [1, 5, 3.2, 2]
      T0: [0.5, 2, 1.1, 1]
    tolerance: 1e-9
    shown: ['= \left(\frac{11\,g_\text{RH}}{43}\right)^{1/3}\frac{T_\text{RH}}{T_{\gamma,0}}']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-g-today
    where: 'Problem 4(b), formula "Entropy density today": 2 + (21/4)(4/11) = 43/11'
    inputs: {}
    formula: (2 + 21/4 * 4/11) * 11
    expected: '43'
    tolerance: '1e-9'
    shown: ['\left[2 + \frac{21}{4}\cdot\frac{4}{11}\right]', '= \frac{43}{11}\cdot']
