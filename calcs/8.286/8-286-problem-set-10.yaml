  - id: p4-expansion
    where: 'Problem 4(b), check with numbers; Problem 4(c), step "The number"'
    inputs: {Ef: 1e16 GeV, g: 300, T: 2.725 K}
    formula: (11 * g / 43)**(1/3) * Ef * (30 / (pi**2 * g))**(1/4) / (k_B * T)
    expected: '5.74e28'
    shown: ['So $a(t_0)/a(t_e) = 5.74 \times 10^{28}$ for']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # The scaling f against the full expression for Z_min, divided by its value at E16 = 1, g = 300, beta = 1.
  # R (the horizon distance) and T0 are sampled too: they must cancel in the ratio.
  - id: p4-scaling
    kind: identity
    answer: p4-c-f
    where: 'Problem 4(c), formula box: Z_min = R H_i / (β c) × a(t_e)/a(t_0), built from parts (a) and (b), divided by its value at E16 = 1, g = 300, β = 1 (units with c = ħ = G = 1)'
    formula: E16*(g/300)**(-1/12)/beta
    equals: (R * sqrt(8*pi/3) * E16**2 / beta / ((11*g/43)**(1/3) * E16 * (30/(pi**2*g))**(1/4) / T0)) / (R * sqrt(8*pi/3) / ((11*300/43)**(1/3) * (30/(pi**2*300))**(1/4) / T0))
    samples:
      E16: [0.2, 5, 1, 2.3]
      g: [30, 3000, 300, 106.75]
      beta: [0.1, 0.9, 1, 0.5]
      R: [1, 7, 3, 0.4]
      T0: [1, 0.3, 2, 5]
    tolerance: 1e-9
    shown: ['Z_\text{min} = Z_1\,\frac{E_{16}}{\beta}\left(\frac{g_\text{RH}}{300}\right)^{-1/12}']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-ef-joule
    where: 'Problem 4(c), step "The number"'
    inputs: {Ef: 1e16 GeV}
    formula: Ef
    expected: 1.602e6 J
    shown: ['$= 1.602 \times 10^{6}$ J']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
