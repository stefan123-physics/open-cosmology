  # The integral, with Ω_k,0 = 1 − (sum of the others) as the lesson defines it.
  - id: p3-integral
    where: 'Problem 3(b), formula "A smooth form for numerical work": the integral over x, with Ω_k,0 = −9.2e-5'
    inputs: {Om: 0.315, Ov: 0.685, Or: 9.2e-5}
    formula: integrate('1 / sqrt(Om*x + Or + Ov*x**4 + (1 - Om - Ov - Or)*x**2)', 'x', 0, 1)
    expected: '3.180'
    shown: ['= 3.180" cite="mit"', 'gives 3.180.']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-integral-flat
    where: 'Problem 3(b), step "The curvature term": the flat reading, Ω_k,0 = 0, gives the same to four figures'
    inputs: {Om: 0.315, Ov: 0.685, Or: 9.2e-5}
    formula: integrate('1 / sqrt(Om*x + Or + Ov*x**4)', 'x', 0, 1)
    expected: '3.180'
    shown: ['they give the same result to four figures']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  # The substitution x = u^2 gives the same integral.
  - id: p3-substitution
    kind: identity
    where: 'Problem 3(b), formula "A smooth form for numerical work": the substitution x = u² leaves the integral unchanged'
    formula: integrate('2*x / sqrt(Om*x**2 + Or + Ov*x**8 + Ok*x**4)', 'x', 0, 1)
    equals: integrate('1 / sqrt(Om*x + Or + Ov*x**4 + Ok*x**2)', 'x', 0, 1)
    samples:
      Om: [0.315, 0.3, 1, 0.25]
      Ov: [0.685, 0.7, 0, 0.5]
      Or: [9.2e-5, 1e-3, 1e-2, 9.2e-5]
      Ok: [-9.2e-5, 0, 0, 0.25]
    tolerance: 1e-6
    shown: ['\int_0^1\frac{2u\,du}{\sqrt{\Omega_{m,0}\,u^2 + \Omega_{\text{rad},0} + \Omega_{\text{vac},0}\,u^8 + \Omega_{k,0}\,u^4}}']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-smooth-integrand-max
    where: 'Problem 3(b), step "The integral": the largest value of the smooth integrand, reached near u = 0.286 (found by a scan; the value there is recomputed here)'
    inputs: {Om: 0.315, Ov: 0.685, Or: 9.2e-5, u: 0.286}
    formula: 2*u / sqrt(Om*u**2 + Or + Ov*u**8)
    expected: '3.6'
    shown: ['never exceeds about 3.6']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-horizon-gly
