    inputs: {H0: 67.3 km/s/Mpc, Om: 0.315, Ov: 0.685, Or: 9.2e-5}
    formula: c / H0 * integrate('1 / sqrt(Om*x + Or + Ov*x**4 + (1 - Om - Ov - Or)*x**2)', 'x', 0, 1) / (1e9 * ly)
    expected: '46.2'
    shown: ['= 46.2\ \text{billion light-years}']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p3-horizon-mpc
