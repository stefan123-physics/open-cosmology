# Calculations on content/year-4/8.286/anthropic-multiverse.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# The quiz answer 10^380 is a power of ten, which number-matching cannot read; it is checked through the formula text.

page: content/year-4/8.286/anthropic-multiverse.mdx
calcs:
  - id: vacua-count
    where: 'formula "Vacua with a vacuum energy as small as ours"; quiz 1'
    inputs: {fraction_exp: -120, vacua_exp: 500}
    formula: fraction_exp + vacua_exp
    expected: '380'
    tolerance: '0.001'
    shown: ['10^{-120} \times 10^{500} = 10^{380}', '$10^{-120} \\times 10^{500} = 10^{380}$: rare, but plenty', '$10^{-120} \\times 10^{500} = 10^{380}$ vacua with']
    source: {cite: reading2, at: 'slide 6'}
    origin: mit

  - id: mean-matter-density
    where: 'worked example "How atypical is our neighbourhood?", step "Mean matter density"'
    inputs: {rho_c: 8.6e-30 g/cm**3}
    formula: 0.31 * rho_c
    expected: 2.7e-30 g/cm**3
    shown: ['$0.31 \times 8.6 \times 10^{-30} \approx 2.7 \times 10^{-30}$ g/cm³']
    source: {cite: reading1, at: 'p. 26'}
    origin: page-own

  - id: earth-ratio
    where: 'worked example, step "Ratio": about 2 × 10^30'
    inputs: {rho_E: 5.5 g/cm**3, rho_c: 8.6e-30 g/cm**3}
    formula: rho_E / (0.31 * rho_c)
    expected: 2e30
    shown: ['\approx 2 \times 10^{30}$']
    source: {cite: reading1, at: 'p. 26'}
    origin: page-own
