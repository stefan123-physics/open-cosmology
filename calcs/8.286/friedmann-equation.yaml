# Formula checks on content/year-4/8.286/friedmann-equation.mdx (docs/CALC_TESTS_PLAN.md §6).
# kind: units, every term must have the same units; Guth's "notch" is a unit of its own
# (a in m/notch, k in 1/notch²), so a wrong power of the notch fails.

page: content/year-4/8.286/friedmann-equation.mdx
calcs:
  - id: friedmann-units
    kind: units
    where: 'formula "The Friedmann equation": (ȧ/a)², (8π/3)Gρ and kc²/a² must all be 1/s²'
    inputs: {a: 2 m/notch, adot: 3e-18 m/(notch*s), rho: 1e-26 kg/m**3, k: 1 1/notch**2}
    terms: ['(adot / a)**2', '8 * pi / 3 * G * rho', 'k * c**2 / a**2']
    unit: 1/s**2
    shown: ['\left(\frac{\dot a}{a}\right)^2 = \frac{8\pi}{3}\,G\rho - \frac{k c^2}{a^2}']
    source: {cite: reading1, at: 'Lecture 7 ("The Friedmann equation")'}
    origin: mit

  - id: acceleration-units
    kind: units
    where: 'formula "The two Friedmann equations": ä and (4π/3)Gρa must have the same units'
    inputs: {a: 2 m/notch, addot: 1e-35 m/(notch*s**2), rho: 1e-26 kg/m**3}
    terms: ['addot', '4 * pi / 3 * G * rho * a']
    unit: m/(notch*s**2)
    shown: ['\ddot a = -\frac{4\pi}{3}G\rho\,a']
    source: {cite: reading1, at: 'Lecture 7'}
    origin: mit

  - id: curvature-units
    kind: units
    where: 'formulas "Curvature constant" and "Units of k": k = −2E/c² must be 1/notch²'
    inputs: {E: 1e-30 m**2/(notch**2*s**2), k: 1 1/notch**2}
    terms: ['k', '-2 * E / c**2']
    unit: 1/notch**2
    shown: ['k \equiv -\frac{2E}{c^2}', '= \frac{1}{\text{notch}^2}']
    source: {cite: reading1, at: 'Lecture 7 ("Units of k")'}
    origin: mit

  - id: rearranged
    kind: identity
    where: 'formula "Rearranged": (2/a²)E with E = ½ȧ² − (4π/3)Gρ_i/a must equal (ȧ/a)² − (8π/3)Gρ_i/a³ (dimensionless sample numbers, g for G)'
    formula: 2 / a**2 * (adot**2 / 2 - 4 * pi / 3 * g * rho_i / a)
    equals: (adot / a)**2 - 8 * pi / 3 * g * rho_i / a**3
    samples: {a: [1.3, 0.4, 2.0], adot: [0.4, 1.1, 0.05], g: [1, 0.5, 2], rho_i: [0.2, 0.03, 0.7]}
    shown: ['E = \tfrac12\,\dot a^2 - \frac{4\pi}{3}\,\frac{G\rho_i}{a}', '\left(\frac{\dot a}{a}\right)^2 - \frac{8\pi}{3}\,G\rho = \frac{2E}{a^2}']
    source: {cite: reading1, at: 'Lecture 7 ("Rearranged")'}
    origin: mit
