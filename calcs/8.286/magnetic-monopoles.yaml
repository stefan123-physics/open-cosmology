# Calculations on content/year-4/8.286/magnetic-monopoles.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/magnetic-monopoles.mdx
calcs:
  - id: g-over-e
    where: 'formula "Magnetic charge of a monopole"; worked example "Monopole numbers", step (a)'
    inputs: {alpha_inv: 137.036}
    formula: alpha_inv / 2
    expected: '68.5'
    shown: ['g = \frac{1}{2\alpha}\,e \approx 68.5\,e', '$g/e = 137.036/2 = 68.5$']
    source: {cite: reading1, at: 'p. 22'}
    origin: mit

  - id: force-ratio
    where: 'worked example, step (a); quiz 4 (answer "About 4,700 times")'
    inputs: {alpha_inv: 137.036}
    formula: (alpha_inv / 2)**2
    expected: '4700'
    shown: ['the force ratio is $68.5^2 = 4.7 \times 10^3$', '$68.5^2 \\approx 4{,}700$']
    quiz: 3
    source: {cite: reading1, at: 'p. 22'}
    origin: page-own

  - id: mass-gev
    where: 'worked example, step (b)'
    inputs: {alpha_inv: 137.036, E: 1e16 GeV}
    formula: alpha_inv * E
    expected: 1.4e18 GeV
    shown: ['$m_M \approx 137 \times 10^{16}$ GeV $= 1.4 \times 10^{18}$ GeV']
    source: {cite: reading1, at: 'p. 23 ("Monopole mass")'}
    origin: page-own

  - id: mass-kg
    where: 'worked example, step (b): about 2.4e-9 kg, about 2 micrograms'
    inputs: {alpha_inv: 137.036, E: 1e16 GeV}
    formula: alpha_inv * E / c**2
    expected: 2.4e-9 kg
    shown: ['$m_M \approx 2.4 \times 10^{-9}$ kg, about 2 micrograms']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: mass-protons
    where: 'worked example, step (b): 1.5e18 proton masses'
    inputs: {alpha_inv: 137.036, E: 1e16 GeV, m_p: 1.67262192e-27 kg}
    formula: alpha_inv * E / c**2 / m_p
    expected: 1.5e18
    shown: ['$1.5 \times 10^{18}$ proton masses']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: critical-number-density
    where: 'worked example, step (c): n_M ≈ 3.5e-18 per m³ (with the unrounded mass)'
    inputs: {alpha_inv: 137.036, E: 1e16 GeV, rho_c: 8.6e-27 kg/m**3}
    formula: rho_c / (alpha_inv * E / c**2)
    expected: 3.5e-18 1/m**3
    shown: ['\approx 3.5 \times 10^{-18}$ per m³']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own

  - id: cube-side
    where: 'worked example, step (c): one monopole in a cube about 660 km on a side'
    inputs: {alpha_inv: 137.036, E: 1e16 GeV, rho_c: 8.6e-27 kg/m**3}
    formula: (rho_c / (alpha_inv * E / c**2))**(-1/3)
    expected: 660 km
    shown: ['one monopole in a cube about 660 km on a side']
    source: {cite: reading1, at: 'p. 23'}
    origin: page-own
