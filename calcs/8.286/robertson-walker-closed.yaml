# Calculations on content/year-4/8.286/robertson-walker-closed.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/robertson-walker-closed.mdx
calcs:
  - id: hubble-length
    where: 'worked example "How curved could our universe be?", step "Hubble length"'
    inputs: {H: 67.3 km/s/Mpc}
    formula: c / H
    expected: 4450 Mpc
    shown: ['$c/H = 299{,}792 / 67.3 = 4450$ Mpc']
    source: {cite: reading1, at: 'p. 24 ("Radius of curvature from H and Ω")'}
    origin: page-own

  - id: radius-of-curvature
    where: 'worked example, step "Radius"'
    inputs: {H: 67.3 km/s/Mpc, dOmega: 0.005}
    formula: c / H / sqrt(dOmega)
    expected: 63000 Mpc
    shown: ['= 63{,}000$ Mpc, about 63 Gpc']
    source: {cite: reading1, at: 'p. 24'}
    origin: page-own

  - id: radius-vs-horizon
    where: 'worked example, step "Meaning": several times larger than the horizon distance (flat matter model, 2c/H)'
    inputs: {H: 67.3 km/s/Mpc, dOmega: 0.005}
    formula: (c / H / sqrt(dOmega)) / (2 * c / H)
    expected: '7'
    tolerance: '3'
    shown: ['several times larger than the horizon distance']
    source: {cite: reading1, at: 'p. 24'}
    origin: page-own

  - id: plot-omega-2
    where: 'plot point "Ω = 2: R = c/H"'
    inputs: {Omega: 2}
    formula: 1 / sqrt(Omega - 1)
    expected: '1'
    tolerance: '0.001'
    shown: ['{ x: 2, y: 1, label: "Ω = 2: R = c/H" }']
    source: {cite: reading1, at: 'p. 24'}
    origin: page-own

  # ---- formula checks (docs/CALC_TESTS_PLAN.md §6)
  - id: radius-from-friedmann
    kind: identity
    where: 'formula "Radius of curvature from H and Ω": R = cH⁻¹/√(Ω − 1) must equal a/√k with k taken from the Friedmann equation, kc²/a² = (8π/3)Gρ − H², ρ = Ω·3H²/8πG (a in m/notch, k in 1/notch²)'
    inputs: {H: 70 km/s/Mpc, a: 1 m/notch}
    formula: c / (H * sqrt(Omega - 1))
    equals: a / sqrt((8 * pi * G * (Omega * 3 * H**2 / (8 * pi * G)) / 3 - H**2) * a**2 / c**2)
    samples: {Omega: [1.0001, 1.01, 1.5, 3, 10]}
    shown: ['R = \frac{c\,H^{-1}}{\sqrt{\Omega - 1}}', 'R^2(t) = \frac{a^2(t)}{k}']
    source: {cite: reading1, at: 'p. 24'}
    origin: mit
