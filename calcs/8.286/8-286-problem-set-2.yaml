# Calculations on content/year-4/8.286/8-286-problem-set-2.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# numerical integration or differentiation of a(t) = b t^(2/3), with b sampled so that it must cancel.

page: content/year-4/8.286/8-286-problem-set-2.mdx
calcs:
  # ---- quoted facts

  - id: galaxy-redshift
    kind: fact
    where: 'section "The model universe and the galaxy": the redshift MIT''s set uses for UDFy-38135539'
    shown: ['reported a redshift of $z = 8.55$ from its spectrum']
    source: {cite: mit, at: 'Introduction to the problem set'}
    origin: mit

  - id: later-record-redshift
    kind: fact
    where: 'section "The model universe and the galaxy": a later development'
    shown: ['confirmed a galaxy at $z \approx 14.3$']
    source: {ref: 'S. Carniani et al., Nature 633, 318 (2024), arXiv:2405.18485: spectroscopic redshift 14.32 (+0.08, −0.20)'}
    origin: later-data

  # ---- Problem 1

  # The answer against a numerical integration of the light ray: a(t0) ∫ c dt / a(t) from te to t0.
  - id: p1-distance-by-integration
    kind: identity
    answer: p1-d
    where: 'Problem 1, answer box and formula "Physical distance to the galaxy today": against numerical integration of c/a(t), multiplied by a(t0)'
    formula: 3*c*t0*(1 - (te/t0)**(1/3))
    equals: b * t0**(2/3) * integrate('c / (b * x**(2/3))', 'x', te, t0)
    samples:
      c: [1, 3, 2, 299792.458, 1]
      t0: [5, 10, 7.3, 13.8, 1]
      te: [0.1, 2, 1.1, 0.47, 0.999]
      b: [1, 0.2, 37, 4.4, 2]
    tolerance: 1e-7
    shown: ['= 3c\,t_0\left[1 - \left(\frac{t_e}{t_0}\right)^{1/3}\right]']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-comoving-distance
    kind: identity
    where: 'Problem 1, formula "Comoving distance covered by the light": the integral in closed form'
    formula: (3*c/b) * (t0**(1/3) - te**(1/3))
    equals: integrate('c / (b * x**(2/3))', 'x', te, t0)
    samples:
      c: [1, 3, 2, 299792.458]
      t0: [5, 10, 7.3, 13.8]
      te: [0.1, 2, 1.1, 0.47]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-7
    shown: ['= \frac{3c}{b}\left(t_0^{1/3} - t_e^{1/3}\right)']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-check-recent
    where: 'Problem 1, check: t_e = 0.97 t_0, distance in units of c t_0'
    inputs: {r: 0.97}
    formula: 3 * (1 - r**(1/3))
    expected: '0.0303'
    shown: ['the formula gives $0.0303\,c\,t_0$']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-check-early
    where: 'Problem 1, check: t_e = t_0/8, distance in units of c t_0'
    inputs: {r: 0.125}
    formula: 3 * (1 - r**(1/3))
    expected: '1.5'
    shown: ['the formula gives $1.5\,c\,t_0$']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-check-early-static
    where: 'Problem 1, check: t_e = t_0/8, c (t_0 − t_e) in units of c t_0'
    inputs: {r: 0.125}
    formula: 1 - r
    expected: '0.875'
    shown: ['is only $0.875\,c\,t_0$']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  # ---- Problem 2

  - id: p2-redshift-from-times
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Redshift in the model universe": against the ratio of the two scale factors'
    formula: (t0/te)**(2/3) - 1
    equals: (b * t0**(2/3)) / (b * te**(2/3)) - 1
    samples:
      t0: [5, 10, 7.3, 13.8]
      te: [0.1, 2, 1.1, 0.47]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-12
    shown: ['z = \left(\frac{t_0}{t_e}\right)^{2/3} - 1']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-b-ratio
    answer: p2-b
    where: 'Problem 2(b), answer box: t_e/t_0 for z = 8.55'
    inputs: {z: 8.55}
    formula: (1 + z)**(-3/2)
    expected: '0.0339'
    shown: ['$t_e/t_0 = 1/29.51 = 0.0339$']
    source: {cite: mit, at: 'Problem 2 (z = 8.55 is MIT''s; the solution is our own)'}
    origin: page-own

  - id: p2-b-root
    where: 'Problem 2(b) and Problem 3(b): the square root of 1 + z'
    inputs: {z: 8.55}
    formula: sqrt(1 + z)
    expected: '3.090'
    shown: ['$\sqrt{9.55} = 3.090$', '$1/\sqrt{9.55} = 1/3.090 = 0.3236$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-b-three-halves
    where: 'Problem 2(b): (1 + z)^(3/2)'
    inputs: {z: 8.55}
    formula: (1 + z)**(3/2)
    expected: '29.51'
    shown: ['$9.55^{3/2} = 9.55 \times 3.090 = 29.51$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-b-back-check
    where: 'Problem 2(b), check: the rounded ratio put back into the redshift formula'
    inputs: {r: 0.0339}
    formula: r**(2/3)
    expected: '0.1047'
    shown: ['$0.0339^{2/3} = 0.1047 = 1/9.55$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-b-inverse-growth
    where: 'Problem 2(b), check: 1/(1 + z)'
    inputs: {z: 8.55}
    formula: 1 / (1 + z)
    expected: '0.1047'
    shown: ['0.1047 = 1/9.55$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-b-percent
    where: 'Problem 2(b), check: the age at emission as a percentage of the present age'
    inputs: {z: 8.55}
    formula: 100 * (1 + z)**(-3/2)
    expected: '3.4'
    shown: ['about 3.4% of its present age']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  # ---- Problem 3

  # The answer against a numerical integration of the light ray, with t0 = 2/(3 H0) and te = t0 (1 + z)^(-3/2).
  - id: p3-distance-by-integration
    kind: identity
    answer: p3-a
    where: 'Problem 3(a), answer box and formula "Present distance in terms of the redshift": against numerical integration of c/a(t) between t_e and t_0'
    formula: (2*c/H0)*(1 - 1/sqrt(1 + z))
    equals: b * (2/(3*H0))**(2/3) * integrate('c / (b * x**(2/3))', 'x', (2/(3*H0)) * (1 + z)**(-3/2), 2/(3*H0))
    samples:
      c: [1, 3, 2, 299792.458, 1]
      H0: [0.5, 2, 1.3, 67, 1]
      z: [0.1, 10, 1.25, 8.55, 1000]
      b: [1, 0.2, 37, 4.4, 2]
    tolerance: 1e-7
    shown: ['\ell_p(t_0) = \frac{2c}{H_0}\left[1 - \frac{1}{\sqrt{1+z}}\right]']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-hubble-rate
    kind: identity
    where: 'Problem 3(a), formula "Hubble expansion rate from the scale factor": the numerical derivative of b t^(2/3), divided by b t^(2/3), is 2/(3t)'
    formula: deriv('b * x**(2/3)', 'x', t) / (b * t**(2/3))
    equals: 2 / (3 * t)
    samples:
      t: [0.01, 1, 7.3, 13.8]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-7
    shown: ['= \frac{\tfrac{2}{3}\,b\,t^{-1/3}}{b\,t^{2/3}} = \frac{2}{3t}']
    source: {cite: reading1, at: 'pp. 22–23 (the formula for H)'}
    origin: page-own

  - id: p3-hubble-length
    where: 'Problem 3(b), step "The length c over the Hubble rate"'
    inputs: {H0: 67 km/s/Mpc}
    formula: c / H0
    expected: 4475 Mpc
    shown: ['$c/H_0 = 299\,792 / 67 = 4475$ Mpc']
    source: {cite: mit, at: 'Problem 3 (H₀ ≈ 67 km/s/Mpc is MIT''s)'}
    origin: page-own

  - id: p3-twice-hubble-length
    where: 'Problem 3(b), step "The length c over the Hubble rate"'
    inputs: {H0: 67 km/s/Mpc}
    formula: 2 * c / H0
    expected: 8949 Mpc
    shown: ['$2c/H_0 = 8949$ Mpc']
    source: {cite: mit, at: 'Problem 3 (H₀ ≈ 67 km/s/Mpc is MIT''s)'}
    origin: page-own

  - id: p3-inverse-root
    where: 'Problem 3(b), step "The factor that holds the redshift"'
    inputs: {z: 8.55}
    formula: 1 / sqrt(1 + z)
    expected: '0.3236'
    shown: ['= 1/3.090 = 0.3236$']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-redshift-factor
    where: 'Problem 3(b), step "The factor that holds the redshift"; Problem 4(b)'
    inputs: {z: 8.55}
    formula: 1 - 1 / sqrt(1 + z)
    expected: '0.6764'
    shown: ['$1 - 1/\sqrt{1+z} = 0.6764$', '= 2 \times 0.6764 = 1.35$']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-distance-mpc
    answer: p3-b-mpc
    where: 'Problem 3(b), answer box: the present distance in Mpc; also quoted in Problem 5'
    inputs: {H0: 67 km/s/Mpc, z: 8.55}
    formula: (2 * c / H0) * (1 - 1 / sqrt(1 + z))
    expected: 6053 Mpc
    shown: ['= 8949 \times 0.6764 = 6053$ Mpc', 'is 6053 Mpc away today']
    source: {cite: mit, at: 'Problem 3 (z and H₀ are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p3-distance-gly
    answer: p3-b-ly
    where: 'Problem 3(b), answer box: the present distance in billions of light-years'
    inputs: {H0: 67 km/s/Mpc, z: 8.55}
    formula: (2 * c / H0) * (1 - 1 / sqrt(1 + z)) / (1e9 * ly)
    expected: '19.7'
    shown: ['19.7 billion light-years.', 'now 19.7 billion light-years away']
    source: {cite: mit, at: 'Problem 3 (z and H₀ are MIT''s; the solution is our own)'}
    origin: page-own

  - id: p3-distance-ly
    where: 'Problem 3(b), step "The distance": in light-years'
    inputs: {H0: 67 km/s/Mpc, z: 8.55}
    formula: (2 * c / H0) * (1 - 1 / sqrt(1 + z))
    expected: 1.97e10 ly
    shown: ['$1.97 \times 10^{10}$ light-years']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-mpc-in-ly
    where: 'Problem 3(b), step "The distance": one megaparsec in light-years'
    inputs: {d: 1 Mpc}
    formula: d
    expected: 3.262e6 ly
    shown: ['$3.262 \times 10^{6}$ light-years']
    source: {cite: mit, at: 'Problem 3 (a unit conversion; our own solution)'}
    origin: page-own

  - id: p3-fraction-of-limit
    where: 'Problem 3(b), check: the distance as a percentage of 2c/H₀'
    inputs: {z: 8.55}
    formula: 100 * (1 - 1 / sqrt(1 + z))
    expected: '68'
    shown: ['The distance is 68% of the largest possible value']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-model-age
    where: 'Problem 3(b), check: the age of the model universe for H₀ = 67 km/s/Mpc'
    inputs: {H0: 67 km/s/Mpc}
    formula: 2 / (3 * H0)
    expected: 9.7 Gyr
    shown: ['$t_0 = 2/(3H_0) = 9.7$ billion years', 'The age of 9.7 billion years belongs']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-travel-time
    where: 'Problem 3(b), check: the travel time of the light'
    inputs: {H0: 67 km/s/Mpc, z: 8.55}
    formula: 2 / (3 * H0) * (1 - (1 + z)**(-3/2))
    expected: 9.4 Gyr
    shown: ['$t_0 - t_e = 9.4$ billion years']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  # ---- Problem 4

  # The answer against the numerical time derivative of the physical distance a(t) l_c at t0, with the comoving
  # distance l_c = (3c/b)(t0^(1/3) − te^(1/3)) held fixed and te = t0 (1 + z)^(-3/2).
  - id: p4-speed-by-derivative
    kind: identity
    answer: p4-a
    where: 'Problem 4(a), answer box and formula "Speed of recession today": against the numerical derivative of a(t) l_c at t_0'
    formula: 2*c*(1 - 1/sqrt(1 + z))
    equals: deriv('b * x**(2/3)', 'x', t0) * (3*c/b) * (t0**(1/3) - (t0 * (1 + z)**(-3/2))**(1/3))
    samples:
      c: [1, 3, 2, 299792.458]
      z: [0.1, 10, 3, 8.55]
      t0: [5, 10, 7.3, 13.8]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-7
    shown: ['= 2c\left[1 - \frac{1}{\sqrt{1+z}}\right]" cite="mit" at="Problem 4']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  - id: p4-speed-ratio
    answer: p4-b
    where: 'Problem 4(b), answer box: v/c for z = 8.55'
    inputs: {z: 8.55}
    formula: 2 * (1 - 1 / sqrt(1 + z))
    expected: '1.35'
    shown: ['= 2 \times 0.6764 = 1.35$', 'at 1.35 times the speed of light']
    source: {cite: mit, at: 'Problem 4 (z = 8.55 is MIT''s; the solution is our own)'}
    origin: page-own

  - id: p4-speed-of-light-redshift
    where: 'Problem 4, checks: the redshift at which the speed of recession today equals c'
    inputs: {z: 3}
    formula: 2 * (1 - 1 / sqrt(1 + z))
    expected: '1'
    tolerance: 1e-12
    shown: ['For $z = 3$ it is exactly $c$', 'every galaxy with $z > 3$ recedes today at more than $c$']
    source: {cite: mit, at: 'Problem 4 (our own solution)'}
    origin: page-own

  # ---- Problem 5

  # The answer against the angle on the comoving map, built from a(t) directly: comoving diameter w/a(te) over the
  # comoving distance (3c/b)(t0^(1/3) − te^(1/3)), with t0 = 2/(3 H0) and te = t0 (1 + z)^(-3/2).
  - id: p5-angle-on-the-map
    kind: identity
    answer: p5-a
    where: 'Problem 5(a), answer box and formula "Apparent angular size of the galaxy": against the comoving diameter over the comoving distance'
    formula: w*H0*(1 + z)/(2*c*(1 - 1/sqrt(1 + z)))
    equals: (w / (b * ((2/(3*H0)) * (1 + z)**(-3/2))**(2/3))) / ((3*c/b) * ((2/(3*H0))**(1/3) - ((2/(3*H0)) * (1 + z)**(-3/2))**(1/3)))
    samples:
      w: [1, 3, 0.02, 1.7]
      H0: [0.5, 2, 1.3, 67]
      z: [0.1, 10, 1.25, 8.55]
      c: [1, 3, 2, 299792.458]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-9
    shown: ['\theta = \frac{H_0\,w}{2c}\cdot\frac{1+z}{1 - 1/\sqrt{1+z}}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-ratio-to-static
    kind: identity
    answer: p5-b
    where: 'Problem 5(b), answer box: the angle of part (a) divided by w over the present distance'
    formula: 1 + z
    equals: (w*H0*(1 + z)/(2*c*(1 - 1/sqrt(1 + z)))) / (w / ((2*c/H0)*(1 - 1/sqrt(1 + z))))
    samples:
      w: [1, 3, 0.02, 1.7]
      H0: [0.5, 2, 1.3, 67]
      z: [0.1, 10, 1.25, 8.55]
      c: [1, 3, 2, 299792.458]
    tolerance: 1e-12
    shown: ['tex="\frac{\theta}{\theta_s} = 1 + z"']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-angle-in-u
    kind: identity
    where: 'Problem 5(c), formula "Angular size in terms of u": (1 + z)/(1 − 1/√(1 + z)) = u³/(u − 1) with u = √(1 + z)'
    formula: (1 + z) / (1 - 1/sqrt(1 + z))
    equals: sqrt(1 + z)**3 / (sqrt(1 + z) - 1)
    samples: {z: [0.1, 0.5, 1.25, 2, 8.55, 100]}
    tolerance: 1e-12
    shown: ['\frac{u^2}{(u-1)/u} = \frac{H_0\,w}{2c}\cdot\frac{u^3}{u-1}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-derivative-in-u
    kind: identity
    where: 'Problem 5(c), formula "Derivative of the angular size": numerical derivative of u³/(u − 1)'
    formula: deriv('x**3 / (x - 1)', 'x', u)
    equals: u**2 * (2*u - 3) / (u - 1)**2
    samples: {u: [1.1, 1.3, 1.5, 2, 3.09, 10]}
    tolerance: 1e-6
    shown: ['= \frac{u^2\,(2u-3)}{(u-1)^2}']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  # The redshift of the smallest angle, found numerically as the zero of dθ/dz, without the substitution u.
  - id: p5-minimum-redshift
    where: 'Problem 5(c): the redshift at which the angle is smallest (MIT states 1.25 in its hint)'
    inputs: {}
    formula: solve('(1 - 1/sqrt(1 + q)) - (1 + q) * 0.5 * (1 + q)**(-3/2)', 'q', 0.2, 8)
    expected: '1.25'
    tolerance: 1e-6
    shown: ['z = 1.25" cite="mit"', 'smallest at $z = 1.25$']
    source: {cite: mit, at: 'Problem 5 (hint)'}
    origin: mit

  - id: p5-minimum-angle
    where: 'Problem 5(c): the smallest angle in units of H₀ w/c'
    inputs: {z: 1.25}
    formula: (1 + z) / (2 * (1 - 1 / sqrt(1 + z)))
    expected: '3.375'
    tolerance: 1e-12
    shown: ['= 3.375\,H_0\,w/c$', '3.375 at $z = 1.25$']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-angle-z-half
    where: 'Problem 5(c), check with numbers: the angle in units of H₀ w/c at z = 0.5'
    inputs: {z: 0.5}
    formula: (1 + z) / (2 * (1 - 1 / sqrt(1 + z)))
    expected: '4.09'
    shown: ['the angle is 4.09 at $z = 0.5$']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-angle-z-two
    where: 'Problem 5(c), check with numbers: the angle in units of H₀ w/c at z = 2'
    inputs: {z: 2}
    formula: (1 + z) / (2 * (1 - 1 / sqrt(1 + z)))
    expected: '3.55'
    shown: ['3.55 at $z = 2$']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-angle-z-galaxy
    where: 'Problem 5(c), check with numbers: the angle in units of H₀ w/c at z = 8.55'
    inputs: {z: 8.55}
    formula: (1 + z) / (2 * (1 - 1 / sqrt(1 + z)))
    expected: '7.06'
    shown: ['7.06 at $z = 8.55$']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-angle-ratio-to-minimum
    where: 'Problem 5(c), check with numbers: the angle at z = 8.55 over the smallest angle'
    inputs: {z: 8.55}
    formula: (1 + z) / (2 * (1 - 1 / sqrt(1 + z))) / 3.375
    expected: '2'
    tolerance: 0.1
    shown: ['looks about twice as large']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-example-angle-rad
    where: 'Problem 5(a), check: a galaxy of diameter 1 kpc at z = 8.55, in radians'
    inputs: {H0: 67 km/s/Mpc, z: 8.55, w: 1 kpc}
    formula: (1 + z) * w / ((2 * c / H0) * (1 - 1 / sqrt(1 + z)))
    expected: '1.58e-6'
    shown: ['= 1.58 \times 10^{-6}$ radians']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-example-angle-arcsec
    where: 'Problem 5(a), check: the same angle in seconds of arc'
    inputs: {H0: 67 km/s/Mpc, z: 8.55, w: 1 kpc}
    formula: (1 + z) * w / ((2 * c / H0) * (1 - 1 / sqrt(1 + z))) * (180 * 3600 / pi)
    expected: '0.33'
    shown: ['which is 0.33 seconds of arc', 'the 0.33 seconds of arc of part (a)']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-example-static-arcsec
    where: 'Problem 5(b), check: the angle of the same galaxy in a static space at the present distance'
    inputs: {H0: 67 km/s/Mpc, z: 8.55, w: 1 kpc}
    formula: w / ((2 * c / H0) * (1 - 1 / sqrt(1 + z))) * (180 * 3600 / pi)
    expected: '0.034'
    shown: ['only 0.034 seconds of arc in the static space']
    source: {cite: mit, at: 'Problem 5 (our own numbers)'}
    origin: page-own

  - id: p5-emission-distance-formula
    kind: identity
    where: 'Problem 5(c), formula "Distance at the time of emission": a(t_e) l_c against the closed form'
    formula: (2*c/H0) * (1/(1 + z)) * (1 - 1/sqrt(1 + z))
    equals: b * ((2/(3*H0)) * (1 + z)**(-3/2))**(2/3) * (3*c/b) * ((2/(3*H0))**(1/3) - ((2/(3*H0)) * (1 + z)**(-3/2))**(1/3))
    samples:
      H0: [0.5, 2, 1.3, 67]
      z: [0.1, 10, 1.25, 8.55]
      c: [1, 3, 2, 299792.458]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-9
    shown: ['\ell_p(t_e) = \frac{2c}{H_0}\cdot\frac{1}{1+z}\left[1 - \frac{1}{\sqrt{1+z}}\right]']
    source: {cite: mit, at: 'Problem 5 (our own solution)'}
    origin: page-own

  - id: p5-emission-distance
    where: 'Problem 5(c): the distance between the galaxy and us when the light set out'
    inputs: {H0: 67 km/s/Mpc, z: 8.55}
    formula: (2 * c / H0) * (1 - 1 / sqrt(1 + z)) / (1 + z)
    expected: 634 Mpc
