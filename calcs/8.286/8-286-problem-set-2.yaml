  # ---- Problem 6

  # The answer against counting energy directly: the energy P dt sent in a time dt arrives divided by (1 + z),
  # during the time (1 + z) dt, over a sphere of radius lp.
  - id: p6-flux-by-counting
    kind: identity
    answer: p6-a
    where: 'Problem 6(a), answer box and formula "Flux in terms of the present distance": against the energy of a batch of photons, its arrival time and the area of the sphere'
    formula: P/(4*pi*lp**2*(1 + z)**2)
    equals: ((P * dt) / (1 + z)) / ((1 + z) * dt) / (4 * pi * lp**2)
    samples:
      P: [1, 5, 3.3, 1e36]
      lp: [1, 3, 0.4, 2e26]
      z: [0.1, 10, 1.25, 8.55]
      dt: [1, 0.01, 7, 3600]
    tolerance: 1e-12
    shown: ['= \frac{P}{4\pi\,(1+z)^2\,\ell_p(t_0)^2}']
    source: {cite: mit, at: 'Problem 6 (our own solution)'}
    origin: page-own

  # Part (b) against part (a) with the distance obtained by numerical integration of the light ray.
  - id: p6-flux-by-integration
    kind: identity
    answer: p6-b
    where: 'Problem 6(b), answer box and formula "Flux received from the galaxy": against part (a) with the distance from numerical integration of c/a(t)'
    formula: P*H0**2/(16*pi*c**2*(1 + z)**2*(1 - 1/sqrt(1 + z))**2)
    equals: P / (4 * pi * (1 + z)**2 * (b * (2/(3*H0))**(2/3) * integrate('c / (b * x**(2/3))', 'x', (2/(3*H0)) * (1 + z)**(-3/2), 2/(3*H0)))**2)
    samples:
      P: [1, 5, 3.3, 1e36]
      H0: [0.5, 2, 1.3, 67]
      c: [1, 3, 2, 299792.458]
      z: [0.1, 10, 1.25, 8.55]
      b: [1, 0.2, 37, 4.4]
    tolerance: 1e-7
    shown: ['J = \frac{P\,H_0^2}{16\pi\,c^2\,(1+z)^2\left[1 - \dfrac{1}{\sqrt{1+z}}\right]^2}']
    source: {cite: mit, at: 'Problem 6 (our own solution)'}
    origin: page-own

