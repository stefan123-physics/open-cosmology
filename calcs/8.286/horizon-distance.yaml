# Calculations on content/year-4/8.286/horizon-distance.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/horizon-distance.mdx
calcs:
  - id: hubble-length
    where: 'worked example, step "Hubble length"'
    inputs: {H0: 67.3 km/s/Mpc}
    formula: c / H0
    expected: 4450 Mpc
    shown: ['= 4450$ Mpc']
    source: {cite: reading1, at: "pp. 19–20 (formula); the number is the page's own"}
    origin: page-own

  - id: horizon-gpc
    where: 'worked example, step "Horizon"'
    inputs: {H0: 67.3 km/s/Mpc}
    formula: 2 * c / H0
    expected: 8.9 Gpc
    shown: ['= 8.9$ Gpc']
    source: {cite: reading1, at: "pp. 19–20"}
    origin: page-own

  - id: horizon-ly
    where: 'worked example, step "Horizon"'
    inputs: {H0: 67.3 km/s/Mpc}
    formula: 2 * c / H0
    expected: 29e9 ly
    shown: ['about 29 billion light-years']
    source: {cite: reading1, at: "pp. 19–20"}
    origin: page-own

  - id: horizon-equals-3ct0
    where: 'worked example, step "Compare with c times the age": the horizon is three times ct0'
    inputs: {H0: 67.3 km/s/Mpc}
    formula: (2 * c / H0) / (c * (2/3 / H0))
    expected: '3'
    shown: ['the horizon is three times that']
    source: {cite: reading1, at: "pp. 19–20"}
    origin: mit

  - id: ct0-model-age
    where: 'worked example, step "Compare with c times the age"'
    inputs: {H0: 67.3 km/s/Mpc}
    formula: c * (2/3 / H0)
    expected: 9.7e9 ly
    shown: ['$ct_0$ is 9.7 billion light-years']
    source: {cite: reading1, at: "p. 12 (age, Lecture 8)"}
    origin: page-own

  - id: plot-turnaround-time
    where: 'plot point "farthest point" (x); caption: turns around at t = (2/3)^3 t0'
    inputs: {}
    formula: (2/3)**3
    expected: '0.2963'
    shown: ['{ x: 0.2963, y: 0.4444, label: "farthest point" }', 'turns around at t = (2/3)³ t₀']
    source: {cite: reading1, at: "p. 17 (dx/dt = c/a)"}
    origin: page-own

  - id: plot-turnaround-distance
    where: 'plot point "farthest point" (y): 3 t^(2/3) - 3 t at t = (2/3)^3, in units of c t0'
    inputs: {t: 0.2962962963}
    formula: 3 * t**(2/3) - 3 * t
    expected: '0.4444'
    shown: ['y: 0.4444']
    source: {cite: reading1, at: "p. 17"}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: horizon-integral-is-3ct
    kind: identity
    where: 'formula "Horizon distance, flat matter-dominated": t₀^(2/3) ∫₀^t₀ dt / t^(2/3) = 3t₀ (the integrand blows up at t = 0), from very early to very late t₀'
    formula: t0**(2/3) * integrate('x**(-2/3)', 'x', 0, t0)
    equals: 3 * t0
    samples: {t0: [1e-6, 0.001, 1, 13.8, 1e4]}
    tolerance: 1e-8
    shown: ['= b\,t_0^{2/3}\cdot\frac{3c\,t_0^{1/3}}{b} = 3c\,t_0 = 2c\,H_0^{-1}']
    source: {cite: reading1, at: 'pp. 19–20'}
    origin: mit
