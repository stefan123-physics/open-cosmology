# Calculations on content/year-4/8.286/christoffel-symbols.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Plot: two points at latitude 45°, longitudes ±60°, on a unit sphere.

page: content/year-4/8.286/christoffel-symbols.mdx
calcs:
  - id: great-circle-peak
    where: 'plot caption: the great circle peaks at 63.4° latitude'
    inputs: {lat: 45, D: 60}
    formula: atan(tan(lat * pi / 180) / cos(D * pi / 180)) * 180 / pi
    expected: '63.4'
    shown: ['peaks at 63.4° latitude']
    source: {cite: reading1, at: 'Lecture 14 (geodesics on a sphere)'}
    origin: page-own

  - id: great-circle-length
    where: 'plot caption: length 1.318 radii'
    inputs: {lat: 45, D: 60}
    formula: acos(sin(lat * pi / 180)**2 + cos(lat * pi / 180)**2 * cos(2 * D * pi / 180))
    expected: '1.318'
    shown: ['has length 1.318 radii']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: latitude-circle-length
    where: 'plot caption: 1.481 radii along the circle of latitude'
    inputs: {lat: 45, D: 60}
    formula: cos(lat * pi / 180) * (2 * D * pi / 180)
    expected: '1.481'
    shown: ['against 1.481 radii along the circle of latitude']
    source: {cite: reading1, at: 'Lecture 14'}
    origin: page-own

  - id: tilted-great-circle-is-geodesic
    kind: identity
    where: 'worked example "Which paths on a sphere are geodesics?", the θ equation d²θ/ds² = sin θ cos θ (dφ/ds)²: a great circle tilted by i (cos θ = sin i · sin s, dφ/ds = cos i / sin²θ) must satisfy it'
    formula: deriv('acos(sin(i) * sin(x))', 'x', s, 2)
    equals: sin(acos(sin(i) * sin(s))) * cos(acos(sin(i) * sin(s))) * (cos(i) / sin(acos(sin(i) * sin(s)))**2)**2
    samples: {s: [0.3, 1.0, 2.2, 1.5], i: [0.5, 0.9, 1.2, 1.5]}
    tolerance: 1e-5
    shown: ['\sin\theta\cos\theta\left(\dfrac{d\phi}{ds}\right)^2']
    source: {cite: reading1, at: 'Lecture 14 (geodesic equation on a sphere)'}
    origin: page-own
