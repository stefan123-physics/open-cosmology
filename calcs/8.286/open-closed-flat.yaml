# Calculations on content/year-4/8.286/open-closed-flat.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/open-closed-flat.mdx
calcs:
  - id: rho-crit-coefficient
    where: 'formula "Critical density in numbers": 1.88 h0^2 x 10^-29 g/cm^3 (value for h0 = 1)'
    inputs: {H100: 100 km/s/Mpc}
    formula: 3 * H100**2 / (8 * pi * G)
    expected: 1.88e-29 g/cm**3
    shown: ['\rho_c = 1.88\,h_0^2 \times 10^{-29}\ \text{g/cm}^3']
    source: {cite: reading1, at: '"Critical density" formula'}
    origin: mit

  - id: rho-crit-h067
    where: 'quiz 5 explanation: rho_c ≈ 8.4e-30 g/cm^3 for h0 = 0.67'
    inputs: {H0: 67 km/s/Mpc}
    formula: 3 * H0**2 / (8 * pi * G)
    expected: 8.4e-30 g/cm**3
    shown: ['\\rho_c \\approx 8.4\\times10^{-30}\\ \\text{g/cm}^3$ for $h_0 = 0.67$']
    source: {cite: reading1, at: '"Critical density" formula'}
    origin: page-own

  - id: protons-per-m3
    where: 'quiz 5 (answer "About 5 protons per cubic metre"; checked here, not by number matching, because the wrong choice "per cubic centimetre" has the same number)'
    inputs: {H0: 67 km/s/Mpc, m_p: 1.67262192e-27 kg, V: 1 m**3}
    formula: 3 * H0**2 / (8 * pi * G) / m_p * V
    expected: '5'
    shown: ['about 5 proton masses per cubic metre', 'About 5 protons per cubic metre']
    source: {cite: reading1, at: '"Critical density" formula'}
    origin: page-own

  - id: a-max-omega-2
    where: 'worked example "How big does a closed universe get?", step "Numbers"'
    inputs: {Omega_i: 2}
    formula: Omega_i / (Omega_i - 1)
    expected: '2'
    tolerance: '0.001'
    shown: ['$\Omega_i = 2$ gives $a_{\max} = 2$']
    source: {cite: reading1, at: '"Maximum size of a closed universe" formula'}
    origin: page-own

  - id: a-max-omega-101
    where: 'worked example, step "Numbers"'
    inputs: {Omega_i: 1.01}
    formula: Omega_i / (Omega_i - 1)
    expected: '101'
    shown: ['$\Omega_i = 1.01$ gives $a_{\max} = 101$']
    source: {cite: reading1, at: '"Maximum size of a closed universe" formula'}
    origin: page-own

  - id: hubble-time-674
    where: 'worked example "The age of a flat matter-only universe", step "Numbers"'
    inputs: {H0: 67.4 km/s/Mpc}
    formula: 1 / H0
    expected: 14.5e9 yr
    shown: ['= 14.5$ billion years']
    source: {cite: reading1, at: '"Expansion speed" formula'}
    origin: page-own

  - id: age-674
    where: 'worked example, step "Numbers"'
    inputs: {H0: 67.4 km/s/Mpc}
    formula: 2 / (3 * H0)
    expected: 9.7e9 yr
    shown: ['t_0 = \tfrac23 \times 14.5 = 9.7$ billion years']
    source: {cite: reading1, at: '"Expansion speed" formula'}
    origin: page-own

  - id: plot-today-flat
    where: 'plot point "today (flat)" at x = 2/3 (age in units of 1/H0)'
    inputs: {}
    formula: 2/3
    expected: '0.6667'
    shown: ['{ x: 0.6667, y: 1, label: "today (flat)" }']
    source: {cite: reading1, at: '"Expansion speed" formula'}
    origin: page-own

  # ---- formula checks (docs/CALC_TESTS_PLAN.md §6–7)
  - id: matter-solution-solves-friedmann
    kind: identity
    where: 'formula "Flat, matter-dominated universe": a ∝ t^(2/3) must solve the flat Friedmann equation with ρ ∝ 1/a³, i.e. ȧ²·a must be the same at every time (4/9 for a = t^(2/3))'
    formula: deriv('x**(2/3)', 'x', t)**2 * t**(2/3)
    equals: 4 / 9
    samples: {t: [1e-4, 0.1, 1, 7, 50, 1e4]}
    shown: ['a(t) \propto t^{2/3}', '\frac{da}{dt} = \frac{\text{const}}{a^{1/2}}']
    source: {cite: reading1, at: '"Flat, matter-dominated universe" formula'}
    origin: mit
