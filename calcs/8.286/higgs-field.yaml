# Calculations on content/year-4/8.286/higgs-field.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Mostly quoted facts (kind: fact); the minimum neutrino mass sum is recomputed from the oscillation data.

page: content/year-4/8.286/higgs-field.mdx
calcs:
  - id: unification-energy
    kind: fact
    where: 'section "Symmetries that weren''t always broken": the grand-unification scale and the electroweak scale'
    shown: ['at a balmy $10^{16}$ GeV', 'weak symmetry breaks at energies around 100 GeV; $10^{16}$ GeV is the much higher scale']
    source: {cite: reading1, at: 'Lecture 22'}
    origin: mit

  - id: higgs-mass
    kind: fact
    where: 'callout "Later developments"'
    shown: ['has a mass of about 125 GeV']
    source: {ref: 'ATLAS and CMS (2012 discovery); Particle Data Group, Review of Particle Physics: m_H ≈ 125.2 GeV'}
    origin: later-data

  - id: katrin-limit
    kind: fact
    where: 'callout "Later developments"'
    shown: ['below about 0.45 eV (2025)']
    source: {ref: 'KATRIN Collaboration, Science 388, 180 (2025): effective electron-neutrino mass below 0.45 eV (90% CL)'}
    origin: later-data

  - id: cosmological-mass-sum
    kind: fact
    where: 'callout "Later developments"'
    shown: ['add up to less than roughly 0.1 eV']
    source: {ref: 'Planck 2018 and DESI 2024 analyses, assuming ΛCDM: sum of neutrino masses below about 0.07–0.12 eV'}
    origin: later-data

  - id: minimum-mass-sum
    where: 'callout "Later developments": the minimum sum the oscillation data require (normal ordering, lightest mass 0): √Δm²₃₁ + √Δm²₂₁'
    inputs: {dm31: 2.5e-3, dm21: 7.4e-5, eV1: 1 eV}
    formula: (sqrt(dm31) + sqrt(dm21)) * eV1
    expected: 0.06 eV
    shown: ['close to the minimum of about 0.06 eV that oscillations require']
    source: {ref: 'Global fits of neutrino oscillation data (e.g. NuFIT 5): Δm²₃₁ ≈ 2.5 × 10⁻³ eV², Δm²₂₁ ≈ 7.4 × 10⁻⁵ eV²'}
    origin: later-data
