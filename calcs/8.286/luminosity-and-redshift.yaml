# Calculations on content/year-4/8.286/luminosity-and-redshift.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Flat universes: H0 dL/c = (1 + z) ∫0^z dz'/E(z'), E = √(Ωm(1+z)³ + Ωv). Matter only: 2(1+z)(1 − 1/√(1+z)).

page: content/year-4/8.286/luminosity-and-redshift.mdx
calcs:
  - id: matter-only-integral
    where: 'worked example "A supernova at z = 0.5", step "(A) Matter only"'
    inputs: {z: 0.5}
    formula: 2 * (1 - 1 / sqrt(1 + z))
    expected: '0.3670'
    shown: ['= 2(1 - 1/\sqrt{1.5}) = 0.3670$']
    source: {cite: reading1, at: 'Lecture 19 (luminosity distance)'}
    origin: page-own

  - id: matter-only-hdl
    where: 'worked example, step "(A) Matter only"'
    inputs: {z: 0.5}
    formula: (1 + z) * 2 * (1 - 1 / sqrt(1 + z))
    expected: '0.5505'
    shown: ['$H_0d_L/c = 1.5 \times 0.3670 = 0.5505$']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: hubble-length-70
    where: 'worked example, step "(A) Matter only": c/H0 = 4283 Mpc'
    inputs: {H0: 70 km/s/Mpc}
    formula: c / H0
    expected: 4283 Mpc
    shown: ['With $c/H_0 = 4283$ Mpc']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: matter-only-dl
    where: 'worked example, step "(A) Matter only"'
    inputs: {z: 0.5, H0: 70 km/s/Mpc}
    formula: (1 + z) * 2 * (1 - 1 / sqrt(1 + z)) * c / H0
    expected: 2358 Mpc
    shown: ['$d_L = 2358$ Mpc']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: lcdm-integral
    where: 'worked example, step "(B) Matter + vacuum energy"'
    inputs: {Om: 0.3, Ov: 0.7}
    formula: integrate('1 / sqrt(Om * (1 + z)**3 + Ov)', 'z', 0, 0.5)
    expected: '0.4410'
    shown: ['\int_0^{0.5}dz/E = 0.4410$, so $H_0d_L/c = 0.6615$ and $d_L = 2833$ Mpc']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: lcdm-dl
    where: 'worked example, step "(B) Matter + vacuum energy"'
    inputs: {Om: 0.3, Ov: 0.7, H0: 70 km/s/Mpc}
    formula: 1.5 * integrate('1 / sqrt(Om * (1 + z)**3 + Ov)', 'z', 0, 0.5) * c / H0
    expected: 2833 Mpc
    shown: ['$d_L = 2833$ Mpc']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: fainter-z05
    where: 'worked example, step "How much fainter"; quiz 5; plot caption 69% at z = 0.5'
    inputs: {Om: 0.3, Ov: 0.7, z: 0.5}
    formula: (2 * (1 - 1 / sqrt(1 + z)) / integrate('1 / sqrt(Om * (1 + y)**3 + Ov)', 'y', 0, z))**2
    expected: '0.69'
    shown: ['$J_B/J_A = (0.5505/0.6615)^2 = 0.69$', 'the candle looks 69% as bright at z = 0.5']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: quiz-fainter
    where: 'quiz 5: answer "About 69% as bright"'
    inputs: {Om: 0.3, Ov: 0.7, z: 0.5}
    formula: 100 * (2 * (1 - 1 / sqrt(1 + z)) / integrate('1 / sqrt(Om * (1 + y)**3 + Ov)', 'y', 0, z))**2
    expected: '69'
    shown: ['About 69% as bright']
    quiz: 4
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: fainter-z1
    where: 'plot caption: 58% at z = 1'
    inputs: {Om: 0.3, Ov: 0.7, z: 1}
    formula: (2 * (1 - 1 / sqrt(1 + z)) / integrate('1 / sqrt(Om * (1 + y)**3 + Ov)', 'y', 0, z))**2
    expected: '0.58'
    shown: ['and 58% at z = 1']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  - id: closed-psi
    where: 'worked example, step "A little curvature": ψ_d = √0.01 ∫ dz/E = 0.0440'
    inputs: {Om: 0.31, Ov: 0.70, Ok: -0.01}
    formula: sqrt(-Ok) * integrate('1 / sqrt(Om * (1 + z)**3 + Ov + Ok * (1 + z)**2)', 'z', 0, 0.5)
    expected: '0.0440'
    shown: ['= 0.0440$ radians']
    source: {cite: reading1, at: 'Lecture 19 (closed-universe luminosity distance)'}
    origin: page-own

  - id: closed-hdl
    where: 'worked example, step "A little curvature"'
    inputs: {Om: 0.31, Ov: 0.70, Ok: -0.01}
    formula: 1.5 * sin(sqrt(-Ok) * integrate('1 / sqrt(Om * (1 + z)**3 + Ov + Ok * (1 + z)**2)', 'z', 0, 0.5)) / sqrt(-Ok)
    expected: '0.6603'
    shown: ['= 0.6603$, only 0.2% below the flat value']
    source: {cite: reading1, at: 'Lecture 19'}
    origin: page-own

  # ---- formula checks (docs/CALC_TESTS_PLAN.md §6)
  - id: closed-distance-flat-limit
    kind: limit
    where: 'formula "Angle to a source at redshift z_s" with ã(t₀) = cH₀⁻¹/√(−Ω_k): H₀ã sin ψ/c = sin(√|Ω_k| I)/√|Ω_k| must become the flat integral I as Ω_k → 0 (Ω_m = 0.3, Ω_vac = 0.7 − Ω_k)'
    inputs: {Om: 0.3}
    formula: sin(sqrt(-Ok) * integrate('1 / sqrt(Om * (1 + z)**3 + (0.7 - Ok) + Ok * (1 + z)**2)', 'z', 0, 0.5)) / sqrt(-Ok)
    limit: integrate('1 / sqrt(Om * (1 + z)**3 + 0.7)', 'z', 0, 0.5)
    vary: {Ok: [-0.1, -0.01, -0.001, -0.0001, -0.00001, -0.000001]}
    tolerance: 2e-6
    shown: ['\psi(z_s) = \sqrt{|\Omega_{k,0}|}\int_0^{z_s}', '\tilde a(t_0) = \frac{c\,H_0^{-1}}{\sqrt{-\Omega_{k,0}}}']
    source: {cite: reading1, at: 'Lecture 19 ("Angle to a source")'}
    origin: mit

  - id: radial-angle-derivative
    kind: identity
    where: 'formula "Radial angle": from sin ψ = √k r, dψ/dr must equal √k/√(1 − kr²)'
    formula: deriv('asin(sqrt(k) * x)', 'x', r)
    equals: sqrt(k) / sqrt(1 - k * r**2)
    samples: {k: [0.5, 1, 2, 1], r: [0.3, 0.6, 0.5, 0.99]}
    tolerance: 1e-6
    shown: ['d\psi = \frac{\sqrt k\,dr}{\cos\psi} = \frac{\sqrt k\,dr}{\sqrt{1 - kr^2}}']
    source: {cite: reading1, at: 'Lecture 19 ("Radial angle")'}
    origin: mit
