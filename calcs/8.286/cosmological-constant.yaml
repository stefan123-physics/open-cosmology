# Calculations on content/year-4/8.286/cosmological-constant.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/cosmological-constant.mdx
calcs:
  - id: rho-c
    where: 'worked example "How much vacuum energy?", step "Density"'
    inputs: {H0: 67 km/s/Mpc}
    formula: 3 * H0**2 / (8 * pi * G)
    expected: 8.43e-27 kg/m**3
    shown: ['= 8.43 \times 10^{-27}$ kg/m³']
    source: {cite: reading1, at: 'Lecture 18 (critical density)'}
    origin: page-own

  - id: rho-vac
    where: 'worked example, step "Density"'
    inputs: {H0: 67 km/s/Mpc}
    formula: 0.7 * 3 * H0**2 / (8 * pi * G)
    expected: 5.90e-27 kg/m**3
    shown: ['= 0.7\rho_c = 5.90 \times 10^{-27}$ kg/m³']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: hydrogen-atoms
    where: 'worked example, step "Density": about 3.5 hydrogen atoms'' worth per cubic metre'
    inputs: {H0: 67 km/s/Mpc, m_H: 1.6735575e-27 kg, V: 1 m**3}
    formula: 0.7 * 3 * H0**2 / (8 * pi * G) * V / m_H
    expected: '3.5'
    shown: ['about 3.5 hydrogen atoms'' worth per cubic metre']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: u-vac
    where: 'worked example, step "Energy and pressure" (and p_vac = −u_vac)'
    inputs: {H0: 67 km/s/Mpc}
    formula: 0.7 * 3 * H0**2 / (8 * pi * G) * c**2
    expected: 5.3e-10 J/m**3
    shown: ['= 5.3 \times 10^{-10}$ J/m³, so $p_\text{vac} = -5.3 \times 10^{-10}$ Pa']
    source: {cite: reading1, at: 'Lecture 18 (vacuum pressure)'}
    origin: page-own

  - id: lambda
    where: 'worked example, step "Λ"'
    inputs: {H0: 67 km/s/Mpc}
    formula: 8 * pi * G * (0.7 * 3 * H0**2 / (8 * pi * G)) / c**2
    expected: 1.1e-52 1/m**2
    shown: ['= 1.1 \times 10^{-52}$ m⁻²']
    source: {cite: reading1, at: 'Lecture 18 (Λ and vacuum energy)'}
    origin: page-own

  - id: h-vac
    where: 'worked example, step "Doubling time"'
    inputs: {H0: 67 km/s/Mpc}
    formula: sqrt(0.7) * H0
    expected: 56 km/s/Mpc
    shown: ['$H_\text{vac} = \sqrt{0.7}\,H_0 = 56$ km/s/Mpc']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: hubble-time-vac
    where: 'worked example, step "Doubling time"'
    inputs: {H0: 67 km/s/Mpc}
    formula: 1 / (sqrt(0.7) * H0)
    expected: 17.4e9 yr
    shown: ['$1/H_\text{vac} = 17.4$ billion years']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: doubling-time
    where: 'worked example, step "Doubling time": ln 2 / H_vac ≈ 12 billion years'
    inputs: {H0: 67 km/s/Mpc}
    formula: log(2) / (sqrt(0.7) * H0)
    expected: 12e9 yr
    shown: ['$\ln 2/H_\text{vac} \approx 12$ billion years']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own

  - id: plot-age-units
    where: 'plot caption: for Ω_vac = 0.7 the age is 0.964/H₀ instead of 0.667/H₀'
    inputs: {Ov: 0.7}
    formula: 2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov)
    expected: '0.964'
    shown: ['the age is 0.964/H₀ instead of 0.667/H₀']
    source: {cite: reading1, at: 'Lecture 18 (standard flat ΛCDM solution, not derived in the lecture)'}
    origin: page-own

  - id: plot-age-years
    where: 'plot caption: 14.1 instead of 9.7 billion years for h₀ = 0.67'
    inputs: {Ov: 0.7, H0: 67 km/s/Mpc}
    formula: 2 / 3 * log((1 + sqrt(Ov)) / (1 - sqrt(Ov))) / 2 / sqrt(Ov) / H0
    expected: 14.1e9 yr
    shown: ['14.1 instead of 9.7 billion years for h₀ = 0.67']
    source: {cite: reading1, at: 'Lecture 18'}
    origin: page-own
