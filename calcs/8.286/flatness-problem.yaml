# Calculations on content/year-4/8.286/flatness-problem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# (Ω − 1)/Ω grows like t^(2/3) in the matter era and like t in the radiation era.

page: content/year-4/8.286/flatness-problem.mdx
calcs:
  - id: quiz-one-second
    where: 'quiz 4 explanation; plot caption: with 0.01 today, 1.5e-18 at one second'
    inputs: {b: 0.01, t_eq: 5e4 yr, t0: 13.8e9 yr, t1: 1 s}
    formula: b * (t_eq / t0)**(2/3) * (t1 / t_eq)
    expected: 1.5e-18
    shown: ['\\approx 1.5\\times10^{-18}$', 'the value at one second is 1.5 × 10⁻¹⁸']
    source: {cite: reading1, at: 'pp. 14–15 (board)'}
    origin: mit

  - id: bound-1980
    where: 'quiz 5: a bound 1000 times weaker still requires |Ω − 1| ≲ 10^-15 at one second'
    inputs: {b: 10, t_eq: 5e4 yr, t0: 13.8e9 yr, t1: 1 s}
    formula: log10(b * (t_eq / t0)**(2/3) * (t1 / t_eq))
    expected: '-15'
    tolerance: '0.5'
    shown: ['still requires $|\\Omega - 1| \\lesssim 10^{-15}$ at one second']
    source: {cite: reading1, at: 'pp. 14–15 (board)'}
    origin: mit

  - id: plot-one-second
    where: 'plot point "1 s (Planck bound)" (y = log10)'
    inputs: {b: 0.01, t_eq: 5e4 yr, t0: 13.8e9 yr, t1: 1 s}
    formula: log10(b * (t_eq / t0)**(2/3) * (t1 / t_eq))
    expected: '-17.8'
    shown: ['{ x: 0, y: -17.8, label: "1 s (Planck bound)" }']
    source: {cite: reading1, at: 'pp. 14–15 (board)'}
    origin: page-own

  - id: plot-equality-x
    where: 'plot point "equality, 50,000 yr" (x = log10 of the time in seconds)'
    inputs: {t_eq: 5e4 yr, t1: 1 s}
    formula: log10(t_eq / t1)
    expected: '12.198'
    shown: ['{ x: 12.198, y: -5.6, label: "equality, 50,000 yr" }']
    source: {cite: reading1, at: 'p. 14 (board)'}
    origin: page-own

  - id: plot-equality-y
    where: 'plot point "equality, 50,000 yr" (y = log10)'
    inputs: {b: 0.01, t_eq: 5e4 yr, t0: 13.8e9 yr}
    formula: log10(b * (t_eq / t0)**(2/3))
    expected: '-5.6'
    shown: ['y: -5.6']
    source: {cite: reading1, at: 'p. 14 (board)'}
    origin: page-own

  - id: we-time-ratio
    where: 'worked example "Pushing the numbers", step "Matter era"'
    inputs: {t_eq: 47000 yr, t0: 13.8e9 yr}
    formula: t_eq / t0
    expected: 3.41e-6
    shown: ['(3.41 \times 10^{-6})^{2/3} = 2.26 \times 10^{-4}$']
    source: {cite: reading1, at: 'p. 14 (board)'}
    origin: page-own

  - id: we-matter-factor
    where: 'worked example, step "Matter era"'
    inputs: {t_eq: 47000 yr, t0: 13.8e9 yr}
    formula: (t_eq / t0)**(2/3)
    expected: 2.26e-4
    shown: ['= 2.26 \times 10^{-4}$']
    source: {cite: reading1, at: 'p. 14 (board)'}
    origin: page-own

  - id: we-equality-seconds
    where: 'worked example, step "Radiation era"'
    inputs: {t_eq: 47000 yr}
    formula: t_eq
    expected: 1.48e12 s
    shown: ['47,000 yr $= 1.48 \times 10^{12}$ s']
    source: {cite: reading1, at: 'p. 15 (board)'}
    origin: page-own

  - id: we-radiation-factor
    where: 'worked example, step "Radiation era"'
    inputs: {t_eq: 47000 yr, t1: 1 s}
    formula: t1 / t_eq
    expected: 6.74e-13
    shown: ['so the factor is $6.74 \times 10^{-13}$']
    source: {cite: reading1, at: 'p. 15 (board)'}
    origin: page-own

  - id: we-one-second
    where: 'worked example, step "At one second"'
    inputs: {b: 0.0076, t_eq: 47000 yr, t0: 13.8e9 yr, t1: 1 s}
    formula: b * (t_eq / t0)**(2/3) * (t1 / t_eq)
    expected: 1.2e-18
    shown: ['= 1.2 \times 10^{-18}$']
    source: {cite: reading1, at: 'pp. 14–15 (board)'}
    origin: page-own

  - id: we-1e-35-s
    where: 'worked example, step "At 10⁻³⁵ s"'
    inputs: {b: 0.0076, t_eq: 47000 yr, t0: 13.8e9 yr, t1: 1e-35 s}
    formula: b * (t_eq / t0)**(2/3) * (t1 / t_eq)
    expected: 1.2e-53
    shown: ['$1.2 \times 10^{-53}$']
    source: {cite: reading1, at: 'pp. 14–15 (board)'}
    origin: page-own
