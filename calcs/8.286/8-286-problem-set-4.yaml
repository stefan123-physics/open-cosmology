    where: 'Problem 3(a), check: |H₀| times the time left approaches 2/3 as Ω₀ goes to 1'
    formula: W / (2 * (W - 1)**(3/2)) * (acos((2 - W) / W) - 2 * sqrt(W - 1) / W)
    limit: 2 / 3
    vary: {W: [1.1, 1.01, 1.001, 1.0001]}
    tolerance: 1e-4
