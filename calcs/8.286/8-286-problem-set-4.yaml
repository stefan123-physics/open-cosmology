  - id: p3-half-lifetime
    kind: identity
    where: 'Problem 3(c), check: the lookback time and the time left add up to half the lifetime, π α/c = π Ω₀/(2|H₀|(Ω₀ − 1)^(3/2))'
    formula: W / (2 * (W - 1)**(3/2)) * (acos((W - 2) / W) + 2 * sqrt(W - 1) / W) + W / (2 * (W - 1)**(3/2)) * (acos((2 - W) / W) - 2 * sqrt(W - 1) / W)
    equals: pi * W / (2 * (W - 1)**(3/2))
    samples: {W: [1.01, 1.5, 2, 3, 40]}
    tolerance: 1e-10
