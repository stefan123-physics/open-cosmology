  # The time left equals the lesson's age formula (upper signs) for Ω₀ < 2: time reversal of the cycloid.
  - id: p3-time-reversal
    kind: identity
    where: 'Problem 3(a), check: for Ω₀ < 2 the time left equals the age formula of an expanding closed universe with its upper signs'
    formula: W / (2 * (W - 1)**(3/2)) * (acos((2 - W) / W) - 2 * sqrt(W - 1) / W)
    equals: W / (2 * (W - 1)**(3/2)) * (asin(2 * sqrt(W - 1) / W) - 2 * sqrt(W - 1) / W)
    samples: {W: [1.01, 1.2, 1.5, 1.9, 1.99]}
    tolerance: 1e-9
    shown: ['for $\Omega_0 < 2$ the result is the age formula of the lesson with its upper signs']
    source: {cite: reading1, at: 'slides 6–7'}
    origin: page-own

  - id: p3-strongest-blueshift
    kind: identity
    answer: p3-b
    where: 'Problem 3(b), answer box and formula "The strongest blueshift": against a(θ₀)/a(π) − 1 with θ₀ from a numerical solve on (π, 2π)'
    formula: -1/Omega0
    equals: (1 - cos(solve('cos(x) - (2 - Omega0) / Omega0', 'x', pi, 2 * pi))) / (1 - cos(pi)) - 1
    samples: {Omega0: [1.2, 4, 1.7, 2, 2.6, 30]}
    tolerance: 1e-8
    shown: ['z_\text{min} = -\frac{1}{\Omega_0}']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-blueshift-omega-2
    where: 'Problem 3(b), check: Ω₀ = 2'
