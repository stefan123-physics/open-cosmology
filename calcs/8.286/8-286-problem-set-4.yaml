  - id: p3-half-lifetime-omega-2
    where: 'Problem 3(c), check: Ω₀ = 2, lookback time plus time left, in units of 1/|H₀| (equals π α |H₀|/c with α = c/|H₀|)'
    inputs: {W: 2}
    formula: W / (2 * (W - 1)**(3/2)) * (acos((W - 2) / W) + 2 * sqrt(W - 1) / W) + W / (2 * (W - 1)**(3/2)) * (acos((2 - W) / W) - 2 * sqrt(W - 1) / W)
    expected: '3.142'
