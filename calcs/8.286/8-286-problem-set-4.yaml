  - id: p3-lookback
    kind: identity
    answer: p3-c
    where: 'Problem 3(c), answer box and formula "Lookback time to the strongest blueshift": against (α/c)(θ₀ − sin θ₀ − π) with θ₀ from a numerical solve on (π, 2π)'
    formula: Omega0/(2*abs(H0)*(Omega0 - 1)**(3/2))*(acos((Omega0 - 2)/Omega0) + 2*sqrt(Omega0 - 1)/Omega0)
    equals: (sin(solve('cos(x) - (2 - Omega0) / Omega0', 'x', pi, 2 * pi)) / (H0 * (1 - cos(solve('cos(x) - (2 - Omega0) / Omega0', 'x', pi, 2 * pi)))**2)) * (solve('cos(x) - (2 - Omega0) / Omega0', 'x', pi, 2 * pi) - sin(solve('cos(x) - (2 - Omega0) / Omega0', 'x', pi, 2 * pi)) - pi)
    samples:
      H0: [-2, -0.5, -1.3, -1, -0.7, -1.1]
      Omega0: [1.2, 4, 1.7, 2, 2.6, 30]
    tolerance: 1e-7
    shown: ['t_0 - t_e = \frac{\Omega_0}{2\,|H_0|\,(\Omega_0 - 1)^{3/2}}\left[\arccos\!\left(\frac{\Omega_0 - 2}{\Omega_0}\right) + \frac{2\sqrt{\Omega_0 - 1}}{\Omega_0}\right]']
    source: {cite: mit, at: 'Problem 3 (our own solution)'}
    origin: page-own

  - id: p3-lookback-omega-2
    where: 'Problem 3(c), check: Ω₀ = 2, lookback time in units of 1/|H₀|'
    inputs: {W: 2}
    formula: W / (2 * (W - 1)**(3/2)) * (acos((W - 2) / W) + 2 * sqrt(W - 1) / W)
