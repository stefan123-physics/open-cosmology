    origin: page-own

  - id: p6-b-redshift
    kind: identity
    answer: p6-b
    where: 'Problem 6(b), answer box and formula "Redshift in the empty universe": against the ratio of the two scale factors'
    formula: tobs/te - 1
    equals: (c*tobs)/(c*te) - 1
    samples:
      tobs: [5, 10, 7.3, 13.8]
      te: [0.5, 3, 1.1, 0.47]
      c: [1, 3, 2.2, 299792.458]
    tolerance: 1e-12
    shown: ['\quad\Longrightarrow\quad z = \frac{t_o}{t_e} - 1']
    source: {cite: mit, at: 'Problem 6(b) (our own solution)'}
