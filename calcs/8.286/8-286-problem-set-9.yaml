  # The path against the light-ray equation: the integral of dr/√(1+r²) up to r(t) must equal the integral of dt/t.
  - id: p6-c-path
    kind: identity
    where: 'Problem 6(c), formula "Integrating along the light ray": the two numerical integrals, with the answer as the upper limit of the first'
    formula: integrate('1/sqrt(1 + x**2)', 'x', 0, sinh(log(t/te)))
    equals: integrate('1/x', 'x', te, t)
    samples:
      t: [2, 5, 3.3, 13.8]
      te: [0.5, 1.5, 1.1, 0.47]
    tolerance: 1e-7
    shown: ['\ln\frac{t}{t_e} = \sinh^{-1} r']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  - id: p6-c-second-form
    kind: identity
    answer: p6-c
    where: 'Problem 6(c), answer box and formula "Path of the light pulse": the two ways of writing it'
    formula: sinh(log(t/te))
    equals: (t/te - te/t)/2
    samples:
      t: [2, 5, 3.3, 13.8]
      te: [0.5, 1.5, 1.1, 0.47]
    tolerance: 1e-12
    shown: ['r(t) = \sinh\!\left(\ln\frac{t}{t_e}\right) = \frac12\left(\frac{t}{t_e} - \frac{t_e}{t}\right)']
    source: {cite: mit, at: 'Problem 6(c) (our own solution)'}
    origin: page-own

  # The redshift against the numerical integral along the ray: t_o/t_e = exp(∫ dr/√(1+r²)).
  - id: p6-d-redshift
    kind: identity
    answer: p6-d
    where: 'Problem 6(d), answer box and formula "Redshift in terms of the observer''s coordinate": against exp of the numerical integral of dr/√(1+r²), minus 1'
    formula: r + sqrt(1 + r**2) - 1
    equals: exp(integrate('1/sqrt(1 + x**2)', 'x', 0, r)) - 1
    samples: {r: [0.1, 3, 0.75, 1.9]}
    tolerance: 1e-7
    shown: ['= r + \sqrt{1 + r^2} - 1" cite="mit" at="Problem 6(d) (our own solution)"']
    source: {cite: mit, at: 'Problem 6(d) (our own solution)'}
    origin: page-own

  - id: p6-d-example
