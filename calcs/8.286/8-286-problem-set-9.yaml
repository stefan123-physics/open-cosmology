  # ---- Problem 2

  # The count against a numerical integral over shells of whole-number triples: 2 polarisations, radius L/λ.
  - id: p2-a-count
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box and formula "Number of modes down to the shortest wavelength": against the numerical integral of 4πn² over the sphere of whole-number triples with radius L/λ_min, times 2'
    formula: 8*pi*L**3/(3*lam**3)
    equals: 2 * integrate('4*pi*x**2', 'x', 0, L/lam)
    samples:
      L: [5, 20, 11.3, 1]
      lam: [0.2, 1.5, 0.77, 5e-7]
    tolerance: 1e-7
    shown: ['= \frac{8\pi}{3}\left(\frac{L}{\lambda_\text{min}}\right)^3']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-count-k
    kind: identity
    where: 'Problem 2(a), formula "Number of modes up to the largest wave number": with k_max = 2π/λ_min'
    formula: L**3 * (2*pi/lam)**3 / (3*pi**2)
    equals: 8*pi*L**3/(3*lam**3)
    samples:
      L: [5, 20, 11.3, 1]
      lam: [0.2, 1.5, 0.77, 5e-7]
    tolerance: 1e-12
    shown: ['= \frac{L^3\,k_\text{max}^3}{3\pi^2}']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-a-example-ratio
    where: 'Problem 2(a), check: L/λ for a cube of 1 m and a wavelength of 500 nm'
    inputs: {L: 1 m, lam: 500 nm}
    formula: L / lam
    expected: '2e6'
    shown: ['(2 \times 10^{6})^3']
    source: {cite: mit, at: 'Problem 2(a) (our own numbers)'}
    origin: page-own

  - id: p2-a-example
    where: 'Problem 2(a), check: the number of modes in that cube'
    inputs: {L: 1 m, lam: 500 nm}
    formula: 8 * pi / 3 * (L / lam)**3
    expected: '6.7e19'
    shown: ['= 6.7 \times 10^{19}$ modes']
    source: {cite: mit, at: 'Problem 2(a) (our own numbers)'}
    origin: page-own

  # The formula against the numerical integral of ½ħck over the modes, divided by c², with k_max = 2π/ℓ_P.
  - id: p2-b-formula
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), first answer box and formula "Mass density of the vacuum fluctuations": against the numerical integral of ½ħck times the number of modes per unit volume, up to 2π/ℓ_P, divided by c²'
    formula: 2*pi**2*c**5/(hbar*G**2)
    equals: integrate('(2*4*pi*x**2/(2*pi)**3)*(hbar*c*x/2)', 'x', 0, 2*pi/sqrt(hbar*G/c**3)) / c**2
    samples:
      c: [1, 3, 2.2, 1.7]
      hbar: [1, 3, 0.6, 2.9]
      G: [1, 3, 1.4, 0.3]
    tolerance: 1e-7
    shown: ['= \frac{2\pi^2\,c^5}{\hbar\,G^2}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  - id: p2-b-energy
    kind: identity
    where: 'Problem 2(b), formula "Zero-point energy in the cube": the integral in closed form'
    formula: L**3 * hbar * c * K**4 / (8*pi**2)
    equals: integrate('(hbar*c*x/2)*L**3*x**2/pi**2', 'x', 0, K)
    samples:
      L: [5, 20, 11.3, 1]
      hbar: [1, 3, 0.6, 2.9]
      c: [1, 3, 2.2, 1.7]
      K: [1, 4, 2.5, 0.3]
    tolerance: 1e-7
    shown: ['= \frac{L^3\,\hbar c\,k_\text{max}^4}{8\pi^2}']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

