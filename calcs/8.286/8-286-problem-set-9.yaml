  # r' against speed times inertial time: v = cr/√(1+r²), t' = t√(1+r²).
  - id: p7-d-radius
    kind: identity
    answer: p7-d-r
    where: 'Problem 7(d), second answer box: against v t′ with v = cr/√(1+r²) and t′ = t√(1+r²)'
    formula: c*t*r
    equals: (c*r/sqrt(1 + r**2)) * (t*sqrt(1 + r**2))
    samples:
      t: [1, 5, 3.3, 13.8]
      r: [0.1, 3, 0.75, 1.9]
      c: [1, 3, 2.2, 299792.458]
