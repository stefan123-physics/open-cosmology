# Calculations on content/year-4/8.286/8-286-problem-set-9.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so every formula answer is checked here by an independent route:
# a numerical integral over the modes or along the light ray, the density route for the time of the transition,
# and for Problems 6 and 7 the other description (general against special relativity).

page: content/year-4/8.286/8-286-problem-set-9.mdx
calcs:
