  # The three coefficients of the transformed interval, with the partial derivatives taken numerically.
  - id: p7-d-metric-tt
    kind: identity
    where: 'Problem 7(d), step "The time and radial terms": the coefficient of dt², from numerical derivatives of t′ and r′'
    formula: -c**2 * deriv('x*sqrt(1 + r**2)', 'x', t)**2 + deriv('c*x*r', 'x', t)**2
    equals: -c**2
    samples:
      t: [1, 5, 3.3, 13.8]
      r: [0.1, 3, 0.75, 1.9]
      c: [1, 3, 2.2, 1.4]
    tolerance: 1e-6
    shown: ['The terms with $dt^2$ leave $-c^2dt^2$']
    source: {cite: mit, at: 'Problem 7(d) (our own solution)'}
    origin: page-own

  - id: p7-d-metric-rr
    kind: identity
    where: 'Problem 7(d), step "The time and radial terms": the coefficient of dr², from numerical derivatives of t′ and r′'
    formula: -c**2 * deriv('t*sqrt(1 + x**2)', 'x', r)**2 + deriv('c*t*x', 'x', r)**2
    equals: c**2 * t**2 / (1 + r**2)
    samples:
      t: [1, 5, 3.3, 13.8]
      r: [0.1, 3, 0.75, 1.9]
      c: [1, 3, 2.2, 1.4]
    tolerance: 1e-6
    shown: ['= c^2t^2\,dr^2/(1 + r^2)$']
    source: {cite: mit, at: 'Problem 7(d) (our own solution)'}
    origin: page-own

  - id: p7-d-metric-tr
    kind: identity
    where: 'Problem 7(d), step "The time and radial terms": the coefficient of dt dr, which must vanish (1 is added to both sides so that the comparison is not with zero)'
    formula: 1 - 2 * c**2 * deriv('x*sqrt(1 + r**2)', 'x', t) * deriv('t*sqrt(1 + x**2)', 'x', r) + 2 * deriv('c*x*r', 'x', t) * deriv('c*t*x', 'x', r)
    equals: 1 + 0*t
    samples:
      t: [1, 5, 3.3, 13.8]
      r: [0.1, 3, 0.75, 1.9]
      c: [1, 3, 2.2, 1.4]
    tolerance: 1e-5
    shown: ['In the sum the mixed terms cancel.']
    source: {cite: mit, at: 'Problem 7(d) (our own solution)'}
    origin: page-own
