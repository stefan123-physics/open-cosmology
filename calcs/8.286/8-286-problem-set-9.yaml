  # ---- Problem 7

  # Cosmic time against time dilation written with the speed v = r'/t'.
  - id: p7-a-cosmic-time
    kind: identity
    answer: p7-a
    where: 'Problem 7(a), answer box and formula "Cosmic time in inertial coordinates": against t′/γ with v = r′/t′'
    formula: sqrt(tp**2 - rp**2/c**2)
    equals: tp / (1/sqrt(1 - ((rp/tp)/c)**2))
    samples:
      tp: [2, 5, 3.3, 13.8]
      rp: [0.2, 1.5, 1.1, 9.9]
      c: [1, 2, 1.4, 1]
    tolerance: 1e-12
    shown: ['= \sqrt{t''^2 - \frac{r''^2}{c^2}}']
    source: {cite: mit, at: 'Problem 7(a) (our own solution)'}
    origin: page-own

  # r against γβ with β = r'/(ct'): the special-relativity form that part (c) asks to show.
  - id: p7-b-radial
    kind: identity
    answer: p7-b
    where: 'Problem 7(b), answer box and formula "Comoving radial coordinate in inertial coordinates": against γβ with β = r′/(ct′)'
    formula: rp/(c*sqrt(tp**2 - rp**2/c**2))
    equals: (rp/(c*tp)) / sqrt(1 - (rp/(c*tp))**2)
    samples:
      tp: [2, 5, 3.3, 13.8]
      rp: [0.2, 1.5, 1.1, 9.9]
      c: [1, 2, 1.4, 1]
    tolerance: 1e-12
    shown: ['r = \frac{r''}{c\,t} = \frac{r''}{c\sqrt{t''^2 - r''^2/c^2}}']
    source: {cite: mit, at: 'Problem 7(b) (our own solution)'}
    origin: page-own

  # The redshift against the Doppler formula with β = r/√(1+r²).
  - id: p7-c-redshift
    kind: identity
    answer: p7-c
    where: 'Problem 7(c), answer box and formula "Redshift from special relativity": against the relativistic Doppler shift with β = r/√(1+r²)'
    formula: r + sqrt(1 + r**2) - 1
    equals: sqrt((1 + r/sqrt(1 + r**2)) / (1 - r/sqrt(1 + r**2))) - 1
    samples: {r: [0.1, 3, 0.75, 1.9]}
    tolerance: 1e-10
    shown: ['z = \gamma + \gamma\beta - 1 = \sqrt{1 + r^2} + r - 1']
    source: {cite: mit, at: 'Problem 7(c) (our own solution)'}
    origin: page-own

