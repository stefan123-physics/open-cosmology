  # t' against the interval: −c²t² = −c²t'² + r'² with r' = ctr.
  - id: p7-d-time
    kind: identity
    answer: p7-d-t
    where: 'Problem 7(d), first answer box and formula "From comoving to inertial coordinates": against the interval from the origin, t′² = t² + r′²/c² with r′ = ctr'
    formula: t*sqrt(1 + r**2)
    equals: sqrt(t**2 + (c*t*r)**2/c**2)
    samples:
      t: [1, 5, 3.3, 13.8]
      r: [0.1, 3, 0.75, 1.9]
      c: [1, 3, 2.2, 299792.458]
    tolerance: 1e-12
    shown: ['t'' = t\sqrt{1 + r^2}']
