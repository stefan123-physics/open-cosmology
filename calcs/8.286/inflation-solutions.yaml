# Calculations on content/year-4/8.286/inflation-solutions.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# During inflation (Ω − 1)/Ω ∝ e^(−2χt): log10|Ω − 1| falls by 2/ln 10 per e-fold.

page: content/year-4/8.286/inflation-solutions.mdx
calcs:
  - id: e-folds-1e28
    where: 'plot point "10²⁸ expansion" (x) and caption: 64.5 e-folds (28 ln 10)'
    inputs: {}
    formula: 28 * log(10)
    expected: '64.5'
    shown: ['{ x: 64.5, y: -56.0, label: "10²⁸ expansion" }', 'the 64.5 e-folds of a 10²⁸ expansion (28 ln 10)']
    source: {cite: reading1, at: 'p. 21'}
    origin: page-own

  - id: decline-per-e-fold
    where: 'plot caption: log10|Ω − 1| falls by 2/ln 10 ≈ 0.87 per e-fold'
    inputs: {}
    formula: 2 / log(10)
    expected: '0.87'
    shown: ['falls by 2/ln 10 ≈ 0.87 per e-fold']
    source: {cite: reading1, at: 'p. 21'}
    origin: page-own

  - id: final-omega
    where: 'plot point (y) and caption: pushed down to about 10^-56'
    inputs: {}
    formula: -(2 / log(10)) * 28 * log(10)
    expected: '-56.0'
    shown: ['y: -56.0', 'push it down to about 10⁻⁵⁶']
    source: {cite: reading1, at: 'p. 21'}
    origin: page-own
