# Calculations on content/year-4/8.286/robertson-walker-spacetime.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/robertson-walker-spacetime.mdx
calcs:
  - id: traveller-watch
    where: 'quiz 3; worked example "A traveller''s watch in a flat universe", step "Answer"'
    inputs: {dt: 10 yr, u: 0.6}
    formula: dt * sqrt(1 - u**2)
    expected: 8 yr
    tolerance: 0.01 yr
    shown: ['= 0.8\\,dt$, so 8 years', 'Her watch shows 8 years']
    quiz: 3
    source: {cite: reading1, at: 'Robertson–Walker metric (Lecture 13)'}
    origin: page-own

  - id: plot-beta-zero
    where: 'plot point "β = 0: watches agree" (u = 0.5)'
    inputs: {u: 0.5}
    formula: sqrt(1 - u**2)
    expected: '0.866'
    shown: ['{ x: 0, y: 0.866, label: "β = 0: watches agree" }', '0.866 at u = 0.5']
    source: {cite: reading1, at: 'Lecture 13'}
    origin: page-own

  - id: made-up-metric-outward
    where: 'plot caption: β = 0.1, u = 0.6, ten cosmic years become 7.21 years outward'
    inputs: {dt: 10 yr, u: 0.6, b: 0.1}
    formula: dt * sqrt(1 - u**2 - 2 * b * u)
    expected: 7.21 yr
    shown: ['ten cosmic years become 7.21 years outward']
    source: {cite: reading1, at: 'Lecture 13'}
    origin: page-own

  - id: made-up-metric-inward
    where: 'plot caption: ... but 8.72 years inward'
    inputs: {dt: 10 yr, u: 0.6, b: 0.1}
    formula: dt * sqrt(1 - u**2 + 2 * b * u)
    expected: 8.72 yr
    shown: ['but 8.72 years inward']
    source: {cite: reading1, at: 'Lecture 13'}
    origin: page-own
