# Calculations on content/year-4/8.286/8-286-problem-set-1.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).

page: content/year-4/8.286/8-286-problem-set-1.mdx
calcs:
  # The answer the reader is marked against, checked by an independent route: follow two crests directly.
  # Loudspeaker at x = 0 moving in +x at vs; listener at x = -d moving in -x at vo. Crest 1 leaves at t = 0 and
  # arrives at d/(u - vo). Crest 2 leaves at t = T from x = vs*T, when the listener is at distance d + (vo + vs)*T,
  # and arrives at T + (d + (vo + vs)*T)/(u - vo). z = (difference of arrival times)/T - 1.
  - id: p1-z-direct
    kind: identity
    answer: p1-z
    where: 'Problem 1, answer box and formula "Doppler shift, source and observer both moving": the two-step result against following two crests directly'
    formula: (vs + vo)/(u - vo)
    equals: ((T + (d + (vo + vs)*T)/(u - vo)) - d/(u - vo))/T - 1
    samples:
      u: [340, 300, 400, 343, 1]
      vs: [20, 1, 50, 0, 0.3]
      vo: [30, 50, 1, 12, 0.9]
      d: [100, 5, 2000, 40, 1]
      T: [0.002, 0.01, 1, 0.5, 3]
    tolerance: 1e-9
    shown: ['z = \frac{u + v_s}{u - v_o} - 1 = \frac{v_s + v_o}{u - v_o}']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-z-is-product-of-cases
    kind: identity
    where: 'Problem 1, step "Combine the two steps": the moving-source factor times the moving-observer factor'
    formula: (1 + vs/u) * (1/(1 - vo/u))
    equals: (u + vs)/(u - vo)
    samples:
      u: [340, 300, 400, 343]
      vs: [20, 1, 50, 0]
      vo: [30, 50, 1, 12]
    tolerance: 1e-12
    shown: ['= \frac{1 + v_s/u}{1 - v_o/u} = \frac{u + v_s}{u - v_o}']
    source: {cite: reading1, at: 'pp. 1–4 (the two cases)'}
    origin: page-own

  - id: p1-check-number
    where: 'Problem 1, step "Check the result": u = 340, v_s = 20, v_o = 30 m/s'
    inputs: {u: 340 m/s, vs: 20 m/s, vo: 30 m/s}
    formula: (vs + vo)/(u - vo)
    expected: '0.161'
    shown: ['z = 50/310 = 0.161$']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-check-naive-sum
    where: 'Problem 1, step "Check the result": the wrong result from simply adding the speeds'
    inputs: {u: 340 m/s, vs: 20 m/s, vo: 30 m/s}
    formula: (vs + vo)/u
    expected: '0.147'
    shown: ['would give $0.147$']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  # Problem 2(a): z = 0, against following two crests that each take R/u.
  - id: p2-a-two-crests
    kind: identity
    answer: p2-a
    where: 'Problem 2(a), answer box: two crests sent T apart, each taking R/u'
    formula: '0'
    equals: ((T + R/u) - R/u)/T - 1
    samples:
      u: [340, 300, 400, 343]
      R: [10, 5, 200, 40]
      T: [0.5, 0.01, 1, 2]
    tolerance: 1e-9
    shown: ['tex="\Delta t_O = \Delta t_S \quad\Longrightarrow\quad z = 0" cite="mit" at="Problem 2(a)']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  # Problem 2(b): independent of the time-dilation formula. Two emissions are dt apart in the observer's frame, in
  # which the source moves v*dt between them; the source's own time between them is the invariant interval
  # sqrt(dt^2 - (v*dt/c)^2). The trips are equal, so 1 + z = dt / (that proper time).
  - id: p2-b-interval
    kind: identity
    answer: p2-b
    where: 'Problem 2(b), answer box and formula "Transverse Doppler shift, source moving": against the invariant interval between two emissions'
    formula: 1/sqrt(1 - v**2/c**2) - 1
    equals: dt/sqrt(dt**2 - (v*dt/c)**2) - 1
    samples:
      v: [0.6, 0.1, 0.9, 0.5, 1.2]
      c: [1, 1, 1, 2, 3]
      dt: [1, 0.02, 5, 3, 0.7]
    tolerance: 1e-9
    shown: ['1 + z = \frac{\Delta t_O}{\Delta t_S} = \gamma \quad\Longrightarrow\quad z = \frac{1}{\sqrt{1 - v^2/c^2}} - 1']
    source: {cite: mit, at: 'Problem 2(b) (our own solution)'}
    origin: page-own

  # Problem 2(c): the observer's own time between two arrivals dt apart in the frame of the centre is the invariant
  # interval; the emissions are dt apart on the source's clock.
  - id: p2-c-interval
    kind: identity
    answer: p2-c
    where: 'Problem 2(c), answer box and formula "Transverse Doppler shift, observer moving": against the invariant interval between two arrivals'
    formula: sqrt(1 - v**2/c**2) - 1
    equals: sqrt(dt**2 - (v*dt/c)**2)/dt - 1
    samples:
      v: [0.6, 0.1, 0.9, 0.5, 1.2]
      c: [1, 1, 1, 2, 3]
      dt: [1, 0.02, 5, 3, 0.7]
    tolerance: 1e-9
    shown: ['= \frac{1}{\gamma} \quad\Longrightarrow\quad z = \sqrt{1 - v^2/c^2} - 1" cite="mit" at="Problem 2(c)']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  # Problem 2(d): follow two crests directly. The source moves along y = R and emits at t = -dt/2 and t = +dt/2
  # (observer's frame), from x = -v*dt/2 and x = +v*dt/2. Arrival = emission time + distance/c. The source's own
  # time between the emissions is the invariant interval.
  - id: p2-d-two-crests
    kind: identity
    answer: p2-d
    where: 'Problem 2(d), answer box: two crests sent symmetrically about the closest point, followed to the observer'
    formula: 1/sqrt(1 - v**2/c**2) - 1
    equals: ((dt/2 + sqrt(R**2 + (v*dt/2)**2)/c) - (-dt/2 + sqrt(R**2 + (v*dt/2)**2)/c))/sqrt(dt**2 - (v*dt/c)**2) - 1
    samples:
      v: [0.6, 0.1, 0.9, 0.5, 1.2]
      c: [1, 1, 1, 2, 3]
      dt: [1, 0.02, 5, 3, 0.7]
      R: [10, 1, 3, 50, 2]
    tolerance: 1e-9
    shown: ['1 + z = \gamma \quad\Longrightarrow\quad z = \frac{1}{\sqrt{1 - v^2/c^2}} - 1']
    source: {cite: mit, at: 'Problem 2(d) (our own solution)'}
    origin: page-own

  # Problem 2(e): a second route, in the observer's own frame. There the source moves at v, and the general formula
  # for a moving source is 1 + z = gamma*(1 + (v/c)*cos(theta)), theta = angle between the source's velocity and the
  # line from observer to source. A ray that is perpendicular to the motion in the source's frame arrives with
  # cos(theta) = -v/c (aberration), which gives gamma*(1 - v^2/c^2) = 1/gamma.
  - id: p2-e-aberration
    kind: identity
    answer: p2-e
    where: 'Problem 2(e), answer box: against the moving-source formula with the aberrated angle, in the observer frame'
    formula: sqrt(1 - v**2/c**2) - 1
    equals: (1/sqrt(1 - v**2/c**2))*(1 + (v/c)*(-v/c)) - 1
    samples:
      v: [0.6, 0.1, 0.9, 0.5, 1.2]
      c: [1, 1, 1, 2, 3]
    tolerance: 1e-9
    shown: ['1 + z = \frac{1}{\gamma} \quad\Longrightarrow\quad z = \sqrt{1 - v^2/c^2} - 1']
    source: {cite: mit, at: 'Problem 2(e) (our own solution)'}
    origin: page-own

  - id: p2-bc-product
    kind: identity
    where: 'Problem 2(c) and Problem 3(b), checks: the ratios of parts (b) and (c) multiply to 1'
    formula: (1/sqrt(1 - v**2/c**2))*sqrt(1 - v**2/c**2)
    equals: v/v
    samples:
      v: [0.6, 0.1, 0.9, 0.5]
      c: [1, 1, 1, 2]
    tolerance: 1e-12
    shown: ['= \frac{\Delta t/\gamma}{\Delta t/\gamma} = 1']
    source: {cite: mit, at: 'Problem 3(b) (our own solution)'}
    origin: page-own

  - id: p2-gamma-06
    where: 'Problem 2(b), check: gamma for v = 0.6 c'
    inputs: {b: 0.6}
    formula: 1/sqrt(1 - b**2)
    expected: '1.25'
    shown: ['$\gamma = 1.25$']
    source: {cite: mit, at: 'Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-b-06
    where: 'Problem 2(b) and 2(d), checks: z for v = 0.6 c'
    inputs: {b: 0.6}
    formula: 1/sqrt(1 - b**2) - 1
    expected: '0.25'
    shown: ['and $z = 0.25$', 'again $z = 0.25$']
    source: {cite: mit, at: 'Problem 2(b) (our own numbers)'}
    origin: page-own

  - id: p2-c-06
    where: 'Problem 2(c) and 2(e), checks: z for v = 0.6 c'
    inputs: {b: 0.6}
    formula: sqrt(1 - b**2) - 1
    expected: '-0.2'
    shown: ['$z = 0.8 - 1 = -0.2$', 'c$, $z = -0.2$']
    source: {cite: mit, at: 'Problem 2(c) (our own numbers)'}
    origin: page-own

  - id: p2-radial-06
    where: 'Problem 2(b), check: a source moving straight away at 0.6 c'
    inputs: {b: 0.6}
    formula: sqrt((1 + b)/(1 - b)) - 1
    expected: '1'
    shown: ['would have $z = 1$']
    source: {cite: reading1, at: 'pp. 15–19 (the relativistic Doppler shift)'}
    origin: page-own
