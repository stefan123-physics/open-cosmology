# Calculations on content/year-4/8.286/black-body-radiation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/black-body-radiation.mdx
calcs:
  - id: kT
    where: 'worked example "The photons of the cosmic background today", step "Energy density"'
    inputs: {T: 2.725 K}
    formula: k_B * T
    expected: 3.762e-23 J
    shown: ['$kT = 3.762 \times 10^{-23}$ J']
    source: {cite: reading1, at: 'Lecture 16 (black-body energy density)'}
    origin: page-own

  - id: hbar-c
    where: 'worked example, step "Energy density"'
    inputs: {}
    formula: hbar * c
    expected: 3.162e-26 J*m
    shown: ['$\hbar c = 3.162 \times 10^{-26}$ J·m']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: u-gamma
    where: 'worked example, step "Energy density"'
    inputs: {T: 2.725 K}
    formula: 2 * pi**2 / 30 * (k_B * T)**4 / (hbar * c)**3
    expected: 4.17e-14 J/m**3
    shown: ['= 4.17 \times 10^{-14}$ J/m³']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: n-gamma
    where: 'worked example, step "Number density"'
    inputs: {T: 2.725 K, zeta3: 1.2020569}
    formula: 2 * zeta3 / pi**2 * (k_B * T / (hbar * c))**3
    expected: 4.11e8 1/m**3
    shown: ['= 4.11 \times 10^{8}$ m⁻³']
    source: {cite: reading1, at: '"Number density of photons" formula'}
    origin: page-own

  - id: quiz-photons-per-cm3
    where: 'quiz 4: answer "About 410"; worked example "about 410 photons per cubic centimetre"'
    inputs: {T: 2.725 K, zeta3: 1.2020569}
    formula: 2 * zeta3 / pi**2 * (k_B * T / (hbar * c))**3
    expected: 410 1/cm**3
    shown: ['about **410 photons per cubic centimetre**', 'about 410 per cm³']
    quiz: 3
    source: {cite: reading1, at: '"Number density of photons" formula'}
    origin: page-own

  - id: energy-per-photon
    where: 'worked example, step "Energy per photon"'
    inputs: {T: 2.725 K, zeta3: 1.2020569}
    formula: (pi**2 / 30 * (k_B * T)**4 / (hbar * c)**3) / (zeta3 / pi**2 * (k_B * T / (hbar * c))**3)
    expected: 6.3e-4 eV
    shown: ['$= 6.3 \times 10^{-4}$ eV']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: energy-per-photon-kT
    where: 'worked example, step "Energy per photon": 2.70 kT'
    inputs: {zeta3: 1.2020569}
    formula: pi**4 / (30 * zeta3)
    expected: '2.70'
    shown: ['which is $2.70\,kT$']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: radiation-ratio
    where: 'worked example, step "The missing radiation"'
    inputs: {u_r: 7.01e-14 J/m**3, T: 2.725 K}
    formula: u_r / (2 * pi**2 / 30 * (k_B * T)**4 / (hbar * c)**3)
    expected: '1.68'
    shown: ['7.01 \times 10^{-14}/4.17 \times 10^{-14} = 1.68$']
    source: {cite: reading1, at: 'Lecture 16; u_r from Lecture 15'}
    origin: page-own

  - id: mode-energy-x1
    where: 'plot caption: at hν = kT a mode gets 0.58 kT'
    inputs: {x: 1}
    formula: x / (exp(x) - 1)
    expected: '0.58'
    shown: ['At hν = kT a mode gets 0.58 kT']
    source: {cite: reading1, at: 'Lecture 16 (Planck)'}
    origin: page-own

  - id: mode-energy-x10
    where: 'plot caption: at hν = 10 kT only 0.00045 kT'
    inputs: {x: 10}
    formula: x / (exp(x) - 1)
    expected: '0.00045'
    shown: ['at hν = 10 kT only 0.00045 kT']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: spectrum-peak-height
    where: 'plot point "peak at hν ≈ 2.82 kT": x³/(eˣ − 1) at the peak x = 2.8214'
    inputs: {x: 2.821439}
    formula: x**3 / (exp(x) - 1)
    expected: '1.4214'
    shown: ['{ x: 2.821, y: 1.4214, label: "peak at hν ≈ 2.82 kT" }']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  - id: spectrum-peak-position
    where: 'plot point and caption: peak at hν ≈ 2.82 kT (root of 3(1 − e^(−x)) = x, checked as the residual)'
    inputs: {x: 2.821}
    formula: 3 * (1 - exp(-x)) - x
    expected: '0'
    tolerance: '0.001'
    shown: ['peaks at hν ≈ 2.82 kT']
    source: {cite: reading1, at: 'Lecture 16'}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: planck-integral-gives-pi2-over-30
    kind: identity
    where: 'formula "Energy density of black-body radiation": the π²/30 factor comes from Planck''s integral ∫₀^∞ x³/(eˣ − 1) dx = π⁴/15 (u = g (kT)⁴/(2π²(ħc)³) × π⁴/15); the integrand is 0/0 at x = 0'
    formula: g / (2 * pi**2) * integrate('x**3 / (exp(x) - 1)', 'x', 0, 200)
    equals: g * pi**2 / 30
    samples: {g: [2, 3.5, 10.75]}
    tolerance: 1e-9
    shown: ['u = g\,\frac{\pi^2}{30}\,\frac{(kT)^4}{(\hbar c)^3}']
    source: {cite: reading1, at: 'p. 24 (board)'}
    origin: page-own

  - id: zeta-3-from-integral
    where: 'formula "Number density of photons": ζ(3) ≈ 1.202, recomputed as ½ ∫₀^∞ x²/(eˣ − 1) dx'
    inputs: {}
    formula: integrate('x**2 / (exp(x) - 1)', 'x', 0, 200) / 2
    expected: '1.202'
    shown: ['\frac{1}{3^3} + \cdots \approx 1.202']
    source: {cite: reading1, at: 'p. 24 (board)'}
    origin: mit

  - id: entropy-density-units
    kind: units
    where: 'formula "Entropy density of black-body radiation": s = g (2π²/45) k⁴T³/(ħc)³ must be an entropy per volume'
    inputs: {g: 2, T: 2.725 K}
    terms: ['g * 2 * pi**2 / 45 * k_B**4 * T**3 / (hbar * c)**3']
    unit: J/(K*m**3)
    shown: ['s = g\,\frac{2\pi^2}{45}\,\frac{k^4\,T^3}{(\hbar c)^3}']
    source: {cite: reading1, at: 'p. 25 (board)'}
    origin: mit
