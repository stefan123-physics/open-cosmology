# Calculations on content/year-4/8.286/supernova-evidence.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Open matter-only: H0 dL/c = 2[Ωz + (Ω − 2)(√(1 + Ωz) − 1)]/Ω². Flat ΛCDM: H0 dL/c = (1 + z) ∫ dz/E.

page: content/year-4/8.286/supernova-evidence.mdx
calcs:
  - id: open-hdl
    where: 'worked example "How much dimmer at z = 0.5?", step "Open model"'
    inputs: {O: 0.2, z: 0.5}
    formula: 2 * (O * z + (O - 2) * (sqrt(1 + O * z) - 1)) / O**2
    expected: '0.6072'
    shown: ['= 0.6072$']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own

  - id: open-dl
    where: 'worked example, step "Open model"'
    inputs: {O: 0.2, z: 0.5, H0: 70 km/s/Mpc}
    formula: 2 * (O * z + (O - 2) * (sqrt(1 + O * z) - 1)) / O**2 * c / H0
    expected: 2601 Mpc
    shown: ['$d_L = 2601$ Mpc']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own

  - id: open-modulus
    where: 'worked example, step "Open model"'
    inputs: {O: 0.2, z: 0.5, H0: 70 km/s/Mpc, Mpc1: 1 Mpc}
    formula: 5 * log10(2 * (O * z + (O - 2) * (sqrt(1 + O * z) - 1)) / O**2 * c / H0 / Mpc1) + 25
    expected: '42.08'
    shown: ['$m - M = 5\log_{10}2601 + 25 = 42.08$']
    source: {cite: reading1, at: 'p. 6 (board)'}
    origin: page-own

  - id: vacuum-integral
    where: 'worked example, step "Vacuum model"'
    inputs: {Om: 0.24, Ov: 0.76}
    formula: integrate('1 / sqrt(Om * (1 + z)**3 + Ov)', 'z', 0, 0.5)
    expected: '0.4506'
    shown: ['= 0.4506$']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own

  - id: vacuum-hdl
    where: 'worked example, step "Vacuum model": 1.5 × 0.4506 = 0.6759 (0.67584 unrounded; one unit allowed for the rounded factor)'
    inputs: {Om: 0.24, Ov: 0.76}
    formula: 1.5 * integrate('1 / sqrt(Om * (1 + z)**3 + Ov)', 'z', 0, 0.5)
    expected: '0.6759'
    tolerance: '0.0001'
    shown: ['$H_0d_L/c = 1.5 \times 0.4506 = 0.6759$']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own

  - id: vacuum-dl
    where: 'worked example, step "Vacuum model"'
    inputs: {Om: 0.24, Ov: 0.76, H0: 70 km/s/Mpc}
    formula: 1.5 * integrate('1 / sqrt(Om * (1 + z)**3 + Ov)', 'z', 0, 0.5) * c / H0
    expected: 2894 Mpc
    shown: ['$d_L = 2894$ Mpc and $m - M = 42.31$']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own

  - id: vacuum-modulus
    where: 'worked example, step "Vacuum model"'
    inputs: {Om: 0.24, Ov: 0.76, H0: 70 km/s/Mpc, Mpc1: 1 Mpc}
    formula: 5 * log10(1.5 * integrate('1 / sqrt(Om * (1 + z)**3 + Ov)', 'z', 0, 0.5) * c / H0 / Mpc1) + 25
    expected: '42.31'
    shown: ['$m - M = 42.31$']
    source: {cite: reading1, at: 'p. 6 (board)'}
    origin: page-own

  - id: modulus-difference
    where: 'worked example, step "The difference"'
    inputs: {Om: 0.24, Ov: 0.76, O: 0.2, z: 0.5}
    formula: 5 * log10(1.5 * integrate('1 / sqrt(Om * (1 + y)**3 + Ov)', 'y', 0, 0.5) / (2 * (O * z + (O - 2) * (sqrt(1 + O * z) - 1)) / O**2))
    expected: '0.23'
    shown: ['$\Delta(m - M) = 0.23$ magnitudes']
    source: {cite: reading1, at: 'p. 6 (board)'}
    origin: page-own

  - id: flux-ratio
    where: 'worked example, step "The difference": 10^(−0.4 × 0.23) = 0.81, about 19% fainter'
    inputs: {d: 0.23}
    formula: 10**(-0.4 * d)
    expected: '0.81'
    shown: ['$10^{-0.4 \times 0.23} = 0.81$', 'about 19% fainter']
    source: {cite: reading1, at: 'p. 6 (board)'}
    origin: page-own

  # ---- formula checks (docs/CALC_TESTS_PLAN.md §6)
  - id: mattig-flat
    kind: identity
    where: 'plot caption: the matter-and-curvature closed form 2[Ωz + (Ω − 2)(√(1 + Ωz) − 1)]/Ω² must equal the flat matter-only 2(1 + z)(1 − 1/√(1 + z)) at Ω = 1'
    formula: 2 * (O * z + (O - 2) * (sqrt(1 + O * z) - 1)) / O**2
    equals: 2 * (1 + z) * (1 - 1 / sqrt(1 + z))
    samples: {O: [1, 1, 1, 1], z: [0.1, 0.5, 1, 3]}
    shown: ['H₀d_L/c = 2[Ωz + (Ω − 2)(√(1 + Ωz) − 1)]/Ω²']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own

  - id: mattig-empty-limit
    kind: limit
    where: 'the same closed form must approach the empty-universe value z + z²/2 as Ω → 0'
    inputs: {z: 0.5}
    formula: 2 * (O * z + (O - 2) * (sqrt(1 + O * z) - 1)) / O**2
    limit: z + z**2 / 2
    vary: {O: [0.1, 0.01, 0.001]}
    tolerance: 1e-3
    shown: ['H₀d_L/c = 2[Ωz + (Ω − 2)(√(1 + Ωz) − 1)]/Ω²']
    source: {cite: reading1, at: 'pp. 5–6 (board)'}
    origin: page-own
