# Calculations on content/year-4/8.286/horizon-problem.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# Flat matter-dominated distance today: ℓ_p(t0) = 2cH0⁻¹(1 − 1/√(1+z)); at decoupling ℓ_p(t0)/(1+z); horizon then 3ct_d.

page: content/year-4/8.286/horizon-problem.mdx
calcs:
  - id: guth-ratio
    where: 'formulas "Distance at the time of decoupling" (2.56e7 ly) and "Horizon distance at decoupling" (1.1e6 ly): about 23 horizon distances'
    inputs: {d: 2.56e7 ly, t_d: 370000 yr}
    formula: d / (3 * c * t_d)
    expected: '23'
    shown: ['\approx 2.56 \times 10^7\ \text{light-years}', 'about 23 horizon distances from us at the time of decoupling', 'about 23 horizon distances from the spot']
    source: {cite: reading1, at: 'pp. 10–11 (board)'}
    origin: mit

  - id: guth-horizon
    where: 'formula "Horizon distance at decoupling"'
    inputs: {t_d: 370000 yr}
    formula: 3 * c * t_d
    expected: 1.1e6 ly
    shown: ['3c\,t_d \approx 1.1 \times 10^6\ \text{light-years}']
    source: {cite: reading1, at: 'p. 10 (board)'}
    origin: mit

  - id: quiz-opposite-sides
    where: 'quiz 3: opposite sides of the sky are about 46 horizon distances apart'
    inputs: {d: 2.56e7 ly, t_d: 370000 yr}
    formula: 2 * d / (3 * c * t_d)
    expected: '46'
    shown: ['About 46 horizon distances']
    quiz: 2
    source: {cite: reading1, at: 'pp. 10–11 (board)'}
    origin: mit

  - id: one-plus-z
    where: 'worked example "The horizon problem with today''s numbers", step "Redshift"'
    inputs: {Td: 3000 K, T0: 2.7255 K}
    formula: Td / T0
    expected: '1100.7'
    shown: ['$1 + z_d = 3000/2.7255 = 1100.7$']
    source: {cite: reading1, at: 'p. 9 (board)'}
    origin: page-own

  - id: hubble-length-ly
    where: 'worked example, step "Distance today and at decoupling"'
    inputs: {H0: 67.7 km/s/Mpc}
    formula: c / H0
    expected: 14.44e9 ly
    shown: ['$cH_0^{-1} = 977.8/67.7 = 14.44$ billion light-years']
    source: {cite: reading1, at: 'p. 10 (board)'}
    origin: page-own

  - id: distance-today
    where: 'worked example, step "Distance today and at decoupling"'
    inputs: {H0: 67.7 km/s/Mpc, z1: 1100.7}
    formula: 2 * c / H0 * (1 - 1 / sqrt(z1))
    expected: 28.0e9 ly
    shown: ['the bracket is $1 - 1/\sqrt{1100.7} = 0.970$', '= 28.0$ billion light-years']
    source: {cite: reading1, at: 'p. 10 (board)'}
    origin: page-own

  - id: distance-at-decoupling
    where: 'worked example, step "Distance today and at decoupling"'
    inputs: {H0: 67.7 km/s/Mpc, z1: 1100.7}
    formula: 2 * c / H0 * (1 - 1 / sqrt(z1)) / z1
    expected: 25.5e6 ly
    shown: ['$\ell_p(t_d) = 25.5$ million light-years']
    source: {cite: reading1, at: 'p. 10 (board)'}
    origin: page-own

  - id: horizon-380k
    where: 'worked example, step "Horizon at decoupling"'
    inputs: {t_d: 380000 yr}
    formula: 3 * c * t_d
    expected: 1.14e6 ly
    shown: ['= 1.14$ million light-years']
    source: {cite: reading1, at: 'p. 10 (board)'}
    origin: page-own

  - id: ratio-today
    where: 'worked example, step "Ratio": 22.3, so about 45 apart'
    inputs: {H0: 67.7 km/s/Mpc, z1: 1100.7, t_d: 380000 yr}
    formula: 2 * c / H0 * (1 - 1 / sqrt(z1)) / z1 / (3 * c * t_d)
    expected: '22.3'
    shown: ['$25.5/1.14 = 22.3$, so the two emission points were about 45 horizon distances apart']
    source: {cite: reading1, at: 'pp. 10–11 (board)'}
    origin: page-own

  - id: plot-pure-matter-ratio
    where: 'plot point "CMB, z ≈ 1100" and caption: √(1+z) − 1 = 32'
    inputs: {z: 1100}
    formula: sqrt(1 + z) - 1
    expected: '32.2'
    shown: ['{ x: 1100, y: 32.2, label: "CMB, z ≈ 1100" }', 'At z = 1100 this is 32']
    source: {cite: reading1, at: 'p. 10 (board); the ratio is this page''s own check'}
    origin: page-own

  - id: plot-pure-matter-time
    where: 'plot caption: the pure matter model would put decoupling at about 265,000 years'
    inputs: {H0: 67.3 km/s/Mpc, z: 1100}
    formula: 2 / (3 * H0) * (1 + z)**(-1.5)
    expected: 265000 yr
    shown: ['would put decoupling at about 265,000 years']
    source: {cite: reading1, at: 'p. 10 (board)'}
    origin: page-own
