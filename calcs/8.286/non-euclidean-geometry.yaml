# Formula checks on content/year-4/8.286/non-euclidean-geometry.mdx (docs/CALC_TESTS_PLAN.md §6).

page: content/year-4/8.286/non-euclidean-geometry.mdx
calcs:
  - id: klein-small-distance
    kind: limit
    where: 'formula "Klein''s distance function": for two nearby points at the centre of the disk, d must become a × the ordinary distance'
    inputs: {a: 2.5, x1: 0, y1: 0}
    formula: a * acosh((1 - x1 * 0.6 * eps - y1 * 0.8 * eps) / (sqrt(1 - x1**2 - y1**2) * sqrt(1 - (0.6 * eps)**2 - (0.8 * eps)**2)))
    limit: a * eps
    vary: {eps: [0.1, 0.01, 0.001]}
    tolerance: 1e-6
    shown: ['\cosh\frac{d(1,2)}{a} = \frac{1 - x_1x_2 - y_1y_2}{\sqrt{1 - x_1^2 - y_1^2}\,\sqrt{1 - x_2^2 - y_2^2}}']
    source: {cite: reading1, at: 'p. 19'}
    origin: mit

  - id: hyperbolic-circle-flat-limit
    kind: limit
    where: 'plot: circumference on a hyperbolic plane 2πR sinh(r/R) (drawn with R = 1) must become 2πr for small circles'
    inputs: {R: 1}
    formula: 2 * pi * R * sinh(r / R)
    limit: 2 * pi * r
    vary: {r: [0.1, 0.01, 0.001]}
    tolerance: 1e-6
    shown: ['expr: "2*pi*sinh(r)"', 'expr: "2*pi*r"']
    source: {cite: reading1, at: 'Lecture 10'}
    origin: page-own

  - id: sphere-circle-flat-limit
    kind: limit
    where: 'plot: circumference on a sphere 2πR sin(r/R) (drawn with R = 1) must become 2πr for small circles'
    inputs: {R: 1}
    formula: 2 * pi * R * sin(r / R)
    limit: 2 * pi * r
    vary: {r: [0.1, 0.01, 0.001]}
    tolerance: 1e-6
    shown: ['expr: "2*pi*sin(r)"']
    source: {cite: reading1, at: 'Lecture 10'}
    origin: page-own
