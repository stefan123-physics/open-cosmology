page: content/year-4/8.286/expanding-sphere.mdx
calcs:
  - id: h70-in-si
    where: 'worked example "How hard is gravity braking the expansion?", problem'
    inputs: {H: 70 km/s/Mpc}
    formula: H
    expected: 2.27e-18 1/s
    shown: ['$H = 70$ km/s/Mpc $= 2.27\times10^{-18}\ \text{s}^{-1}$']
    source: {cite: reading1, at: '"Deceleration of the scale factor" formula'}
    origin: page-own

  - id: deceleration-rate
    where: 'worked example, step "Deceleration rate"'
    inputs: {rho: 2.7e-27 kg/m**3}
    formula: -4 * pi / 3 * G * rho
    expected: -7.5e-37 1/s**2
    shown: ['= -7.5\times10^{-37}\ \text{s}^{-2}$']
    source: {cite: reading1, at: '"Deceleration of the scale factor" formula'}
    origin: page-own

  - id: h-squared
    where: 'worked example, step "Expansion rate squared"'
    inputs: {H: 70 km/s/Mpc}
    formula: H**2
    expected: 5.1e-36 1/s**2
    shown: ['= 5.1\times10^{-36}\ \text{s}^{-2}$']
    source: {cite: reading1, at: '"Deceleration of the scale factor" formula'}
    origin: page-own

  - id: braking-ratio
    where: 'worked example, step "Compare": ratio about 0.15, roughly 15%'
    inputs: {rho: 2.7e-27 kg/m**3, H: 70 km/s/Mpc}
    formula: (4 * pi / 3 * G * rho) / H**2
    expected: '0.15'
    shown: ['The ratio is about $0.15$', 'by roughly 15%']
    source: {cite: reading1, at: '"Deceleration of the scale factor" formula'}
    origin: page-own

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: energy-conserved-on-closed-solution
    kind: identity
    where: 'formula "Conserved quantity E": along the closed cycloid solution ã = α(1 − cos θ), t̃ = α(θ − sin θ) (units with (8π/3)Gρ_i = 2α), ½(dã/dt̃)² − α/ã must stay at −½ for every θ'
    formula: 0.5 * (deriv('alpha * (1 - cos(x))', 'x', th) / deriv('alpha * (x - sin(x))', 'x', th))**2 - alpha / (alpha * (1 - cos(th)))
    equals: '-0.5'
    samples: {th: [0.2, 0.7, 1.6, 3.1, 5.5, 6.1], alpha: [1, 2, 0.5, 1, 3, 1]}
    tolerance: 1e-6
    shown: ['E = \tfrac12\,\dot a^2 - \frac{4\pi}{3}\,\frac{G\rho_i}{a}']
    source: {cite: reading1, at: '"Conserved quantity E" formula'}
    origin: page-own
