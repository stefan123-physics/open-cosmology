# Calculations on content/year-4/8.286/eternal-inflation.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/eternal-inflation.mdx
calcs:
  - id: volume-after-half-life
    where: 'worked example "How fast must inflation outrun decay?", step "One half-life": 2^299 ≈ 10^90 (as a power of ten)'
    inputs: {k: 100}
    formula: (3 * k - 1) * log10(2)
    expected: '90'
    tolerance: '0.5'
    shown: ['leaving $2^{299} \approx 10^{90}$ times the starting volume']
    source: {cite: mit, at: 'Lecture 1 (eternal inflation); numbers are the page''s own'}
    origin: page-own

  - id: threshold
    where: 'worked example, step "Threshold": grows if 3k − 1 > 0, a half-life longer than one third of a doubling time'
    inputs: {}
    formula: 1 / 3
    expected: '0.333'
    shown: ['It grows if $3k - 1 > 0$: a half-life longer than one third of a doubling time']
    source: {cite: mit, at: 'Lecture 1'}
    origin: page-own
