# Calculations on content/year-4/8.286/exponential-expansion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# GUT-scale false vacuum: ρ_f ~ E⁴/(ħ³c⁵), χ = √(8πGρ_f/3).

page: content/year-4/8.286/exponential-expansion.mdx
calcs:
  - id: rho-f
    where: 'formula "False-vacuum mass density at the GUT scale"; quiz 5 explanation'
    inputs: {E: 1e16 GeV}
    formula: E**4 / (hbar**3 * c**5)
    expected: 2.3e81 g/cm**3
    shown: ['\approx 2.3\times10^{81}\ \text{g/cm}^3', '$2.3 \\times 10^{81}$ g/cm³']
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: quiz-rho-f
    where: 'quiz 5: answer "About 2 × 10^81 g/cm³"'
    inputs: {E: 1e16 GeV}
    formula: E**4 / (hbar**3 * c**5)
    expected: 2e81 g/cm**3
    shown: ['About $2 \\times 10^{81}$ g/cm³']
    quiz: 4
    source: {cite: reading1, at: 'pp. 13–14'}
    origin: mit

  - id: chi-inverse
    where: 'formula "Expansion time and Hubble length"; worked example "How many e-folds?", step "Duration"'
    inputs: {E: 1e16 GeV}
    formula: 1 / sqrt(8 * pi * G * E**4 / (hbar**3 * c**5) / 3)
    expected: 2.8e-38 s
    shown: ['\chi^{-1} \approx 2.8\times10^{-38}\ \text{s}', '$\chi^{-1} = 2.8 \times 10^{-38}$ s']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: hubble-length
    where: 'formula "Expansion time and Hubble length" (8e-28 cm); worked example (8.3e-28 cm)'
    inputs: {E: 1e16 GeV}
    formula: c / sqrt(8 * pi * G * E**4 / (hbar**3 * c**5) / 3)
    expected: 8.3e-28 cm
    shown: ['c\chi^{-1} \approx 8\times10^{-28}\ \text{cm}', '(8.3 \times 10^{-28}\ \text{cm})']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: expansion-since-end
    where: 'formula "Expansion from the end of inflation to today": 10 cm × a_now/a_end ≈ 450 × 10^9 light-years'
    inputs: {E: 1e16 GeV, T: 2.7 K, L: 10 cm}
    formula: L * E / (k_B * T)
    expected: 450e9 ly
    shown: ['\approx 450\times10^{9}\ \text{light-years}']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: growth-factor
    where: 'worked example "How many e-folds?", step "Growth factor"'
    inputs: {a: 10 cm, b: 8.3e-28 cm}
    formula: a / b
    expected: 1.2e28
    shown: ['= 1.2 \times 10^{28}$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: e-folds
    where: 'worked example, step "E-folds"'
    inputs: {a: 10 cm, b: 8.3e-28 cm}
    formula: log(a / b)
    expected: '64.7'
    shown: ['= 64.7$: about 65 e-folds']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: duration
    where: 'worked example, step "Duration"'
    inputs: {n: 65, t: 2.8e-38 s}
    formula: n * t
    expected: 1.8e-36 s
    shown: ['take $1.8 \times 10^{-36}$ s']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  # ---- formula checks (docs/CALC_TESTS_PLAN.md §6–7)
  - id: exponential-solves-friedmann
    kind: identity
    where: 'formula "Exponential expansion": a = const·e^(χt) must have ȧ/a = χ at every time (constant density, flat)'
    formula: deriv('3.7 * exp(chi * x)', 'x', t) / (3.7 * exp(chi * t))
    equals: chi
    samples: {chi: [0.5, 1, 2.5, 3], t: [0.2, 1.5, 3, 10]}
    shown: ['a(t) = \text{const}\times e^{\chi t}']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: mit

  - id: chi-units
    kind: units
    where: 'formula "Exponential expansion": χ = √(8πGρ_f/3) must be a rate (1/s), so that χt is a pure number'
    inputs: {rho_f: 2.3e81 g/cm**3, t: 1 s}
    terms: ['sqrt(8 * pi / 3 * G * rho_f)', '1 / t']
    unit: 1/s
    shown: ['\chi = \sqrt{\frac{8\pi}{3}G\rho_f}']
    source: {cite: reading1, at: 'pp. 11–12'}
    origin: mit
