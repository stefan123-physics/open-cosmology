# Calculations on content/year-4/8.286/temperature-and-decoupling.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# kT = (45 ħ³c⁵ / 16π³ g G)^(1/4) / √t for a flat radiation-dominated universe.

page: content/year-4/8.286/temperature-and-decoupling.mdx
calcs:
  - id: kT-1s-exact
    where: 'plot caption: 0.859 MeV at 1 s for g = 10¾ (the lecture rounds to 0.860)'
    inputs: {g: 10.75, t: 1 s}
    formula: (45 * hbar**3 * c**5 / (16 * pi**3 * g * G))**(1/4) / sqrt(t)
    expected: 0.859 MeV
    shown: ['which gives 0.859 MeV at 1 s for g = 10¾ (the lecture rounds to 0.860)']
    source: {cite: reading1, at: '"With g = 10¾" formula'}
    origin: page-own

  - id: kT-1s-exact-note
    where: 'bracket after formula "With g = 10¾": computed exactly, 0.859 MeV'
    inputs: {g: 10.75, t: 1 s}
    formula: (45 * hbar**3 * c**5 / (16 * pi**3 * g * G))**(1/4) / sqrt(t)
    expected: 0.859 MeV
    shown: ['[Computed exactly, the formula above gives $0.859$ MeV']
    source: {cite: reading1, at: '"With g = 10¾" formula'}
    origin: page-own

  - id: T-1s-exact-note
    where: 'bracket after formula "With g = 10¾": computed exactly, 9.97e9 K'
    inputs: {g: 10.75, t: 1 s}
    formula: (45 * hbar**3 * c**5 / (16 * pi**3 * g * G))**(1/4) / sqrt(t) / k_B
    expected: 9.97e9 K
    shown: ['and $9.97 \times 10^{9}$ K; the lecture rounds them to 0.860 MeV and $9.98 \times 10^{9}$ K']
    source: {cite: reading1, at: '"With g = 10¾" formula'}
    origin: page-own

  - id: kT-1s-lecture
    where: 'formula "With g = 10¾": kT = 0.860 MeV/√t, as the lecture prints it. The formula gives 0.8592, so the lecture rounds up; the ±0.002 MeV covers that, and kT-1s-exact checks the exact 0.859 (the page says so in a bracket after the formula and in the plot caption)'
    inputs: {g: 10.75, t: 1 s}
    formula: (45 * hbar**3 * c**5 / (16 * pi**3 * g * G))**(1/4) / sqrt(t)
    expected: 0.860 MeV
    tolerance: 0.002 MeV
    shown: ['kT = \frac{0.860\ \text{MeV}}{\sqrt{t\,[\text{s}]}}']
    source: {cite: reading1, at: '"With g = 10¾" formula'}
    origin: mit

  - id: T-1s
    where: 'formula "With g = 10¾": T = 9.98e9 K/√t; quiz 2'
    inputs: {E: 0.860 MeV}
    formula: E / k_B
    expected: 9.98e9 K
    shown: ['T = \frac{9.98 \times 10^{9}\ \text{K}}{\sqrt{t\,[\text{s}]}}', 'About $10^{10}$ K ($kT \\approx 0.86$ MeV)']
    source: {cite: reading1, at: '"With g = 10¾" formula'}
    origin: mit

  - id: t-decoupling
    where: 'formula "Time of decoupling (estimate)"; quiz 4 explanation'
    inputs: {T0: 2.7 K, Td: 3000 K, t0: 13.8e9 yr}
    formula: (T0 / Td)**(3/2) * t0
    expected: 3.7e5 yr
    shown: ['\approx 3.7 \times 10^{5}\ \text{yr}', '\\approx 3.7 \\times 10^5$ yr']
    source: {cite: reading1, at: '"Time of decoupling (estimate)" formula'}
    origin: mit

  - id: quiz-decoupling
    where: 'quiz 4: answer "About 380,000 years" (the estimate gives 3.7e5; "about" allows ±10,000)'
    inputs: {T0: 2.7 K, Td: 3000 K, t0: 13.8e9 yr}
    formula: (T0 / Td)**(3/2) * t0
    expected: 380000 yr
    tolerance: 10000 yr
    shown: ['About 380,000 years']
    quiz: 3
    source: {cite: reading1, at: '"Time of decoupling (estimate)" formula'}
    origin: mit

  - id: electron-threshold
    where: 'worked example "Milestones of the hot universe", step "(a) The electron threshold"; plot caption about 2.8 s'
    inputs: {E1: 0.860 MeV, Ee: 0.511 MeV}
    formula: (E1 / Ee)**2
    expected: '2.8'
    shown: ['$\sqrt t = 0.860/0.511$, so $t \approx 2.8$ s', 'electron rest energy at about 2.8 s']
    source: {cite: reading1, at: '"With g = 10¾" formula'}
    origin: page-own

  - id: T-equality
    where: 'worked example, step "(b) Equality"'
    inputs: {T0: 2.725 K, one_plus_z: 3246}
    formula: T0 * one_plus_z
    expected: 8850 K
    shown: ['$T = 2.725\ \text{K} \times 3{,}246 \approx 8{,}850$ K']
    source: {cite: reading1, at: 'Lecture 17 (T ∝ 1/a)'}
    origin: page-own

  - id: T-decoupling-planck
    where: 'worked example, step "(c) Decoupling"'
    inputs: {T0: 2.725 K, one_plus_z: 1091}
    formula: T0 * one_plus_z
    expected: 2970 K
    shown: ['$T_d = 2.725 \times 1{,}091 \approx 2{,}970$ K']
    source: {cite: reading1, at: 'Lecture 17'}
    origin: later-data

  - id: t-decoupling-planck
    where: 'worked example, step "(c) Decoupling"'
    inputs: {one_plus_z: 1091, t0: 13.8e9 yr}
    formula: one_plus_z**(-3/2) * t0
    expected: 383000 yr
    shown: ['\approx 383{,}000$ years']
    source: {cite: reading1, at: '"Time of decoupling (estimate)" formula'}
    origin: later-data

  # ---- formula checks added by the calculation audit (reviews/calc-audit.md)

  - id: kt-formula-units
    kind: units
    where: 'formula "Temperature of the early universe": (45ħ³c⁵/(16π³gG))^(1/4)/√t must be an energy'
    inputs: {g: 10.75, t: 1 s, E: 1 MeV}
    terms: ['(45 * hbar**3 * c**5 / (16 * pi**3 * g * G))**(1/4) / sqrt(t)', 'E']
    unit: J
    shown: ['kT = \left(\frac{45\,\hbar^3c^5}{16\pi^3\,g\,G}\right)^{1/4}\frac{1}{\sqrt t}']
    source: {cite: reading1, at: 'p. 17 (board)'}
    origin: mit
