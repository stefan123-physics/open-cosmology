# Calculations on content/year-4/8.286/age-closed-universe.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/age-closed-universe.mdx
calcs:
  - id: ht-omega-2
    where: 'worked example "A universe with twice the critical density", step "Age"; quiz 1; plot point "Ω = 2: 0.571"'
    inputs: {theta: 1.5707963268}
    formula: theta - sin(theta)
    expected: '0.571'
    shown: ['Ht = \theta - \sin\theta = \pi/2 - 1 = 0.571$', 't \\approx 0.571\\,H^{-1}$', '{ x: 2, y: 0.5708, label: "Ω = 2: 0.571" }']
    source: {cite: reading1, at: '"Ω and the development angle" formula'}
    origin: page-own

  - id: hubble-time
    where: 'worked example, step "Age": 1/H = 14.5 billion years'
    inputs: {H: 67.3 km/s/Mpc}
    formula: 1 / H
    expected: 14.5e9 yr
    shown: ['With $1/H = 14.5$ billion years']
    source: {cite: reading1, at: '"Ω and the development angle" formula'}
    origin: page-own

  - id: age-omega-2
    where: 'worked example, step "Age"'
    inputs: {H: 67.3 km/s/Mpc}
    formula: (pi / 2 - 1) / H
    expected: 8.3e9 yr
    shown: ['$t = 8.3$ billion years']
    source: {cite: reading1, at: '"Ω and the development angle" formula'}
    origin: page-own

  - id: lifetime-omega-2
    where: 'worked example, step "Lifetime": 2π/H'
    inputs: {H: 67.3 km/s/Mpc, Omega: 2}
    formula: 2 * pi * Omega / (2 * H * (Omega - 1)**(3/2))
    expected: 91e9 yr
    shown: ['= 2\pi/H = 91$ billion years']
    source: {cite: reading1, at: '"Ω and the development angle" formula'}
    origin: page-own

  - id: a-max-omega-2
    where: 'worked example, step "Maximum size"'
    inputs: {Omega: 2}
    formula: Omega / (Omega - 1)
    expected: '2'
    tolerance: '0.001'
    shown: ['a_{\max} = \Omega/(\Omega - 1) = 2$']
    source: {cite: reading1, at: '"Ω and the development angle" formula'}
    origin: page-own
