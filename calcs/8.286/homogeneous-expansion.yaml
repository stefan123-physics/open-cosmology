# Calculations on content/year-4/8.286/homogeneous-expansion.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/homogeneous-expansion.mdx
calcs:
  - id: hubble-unit
    where: 'formula "A handy conversion"'
    inputs: {}
    formula: 1 / (1e10 * yr)
    expected: 97.8 km/s/Mpc
    shown: ['= 97.8\ \frac{\text{km/s}}{\text{Mpc}}']
    source: {cite: mit, at: 'Lecture 4 (conversion used on the board)'}
    origin: mit

  - id: recession-100mpc
    where: 'worked example "Reading Hubble''s law", step "Recession velocity"'
    inputs: {H: 70 km/s/Mpc, r: 100 Mpc}
    formula: H * r
    expected: 7000 km/s
    shown: ['v = H r = 70 \times 100 = 7000$ km/s']
    source: {cite: reading1, at: 'slide 1 ("Hubble''s law")'}
    origin: page-own

  - id: recession-fraction-of-c
    where: 'worked example, step "Recession velocity": a bit over 2% of the speed of light (tested as 2.0–2.5%)'
    inputs: {H: 70 km/s/Mpc, r: 100 Mpc}
    formula: H * r / c
    expected: '0.0225'
    tolerance: '0.0025'
    shown: ['a bit over 2% of the speed of light']
    source: {cite: reading1, at: 'slide 1'}
    origin: page-own

  - id: hubble-time-70
    where: 'worked example, step "The Hubble time"; quiz 4'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 1.40e10 yr
    shown: ['= 1.40\times10^{10}$ years, about 14 billion years']
    source: {cite: mit, at: 'Lecture 4 (conversion used on the board)'}
    origin: page-own

  - id: quiz-hubble-time
    where: 'quiz 4: roughly what is 1/H for H = 70 km/s/Mpc'
    inputs: {H: 70 km/s/Mpc}
    formula: 1 / H
    expected: 14e9 yr
    shown: ['\\approx 14$ billion years']
    quiz: 3
    source: {cite: mit, at: 'Lecture 4'}
    origin: page-own

  - id: observers-b
    where: 'worked example "Changing observers", step "Seen from A"'
    inputs: {H: 70 km/s/Mpc, r: 10 Mpc}
    formula: H * r
    expected: 700 km/s
    shown: ['B recedes at $70 \times 10 = 700$ km/s']
    source: {cite: reading1, at: 'slide 1'}
    origin: page-own

  - id: observers-c-from-b
    where: 'worked example "Changing observers", step "Change to B''s frame"'
    inputs: {H: 70 km/s/Mpc, rC: 20 Mpc, rB: 10 Mpc}
    formula: H * rC - H * rB
    expected: 700 km/s
    shown: ['C moves at $1400 - 700 = +700$ km/s']
    source: {cite: reading1, at: 'slide 1'}
    origin: page-own

  - id: hubble-1929-slope
    where: 'plot caption: Hubble''s original slope about seven times too steep'
    inputs: {H_1929: 500 km/s/Mpc, H: 70 km/s/Mpc}
    formula: H_1929 / H
    expected: '7'
    shown: ['about seven times too steep']
    source: {cite: reading1, at: 'slide 1'}
    origin: page-own
