# Formula checks on content/year-4/8.286/sphere-metrics.mdx (docs/CALC_TESTS_PLAN.md §6).
# kind: limit   , formula must approach `limit` as the variable in `vary` runs through its values
# kind: identity, formula and `equals` must agree at every sample point

page: content/year-4/8.286/sphere-metrics.mdx
calcs:
  - id: circle-flat-limit
    kind: limit
    where: 'worked example "Circles on a sphere": circumference 2πR sin(r/R) must become the flat 2πr when the sphere is huge'
    inputs: {r: 1.3}
    formula: 2 * pi * R * sin(r / R)
    limit: 2 * pi * r
    vary: {R: [10, 100, 1000, 10000]}
    tolerance: 1e-7
    shown: ['circumference is $2\pi R\sin(r/R)$']
    source: {cite: reading1, at: 'Lecture 11 (metric of a 2-sphere)'}
    origin: page-own

  - id: circle-equator
    kind: identity
    where: 'worked example, step "The equator": at r = πR/2 the circumference is 2πR'
    formula: 2 * pi * R * sin(r / R)
    equals: 2 * pi * R
    samples: {R: [1, 2.5, 7], r: [1.5707963267948966, 3.9269908169872414, 10.995574287564276]}
    shown: ['circumference is $2\pi R$']
    source: {cite: reading1, at: 'Lecture 11'}
    origin: page-own

  - id: u-coordinate-metric
    kind: identity
    where: 'formula "The u coordinate": with u = sin ψ, du²/(1 − u²) must equal dψ² (checked as (du/dψ)²/(1 − u²) = 1)'
    formula: deriv('sin(p)', 'p', psi)**2 / (1 - sin(psi)**2)
    equals: '1'
    samples: {psi: [0.01, 0.3, 1.0, 1.4, 1.55]}
    tolerance: 1e-6
    shown: ['\frac{du^2}{1 - u^2}', 'du = \cos\psi\,d\psi = \sqrt{1-u^2}\,d\psi']
    source: {cite: reading1, at: 'Lecture 11 ("The u coordinate")'}
    origin: mit
