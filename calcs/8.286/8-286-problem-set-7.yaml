# Calculations on content/year-4/8.286/8-286-problem-set-7.mdx (format: see calcs/8.286/age-of-the-universe.yaml).
# `answer:` ties an entry to an <Answer id="…"> box on the page (docs/PROBLEM-SETS-DESIGN.md §8).
# MIT publishes no solutions for this set, so the answers are checked here by independent routes:
# the factor 7/8 by numerical integration of the Fermi and Bose spectra, the entropy steps by solving
# g (aT)³ = constant numerically, and the redshifted spectrum against the Planck formula at sampled points.

page: content/year-4/8.286/8-286-problem-set-7.mdx
calcs:
  # ---- quoted facts

  - id: total-points
    kind: fact
    where: 'introduction: MIT''s total for the set'
    shown: ['The set has 65 points.']
    source: {cite: mit, at: 'p. 4'}
    origin: mit

  - id: electron-rest-energy
    kind: fact
    where: 'Problems 1 and 2: the rest energy of the electron'
    shown: ['$m_ec^2 = 0.511$ MeV', 'against 0.511 MeV for the electron']
    source: {cite: mit, at: 'Problem 1, p. 1, and Problem 2, p. 2'}
    origin: mit

  - id: muon-rest-energy
    kind: fact
    where: 'Problem 2: the rest energy of the muon'
    shown: ['Its rest energy is 106 MeV']
    source: {cite: mit, at: 'Problem 2, p. 2'}
    origin: mit

  - id: nucleon-rest-energy
    kind: fact
    where: 'Problem 2(b), solution: protons and neutrons are far above kT (Guth: "the proton weighs 938 MeV"; the neutron is 939.6 MeV)'
    shown: ['their rest energy is close to 1,000 MeV']
    source: {cite: reading1, at: 'p. 29'}
    origin: mit

  # ---- the factor 7/8, by numerical integration

  - id: fermion-factor
    where: 'section "What you need from the lessons": the factor 7/8 of a fermion, as the ratio of the Fermi and Bose energy integrals'
    formula: integrate('x**3 / (exp(x) + 1)', 'x', 0, 200) / integrate('x**3 / (exp(x) - 1)', 'x', 0, 200)
    expected: '0.875'
    shown: ['g = \frac78 \times (\text{number of species})']
    source: {cite: reading2, at: 'pp. 8–10 (board)'}
    origin: page-own

  # ---- Problem 1

  - id: p1-g-photons-pairs
    answer: p1-a
    where: 'Problem 1(a), answer box: g of photons and electron–positron pairs'
    formula: 2 + (7/8) * 1 * 2 * 2
    expected: '5.5'
    shown: ['= 2 + \frac72 = \frac{11}{2}']
    source: {cite: mit, at: 'Problem 1 (our own solution)'}
    origin: page-own

  - id: p1-g-check
    where: 'Problem 1(a), check: 10¾ minus the neutrinos'' 21/4'
    formula: 10.75 - 21/4
    expected: '5.5'
    shown: ['Taking away the neutrinos'' $\frac{21}{4}$ leaves $\frac{11}{2}$.']
    source: {cite: reading2, at: 'pp. 10–11 (board)'}
    origin: page-own

  # Entropy conservation solved numerically for the ratio x = (aT)_after/(aT)_before.
  - id: p1-photon-heating
    where: 'Problem 1(b): the factor by which aT_γ grows, from solving (11/2) = 2 x³'
    formula: solve('2 * x**3 - 11/2', 'x', 1, 2)
    expected: '1.401'
    shown: ['$(11/4)^{1/3} = 1.401$']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: page-own

  - id: p1-photon-heating-percent
    where: 'Problem 1(b), check: aT_γ rises by 40%'
    formula: ((11/4)**(1/3) - 1) * 100
    expected: '40'
    shown: ['$aT_\gamma$ rises by 40% in all']
    source: {cite: mit, at: 'Problem 1 (our own numbers)'}
    origin: page-own

  - id: p1-ratio
    where: 'Problem 1(c): T_ν / T_γ'
    formula: 1 / solve('2 * x**3 - 11/2', 'x', 1, 2)
    expected: '0.714'
    shown: ['\left(\frac{4}{11}\right)^{1/3} = 0.714']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: page-own

  - id: p1-neutrino-temperature
    answer: p1-c
    where: 'Problem 1(c), answer box: the neutrino temperature today for T_γ = 2.725 K'
    inputs: {Tg: 2.725}
    formula: (4/11)**(1/3) * Tg
    expected: '1.95'
    shown: ['$T_\nu = 0.714 \times 2.725$ K $= 1.95$ K.']
    source: {cite: mit, at: 'Problem 1 (2.725 K is the value of the lessons; MIT''s set says 2.7 K)'}
    origin: page-own

  - id: p1-neutrino-temperature-rounded
    where: 'Problem 1(c), solution: the neutrino temperature with MIT''s rounded 2.7 K'
    inputs: {Tg: 2.7}
    formula: (4/11)**(1/3) * Tg
    expected: '1.93'
    shown: ['With MIT''s rounded 2.7 K you would get 1.93 K.']
    source: {cite: mit, at: 'Problem 1, p. 1'}
    origin: page-own

  # ---- Problem 2

  - id: p2-g-muons
    answer: p2-a
    where: 'Problem 2(a), answer box: g of muons and antimuons'
    formula: (7/8) * 1 * 2 * 2
    expected: '3.5'
    shown: ['g = \frac78 \times 1 \times 2 \times 2 = \frac72']
    source: {cite: mit, at: 'Problem 2(a) (our own solution)'}
    origin: page-own

  - id: p2-g-photons
    answer: p2-b-photons
    where: 'Problem 2(b), answer box: g of the photons (two polarisations)'
    formula: 1 * 2
    expected: '2'
    shown: ['g_\gamma = 2']
    source: {cite: reading2, at: 'pp. 8–10 (board)'}
    origin: page-own

  - id: p2-g-neutrinos
    answer: p2-b-neutrinos
    where: 'Problem 2(b), answer box: g of the neutrinos'
    formula: (7/8) * 3 * 2 * 1
    expected: '5.25'
    shown: ['g_\nu = \frac78 \times 3 \times 2 \times 1 = \frac{21}{4}']
    source: {cite: reading2, at: 'pp. 8–10 (board)'}
    origin: page-own

  - id: p2-g-electrons
    answer: p2-b-electrons
    where: 'Problem 2(b), answer box: g of electrons and positrons'
    formula: (7/8) * 1 * 2 * 2
    expected: '3.5'
    shown: ['g_{e^\pm} = \frac78 \times 1 \times 2 \times 2 = \frac72']
    source: {cite: reading2, at: 'pp. 8–10 (board)'}
    origin: page-own

  - id: p2-g-without-muons
    where: 'Problem 2(b), check: total g without the muons'
    formula: 2 + 5.25 + 3.5
    expected: '10.75'
    shown: ['$2 + 5.25 + 3.5 = 10.75$']
    source: {cite: reading2, at: 'pp. 10–11 (board)'}
    origin: page-own

  - id: p2-g-with-muons
    where: 'Problem 2(b) and (c): total g with the muons'
    formula: 10.75 + 3.5
    expected: '14.25'
    shown: ['With the muons, $g = 14.25$.', '$g = 10.75 + 3.5 = 14.25 = \frac{57}{4}$']
    source: {cite: mit, at: 'Problem 2 (our own solution)'}
    origin: page-own

  - id: p2-kt-over-electron
    where: 'Problem 2(b), solution: kT = 106 MeV against the electron''s 0.511 MeV'
    formula: 106 / 0.511
    expected: '207'
    tolerance: 8
    shown: ['is about 200 times below $kT$']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  # Entropy conservation solved numerically: 14.25 = 10.75 x³.
  - id: p2-at-factor
    answer: p2-c
    where: 'Problem 2(c), answer box: the factor by which aT grows when the muons disappear'
    formula: solve('10.75 * x**3 - 14.25', 'x', 1, 2)
    expected: '1.099'
    shown: ['\left(\frac{57}{43}\right)^{1/3} = 1.099']
    source: {cite: mit, at: 'Problem 2(c) (our own solution)'}
    origin: page-own

  - id: p2-entropy-share-pairs
    where: 'Problem 2(c), check: the pairs'' share of the entropy of photons and pairs, 7/11'
    formula: 3.5 / 5.5 - 7/11
    expected: '0'
    tolerance: 1e-12
    shown: ['the pairs carried $\frac{7}{11}$ of the entropy']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  - id: p2-entropy-share-muons
    where: 'Problem 2(c), check: the muons'' share of the entropy, 14/57 = 0.246, about a quarter'
    formula: 3.5 / 14.25
    expected: '0.25'
    tolerance: 0.01
    shown: ['the muons carry only $\frac{14}{57}$, about a quarter']
    source: {cite: mit, at: 'Problem 2 (our own numbers)'}
    origin: page-own

  # ---- Problem 3

  # The frequency against the stretched wavelength: λ₂ = λ₁ a₂/a₁, ν = c/λ.
  - id: p3-frequency
    kind: identity
    answer: p3-a-nu
    where: 'Problem 3(a), answer box and formula "The redshifted frequency": against c divided by the stretched wavelength'
    formula: nu1 * a1 / a2
    equals: c / ((c / nu1) * (a2 / a1))
    samples:
      nu1: [1, 5, 160.2e9, 2.3]
      a1: [0.2, 1, 0.00091, 0.7]
      a2: [1.5, 4, 1, 2.9]
      c: [1, 3, 299792458, 2]
    tolerance: 1e-12
    shown: ['\nu_2 = \frac{a(t_1)}{a(t_2)}\,\nu_1']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  # The width of the band as the difference of its two redshifted edges.
  - id: p3-band-width
    kind: identity
    answer: p3-a-dnu
    where: 'Problem 3(a), answer box and formula "The width of the redshifted band": against the difference of the two redshifted edges'
    formula: dnu1 * a1 / a2
    equals: c / ((c / (nu1 + dnu1)) * (a2 / a1)) - c / ((c / nu1) * (a2 / a1))
    samples:
      dnu1: [0.01, 0.1, 0.5, 0.03]
      nu1: [1, 5, 160.2, 2.3]
      a1: [0.2, 1, 0.00091, 0.7]
      a2: [1.5, 4, 1, 2.9]
      c: [1, 3, 299792.458, 2]
    tolerance: 1e-9
    shown: ['d\nu_2 = \frac{a(t_1)}{a(t_2)}\,d\nu_1']
    source: {cite: mit, at: 'Problem 3(a) (our own solution)'}
    origin: page-own

  # The result of part (c): the diluted, redshifted spectrum equals the Planck formula at T₁ a₁/a₂.
  - id: p3-black-body-again
    kind: identity
    where: 'Problem 3(c), formula "A black-body spectrum again": (a₁/a₂)³ u_ν(ν₁, T₁) with ν₁ = ν₂ a₂/a₁ against u_ν(ν₂, T₁ a₁/a₂)'
    formula: (a1/a2)**3 * 16*pi**2*hb*(nu2*a2/a1)**3 / c**3 / (exp(2*pi*hb*(nu2*a2/a1)/(k*T1)) - 1)
    equals: 16*pi**2*hb*nu2**3 / c**3 / (exp(2*pi*hb*nu2/(k*T1*a1/a2)) - 1)
    samples:
      nu2: [1, 0.3, 4, 2.5]
      a1: [0.2, 1, 0.5, 0.7]
      a2: [1.5, 4, 1, 2.9]
      T1: [1, 3, 10, 0.4]
      hb: [1, 0.5, 0.2, 1.3]
      k: [1, 2, 0.7, 1.1]
      c: [1, 3, 2, 0.6]
    tolerance: 1e-10
    shown: ['= u_\nu\big(\nu_2, T(t_2)\big)']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own

  # Check of part (c): the spectrum integrated over frequency falls as 1/a⁴ (units with ħ = c = k = 1).
  - id: p3-energy-density-dilution
    kind: identity
    where: 'Problem 3(c), check: the total energy density of the redshifted spectrum falls as 1/a⁴'
    formula: integrate('16*pi**2*x**3 / (exp(2*pi*x/(T1*a1/a2)) - 1)', 'x', 0, 8*T1*a1/a2)
    equals: (a1/a2)**4 * integrate('16*pi**2*x**3 / (exp(2*pi*x/T1) - 1)', 'x', 0, 8*T1)
    samples:
      a1: [0.2, 1, 0.5, 0.7]
      a2: [1.5, 4, 1, 2.9]
      T1: [1, 3, 5, 0.4]
    tolerance: 1e-6
    shown: ['it falls as $1/a^4$']
    source: {cite: mit, at: 'Problem 3(c) (our own solution)'}
    origin: page-own
