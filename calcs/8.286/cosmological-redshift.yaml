page: content/year-4/8.286/cosmological-redshift.mdx
calcs:
  - id: quasar-1pz
    where: 'worked example "Reading the expansion from a spectrum", step "Redshift"'
    inputs: {lam_S: 121.6 nm, lam_O: 364.8 nm}
    formula: lam_O / lam_S
    expected: '3.0'
    shown: ['1 + z = 364.8/121.6 = 3.0$, so $z = 2.0$']
    source: {cite: reading1, at: '"Cosmological redshift" formula'}
    origin: page-own

  - id: lyman-alpha-at-z3
    where: 'worked example, step "Expansion": at z = 3 it would arrive at 486 nm'
    inputs: {lam_S: 121.6 nm, z: 3}
    formula: lam_S * (1 + z)
    expected: 486 nm
    shown: ['at $z = 3$ it would arrive as blue light at 486 nm']
    source: {cite: reading1, at: '"Wavelength follows the scale factor" formula'}
    origin: page-own
