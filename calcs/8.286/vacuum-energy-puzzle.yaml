# Calculations on content/year-4/8.286/vacuum-energy-puzzle.mdx (format: see calcs/8.286/age-of-the-universe.yaml).

page: content/year-4/8.286/vacuum-energy-puzzle.mdx
calcs:
  - id: planck-length
    where: 'formula "Planck length"; worked example "Checking the 120 orders of magnitude", step "Planck length"'
    inputs: {}
    formula: sqrt(hbar * G / c**3)
    expected: 1.616e-35 m
    shown: ['$\ell_P = \sqrt{\hbar G/c^3} = 1.616 \times 10^{-35}$ m', '\approx 1.6 \times 10^{-33}\ \text{cm}']
    source: {cite: reading1, at: 'p. 14'}
    origin: mit

  - id: k-max
    where: 'worked example, step "Planck length"'
    inputs: {}
    formula: 1 / sqrt(hbar * G / c**3)
    expected: 6.19e34 1/m
    shown: ['$k_\text{max} = 6.19 \times 10^{34}$ m⁻¹']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: zero-point-density
    where: 'worked example, step "Zero-point energy density"'
    inputs: {}
    formula: hbar * c * (1 / sqrt(hbar * G / c**3))**4 / (8 * pi**2)
    expected: 5.9e111 J/m**3
    shown: ['= 5.9 \times 10^{111}$ J/m³']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: rho-c
    where: 'worked example, step "Observed value"'
    inputs: {H0: 67.7 km/s/Mpc}
    formula: 3 * H0**2 / (8 * pi * G)
    expected: 8.61e-27 kg/m**3
    shown: ['= 8.61 \times 10^{-27}$ kg/m³']
    source: {cite: reading1, at: 'p. 14'}
    origin: later-data

  - id: u-vac
    where: 'worked example, step "Observed value"'
    inputs: {H0: 67.7 km/s/Mpc}
    formula: 0.69 * 3 * H0**2 / (8 * pi * G) * c**2
    expected: 5.3e-10 J/m**3
    shown: ['= 0.69\,\rho_c c^2 = 5.3 \times 10^{-10}$ J/m³']
    source: {cite: reading1, at: 'p. 14'}
    origin: later-data

  - id: mismatch
    where: 'worked example, step "Ratio": 1.1e121, about 121 orders of magnitude'
    inputs: {H0: 67.7 km/s/Mpc}
    formula: (hbar * c * (1 / sqrt(hbar * G / c**3))**4 / (8 * pi**2)) / (0.69 * 3 * H0**2 / (8 * pi * G) * c**2)
    expected: 1.1e121
    shown: ['$u/u_\text{vac} = 1.1 \times 10^{121}$']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own

  - id: mismatch-2pi
    where: 'worked example, step "Ratio": a 2π/ℓ_P cut-off gives about 10^124'
    inputs: {H0: 67.7 km/s/Mpc}
    formula: log10((hbar * c * (2 * pi / sqrt(hbar * G / c**3))**4 / (8 * pi**2)) / (0.69 * 3 * H0**2 / (8 * pi * G) * c**2))
    expected: '124'
    shown: ['(using $2\pi/\ell_P$ instead gives about $10^{124}$)']
    source: {cite: reading1, at: 'p. 14'}
    origin: page-own
